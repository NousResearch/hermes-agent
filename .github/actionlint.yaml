# actionlint knows only GitHub-hosted runner labels. This org runs
# self-hosted runners only (no paid larger-runner tiers), so the pool's
# labels are declared here. Anything else reading as "unknown runner
# label" — including hosted labels like ubuntu-latest — is a real finding:
# it means a workflow drifted back onto GitHub-hosted runners.
self-hosted-runner:
  labels:
    - self-hosted
    - infra
    - autonomy
