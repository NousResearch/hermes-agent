name: Build Termux aarch64 .deb
description: Shared payload staging, builder-image setup, wheelhouse build, and .deb assembly for Termux release and commit legs.
inputs:
  build-mode:
    description: release (tag or stable candidate) or commit (commit claim or legacy commit build).
    required: true
  save-caches:
    description: Save payload and wheelhouse caches. Must be false for untrusted commit/channel builds.
    default: 'false'
  push-builder-image:
    description: Push a newly built derived builder image to GHCR. Must be false for untrusted commit builds.
    default: 'false'
  github-token:
    description: Repository GITHUB_TOKEN for GHCR push when push-builder-image is true. Omit on commit legs.
    default: ''
runs:
  using: composite
  steps:
    - name: Read the termux-docker digest pin
      id: pins
      shell: bash
      # The digest is pinned in pm/lock.json (the termux-docker package)
      # beside every other third-party pin; the build scripts re-read it
      # themselves. This step surfaces the effective pin in the run log
      # and fails fast if the lock row is missing.
      run: |
        echo "digest=$(python3 -c 'import sys; sys.path.insert(0, "."); from pm.lock import termux_docker_digest; print(termux_docker_digest())')" >> "$GITHUB_OUTPUT"

    - name: Restore the CPython + node + uv payload builds
      # Restore/save are split: the save runs right after staging so a later
      # phase's failure cannot throw away 20+ minutes of builds. The exact key
      # is content-only on pm/lock.json + the stagers; the prefix rescues the
      # previous pin's builds when the lock moved.
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          termux-build/payload/python
          termux-build/payload/node
          termux-build/payload/uv
          termux-build/payload/npm
          termux-build/payload/ffmpeg
          termux-build/payload/ripgrep
          termux-build/payload/runtime-libs
        key: termux-payload-${{ hashFiles('pm/lock.json', 'scripts/termux/build_cpython.sh', 'scripts/termux/build_node.sh', 'scripts/termux/build_uv.sh', 'scripts/termux/runtime_libs.json', 'scripts/termux/stage_runtime_libs.py') }}
        restore-keys: |
          termux-payload-

    - name: Build CPython into the payload
      shell: bash
      run: bash scripts/termux/build_cpython.sh termux-build/payload

    - name: Build node into the payload
      shell: bash
      run: bash scripts/termux/build_node.sh termux-build/payload

    - name: Stage the runtime libs into the payload
      shell: bash
      # The payload interpreters' runtime libs (python's C-extension deps,
      # node's, uv's zstd) ship INSIDE the sealed deb: the device's termux
      # tree may have none of them installed. Pin table derived from the
      # suppliers' own Depends metadata (see runtime_libs.json).
      run: python3 scripts/termux/stage_runtime_libs.py termux-build/payload

    - name: Stage uv into the payload
      shell: bash
      # The wheelhouse resolver + runtime lazy-install tool: pm stages
      # the bionic uv .deb beside python/node (no PATH install; the
      # payload env composition exposes it, desktop payload model).
      run: bash scripts/termux/build_uv.sh termux-build/payload

    - name: Stage the remaining CLI runtime tools
      shell: bash
      run: |
        for tool in npm ffmpeg ripgrep; do
          bash scripts/termux/termux_pkg_build.sh "$tool" "$tool" termux-build/payload
        done

    - name: Save the payload builds
      # Save even if a downstream wheelhouse/deb phase fails, except on cancellation.
      # Untrusted commit/channel legs always pass save-caches: false.
      if: ${{ !cancelled() && (success() || failure()) && inputs.save-caches == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          termux-build/payload/python
          termux-build/payload/node
          termux-build/payload/uv
          termux-build/payload/npm
          termux-build/payload/ffmpeg
          termux-build/payload/ripgrep
          termux-build/payload/runtime-libs
        key: termux-payload-${{ hashFiles('pm/lock.json', 'scripts/termux/build_cpython.sh', 'scripts/termux/build_node.sh', 'scripts/termux/build_uv.sh', 'scripts/termux/runtime_libs.json', 'scripts/termux/stage_runtime_libs.py') }}

    - name: Ensure the derived builder image (toolchain pre-baked)
      id: builder_image_push
      if: ${{ inputs.push-builder-image == 'true' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
      run: |
        mkdir -p termux-build
        bash scripts/termux/build_builder_image.sh | tee termux-build/.builder-image.log
        img="$(tail -n1 termux-build/.builder-image.log)"
        echo "builder image: $img"
        echo "image=$img" >> "$GITHUB_OUTPUT"

    - name: Ensure the derived builder image (toolchain pre-baked, no push)
      id: builder_image_local
      if: ${{ inputs.push-builder-image != 'true' }}
      shell: bash
      env:
        GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        TERMUX_BUILDER_NO_PUSH: '1'
      run: |
        mkdir -p termux-build
        if grep -q 'TERMUX_BUILDER_NO_PUSH' scripts/termux/build_builder_image.sh 2>/dev/null; then
          bash scripts/termux/build_builder_image.sh --no-push | tee termux-build/.builder-image.log
        else
          # Pre-PR commit checkout: reuse a published GHCR image if present,
          # otherwise fall back to the checkout's digest-pinned base image
          # (which termux_build.sh pulls, inspects for RepoDigests, and provisions).
          digest="$(python3 -c 'import sys; sys.path.insert(0, "."); from pm.lock import termux_docker_digest; print(termux_docker_digest())')"
          base="termux/termux-docker@${digest}"
          dockerfile="scripts/termux/termux-builder.Dockerfile"
          short="$(python3 -c 'import hashlib, pathlib, sys; print(hashlib.sha256(sys.argv[1].encode() + b"\0" + pathlib.Path(sys.argv[2]).read_bytes()).hexdigest()[:12])' "$base" "$dockerfile")"
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          published="ghcr.io/${owner}/hermes-termux-builder:${short}"
          if docker manifest inspect "$published" >/dev/null 2>&1; then
            printf 'builder image already published: %s\n%s\n' "$published" "$published" | tee termux-build/.builder-image.log
          else
            printf 'builder image not published (push disabled); falling back to base: %s\n%s\n' "$base" "$base" | tee termux-build/.builder-image.log
          fi
        fi
        img="$(tail -n1 termux-build/.builder-image.log)"
        echo "builder image: $img"
        echo "image=$img" >> "$GITHUB_OUTPUT"

    - name: Restore the wheelhouse
      # Reuse manufactured wheels only when the complete input identity
      # and wheel hashes pass admission. A prefix hit alone is not proof.
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          termux-build/payload/wheelhouse
          termux-build/payload/index.json
          termux-build/payload/SHA256SUMS
          termux-build/payload/.work/resolved.txt
          termux-build/payload/.work/build_set.txt
        key: termux-wheelhouse-${{ hashFiles('uv.lock', 'pyproject.toml', 'pm/lock.json', 'scripts/termux/runtime_libs.json', 'scripts/termux/build_config.sh', 'scripts/termux/build_wheels.py', 'scripts/termux/termux_build.sh', 'scripts/termux/retag_wheel.py', 'scripts/termux/python_linkage.py', 'scripts/termux/wheelhouse_cache.py', 'scripts/termux/build_environment.py', 'pm/environment.py', 'pm/build_operations.py', 'pm/operations.py', 'pm/pyproject.toml', 'pm/uv.lock', 'scripts/termux/termux-builder.Dockerfile') }}
        restore-keys: |
          termux-wheelhouse-

    - name: Build the wheelhouse
      shell: bash
      env:
        TERMUX_BUILD_MODE: ${{ inputs.build-mode }}
        TERMUX_BUILDER_IMAGE: ${{ steps.builder_image_push.outputs.image || steps.builder_image_local.outputs.image }}
      run: |
        if [ "$TERMUX_BUILD_MODE" = commit ]; then
          if [ -n "${HERMES_RELEASE_COMMIT:-}" ] && [ "${LEGACY_COMMIT_BUILD:-false}" != true ]; then
            bash scripts/termux/termux_build.sh \
              --repo . \
              --tag "$HERMES_PAYLOAD_TAG" \
              --release-commit "$HERMES_RELEASE_COMMIT" \
              --out termux-build/payload
          else
            bash scripts/termux/termux_build.sh \
              --repo . \
              --commit "$HERMES_BUILD_COMMIT" \
              --out termux-build/payload
          fi
        elif [ -n "${HERMES_RELEASE_COMMIT:-}" ]; then
          bash scripts/termux/termux_build.sh \
            --repo . \
            --tag "$HERMES_PAYLOAD_TAG" \
            --release-commit "$HERMES_RELEASE_COMMIT" \
            --out termux-build/payload
        else
          bash scripts/termux/termux_build.sh \
            --repo . \
            --tag "$HERMES_PAYLOAD_TAG" \
            --out termux-build/payload
        fi

    - name: Save the wheelhouse
      # Only proven wheels enter the cache. Untrusted legs pass save-caches: false.
      if: ${{ inputs.save-caches == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          termux-build/payload/wheelhouse
          termux-build/payload/index.json
          termux-build/payload/SHA256SUMS
          termux-build/payload/.work/resolved.txt
          termux-build/payload/.work/build_set.txt
        key: termux-wheelhouse-${{ hashFiles('uv.lock', 'pyproject.toml', 'pm/lock.json', 'scripts/termux/runtime_libs.json', 'scripts/termux/build_config.sh', 'scripts/termux/build_wheels.py', 'scripts/termux/termux_build.sh', 'scripts/termux/retag_wheel.py', 'scripts/termux/python_linkage.py', 'scripts/termux/wheelhouse_cache.py', 'scripts/termux/build_environment.py', 'pm/environment.py', 'pm/build_operations.py', 'pm/operations.py', 'pm/pyproject.toml', 'pm/uv.lock', 'scripts/termux/termux-builder.Dockerfile') }}

    - name: Assemble the .deb
      shell: bash
      env:
        TERMUX_BUILD_MODE: ${{ inputs.build-mode }}
        TERMUX_BUILDER_IMAGE: ${{ steps.builder_image_push.outputs.image || steps.builder_image_local.outputs.image }}
      run: |
        if [ "$TERMUX_BUILD_MODE" = commit ]; then
          if [ -n "${HERMES_RELEASE_COMMIT:-}" ] && [ "${LEGACY_COMMIT_BUILD:-false}" != true ]; then
            python3 scripts/termux/build.py \
              --repo . \
              --tag "$HERMES_PAYLOAD_TAG" \
              --release-commit "$HERMES_RELEASE_COMMIT" \
              --payload termux-build/payload \
              --out termux-build/deb
          else
            python3 scripts/termux/build.py \
              --repo . \
              --commit "$HERMES_BUILD_COMMIT" \
              --payload termux-build/payload \
              --out termux-build/deb
          fi
        elif [ -n "${HERMES_RELEASE_COMMIT:-}" ]; then
          python3 scripts/termux/build.py \
            --repo . \
            --tag "$HERMES_PAYLOAD_TAG" \
            --release-commit "$HERMES_RELEASE_COMMIT" \
            --payload termux-build/payload \
            --out termux-build/deb
        else
          python3 scripts/termux/build.py \
            --repo . \
            --tag "$HERMES_PAYLOAD_TAG" \
            --payload termux-build/payload \
            --out termux-build/deb
        fi
