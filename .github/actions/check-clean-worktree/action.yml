name: Check the checkout is clean
description: >-
  Fail (or warn) when the job left tracked changes or untracked, non-ignored
  files in the checkout. Tests and CI steps must write under their own temp
  dirs (pytest's tmp_path, the HERMES_HOME fixture, $RUNNER_TEMP), not into the
  repo: stray files from test runs have reached main more than once. Run it as
  the last step of a job, after the checkout exists, with no `if:` (the default
  success() keeps it off jobs where an earlier step failed and may have left its
  own temp files):

    - name: Check the checkout is clean
      uses: ./.github/actions/check-clean-worktree

inputs:
  # MASTER SWITCH. This default is the one place the gate's mode is set: callers
  # never pass `mode` (tests/ci/test_clean_worktree_check.py enforces that), so
  # flipping it here changes every job at once without touching the step below.
  #   blocking  print the files and fail the job
  #   warning   print the files as warnings; the job stays green
  #   off       skip the check
  # Any other value fails closed (blocking).
  mode:
    description: 'blocking, warning or off. Set only here; callers do not pass it.'
    default: warning

runs:
  using: composite
  steps:
    - name: git status --porcelain=v1 --untracked-files=normal
      shell: bash
      env:
        _MODE: ${{ inputs.mode }}
      run: |
        set -uo pipefail
        case "$_MODE" in
          off) echo "check-clean-worktree: mode=off, skipped"; exit 0 ;;
          warning) level=warning ;;
          *) level=error ;;
        esac
        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "::$level title=Dirty checkout::no git checkout in $PWD; the clean-worktree check needs actions/checkout to have run"
          [ "$level" = warning ] && exit 0 || exit 1
        fi
        status="$(git status --porcelain=v1 --untracked-files=normal)" || {
          echo "::$level title=Dirty checkout::git status failed"
          [ "$level" = warning ] && exit 0 || exit 1
        }
        if [ -z "$status" ]; then
          echo "check-clean-worktree: clean (mode=$_MODE)"
          exit 0
        fi
        count="$(wc -l <<< "$status" | tr -d ' ')"
        echo "::group::git status --porcelain=v1 --untracked-files=normal ($count entries)"
        printf '%s\n' "$status"
        echo "::endgroup::"
        if ! git diff --quiet; then
          echo "::group::git diff --stat (tracked files this job modified)"
          git diff --stat
          echo "::endgroup::"
        fi
        # GitHub keeps at most 10 annotations of a level per step: name the
        # first 9 files, then one summary line pointing at the full list.
        # Here-strings, not `printf | head`: under the runner's -eo pipefail a
        # writer killed by SIGPIPE when head exits early would end the step.
        while IFS= read -r line; do
          path="${line:3}"
          case "${line:0:2}" in
            '??') what="untracked file left in the checkout" ;;
            *) what="tracked file changed (git status ${line:0:2})" ;;
          esac
          echo "::$level title=Dirty checkout::$path: $what"
        done <<< "$(sed -n '1,9p' <<< "$status")"
        echo "::$level title=Dirty checkout::this job left $count changed or untracked path(s) in the checkout (full list in the log above). Tests must write under tmp_path / the HERMES_HOME fixture and CI steps under \$RUNNER_TEMP; a genuine build artifact gets a precise .gitignore entry. Reproduce: run the job's command, then git status --porcelain=v1 --untracked-files=normal."
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### Dirty checkout ($count paths, mode=$_MODE)"
            echo '```'
            sed -n '1,200p' <<< "$status"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        [ "$level" = warning ] && exit 0 || exit 1
