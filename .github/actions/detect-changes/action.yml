name: Detect affected areas
description: >-
  Classify a PR's changed files into CI work lanes (python, frontend, site,
  scan, deps) so the orchestrator can conditionally call only
  the sub-workflows a PR can affect. Outputs are always "true" on push/dispatch
  events and fail open (everything "true") when the diff cannot be computed.

inputs:
  github-token:
    description: Token for the GitHub API (gh CLI). Pass steps.app-token.outputs.token from the calling workflow.
    required: false
    default: ${{ github.token }}

outputs:
  python:
    description: Run Python tests / ruff / ty / windows-footguns.
    value: ${{ steps.classify.outputs.python }}
  python_prod:
    description: Python changes outside tests/.
    value: ${{ steps.classify.outputs.python_prod }}
  frontend:
    description: Run the TypeScript testing matrix + desktop build.
    value: ${{ steps.classify.outputs.frontend }}
  docker_meta:
    description: Docker setup and meta files have changed.
    value: ${{ steps.classify.outputs.docker_meta }}
  docker:
    description: Build and test the Docker image (docker meta, dependency manifests, PM, tests/docker).
    value: ${{ steps.classify.outputs.docker }}
  nix:
    description: Run `nix flake check` (flake files and dependency manifests).
    value: ${{ steps.classify.outputs.nix }}
  e2e:
    description: Run the Python end-to-end suites (tests/e2e, except upgrade).
    value: ${{ steps.classify.outputs.e2e }}
  e2e_upgrade:
    description: Run the N-1 to HEAD `hermes update` suites (tests/e2e/core/upgrade).
    value: ${{ steps.classify.outputs.e2e_upgrade }}
  e2e_desktop_core:
    description: Run the Desktop core Electron suite (apps/desktop/e2e/core).
    value: ${{ steps.classify.outputs.e2e_desktop_core }}
  e2e_desktop_update:
    description: Run the Desktop install/update Electron suite (apps/desktop/e2e/update).
    value: ${{ steps.classify.outputs.e2e_desktop_update }}
  site:
    description: Build the Docusaurus docs site.
    value: ${{ steps.classify.outputs.site }}
  scan:
    description: Run the supply-chain critical-pattern scanner.
    value: ${{ steps.classify.outputs.scan }}
  deps:
    description: Check pyproject.toml dependency upper bounds.
    value: ${{ steps.classify.outputs.deps }}
  uv_lock:
    description: Run the PM project-lock check (pyproject.toml / uv.lock changes only).
    value: ${{ steps.classify.outputs.uv_lock }}
  npm_lock:
    description: Post/update the semantic package-lock.json diff PR comment.
    value: ${{ steps.classify.outputs.npm_lock }}
  installer:
    description: Run the PowerShell installer tests on a Windows runner.
    value: ${{ steps.classify.outputs.installer }}
  bootstrap:
    description: Run the bootstrap installer lane (install.sh sandbox + stamp verification).
    value: ${{ steps.classify.outputs.bootstrap }}
  desktop_updater:
    description: Run the Windows desktop-update hand-off (windows.ps1) integration tests.
    value: ${{ steps.classify.outputs.desktop_updater }}
  rust:
    description: Run `cargo test` for the Tauri bootstrap installer.
    value: ${{ steps.classify.outputs.rust }}
  mcp_catalog:
    description: Require MCP catalog security review label.
    value: ${{ steps.classify.outputs.mcp_catalog }}
  ci_review:
    description: Require CI-sensitive file review label.
    value: ${{ steps.classify.outputs.ci_review }}
  ci_review_files:
    description: JSON list of CI-sensitive files changed by the pull request.
    value: ${{ steps.classify.outputs.ci_review_files }}
  os_tests:
    description: Run the macOS / Windows pytest lanes (fork consumes; upstream gates them on python).
    value: ${{ steps.classify.outputs.os_tests }}
  binary_artifacts:
    description: An image or archive file changed (fork gates the infographic / profile-archive tree checks on it).
    value: ${{ steps.classify.outputs.binary_artifacts }}
  upgrade:
    description: Run real install/upgrade and packaged Desktop update E2E on the fork unless paths are known backend-only.
    value: ${{ steps.classify.outputs.upgrade }}
  remote_backends:
    description: Run the SSH and Docker terminal backends against a real sshd and Docker daemon.
    value: ${{ steps.classify.outputs.remote_backends }}
  catalog:
    description: Run the plugin-catalog tests (catalog-only diffs run these instead of the Python suite).
    value: ${{ steps.classify.outputs.catalog }}

runs:
  using: composite
  steps:
    - name: Classify changed files
      id: classify
      shell: bash
      env:
        # Fall back to the built-in read-only token when the caller passes an
        # empty value. Fork PRs get no repo secrets, so AUTOFIX_BOT_PAT is ""
        # there, and an input `default:` only applies when the input is omitted,
        # not when it's passed empty. Without this fallback the compare API
        # fails on forks and the classifier fails open (every lane forced on).
        GH_TOKEN: ${{ inputs.github-token || github.token }}
        REPO: ${{ github.repository }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Fork-only push scoping (scripts/ci/push_changed_files.py).
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.sha }}
        PUSH_FORCED: ${{ github.event.forced }}
      run: |
        set -euo pipefail

        # Only pull_request events are gated. Other events (push, release,
        # dispatch) leave CHANGED empty, so the classifier fails open and every
        # lane runs. Post-merge / on-demand validation is never weakened.
        if [ "$EVENT_NAME" = "pull_request" ]; then
          # Exact event SHAs, status-bearing local git diff when available;
          # capped or incomplete compare data deliberately selects all lanes.
          CHANGED="$(python3 -m scripts.ci.pr_changed_files)"
        elif [ "$EVENT_NAME" = "push" ] && [ "$REPO" = "mekenthompson/hermes-agent" ]; then
          # Fork only: scope a main push to the pushed range
          # (github.event.before...github.sha). The helper prints nothing —
          # so the classifier fails open — on a first or forced push, a
          # non-fast-forward or truncated compare, or an API failure.
          CHANGED="$(python3 scripts/ci/push_changed_files.py)"
        fi

        echo "Changed files:"
        printf '%s\n' "${CHANGED:-(none)}"
        printf '%s\n' "${CHANGED:-}" | python3 -m scripts.ci.classify_changes
