version: 1

upstream:
  repository: NousResearch/hermes-agent
  branch: main
  base_file: .github/upstream-base
  provenance_file: .github/upstream-sync-provenance.json

patches:
  - id: supply-chain-build-input-pinning
    kind: operations
    rationale: >-
      Pin npm bootstrap and Debian container inputs to reviewed immutable
      versions, suppress bootstrap lifecycle scripts, enforce the repository
      release-age policy, upgrade fixable packages already present in the
      pinned runtime base, replace vulnerable bundled npm and uv components,
      restrict reusable test workflow permissions, cover every tracked
      dependency lockfile in OSV, and reject equivalent unapproved global npm
      install syntax in CI and Docker dependency installs.
    paths:
      - .github/workflows/deploy-site.yml
      - .github/workflows/docs-site-checks.yml
      - .github/workflows/e2e-desktop.yml
      - .github/workflows/js-autofix.yml
      - .github/workflows/js-tests.yml
      - .github/workflows/osv-scanner.yml
      - .github/workflows/docker-lint.yml
      - Dockerfile
      - tests/scripts/test_js_tests_workflow.py
      - tests/scripts/test_osv_scanner_workflow.py
      - tests/tools/test_dockerfile_vulnerability_floors.py
    tests:
      - python3 -c "import pathlib, yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.yml')]"
      - hadolint Dockerfile
      - npm run check --workspace apps/desktop
      - scripts/run_tests.sh tests/scripts/test_js_tests_workflow.py tests/scripts/test_osv_scanner_workflow.py tests/tools/test_dockerfile_vulnerability_floors.py
    retirement: Remove when upstream pins equivalent npm and Debian build inputs, restricts reusable workflow permissions, and scans every tracked dependency lockfile with matching lifecycle and release-age protections.

  - id: desktop-nanoid-ghsa-2v37-remediation
    kind: operations
    rationale: >-
      Keep every resolved nanoid 3.x dependency at or above 3.3.18 so Desktop's
      sanitize-html and Vite dependency paths remain outside GHSA-2v37-7h3g-55p8.
    paths:
      - package.json
      - package-lock.json
      - tests/test_npm_security_policy.py
    tests:
      - scripts/run_tests.sh tests/test_npm_security_policy.py
      - npx --yes npm@12.0.1 audit --workspace apps/desktop --omit=dev
      - npm run check --workspace apps/desktop
    retirement: Remove when the recorded upstream baseline enforces an equivalent nanoid 3.x security floor in both manifest and lockfile.

  - id: browserslist-ghsa-73wf-remediation
    kind: operations
    rationale: >-
      Keep every root and website Browserslist resolution at 4.28.7 or newer so
      untrusted custom statistics cannot trigger the prototype-write and crash
      paths tracked by GHSA-73wf-gq98-2v4g, CVE-2026-73088, and CVE-2026-73089.
    paths:
      - package.json
      - package-lock.json
      - website/package.json
      - website/package-lock.json
    tests:
      - npx --yes npm@12.0.1 audit --audit-level=high
      - npx --yes npm@12.0.1 --prefix website audit --audit-level=high
      - npm run check
      - npm --prefix website run build
    retirement: Remove when the recorded upstream baseline resolves Browserslist 4.28.7 or newer in both root and website dependency scopes.

  - id: high-severity-dependency-remediation
    kind: operations
    rationale: >-
      Keep the remaining fork dependency surfaces outside the Critical and High
      OSV advisories addressed by the September 2026 repository-wide lockfile
      remediation, while preserving an exact Electron runtime/build pin and a
      production-only Nix node-gyp dependency closure.
    paths:
      - .npmrc
      - apps/desktop/package.json
      - nix/node-gyp-11-4-0-package-lock.json
      - nix/node-gyp-11-4-0.nix
      - package-lock.json
      - package.json
      - pyproject.toml
      - scripts/whatsapp-bridge/package-lock.json
      - scripts/whatsapp-bridge/package.json
      - tests-js/package.json
      - tests/test_npm_security_policy.py
      - tests/tools/test_lazy_deps.py
      - tools/lazy_deps.py
      - ui-tui/package.json
      - uv.lock
      - web/package.json
      - website/.npmrc
      - website/package-lock.json
      - website/package.json
    tests:
      - scripts/run_tests.sh tests/test_npm_security_policy.py tests/tools/test_lazy_deps.py
      - npm ci --ignore-scripts && npm audit --audit-level=high
      - npm --prefix website ci --ignore-scripts && npm --prefix website audit --audit-level=high
      - npm --prefix scripts/whatsapp-bridge ci --ignore-scripts && npm --prefix scripts/whatsapp-bridge audit --audit-level=high
      - nix build .#node-gyp
    retirement: >-
      Remove when the recorded upstream baseline carries equivalent patched
      dependency floors, Electron pin parity, and production-only node-gyp Nix
      dependency closure with matching regression coverage.

  - id: fork-free-runner-labels
    kind: operations
    rationale: >-
      Run the heavy CI lanes on free standard GitHub-hosted runners instead of
      paid larger runners (ubuntu-latest-96-core/32-core, windows-latest-32-core)
      which the fork has no allocation for; jobs queue forever otherwise. The
      lanes run slower on ubuntu-latest/windows-latest but complete at zero cost
      on this public repository.
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/docker.yml
      - .github/workflows/nix.yml
      - .github/workflows/rust-tests.yml
      - .github/workflows/tests-os.yml
      - .github/workflows/tests.yml
      - tests/ci/test_classify_changes.py
    tests:
      - python3 -c "import pathlib, yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.yml')]"
      - python3 scripts/check_fork_delta.py
    retirement: Remove when the fork account has a larger-runner allocation and the upstream runner labels are restored.

  - id: install-e2e-sandbox-node-ca
    kind: operations
    rationale: >-
      Make Node clients trust the throwaway CA that signs HTTPS certificates in
      the install E2E sandbox while retaining the host CA exclusively for the
      proxy's outbound verification. Force one unambiguous Connection: close
      request header so npm cannot reuse a tunnel the single-request proxy has
      already closed.
    paths:
      - scripts/sandbox/stage2-run.sh
      - scripts/sandbox/proxy.py
      - tests/test_dev_sandbox_tls.py
      - tests/install/install-update-e2e.sh
    tests:
      - scripts/run_tests.sh tests/test_dev_sandbox_tls.py
      - tests/install/install-update-e2e.sh
    retirement: >-
      Remove when upstream provides equivalent sandbox Node CA trust,
      connection-header normalization, managed Node header selection, npm-log
      collection, and regression coverage for all listed paths.

  - id: fork-patch-governance
    kind: operations
    rationale: >-
      Require every fork-to-upstream path delta to have an explicit owner,
      verification command, and retirement condition.
    paths:
      - .github/batumi-patches.yaml
      - .github/batumi-contracts.yaml
      - .github/batumi-components.lock.yaml
      - .github/upstream-base
      - .github/upstream-sync-provenance.json
      - .github/workflows/ci.yml
      - .github/workflows/ci.yaml
      - .github/workflows/contributor-check.yml
      - .github/workflows/label-rerun.yml
      - .github/workflows/deploy-compose.yml
      - .github/workflows/promote-compose.yml
      - .github/workflows/stack-ci-shadow.yml
      - .github/workflows/staging-telegram-socket-diagnostics.yml
      - .github/workflows/upstream-sync.yml
      - contributors/emails/1396641434@qq.com
      - contributors/emails/brooklyn@nousresearch.com
      - contributors/emails/dcdexhome@gmail.com
      - contributors/emails/muhammedeminkamay92@gmail.com
      - contributors/emails/rroveri@nvidia.com
      - contributors/emails/tom@spoct.com
      - contributors/emails/agent@Agents-Mac-mini.local
      - contributors/emails/agent@agents-Mac-mini.local
      - contributors/emails/aleman@batumi.works
      - contributors/emails/audit@batumi.works
      - contributors/emails/hermes@local
      - contributors/emails/repo-builder@batumi.works
      - contributors/emails/repo-ops-glm-5-1@hermes.local
      - scripts/check_fork_delta.py
      - scripts/install_batumi_components.py
      - scripts/run_batumi_contracts.py
      - tests/scripts/test_check_fork_delta.py
      - tests/scripts/test_ci_workflow.py
      - tests/scripts/test_install_batumi_components.py
      - tests/scripts/test_run_batumi_contracts.py
      - tests/scripts/test_upstream_sync_workflow.py
    tests:
      - scripts/run_tests.sh tests/scripts/test_check_fork_delta.py tests/scripts/test_ci_workflow.py tests/scripts/test_install_batumi_components.py tests/scripts/test_upstream_sync_workflow.py
    retirement: Retain while batumi/live carries any fork-only patch.

  - id: import-restore-fidelity
    kind: core
    rationale: >-
      Restore archived POSIX rwx permissions during Hermes imports while
      streaming ZIP members in bounded chunks and retaining secret-mode hardening.
    paths:
      - hermes_cli/backup.py
      - tests/hermes_cli/test_backup.py
    tests:
      - scripts/run_tests.sh tests/hermes_cli/test_backup.py
    retirement: Remove when upstream preserves safe archived modes and imports large members with bounded memory using equivalent regression coverage.

  - id: docker-config-unversioned-migration
    kind: operations
    rationale: >-
      Keep Docker boot-time migration aligned with the core migrator by allowing
      legacy configs without an explicit schema marker through the migration
      ladder while continuing to refuse explicitly versioned configs below the
      supported floor.
    paths:
      - scripts/docker_config_migrate.py
      - tests/tools/test_docker_config_migrate.py
    tests:
      - scripts/run_tests.sh tests/tools/test_docker_config_migrate.py
    retirement: Remove when upstream's Docker migration wrapper distinguishes a missing schema marker from an explicit unsupported version with equivalent regression coverage.

  - id: safe-update-eol-normalization
    kind: core
    rationale: >-
      Force Git to invalidate checkout stat data before classifying CRLF-only
      churn so managed updates cannot miss part of a large rewritten tree.
    paths:
      - hermes_cli/update_cmd.py
      - tests/hermes_cli/test_update_eol_churn.py
    tests:
      - scripts/run_tests.sh tests/hermes_cli/test_update_eol_churn.py
    retirement: Remove when upstream forces an equivalent index refresh before EOL classification.

  - id: lifecycle-controller-serialization
    kind: core
    rationale: >-
      Serialize deployment, checkout reconciliation, gateway restart, LCM
      activation, soak, and bounded-restart mutations with one durable,
      provenance-bound profile lifecycle lease; fail closed on contention,
      orphaned or tampered metadata, symlinks, and controller crashes while
      preserving explicit operator reconciliation and non-POSIX behavior.
    paths:
      - gateway/lifecycle_lease.py
      - hermes_cli/lifecycle_coordination.py
      - hermes_cli/lifecycle_lease_cmd.py
      - hermes_cli/main.py
      - hermes_cli/subcommands/lifecycle_lease.py
      - tests/gateway/test_lifecycle_lease.py
      - tests/gateway/test_lifecycle_lease_operator.py
      - tests/hermes_cli/test_gateway_restart_lifecycle_lease.py
      - tests/hermes_cli/test_lifecycle_controller_crash.py
      - tests/hermes_cli/test_lifecycle_coordination.py
      - tests/hermes_cli/test_lifecycle_lease_cli.py
      - tests/hermes_cli/test_cmd_update.py
      - tests/hermes_cli/test_update_lifecycle_lease.py
      - tests/tools/test_terminal_self_repo_guard.py
      - tools/self_repo_guard.py
    tests:
      - scripts/run_tests.sh tests/gateway/test_lifecycle_lease.py tests/gateway/test_lifecycle_lease_operator.py tests/hermes_cli/test_bounded_restart_controller.py tests/hermes_cli/test_cmd_update.py tests/hermes_cli/test_gateway_restart_lifecycle_lease.py tests/hermes_cli/test_lifecycle_controller_crash.py tests/hermes_cli/test_lifecycle_coordination.py tests/hermes_cli/test_lifecycle_lease_cli.py tests/hermes_cli/test_update_lifecycle_lease.py tests/tools/test_terminal_self_repo_guard.py
      - python -m py_compile gateway/lifecycle_lease.py hermes_cli/lifecycle_coordination.py hermes_cli/lifecycle_lease_cmd.py hermes_cli/subcommands/lifecycle_lease.py
    retirement: Remove when upstream serializes every equivalent lifecycle mutation caller with a durable profile-wide lease, exact provenance binding, crash-orphan exclusion, tamper-resistant release, explicit reconciliation, and matching cross-controller tests.

  - id: upstream-sync-review-remediation
    kind: core
    rationale: >-
      Correct defects found during exact-head review of the imported upstream
      reconciliation: MCP stdio child liveness, reconnect-cycle state, suspect
      connection health checks, and watchdog coroutine handling; desktop preview,
      HUD, and focus-chord compatibility; plus the associated regression coverage
      and stale test/documentation cleanup.
    paths:
      - agent/lsp/client.py
      - apps/desktop/src/app/chat/composer/focus-chord.test.ts
      - apps/desktop/src/app/chat/right-rail/preview-browser-bar.test.tsx
      - apps/desktop/src/app/chat/right-rail/preview-browser-bar.tsx
      - apps/desktop/src/app/hud/hud-shell.tsx
      - apps/desktop/src/app/hud/resize-handle.test.ts
      - apps/desktop/src/app/hud/resize-handle.ts
      - apps/desktop/src/app/session/hooks/use-session-actions.test.tsx
      - apps/desktop/src/lib/keybinds/chords.ts
      - tests/tools/test_local_setsid_descendant_sweep.py
      - tests/tools/test_mcp_stability.py
      - tests/tools/test_mcp_tool.py
      - tools/mcp_tool.py
    tests:
      - scripts/run_tests.sh tests/tools/test_mcp_stability.py tests/tools/test_mcp_tool.py tests/tools/test_local_setsid_descendant_sweep.py
      - cd apps/desktop && npm run typecheck && npm run lint && npm run test:ui
    retirement: Remove when upstream includes equivalent fixes and regression coverage for every listed path.

  - id: codex-attribution-opt-in-policy
    kind: operations
    rationale: >-
      Do not tag official Codex requests with a Hermes-specific originator or
      User-Agent until a generic user-facing telemetry opt-in exists. Preserve
      the established compatibility headers and pin the fork policy with a
      behavioral regression test.
    paths:
      - agent/agent_init.py
      - agent/agent_runtime_helpers.py
      - agent/auxiliary_client.py
      - contributors/emails/vignesh@openai.com
      - run_agent.py
      - tests/agent/test_codex_attribution_policy.py
      - tests/agent/test_codex_cloudflare_headers.py
      - tests/agent/test_codex_usage_attribution.py
      - website/docs/user-guide/configuration.md
    tests:
      - scripts/run_tests.sh tests/agent/test_codex_attribution_policy.py tests/agent/test_codex_cloudflare_headers.py
    retirement: Remove only after a generic user-facing opt-in gate and setup/tooling controls exist for outbound attribution.

  - id: upstream-event-replay-revert-preservation
    kind: compatibility
    rationale: >-
      Keep the legacy sequence-stamped gateway event replay removed while the
      recorded baseline remains a08dfab302, which still contains that upstream
      implementation. Upstream later reverted it in 9f05b06589d and replaced
      it with the epoch/transient-delta redesign beginning at 874fab0ce05.
    paths:
      - apps/desktop/src/app/gateway/hooks/use-gateway-boot.ts
      - apps/shared/src/json-rpc-gateway-replay.test.ts
      - apps/shared/src/json-rpc-gateway.ts
      - tests/test_tui_gateway_event_replay.py
      - tui_gateway/event_replay.py
      - tui_gateway/methods_session.py
      - tui_gateway/server.py
    tests:
      - python3 scripts/check_fork_delta.py
    retirement: Remove when the recorded upstream baseline advances to the post-revert redesign and that replacement is intentionally reconciled.

  - id: upstream-sync-whitespace-cleanup
    kind: cleanup
    rationale: >-
      Keep the accepted upstream tree free of inherited trailing whitespace and
      missing-final-newline defects so the fork remains clean under diff checks
      after advancing its recorded upstream baseline.
    paths:
      - agent/agent_init.py
      - apps/bootstrap-installer/src/routes/progress.tsx
      - apps/desktop/src/plugins/hermes-bots/tests/session-workspace.test.mjs
      - apps/desktop/src/styles.css
      - contributors/emails/uperLu@users.noreply.github.com
      - evals/compaction/results/SCORECARD-2026-08-15.md
      - hermes_cli/bang_shell.py
      - nix/desktop.nix
      - optional-skills/mlops/pytorch-fsdp/references/common-patterns.md
      - skills/research/research-paper-writing/references/phase5-paper-drafting.md
      - tests/cli/test_bang_shell_mode.py
      - tests/gateway/test_branch_routing_columns.py
      - tests/hermes_cli/test_auth_store_windows_encoding.py
      - tests/hermes_cli/test_model_switch_context_offload.py
      - tests/test_batch_runner_exit_code.py
      - tests/test_install_sh_node_npm_check.py
      - tests/test_toolsets.py
      - tests/tools/test_file_operations.py
      - tests/tools/test_session_search.py
      - tests/tools/test_windows_agent_loop_papercuts.py
      - website/i18n/zh-Hans/docusaurus-plugin-content-docs/current/user-guide/features/image-generation.md
    tests:
      - git diff --check $(cat .github/upstream-base)..HEAD
      - python -m py_compile agent/agent_init.py
      - npm run check --workspace apps/desktop
      - npm run check --workspace apps/bootstrap-installer
      - scripts/run_tests.sh tests/test_install_sh_node_npm_check.py
      - scripts/run_tests.sh tests/cli/test_bang_shell_mode.py tests/hermes_cli/test_model_switch_context_offload.py
      - scripts/run_tests.sh tests/gateway/test_branch_routing_columns.py tests/hermes_cli/test_auth_store_windows_encoding.py tests/tools/test_file_operations.py
    retirement: Remove when the recorded upstream baseline contains byte-identical diff-check-clean versions of these files.

  - id: upstream-sync-1be70d63-linearization
    kind: cleanup
    rationale: >-
      Record the upstream delegation, cron, and session-state fixes reconciled
      through 1be70d63 as a linear fork commit because batumi/live rejects merge
      commits and therefore cannot retain the upstream commits as ancestors.
    paths:
      - tests/cron/test_cron_direct_api_call_62151.py
      - tests/hermes_state/test_session_md_export.py
      - tests/tools/test_delegate.py
      - tools/delegate_tool.py
      - website/docs/user-guide/features/delegation.md
    tests:
      - scripts/run_tests.sh tests/cron/test_cron_direct_api_call_62151.py tests/hermes_state/test_session_md_export.py tests/tools/test_delegate.py
      - python -m py_compile tools/delegate_tool.py
    retirement: Remove after the fork is rebased onto upstream 1be70d63 or a descendant containing byte-identical fixes.

  - id: upstream-terminal-lifecycle-totality-backport
    kind: compatibility
    rationale: >-
      Backport upstream terminal lifecycle-guard fixes through PR #80258 so
      local and remote executable content is bounded and sanitized before
      recursive scanning, invalid path inputs cannot crash the guard or cron
      scheduler, and every public guard invocation returns a verdict.
    paths:
      - contributors/emails/prathamesh290504@gmail.com
      - cron/lifecycle_guard.py
      - cron/scheduler.py
      - tools/terminal_tool.py
      - tests/cron/test_cron_no_agent.py
      - tests/hermes_cli/test_gateway_restart_loop.py
    tests:
      - scripts/run_tests.sh tests/hermes_cli/test_gateway_restart_loop.py tests/tools/test_terminal_tool.py tests/cron
      - python -m py_compile cron/lifecycle_guard.py cron/scheduler.py tools/terminal_tool.py tests/cron/test_cron_no_agent.py tests/hermes_cli/test_gateway_restart_loop.py
    retirement: Remove after batumi/live is rebased onto upstream merge 863e31318553 or a descendant containing equivalent lifecycle-guard and scheduler totality fixes.

  - id: cron-no-agent-timeout-rendering
    kind: core
    rationale: >-
      Classify deterministic no-agent script failures before provider failures so
      collector timeouts cannot be mislabeled as provider fallback exhaustion,
      while bounding and validating structured delivery details.
    paths:
      - cron/scheduler.py
      - tests/cron/test_cron_failure_delivery_classification.py
    tests:
      - scripts/run_tests.sh tests/cron/test_cron_failure_delivery_classification.py tests/cron/test_cron_no_agent.py
      - python -m py_compile cron/scheduler.py tests/cron/test_cron_failure_delivery_classification.py
    retirement: Remove when upstream classifies no-agent script failures before provider failures with equivalent bounded timeout rendering and regression coverage.

  - id: cron-result-context-extraction
    kind: core
    rationale: >-
      Inject the final saved cron response or error into context_from and
      continuity prompts before applying the context cap, so large archived
      prompts cannot displace the result that downstream jobs need.
    paths:
      - cron/scheduler.py
      - tests/cron/test_cron_context_from.py
    tests:
      - scripts/run_tests.sh tests/cron/test_cron_context_from.py
      - python -m py_compile cron/scheduler.py tests/cron/test_cron_context_from.py
    retirement: Remove when upstream extracts the final saved cron result before bounded context injection with equivalent large-prompt regression coverage.

  - id: api-adapter-turn-admission
    kind: core
    rationale: >-
      Bound agent-run concurrency per API adapter with a queueing admission
      gate: requests beyond the live-slot capacity wait in a bounded queue and
      excess waiters get an OpenAI-style 429 + Retry-After before body
      parsing. Complements the P0 write_admission layer (write-budget) by
      capping run concurrency (#7483 request-flood exhaustion).
    paths:
      - gateway/platforms/api_server.py
      - tests/gateway/test_api_server_active_work_drain.py
    tests:
      - scripts/run_tests.sh tests/gateway/test_api_server_active_work_drain.py
      - python -m py_compile gateway/platforms/api_server.py
    retirement: Remove when upstream ships an equivalent adapter-level turn admission gate with queue-full 429 and drain-wait coverage.

  - id: compression-adopted-transcript-deduplication
    kind: core
    rationale: >-
      Prevent compaction from duplicating an already-adopted transcript prefix
      when concurrent child work advances the stored compression lineage.
    paths:
      - agent/conversation_compression.py
      - tests/agent/test_compression_concurrent_fork.py
    tests:
      - scripts/run_tests.sh tests/agent/test_compression_concurrent_fork.py
    retirement: Remove when upstream prevents adopted transcript duplication with equivalent concurrent-fork coverage.

  - id: compression-host-auxiliary-timeout-alignment
    kind: core
    rationale: >-
      Keep the host-side progress timeout from abandoning a silent but still
      valid auxiliary compression request before its provider deadline, while
      preserving deterministic explicit-config timeout tests and accurately
      describing safely discarded late results.
    paths:
      - agent/conversation_compression.py
      - hermes_cli/config_defaults.py
      - run_agent.py
      - tests/agent/test_compress_context_progress_timeout.py
    tests:
      - scripts/run_tests.sh tests/agent/test_compress_context_progress_timeout.py
      - python -m py_compile agent/conversation_compression.py hermes_cli/config_defaults.py run_agent.py
    retirement: Remove when upstream aligns the host compression idle budget with the effective auxiliary timeout and provides equivalent late-result safety coverage.

  - id: post-tool-none-compressor-guard
    kind: core
    rationale: >-
      Allow auxiliary agents without a context compressor to complete the
      post-tool loop without a hidden NoneType failure or outer-loop error.
    paths:
      - agent/conversation_loop.py
      - tests/run_agent/test_post_tool_compression_attempt_cap.py
    tests:
      - scripts/run_tests.sh tests/run_agent/test_post_tool_compression_attempt_cap.py
    retirement: Remove when upstream safely handles missing post-tool context compressors with equivalent regression coverage.

  - id: context-engine-midturn-detach-guard
    kind: core
    rationale: >-
      Tolerate mid-turn context-engine detach from cache eviction in the
      pre-API compression gate and the long-context / context-length error
      handlers by skipping compression instead of failing the turn.
    paths:
      - agent/conversation_loop.py
      - tests/agent/test_context_engine_midturn_detach.py
    tests:
      - scripts/run_tests.sh tests/agent/test_context_engine_midturn_detach.py
    retirement: Remove when upstream safely handles a detached context compressor with equivalent regression coverage.

  - id: background-review-teardown-ownership
    kind: core
    rationale: >-
      Keep background-review pointer/list tracking atomic, leave review-fork
      resource teardown with its worker thread, and serialize successful-response
      context-engine accounting against concurrent owner shutdown.
    paths:
      - agent/background_review.py
      - agent/conversation_loop.py
      - run_agent.py
      - tests/run_agent/test_background_review.py
      - tests/run_agent/test_compression_budget_refund.py
    tests:
      - scripts/run_tests.sh tests/run_agent/test_background_review.py tests/run_agent/test_compression_budget_refund.py
    retirement: Remove when upstream provides equivalent atomic review ownership, worker-owned teardown, and post-response context-engine lifecycle coverage.

  - id: delegation-timeout-sessiondb-close-ownership
    kind: core
    rationale: >-
      Install child teardown ownership before parent registration, keep child-owned
      SessionDB resources alive across the full delegation lifecycle (including
      schema retry and timed-out worker unwind), and coordinate delegation-finally,
