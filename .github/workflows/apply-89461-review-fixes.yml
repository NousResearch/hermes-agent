name: Apply 89461 review-gate fixes

on:
  push:
    branches:
      - fix/browser-exec-network-boundary-class
    paths:
      - .github/patches/89461/**
      - .github/workflows/apply-89461-review-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-89461-review-gate
  cancel-in-progress: false

jobs:
  apply-test-and-publish:
    if: github.repository == 'andrexibiza/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact staging head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Materialize and apply exact-head transformation
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          parts = sorted(Path('.github/patches/89461').glob('part-*'))
          if len(parts) != 5:
              raise SystemExit(f'expected 5 transformation parts, found {len(parts)}')
          payload = ''.join(part.read_text(encoding='utf-8') for part in parts)
          script = gzip.decompress(base64.b64decode(payload))
          path = Path('/tmp/apply_89461_review_fixes.py')
          path.write_bytes(script)
          PY
          python3 /tmp/apply_89461_review_fixes.py

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install locked test environment
        run: >-
          uv sync --locked --python 3.11
          --extra all --extra dev --extra anthropic --extra mistral
          --extra fal --extra modal --extra daytona --extra hindsight
          --extra parallel-web

      - name: Compile modified Python surfaces
        run: >-
          uv run python -m compileall -q
          tools/browser_use_guard_bootstrap/browser_exec_egress_guard.py
          tools/browser_exec_egress_guard.py
          tools/browser_use_guard.py
          tests/tools/test_browser_exec_egress_guard.py
          tests/tools/test_browser_use_guard.py

      - name: Lint modified Python surfaces
        run: >-
          uv run ruff check
          tools/browser_use_guard_bootstrap/browser_exec_egress_guard.py
          tools/browser_exec_egress_guard.py
          tools/browser_use_guard.py
          tests/tools/test_browser_exec_egress_guard.py
          tests/tools/test_browser_use_guard.py

      - name: Run adversarial guard suites
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: >-
          uv run pytest -q
          tests/tools/test_browser_exec_egress_guard.py
          tests/tools/test_browser_use_guard.py

      - name: Amend staging commit into the clean reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/patches/89461/part-*
          git rm .github/workflows/apply-89461-review-fixes.yml
          git add \
            tools/browser_use_guard_bootstrap/browser_exec_egress_guard.py \
            tools/browser_exec_egress_guard.py \
            tools/browser_use_guard.py \
            tests/tools/test_browser_exec_egress_guard.py \
            tests/tools/test_browser_use_guard.py
          git diff --cached --check
          git diff --cached --stat
          git config user.name "Axl Ibiza, MBA"
          git config user.email "andrexibiza@gmail.com"
          git commit --amend --no-edit --author="Axl Ibiza, MBA <andrexibiza@gmail.com>"
          git push \
            --force-with-lease="refs/heads/${GITHUB_REF_NAME}:${GITHUB_SHA}" \
            origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
