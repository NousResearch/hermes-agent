name: assemble-uvlock
on:
  push:
    branches:
      - cursor/fix-pyjwt-vulnerability-974b
    paths:
      - "uv.lock.part00"
      - "uv.lock.part01"
      - ".github/workflows/assemble-uvlock.yml"
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and commit uv.lock
        run: |
          set -euo pipefail
          test -f uv.lock.part00
          test -f uv.lock.part01
          cat uv.lock.part00 uv.lock.part01 > uv.lock
          test "$(wc -c < uv.lock)" -gt 1000000
          grep -q 'name = "pyjwt"' uv.lock
          grep -q 'version = "2.15.1"' uv.lock
          rm -f uv.lock.part00 uv.lock.part01
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git add -u || true
          git rm -f .github/workflows/assemble-uvlock.yml || true
          git rm -f .hermes-pyjwt-fix-marker || true
          git commit -m "security: restore complete uv.lock for PyJWT 2.15.1"
          git push
