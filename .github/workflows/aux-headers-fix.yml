name: Apply aux-headers fix
on:
  push:
    branches:
      - temp-aux-chunks
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch chunks
        run: git fetch origin temp-aux-chunks && git checkout origin/temp-aux-chunks -- chunks/
      - name: Run reassemble
        run: python3 chunks/reassemble.py
