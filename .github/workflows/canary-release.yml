name: Canary Release

# Automatic canaries are daily: the schedule caps new tags at one per 24h.
# With no new commits, release.py resumes an existing unpublished canary until
# its protected head is live; only a published canary makes a quiet day a no-op.
# workflow_dispatch fires one on demand at any time.
#
# The canary tag is canary.<YYYYMMDDTHHMMSSZ>-v<stable>; the version it publishes
# is the stable plus build metadata (<stable>+canary.<stamp>), so it compares
# equal to the stable and only the protected R2 canary head moves subscribers. A dispatch queued behind a
# running canary has conclusion=cancelled if a newer one supersedes it; only
# conclusion=failure is a canary failure signal.
#
# The canary build itself is a Stable Release run (stable-release.yml) on the
# canary tag: the exact job graph a stable release runs, with every lane on
# (macOS Intel and Termux included; scripts/releases/lanes.py CANARY) except
# the signed-package upgrade arms -- the canary app cannot upgrade a stable
# install; install-e2e tests old stable -> this commit -- so the two never drift.
# It differs only in where it publishes (the canary channels, never the Store or a
# stable head) and in what gates publication: the scheduled canary publishes once
# its candidate is built and smoked (--no-require-green) and every other suite
# reports in the same run; a manual dispatch waits for every suite unless told not to.

on:
  schedule:
    - cron: "41 6 * * *" # daily, 06:41 UTC
  workflow_dispatch:
    inputs:
      require_green:
        description: Hold publication until every suite passes (the schedule never does)
        type: boolean
        default: true

permissions:
  contents: write # tag push + release create/delete for prune
  actions: write # release.py dispatches the Stable Release pipeline on the canary tag

concurrency:
  group: canary-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag, draft, and start the canary build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # A dispatch from a feature branch would tag unmerged code as the canary.
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          # The changelog walks commits since the previous canary tag
          fetch-depth: 0
          # the tag math reads the full tag list
          fetch-tags: true

      - name: Tag and draft
        env:
          GH_TOKEN: ${{ github.token }}
          # The daily canary publishes once its candidate is built and smoked; the suites report.
          REQUIRE_GREEN: ${{ github.event_name == 'workflow_dispatch' && inputs.require_green && 'true' || 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          green=--require-green
          [ "$REQUIRE_GREEN" = true ] || green=--no-require-green
          python3 scripts/release.py --canary --publish --remote origin "$green"

  prune:
    name: Prune canaries older than 14 days
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: tag
    environment: release-signing
    # Prune even when this run had nothing new to tag. The release pipeline
    # runs in its own workflow run, so this does not wait on it — the
    # window is 14 days, far wider than any build.
    if: always() && needs.tag.result != 'cancelled' && needs.tag.result != 'skipped'
    # Job-level so the R2 prune step can gate on `env` (a step `if` cannot
    # read `secrets`): an unprovisioned release-signing environment skips
    # the R2 prune instead of failing the canary run.
    env:
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py --prune-canaries --publish --remote origin
      - uses: ./.github/actions/setup-pm
        if: env.CLOUDFLARE_R2_ACCOUNT_ID != ''
        with:
          cache-python: false
      - name: Prune R2 canary objects
        if: env.CLOUDFLARE_R2_ACCOUNT_ID != ''
        run: python -m scripts.ci.python_packages ruamel.yaml==0.18.17 -- -m scripts.releases.r2 prune-canaries --keep-days 14
