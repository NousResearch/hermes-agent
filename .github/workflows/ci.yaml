name: CI

# Orchestrator workflow. Runs ``detect-changes`` once, then conditionally
# calls the sub-workflows that a PR can actually affect. A final
# ``all-checks-pass`` gate job aggregates results so branch protection only
# needs to require a single check.
#
# Sub-workflows are triggered via ``workflow_call`` and keep their own job
# definitions, matrices, and concurrency settings. They no longer have
# ``push:`` / ``pull_request:`` triggers of their own — everything flows
# through this file.
#
# SECURITY: this workflow runs PR-controlled actions, workflows, and code.
# Do not add ``secrets: inherit`` or GitHub App credentials here. Trusted
# main-only automation uses protected environments in its own workflows.

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Stable-release candidate run: force every applicability lane and make the aggregate gate strict (skipped required lanes fail).'
        required: false
        type: boolean
        default: false
      strict_acceptance:
        description: "Acceptance runs only: known_failure owners whose gaps FAIL this run instead of xfailing ('upd-txn', a comma list, or '1' for every gap). Sets HERMES_E2E_STRICT_ACCEPTANCE for the E2E suites (tests/e2e/core/_pending_fixes.py)."
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''
      release:
        description: 'Stable-release candidate run: force every applicability lane and make the aggregate gate strict (skipped required lanes fail).'
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # needed by lint (PR comment) + supply-chain review_status
  actions: read # needed by osv-scanner (SARIF upload)
  security-events: write # needed by osv-scanner (SARIF upload)

# cancel-in-progress only ever applies to PR events. A push, a dispatch, and
# above all a stable-release workflow_call run are never cancelled by a later
# commit or a rerun of the same branch — the caller's own concurrency uses
# github.run_id, so even a parent rerun cannot kill this child mid-flight.
# Release (workflow_call with inputs.release) never cancels and never gets
# cancelled: its group is github.run_id. PRs collapse per-PR; pushes use the
# ref as before.
concurrency:
  group: ci-${{ inputs.release == true && github.run_id || (github.event_name == 'pull_request' && github.event.pull_request.number || github.ref) }}
  # PRs supersede stale runs everywhere. Only the maintained fork cancels
  # main push runs; upstream preserves every post-merge validation run.
  cancel-in-progress: ${{ inputs.release != true && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.repository == 'mekenthompson/hermes-agent' && github.ref == 'refs/heads/main')) }}

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # detect: run the classifier once. Every downstream job reads its outputs
  # to decide whether to run. On push/dispatch the classifier fails open
  # (all lanes true) so post-merge validation is never weakened.
  #
  # status even when some deps were skipped.
  #
  # Non-release (PR/push): failure fails, skipped counts as success.
  # Release (inputs.release): strict — every required job must be success;
  # only PR-only jobs and deferred Desktop E2E may skip. The OSV scan's
  # findings are advisory, but its execution is required.
  #
  # Fork (mekenthompson): main pushes are scoped to the pushed range and
  # several jobs carry fork-only gates. Never add paths: to push triggers:
  # fork-agent-image.yml waits for a successful CI run of the exact SHA.
  # detect and all-checks-pass always run, including when every lane skips.
  # ─────────────────────────────────────────────────────────────────────
  detect:
    name: Detect affected areas
    runs-on: ubuntu-latest
    # Full-history checkout of a large upstream alignment can exceed one minute
    # on hosted runners before classification even starts.
    timeout-minutes: 10
    outputs:
      python: ${{ steps.gate-lanes.outputs.python }}
      python_prod: ${{ steps.gate-lanes.outputs.python_prod }}
      frontend: ${{ steps.gate-lanes.outputs.frontend }}
      site: ${{ steps.gate-lanes.outputs.site }}
      scan: ${{ steps.gate-lanes.outputs.scan }}
      deps: ${{ steps.gate-lanes.outputs.deps }}
      uv_lock: ${{ steps.gate-lanes.outputs.uv_lock }}
      npm_lock: ${{ steps.gate-lanes.outputs.npm_lock }}
      installer: ${{ steps.gate-lanes.outputs.installer }}
      bootstrap: ${{ steps.gate-lanes.outputs.bootstrap }}
      desktop_updater: ${{ steps.gate-lanes.outputs.desktop_updater }}
      rust: ${{ steps.gate-lanes.outputs.rust }}
      remote_backends: ${{ steps.gate-lanes.outputs.remote_backends }}
      catalog: ${{ steps.gate-lanes.outputs.catalog }}
      docker_meta: ${{ steps.gate-lanes.outputs.docker_meta }}
      mcp_catalog: ${{ steps.classify.outputs.mcp_catalog }}
      e2e: ${{ steps.gate-lanes.outputs.e2e }}
      e2e_upgrade: ${{ steps.gate-lanes.outputs.e2e_upgrade }}
      e2e_desktop_core: ${{ steps.gate-lanes.outputs.e2e_desktop_core }}
      e2e_desktop_update: ${{ steps.gate-lanes.outputs.e2e_desktop_update }}
      ci_review: ${{ steps.classify.outputs.ci_review }}
      ci_review_files: ${{ steps.classify.outputs.ci_review_files }}
      os_tests: ${{ steps.classify.outputs.os_tests }}
      binary_artifacts: ${{ steps.classify.outputs.binary_artifacts }}
      upgrade: ${{ steps.gate-lanes.outputs.upgrade }}
      selected_jobs: ${{ steps.select-jobs.outputs.selected_jobs }}
      event_name: ${{ github.event_name }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ inputs.commit }}
          # PR merge checkout includes both event SHA parents at depth two.
          fetch-depth: 2
      # These guards are unconditional. Share detect's checkout in the fork
      # rather than queueing two more machines for seconds of Python work.
      - name: Reject case-colliding filenames
        if: github.repository == 'mekenthompson/hermes-agent'
        run: python3 scripts/check-case-collisions.py
      - name: Reject production imports of tools.lazy_deps
        if: github.repository == 'mekenthompson/hermes-agent'
        run: python3 scripts/ci/check_lazy_deps_imports.py
      - name: Detect affected areas
        id: classify
        uses: ./.github/actions/detect-changes
        with:
          github-token: ${{ github.token }}
      - name: Force all lanes on release; E2E only on release or dispatch
        # Overwrite the classifier outputs with 'true' when inputs.release. The E2E
        # lanes are forced off unless this is a release run or a manual dispatch
        # (whose empty diff already turns every lane on): never on a pull request
        # or a push to main, whatever the diff or labels say.
        id: gate-lanes
        env:
          RELEASE: ${{ inputs.release }}
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFIED: ${{ toJSON(steps.classify.outputs) }}
        run: |
          python3 - <<'PY'
          import json, os
          values = json.loads(os.environ['CLASSIFIED'])
          release = os.environ['RELEASE'] == 'true'
          e2e_allowed = release or os.environ['EVENT_NAME'] == 'workflow_dispatch'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for lane, value in values.items():
                  if not isinstance(value, str):
                      value = 'true' if value is True else 'false'
                  if lane.startswith('e2e') and not e2e_allowed:
                      value = 'false'
                  elif release and value in ('true', 'false'):
                      value = 'true'
                  if '\n' in value or '\r' in value:
                      continue
                  output.write(f'{lane}={value}\n')
          PY
      - name: Select applicable jobs
        id: select-jobs
        env:
          LANES: ${{ toJSON(steps.gate-lanes.outputs) }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE: ${{ inputs.release }}
        run: python3 scripts/ci/ci_policy.py --select

  # ─────────────────────────────────────────────────────────────────────
  # Lane-gated sub-workflows. Each runs in parallel after detect finishes.
  # Skipped workflows (if condition is false) don't spin up runners.
  #
  # Fork validation is unit tests, lint, bundled JS, and dependency checks.
  # E2E, upgrade, Desktop, other OS runners, and native installers are
  # upstream product surfaces. A sync that touches those paths must not
  # schedule them here.
  # ─────────────────────────────────────────────────────────────────────
  tests:
    name: Python tests
    needs: detect
    # Fork applicability lives in selected_jobs. Do not also gate this call on
    # upstream e2e_upgrade; the fork upgrade suite is inputs.upgrade alone.
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs).tests }}
    uses: ./.github/workflows/tests.yml
    with:
      commit: ${{ inputs.commit }}
      upgrade: ${{ github.repository != 'mekenthompson/hermes-agent' && needs.detect.outputs.upgrade == 'true' }}
      upgrade_partition: ${{ github.repository == 'mekenthompson/hermes-agent' && inputs.release != true && 'runtime' || 'all' }}
      e2e: ${{ github.repository != 'mekenthompson/hermes-agent' && needs.detect.outputs.e2e == 'true' }}
      e2e_upgrade: ${{ github.repository != 'mekenthompson/hermes-agent' && needs.detect.outputs.e2e_upgrade == 'true' }}
      strict_acceptance: ${{ inputs.strict_acceptance || '' }}

  # Not selected on this fork. Upstream keeps the combined install call in its
  # own repository. The job remains so a synced workflow graph still names it.
  native-install-tests:
    name: Native install tests
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs).native-install-tests }}
    uses: ./.github/workflows/tests.yml
    with:
      commit: ${{ inputs.commit }}
      unit: false
      e2e: false
      upgrade: true
      upgrade_partition: native

  # macOS + Windows lanes. The main `tests` lane above is Linux-only, and
  # the OS-marked tests it collects are skipped there by design (see the
  # `_OS_MARKS` comment in tests/conftest.py) — this is where they run.
  # Fork: selected_jobs.tests-os requires python and os_tests. The fork ships
  # Linux containers, so a diff with no OS-specific surface skips Windows and
  # macOS. desktop_updater is still passed into the workflow below.
  tests-os:
    name: OS-specific tests
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['tests-os'] }}
    uses: ./.github/workflows/tests-os.yml
    with:
      commit: ${{ inputs.commit }}
      # The Windows lane spawns the real desktop-update hand-off script
      # (tests/test_desktop_update_windows_*.py) only when that surface
      # changed; unit-level platforms("windows") tests always run.
      desktop_updater: ${{ needs.detect.outputs.desktop_updater == 'true' }}
      e2e: ${{ needs.detect.outputs.e2e == 'true' }}
      e2e_upgrade: ${{ needs.detect.outputs.e2e_upgrade == 'true' }}
      strict_acceptance: ${{ inputs.strict_acceptance || '' }}

  lint:
    name: Python lints
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs).lint }}
    uses: ./.github/workflows/lint.yml
    with:
      commit: ${{ inputs.commit }}
      event_name: ${{ needs.detect.outputs.event_name }}
      python: ${{ needs.detect.outputs.python == 'true' }}

  js-tests:
    name: JS & TS checks
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['js-tests'] }}
    uses: ./.github/workflows/js-tests.yml
    with:
      commit: ${{ inputs.commit }}

  installer-tests:
    name: Installer tests
    needs: detect
    # Windows-only PowerShell tests; preserve the fork's real installer coverage.
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['installer-tests'] }}
    uses: ./.github/workflows/installer-tests.yml
    with:
      commit: ${{ inputs.commit }}

  rust-tests:
    name: Rust tests
    needs: detect
    # Only for PRs that touch a Rust crate. `.rs` is under apps/, so these
    # changes used to run the TypeScript matrix and nothing that compiles them.
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['rust-tests'] }}
    uses: ./.github/workflows/rust-tests.yml
    with:
      commit: ${{ inputs.commit }}

  catalog-tests:
    name: Catalog tests
    needs: detect
    # A PR that changes only catalog entry data runs these instead of the
    # Python suite (the classifier turns `python` off for it); required whenever
    # detect selects it.
    if: needs.detect.outputs.catalog == 'true'
    uses: ./.github/workflows/catalog-tests.yml
    with:
      commit: ${{ inputs.commit }}

  remote-backends:
    name: Remote terminal backends
    needs: detect
    # The SSH and Docker terminal backends against a real sshd container and the
    # runner's Docker daemon. Only PRs that touch the backends / terminal tool /
    # their real tests start it (and every push to main); it runs in parallel with
    # the other lanes and is required whenever detect selects it.
    if: needs.detect.outputs.remote_backends == 'true'
    uses: ./.github/workflows/remote-backends.yml
    with:
      commit: ${{ inputs.commit }}

  bootstrap-installer:
    name: Bootstrap installer
    needs: detect
    # The bootstrap-installer path: install.sh, the pin fragments it embeds,
    # and the version stamp it ships. The PowerShell installer's native tests
    # are platforms("windows") pytest files and run in tests-os.
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['bootstrap-installer'] }}
    uses: ./.github/workflows/bootstrap-installer.yml
    with:
      commit: ${{ inputs.commit }}

  e2e-desktop:
    name: Desktop E2E
    needs: detect
    # python_prod (not python): the Playwright suite exercises the built app
    # + `hermes serve` backend, which never import anything under tests/.
    # Tests-only PRs (~17% of commits) skip this 5-minute job — the longest
    # single job in the workflow — while still running the full pytest lanes.
    #
    # Re-disabled (Sep 2026): the Sep 1 re-enable is still incredibly flaky.
    # Keep this a bare `if: false`. The earlier
    # `${{ false && (... || ...) }}` form on this reusable-workflow job made
    # GitHub's workflow parser fail at startup ("An unexpected error has
    # occurred") — every ci.yaml run repo-wide dispatched 0 jobs from
    # 24f5a60ed1 until this line changed. To re-enable, restore:
    #   if: ${{ needs.detect.outputs.python_prod == 'true' || needs.detect.outputs.frontend == 'true' }}
    if: false
    uses: ./.github/workflows/e2e-desktop.yml
    with:
      commit: ${{ inputs.commit }}

  e2e-desktop-core:
    name: Desktop core E2E
    needs: detect
    # The deterministic core suite (apps/desktop/e2e/core): transcript
    # integrity, boot/respawn/orphans, clarify+approval. Required; retries 0.
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['e2e-desktop-core'] }}
    uses: ./.github/workflows/e2e-desktop-core.yml
    with:
      commit: ${{ inputs.commit }}

  e2e-desktop-update:
    name: Desktop update E2E
    needs: detect
    # apps/desktop/e2e/update: a real install.sh install + packaged Desktop,
    # first run, "Update now" hand-off/relaunch, concurrent-update refusal.
    # Fork policy: selected_jobs enables this only for product changes, and on
    # the fork also requires the upgrade lane. Do not switch to the raw
    # upstream e2e_desktop_update output.
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['e2e-desktop-update'] }}
    uses: ./.github/workflows/e2e-desktop-update.yml
    with:
      commit: ${{ inputs.commit }}

  docs-site:
    name: Docs Site
    needs: detect
    # Fork: never — deploy-site.yml is upstream-only, so the fork deploys no
    # docs site and a Docusaurus build validates nothing it ships.
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['docs-site'] }}
    uses: ./.github/workflows/docs-site-checks.yml
    with:
      commit: ${{ inputs.commit }}

  history-check:
    name: Deny unrelated histories
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['history-check'] }}
    uses: ./.github/workflows/history-check.yml
    with:
      commit: ${{ inputs.commit }}

  contributor-check:
    name: Check contributors
    needs: detect
    # Fork: PRs only. On a main push HEAD == origin/main, so the merge-base
    # range is empty and the job checks nothing.
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['contributor-check'] }}
    uses: ./.github/workflows/contributor-check.yml
    with:
      commit: ${{ inputs.commit }}

  uv-lockfile:
    name: Check uv.lock
    needs: detect
    # Gated: `uv lock --check` re-resolves the whole dependency graph against
    # PyPI, so on every PR it spent a network round-trip — and, on a registry
    # blip, a blocking red X — for diffs that cannot desync the lockfile
    # (docs, frontend, prose). Only pyproject.toml / uv.lock can. A
    # `.github/` change still forces it on via the classifier's fail-open.
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['uv-lockfile'] }}
    uses: ./.github/workflows/uv-lockfile-check.yml
    with:
      commit: ${{ inputs.commit }}

  # Both tree checks reject files by extension; the fork runs them only when
  # the diff carries such a file (classifier ``binary_artifacts``).
  infographic-check:
    name: Check no committed infographics
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['infographic-check'] }}
    uses: ./.github/workflows/infographic-check.yml
    with:
      commit: ${{ inputs.commit }}

  profile-artifact-check:
    name: Profile artifact check
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['profile-artifact-check'] }}
    uses: ./.github/workflows/profile-artifact-check.yml
    with:
      commit: ${{ inputs.commit }}

  icons-freshness-check:
    name: Icon assets freshness
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['icons-freshness-check'] }}
    uses: ./.github/workflows/icons-freshness-check.yml
    with:
      commit: ${{ inputs.commit }}

  case-collision-check:
    name: Check no case-colliding filenames
    needs: detect
    if: github.repository != 'mekenthompson/hermes-agent'
    uses: ./.github/workflows/case-collision-check.yml
    with:
      commit: ${{ inputs.commit }}

  blob-size-check:
    name: Check no large binaries
    needs: detect
    uses: ./.github/workflows/blob-size-check.yml
    with:
      commit: ${{ inputs.commit }}

  lazy-deps-guard:
    name: No production imports of the tools.lazy_deps stub
    needs: detect
    if: github.repository != 'mekenthompson/hermes-agent'
    uses: ./.github/workflows/lazy-deps-guard.yml
    with:
      commit: ${{ inputs.commit }}

  lockfile-diff:
    name: package-lock.json diff
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['lockfile-diff'] }}
    uses: ./.github/workflows/lockfile-diff.yml
    with:
      commit: ${{ inputs.commit }}

  # Advisory summary of the committed prompt-surface snapshot's diff. A stdlib-only job over two
  # committed directories: cheap enough to run on every Python PR, and silent when nothing moved.
  prompt-surface-diff:
    name: Prompt surface diff
    needs: detect
    if: needs.detect.outputs.event_name == 'pull_request' && needs.detect.outputs.python == 'true'
    uses: ./.github/workflows/prompt-surface-diff.yml
    with:
      commit: ${{ inputs.commit }}

  docker-lint:
    name: Lint Docker scripts
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['docker-lint'] }}
    uses: ./.github/workflows/docker-lint.yml
    with:
      commit: ${{ inputs.commit }}

  supply-chain:
    name: Supply-chain scan
    needs: detect
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['supply-chain'] }}
    uses: ./.github/workflows/supply-chain-audit.yml
    with:
      commit: ${{ inputs.commit }}
      event_name: ${{ needs.detect.outputs.event_name }}
      scan: ${{ needs.detect.outputs.scan == 'true' }}
      deps: ${{ needs.detect.outputs.deps == 'true' }}

  review-labels:
    name: Review label gate
    needs: [detect, supply-chain]
    if: always() && (fromJSON(needs.detect.outputs.selected_jobs)['review-labels'] || (needs.detect.outputs.event_name == 'pull_request' && needs.supply-chain.outputs.critical_findings == 'true'))
    uses: ./.github/workflows/review-labels.yml
    with:
      commit: ${{ inputs.commit }}
      ci_review: ${{ needs.detect.outputs.ci_review == 'true' }}
      ci_review_files: ${{ needs.detect.outputs.ci_review_files }}
      mcp_catalog: ${{ needs.detect.outputs.mcp_catalog == 'true' }}
      supply_chain: ${{ needs.supply-chain.outputs.critical_findings == 'true' }}

  osv-scanner:
    name: OSV scan
    needs: detect
    # Fork: only when a lockfile or pyproject changed. The pinned set cannot
    # gain a CVE from a diff that does not touch it; osv-scanner.yml's weekly
    # schedule still covers newly published advisories against main.
    if: ${{ fromJSON(needs.detect.outputs.selected_jobs)['osv-scanner'] }}
    uses: ./.github/workflows/osv-scanner.yml
    with:
      commit: ${{ inputs.commit }}

  # ─────────────────────────────────────────────────────────────────────
  # Gate: runs after everything. ``if: always()`` ensures it reports a
  # status even when some deps were skipped.
  # Fork gate: selected_jobs decides which lanes must succeed. A skipped
  # unselected lane is success. The OSV scan's findings are advisory, but its
  # execution is required. Deferred Desktop E2E may skip.
  #
  # Upstream release mode (non-fork only): every required job must be
  # success. A skipped required lane fails that gate; only the PR-only jobs
  # (history-check, lockfile-diff, prompt-surface-diff, supply-chain,
  # review-labels) and the deferred Desktop E2E may skip.
  #
  # Branch protection should require ONLY this check.
  #
  # Fork ruleset "main: pipeline gate" requires the unversioned context
  # "All required checks pass". Do not add an upstream "(v2)" suffix here
  # unless that ruleset is updated in the same change.
  #
  # Outputs ``needs-json`` — a compact ``{job_name: result}`` dict — so
  # the live comment poller can list failed jobs in the PR comment.
  # ─────────────────────────────────────────────────────────────────────
  all-checks-pass:
    name: All required checks pass
    needs:
      - detect
      - tests
      - native-install-tests
      - tests-os
      - lint
      - js-tests
      - installer-tests
      - rust-tests
      - remote-backends
      - catalog-tests
      - bootstrap-installer
      - e2e-desktop
      - e2e-desktop-core
      - e2e-desktop-update
      - docs-site
      - history-check
      - contributor-check
      - uv-lockfile
      - infographic-check
      - case-collision-check
      - blob-size-check
      - lazy-deps-guard
      - lockfile-diff
      - prompt-surface-diff
      - docker-lint
      - profile-artifact-check
      - icons-freshness-check
      - supply-chain
      - osv-scanner
      - review-labels
      # OSV findings are advisory, but dependency-manifest PRs aggregate its
      # execution result; osv-scanner.yml's weekly schedule covers new CVEs
      # discovered on main. The fork scopes this lane to dependency changes.
      # The image build runs in its own workflow (docker.yml) and reports
      # its own check. It was never required here, because it is too slow
      # to block a merge. A separate run also stops it from holding this
      # run open. That is what blocked ``gh run rerun``.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      needs-json: ${{ steps.evaluate.outputs.needs-json }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ inputs.commit || github.sha }}
      - name: Evaluate job results
        id: evaluate
        # Shared with the stable orchestrator (scripts/ci/required_results.py
        # is imported there). NEEDS is the toJSON(needs) context; RELEASE
        # switches the gate into strict mode for release runs.
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE: ${{ inputs.release }}
          REPO: ${{ github.repository }}
          SELECTED_JOBS: ${{ needs.detect.outputs.selected_jobs }}
          CRITICAL_FINDINGS: ${{ needs.supply-chain.outputs.critical_findings }}
        run: |
          if [ "$RELEASE" = true ] && [ "$REPO" != "mekenthompson/hermes-agent" ]; then
            printf '%s' "$NEEDS" | python3 scripts/ci/required_results.py --release
          else
            echo "$NEEDS" | python3 scripts/ci/ci_policy.py
          fi

  # Publication only: runtime lanes this fork actually ships gate the Linux
  # image. Unshipped surfaces are not selected, so they do not delay publication.
  image-checks-pass:
    name: Image required checks pass
    needs:
      - detect
      - tests
      - lint
      - js-tests
      - history-check
      - contributor-check
      - uv-lockfile
      - infographic-check
      - case-collision-check
      - lazy-deps-guard
      - lockfile-diff
      - docker-lint
      - profile-artifact-check
      - icons-freshness-check
      - supply-chain
      - osv-scanner
      - review-labels
      - remote-backends
    if: always() && github.repository == 'mekenthompson/hermes-agent' && inputs.release != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - name: Evaluate image job results
        env:
          NEEDS: ${{ toJSON(needs) }}
          SELECTED_JOBS: ${{ needs.detect.outputs.selected_jobs }}
          CRITICAL_FINDINGS: ${{ needs.supply-chain.outputs.critical_findings }}
        run: printf '%s' "$NEEDS" | python3 scripts/ci/ci_policy.py --image

  # ─────────────────────────────────────────────────────────────────────
  # CI timing report: collect per-job/step durations from the GitHub API,
  # cache them on main (as a baseline), and on PRs generate an HTML diff
  # report with a gantt chart + per-step breakdown. The report is uploaded
  # as an artifact and a markdown summary is written to $GITHUB_STEP_SUMMARY.
  #
  # The live comment poller dynamically fetches all review-status-* artifacts
  # across the orchestrator and sub-workflow runs every cycle, so its link
  # points straight at that report.
  # ─────────────────────────────────────────────────────────────────────
  ci-timings:
    name: CI timing report
    needs: [all-checks-pass]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ inputs.commit }}

      - name: Restore baseline cache (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-timings-baseline.json
          # Prefix-match: exact key will never hit (run_id differs), so
          # restore-keys finds the most recent baseline from main.
          key: ci-timings-baseline-never-exact
          restore-keys: |
            ci-timings-baseline-

      - name: Collect timings and generate report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/timings_report.py \
            --baseline ci-timings-baseline.json \
            --output ci-timings-report.html \
            --json-out ci-timings.json \
            --summary-out ci-timings-summary.md

      - name: Upload HTML report
        # Advisory report — artifact-service blips must not fail the job.
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: ci-timings-html
        with:
          name: ci-timings-report
          path: ci-timings-report.html
          retention-days: 14

      - name: Build linked review status
        if: hashFiles('ci-timings.json') != ''
        env:
          CI_TIMINGS_REPORT_URL: ${{ steps.ci-timings-html.outputs.artifact-url }}
        run: |
          python3 scripts/ci/timings_report.py \
            --from-json ci-timings.json \
            --baseline ci-timings-baseline.json \
            --review-status-out review-status.json \
            --review-status-only

      - name: Upload review status
        if: hashFiles('review-status.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-status-ci-timings
          path: review-status.json
          retention-days: 14

      - name: Output summary
        env:
          REPORT_URL: ${{ steps.ci-timings-html.outputs.artifact-url}}
        run: |
          {
            echo "# CI Timing report"
            echo "[View the full interactive report]($REPORT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
          cat ci-timings-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save baseline cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # Degraded runs (API rate-limited) produce no ci-timings.json —
          # skip rather than fail, and never cache an empty baseline.
          if [ -f ci-timings.json ]; then
            cp ci-timings.json ci-timings-baseline.json
          else
            echo "No timings JSON this run — skipping baseline update"
          fi

      - name: Upload baseline to cache (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('ci-timings-baseline.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ci-timings-baseline.json
          key: ci-timings-baseline-${{ github.run_id }}
