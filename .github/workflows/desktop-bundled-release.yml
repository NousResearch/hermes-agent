name: Desktop Bundled Release

# Builds the bundled desktop installer for each (os, arch) target.
#
#   admission (claim verification via stable-release.yml, commit build, or
#   channel build — resolved to an IMMUTABLE full SHA) → per-OS builder jobs
#   → stage files + receipts to R2.
#
# Release tags (stable and canary) run only through stable-release.yml, which
# calls this workflow in release-phase=candidate to build/smoke/stage receipts
# and in release-phase=publish for stable publication / Store submission.
# Channel and commit builds dispatch this workflow directly.
#
# Per-OS topology:
#
#   build-win32 (win32-x64 + win32-arm64)   → stage packages + receipts to R2
#     Release runs pick which Windows packages these build: `skip-signed` builds
#     only the unsigned Store variant (no Azure signing), `skip-store` only the
#     signed bundled one.
#   build-darwin (darwin-arm64 only; there is no Intel macOS build)
#     → sign + notarize + stage dmg/zip/blockmap + the feed input to the R2 archive
#   build-linux (linux-x64 + linux-arm64)   → candidate phase only, diagnostic: AppImage
#     staged to the tag archive; gates nothing and writes no Linux feed
#   assemble-win32-bundle                   → native universal bundles
#     (needs build-win32): all downloadable builds stage without touching feeds.
#   smoke-darwin / smoke-win32 (per arch)   → native install + chat
#   stable-store                            → verified Store draft
#     (beside stable-publish): materialize the immutable accepted Store bundle
#     and upload it via the MSStore CLI without rebuilding; the publication
#     pass commits it with auto-publish on.
#
# Feed layout (matches apps/desktop/electron/app-updater.ts's arms):
#   releases/win32/<stable|canary>/<ch>.appinstaller   App Installer feed
#     canary bundles live beside the feed; stable points into releases/tag/<tag>/
#   releases/darwin/<stable|canary>/<channel>-mac.yml  electron-updater feed
#     (dmg/zip live once in releases/tag/<tag>/; the merged feed points at
#     them with absolute object keys)
# Release candidate jobs only stage tag-scoped objects; stable-release.yml gates
# feed promotion and channel-head advancement for both stable and canary on
# package acceptance and artifact publication. No GitHub job artifacts carry
# release or canary files; commit claims transfer only their built packages via
# 7-day job artifacts (by producing artifact ID) to fresh controller-only staging
# runners so unreviewed commit code never owns recording or R2 staging. Non-publishing tag builds leave output on the runner.
# Commit builds stage under releases/commit/<sha>/ and write a run summary.
# They never publish a release, updater feed, Store submission, or APT channel.
# Admitted channel requests reuse those native build/smoke legs with read-only
# dependency caches. Their receipts use releases/channel-builds/<id>/; only the
# trusted publish-channel controller may CAS the channel after all smoke passes.
#
# Payload staging is `hermes pm bundle` on the native runner. There is
# no cross-target staging. The darwin legs sign (CSC_LINK) and notarize
# (afterSign notarize.mjs) when the release-signing environment carries the
# Apple credentials. Downloadable commit artifacts require the same signing
# checks as release artifacts. Unsigned tag builds cannot publish.
#
# scripts/bundles/desktop.py is the one driver. Local and CI run
# the same command. This workflow adds caching and upload only.
#
# Manual dispatch selects a tag or a pushed full commit. Commit dispatches
# use the default-branch workflow and require maintainer permission.
#
# Callers must dispatch with `secrets: inherit`: a called workflow receives
# no secrets by default, and a job-level `environment:` alone attaches the
# deployment and exposes `vars` but NOT that environment's secrets
# (actions/runner#1490).
#
# R2 secrets (repo-level or the release-signing environment): the R2
# account id + an R2 API token (S3-compatible) with read/write on the
# release bucket; CLOUDFLARE_R2_BUCKET and CLOUDFLARE_R2_PUBLIC_URL are
# non-secret vars. scripts/releases/r2.py derives the S3 endpoint from
# the account id. Upload/list operations need only Python; feed operations use ruamel.yaml.
#
# Windows Store submission (stable-store): MSStore CLI via
# microsoft/microsoft-store-apppublisher. Credentials live in the
# release-signing environment:
#     secrets: MS_STORE_TENANT_ID, MS_STORE_SELLER_ID, MS_STORE_CLIENT_ID,
#              MS_STORE_CLIENT_SECRET
#     vars:    MS_STORE_PRODUCT_ID (the Partner Center product ID)
#   msstore reconfigure → msstore publish
#   <Store-*.msixbundle> -id <productId>
# The Store bundle is UNSIGNED on purpose — Partner Center re-signs on
# ingestion (see sign-msix.mjs).

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      claim-tag:
        default: ''
        type: string
      claim-object:
        default: ''
        type: string
      release-phase:
        required: true
        type: string
      manifest-sha256:
        default: ''
        type: string
      jobs:
        description: 'Comma-separated job groups. Default: every group.'
        type: string
        default: 'darwin-arm64,win32-arm64,win32-x64,win32-bundle,linux-x64,linux-arm64,termux'
      skip-tests:
        description: 'Stable candidates only: build and stage without native smokes or in-build test suites (the claim has no smoke lane).'
        type: boolean
        default: false
      bundle_env:
        description: "A commit claim's baked bundle defaults (its claim bundleEnv); validate refuses anything else."
        type: string
        default: '{}'
      skip-signed:
        description: 'Stable candidates only: build no signed Windows package (the claim has no windows lane). Needs no Azure signing.'
        type: boolean
        default: false
      skip-store:
        description: 'Stable only: build no Microsoft Store bundle and submit none (the claim has no windows-store lane).'
        type: boolean
        default: false
      windows-smokes-with-bundle:
        description: 'Stable only: smoke the staged per-arch MSIX packages in the win32-bundle call, beside assembly, instead of after each per-arch build.'
        type: boolean
        default: false
    outputs:
      darwin-arm64-receipt-url:
        value: ${{ jobs.stage-receipt-darwin-arm64.outputs.receipt-url }}
        description: Immutable darwin-arm64 stable receipt
      darwin-arm64-receipt-sha256:
        value: ${{ jobs.stage-receipt-darwin-arm64.outputs.receipt-sha256 }}
        description: Digest of the darwin-arm64 stable receipt
      win32-bundle-receipt-url:
        value: ${{ jobs.assemble-win32-bundle.outputs.receipt-url }}
        description: Immutable win32-bundle stable receipt
      win32-bundle-receipt-sha256:
        value: ${{ jobs.assemble-win32-bundle.outputs.receipt-sha256 }}
        description: Digest of the win32-bundle stable receipt
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to bundle (vX.Y.Z or canary.YYYYMMDDTHHMMSSZ-vX.Y.Z). Must exist on the repo.'
        required: false
        type: string
        default: ''
      disposable_channel:
        description: 'Allocate a disposable preview from build_commit; prints a separate build dispatch. No native build in this run.'
        type: string
        default: ''
      disposable_receivers:
        description: 'Also allocate A/B and official-identity S/T test receivers in the fresh namespace; no releases.'
        type: boolean
        default: false
      disposable_run:
        description: 'Disposable allocation controller run id; the allocate step derives and overwrites it.'
        type: string
        default: ''
      channel:
        description: 'Preview channel name; this run allocates the channel and builds build_commit. Trusted default-branch dispatch only.'
        required: false
        type: string
        default: ''
      branding:
        description: 'Channel app name, icon and package ID: preview (own app) or stable (the regular Hermes app). Fixed when the channel is first created.'
        required: false
        type: choice
        options: [preview, stable]
        default: preview
      build_commit:
        description: 'Commit-only build: EXACT full 40-hex SHA already pushed to this repo (workflow_dispatch from the default branch only). Mutually exclusive with tag.'
        required: false
        type: string
        default: ''
      bundle_env:
        description: 'Commit desktop bundles only: JSON object of non-secret defaults (strings) or forced clears (null). Runtime values win over defaults, not clears.'
        required: false
        type: string
        default: '{}'
      jobs:
        description: 'Comma-separated job groups. Default: every group.'
        required: false
        type: string
        default: 'darwin-arm64,win32-arm64,win32-x64,win32-bundle,linux-x64,linux-arm64,termux'
      termux_upgrade_from_tag:
        description: 'Published release tag whose R2 Termux package must upgrade to this build'
        required: false
        type: string
        default: ''
      upload_release:
        description: 'Upload artifacts to the R2 release bucket (staging + feeds)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write

concurrency:
  # One dispatch: a disposable run's identity is its channel name, so a
  # re-dispatch of the same channel serializes instead of racing the namespace.
  group: desktop-bundled-release-${{ inputs.channel || inputs.disposable_channel || inputs.tag || inputs.build_commit || 'canary' }}-${{ inputs.release-phase || 'canary' }}-${{ inputs.jobs }}
  cancel-in-progress: false

env:
  # One dispatch: a disposable-mode run leases its namespace by run id alone
  # (no attempt suffix) so "re-run failed jobs" re-enters the same namespace.
  R2_DISPOSABLE_RUN: ${{ inputs.disposable_run || (inputs.disposable_channel != '' && github.run_id) || '' }}
  RELEASE_CLAIM_TAG: ${{ inputs.claim-tag }}
  RELEASE_CLAIM_OBJECT: ${{ inputs.claim-object }}

jobs:
  validate:
    name: Pre-build setup
    # One dispatch: in disposable mode the allocation steps run first (the
    # channel pin comes from them), then admission validates the build source.
    # A failed allocation fails this job and skips everything downstream.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    # Public root is an environment variable, not a repository variable. No
    # secret is injected into admission; downstream jobs consume its outputs.
    environment: release-signing
    # The archive step re-downloads every pinned input from R2 to verify its
    # sha256 (several GB: Chromium, llama.cpp CUDA builds). ~3 min on a normal
    # day; v0.22.4 rc.1 hit slow R2 reads and the old 5-minute cap cancelled
    # both Windows chains, and v0.23.1 rc.1 took 28 min on x64 and was
    # cancelled at 30 on arm64 (single files stalling 5-8 min). 60 matches the
    # standalone archive job it replaced.
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      # Resolve the build source once. Every privileged job uses this SHA,
      # not a mutable tag or the dispatch branch.
      # The tag's channel (stable | canary). build-darwin-arm64-release names
      # its staged per-arch feed yml after it.
      channel: ${{ steps.admission.outputs.channel }}
      sha: ${{ steps.admission.outputs.sha }}
      tag-object: ${{ steps.admission.outputs.tag-object }}
      payload-version: ${{ steps.admission.outputs.payload-version }}
      core-version: ${{ steps.admission.outputs.core-version }}
      legacy-commit-build: ${{ steps.admission.outputs.legacy-commit-build || 'false' }}
      release-epoch: ${{ steps.admission.outputs.release-epoch }}
      receiver-candidate: ${{ steps.admission.outputs.receiver-candidate }}
      public-root: ${{ steps.admission.outputs.public-root }}
      public-base: ${{ steps.admission.outputs.public-base }}
      # The archive ref: the attempt ref for stable phases, the payload tag
      # for canary and commit builds. Every releases/tag/<ref>/ write reads it.
      archive-tag: ${{ steps.admission.outputs.archive-tag }}
      # One admission-parsed switch per job group; every job gates on its own.
      darwin-arm64: ${{ steps.admission.outputs.darwin-arm64 }}
      win32-arm64: ${{ steps.admission.outputs.win32-arm64 }}
      win32-x64: ${{ steps.admission.outputs.win32-x64 }}
      win32-bundle: ${{ steps.admission.outputs.win32-bundle }}
      linux-x64: ${{ steps.admission.outputs.linux-x64 }}
      linux-arm64: ${{ steps.admission.outputs.linux-arm64 }}
      termux: ${{ steps.admission.outputs.termux }}
      # Every group selected: the joins that render or summarize a whole build.
      all-jobs: ${{ steps.admission.outputs.all-jobs }}
      channel-build: ${{ ((inputs.disposable_channel != '' || inputs.channel != '') && steps.allocate.outputs.channel_build) || '' }}
      channel-request-sha256: ${{ ((inputs.disposable_channel != '' || inputs.channel != '') && steps.allocate.outputs.channel_request_sha256) || '' }}
      disposable-run: ${{ (inputs.disposable_channel != '' && github.run_id) || inputs.disposable_run || '' }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ (inputs.build_commit != '' || inputs.channel != '' || inputs.release-phase != '') && github.sha || inputs.tag }}
          # Full checkout, always. Commit admission (require_pushed) needs the
          # full graph AND every pushed branch ref fetched into
          # refs/remotes/origin/* — a depth-1 checkout fetches only github.sha,
          # so it can't see the branch that actually carries build_commit.
          # Tag admission runs merge-base against origin/main and needs tags.
          fetch-depth: 0
          filter: blob:none
          fetch-tags: true

      - name: Print the release.py command for this run
        env:
          TAG: ${{ inputs.tag }}
          BUILD_COMMIT: ${{ inputs.build_commit }}
          CHANNEL: ${{ inputs.channel }}
          BRANDING: ${{ inputs.branding }}
          DISPOSABLE_CHANNEL: ${{ inputs.disposable_channel }}
          DISPOSABLE_RECEIVERS: ${{ inputs.disposable_receivers }}
          RELEASE_PHASE: ${{ inputs.release-phase }}
          UPLOAD_RELEASE: ${{ inputs.upload_release }}
          JOBS: ${{ inputs.jobs }}
          TERMUX_UPGRADE_FROM_TAG: ${{ inputs.termux_upgrade_from_tag }}
          BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -m scripts.releases.dispatch_log

      - name: Archive every pinned input
        # Runner Python is intentional: the toolchain's upstream may be gone.
        # Same checkout contract the standalone archive job had: the tag ref
        # for tag builds, the dispatch head for commit builds.
        if: inputs.disposable_run == '' && inputs.disposable_channel == '' && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
        run: python3 -m scripts.ci.archive_inputs

      - name: Set up native identity reader
        # product_identity() runs apps/desktop/product-identity.cjs: disposable
        # receivers need it, and so does a stable-branded channel before any
        # stable release has published a channel record to copy.
        if: (inputs.disposable_channel != '' && inputs.disposable_receivers) || inputs.branding == 'stable'
        uses: ./.github/actions/setup-pm
        with:
          toolchain: node
          cache-python: false
          archive-inputs: false
      - name: Allocate the channel and build its immutable request
        id: allocate
        if: inputs.disposable_channel != '' || inputs.channel != ''
        env:
          DISPOSABLE_CHANNEL: ${{ inputs.disposable_channel }}
          CHANNEL: ${{ inputs.channel }}
          BRANDING: ${{ inputs.branding }}
          DISPOSABLE_RECEIVERS: ${{ inputs.disposable_receivers }}
          BUILD_COMMIT: ${{ inputs.build_commit }}
          TAG: ${{ inputs.tag }}
          RELEASE_PHASE: ${{ inputs.release-phase }}
          JOBS: ${{ inputs.jobs }}
          TERMUX_UPGRADE_FROM_TAG: ${{ inputs.termux_upgrade_from_tag }}
          UPLOAD_RELEASE: ${{ inputs.upload_release }}
          BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
        run: python -m scripts.releases.channel_disposable

      - name: Validate tag shape, pyproject lockstep, and ancestry on origin/main
        id: admission
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CLAIM_TAG: ${{ inputs.claim-tag }}
          RELEASE_CLAIM_OBJECT: ${{ inputs.claim-object }}
          BUILD_COMMIT: ${{ inputs.build_commit }}
          CHANNEL_BUILD: ${{ steps.allocate.outputs.channel_build || '' }}
          CHANNEL_REQUEST_SHA256: ${{ steps.allocate.outputs.channel_request_sha256 || '' }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
          JOBS: ${{ inputs.jobs }}
          BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
          RELEASE_PHASE: ${{ inputs.release-phase }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPLOAD_RELEASE: ${{ inputs.upload_release }}
          TERMUX_UPGRADE_FROM_TAG: ${{ inputs.termux_upgrade_from_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${R2_DISPOSABLE_RUN:-}" ] && [ -z "${CHANNEL_BUILD:-}" ]; then
            echo '::error::disposable_run requires a pinned channel build'; exit 1
          fi
          # The one parser for the `jobs` input; every job gates on these outputs.
          python -m scripts.releases.job_groups >> "$GITHUB_OUTPUT"
          printf 'public-root=%s\npublic-base=%s\n' "$CLOUDFLARE_R2_PUBLIC_URL" "$CLOUDFLARE_R2_PUBLIC_URL" >> "$GITHUB_OUTPUT"
          printf 'archive-tag=%s\n' "${RELEASE_CLAIM_TAG:-$RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "${CHANNEL_BUILD:-}" ]; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ] || [ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/desktop-bundled-release.yml@refs/heads/$DEFAULT_BRANCH" ]; then
              echo '::error::channel builds require the default-branch dispatch workflow'; exit 1
            fi
            python -m scripts.releases.channel_publish admit
            exit 0
          fi
          if [ -n "$BUILD_COMMIT" ]; then
            # Reject mixed inputs before loading code from the checkout.
            if [ -n "$TAG" ] || [ -n "$RELEASE_PHASE" ] || [ -n "$TERMUX_UPGRADE_FROM_TAG" ] || [ "$UPLOAD_RELEASE" != false ]; then
              echo '::error::commit builds cannot select release publication or upgrade inputs'
              exit 1
            fi
            if ! [[ "$BUILD_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
              echo '::error::commit builds require an exact full SHA'
              exit 1
            fi
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ] || [ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/desktop-bundled-release.yml@refs/heads/$DEFAULT_BRANCH" ]; then
              echo '::error::commit builds require the default-branch dispatch workflow'
              exit 1
            fi
            python -m scripts.releases.commit_build admit
            exit 0
          fi
          # A commit claim's bundle defaults arrive in the candidate phase, where `stable verify`
          # requires them to equal its claim's bundleEnv; nothing else may carry them.
          if [ -n "${BUNDLE_ENV_JSON:-}" ] && [ "$BUNDLE_ENV_JSON" != '{}' ] && [ "$RELEASE_PHASE" != candidate ]; then
            echo '::error::bundle environment defaults require a commit build'; exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "::error::either tag or build_commit is required"; exit 1
          fi
          case "$RELEASE_PHASE" in
            candidate|publish)
              python -m scripts.releases.stable verify
              exit 0
              ;;
            '')
              # Every release tag runs the one Stable Release pipeline: release.py release for a
              # stable claim, release.py --canary (canary-release.yml) for a canary.
              echo '::error::Release tags build and publish through Stable Release, not a direct dispatch' >&2
              exit 1
              ;;
            *) echo 'Unknown release phase' >&2; exit 1 ;;
          esac

  # ── Windows builders (REAL) ───────────────────────────────────────────────
  # Windows assembly and publication depend on these native Windows legs.
  # Pinned-input archiving runs as a validate step with the job's own gate
  # shape, so a skipped archive must not skip the selected build legs.
  #
  # Cache permissions are literal job-token scopes, not checkout/save-step policy.
  # Share execution via anchors, and keep the original IDs as downstream gates.
  build-win32-x64-release:
    name: bundled win32-x64
    if: >-
      needs.validate.outputs.win32-x64 == 'true'
      && inputs.release-phase == 'candidate'
      && inputs.build_commit == '' && inputs.channel == ''
      && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.')
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    environment: release-signing
    cache-mode: write
    timeout-minutes: 900
    strategy: &win32-strategy
      fail-fast: false
      matrix:
        target:
          - label: win32-x64
            runner: blacksmith-32vcpu-windows-2025
    env: &win32-env
      CHANNEL_BUILD: ${{ needs.validate.outputs.channel-build }}
      HERMES_DESKTOP_VARIANT: bundled
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      RELEASE_CLAIM_TAG: ${{ inputs.claim-tag }}
      # Archive ref for handoff stage/fetch: attempt ref for stable phases.
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      # The commit identity: a tagless commit build's, or a commit claim's in the candidate phase
      # (commit.<stamp>-vX.Y.Z keeps the Commit<sha7> identity; its tag still versions the packages).
      HERMES_BUILD_COMMIT: ${{ (inputs.build_commit != '' && needs.validate.outputs.channel-build == '' && needs.validate.outputs.sha) || (inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.') && needs.validate.outputs.sha) || '' }}
      HERMES_RELEASE_COMMIT: ${{ inputs.release-phase != '' && needs.validate.outputs.sha || '' }}
      HERMES_PAYLOAD_VERSION: ${{ needs.validate.outputs.payload-version }}
      HERMES_CORE_VERSION: ${{ needs.validate.outputs.core-version }}
      LEGACY_COMMIT_BUILD: ${{ needs.validate.outputs.legacy-commit-build }}
      # Signature outputs are separate from the prepared dependency snapshot.
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
    steps: &win32-steps
      - name: Exclude build write paths from Defender scanning
        shell: powershell
        run: |
          $paths = @(
            $env:GITHUB_WORKSPACE,
            $env:RUNNER_TEMP
          )
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p
              Write-Host "Defender exclusion added for $p"
            } catch {
              Write-Host "Defender exclusion not applied for $p ($($_.Exception.Message)) - continuing"
            }
          }
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true
          } catch {
            Write-Host "Could not disable windows defender"
          }

      # Check out the SHA the validate job admitted — never the tag ref,
      # which a force-push can move between jobs. This is the privileged
      # (release-signing) build; it must run the reviewed bytes.
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: ${{ (inputs.build_commit != '' || needs.validate.outputs.channel-build != '') && 1 || 0 }}
          filter: blob:none
          fetch-tags: ${{ inputs.build_commit == '' && needs.validate.outputs.channel-build == '' }}
          persist-credentials: false

      - name: Check out trusted channel controller
        if: needs.validate.outputs.channel-build != ''
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ github.sha }}
          path: .build/channel-controller
          persist-credentials: false

      - name: Retrieve pinned channel request
        if: needs.validate.outputs.channel-build != ''
        shell: bash
        working-directory: .build/channel-controller
        env:
          CHANNEL_BUILD: ${{ needs.validate.outputs.channel-build }}
          CHANNEL_REQUEST_SHA256: ${{ needs.validate.outputs.channel-request-sha256 }}
        run: python -m scripts.releases.channel_publish request --out "$RUNNER_TEMP/channel-request.json"

      - name: Restore desktop dependency inputs
        id: build-cache
        uses: ./.github/actions/desktop-build-cache
        with:
          phase: restore
          source: ${{ github.workspace }}
          work: ${{ runner.temp }}/desktop-job
          cache: ${{ github.workspace }}/.cache/desktop-inputs
          producer: desktop

      - name: Prepare the complete desktop build
        id: prepare
        shell: bash
        env:
          HERMES_BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
        run: |
          args=(--tag "$HERMES_PAYLOAD_TAG")
          if [ -n "$HERMES_BUILD_COMMIT" ] && [ -z "$HERMES_PAYLOAD_TAG" ]; then args=(--commit "$HERMES_BUILD_COMMIT"); fi
          if [ -n "$HERMES_RELEASE_COMMIT" ]; then args+=(--release-commit "$HERMES_RELEASE_COMMIT"); fi
          if [ "${LEGACY_COMMIT_BUILD:-false}" = true ]; then
            unset HERMES_PAYLOAD_TAG
            export HERMES_PAYLOAD_VERSION="$HERMES_CORE_VERSION"
            args=(--commit "$HERMES_BUILD_COMMIT")
          fi
          if [ -n "${CHANNEL_BUILD:-}" ]; then args=(--channel-request "$RUNNER_TEMP/channel-request.json"); fi
          python scripts/bundles/desktop.py "${args[@]}" --variant bundled --prepare-only \
            --work "$RUNNER_TEMP/desktop-job" --cache "$GITHUB_WORKSPACE/.cache/desktop-inputs"
          python -m scripts.ci.desktop_commands "$RUNNER_TEMP/desktop-job/prepared.json"

      - name: Save dependency inputs before building
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && inputs.build_commit == '' && inputs.channel == '' && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.') }}
        uses: ./.github/actions/desktop-build-cache
        with:
          phase: save
          source: ${{ github.workspace }}
          work: ${{ runner.temp }}/desktop-job
          cache: ${{ github.workspace }}/.cache/desktop-inputs
          producer: desktop
          key: ${{ steps.build-cache.outputs.cache-key }}

      # Universal-bundle assembly reuses two small slices of this leg's preparation
      # rather than the multi-GB dependency snapshot: electron-builder's toolset
      # downloads (winCodeSign kit, ATS dlib, dotnet runtime; preparation points
      # ELECTRON_BUILDER_CACHE at packager/builder) and pnpm's store.
      # Commit builds hold a read-only cache token, so their save is skipped here.
      - name: Save the bundle-assembly caches
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && matrix.target.label == 'win32-x64' && inputs.build_commit == '' && inputs.channel == '' && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.cache/desktop-inputs/packager/builder
            ${{ github.workspace }}/.cache/desktop-inputs/pnpm/store
          key: win32-assembly-v1-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Restore verified payload signatures
        id: payload-signatures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/electron-builder-payload-signatures
          # Release runs save additions. Content and signing policy select entries.
          key: payload-signatures-v1-${{ runner.os }}-${{ matrix.target.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            payload-signatures-v1-${{ runner.os }}-${{ matrix.target.label }}-
            payload-signatures-v1-${{ runner.os }}-

      # Downloadable artifacts (commit builds, candidates, published tags,
      # channels) must be Authenticode-signed. Without the Azure Trusted
      # Signing vars the build only warns and ships UNSIGNED binaries, which
      # is right for a fork or a local build and wrong for a release.
      - name: Require Azure signing when publishing
        if: inputs.skip-signed != true && (inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '' || inputs.channel != '')
        shell: bash
        env:
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          missing=()
          for name in AZURE_SIGN_ENDPOINT AZURE_SIGN_ACCOUNT AZURE_SIGN_PROFILE AZURE_SIGN_PUBLISHER AZURE_CLIENT_ID AZURE_TENANT_ID; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::required Azure Trusted Signing vars are missing from release-signing: ${missing[*]}"
            exit 1
          fi

      - name: Azure login (OIDC)
        if: vars.AZURE_CLIENT_ID != '' && inputs.skip-signed != true
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Mint federated token for the signing dlib
        if: vars.AZURE_CLIENT_ID != '' && inputs.skip-signed != true
        shell: bash
        run: |
          file="$RUNNER_TEMP/azure-federated-token"
          mint() {
            curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
              | jq -r .value > "$file.tmp" && mv -f "$file.tmp" "$file"
          }
          mint
          ( while sleep 240; do mint || true; done ) &
          echo "AZURE_FEDERATED_TOKEN_FILE=$file" >> "$GITHUB_ENV"

      - name: Build and package
        shell: powershell
        timeout-minutes: 900
        # A Store-only build gets no signing vars: after-pack and electron-builder sign payload binaries
        # whenever they are set, and this job skips the Azure login that would let them.
        env:
          HERMES_BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
          PYTHONUTF8: '1'
          AZURE_SIGN_ENDPOINT: ${{ inputs.skip-signed != true && vars.AZURE_SIGN_ENDPOINT || '' }}
          AZURE_SIGN_ACCOUNT: ${{ inputs.skip-signed != true && vars.AZURE_SIGN_ACCOUNT || '' }}
          AZURE_SIGN_PROFILE: ${{ inputs.skip-signed != true && vars.AZURE_SIGN_PROFILE || '' }}
          AZURE_SIGN_PUBLISHER: ${{ inputs.skip-signed != true && vars.AZURE_SIGN_PUBLISHER || '' }}
          AZURE_CLIENT_ID: ${{ inputs.skip-signed != true && vars.AZURE_CLIENT_ID || '' }}
          AZURE_TENANT_ID: ${{ inputs.skip-signed != true && vars.AZURE_TENANT_ID || '' }}
          AZURE_TOKEN_CREDENTIALS: prod
          SKIP_SIGNED: ${{ inputs.skip-signed }}
          SKIP_STORE: ${{ inputs.skip-store }}
          RELEASE_PHASE: ${{ inputs.release-phase }}
        run: |
          if ($env:LEGACY_COMMIT_BUILD -eq 'true') {
              Remove-Item Env:HERMES_PAYLOAD_TAG -ErrorAction SilentlyContinue
              $env:HERMES_PAYLOAD_VERSION = $env:HERMES_CORE_VERSION
          }
          if ($env:SKIP_SIGNED -ne 'true') {
              python scripts/bundles/desktop.py --prepared "$env:RUNNER_TEMP/desktop-job/prepared.json" --variant bundled
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # A canary candidate (the Stable Release pipeline in canary mode) builds the Store package
          # like any candidate; only the legacy direct canary dispatch leaves it out.
          if ($env:SKIP_STORE -ne 'true' -and -not $env:CHANNEL_BUILD -and -not $env:HERMES_BUILD_COMMIT -and ($env:RELEASE_PHASE -eq 'candidate' -or $env:HERMES_PAYLOAD_TAG -notlike "canary.*")) {
              python scripts/bundles/desktop.py --prepared "$env:RUNNER_TEMP/desktop-job/prepared.json" --variant store
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify native signature cache contracts
        if: inputs.skip-tests != true
        shell: bash
        working-directory: apps/desktop
        run: node node_modules/vitest/vitest.mjs run --project electron scripts/payload-sign-cache.test.mjs scripts/batch-sign-binaries.test.mjs

      # Commit jobs share these steps but have read-only cache tokens.
      - name: Save verified payload signatures
        if: inputs.build_commit == '' && inputs.channel == '' && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/electron-builder-payload-signatures
          key: ${{ steps.payload-signatures.outputs.cache-primary-key }}

      - name: Audit bundle architecture
        shell: bash
        run: |
          MATRIX_LABEL="${{ matrix.target.label }}"
          node apps/desktop/scripts/audit-bundle-arch.mjs \
            --arch="${MATRIX_LABEL##*-}" --root=apps/desktop/release

      - name: Record and stage channel windows packages
        if: needs.validate.outputs.channel-build != ''
        shell: bash
        working-directory: .build/channel-controller
        env:
          TARGET: ${{ matrix.target.label }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          root="$GITHUB_WORKSPACE/apps/desktop/release"
          python -m scripts.bundles.release_artifacts record --platform windows --arch "${TARGET##*-}" \
            --root "$root" --commit "$RELEASE_COMMIT" --channel-request "$RUNNER_TEMP/channel-request.json" \
            --out "$root/metadata-windows-${TARGET##*-}.json"
          python -m scripts.releases.handoff stage --channel-request "$RUNNER_TEMP/channel-request.json" \
            --name "$TARGET" --root "$root" --include '*.msix' --include 'metadata-*.json'

      - name: Stage Windows packages to R2
        # A channel dispatch carries build_commit as provenance, not as the
        # receipt mode: its packages are staged by the pinned channel request
        # step above, and HERMES_PAYLOAD_TAG/HERMES_BUILD_COMMIT are both
        # empty here. Commit claims stage on a fresh controller-only runner.
        if: needs.validate.outputs.channel-build == '' && !(inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.')) && (inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '')
        shell: bash
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          TARGET: ${{ matrix.target.label }}
          RELEASE_PHASE: ${{ inputs.release-phase }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          SKIP_SIGNED: ${{ inputs.skip-signed }}
        # The tag archive is the handoff, never an update feed. The receipt
        # appears after the selected packages (including Store on stable) upload.
        # A Store-only candidate has no signed package to describe, so no metadata.
        run: |
          root="$GITHUB_WORKSPACE/apps/desktop/release"
          args=(--include '*.msix')
          if [ "$SKIP_SIGNED" != true ] && { [ "$RELEASE_PHASE" = candidate ] || { [ "$HERMES_DESKTOP_VARIANT" = bundled ] && [[ "$HERMES_PAYLOAD_TAG" == canary.* ]]; }; }; then
            python -m scripts.bundles.release_artifacts record --platform windows --arch "${TARGET##*-}" \
              --root "$root" --tag "$HERMES_PAYLOAD_TAG" --commit "$RELEASE_COMMIT" \
              --out "$root/metadata-windows-${TARGET##*-}.json"
            args+=(--include 'metadata-*.json')
          fi
          if [ -n "$HERMES_BUILD_COMMIT" ] && [ -z "$HERMES_PAYLOAD_TAG" ]; then
            # Commit-only mode: schema-2 receipts under releases/commit/<sha>/.
            python -m scripts.releases.handoff stage --commit-build "$HERMES_BUILD_COMMIT" \
              --commit "$RELEASE_COMMIT" \
              --name "$TARGET" --root "$root" "${args[@]}"
          else
            python -m scripts.releases.handoff stage --tag "${HERMES_ARCHIVE_TAG:-$HERMES_PAYLOAD_TAG}" --commit "$RELEASE_COMMIT" \
              --name "$TARGET" --root "$root" "${args[@]}"
          fi

      - name: Upload commit claim artifacts for staging
        # Commit claims record and stage on a fresh controller-only runner so unreviewed
        # build code can never tamper with controller scripts or spoof sidecar metadata.
        id: commit_artifact
        if: inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commit-claim-${{ matrix.target.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/release/*.msix
            !apps/desktop/release/Store-*.msix
          if-no-files-found: error
          retention-days: 7

  build-win32-arm64-release:
    name: bundled win32-arm64
    if: >-
      needs.validate.outputs.win32-arm64 == 'true'
      && inputs.release-phase == 'candidate'
      && inputs.build_commit == '' && inputs.channel == ''
      && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.')
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    environment: release-signing
    cache-mode: write
    timeout-minutes: 900
    strategy: &win32-strategy-arm64
      fail-fast: false
      matrix:
        target:
          - label: win32-arm64
            runner: windows-latest-32-arm-core
    env: *win32-env
    steps: *win32-steps

  build-win32-x64-commit:
    name: bundled win32-x64 (commit)
    if: >-
      !cancelled() && needs.validate.result == 'success'
      && needs.validate.outputs.win32-x64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && (inputs.build_commit != '' || inputs.channel != '' || startsWith(inputs.tag, 'commit.') || startsWith(inputs.tag, 'channel.'))
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    environment: release-signing
    cache-mode: read
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 900
    outputs:
      commit-artifact-id: ${{ steps.commit_artifact.outputs.artifact-id }}
    strategy: *win32-strategy
    env: *win32-env
    steps: *win32-steps

  build-win32-arm64-commit:
    name: bundled win32-arm64 (commit)
    if: >-
      !cancelled() && needs.validate.result == 'success'
      && needs.validate.outputs.win32-arm64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && (inputs.build_commit != '' || inputs.channel != '' || startsWith(inputs.tag, 'commit.') || startsWith(inputs.tag, 'channel.'))
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    environment: release-signing
    cache-mode: read
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 900
    outputs:
      commit-artifact-id: ${{ steps.commit_artifact.outputs.artifact-id }}
    strategy: *win32-strategy-arm64
    env: *win32-env
    steps: *win32-steps

  stage-commit-win32-x64:
    name: stage win32-x64 commit claim
    needs: [validate, build-win32-x64-commit]
    if: >-
      !cancelled() && needs.validate.result == 'success'
      && needs.validate.outputs.win32-x64 == 'true'
      && inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.')
      && needs.build-win32-x64-commit.result == 'success'
    runs-on: blacksmith-2vcpu-windows-2025
    environment: release-signing
    cache-mode: read
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      TARGET: win32-x64
      COMMIT_ARTIFACT_ID: ${{ needs.build-win32-x64-commit.outputs.commit-artifact-id }}
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
      LEGACY_COMMIT_BUILD: ${{ needs.validate.outputs.legacy-commit-build }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
    steps: &stage-commit-win32-steps
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          archive-inputs: false
          cache-python: false
          cache-node: false
          save-tools-cache: false
      - name: Require one numeric commit-claim artifact ID
        shell: bash
        run: |
          if [[ ! "${COMMIT_ARTIFACT_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::expected one positive numeric commit-claim artifact ID, got '${COMMIT_ARTIFACT_ID:-}'"
            exit 1
          fi
      - name: Download commit claim artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ env.COMMIT_ARTIFACT_ID }}
          merge-multiple: true
          path: staged-artifacts
      # Reading the unreviewed leg's packages never holds the R2 secrets; only the upload does.
      - name: Record commit claim Windows packages
        shell: bash
        run: |
          root="$GITHUB_WORKSPACE/staged-artifacts"
          # Only the built packages: the build leg ran the claimed code, which can rewrite its upload.
          # The recorder reads the one non-Store MSIX for this arch; nothing else may be staged.
          unexpected="$(find "$root" -mindepth 1 \( -type d -o -type l -o -name '.*' -o -name 'Store-*' -o ! -name "*-win-${TARGET##*-}.msix" \) -print)"
          if [ -n "$unexpected" ]; then echo "::error::unexpected commit-claim artifact entries: $unexpected"; exit 1; fi
          record_args=()
          if [ "${LEGACY_COMMIT_BUILD:-false}" = true ]; then record_args+=(--legacy-commit-build); fi
          python -m scripts.bundles.release_artifacts record --platform windows --arch "${TARGET##*-}" \
            --root "$root" --tag "$HERMES_PAYLOAD_TAG" --commit "$RELEASE_COMMIT" \
            "${record_args[@]}" \
            --out "$root/metadata-windows-${TARGET##*-}.json"
      - name: Stage commit claim Windows packages to R2
        shell: bash
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          root="$GITHUB_WORKSPACE/staged-artifacts"
          python -m scripts.releases.handoff stage --tag "${HERMES_ARCHIVE_TAG:-$HERMES_PAYLOAD_TAG}" --commit "$RELEASE_COMMIT" \
            --name "$TARGET" --root "$root" --include '*.msix' --include "metadata-windows-${TARGET##*-}.json"

  stage-commit-win32-arm64:
    name: stage win32-arm64 commit claim
    needs: [validate, build-win32-arm64-commit]
    if: >-
      !cancelled() && needs.validate.result == 'success'
      && needs.validate.outputs.win32-arm64 == 'true'
      && inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.')
      && needs.build-win32-arm64-commit.result == 'success'
    runs-on: blacksmith-2vcpu-windows-2025
    environment: release-signing
    cache-mode: read
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      TARGET: win32-arm64
      COMMIT_ARTIFACT_ID: ${{ needs.build-win32-arm64-commit.outputs.commit-artifact-id }}
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
      LEGACY_COMMIT_BUILD: ${{ needs.validate.outputs.legacy-commit-build }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
    steps: *stage-commit-win32-steps

  build-win32-x64:
    name: bundled win32-x64 result
    # always() crosses the deliberately skipped trust branch; failed admission
    # still skips this result, just as it skipped the original native builder.
    if: >-
      always() && needs.validate.outputs.win32-x64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && needs.validate.result == 'success'
    # The trust-branch legs are read through needs.*.result below, so they must
    # stay in the list — the result job gates on their outcomes, not its own.
    needs: [validate, build-win32-x64-release, build-win32-x64-commit, stage-commit-win32-x64]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {}
    timeout-minutes: 5
    env:
      SELECTED_BUILD_SUCCEEDED: >-
        ${{ (inputs.build_commit == '' && inputs.channel == '' && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.') && needs.build-win32-x64-release.result == 'success' && needs.build-win32-x64-commit.result == 'skipped' && needs.stage-commit-win32-x64.result == 'skipped')
          || (inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.') && needs.build-win32-x64-commit.result == 'success' && needs.stage-commit-win32-x64.result == 'success' && needs.build-win32-x64-release.result == 'skipped')
          || (!(inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.')) && (inputs.build_commit != '' || inputs.channel != '' || startsWith(inputs.tag, 'commit.') || startsWith(inputs.tag, 'channel.')) && needs.build-win32-x64-commit.result == 'success' && needs.stage-commit-win32-x64.result == 'skipped' && needs.build-win32-x64-release.result == 'skipped') }}
    steps: &native-build-result-steps
      - name: Require exactly the selected native build to succeed
        shell: bash
        run: |
          if [ "$SELECTED_BUILD_SUCCEEDED" != "true" ]; then
            echo "::error::selected native build did not succeed, or the other trust branch was not skipped"
            exit 1
          fi

  build-win32-arm64:
    name: bundled win32-arm64 result
    # always() crosses the deliberately skipped trust branch; failed admission
    # still skips this result, just as it skipped the original native builder.
    if: >-
      always() && needs.validate.outputs.win32-arm64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && needs.validate.result == 'success'
    # The trust-branch legs are read through needs.*.result below, so they must
    # stay in the list — the result job gates on their outcomes, not its own.
    needs: [validate, build-win32-arm64-release, build-win32-arm64-commit, stage-commit-win32-arm64]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {}
    timeout-minutes: 5
    env:
      SELECTED_BUILD_SUCCEEDED: >-
        ${{ (inputs.build_commit == '' && inputs.channel == '' && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.') && needs.build-win32-arm64-release.result == 'success' && needs.build-win32-arm64-commit.result == 'skipped' && needs.stage-commit-win32-arm64.result == 'skipped')
          || (inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.') && needs.build-win32-arm64-commit.result == 'success' && needs.stage-commit-win32-arm64.result == 'success' && needs.build-win32-arm64-release.result == 'skipped')
          || (!(inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.')) && (inputs.build_commit != '' || inputs.channel != '' || startsWith(inputs.tag, 'commit.') || startsWith(inputs.tag, 'channel.')) && needs.build-win32-arm64-commit.result == 'success' && needs.stage-commit-win32-arm64.result == 'skipped' && needs.build-win32-arm64-release.result == 'skipped') }}
    steps: *native-build-result-steps

  # ── macOS builders (REAL) ──────────────────────────────────────────────────
  # Native Apple Silicon darwin build via scripts/bundles/desktop.py (the
  # one driver: same `--mac dmg zip` pass a local mac build runs); there is
  # no Intel macOS leg. It signs (CSC_LINK) and notarizes (afterSign
  # notarize.mjs) when the release-signing environment carries the Apple
  # credentials; a publishing run FAILS the leg instead of shipping unsigned
  # (no silent unsigned publish). Binaries stage to releases/tag/<tag>/; the
  # arch-prefixed feed yml stages beside them and stable-release.yml's
  # publication pass merges releases/darwin/<channel>/<channel>-mac.yml.
  build-darwin-arm64-release:
    name: bundled darwin-arm64
    if: >-
      needs.validate.outputs.darwin-arm64 == 'true'
      && inputs.release-phase == 'candidate'
      && inputs.build_commit == '' && inputs.channel == ''
      && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.')
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    environment: release-signing
    cache-mode: write
    timeout-minutes: 360
    strategy: &darwin-strategy
      fail-fast: false
      matrix:
        target:
          - label: darwin-arm64
            runner: macos-15
    env: &darwin-env
      CHANNEL_BUILD: ${{ needs.validate.outputs.channel-build }}
      HERMES_DESKTOP_VARIANT: bundled
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      RELEASE_CLAIM_TAG: ${{ inputs.claim-tag }}
      # Archive ref for handoff stage/fetch: attempt ref for stable phases.
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      # The commit identity: a tagless commit build's, or a commit claim's in the candidate phase
      # (commit.<stamp>-vX.Y.Z keeps the Commit<sha7> identity; its tag still versions the packages).
      HERMES_BUILD_COMMIT: ${{ (inputs.build_commit != '' && needs.validate.outputs.channel-build == '' && needs.validate.outputs.sha) || (inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.') && needs.validate.outputs.sha) || '' }}
      HERMES_RELEASE_COMMIT: ${{ inputs.release-phase != '' && needs.validate.outputs.sha || '' }}
      HERMES_PAYLOAD_VERSION: ${{ needs.validate.outputs.payload-version }}
      HERMES_CORE_VERSION: ${{ needs.validate.outputs.core-version }}
      LEGACY_COMMIT_BUILD: ${{ needs.validate.outputs.legacy-commit-build }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
    steps: &darwin-steps
      - name: Disable Spotlight indexing for DMG staging
        # Spotlight indexes the freshly-mounted dmg staging image past
        # hdiutil's detach retries (per-VM, not a cross-job race).
        shell: bash
        run: |
          sudo mdutil -a -i off || true

      # Check out the SHA the validate job admitted — never the tag ref,
      # which a force-push can move between jobs. This is the privileged
      # (release-signing) build; it must run the reviewed bytes.
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          # Channel/commit builds derive versions from the request/env, not
          # git tags; tag builds need tags for the canary MSIX number.
          fetch-depth: ${{ (inputs.build_commit != '' || needs.validate.outputs.channel-build != '') && 1 || 0 }}
          filter: blob:none
          fetch-tags: ${{ inputs.build_commit == '' && needs.validate.outputs.channel-build == '' }}
          persist-credentials: false

      - name: Check out trusted channel controller
        # Release candidates take the notarization preflight from here too: the
        # admitted release commit can predate scripts/ci/check_macos_notary_auth.py.
        if: >-
          needs.validate.outputs.channel-build != ''
          || (inputs.release-phase == 'candidate' && inputs.build_commit == '' && inputs.channel == '')
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ github.sha }}
          path: .build/channel-controller
          persist-credentials: false

      - name: Retrieve pinned channel request
        if: needs.validate.outputs.channel-build != ''
        shell: bash
        working-directory: .build/channel-controller
        env:
          CHANNEL_BUILD: ${{ needs.validate.outputs.channel-build }}
          CHANNEL_REQUEST_SHA256: ${{ needs.validate.outputs.channel-request-sha256 }}
        run: python -m scripts.releases.channel_publish request --out "$RUNNER_TEMP/channel-request.json"

      - name: Restore desktop dependency inputs
        id: build-cache
        uses: ./.github/actions/desktop-build-cache
        with:
          phase: restore
          source: ${{ github.workspace }}
          work: ${{ runner.temp }}/desktop-job
          cache: ${{ github.workspace }}/.cache/desktop-inputs
          producer: desktop

      - name: Prepare the complete desktop build
        id: prepare
        shell: bash
        env:
          HERMES_BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
        run: |
          args=(--tag "$HERMES_PAYLOAD_TAG")
          if [ -n "$HERMES_BUILD_COMMIT" ] && [ -z "$HERMES_PAYLOAD_TAG" ]; then args=(--commit "$HERMES_BUILD_COMMIT"); fi
          if [ -n "$HERMES_RELEASE_COMMIT" ]; then args+=(--release-commit "$HERMES_RELEASE_COMMIT"); fi
          if [ "${LEGACY_COMMIT_BUILD:-false}" = true ]; then
            unset HERMES_PAYLOAD_TAG
            export HERMES_PAYLOAD_VERSION="$HERMES_CORE_VERSION"
            args=(--commit "$HERMES_BUILD_COMMIT")
          fi
          if [ -n "${CHANNEL_BUILD:-}" ]; then args=(--channel-request "$RUNNER_TEMP/channel-request.json"); fi
          python3 scripts/bundles/desktop.py "${args[@]}" --variant bundled --prepare-only \
            --work "$RUNNER_TEMP/desktop-job" --cache "$GITHUB_WORKSPACE/.cache/desktop-inputs"
          python3 -m scripts.ci.desktop_commands "$RUNNER_TEMP/desktop-job/prepared.json"

      - name: Save dependency inputs before building
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && inputs.build_commit == '' && inputs.channel == '' && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.') }}
        uses: ./.github/actions/desktop-build-cache
        with:
          phase: save
          source: ${{ github.workspace }}
          work: ${{ runner.temp }}/desktop-job
          cache: ${{ github.workspace }}/.cache/desktop-inputs
          producer: desktop
          key: ${{ steps.build-cache.outputs.cache-key }}

      # Commit artifacts are downloadable too. Require signing for them,
      # candidates, and published tags before building any payload.
      - name: Require signing credentials when publishing
        if: inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '' || inputs.channel != ''
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          [ -z "$CSC_LINK" ] && missing+=(CSC_LINK)
          [ -z "$CSC_KEY_PASSWORD" ] && missing+=(CSC_KEY_PASSWORD)
          [ -z "$APPLE_API_KEY_P8" ] && missing+=(APPLE_API_KEY_P8)
          [ -z "$APPLE_API_KEY_ID" ] && missing+=(APPLE_API_KEY_ID)
          [ -z "$APPLE_API_ISSUER" ] && missing+=(APPLE_API_ISSUER)
          [ -z "$CLOUDFLARE_R2_PUBLIC_URL" ] && missing+=(CLOUDFLARE_R2_PUBLIC_URL)
          [ -z "$CLOUDFLARE_R2_BUCKET" ] && missing+=(CLOUDFLARE_R2_BUCKET)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::required signing/notarization credentials are missing from release-signing: ${missing[*]}"
            exit 1
          fi

      - name: Write App Store Connect key for notarytool
        # notarytool takes a FILE PATH for --key; raw .p8 content in argv
        # dies with `Invalid option: ***`. The build step must NOT re-declare
        # APPLE_API_KEY in its env: step env shadows GITHUB_ENV.
        if: inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '' || inputs.channel != ''
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"

      - name: Verify App Store Connect credentials for notarytool
        # Fail in seconds instead of after building and signing (~10 min) when
        # the App Store Connect API key in release-signing is revoked,
        # malformed, or missing a legal agreement (HTTP 401/403). Transient
        # Apple 5xx / network blips warn and continue so Build and package
        # keeps its retry path. Must NOT re-declare APPLE_API_KEY in step env.
        if: inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '' || inputs.channel != ''
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -f .build/channel-controller/scripts/ci/check_macos_notary_auth.py ]; then
            python .build/channel-controller/scripts/ci/check_macos_notary_auth.py
          elif [ -f scripts/ci/check_macos_notary_auth.py ]; then
            python -m scripts.ci.check_macos_notary_auth
          elif [ -n "$HERMES_BUILD_COMMIT" ]; then
            echo "::warning::scripts/ci/check_macos_notary_auth.py not present in commit $HERMES_BUILD_COMMIT; skipping notarization credential preflight"
          else
            echo "::error::scripts/ci/check_macos_notary_auth.py is missing from the release checkout"
            exit 1
          fi

      - name: Select Xcode 26 for the macOS 26 layered icon
        # electron-builder compiles apps/desktop/assets/icon.icon to Assets.car
        # with actool, which only Xcode >= 26 ships; the runner image keeps an
        # older Xcode selected. Without this the config silently packages the
        # .icns alone (apps/desktop/scripts/mac-icon.cjs), so assert it here.
        shell: bash
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::no Xcode 26 on this runner; the macOS 26 layered icon cannot be compiled"
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$xcode/Contents/Developer"
          version="$(actool --version | python3 -c 'import plistlib, sys; print(plistlib.loads(sys.stdin.buffer.read())["com.apple.actool.version"]["short-bundle-version"])')"
          echo "actool $version from $xcode"
          case "$version" in
            2[6-9].*|[3-9][0-9].*) ;;
            *) echo "::error::actool $version cannot compile .icon packages (need >= 26)"; exit 1 ;;
          esac

      # Developer ID signatures of loose payload binaries, keyed by their unsigned
      # bytes (apps/desktop/scripts/mac-sign-cache.mjs); every restored file is
      # re-verified with codesign before use. Commit builds read it with a read-only
      # cache token and cannot save it.
      # Saved under a hash of its own contents, so restore takes the newest by prefix.
      - name: Restore verified macOS payload signatures
        id: mac-signatures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/mac-payload-signatures
          key: mac-signatures-v1-${{ matrix.target.label }}
          restore-keys: mac-signatures-v1-${{ matrix.target.label }}-

      - name: Disable QUIC (UDP 443) for the rest of the job
        # stapler fetches the notarization ticket from api.apple-cloudkit.com over
        # HTTP/3, and on GitHub's macOS runners those QUIC connections drop: the
        # staple, and `stapler validate` in the verify step, exit 68 with
        # NSURLErrorDomain -1005 (actions/runner-images#14924). This rejects outbound
        # UDP 443 for every process for the rest of the job, so stapler, notarytool and
        # the build's own downloads and uploads all fall back to TCP. The rule loads into
        # a com.apple sub-anchor, which the runner's default ruleset already evaluates,
        # so that ruleset stays as it is. The darwin matrix is Apple Silicon only, so
        # every leg needs it.
        shell: bash
        run: |
          echo 'block return out quick proto udp to any port 443' | sudo pfctl -a com.apple/hermes-no-quic -f -
          sudo pfctl -E
          sudo pfctl -a com.apple/hermes-no-quic -sr

      - name: Build and package
        shell: bash
        timeout-minutes: 330
        env:
          HERMES_BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
          HERMES_MAC_SIGNATURE_CACHE: ${{ github.workspace }}/.cache/mac-payload-signatures
          PYTHONUTF8: '1'
          # electron-osx-sign*/electron-notarize* keep the sign+notarize
          # phase visible: without them NOTHING logs between "signing
          # file=..." and a queue-wait timeout, so a slow notary queue is
          # indistinguishable from a hang.
          DEBUG: 'electron-osx-sign*,electron-notarize*'
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Sign + notarize of a bundled-payload app runs long (Apple scans
          # every Mach-O) — raise the fd limit and let DEBUG show progress.
          ulimit -n 16384 2>/dev/null || true
          echo "file descriptor limit: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
          if [ "${LEGACY_COMMIT_BUILD:-false}" = true ]; then
            unset HERMES_PAYLOAD_TAG
            export HERMES_PAYLOAD_VERSION="$HERMES_CORE_VERSION"
          fi
          python scripts/bundles/desktop.py --prepared "$RUNNER_TEMP/desktop-job/prepared.json" --variant bundled

      - name: Audit bundle architecture
        shell: bash
        run: |
          MATRIX_LABEL="${{ matrix.target.label }}"
          node apps/desktop/scripts/audit-bundle-arch.mjs \
            --arch="${MATRIX_LABEL##*-}" --root=apps/desktop/release

      - name: Verify the build is signed and notarized
        # The backstop against a silent unsigned publish: assess the packed
        # app against the real Gatekeeper policy (requires a Developer ID
        # signature AND a stapled notarization ticket to pass offline).
        if: inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '' || inputs.channel != ''
        shell: bash
        run: |
          shopt -s nullglob
          apps=(apps/desktop/release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::no packed .app found under apps/desktop/release to verify"
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl -a -vv -t exec "$app"
            echo "signed + notarized: $app"
          done

      # Only signatures from a build Apple notarized are kept for the next run,
      # and only when this build signed something the restored entry lacked.
      - name: Save verified macOS payload signatures
        if: ${{ success() && inputs.build_commit == '' && inputs.channel == '' && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.') && (inputs.upload_release == true || inputs.release-phase == 'candidate') && hashFiles('.cache/mac-payload-signatures/**') != '' && steps.mac-signatures.outputs.cache-matched-key != format('mac-signatures-v1-{0}-{1}', matrix.target.label, hashFiles('.cache/mac-payload-signatures/**')) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/mac-payload-signatures
          key: mac-signatures-v1-${{ matrix.target.label }}-${{ hashFiles('.cache/mac-payload-signatures/**') }}

      - name: Rename the feed yml per arch
        # A commit build has no feed (product identity channel null), so there is no yml to rename.
        if: (inputs.upload_release == true || inputs.release-phase == 'candidate') && !startsWith(inputs.tag, 'commit.')
        # electron-builder writes the channel feed yml (stable-mac.yml /
        # canary-mac.yml); prefix the arch, the name finalize expects when it
        # writes <channel>-mac.yml after the native leg passes. The
        # channel token is preserved verbatim in the staged name
        # (arm64-stable-mac.yml / arm64-canary-mac.yml).
        shell: bash
        run: |
          shopt -s nullglob
          MATRIX_LABEL="${{ matrix.target.label }}"
          arch="${MATRIX_LABEL##*-}"
          channel="${{ needs.validate.outputs.channel }}"
          f="apps/desktop/release/${channel}-mac.yml"
          test -s "$f"
          mv "$f" "apps/desktop/release/${arch}-${channel}-mac.yml"

      - name: Record and stage channel macos packages
        if: needs.validate.outputs.channel-build != ''
        shell: bash
        working-directory: .build/channel-controller
        env:
          TARGET: ${{ matrix.target.label }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          root="$GITHUB_WORKSPACE/apps/desktop/release"
          python -m scripts.bundles.release_artifacts record --platform macos --arch "${TARGET##*-}" \
            --root "$root" --commit "$RELEASE_COMMIT" --channel-request "$RUNNER_TEMP/channel-request.json" \
            --out "$root/metadata-macos-${TARGET##*-}.json"
          python -m scripts.releases.handoff stage --channel-request "$RUNNER_TEMP/channel-request.json" \
            --name "$TARGET" --root "$root" --include '*.dmg' --include '*.zip' --include '*.blockmap' --include 'metadata-*.json'

      - name: Stage macOS packages and feed inputs to R2
        # Channel dispatches stage through the pinned request step above; commit
        # claims stage on a fresh controller-only runner.
        if: needs.validate.outputs.channel-build == '' && !(inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.')) && (inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '')
        shell: bash
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          TARGET: ${{ matrix.target.label }}
          RELEASE_PHASE: ${{ inputs.release-phase }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
        # The feed input stays in the tag archive until the leg and its smoke pass.
        run: |
          root="$GITHUB_WORKSPACE/apps/desktop/release"
          args=(--include '*.dmg' --include '*.zip' --include '*.blockmap' --include '*-mac.yml')
          if [ "$RELEASE_PHASE" = candidate ] || { [ "$HERMES_DESKTOP_VARIANT" = bundled ] && [[ "$HERMES_PAYLOAD_TAG" == canary.* ]]; }; then
            python -m scripts.bundles.release_artifacts record --platform macos --arch "${TARGET##*-}" \
              --root "$root" --tag "$HERMES_PAYLOAD_TAG" --commit "$RELEASE_COMMIT" \
              --out "$root/metadata-macos-${TARGET##*-}.json"
            args+=(--include 'metadata-*.json')
          fi
          if [ -n "$HERMES_BUILD_COMMIT" ] && [ -z "$HERMES_PAYLOAD_TAG" ]; then
            # Commit-only mode: binaries only — no feed yml exists without a tag.
            python -m scripts.releases.handoff stage --commit-build "$HERMES_BUILD_COMMIT" \
              --commit "$RELEASE_COMMIT" \
              --name "$TARGET" --root "$root" \
              --include '*.dmg' --include '*.zip' --include '*.blockmap'
          else
            python -m scripts.releases.handoff stage --tag "${HERMES_ARCHIVE_TAG:-$HERMES_PAYLOAD_TAG}" --commit "$RELEASE_COMMIT" \
              --name "$TARGET" --root "$root" "${args[@]}"
          fi

      - name: Upload commit claim artifacts for staging
        id: commit_artifact
        if: inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commit-claim-${{ matrix.target.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  build-darwin-arm64-commit:
    name: bundled darwin-arm64 (commit)
    if: >-
      !cancelled() && needs.validate.result == 'success'
      && needs.validate.outputs.darwin-arm64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && (inputs.build_commit != '' || inputs.channel != '' || startsWith(inputs.tag, 'commit.') || startsWith(inputs.tag, 'channel.'))
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    environment: release-signing
    cache-mode: read
    permissions:
      contents: read
    timeout-minutes: 360
    outputs:
      commit-artifact-id: ${{ steps.commit_artifact.outputs.artifact-id }}
    strategy: *darwin-strategy
    env: *darwin-env
    steps: *darwin-steps

  stage-commit-darwin-arm64:
    name: stage darwin-arm64 commit claim
    needs: [validate, build-darwin-arm64-commit]
    if: >-
      !cancelled() && needs.validate.result == 'success'
      && needs.validate.outputs.darwin-arm64 == 'true'
      && inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.')
      && needs.build-darwin-arm64-commit.result == 'success'
    runs-on: macos-15
    environment: release-signing
    cache-mode: read
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      TARGET: darwin-arm64
      COMMIT_ARTIFACT_ID: ${{ needs.build-darwin-arm64-commit.outputs.commit-artifact-id }}
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
      LEGACY_COMMIT_BUILD: ${{ needs.validate.outputs.legacy-commit-build }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          archive-inputs: false
          cache-python: false
          cache-node: false
          save-tools-cache: false
      - name: Require one numeric commit-claim artifact ID
        shell: bash
        run: |
          if [[ ! "${COMMIT_ARTIFACT_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::expected one positive numeric commit-claim artifact ID, got '${COMMIT_ARTIFACT_ID:-}'"
            exit 1
          fi
      - name: Download commit claim artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ env.COMMIT_ARTIFACT_ID }}
          merge-multiple: true
          path: staged-artifacts
      # Unzipping and reading the unreviewed leg's packages never holds the R2 secrets.
      - name: Record commit claim macOS packages
        shell: bash
        run: |
          root="$GITHUB_WORKSPACE/staged-artifacts"
          # Only the built packages: the build leg ran the claimed code, which can rewrite its upload.
          # This arch's one .dmg and one .zip and their blockmaps, none hidden: the globs below skip
          # hidden names, the uploader's Path.glob does not.
          shopt -s nullglob
          unexpected="$(find "$root" -mindepth 1 \( -type d -o -type l -o -name '.*' -o ! \( -name "*-mac-${TARGET##*-}.dmg" -o -name "*-mac-${TARGET##*-}.zip" -o -name '*.blockmap' \) \) -print)"
          for blockmap in "$root"/*.blockmap; do [ -f "${blockmap%.blockmap}" ] || unexpected+=" $blockmap"; done
          dmgs=("$root"/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then unexpected+=" ${#dmgs[@]} DMGs"; fi
          if [ -n "$unexpected" ]; then echo "::error::unexpected commit-claim artifact entries: $unexpected"; exit 1; fi
          zips=("$root"/*-mac-"${TARGET##*-}".zip)
          test "${#zips[@]}" -eq 1
          mkdir -p "$root/mac-${TARGET##*-}"
          ditto -x -k "${zips[0]}" "$root/mac-${TARGET##*-}"
          record_args=()
          if [ "${LEGACY_COMMIT_BUILD:-false}" = true ]; then record_args+=(--legacy-commit-build); fi
          python -m scripts.bundles.release_artifacts record --platform macos --arch "${TARGET##*-}" \
            --root "$root" --tag "$HERMES_PAYLOAD_TAG" --commit "$RELEASE_COMMIT" \
            "${record_args[@]}" \
            --out "$root/metadata-macos-${TARGET##*-}.json"
      - name: Stage commit claim macOS packages to R2
        shell: bash
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          root="$GITHUB_WORKSPACE/staged-artifacts"
          python -m scripts.releases.handoff stage --tag "${HERMES_ARCHIVE_TAG:-$HERMES_PAYLOAD_TAG}" --commit "$RELEASE_COMMIT" \
            --name "$TARGET" --root "$root" --include '*.dmg' --include '*.zip' --include '*.blockmap' --include "metadata-macos-${TARGET##*-}.json"

  build-darwin-arm64:
    name: bundled darwin-arm64 result
    # always() crosses the deliberately skipped trust branch; failed admission
    # still skips this result, just as it skipped the original native builder.
    if: >-
      always() && needs.validate.outputs.darwin-arm64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && needs.validate.result == 'success'
    # The trust-branch legs are read through needs.*.result below, so they must
    # stay in the list — the result job gates on their outcomes, not its own.
    needs: [validate, build-darwin-arm64-release, build-darwin-arm64-commit, stage-commit-darwin-arm64]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {}
    timeout-minutes: 5
    env:
      SELECTED_BUILD_SUCCEEDED: >-
        ${{ (inputs.build_commit == '' && inputs.channel == '' && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.') && needs.build-darwin-arm64-release.result == 'success' && needs.build-darwin-arm64-commit.result == 'skipped' && needs.stage-commit-darwin-arm64.result == 'skipped')
          || (inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.') && needs.build-darwin-arm64-commit.result == 'success' && needs.stage-commit-darwin-arm64.result == 'success' && needs.build-darwin-arm64-release.result == 'skipped')
          || (!(inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.')) && (inputs.build_commit != '' || inputs.channel != '' || startsWith(inputs.tag, 'commit.') || startsWith(inputs.tag, 'channel.')) && needs.build-darwin-arm64-commit.result == 'success' && needs.stage-commit-darwin-arm64.result == 'skipped' && needs.build-darwin-arm64-release.result == 'skipped') }}
    steps: *native-build-result-steps

  # ── Linux builders (diagnostic) ────────────────────────────────────────────
  # One AppImage per arch, on tag builds only (canary tags, and stable
  # candidates that select a linux group); commit and channel builds skip
  # them. The container image is the oldest userland the arch supports, so
  # source-built extensions link against that glibc: x64 builds on Ubuntu
  # 22.04, arm64 on 24.04, and glibc_floor.py fails the build if anything
  # packaged needs more (except the x64 CUDA and ROCm llama.cpp engines,
  # which glibc_floor.EXCEPTIONS allows up to GLIBC 2.38 / GLIBCXX 3.4.32).
  # Nothing gates on these jobs
  # (scripts.releases.job_groups.DIAGNOSTIC_JOBS) and no Linux feed is
  # written: the AppImage and electron-builder's feed yml stage to the tag
  # archive only.
  build-linux-x64:
    name: bundled linux-x64
    if: >-
      needs.validate.outputs.linux-x64 == 'true'
      && inputs.release-phase == 'candidate'
      && inputs.build_commit == '' && inputs.channel == ''
      && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.')
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    # Stage GPU engines and bootstrap Python in 24.04; build the desktop in 22.04.
    environment: release-signing
    cache-mode: write
    # A failed Linux build stays visible on its job without failing the run.
    continue-on-error: true
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        target:
          - label: linux-x64
            runner: blacksmith-32vcpu-ubuntu-2404
            image: ubuntu:22.04
            python: python3.11
            alsa: libasound2
    env: &linux-env
      LINUX_BUNDLE_TARGET: ${{ matrix.target.label }}
      DEBIAN_FRONTEND: noninteractive
      HERMES_DESKTOP_VARIANT: bundled
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      RELEASE_CLAIM_TAG: ${{ inputs.claim-tag }}
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      HERMES_RELEASE_COMMIT: ${{ inputs.release-phase != '' && needs.validate.outputs.sha || '' }}
      HERMES_PAYLOAD_VERSION: ${{ needs.validate.outputs.payload-version }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
    steps: &linux-steps
      - name: Provision Git in the arm64 job container
        if: matrix.target.label == 'linux-arm64'
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates

      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
          fetch-tags: true
          persist-credentials: false

      # The bootstrap scripts need Python >= 3.11; PM probes run node (libatomic)
      # and cua-driver (X11, xkbcommon) while staging the payload. Preparation's
      # native probe starts the downloaded Electron, which loads GTK, NSS, GBM
      # and ALSA even as node; 24.04 renamed ALSA's package libasound2t64.
      - name: Install the build userland
        shell: bash scripts/ci/linux_bundle_shell.sh setup {0}
        env:
          BOOTSTRAP_PYTHON: ${{ matrix.target.python }}
          ALSA_PACKAGE: ${{ matrix.target.alsa }}
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates git build-essential rustc cmake file xz-utils zstd \
            libatomic1 libx11-dev libxi-dev libxkbcommon0 \
            libgtk-3-0 libnss3 libgbm1 "$ALSA_PACKAGE" "$BOOTSTRAP_PYTHON"
          ln -sf "/usr/bin/$BOOTSTRAP_PYTHON" /usr/local/bin/python3
          ln -sf "/usr/bin/$BOOTSTRAP_PYTHON" /usr/local/bin/python
          # The checkout belongs to the runner's uid, not the container's root.
          # System scope: preparation runs git there under its own HOME.
          git config --system --add safe.directory '*'

      # Workspace-relative: in a job container github.workspace and runner.temp name host paths.
      - name: Restore desktop dependency inputs
        id: build-cache
        uses: ./.github/actions/desktop-build-cache
        with:
          phase: restore
          source: .
          work: .build/desktop-job
          cache: .cache/desktop-inputs
          producer: desktop

      - name: Stage the x64 bootstrap Python and probe pinned GPU engines on Ubuntu 24.04
        if: matrix.target.label == 'linux-x64'
        shell: bash
        run: bash scripts/ci/linux_x64_userland.sh stage-gpu

      - name: Prepare the complete desktop build
        id: prepare
        shell: bash scripts/ci/linux_bundle_shell.sh build {0}
        run: |
          args=(--tag "$HERMES_PAYLOAD_TAG")
          if [ -n "$HERMES_RELEASE_COMMIT" ]; then args+=(--release-commit "$HERMES_RELEASE_COMMIT"); fi
          python3 scripts/bundles/desktop.py "${args[@]}" --variant bundled --prepare-only \
            --work "$GITHUB_WORKSPACE/.build/desktop-job" --cache "$GITHUB_WORKSPACE/.cache/desktop-inputs"
          python3 -m scripts.ci.desktop_commands "$GITHUB_WORKSPACE/.build/desktop-job/prepared.json"

      - name: Save dependency inputs before building
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && inputs.build_commit == '' && inputs.channel == '' && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.') }}
        uses: ./.github/actions/desktop-build-cache
        with:
          phase: save
          source: .
          work: .build/desktop-job
          cache: .cache/desktop-inputs
          producer: desktop
          key: ${{ steps.build-cache.outputs.cache-key }}

      - name: Build and package
        shell: bash scripts/ci/linux_bundle_shell.sh build {0}
        timeout-minutes: 200
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/bundles/desktop.py --prepared "$GITHUB_WORKSPACE/.build/desktop-job/prepared.json" --variant bundled
          shopt -s nullglob
          apps=(apps/desktop/release/linux*-unpacked)
          if [ ${#apps[@]} -ne 1 ]; then
            echo "::error::expected one unpacked Linux app under apps/desktop/release, found ${#apps[@]}"
            exit 1
          fi
          echo "LINUX_APP=${apps[0]}" >> "$GITHUB_ENV"

      - name: Audit bundle architecture
        # The pinned Node needs libatomic1, installed in the builder, not the runner host.
        shell: bash scripts/ci/linux_bundle_shell.sh build {0}
        run: |
          MATRIX_LABEL="${{ matrix.target.label }}"
          node apps/desktop/scripts/audit-bundle-arch.mjs \
            --arch="${MATRIX_LABEL##*-}" --root=apps/desktop/release

      - name: Audit the glibc floor
        shell: bash
        run: |
          MATRIX_LABEL="${{ matrix.target.label }}"
          python -m scripts.bundles.glibc_floor --arch "${MATRIX_LABEL##*-}" "$LINUX_APP"

      - name: Smoke test the packaged payload (network disabled)
        if: matrix.target.label == 'linux-arm64'
        shell: bash
        run: unshare --net bash scripts/smoke-payload.sh "$LINUX_APP/resources/agent-payload"

      - name: Test the same x64 AppImage offline on Ubuntu 22.04 and 24.04
        if: matrix.target.label == 'linux-x64'
        shell: bash
        run: bash scripts/ci/linux_x64_userland.sh accept

      - name: Stage the AppImage to the tag archive
        if: inputs.upload_release == true || inputs.release-phase == 'candidate'
        shell: bash
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          TARGET: ${{ matrix.target.label }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
        # electron-builder embeds the AppImage's block map, and writes the feed
        # yml only when a publish channel is configured. Neither is a feed here.
        run: |
          shopt -s nullglob
          args=(--include '*.AppImage')
          feeds=(apps/desktop/release/*-linux*.yml)
          if [ ${#feeds[@]} -gt 0 ]; then args+=(--include '*-linux*.yml'); fi
          python -m scripts.releases.handoff stage --tag "${HERMES_ARCHIVE_TAG:-$HERMES_PAYLOAD_TAG}" --commit "$RELEASE_COMMIT" \
            --name "$TARGET" --root apps/desktop/release "${args[@]}"

  build-linux-arm64:
    name: bundled linux-arm64
    if: >-
      needs.validate.outputs.linux-arm64 == 'true'
      && inputs.release-phase == 'candidate'
      && inputs.build_commit == '' && inputs.channel == ''
      && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.')
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    container:
      image: ${{ matrix.target.image }}
      options: --cap-add SYS_ADMIN
    environment: release-signing
    cache-mode: write
    continue-on-error: true
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        target:
          - label: linux-arm64
            runner: blacksmith-32vcpu-ubuntu-2404-arm
            image: ubuntu:24.04
            python: python3.12
            alsa: libasound2t64
    env: *linux-env
    steps: *linux-steps

  stage-receipt-darwin-arm64:
    name: Stage the darwin-arm64 stable receipt
    # The receipt is staged at the end of the build join and before the smoke:
    # the install arm may start against bytes whose smoke has not run yet
    # (decision 11); acceptance still blocks publication.
    needs: [validate, build-darwin-arm64]
    if: >-
      !cancelled() && inputs.release-phase == 'candidate'
      && needs.validate.result == 'success' && needs.validate.outputs.sha != ''
      && needs.validate.outputs.darwin-arm64 == 'true'
      && needs.build-darwin-arm64.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: release-signing
    cache-mode: read
    timeout-minutes: 15
    outputs:
      receipt-url: ${{ steps.receipt.outputs.receipt-url }}
      receipt-sha256: ${{ steps.receipt.outputs.receipt-sha256 }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ startsWith(inputs.tag, 'commit.') && github.sha || needs.validate.outputs.sha }}
          # Claim custody is re-checked in place: full history and the tags.
          fetch-depth: 0
          filter: blob:none
          fetch-tags: true
      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false
          save-tools-cache: false
      - id: receipt
        run: python -m scripts.releases.stable stage-receipt --receipt darwin-arm64
        env:
          GH_TOKEN: ${{ github.token }}

  smoke-darwin-arm64:
    name: Smoke macOS arm64 dmg/zip
    needs: [validate, build-darwin-arm64, stage-receipt-darwin-arm64]
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.validate.outputs.sha != ''
      && needs.build-darwin-arm64.result == 'success' && needs.validate.outputs.darwin-arm64 == 'true'
      && (inputs.release-phase != 'candidate' || needs.stage-receipt-darwin-arm64.result == 'success')
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && (inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '' || inputs.channel != '')
      && inputs.skip-tests != true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        format: [dmg, zip]
    uses: ./.github/workflows/desktop-bundle-smoke.yml
    with:
      platform: darwin
      arch: arm64
      format: ${{ matrix.format }}
      sha: ${{ needs.validate.outputs.sha }}
      tag: ${{ inputs.tag }}
      # The archive ref the handoff was staged under (attempt ref for stable).
      archive-tag: ${{ needs.validate.outputs.archive-tag }}
      commit-build: ${{ inputs.build_commit != '' && needs.validate.outputs.channel-build == '' }}
      legacy-commit-build: ${{ needs.validate.outputs.legacy-commit-build == 'true' }}
      channel-build: ${{ needs.validate.outputs.channel-build }}
      channel-request-sha256: ${{ needs.validate.outputs.channel-request-sha256 }}
      controller-sha: ${{ github.sha }}
      public-base: ${{ needs.validate.outputs.public-base }}
      public-root: ${{ needs.validate.outputs.public-root }}
      disposable-run: ${{ needs.validate.outputs.disposable-run }}

  # Stable passes windows-smokes-with-bundle: its per-arch calls only build, and
  # the win32-bundle call smokes both staged MSIX beside assembly, so the bundle
  # does not wait for a smoke after the slower arch's build.
  smoke-win32-x64:
    name: Smoke Windows x64 MSIX
    needs: [validate, build-win32-x64]
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.validate.outputs.sha != ''
      && ((inputs.windows-smokes-with-bundle != true
           && needs.build-win32-x64.result == 'success' && needs.validate.outputs.win32-x64 == 'true')
        || (inputs.windows-smokes-with-bundle == true && needs.validate.outputs.win32-bundle == 'true'
           && (needs.validate.outputs.win32-x64 != 'true' || needs.build-win32-x64.result == 'success')))
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && (inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '' || inputs.channel != '')
      && inputs.skip-tests != true
      && inputs.skip-signed != true
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-bundle-smoke.yml
    with:
      platform: win32
      arch: x64
      format: msix
      sha: ${{ needs.validate.outputs.sha }}
      tag: ${{ inputs.tag }}
      # The archive ref the handoff was staged under (attempt ref for stable).
      archive-tag: ${{ needs.validate.outputs.archive-tag }}
      commit-build: ${{ inputs.build_commit != '' && needs.validate.outputs.channel-build == '' }}
      legacy-commit-build: ${{ needs.validate.outputs.legacy-commit-build == 'true' }}
      channel-build: ${{ needs.validate.outputs.channel-build }}
      channel-request-sha256: ${{ needs.validate.outputs.channel-request-sha256 }}
      controller-sha: ${{ github.sha }}
      public-base: ${{ needs.validate.outputs.public-base }}
      public-root: ${{ needs.validate.outputs.public-root }}
      disposable-run: ${{ needs.validate.outputs.disposable-run }}

  smoke-win32-arm64:
    name: Smoke Windows arm64 MSIX
    needs: [validate, build-win32-arm64]
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.validate.outputs.sha != ''
      && ((inputs.windows-smokes-with-bundle != true
           && needs.build-win32-arm64.result == 'success' && needs.validate.outputs.win32-arm64 == 'true')
        || (inputs.windows-smokes-with-bundle == true && needs.validate.outputs.win32-bundle == 'true'
           && (needs.validate.outputs.win32-arm64 != 'true' || needs.build-win32-arm64.result == 'success')))
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && (inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '' || inputs.channel != '')
      && inputs.skip-tests != true
      && inputs.skip-signed != true
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-bundle-smoke.yml
    with:
      platform: win32
      arch: arm64
      format: msix
      sha: ${{ needs.validate.outputs.sha }}
      tag: ${{ inputs.tag }}
      # The archive ref the handoff was staged under (attempt ref for stable).
      archive-tag: ${{ needs.validate.outputs.archive-tag }}
      commit-build: ${{ inputs.build_commit != '' && needs.validate.outputs.channel-build == '' }}
      legacy-commit-build: ${{ needs.validate.outputs.legacy-commit-build == 'true' }}
      channel-build: ${{ needs.validate.outputs.channel-build }}
      channel-request-sha256: ${{ needs.validate.outputs.channel-request-sha256 }}
      controller-sha: ${{ github.sha }}
      public-base: ${{ needs.validate.outputs.public-base }}
      public-root: ${{ needs.validate.outputs.public-root }}
      disposable-run: ${{ needs.validate.outputs.disposable-run }}

  # Assembly never writes a feed, including for canaries.
  # A build leg selected in this same call must succeed. One that is not
  # selected (stable's `jobs: win32-bundle` call runs after the per-arch
  # candidate calls) is skipped here, and its signed .msix is fetched from the
  # R2 handoff instead; the caller's `needs` already guarantees it was staged.
  assemble-win32-bundle:
    name: Assemble and stage the Windows universal bundle
    needs: [validate, build-win32-x64, build-win32-arm64]
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.validate.outputs.sha != ''
      && needs.validate.outputs.win32-bundle == 'true'
      && (needs.validate.outputs.win32-x64 != 'true' || needs.build-win32-x64.result == 'success')
      && (needs.validate.outputs.win32-arm64 != 'true' || needs.build-win32-arm64.result == 'success')
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && (inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '' || inputs.channel != '')
    runs-on: blacksmith-32vcpu-windows-2025
    environment: release-signing
    cache-mode: read
    timeout-minutes: 45
    outputs:
      receipt-url: ${{ steps.receipt.outputs.receipt-url }}
      receipt-sha256: ${{ steps.receipt.outputs.receipt-sha256 }}
    env:
      CHANNEL_BUILD: ${{ needs.validate.outputs.channel-build }}
      CHANNEL_REQUEST_SHA256: ${{ needs.validate.outputs.channel-request-sha256 }}
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      # Archive ref for the universal-bundle handoff: attempt ref for stable.
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      # The commit identity: a tagless commit build's, or a commit claim's in the candidate phase
      # (commit.<stamp>-vX.Y.Z keeps the Commit<sha7> identity; its tag still versions the packages).
      HERMES_BUILD_COMMIT: ${{ (inputs.build_commit != '' && needs.validate.outputs.channel-build == '' && needs.validate.outputs.sha) || (inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.') && needs.validate.outputs.sha) || '' }}
      HERMES_PAYLOAD_VERSION: ${{ needs.validate.outputs.payload-version }}
      HERMES_CORE_VERSION: ${{ needs.validate.outputs.core-version }}
      LEGACY_COMMIT_BUILD: ${{ needs.validate.outputs.legacy-commit-build }}
      # The paths build-win32-x64 saves its bundle-assembly caches from.
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/desktop-inputs/packager/builder
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
      AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
      AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
      AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
      AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
    steps:
      # Full checkout: stage-msixbundle.mjs imports ./msix-shared.mjs and the
      # job runs it with no checkout at all today — ERR_MODULE_NOT_FOUND.
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          # Channel and commit-claim assembly/receipt code stays at the trusted controller
          # so pre-PR commits remain compatible and unreviewed commits never own assembly code.
          ref: ${{ (needs.validate.outputs.channel-build != '' || startsWith(inputs.tag, 'commit.')) && github.sha || needs.validate.outputs.sha }}
          # Only a stable candidate reads git: its MSIX version is the claim tag's
          # tagger time, and its receipt step re-checks claim custody (claim tag
          # object + release-line ancestry). A canary's version is the stamp in its
          # tag name, and channel/commit builds take theirs from the request/env.
          fetch-depth: ${{ inputs.release-phase != 'candidate' && 1 || 0 }}
          filter: blob:none
          fetch-tags: ${{ inputs.release-phase == 'candidate' }}

      - name: Retrieve pinned channel request
        if: needs.validate.outputs.channel-build != ''
        shell: bash
        env:
          CHANNEL_BUILD: ${{ needs.validate.outputs.channel-build }}
          CHANNEL_REQUEST_SHA256: ${{ needs.validate.outputs.channel-request-sha256 }}
        run: python -m scripts.releases.channel_publish request --out "$RUNNER_TEMP/channel-request.json"

      - name: Set up the locked build toolchain
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          archive-inputs: ${{ inputs.disposable_run == '' && inputs.disposable_channel == '' }}
          cache-python: false
          save-tools-cache: false
          # pnpm's store comes from build-win32-x64 below; nothing ever saves
          # setup-pm's per-job node key for this read-only job.
          cache-node: false

      - name: Restore the bundle-assembly caches
        # Exact key only (no prefix restore-keys): a stale or mismatched lockfile entry must
        # never enter `pnpm install` before signing.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.cache/desktop-inputs/packager/builder
            ${{ github.workspace }}/.cache/desktop-inputs/pnpm/store
          key: win32-assembly-v1-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Install the locked Windows bundle tooling
        uses: ./.github/actions/retry
        env:
          # The store restored above. A step env, because setup-pm's
          # GITHUB_ENV export would override a job-level one.
          pnpm_config_store_dir: ${{ github.workspace }}/.cache/desktop-inputs/pnpm/store
        with:
          # No Electron/native postinstalls: only the builder's SDK downloader.
          command: pnpm install --frozen-lockfile --filter "{./apps/desktop}..." --ignore-scripts

      - name: Retrieve Windows packages from R2
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
        run: |
          if [ -n "${CHANNEL_BUILD:-}" ]; then
            python -m scripts.releases.handoff fetch --channel-request "$RUNNER_TEMP/channel-request.json" \
              --name win32-x64 --name win32-arm64 --root apps/desktop/release --include '*.msix'
          elif [ -n "$HERMES_BUILD_COMMIT" ] && [ -z "$HERMES_PAYLOAD_TAG" ]; then
            python -m scripts.releases.handoff fetch --commit-build "$HERMES_BUILD_COMMIT" \
              --commit "$RELEASE_COMMIT" \
              --name win32-x64 --name win32-arm64 --root apps/desktop/release --include '*.msix'
          else
            python -m scripts.releases.handoff fetch --tag "${HERMES_ARCHIVE_TAG:-$HERMES_PAYLOAD_TAG}" --commit "$RELEASE_COMMIT" \
              --name win32-x64 --name win32-arm64 --root apps/desktop/release --include '*.msix'
          fi

      - name: Azure login (OIDC)
        if: inputs.skip-signed != true
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Mint federated token for the signing dlib
        if: inputs.skip-signed != true
        shell: bash
        run: |
          file="$RUNNER_TEMP/azure-federated-token"
          mint() {
            curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
              | jq -r .value > "$file.tmp" && mv -f "$file.tmp" "$file"
          }
          mint
          ( while sleep 240; do mint || true; done ) &
          echo "AZURE_FEDERATED_TOKEN_FILE=$file" >> "$GITHUB_ENV"

      - name: Assemble the signed MSIX bundle without publishing
        shell: bash
        env:
          RELEASE_PHASE: ${{ inputs.release-phase }}
          SKIP_SIGNED: ${{ inputs.skip-signed }}
          SKIP_STORE: ${{ inputs.skip-store }}
          AZURE_TOKEN_CREDENTIALS: prod
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          # All modes stop at signed bytes. The separate handoff stages them
          # for smoke; publication must not assemble or sign a second time.
          if [ -n "${CHANNEL_BUILD:-}" ]; then
            node scripts/stage-msixbundle.mjs --channel-request "$RUNNER_TEMP/channel-request.json" --variant bundled
            exit 0
          fi
          if [ -n "$HERMES_BUILD_COMMIT" ] && [ -z "$HERMES_PAYLOAD_TAG" ]; then
            node scripts/stage-msixbundle.mjs --commit "$HERMES_BUILD_COMMIT" --version "$HERMES_PAYLOAD_VERSION" --variant bundled --no-upload
            exit 0
          fi
          if [ "${LEGACY_COMMIT_BUILD:-false}" = true ]; then
            unset HERMES_PAYLOAD_TAG
            node scripts/stage-msixbundle.mjs --commit "$HERMES_BUILD_COMMIT" --version "$HERMES_CORE_VERSION" --variant bundled --no-upload
            exit 0
          fi
          args=()
          if [ "$RELEASE_PHASE" = candidate ]; then args+=(--candidate); fi
          if [ "$SKIP_SIGNED" != true ]; then
            node scripts/stage-msixbundle.mjs --tag "$HERMES_PAYLOAD_TAG" --variant bundled "${args[@]}"
          fi
          if [ "$RELEASE_PHASE" = candidate ] && [ "$SKIP_STORE" != true ] && [[ "$HERMES_PAYLOAD_TAG" != commit.* ]]; then
            node scripts/bundle-store-msixbundle.mjs --tag "$HERMES_PAYLOAD_TAG"
          fi

      - name: Stage universal bundles to R2
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
        run: |
          if [ -n "${CHANNEL_BUILD:-}" ]; then
            python -m scripts.releases.handoff stage --channel-request "$RUNNER_TEMP/channel-request.json" \
              --name windows-universal --root apps/desktop/release --include '*.msixbundle'
          elif [ -n "$HERMES_BUILD_COMMIT" ] && [ -z "$HERMES_PAYLOAD_TAG" ]; then
            python -m scripts.releases.handoff stage --commit-build "$HERMES_BUILD_COMMIT" \
              --commit "$RELEASE_COMMIT" \
              --name windows-universal --root apps/desktop/release --include '*.msixbundle'
          else
            python -m scripts.releases.handoff stage --tag "${HERMES_ARCHIVE_TAG:-$HERMES_PAYLOAD_TAG}" --commit "$RELEASE_COMMIT" \
              --name windows-universal --root apps/desktop/release --include '*.msixbundle'
          fi

      - name: Stage the stable win32-bundle receipt
        # Same receipt-before-smoke contract as the darwin arches (decision 11):
        # the bundle and its per-arch metadata are staged and digest-verified;
        # acceptance still blocks publication. A Store-only candidate has no signed bundle to receipt.
        if: inputs.release-phase == 'candidate' && inputs.skip-signed != true
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
        run: python -m scripts.releases.stable stage-receipt --receipt win32-bundle

  publish-channel:
    name: Publish the complete native-smoked channel build
    needs:
      [
        validate,
        build-darwin-arm64,
        build-win32-arm64,
        build-win32-x64,
        assemble-win32-bundle,
        smoke-darwin-arm64,
        smoke-win32-arm64,
        smoke-win32-x64
      ]
    if: >-
      !cancelled() && needs.validate.outputs.channel-build != '' && needs.validate.result == 'success'
      && needs.validate.outputs.darwin-arm64 == 'true'
      && needs.validate.outputs.win32-arm64 == 'true' && needs.validate.outputs.win32-x64 == 'true'
      && needs.validate.outputs.win32-bundle == 'true'
      && needs.build-darwin-arm64.result == 'success'
      && needs.build-win32-arm64.result == 'success' && needs.build-win32-x64.result == 'success'
      && needs.assemble-win32-bundle.result == 'success'
      && needs.smoke-darwin-arm64.result == 'success'
      && needs.smoke-win32-arm64.result == 'success' && needs.smoke-win32-x64.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: release-signing
    cache-mode: read
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      CHANNEL_BUILD: ${{ needs.validate.outputs.channel-build }}
      CHANNEL_REQUEST_SHA256: ${{ needs.validate.outputs.channel-request-sha256 }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_NEEDS: ${{ toJSON(needs) }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ github.sha }}
          # require_pushed proves commit-build ancestry from local history;
          # a shallow clone fails after main advances past the built SHA.
          fetch-depth: 0
          filter: blob:none
      - name: Publish tested disposable receiver without promoting T
        if: needs.validate.outputs.receiver-candidate == 'true'
        run: python -m scripts.releases.channel_publish receiver-publish --root "$RUNNER_TEMP/channel-publish"
      - name: Publish immutable feeds and manifest, then CAS channel head
        if: needs.validate.outputs.receiver-candidate != 'true'
        shell: bash
        run: |
          python -m scripts.releases.channel_publish publish --root "$RUNNER_TEMP/channel-publish"
          python scripts/render-builds-table.py --channel-build "$CHANNEL_BUILD" \
            --channel-request-sha256 "$CHANNEL_REQUEST_SHA256" --repo "$GITHUB_REPOSITORY" \
            --r2-base-url "$(python -c 'from scripts.releases.r2_scope import channel_public_base; print(channel_public_base())')" \
            --summary-out "$GITHUB_STEP_SUMMARY"

  # Like the desktop native builders, Termux splits by trust branch: release/canary
  # tags run with cache-mode: write and the APT GPG signing key; commit builds and
  # commit/channel claims run with cache-mode: read, no cache saves, and no access
  # to TERMUX_APT_GPG_KEY or TERMUX_APT_GPG_PASSPHRASE.
  termux-deb-release:
    name: Build + publish the termux .deb (aarch64)
    needs: [validate]
    if: >-
      inputs.channel == '' && inputs.disposable_channel == ''
      && needs.validate.outputs.termux == 'true'
      && (inputs.upload_release == true || inputs.release-phase == 'candidate')
      && inputs.build_commit == ''
      && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.')
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    environment: release-signing
    cache-mode: write
    timeout-minutes: 90
    env:
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      # Archive ref for the termux handoff: attempt ref for stable phases.
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      # The commit identity: a tagless commit build's, or a commit claim's in the candidate phase.
      HERMES_BUILD_COMMIT: ${{ (inputs.build_commit != '' && needs.validate.outputs.channel-build == '' && needs.validate.outputs.sha) || (inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.') && needs.validate.outputs.sha) || '' }}
      HERMES_RELEASE_COMMIT: ${{ inputs.release-phase != '' && needs.validate.outputs.sha || '' }}
      LEGACY_COMMIT_BUILD: ${{ needs.validate.outputs.legacy-commit-build }}
      # termux_build.sh gates on `gh release view <tag>` (refuse to build
      # before the release exists); gh needs GH_TOKEN or it errors out and
      # the gate misreads that as "release not found".
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
    steps:
      # Use the admitted commit, not a tag that can move after validation.
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
          fetch-tags: true
          persist-credentials: false

      - name: Check out controller Termux build action
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ github.sha }}
          path: .build/termux-action
          sparse-checkout: .github/actions/build-termux-deb
          persist-credentials: false

      - name: Set up the locked build toolchain
        id: pm
        uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          # scripts/termux/build.py installs and builds the TUI on this host with pnpm.
          packages: pnpm
          archive-inputs: true
          cache-python: false

      - name: Derive the channel from the tag
        id: channel
        shell: bash
        # Single source of truth: deb_version.py --channel uses the same
        # _TAG_RE as the Debian version derivation, so the channel and the
        # .deb version can never disagree about the tag's shape.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "channel=$(python3 scripts/termux/deb_version.py --channel "$TAG")" >> "$GITHUB_OUTPUT"

      - name: Preserve and retrieve pinned inputs
        shell: bash
        run: python -m scripts.ci.archive_inputs --target linux-arm64-bionic --payload termux-build/payload --store "$HERMES_RUNTIME_DIR"

      - name: Build the Termux payload, wheelhouse, and .deb
        uses: ./.build/termux-action/.github/actions/build-termux-deb
        with:
          build-mode: release
          save-caches: ${{ inputs.build_commit == '' && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.') }}
          push-builder-image: 'true'
          github-token: ${{ github.token }}

      - name: Retrieve the previous published Termux package from R2
        if: inputs.termux_upgrade_from_tag != ''
        env:
          PREVIOUS_TAG: ${{ inputs.termux_upgrade_from_tag }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from scripts.releases.handoff import fetch
          from scripts.releases.semver import is_valid_version
          from scripts.releases.stable import release_line_contains
          tag = os.environ['PREVIOUS_TAG']
          if not tag.startswith('v') or not is_valid_version(tag[1:]):
              raise ValueError('Invalid previous release tag')
          release = json.loads(subprocess.check_output([
              'gh', 'release', 'view', tag, '--repo', os.environ['GITHUB_REPOSITORY'],
              '--json', 'tagName,isDraft'], text=True))
          if release['tagName'] != tag or release['isDraft']:
              raise ValueError('Previous package must come from a published release')
          commit = subprocess.check_output(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          if not subprocess.check_output(release_line_contains(commit, 'origin'), text=True).strip():
              raise ValueError('Previous package must come from main or a release/* branch')
          fetch(tag, commit, ['termux'], Path('termux-build/previous'), ['deb/*.deb'])
          PY

      - name: Write the APT signing key
        if: inputs.build_commit == '' && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.')
        shell: bash
        env:
          TERMUX_APT_GPG_KEY: ${{ secrets.TERMUX_APT_GPG_KEY }}
        run: |
          if [ -z "$TERMUX_APT_GPG_KEY" ]; then
            echo "::error::TERMUX_APT_GPG_KEY secret not set — the APT repo would stage unsigned"
            exit 1
          fi
          printf '%s\n' "$TERMUX_APT_GPG_KEY" > "$RUNNER_TEMP/termux-apt-gpg.asc"

      - name: Stage the APT repo handoff to R2
        if: inputs.build_commit == '' && inputs.release-phase == 'candidate' && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.')
        shell: bash
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          PREVIOUS_TAG: ${{ inputs.termux_upgrade_from_tag }}
          RELEASE_CLAIM_TAG: ${{ inputs.claim-tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          # Passphrase-protected signing keys only; unset for bare keys.
          TERMUX_APT_GPG_PASSPHRASE: ${{ secrets.TERMUX_APT_GPG_PASSPHRASE }}
        run: |
          # stage_apt_repo.py builds dists/<suite>/ + pool/ under --out and
          # signs Release/InRelease with the key file. Exit 3 (unsigned
          # Release) must fail the run.
          # The candidate phase keys the pool by the attempt/claim ref: the pool
          # upload is immutable with a one-year cache header, so a recut of
          # the same version must never reuse a pool key.
          python3 scripts/termux/stage_apt_repo.py \
            --pool termux-build/deb --out termux-build/apt \
            --suite "hermes-$CHANNEL" --pool-subdir "$RELEASE_CLAIM_TAG" \
            --gpg-key-file "$RUNNER_TEMP/termux-apt-gpg.asc"

          debs=(termux-build/deb/*.deb)
          test "${#debs[@]}" -eq 1
          version=$(dpkg-deb --field "${debs[0]}" Version)
          digest=$(python3 -c 'from pm.lock import termux_docker_digest; print(termux_docker_digest())')
          docker run --rm --platform linux/arm64 --user 1000:1000 --network none \
            -v "$PWD/termux-build/apt:/apt:ro" \
            -v "$PWD/scripts/termux/check_apt.sh:/tmp/check-apt.sh:ro" \
            -v "$PWD/scripts/termux/validate_installed.py:/tmp/validate_installed.py:ro" \
            "termux/termux-docker@$digest" bash /tmp/check-apt.sh "hermes-$CHANNEL" "$version"
          if [ -n "$PREVIOUS_TAG" ]; then
            previous=(termux-build/previous/deb/*.deb)
            test "${#previous[@]}" -eq 1
            docker run --rm --platform linux/arm64 --user 1000:1000 --network none \
              -v "$PWD/termux-build/apt:/apt:ro" \
              -v "$PWD/${previous[0]}:/previous.deb:ro" \
              -v "$PWD/scripts/termux/check_apt.sh:/tmp/check-apt.sh:ro" \
              -v "$PWD/scripts/termux/validate_installed.py:/tmp/validate_installed.py:ro" \
              "termux/termux-docker@$digest" bash /tmp/check-apt.sh "hermes-$CHANNEL" "$version"
          fi

          python -m scripts.bundles.release_artifacts record --platform termux --arch aarch64 \
            --root termux-build --tag "$HERMES_PAYLOAD_TAG" --commit "$RELEASE_COMMIT" \
            --out termux-build/metadata-termux-aarch64.json
          python -m scripts.releases.handoff stage --tag "${HERMES_ARCHIVE_TAG:-$HERMES_PAYLOAD_TAG}" --commit "$RELEASE_COMMIT" \
            --name termux --root termux-build --include 'deb/*.deb' --include 'apt/**/*' --include 'metadata-*.json'

  termux-deb-commit:
    name: Build the termux .deb (aarch64, commit)
    # Read-only cache token, no GHCR push permission, and no APT GPG signing key:
    # commit builds and commit/channel claims run unreviewed code and only produce
    # a downloadable .deb, never a signed APT repo or shared builder image.
    needs: [validate]
    if: >-
      !cancelled() && needs.validate.result == 'success'
      && inputs.channel == '' && inputs.disposable_channel == ''
      && needs.validate.outputs.termux == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && (inputs.build_commit != '' || startsWith(inputs.tag, 'commit.') || startsWith(inputs.tag, 'channel.'))
    runs-on: blacksmith-4vcpu-ubuntu-2404-arm
    environment: release-signing
    cache-mode: read
    permissions:
      contents: read
      packages: read
    timeout-minutes: 90
    outputs:
      commit-artifact-id: ${{ steps.commit_artifact.outputs.artifact-id }}
    env:
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      HERMES_BUILD_COMMIT: ${{ (inputs.build_commit != '' && needs.validate.outputs.channel-build == '' && needs.validate.outputs.sha) || (inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.') && needs.validate.outputs.sha) || '' }}
      HERMES_RELEASE_COMMIT: ${{ inputs.release-phase != '' && needs.validate.outputs.sha || '' }}
      LEGACY_COMMIT_BUILD: ${{ needs.validate.outputs.legacy-commit-build }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 1
          filter: blob:none
          fetch-tags: false
          persist-credentials: false

      - name: Check out controller Termux build action
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ github.sha }}
          path: .build/termux-action
          sparse-checkout: .github/actions/build-termux-deb
          persist-credentials: false

      - name: Set up the locked build toolchain
        id: pm
        uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          packages: pnpm
          archive-inputs: false
          cache-python: false
          save-tools-cache: false
          save-node-cache: false

      - name: Build the Termux payload, wheelhouse, and .deb
        uses: ./.build/termux-action/.github/actions/build-termux-deb
        with:
          build-mode: commit
          save-caches: 'false'
          push-builder-image: 'false'

      - name: Stage the commit-build deb to R2
        # Legacy tagless commit builds stage here; commit claims stage on stage-commit-termux.
        if: inputs.build_commit != '' && !(inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.'))
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          root="$GITHUB_WORKSPACE/termux-build"
          python -m scripts.releases.handoff stage --commit-build "$HERMES_BUILD_COMMIT" \
            --name termux --root "$root" --include 'deb/*.deb'

      - name: Upload commit claim artifacts for staging
        id: commit_artifact
        if: inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commit-claim-termux-${{ github.run_id }}-${{ github.run_attempt }}
          path: termux-build/deb/*.deb
          if-no-files-found: error
          retention-days: 7

  stage-commit-termux:
    name: stage termux commit claim
    needs: [validate, termux-deb-commit]
    if: >-
      !cancelled() && needs.validate.result == 'success'
      && inputs.channel == '' && inputs.disposable_channel == ''
      && needs.validate.outputs.termux == 'true'
      && inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.')
      && needs.termux-deb-commit.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: release-signing
    cache-mode: read
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      COMMIT_ARTIFACT_ID: ${{ needs.termux-deb-commit.outputs.commit-artifact-id }}
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
      LEGACY_COMMIT_BUILD: ${{ needs.validate.outputs.legacy-commit-build }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          archive-inputs: false
          cache-python: false
          cache-node: false
          save-tools-cache: false
      - name: Require one numeric commit-claim artifact ID
        shell: bash
        run: |
          if [[ ! "${COMMIT_ARTIFACT_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::expected one positive numeric commit-claim artifact ID, got '${COMMIT_ARTIFACT_ID:-}'"
            exit 1
          fi
      - name: Download commit claim artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          artifact-ids: ${{ env.COMMIT_ARTIFACT_ID }}
          merge-multiple: true
          path: staged-artifacts/deb
      # Reading the unreviewed leg's package never holds the R2 secrets; only the upload does.
      - name: Record commit claim Termux package
        shell: bash
        run: |
          root="$GITHUB_WORKSPACE/staged-artifacts"
          # Only the built packages: the build leg ran the claimed code, which can rewrite its upload.
          unexpected="$(find "$root" -mindepth 1 ! -path "$root/deb" \( -type d -o -type l -o -name '.*' -o ! -path "$root/deb/*.deb" \) -print)"
          if [ ! -d "$root/deb" ] || [ -L "$root/deb" ]; then unexpected+=" $root/deb"; fi
          if [ -n "$unexpected" ]; then echo "::error::unexpected commit-claim artifact entries: $unexpected"; exit 1; fi
          record_args=()
          if [ "${LEGACY_COMMIT_BUILD:-false}" = true ]; then record_args+=(--legacy-commit-build); fi
          python -m scripts.bundles.release_artifacts record --platform termux --arch aarch64 \
            --root "$root" --tag "$HERMES_PAYLOAD_TAG" --commit "$RELEASE_COMMIT" \
            "${record_args[@]}" \
            --out "$root/metadata-termux-aarch64.json"
      - name: Stage commit claim Termux package to R2
        shell: bash
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          root="$GITHUB_WORKSPACE/staged-artifacts"
          python -m scripts.releases.handoff stage --tag "${HERMES_ARCHIVE_TAG:-$HERMES_PAYLOAD_TAG}" --commit "$RELEASE_COMMIT" \
            --name termux --root "$root" --include 'deb/*.deb' --include 'metadata-termux-aarch64.json'

  termux-deb:
    name: termux .deb result
    # always() crosses the deliberately skipped trust branch; failed admission
    # still skips this result, just as it skipped the original Termux builder.
    if: >-
      always() && inputs.channel == '' && inputs.disposable_channel == ''
      && needs.validate.outputs.termux == 'true'
      && (inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '')
      && needs.validate.result == 'success'
    needs: [validate, termux-deb-release, termux-deb-commit, stage-commit-termux]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions: {}
    timeout-minutes: 5
    env:
      SELECTED_BUILD_SUCCEEDED: >-
        ${{ (inputs.build_commit == '' && !startsWith(inputs.tag, 'commit.') && !startsWith(inputs.tag, 'channel.') && needs.termux-deb-release.result == 'success' && needs.termux-deb-commit.result == 'skipped' && needs.stage-commit-termux.result == 'skipped')
          || (inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.') && needs.termux-deb-commit.result == 'success' && needs.stage-commit-termux.result == 'success' && needs.termux-deb-release.result == 'skipped')
          || (!(inputs.release-phase == 'candidate' && startsWith(inputs.tag, 'commit.')) && (inputs.build_commit != '' || startsWith(inputs.tag, 'commit.') || startsWith(inputs.tag, 'channel.')) && needs.termux-deb-commit.result == 'success' && needs.stage-commit-termux.result == 'skipped' && needs.termux-deb-release.result == 'skipped') }}
    steps: *native-build-result-steps

  commit-builds-summary:
    name: Upload status page to R2
    needs:
      [
        validate,
        build-win32-x64,
        build-win32-arm64,
        build-darwin-arm64,
        assemble-win32-bundle,
        smoke-darwin-arm64,
        smoke-win32-arm64,
        smoke-win32-x64,
        termux-deb
      ]
    if: |
      always() && inputs.build_commit != '' && inputs.channel == '' && inputs.disposable_channel == ''
      && needs.validate.result == 'success' && needs.validate.outputs.sha != ''
      && needs.validate.outputs.all-jobs == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: release-signing
    permissions:
      contents: write
      actions: read
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          # Runs from the admitted commit so the renderer matches the built bytes.
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
      - name: Render the full expected-binary matrix
        env:
          HERMES_BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Render failed admitted builds too. Only receipt-listed objects
        # receive download links. Rendering does not alter job results.
        run: |
          set -e
          failed=$(python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["RELEASE_NEEDS"])
          failed = [name for name, info in needs.items()
                    if info.get("result") not in ("success", "skipped")]
          print(",".join(sorted(failed)))
          PY
          )
          python3 scripts/render-builds-table.py \
            --summary-commit "$RELEASE_COMMIT" --repo "$GITHUB_REPOSITORY" \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            --summary-failed-legs "$failed" --run-url "$RUN_URL"
      # No post-build receipt tag: a claimed commit build's identity is its claim tag
      # (commit.<stamp>-vX.Y.Z), minted before the build by release.py --build-commit; a
      # tagless build_commit run (a repository whose default branch isn't main) has only its commit.

  stable-publish:
    name: Verify published candidate files
    needs: validate
    if: inputs.release-phase == 'publish'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    environment: release-signing
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      CANDIDATE_MANIFEST_SHA256: ${{ inputs.manifest-sha256 }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false
      - run: python -m scripts.bundles.release_artifacts publish --root verified

  stable-store:
    name: Submit the verified Store package
    # Runs beside stable-publish: it materializes and digest-checks its own Store candidate
    # from the admitted manifest and never reads stable-publish's output. It leaves an
    # uncommitted Immediate draft; only the publication pass commits it, and it then goes
    # live as soon as it passes certification. A run whose stable-publish fails leaves a
    # draft no customer sees, never a live build.
    needs: [validate]
    # Never a canary or commit claim: only stable submits a Store package.
    if: inputs.release-phase == 'publish' && inputs.skip-store != true && !startsWith(inputs.tag, 'canary.') && !startsWith(inputs.tag, 'commit.')
    # The Store is not a release gate: a failed submission leaves the release publishable
    # and the summary names the Store package for a manual Partner Center upload.
    continue-on-error: true
    runs-on: blacksmith-32vcpu-windows-2025
    environment: release-signing
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      CANDIDATE_MANIFEST_SHA256: ${{ inputs.manifest-sha256 }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
      MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
      MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
      MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
      MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
      MS_STORE_PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false
      - name: Retrieve the exact Store candidate
        shell: bash
        run: python -m scripts.bundles.release_artifacts materialize --root verified --store-only
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - name: Submit without rebuilding
        shell: bash
        run: |
          test -n "$MS_STORE_PRODUCT_ID"
          msstore reconfigure --tenantId "$MS_STORE_TENANT_ID" --sellerId "$MS_STORE_SELLER_ID" --clientId "$MS_STORE_CLIENT_ID" --clientSecret "$MS_STORE_CLIENT_SECRET"
          files=(verified/Store-*.msixbundle)
          test "${#files[@]}" -eq 1
          test -f "${files[0]}"
          # An uncommitted Immediate draft; the publication pass commits
          # it (scripts/releases/store.py).
          python -m scripts.releases.store submit "${files[0]}"
      - name: Name the Store package for a manual upload
        if: failure()
        shell: bash
        run: |
          name=$(cd verified 2>/dev/null && ls Store-*.msixbundle 2>/dev/null | head -1)
          base="${CLOUDFLARE_R2_PUBLIC_URL%/}/releases/tag/$HERMES_ARCHIVE_TAG"
          url="$base/${name:-handoff-windows-universal.json}"
          msg="Store submission failed; the release is still publishable. Upload this package in Partner Center: $url"
          echo "::warning title=Microsoft Store::$msg"
          { echo "## Microsoft Store: manual upload needed"; echo; echo "$msg"; } >> "$GITHUB_STEP_SUMMARY"

  stable-phase-result:
    name: Stable bundle phase completed
    if: always() && inputs.release-phase != ''
    needs:
      [
        validate,
        build-darwin-arm64,
        build-win32-arm64,
        build-win32-x64,
        assemble-win32-bundle,
        smoke-darwin-arm64,
        smoke-win32-arm64,
        smoke-win32-x64,
        termux-deb,
        stable-publish,
        stable-store
      ]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ github.sha }}
      - name: Require every phase job
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          RELEASE_PHASE: ${{ inputs.release-phase }}
          SKIP_TESTS: ${{ inputs.skip-tests }}
          SKIP_SIGNED: ${{ inputs.skip-signed }}
          WINDOWS_SMOKES_WITH_BUNDLE: ${{ inputs.windows-smokes-with-bundle }}
        run: |
          python - <<'PY'
          import json, os
          from scripts.releases.job_groups import JOB_GROUPS, phase_jobs
          from scripts.releases.stable import require_success
          needs = json.loads(os.environ['RELEASE_NEEDS'])
          outputs = needs['validate'].get('outputs', {})
          selected = {group: outputs.get(group) == 'true' for group in JOB_GROUPS}
          require_success(needs, phase_jobs(selected, os.environ['RELEASE_PHASE'],
                                            skip_tests=os.environ['SKIP_TESTS'] == 'true',
                                            skip_signed=os.environ['SKIP_SIGNED'] == 'true',
                                            windows_smokes_with_bundle=os.environ.get('WINDOWS_SMOKES_WITH_BUNDLE') == 'true'))
          PY
