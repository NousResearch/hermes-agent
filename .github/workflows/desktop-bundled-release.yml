  # Assembly never writes a feed, including for canaries.
  assemble-win32-bundle:
    name: Assemble and stage the Windows universal bundle
    needs: [validate, build-win32-x64, build-win32-arm64]
    if: >-
      !cancelled() && needs.validate.result == 'success' && needs.validate.outputs.sha != ''
      && needs.validate.outputs.win32-x64 == 'true' && needs.validate.outputs.win32-arm64 == 'true'
      && needs.validate.outputs.win32-bundle == 'true'
      && needs.build-win32-x64.result == 'success' && needs.build-win32-arm64.result == 'success'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && (inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '' || inputs.channel != '')
    runs-on: windows-latest-32-core
    environment: release-signing
    cache-mode: read
    timeout-minutes: 45
    outputs:
      receipt-url: ${{ steps.receipt.outputs.receipt-url }}
      receipt-sha256: ${{ steps.receipt.outputs.receipt-sha256 }}
    env:
      CHANNEL_BUILD: ${{ needs.validate.outputs.channel-build }}
      CHANNEL_REQUEST_SHA256: ${{ needs.validate.outputs.channel-request-sha256 }}
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      # Archive ref for the universal-bundle handoff: attempt ref for stable.
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      HERMES_BUILD_COMMIT: ${{ inputs.build_commit != '' && needs.validate.outputs.channel-build == '' && needs.validate.outputs.sha || '' }}
      HERMES_PAYLOAD_VERSION: ${{ needs.validate.outputs.payload-version }}
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
      AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
      AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
      AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
      AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
    steps:
      # Full checkout: stage-msixbundle.mjs imports ./msix-shared.mjs and the
      # job runs it with no checkout at all today — ERR_MODULE_NOT_FOUND.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Channel assembly/publishing code stays at the trusted controller.
          ref: ${{ needs.validate.outputs.channel-build != '' && github.sha || needs.validate.outputs.sha }}
          # stage-msixbundle derives the canary MSIX build number as
          # minutes-since-the-last-stable from git tags — tag builds must
          # see them; channel/commit builds derive from the request/env.
          fetch-depth: ${{ (inputs.build_commit != '' || needs.validate.outputs.channel-build != '') && 1 || 0 }}
          fetch-tags: ${{ inputs.build_commit == '' && needs.validate.outputs.channel-build == '' }}

      - name: Retrieve pinned channel request
        if: needs.validate.outputs.channel-build != ''
        shell: bash
        env:
          CHANNEL_BUILD: ${{ needs.validate.outputs.channel-build }}
          CHANNEL_REQUEST_SHA256: ${{ needs.validate.outputs.channel-request-sha256 }}
        run: python -m scripts.releases.channel_publish request --out "$RUNNER_TEMP/channel-request.json"

      - name: Set up the locked build toolchain
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          archive-inputs: ${{ inputs.disposable_run == '' && inputs.disposable_channel == '' }}
          cache-python: false
          save-tools-cache: false
          save-node-cache: false

      - name: Install the locked Windows bundle tooling
        uses: ./.github/actions/retry
        with:
          # No Electron/native postinstalls: only the builder's SDK downloader.
          command: npm ci --workspace apps/desktop --include-workspace-root --include=dev --ignore-scripts --no-audit --no-fund

      - name: Resolve toolchain cache key
        id: toolchain
        shell: bash
        run: |
          node -e '
            const l = require("./package-lock.json")
            const el = l.packages["apps/desktop/node_modules/electron"].version
            const eb = l.packages["node_modules/electron-builder"].version
            if (!el || !eb) process.exit(1)
            console.log("electron=" + el)
            console.log("builder=" + eb)
          ' >> "$GITHUB_OUTPUT"

      # Cache reuse is optional. Bundle scripts provision the pinned SDK
      # and signing dependencies through electron-builder on a cache miss.
      # This smaller consumer has its own cache, separate from desktop inputs.
      - name: Restore electron + electron-builder toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # ensureWindowsBundleTools resolves the winCodeSign kit, ATS dlib
          # and dotnet runtime through electron-builder's toolset cache.
          path: ${{ github.workspace }}/.cache/electron-builder
          # Saved by the Windows release build legs during preparation.
          key: eb3-${{ runner.os }}-${{ runner.arch }}-builder-${{ steps.toolchain.outputs.builder }}
          restore-keys: |
            eb3-${{ runner.os }}-${{ runner.arch }}-

      - name: Retrieve Windows packages from R2
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
        run: |
          if [ -n "${CHANNEL_BUILD:-}" ]; then
            python -m scripts.releases.handoff fetch --channel-request "$RUNNER_TEMP/channel-request.json" \
              --name win32-x64 --name win32-arm64 --root apps/desktop/release --include '*.msix'
          elif [ -n "$HERMES_BUILD_COMMIT" ]; then
            python -m scripts.releases.handoff fetch --commit-build "$HERMES_BUILD_COMMIT" \
              --commit "$RELEASE_COMMIT" \
              --name win32-x64 --name win32-arm64 --root apps/desktop/release --include '*.msix'
          else
            python -m scripts.releases.handoff fetch --tag "${HERMES_ARCHIVE_TAG:-$HERMES_PAYLOAD_TAG}" --commit "$RELEASE_COMMIT" \
              --name win32-x64 --name win32-arm64 --root apps/desktop/release --include '*.msix'
          fi

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Mint federated token for the signing dlib
        shell: bash
        run: |
          file="$RUNNER_TEMP/azure-federated-token"
          mint() {
            curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
              | jq -r .value > "$file.tmp" && mv -f "$file.tmp" "$file"
          }
          mint
          ( while sleep 240; do mint || true; done ) &
          echo "AZURE_FEDERATED_TOKEN_FILE=$file" >> "$GITHUB_ENV"

      - name: Assemble the signed MSIX bundle without publishing
        shell: bash
        env:
          RELEASE_PHASE: ${{ inputs.release-phase }}
          AZURE_TOKEN_CREDENTIALS: prod
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          # All modes stop at signed bytes. The separate handoff stages them
          # for smoke; publication must not assemble or sign a second time.
          if [ -n "${CHANNEL_BUILD:-}" ]; then
            node scripts/stage-msixbundle.mjs --channel-request "$RUNNER_TEMP/channel-request.json" --variant bundled
            exit 0
          fi
          if [ -n "$HERMES_BUILD_COMMIT" ]; then
            node scripts/stage-msixbundle.mjs --commit "$HERMES_BUILD_COMMIT" --version "$HERMES_PAYLOAD_VERSION" --variant bundled --no-upload
            exit 0
          fi
          args=()
          if [ "$RELEASE_PHASE" = candidate ]; then args+=(--candidate); fi
          node scripts/stage-msixbundle.mjs --tag "$HERMES_PAYLOAD_TAG" --variant bundled "${args[@]}"
          if [ "$RELEASE_PHASE" = candidate ]; then
            node scripts/bundle-store-msixbundle.mjs --tag "$HERMES_PAYLOAD_TAG"
          fi

      - name: Stage universal bundles to R2
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
        run: |
          if [ -n "${CHANNEL_BUILD:-}" ]; then
            python -m scripts.releases.handoff stage --channel-request "$RUNNER_TEMP/channel-request.json" \
              --name windows-universal --root apps/desktop/release --include '*.msixbundle'
          elif [ -n "$HERMES_BUILD_COMMIT" ]; then
            python -m scripts.releases.handoff stage --commit-build "$HERMES_BUILD_COMMIT" \
              --commit "$RELEASE_COMMIT" \
              --name windows-universal --root apps/desktop/release --include '*.msixbundle'
          else
            python -m scripts.releases.handoff stage --tag "${HERMES_ARCHIVE_TAG:-$HERMES_PAYLOAD_TAG}" --commit "$RELEASE_COMMIT" \
              --name windows-universal --root apps/desktop/release --include '*.msixbundle'
          fi

      - name: Stage the stable win32-bundle receipt
        # Same receipt-before-smoke contract as the darwin arches (decision 11):
        # the bundle and its per-arch metadata are staged and digest-verified;
        # acceptance still blocks publication.
        if: inputs.release-phase == 'candidate'
        id: receipt
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
        run: python -m scripts.releases.stable stage-receipt --receipt win32-bundle

  publish-channel:
    name: Publish the complete native-smoked channel build
    needs:
      [
        validate,
        build-darwin-arm64,
        build-darwin-x64,
        build-win32-arm64,
        build-win32-x64,
        assemble-win32-bundle,
        smoke-darwin-arm64,
        smoke-darwin-x64,
        smoke-win32-arm64,
        smoke-win32-x64
      ]
    if: >-
      !cancelled() && needs.validate.outputs.channel-build != '' && needs.validate.result == 'success'
      && needs.validate.outputs.darwin-arm64 == 'true' && needs.validate.outputs.darwin-x64 == 'true'
      && needs.validate.outputs.win32-arm64 == 'true' && needs.validate.outputs.win32-x64 == 'true'
      && needs.validate.outputs.win32-bundle == 'true'
      && needs.build-darwin-arm64.result == 'success' && needs.build-darwin-x64.result == 'success'
      && needs.build-win32-arm64.result == 'success' && needs.build-win32-x64.result == 'success'
      && needs.assemble-win32-bundle.result == 'success'
      && needs.smoke-darwin-arm64.result == 'success' && needs.smoke-darwin-x64.result == 'success'
      && needs.smoke-win32-arm64.result == 'success' && needs.smoke-win32-x64.result == 'success'
    runs-on: ubuntu-24.04
    environment: release-signing
    cache-mode: read
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      CHANNEL_BUILD: ${{ needs.validate.outputs.channel-build }}
      CHANNEL_REQUEST_SHA256: ${{ needs.validate.outputs.channel-request-sha256 }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_NEEDS: ${{ toJSON(needs) }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          # require_pushed proves commit-build ancestry from local history;
          # a shallow clone fails after main advances past the built SHA.
          fetch-depth: 0
      - name: Publish tested disposable receiver without promoting T
        if: needs.validate.outputs.receiver-candidate == 'true'
        run: python -m scripts.releases.channel_publish receiver-publish --root "$RUNNER_TEMP/channel-publish"
      - name: Publish immutable feeds and manifest, then CAS channel head
        if: needs.validate.outputs.receiver-candidate != 'true'
        shell: bash
        run: |
          python -m scripts.releases.channel_publish publish --root "$RUNNER_TEMP/channel-publish"
          python scripts/render-builds-table.py --channel-build "$CHANNEL_BUILD" \
            --channel-request-sha256 "$CHANNEL_REQUEST_SHA256" --repo "$GITHUB_REPOSITORY" \
            --r2-base-url "$(python -c 'from scripts.releases.r2_scope import channel_public_base; print(channel_public_base())')" \
            --summary-out "$GITHUB_STEP_SUMMARY"

  publish-win32-updater:
    name: Publish the tested Windows canary bundle
    needs: [validate, assemble-win32-bundle, smoke-win32-arm64, smoke-win32-x64]
    if: >-
      !cancelled() && inputs.build_commit == '' && inputs.channel == '' && inputs.upload_release == true
      && inputs.release-phase == ''
      && needs.validate.outputs.win32-arm64 == 'true' && needs.validate.outputs.win32-x64 == 'true'
      && needs.validate.outputs.win32-bundle == 'true'
      && needs.validate.result == 'success' && needs.validate.outputs.sha != ''
      && needs.assemble-win32-bundle.result == 'success'
      && needs.smoke-win32-arm64.result == 'success' && needs.smoke-win32-x64.result == 'success'
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 15
    concurrency:
      group: win32-updater-feed-canary
      cancel-in-progress: false
    env:
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      HERMES_DESKTOP_VARIANT: bundled
      RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          cache-python: false
          cache-node: false
      - name: Retrieve the tested universal bundle
        shell: bash
        run: |
          python -m scripts.releases.handoff fetch --tag "$HERMES_PAYLOAD_TAG" --commit "$RELEASE_COMMIT" \
            --name windows-universal --root staged --include 'HermesBundled-*-win.msixbundle'
      - name: Publish identical tested bytes without rebuilding
        shell: bash
        run: |
          node --input-type=module -e '
            import identity from "./apps/desktop/product-identity.cjs";
            import { appIdentity, OUT_OF_STORE_PUBLISHER } from "./scripts/msix-shared.mjs";
            const build = appIdentity(process.cwd() + "/apps/desktop");
            console.log(JSON.stringify({identity: identity.msixAppIdWithOrg, publisher: OUT_OF_STORE_PUBLISHER, version: build.version}));
          ' > staged/expected-identity.json
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from scripts.bundles.release_artifacts import main, single
          expected = json.loads(Path('staged/expected-identity.json').read_text(encoding='utf-8'))
          bundle = single(Path('staged').glob('HermesBundled-*-win.msixbundle'))
          # The handoff binds the assembly filename and bytes. Never recompute
          # its revision against stable tags that can change after native smoke.
          match = re.fullmatch(r'HermesBundled-(\d+\.\d+\.\d+\.\d+)-win\.msixbundle', bundle.name)
          if not match:
              raise ValueError('Missing assembly version in receipt-bound bundle name')
          version = match[1]
          if (any(str(int(part)) != part or int(part) > 65535 for part in version.split('.'))
                  or version != expected['version']):
              raise ValueError('Assembly version differs from the admitted build identity')
          # publish-appinstaller compares this version to the baked envelope.
          main(['publish-appinstaller', '--root', 'staged', '--bundle', str(bundle),
                '--tag', os.environ['HERMES_PAYLOAD_TAG'], '--variant', 'bundled',
                '--identity', expected['identity'], '--publisher', expected['publisher'],
                '--version', version])
          PY

  # ── macOS updater channel (REAL) ───────────────────────────────────────────
  # Merges the per-arch feed ymls (arm64-stable-mac.yml / x64-stable-mac.yml
  # …) into releases/darwin/<channel>/<channel>-mac.yml via
  # scripts/releases/r2.py finalize. The binaries were staged by the build
  # legs (releases/tag/<tag>/); the feed POINTER is written here, last, only
  # after BOTH darwin legs are green — a failed leg can never publish a
  # partial channel. The concurrency group is scoped to the channel so two
  # dispatches for the same channel serialize their feed writes (r2-release
  # finalize also refuses backward publication); stable and canary still
  # publish in parallel by design (distinct feed files).
  publish-darwin-updater:
    name: Publish the macOS updater feed
    needs: [validate, build-darwin-arm64, build-darwin-x64, smoke-darwin-arm64, smoke-darwin-x64]
    if: >-
      !cancelled() && inputs.build_commit == '' && inputs.channel == '' && inputs.upload_release == true
      && inputs.release-phase == ''
      && needs.validate.outputs.darwin-arm64 == 'true' && needs.validate.outputs.darwin-x64 == 'true'
      && needs.validate.result == 'success' && needs.validate.outputs.sha != ''
      && needs.build-darwin-arm64.result == 'success' && needs.build-darwin-x64.result == 'success'
      && needs.smoke-darwin-arm64.result == 'success' && needs.smoke-darwin-x64.result == 'success'
    runs-on: ubuntu-24.04
    environment: release-signing
    timeout-minutes: 15
    concurrency:
      group: darwin-updater-feed-${{ needs.validate.outputs.channel }}
      cancel-in-progress: false
    env:
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Privileged job: pin to the SHA validate admitted, not the tag.
          ref: ${{ needs.validate.outputs.sha }}

      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false

      - name: Retrieve macOS feed inputs from R2
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
        run: |
          python -m scripts.releases.handoff fetch --tag "$HERMES_PAYLOAD_TAG" --commit "$RELEASE_COMMIT" \
            --name darwin-x64 --name darwin-arm64 --root staged --include '*-mac.yml'

      - name: Assert the per-arch feeds are present
        shell: bash
        # finalize merges *-mac.yml and (feed-side) rejects mixed versions
        # and conflicting digests; here we fail fast if a leg never
        # produced its yml so a single-arch feed can never publish.
        run: |
          shopt -s nullglob
          ymls=(staged/*-mac.yml)
          if [ ${#ymls[@]} -ne 2 ]; then
            echo "::error::expected the arm64 AND x64 feed ymls in the staged artifacts, found ${#ymls[@]}: ${ymls[*]}"
            exit 1
          fi
          archs=()
          for f in "${ymls[@]}"; do archs+=("$(basename "$f" | cut -d- -f1)"); done
          printf '%s\n' "${archs[@]}" | sort -u | grep -qx arm64 || { echo "::error::arm64 feed yml missing"; exit 1; }
          printf '%s\n' "${archs[@]}" | sort -u | grep -qx x64   || { echo "::error::x64 feed yml missing"; exit 1; }
          echo "staged feeds: ${ymls[*]}"

      - name: Finalize the macOS updater feeds
        # Writes releases/darwin/<channel>/<channel>-mac.yml pointing at the
        # already-staged /releases/tag/<tag>/ binaries. Immutable objects
        # referenced by the feed are verified before the pointer uploads
        # (feed-side); the pointer upload is the last write of the run.
        shell: bash
        run: |
          python -m scripts.ci.python_packages ruamel.yaml==0.18.17 -- -m scripts.releases.r2 finalize --tag "$HERMES_PAYLOAD_TAG" --dir staged

  termux-deb:
    name: Build + publish the termux .deb (aarch64)
    needs: [validate]
    if: inputs.channel == '' && inputs.disposable_channel == '' && needs.validate.outputs.termux == 'true' && (inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '')
    runs-on: ubuntu-24.04-arm
    environment: release-signing
    timeout-minutes: 90
    env:
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      # Archive ref for the termux handoff: attempt ref for stable phases.
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      HERMES_BUILD_COMMIT: ${{ inputs.build_commit != '' && needs.validate.outputs.channel-build == '' && needs.validate.outputs.sha || '' }}
      HERMES_RELEASE_COMMIT: ${{ inputs.release-phase != '' && needs.validate.outputs.sha || '' }}
      # termux_build.sh gates on `gh release view <tag>` (refuse to build
      # before the release exists); gh needs GH_TOKEN or it errors out and
      # the gate misreads that as "release not found".
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
    steps:
      # Use the admitted commit, not a tag that can move after validation.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
          # Commit builds only rev-parse HEAD; tag builds verify ancestry.
          fetch-depth: ${{ inputs.build_commit != '' && 1 || 0 }}
          fetch-tags: ${{ inputs.build_commit == '' }}

      - name: Set up the locked build toolchain
        id: pm
        uses: ./.github/actions/setup-pm
        with:
          toolchain: python
          archive-inputs: true
          cache-python: false

      - name: Derive the channel from the tag
        id: channel
        if: inputs.build_commit == ''
        shell: bash
        # Single source of truth: deb_version.py --channel uses the same
        # _TAG_RE as the Debian version derivation, so the channel and the
        # .deb version can never disagree about the tag's shape.
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "channel=$(python3 scripts/termux/deb_version.py --channel "$TAG")" >> "$GITHUB_OUTPUT"

      - name: Read the termux-docker digest pin
        id: pins
        shell: bash
        # The digest is pinned in pm/lock.json (the termux-docker package)
        # beside every other third-party pin; the build scripts re-read it
        # themselves. This step surfaces the effective pin in the run log
        # and fails fast if the lock row is missing.
        run: |
          echo "digest=$(python3 -c 'import sys; sys.path.insert(0, "."); from pm.lock import termux_docker_digest; print(termux_docker_digest())')" >> "$GITHUB_OUTPUT"

      - name: Restore the CPython + node + uv payload builds
        # Restore/save are split: the save runs right after staging (with
        # `always()`), so a later phase's failure cannot throw away 20+
        # minutes of builds. The exact key is content-only on pm/lock.json +
        # the stagers, so it is stable across dispatches; the restore-keys
        # prefix rescues the previous pin's builds when the lock moved.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            termux-build/payload/python
            termux-build/payload/node
            termux-build/payload/uv
            termux-build/payload/npm
            termux-build/payload/ffmpeg
            termux-build/payload/ripgrep
            termux-build/payload/runtime-libs
          key: termux-payload-${{ hashFiles('pm/lock.json', 'scripts/termux/build_cpython.sh', 'scripts/termux/build_node.sh', 'scripts/termux/build_uv.sh', 'scripts/termux/runtime_libs.json', 'scripts/termux/stage_runtime_libs.py') }}
          restore-keys: |
            termux-payload-

      - name: Preserve and retrieve pinned inputs
        shell: bash
        run: python -m scripts.ci.archive_inputs --target linux-arm64-bionic --payload termux-build/payload --store "$HERMES_RUNTIME_DIR"

      - name: Build CPython into the payload
        shell: bash
        run: bash scripts/termux/build_cpython.sh termux-build/payload

      - name: Build node into the payload
        shell: bash
        run: bash scripts/termux/build_node.sh termux-build/payload

      - name: Stage the runtime libs into the payload
        shell: bash
        # The payload interpreters' runtime libs (python's C-extension deps,
        # node's, uv's zstd) ship INSIDE the sealed deb: the device's termux
        # tree may have none of them installed. Pin table derived from the
        # suppliers' own Depends metadata (see runtime_libs.json).
        run: python3 scripts/termux/stage_runtime_libs.py termux-build/payload

      - name: Stage uv into the payload
        shell: bash
        # The wheelhouse resolver + runtime lazy-install tool: pm stages
        # the bionic uv .deb beside python/node (no PATH install; the
        # payload env composition exposes it, desktop payload model).
        run: bash scripts/termux/build_uv.sh termux-build/payload

      - name: Stage the remaining CLI runtime tools
        shell: bash
        run: |
          for tool in npm ffmpeg ripgrep; do
            bash scripts/termux/termux_pkg_build.sh "$tool" "$tool" termux-build/payload
          done

      - name: Save the payload builds
        # Save regardless of the wheelhouse/deb phases' outcome: the staged
        # tool payload is only stale when the lock or a stager changes, and
        # losing it to a downstream failure re-pays the full stage cost.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            termux-build/payload/python
            termux-build/payload/node
            termux-build/payload/uv
            termux-build/payload/npm
            termux-build/payload/ffmpeg
            termux-build/payload/ripgrep
            termux-build/payload/runtime-libs
          key: termux-payload-${{ hashFiles('pm/lock.json', 'scripts/termux/build_cpython.sh', 'scripts/termux/build_node.sh', 'scripts/termux/build_uv.sh', 'scripts/termux/runtime_libs.json', 'scripts/termux/stage_runtime_libs.py') }}

      - name: Ensure the derived builder image (toolchain pre-baked)
        id: builder_image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        # The pinned base and Dockerfile select the pre-baked toolchain.
        # Recipe changes must not reuse an image built without those tools.
        run: |
          mkdir -p termux-build
          # The builder script prints progress (build logs, smoke output)
          # plus the image ref on the LAST line -- command substitution
          # would swallow all of it into one $GITHUB_OUTPUT value.
          bash scripts/termux/build_builder_image.sh | tee termux-build/.builder-image.log
          img="$(tail -n1 termux-build/.builder-image.log)"
          echo "builder image: $img"
          echo "image=$img" >> "$GITHUB_OUTPUT"

      - name: Restore the wheelhouse
        # Reuse manufactured wheels only when the complete input identity
        # and wheel hashes pass admission. A prefix hit alone is not proof.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            termux-build/payload/wheelhouse
            termux-build/payload/index.json
            termux-build/payload/SHA256SUMS
            termux-build/payload/.work/resolved.txt
            termux-build/payload/.work/build_set.txt
          key: termux-wheelhouse-${{ hashFiles('uv.lock', 'pyproject.toml', 'pm/lock.json', 'scripts/termux/runtime_libs.json', 'scripts/termux/build_config.sh', 'scripts/termux/build_wheels.py', 'scripts/termux/termux_build.sh', 'scripts/termux/retag_wheel.py', 'scripts/termux/python_linkage.py', 'scripts/termux/wheelhouse_cache.py', 'scripts/termux/build_environment.py', 'pm/environment.py', 'pm/build_operations.py', 'pm/operations.py', 'pm/pyproject.toml', 'pm/uv.lock', 'scripts/termux/termux-builder.Dockerfile') }}
          restore-keys: |
            termux-wheelhouse-

      - name: Build the wheelhouse
        shell: bash
        env:
          TERMUX_BUILDER_IMAGE: ${{ steps.builder_image.outputs.image }}
        # termux_build.sh lands wheelhouse/ + index.json + SHA256SUMS in the
        # payload root, where build_deb.sh's --no-index pip install finds it.
        run: |
          if [ -n "${HERMES_RELEASE_COMMIT:-}" ]; then
            bash scripts/termux/termux_build.sh \
              --repo . \
              --tag "$HERMES_PAYLOAD_TAG" \
              --release-commit "$HERMES_RELEASE_COMMIT" \
              --out termux-build/payload
          elif [ -n "$HERMES_BUILD_COMMIT" ]; then
            # The checkout is the admitted commit. No release tag is required.
            bash scripts/termux/termux_build.sh \
              --repo . \
              --commit "$HERMES_BUILD_COMMIT" \
              --out termux-build/payload
          else
            bash scripts/termux/termux_build.sh \
              --repo . \
              --tag "$HERMES_PAYLOAD_TAG" \
              --out termux-build/payload
          fi

      - name: Save the wheelhouse
        # Only proven wheels enter the cache. Saving before deb assembly
        # preserves them if a later packaging step fails.
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            termux-build/payload/wheelhouse
            termux-build/payload/index.json
            termux-build/payload/SHA256SUMS
            termux-build/payload/.work/resolved.txt
            termux-build/payload/.work/build_set.txt
          key: termux-wheelhouse-${{ hashFiles('uv.lock', 'pyproject.toml', 'pm/lock.json', 'scripts/termux/runtime_libs.json', 'scripts/termux/build_config.sh', 'scripts/termux/build_wheels.py', 'scripts/termux/termux_build.sh', 'scripts/termux/retag_wheel.py', 'scripts/termux/python_linkage.py', 'scripts/termux/wheelhouse_cache.py', 'scripts/termux/build_environment.py', 'pm/environment.py', 'pm/build_operations.py', 'pm/operations.py', 'pm/pyproject.toml', 'pm/uv.lock', 'scripts/termux/termux-builder.Dockerfile') }}

      - name: Assemble the .deb
        shell: bash
        env:
          TERMUX_BUILDER_IMAGE: ${{ steps.builder_image.outputs.image }}
        # The driver prepares locked TUI dependencies and builds the shared
        # TUI product before handing the staged bionic payload to build_deb.sh.
        # Native dependency staging stays above; .deb validation still runs
        # in a fresh pinned container with no opt-out.
        run: |
          if [ -n "${HERMES_RELEASE_COMMIT:-}" ]; then
            python3 scripts/termux/build.py \
              --repo . \
              --tag "$HERMES_PAYLOAD_TAG" \
              --release-commit "$HERMES_RELEASE_COMMIT" \
              --payload termux-build/payload \
              --out termux-build/deb
          elif [ -n "$HERMES_BUILD_COMMIT" ]; then
            python3 scripts/termux/build.py \
              --repo . \
              --commit "$HERMES_BUILD_COMMIT" \
              --payload termux-build/payload \
              --out termux-build/deb
          else
            python3 scripts/termux/build.py \
              --repo . \
              --tag "$HERMES_PAYLOAD_TAG" \
              --payload termux-build/payload \
              --out termux-build/deb
          fi

      - name: Retrieve the previous published Termux package from R2
        if: inputs.termux_upgrade_from_tag != ''
        env:
          PREVIOUS_TAG: ${{ inputs.termux_upgrade_from_tag }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from scripts.releases.handoff import fetch
          from scripts.releases.semver import is_valid_version
          tag = os.environ['PREVIOUS_TAG']
          if not tag.startswith('v') or not is_valid_version(tag[1:]):
              raise ValueError('Invalid previous release tag')
          release = json.loads(subprocess.check_output([
              'gh', 'release', 'view', tag, '--repo', os.environ['GITHUB_REPOSITORY'],
              '--json', 'tagName,isDraft'], text=True))
          if release['tagName'] != tag or release['isDraft']:
              raise ValueError('Previous package must come from a published release')
          commit = subprocess.check_output(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          subprocess.run(['git', 'merge-base', '--is-ancestor', commit, 'origin/main'], check=True)
          fetch(tag, commit, ['termux'], Path('termux-build/previous'), ['deb/*.deb'])
          PY

      - name: Stage the commit-build deb to R2
        if: inputs.build_commit != ''
        shell: bash
        run: |
          python -m scripts.releases.handoff stage --commit-build "$HERMES_BUILD_COMMIT" \
            --name termux --root termux-build --include 'deb/*.deb'

      - name: Write the APT signing key
        if: inputs.build_commit == ''
        shell: bash
        env:
          TERMUX_APT_GPG_KEY: ${{ secrets.TERMUX_APT_GPG_KEY }}
        run: |
          if [ -z "$TERMUX_APT_GPG_KEY" ]; then
            echo "::error::TERMUX_APT_GPG_KEY secret not set — the APT repo would stage unsigned"
            exit 1
          fi
          printf '%s\n' "$TERMUX_APT_GPG_KEY" > "$RUNNER_TEMP/termux-apt-gpg.asc"

      - name: Stage the APT repo and publish to R2
        if: inputs.build_commit == ''
        shell: bash
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          PREVIOUS_TAG: ${{ inputs.termux_upgrade_from_tag }}
          RELEASE_PHASE: ${{ inputs.release-phase }}
          RELEASE_CLAIM_TAG: ${{ inputs.claim-tag }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          # Passphrase-protected signing keys only; unset for bare keys.
          TERMUX_APT_GPG_PASSPHRASE: ${{ secrets.TERMUX_APT_GPG_PASSPHRASE }}
        run: |
          # stage_apt_repo.py builds dists/<suite>/ + pool/ under --out and
          # signs Release/InRelease with the key file. Exit 3 (unsigned
          # Release) must fail the run.
          # The candidate phase keys the pool by the attempt ref: the pool
          # upload is immutable with a one-year cache header, so a recut of
          # the same version must never reuse a pool key.
          stage_args=(--pool termux-build/deb --out termux-build/apt --suite "hermes-$CHANNEL")
          if [ "$RELEASE_PHASE" = candidate ]; then
            stage_args+=(--pool-subdir "$RELEASE_CLAIM_TAG")
          fi
          python3 scripts/termux/stage_apt_repo.py "${stage_args[@]}" \
            --gpg-key-file "$RUNNER_TEMP/termux-apt-gpg.asc"

          debs=(termux-build/deb/*.deb)
          test "${#debs[@]}" -eq 1
          version=$(dpkg-deb --field "${debs[0]}" Version)
          digest=$(python3 -c 'from pm.lock import termux_docker_digest; print(termux_docker_digest())')
          docker run --rm --platform linux/arm64 --user 1000:1000 --network none \
            -v "$PWD/termux-build/apt:/apt:ro" \
            -v "$PWD/scripts/termux/check_apt.sh:/tmp/check-apt.sh:ro" \
            -v "$PWD/scripts/termux/validate_installed.py:/tmp/validate_installed.py:ro" \
            "termux/termux-docker@$digest" bash /tmp/check-apt.sh "hermes-$CHANNEL" "$version"
          if [ -n "$PREVIOUS_TAG" ]; then
            previous=(termux-build/previous/deb/*.deb)
            test "${#previous[@]}" -eq 1
            docker run --rm --platform linux/arm64 --user 1000:1000 --network none \
              -v "$PWD/termux-build/apt:/apt:ro" \
              -v "$PWD/${previous[0]}:/previous.deb:ro" \
              -v "$PWD/scripts/termux/check_apt.sh:/tmp/check-apt.sh:ro" \
              -v "$PWD/scripts/termux/validate_installed.py:/tmp/validate_installed.py:ro" \
              "termux/termux-docker@$digest" bash /tmp/check-apt.sh "hermes-$CHANNEL" "$version"
          fi

          args=(--include 'deb/*.deb' --include 'apt/**/*')
          if [ "$RELEASE_PHASE" = candidate ]; then
            python -m scripts.bundles.release_artifacts record --platform termux --arch aarch64 \
              --root termux-build --tag "$HERMES_PAYLOAD_TAG" --commit "$RELEASE_COMMIT" \
              --out termux-build/metadata-termux-aarch64.json
            args+=(--include 'metadata-*.json')
          fi
          python -m scripts.releases.handoff stage --tag "${HERMES_ARCHIVE_TAG:-$HERMES_PAYLOAD_TAG}" --commit "$RELEASE_COMMIT" \
            --name termux --root termux-build "${args[@]}"
          if [ "$RELEASE_PHASE" = candidate ]; then exit 0; fi
          # --key-is-full is MANDATORY on every feed-dir upload: without it
          # scripts.releases.r2 re-prefixes the key into the tag archive
          # (releases/tag/<tag>/) and the APT feed never lands at
          # releases/termux/<channel>/.
          shopt -s globstar nullglob
          # cd into the staged repo for the glob, but resolve the r2 client
          # absolutely first -- after the cd, scripts/ is no longer in the
          # cwd and a bare `python -m scripts.releases.r2` would ENOENT.
          export PYTHONPATH="$GITHUB_WORKSPACE"
          cd termux-build/apt
          files=(pool/**/*.deb "dists/hermes-$CHANNEL"/main/binary-aarch64/by-hash/*/* key.asc
                 "dists/hermes-$CHANNEL/main/binary-aarch64/Packages"
                 "dists/hermes-$CHANNEL/main/binary-aarch64/Packages.gz"
                 "dists/hermes-$CHANNEL/Release"
                 "dists/hermes-$CHANNEL/Release.gpg"
                 "dists/hermes-$CHANNEL/InRelease")
          # APT reads InRelease first. Publish it only after every referenced
          # index and package has been uploaded and read back successfully.
          for f in "${files[@]}"; do
            test -f "$f"
            python3 -m scripts.releases.r2 put \
              --tag "$HERMES_PAYLOAD_TAG" \
              --key "releases/termux/$CHANNEL/$f" \
              --file "$f" \
              --key-is-full
          done

          # Verify the public CDN path, not only the object-store origin.
          public_repo="${CLOUDFLARE_R2_PUBLIC_URL%/}/releases/termux/$CHANNEL"
          curl --fail --silent --show-error "$public_repo/key.asc" -o "$RUNNER_TEMP/termux-public-key.asc"
          cmp key.asc "$RUNNER_TEMP/termux-public-key.asc"
          docker run --rm --platform linux/arm64 --user 1000:1000 \
            -v "$PWD:/apt:ro" \
            -v "$GITHUB_WORKSPACE/scripts/termux/check_apt.sh:/tmp/check-apt.sh:ro" \
            -v "$GITHUB_WORKSPACE/scripts/termux/validate_installed.py:/tmp/validate_installed.py:ro" \
            "termux/termux-docker@$digest" bash /tmp/check-apt.sh "hermes-$CHANNEL" "$version" "$public_repo"

  builds-pending:
    name: Mark the builds table as in progress
    needs: validate
    # Pairs with builds-table: a pending page nothing finalizes must not be written.
    if: inputs.build_commit == '' && inputs.upload_release == true && needs.validate.outputs.all-jobs == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - name: Render the placeholder
        env:
          GH_TOKEN: ${{ github.token }}
          HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! gh release view "$HERMES_PAYLOAD_TAG" >/dev/null 2>&1; then
            echo "::error::no release exists for $HERMES_PAYLOAD_TAG — cannot mark the builds table"
            exit 1
          fi
          python3 scripts/render-builds-table.py \
            --tag "$HERMES_PAYLOAD_TAG" --repo "$GITHUB_REPOSITORY" \
            --pending-run-url "$RUN_URL"

  builds-table:
    name: Render the release builds table
    needs:
      [
        validate,
        build-win32-x64,
        build-win32-arm64,
        build-darwin-arm64,
        build-darwin-x64,
        build-linux-x64,
        build-linux-arm64,
        assemble-win32-bundle,
        smoke-darwin-arm64,
        smoke-darwin-x64,
        smoke-win32-arm64,
        smoke-win32-x64,
        publish-win32-updater,
        publish-darwin-updater,
        termux-deb
      ]
    # Failed builds still get a per-tag diagnostic page. The renderer only
    # advances the channel landing page when every prerequisite succeeded.
    if: |
      always() && inputs.build_commit == '' && inputs.channel == '' && inputs.upload_release == true && inputs.release-phase == ''
      && needs.validate.result == 'success' && needs.validate.outputs.sha != ''
      && needs.validate.outputs.all-jobs == 'true'
    runs-on: ubuntu-24.04
    environment: release-signing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Privileged job: pin to the SHA validate admitted. A bare checkout
          # here would land on the dispatch branch, not the release bytes.
          ref: ${{ needs.validate.outputs.sha }}
      - name: Render
        env:
          GH_TOKEN: ${{ github.token }}
          HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
        run: |
          python3 scripts/render-builds-table.py \
            --tag "$HERMES_PAYLOAD_TAG" --repo "$GITHUB_REPOSITORY" --run-url "$RUN_URL"

      # publish-canary consumes this job's result. Publish diagnostics first,
      # then retain the original all-needs-success release gate.
      - name: Preserve release success gate
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          from scripts.releases.stable import require_success
          needs = json.loads(os.environ['RELEASE_NEEDS'])
          require_success(needs, list(needs))
          PY

  commit-builds-summary:
    name: Upload status page to R2
    needs:
      [
        validate,
        build-win32-x64,
        build-win32-arm64,
        build-darwin-arm64,
        build-darwin-x64,
        build-linux-x64,
        build-linux-arm64,
        assemble-win32-bundle,
        smoke-darwin-arm64,
        smoke-darwin-x64,
        smoke-win32-arm64,
        smoke-win32-x64,
        termux-deb
      ]
    if: |
      always() && inputs.build_commit != '' && inputs.channel == '' && inputs.disposable_channel == ''
      && needs.validate.result == 'success' && needs.validate.outputs.sha != ''
      && needs.validate.outputs.all-jobs == 'true'
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Runs from the admitted commit so the renderer matches the built bytes.
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - name: Render the full expected-binary matrix
        env:
          HERMES_BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Render failed admitted builds too. Only receipt-listed objects
        # receive download links. Rendering does not alter job results.
        run: |
          set -e
          failed=$(python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ["RELEASE_NEEDS"])
          failed = [name for name, info in needs.items()
                    if info.get("result") not in ("success", "skipped")]
          print(",".join(sorted(failed)))
          PY
          )
          python3 scripts/render-builds-table.py \
            --summary-commit "$RELEASE_COMMIT" --repo "$GITHUB_REPOSITORY" \
            --summary-out "$GITHUB_STEP_SUMMARY" \
            --summary-failed-legs "$failed" --run-url "$RUN_URL"
      - name: Return to the trusted receipt controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish the post-build commit receipt
        env:
          BUILD_COMMIT: ${{ needs.validate.outputs.sha }}
          TAG: ''
          RELEASE_PHASE: ''
          UPLOAD_RELEASE: 'false'
          TERMUX_UPGRADE_FROM_TAG: ''
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.releases.commit_build receipt

  stable-publish:
    name: Verify published candidate files
    needs: validate
    if: inputs.release-phase == 'publish'
    runs-on: ubuntu-latest-32-core
    environment: release-signing
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      CANDIDATE_MANIFEST_SHA256: ${{ inputs.manifest-sha256 }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false
      - run: python -m scripts.bundles.release_artifacts publish --root verified

  stable-store:
    name: Submit the verified Store package
    needs: [validate, stable-publish]
    if: inputs.release-phase == 'publish'
    runs-on: windows-latest-32-core
    environment: release-signing
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      CANDIDATE_MANIFEST_SHA256: ${{ inputs.manifest-sha256 }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
      MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
      MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
      MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
      MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
      MS_STORE_PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false
      - name: Retrieve the exact Store candidate
        shell: bash
        run: python -m scripts.bundles.release_artifacts materialize --root verified --store-only
      - uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      - name: Submit without rebuilding
        shell: bash
        run: |
          test -n "$MS_STORE_PRODUCT_ID"
          msstore reconfigure --tenantId "$MS_STORE_TENANT_ID" --sellerId "$MS_STORE_SELLER_ID" --clientId "$MS_STORE_CLIENT_ID" --clientSecret "$MS_STORE_CLIENT_SECRET"
          files=(verified/Store-*.msixbundle)
          test "${#files[@]}" -eq 1
          test -f "${files[0]}"
          # Auto-publish stays off: the submission is committed with
          # targetPublishMode Manual and is released by the publication pass.
          python -m scripts.releases.store submit "${files[0]}"

  stable-phase-result:
    name: Stable bundle phase completed
    if: always() && inputs.release-phase != ''
    needs:
      [
        validate,
        build-darwin-arm64,
        build-darwin-x64,
        build-win32-arm64,
        build-win32-x64,
        assemble-win32-bundle,
        smoke-darwin-arm64,
        smoke-darwin-x64,
        smoke-win32-arm64,
        smoke-win32-x64,
        termux-deb,
        stable-publish,
        stable-store
      ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - name: Require every phase job
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          RELEASE_PHASE: ${{ inputs.release-phase }}
          SKIP_TESTS: ${{ inputs.skip-tests }}
        run: |
          python - <<'PY'
          import json, os
          from scripts.releases.job_groups import JOB_GROUPS, phase_jobs
          from scripts.releases.stable import require_success
          needs = json.loads(os.environ['RELEASE_NEEDS'])
          outputs = needs['validate'].get('outputs', {})
          selected = {group: outputs.get(group) == 'true' for group in JOB_GROUPS}
          require_success(needs, phase_jobs(selected, os.environ['RELEASE_PHASE'],
                                            skip_tests=os.environ['SKIP_TESTS'] == 'true'))
          PY

  publish-canary:
    name: Publish the canary release
    needs:
      [
        validate,
        build-win32-x64,
        build-win32-arm64,
        build-darwin-arm64,
        build-darwin-x64,
        build-linux-x64,
        build-linux-arm64,
        builds-table,
        assemble-win32-bundle,
        smoke-darwin-arm64,
        smoke-darwin-x64,
        smoke-win32-arm64,
        smoke-win32-x64,
        publish-win32-updater,
        publish-darwin-updater
      ]
    if: |
      always()
      && inputs.build_commit == '' && inputs.channel == ''
      && inputs.upload_release == true
      && contains(inputs.tag, '+canary.')
      && needs.validate.outputs.darwin-arm64 == 'true' && needs.validate.outputs.darwin-x64 == 'true'
      && needs.validate.outputs.win32-arm64 == 'true' && needs.validate.outputs.win32-x64 == 'true'
      && needs.validate.outputs.win32-bundle == 'true'
      && needs.validate.outputs.linux-x64 == 'true' && needs.validate.outputs.linux-arm64 == 'true'
      && needs.build-win32-x64.result == 'success' && needs.build-win32-arm64.result == 'success'
      && needs.build-darwin-arm64.result == 'success' && needs.build-darwin-x64.result == 'success'
      && needs.build-linux-x64.result == 'success' && needs.build-linux-arm64.result == 'success'
      && needs.builds-table.result == 'success'
      && needs.assemble-win32-bundle.result == 'success'
      && needs.smoke-darwin-arm64.result == 'success' && needs.smoke-darwin-x64.result == 'success'
      && needs.smoke-win32-arm64.result == 'success' && needs.smoke-win32-x64.result == 'success'
      && needs.publish-win32-updater.result == 'success'
      && needs.publish-darwin-updater.result == 'success'
    runs-on: ubuntu-24.04
    environment: release-signing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - uses: ./.github/actions/setup-pm
        with:
          cache-python: false
      - name: Set up the native identity reader
        uses: ./.github/actions/setup-pm
        with:
          toolchain: node
          cache-python: false
      # The controller rechecks native job results and exact remote tag custody,
      # publishes and reads back the prerelease, then advances R2.
      - name: Publish the admitted canary and advance its protected head
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TAG_OBJECT: ${{ needs.validate.outputs.tag-object }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
