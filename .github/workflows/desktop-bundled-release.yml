name: Desktop Bundled Release

# Builds the bundled desktop installer for each (os, arch) target.
#
#   tag admission (shape + pyproject lockstep + ancestry on origin/main,
#   resolved to an IMMUTABLE full SHA) → per-OS builder jobs → stage
#   files + receipts to R2 (releases/tag/<tag>/) → gated publish jobs write
#   feeds → builds table. Stable candidates stop before feed publication.
#
# Per-OS topology (canary feeds follow their own platform builds; stable
# publication and Store submission require the accepted cross-platform candidate):
#
#   build-win32 (win32-x64 + win32-arm64)   → stage packages + receipts to R2
#   build-darwin (darwin-arm64 + darwin-x64) → sign + notarize + stage
#     dmg/zip/blockmap + per-arch feed inputs to the R2 tag archive
#   build-linux                              → DISABLED for now (dummy skips)
#   assemble-win32-bundle                   → native universal bundles
#     (needs build-win32): all downloadable builds stage without touching feeds.
#   smoke-darwin / smoke-win32 (per arch) → native install + chat
#   publish-win32-updater                   → tested canary bytes + feed
#     (needs BOTH Windows smoke matrices); stable promotion is sequenced by
#     the stable publication controller after GitHub publication.
#   stable-store                           → verified Store submission
#     (needs stable-publish): materialize the immutable accepted Store bundle
#     and submit via the MSStore CLI without rebuilding.
#   publish-darwin-updater                  → macOS electron-updater feed
#     (needs BOTH darwin legs): scripts.releases.r2 finalize merges the per-arch
#     ymls into releases/darwin/<channel>/<channel>-mac.yml — the feed
#     pointer is written LAST, and the job's concurrency group serializes
#     same-channel publications.
#
# Feed layout (matches apps/desktop/electron/app-updater.ts's arms):
#   releases/win32/<stable|canary>/<ch>.appinstaller   App Installer feed
#     canary bundles live beside the feed; stable points into releases/tag/<tag>/
#   releases/darwin/<stable|canary>/<channel>-mac.yml  electron-updater feed
#     (dmg/zip live once in releases/tag/<tag>/; the merged feed points at
#     them with absolute object keys)
# The publish jobs write the feeds ONCE after their whole build matrix is
# green, so a failed leg can never publish a partial channel. Stable candidate
# jobs only stage tag-scoped objects; stable-release.yml gates feed promotion
# on package acceptance and artifact publication. No GitHub job artifacts
# carry release files. Non-publishing tag builds leave output on the runner.
# Commit builds stage under releases/commit/<sha>/ and write a run summary.
# They never publish a release, updater feed, Store submission, or APT channel.
# Admitted channel requests reuse those native build/smoke legs with read-only
# dependency caches. Their receipts use releases/channel-builds/<id>/; only the
# trusted publish-channel controller may CAS the channel after all smoke passes.
#
# Payload staging is `hermes pm bundle` on the native runner. There is
# no cross-target staging. The darwin legs sign (CSC_LINK) and notarize
# (afterSign notarize.mjs) when the release-signing environment carries the
# Apple credentials. Downloadable commit artifacts require the same signing
# checks as release artifacts. Unsigned tag builds cannot publish.
#
# scripts/bundles/desktop.py is the one driver. Local and CI run
# the same command. This workflow adds caching and upload only.
#
# Manual dispatch selects a tag or a pushed full commit. Commit dispatches
# use the default-branch workflow and require maintainer permission.
#
# R2 secrets (repo-level or the release-signing environment): the R2
# account id + an R2 API token (S3-compatible) with read/write on the
# release bucket; CLOUDFLARE_R2_BUCKET and CLOUDFLARE_R2_PUBLIC_URL are
# non-secret vars. scripts/releases/r2.py derives the S3 endpoint from
# the account id. Upload/list operations need only Python; feed operations use ruamel.yaml.
#
# Windows Store submission (stable-store): MSStore CLI via
# microsoft/microsoft-store-apppublisher. Credentials live in the
# release-signing environment:
#     secrets: MS_STORE_TENANT_ID, MS_STORE_SELLER_ID, MS_STORE_CLIENT_ID,
#              MS_STORE_CLIENT_SECRET
#     vars:    MS_STORE_PRODUCT_ID (the Partner Center product ID)
#   msstore reconfigure → msstore publish
#   <Store-*.msixbundle> -id <productId>
# The Store bundle is UNSIGNED on purpose — Partner Center re-signs on
# ingestion (see sign-msix.mjs).

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      claim-tag:
        default: ''
        type: string
      claim-object:
        default: ''
        type: string
      release-phase:
        required: true
        type: string
      manifest-sha256:
        default: ''
        type: string
      jobs:
        description: 'Comma-separated job groups. Default: every group.'
        type: string
        default: 'darwin-arm64,darwin-x64,win32-arm64,win32-x64,win32-bundle,linux-x64,linux-arm64,termux'
      skip-tests:
        description: 'Stable candidates only: build and stage without native smokes or in-build test suites (the claim skipped tests).'
        type: boolean
        default: false
    outputs:
      darwin-arm64-receipt-url:
        value: ${{ jobs.stage-receipt-darwin-arm64.outputs.receipt-url }}
        description: Immutable darwin-arm64 stable receipt
      darwin-arm64-receipt-sha256:
        value: ${{ jobs.stage-receipt-darwin-arm64.outputs.receipt-sha256 }}
        description: Digest of the darwin-arm64 stable receipt
      darwin-x64-receipt-url:
        value: ${{ jobs.stage-receipt-darwin-x64.outputs.receipt-url }}
        description: Immutable darwin-x64 stable receipt
      darwin-x64-receipt-sha256:
        value: ${{ jobs.stage-receipt-darwin-x64.outputs.receipt-sha256 }}
        description: Digest of the darwin-x64 stable receipt
      win32-bundle-receipt-url:
        value: ${{ jobs.assemble-win32-bundle.outputs.receipt-url }}
        description: Immutable win32-bundle stable receipt
      win32-bundle-receipt-sha256:
        value: ${{ jobs.assemble-win32-bundle.outputs.receipt-sha256 }}
        description: Digest of the win32-bundle stable receipt
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to bundle (vX.Y.Z or vX.Y.Z+canary.YYYYMMDDTHHMMSSZ). Must exist on the repo.'
        required: false
        type: string
        default: ''
      disposable_channel:
        description: 'Allocate a disposable preview from build_commit; prints a separate build dispatch. No native build in this run.'
        type: string
        default: ''
      disposable_receivers:
        description: 'Also allocate A/B and official-identity S/T test receivers in the fresh namespace; no releases.'
        type: boolean
        default: false
      disposable_run:
        description: 'Disposable allocation controller run id; the allocate step derives and overwrites it.'
        type: string
        default: ''
      channel:
        description: 'Preview channel name; this run allocates the channel and builds build_commit. Trusted default-branch dispatch only.'
        required: false
        type: string
        default: ''
      build_commit:
        description: 'Commit-only build: EXACT full 40-hex SHA already pushed to this repo (workflow_dispatch from the default branch only). Mutually exclusive with tag.'
        required: false
        type: string
        default: ''
      bundle_env:
        description: 'Commit desktop bundles only: JSON object of non-secret defaults (strings) or forced clears (null). Runtime values win over defaults, not clears.'
        required: false
        type: string
        default: '{}'
      jobs:
        description: 'Comma-separated job groups. Default: every group.'
        required: false
        type: string
        default: 'darwin-arm64,darwin-x64,win32-arm64,win32-x64,win32-bundle,linux-x64,linux-arm64,termux'
      termux_upgrade_from_tag:
        description: 'Published release tag whose R2 Termux package must upgrade to this build'
        required: false
        type: string
        default: ''
      upload_release:
        description: 'Upload artifacts to the R2 release bucket (staging + feeds)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write

concurrency:
  # One dispatch: a disposable run's identity is its channel name, so a
  # re-dispatch of the same channel serializes instead of racing the namespace.
  group: desktop-bundled-release-${{ inputs.channel || inputs.disposable_channel || inputs.tag || inputs.build_commit || 'canary' }}-${{ inputs.release-phase || 'canary' }}-${{ inputs.jobs }}
  cancel-in-progress: false

env:
  # One dispatch: a disposable-mode run leases its namespace by run id alone
  # (no attempt suffix) so "re-run failed jobs" re-enters the same namespace.
  R2_DISPOSABLE_RUN: ${{ inputs.disposable_run || (inputs.disposable_channel != '' && github.run_id) || '' }}
  RELEASE_CLAIM_TAG: ${{ inputs.claim-tag }}
  RELEASE_CLAIM_OBJECT: ${{ inputs.claim-object }}

jobs:
  validate:
    name: Pre-build setup
    # One dispatch: in disposable mode the allocation steps run first (the
    # channel pin comes from them), then admission validates the build source.
    # A failed allocation fails this job and skips everything downstream.
    runs-on: ubuntu-24.04
    # Public root is an environment variable, not a repository variable. No
    # secret is injected into admission; downstream jobs consume its outputs.
    environment: release-signing
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # Resolve the build source once. Every privileged job uses this SHA,
      # not a mutable tag or the dispatch branch.
      # The tag's channel (stable | canary). publish-darwin-updater scopes
      # its concurrency group on this so two dispatches for the SAME
      # channel can never race their feed writes (a stable and a canary
      # publish in parallel by design — different feed files).
      channel: ${{ steps.admission.outputs.channel }}
      sha: ${{ steps.admission.outputs.sha }}
      tag-object: ${{ steps.admission.outputs.tag-object }}
      payload-version: ${{ steps.admission.outputs.payload-version }}
      release-epoch: ${{ steps.admission.outputs.release-epoch }}
      receiver-candidate: ${{ steps.admission.outputs.receiver-candidate }}
      public-root: ${{ steps.admission.outputs.public-root }}
      public-base: ${{ steps.admission.outputs.public-base }}
      # The archive ref: the attempt ref for stable phases, the payload tag
      # for canary and commit builds. Every releases/tag/<ref>/ write reads it.
      archive-tag: ${{ steps.admission.outputs.archive-tag }}
      # One admission-parsed switch per job group; every job gates on its own.
      darwin-arm64: ${{ steps.admission.outputs.darwin-arm64 }}
      darwin-x64: ${{ steps.admission.outputs.darwin-x64 }}
      win32-arm64: ${{ steps.admission.outputs.win32-arm64 }}
      win32-x64: ${{ steps.admission.outputs.win32-x64 }}
      win32-bundle: ${{ steps.admission.outputs.win32-bundle }}
      linux-x64: ${{ steps.admission.outputs.linux-x64 }}
      linux-arm64: ${{ steps.admission.outputs.linux-arm64 }}
      termux: ${{ steps.admission.outputs.termux }}
      # Every group selected: the joins that render or summarize a whole build.
      all-jobs: ${{ steps.admission.outputs.all-jobs }}
      channel-build: ${{ ((inputs.disposable_channel != '' || inputs.channel != '') && steps.allocate.outputs.channel_build) || '' }}
      channel-request-sha256: ${{ ((inputs.disposable_channel != '' || inputs.channel != '') && steps.allocate.outputs.channel_request_sha256) || '' }}
      disposable-run: ${{ (inputs.disposable_channel != '' && github.run_id) || inputs.disposable_run || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ (inputs.build_commit != '' || inputs.channel != '' || inputs.release-phase != '') && github.sha || inputs.tag }}
          # Full checkout, always. Commit admission (require_pushed) needs the
          # full graph AND every pushed branch ref fetched into
          # refs/remotes/origin/* — a depth-1 checkout fetches only github.sha,
          # so it can't see the branch that actually carries build_commit.
          # Tag admission runs merge-base against origin/main and needs tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Print the release.py command for this run
        env:
          TAG: ${{ inputs.tag }}
          BUILD_COMMIT: ${{ inputs.build_commit }}
          CHANNEL: ${{ inputs.channel }}
          DISPOSABLE_CHANNEL: ${{ inputs.disposable_channel }}
          DISPOSABLE_RECEIVERS: ${{ inputs.disposable_receivers }}
          RELEASE_PHASE: ${{ inputs.release-phase }}
          UPLOAD_RELEASE: ${{ inputs.upload_release }}
          JOBS: ${{ inputs.jobs }}
          TERMUX_UPGRADE_FROM_TAG: ${{ inputs.termux_upgrade_from_tag }}
          BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 -m scripts.releases.dispatch_log

      - name: Archive every pinned input
        # Runner Python is intentional: the toolchain's upstream may be gone.
        # Same checkout contract the standalone archive job had: the tag ref
        # for tag builds, the dispatch head for commit builds.
        if: inputs.disposable_run == '' && inputs.disposable_channel == '' && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
        run: python3 -m scripts.ci.archive_inputs

      - name: Set up native identity reader
        if: inputs.disposable_channel != '' && inputs.disposable_receivers
        uses: ./.github/actions/setup-pm
        with:
          toolchain: node
          cache-python: false
          archive-inputs: false
      - name: Allocate the channel and build its immutable request
        id: allocate
        if: inputs.disposable_channel != '' || inputs.channel != ''
        env:
          DISPOSABLE_CHANNEL: ${{ inputs.disposable_channel }}
          CHANNEL: ${{ inputs.channel }}
          DISPOSABLE_RECEIVERS: ${{ inputs.disposable_receivers }}
          BUILD_COMMIT: ${{ inputs.build_commit }}
          TAG: ${{ inputs.tag }}
          RELEASE_PHASE: ${{ inputs.release-phase }}
          JOBS: ${{ inputs.jobs }}
          TERMUX_UPGRADE_FROM_TAG: ${{ inputs.termux_upgrade_from_tag }}
          UPLOAD_RELEASE: ${{ inputs.upload_release }}
          BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
        run: python -m scripts.releases.channel_disposable

      - name: Validate tag shape, pyproject lockstep, and ancestry on origin/main
        id: admission
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_CLAIM_TAG: ${{ inputs.claim-tag }}
          RELEASE_CLAIM_OBJECT: ${{ inputs.claim-object }}
          BUILD_COMMIT: ${{ inputs.build_commit }}
          CHANNEL_BUILD: ${{ steps.allocate.outputs.channel_build || '' }}
          CHANNEL_REQUEST_SHA256: ${{ steps.allocate.outputs.channel_request_sha256 || '' }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
          JOBS: ${{ inputs.jobs }}
          BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
          RELEASE_PHASE: ${{ inputs.release-phase }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          UPLOAD_RELEASE: ${{ inputs.upload_release }}
          TERMUX_UPGRADE_FROM_TAG: ${{ inputs.termux_upgrade_from_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${R2_DISPOSABLE_RUN:-}" ] && [ -z "${CHANNEL_BUILD:-}" ]; then
            echo '::error::disposable_run requires a pinned channel build'; exit 1
          fi
          # The one parser for the `jobs` input; every job gates on these outputs.
          python -m scripts.releases.job_groups >> "$GITHUB_OUTPUT"
          printf 'public-root=%s\npublic-base=%s\n' "$CLOUDFLARE_R2_PUBLIC_URL" "$CLOUDFLARE_R2_PUBLIC_URL" >> "$GITHUB_OUTPUT"
          printf 'archive-tag=%s\n' "${RELEASE_CLAIM_TAG:-$RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          if [ -n "${CHANNEL_BUILD:-}" ]; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ] || [ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/desktop-bundled-release.yml@refs/heads/$DEFAULT_BRANCH" ]; then
              echo '::error::channel builds require the default-branch dispatch workflow'; exit 1
            fi
            python -m scripts.releases.channel_publish admit
            exit 0
          fi
          if [ -n "$BUILD_COMMIT" ]; then
            # Reject mixed inputs before loading code from the checkout.
            if [ -n "$TAG" ] || [ -n "$RELEASE_PHASE" ] || [ -n "$TERMUX_UPGRADE_FROM_TAG" ] || [ "$UPLOAD_RELEASE" != false ]; then
              echo '::error::commit builds cannot select release publication or upgrade inputs'
              exit 1
            fi
            if ! [[ "$BUILD_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
              echo '::error::commit builds require an exact full SHA'
              exit 1
            fi
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ] || [ "$GITHUB_WORKFLOW_REF" != "$GITHUB_REPOSITORY/.github/workflows/desktop-bundled-release.yml@refs/heads/$DEFAULT_BRANCH" ]; then
              echo '::error::commit builds require the default-branch dispatch workflow'
              exit 1
            fi
            python -m scripts.releases.commit_build admit
            exit 0
          fi
          if [ -n "${BUNDLE_ENV_JSON:-}" ] && [ "$BUNDLE_ENV_JSON" != '{}' ]; then
            echo '::error::bundle environment defaults require a commit build'; exit 1
          fi
          if [ -z "$TAG" ]; then
            echo "::error::either tag or build_commit is required"; exit 1
          fi
          case "$RELEASE_PHASE" in
            candidate|publish)
              python -m scripts.releases.stable verify
              exit 0
              ;;
            '') [[ "$TAG" == *+canary.* ]] || { echo 'Use Stable Release for stable tags' >&2; exit 1; } ;;
            *) echo 'Unknown release phase' >&2; exit 1 ;;
          esac
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*+canary.20[0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z)
              echo "canary tag: $TAG"
              ;;
            v[0-9]*.[0-9]*.[0-9]*)
              echo "tag: $TAG"
              PYVER=$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -1)
              if [ "$TAG" != "v$PYVER" ]; then
                echo "::error::tag $TAG does not match pyproject.toml version $PYVER"
                exit 1
              fi
              ;;
            *)
              echo "::error::'$TAG' is not a release tag (vX.Y.Z or vX.Y.Z+canary.YYYYMMDDTHHMMSSZ)"
              exit 1
              ;;
          esac
          SHA="$(git rev-parse --verify "$TAG^{commit}")"
          if [ -z "$SHA" ]; then
            echo "::error::could not resolve $TAG to a commit"
            exit 1
          fi
          # A correctly-shaped tag on an unreviewed commit is NOT a valid
          # build input for a release-signing workflow: only a commit that
          # is already an ancestor of origin/main may be built.
          git fetch origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::tag $TAG (${SHA:0:12}) is not an ancestor of origin/main — refusing to build from an unreviewed commit"
            exit 1
          fi
          echo "tag $TAG resolves to $SHA (on origin/main)"
          TAG_OBJECT="$(git rev-parse --verify "$TAG^{tag}")" || {
            echo "::error::$TAG must be an annotated tag"; exit 1;
          }
          echo "tag-object=$TAG_OBJECT" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *+canary.*)
              echo "channel=canary" >> "$GITHUB_OUTPUT"
              python - "$TAG" >> "$GITHUB_OUTPUT" <<'PY'
          import datetime as dt, sys
          instant = dt.datetime.strptime(sys.argv[1].split("+canary.", 1)[1], "%Y%m%dT%H%M%SZ").replace(tzinfo=dt.UTC)
          print(f"release-epoch={int(instant.timestamp())}")
          PY
              ;;
            *)          echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  # ── Windows builders (REAL) ───────────────────────────────────────────────
  # Windows assembly and publication depend on these native Windows legs.
  # Pinned-input archiving runs as a validate step with the job's own gate
  # shape, so a skipped archive must not skip the selected build legs.
  #
  # Cache permissions are literal job-token scopes, not checkout/save-step policy.
  # Share execution via anchors, and keep the original IDs as downstream gates.
  build-win32-x64-release:
    name: bundled win32-x64
    if: >-
      needs.validate.outputs.win32-x64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && inputs.build_commit == '' && inputs.channel == ''
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    environment: release-signing
    cache-mode: write
    timeout-minutes: 900
    strategy: &win32-strategy
      fail-fast: false
      matrix:
        target:
          - label: win32-x64
            runner: windows-latest-32-core
    env: &win32-env
      CHANNEL_BUILD: ${{ needs.validate.outputs.channel-build }}
      HERMES_DESKTOP_VARIANT: bundled
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      RELEASE_CLAIM_TAG: ${{ inputs.claim-tag }}
      # Archive ref for handoff stage/fetch: attempt ref for stable phases.
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      HERMES_BUILD_COMMIT: ${{ inputs.build_commit != '' && needs.validate.outputs.channel-build == '' && needs.validate.outputs.sha || '' }}
      HERMES_RELEASE_COMMIT: ${{ inputs.release-phase != '' && needs.validate.outputs.sha || '' }}
      HERMES_PAYLOAD_VERSION: ${{ needs.validate.outputs.payload-version }}
      # Signature outputs are separate from the prepared dependency snapshot.
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
    steps: &win32-steps
      - name: Exclude build write paths from Defender scanning
        shell: powershell
        run: |
          $paths = @(
            $env:GITHUB_WORKSPACE,
            $env:RUNNER_TEMP,
            (npm config get cache)
          )
          foreach ($p in $paths) {
            try {
              Add-MpPreference -ExclusionPath $p
              Write-Host "Defender exclusion added for $p"
            } catch {
              Write-Host "Defender exclusion not applied for $p ($($_.Exception.Message)) - continuing"
            }
          }
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true
          } catch {
            Write-Host "Could not disable windows defender"
          }

      # Check out the SHA the validate job admitted — never the tag ref,
      # which a force-push can move between jobs. This is the privileged
      # (release-signing) build; it must run the reviewed bytes.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: ${{ (inputs.build_commit != '' || needs.validate.outputs.channel-build != '') && 1 || 0 }}
          fetch-tags: ${{ inputs.build_commit == '' && needs.validate.outputs.channel-build == '' }}

      - name: Check out trusted channel controller
        if: needs.validate.outputs.channel-build != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .build/channel-controller
          persist-credentials: false

      - name: Retrieve pinned channel request
        if: needs.validate.outputs.channel-build != ''
        shell: bash
        working-directory: .build/channel-controller
        env:
          CHANNEL_BUILD: ${{ needs.validate.outputs.channel-build }}
          CHANNEL_REQUEST_SHA256: ${{ needs.validate.outputs.channel-request-sha256 }}
        run: python -m scripts.releases.channel_publish request --out "$RUNNER_TEMP/channel-request.json"

      - name: Resolve the builder toolchain versions
        id: electron-tools
        shell: bash
        run: |
          node -e '
            const l = require("./package-lock.json")
            const eb = l.packages["node_modules/electron-builder"].version
            if (!eb) process.exit(1)
            console.log("eb=" + eb)
          ' >> "$GITHUB_OUTPUT"

      - name: Restore the electron-builder toolchain cache
        id: electron-tools-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # winCodeSign kit, ATS dlib, dotnet runtime and rcedit land in
          # ELECTRON_BUILDER_CACHE; the builder version selects the content.
          path: ${{ github.workspace }}/.cache/electron-builder
          key: eb3-${{ runner.os }}-${{ runner.arch }}-builder-${{ steps.electron-tools.outputs.eb }}
          restore-keys: |
            eb3-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore desktop dependency inputs
        id: build-cache
        uses: ./.github/actions/desktop-build-cache
        with:
          phase: restore
          source: ${{ github.workspace }}
          work: ${{ runner.temp }}/desktop-job
          cache: ${{ github.workspace }}/.cache/desktop-inputs
          producer: desktop

      - name: Prepare the complete desktop build
        id: prepare
        shell: bash
        env:
          HERMES_BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
        run: |
          args=(--tag "$HERMES_PAYLOAD_TAG")
          if [ -n "$HERMES_BUILD_COMMIT" ]; then args=(--commit "$HERMES_BUILD_COMMIT"); fi
          if [ -n "$HERMES_RELEASE_COMMIT" ]; then args+=(--release-commit "$HERMES_RELEASE_COMMIT"); fi
          if [ -n "${CHANNEL_BUILD:-}" ]; then args=(--channel-request "$RUNNER_TEMP/channel-request.json"); fi
          python scripts/bundles/desktop.py "${args[@]}" --variant bundled --prepare-only \
            --work "$RUNNER_TEMP/desktop-job" --cache "$GITHUB_WORKSPACE/.cache/desktop-inputs"
          python -m scripts.ci.desktop_commands "$RUNNER_TEMP/desktop-job/prepared.json"

      - name: Save dependency inputs before building
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && inputs.build_commit == '' && inputs.channel == '' }}
        uses: ./.github/actions/desktop-build-cache
        with:
          phase: save
          source: ${{ github.workspace }}
          work: ${{ runner.temp }}/desktop-job
          cache: ${{ github.workspace }}/.cache/desktop-inputs
          producer: desktop
          key: ${{ steps.build-cache.outputs.cache-key }}

      # Commit builds run these steps with a read-only cache token; the
      # exact-hit-skip semantics of actions/cache keep a read token harmless.
      - name: Save the electron-builder toolchain
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && inputs.build_commit == '' && inputs.channel == '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/electron-builder
          key: eb3-${{ runner.os }}-${{ runner.arch }}-builder-${{ steps.electron-tools.outputs.eb }}

      - name: Restore verified payload signatures
        id: payload-signatures
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/electron-builder-payload-signatures
          # Release runs save additions. Content and signing policy select entries.
          key: payload-signatures-v1-${{ runner.os }}-${{ matrix.target.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            payload-signatures-v1-${{ runner.os }}-${{ matrix.target.label }}-
            payload-signatures-v1-${{ runner.os }}-

      # Downloadable artifacts (commit builds, candidates, published tags,
      # channels) must be Authenticode-signed. Without the Azure Trusted
      # Signing vars the build only warns and ships UNSIGNED binaries, which
      # is right for a fork or a local build and wrong for a release.
      - name: Require Azure signing when publishing
        if: inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '' || inputs.channel != ''
        shell: bash
        env:
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          missing=()
          for name in AZURE_SIGN_ENDPOINT AZURE_SIGN_ACCOUNT AZURE_SIGN_PROFILE AZURE_SIGN_PUBLISHER AZURE_CLIENT_ID AZURE_TENANT_ID; do
            [ -z "${!name}" ] && missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::required Azure Trusted Signing vars are missing from release-signing: ${missing[*]}"
            exit 1
          fi

      - name: Azure login (OIDC)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Mint federated token for the signing dlib
        if: vars.AZURE_CLIENT_ID != ''
        shell: bash
        run: |
          file="$RUNNER_TEMP/azure-federated-token"
          mint() {
            curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
              | jq -r .value > "$file.tmp" && mv -f "$file.tmp" "$file"
          }
          mint
          ( while sleep 240; do mint || true; done ) &
          echo "AZURE_FEDERATED_TOKEN_FILE=$file" >> "$GITHUB_ENV"

      - name: Build and package
        shell: powershell
        timeout-minutes: 900
        env:
          HERMES_BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
          PYTHONUTF8: '1'
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_TOKEN_CREDENTIALS: prod
        run: |
          python scripts/bundles/desktop.py --prepared "$env:RUNNER_TEMP/desktop-job/prepared.json" --variant bundled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $env:CHANNEL_BUILD -and -not $env:HERMES_BUILD_COMMIT -and $env:HERMES_PAYLOAD_TAG -notlike "*+canary.*") {
              python scripts/bundles/desktop.py --prepared "$env:RUNNER_TEMP/desktop-job/prepared.json" --variant store
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify native signature cache contracts
        if: inputs.skip-tests != true
        shell: bash
        working-directory: apps/desktop
        run: node ../../node_modules/vitest/vitest.mjs run --project electron scripts/payload-sign-cache.test.mjs scripts/batch-sign-binaries.test.mjs

      # Commit jobs share these steps but have read-only cache tokens.
      - name: Save verified payload signatures
        if: inputs.build_commit == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/electron-builder-payload-signatures
          key: ${{ steps.payload-signatures.outputs.cache-primary-key }}

      - name: Audit bundle architecture
        shell: bash
        run: |
          MATRIX_LABEL="${{ matrix.target.label }}"
          node apps/desktop/scripts/audit-bundle-arch.mjs \
            --arch="${MATRIX_LABEL##*-}" --root=apps/desktop/release

      - name: Record and stage channel windows packages
        if: needs.validate.outputs.channel-build != ''
        shell: bash
        working-directory: .build/channel-controller
        env:
          TARGET: ${{ matrix.target.label }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          root="$GITHUB_WORKSPACE/apps/desktop/release"
          python -m scripts.bundles.release_artifacts record --platform windows --arch "${TARGET##*-}" \
            --root "$root" --commit "$RELEASE_COMMIT" --channel-request "$RUNNER_TEMP/channel-request.json" \
            --out "$root/metadata-windows-${TARGET##*-}.json"
          python -m scripts.releases.handoff stage --channel-request "$RUNNER_TEMP/channel-request.json" \
            --name "$TARGET" --root "$root" --include '*.msix' --include 'metadata-*.json'

      - name: Stage Windows packages to R2
        # A channel dispatch carries build_commit as provenance, not as the
        # receipt mode: its packages are staged by the pinned channel request
        # step above, and HERMES_PAYLOAD_TAG/HERMES_BUILD_COMMIT are both
        # empty here. Without this gate the step falls through to the tag
        # branch and handoff refuses an empty tag.
        if: needs.validate.outputs.channel-build == '' && (inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '')
        shell: bash
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          TARGET: ${{ matrix.target.label }}
          RELEASE_PHASE: ${{ inputs.release-phase }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
        # The tag archive is the handoff, never an update feed. The receipt
        # appears after the selected packages (including Store on stable) upload.
        run: |
          args=(--include '*.msix')
          if [ "$RELEASE_PHASE" = candidate ] || { [ "$HERMES_DESKTOP_VARIANT" = bundled ] && [[ "$HERMES_PAYLOAD_TAG" == *+canary.* ]]; }; then
            python -m scripts.bundles.release_artifacts record --platform windows --arch "${TARGET##*-}" \
              --root apps/desktop/release --tag "$HERMES_PAYLOAD_TAG" --commit "$RELEASE_COMMIT" \
              --out "apps/desktop/release/metadata-windows-${TARGET##*-}.json"
            args+=(--include 'metadata-*.json')
          fi
          if [ -n "$HERMES_BUILD_COMMIT" ]; then
            # Commit-only mode: schema-2 receipts under releases/commit/<sha>/.
            python -m scripts.releases.handoff stage --commit-build "$HERMES_BUILD_COMMIT" \
              --commit "$RELEASE_COMMIT" \
              --name "$TARGET" --root apps/desktop/release "${args[@]}"
          else
            python -m scripts.releases.handoff stage --tag "${HERMES_ARCHIVE_TAG:-$HERMES_PAYLOAD_TAG}" --commit "$RELEASE_COMMIT" \
              --name "$TARGET" --root apps/desktop/release "${args[@]}"
          fi

  build-win32-arm64-release:
    name: bundled win32-arm64
    if: >-
      needs.validate.outputs.win32-arm64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && inputs.build_commit == '' && inputs.channel == ''
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    environment: release-signing
    cache-mode: write
    timeout-minutes: 900
    strategy: &win32-strategy-arm64
      fail-fast: false
      matrix:
        target:
          - label: win32-arm64
            runner: windows-latest-32-arm-core
    env: *win32-env
    steps: *win32-steps

  build-win32-x64-commit:
    name: bundled win32-x64 (commit)
    if: >-
      !cancelled() && needs.validate.result == 'success'
      && needs.validate.outputs.win32-x64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && (inputs.build_commit != '' || inputs.channel != '')
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    environment: release-signing
    cache-mode: read
    timeout-minutes: 900
    strategy: *win32-strategy
    env: *win32-env
    steps: *win32-steps

  build-win32-arm64-commit:
    name: bundled win32-arm64 (commit)
    if: >-
      !cancelled() && needs.validate.result == 'success'
      && needs.validate.outputs.win32-arm64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && (inputs.build_commit != '' || inputs.channel != '')
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    environment: release-signing
    cache-mode: read
    timeout-minutes: 900
    strategy: *win32-strategy-arm64
    env: *win32-env
    steps: *win32-steps

  build-win32-x64:
    name: bundled win32-x64 result
    # always() crosses the deliberately skipped trust branch; failed admission
    # still skips this result, just as it skipped the original native builder.
    if: >-
      always() && needs.validate.outputs.win32-x64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && needs.validate.result == 'success'
    # The trust-branch legs are read through needs.*.result below, so they must
    # stay in the list — the result job gates on their outcomes, not its own.
    needs: [validate, build-win32-x64-release, build-win32-x64-commit]
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    env:
      SELECTED_BUILD_SUCCEEDED: >-
        ${{ (inputs.build_commit == '' && inputs.channel == '' && needs.build-win32-x64-release.result == 'success' && needs.build-win32-x64-commit.result == 'skipped')
          || ((inputs.build_commit != '' || inputs.channel != '') && needs.build-win32-x64-commit.result == 'success' && needs.build-win32-x64-release.result == 'skipped') }}
    steps: &native-build-result-steps
      - name: Require exactly the selected native build to succeed
        shell: bash
        run: |
          if [ "$SELECTED_BUILD_SUCCEEDED" != "true" ]; then
            echo "::error::selected native build did not succeed, or the other trust branch was not skipped"
            exit 1
          fi

  build-win32-arm64:
    name: bundled win32-arm64 result
    # always() crosses the deliberately skipped trust branch; failed admission
    # still skips this result, just as it skipped the original native builder.
    if: >-
      always() && needs.validate.outputs.win32-arm64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && needs.validate.result == 'success'
    # The trust-branch legs are read through needs.*.result below, so they must
    # stay in the list — the result job gates on their outcomes, not its own.
    needs: [validate, build-win32-arm64-release, build-win32-arm64-commit]
    runs-on: ubuntu-24.04
    permissions: {}
    timeout-minutes: 5
    env:
      SELECTED_BUILD_SUCCEEDED: >-
        ${{ (inputs.build_commit == '' && inputs.channel == '' && needs.build-win32-arm64-release.result == 'success' && needs.build-win32-arm64-commit.result == 'skipped')
          || ((inputs.build_commit != '' || inputs.channel != '') && needs.build-win32-arm64-commit.result == 'success' && needs.build-win32-arm64-release.result == 'skipped') }}
    steps: *native-build-result-steps

  # ── macOS builders (REAL) ──────────────────────────────────────────────────
  # Native per-arch darwin builds via scripts/bundles/desktop.py (the
  # one driver: same `--mac dmg zip` pass a local mac build runs). Each leg
  # signs (CSC_LINK) and notarizes (afterSign notarize.mjs) when the
  # release-signing environment carries the Apple credentials; a publishing
  # run FAILS the leg instead of shipping unsigned (no silent unsigned
  # publish). Binaries stage to releases/tag/<tag>/; the per-arch feed ymls
  # travel as workflow artifacts (arch-prefixed so both legs survive the
  # merge-multiple download) and publish-darwin-updater merges them into
  # releases/darwin/<channel>/<channel>-mac.yml — artifacts first, feed
  # pointer last, whole channel green before anything publishes.
  build-darwin-arm64-release:
    name: bundled darwin-arm64
    if: >-
      needs.validate.outputs.darwin-arm64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && inputs.build_commit == '' && inputs.channel == ''
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    environment: release-signing
    cache-mode: write
    timeout-minutes: 360
    strategy: &darwin-strategy
      fail-fast: false
      matrix:
        target:
          - label: darwin-arm64
            runner: macos-15
    env: &darwin-env
      CHANNEL_BUILD: ${{ needs.validate.outputs.channel-build }}
      HERMES_DESKTOP_VARIANT: bundled
      HERMES_PAYLOAD_TAG: ${{ inputs.tag }}
      RELEASE_CLAIM_TAG: ${{ inputs.claim-tag }}
      # Archive ref for handoff stage/fetch: attempt ref for stable phases.
      HERMES_ARCHIVE_TAG: ${{ needs.validate.outputs.archive-tag }}
      HERMES_BUILD_COMMIT: ${{ inputs.build_commit != '' && needs.validate.outputs.channel-build == '' && needs.validate.outputs.sha || '' }}
      HERMES_RELEASE_COMMIT: ${{ inputs.release-phase != '' && needs.validate.outputs.sha || '' }}
      HERMES_PAYLOAD_VERSION: ${{ needs.validate.outputs.payload-version }}
      CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ needs.validate.outputs.public-root }}
    steps: &darwin-steps
      - name: Disable Spotlight indexing for DMG staging
        # Spotlight indexes the freshly-mounted dmg staging image past
        # hdiutil's detach retries (per-VM, not a cross-job race).
        shell: bash
        run: |
          sudo mdutil -a -i off || true

      # Check out the SHA the validate job admitted — never the tag ref,
      # which a force-push can move between jobs. This is the privileged
      # (release-signing) build; it must run the reviewed bytes.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
          # Channel/commit builds derive versions from the request/env, not
          # git tags; tag builds need tags for the canary MSIX number.
          fetch-depth: ${{ (inputs.build_commit != '' || needs.validate.outputs.channel-build != '') && 1 || 0 }}
          fetch-tags: ${{ inputs.build_commit == '' && needs.validate.outputs.channel-build == '' }}

      - name: Check out trusted channel controller
        if: needs.validate.outputs.channel-build != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .build/channel-controller
          persist-credentials: false

      - name: Retrieve pinned channel request
        if: needs.validate.outputs.channel-build != ''
        shell: bash
        working-directory: .build/channel-controller
        env:
          CHANNEL_BUILD: ${{ needs.validate.outputs.channel-build }}
          CHANNEL_REQUEST_SHA256: ${{ needs.validate.outputs.channel-request-sha256 }}
        run: python -m scripts.releases.channel_publish request --out "$RUNNER_TEMP/channel-request.json"

      - name: Resolve the builder toolchain versions
        id: electron-tools
        shell: bash
        run: |
          node -e '
            const l = require("./package-lock.json")
            const eb = l.packages["node_modules/electron-builder"].version
            if (!eb) process.exit(1)
            console.log("eb=" + eb)
          ' >> "$GITHUB_OUTPUT"

      - name: Restore the electron-builder toolchain cache
        id: electron-tools-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # winCodeSign kit, ATS dlib, dotnet runtime and rcedit land in
          # ELECTRON_BUILDER_CACHE; the builder version selects the content.
          path: ${{ github.workspace }}/.cache/electron-builder
          key: eb3-${{ runner.os }}-${{ runner.arch }}-builder-${{ steps.electron-tools.outputs.eb }}
          restore-keys: |
            eb3-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore desktop dependency inputs
        id: build-cache
        uses: ./.github/actions/desktop-build-cache
        with:
          phase: restore
          source: ${{ github.workspace }}
          work: ${{ runner.temp }}/desktop-job
          cache: ${{ github.workspace }}/.cache/desktop-inputs
          producer: desktop

      - name: Prepare the complete desktop build
        id: prepare
        shell: bash
        env:
          HERMES_BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
        run: |
          args=(--tag "$HERMES_PAYLOAD_TAG")
          if [ -n "$HERMES_BUILD_COMMIT" ]; then args=(--commit "$HERMES_BUILD_COMMIT"); fi
          if [ -n "$HERMES_RELEASE_COMMIT" ]; then args+=(--release-commit "$HERMES_RELEASE_COMMIT"); fi
          if [ -n "${CHANNEL_BUILD:-}" ]; then args=(--channel-request "$RUNNER_TEMP/channel-request.json"); fi
          python3 scripts/bundles/desktop.py "${args[@]}" --variant bundled --prepare-only \
            --work "$RUNNER_TEMP/desktop-job" --cache "$GITHUB_WORKSPACE/.cache/desktop-inputs"
          python3 -m scripts.ci.desktop_commands "$RUNNER_TEMP/desktop-job/prepared.json"

      - name: Save dependency inputs before building
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && inputs.build_commit == '' && inputs.channel == '' }}
        uses: ./.github/actions/desktop-build-cache
        with:
          phase: save
          source: ${{ github.workspace }}
          work: ${{ runner.temp }}/desktop-job
          cache: ${{ github.workspace }}/.cache/desktop-inputs
          producer: desktop
          key: ${{ steps.build-cache.outputs.cache-key }}

      # Commit builds run these steps with a read-only cache token; the
      # exact-hit-skip semantics of actions/cache keep a read token harmless.
      - name: Save the electron-builder toolchain
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && inputs.build_commit == '' && inputs.channel == '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/electron-builder
          key: eb3-${{ runner.os }}-${{ runner.arch }}-builder-${{ steps.electron-tools.outputs.eb }}

      # Commit artifacts are downloadable too. Require signing for them,
      # candidates, and published tags before building any payload.
      - name: Require signing credentials when publishing
        if: inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '' || inputs.channel != ''
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          [ -z "$CSC_LINK" ] && missing+=(CSC_LINK)
          [ -z "$CSC_KEY_PASSWORD" ] && missing+=(CSC_KEY_PASSWORD)
          [ -z "$APPLE_API_KEY_P8" ] && missing+=(APPLE_API_KEY_P8)
          [ -z "$APPLE_API_KEY_ID" ] && missing+=(APPLE_API_KEY_ID)
          [ -z "$APPLE_API_ISSUER" ] && missing+=(APPLE_API_ISSUER)
          [ -z "$CLOUDFLARE_R2_PUBLIC_URL" ] && missing+=(CLOUDFLARE_R2_PUBLIC_URL)
          [ -z "$CLOUDFLARE_R2_BUCKET" ] && missing+=(CLOUDFLARE_R2_BUCKET)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::required signing/notarization credentials are missing from release-signing: ${missing[*]}"
            exit 1
          fi

      - name: Write App Store Connect key for notarytool
        # notarytool takes a FILE PATH for --key; raw .p8 content in argv
        # dies with `Invalid option: ***`. The build step must NOT re-declare
        # APPLE_API_KEY in its env: step env shadows GITHUB_ENV.
        if: inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '' || inputs.channel != ''
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"

      - name: Build and package
        shell: bash
        timeout-minutes: 330
        env:
          HERMES_BUNDLE_ENV_JSON: ${{ inputs.bundle_env }}
          PYTHONUTF8: '1'
          # electron-osx-sign*/electron-notarize* keep the sign+notarize
          # phase visible: without them NOTHING logs between "signing
          # file=..." and a queue-wait timeout, so a slow notary queue is
          # indistinguishable from a hang.
          DEBUG: 'electron-osx-sign*,electron-notarize*'
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # Sign + notarize of a bundled-payload app runs long (Apple scans
          # every Mach-O) — raise the fd limit and let DEBUG show progress.
          ulimit -n 16384 2>/dev/null || true
          echo "file descriptor limit: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
          python scripts/bundles/desktop.py --prepared "$RUNNER_TEMP/desktop-job/prepared.json" --variant bundled

      - name: Audit bundle architecture
        shell: bash
        run: |
          MATRIX_LABEL="${{ matrix.target.label }}"
          node apps/desktop/scripts/audit-bundle-arch.mjs \
            --arch="${MATRIX_LABEL##*-}" --root=apps/desktop/release

      - name: Verify the build is signed and notarized
        # The backstop against a silent unsigned publish: assess the packed
        # app against the real Gatekeeper policy (requires a Developer ID
        # signature AND a stapled notarization ticket to pass offline).
        if: inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '' || inputs.channel != ''
        shell: bash
        run: |
          shopt -s nullglob
          apps=(apps/desktop/release/mac*/*.app)
          if [ ${#apps[@]} -eq 0 ]; then
            echo "::error::no packed .app found under apps/desktop/release to verify"
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl -a -vv -t exec "$app"
            echo "signed + notarized: $app"
          done

      - name: Rename the feed yml per arch
        if: inputs.upload_release == true || inputs.release-phase == 'candidate'
        # electron-builder writes the channel feed yml (stable-mac.yml /
        # canary-mac.yml) with the SAME name on both legs; prefix the arch
        # so the R2 tag archive keeps both and finalize can merge them
        # into <channel>-mac.yml after both native legs pass. The
        # channel token is preserved verbatim in the staged name
        # (arm64-stable-mac.yml / x64-canary-mac.yml …).
        shell: bash
        run: |
          shopt -s nullglob
          MATRIX_LABEL="${{ matrix.target.label }}"
          arch="${MATRIX_LABEL##*-}"
          channel="${{ needs.validate.outputs.channel }}"
          f="apps/desktop/release/${channel}-mac.yml"
          test -s "$f"
          mv "$f" "apps/desktop/release/${arch}-${channel}-mac.yml"

      - name: Record and stage channel macos packages
        if: needs.validate.outputs.channel-build != ''
        shell: bash
        working-directory: .build/channel-controller
        env:
          TARGET: ${{ matrix.target.label }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          root="$GITHUB_WORKSPACE/apps/desktop/release"
          python -m scripts.bundles.release_artifacts record --platform macos --arch "${TARGET##*-}" \
            --root "$root" --commit "$RELEASE_COMMIT" --channel-request "$RUNNER_TEMP/channel-request.json" \
            --out "$root/metadata-macos-${TARGET##*-}.json"
          python -m scripts.releases.handoff stage --channel-request "$RUNNER_TEMP/channel-request.json" \
            --name "$TARGET" --root "$root" --include '*.dmg' --include '*.zip' --include '*.blockmap' --include 'metadata-*.json'

      - name: Stage macOS packages and feed inputs to R2
        # Channel dispatches stage through the pinned request step above; see
        # the Windows leg for the empty-tag fallthrough this gate prevents.
        if: needs.validate.outputs.channel-build == '' && (inputs.upload_release == true || inputs.release-phase == 'candidate' || inputs.build_commit != '')
        shell: bash
        env:
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          TARGET: ${{ matrix.target.label }}
          RELEASE_PHASE: ${{ inputs.release-phase }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.sha }}
        # Per-arch feed inputs stay in the tag archive until both legs pass.
        run: |
          args=(--include '*.dmg' --include '*.zip' --include '*.blockmap' --include '*-mac.yml')
          if [ "$RELEASE_PHASE" = candidate ] || { [ "$HERMES_DESKTOP_VARIANT" = bundled ] && [[ "$HERMES_PAYLOAD_TAG" == *+canary.* ]]; }; then
            python -m scripts.bundles.release_artifacts record --platform macos --arch "${TARGET##*-}" \
              --root apps/desktop/release --tag "$HERMES_PAYLOAD_TAG" --commit "$RELEASE_COMMIT" \
              --out "apps/desktop/release/metadata-macos-${TARGET##*-}.json"
            args+=(--include 'metadata-*.json')
          fi
          if [ -n "$HERMES_BUILD_COMMIT" ]; then
            # Commit-only mode: binaries only — no feed yml exists without a tag.
            python -m scripts.releases.handoff stage --commit-build "$HERMES_BUILD_COMMIT" \
              --commit "$RELEASE_COMMIT" \
              --name "$TARGET" --root apps/desktop/release \
              --include '*.dmg' --include '*.zip' --include '*.blockmap'
          else
            python -m scripts.releases.handoff stage --tag "${HERMES_ARCHIVE_TAG:-$HERMES_PAYLOAD_TAG}" --commit "$RELEASE_COMMIT" \
              --name "$TARGET" --root apps/desktop/release "${args[@]}"
          fi

  build-darwin-x64-release:
    name: bundled darwin-x64
    if: >-
      needs.validate.outputs.darwin-x64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && inputs.build_commit == '' && inputs.channel == ''
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    environment: release-signing
    cache-mode: write
    timeout-minutes: 360
    strategy: &darwin-strategy-x64
      fail-fast: false
      matrix:
        target:
          - label: darwin-x64
            runner: macos-15-intel
    env: *darwin-env
    steps: *darwin-steps

  build-darwin-arm64-commit:
    name: bundled darwin-arm64 (commit)
    if: >-
      !cancelled() && needs.validate.result == 'success'
      && needs.validate.outputs.darwin-arm64 == 'true'
      && (inputs.release-phase == '' || inputs.release-phase == 'candidate')
      && (inputs.build_commit != '' || inputs.channel != '')
    needs: [validate]
    runs-on: ${{ matrix.target.runner }}
    environment: release-signing
    cache-mode: read
    timeout-minutes: 360
    strategy: *darwin-strategy
    env: *darwin-env
    steps: *darwin-steps

