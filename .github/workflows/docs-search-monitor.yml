name: Docs Search Monitor

# Live check that search works on hermes-agent.nousresearch.com/docs. Search
# broke in production twice in one month with every build green (a deleted
# Algolia search key, then Vercel access controls), because nothing ever
# exercised the deployed site.
#
# website/scripts/check-live-search.mjs reads the Algolia credentials from the
# bundle the site is serving, queries Algolia with the site's Origin, opens the
# top results, then types into the real search modal in headless Chromium.
#
# Runs every 6 hours and after every Deploy Site run. This workflow holds no
# notification secrets: a failing probe turns the run red and records each
# reason as an `::error::` annotation. Alerting lives with whoever subscribes
# to the repository's `workflow_run` webhook events for this file.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_run:
    workflows: ['Deploy Site']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-search-monitor
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'NousResearch/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          sparse-checkout: website/scripts
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1.0
        with:
          node-version: 24.11.1

      - name: Install headless Chromium
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" playwright@1.62.1
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium-headless-shell

      - name: Probe live docs search
        timeout-minutes: 9
        env:
          PLAYWRIGHT_DIR: ${{ runner.temp }}/pw
        run: |
          # One retry after a pause so a transient blip never pages anyone.
          # Only the retry writes annotations, so a run that recovers on the
          # retry carries no stale error and a failed run lists each reason once.
          if GITHUB_ACTIONS= node website/scripts/check-live-search.mjs; then exit 0; fi
          echo "::warning::first probe failed; retrying in 90s"
          sleep 90
          node website/scripts/check-live-search.mjs
