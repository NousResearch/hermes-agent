name: Docs Site Checks

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  docs-site-checks:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ inputs.commit }}

      - name: Set up the locked site toolchain
        uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          node-package-manager: npm
          node-cache-dependency-path: apps/docs/package-lock.json

      - name: Install docs app dependencies
        uses: ./.github/actions/retry
        with:
          command: just docs-install

      - name: Install ascii-guard
        uses: ./.github/actions/retry
        with:
          command: python -m scripts.ci.python_packages ascii-guard==2.3.0 ruamel.yaml==0.18.17

      - name: Extract skill metadata and regenerate per-skill docs pages + catalogs
        run: just docs-generate

      - name: Committed skill docs match the generator
        # GitHub renders the committed copies, so a regeneration that changes anything
        # means the published catalogs/pages are stale. Fix: `just docs-generate` and commit.
        run: just docs-check-generated

      - name: Check cross-page links resolve on GitHub and on the site
        run: just docs-check-links

      - name: Lint docs diagrams
        run: just docs-lint-diagrams

      - name: Docs app tests
        run: npm run test
        working-directory: apps/docs

      - name: Build docs app (Next static export, both locales)
        # The full bilingual build runs here on every PR — an English-only
        # fast path would let a zh-Hans break land green (deploy-site.yml
        # builds both locales at deploy time).
        run: just docs-build

      - name: Validate static export output
        # Fails when required routes/assets/JSON contracts are missing from
        # the export — a build that silently drops pages must not pass CI.
        run: node apps/docs/scripts/validate-output.mjs
