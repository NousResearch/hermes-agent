name: Hermes candidate verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Candidate commit or branch to verify
        required: true
        type: string
        default: main
  push:
    branches:
      - main
      - integrate/hermes-local-patches-20261102

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Set up locked Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.12.1'
          cache: npm

      - name: Install Node dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build dashboard
        env:
          HERMES_WEB_BUILD_LIGHT: '1'
        run: npm run build --workspace web

      - name: Verify emitted dashboard artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s hermes_cli/web_dist/index.html
          asset=$(sed -nE 's/.*src="([^"]*ChatPage-[^"]+\.js)".*/\1/p' hermes_cli/web_dist/index.html | head -1)
          if [ -z "$asset" ]; then
            asset=$(find hermes_cli/web_dist/assets -maxdepth 1 -name 'ChatPage-*.js' -print -quit | sed 's#^hermes_cli/web_dist/##')
          fi
          test -n "$asset"
          file="hermes_cli/web_dist/$asset"
          test -s "$file"
          focus_count=$(node - "$file" <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync(process.argv[2], 'utf8');
          const matches = source.match(/(?:window\.)?addEventListener\(\s*["']focus["']/g) || [];
          process.stdout.write(String(matches.length));
          NODE
          )
          echo "verified_asset=$asset"
          echo "focus_listener_count=$focus_count"
          echo "verified_asset=$asset" >> "$GITHUB_STEP_SUMMARY"
          echo "focus_listener_count=$focus_count" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "asset=$asset"
            echo "focus_listener_count=$focus_count"
            grep -oE '.{0,140}(addEventListener|focus|onResume|onWindowFocus).{0,180}' "$file" | head -50 || true
          } > hermes-dashboard-focus-snippets.txt
          tar -czf hermes-dashboard-web-dist.tgz hermes_cli/web_dist
          test "$focus_count" -eq 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Configure fixture Git identity
        run: |
          git config --global user.name "Hermes CI Fixture"
          git config --global user.email "hermes-ci-fixture@example.invalid"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check uv && uv sync --group dev --no-install-project

      - name: Isolate updater tests from the owning install redirect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hermes-test-bootstrap"
          cat > "$RUNNER_TEMP/hermes-test-bootstrap/hermes_ci_plugin.py" <<'PY'
          """CI-only pytest plugin: updater fixtures must stay in throwaway Git repos."""
          def pytest_configure(config):
              import hermes_cli.update_owning_install as _owning
              _owning.retarget_to_owning_install = lambda project_root: None
          PY

      - name: Run targeted updater and boundary tests
        env:
          PYTHONPATH: ${{ runner.temp }}/hermes-test-bootstrap:${{ github.workspace }}
        run: |
          .venv/bin/python -m pytest -q -p hermes_ci_plugin \
            tests/hermes_cli/test_update_diverged_rescue_ref.py \
            tests/hermes_cli/test_update_existing_branch_baseline.py \
            tests/hermes_cli/test_update_head_moved_gate.py \
            tests/hermes_cli/test_update_apply_shallow_count.py \
            tests/hermes_cli/test_update_parked_branch_guard.py \
            tests/hermes_cli/test_web_server_host_header.py \
            tests/agent/test_cline_daily_limit_cooldown.py \
            tests/agent/test_credential_pool_interrupt.py \
            tests/agent/test_retry_delay_parsers_shared.py \
            -k 'not treeless and not promisor and not partial_clone'

      - name: Upload verified dashboard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-dashboard-web-dist-${{ github.sha }}
          path: |
            hermes-dashboard-web-dist.tgz
            hermes-dashboard-focus-snippets.txt
          if-no-files-found: error
          retention-days: 14
