name: High-value agent evaluations

on:
  workflow_dispatch:
    inputs:
      evaluation:
        description: "Evaluation to run"
        required: true
        default: toolperf
        type: choice
        options: [toolperf, compression]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with: {version: "0.9.28"}
      - run: uv sync --locked --python 3.13.6 --extra dev
      - name: Compression contract tests
        if: github.event_name == 'schedule' || inputs.evaluation == 'compression'
        run: scripts/run_tests.sh tests/scripts/test_context_compression_eval_contract.py
      - name: Toolperf contract tests
        if: github.event_name == 'schedule' || inputs.evaluation == 'toolperf'
        run: scripts/run_tests.sh tests/scripts/test_toolperf_report_contract.py

  external-evaluation:
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Record selected lane
        run: |
          lane="${{ inputs.evaluation || 'scheduled' }}"
          echo "Selected evaluation lane: ${lane}" >> "$GITHUB_STEP_SUMMARY"
          echo "External model-backed evaluation requires explicitly provisioned credentials and remains manual." >> "$GITHUB_STEP_SUMMARY"
