name: auto-fix lint issues & formatting

# On push to main (or manual trigger), run `npm run fix` on each workspace
# package and apply any changes via a PR.
#
# Fixable lint issues (import sorting, unused imports, curly braces, etc.) are
# auto-corrected on merge so PRs aren't blocked by them. The PR-time eslint
# check in typecheck.yml fails only when un-fixable errors remain.
#
# NOTE: App token pushes DO trigger further workflow runs (unlike
# secrets.GITHUB_TOKEN). The concurrency group (ts-autofix-${{ github.ref }})
# with cancel-in-progress: true prevents an infinite loop — a re-triggered
# run cancels the in-flight one, and since the second run finds no new fixes
# (the first run already applied them), it exits with an empty patch.
#
# ── Security model: two-job split ───────────────────────────────────────────
#
# The eslint process executes repo code (eslint.config.mjs, package.json
# scripts, installed plugins). To prevent a malicious PR from getting arbitrary
# code execution on a runner with push access, the work is split:
#
#   1. generate-patch (unprivileged, contents: read only)
#      Checks out, installs deps, runs eslint --fix, produces a .patch artifact.
#      Worst case: malicious code runs here on an ephemeral runner with zero
#      push permissions.
#
#   2. apply-patch (privileged, contents: write + pull-requests: write)
#      Checks out, downloads the patch artifact, applies it, pushes to the
#      bot/js-autofix branch, and creates/updates a PR.
#      This job never runs npm, never installs anything, never executes any
#      repo code. The only input it trusts is the patch artifact.
#      Skipped entirely when generate-patch reports no fixes (has-fixes != true).
#      The PR does NOT auto-merge: the extension gate below only verifies
#      which paths changed, so hostile output written inside an allowed path
#      (a rogue plugin emitting into src/*.ts or a config file) would sail
#      through it. A human reviews the diff and merges, same as any other PR.
#      If CI fails or main moves, the PR is auto-closed and the branch
#      deleted; the next run re-applies on the current state.

on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.cjs'
      - '**/*.mjs'
      - '**/*.ts'
      - '**/*.tsx'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read # default; apply-patch job overrides to write

concurrency:
  group: ts-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-patch:
    name: Generate eslint --fix patch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-fixes: ${{ steps.produce-patch.outputs.has-fixes }}
    # No permissions override → inherits workflow-level contents: read.
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Set up locked Node and npm
        id: node
        uses: ./.github/actions/setup-pm
        with:
          toolchain: node

      # --ignore-scripts: eslint only needs TS sources + eslint packages.
      - uses: ./.github/actions/retry
        with:
          command: npm ci --ignore-scripts

      - name: npm run fix in all workspaces
        # continue-on-error: if un-fixable errors exist on main, we still want
        # to commit whatever fixes were applied. The PR-time check in
        # typecheck.yml is what blocks un-fixable errors from landing.
        continue-on-error: true
        run: npm run fix

      - name: Produce patch
        id: produce-patch
        run: |
          # Exclude every denied path from the patch entirely: package
          # manifests and lockfiles, eslint configs, .github, and the
          # tool-executed configs (vitest/ts/jest/etc.) that a hostile run
          # could weaponize. Their edits are dropped here rather than
          # shipped; the check step in typecheck.yml still reports any
          # lint errors they contain, and the apply job re-enforces the
          # same policy on the staged diff before pushing.
          # scripts/ci/autofix_path_gate.py owns the list; the (glob) magic
          # makes "**/" also match files at the repo root. Assignments first:
          # a producer failure inside a process substitution or for-list
          # would not propagate under `set -e`, while a failed assignment does.
          DENY_GLOBS=$(python3 scripts/ci/autofix_path_gate.py --deny-globs)
          EXCLUDES=()
          while IFS= read -r glob; do
            EXCLUDES+=(":(exclude,glob)${glob}")
          done <<< "$DENY_GLOBS"
          if git diff --quiet -- . "${EXCLUDES[@]}"; then
            echo "No fixes needed."
            echo "has-fixes=false" >> "$GITHUB_OUTPUT"
            # Empty patch signals "nothing to do" to apply-patch.
            : > js-fix.patch
          else
            git diff -- . "${EXCLUDES[@]}" > js-fix.patch
            echo "has-fixes=true" >> "$GITHUB_OUTPUT"
            echo "Patch size: $(wc -c < js-fix.patch) bytes"

            # Reject patches that touch anything outside JS/TS/JSON sources.
            # `npm run fix` should only ever modify those; anything else means
            # eslint/prettier or a plugin went rogue and we refuse to ship it.
            NAMES=$(git diff --name-only -- . "${EXCLUDES[@]}")
            BAD=""
            while IFS= read -r p; do
              [ -n "$p" ] || continue
              python3 scripts/ci/autofix_path_gate.py --allowed "$p" || BAD="${BAD}${p}"$'\n'
            done <<< "$NAMES"
            if [ -n "$BAD" ]; then
              echo "::error::Refusing to upload patch: touches disallowed files:"
              printf '%s' "$BAD"
              exit 1
            fi
          fi

      - name: Upload patch artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: js-fix-patch
          path: js-fix.patch
          retention-days: 1
          include-hidden-files: true

  apply-patch:
    name: Apply patch
    needs: generate-patch
    # Skip entirely when generate-patch found no fixes — saves a runner,
    # avoids a redundant checkout/download, and keeps the job graph honest.
    if: needs.generate-patch.outputs.has-fixes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: trusted-automation
    permissions:
      contents: write # needed to push to bot/js-autofix
      pull-requests: write # needed for PR creation, polling, and auto-close
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Get GitHub App token
        id: app-token
        uses: ./.github/actions/get-app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Download patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: js-fix-patch
          # ${{ runner.temp }} expands in with: params (shell-style $VAR does not).
          # download-artifact's path is a *directory* — the artifact's js-fix.patch
          # file lands inside it, so $RUNNER_TEMP/js-fix.patch resolves correctly
          # in the run step below.
          path: ${{ runner.temp }}

      - name: Apply patch and push to bot branch
        env:
          BOT_BRANCH: bot/js-autofix
        run: |
          set -euo pipefail

          # Empty patch = nothing to do.
          if [ ! -s "$RUNNER_TEMP/js-fix.patch" ]; then
            echo "Patch is empty. No fixes to apply."
            exit 0
          fi

          # Apply the patch produced by the unprivileged job.
          git apply --check "$RUNNER_TEMP/js-fix.patch" || {
            echo "::error::Patch does not apply cleanly. Branch may have moved."
            exit 1
          }
          git apply "$RUNNER_TEMP/js-fix.patch"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A

          # A patch whose every path lands in .gitignore stages nothing:
          # that is a no-op, not an error.
          if git diff --cached --quiet; then
            echo "Patch produced no tracked changes. Nothing to do."
            exit 0
          fi

          # Re-run the path gate on THIS side of the trust boundary. The
          # generate-patch job executes repo code (eslint plugins and config
          # files), so the artifact's own filtering is not evidence. The
          # staged diff is ground truth: only plain content edits or new
          # regular files under the JS/TS/JSON extension set may reach the
          # bot PR, and the dep-version-gate paths (manifests, lockfiles,
          # eslint configs, .github, tool-executed configs) stay denied.
          # Deletions, renames, mode changes, symlinks, and gitlinks are
          # refused: `npm run fix` never produces any of them.
          # The policy lives in scripts/ci/autofix_path_gate.py, checked out
          # from the base commit this job runs on, so a hostile produce job
          # cannot weaken it.
          if ! BAD=$(python3 scripts/ci/autofix_path_gate.py --staged 2>&1); then
            echo "::error::Patch rejected by the apply-side gate:"
            printf '%s\n' "$BAD"
            git reset -q --hard HEAD
            git clean -fdq
            exit 1
          fi

          git commit -m "fmt(js): \`npm run fix\` on merge"

          # Push to the dedicated bot branch. Force-push is safe here:
          # bot/js-autofix is a bot-only branch that gets rewritten each run.
          # If the branch was deleted after a previous PR merge, this
          # recreates it.
          git push --force origin HEAD:"$BOT_BRANCH"

      - name: Create/update PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BOT_BRANCH: bot/js-autofix
        run: |
          set -euo pipefail

          # Create PR if one doesn't exist. If it already exists, the
          # force-push above already updated it with the latest fixes.
          PR_NUM=$(gh pr list --head "$BOT_BRANCH" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$PR_NUM" ]; then
            # gh pr create prints the PR URL. Extract the number from it
            # (https://github.com/<org>/<repo>/pull/<number>).
            PR_URL=$(gh pr create \
              --head "$BOT_BRANCH" --base main \
              --title 'fmt(js): `npm run fix` auto-fix' \
              --body 'Auto-generated by the `auto-fix lint issues & formatting` workflow. The patch is produced by repo code running in an unprivileged job, so it is untrusted content: review the diff and squash-merge once CI passes. If CI fails or `main` moves, the PR is auto-closed and the branch deleted; the next run re-applies on the current state.')
            PR_NUM=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          fi

          # No auto-merge: the extension gate above only verifies paths, not
          # content, so a human must review the diff before this lands.

      - name: Monitor PR; auto-close on failure or staleness
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          START_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PR_NUM=$(gh pr list --head bot/js-autofix --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$PR_NUM" ]; then
            echo "No open PR. Nothing to wait for."
            exit 0
          fi

          echo "Watching PR #$PR_NUM for cleanup signals..."

          # Poll every 15s for up to ~10 minutes. The PR stays open for a
          # reviewer past any timeout; the polling is for cleanup only
          # (auto-close on CI failure, conflicts, or main moving). A gh call
          # that returns nothing is a transient API failure: guarded reads
          # skip the iteration rather than act on an empty value, which
          # would otherwise read as "main moved" and close a healthy PR.
          for i in $(seq 1 40); do
            sleep 15

            STATE=$(gh pr view "$PR_NUM" --json state --jq '.state' 2>/dev/null || true)
            [ -z "$STATE" ] && continue
            if [ "$STATE" = "MERGED" ] || [ "$STATE" = "CLOSED" ]; then
              echo "PR #$PR_NUM is $STATE."
              exit 0
            fi

            # If main moved, the PR may have already merged (which moves
            # main) or another commit landed. Re-check state first.
            CURRENT_SHA=$(gh api "repos/${{ github.repository }}/branches/main" --jq '.commit.sha' 2>/dev/null || true)
            [ -z "$CURRENT_SHA" ] && continue
            if [ "$CURRENT_SHA" != "$START_SHA" ]; then
              STATE=$(gh pr view "$PR_NUM" --json state --jq '.state' 2>/dev/null || true)
              if [ "$STATE" = "MERGED" ]; then
                echo "PR #$PR_NUM merged (main moved to $CURRENT_SHA)."
                exit 0
              fi
              echo "Main moved ($START_SHA -> $CURRENT_SHA). Closing stale PR."
              gh pr close "$PR_NUM" --delete-branch || true
              exit 0
            fi

            # If CI checks failed, close + delete the branch. Once every
            # check resolves with none failed, there is nothing left to
            # watch: only a human can merge, and the next run re-checks
            # staleness anyway.
            CHECKS=$(gh pr checks "$PR_NUM" --json bucket 2>/dev/null || true)
            if [ -n "$CHECKS" ] && [ "$CHECKS" != "[]" ]; then
              if printf '%s' "$CHECKS" | grep -q '"bucket":"fail"'; then
                echo "CI failed on PR #$PR_NUM. Closing + deleting branch."
                gh pr close "$PR_NUM" --delete-branch || true
                exit 0
              fi
              if ! printf '%s' "$CHECKS" | grep -q '"bucket":"pending"'; then
                echo "Checks resolved on PR #$PR_NUM; it stays open for review."
                exit 0
              fi
            fi

            # If PR is conflicted, close + delete the branch.
            MERGEABLE=$(gh pr view "$PR_NUM" --json mergeable --jq '.mergeable' 2>/dev/null || true)
            [ -z "$MERGEABLE" ] && continue
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              echo "PR #$PR_NUM is conflicted. Closing + deleting branch."
              gh pr close "$PR_NUM" --delete-branch || true
              exit 0
            fi
          done

          echo "Timeout reached. PR #$PR_NUM stays open for review."
