# .github/workflows/js-tests.yml
name: JS Tests

on:
  workflow_call:

jobs:
  check:
    name: JS & TS checks
    # Fork validation uses the standard GitHub-hosted runner because the
    # upstream private 32-core label is unavailable outside NousResearch.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      - name: Set up the locked JS build toolchain
        id: node
        uses: ./.github/actions/setup-pm
        with:
          # Desktop checks also run Python payload and icon build helpers, and
          # the electron contracts drive real hermes_cli/pm code through
          # HERMES_PYTHON, which needs the application dependencies.
          toolchain: all
          extras: '[]'
          test-environment: 'true'

      - name: Install zsh and a virtual display for Electron
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y zsh xvfb \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            xdg-utils libatspi2.0-0 libdrm2 libgbm1 libasound2t64

      - name: grab npm 12
        run: |
          npm --version | grep -q '^12\.' || npm i -g npm@12

      # setup-pm caches npm downloads, not the installed workspace tree.
      # The job then extracts the full workspace node_modules
      # again and runs the postinstalls again, which includes the Electron
      # binary fetch. This caches the installed tree itself, keyed on the
      # lockfile, and skips ``npm ci`` on an exact hit. There are no
      # restore-keys: a partial hit leaves a stale tree, so anything other
      # than an exact lockfile match reinstalls from the start.
      #
      # This install runs WITH scripts, so the tree holds the postinstall
      # artifacts. The postinstall of electron unpacks its binary into
      # node_modules/electron/dist, which is inside the cached tree.
      #
      # The ~/.cache/electron download cache stays out of the key on purpose.
      # ``npm ci`` is skipped on a hit, so nothing reads that cache. It only
      # makes the archive larger.
      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            apps/*/node_modules
            ui-tui/node_modules
            ui-tui/packages/*/node_modules
            tests-js/node_modules
            web/node_modules
          key: node-modules-scripts-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-npm${{ steps.node.outputs.npm-version }}-${{ hashFiles('package-lock.json') }}

      - uses: ./.github/actions/retry
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          command: npm ci

      - name: Verify workspace runner failure reporting
        run: node --test .github/scripts/run-workspace-checks.test.mjs

      - name: Verify WhatsApp media cache containment
        run: node --test scripts/whatsapp-bridge/media_paths.test.mjs

      - name: Run all workspace checks
        # The UI suite already uses a bounded Vitest pool. Keeping the outer
        # workspace scheduler at two prevents concurrent builds and test
        # runners from starving its teardown on standard hosted runners.
        run: node .github/scripts/run-workspace-checks.mjs --concurrency 2

  windows-native:
    name: Windows native Desktop regressions
    # The Linux workspace job cannot validate native taskkill/PID behavior.
    # This narrow job participates in the same required reusable-workflow result.
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: 'true'
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12 and locked test dependencies
        shell: pwsh
        run: |
          npm install --global npm@12 --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify native Windows media cache containment
        run: node --test scripts/whatsapp-bridge/media_paths.test.mjs

      - name: Verify native Windows termination, ownership and path regressions
        shell: pwsh
        working-directory: apps/desktop
        run: |
          $testHome = Join-Path $env:RUNNER_TEMP 'hermes-native-validation'
          $null = New-Item -ItemType Directory -Path $testHome -Force
          $env:HOME = $testHome
          $env:USERPROFILE = $testHome
          $env:HERMES_HOME = Join-Path $testHome '.hermes'
          $testFiles = @(
            'electron/backend-claim.test.ts',
            'electron/backend-release-gate.test.ts',
            'electron/backend-release-gate.windows-live.test.ts',
            'electron/desktop-installation.test.ts',
            'electron/git-repo-scan.test.ts',
            'electron/git-review-ops.test.ts',
            'electron/git-worktree-ops.test.ts',
            'electron/hardening.test.ts',
            'electron/pool-spawn-coordinator.test.ts',
            'electron/ssh-config.test.ts',
            'electron/ssh-connection.test.ts',
            'electron/update-handoff-marker.test.ts',
            'electron/updater-process.test.ts',
            'electron/updater-process.windows-live.test.ts',
            'electron/windows-hermes-path.test.ts',
            'electron/wsl-path-bridge.test.ts',
            'electron/wsl-path-bridge-gate.test.ts',
            'electron/wsl-path-bridge-profile.test.ts'
          )
          node ../../node_modules/vitest/vitest.mjs run --project=electron --maxWorkers=1 @testFiles
          exit $LASTEXITCODE
