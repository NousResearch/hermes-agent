# .github/workflows/js-tests.yml
name: JS Tests

on:
  workflow_call:

jobs:
  check:
    name: JS & TS checks
    # Fork validation uses the standard GitHub-hosted runner because the
    # upstream private 32-core label is unavailable outside NousResearch.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: grab npm 12
        run: |
          npm --version | grep -q '^12\.' || npm i -g npm@12

      - name: Restore node_modules
        id: node-modules-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            node_modules
            apps/*/node_modules
            ui-tui/node_modules
            ui-tui/packages/*/node_modules
            tests-js/node_modules
            web/node_modules
          key: node-modules-scripts-${{ runner.os }}-node26-npm12-${{ hashFiles('package-lock.json') }}

      - uses: ./.github/actions/retry
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        with:
          command: npm ci

      - name: Run all workspace checks
        run: node .github/scripts/run-workspace-checks.mjs
