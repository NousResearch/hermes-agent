name: Lint (ruff + ty)

# One job, four checks. They used to be four jobs on the same runner, each repeating the same
# checkout + setup-pm (+ pinned ruff) for 10-60s of work. Each check keeps its own gate and runs
# whether or not the others failed (`!cancelled()`), so one red check never hides another:
#   1. Windows footguns and sibling static guards (blocking, `python`). They run first, on the
#      setup-pm interpreter, before the pinned-tool install below re-points `python`.
#   2. Blocking ``ruff check .`` (`python`) — enforces the explicit rules in
#      ``[tool.ruff.lint.select]`` (currently PLW1514).
#   3. Blocking code-health ratchet (``scripts/code_health``) for Python and TypeScript (PRs).
#   4. Advisory ruff + ty diff vs the target branch (PRs, `python`). Writes a Markdown summary
#      to the run page and never fails the job.
# ``just check`` (``python scripts/check``) runs every blocking check here locally with the same
# pinned tools; each guard step below runs one of them by name, from the one list in scripts/check.
#
# CI-sensitive file review is enforced by .github/CODEOWNERS, not a CI job.

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''
      event_name:
        description: The event name from the calling orchestrator (pull_request or push).
        type: string
        required: true
      python:
        description: Python changed. A frontend-only PR runs just the code-health ratchet (TS).
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: lint-${{ (github.ref_type == 'tag' || inputs.commit != '') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.commit == '' }}

jobs:
  lint:
    name: Python lints
    # A frontend-only push has nothing to check here (the ratchet is PR-only).
    if: inputs.python || inputs.event_name == 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ inputs.commit }}
          # Full history: the diff's merge base + base worktree, and the ratchet's HEAD^1 (the
          # merge commit's first parent, the base branch tip).
          fetch-depth: 0

      - uses: ./.github/actions/setup-pm
        id: setup
        with:
          cache-python: true
          prune-python-cache: true

      # ── Windows footguns and sibling static guards (blocking, python lane) ─────────────────

      # Static guardrails on Windows-unsafe Python primitives — os.kill(pid, 0),
      # os.killpg, os.setsid, signal.SIGKILL without getattr fallback,
      # shebang scripts via subprocess, bare open() without encoding=, etc.
      # See scripts/check-windows-footguns.py for the full rule list.
      - name: Run footgun checker
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.python }}
        run: just check --only footguns

      - name: Require portable Bash shebangs
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.python }}
        run: just check --only shebangs

      # /tmp is not portable (Termux has none, native Windows has none, macOS aliases it to
      # /private/tmp, Linux mounts it as a small tmpfs). Production code resolves scratch space
      # through the scratch-dir helper; skills, docs and prompts must not teach the model a
      # literal /tmp either. `no-tmp: ok — <why>` marks a deliberate line; _BASELINE in the
      # script is the burn-down list of pre-existing hits.
      - name: Forbid literal /tmp paths outside the baseline
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.python }}
        run: just check --only no-tmp

      # A child in its own session/group (start_new_session, os.setsid/setpgid) does not die with
      # a SIGKILLed Hermes. Long-lived children start through process_identity.spawn_owned; a line
      # that must stay detached says why with `detached-spawn: ok — <why>`.
      - name: Forbid detached spawns outside the owned-child helper
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.python }}
        run: just check --only detached-spawns

      # The install root has one owner, hermes_cli._startup_fast.project_root_str(); sys.path
      # belongs to entry points. New __file__ climbs or import-time sys.path edits fail here.
      - name: Forbid new install-root math and import-time sys.path edits
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.python }}
        run: just check --only install-root

      # config.yaml is hand-edited and commented; a PyYAML dump of it destroys every comment
      # (#92554, regressed repeatedly). All writers go through the hermes_cli.config writer seam.
      - name: Forbid config.yaml writers that bypass the comment-preserving writer
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.python }}
        run: just check --only config-writers

      # Every read of a user config.yaml goes through hermes_cli.config_backend, so a non-file
      # config backend (config-config design §4.1) sees every reader.
      - name: Forbid config.yaml readers that bypass the config backend
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.python }}
        run: just check --only config-readers

      - name: Forbid profile creation outside the provisioning entry point
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.python }}
        run: just check --only profile-create-entry

      # The OS lanes import only files carrying the matching marker, so a test that fakes
      # macOS (is_macos -> True, sys.platform -> "darwin") without `platforms("macos")` is green on
      # Linux over a faked branch and never runs on macOS (#111866, tests/AGENTS.md § Don't fake the host OS).
      - name: Forbid unmarked macOS fakes in tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.python }}
        run: just check --only os-marker-fakes

      # Every AGENTS.md from the git root down to the working directory loads as one
      # project-context block (30,720 chars on a 128k window); chains are capped at 30k.
      - name: Keep every AGENTS.md under its truncation cap
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.python }}
        run: just check --only agents-md

      # A t() key that no catalog defines does not raise: t() returns the bare key
      # and users read the dotted path. Same for a format kwarg the English value
      # needs but the call site omits, which ships a literal {placeholder}. Neither
      # is visible to the catalog parity tests, which only compare catalogs to each
      # other. Reading locales/en.yaml needs ruamel (hermes_yaml); this job installs
      # no project dependencies.
      - name: Check t() usage against the English catalog
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.python }}
        run: python -m scripts.ci.python_packages ruamel.yaml==0.18.17 -- scripts/check_i18n_usage.py

      # ── Advisory footgun-family reports (pull requests, python lane) ──────────────────────

      # Advisory: continue-on-error and a step timeout each, so neither a failure nor an overrun
      # reaches the blocking checks. They run on the setup-pm interpreter, as before the merge.
      # Advisory: profile-scope hazard shapes on the lines this PR adds (child env from os.environ,
      # raw os.getenv of a platform credential, HOME-only RPC binding, bare-PID liveness). One
      # process serves many profiles; every pattern leaked the launch profile at least once. Printed
      # into the log for the reviewer; never fails the job (root AGENTS.md § Rules that apply everywhere).
      - name: Profile-scope patterns on added lines (advisory)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.python && github.event_name == 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          PR_HEAD: "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head"
        run: |
          git fetch --no-tags --deepen=200 origin "${{ github.base_ref }}" "$PR_HEAD"
          for i in 1 2 3; do
            git merge-base "origin/${{ github.base_ref }}" origin/pr-head >/dev/null 2>&1 && break
            git fetch --no-tags --deepen=1000 origin "${{ github.base_ref }}" "$PR_HEAD"
          done
          python scripts/check_profile_scope_patterns.py --base "origin/${{ github.base_ref }}" --head origin/pr-head

      # Advisory: dropped public names / methods / test defs vs the PR base, printed into the log.
      # A refactor that silently removes a public symbol breaks plugins that import it; the Sep 2026
      # decomposition opened with 1,703 such drops that reviewers had to find by hand.
      # Advisory: it never fails the job. The checkout above is depth-1, so deepen both sides until
      # a merge-base exists (the script refuses to report a clean diff without one, by design).
      # Diff the PR head ref, not the checked-out refs/pull/N/merge commit: that synthetic commit
      # is recomputed server-side whenever main moves, and once it is unreachable no amount of
      # deepening ever reaches its parents (run 34285107265: 4 fetches, 4m15s, "no merge-base").
      - name: Public-surface diff vs base (advisory)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && inputs.python && github.event_name == 'pull_request' }}
        continue-on-error: true
        # Bound the advisory step so a long deepen/fetch (e.g. a distant or missing
        # merge-base) can't consume the blocking job's 5-minute budget and cancel it.
        # continue-on-error already keeps a step *failure* off the job; a step-level
        # timeout keeps a step *overrun* off the job-level timeout the same way.
        # Sizing: a --deepen=200 fetch took ~56s and a --deepen=1000 ~67s on the runner, and
        # main gains ~170 commits/day, so a day-old branch legitimately needs both (~2 min).
        timeout-minutes: 3
        env:
          PR_HEAD: "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head"
        run: |
          git fetch --no-tags --deepen=200 origin "${{ github.base_ref }}" "$PR_HEAD"
          for i in 1 2 3; do
            git merge-base "origin/${{ github.base_ref }}" origin/pr-head >/dev/null 2>&1 && break
            git fetch --no-tags --deepen=1000 origin "${{ github.base_ref }}" "$PR_HEAD"
          done
          python scripts/ci/check_public_surface.py --base "origin/${{ github.base_ref }}" --head origin/pr-head

      # ── Pinned ruff (+ ty for the advisory diff) ──────────────────────────────────────────

      # Exports the ci-tools environment as `python` / `ruff` / `ty` for every later step.
      - name: Install pinned ruff${{ inputs.event_name == 'pull_request' && inputs.python && ' + ty' || '' }}
        id: tools
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: ./.github/actions/retry
        with:
          command: python -m scripts.ci.python_packages "$(python -m scripts.code_health --print-pins)" ${{ inputs.event_name == 'pull_request' && inputs.python && 'ty==0.0.89' || '' }}

      # ── Blocking ruff (python lane) ────────────────────────────────────────────────────────

      # Enforce the rules in pyproject.toml [tool.ruff.lint.select]. Currently
      # PLW1514 (unspecified-encoding) — catches bare ``open()`` /
      # ``read_text()`` / ``write_text()`` calls that default to locale
      # encoding on Windows. No --exit-zero, no || true: the exit code fails the
      # job, which fails the required-check gate.
      - name: ruff check  .
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && inputs.python }}
        run: |
          ruff check .

      # ── Blocking code-health ratchet (pull requests, Python and TypeScript) ───────────────

      # Per-unit ratchet: every function and file keeps its own cap (its value on main when it is
      # already over target, else the target) and pattern rules compare fingerprints, so a PR
      # cannot trade one violation for another. The merge commit is compared with its first
      # parent (current main), so an improvement that lands on main is locked in at once.
      - name: Ratchet the PR against the base branch tip
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && inputs.event_name == 'pull_request' }}
        run: just check --only health --base HEAD^1

      # ── Advisory ruff + ty diff (pull requests, python lane) ──────────────────────────────

      - name: Determine base ref
        id: base
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && inputs.event_name == 'pull_request' && inputs.python }}
        run: |
          # For PRs, diff against the merge base with the target branch.
          # For pushes to main, diff against the previous commit on main.
          if [ "${{ inputs.event_name }}" = "pull_request" ]; then
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
            BASE_REF="origin/${{ github.base_ref }}"
          else
            BASE_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            BASE_REF="HEAD~1"
          fi
          echo "sha=${BASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "Base SHA: ${BASE_SHA}"
          echo "Base ref: ${BASE_REF}"

      # Reports live under $RUNNER_TEMP, not the checkout: the clean-worktree step at the end of
      # the job fails (or warns) on untracked files, and .lint-reports/ is not gitignored.
      # Advisory: the three diff steps never fail the job.
      - name: Run ruff + ty on HEAD
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        continue-on-error: true
        run: |
          R="$RUNNER_TEMP/lint-reports"
          mkdir -p "$R/head"
          ruff check --output-format json --exit-zero \
            > "$R/head/ruff.json" || true
          ty check --output-format gitlab --exit-zero \
            > "$R/head/ty.json" || true
          echo "HEAD ruff: $(wc -c < "$R/head/ruff.json") bytes"
          echo "HEAD ty:   $(wc -c < "$R/head/ty.json") bytes"

      - name: Run ruff + ty on base (via git worktree)
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        continue-on-error: true
        run: |
          R="$RUNNER_TEMP/lint-reports"
          mkdir -p "$R/base"
          # Use a worktree so we don't clobber the main checkout. If the basex
          # SHA is identical to HEAD (e.g. first commit), skip and leave the
          # base reports empty — the diff script handles missing files.
          HEAD_SHA=$(git rev-parse HEAD)
          BASE_SHA="${{ steps.base.outputs.sha }}"
          if [ "$BASE_SHA" = "$HEAD_SHA" ]; then
            echo "Base SHA == HEAD SHA, skipping base scan."
            echo '[]' > "$R/base/ruff.json"
            echo '[]' > "$R/base/ty.json"
          else
            git worktree add --detach "$RUNNER_TEMP/lint-base" "$BASE_SHA"
            (
              cd "$RUNNER_TEMP/lint-base"
              ruff check --output-format json --exit-zero \
                > "$R/base/ruff.json" || true
              ty check --output-format gitlab --exit-zero \
                > "$R/base/ty.json" || true
            )
            git worktree remove --force "$RUNNER_TEMP/lint-base"
          fi
          echo "base ruff: $(wc -c < "$R/base/ruff.json") bytes"
          echo "base ty:   $(wc -c < "$R/base/ty.json") bytes"

      - name: Generate diff summary
        if: ${{ !cancelled() && steps.base.outcome == 'success' }}
        continue-on-error: true
        env:
          HEAD_REF: ${{ inputs.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          R="$RUNNER_TEMP/lint-reports"
          python scripts/lint_diff.py \
            --base-ruff "$R/base/ruff.json" \
            --head-ruff "$R/head/ruff.json" \
            --base-ty   "$R/base/ty.json" \
            --head-ty   "$R/head/ty.json" \
            --base-ref  "${{ steps.base.outputs.ref }}" \
            --head-ref  "$HEAD_REF" \
            --output    "$R/summary.md"
          cat "$R/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the checkout is clean
        # Last step of every job (tests/ci/test_clean_worktree_check.py): a test or CI step that
        # leaves an untracked or modified file in the checkout is reported here. Runs only when
        # every earlier step passed: a step that failed midway can leave its own temp files
        # (a half-extracted download, a worktree its later cleanup never removed).
        uses: ./.github/actions/check-clean-worktree
