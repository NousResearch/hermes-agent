name: Linux Release Artifacts

# Builds every Hermes Desktop Linux distribution format as separate parallel
# jobs — Flatpak, Snap, AppImage, deb, rpm — then uploads ALL of them as
# assets on a single GitHub Release. Triggered on release publish;
# workflow_dispatch builds are saved as workflow artifacts only.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v0.17.0). Defaults to latest release."
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: linux-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Shared Electron app build (linux-unpacked), reused by all formats ──
  build-electron:
    name: Build Electron app
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Upgrade npm
        run: npm i -g npm@12

      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Electron app (unpacked)
        working-directory: apps/desktop
        # Full build (renderer + bundled main) then electron-builder --dir
        # (unpackaged) to produce release/linux-unpacked
        run: |
          npm run build
          npm run builder -- --linux --dir

      - name: Upload unpacked build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-unpacked
          path: apps/desktop/release/linux-unpacked
          retention-days: 1

  # ── Per-format package builds ───────────────────────────────────────────
  build-appimage-deb-rpm:
    name: Build AppImage + deb + rpm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-electron
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Upgrade npm
        run: npm i -g npm@12

      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Download unpacked build
        uses: actions/download-artifact@v4
        with:
          name: electron-unpacked
          path: apps/desktop/release/linux-unpacked

      - name: Build AppImage + deb + rpm
        working-directory: apps/desktop
        # --publish never: electron-builder would otherwise demand GH_TOKEN
        # to publish to GitHub Releases itself (we upload via the release job)
        run: npm run dist:linux -- --publish never

      - name: Verify artifacts
        run: |
          ls -la apps/desktop/release/*.AppImage
          chmod +x apps/desktop/release/*.AppImage
          apps/desktop/release/*.AppImage --help | head -5 || true
          test -f apps/desktop/release/*.deb
          test -f apps/desktop/release/*.rpm

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-packages-appimage-deb-rpm
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          retention-days: 1
          if-no-files-found: error

  build-flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-electron
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flatpak flatpak-builder

      - name: Add Flathub remote
        run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtimes
        run: |
          flatpak install --user --noninteractive \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.node22//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Upgrade npm
        run: npm i -g npm@12

      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Download unpacked build
        uses: actions/download-artifact@v4
        with:
          name: electron-unpacked
          path: apps/desktop/release/linux-unpacked

      - name: Build Flatpak
        working-directory: apps/desktop
        run: |
          node scripts/stage-flatpak.mjs
          flatpak-builder --force-clean \
            --repo flatpak/repo \
            flatpak/build-dir \
            flatpak/com.nousresearch.Hermes.yml
          flatpak build-bundle \
            flatpak/repo \
            release/com.nousresearch.Hermes.flatpak \
            com.nousresearch.Hermes

      - name: Verify Flatpak
        run: |
          flatpak install --user --noninteractive \
            --bundle apps/desktop/release/com.nousresearch.Hermes.flatpak
          flatpak run --command=sh com.nousresearch.Hermes -c '
            test -x /app/bin/hermes-desktop && echo "OK: Flatpak" || exit 1
          ' || exit 1

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-flatpak
          path: apps/desktop/release/com.nousresearch.Hermes.flatpak
          retention-days: 1
          if-no-files-found: error

  build-snap:
    name: Build Snap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-electron
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Snapcraft
        # snapcraft CLI from the snap store (snapcore/action-install does not exist)
        run: |
          sudo snap install snapcraft --classic
          sudo snap install lxd
          # explicit subnet: auto-picked one can collide with the runner's
          # virtual networks, leaving containers without egress
          sudo lxd init --minimal
          sudo lxc network set lxdbr0 ipv4.address=10.100.0.1/24
          sudo lxc network set lxdbr0 ipv4.nat=true
          sudo usermod -aG lxd "$USER"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Upgrade npm
        run: npm i -g npm@12

      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Download unpacked build
        uses: actions/download-artifact@v4
        with:
          name: electron-unpacked
          path: apps/desktop/release/linux-unpacked

      - name: Build Snap
        working-directory: apps/desktop
        run: |
          node scripts/stage-snap.mjs
          # LXD container build: mesa-2404's install hook needs BPF mounts
          # unavailable on the runner VM itself, so destructive mode fails
          # sg lxd: fresh group membership requires a new session; also
          # give LXD time to finish first-time init
          # container (not VM): GH runners lack nested-KVM for LXD VMs, and
          # the default instance type fails with "no network access"
          sg lxd -c "env SNAPCRAFT_BUILD_ENVIRONMENT_TYPE=container snapcraft"

      - name: Verify Snap
        run: |
          snap info hermes-desktop_*.snap || true
          snap run --shell hermes-desktop_*.snap -c '
            test -x /snap/hermes-desktop/current/bin/hermes-desktop && echo "OK: Snap" || exit 1
          ' || exit 1

      - name: Upload Snap
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-snap
          path: apps/desktop/hermes-desktop_*.snap
          retention-days: 1
          if-no-files-found: error

  # ── Attach everything to the GitHub Release ─────────────────────────────
  # Runs on release publish AND on workflow_dispatch: dispatch runs attach
  # to the release named by the `version` input, or the latest release.
  upload-to-release:
    name: Upload all artifacts to Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-appimage-deb-rpm, build-flatpak, build-snap]
    steps:
      - name: Resolve target release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "Uploading artifacts to release $TAG"

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: linux-*

      - name: Upload Flatpak to Release
        uses: softprops/action-gh-release@de6c8c82b0c67c1c7d4b1f04a9a7b0f4c6e8e5c1 # v2
        with:
          files: artifacts/linux-flatpak/com.nousresearch.Hermes.flatpak
          name: Hermes Desktop Flatpak (Linux)
          body: |
            Official Hermes Desktop Flatpak for Linux.
            Install: `flatpak install --user com.nousresearch.Hermes.flatpak`

      - name: Upload Snap to Release
        uses: softprops/action-gh-release@de6c8c82b0c67c1c7d4b1f04a9a7b0f4c6e8e5c1 # v2
        with:
          files: artifacts/linux-snap/hermes-desktop_*.snap
          tag: ${{ env.RELEASE_TAG }}
          name: Hermes Desktop Snap (Linux)
          body: |
            Official Hermes Desktop Snap for Linux.
            Install: `snap install --dangerous hermes-desktop_*.snap`

      - name: Upload AppImage to Release
        uses: softprops/action-gh-release@de6c8c82b0c67c1c7d4b1f04a9a7b0f4c6e8e5c1 # v2
        with:
          files: artifacts/linux-packages-appimage-deb-rpm/*.AppImage
          tag: ${{ env.RELEASE_TAG }}
          name: Hermes Desktop AppImage (Linux)
          body: |
            Official Hermes Desktop AppImage for Linux.
            Install: `chmod +x Hermes-*.AppImage && ./Hermes-*.AppImage`

      - name: Upload deb to Release
        uses: softprops/action-gh-release@de6c8c82b0c67c1c7d4b1f04a9a7b0f4c6e8e5c1 # v2
        with:
          files: artifacts/linux-packages-appimage-deb-rpm/*.deb
          tag: ${{ env.RELEASE_TAG }}
          name: Hermes Desktop deb (Debian/Ubuntu)
          body: |
            Official Hermes Desktop .deb package.
            Install: `sudo apt install ./Hermes_*.deb`

      - name: Upload rpm to Release
        uses: softprops/action-gh-release@de6c8c82b0c67c1c7d4b1f04a9a7b0f4c6e8e5c1 # v2
        with:
          files: artifacts/linux-packages-appimage-deb-rpm/*.rpm
          tag: ${{ env.RELEASE_TAG }}
          name: Hermes Desktop rpm (Fedora/RHEL)
          body: |
            Official Hermes Desktop .rpm package.
            Install: `sudo dnf install ./Hermes-*.rpm`
