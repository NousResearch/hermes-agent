name: nf-secret-scan

# North Forge secret scan — runs the same .githooks checks the local pre-push
# hook runs, so a push is checked even when local hooks are not installed on the
# machine it came from:
#   * .githooks/content-scan  — high-confidence AWS / GitHub / Slack credential
#     CONTENT introduced by the commits in this push / PR.
#   * .githooks/secret-guard  — credential-bearing FILENAMES (.env family, SSH
#     private keys, *.p12/*.pfx/keystores, credentials.json / service-account
#     JSON, .netrc / .pgpass / .htpasswd, PEM/.key private keys) in the tip tree
#     and among the changed paths.
#
# Allowlist a confirmed fake/fixture VALUE with an inline "# nf-scan: allow <reason>"
# comment on that exact line (content-scan). Allowlist a confirmed-safe PATH by
# adding it to ALLOWLIST in .githooks/secret-guard. No whole-file exclusions.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  content-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve the range to scan
        id: range
        shell: bash
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ "$base" = "$zero" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # new branch / unknown base: fall back to the merge-base with the default branch
            git fetch --no-tags --depth=1 origin "${{ github.event.repository.default_branch }}" || true
            base="$(git merge-base "origin/${{ github.event.repository.default_branch }}" "$head" 2>/dev/null || true)"
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          if [ -z "$base" ] || [ "$base" = "$head" ]; then
            echo "range=" >> "$GITHUB_OUTPUT"
          else
            echo "range=$base..$head" >> "$GITHUB_OUTPUT"
          fi
          echo "Scanning range: ${base:-<none>}..$head"

      - name: hook self-tests (content-scan + secret-guard)
        shell: bash
        run: |
          set -euo pipefail
          sh .githooks/tests/run.sh
          sh .githooks/tests/secret-guard.sh

      - name: secret-guard (filenames — tip tree + changed paths)
        shell: bash
        run: |
          set -euo pipefail
          sh .githooks/secret-guard --tree "${{ steps.range.outputs.head || github.sha }}"
          range="${{ steps.range.outputs.range }}"
          if [ -n "$range" ]; then
            sh .githooks/secret-guard --range "$range"
          fi

      - name: content-scan (this push / PR)
        shell: bash
        run: |
          set -euo pipefail
          range="${{ steps.range.outputs.range }}"
          if [ -z "$range" ]; then
            echo "No commit range to scan (nothing new); skipping."
            exit 0
          fi
          sh .githooks/content-scan --commits "$range"
