name: nf-secret-scan

# North Forge content secret scan — runs the same .githooks/content-scan the local
# pre-push hook runs, so a push is checked even when local hooks are not installed
# on the machine it came from. Blocks high-confidence AWS / GitHub / Slack
# credentials introduced by the commits in this push / PR. Companion to the
# filename guard in .githooks/secret-guard.
#
# Allowlist a confirmed fake/fixture value with an inline "# nf-scan: allow <reason>"
# comment on that exact line (see .githooks/content-scan). No whole-file exclusions.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  content-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve the range to scan
        id: range
        shell: bash
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ "$base" = "$zero" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # new branch / unknown base: fall back to the merge-base with the default branch
            git fetch --no-tags --depth=1 origin "${{ github.event.repository.default_branch }}" || true
            base="$(git merge-base "origin/${{ github.event.repository.default_branch }}" "$head" 2>/dev/null || true)"
          fi
          if [ -z "$base" ] || [ "$base" = "$head" ]; then
            echo "range=" >> "$GITHUB_OUTPUT"
          else
            echo "range=$base..$head" >> "$GITHUB_OUTPUT"
          fi
          echo "Scanning range: ${base:-<none>}..$head"

      - name: content-scan (self-tests)
        shell: bash
        run: sh .githooks/tests/run.sh

      - name: content-scan (this push / PR)
        shell: bash
        run: |
          set -euo pipefail
          range="${{ steps.range.outputs.range }}"
          if [ -z "$range" ]; then
            echo "No commit range to scan (nothing new); skipping."
            exit 0
          fi
          sh .githooks/content-scan --commits "$range"
