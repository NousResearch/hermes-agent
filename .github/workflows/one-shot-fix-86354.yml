name: One-shot endpoint-scoped email app passwords

on:
  push:
    branches:
      - fix/email-app-password-normalization
    paths:
      - .github/workflows/one-shot-fix-86354.yml

permissions:
  contents: write

concurrency:
  group: one-shot-fix-86354
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout trigger head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/email-app-password-normalization
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Rebuild, verify, and publish the product-only head
        env:
          CURRENT_MAIN: b6bcb3e791c673e63974029bbab40cc9326803ff
          BRANCH: fix/email-app-password-normalization
          MATERIALIZER_B64: 
        shell: bash
        run: |
          set -euo pipefail
          trigger_head="$(git rev-parse HEAD)"

          git fetch --no-tags https://github.com/NousResearch/hermes-agent.git "${CURRENT_MAIN}"
          test "$(git rev-parse FETCH_HEAD)" = "${CURRENT_MAIN}"
          git reset --hard "${CURRENT_MAIN}"

          printf '%s' "${MATERIALIZER_B64}" | base64 --decode > /tmp/materialize-86354.py
          test "$(sha256sum /tmp/materialize-86354.py | cut -d' ' -f1)" = "1bd7ca9b6685aa54aa9bea9674f10dae6d042c3e57c51e2f83f5045dacc86d8a"
          python3 -m py_compile /tmp/materialize-86354.py
          python3 /tmp/materialize-86354.py

          uv sync --locked --python 3.11 --extra all --extra dev             --extra anthropic --extra mistral --extra fal --extra modal             --extra daytona --extra hindsight --extra parallel-web

          uv run --python 3.11 python -m py_compile             plugins/platforms/email/adapter.py             tests/gateway/test_email.py
          uv run --python 3.11 python -m pytest -q tests/gateway/test_email.py
          git diff --check

          mapfile -t changed < <(git diff --name-only "${CURRENT_MAIN}")
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "plugins/platforms/email/adapter.py"
          test "${changed[1]}" = "tests/gateway/test_email.py"

          git config user.name "andrexibiza"
          git config user.email "84248988+andrexibiza@users.noreply.github.com"
          git add plugins/platforms/email/adapter.py tests/gateway/test_email.py
          git commit -m "fix(email): scope app-password normalization to Google endpoints"
          git push             --force-with-lease="refs/heads/${BRANCH}:${trigger_head}"             origin "HEAD:refs/heads/${BRANCH}"
