name: One-shot process-sticky memory-provider quarantine carrier

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/memory-prefetch-cancel
          fetch-depth: 0

      - name: Execute reviewed base carrier with current-main structural anchors
        run: |
          set -euo pipefail
          original_carrier_commit=96e61712cbe19bfe6d258bb83647e574a7d03346
          carrier_path=.github/workflows/one-shot-fix-88796.yml

          git fetch --no-tags origin "$original_carrier_commit"
          git show "$original_carrier_commit:$carrier_path" > /tmp/original-88796-carrier.yml

          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/original-88796-carrier.yml').read_text(encoding='utf-8')
          lines = source.splitlines()
          starts = [i for i, line in enumerate(lines) if line.strip() == 'run: |']
          if len(starts) != 1:
              raise SystemExit(f'expected one run block, found {len(starts)}')
          start = starts[0]
          key_indent = len(lines[start]) - len(lines[start].lstrip())
          content_indent = key_indent + 2
          prefix = ' ' * content_indent
          body = []
          for line in lines[start + 1:]:
              if line.strip():
                  indent = len(line) - len(line.lstrip())
                  if indent <= key_indent:
                      break
                  if indent < content_indent:
                      raise SystemExit(f'invalid block indentation: {line!r}')
                  body.append(line[len(prefix):])
              else:
                  body.append('')
          shell = '\n'.join(body) + '\n'

          open_marker = "python3 - <<'PY'\n"
          if shell.count(open_marker) != 1:
              raise SystemExit(f'expected one Python materializer heredoc, found {shell.count(open_marker)}')
          materializer_start = shell.index(open_marker) + len(open_marker)
          close_marker = '\nPY\n'
          materializer_end = shell.index(close_marker, materializer_start)
          materializer = shell[materializer_start:materializer_end] + '\n'
          Path('/tmp/materialize-88796-base.sh').write_text(materializer, encoding='utf-8')

          executable_shell = (
              shell[: shell.index(open_marker)]
              + 'python3 /tmp/materialize-88796-base.sh\n'
              + shell[materializer_end + len(close_marker):]
          )
          Path('/tmp/execute-88796-base.sh').write_text(executable_shell, encoding='utf-8')
          PY

          python3 .github/workflows/patch-88796-carrier-idempotence.py
          python3 -m py_compile /tmp/materialize-88796-base.sh
          bash -n /tmp/execute-88796-base.sh
          bash /tmp/execute-88796-base.sh
