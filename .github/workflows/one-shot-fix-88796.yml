name: One-shot process-sticky memory-provider quarantine

on:
  push:
    branches:
      - fix/memory-prefetch-cancel

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/memory-prefetch-cancel
          fetch-depth: 0

      - name: Execute reviewed carrier with current-main structural anchors
        run: |
          set -euo pipefail
          previous_carrier_commit=161e0e0538dbd8ba22f08c51be392baedb7853aa
          carrier_path=.github/workflows/one-shot-fix-88796.yml

          git fetch --no-tags origin "$previous_carrier_commit"
          git show "$previous_carrier_commit:$carrier_path" > /tmp/previous-88796-carrier.yml

          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/previous-88796-carrier.yml').read_text()
          lines = source.splitlines()
          starts = [i for i, line in enumerate(lines) if line.strip() == 'run: |']
          if len(starts) != 1:
              raise SystemExit(f'expected one outer run block, found {len(starts)}')
          start = starts[0]
          key_indent = len(lines[start]) - len(lines[start].lstrip())
          prefix = ' ' * (key_indent + 2)
          body = [
              line[len(prefix):] if line.startswith(prefix) else line
              for line in lines[start + 1:]
          ]
          script = '\n'.join(body) + '\n'

          begin_marker = 'key_indent = len(lines[start]) - len(lines[start].lstrip())'
          end_marker = "Path('/tmp/materialize-88796-base.sh').write_text('\\n'.join(body) + '\\n')"
          begin = script.index(begin_marker)
          end = script.index(end_marker, begin) + len(end_marker)
          replacement = '''key_indent = len(lines[start]) - len(lines[start].lstrip())
          content_indent = key_indent + 2
          prefix = ' ' * content_indent
          body = [
              line[len(prefix):] if line.startswith(prefix) else line
              for line in lines[start + 1:]
          ]
          Path('/tmp/materialize-88796-base.sh').write_text('\\n'.join(body) + '\\n')'''
          script = script[:begin] + replacement + script[end:]

          needle = 'bash -n /tmp/materialize-88796-base.sh'
          if script.count(needle) != 1:
              raise SystemExit(f'base execution marker drifted: {script.count(needle)}')
          harden = r'''python3 - <<'PY_GATE'
          from pathlib import Path

          path = Path('/tmp/materialize-88796-base.sh')
          materializer = path.read_text()
          triple = chr(39) * 3

          def rewrite_assignments(source, function_name, old_text, new_body):
              marker = f'def {function_name}('
              if source.count(marker) != 1:
                  raise SystemExit(
                      f'{function_name} function anchor drifted: {source.count(marker)}'
                  )
              start = source.index(marker)
              next_def = source.find('\ndef ', start + len(marker))
              end = next_def if next_def != -1 else len(source)
              region = source[start:end]
              old_start = region.find('    old = ')
              new_start = region.find('    new = ', old_start + 1)
              if_start = region.find('    if region.count(old)', new_start + 1)
              if min(old_start, new_start, if_start) < 0:
                  raise SystemExit(
                      f'{function_name} assignment structure drifted: '
                      f'old={old_start} new={new_start} if={if_start}'
                  )
              replacement = (
                  f'    old = {old_text!r}\n'
                  + '    gate = f' + triple + new_body + triple + '\n'
                  + '    if gate in region:\n'
                  + '        return source\n'
                  + '    new = old + gate\n'
              )
              region = region[:old_start] + replacement + region[if_start:]
              return source[:start] + region + source[end:]

          materializer = rewrite_assignments(
              materializer,
              'gate_loop',
              '        for provider in self._providers:\n',
              '            if not self._provider_call_allowed(provider, "{operation}"):\n'
              '                continue\n',
          )
          materializer = rewrite_assignments(
              materializer,
              'gate_background_loop',
              '            for provider in providers:\n',
              '                if not self._provider_call_allowed(provider, "{operation}"):\n'
              '                    continue\n',
          )

          on_memory_marker = 'start, end, region = method_region(text, "on_memory_write")'
          handle_marker = 'handle_old = '
          if materializer.count(on_memory_marker) != 1:
              raise SystemExit(
                  f'on_memory_write section drifted: {materializer.count(on_memory_marker)}'
              )
          section_start = materializer.index(on_memory_marker)
          section_end = materializer.index(handle_marker, section_start)
          on_memory_replacement = '''start, end, region = method_region(text, "on_memory_write")
          memory_gate = '            if not self._provider_call_allowed(provider, "memory_write"):\\n                continue\\n'
          if memory_gate not in region:
              anchor = '        for provider in self._providers:\\n            if provider.name == "builtin":\\n                continue\\n'
              if region.count(anchor) != 1:
                  raise SystemExit("on_memory_write provider loop drifted")
              region = region.replace(anchor, anchor + memory_gate, 1)
              text = text[:start] + region + text[end:]

          '''
          materializer = (
              materializer[:section_start]
              + on_memory_replacement
              + materializer[section_end:]
          )

          handle_start = materializer.index('handle_old = ')
          names_start = materializer.index('names_old = ', handle_start)
          handle_replacement = '''start, end, region = method_region(text, "handle_tool_call")
          handle_gate = '        if not self._provider_call_allowed(provider, f"tool:{tool_name}"):\\n            return tool_error(\\n                f"Memory provider \'{provider.name}\' is quarantined after an "\\n                "uncancellable prefetch timeout"\\n            )\\n'
          if handle_gate not in region:
              anchor = '        provider = self._tool_to_provider.get(tool_name)\\n        if provider is None:\\n            return tool_error(f"No memory provider handles tool \'{tool_name}\'")\\n'
              if region.count(anchor) != 1:
                  raise SystemExit("handle_tool_call anchor drifted")
              region = region.replace(anchor, anchor + handle_gate, 1)
              text = text[:start] + region + text[end:]

          '''
          materializer = (
              materializer[:handle_start]
              + handle_replacement
              + materializer[names_start:]
          )

          names_start = materializer.index('names_old = ')
          path_write = materializer.index('path.write_text(text)', names_start)
          names_replacement = '''start, end, _ = method_region(text, "get_all_tool_names")
          names_method = (
              '    def get_all_tool_names(self) -> set:\\n'
              '        """Return callable tool names across non-quarantined providers."""\\n'
              '        return {\\n'
              '            name\\n'
              '            for name, provider in self._tool_to_provider.items()\\n'
              '            if self._provider_call_allowed(provider, "tool_schema")\\n'
              '        }\\n'
          )
          text = text[:start] + names_method + text[end:]

          start, end, _ = method_region(text, "has_tool")
          has_tool_method = (
              '    def has_tool(self, tool_name: str) -> bool:\\n'
              '        """Check if a currently admitted provider handles this tool."""\\n'
              '        provider = self._tool_to_provider.get(tool_name)\\n'
              '        return bool(\\n'
              '            provider is not None\\n'
              '            and self._provider_call_allowed(provider, "tool_schema")\\n'
              '        )\\n'
          )
          text = text[:start] + has_tool_method + text[end:]

          '''
          materializer = (
              materializer[:names_start]
              + names_replacement
              + materializer[path_write:]
          )

          path.write_text(materializer)
          PY_GATE

          '''
          script = script.replace(needle, harden + needle, 1)
          Path('/tmp/execute-88796.sh').write_text(script)
          PY

          bash -n /tmp/execute-88796.sh
          bash /tmp/execute-88796.sh
