name: Publish PR test image

on:
  push:
    branches:
      - feat/slack-alert-fingerprint-handler
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/gregsharpe-bot/hermes-agent
  IMAGE_TAG: pr-158913-${{ github.sha }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 test image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:pr-158913
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Temporary amd64 test image for PR 158913
          cache-from: type=gha,scope=hermes-pr-158913
          cache-to: type=gha,mode=max,scope=hermes-pr-158913

      - name: Print image digest
        run: |
          echo "image=${IMAGE_NAME}:${IMAGE_TAG}"
          echo "digest=${{ steps.build.outputs.digest }}"
