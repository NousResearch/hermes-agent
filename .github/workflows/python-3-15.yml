name: Python 3.15

# PM ships 3.14. This lane shows what breaks on 3.15 ahead of a switch. It is
# not part of ci.yaml's all-checks-pass, so a red run never blocks a merge.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/python-3-15.yml

permissions:
  contents: read

concurrency:
  group: python-3-15-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Run tests on Python 3.15 (${{ matrix.slice }}/3)
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          # PM's pinned uv (pm/lock.json).
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.15
        run: uv python install 3.15

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.15 --extra all --group dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra parallel-web --extra keychain

      - name: Run tests
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh
        env:
          HERMES_TEST_SLICE: ${{ matrix.slice }}/3
          HERMES_TEST_FORKSERVER: "1"
          HERMES_TEST_WORKERS: 32
          HERMES_TEST_FILE_TIMEOUT: 600
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Check the checkout is clean
        uses: ./.github/actions/check-clean-worktree
