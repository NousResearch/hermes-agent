name: Remote terminal backends

# The SSH and Docker terminal backends against a real sshd and a real Docker
# daemon. Every other test of these backends mocks subprocess / the docker CLI;
# the gated real-backend tests in tests/tools/test_ssh_environment.py skipped on
# every CI run because nothing provided a host.
#
# This job provides one: a throwaway sshd container on 127.0.0.1 that accepts a
# keypair generated for this run only (scripts/ci/start_test_sshd.sh), plus the
# runner's own Docker daemon with a small public image. No secrets are involved
# and none may be added: ci.yaml runs PR-controlled code.
#
# ci.yaml calls this only when a PR touches the backends (the classifier's
# `remote_backends` lane) and on every push to main.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: remote-backends-${{ github.ref_type == 'tag' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # One small image for both the sshd host and the docker backend's sandbox, pinned
  # by digest so a tag move cannot change what the lane tests.
  HERMES_TEST_IMAGE_REF: debian:12-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587

jobs:
  real-backends:
    name: SSH + Docker backends (real sshd, real daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - name: Pull the test image
        uses: ./.github/actions/retry
        with:
          command: docker pull -q "$HERMES_TEST_IMAGE_REF"

      - name: Start a throwaway sshd
        # Exports HERMES_TEST_SSH_{HOST,USER,PORT,KEY} through $GITHUB_ENV.
        env:
          HERMES_TEST_SSHD_IMAGE: ${{ env.HERMES_TEST_IMAGE_REF }}
        run: scripts/ci/start_test_sshd.sh "$RUNNER_TEMP/hermes-test-sshd"

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          extras: '[]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Run the real-backend tests
        env:
          HERMES_TEST_DOCKER_IMAGE: ${{ env.HERMES_TEST_IMAGE_REF }}
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        run: |
          set -o pipefail
          scripts/run_tests.sh tests/tools/test_ssh_environment.py tests/tools/test_docker_backend_real.py \
            | tee "$RUNNER_TEMP/remote-backends.log"
          # The real tests skip when their host is missing; here that would be a green
          # lane over zero coverage. The runner prints a file's skip count as "<n>s,".
          if grep -E '\((.* )?[0-9]+s,' "$RUNNER_TEMP/remote-backends.log"; then
            echo "::error::real-backend tests skipped: the sshd or docker image was not wired through"
            exit 1
          fi

      - name: sshd log
        if: failure()
        run: docker logs hermes-test-sshd || true
