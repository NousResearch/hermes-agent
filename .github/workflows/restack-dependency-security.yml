name: Restack dependency-security remediation

on:
  pull_request:
  push:
    branches:
      - restack/pr89479-current-main

permissions:
  contents: read

concurrency:
  group: dependency-security-restack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact restack object
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Use repository-authorized npm
        run: npm install --global npm@11.17.0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Apply source-derived manifest and layout changes
        run: python3 .github/scripts/restack_dependency_security.py apply

      - name: Regenerate current-main npm lock graph
        run: |
          npm install --package-lock-only --ignore-scripts --include=optional
          # npm 11 preserves the old lock placement when only the override shape
          # changes. Force the affected package edge through the new nested
          # PostCSS override without rewriting unrelated dependency families.
          npm update nanoid --package-lock-only --ignore-scripts --include=optional

      - name: Regenerate the exact h2 security lock edge
        run: uv lock --upgrade-package 'h2==4.4.1'

      - name: Verify graph semantics and current-main preservation
        run: python3 .github/scripts/restack_dependency_security.py verify

      - name: Verify focused regression and lock integrity
        run: |
          node --test apps/desktop/scripts/packaged-app-layout.test.mjs
          uv lock --check
          git diff --check

      - name: Verify npm advisory closure
        run: |
          npm audit --workspaces=false --audit-level=high
          npm audit --workspace web --audit-level=high
          npm audit --workspace ui-tui --audit-level=high
          npm audit --workspace apps/desktop --audit-level=high

      - name: Package exact generated files
        run: |
          set -euo pipefail
          mkdir -p generated/apps/desktop/scripts
          cp .npmrc package.json package-lock.json uv.lock generated/
          cp apps/desktop/package.json generated/apps/desktop/package.json
          cp apps/desktop/scripts/packaged-app-layout.mjs generated/apps/desktop/scripts/
          cp apps/desktop/scripts/packaged-app-layout.test.mjs generated/apps/desktop/scripts/
          cp apps/desktop/scripts/test-desktop.mjs generated/apps/desktop/scripts/
          find generated -type f -print0 | sort -z | xargs -0 sha256sum > generated/SHA256SUMS

      - name: Upload exact-object generation artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-restack-${{ github.event.pull_request.head.sha || github.sha }}
          path: generated/
          if-no-files-found: error
          retention-days: 7
