name: Restack dependency-security remediation

on:
  pull_request:
  push:
    branches:
      - restack/pr89479-current-main

permissions:
  contents: write

concurrency:
  group: dependency-security-restack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  generate-and-verify:
    if: github.repository == 'NousResearch/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact restack object
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Use repository-authorized npm
        run: npm install --global npm@11.17.0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Apply source-derived manifest and layout changes
        run: python3 .github/scripts/restack_dependency_security.py apply

      - name: Regenerate current-main npm lock graph
        run: |
          npm install --package-lock-only --ignore-scripts --include=optional
          npm update nanoid --package-lock-only --ignore-scripts --include=optional

      - name: Regenerate the exact h2 security lock edge
        run: uv lock --upgrade-package 'h2==4.4.1'

      - name: Verify graph semantics and current-main preservation
        run: python3 .github/scripts/restack_dependency_security.py verify

      - name: Verify focused regression and lock integrity
        run: |
          node --test apps/desktop/scripts/packaged-app-layout.test.mjs
          uv lock --check
          git diff --check

      - name: Verify npm advisory closure
        run: |
          npm audit --workspaces=false --audit-level=high
          npm audit --workspace web --audit-level=high
          npm audit --workspace ui-tui --audit-level=high
          npm audit --workspace apps/desktop --audit-level=high

      - name: Package exact generated files
        run: |
          set -euo pipefail
          mkdir -p generated/apps/desktop/scripts
          cp .npmrc package.json package-lock.json uv.lock generated/
          cp apps/desktop/package.json generated/apps/desktop/package.json
          cp apps/desktop/scripts/packaged-app-layout.mjs generated/apps/desktop/scripts/
          cp apps/desktop/scripts/packaged-app-layout.test.mjs generated/apps/desktop/scripts/
          cp apps/desktop/scripts/test-desktop.mjs generated/apps/desktop/scripts/
          find generated -type f -print0 | sort -z | xargs -0 sha256sum > generated/SHA256SUMS

      - name: Upload exact-object generation artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-restack-${{ github.event.pull_request.head.sha || github.sha }}
          path: generated/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  finalize-on-fork:
    if: >-
      github.repository == 'andrexibiza/hermes-agent' &&
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'fix(deps): publish exact generated advisory graph')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact staging head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Use repository-authorized npm
        run: npm install --global npm@11.17.0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Generate and verify final dependency graph
        run: |
          set -euo pipefail
          python3 .github/scripts/restack_dependency_security.py apply
          npm install --package-lock-only --ignore-scripts --include=optional
          npm update nanoid --package-lock-only --ignore-scripts --include=optional
          uv lock --upgrade-package 'h2==4.4.1'
          python3 .github/scripts/restack_dependency_security.py verify
          node --test apps/desktop/scripts/packaged-app-layout.test.mjs
          uv lock --check
          git diff --check
          npm audit --workspaces=false --audit-level=high
          npm audit --workspace web --audit-level=high
          npm audit --workspace ui-tui --audit-level=high
          npm audit --workspace apps/desktop --audit-level=high

      - name: Publish generated bytes on exact upstream main
        env:
          STAGING_SHA: ${{ github.sha }}
          BRANCH: restack/pr89479-current-main
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/apps/desktop/scripts" "$tmp/.github/scripts" "$tmp/.github/workflows"
          cp .npmrc package.json package-lock.json uv.lock "$tmp/"
          cp apps/desktop/package.json "$tmp/apps/desktop/package.json"
          cp apps/desktop/scripts/packaged-app-layout.mjs "$tmp/apps/desktop/scripts/"
          cp apps/desktop/scripts/packaged-app-layout.test.mjs "$tmp/apps/desktop/scripts/"
          cp apps/desktop/scripts/test-desktop.mjs "$tmp/apps/desktop/scripts/"
          cp .github/scripts/restack_dependency_security.py "$tmp/.github/scripts/"
          cp .github/workflows/restack-dependency-security.yml "$tmp/.github/workflows/"

          git fetch https://github.com/NousResearch/hermes-agent.git main
          BASE_SHA="$(git rev-parse FETCH_HEAD)"
          git reset --hard "$BASE_SHA"

          cp "$tmp/.npmrc" .npmrc
          cp "$tmp/package.json" package.json
          cp "$tmp/package-lock.json" package-lock.json
          cp "$tmp/uv.lock" uv.lock
          mkdir -p apps/desktop/scripts .github/scripts .github/workflows
          cp "$tmp/apps/desktop/package.json" apps/desktop/package.json
          cp "$tmp/apps/desktop/scripts/packaged-app-layout.mjs" apps/desktop/scripts/packaged-app-layout.mjs
          cp "$tmp/apps/desktop/scripts/packaged-app-layout.test.mjs" apps/desktop/scripts/packaged-app-layout.test.mjs
          cp "$tmp/apps/desktop/scripts/test-desktop.mjs" apps/desktop/scripts/test-desktop.mjs
          cp "$tmp/.github/scripts/restack_dependency_security.py" .github/scripts/restack_dependency_security.py
          cp "$tmp/.github/workflows/restack-dependency-security.yml" .github/workflows/restack-dependency-security.yml

          git add -- .npmrc package.json package-lock.json uv.lock apps/desktop/package.json apps/desktop/scripts/packaged-app-layout.mjs apps/desktop/scripts/packaged-app-layout.test.mjs apps/desktop/scripts/test-desktop.mjs .github/scripts/restack_dependency_security.py .github/workflows/restack-dependency-security.yml
          git diff --cached --check
          git config user.name 'Axl Ibiza, MBA'
          git config user.email 'andrexibiza@gmail.com'
          git commit -m 'fix(deps): publish exact generated advisory graph' -m 'Restack the active Electron, Nano ID, and h2 advisory remediation on the exact upstream main object while preserving the React Compiler graph and source attribution.\n\nCo-authored-by: schmitzi8 <schmitzi8@users.noreply.github.com>\nCo-authored-by: orcaspainting-dev <264355715+orcaspainting-dev@users.noreply.github.com>'
          git push --force-with-lease="refs/heads/$BRANCH:$STAGING_SHA" origin "HEAD:refs/heads/$BRANCH"
