# .github/workflows/rust-tests.yml
name: Rust tests

# These jobs cover the repository's Rust crates. The native stream buffer is an
# optional gateway data-plane component; its Python control-plane smoke test runs
# after the release library is built. The bootstrap installer job below retains
# the platform-specific system dependency setup it needs.
#
# The native stream buffer job intentionally runs on Linux because the crate has
# no platform-specific dependencies. The Python gateway fallback remains the
# source-checkout and lean-install behavior when the optional library is absent.

on:
  workflow_call:
    inputs:
      commit:
        description: Commit to test and build. Empty keeps the triggering commit.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: rust-tests-${{ (github.ref_type == 'tag' || inputs.commit != '') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && inputs.commit == '' }}

jobs:
  native-stream-buffer:
    name: cargo test (native stream buffer)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: native/rust_stream_buffer
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.commit }}
      - name: cargo fmt
        run: cargo fmt -- --check
      - name: cargo test
        run: cargo test --locked
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: cargo build (release)
        run: cargo build --release --locked
      - name: Python native ABI smoke
        working-directory: .
        run: |
          python - <<'PY'
          from gateway.native_stream_buffer import StreamBuffer

          buffer = StreamBuffer(backend="rust")
          buffer.append("前缀")
          buffer.append(" + suffix")
          buffer.set_active("tail")
          assert buffer.active() == "tail"
          assert buffer.ledger() == "前缀 + suffix"
          buffer.clear()
          assert buffer.active() == ""
          assert buffer.ledger() == ""
          PY

  bootstrap-installer:
    name: cargo test (bootstrap installer)
    # cargo builds codegen units and test binaries in parallel across the
    # cores. This lane also builds the crate from the start when Cargo.toml
    # changes.
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/bootstrap-installer/src-tauri
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ inputs.commit }}

      # Tauri links against the system webkit2gtk on Linux, so the crate does
      # not compile without these even for `cargo test --lib`.
      - name: Install Tauri system dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      # Keyed on Cargo.toml, not Cargo.lock: apps/bootstrap-installer/.gitignore
      # excludes the lockfile (a create-tauri-app scaffold default), so there is
      # nothing pinned to hash and `--locked` cannot be used. That also means
      # this crate re-resolves its whole dependency graph on every build, which
      # is a real gap for a signed installer given the pinning policy in
      # AGENTS.md — tracking separately rather than widening this PR.
      #
      # No restore-keys: a partial hit leaves a stale target dir, and cargo
      # re-resolves correctly on top of a Cargo.toml-keyed hit anyway.
      - name: Restore cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/bootstrap-installer/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('apps/bootstrap-installer/src-tauri/Cargo.toml') }}

      # --lib only: the integration/bin targets would need a built frontend
      # (vite dist) that this lane deliberately does not produce.
      - name: cargo test
        run: cargo test --lib
