name: Sandbox desktop image

# The configured SANDBOX_IMAGE:desktop is the terminal-backend sandbox base
# (nikolaik/python-nodejs) plus a display stack; Bot Screen, computer_use and
# the bot's browser run inside it when terminal.backend is docker/ssh/etc.
# It contains NO Hermes code, so it does not need to track main.
#
# Triggers: a PR that edits the Dockerfile/smoke (build + smoke, no push),
# a successful Stable Release (publish :<tag>-desktop and roll :desktop), a
# weekly rebuild (roll :desktop from main's Dockerfile, so a Dockerfile change on
# main reaches users within a week, not at the next release), and manual dispatch.
# Deliberately NOT on every main push: two 4 GB multi-arch builds per commit.
# Its CVEs come from the floating base tag and the apt packages, so freshness
# is a rebuild on a clock, not a Dockerfile change: every publishing run
# builds without layer cache and re-pulls the base.

on:
  pull_request:
    paths:
      - docker/sandbox-desktop.Dockerfile
      - docker/sandbox-desktop-smoke.sh
      - .github/workflows/sandbox-image.yml
  # Not `release: published`: release automation creates releases with
  # GITHUB_TOKEN, which starts no workflows, so it has not fired since v0.21.7.
  workflow_run:
    workflows: ['Stable Release']
    types: [completed]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      publish:
        description: Push to Azure Container Registry (rolls :desktop)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Every Stable Release completion gets its own group: a skipped one can't replace a green
  # release's pending run, and a weekly or dispatch run can't replace a pending release run.
  # A release run may race a weekly one to move :desktop; both build main's Dockerfile.
  group: sandbox-image-${{ github.event.pull_request.number || (github.event_name == 'workflow_run' && github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ${{ vars.SANDBOX_IMAGE }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}

jobs:
  # PR code: secret-free build + smoke per arch.
  build:
    if: >-
      github.repository == 'unitalkai/unitalk-desktop' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-32vcpu-ubuntu-2404
            platform: linux/amd64
          - arch: arm64
            runner: blacksmith-32vcpu-ubuntu-2404-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184  # v2

      - name: Build (${{ matrix.arch }})
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850  # v2
        with:
          context: .
          file: docker/sandbox-desktop.Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}:test
          load: true
          # A publishing run starts fresh so it picks up base and apt fixes; publish normally
          # reuses these layers through the cache written below (a cache miss or a moved base
          # tag between the jobs means publish builds cold). `pull` matters once the builder
          # keeps state between runs.
          no-cache: ${{ github.event_name != 'pull_request' }}
          pull: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=sandbox-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=sandbox-{0}', matrix.arch) || '' }}

      # The contract: the launcher, cua-driver and a headed Chromium work as `pn`.
      - name: Smoke
        run: docker/sandbox-desktop-smoke.sh ${{ env.IMAGE_NAME }}:test

  # Trusted source only; the sole Azure Container Registry credential boundary.
  publish:
    # Every non-PR event publishes, except a dispatch without publish=true.
    if: github.repository == 'unitalkai/unitalk-desktop' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    needs: [build]
    environment: container-publish
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-32vcpu-ubuntu-2404
            platform: linux/amd64
          - arch: arm64
            runner: blacksmith-32vcpu-ubuntu-2404-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1

      - name: Set up Docker Buildx
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184  # v2

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_ACR_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Push ${{ matrix.arch }} by digest
        id: push
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850  # v2
        with:
          context: .
          file: docker/sandbox-desktop.Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=sandbox-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Registry-side stitch of the two digests into one tagged manifest list.
  merge:
    # Implicit success(): runs only when both publish legs pushed.
    needs: [publish]
    # GitHub-hosted with docker/setup-buildx-action, as before the runner migration: on
    # Blacksmith `imagetools create` cannot commit a manifest list reliably (404 on the
    # index commit, any buildx version): v0.22.3 rc.1-rc.4 died on it in the versioned manifest.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: container-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: sandbox-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_ACR_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          # Stable Release's run-name is "Stable release rc.<N>-v<version>" (claim_run_title in
          # scripts/releases/stable.py; the tag grammar is _ATTEMPT_REF_RE in
          # scripts/releases/versioning.py + STABLE_TAG_RE in hermes_cli/update_channel.py);
          # the release is v<version>.
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          args=()
          for digest_file in *; do
            args+=("${IMAGE_NAME}@sha256:${digest_file}")
          done
          if [ "${#args[@]}" -ne 2 ]; then
            echo "::error::want 2 digests, found ${#args[@]} (a publish leg failed)"
            exit 1
          fi
          # :desktop is the stable tag docker_image points at. A green Stable Release also gets
          # :v<version>-desktop, built from main's Dockerfile when that run completes, which can be
          # before the sequencer publishes the GitHub release.
          tags=(-t "${IMAGE_NAME}:desktop")
          if [ "${GITHUB_EVENT_NAME}" = workflow_run ]; then
            if [[ ! "${RUN_TITLE}" =~ ^Stable\ release\ rc\.[1-9][0-9]*-(v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
              echo "::error::no release tag in Stable Release run title: ${RUN_TITLE}"
              exit 1
            fi
            tags+=(-t "${IMAGE_NAME}:${BASH_REMATCH[1]}-desktop")
          fi
          for i in 1 2 3; do
            if docker buildx imagetools create "${tags[@]}" "${args[@]}"; then
              break
            fi
            if [ "$i" = 3 ]; then
              echo "::error::imagetools create failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done
          docker buildx imagetools inspect "${IMAGE_NAME}:desktop"
