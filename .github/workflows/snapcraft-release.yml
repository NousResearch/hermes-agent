name: Build & Publish Snapcraft

# Triggered on every new GitHub Release (tag push or manual release draft).
# Produces the official Hermes Desktop Snap and publishes it as a Release asset.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build (e.g. v0.17.0). Defaults to latest release."
        required: false
        type: string

permissions:
  contents: write    # to upload release assets
  packages: write

concurrency:
  group: snapcraft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-snap:
    name: Build Snapcraft (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # ── System deps for snapcraft ──────────────────────────────────────
      - name: Install Snapcraft
        uses: snapcore/action-install@b2ff61d1c7f3a9a3a5e3f0e8d8b3e5c7d1f2e4b6 # v1
        with:
          channel: latest/stable

      # ── Node / npm for Electron build ──────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm

      - name: Upgrade npm
        run: npm i -g npm@12

      - name: Install npm dependencies
        working-directory: apps/desktop
        run: npm ci

      # ── Build the Electron app (linux-unpacked) ────────────────────────
      - name: Build Electron app
        working-directory: apps/desktop
        run: npm run build

      # ── Stage Snapcraft payload ────────────────────────────────────────
      - name: Stage Snapcraft payload
        working-directory: apps/desktop
        run: node scripts/stage-snap.mjs

      # ── Build Snap ─────────────────────────────────────────────────────
      - name: Build Snap
        working-directory: apps/desktop
        run: snapcraft --destructive-mode

      # ── Verify the snap ────────────────────────────────────────────────
      - name: Verify Snap
        run: |
          snap info hermes-desktop_*.snap || true
          snap run --shell hermes-desktop_*.snap -c '
            echo "=== Snap metadata ===";
            echo "App binary:";
            test -x /snap/hermes-desktop/current/bin/hermes-desktop && echo "OK: bin/hermes-desktop exists" || exit 1;
            echo "Electron binary:";
            test -x /snap/hermes-desktop/current/share/hermes-desktop/Hermes && echo "OK: Hermes binary exists" || exit 1;
          ' || exit 1

      # ── Upload as Release asset ────────────────────────────────────────
      - name: Upload Snap to Release
        uses: softprops/action-gh-release@de6c8c82b0c67c1c7d4b1f04a9a7b0f4c6e8e5c1 # v2
        if: github.event_name == 'release'
        with:
          files: apps/desktop/hermes-desktop_*.snap
          name: Hermes Desktop Snap (Linux)
          body: |
            Official Hermes Desktop Snap for Linux.
            
            Install with:
            ```bash
            snap install --dangerous hermes-desktop_*.snap
            # or from Snap Store (once published):
            snap install hermes-desktop
            ```
            
            This Snap contains **only the Electron UI**. The Hermes CLI,
            gateway, plugins, and your `~/.hermes` configuration remain on your
            host system and are shared with the Snap automatically.

      # ── Also upload as workflow artifact (for manual inspection) ────────
      - name: Upload Snap artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-desktop-snap-${{ github.ref_name }}
          path: apps/desktop/hermes-desktop_*.snap
          retention-days: 30
          overwrite: true