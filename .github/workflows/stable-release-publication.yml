name: Stable Release Publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Green stable version to publish (for example 0.21.5)'
        required: false
        type: string
        default: ''
  # The success path publishes from Stable Release's own final job; only a
  # failed run needs this pass, which reruns its failed jobs immediately.
  workflow_run:
    workflows: ['Stable Release']
    types: [completed]

# Shared with Stable Release so publication never races a build. The requested
# rerun waits as pending behind this job instead of deadlocking it: the
# sequencer only confirms the new attempt is queued, never that it finished.
concurrency:
  group: stable-release
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: read
  pull-requests: read

jobs:
  reconcile:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion != 'success' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # imagetools needs no BuildKit, but it reads the current builder's buildkitd.toml
    # registry config. Not useblacksmith/setup-docker-builder: its no-cache-key fallback marks
    # docker.io `http = true`, Docker Hub 301s the plain-HTTP manifest PUT to HTTPS, Go replays
    # it as a GET, and the commit 404s (v0.22.3 rc.1-rc.4).
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: release-signing
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a  # v1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: node
          cache-python: false
      - name: Set up Docker Buildx for ordered alias promotion
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker  # no builder: imagetools then reads no registry config
      - name: Log in to Docker Hub for ordered alias promotion
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Reconcile stable drafts and protected heads
        # The macOS feed merge parses YAML (hermes_yaml -> ruamel); the node toolchain has none.
        run: python -m scripts.ci.python_packages ruamel.yaml==0.18.17 -- -m scripts.releases.sequencer
        env:
          GH_TOKEN: ${{ github.token }}
          UX_LEDGER_ISSUE: ${{ vars.UX_LEDGER_ISSUE || '157333' }}
          REQUESTED_VERSION: ${{ inputs.version || '' }}
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ vars.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ vars.CLOUDFLARE_R2_PUBLIC_URL }}
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_PRODUCT_ID: ${{ vars.MS_STORE_PRODUCT_ID }}
          # Repository variable; 'true' commits the draft held for Publish now.
          MS_STORE_HOLD: ${{ vars.MS_STORE_HOLD }}
