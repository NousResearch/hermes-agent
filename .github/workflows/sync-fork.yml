name: Sync fork with upstream

permissions:
  contents: write  # gh repo sync / git push writes to this fork's main

on:
  schedule:
    - cron: '0 12 * * 1' # every Monday 12:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git identity for merge commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fetch upstream and merge into fork main
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true
          echo "Fetching upstream/main..."
          git fetch upstream
          echo "Upstream HEAD: $(git rev-parse upstream/main)"
          echo "Current main: $(git rev-parse HEAD)"
          echo "Merging upstream/main into this fork's main..."
          git merge upstream/main --no-edit
          echo "Pushing merged main to origin..."
          git push origin main
          echo "Sync complete. Fork main is now at $(git rev-parse HEAD)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
