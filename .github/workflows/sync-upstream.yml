name: Sync upstream

# Keep this fork's main in step with NousResearch/hermes-agent.
# Manual-only while this fork is carrying a deliberate customization set. The
# v0.22 re-merge is a planned operation, not a weekly auto-merge.
#
# A clean manually-triggered merge pushes to main and starts the normal CI
# suite. A conflicted merge is reported in the Actions summary and aborted
# cleanly; it must not leave the runner in a merge state or manufacture a
# useless conflict PR.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.name "hermes-fork-sync[bot]"
          git config user.email "hermes-fork-sync[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main

      - name: Merge upstream main
        id: merge
        continue-on-error: true
        run: git merge --no-edit upstream/main

      - name: Push when clean
        if: steps.merge.outcome == 'success'
        run: git push origin main

      - name: Report and abort conflicted merge
        if: steps.merge.outcome == 'failure'
        run: |
          {
            echo "## Upstream sync requires manual resolution"
            echo
            echo "The merge was aborted; no files were pushed."
            echo
            echo "### Conflicted paths"
            git diff --name-only --diff-filter=U | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          git merge --abort
