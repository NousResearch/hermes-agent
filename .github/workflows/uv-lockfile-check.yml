name: uv.lock check

# Verify both Python lockfiles are in sync with their pyprojects. Blocking check — PRs
# that modify either pyproject without regenerating its uv.lock (or vice versa)
# must not merge, because the Docker build's `uv sync --frozen` step will
# fail on a stale lockfile and we'd rather catch it here than in the
# docker workflow on main.
#
# ─────────────────────────────────────────────────────────────────────────
# IMPORTANT: this check runs against the MERGED state, not just your branch
# ─────────────────────────────────────────────────────────────────────────
#
# For `pull_request` events, GitHub checks out `refs/pull/<N>/merge` by
# default — a synthetic commit that merges your PR branch into the CURRENT
# state of `main`.  That means the pyproject.toml evaluated here is
# `main's pyproject.toml + your PR's changes to pyproject.toml`, not just
# what's on your branch.
#
# Failure mode this creates: if `main` has advanced since you branched
# (e.g. someone merged a PR that added a dep to pyproject.toml + its
# corresponding uv.lock entries), your branch's uv.lock is missing those
# new entries.  `python -m pm.build_env --source . --check-lock` resolves against the merged pyproject
# and sees a lockfile that doesn't cover all the current deps → fails
# with "The lockfile at uv.lock needs to be updated."
#
# This can be confusing: `python -m pm.build_env --source . --check-lock` passes locally (your branch
# is internally consistent) but fails in CI (merged state isn't).
#
# Fix is to sync your branch with main and regenerate whichever lock failed:
#
#     git fetch origin main
#     git rebase origin/main      # or merge, whatever the repo prefers
#     hermes pm lock                     # root uv.lock
#     python -m pm.build_env --source pm --lock-only  # pm/uv.lock, when that check failed
#     git add uv.lock pm/uv.lock
#     git commit -m "chore: refresh Python lockfiles after rebase onto main"
#     git push --force-with-lease # if you rebased
#
# If only one pyproject changed, regenerate only its matching lockfile.
#
# This is the correct behavior!  The check is protecting main's Docker
# build: a post-merge build would see the same merged state and fail
# the same way.  Better to catch it here than after merge.

on:
  workflow_call:
    outputs:
      review_status:
        description: "JSON review status for the review-status aggregator"
        value: ${{ jobs.check.outputs.review_status }}

permissions:
  contents: read

concurrency:
  group: uv-lockfile-check-${{ github.ref_type == 'tag' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: root + PM runtime uv.lock freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      review_status: ${{ steps.verify.outputs.review_status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1

      - uses: ./.github/actions/setup-pm
        with:
          cache-python: true
          prune-python-cache: true

      # Each check re-resolves one project from its pyproject.toml and compares
      # the result to that project's uv.lock, exiting non-zero if they disagree.
      # No network writes, no file modifications.
      #
      # On PRs this runs against the merge commit (see comment at the top
      # of this file) — failures often mean "your branch is behind main,
      # rebase and regenerate uv.lock."
      - name: Verify Python lockfiles are up-to-date
        id: verify
        run: |
          # Each check re-resolves against PyPI (network). Retry so a
          # registry blip doesn't read as "lockfile stale". A genuinely stale
          # lockfile fails all attempts (deterministic), costing only seconds.
          #
          # Backoff rather than a flat 10s: three attempts inside ~20s all
          # land in the same blip. 5/15/45s spans ~65s instead.
          #
          # Network failure and a real desync are also reported differently.
          # uv says "Request failed after N retries" when it can't reach the
          # registry, versus "lockfile needs to be updated" when the lock is
          # genuinely stale. Only the second is the contributor's to fix, so
          # an unreachable registry says so instead of sending them to
          # `hermes pm lock` with nothing to regenerate.
          ok=false
          net_fail=false
          failed_lock=""
          delays=(5 15 45)
          for source in . pm; do
            lockfile="uv.lock"
            [ "$source" = "pm" ] && lockfile="pm/uv.lock"
            ok=false
            net_fail=false
            for i in 1 2 3; do
              echo "== Checking $lockfile =="
              if python -m pm.build_env --source "$source" --check-lock >lock-check.log 2>&1; then
                ok=true
                net_fail=false
                cat lock-check.log
                break
              fi
              cat lock-check.log
              if grep -qiE "Request failed after|Failed to fetch|error sending request|connection (reset|closed)|timed out" lock-check.log; then
                net_fail=true
              else
                # Deterministic failure (a real desync) — retrying just prints
                # the same error twice more.
                net_fail=false
                break
              fi
              [ "$i" = 3 ] && break
              echo "::warning::$lockfile check could not reach the registry (attempt $i); retrying in ${delays[$((i-1))]}s"
              sleep "${delays[$((i-1))]}"
            done
            if [ "$ok" != true ]; then
              failed_lock="$lockfile"
              break
            fi
          done
          if [ "$ok" != true ] && [ "$net_fail" = true ]; then
            echo "::error title=${failed_lock} check could not reach PyPI::Registry unreachable after 3 attempts — infrastructure failure, not a stale lockfile. Re-run the job."
            review_status='[{"source":"uv.lock check","results":[{"kind":"action_required","title":"Python lock check could not reach PyPI","summary":"A Python lock freshness check could not reach the package registry after 3 attempts. This is an infrastructure failure, not a stale lockfile.","how_to_fix":"Re-run the failed job. No lockfile change is needed."}]}]'
            echo "review_status=${review_status}" >> "$GITHUB_OUTPUT"
            echo "review_status=${review_status}" > review-status.json
            exit 1
          fi
          if [ "$ok" != true ]; then
            cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## ❌ A checked uv.lock is out of sync with its pyproject.toml

          **If this is a PR:** this check runs against the merged state
          (your branch + current `main`), not just your branch.  If
          the corresponding check passes locally, your branch is likely behind
          `main` — recent pyproject changes on `main` aren't reflected in
          the matching lockfile yet.

          To fix, sync with main and regenerate the lockfile:

          ```bash
          git fetch origin main
          git rebase origin/main   # or `git merge origin/main`
          hermes pm lock
          python -m pm.build_env --source pm --lock-only  # only when pm/uv.lock failed
          git add uv.lock pm/uv.lock
          git commit -m "chore: refresh Python lockfiles after syncing with main"
          git push --force-with-lease  # drop --force-with-lease if you merged
          ```

          **If only one pyproject changed:** regenerate only its matching lock.

          This check is blocking because frozen consumers intentionally trust
          committed locks. CI is therefore the owner that must reject stale root
          or PM-runtime lockfiles before they reach users.
          EOF
            echo "::error title=${failed_lock} out of sync::Regenerate the failing lock and commit it. If on a PR, sync with main first."
            review_status='[{"source":"uv.lock check","results":[{"kind":"action_required","title":"uv.lock out of sync","summary":"uv.lock is out of sync with pyproject.toml.","how_to_fix":"Run `hermes pm lock` locally and commit the result. If on a PR, sync with main first:\n```\ngit fetch origin main\ngit rebase origin/main\nhermes pm lock\ngit add uv.lock\ngit commit -m \"chore: refresh uv.lock\"\n```\n"}]}]'
            echo "review_status=${review_status}" >> "$GITHUB_OUTPUT"
            echo "review_status=${review_status}" > review-status.json
            exit 1
          fi
          review_status='[]'
          echo "review_status=${review_status}" >> "$GITHUB_OUTPUT"
          echo "review_status=${review_status}" > review-status.json

      - name: Upload review status artifact
        if: always() && steps.verify.outcome != 'skipped'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-status-uv-lockfile
          path: review-status.json
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore
