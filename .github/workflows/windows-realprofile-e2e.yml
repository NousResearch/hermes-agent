name: Windows real-profile live E2E

# ON-DEMAND ONLY (real-profile browsing, PR #95620 — Windows locked-DB copy).
#
# Proves on a REAL windows-latest runner that the real-profile snapshot copies
# Chrome's cookie/login SQLite DBs via the online-backup API while a running
# Chrome holds them with a Windows OS-level share lock — the exact "file in use
# by another application" failure the copy approach had to solve. This cannot be
# exercised on the Linux lanes (a Linux write-txn only reproduces SQLite's
# internal lock, not the Windows filesystem share lock).
#
# Fires only on pushes to this feature branch, so it costs nothing on normal
# PRs. This is a PROOF workflow — delete it (and the test) before/at merge; it
# must not land on main.

on:
  push:
    branches:
      - "feat/real-profile-cdp"

permissions:
  contents: read

concurrency:
  group: windows-realprofile-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-profile-e2e:
    name: real-profile locked-DB live E2E (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Google Chrome
        shell: pwsh
        run: choco install googlechrome --no-progress -y --ignore-checksums

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev

      - name: Run real-profile locked-DB live E2E
        shell: bash
        run: |
          set -uo pipefail
          uv run --no-sync python -m pytest \
            tests/hermes_cli/test_real_profile_windows_live.py \
            tests/hermes_cli/test_real_profile_windows_diag.py \
            -o addopts= -v -s -p no:cacheprovider
