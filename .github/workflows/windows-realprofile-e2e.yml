name: Windows real-profile live E2E

# ON-DEMAND PROOF (real-profile browsing, PR #95620 — Windows auto-close).
#
# Proves on a REAL windows-latest runner that consented auto-close makes
# real-profile browsing work with a running Chrome (terminates the locking
# process tree, lock releases, valid copy produced) and that the default
# (autoclose off) fails fast rather than hanging.
#
# PROOF workflow — reverted before merge; must not land on main. Per-sha
# concurrency + no cancel-in-progress so runs complete.

on:
  push:
    branches:
      - "feat/real-profile-cdp"

permissions:
  contents: read

concurrency:
  group: windows-realprofile-e2e-${{ github.sha }}
  cancel-in-progress: false

jobs:
  real-profile-e2e:
    name: real-profile auto-close live E2E (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Google Chrome
        shell: pwsh
        run: choco install googlechrome --no-progress -y --ignore-checksums

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev

      - name: Run real-profile auto-close live E2E
        shell: bash
        run: |
          set -uo pipefail
          uv run --no-sync python -m pytest \
            tests/hermes_cli/test_real_profile_windows_live.py \
            -o addopts= -v -s -p no:cacheprovider
