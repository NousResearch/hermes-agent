name: Windows venv-holder live E2E

# ON-DEMAND ONLY (fleet-update #91277, venv-holder consolidation work).
#
# Runs the live venv-holder E2E suite on a real windows-latest runner:
# spawns actual processes with realistic Hermes argv shapes and drives the
# REAL detection/classification/exemption code against the live process
# table — the coverage that cannot exist on the Linux lanes and that the
# maintainer cannot exercise locally before the work reaches main.
#
# Deliberately NOT wired to pull_request/main: it fires only on pushes to
# wine2e/** working branches, so it costs nothing on normal PRs. Delete or
# keep dormant after the venv-holder work lands.

on:
  push:
    branches:
      - "wine2e/**"

permissions:
  contents: read

concurrency:
  group: windows-venv-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  venv-holder-e2e:
    name: venv-holder live E2E (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra dev --extra messaging

      - name: Run venv-holder live E2E
        shell: bash
        run: |
          set -uo pipefail
          uv run --no-sync python -m pytest \
            tests/hermes_cli/test_venv_holder_windows_live.py \
            tests/hermes_cli/test_taskkill_identity_windows_live.py \
            tests/hermes_cli/test_git_trampoline_windows_live.py \
            "tests/hermes_cli/test_managed_uv.py::TestWindowsRuntimeSelfLock" \
            -o addopts= -v -p no:cacheprovider

      - name: Run Telegram CLOSE-WAIT reconnect live E2E (#87057)
        shell: bash
        run: |
          set -uo pipefail
          uv run --no-sync python -m pytest \
            tests/gateway/test_telegram_closewait_windows_live.py \
            -o addopts= -v -p no:cacheprovider

      - name: Run background-executor spawn parity live E2E (#70716)
        shell: bash
        run: |
          set -uo pipefail
          uv run --no-sync python -m pytest \
            tests/tools/test_process_registry_windows_live.py \
            -o addopts= -v -p no:cacheprovider

  desktop-build-e2e:
    name: desktop build live E2E (windows-latest)
    # Proves the Electron pin installs and packages on a real Windows host.
    #
    # e2e-desktop.yml runs on ubuntu only, so the failure class that produced the
    # 40.10.2 pin is invisible to every lane that fires on a PR: Electron
    # >= 40.10.3 unpacks via the NATIVE @electron-internal/extract-zip, whose
    # win32-x64 binding failed to dlopen (ERR_DLOPEN_FAILED loading
    # index.win32-x64-msvc.node) and broke the install at "Building desktop app".
    # A green Linux run is not evidence about that bug.
    #
    # Two details are load-bearing and must not be "optimised" away:
    #   * npm ci runs WITH scripts. Electron's postinstall is the code path under
    #     test; --ignore-scripts would skip the unpacker and pass while proving
    #     nothing.
    #   * node_modules is NOT restored from cache. A warm cache can mask a broken
    #     download/extract by reusing a previously-good dist.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      - name: grab npm 12
        run: npm i -g npm@12

      - name: Install dependencies (scripts enabled - exercises the unpacker)
        run: npm ci

      - name: Assert the Electron dist actually extracted
        shell: bash
        run: |
          set -uo pipefail
          # The dlopen failure leaves a staged package with no dist/, the exact
          # shape _electron_dist_ok() treats as not-ok. Fail here with a clear
          # message rather than deep inside electron-builder.
          for root in apps/desktop/node_modules node_modules; do
            if [ -f "$root/electron/dist/electron.exe" ]; then
              echo "electron dist present at $root/electron/dist/electron.exe"
              exit 0
            fi
          done
          echo "::error::Electron dist missing electron.exe - the postinstall unpack failed (see ERR_DLOPEN_FAILED)."
          ls -la apps/desktop/node_modules/electron node_modules/electron || true
          exit 1

      - name: Package the desktop app
        working-directory: apps/desktop
        run: npm run pack
        env:
          CI: 'true'

      - name: Assert a packaged executable exists
        shell: bash
        run: |
          set -uo pipefail
          if [ ! -f apps/desktop/release/win-unpacked/Hermes.exe ]; then
            echo "::error::pack completed but release/win-unpacked/Hermes.exe is missing."
            ls -la apps/desktop/release || true
            exit 1
          fi
          echo "packaged Hermes.exe present"
