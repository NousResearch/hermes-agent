model:
  default: minimax-m3
  provider: opencode-go
  base_url: https://opencode.ai/zen/go/v1
fallback_providers:
- provider: opencode-zen
  model: deepseek-v4-flash
  base_url: https://opencode.ai/zen/v1
- provider: opencode-go
  model: minimax-m3
  base_url: https://opencode.ai/zen/go/v1
- provider: nous
  model: stepfun/step-3.7-flash
  base_url: https://inference-api.nousresearch.com/v1
providers:
  openrouter:
    stale_timeout_seconds: 600
  nous:
    stale_timeout_seconds: 600
  custom:CommandCode:
    base_url: https://api.commandcode.ai/provider/v1
    api_key: ''
    request_timeout_seconds: 1800
    stale_timeout_seconds: 300
toolsets:
- hermes-cli
- kanban
- terminal
- file
agent:
  max_turns: 85
  reasoning_effort: low
kanban:
  # Only the base KENSEI gateway dispatches kanban (single-dispatcher rule:
  # concurrent dispatchers corrupt the shared kanban SQLite DBs). See
  # discord-bot-architecture skill. Drift to true caused the 2026-06-12 runaway.
  dispatch_in_gateway: false
cron:
  ticker_enabled: false
discord:
  require_mention: true
  free_response_channels: '1506022640035303494'
  allowed_channels: ''
  auto_thread: true
  reactions: true
  channel_prompts: {}
  extra:
    allow_bots: mentions
    gateway_restart_notification: false
approvals:
  destructive_slash_confirm: false
plugins:
  enabled:
  - kenseivoice
skills:
  always_skills:
  - content-pipeline
  - postiz-self-hosting
  - avoid-ai-writing
  - social-content
  - brand-voices
  - sahil-twitter-voice
  - sahil-linkedin-voice
  - plenishd-voice
  - coachos-voice
  - matchdaymaestro-voice
  - humanizer
  - ceecee-humanizer
  - ceecee-platform-content
  - content-review
  external_dirs:
  - /home/kensei/.hermes/skills
  enabled_skills:
  - kanban-worker
  - cron-output-contract
  - content-review
  - brand-voices
  - sahil-linkedin-voice
  - sahil-twitter-voice
  - sdlc-review
  - avoid-ai-writing
  - content-pipeline
  - postiz-self-hosting
  - social-content
  enforcement_mode: enforce
tts:
  provider: kenseivoice
  voice: pocket:eve
  speed: 1.3
