model:
  default: deepseek-v4-flash
  provider: ollama-cloud
  base_url: https://ollama.com/v1
fallback_providers:
- provider: ollama-cloud
  model: deepseek-v4-pro
  base_url: https://ollama.com/v1
- provider: ollama-cloud
  model: kimi-k2.6
  base_url: https://ollama.com/v1
- provider: ollama-cloud
  model: glm-5.1
  base_url: https://ollama.com/v1
- provider: openrouter
  model: google/gemma-4-31b-it:free
  base_url: https://openrouter.ai/api/v1
- provider: openrouter
  model: nvidia/nemotron-3-super-120b-a12b:free
  base_url: https://openrouter.ai/api/v1
toolsets:
- hermes-cli
- kanban
- browser
agent:
  max_turns: 85
  reasoning_effort: high
kanban:
  # Only the base KENSEI gateway dispatches kanban (single-dispatcher rule:
  # concurrent dispatchers corrupt the shared kanban SQLite DBs). See
  # discord-bot-architecture skill. Drift to true caused the 2026-06-12 runaway.
  dispatch_in_gateway: false
cron:
  ticker_enabled: false
discord:
  require_mention: true
  free_response_channels: '1507448572784939151'
  allowed_channels: ''
  auto_thread: true
  reactions: true
  channel_prompts: {}
  extra:
    allow_bots: mentions
    gateway_restart_notification: false
plugins:
  enabled:
  - kenseivoice
skills:
  always_skills:
  - kanban-worker
  - kanban-ops
  - systematic-debugging
  - requesting-code-review
  - code-security
  - release-quality-gates
  - dogfood
  - mobile-app-qa
  - sdlc-review
  - quan-output-validator
  - design-system-review
  external_dirs:
  - /home/kensei/.hermes/skills
  enabled_skills:
  - kanban-worker
  enforcement_mode: enforce
tts:
  provider: kenseivoice
  voice: kokoro:am_santa
  speed: 1.3
onboarding:
  seen:
    tool_progress_prompt: true
