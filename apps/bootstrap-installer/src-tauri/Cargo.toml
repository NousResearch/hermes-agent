[package]
name = "north-forge-setup"
version = "0.1.0"
description = "North Forge Setup — branded GUI that runs scripts/bootstrap-north-forge.ps1 for a checkout already on the drive"
authors = ["Kenneth C. Walker Jr."]
edition = "2021"
rust-version = "1.82"

# Rename the output binary so the distributed artifact is literally
# `North-Forge-Setup.exe` on disk — not `north-forge-setup.exe`. Tauri honors
# [[bin]] over [package].name for the produced executable name.
[[bin]]
name = "North-Forge-Setup"
path = "src/main.rs"

# The library holds all the logic so it can be unit-tested; main.rs is a
# 3-line shim. The name is referenced by src/main.rs only.
[lib]
name = "north_forge_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri runtime + plugins
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"

# Async + IO
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging — emitted to a file under HERMES_HOME/logs/ and (optionally) the
# webview console via Tauri's event channel.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Paths + utils
dirs = "5"
which = "6"
anyhow = "1"

[profile.release]
# A small signed installer is the goal. LTO + size-opt + single codegen unit.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
