<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/apple-touch-icon.png" />
    <title>Hermes</title>
    <script>
      // Pre-paint the themed background before the app bundle loads. Without
      // this, the first frame (which is what `ready-to-show` waits for) is the
      // UA-default white page, and the real theme only lands once the whole
      // module graph has executed — i.e. the "white flash" on every new
      // window. applyTheme() in src/themes/context.tsx keeps these keys fresh.
      //
      // OPAQUE WINDOWS ONLY. The `?win=` kinds Electron creates with
      // `transparent: true` already have a clear canvas, and pre-painting a
      // theme colour there does not prevent a flash, it IS the flash: an
      // opaque rectangle standing until that window's module graph executes.
      // The list is TRANSPARENT_WINDOWS in src/lib/transparent-windows.ts — keep the two in step.
      // `secondary` (a session window) and `browser` are opaque and DO want the
      // pre-paint.
      try {
        const win = new URLSearchParams(window.location.search).get('win')
        if (!win || ['hud', 'overlay', 'quick', 'wake'].indexOf(win) === -1) {
          let bg = localStorage.getItem('hermes-boot-background')
          let scheme = localStorage.getItem('hermes-boot-color-scheme')
          if (!bg) {
            const dark = window.matchMedia('(prefers-color-scheme: dark)').matches
            bg = dark ? '#111111' : '#f7f7f7'
            scheme = dark ? 'dark' : 'light'
          }
          document.documentElement.style.backgroundColor = bg
          // <body> paints over <html>, so the canvas colour alone does not
          // hold: publish the same colour for the rule below.
          document.documentElement.style.setProperty('--hermes-boot-background', bg)
          document.documentElement.dataset.hermesBootPaint = ''
          if (scheme === 'dark' || scheme === 'light') {
            document.documentElement.style.colorScheme = scheme
          }
        }
      } catch {
        // localStorage unavailable — keep UA defaults.
      }
    </script>
    <style>
      /* Companion to the boot script: <body> paints over the <html> canvas, and
         styles.css gives it `background: var(--ui-chat-surface-background)`,
         which resolves from the LIGHT `:root` seeds until applyTheme() sets the
         dark class and the inline seeds. That is the white flash — rgb(248,249,254),
         the full window, for as long as the module graph takes to execute.

         UNLAYERED ON PURPOSE: styles.css declares that body rule inside
         `@layer base`, and any unlayered rule outranks a layered one whatever
         the selectors or the source order, so this needs no !important and no
         specificity games.

         It retires itself the moment the real theme lands (applyTheme() sets
         data-hermes-mode in the same synchronous block as the seeds), and it
         never applies under window glass, whose <body> IS the single translucent
         painter. */
      html[data-hermes-boot-paint]:not([data-hermes-mode]):not([data-hermes-glass]) body {
        background: var(--hermes-boot-background);
      }
    </style>
  </head>
  <body>
    <div id="root" class="scrollbar-dt"></div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
