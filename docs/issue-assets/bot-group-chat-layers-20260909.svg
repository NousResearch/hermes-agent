<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1740" viewBox="0 0 1200 1740" role="img" aria-labelledby="title desc">
<title id="title">Bot Group Chats: seven layers, two Layer 7 carriers</title>
<desc id="desc">Field integration above seven source layers. Layer 7 separates passive history and unfinished-work preservation in PR 104601 from draft guarded recovery and participant emergency Stop in PR 105079. Activation and independent Stop review remain open. Layers 1 to 3 are on main.</desc>
<rect x="0" y="0" width="1200" height="1740" rx="0" fill="#f5f8f9" stroke="none"/>
<text x="60" y="80" font-family="DejaVu Sans,sans-serif" font-size="42" font-weight="700" text-anchor="start" fill="#242e36">Bot Group Chats, beyond Desktop</text>
<text x="60" y="124" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#58646e">Shared work. Real files. Pick up from another device.</text>
<rect x="60" y="164" width="1080" height="108" rx="16" fill="#26373e" stroke="none"/>
<text x="88" y="209" font-family="DejaVu Sans,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#ffffff">Try the integration build · #98307</text>
<text x="88" y="246" font-family="DejaVu Sans,sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#dce8e5">Layers 1–6 and passive preservation. Guarded recovery remains draft.</text>
