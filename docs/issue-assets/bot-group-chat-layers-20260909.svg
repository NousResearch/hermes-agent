<text x="204" y="370" font-family="DejaVu Sans,sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#242e36">Recovery after host loss</text>
<text x="204" y="407" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#58646e">Preserve the group first. Continue only through guarded recovery.</text>
