  t290: "/footer skakel die gateway-voetstuk op finale antwoorde aan of af, wat model, konteks % en cwd wys."
  t291: "/busy queue|steer|interrupt beheer wat Enter doen terwyl Hermes werk."
  t292: "/topic in Telegram-privaatgesprekke aktiveer gebruikerbestuurde multi-sessie-onderwerpmodus — /topic <id> herstel vorige sessies inlyn."
  t293: "/approve session|always voer 'n hangende gevaarlike opdrag met jou gekose vertrouensbereik uit; /deny verwerp dit."
  t294: "/restart herbegin die gateway ordelik nadat aktiewe lopies afgehandel is, en pieng dan die aanvraer wanneer dit weer op is."
  t295: "/kanban boards switch <slug> verander die aktiewe multiprojek-Kanban-bord van binne die klets."
  t296: "/reload herlaai ~/.hermes/.env in die lopende sessie — neem nuwe API-sleutels op sonder om te herbegin."
  t297: "cronjob met no_agent=True voer 'n skrip volgens skedule uit en stuur sy stdout direk — nul tokens, nul LLM."
  t298: "'n Leë cron-skrip-stdout beteken 'n stille tik — niks word afgelewer nie, perfek vir drempel-waghonde."
  t299: "HERMES_CRON_MAX_PARALLEL (verstek 4) beperk hoeveel cron-take per tik loop sodat sarsies nie jou sleutels versadig nie."
  t300: "Gateway-hooks woon onder ~/.hermes/hooks/<name>/ met HOOK.yaml + handler.py — die hanteerder moet `handle` genoem word."
  t301: "Hook-gebeurtenisse sluit gateway:startup, session:start, agent:step en command:*-wildcard-intekeninge in."
  t302: "Plaas 'n ~/.hermes/BOOT.md-kontrolelys en 'n gateway:startup-hook voer dit by elke opstart as 'n eenmalige agent uit."
  t303: "hermes curator run --dry-run wys vooraf wat die kurator sou argiveer of konsolideer sonder om iets te verander."
  t304: "hermes curator pin <skill> beskerm 'n vaardigheid hard teen beide outo-argivering en die agent se skill_manage-gereedskap."
  t305: "hermes curator rollback herstel vaardighede vanaf 'n momentopname van voor die lopie — rugsteune woon onder skills/.curator_backups/."
  t306: "hermes auth reset <provider> [target] vee afkoeltye en uitputtingsvlae op 'n hele geloofsbriewe-poel uit, of op een geloofsbrief volgens indeks, id of etiket."
  t307: "credential_pool_strategies.<provider>: round_robin roteer sleutels eweredig in plaas van die fill_first-verstek."
  t308: "use_gateway: true per gereedskap stuur web, image, tts of browser deur jou Nous-subskripsie — geen ekstra sleutels nodig nie."
  t309: "provider_routing.data_collection: deny sluit verskaffers op OpenRouter uit wat data stoor."
  t310: "provider_routing.require_parameters: true stuur net na verskaffers wat elke parameter in jou versoek ondersteun."
  t311: "HERMES_TUI_RESUME=1 herkoppel by die begin outomaties aan die mees onlangse TUI-sessie — handig nadat SSH afgebreek het."
  t312: "HERMES_TUI_THEME=light|dark|<hex> forseer die TUI-tema op terminale wat nie COLORFGBG stel nie."
  t313: "Ctrl+G of Ctrl+X Ctrl+E in die TUI maak die invoerbuffer in $EDITOR oop vir lang meerreël-prompte."
  t314: "Die TUI teken LaTeX inlyn — $E=mc^2$ word Unicode-wiskunde in plaas van rou TeX."
  t315: "hermes dashboard begin 'n plaaslike web-UI by 127.0.0.1:9119 — nul data verlaat localhost."
  t316: "hermes dashboard bed die volle Hermes TUI in jou blaaier in via xterm.js en 'n WebSocket-PTY."
  t317: "Plaas 'n YAML in ~/.hermes/dashboard-themes/ met twee paletkleure om die hele dashboard te herklee."
  t318: "Dashboard-plugins is inprop-klaar: manifest.json + JS-bundel in ~/.hermes/dashboard-plugins/ — geen npm-bou nodig nie."
  t319: "layoutVariant: cockpit in 'n dashboard-tema voeg 'n linkerbalk van 260px by wat plugins via die sidebar-gleuf kan vul."
  t320: "display.tool_progress_command: true stel /verbose op boodskapplatforms beskikbaar; dit is by verstek slegs vir die CLI."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result pieng slegs wanneer agtergrondtake klaar is (teenoor concise/all/error/off)."
  t322: "HERMES_WRITE_SAFE_ROOT beperk write_file/patch tot gidsvoorvoegsels; verskeie paaie via os.pathsep (: of ;)."
  t323: "HERMES_IGNORE_RULES slaan die outo-inspuiting van AGENTS.md, SOUL.md, .cursorrules, geheue en voorafgelaaide vaardighede oor."
  t324: "HERMES_ACCEPT_HOOKS keur ongesiene shell-hooks wat in config.yaml verklaar is outomaties goed sonder 'n TTY-prompt."
  t325: "auxiliary.goal_judge.model stuur die /goal-beoordelaar na 'n goedkoop, vinnige model om die luskoste naby nul te hou."
  t326: "Kontrolepunte slaan gidse met meer as 50 000 lêers oor om stadige git-bewerkings op reuse-monorepo's te vermy."
  t327: "tts.provider: piper voer plaaslike TTS in 44 tale op die SVE uit — stemme laai outomaties af na ~/.hermes/cache/piper-voices/."
  t328: "tts.providers.<name>.type: command koppel enige CLI-TTS-enjin met {input_path}- en {output_path}-plekhouers."
  t329: "API_SERVER_ENABLED=true laat 'n OpenAI-versoenbare eindpunt saam met die gateway loop vir Open WebUI en LibreChat."
  t330: "GATEWAY_PROXY_URL laat 'n verdeelde opstelling loop: platform-I/O plaaslik, agentwerk gedelegeer na 'n afgeleë API-bediener."
  t331: "MATRIX_DEVICE_ID vaspen 'n stabiele toestel-ID vir E2EE — daarsonder roteer sleutels by elke begin en breek historiese ontsyfering."
  t332: "TELEGRAM_WEBHOOK_SECRET is verpligtend wanneer TELEGRAM_WEBHOOK_URL gestel is — genereer dit met openssl rand -hex 32."
  t333: "batch_runner.py --resume pas voltooide prompte volgens teksinhoud sodat herrangskikking van die datastel nie klaar werk weer laat loop nie."
  t334: "/new begin 'n vars sessie in plek (alias /reset) — nuwe sessie-ID, skoon geskiedenis, die CLI bly oop."
  t335: "/clear vee die terminaalskerm skoon EN begin 'n nuwe sessie — een kortpad vir 'n visuele herstel."
  t336: "/history druk die huidige gesprek inlyn sonder om die CLI te verlaat — handig om vinnig weer te lees."
  t337: "/save skryf die huidige gesprek na skyf sonder om die sessie te beëindig."
  t338: "/status wys sessie-inligting met een oogopslag: ID, titel, model, tokengebruik en verstreke tyd."
  t339: "/image <path> heg 'n plaaslike beeldlêer aan jou volgende prompt sonder plak of sleep-en-los."
  t340: "/platforms wys die verbindingsstatus van die gateway en boodskapplatforms direk van binne die klets."
  t341: "/commands blaai deur die volledige lys van slash-opdragte + geïnstalleerde vaardighede — handig op platforms sonder tab-voltooiing."
  t342: "/toolsets lys elke beskikbare gereedskapstel sodat jy weet wat -t/--toolsets aanvaar."
  t343: "/voice tts skakel slegs-TTS-modus aan of af — die agent antwoord hardop, maar jy tik steeds jou prompte."
  t344: "/reload-skills skandeer ~/.hermes/skills/ weer sodat inprop-vaardighede verskyn sonder om die sessie te herbegin."
  t345: "/indicator kaomoji|emoji|unicode|ascii kies die styl van die TUI-besig-aanwyser wat tydens agent-lopies gewys word."
  t346: "/debug laai 'n ondersteuningsbundel (stelselinligting + logs) op en gee deelbare skakels terug — werk ook in die klets."
  t347: "hermes -z \"<prompt>\" is die suiwerste eenmalige lopie: finale antwoord op stdout, niks anders nie — ideaal om in skripte te pyp."
  t348: "hermes chat --pass-session-id spuit die sessie-ID in die stelselprompt in sodat die agent daarna kan verwys."
  t349: "hermes chat --image path/to/pic.png heg 'n plaaslike beeld aan 'n enkele -q-navraag sonder 'n aparte oplaaistap."
  t350: "hermes chat --ignore-user-config slaan die aktiewe gebruikerskonfigurasie oor — reproduseerbare foutverslae en CI-lopies."
  t351: "hermes chat --source tool merk programmatiese kletse sodat hulle nie hermes sessions list deurmekaar maak nie."
  t352: "hermes dump --show-keys sluit geredigeerde API-sleutel-vingerafdrukke in vir dieper ondersteuningsontfouting."
  t353: "hermes sessions rename <ID> \"nuwe titel\" hernoem enige vorige sessie; hermes sessions delete <ID> verwyder een."
  t354: "hermes import herstel 'n volledige Hermes-rugsteun-zip; sessie-JSON/JSONL-uitvoere word via die dashboard se Sessions-bladsy ingevoer."
  t355: "hermes fallback bestuur die fallback_model-ketting interaktief — geen handmatige wysiging van config.yaml nodig nie."
  t356: "hermes pairing roteer die DM-paringstoken — die eerste persoon wat na rotasie 'n boodskap stuur, kry toegang tot die bot."
  t357: "hermes setup lei eerstekeergebruikers deur verskaffer, sleutels en platformkoppeling in een interaktiewe vloei."
  t358: "hermes status --deep voer die volle gesondheidskontrole oor elke komponent uit; gewone hermes status is die vinnige oorsig."
  t359: "HERMES_AGENT_TIMEOUT=0 skakel die gateway se onaktiwiteitsbeëindiging vir 'n lopende agent af — gebruik dit vir lang navorsingslopies."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 laai bewaarplek-plaaslike plugins outomaties vanaf ./.hermes/plugins/ — met opset vertrouensbeheer."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 skakel die 'lêer het verander sedert jy dit gelees het'-wag op patch en write_file af."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true laat webgereedskap localhost en private netwerke bereik — by verstek af in gateway-modus."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 installeer by die eerste lopie outomaties ekstra vaardighede uit die opsionele katalogus per profiel."
  t364: "HERMES_BUNDLED_SKILLS wys na 'n eie saamgebundelde vaardigheidsboom — gebruik deur Homebrew- en Nix-verpakking."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 stort elke API-versoek se inhoud na stdout in plaas van loglêers."
  t366: "HERMES_OAUTH_TRACE=1 log geredigeerde OAuth-token-uitruilings en -hernuwingspogings vir die ontfouting van verskaffer-verifikasie."
  t367: "HERMES_STREAM_RETRIES (verstek 3) beheer herverbindingspogings middel in 'n stroom by verbygaande netwerkfoute."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false onderdruk die ⚡/⏳/⏩-bevestigingsboodskappe wanneer 'n gebruiker 'n besige agent boodskap."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (verstek 180s) stel hoe gereeld die gateway vordering op lang beurte pieng."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (verstek 900s) beperk hoe lank /restart vir lopende lopies wag voordat dit forseer."
  t371: "HERMES_CHECKPOINT_TIMEOUT (verstek 30s) beperk die skep van lêerstelsel-kontrolepunte — verhoog dit op reuse-monorepo's."
  t372: "image_gen.model in config.yaml kies die FAL-model: flux-2/klein, gpt-image-2, nano-banana-pro en meer."
  t373: "image_gen.provider stuur beeldgenerering deur 'n plugin (OpenAI Images, Codex, FAL) in plaas van die verstek."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY rig visie-ontleding op enige OpenAI-versoenbare eindpunt."
  t375: "security.tirith_fail_open: false laat Hermes opdragte blokkeer wanneer die tirith-skandeerder self 'n fout gee."
  t376: "Die TIRITH_FAIL_OPEN-omgewingsveranderlike oorskry die tirith_fail_open-konfigurasie — 'n vinnige skakelaar sonder om config.yaml te wysig."
  t377: "--source tool-kletse word by verstek uit hermes sessions list uitgesluit — stel --source eksplisiet om hulle te sien."
  t378: "Sessie-ID's het 'n tydstempel-voorvoegsel (20250305_091523_abcd) sodat sortering natuurlik werk in ls en jq."
  t379: "API_SERVER_MODEL_NAME pas die modelnaam op /v1/models aan — noodsaaklik vir Open WebUI-opstellings met verskeie profiele."
  t380: "Dashboard-plugins word vanaf /dashboard-plugins/<name>/ bedien — plaas lêers in ~/.hermes/dashboard-plugins/."
  placeholder:
    p01: "Vra enigiets, of tik / vir opdragte…"
    p02: "Som op wat in hierdie vouer is"
    p03: "Skryf 'n konsepantwoord op die laaste e-pos in my inkassie"
    p04: "Plan 'n funksie en bou dit dan stap vir stap"
    p05: "Vind en herstel 'n toets wat misluk"
    p06: "Ondersoek hierdie onderwerp en skryf 'n kort oorsig"
    p07: "Wat het onlangs in hierdie bewaarplek verander?"
    p08: "Maak van hierdie notas 'n takelys"
    p09: "Verduidelik hierdie fout en hoe om dit reg te maak"
    p10: "Stel 'n herinnering of skeduleer 'n herhalende taak"
    p11: "Tik / om deur opdragte te blaai, of Ctrl+P vir die palet"
