  t287: "/copy [N] kopieer die laaste assistent-antwoord na jou knipbord, of die N-de van agter af met 'n nommer."
  t288: "/redraw forseer 'n volledige UI-herteken, wat terminaaldrywing na 'n tmux-grootteverandering of muiskeuse-artefakte herstel."
