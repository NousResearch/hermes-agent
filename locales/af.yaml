explainer:
  no_reply_prefix: "⚠️ Geen antwoord: "
  empty_response: "{model} het hierdie keer geen antwoord gelewer nie, selfs na herpogings. Stuur `continue` om weer te probeer, of verander modelle met /model."
  exit:
    all_retries_exhausted_no_response: "die modelverskaffer het na al die herpogings nie geantwoord nie. Stuur /retry, of verander modelle met /model."
    partial_stream_recovery: "die stroom het vroeg gestop en slegs 'n gedeeltelike antwoord is herwin. Stuur `continue` om voort te gaan waar dit gestop het."
    fallback_prior_turn_content: "geen nuwe inhoud is in hierdie beurt gelewer nie; herwinde vorige konteks word gewys. Stuur `continue` om weer te probeer."
    redirect_restart_limit_exceeded: "die versoek is by elke poging deur 'n nuwe korreksie gekanselleer, so die beurt het gestop in plaas van om eindeloos te herprobeer. Jou laaste korreksie is as die volgende boodskap in die tou geplaas."
    rebuilt_restart_limit_exceeded: "elke verskaffer in die terugvalketting het bly oorskakel, so die beurt het gestop in plaas van om eindeloos te herprobeer. Stuur `continue` of verander verskaffer."
    budget_exhausted: "die iterasie-/kostebegroting per beurt is opgebruik voor 'n finale antwoord. Stuur `continue` om voort te gaan."
    ollama_runtime_context_too_small: "die plaaslike model se konteksvenster was te klein om klaar te maak. Vergroot die konteksgrootte of gebruik 'n groter model."
    pending_tool_result: "die beurt het gestop terwyl 'n gereedskapsresultaat nog hangende was en die model geen opvolgteks gelewer het nie. Stuur `continue` om dit te laat opsom."
    interrupted_during_api_call: "die versoek is middel in die oproep onderbreek voordat 'n antwoord ontvang is. Stuur `continue` om weer te probeer."
    max_iterations_reached: "die maksimum gereedskapsiterasie-limiet is bereik voor 'n finale antwoord. Stuur `continue` om voort te gaan, of verhoog `max_iterations`."
    error_near_max_iterations: "'n fout het naby die iterasielimiet voorgekom voor 'n finale antwoord. Kyk na die gereedskapsuitvoer hierbo en stuur dan `continue`."
    repeated_outer_errors: "die beurt het met herhaalde foute bly misluk en is vroeg gestop in plaas van om eindeloos te herprobeer. Kyk na die foute hierbo en stuur dan `continue` om weer te probeer."
  persistence:
    compression: "die beurt is gestop omdat 'n ander proses hierdie sessie besig was om saam te pers. Jou boodskap behoort reeds gestoor te wees — stuur dit asseblief weer nadat die kompressie voltooi is."
    compression_closed: "die beurt is gestop omdat hierdie sessie deur kontekskompressie geroteer is en sy lewendige voortsetting nie oorgeneem kon word nie. Die berging self is gesond — verfris die kliënt (of begin 'n nuwe beurt) sodat dit die nuwe sessie-ID oppik, en stuur dan jou boodskap weer."
    turn_lease: "die beurt is gestop omdat 'n ander Hermes-proses hierdie sessie oorgeneem het. Jou antwoord is nie gestoor nie — wag totdat die ander proses klaar is, en stuur dan jou boodskap weer."
    session_row_missing: "hierdie sessie is uit die berging verwyder terwyl die klets nog oop was, en Hermes kon dit nie herskep nie, so hierdie boodskap is nie gestoor nie. Stuur jou boodskap weer; as dit bly misluk, voer `hermes {profile_arg}doctor` uit."
    locked: "die beurt is gestop omdat die sessieberging besig was ('n ander Hermes-proses het na die toestand-databasis geskryf). Jou boodskap behoort reeds gestoor te wees — stuur dit asseblief oor 'n oomblik weer."
    replaced: "die sessie-databasislêer is vervang terwyl Hermes geloop het, so hierdie boodskap is nie gestoor nie ('n kopie word in {home}/sessions/ bewaar). Stop Hermes (`hermes {profile_arg}gateway stop`), voer `hermes {profile_arg}doctor` uit — nie `hermes {profile_arg}doctor --fix` nie, wat die verkeerde lêer in plek sou herstel — begin dit dan weer en stuur jou boodskap nog 'n keer. Gevorderde herstelstappe is in die log."
    deleted_wal: "'n ander Hermes-proses hou steeds 'n ou kopie van die sessie-databasis se write-ahead log vas, so Hermes het opgehou skryf om die lêer veilig te hou en hierdie boodskap is nie gestoor nie ('n kopie word in {home}/sessions/ bewaar). Niks is verlore nie. Sluit elke Hermes-proses op hierdie profiel af (Desktop-toep, `hermes {profile_arg}gateway stop`, dashboard, cron), voer `hermes {profile_arg}doctor` uit — dit noem enige proses wat die log nog vashou — begin Hermes dan weer en stuur jou boodskap nog 'n keer. Voer nie `doctor --fix` uit en vee geen state.db-lêers uit terwyl hulle loop nie. Gids: {recovery_docs}"
    corrupt: "die beurt is gestop omdat die toestand-databasis strukturele korrupsie gerapporteer het (die transkripsie sou by herbegin verlore gegaan het). Om skyfspasie vry te maak sal nie help nie. Herstelopsies:\n1. Voer `hermes {profile_arg}doctor --fix` uit\n2. Stop die gateway en herstel dan met:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (as dit herwinbaar rapporteer) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — herstel neem eers 'n momentopname van die beskadigde lêer; voer NIE `sqlite3 ... \".recover\"` teen die lewendige state.db uit nie, 'n kwesbare sqlite3-CLI kan dit verder beskadig\n3. Herstel vanaf 'n rugsteun in {backups_dir}/\nStuur dan jou boodskap weer."
    fts_index: "die beurt is gestop omdat die sessie-soekindeks (FTS5) korrup is en nie losgemaak kon word nie, so hierdie boodskap is nie gestoor nie. Die boodskapberging self is nie beskadig nie: voer geen herstelgereedskap uit en herstel geen rugsteun nie. Voer `hermes {profile_arg}doctor --fix` uit (of herbegin Hermes, wat die indeks by opening herstel), en stuur dan jou boodskap weer."
    disk: "Hermes kon hierdie gesprek nie na skyf stoor nie, so dit het eerder gestop as om jou boodskappe te verloor. Die skyf is waarskynlik vol: maak spasie vry (of herstel die toestemmings op {home}/state.db), en stuur dan jou boodskap weer."
    default: "Hermes kon hierdie gesprek nie stoor nie, so dit het eerder gestop as om jou boodskappe te verloor. Moontlike oorsake: die skyf is vol, of 'n ander Hermes-proses hou die databasis vas. Sluit ander Hermes-vensters, voer `hermes {profile_arg}doctor` uit om die berging na te gaan, en stuur dan jou boodskap weer."
  file_mutation:
    header: "⚠️ Lêerwysiging-verifieerder: {count} lêerwysiging(s) het in hierdie beurt MISLUK, ongeag enige bewoording hierbo wat anders mag suggereer. Voer `git status` of `read_file` uit om te bevestig wat werklik geland het."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "misluk"
  shared:
    and_more: "  • … en nog {count}"
    the_model: "Die model"
tips:
  t001: "/bg <prompt> voer 'n taak in 'n aparte sessie uit terwyl jou huidige een vry bly; /btw <question> beantwoord 'n newevraag oor hierdie gesprek sonder om dit te onderbreek."
  t002: "/branch vertak die huidige sessie sodat jy 'n ander rigting kan verken sonder om vordering te verloor."
  t003: "/compress pers die gesprekskonteks met die hand saam wanneer dinge lank word."
  t004: "/rollback lys lêerstelsel-kontrolepunte — herstel lêers wat die agent gewysig het na enige vorige toestand."
  t005: "/rollback diff 2 wys vooraf wat sedert kontrolepunt 2 verander het sonder om iets te herstel."
  t006: "/rollback 2 src/file.py herstel 'n enkele lêer vanaf 'n spesifieke kontrolepunt."
  t007: "/title \"my projek\" gee jou sessie 'n naam — hervat dit later met /resume of hermes -c."
  t008: "/resume gaan voort waar jy in 'n voorheen benoemde sessie opgehou het."
  t009: "/queue <prompt> plaas 'n boodskap in die tou vir die volgende beurt sonder om die huidige een te onderbreek."
  t010: "/undo verwyder die laaste gebruiker/assistent-uitruiling uit die gesprek."
  t011: "/retry stuur jou laaste boodskap weer — handig wanneer die agent se antwoord nie heeltemal reg was nie."
  t012: "/verbose wissel die vertoon van gereedskapsvordering: off → new → all → verbose."
  t013: "/reasoning high verhoog die model se denkdiepte. /reasoning show vertoon die redenering."
  t014: "/fast skakel prioriteitsverwerking aan of af vir vinniger API-antwoorde (afhangend van die verskaffer)."
  t015: "/yolo slaan alle goedkeuringsprompte vir gevaarlike opdragte oor vir die res van die sessie."
  t016: "/model laat jou modelle middel in 'n sessie verander — probeer /model sonnet of /model gpt-5."
  t017: "/model --global verander jou verstekmodel permanent."
  t018: "/personality pirate stel 'n prettige persoonlikheid in — 14 ingeboude opsies van kawaii tot shakespeare."
  t019: "/skin verander die CLI-tema — probeer ares, mono, slate, poseidon of charizard."
  t020: "/statusbar skakel 'n permanente balk aan of af wat model, tokens, konteksvulling %, koste en duur wys."
  t021: "/tools disable browser verwyder blaaiergereedskap tydelik vir die huidige sessie."
  t022: "/browser connect koppel blaaiergereedskap via CDP aan jou lopende Chromium-familie-blaaier."
  t023: "/plugins lys geïnstalleerde plugins en hul status."
  t024: "/cron bestuur geskeduleerde take — stel herhalende prompte op met aflewering na enige platform."
  t025: "/reload-mcp herlaai die MCP-bedienerkonfigurasie sonder om te herbegin."
  t026: "/usage wys tokengebruik, kosteverdeling en sessieduur."
  t027: "/insights wys gebruiksanalise vir die laaste 30 dae."
  t028: "/paste kyk of daar 'n beeld op jou knipbord is en heg dit aan jou volgende boodskap."
  t029: "/profile wys watter profiel aktief is en sy tuisgids."
  t030: "/config wys jou huidige konfigurasie met een oogopslag."
  t031: "/stop maak alle lopende agtergrondprosesse dood wat die agent begin het."
  t032: "@file:path/to/file.py voeg lêerinhoud direk in jou boodskap in."
  t033: "@file:main.py:10-50 voeg net reëls 10-50 van 'n lêer in."
  t034: "@folder:src/ voeg 'n gidsboom-lys in."
  t035: "@diff voeg jou ongestaagde git-veranderinge in die boodskap in."
  t036: "@staged voeg jou gestaagde git-veranderinge in (git diff --staged)."
  t037: "@git:5 voeg die laaste 5 commits met volledige patches in."
  t038: "@url:https://example.com haal 'n webblad se inhoud af en voeg dit in."
  t039: "Om @ te tik aktiveer lêerstelsel-padvoltooiing — navigeer interaktief na enige lêer."
  t040: "Kombineer verskeie verwysings: \"Hersien @file:main.py en @file:test.py vir konsekwentheid.\""
  t041: "Alt+Enter voeg 'n nuwe reël in vir meerreël-invoer. (Windows Terminal onderskep Alt+Enter — gebruik eerder Ctrl+Enter.)"
  t042: "Ctrl+C onderbreek die agent. Druk twee keer binne 2 sekondes om uitgang te forseer."
  t043: "Ctrl+Z skuif Hermes na die agtergrond — voer fg in jou shell uit om voort te gaan."
  t044: "Tab aanvaar die outo-voorstel se skimteks of voltooi slash-opdragte outomaties."
  t045: "Tik 'n nuwe boodskap terwyl die agent werk om dit te onderbreek en te herlei."
  t046: "Alt+V plak 'n beeld vanaf jou knipbord in die gesprek."
  t047: "Om 5+ reëls te plak stoor dit outomaties in 'n lêer en voeg eerder 'n kompakte verwysing in."
  t048: "hermes -c hervat jou mees onlangse CLI-sessie. hermes -c \"projeknaam\" hervat volgens titel."
  t049: "hermes -w skep 'n geïsoleerde git-worktree — perfek vir parallelle agent-werkvloeie."
  t050: "hermes -w -q \"Fix issue #42\" kombineer worktree-isolasie met 'n eenmalige navraag."
  t051: "hermes chat -t web,terminal aktiveer net spesifieke gereedskapstelle vir 'n gefokusde sessie."
  t052: "hermes chat -s github-pr-workflow laai 'n vaardigheid vooraf by die begin."
  t053: "hermes chat -q \"query\" voer 'n enkele nie-interaktiewe navraag uit en sluit af."
  t054: "hermes chat --max-turns 1000 oorskry die verstek-limiet van 500 iterasies per beurt."
  t055: "hermes chat --checkpoints aktiveer lêerstelsel-momentopnames voor elke vernietigende lêerverandering."
  t056: "hermes --yolo omseil alle goedkeuringsprompte vir gevaarlike opdragte vir die hele sessie."
  t057: "hermes chat --source telegram merk die sessie sodat jy dit in hermes sessions list kan filter."
  t058: "hermes -p work chat loop onder 'n spesifieke profiel sonder om jou verstek te verander."
  t059: "hermes doctor --fix diagnoseer en herstel konfigurasie- en afhanklikheidsprobleme outomaties."
  t060: "hermes dump lewer 'n kompakte opstellingsopsomming — ideaal vir foutverslae."
  t061: "hermes config set KEY VALUE stuur geheime outomaties na .env en alles anders na config.yaml."
  t062: "hermes config edit maak config.yaml in jou verstek-redigeerder oop."
  t063: "hermes config check soek na ontbrekende of verouderde konfigurasie-opsies."
  t064: "hermes sessions browse maak 'n interaktiewe sessiekieser met soekfunksie oop."
  t065: "hermes sessions stats wys sessietellings per platform en die databasisgrootte."
  t066: "hermes sessions prune --older-than 30 ruim ou sessies op."
  t067: "hermes skills search react --source skills-sh deursoek die openbare skills.sh-gids."
  t068: "hermes skills check kyk of geïnstalleerde hub-vaardighede stroomop-opdaterings het."
  t069: "hermes skills tap add myorg/skills-repo voeg 'n eie GitHub-vaardigheidsbron by."
  t070: "hermes skills snapshot export setup.json voer jou vaardigheidskonfigurasie uit vir rugsteun of deel."
  t071: "hermes mcp add github --command npx voeg MCP-bedieners vanaf die opdraglyn by."
  t072: "hermes mcp serve laat Hermes self as 'n MCP-bediener vir ander agente loop."
  t073: "hermes auth add laat jou verskeie API-sleutels byvoeg vir rotasie van die geloofsbriewe-poel."
  t074: "hermes completion bash >> ~/.bashrc aktiveer tab-voltooiing vir alle opdragte en profiele."
  t075: "hermes logs -f volg agent.log intyds. --level WARNING --since 1h filter die uitvoer."
  t076: "hermes backup skep 'n zip-rugsteun van jou hele Hermes-tuisgids."
  t077: "hermes profile create coder skep 'n geïsoleerde profiel wat sy eie opdrag word."
  t078: "hermes profile create work --clone kopieer jou huidige konfigurasie en sleutels na 'n nuwe profiel."
  t079: "hermes update sinkroniseer nuwe saamgebundelde vaardighede outomaties na ALLE profiele."
  t080: "hermes gateway install stel Hermes op as 'n stelseldiens (systemd/launchd)."
  t081: "hermes memory setup laat jou 'n eksterne geheueverskaffer opstel (Honcho, Mem0, ens.)."
  t082: "hermes webhook subscribe skep gebeurtenisgedrewe webhook-roetes met HMAC-validering."
  t083: "Bespaar geld: hermes tools deaktiveer ongebruikte gereedskap, hermes skills config snoei vaardighede."
  t084: "/reasoning low of /reasoning minimal verminder die denkdiepte tot onder die verstek (medium) — vinniger, goedkoper antwoorde."
  t085: "hermes models stuur visie-, kompressie- en hulptake na goedkoper modelle — sny agtergrond-tokenkoste met 85%+ sonder om jou hoof-kletsmodel af te gradeer."
  t086: "Stel display.bell_on_complete: true in config.yaml om 'n klokkie te hoor wanneer lang take klaar is."
  t087: "Stel display.streaming: true om tokens intyds te sien verskyn terwyl die model genereer."
  t088: "Stel display.show_reasoning: true om die model se denkketting-redenering te volg."
  t089: "Stel display.compact: true om witruimte in die uitvoer te verminder vir digter inligting."
  t090: "Stel display.busy_input_mode: queue om boodskappe in die tou te plaas in plaas van die agent te onderbreek, of steer om hulle middel in 'n lopie via /steer in te voeg."
  t091: "Stel display.resume_display: minimal om die volledige gespreksoorsig by sessie-hervatting oor te slaan."
  t092: "Stel compression.threshold: 0.50 om te beheer wanneer outo-kompressie afgaan (verstek: 50% van die konteks)."
  t093: "Stel agent.max_turns: 1000 om die agent meer gereedskapsoproep-stappe per beurt te laat neem."
  t094: "Stel file_read_max_chars: 200000 om die maksimum inhoud per read_file-oproep te verhoog."
  t095: "Stel approvals.mode: smart om 'n LLM veilige opdragte outomaties te laat goedkeur en gevaarlike outomaties te laat weier."
  t096: "Stel fallback_model in config.yaml om outomaties na 'n rugsteunverskaffer oor te skakel."
  t097: "Stel privacy.redact_pii: true om gebruiker-ID's en telefoonnommers te hash voordat dit na die LLM gestuur word."
  t098: "Stel browser.record_sessions: true om blaaiersessies outomaties as WebM-video's op te neem."
  t099: "Stel worktree: true in config.yaml om altyd 'n git-worktree te skep (dieselfde as hermes -w)."
  t100: "Stel security.website_blocklist.enabled: true om spesifieke domeine vir webgereedskap te blokkeer."
  t101: "Stel cron.wrap_response: false om rou agent-uitvoer sonder die cron-kop/voetstuk af te lewer."
  t102: "HERMES_TIMEZONE oorskry die bediener se tydsone met enige IANA-tydsonestring."
  t103: "Omgewingsveranderlike-vervanging werk in config.yaml: gebruik die ${VAR_NAME}-sintaks."
  t104: "Vinnige opdragte in config.yaml voer shell-opdragte onmiddellik uit met nul tokengebruik."
  t105: "Eie persoonlikhede kan in config.yaml onder agent.personalities gedefinieer word."
  t106: "provider_routing beheer OpenRouter-verskaffersortering, witlys en swartlys."
  t107: "execute_code voer Python-skripte uit wat Hermes-gereedskap programmaties oproep — resultate bly buite die konteks."
  t108: "delegate_task begin by verstek tot 10 gelyktydige subagente (delegation.max_concurrent_children) met geïsoleerde kontekste vir parallelle werk."
  t109: "web_extract werk op PDF-URL's — gee enige PDF-skakel en dit word na markdown omgeskakel."
  t110: "search_files is op ripgrep gebou en vinniger as grep — gebruik dit in plaas van grep in die terminal."
  t111: "patch gebruik 9 vae-passingstrategieë sodat klein witruimteverskille nie wysigings breek nie."
  t112: "patch ondersteun die V4A-formaat vir grootmaat-wysigings oor verskeie lêers in een oproep."
  t113: "read_file stel soortgelyke lêernames voor wanneer 'n lêer nie gevind word nie."
  t114: "read_file dedupliseer outomaties — om 'n onveranderde lêer weer te lees gee 'n liggewig-stomp terug."
  t115: "browser_vision neem 'n skermkiekie en ontleed dit met KI — werk vir CAPTCHA's en visuele inhoud."
  t116: "browser_console kan JavaScript-uitdrukkings in die bladsykonteks evalueer."
  t117: "image_generate skep beelde met FLUX 2 Pro en outomatiese 2x-opskaling."
  t118: "text_to_speech skakel teks na klank om — speel as stemborrels op Telegram."
  t119: "send_message kan enige gekoppelde boodskapplatform van binne 'n sessie bereik."
  t120: "Die todo-gereedskap help die agent om komplekse multistap-take tydens 'n sessie by te hou."
  t121: "session_search doen 'n volteks-soektog oor AL jou vorige gesprekke."
  t122: "Die agent stoor voorkeure, korreksies en omgewingsfeite outomaties in die geheue."
  t123: "/moa stuur een moeilike prompt deur jou opgestelde Mixture of Agents-modelstel."
  t124: "Terminal-opdragte ondersteun agtergrondmodus met notify_on_complete vir langlopende take."
  t125: "Terminal-agtergrondprosesse ondersteun watch_patterns om oor spesifieke uitvoerreëls te waarsku."
  t126: "Die terminal-gereedskap ondersteun 6 agterkante: local, Docker, SSH, Modal, Daytona en Singularity."
  t127: "Elke profiel kry sy eie konfigurasie, API-sleutels, geheue, sessies, vaardighede en cron-take."
  t128: "Profielname word shell-opdragte — 'hermes profile create coder' skep die 'coder'-opdrag."
  t129: "hermes profile export coder -o backup.tar.gz skep 'n oordraagbare profielargief."
  t130: "As twee profiele per ongeluk 'n bot-token deel, word die tweede gateway met 'n duidelike fout geblokkeer."
  t131: "Sessies genereer outomaties beskrywende titels na die eerste uitruiling — geen handmatige benoeming nodig nie."
  t132: "Sessietitels ondersteun afstamming: \"my projek\" → \"my projek #2\" → \"my projek #3\"."
  t133: "By afsluiting druk Hermes 'n hervat-opdrag met die sessie-ID en statistieke."
  t134: "hermes sessions export backup.jsonl voer alle sessies uit vir rugsteun of ontleding."
  t135: "hermes -r SESSION_ID hervat enige spesifieke vorige sessie volgens sy ID."
  t136: "Geheue is 'n bevrore momentopname — veranderinge verskyn eers by die volgende sessiebegin in die stelselprompt."
  t137: "Geheue-inskrywings word outomaties vir prompt-inspuiting en eksfiltrasiepatrone geskandeer."
  t138: "Die agent het twee geheuebergplekke: persoonlike notas (~2200 karakters) en gebruikersprofiel (~1375 karakters)."
  t139: "Korreksies wat jy die agent gee (\"nee, doen dit so\") word dikwels outomaties in die geheue gestoor."
  t140: "Meer as 80 saamgebundelde vaardighede wat github, creative, mlops, productivity, research en meer dek."
  t141: "Elke geïnstalleerde vaardigheid word outomaties 'n slash-opdrag — tik / om hulle almal te sien."
  t142: "hermes skills install official/security/1password installeer opsionele vaardighede vanaf die bewaarplek."
  t143: "Vaardighede kan tot spesifieke bedryfstelsels beperk word — sommige laai net op macOS of Linux."
  t144: "skills.external_dirs in config.yaml laat jou vaardighede vanaf eie gidse laai."
  t145: "Die agent kan met skill_manage sy eie vaardighede as prosedurele geheue skep."
  t146: "/plan skryf 'n markdown-implementeringsplan na .hermes/plans/ sonder om enigiets uit te voer."
  t147: "Cron-take kan vaardighede aanheg: hermes cron add --skill blogwatcher \"Check for new posts\"."
  t148: "Cron-afleweringsbestemmings sluit telegram, discord, slack, email, sms en 12+ ander platforms in."
  t149: "As 'n cron-antwoord met [SILENT] begin, word aflewering onderdruk — handig vir take wat net monitor."
  t150: "Cron ondersteun relatiewe vertragings (30m), intervalle (every 2h), cron-uitdrukkings en ISO-tydstempels."
  t151: "Cron-take loop in heeltemal vars agent-sessies — prompte moet selfstandig wees."
  t152: "Stemmodus werk met nul API-sleutels as faster-whisper geïnstalleer is (gratis plaaslike spraak-na-teks)."
  t153: "Vyf TTS-verskaffers beskikbaar: Edge TTS (gratis), ElevenLabs, OpenAI, NeuTTS (gratis, plaaslik), MiniMax."
  t154: "/voice on aktiveer stemmodus in die CLI. Ctrl+B skakel druk-om-te-praat-opname aan of af."
  t155: "Stromende TTS speel sinne terwyl hulle gegenereer word — jy wag nie vir die volle antwoord nie."
  t156: "Stemboodskappe op Telegram, Discord, WhatsApp en Slack word outomaties getranskribeer."
  t157: "Hermes loop op 21 boodskapplatforms: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, e-pos en meer."
  t158: "hermes gateway install stel dit op as 'n stelseldiens wat by opstart begin."
  t159: "DingTalk gebruik Stream Mode — geen webhooks of publieke URL nodig nie."
  t160: "BlueBubbles bring iMessage na Hermes via 'n plaaslike macOS-bediener."
  t161: "Webhook-roetes ondersteun HMAC-validering, tempobeperking en gebeurtenisfiltrering."
  t162: "Die API-bediener bied 'n OpenAI-versoenbare eindpunt wat met Open WebUI en LibreChat werk."
  t163: "Discord-stemkanaalmodus: die bot sluit by die stemkanaal aan, transkribeer spraak en praat terug."
  t164: "group_sessions_per_user: true gee elke persoon sy eie sessie in groepgesprekke."
  t165: "/sethome merk 'n geselsie as die tuiskanaal vir cron-taakaflewerings."
  t166: "Die gateway ondersteun onaktiwiteitsgebaseerde uittelle — aktiewe agente kan onbepaald loop."
  t167: "Goedkeuring van gevaarlike opdragte het 4 vlakke: eenmalig, sessie, altyd (permanente toelaatlys), weier."
  t168: "Slim goedkeuringsmodus gebruik 'n LLM om veilige opdragte outomaties goed te keur en gevaarlike te merk."
  t169: "SSRF-beskerming blokkeer private netwerke, loopback, link-local en wolk-metadata-adresse."
  t170: "Tirith-skandering voor uitvoering bespeur homograaf-URL-vervalsing en pyp-na-vertolker-patrone."
  t171: "MCP-subprosesse ontvang 'n gefiltreerde omgewing — net veilige stelselveranderlikes gaan deur."
  t172: "Kontekslêers (.hermes.md, AGENTS.md) word voor laai vir prompt-inspuiting geskandeer."
  t173: "command_allowlist in config.yaml keur spesifieke shell-opdragpatrone permanent goed."
  t174: "Konteks word outomaties saamgepers wanneer dit die drempel bereik — herinneringe word na die geheue geskryf en die geskiedenis opgesom."
  t175: "Die statusbalk word geel, dan oranje, dan rooi soos die konteks volraak."
  t176: "SOUL.md is die agent se primêre identiteitslêer — pas dit aan om gedrag te vorm."
  t177: "Hermes laai projekkonteks vanaf .hermes.md, AGENTS.md, CLAUDE.md of .cursorrules (eerste passing)."
  t178: "AGENTS.md-lêers in subgidse word geleidelik ontdek soos die agent in vouers navigeer."
  t179: "Kontekslêers is beperk tot 20 000 karakters met slim kop/stert-afkapping."
  t180: "Vyf blaaierverskaffers: plaaslike Chromium, Browserbase, Browser Use, Camofox en Firecrawl."
  t181: "Camofox is 'n anti-opsporingsblaaier — 'n Firefox-vurk met C++-vingerafdrukvervalsing."
  t182: "browser_navigate gee outomaties 'n bladsy-momentopname terug — geen browser_snapshot-oproep daarna nodig nie."
  t183: "browser_vision met annotate=true plaas genommerde etikette oor interaktiewe elemente."
  t184: "hermes mcp maak 'n interaktiewe kieser van Nous-goedgekeurde MCP's oop wat jy met een toetsdruk kan installeer."
  t185: "hermes mcp catalog lys Nous-goedgekeurde MCP-bedieners wat saam met die bewaarplek verskeep word."
  t186: "hermes mcp install <name> installeer 'n katalogus-inskrywing, vra vir geloofsbriewe en laat jou kies watter van sy gereedskap om te aktiveer."
  t187: "MCP-bedieners word in config.yaml opgestel — beide stdio- en HTTP-vervoer word ondersteun."
  t188: "Gereedskapfiltrering per bediener: tools.include witlys en tools.exclude swartlys spesifieke gereedskap."
  t189: "MCP-bedieners genereer outomaties gereedskapstelle tydens looptyd — hermes tools kan hulle per platform aan- of afskakel."
  t190: "MCP OAuth-ondersteuning: auth: oauth aktiveer blaaiergebaseerde magtiging met PKCE."
  t191: "Kontrolepunte het nul oorhoofse koste wanneer geen lêers gewysig word nie — by verstek geaktiveer."
  t192: "'n Voor-terugrol-momentopname word outomaties gestoor sodat jy die ongedaanmaking kan ongedaan maak."
  t193: "/rollback maak ook die gespreksbeurt ongedaan, sodat die agent nie die teruggerolde veranderinge onthou nie."
  t194: "Kontrolepunte gebruik skadu-bewaarplekke in ~/.hermes/checkpoints/ — jou projek se .git word nooit aangeraak nie."
  t195: "batch_runner.py verwerk honderde prompte parallel vir die generering van opleidingsdata."
  t196: "hermes chat -Q aktiveer stil modus vir programmatiese gebruik — onderdruk die banier en die spinner."
  t197: "Trajekstoor (--save-trajectories) vang volledige gereedskapsgebruik-spore vas vir modelopleiding."
  t198: "Drie plugin-tipes: algemeen (gereedskap/hooks), geheueverskaffers en konteksenjins."
  t199: "hermes plugins install owner/repo installeer plugins direk vanaf GitHub."
  t200: "Eksterne geheueverskaffers: Honcho, OpenViking, Mem0 saamgebundel; Hindsight en meer via hermes plugins install."
  t201: "Plugin-hooks sluit pre/post_tool_call, pre/post_llm_call en transform_terminal_output vir uitvoer-kanonisering in."
  t202: "Prompt-kasing (Anthropic) verminder koste deur gekasde stelselprompt-voorvoegsels te hergebruik."
  t203: "Die agent genereer sessietitels outomaties in 'n agtergronddraad — nul impak op vertraging."
  t204: "Slim modelroetering kan eenvoudige navrae outomaties na 'n goedkoper model stuur."
  t205: "Slash-opdragte ondersteun voorvoegselpassing: /h word /help, /mod word /model."
  t206: "Om 'n lêerpad in die terminal in te sleep heg beelde outomaties aan of stuur dit as konteks."
  t207: ".worktreeinclude in jou bewaarplek se wortel lys gitignored lêers om na worktrees te kopieer."
  t208: "hermes acp laat Hermes as 'n ACP-bediener loop vir integrasie met VS Code, Zed en JetBrains."
  t209: "Eie verskaffers: stoor benoemde eindpunte in config.yaml onder custom_providers."
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT spuit 'n stelselprompt in wat nooit in die geskiedenis bewaar word nie."
  t211: "credential_pool_strategies ondersteun fill_first-, round_robin-, least_used- en random-rotasie."
  t212: "hermes auth add nous of hermes auth add openai-codex stel OAuth-gebaseerde verskaffers op."
  t213: "Die API-bediener ondersteun beide die Chat Completions- en Responses API met bedienerkant-toestand."
  t214: "tool_preview_length: 0 in die konfigurasie wys volledige lêerpaaie in die spinner se aktiwiteitsvoer."
  t215: "hermes status --deep voer dieper diagnostiese kontroles oor alle komponente uit."
  t216: "Cron-take kan 'n Python-skrip (--script) aanheg waarvan die stdout as konteks in die prompt ingespuit word."
  t217: "Cron-skripte woon in ~/.hermes/scripts/ en loop voor die agent — perfek vir data-insamelingspyplyne."
  t218: "prefill_messages_file in config.yaml spuit few-shot-voorbeelde in elke API-oproep in, nooit in die geskiedenis gestoor nie."
  t219: "SOUL.md vervang die agent se verstek-identiteit heeltemal — herskryf dit om Hermes jou eie te maak."
  t220: "SOUL.md word by die eerste lopie outomaties met 'n verstek-persoonlikheid gevul. Wysig dit om aan te pas."
  t221: "/compress <focus topic> ken 60-70% van die opsommingsbegroting aan jou onderwerp toe en snoei die res aggressief."
  t222: "By die tweede en latere kompressies werk die saampersser die vorige opsomming by in plaas van om van voor te begin."
  t223: "Voor 'n gateway-sessieherstel skryf Hermes belangrike feite outomaties in die agtergrond na die geheue."
  t224: "network.force_ipv4: true in config.yaml los vashakings op bedieners met gebroke IPv6 op — dit monkey-patch socket."
  t225: "Die terminal-gereedskap annoteer algemene uitgangskodes: grep wat 1 teruggee = 'No matches found (not an error)'."
  t226: "Mislukte voorgrond-terminalopdragte probeer outomaties tot 3 keer weer met eksponensiële terugtrek (2s, 4s, 8s)."
  t227: "Kaal sudo-opdragte word outomaties herskryf om SUDO_PASSWORD vanaf .env te pyp — geen interaktiewe prompt nodig nie."
  t228: "execute_code-helpers vereis eksplisiete invoere: from hermes_tools import json_parse, shell_quote, retry."
  t229: "execute_code se 7 sandput-gereedskap (web_search, terminal, read/write/search/patch) gebruik RPC — kom nooit in die konteks nie."
  t230: "Om dieselfde lêergebied 3+ keer te lees gee 'n waarskuwing. By 4+ word dit hard geblokkeer om lusse te voorkom."
  t231: "write_file en patch bespeur of 'n lêer sedert die laaste lees ekstern gewysig is en waarsku oor verouderdheid."
  t232: "Die V4A-patch-formaat ondersteun Add File-, Delete File- en Move File-direktiewe — nie net Update nie."
  t233: "MCP-bedieners kan via sampling LLM-voltooiings terugvra — die agent word 'n gereedskap vir die bediener."
  t234: "MCP-bedieners stuur notifications/tools/list_changed om outomatiese gereedskap-herregistrasie sonder herbegin te aktiveer."
  t235: "delegate_task met acp_command: 'claude' begin Claude Code as 'n kind-agent vanaf enige platform."
  t236: "Delegasie het 'n hartklopdraad — kind-aktiwiteit word na die ouer deurgegee, wat gateway-uittelle voorkom."
  t237: "Wanneer 'n verskaffer HTTP 402 (betaling vereis) teruggee, val die hulpkliënt outomaties terug op die volgende een."
  t238: "agent.tool_use_enforcement stuur modelle wat aksies beskryf in plaas van gereedskap op te roep — outomaties vir GPT/Codex."
  t239: "agent.restart_after_turn_timeout laat lopende beurte klaarmaak voordat /restart stop() binnegaan; restart_drain_timeout is slegs die forseer-onderbreek-begroting sodra stop() begin."
  t240: "agent.api_max_retries (verstek 3) beheer hoeveel keer die agent 'n mislukte API-oproep herprobeer voordat die fout vertoon word — verlaag dit vir vinnige terugval."
  t241: "Die gateway kas AIAgent-instansies per sessie — om hierdie kas te vernietig breek Anthropic se prompt-kasing."
  t242: "Enige webwerf kan vaardighede via /.well-known/skills/index.json blootstel — die vaardigheidshub ontdek hulle outomaties."
  t243: "Die vaardigheids-ouditlog by ~/.hermes/skills/.hub/audit.log hou elke installasie- en verwyderingsbewerking by."
  t244: "Verouderde git-worktrees word by opstart outomaties opgeruim: skoon, volledig saamgevoegde bome word gesnoei; vuil of ongepushte werk word altyd bewaar."
  t245: "Profiele skei Hermes-toestand via HERMES_HOME; gasheer-gereedskapsubprosesse behou jou werklike HOME tensy terminal.home_mode op profile gestel is."
  t246: "Die HERMES_HOME_MODE-omgewingsveranderlike (oktaal, bv. 0701) stel eie gidstoestemmings vir webbediener-deurkruising."
  t247: "Houermodus: plaas .container-mode in HERMES_HOME en die gasheer-CLI voer outomaties binne die houer uit."
  t248: "Ctrl+C het 5 prioriteitsvlakke: kanselleer opname → kanselleer prompte → kanselleer kieser → onderbreek agent → sluit af."
  t249: "Elke onderbreking tydens 'n agent-lopie word met tydstempels na ~/.hermes/interrupt_debug.log gelog."
  t250: "BROWSER_CDP_URL koppel blaaiergereedskap aan enige lopende Chromium-familie-blaaier — aanvaar WebSocket, HTTP of host:port."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true aktiveer gevorderde anti-opsporing met 'n aangepaste Chromium (Scale Plan)."
  t252: "Die CLI skakel outomaties na kompakte modus oor in terminale smaller as 80 kolomme."
  t253: "Vinnige opdragte ondersteun twee tipes: exec (voer 'n shell-opdrag direk uit) en alias (herlei na 'n ander opdrag)."
  t254: "Delegasiemodel per taak: delegation.model en delegation.provider in die konfigurasie stuur subagente na goedkoper modelle."
  t255: "delegation.reasoning_effort beheer die denkdiepte vir subagente onafhanklik."
  t256: "display.platforms in config.yaml laat vertoon-oorskrywings per platform toe: {telegram: {tool_progress: all}}."
  t257: "human_delay.mode in die konfigurasie simuleer menslike tikspoed — instelbare min_ms/max_ms-reeks."
  t258: "Konfigurasieversie-migrasies loop outomaties by laai — nuwe konfigurasiesleutels verskyn sonder handmatige ingryping."
  t259: "GPT- en Codex-modelle kry spesiale stelselprompt-leiding vir gereedskapsdissipline en verpligte gereedskapsgebruik."
  t260: "Gemini-modelle kry aangepaste direktiewe vir absolute paaie, parallelle gereedskapsoproepe en nie-interaktiewe opdragte."
  t261: "context.engine in config.yaml kan op 'n plugin-naam gestel word vir alternatiewe konteksbestuurstrategieë."
  t262: "Blaaier-bladsymomentopnames van meer as 15 000 karakters word afgekap of outomaties opgesom; die volle momentopname word in cache/web gestoor vir read_file-blaai."
  t263: "Die saampersser doen 'n goedkoop voorlopie: gereedskapsuitvoer van meer as 200 karakters word met plekhouers vervang voordat die LLM loop."
  t264: "Wanneer kompressie misluk, word verdere pogings vir 10 minute gepouseer om die API nie te oorlaai nie."
  t265: "Lang gevaarlike opdragte (>70 karakters) kry 'n 'view'-opsie in die goedkeuringsprompt om eers die volle teks te sien."
  t266: "Klankpeil-visualisering wys ▁▂▃▄▅▆▇-balke tydens stemopname gebaseer op die mikrofoon se RMS-peile."
  t267: "Profielname mag nie met bestaande PATH-binêres bots nie — 'hermes profile create ls' sou verwerp word."
  t268: "hermes profile create backup --clone-all kopieer alles (konfigurasie, sleutels, SOUL.md, herinneringe, vaardighede, sessies)."
  t269: "Die stemopname-toets is instelbaar via voice.record_key in config.yaml — nie net Ctrl+B nie."
  t270: ".cursorrules- en .cursor/rules/*.mdc-lêers word outomaties bespeur en as projekkonteks gelaai."
  t271: "Kontekslêers word vir 10+ prompt-inspuitingspatrone geskandeer — onsigbare Unicode, 'ignore instructions', eksfiltrasiepogings."
  t272: "GPT-5 en Codex gebruik die 'developer'-rol in plaas van 'system' in die boodskapformaat."
  t273: "Hulp-oorskrywings per taak: auxiliary.vision.provider, auxiliary.compression.model, ens. in config.yaml."
  t274: "Die hulpkliënt behandel 'main' as 'n verskaffer-alias — dit los op na jou werklike primêre verskaffer + model."
  t275: "hermes claw migrate --dry-run wys die OpenClaw-migrasie vooraf sonder om iets te skryf."
  t276: "Lêerpaaie wat met aanhalingstekens of ontsnapte spasies geplak word, word outomaties hanteer — geen handmatige opruiming nodig nie."
  t277: "Slash-opdragte aktiveer nooit die groot-plak-invouing nie — /command met groot argumente werk korrek."
  t278: "In onderbreekmodus omseil slash-opdragte wat tydens agent-uitvoering getik word die onderbreeklogika en loop onmiddellik."
  t279: "HERMES_DEV=1 omseil houermodus-bespeuring vir plaaslike ontwikkeling."
  t280: "Elke MCP-bediener kry sy eie gereedskapstel (mcp-servername) wat onafhanklik via hermes tools aan- of afgeskakel kan word."
  t281: "MCP ${ENV_VAR}-plekhouers in die konfigurasie word by bedienerbegin opgelos — insluitend veranderlikes uit ~/.hermes/.env."
  t282: "Vaardighede uit vertroude bewaarplekke (NousResearch) kry 'n 'trusted'-sekuriteitsvlak; gemeenskapsvaardighede kry ekstra skandering."
  t283: "Die vaardigheidskwarantyn by ~/.hermes/skills/.hub/quarantine/ hou vaardighede wat op sekuriteitshersiening wag."
  t284: "/steer <prompt> voeg 'n nota na die volgende gereedskapsoproep in — stuur die rigting middel in 'n taak sonder om te onderbreek."
