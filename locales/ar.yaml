    help: "/topic — تفعيل وضع الجلسات المتعددة في الرسائل الخاصة (بوت واحد، محادثات متوازية كثيرة)\n\nالاستخدام:\n  /topic             تفعيل وضع المواضيع، أو عرض الحالة إن كان مفعّلًا\n  /topic help        عرض هذه الرسالة\n  /topic off         تعطيل وضع المواضيع ومسح ارتباطاتها\n  /topic <id>        داخل موضوع: استعادة جلسة سابقة بمعرّفها\n\nكيف يعمل:\n1. شغّل /topic مرة واحدة في هذه المحادثة الخاصة — يتحقّق Hermes من تفعيل\n   Threads Settings في BotFather ويشغّل وضع الجلسات المتعددة.\n2. اضغط All Messages في أعلى البوت وأرسل أي رسالة.\n   ينشئ Telegram موضوعًا جديدًا لتلك الرسالة؛ وكل موضوع\n   جلسة Hermes مستقلة (سجل جديد وسياق جديد).\n3. تصبح المحادثة الخاصة الرئيسية ردهة للنظام — أرسل فيها /topic و/status\n   و/help و/usage. أما المطالبات العادية فتُرسل داخل موضوع.\n4. /new داخل موضوع يعيد ضبط جلسة ذلك الموضوع فقط.\n5. /topic <id> داخل موضوع يستعيد جلسة قديمة إليه."
