    all_retries_exhausted_no_response: "لم يجب مزوّد النموذج بعد استنفاد كل المحاولات. أرسل /retry، أو بدّل النموذج عبر /model."
    partial_stream_recovery: "توقّف البث مبكرًا ولم يُسترجع سوى رد جزئي. أرسل `continue` للاستئناف من حيث توقّف."
    fallback_prior_turn_content: "لم يُنتَج محتوى جديد في هذا الدور؛ يُعرض السياق السابق المسترجَع. أرسل `continue` لإعادة المحاولة."
    redirect_restart_limit_exceeded: "أُلغي الطلب بتصحيح جديد في كل محاولة، فتوقّف الدور بدلًا من إعادة المحاولة إلى ما لا نهاية. تصحيحك الأخير في قائمة الانتظار كرسالتك التالية."
    rebuilt_restart_limit_exceeded: "ظلّ كل مزوّد في سلسلة الاحتياط يتحوّل إلى البديل، فتوقّف الدور بدلًا من إعادة المحاولة إلى ما لا نهاية. أرسل `continue` أو بدّل المزوّد."
    budget_exhausted: "استُنفدت ميزانية التكرار/التكلفة لهذا الدور قبل الوصول إلى إجابة نهائية. أرسل `continue` للمتابعة."
    ollama_runtime_context_too_small: "نافذة سياق النموذج المحلي أصغر من أن تكفي لإتمام العمل. زِد حجم السياق أو استخدم نموذجًا أكبر."
    pending_tool_result: "توقّف الدور بينما كانت نتيجة أداة لا تزال قيد الانتظار، ولم ينتج النموذج أي نص لاحق. أرسل `continue` ليقوم بالتلخيص."
    interrupted_during_api_call: "قُطع الطلب أثناء الاستدعاء قبل تلقّي رد. أرسل `continue` لإعادة المحاولة."
    max_iterations_reached: "بلغ الحد الأقصى لتكرارات الأدوات قبل الوصول إلى إجابة نهائية. أرسل `continue` للمتابعة، أو ارفع قيمة `max_iterations`."
    error_near_max_iterations: "حدث خطأ قرب حد التكرارات قبل الوصول إلى إجابة نهائية. راجع مخرجات الأداة أعلاه، ثم أرسل `continue`."
    repeated_outer_errors: "ظلّ الدور يفشل بأخطاء متكررة فأُوقف مبكرًا بدلًا من إعادة المحاولة إلى ما لا نهاية. راجع الأخطاء أعلاه، ثم أرسل `continue` لإعادة المحاولة."
  persistence:
    compression: "أُوقف الدور لأن عملية أخرى كانت تضغط هذه الجلسة. من المفترض أن رسالتك محفوظة بالفعل — يُرجى إرسالها مجددًا بعد انتهاء الضغط."
    compression_closed: "أُوقف الدور لأن هذه الجلسة جرى تدويرها بضغط السياق ولم يُمكن اعتماد استمرارها الحيّ. التخزين نفسه سليم — حدّث العميل (أو ابدأ دورًا جديدًا) ليلتقط معرّف الجلسة الجديد، ثم أرسل رسالتك مجددًا."
    turn_lease: "أُوقف الدور لأن عملية Hermes أخرى استولت على هذه الجلسة. لم يُحفظ ردّك — انتظر انتهاء العملية الأخرى، ثم أرسل رسالتك مجددًا."
    session_row_missing: "حُذفت هذه الجلسة من التخزين بينما كانت المحادثة لا تزال مفتوحة، ولم يستطع Hermes إعادة إنشائها، فلم تُحفظ هذه الرسالة. أرسل رسالتك مجددًا؛ وإن استمر الفشل، شغّل `hermes {profile_arg}doctor`."
    locked: "أُوقف الدور لأن تخزين الجلسة كان مشغولًا (عملية Hermes أخرى كانت تكتب في قاعدة بيانات الحالة). من المفترض أن رسالتك محفوظة بالفعل — يُرجى إرسالها مجددًا بعد لحظات."
    replaced: "استُبدل ملف قاعدة بيانات الجلسات أثناء تشغيل Hermes، فلم تُحفظ هذه الرسالة (تُحتفظ نسخة منها في {home}/sessions/). أوقف Hermes (`hermes {profile_arg}gateway stop`)، وشغّل `hermes {profile_arg}doctor` — وليس `hermes {profile_arg}doctor --fix`، لأنه سيُصلح الملف الخطأ في مكانه — ثم شغّله من جديد وأرسل رسالتك مرة أخرى. خطوات الاسترداد المتقدمة موجودة في السجل."
    deleted_wal: "لا تزال عملية Hermes أخرى تحتفظ بنسخة قديمة من سجل الكتابة المسبقة لقاعدة بيانات الجلسات، فتوقّف Hermes عن الكتابة حفاظًا على سلامة الملف ولم تُحفظ هذه الرسالة (تُحتفظ نسخة منها في {home}/sessions/). لم يُفقد شيء. أنهِ كل عمليات Hermes على هذا الملف التعريفي (تطبيق سطح المكتب، `hermes {profile_arg}gateway stop`، لوحة التحكم، cron)، وشغّل `hermes {profile_arg}doctor` — فهو يسمّي أي عملية لا تزال تحتفظ بالسجل — ثم شغّل Hermes من جديد وأرسل رسالتك مرة أخرى. لا تشغّل `doctor --fix` ولا تحذف أي ملفات state.db أثناء تشغيلها. الدليل: {recovery_docs}"
    corrupt: "أُوقف الدور لأن قاعدة بيانات الحالة أبلغت عن تلف بنيوي (كان النص الكامل سيُفقد عند إعادة التشغيل). لن يفيد تحرير مساحة على القرص. خيارات الاسترداد:\n1. شغّل `hermes {profile_arg}doctor --fix`\n2. أوقف البوّابة، ثم استردّ عبر:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (إن أبلغ بأن الاسترداد ممكن) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — يأخذ الاسترداد لقطة من الملف المتضرر أولًا؛ لا تشغّل `sqlite3 ... \".recover\"` على state.db الحيّ، فقد يزيد sqlite3 CLI المعرّض للثغرات من تلفه\n3. استعد من نسخة احتياطية في {backups_dir}/\nثم أرسل رسالتك مجددًا."
    fts_index: "أُوقف الدور لأن فهرس بحث الجلسات (FTS5) تالف ولم يُمكن فصله، فلم تُحفظ هذه الرسالة. مخزن الرسائل نفسه غير متضرر: لا تشغّل أدوات الاسترداد ولا تستعد نسخة احتياطية. شغّل `hermes {profile_arg}doctor --fix` (أو أعد تشغيل Hermes، فهو يُصلح الفهرس عند الفتح)، ثم أرسل رسالتك مجددًا."
    disk: "تعذّر على Hermes حفظ هذه المحادثة على القرص، فتوقّف بدلًا من أن يفقد رسائلك. القرص ممتلئ على الأرجح: حرّر بعض المساحة (أو أصلح أذونات {home}/state.db)، ثم أرسل رسالتك مجددًا."
    default: "تعذّر على Hermes حفظ هذه المحادثة، فتوقّف بدلًا من أن يفقد رسائلك. الأسباب المحتملة: لم يتبقّ مكان على القرص، أو عملية Hermes أخرى تحتجز قاعدة البيانات. أغلق نوافذ Hermes الأخرى، وشغّل `hermes {profile_arg}doctor` للتحقق من التخزين، ثم أرسل رسالتك مجددًا."
  file_mutation:
    header: "⚠️ مدقّق تعديل الملفات: فشل {count} من تعديلات الملفات في هذا الدور رغم أي صياغة أعلاه قد توحي بخلاف ذلك. شغّل `git status` أو `read_file` للتأكد ممّا طُبّق فعلًا."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "فشل"
  shared:
    and_more: "  • … و{count} أخرى"
    the_model: "النموذج"
tips:
  t001: "/bg <prompt> يشغّل مهمة في جلسة منفصلة بينما تبقى جلستك الحالية حرّة؛ و/btw <question> يجيب عن سؤال جانبي حول هذه المحادثة دون مقاطعتها."
  t002: "/branch يفرّع الجلسة الحالية لتستكشف اتجاهًا مختلفًا دون أن تفقد ما أنجزته."
  t003: "/compress يضغط سياق المحادثة يدويًا عندما تطول الأمور."
  t004: "/rollback يعرض نقاط حفظ نظام الملفات — أعد الملفات التي عدّلها الوكيل إلى أي حالة سابقة."
  t005: "/rollback diff 2 يعرض ما تغيّر منذ نقطة الحفظ 2 دون استعادة أي شيء."
  t006: "/rollback 2 src/file.py يستعيد ملفًا واحدًا من نقطة حفظ محددة."
  t007: "/title \"my project\" يسمّي جلستك — استأنفها لاحقًا عبر /resume أو hermes -c."
  t008: "/resume يتابع من حيث توقفت في جلسة سمّيتها سابقًا."
  t009: "/queue <prompt> يضيف رسالة إلى قائمة الانتظار للدور التالي دون مقاطعة الدور الحالي."
  t010: "/undo يحذف آخر تبادل بين المستخدم والمساعد من المحادثة."
  t011: "/retry يعيد إرسال رسالتك الأخيرة — مفيد عندما لا يكون رد الوكيل دقيقًا تمامًا."
  t012: "/verbose يبدّل عرض تقدّم الأدوات: off → new → all → verbose."
  t013: "/reasoning high يزيد عمق تفكير النموذج. و/reasoning show يعرض الاستدلال."
  t014: "/fast يبدّل المعالجة ذات الأولوية للحصول على ردود API أسرع (حسب المزوّد)."
  t015: "/yolo يتخطّى جميع مطالبات الموافقة على الأوامر الخطيرة لبقية الجلسة."
  t016: "/model يتيح لك تبديل النماذج أثناء الجلسة — جرّب /model sonnet أو /model gpt-5."
  t017: "/model --global يغيّر نموذجك الافتراضي بشكل دائم."
  t018: "/personality pirate يضبط شخصية مرحة — 14 خيارًا مضمّنًا من kawaii إلى shakespeare."
  t019: "/skin يغيّر سمة واجهة سطر الأوامر — جرّب ares أو mono أو slate أو poseidon أو charizard."
  t020: "/statusbar يبدّل شريطًا دائمًا يعرض النموذج والرموز ونسبة امتلاء السياق والتكلفة والمدة."
  t021: "/tools disable browser يزيل أدوات المتصفح مؤقتًا من الجلسة الحالية."
  t022: "/browser connect يربط أدوات المتصفح بمتصفح Chromium العامل لديك عبر CDP."
  t023: "/plugins يعرض الإضافات المثبّتة وحالتها."
  t024: "/cron يدير المهام المجدولة — أنشئ مطالبات متكررة مع إرسال النتائج إلى أي منصة."
  t025: "/reload-mcp يعيد تحميل إعدادات خوادم MCP فورًا دون إعادة التشغيل."
  t026: "/usage يعرض استخدام الرموز وتفصيل التكلفة ومدة الجلسة."
  t027: "/insights يعرض تحليلات الاستخدام لآخر 30 يومًا."
  t028: "/paste يتحقق من وجود صورة في الحافظة ويرفقها برسالتك التالية."
  t029: "/profile يعرض الملف التعريفي النشط ومجلده الرئيسي."
  t030: "/config يعرض إعداداتك الحالية بنظرة سريعة."
  t031: "/stop يوقف جميع عمليات الخلفية التي شغّلها الوكيل."
  t032: "@file:path/to/file.py يدرج محتوى الملف مباشرة في رسالتك."
  t033: "@file:main.py:10-50 يدرج الأسطر 10-50 فقط من الملف."
  t034: "@folder:src/ يدرج قائمة شجرة المجلد."
  t035: "@diff يدرج تغييرات git غير المُدرجة (unstaged) في الرسالة."
  t036: "@staged يدرج تغييرات git المُدرجة (git diff --staged)."
  t037: "@git:5 يدرج آخر 5 إيداعات مع تعديلاتها الكاملة."
  t038: "@url:https://example.com يجلب محتوى صفحة ويب ويدرجه."
  t039: "كتابة @ تُفعّل إكمال مسارات نظام الملفات — انتقل إلى أي ملف تفاعليًا."
  t040: "اجمع عدة مراجع معًا: \"راجع @file:main.py و@file:test.py للتحقق من الاتساق.\""
  t041: "Alt+Enter يدرج سطرًا جديدًا للإدخال متعدد الأسطر. (Windows Terminal يلتقط Alt+Enter — استخدم Ctrl+Enter بدلًا منه.)"
  t042: "Ctrl+C يقاطع الوكيل. اضغطه مرتين خلال ثانيتين لفرض الخروج."
  t043: "Ctrl+Z يعلّق Hermes في الخلفية — شغّل fg في shell للاستئناف."
  t044: "Tab يقبل النص الشبحي للاقتراح التلقائي أو يكمل أوامر / تلقائيًا."
  t045: "اكتب رسالة جديدة أثناء عمل الوكيل لمقاطعته وإعادة توجيهه."
  t046: "Alt+V يلصق صورة من الحافظة في المحادثة."
  t047: "لصق 5 أسطر أو أكثر يحفظها تلقائيًا في ملف ويدرج مرجعًا مختصرًا بدلًا منها."
  t048: "hermes -c يستأنف أحدث جلسة CLI لديك. وhermes -c \"project name\" يستأنف حسب العنوان."
  t049: "hermes -w ينشئ worktree معزولًا في git — مثالي لسير عمل الوكلاء المتوازي."
  t050: "hermes -w -q \"Fix issue #42\" يجمع بين عزل worktree واستعلام لمرة واحدة."
  t051: "hermes chat -t web,terminal يفعّل مجموعات أدوات محددة فقط لجلسة مركّزة."
  t052: "hermes chat -s github-pr-workflow يحمّل مهارة مسبقًا عند البدء."
  t053: "hermes chat -q \"query\" ينفّذ استعلامًا واحدًا غير تفاعلي ثم يخرج."
  t054: "hermes chat --max-turns 1000 يتجاوز الحد الافتراضي البالغ 500 تكرار لكل دور."
  t055: "hermes chat --checkpoints يفعّل لقطات نظام الملفات قبل كل تغيير مدمّر للملفات."
  t056: "hermes --yolo يتجاوز جميع مطالبات الموافقة على الأوامر الخطيرة طوال الجلسة."
  t057: "hermes chat --source telegram يضع وسمًا على الجلسة لتصفيتها في hermes sessions list."
  t058: "hermes -p work chat يعمل ضمن ملف تعريفي محدد دون تغيير ملفك الافتراضي."
  t059: "hermes doctor --fix يشخّص مشاكل الإعدادات والاعتماديات ويصلحها تلقائيًا."
  t060: "hermes dump يخرج ملخصًا مختصرًا لإعدادك — ممتاز لتقارير الأخطاء."
  t061: "hermes config set KEY VALUE يوجّه الأسرار تلقائيًا إلى .env وكل ما عداها إلى config.yaml."
  t062: "hermes config edit يفتح config.yaml في محرّرك الافتراضي."
  t063: "hermes config check يفحص خيارات الإعدادات المفقودة أو القديمة."
  t064: "hermes sessions browse يفتح منتقي جلسات تفاعليًا مع بحث."
  t065: "hermes sessions stats يعرض عدد الجلسات حسب المنصة وحجم قاعدة البيانات."
  t066: "hermes sessions prune --older-than 30 ينظّف الجلسات القديمة."
  t067: "hermes skills search react --source skills-sh يبحث في دليل skills.sh العام."
  t068: "hermes skills check يفحص مهارات المركز المثبّتة بحثًا عن تحديثات من المصدر."
  t069: "hermes skills tap add myorg/skills-repo يضيف مصدر مهارات مخصصًا من GitHub."
  t070: "hermes skills snapshot export setup.json يصدّر إعدادات مهاراتك للنسخ الاحتياطي أو المشاركة."
  t071: "hermes mcp add github --command npx يضيف خوادم MCP من سطر الأوامر."
  t072: "hermes mcp serve يشغّل Hermes نفسه كخادم MCP لوكلاء آخرين."
  t073: "hermes auth add يتيح لك إضافة عدة مفاتيح API للتناوب ضمن مجموعة بيانات الاعتماد."
  t074: "hermes completion bash >> ~/.bashrc يفعّل الإكمال بمفتاح Tab لجميع الأوامر والملفات التعريفية."
  t075: "hermes logs -f يتابع agent.log في الوقت الفعلي. و--level WARNING --since 1h يصفّي المخرجات."
  t076: "hermes backup ينشئ نسخة احتياطية مضغوطة (zip) لمجلد Hermes الرئيسي بالكامل."
  t077: "hermes profile create coder ينشئ ملفًا تعريفيًا معزولًا يصبح أمرًا مستقلًا بذاته."
  t078: "hermes profile create work --clone ينسخ إعداداتك ومفاتيحك الحالية إلى ملف تعريفي جديد."
  t079: "hermes update يزامن المهارات المضمّنة الجديدة مع جميع الملفات التعريفية تلقائيًا."
  t080: "hermes gateway install يثبّت Hermes كخدمة نظام (systemd/launchd)."
  t081: "hermes memory setup يتيح لك إعداد مزوّد ذاكرة خارجي (Honcho وMem0 وغيرهما)."
  t082: "hermes webhook subscribe ينشئ مسارات webhook مدفوعة بالأحداث مع التحقق عبر HMAC."
  t083: "وفّر المال: hermes tools يعطّل الأدوات غير المستخدمة، وhermes skills config يقلّص المهارات."
  t084: "/reasoning low أو /reasoning minimal يقلّل عمق التفكير دون الافتراضي (medium) — ردود أسرع وأقل تكلفة."
  t085: "hermes models يوجّه مهام الرؤية والضغط والمهام المساعدة إلى نماذج أقل تكلفة — يخفّض تكلفة رموز الخلفية بنسبة 85%+ دون التنازل عن نموذج المحادثة الرئيسي."
  t086: "اضبط display.bell_on_complete: true في config.yaml لتسمع جرسًا عند انتهاء المهام الطويلة."
  t087: "اضبط display.streaming: true لترى الرموز تظهر في الوقت الفعلي أثناء توليد النموذج لها."
  t088: "اضبط display.show_reasoning: true لتشاهد سلسلة استدلال النموذج."
  t089: "اضبط display.compact: true لتقليل الفراغات في المخرجات وعرض معلومات أكثر كثافة."
  t090: "اضبط display.busy_input_mode: queue لوضع الرسائل في قائمة الانتظار بدلًا من مقاطعة الوكيل، أو steer لإدراجها أثناء التشغيل عبر /steer."
  t091: "اضبط display.resume_display: minimal لتخطّي الملخص الكامل للمحادثة عند استئناف الجلسة."
  t092: "اضبط compression.threshold: 0.50 للتحكم في وقت تشغيل الضغط التلقائي (الافتراضي: 50% من السياق)."
  t093: "اضبط agent.max_turns: 1000 ليتمكن الوكيل من تنفيذ خطوات أكثر لاستدعاء الأدوات في كل دور."
  t094: "اضبط file_read_max_chars: 200000 لزيادة الحد الأقصى للمحتوى في كل استدعاء لـ read_file."
  t095: "اضبط approvals.mode: smart ليقوم نموذج لغوي بالموافقة تلقائيًا على الأوامر الآمنة ورفض الخطيرة منها."
  t096: "اضبط fallback_model في config.yaml للتحويل تلقائيًا إلى مزوّد احتياطي عند الفشل."
  t097: "اضبط privacy.redact_pii: true لتجزئة معرّفات المستخدمين وأرقام الهواتف قبل إرسالها إلى النموذج اللغوي."
  t098: "اضبط browser.record_sessions: true لتسجيل جلسات المتصفح تلقائيًا كمقاطع فيديو WebM."
  t099: "اضبط worktree: true في config.yaml لإنشاء git worktree دائمًا (مثل hermes -w)."
  t100: "اضبط security.website_blocklist.enabled: true لحظر نطاقات محددة من أدوات الويب."
  t101: "اضبط cron.wrap_response: false لتسليم مخرجات الوكيل الخام دون ترويسة أو تذييل المهمة المجدولة."
  t102: "يتجاوز HERMES_TIMEZONE المنطقة الزمنية للخادم باستخدام أي سلسلة منطقة زمنية بصيغة IANA."
  t103: "يدعم config.yaml استبدال متغيرات البيئة: استخدم الصيغة ${VAR_NAME}."
  t104: "الأوامر السريعة في config.yaml تشغّل أوامر shell فورًا دون استهلاك أي رموز."
  t105: "يمكنك تعريف شخصيات مخصصة في config.yaml تحت agent.personalities."
  t106: "يتحكّم provider_routing في ترتيب مزوّدي OpenRouter وقوائم السماح والحظر الخاصة بهم."
  t107: "تشغّل execute_code سكربتات Python تستدعي أدوات Hermes برمجيًا — وتبقى النتائج خارج السياق."
  t108: "تشغّل delegate_task حتى 10 وكلاء فرعيين متزامنين افتراضيًا (delegation.max_concurrent_children) بسياقات معزولة للعمل المتوازي."
  t109: "تعمل web_extract على روابط PDF — مرّر أي رابط PDF وستحوّله إلى markdown."
  t110: "تعتمد search_files على ripgrep وهي أسرع من grep — استخدمها بدلًا من grep في الطرفية."
  t111: "تستخدم patch 9 استراتيجيات مطابقة تقريبية، فلا تُفشِل فروقات المسافات الصغيرة تعديلاتك."
  t112: "تدعم patch صيغة V4A لتعديل عدة ملفات دفعة واحدة في استدعاء واحد."
  t113: "تقترح read_file أسماء ملفات مشابهة عندما لا يُعثر على الملف."
  t114: "تزيل read_file التكرار تلقائيًا — إعادة قراءة ملف لم يتغيّر تُرجع بديلًا مختصرًا خفيفًا."
  t115: "تلتقط browser_vision لقطة شاشة وتحلّلها بالذكاء الاصطناعي — تعمل مع رموز CAPTCHA والمحتوى المرئي."
  t116: "تستطيع browser_console تقييم تعبيرات JavaScript في سياق الصفحة."
  t117: "تنشئ image_generate الصور باستخدام FLUX 2 Pro مع تكبير تلقائي بمعدل 2x."
  t118: "تحوّل text_to_speech النص إلى صوت — ويُعرض كفقاعات صوتية على Telegram."
  t119: "تستطيع send_message الوصول إلى أي منصة مراسلة متصلة من داخل الجلسة."
  t120: "تساعد أداة todo الوكيل على متابعة المهام المعقّدة متعددة الخطوات أثناء الجلسة."
  t121: "تجري session_search بحثًا نصيًا كاملًا في جميع المحادثات السابقة."
  t122: "يحفظ الوكيل تلقائيًا التفضيلات والتصحيحات وحقائق البيئة في الذاكرة."
  t123: "يوجّه /moa مطالبة صعبة واحدة عبر مجموعة نماذج Mixture of Agents التي أعددتها."
  t124: "تدعم أوامر الطرفية وضع الخلفية مع notify_on_complete للمهام طويلة الأمد."
  t125: "تدعم عمليات الطرفية في الخلفية watch_patterns للتنبيه عند ظهور أسطر مخرجات محددة."
  t126: "تدعم أداة terminal ست بيئات تشغيل: local وDocker وSSH وModal وDaytona وSingularity."
  t127: "لكل ملف تعريفي إعداداته ومفاتيح API وذاكرته وجلساته ومهاراته ومهامه المجدولة الخاصة."
  t128: "تتحوّل أسماء الملفات التعريفية إلى أوامر shell — ينشئ 'hermes profile create coder' الأمر 'coder'."
  t129: "ينشئ hermes profile export coder -o backup.tar.gz أرشيفًا محمولًا للملف التعريفي."
  t130: "إذا تشارك ملفان تعريفيان رمز بوت واحدًا بالخطأ، تُحظر البوّابة الثانية مع رسالة خطأ واضحة."
  t131: "تولّد الجلسات عناوين وصفية تلقائيًا بعد أول تبادل — لا حاجة للتسمية اليدوية."
  t132: "تدعم عناوين الجلسات التسلسل: \"my project\" → \"my project #2\" → \"my project #3\"."
  t133: "عند الخروج، يطبع Hermes أمر استئناف يتضمن معرّف الجلسة وإحصاءاتها."
  t134: "يصدّر hermes sessions export backup.jsonl جميع الجلسات للنسخ الاحتياطي أو التحليل."
  t135: "يستأنف hermes -r SESSION_ID أي جلسة سابقة محددة عبر معرّفها."
  t136: "الذاكرة لقطة مجمّدة — تظهر التغييرات في موجّه النظام فقط عند بدء الجلسة التالية."
  t137: "تُفحص مدخلات الذاكرة تلقائيًا بحثًا عن أنماط حقن المطالبات وتسريب البيانات."
  t138: "للوكيل مخزنان للذاكرة: ملاحظات شخصية (~2200 حرف) وملف تعريف المستخدم (~1375 حرفًا)."
  t139: "التصحيحات التي تقدّمها للوكيل (\"لا، افعلها هكذا\") تُحفظ غالبًا في الذاكرة تلقائيًا."
  t140: "أكثر من 80 مهارة مضمّنة تغطي github وcreative وmlops وproductivity وresearch وغيرها."
  t141: "كل مهارة مثبّتة تصبح تلقائيًا أمر شرطة مائلة — اكتب / لعرضها كلها."
  t142: "يثبّت hermes skills install official/security/1password المهارات الاختيارية من المستودع."
  t143: "يمكن تقييد المهارات بأنظمة تشغيل محددة — بعضها يُحمَّل فقط على macOS أو Linux."
  t144: "يتيح لك skills.external_dirs في config.yaml تحميل المهارات من مجلدات مخصصة."
  t145: "يستطيع الوكيل إنشاء مهاراته الخاصة كذاكرة إجرائية باستخدام skill_manage."
  t146: "يكتب /plan خطة تنفيذ بصيغة markdown في .hermes/plans/ دون تنفيذ أي شيء."
  t147: "يمكن للمهام المجدولة إرفاق مهارات: hermes cron add --skill blogwatcher \"Check for new posts\"."
  t148: "تشمل وجهات تسليم المهام المجدولة telegram وdiscord وslack وemail وsms وأكثر من 12 منصة أخرى."
  t149: "إذا بدأت استجابة المهمة المجدولة بـ [SILENT]، يُمنع التسليم — مفيد لمهام المراقبة فقط."
  t150: "تدعم المهام المجدولة التأخيرات النسبية (30m) والفترات المتكررة (every 2h) وتعبيرات cron وطوابع زمنية بصيغة ISO."
  t151: "تعمل المهام المجدولة في جلسات وكيل جديدة تمامًا — يجب أن تكون المطالبات مكتفية بذاتها."
  t152: "يعمل وضع الصوت دون أي مفاتيح API إذا كان faster-whisper مثبّتًا (تحويل كلام إلى نص محلي مجاني)."
  t153: "خمسة مزوّدين لتحويل النص إلى كلام: Edge TTS (مجاني) وElevenLabs وOpenAI وNeuTTS (محلي مجاني) وMiniMax."
  t154: "يفعّل /voice on وضع الصوت في سطر الأوامر. ويبدّل Ctrl+B تسجيل اضغط-للتحدّث."
  t155: "يشغّل بث تحويل النص إلى كلام الجمل أثناء توليدها — فلا تنتظر الاستجابة الكاملة."
  t156: "تُنسخ الرسائل الصوتية على Telegram وDiscord وWhatsApp وSlack إلى نص تلقائيًا."
  t157: "يعمل Hermes على 21 منصة مراسلة: Telegram وDiscord وSlack وWhatsApp وSignal وMatrix وIRC وMicrosoft Teams والبريد الإلكتروني وغيرها."
  t158: "يثبّت hermes gateway install البوّابة كخدمة نظام تبدأ عند الإقلاع."
  t159: "يستخدم DingTalk وضع Stream — لا حاجة إلى webhooks أو عنوان URL عام."
  t160: "يجلب BlueBubbles خدمة iMessage إلى Hermes عبر خادم macOS محلي."
  t161: "تدعم مسارات webhook التحقق عبر HMAC وحدّ المعدّل وتصفية الأحداث."
  t162: "يوفّر خادم API نقطة نهاية متوافقة مع OpenAI تعمل مع Open WebUI وLibreChat."
  t163: "وضع القناة الصوتية في Discord: ينضم البوت إلى القناة الصوتية وينسخ الكلام ويردّ صوتيًا."
  t164: "يمنح group_sessions_per_user: true كل شخص جلسته الخاصة في المحادثات الجماعية."
  t165: "يحدّد /sethome محادثة كقناة رئيسية لتسليم المهام المجدولة."
  t166: "تدعم البوّابة مهلات تعتمد على الخمول — يمكن للوكلاء النشطين العمل بلا حدود."
  t167: "للموافقة على الأوامر الخطيرة 4 مستويات: مرة، الجلسة، دائمًا (قائمة سماح دائمة)، رفض."
  t168: "يستخدم وضع الموافقة الذكية نموذجًا لغويًا للموافقة تلقائيًا على الأوامر الآمنة وتمييز الخطيرة منها."
  t169: "تحظر حماية SSRF الشبكات الخاصة وعناوين loopback وlink-local وبيانات التعريف السحابية."
  t170: "يكشف فحص Tirith قبل التنفيذ تزييف عناوين URL بالحروف المتشابهة وأنماط التمرير إلى مفسّر."
  t171: "تتلقى عمليات MCP الفرعية بيئة مصفّاة — تمرّ متغيرات النظام الآمنة فقط."
  t172: "تُفحص ملفات السياق (.hermes.md وAGENTS.md) أمنيًا بحثًا عن حقن المطالبات قبل تحميلها."
  t173: "يوافق command_allowlist في config.yaml نهائيًا على أنماط محددة من أوامر shell."
  t174: "يُضغط السياق تلقائيًا عند بلوغه الحد — تُدفع الذكريات إلى الذاكرة ويُلخَّص السجل."
  t175: "يتحوّل لون شريط الحالة إلى الأصفر ثم البرتقالي ثم الأحمر كلما امتلأ السياق."
  t176: "SOUL.md هو ملف الهوية الأساسي للوكيل — خصّصه لتشكيل سلوكه."
  t177: "يحمّل Hermes سياق المشروع من .hermes.md أو AGENTS.md أو CLAUDE.md أو .cursorrules (أول تطابق)."
  t178: "تُكتشف ملفات AGENTS.md في المجلدات الفرعية تدريجيًا أثناء تنقّل الوكيل بين المجلدات."
  t179: "تُحدّ ملفات السياق بـ 20,000 حرف مع اقتطاع ذكي يحتفظ بالبداية والنهاية."
  t180: "خمسة مزوّدين للمتصفح: Chromium محلي وBrowserbase وBrowser Use وCamofox وFirecrawl."
  t181: "Camofox متصفح مقاوم للكشف — نسخة مشتقة من Firefox مع تزييف بصمة مكتوب بـ C++."
  t182: "تُرجع browser_navigate لقطة للصفحة تلقائيًا — لا حاجة لاستدعاء browser_snapshot بعدها."
  t183: "تضيف browser_vision مع annotate=true تسميات مرقّمة فوق العناصر التفاعلية."
  t184: "يفتح hermes mcp منتقيًا تفاعليًا لخوادم MCP المعتمدة من Nous يمكنك تثبيتها بضغطة مفتاح واحدة."
  t185: "يعرض hermes mcp catalog خوادم MCP المعتمدة من Nous والمرفقة مع المستودع."
  t186: "يثبّت hermes mcp install <name> مدخلًا من الفهرس، ويطلب بيانات الاعتماد، ويتيح لك اختيار الأدوات المفعّلة منه."
  t187: "تُضبط خوادم MCP في config.yaml — مع دعم وسيلتي النقل stdio وHTTP."
  t188: "تصفية الأدوات لكل خادم: tools.include يسمح بأدوات محددة، وtools.exclude يحظرها."
  t189: "تولّد خوادم MCP مجموعات أدوات تلقائيًا وقت التشغيل — ويمكن لـ hermes tools تبديلها لكل منصة."
  t190: "دعم OAuth في MCP: يفعّل auth: oauth التفويض عبر المتصفح باستخدام PKCE."
  t191: "لا تُكلّف نقاط الحفظ أي عبء عندما لا تُعدَّل ملفات — وهي مفعّلة افتراضيًا."
  t192: "تُحفظ لقطة تلقائيًا قبل كل تراجع، لتتمكن من التراجع عن التراجع نفسه."
  t193: "يتراجع /rollback أيضًا عن دور المحادثة، فلا يتذكر الوكيل التغييرات التي تم التراجع عنها."
  t194: "تستخدم نقاط الحفظ مستودعات ظل في ~/.hermes/checkpoints/ — ولا يُمسّ مجلد .git في مشروعك أبدًا."
  t195: "يعالج batch_runner.py مئات المطالبات بالتوازي لتوليد بيانات التدريب."
  t196: "يفعّل hermes chat -Q الوضع الصامت للاستخدام البرمجي — يخفي الشعار ومؤشر الانتظار."
  t197: "يسجّل حفظ المسارات (--save-trajectories) آثار استخدام الأدوات كاملةً لتدريب النماذج."
  t198: "ثلاثة أنواع من الإضافات: عامة (أدوات/خطافات)، ومزوّدو الذاكرة، ومحرّكات السياق."
  t199: "يثبّت hermes plugins install owner/repo الإضافات مباشرة من GitHub."
  t200: "مزوّدو الذاكرة الخارجيون: Honcho وOpenViking وMem0 مضمّنون؛ وHindsight وغيره عبر hermes plugins install."
  t201: "تشمل خطافات الإضافات pre/post_tool_call وpre/post_llm_call وtransform_terminal_output لتوحيد شكل المخرجات."
  t202: "يقلّل تخزين المطالبات مؤقتًا (Anthropic) التكاليف بإعادة استخدام بادئات موجّه النظام المخزّنة."
  t203: "يولّد الوكيل عناوين الجلسات تلقائيًا في خيط خلفي — دون أي تأثير على زمن الاستجابة."
  t204: "يستطيع التوجيه الذكي للنماذج تحويل الاستفسارات البسيطة تلقائيًا إلى نموذج أقل تكلفة."
  t205: "تدعم أوامر الشرطة المائلة مطابقة البادئة: /h يعني /help، و/mod يعني /model."
  t206: "سحب مسار ملف إلى الطرفية يرفق الصور تلقائيًا أو يرسل الملف كسياق."
  t207: "يسرد ملف .worktreeinclude في جذر مستودعك الملفات المتجاهلة في git التي تُنسخ إلى worktrees."
  t208: "يشغّل hermes acp نظام Hermes كخادم ACP للتكامل مع VS Code وZed وJetBrains."
  t209: "المزوّدون المخصصون: احفظ نقاط نهاية مسمّاة في config.yaml تحت custom_providers."
  t210: "يحقن HERMES_EPHEMERAL_SYSTEM_PROMPT موجّه نظام لا يُحفظ في السجل أبدًا."
  t211: "يدعم credential_pool_strategies استراتيجيات التدوير fill_first وround_robin وleast_used وrandom."
  t212: "يضبط hermes auth add nous أو hermes auth add openai-codex المزوّدين المعتمدين على OAuth."
  t213: "يدعم خادم API كلًّا من Chat Completions وResponses API مع حالة محفوظة على جانب الخادم."
  t214: "يعرض tool_preview_length: 0 في الإعدادات مسارات الملفات كاملةً في شريط نشاط مؤشر الانتظار."
  t215: "يشغّل hermes status --deep فحوصات تشخيصية أعمق عبر جميع المكوّنات."
  t216: "يمكن للمهام المجدولة إرفاق سكربت Python (--script) تُحقن مخرجاته القياسية في المطالبة كسياق."
  t217: "تُحفظ سكربتات المهام المجدولة في ~/.hermes/scripts/ وتعمل قبل الوكيل — مثالية لخطوط جمع البيانات."
  t218: "يحقن prefill_messages_file في config.yaml أمثلة few-shot في كل استدعاء API، دون حفظها في السجل أبدًا."
  t219: "يحلّ SOUL.md بالكامل محل الهوية الافتراضية للوكيل — أعد كتابته لتجعل Hermes خاصًا بك."
  t220: "يُملأ SOUL.md تلقائيًا بشخصية افتراضية عند أول تشغيل. عدّله لتخصيصه."
  t221: "يخصّص /compress <focus topic> 60-70% من ميزانية الملخص لموضوعك ويقلّص الباقي بقوة."
  t222: "في الضغط الثاني وما بعده، يحدّث الضاغط الملخص السابق بدلًا من البدء من الصفر."
  t223: "قبل إعادة ضبط جلسة البوّابة، يدفع Hermes الحقائق المهمة إلى الذاكرة تلقائيًا في الخلفية."
  t224: "يعالج network.force_ipv4: true في config.yaml التجمّد على الخوادم ذات IPv6 المعطوب — عبر تعديل socket أثناء التشغيل."
  t225: "تشرح أداة terminal رموز الخروج الشائعة: إرجاع grep للقيمة 1 = 'لا توجد نتائج (ليس خطأ)'."
  t226: "تُعاد محاولة أوامر الطرفية الأمامية الفاشلة تلقائيًا حتى 3 مرات بتراجع أُسّي (2 ثانية، 4 ثوانٍ، 8 ثوانٍ)."
  t227: "تُعاد كتابة أوامر sudo المجردة تلقائيًا لتمرير SUDO_PASSWORD من .env — دون الحاجة إلى مطالبة تفاعلية."
  t228: "تتطلب أدوات execute_code المساعدة استيرادًا صريحًا: from hermes_tools import json_parse, shell_quote, retry."
  t229: "تستخدم أدوات execute_code السبع المعزولة (web_search وterminal وread/write/search/patch) استدعاءات RPC — ولا تدخل السياق أبدًا."
  t230: "قراءة نفس الجزء من الملف 3 مرات أو أكثر تُطلق تحذيرًا. وعند 4 مرات أو أكثر تُحظر نهائيًا لمنع الحلقات."
  t231: "تكشف write_file وpatch إن عُدّل الملف خارجيًا منذ آخر قراءة وتحذّر من أن النسخة قديمة."
  t232: "تدعم صيغة V4A للتعديل توجيهات Add File وDelete File وMove File — وليس Update فقط."
  t233: "يمكن لخوادم MCP طلب إكمالات من النموذج اللغوي عبر أخذ العينات — فيصبح الوكيل أداةً للخادم."
  t234: "ترسل خوادم MCP إشعار notifications/tools/list_changed لإعادة تسجيل الأدوات تلقائيًا دون إعادة التشغيل."
  t235: "تشغّل delegate_task مع acp_command: 'claude' أداة Claude Code كوكيل تابع من أي منصة."
  t236: "للتفويض خيط نبض — ينتقل نشاط الوكيل التابع إلى الأصل، مما يمنع انتهاء مهلة البوّابة."
  t237: "عندما يُرجع مزوّد HTTP 402 (مطلوب الدفع)، يتحوّل العميل المساعد تلقائيًا إلى المزوّد التالي."
  t238: "يوجّه agent.tool_use_enforcement النماذج التي تصف الإجراءات بدلًا من استدعاء الأدوات — تلقائي لنماذج GPT/Codex."
  t239: "يتيح agent.restart_after_turn_timeout للأدوار الجارية أن تنتهي قبل أن يدخل /restart في stop()؛ أما restart_drain_timeout فهو مجرد ميزانية القطع القسري بعد بدء stop()."
  t240: "يحدّد agent.api_max_retries (افتراضيًا 3) عدد مرات إعادة محاولة استدعاء API الفاشل قبل إظهار الخطأ — قلّله للتحويل السريع إلى البديل."
  t241: "تخزّن البوّابة مثيلات AIAgent مؤقتًا لكل جلسة — وتدمير هذه الذاكرة المؤقتة يعطّل تخزين مطالبات Anthropic المؤقت."
  t242: "يمكن لأي موقع ويب عرض مهارات عبر /.well-known/skills/index.json — ويكتشفها مركز المهارات تلقائيًا."
  t243: "يتتبّع سجل تدقيق المهارات في ~/.hermes/skills/.hub/audit.log كل عملية تثبيت وإزالة."
  t244: "تُنظَّف worktrees القديمة في git تلقائيًا عند البدء: تُحذف الأشجار النظيفة المدمجة بالكامل؛ ويُحفظ دائمًا أي عمل غير مكتمل أو غير مدفوع."
  t245: "تحدّد الملفات التعريفية نطاق حالة Hermes عبر HERMES_HOME؛ وتحتفظ عمليات الأدوات الفرعية على المضيف بـ HOME الحقيقي ما لم يكن terminal.home_mode هو profile."
  t246: "يضبط متغير البيئة HERMES_HOME_MODE (ثماني، مثل 0701) صلاحيات مخصصة للمجلد لتمكين خادم الويب من عبوره."
  t247: "وضع الحاوية: ضع .container-mode في HERMES_HOME وسينفّذ سطر أوامر المضيف نفسه تلقائيًا داخل الحاوية."
  t248: "لـ Ctrl+C خمسة مستويات أولوية: إلغاء التسجيل ← إلغاء المطالبات ← إلغاء المنتقي ← قطع الوكيل ← الخروج."
  t249: "يُسجَّل كل قطع أثناء تشغيل الوكيل في ~/.hermes/interrupt_debug.log مع الطوابع الزمنية."
  t250: "يربط BROWSER_CDP_URL أدوات المتصفح بأي متصفح قيد التشغيل من عائلة Chromium — ويقبل WebSocket أو HTTP أو host:port."
  t251: "يفعّل BROWSERBASE_ADVANCED_STEALTH=true مقاومة كشف متقدمة مع Chromium مخصص (خطة Scale)."
  t252: "يتحوّل سطر الأوامر تلقائيًا إلى الوضع المدمج في الطرفيات الأضيق من 80 عمودًا."
  t253: "تدعم الأوامر السريعة نوعين: exec (تشغيل أمر shell مباشرة) وalias (التحويل إلى أمر آخر)."
  t254: "نموذج تفويض لكل مهمة: يوجّه delegation.model وdelegation.provider في الإعدادات الوكلاء الفرعيين إلى نماذج أقل تكلفة."
  t255: "يتحكّم delegation.reasoning_effort بشكل مستقل في عمق التفكير للوكلاء الفرعيين."
  t256: "يتيح display.platforms في config.yaml تجاوزات عرض لكل منصة: {telegram: {tool_progress: all}}."
  t257: "يحاكي human_delay.mode في الإعدادات سرعة الكتابة البشرية — بنطاق min_ms/max_ms قابل للضبط."
  t258: "تعمل ترحيلات إصدار الإعدادات تلقائيًا عند التحميل — تظهر مفاتيح الإعدادات الجديدة دون تدخل يدوي."
  t259: "تحصل نماذج GPT وCodex على إرشادات خاصة في موجّه النظام لانضباط الأدوات واستخدامها الإلزامي."
  t260: "تحصل نماذج Gemini على توجيهات مخصصة للمسارات المطلقة واستدعاءات الأدوات المتوازية والأوامر غير التفاعلية."
  t261: "يمكن ضبط context.engine في config.yaml على اسم إضافة لاستخدام استراتيجيات بديلة لإدارة السياق."
  t262: "تُقتطع لقطات صفحات المتصفح التي تتجاوز 15,000 حرف أو تُلخَّص تلقائيًا؛ وتُحفظ اللقطة الكاملة في cache/web لتصفّحها عبر read_file."
  t263: "يجري الضاغط تمريرة أولية منخفضة التكلفة: تُستبدل مخرجات الأدوات التي تتجاوز 200 حرف بعناصر نائبة قبل تشغيل النموذج اللغوي."
  t264: "عند فشل الضغط، تُعلَّق المحاولات التالية لمدة 10 دقائق لتجنّب إغراق API بالطلبات."
  t265: "تحصل الأوامر الخطيرة الطويلة (>70 حرفًا) على خيار 'view' في مطالبة الموافقة لعرض النص الكامل أولًا."
  t266: "يعرض مؤشر مستوى الصوت أشرطة ▁▂▃▄▅▆▇ أثناء التسجيل الصوتي بحسب مستويات RMS للميكروفون."
  t267: "لا يمكن أن تتعارض أسماء الملفات التعريفية مع البرامج الموجودة في PATH — فسيُرفض 'hermes profile create ls'."
  t268: "ينسخ hermes profile create backup --clone-all كل شيء (الإعدادات والمفاتيح وSOUL.md والذكريات والمهارات والجلسات)."
  t269: "مفتاح التسجيل الصوتي قابل للضبط عبر voice.record_key في config.yaml — وليس Ctrl+B فقط."
  t270: "تُكتشف ملفات .cursorrules و.cursor/rules/*.mdc تلقائيًا وتُحمَّل كسياق للمشروع."
  t271: "تكشف ملفات السياق أكثر من 10 أنماط لحقن المطالبات — يونيكود غير مرئي، و'تجاهل التعليمات'، ومحاولات التسريب."
  t272: "تستخدم نماذج GPT-5 وCodex الدور 'developer' بدلًا من 'system' في صيغة الرسائل."
  t273: "تجاوزات مساعدة لكل مهمة: auxiliary.vision.provider وauxiliary.compression.model وغيرها في config.yaml."
  t274: "يعامل العميل المساعد 'main' كاسم بديل للمزوّد — يُحلّ إلى مزوّدك الأساسي الفعلي ونموذجه."
  t275: "يعرض hermes claw migrate --dry-run معاينة لترحيل OpenClaw دون كتابة أي شيء."
  t276: "تُعالج مسارات الملفات الملصقة بعلامات اقتباس أو مسافات مهرّبة تلقائيًا — دون تنظيف يدوي."
  t277: "لا تُطلق أوامر الشرطة المائلة أبدًا طيّ اللصق الكبير — يعمل /command مع الوسائط الكبيرة بشكل صحيح."
  t278: "في وضع القطع، تتجاوز أوامر الشرطة المائلة المكتوبة أثناء تنفيذ الوكيل منطق القطع وتعمل فورًا."
  t279: "يتجاوز HERMES_DEV=1 اكتشاف وضع الحاوية لأغراض التطوير المحلي."
  t280: "يحصل كل خادم MCP على مجموعة أدوات خاصة به (mcp-servername) يمكن تبديلها بشكل مستقل عبر hermes tools."
  t281: "تُحلّ عناصر ${ENV_VAR} النائبة لـ MCP في الإعدادات عند تشغيل الخادم — بما فيها المتغيرات من ~/.hermes/.env."
  t282: "تحصل المهارات من المستودعات الموثوقة (NousResearch) على مستوى الأمان 'trusted'؛ وتخضع مهارات المجتمع لفحص إضافي."
  t283: "يحتفظ حجر المهارات في ~/.hermes/skills/.hub/quarantine/ بالمهارات المنتظرة للمراجعة الأمنية."
  t284: "يحقن /steer <prompt> ملاحظة بعد استدعاء الأداة التالي — لتوجيه المسار أثناء المهمة دون قطعها."
  t285: "يحدّد /goal <text> هدفًا دائمًا بأسلوب حلقة Ralph — يواصل Hermes تلقائيًا دورًا بعد دور حتى يقرّر حَكَم أن العمل تم."
  t286: "/snapshot create [label] يحفظ لقطة كاملة لحالة إعدادات Hermes؛ ويُعيدها لاحقًا /snapshot restore <id>."
  t287: "/copy [N] ينسخ آخر رد للمساعد إلى الحافظة، أو الرد رقم N من النهاية إذا حددت رقمًا."
  t288: "/redraw يُعيد رسم الواجهة بالكامل لإصلاح انحراف الطرفية بعد تغيير حجم tmux أو آثار التحديد بالفأرة."
  t289: "/agents (الاسم البديل /tasks) يعرض الوكلاء النشطين والمهام العاملة في الخلفية عبر الجلسة الحالية."
  t290: "/footer يبدّل تذييل البوّابة في الردود النهائية الذي يعرض النموذج ونسبة السياق ومجلد العمل الحالي."
  t291: "/busy queue|steer|interrupt يحدد ما يفعله الضغط على Enter بينما Hermes يعمل."
  t292: "/topic في رسائل Telegram الخاصة يفعّل وضع المواضيع متعدد الجلسات الذي يديره المستخدم — و/topic <id> يستعيد جلسات سابقة في مكانها."
  t293: "/approve session|always يشغّل أمرًا خطيرًا قيد الانتظار بنطاق الثقة الذي تختاره؛ و/deny يرفضه."
  t294: "/restart يُعيد تشغيل البوّابة بسلاسة بعد إنهاء التشغيلات النشطة، ثم يُخطر مَن طلب ذلك عند العودة."
  t295: "/kanban boards switch <slug> يغيّر لوحة كانبان النشطة متعددة المشاريع من داخل المحادثة."
  t296: "/reload يُعيد تحميل ~/.hermes/.env في الجلسة الجارية — التقط مفاتيح API الجديدة دون إعادة التشغيل."
  t297: "مهمة مجدولة بـ no_agent=True تشغّل سكربتًا وفق الجدول وترسل مخرجاته stdout مباشرة — بلا رموز وبلا LLM."
  t298: "إذا كانت مخرجات stdout لسكربت المهمة المجدولة فارغة فهذه دقة صامتة — لا يُرسل شيء، وهو مثالي لمراقبة العتبات."
  t299: "HERMES_CRON_MAX_PARALLEL (الافتراضي 4) يحدّ عدد المهام المجدولة التي تعمل في كل دقة كي لا تُشبع الدفعات مفاتيحك."
  t300: "خطافات البوّابة توجد تحت ~/.hermes/hooks/<name>/ مع HOOK.yaml و handler.py — ويجب أن يُسمّى المعالج `handle`."
  t301: "تشمل أحداث الخطافات gateway:startup و session:start و agent:step واشتراكات البدل command:*."
  t302: "ضع قائمة تحقق في ~/.hermes/BOOT.md وسيشغّلها خطاف gateway:startup كوكيل لمرة واحدة عند كل إقلاع."
  t303: "hermes curator run --dry-run يعرض معاينة لما سيؤرشفه المنسّق أو يدمجه دون تغيير أي شيء."
  t304: "hermes curator pin <skill> يحصّن مهارة ضد الأرشفة التلقائية وضد أداة skill_manage الخاصة بالوكيل معًا."
  t305: "hermes curator rollback يستعيد المهارات من لقطة سابقة للتشغيل — النسخ الاحتياطية تحت skills/.curator_backups/."
  t306: "hermes auth reset <provider> [target] يمسح فترات التهدئة وعلامات النفاد عن مجمّع اعتمادات كامل، أو عن اعتماد واحد بالفهرس أو المعرّف أو التسمية."
  t307: "credential_pool_strategies.<provider>: round_robin يدوّر المفاتيح بالتساوي بدلًا من الافتراضي fill_first."
  t308: "use_gateway: true لكل أداة يوجّه web أو image أو tts أو browser عبر اشتراكك في Nous — دون مفاتيح إضافية."
  t309: "provider_routing.data_collection: deny يستثني المزوّدين الذين يخزّنون البيانات على OpenRouter."
  t310: "provider_routing.require_parameters: true يوجّه فقط إلى المزوّدين الذين يدعمون كل معامل في طلبك."
  t311: "HERMES_TUI_RESUME=1 يُعيد الاتصال تلقائيًا بأحدث جلسة TUI عند الإطلاق — مفيد بعد انقطاع SSH."
  t312: "HERMES_TUI_THEME=light|dark|<hex> يفرض سمة TUI على الطرفيات التي لا تضبط COLORFGBG."
  t313: "Ctrl+G أو Ctrl+X Ctrl+E في TUI يفتح مخزن الإدخال في $EDITOR للمطالبات الطويلة متعددة الأسطر."
  t314: "يعرض TUI صيغ LaTeX في السطر — يصبح $E=mc^2$ رموزًا رياضية بـ Unicode بدلًا من TeX الخام."
  t315: "hermes dashboard يشغّل واجهة ويب محلية على 127.0.0.1:9119 — لا تخرج أي بيانات من localhost."
  t316: "hermes dashboard يضمّن واجهة Hermes TUI كاملة في متصفحك عبر xterm.js وطرفية PTY فوق WebSocket."
  t317: "ضع ملف YAML في ~/.hermes/dashboard-themes/ بلونَي لوحة اثنين لتغيير مظهر لوحة التحكم بالكامل."
  t318: "إضافات لوحة التحكم تعمل بمجرد وضعها: manifest.json + حزمة JS في ~/.hermes/dashboard-plugins/ — دون الحاجة إلى بناء npm."
  t319: "layoutVariant: cockpit في سمة لوحة التحكم يضيف شريطًا أيسر بعرض 260px يمكن للإضافات ملؤه عبر فتحة sidebar."
  t320: "display.tool_progress_command: true يتيح /verbose على منصات المراسلة؛ وهو مقصور على CLI افتراضيًا."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result يُخطرك فقط عند انتهاء مهام الخلفية (مقابل concise/all/error/off)."
  t322: "HERMES_WRITE_SAFE_ROOT يقيّد write_file/patch ببادئات مجلدات محددة؛ ويمكن تحديد عدة مسارات مفصولة بـ os.pathsep (: أو ;)."
  t323: "HERMES_IGNORE_RULES يتخطى الحقن التلقائي لملفات AGENTS.md و SOUL.md و .cursorrules والذاكرة والمهارات المحمّلة مسبقًا."
  t324: "HERMES_ACCEPT_HOOKS يوافق تلقائيًا على خطافات shell غير المعروفة المعلنة في config.yaml دون مطالبة في TTY."
  t325: "auxiliary.goal_judge.model يوجّه حكم /goal إلى نموذج سريع ورخيص لإبقاء تكلفة الحلقة قريبة من الصفر."
  t326: "تتخطى نقاط الحفظ المجلدات التي تحوي أكثر من 50,000 ملف لتجنّب عمليات git البطيئة في المستودعات الضخمة."
  t327: "tts.provider: piper يشغّل تحويل النص إلى كلام محليًا على المعالج بـ 44 لغة — تُنزَّل الأصوات تلقائيًا إلى ~/.hermes/cache/piper-voices/."
  t328: "tts.providers.<name>.type: command يربط أي محرك TTS بسطر الأوامر باستخدام العنصرَين {input_path} و {output_path}."
  t329: "API_SERVER_ENABLED=true يشغّل نقطة نهاية متوافقة مع OpenAI بجانب البوّابة لاستخدامها مع Open WebUI و LibreChat."
  t330: "GATEWAY_PROXY_URL يشغّل إعدادًا مقسومًا: إدخال/إخراج المنصات محليًا، وعمل الوكيل مفوّض إلى خادم API بعيد."
  t331: "MATRIX_DEVICE_ID يثبّت معرّف جهاز مستقرًا للتشفير E2EE — بدونه تتبدّل المفاتيح عند كل بدء ويتعطل فك تشفير الرسائل السابقة."
  t332: "TELEGRAM_WEBHOOK_SECRET مطلوب كلما ضُبط TELEGRAM_WEBHOOK_URL — أنشئه بـ openssl rand -hex 32."
  t333: "batch_runner.py --resume يطابق المطالبات المكتملة بنصّها كي لا تُعاد الأعمال المنتهية عند إعادة ترتيب مجموعة البيانات."
  t334: "/new يبدأ جلسة جديدة في مكانها (الاسم البديل /reset) — معرّف جلسة جديد وسجل نظيف مع بقاء CLI مفتوحًا."
  t335: "/clear يمسح شاشة الطرفية ويبدأ جلسة جديدة معًا — اختصار واحد لإعادة ضبط بصرية."
  t336: "/history يطبع المحادثة الحالية في السطر دون مغادرة CLI — مفيد لإعادة قراءة سريعة."
  t337: "/save يكتب المحادثة الحالية إلى القرص دون إنهاء الجلسة."
  t338: "/status يعرض معلومات الجلسة بلمحة: المعرّف والعنوان والنموذج واستخدام الرموز والوقت المنقضي."
  t339: "/image <path> يرفق ملف صورة محلي بمطالبتك التالية دون لصق أو سحب وإفلات."
  t340: "/platforms يعرض حالة اتصال البوّابة ومنصات المراسلة من داخل المحادثة مباشرة."
  t341: "/commands يعرض القائمة الكاملة لأوامر الشرطة المائلة والمهارات المثبّتة على صفحات — مفيد على المنصات التي لا تدعم الإكمال بـ Tab."
  t342: "/toolsets يسرد كل مجموعات الأدوات المتاحة لتعرف ما يقبله -t/--toolsets."
  t343: "/voice tts يبدّل وضع TTS فقط — يرد الوكيل بصوت مسموع بينما تظل تكتب مطالباتك."
  t344: "/reload-skills يُعيد فحص ~/.hermes/skills/ لتظهر المهارات المضافة دون إعادة تشغيل الجلسة."
  t345: "/indicator kaomoji|emoji|unicode|ascii يختار نمط مؤشر الانشغال في TUI الذي يظهر أثناء عمل الوكيل."
  t346: "/debug يرفع حزمة دعم (معلومات النظام + السجلات) ويعيد روابط قابلة للمشاركة — يعمل في المحادثة أيضًا."
  t347: "hermes -z \"<prompt>\" هو أنقى تشغيل لمرة واحدة: الإجابة النهائية على stdout ولا شيء غيرها — مثالي للتمرير في السكربتات."
  t348: "hermes chat --pass-session-id يحقن معرّف الجلسة في موجّه النظام ليتمكن الوكيل من الإشارة إليه."
  t349: "hermes chat --image path/to/pic.png يرفق صورة محلية باستعلام -q واحد دون خطوة رفع منفصلة."
  t350: "hermes chat --ignore-user-config يتخطى إعدادات المستخدم النشطة — لتقارير أخطاء قابلة للتكرار وتشغيلات CI."
  t351: "hermes chat --source tool يعلّم المحادثات البرمجية كي لا تزدحم بها قائمة hermes sessions list."
  t352: "hermes dump --show-keys يضمّن بصمات مفاتيح API المحجوبة لتصحيح أخطاء أعمق مع الدعم."
  t353: "hermes sessions rename <ID> \"new title\" يُعيد تسمية أي جلسة سابقة؛ و hermes sessions delete <ID> يحذف واحدة."
  t354: "hermes import يستعيد نسخة احتياطية كاملة لـ Hermes بصيغة zip؛ وتُستورد تصديرات الجلسات JSON/JSONL من صفحة Sessions في لوحة التحكم."
  t355: "hermes fallback يدير سلسلة fallback_model تفاعليًا — دون تحرير config.yaml يدويًا."
  t356: "hermes pairing يدوّر رمز اقتران الرسائل الخاصة — وأول مَن يرسل رسالة بعد التدوير يحصل على الوصول إلى البوت."
  t357: "hermes setup يرشد المستخدمين الجدد عبر إعداد المزوّد والمفاتيح وربط المنصات في مسار تفاعلي واحد."
  t358: "hermes status --deep يجري فحص الصحة الكامل لكل مكوّن؛ أما hermes status العادي فهو العرض السريع."
  t359: "HERMES_AGENT_TIMEOUT=0 يعطّل إيقاف البوّابة للوكيل العامل بسبب الخمول — استخدمه لتشغيلات البحث الطويلة."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 يحمّل تلقائيًا الإضافات المحلية للمستودع من ./.hermes/plugins/ — مع بوابة ثقة بحكم التصميم."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 يعطّل حارس 'تغيّر الملف منذ قراءتك له' في patch و write_file."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true يتيح لأدوات الويب الوصول إلى localhost والشبكات الخاصة — معطّل افتراضيًا في وضع البوّابة."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 يثبّت تلقائيًا مهارات إضافية من الكتالوج الاختياري عند أول تشغيل لكل ملف تعريفي."
  t364: "HERMES_BUNDLED_SKILLS يشير إلى شجرة مهارات مضمّنة مخصصة — تستخدمه حزم Homebrew و Nix."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 يطبع حمولة كل طلب API إلى stdout بدلًا من ملفات السجل."
  t366: "HERMES_OAUTH_TRACE=1 يسجّل محاولات تبادل وتجديد رموز OAuth (محجوبة) لتصحيح أخطاء مصادقة المزوّد."
  t367: "HERMES_STREAM_RETRIES (الافتراضي 3) يحدد عدد محاولات إعادة الاتصال أثناء البث عند أخطاء الشبكة العابرة."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false يُسكت رسائل الإقرار ⚡/⏳/⏩ عندما يراسل مستخدم وكيلًا مشغولًا."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (الافتراضي 180s) يحدد كم مرة تُخطرك البوّابة بالتقدم في الأدوار الطويلة."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (الافتراضي 900s) يحدّ المدة التي ينتظرها /restart للتشغيلات الجارية قبل الإنهاء القسري."
  t371: "HERMES_CHECKPOINT_TIMEOUT (الافتراضي 30s) يحدّ مدة إنشاء نقطة حفظ لنظام الملفات — ارفعه في المستودعات الضخمة."
  t372: "image_gen.model في config.yaml يختار نموذج FAL: flux-2/klein أو gpt-image-2 أو nano-banana-pro وغيرها."
  t373: "image_gen.provider يوجّه توليد الصور عبر إضافة (OpenAI Images أو Codex أو FAL) بدلًا من الافتراضي."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY يوجّهان تحليل الرؤية إلى أي نقطة نهاية متوافقة مع OpenAI."
  t375: "security.tirith_fail_open: false يجعل Hermes يحظر الأوامر عندما يتعطل فاحص tirith نفسه."
  t376: "متغير البيئة TIRITH_FAIL_OPEN يتجاوز إعداد tirith_fail_open — تبديل سريع دون تحرير config.yaml."
  t377: "المحادثات ذات --source tool مستثناة من hermes sessions list افتراضيًا — حدد --source صراحةً لعرضها."
  t378: "معرّفات الجلسات تبدأ بطابع زمني (20250305_091523_abcd) كي يعمل الترتيب طبيعيًا في ls و jq."
  t379: "API_SERVER_MODEL_NAME يخصص اسم النموذج في /v1/models — ضروري لإعدادات Open WebUI متعددة الملفات التعريفية."
  t380: "تُقدَّم إضافات لوحة التحكم من /dashboard-plugins/<name>/ — ضع الملفات في ~/.hermes/dashboard-plugins/."
  placeholder:
    p01: "اسأل أي شيء، أو اكتب / للأوامر…"
    p02: "لخّص محتوى هذا المجلد"
    p03: "اكتب مسودة رد على آخر بريد في صندوق الوارد"
    p04: "خطّط لميزة ثم ابنِها خطوة بخطوة"
    p05: "اعثر على اختبار فاشل وأصلحه"
    p06: "ابحث في هذا الموضوع واكتب لي ملخصًا"
    p07: "ما الذي تغيّر في هذا المستودع مؤخرًا؟"
    p08: "حوّل هذه الملاحظات إلى قائمة مهام"
    p09: "اشرح هذا الخطأ وكيفية إصلاحه"
    p10: "اضبط تذكيرًا أو جدولة مهمة متكررة"
    p11: "اكتب / لاستعراض الأوامر، أو Ctrl+P للوحة الأوامر"
