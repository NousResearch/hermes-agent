tips:
  t001: "/bg <prompt> spustí úlohu v samostatné relaci, zatímco ta vaše zůstává volná; /btw <question> zodpoví doplňující dotaz k této konverzaci, aniž by ji přerušil."
  t002: "/branch rozvětví aktuální relaci, abyste mohli prozkoumat jiný směr, aniž byste ztratili dosavadní postup."
  t003: "/compress ručně zkomprimuje kontext konverzace, když začne být příliš dlouhý."
  t004: "/rollback vypíše kontrolní body souborového systému — obnovte soubory, které agent změnil, do libovolného předchozího stavu."
  t005: "/rollback diff 2 zobrazí náhled toho, co se od kontrolního bodu 2 změnilo, aniž by cokoli obnovil."
  t006: "/rollback 2 src/file.py obnoví jeden soubor z konkrétního kontrolního bodu."
  t007: "/title \"můj projekt\" pojmenuje vaši relaci — později ji obnovte pomocí /resume nebo hermes -c."
  t008: "/resume naváže tam, kde jste skončili v dříve pojmenované relaci."
  t009: "/queue <prompt> zařadí zprávu do fronty pro další tah, aniž by přerušil aktuální."
  t010: "/undo odebere z konverzace poslední výměnu uživatele/asistenta."
  t011: "/retry znovu odešle vaši poslední zprávu — užitečné, když odpověď agenta nebyla úplně správná."
  t012: "/verbose přepíná zobrazení průběhu nástrojů: off → new → all → verbose."
  t013: "/reasoning high zvyšuje hloubku uvažování modelu. /reasoning show zobrazí uvažování."
  t014: "/fast přepíná prioritní zpracování pro rychlejší odpovědi API (závisí na poskytovateli)."
  t015: "/yolo přeskočí všechny výzvy ke schválení nebezpečných příkazů pro zbytek relace."
  t016: "/model vám umožní přepnout model uprostřed relace — zkuste /model sonnet nebo /model gpt-5."
  t017: "/model --global trvale změní váš výchozí model."
  t018: "/personality pirate nastaví zábavnou osobnost — 14 vestavěných možností od kawaii po shakespeare."
  t019: "/skin změní téma CLI — zkuste ares, mono, slate, poseidon nebo charizard."
  t020: "/statusbar přepíná trvalý pruh zobrazující model, tokeny, % zaplnění kontextu, náklady a trvání."
  t021: "/tools disable browser dočasně odebere nástroje prohlížeče pro aktuální relaci."
  t022: "/browser connect připojí nástroje prohlížeče k vašemu běžícímu prohlížeči z rodiny Chromium přes CDP."
  t023: "/plugins vypíše nainstalované pluginy a jejich stav."
  t024: "/cron spravuje naplánované úlohy — nastavte opakující se výzvy s doručením na libovolnou platformu."
  t025: "/reload-mcp za běhu znovu načte konfiguraci serveru MCP bez restartu."
  t026: "/usage zobrazí využití tokenů, rozpis nákladů a trvání relace."
  t027: "/insights zobrazí analytiku využití za posledních 30 dní."
  t028: "/paste zkontroluje schránku, zda neobsahuje obrázek, a připojí jej k vaší další zprávě."
  t029: "/profile zobrazí, který profil je aktivní, a jeho domovský adresář."
  t030: "/config zobrazí vaši aktuální konfiguraci na první pohled."
  t031: "/stop ukončí všechny běžící procesy na pozadí spuštěné agentem."
  t032: "@file:cesta/k/souboru.py vloží obsah souboru přímo do vaší zprávy."
  t033: "@file:main.py:10-50 vloží pouze řádky 10-50 souboru."
  t034: "@folder:src/ vloží výpis stromu adresářů."
  t035: "@diff vloží vaše nezařazené změny git do zprávy."
  t036: "@staged vloží vaše zařazené změny git (git diff --staged)."
  t037: "@git:5 vloží posledních 5 commitů s úplnými patchi."
  t038: "@url:https://example.com načte a vloží obsah webové stránky."
  t039: "Napsáním @ spustíte doplňování cest v souborovém systému — můžete interaktivně přejít k libovolnému souboru."
  t040: "Zkombinujte více odkazů: \"Zkontrolujte @file:main.py a @file:test.py kvůli konzistenci.\""
  t041: "Alt+Enter vloží nový řádek pro vícřádkový vstup. (Windows Terminal zachytává Alt+Enter — použijte místo toho Ctrl+Enter.)"
  t042: "Ctrl+C přeruší agenta. Dvojitým stisknutím do 2 sekund vynutíte ukončení."
  t043: "Ctrl+Z pozastaví Hermes na pozadí — pro obnovení spusťte ve svém shellu fg."
  t044: "Tab přijme text automatického návrhu (ghost text) nebo dokončí příkazy se slash."
  t045: "Napište novou zprávu, zatímco agent pracuje, a přerušíte ho a přesměrujete."
  t046: "Alt+V vloží obrázek ze schránky do konverzace."
  t047: "Vložení 5+ řádků se automaticky uloží do souboru a místo toho vloží kompaktní odkaz."
  t048: "hermes -c obnoví vaši nejnovější relaci CLI. hermes -c \"název projektu\" obnoví podle názvu."
  t049: "hermes -w vytvoří izolovaný git worktree — ideální pro paralelní workflow agentů."
  t050: "hermes -w -q \"Oprav problém #42\" kombinuje izolaci worktree s jednorázovým dotazem."
  t051: "hermes chat -t web,terminal zapne jen konkrétní sady nástrojů pro cílenou relaci."
  t052: "hermes chat -s github-pr-workflow přednačte dovednost při spuštění."
  t053: "hermes chat -q \"dotaz\" spustí jediný neinteraktivní dotaz a ukončí se."
  t054: "hermes chat --max-turns 1000 přepíše výchozí limit 500 iterací na tah."
  t055: "hermes chat --checkpoints zapne snímky souborového systému před každou destruktivní změnou souboru."
  t056: "hermes --yolo obejde všechny výzvy ke schválení nebezpečných příkazů pro celou relaci."
  t057: "hermes chat --source telegram označí relaci pro filtrování v hermes sessions list."
  t058: "hermes -p work chat spustí pod konkrétním profilem, aniž by změnil váš výchozí."
  t059: "hermes doctor --fix diagnostikuje a automaticky opraví problémy s konfigurací a závislostmi."
  t060: "hermes dump vypíše kompaktní souhrn nastavení — skvělé pro hlášení chyb."
  t061: "hermes config set KEY VALUE automaticky směruje tajné údaje do .env a vše ostatní do config.yaml."
  t062: "hermes config edit otevře config.yaml ve vašem výchozím editoru."
  t063: "hermes config check vyhledá chybějící nebo zastaralé možnosti konfigurace."
  t064: "hermes sessions browse otevře interaktivní výběr relací s vyhledáváním."
  t065: "hermes sessions stats zobrazí počty relací podle platformy a velikost databáze."
  t066: "hermes sessions prune --older-than 30 vyčistí staré relace."
  t067: "hermes skills search react --source skills-sh prohledá veřejný adresář skills.sh."
  t068: "hermes skills check prohledá nainstalované dovednosti z hubu kvůli aktualizacím z upstreamu."
  t069: "hermes skills tap add myorg/skills-repo přidá vlastní zdroj dovedností z GitHubu."
  t070: "hermes skills snapshot export setup.json exportuje vaši konfiguraci dovedností pro zálohu nebo sdílení."
  t071: "hermes mcp add github --command npx přidá servery MCP z příkazového řádku."
  t072: "hermes mcp serve spustí samotný Hermes jako server MCP pro ostatní agenty."
  t073: "hermes auth add vám umožní přidat více API klíčů pro rotaci fondu přihlašovacích údajů."
  t074: "hermes completion bash >> ~/.bashrc zapne dokončování tabulátorem pro všechny příkazy a profily."
  t075: "hermes logs -f sleduje agent.log v reálném čase. --level WARNING --since 1h filtruje výstup."
  t076: "hermes backup vytvoří záložní zip celého vašeho domovského adresáře Hermes."
  t077: "hermes profile create coder vytvoří izolovaný profil, který se stane vlastním příkazem."
  t078: "hermes profile create work --clone zkopíruje vaši aktuální konfiguraci a klíče do nového profilu."
  t079: "hermes update automaticky synchronizuje nové přibalené dovednosti do VŠECH profilů."
  t080: "hermes gateway install nastaví Hermes jako systémovou službu (systemd/launchd)."
  t081: "hermes memory setup vám umožní nakonfigurovat externího poskytovatele paměti (Honcho, Mem0 atd.)."
  t082: "hermes webhook subscribe vytvoří trasy webhooků řízené událostmi s validací HMAC."
  t083: "Šetřete peníze: hermes tools zakáže nepoužívané nástroje, hermes skills config omezí dovednosti."
  t084: "/reasoning low nebo /reasoning minimal sníží hloubku uvažování pod výchozí (medium) — rychlejší a levnější odpovědi."
  t085: "hermes models směruje úlohy vidění, komprese a pomocné úlohy na levnější modely — sníží náklady na tokeny na pozadí o 85 %+ bez downgradu vašeho hlavního chatovacího modelu."
  t086: "Nastavte display.bell_on_complete: true v config.yaml, abyste při dokončení dlouhých úloh uslyšeli zvonek."
  t087: "Nastavte display.streaming: true, abyste viděli tokeny objevovat se v reálném čase, jak je model generuje."
  t088: "Nastavte display.show_reasoning: true, abyste sledovali řetězec uvažování modelu."
  t089: "Nastavte display.compact: true pro omezení prázdných míst ve výstupu a hustší informace."
  t090: "Nastavte display.busy_input_mode: queue pro zařazení zpráv do fronty místo přerušení agenta, nebo steer pro jejich vložení do běhu pomocí /steer."
  t091: "Nastavte display.resume_display: minimal pro přeskočení úplného shrnutí konverzace při obnovení relace."
  t092: "Nastavte compression.threshold: 0.50 pro řízení, kdy se spustí automatická komprese (výchozí: 50 % kontextu)."
  t093: "Nastavte agent.max_turns: 1000, aby agent mohl udělat více kroků volání nástrojů na tah."
  t094: "Nastavte file_read_max_chars: 200000 pro zvýšení maximálního obsahu na volání read_file."
  t095: "Nastavte approvals.mode: smart, aby LLM automaticky schvaloval bezpečné příkazy a zamítal nebezpečné."
  t096: "Nastavte fallback_model v config.yaml pro automatické přepnutí na záložního poskytovatele."
  t097: "Nastavte privacy.redact_pii: true pro hašování ID uživatelů a telefonních čísel před odesláním do LLM."
  t098: "Nastavte browser.record_sessions: true pro automatické nahrávání relací prohlížeče jako videí WebM."
  t099: "Nastavte worktree: true v config.yaml pro vždy vytvoření git worktree (stejné jako hermes -w)."
  t100: "Nastavte security.website_blocklist.enabled: true pro zablokování konkrétních domén pro webové nástroje."
  t101: "Nastavte cron.wrap_response: false pro doručení surového výstupu agenta bez hlavičky/patičky cron."
  t102: "HERMES_TIMEZONE přepíše časové pásmo serveru libovolným řetězcem časového pásma IANA."
  t103: "Nahrazování proměnných prostředí funguje v config.yaml: použijte syntaxi ${VAR_NAME}."
  t104: "Rychlé příkazy v config.yaml spouštějí shellové příkazy okamžitě a bez spotřeby tokenů."
  t105: "Vlastní osobnosti lze definovat v config.yaml pod agent.personalities."
  t106: "provider_routing řídí řazení, zařazování na bílou a černou listinu poskytovatelů OpenRouter."
  t107: "execute_code spouští skripty Python, které programově volají nástroje Hermes — výsledky zůstávají mimo kontext."
  t108: "delegate_task ve výchozím stavu spouští až 10 souběžných podagentů (delegation.max_concurrent_children) s izolovanými kontexty pro paralelní práci."
  t109: "web_extract funguje na URL adresách PDF — předejte libovolný odkaz na PDF a převede se na markdown."
  t110: "search_files je postaven na ripgrepu a je rychlejší než grep — používejte ho místo grep v terminálu."
  t111: "patch používá 9 strategií přibližného porovnávání, takže drobné rozdíly v prázdných znacích nerozbijí úpravy."
  t112: "patch podporuje formát V4A pro hromadné úpravy více souborů v jediném volání."
  t113: "read_file navrhne podobné názvy souborů, když soubor není nalezen."
  t114: "read_file automaticky odstraňuje duplicity — opětovné čtení nezměněného souboru vrátí odlehčený zástupný text."
  t115: "browser_vision pořídí snímek obrazovky a analyzuje ho pomocí AI — funguje pro CAPTCHA a vizuální obsah."
  t116: "browser_console umí vyhodnocovat výrazy JavaScript v kontextu stránky."
  t117: "image_generate vytváří obrázky pomocí FLUX 2 Pro s automatickým 2× zvětšením."
  t118: "text_to_speech převádí text na zvuk — na Telegramu se přehrává jako hlasové bubliny."
  t119: "send_message dosáhne z relace na jakoukoli připojenou platformu pro zasílání zpráv."
  t120: "Nástroj todo pomáhá agentovi sledovat složité vícekrokové úlohy během relace."
  t121: "session_search provádí fulltextové vyhledávání ve VŠECH minulých konverzacích."
  t122: "Agent automaticky ukládá preference, opravy a údaje o prostředí do paměti."
  t123: "/moa pošle jeden obtížný prompt přes vámi nakonfigurovanou sadu modelů Mixture of Agents."
  t124: "Příkazy v terminálu podporují režim na pozadí s notify_on_complete pro dlouho běžící úlohy."
  t125: "Procesy terminálu na pozadí podporují watch_patterns pro upozornění na konkrétní řádky výstupu."
  t126: "Nástroj terminál podporuje 6 backendů: local, Docker, SSH, Modal, Daytona a Singularity."
  t127: "Každý profil má vlastní konfiguraci, API klíče, paměť, relace, dovednosti a úlohy cron."
  t128: "Názvy profilů se stávají shellovými příkazy — 'hermes profile create coder' vytvoří příkaz 'coder'."
  t129: "hermes profile export coder -o backup.tar.gz vytvoří přenosný archiv profilu."
  t130: "Pokud dva profily omylem sdílejí token bota, druhá brána se zablokuje s jasnou chybou."
  t131: "Relace automaticky vygenerují popisné názvy po první výměně zpráv — ruční pojmenování není potřeba."
  t132: "Názvy relací podporují rodokmen: „můj projekt“ → „můj projekt #2“ → „můj projekt #3“."
  t133: "Při ukončení Hermes vypíše příkaz pro obnovení s ID relace a statistikami."
  t134: "hermes sessions export backup.jsonl vyexportuje všechny relace pro zálohu nebo analýzu."
  t135: "hermes -r SESSION_ID obnoví jakoukoli konkrétní minulou relaci podle jejího ID."
  t136: "Paměť je zmrazený snímek — změny se v systémovém promptu projeví až při příštím spuštění relace."
  t137: "Záznamy v paměti se automaticky kontrolují na vzory prompt injection a exfiltrace."
  t138: "Agent má dvě úložiště paměti: osobní poznámky (~2200 znaků) a profil uživatele (~1375 znaků)."
  t139: "Opravy, které agentovi zadáte („ne, udělej to takhle“), se často automaticky ukládají do paměti."
  t140: "Přes 80 přibalených dovedností pokrývajících GitHub, kreativu, mlops, produktivitu, výzkum a další."
  t141: "Každá nainstalovaná dovednost se automaticky stane lomítkovým příkazem — napište / a uvidíte je všechny."
  t142: "hermes skills install official/security/1password nainstaluje volitelné dovednosti z repozitáře."
  t143: "Dovednosti se mohou omezit na konkrétní operační systémy — některé se načtou jen na macOS nebo Linuxu."
  t144: "skills.external_dirs v config.yaml vám umožní načítat dovednosti z vlastních adresářů."
  t145: "Agent si může vytvářet vlastní dovednosti jako procedurální paměť pomocí skill_manage."
  t146: "/plan zapíše implementační plán v markdownu do .hermes/plans/ a nic nevykoná."
  t147: "Cron úlohy mohou přiložit dovednosti: hermes cron add --skill blogwatcher \"Check for new posts\"."
  t148: "Mezi cíle doručení cronu patří telegram, discord, slack, e-mail, sms a dalších 12+ platforem."
  t149: "Pokud odpověď cronu začíná na [SILENT], doručení se potlačí — užitečné pro úlohy jen na monitorování."
  t150: "Cron podporuje relativní zpoždění (30m), intervaly (každé 2h), cron výrazy a ISO časová razítka."
  t151: "Cron úlohy běží ve zcela nových relacích agenta — prompty musí být soběstačné."
  t152: "Hlasový režim funguje bez jediného API klíče, pokud je nainstalován faster-whisper (bezplatný lokální přepis řeči)."
  t153: "K dispozici je pět poskytovatelů TTS: Edge TTS (zdarma), ElevenLabs, OpenAI, NeuTTS (lokální zdarma), MiniMax."
  t154: "/voice on zapne hlasový režim v CLI. Ctrl+B přepíná nahrávání push-to-talk."
  t155: "Streamovací TTS přehrává věty, jak vznikají — nečekáte na celou odpověď."
  t156: "Hlasové zprávy na Telegramu, Discordu, WhatsAppu a Slacku se automaticky přepisují."
  t157: "Hermes běží na 21 platformách pro zasílání zpráv: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, e-mail a další."
  t158: "hermes gateway install jej nastaví jako systémovou službu, která se spustí při startu."
  t159: "DingTalk používá Stream Mode — nejsou potřeba webhooky ani veřejná URL."
  t160: "BlueBubbles přináší iMessage do Hermes přes lokální server macOS."
  t161: "Webhookové trasy podporují HMAC ověření, omezení rychlosti a filtrování událostí."
  t162: "API server vystavuje endpoint kompatibilní s OpenAI, který funguje s Open WebUI a LibreChat."
  t163: "Režim hlasového kanálu Discordu: bot se připojí do VC, přepisuje řeč a odpovídá hlasem."
  t164: "group_sessions_per_user: true dá každému v skupinových chatech vlastní relaci."
  t165: "/sethome označí chat jako domovský kanál pro doručování cron úloh."
  t166: "Gateway podporuje časové limity podle nečinnosti — aktivní agenti mohou běžet neomezeně."
  t167: "Schvalování nebezpečných příkazů má 4 úrovně: jednou, relace, vždy (trvalý seznam povolených), zamítnout."
  t168: "Chytrý režim schvalování používá LLM k automatickému schválení bezpečných příkazů a označení nebezpečných."
  t169: "Ochrana SSRF blokuje privátní sítě, loopback, link-local a cloudové metadata adresy."
  t170: "ID relací mají předponu s časovým razítkem (20250305_091523_abcd), takže řazení v ls a jq funguje přirozeně."
  t171: "Podprocesy MCP dostávají filtrované prostředí — projdou jen bezpečné systémové proměnné."
  t172: "Kontextové soubory (.hermes.md, AGENTS.md) se před načtením bezpečnostně kontrolují na prompt injection."
  t173: "command_allowlist v config.yaml trvale schvaluje konkrétní vzory shellových příkazů."
  t174: "Kontext se automaticky zkomprimuje při dosažení prahu — paměti se uloží a historie se shrne."
  t175: "Stavový řádek se při zaplňování kontextu zbarví žlutě, pak oranžově a nakonec červeně."
  t176: "SOUL.md je hlavní soubor identity agenta — přizpůsobte jej a ovlivněte jeho chování."
  t177: "Hermes načítá kontext projektu z .hermes.md, AGENTS.md, CLAUDE.md nebo .cursorrules (první shoda)."
  t178: "Soubory AGENTS.md v podadresářích se objevují postupně, jak agent prochází složkami."
  t179: "Kontextové soubory jsou omezeny na 20 000 znaků s chytrým ořezem začátku a konce."
  t180: "Pět poskytovatelů prohlížeče: lokální Chromium, Browserbase, Browser Use, Camofox a Firecrawl."
  t181: "Camofox je prohlížeč proti detekci — fork Firefoxu s podvrhováním fingerprintu v C++."
  t182: "browser_navigate automaticky vrací snímek stránky — není třeba poté volat browser_snapshot."
  t183: "browser_vision s annotate=true překryje interaktivní prvky očíslovanými štítky."
  t184: "hermes mcp otevře interaktivní výběr MCP schválených Nous, které nainstalujete jedním stiskem."
  t185: "hermes mcp catalog vypíše MCP servery schválené Nous, dodávané s repozitářem."
  t186: "hermes mcp install <name> nainstaluje záznam z katalogu, vyžádá přihlašovací údaje a nechá vás vybrat, které jeho nástroje povolit."
  t187: "MCP servery se konfigurují v config.yaml — podporovány jsou přenosy stdio i HTTP."
  t188: "Filtrování nástrojů po serverech: tools.include povolí a tools.exclude zakáže konkrétní nástroje."
  t189: "MCP servery automaticky generují sady nástrojů za běhu — hermes tools je může přepínat podle platformy."
  t190: "Podpora MCP OAuth: auth: oauth zapne autorizaci v prohlížeči pomocí PKCE."
  t191: "Checkpointy nemají žádnou režii, když se nezmění žádné soubory — ve výchozím stavu zapnuto."
  t192: "Snímek před vrácením se uloží automaticky, takže můžete vrátit i samotné vrácení."
  t193: "/rollback zruší i dané kolo konverzace, takže si agent vrácené změny nepamatuje."
  t194: "Checkpointy používají stínové repozitáře v ~/.hermes/checkpoints/ — .git vašeho projektu zůstane nedotčen."
  t195: "batch_runner.py zpracovává stovky promptů paralelně pro generování trénovacích dat."
  t196: "hermes chat -Q zapne tichý režim pro programové použití — potlačí banner a spinner."
  t197: "Ukládání trajektorií (--save-trajectories) zachytí kompletní stopy použití nástrojů pro trénování modelu."
  t198: "Tři typy pluginů: obecné (nástroje/hooky), poskytovatelé paměti a kontextové enginy."
  t199: "hermes plugins install owner/repo nainstaluje pluginy přímo z GitHubu."
  t200: "Externí poskytovatelé paměti: Honcho, Hindsight, Mem0, OpenViking a další přes `hermes plugins install`."
  t201: "Hooky pluginů zahrnují pre/post_tool_call, pre/post_llm_call a transform_terminal_output pro kanonizaci výstupu."
  t202: "Prompt caching (Anthropic) snižuje náklady opětovným použitím uložených prefixů systémového promptu."
  t203: "Agent automaticky generuje názvy relací ve vlákně na pozadí — nulový dopad na latenci."
  t204: "Chytré směrování modelů může jednoduché dotazy automaticky přesměrovat na levnější model."
  t205: "Lomítkové příkazy podporují shodu prefixu: /h se vyhodnotí jako /help, /mod jako /model."
  t206: "Přetažení cesty k souboru do terminálu automaticky přiloží obrázky nebo je odešle jako kontext."
  t207: ".worktreeinclude v kořeni vašeho repozitáře vypíše soubory ignorované gitem, které se zkopírují do worktree."
  t208: "hermes acp spustí Hermes jako ACP server pro integraci s VS Code, Zed a JetBrains."
  t209: "Vlastní poskytovatelé: pojmenované endpointy uložte v config.yaml pod custom_providers."
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT vloží systémový prompt, který se nikdy neukládá do historie."
  t211: "credential_pool_strategies podporuje fill_first, round_robin, least_used a náhodné střídání."
  t212: "hermes auth add nous nebo hermes auth add openai-codex nastaví poskytovatele založené na OAuth."
  t213: "API server podporuje Chat Completions i Responses API se stavem na straně serveru."
  t214: "tool_preview_length: 0 v konfiguraci zobrazí úplné cesty k souborům v kanálu aktivity spinneru."
  t215: "hermes status --deep spustí podrobnější diagnostické kontroly všech komponent."
  t216: "Cron úlohy mohou přiložit skript v Pythonu (--script), jehož stdout se vloží do promptu jako kontext."
  t217: "Cron skripty žijí v ~/.hermes/scripts/ a běží před agentem — ideální pro pipeline na sběr dat."
  t218: "prefill_messages_file v config.yaml vkládá few-shot příklady do každého volání API, nikdy se neukládá do historie."
  t219: "SOUL.md zcela nahrazuje výchozí identitu agenta — přepište jej a udělejte si Hermes po svém."
  t220: "SOUL.md se při prvním spuštění automaticky naplní výchozí osobností. Pro úpravu jej editujte."
  t221: "/compress <focus topic> přidělí 60–70 % rozpočtu souhrnu vašemu tématu a zbytek agresivně ořeže."
  t222: "Při druhé a další kompresi kompresor aktualizuje předchozí souhrn, místo aby začínal od nuly."
  t223: "Před resetem relace gateway Hermes automaticky na pozadí uloží důležitá fakta do paměti."
  t224: "network.force_ipv4: true v config.yaml opraví zaseknutí na serverech s rozbitým IPv6 — monkey-patchuje socket."
  t225: "Nástroj terminálu popisuje běžné návratové kódy: grep vracející 1 = 'Nenalezeny žádné shody (není chyba)'."
  t226: "Selhané příkazy terminálu na popředí se automaticky opakují až třikrát s exponenciálním zpožděním (2s, 4s, 8s)."
  t227: "Samotné příkazy sudo se automaticky přepíší tak, aby přepojily SUDO_PASSWORD z .env — není třeba interaktivní výzva."
  t228: "Pomocné funkce execute_code vyžadují explicitní importy: from hermes_tools import json_parse, shell_quote, retry."
  t229: "7 nástrojů sandboxu execute_code (web_search, terminal, read/write/search/patch) používá RPC — nikdy nevstupují do kontextu."
  t230: "Čtení stejné části souboru 3× a více vyvolá varování. Při 4+ se tvrdě zablokuje, aby se zabránilo smyčkám."
  t231: "write_file a patch zjistí, zda byl soubor od posledního čtení změněn zvenčí, a upozorní na neaktuálnost."
  t232: "Formát patch V4A podporuje direktivy Add File, Delete File a Move File — nejen Update."
  t233: "MCP servery mohou přes sampling žádat o dokončení LLM zpět — agent se tak stává nástrojem pro server."
  t234: "MCP servery posílají notifications/tools/list_changed, aby spustily automatickou opětovnou registraci nástrojů bez restartu."
  t235: "delegate_task s acp_command: 'claude' spustí Claude Code jako podřízeného agenta z jakékoli platformy."
  t236: "Delegování má vlákno srdečního tepu — aktivita potomka se přenáší do rodiče, což brání časovým limitům gateway."
  t237: "Když poskytovatel vrátí HTTP 402 (payment required), pomocný klient se automaticky přepne na dalšího."
  t238: "agent.tool_use_enforcement usměrňuje modely, které popisují akce místo volání nástrojů — u GPT/Codex je auto."
  t239: "agent.restart_after_turn_timeout umožňuje dokončit běžící tahy, než /restart přejde do stop(); restart_drain_timeout je jen rozpočet pro vynucené přerušení po zahájení stop()."
  t240: "agent.api_max_retries (výchozí 3) řídí, kolikrát agent zopakuje neúspěšné volání API, než zobrazí chybu — snižte ji pro rychlý fallback."
  t241: "Gateway ukládá instance AIAgent do mezipaměti pro každou relaci — zničení této mezipaměti rozbije prompt caching Anthropic."
  t242: "Libovolný web může nabízet dovednosti přes /.well-known/skills/index.json — rozbočovač dovedností je objeví automaticky."
  t243: "Protokol auditu dovedností na ~/.hermes/skills/.hub/audit.log sleduje každou operaci instalace a odebrání."
  t244: "Zastaralé git worktrees se při spuštění automaticky uklízejí: čisté a plně sloučené stromy se prořežou; necommitované nebo neodeslané změny se vždy zachovají."
  t245: "Profily vymezují stav Hermes pomocí HERMES_HOME; podprocesy nástrojů na hostiteli si zachovávají váš skutečný HOME, pokud terminal.home_mode není profile."
  t246: "Proměnná prostředí HERMES_HOME_MODE (osmičkově, např. 0701) nastavuje vlastní oprávnění adresáře pro průchod webového serveru."
  t247: "Režim kontejneru: umístěte .container-mode do HERMES_HOME a hostitelské CLI se automaticky spustí do kontejneru."
  t248: "Ctrl+C má 5 úrovní priority: zrušit nahrávání → zrušit výzvy → zrušit výběr → přerušit agenta → ukončit."
  t249: "Každé přerušení během běhu agenta se zaznamená do ~/.hermes/interrupt_debug.log s časovými razítky."
  t250: "BROWSER_CDP_URL připojí nástroje prohlížeče k libovolnému běžícímu prohlížeči z řady Chromium — přijímá WebSocket, HTTP nebo host:port."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true zapíná pokročilou anti-detekci s vlastním Chromium (Scale Plan)."
  t252: "CLI se automaticky přepne do kompaktního režimu v terminálech užších než 80 sloupců."
  t253: "Rychlé příkazy podporují dva typy: exec (spustí příkaz shellu přímo) a alias (přesměruje na jiný příkaz)."
  t254: "Model delegování pro jednotlivé úlohy: delegation.model a delegation.provider v konfiguraci směrují podagenty na levnější modely."
  t255: "delegation.reasoning_effort nezávisle řídí hloubku uvažování pro podagenty."
  t256: "display.platforms v config.yaml umožňuje přepsání zobrazení pro jednotlivé platformy: {telegram: {tool_progress: all}}."
  t257: "human_delay.mode v konfiguraci simuluje rychlost lidského psaní — nastavitelný rozsah min_ms/max_ms."
  t258: "Migrace verzí konfigurace probíhají automaticky při načtení — nové klíče konfigurace se objeví bez ručního zásahu."
  t259: "Modely GPT a Codex dostávají zvláštní pokyny v systémovém promptu pro kázeň nástrojů a povinné používání nástrojů."
  t260: "Modely Gemini dostávají přizpůsobené direktivy pro absolutní cesty, paralelní volání nástrojů a neinteraktivní příkazy."
  t261: "context.engine v config.yaml lze nastavit na název pluginu pro alternativní strategie správy kontextu."
  t262: "Snímky stránek prohlížeče nad 15 000 znaků se zkrátí nebo automaticky shrnou; úplný snímek se uloží do cache/web pro stránkování pomocí read_file."
  t263: "Kompresor provádí levný předběžný průchod: výstupy nástrojů nad 200 znaků se nahradí zástupnými symboly, než se spustí LLM."
  t264: "Když komprese selže, další pokusy se pozastaví na 10 minut, aby se zabránilo zahlcení API."
  t265: "Dlouhé nebezpečné příkazy (>70 znaků) dostanou ve výzvě ke schválení možnost 'view' pro zobrazení celého textu."
  t266: "Vizualizace úrovně zvuku zobrazuje při nahrávání hlasu pruhy ▁▂▃▄▅▆▇ podle úrovní RMS mikrofonu."
  t267: "Názvy profilů nesmí kolidovat s existujícími binárkami v PATH — 'hermes profile create ls' by bylo odmítnuto."
  t268: "hermes profile create backup --clone-all zkopíruje vše (konfiguraci, klíče, SOUL.md, paměti, dovednosti, relace)."
  t269: "Klávesa pro nahrávání hlasu je nastavitelná přes voice.record_key v config.yaml — nejen Ctrl+B."
  t270: "Soubory .cursorrules a .cursor/rules/*.mdc se automaticky rozpoznají a načtou jako kontext projektu."
  t271: "Kontextové soubory podporují 10+ vzorů prompt injection — neviditelný Unicode, 'ignore instructions', pokusy o exfiltraci."
  t272: "GPT-5 a Codex používají v formátu zpráv roli 'developer' místo 'system'."
  t273: "Přepsání pomocných nastavení pro jednotlivé úlohy: auxiliary.vision.provider, auxiliary.compression.model atd. v config.yaml."
  t274: "Pomocný klient považuje 'main' za alias poskytovatele — přeloží se na vašeho skutečného primárního poskytovatele + model."
  t275: "hermes claw migrate --dry-run zobrazí náhled migrace OpenClaw bez zápisu čehokoli."
  t276: "Cesty k souborům vložené s uvozovkami nebo escapovanými mezerami se zpracují automaticky — není třeba ruční úklid."
  t277: "Příkazy se lomítkem nikdy nespouštějí sbalení velkého vložení — /command s velkými argumenty funguje správně."
  t278: "V režimu přerušení příkazy se lomítkem zadané během běhu agenta obcházejí logiku přerušení a spustí se okamžitě."
  t279: "HERMES_DEV=1 obchází detekci režimu kontejneru pro místní vývoj."
  t280: "Každý MCP server získá vlastní sadu nástrojů (mcp-servername), kterou lze nezávisle přepínat přes hermes tools."
  t281: "Zástupné symboly MCP ${ENV_VAR} v konfiguraci se vyřeší při spuštění serveru — včetně proměnných z ~/.hermes/.env."
  t282: "Dovednosti z důvěryhodných repozitářů (NousResearch) získají úroveň zabezpečení 'trusted'; komunitní dovednosti procházejí dodatečným skenováním."
  t283: "Karanténa dovedností na ~/.hermes/skills/.hub/quarantine/ uchovává dovednosti čekající na bezpečnostní kontrolu."
  t284: "/steer <prompt> vloží poznámku po dalším volání nástroje — usměrníte směr uprostřed úlohy bez přerušení."
  t285: "/goal <text> nastaví trvalý cíl Ralph-loop — Hermes automaticky pokračuje tah za tahem, dokud rozhodčí neřekne hotovo."
  t286: "/snapshot create [label] uloží úplný snímek stavu konfigurace Hermes; /snapshot restore <id> jej později vrátí."
  t287: "/copy [N] zkopíruje poslední odpověď asistenta do schránky, nebo s číslem N-tou od konce."
  t288: "/redraw vynutí úplné překreslení UI a opraví posun terminálu po změně velikosti tmux nebo artefakty výběru myší."
  t289: "/agents (alias /tasks) zobrazí aktivní agenty a běžící úlohy na pozadí v rámci aktuální relace."
  t290: "/footer přepíná zápatí gateway u konečných odpovědí zobrazující model, % kontextu a cwd."
  t291: "/busy queue|steer|interrupt řídí, co udělá stisk Enter, zatímco Hermes pracuje."
  t292: "/topic v přímých zprávách Telegramu zapíná uživatelsky spravovaný režim témat s více relacemi — /topic <id> obnoví minulé relace přímo v konverzaci."
  t293: "/approve session|always spustí čekající nebezpečný příkaz se zvoleným rozsahem důvěry; /deny jej zamítne."
  t294: "/restart plynule restartuje gateway po dokončení aktivních běhů a po opětovném spuštění upozorní žadatele."
  t295: "/kanban boards switch <slug> změní aktivní víceprojektovou nástěnku Kanban přímo z chatu."
  t296: "/reload znovu načte ~/.hermes/.env do běžící relace — nové API klíče se projeví bez restartu."
  t297: "cronjob s no_agent=True spustí skript podle plánu a odešle jeho stdout přímo — nula tokenů, nula LLM."
  t298: "Prázdný stdout skriptu cronu znamená tiché tiknutí — nic se nedoručí, ideální pro hlídací psy na prahové hodnoty."
  t299: "HERMES_CRON_MAX_PARALLEL (výchozí 4) omezuje, kolik úloh cronu běží na jedno tiknutí, aby nárazy nezahlcovaly vaše klíče."
  t300: "Hooky gateway žijí v ~/.hermes/hooks/<name>/ s HOOK.yaml + handler.py — handler se musí jmenovat `handle`."
  t301: "Události hooků zahrnují gateway:startup, session:start, agent:step a odběry se zástupným znakem command:*."
  t302: "Umístěte kontrolní seznam ~/.hermes/BOOT.md a hook gateway:startup jej při každém spuštění provede jako jednorázový agent."
  t303: "hermes curator run --dry-run zobrazí náhled toho, co by kurátor archivoval nebo sloučil, aniž by cokoli měnil."
  t304: "hermes curator pin <skill> pevně ochrání dovednost před automatickou archivací i před nástrojem agenta skill_manage."
  t305: "hermes curator rollback obnoví dovednosti ze snímku před spuštěním — zálohy žijí ve skills/.curator_backups/."
  t306: "hermes auth reset <provider> [target] vymaže doby cooldown a příznaky vyčerpání u celého fondu přihlašovacích údajů, nebo u jednoho údaje podle indexu, id či štítku."
  t307: "credential_pool_strategies.<provider>: round_robin střídá klíče rovnoměrně místo výchozího fill_first."
  t308: "use_gateway: true pro jednotlivé nástroje směruje web, image, tts nebo browser přes vaše předplatné Nous — žádné další klíče."
  t309: "provider_routing.data_collection: deny vyloučí poskytovatele ukládající data na OpenRouter."
  t310: "provider_routing.require_parameters: true směruje pouze na poskytovatele, kteří podporují každý parametr ve vašem požadavku."
  t311: "HERMES_TUI_RESUME=1 se při spuštění automaticky znovu připojí k nejnovější relaci TUI — praktické po výpadku SSH."
  t312: "HERMES_TUI_THEME=light|dark|<hex> vynutí motiv TUI v terminálech, které nenastavují COLORFGBG."
  t313: "Ctrl+G nebo Ctrl+X Ctrl+E v TUI otevře vstupní vyrovnávací paměť v $EDITOR pro dlouhé víceřádkové prompty."
  t314: "TUI vykresluje LaTeX přímo v textu — $E=mc^2$ se změní na Unicode matematiku místo surového TeX."
  t315: "hermes dashboard spustí místní webové UI na 127.0.0.1:9119 — žádná data neopustí localhost."
  t316: "hermes dashboard vloží celé TUI Hermes do vašeho prohlížeče přes xterm.js a WebSocket PTY."
  t317: "Umístěte YAML do ~/.hermes/dashboard-themes/ se dvěma barvami palety a přeměníte vzhled celého dashboardu."
  t318: "Pluginy dashboardu se vkládají přímo: manifest.json + JS bundle do ~/.hermes/dashboard-plugins/ — není třeba build přes npm."
  t319: "layoutVariant: cockpit v motivu dashboardu přidá levý pruh o šířce 260px, který mohou pluginy naplnit přes slot sidebar."
  t320: "display.tool_progress_command: true zpřístupní /verbose na platformách pro zasílání zpráv; ve výchozím stavu je jen v CLI."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result upozorní jen po dokončení úloh na pozadí (oproti concise/all/error/off)."
  t322: "HERMES_WRITE_SAFE_ROOT omezuje write_file/patch na prefixy adresářů; více cest přes os.pathsep (: nebo ;)."
  t323: "HERMES_IGNORE_RULES přeskočí automatické vkládání AGENTS.md, SOUL.md, .cursorrules, paměti a přednačtených dovedností."
  t324: "HERMES_ACCEPT_HOOKS automaticky schválí neviděné shellové hooky deklarované v config.yaml bez výzvy TTY."
  t325: "auxiliary.goal_judge.model směruje rozhodčího /goal na levný rychlý model, aby náklady smyčky zůstaly téměř nulové."
  t326: "Checkpointy přeskakují adresáře s více než 50 000 soubory, aby se vyhnuly pomalým operacím git u obrovských monorep."
  t327: "tts.provider: piper spouští místní TTS ve 44 jazycích na CPU — hlasy se automaticky stahují do ~/.hermes/cache/piper-voices/."
  t328: "tts.providers.<name>.type: command propojí libovolný CLI TTS engine se zástupnými symboly {input_path} a {output_path}."
  t329: "API_SERVER_ENABLED=true spouští koncový bod kompatibilní s OpenAI vedle gateway pro Open WebUI a LibreChat."
  t330: "GATEWAY_PROXY_URL provozuje rozdělené nastavení: I/O platformy místně, práce agenta delegována na vzdálený API server."
  t331: "MATRIX_DEVICE_ID fixuje stabilní ID zařízení pro E2EE — bez něj se klíče otáčejí při každém spuštění a historické dešifrování se rozbije."
  t332: "TELEGRAM_WEBHOOK_SECRET je vyžadován vždy, když je nastaven TELEGRAM_WEBHOOK_URL — vygenerujte jej pomocí openssl rand -hex 32."
  t333: "batch_runner.py --resume páruje dokončené prompty podle textu, takže přeuspořádání datasetu znovu nespustí hotovou práci."
  t334: "/new spustí novou relaci na místě (alias /reset) — nové ID relace, čistá historie, CLI zůstane otevřené."
  t335: "/clear vymaže obrazovku terminálu A spustí novou relaci — jedna zkratka pro vizuální reset."
  t336: "/history vypíše aktuální konverzaci přímo v řádku, aniž byste opustili CLI — užitečné pro rychlé znovupročtení."
  t337: "/save uloží aktuální konverzaci na disk, aniž by ukončil relaci."
  t338: "/status zobrazí informace o relaci na první pohled: ID, název, model, spotřebu tokenů a uplynulý čas."
  t339: "/image <path> připojí místní obrázkový soubor pro váš další prompt bez vkládání nebo přetažení."
  t340: "/platforms zobrazí stav připojení brány a chatovacích platforem přímo z chatu."
  t341: "/commands stránkuje úplný seznam lomítkových příkazů + nainstalovaných dovedností — užitečné na platformách bez doplňování tabulátorem."
  t342: "/toolsets vypíše všechny dostupné sady nástrojů, abyste věděli, co -t/--toolsets přijímá."
  t343: "/voice tts přepíná režim pouze TTS — agent odpovídá nahlas, ale prompty stále píšete vy."
  t344: "/reload-skills znovu prohledá ~/.hermes/skills/, takže dovednosti přidané za běhu se objeví bez restartu relace."
  t345: "/indicator kaomoji|emoji|unicode|ascii vybere styl indikátoru zaneprázdnění TUI zobrazovaný během běhu agenta."
  t346: "/debug nahraje diagnostický balíček (info o systému + logy) a vrátí odkazy ke sdílení — funguje i v chatu."
  t347: "hermes -z \"<prompt>\" je nejčistší jednorázový režim: konečná odpověď na stdout, nic jiného — ideální pro předávání rourou ve skriptech."
  t348: "hermes chat --pass-session-id vloží ID relace do systémového promptu, aby na něj agent mohl odkazovat."
  t349: "hermes chat --image path/to/pic.png připojí místní obrázek k jednomu dotazu -q bez samostatného kroku nahrání."
  t350: "hermes chat --ignore-user-config přeskočí aktivní uživatelskou konfiguraci — reprodukovatelná hlášení chyb a běhy CI."
  t351: "hermes chat --source tool označí programové chaty, aby nezaplňovaly seznam hermes sessions."
  t352: "hermes dump --show-keys zahrne skryté otisky API klíčů pro hlubší ladění podpory."
  t353: "hermes sessions rename <ID> \"nový název\" přejmenuje libovolnou minulou relaci; hermes sessions delete <ID> jednu odstraní."
  t354: "hermes import obnoví úplný záložní zip Hermes; exporty relací JSON/JSONL se importují ze stránky Sessions na dashboardu."
  t355: "hermes fallback spravuje řetězec fallback_model interaktivně — žádné ruční úpravy config.yaml."
  t356: "hermes pairing obmění párovací token pro DM — první, kdo po obměně pošle zprávu, získá přístup k botovi."
  t357: "hermes setup provede nové uživatele nastavením poskytovatele, klíčů a propojení platforem v jednom interaktivním postupu."
  t358: "hermes status --deep spustí úplnou kontrolu stavu všech komponent; samotné hermes status je rychlý přehled."
  t359: "HERMES_AGENT_TIMEOUT=0 vypne ukončení běžícího agenta bránou při nečinnosti — použijte pro dlouhé výzkumné běhy."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 automaticky načte pluginy z repozitáře z ./.hermes/plugins/ — záměrně vázané na důvěru."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 vypne ochranu »soubor se od přečtení změnil« u patch a write_file."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true umožní webovým nástrojům přistupovat na localhost a privátní sítě — v režimu brány je ve výchozím stavu vypnuto."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 automaticky nainstaluje další dovednosti z volitelného katalogu při prvním spuštění pro každý profil."
  t364: "HERMES_BUNDLED_SKILLS ukazuje na vlastní strom přibalených dovedností — používají balíčky Homebrew a Nix."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 vypíše obsah každého požadavku API na stdout místo do logovacích souborů."
  t366: "HERMES_OAUTH_TRACE=1 loguje skryté pokusy o výměnu a obnovení OAuth tokenu pro ladění autentizace poskytovatele."
  t367: "HERMES_STREAM_RETRIES (výchozí 3) řídí počet pokusů o opětovné připojení uprostřed streamu při přechodných chybách sítě."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false ztiší potvrzovací zprávy ⚡/⏳/⏩, když uživatel píše zaneprázdněnému agentovi."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (výchozí 180s) určuje, jak často brána hlásí průběh u dlouhých tahů."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (výchozí 900s) omezuje, jak dlouho /restart čeká na probíhající běhy, než vynutí akci."
  t371: "HERMES_CHECKPOINT_TIMEOUT (výchozí 30s) omezuje vytváření kontrolních bodů souborového systému — u obřích monorep jej zvyšte."
  t372: "image_gen.model v config.yaml vybírá model FAL: flux-2/klein, gpt-image-2, nano-banana-pro a další."
  t373: "image_gen.provider směruje generování obrázků přes plugin (OpenAI Images, Codex, FAL) místo výchozího nastavení."
