    interrupted_during_api_call: "požadavek byl přerušen během volání, než byla přijata odpověď. Pošlete `continue` pro nový pokus."
    max_iterations_reached: "bylo dosaženo maximálního limitu iterací nástrojů před konečnou odpovědí. Pošlete `continue` pro pokračování, nebo zvyšte `max_iterations`."
    error_near_max_iterations: "poblíž limitu iterací došlo před konečnou odpovědí k chybě. Zkontrolujte výstup nástroje výše a poté pošlete `continue`."
    repeated_outer_errors: "tah neustále selhával s opakovanými chybami a byl předčasně zastaven místo nekonečného opakování. Zkontrolujte chyby výše a poté pošlete `continue` pro nový pokus."
  persistence:
    compression: "tah byl zastaven, protože tuto relaci komprimoval jiný proces. Vaše zpráva by již měla být uložena — pošlete ji prosím znovu po dokončení komprese."
    compression_closed: "tah byl zastaven, protože tato relace byla obměněna kompresí kontextu a její živé pokračování nemohlo být převzato. Samotné úložiště je v pořádku — obnovte klienta (nebo začněte nový tah), aby načetl nové ID relace, a poté pošlete zprávu znovu."
    turn_lease: "tah byl zastaven, protože tuto relaci převzal jiný proces Hermes. Vaše odpověď nebyla uložena — počkejte, než druhý proces skončí, a poté pošlete zprávu znovu."
    session_row_missing: "tato relace byla smazána z úložiště, zatímco chat byl stále otevřený, a Hermes ji nedokázal znovu vytvořit, takže tato zpráva nebyla uložena. Pošlete zprávu znovu; pokud bude selhávat, spusťte `hermes {profile_arg}doctor`."
    locked: "tah byl zastaven, protože úložiště relace bylo zaneprázdněno (jiný proces Hermes zapisoval do stavové databáze). Vaše zpráva by již měla být uložena — pošlete ji prosím znovu za okamžik."
    replaced: "soubor databáze relace byl nahrazen, zatímco Hermes běžel, takže tato zpráva nebyla uložena (kopie je uchována v {home}/sessions/). Zastavte Hermes (`hermes {profile_arg}gateway stop`), spusťte `hermes {profile_arg}doctor` — nikoli `hermes {profile_arg}doctor --fix`, který by opravil nesprávný soubor na místě — poté jej znovu spusťte a pošlete zprávu ještě jednou. Pokročilé kroky obnovy jsou v logu."
    deleted_wal: "jiný proces Hermes stále drží starou kopii write-ahead logu databáze relace, takže Hermes přestal zapisovat, aby soubor ochránil, a tato zpráva nebyla uložena (kopie je uchována v {home}/sessions/). Nic není ztraceno. Ukončete všechny procesy Hermes v tomto profilu (Desktop aplikace, `hermes {profile_arg}gateway stop`, dashboard, cron), spusťte `hermes {profile_arg}doctor` — ten pojmenuje každý proces, který log stále drží — poté znovu spusťte Hermes a pošlete zprávu ještě jednou. Nespouštějte `doctor --fix` ani nemažte žádné soubory state.db, dokud běží. Návod: {recovery_docs}"
    corrupt: "tah byl zastaven, protože stavová databáze hlásila strukturální poškození (přepis by se při restartu ztratil). Uvolnění místa na disku nepomůže. Možnosti obnovy:\n1. Spusťte `hermes {profile_arg}doctor --fix`\n2. Zastavte gateway a poté obnovte pomocí:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (pokud hlásí, že je obnovitelný) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — obnova nejprve vytvoří snímek poškozeného souboru; NESPOUŠTĚJTE `sqlite3 ... \".recover\"` proti živému state.db, zranitelná sqlite3 CLI jej může dále poškodit\n3. Obnovte ze zálohy v {backups_dir}/\nPoté pošlete zprávu znovu."
    fts_index: "tah byl zastaven, protože index vyhledávání v relacích (FTS5) je poškozený a nemohl být odpojen, takže tato zpráva nebyla uložena. Samotné úložiště zpráv není poškozeno: nespouštějte nástroje pro obnovu ani neobnovujte zálohu. Spusťte `hermes {profile_arg}doctor --fix` (nebo restartujte Hermes, který index při otevření opraví) a poté pošlete zprávu znovu."
    disk: "Hermes nemohl uložit tuto konverzaci na disk, a tak se zastavil, místo aby ztratil vaše zprávy. Disk je pravděpodobně plný: uvolněte místo (nebo opravte oprávnění k {home}/state.db) a poté pošlete zprávu znovu."
    default: "Hermes nemohl uložit tuto konverzaci, a tak se zastavil, místo aby ztratil vaše zprávy. Možné příčiny: na disku není místo, nebo databázi drží jiný proces Hermes. Zavřete ostatní okna Hermes, spusťte `hermes {profile_arg}doctor` pro kontrolu úložiště a poté pošlete zprávu znovu."
