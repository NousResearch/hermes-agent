    help: "/topic — Multi-Sitzungs-Modus für Direktnachrichten aktivieren (ein Bot, viele parallele Chats)\n\nVerwendung:\n  /topic             Themenmodus aktivieren oder Status anzeigen, falls bereits an\n  /topic help        Diese Nachricht anzeigen\n  /topic off         Themenmodus deaktivieren und Themen-Bindungen löschen\n  /topic <id>        In einem Thema: frühere Sitzung per ID wiederherstellen\n\nSo funktioniert es:\n1. Führen Sie /topic einmal in dieser Direktnachricht aus — Hermes prüft, ob die\n   BotFather-Threads-Einstellungen aktiviert sind, und schaltet den Multi-Sitzungs-Modus ein.\n2. Tippen Sie oben im Bot auf „Alle Nachrichten“ und senden Sie eine beliebige Nachricht.\n   Telegram erstellt dafür ein neues Thema; jedes Thema ist eine\n   eigenständige Hermes-Sitzung (neuer Verlauf, neuer Kontext).\n3. Die Haupt-Direktnachricht wird zur System-Lobby — senden Sie dort /topic, /status,\n   /help, /usage. Normale Prompts gehören in ein Thema.\n4. /new in einem Thema setzt nur die Sitzung dieses Themas zurück.\n5. /topic <id> in einem Thema stellt dort eine alte Sitzung wieder her."
