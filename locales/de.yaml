explainer:
  no_reply_prefix: "⚠️ Keine Antwort: "
  empty_response: "{model} hat diesmal auch nach mehreren Versuchen keine Antwort erzeugt. Senden Sie `continue`, um es erneut zu versuchen, oder wechseln Sie das Modell mit /model."
  exit:
    all_retries_exhausted_no_response: "der Modellanbieter hat nach allen Wiederholungsversuchen nicht geantwortet. Senden Sie /retry oder wechseln Sie das Modell mit /model."
    partial_stream_recovery: "das Streaming wurde vorzeitig beendet und nur eine Teilantwort konnte wiederhergestellt werden. Senden Sie `continue`, um an der Abbruchstelle fortzufahren."
    fallback_prior_turn_content: "in diesem Zug wurde kein neuer Inhalt erzeugt; angezeigt wird wiederhergestellter vorheriger Kontext. Senden Sie `continue`, um es erneut zu versuchen."
    redirect_restart_limit_exceeded: "die Anfrage wurde bei jedem Versuch durch eine neue Korrektur abgebrochen, daher wurde der Zug beendet, statt endlos zu wiederholen. Ihre letzte Korrektur ist als nächste Nachricht eingereiht."
    rebuilt_restart_limit_exceeded: "jeder Anbieter in der Fallback-Kette ist immer wieder auf den nächsten umgeschwenkt, daher wurde der Zug beendet, statt endlos zu wiederholen. Senden Sie `continue` oder wechseln Sie den Anbieter."
    budget_exhausted: "das Iterations-/Kostenbudget pro Zug war vor einer endgültigen Antwort aufgebraucht. Senden Sie `continue`, um weiterzumachen."
    ollama_runtime_context_too_small: "das Kontextfenster des lokalen Modells war zu klein, um fertig zu werden. Erhöhen Sie die Kontextgröße oder verwenden Sie ein größeres Modell."
    pending_tool_result: "der Zug wurde beendet, während noch ein Tool-Ergebnis ausstand, und das Modell hat keinen Folgetext erzeugt. Senden Sie `continue`, damit es zusammenfasst."
    interrupted_during_api_call: "die Anfrage wurde mitten im Aufruf unterbrochen, bevor eine Antwort eintraf. Senden Sie `continue`, um es erneut zu versuchen."
    max_iterations_reached: "die maximale Anzahl an Tool-Iterationen wurde vor einer endgültigen Antwort erreicht. Senden Sie `continue`, um weiterzumachen, oder erhöhen Sie `max_iterations`."
    error_near_max_iterations: "kurz vor dem Iterationslimit ist vor einer endgültigen Antwort ein Fehler aufgetreten. Prüfen Sie die Tool-Ausgabe oben und senden Sie dann `continue`."
    repeated_outer_errors: "der Zug schlug wiederholt mit denselben Fehlern fehl und wurde vorzeitig beendet, statt endlos zu wiederholen. Prüfen Sie die Fehler oben und senden Sie dann `continue`, um es erneut zu versuchen."
  persistence:
    compression: "der Zug wurde beendet, weil ein anderer Prozess diese Sitzung gerade komprimiert hat. Ihre Nachricht sollte bereits gespeichert sein — bitte senden Sie sie erneut, sobald die Komprimierung abgeschlossen ist."
    compression_closed: "der Zug wurde beendet, weil diese Sitzung durch Kontextkomprimierung rotiert wurde und ihre laufende Fortsetzung nicht übernommen werden konnte. Der Speicher selbst ist in Ordnung — laden Sie den Client neu (oder starten Sie einen neuen Zug), damit er die neue Sitzungs-ID übernimmt, und senden Sie Ihre Nachricht dann erneut."
    turn_lease: "der Zug wurde beendet, weil ein anderer Hermes-Prozess diese Sitzung übernommen hat. Ihre Antwort wurde nicht gespeichert — warten Sie, bis der andere Prozess fertig ist, und senden Sie Ihre Nachricht dann erneut."
    session_row_missing: "diese Sitzung wurde aus dem Speicher gelöscht, während der Chat noch geöffnet war, und Hermes konnte sie nicht neu anlegen, daher wurde diese Nachricht nicht gespeichert. Senden Sie Ihre Nachricht erneut; falls es weiterhin fehlschlägt, führen Sie `hermes {profile_arg}doctor` aus."
    locked: "der Zug wurde beendet, weil der Sitzungsspeicher belegt war (ein anderer Hermes-Prozess hat in die Zustandsdatenbank geschrieben). Ihre Nachricht sollte bereits gespeichert sein — bitte senden Sie sie gleich noch einmal."
    replaced: "die Sitzungsdatenbank-Datei wurde ersetzt, während Hermes lief, daher wurde diese Nachricht nicht gespeichert (eine Kopie liegt unter {home}/sessions/). Stoppen Sie Hermes (`hermes {profile_arg}gateway stop`), führen Sie `hermes {profile_arg}doctor` aus — nicht `hermes {profile_arg}doctor --fix`, das würde die falsche Datei an Ort und Stelle reparieren —, starten Sie es dann neu und senden Sie Ihre Nachricht noch einmal. Erweiterte Wiederherstellungsschritte stehen im Log."
    deleted_wal: "ein anderer Hermes-Prozess hält noch eine alte Kopie des Write-Ahead-Logs der Sitzungsdatenbank, daher hat Hermes das Schreiben eingestellt, um die Datei zu schützen, und diese Nachricht wurde nicht gespeichert (eine Kopie liegt unter {home}/sessions/). Nichts ist verloren. Beenden Sie jeden Hermes-Prozess dieses Profils (Desktop-App, `hermes {profile_arg}gateway stop`, Dashboard, Cron), führen Sie `hermes {profile_arg}doctor` aus — es nennt jeden Prozess, der das Log noch hält —, starten Sie Hermes dann neu und senden Sie Ihre Nachricht noch einmal. Führen Sie nicht `doctor --fix` aus und löschen Sie keine state.db-Dateien, während sie laufen. Anleitung: {recovery_docs}"
    corrupt: "der Zug wurde beendet, weil die Zustandsdatenbank strukturelle Beschädigung gemeldet hat (das Transkript wäre beim Neustart verloren gegangen). Speicherplatz freizugeben hilft hier nicht. Wiederherstellungsoptionen:\n1. Führen Sie `hermes {profile_arg}doctor --fix` aus\n2. Stoppen Sie das Gateway und stellen Sie dann wieder her mit:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (falls als wiederherstellbar gemeldet) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — die Wiederherstellung erstellt zuerst einen Schnappschuss der beschädigten Datei; führen Sie NICHT `sqlite3 ... \".recover\"` gegen die laufende state.db aus, eine verwundbare sqlite3-CLI kann sie weiter beschädigen\n3. Stellen Sie ein Backup aus {backups_dir}/ wieder her\nSenden Sie dann Ihre Nachricht erneut."
    fts_index: "der Zug wurde beendet, weil der Sitzungs-Suchindex (FTS5) beschädigt ist und nicht abgetrennt werden konnte, daher wurde diese Nachricht nicht gespeichert. Der Nachrichtenspeicher selbst ist nicht beschädigt: Führen Sie keine Wiederherstellungstools aus und stellen Sie kein Backup wieder her. Führen Sie `hermes {profile_arg}doctor --fix` aus (oder starten Sie Hermes neu, was den Index beim Öffnen repariert), und senden Sie Ihre Nachricht dann erneut."
    disk: "Hermes konnte diese Konversation nicht auf die Festplatte speichern und hat daher angehalten, statt Ihre Nachrichten zu verlieren. Die Festplatte ist wahrscheinlich voll: Geben Sie Speicherplatz frei (oder korrigieren Sie die Berechtigungen von {home}/state.db) und senden Sie Ihre Nachricht dann erneut."
    default: "Hermes konnte diese Konversation nicht speichern und hat daher angehalten, statt Ihre Nachrichten zu verlieren. Mögliche Ursachen: Das Laufwerk ist voll oder ein anderer Hermes-Prozess hält die Datenbank. Schließen Sie andere Hermes-Fenster, führen Sie `hermes {profile_arg}doctor` aus, um den Speicher zu prüfen, und senden Sie Ihre Nachricht dann erneut."
  file_mutation:
    header: "⚠️ Dateiänderungs-Prüfer: {count} Dateiänderung(en) sind in diesem Zug FEHLGESCHLAGEN, auch wenn die Formulierungen oben etwas anderes nahelegen. Führen Sie `git status` oder `read_file` aus, um zu prüfen, was tatsächlich angekommen ist."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "fehlgeschlagen"
  shared:
    and_more: "  • … und {count} weitere"
    the_model: "Das Modell"
tips:
  t001: "/bg <prompt> führt eine Aufgabe in einer separaten Sitzung aus, während Ihre aktuelle frei bleibt; /btw <question> beantwortet eine Nebenfrage zu dieser Konversation, ohne sie zu unterbrechen."
  t002: "/branch verzweigt die aktuelle Sitzung, damit Sie eine andere Richtung erkunden können, ohne Fortschritt zu verlieren."
  t003: "/compress komprimiert den Konversationskontext manuell, wenn es lang wird."
  t004: "/rollback listet Dateisystem-Checkpoints auf — stellen Sie vom Agenten geänderte Dateien auf jeden früheren Stand zurück."
  t005: "/rollback diff 2 zeigt als Vorschau, was sich seit Checkpoint 2 geändert hat, ohne etwas wiederherzustellen."
  t006: "/rollback 2 src/file.py stellt eine einzelne Datei aus einem bestimmten Checkpoint wieder her."
  t007: "/title \"mein Projekt\" benennt Ihre Sitzung — setzen Sie sie später mit /resume oder hermes -c fort."
  t008: "/resume macht dort weiter, wo Sie in einer zuvor benannten Sitzung aufgehört haben."
  t009: "/queue <prompt> reiht eine Nachricht für den nächsten Zug ein, ohne den aktuellen zu unterbrechen."
  t010: "/undo entfernt den letzten Austausch zwischen Benutzer und Assistent aus der Konversation."
  t011: "/retry sendet Ihre letzte Nachricht erneut — nützlich, wenn die Antwort des Agenten nicht ganz gepasst hat."
  t012: "/verbose schaltet die Anzeige des Tool-Fortschritts durch: off → new → all → verbose."
  t013: "/reasoning high erhöht die Denktiefe des Modells. /reasoning show zeigt das Reasoning an."
  t014: "/fast schaltet die Prioritätsverarbeitung für schnellere API-Antworten um (anbieterabhängig)."
  t015: "/yolo überspringt alle Genehmigungsabfragen für gefährliche Befehle für den Rest der Sitzung."
  t016: "/model lässt Sie das Modell mitten in der Sitzung wechseln — probieren Sie /model sonnet oder /model gpt-5."
  t017: "/model --global ändert Ihr Standardmodell dauerhaft."
  t018: "/personality pirate stellt eine witzige Persönlichkeit ein — 14 eingebaute Optionen von kawaii bis shakespeare."
  t019: "/skin ändert das CLI-Theme — probieren Sie ares, mono, slate, poseidon oder charizard."
  t020: "/statusbar schaltet eine dauerhafte Leiste um, die Modell, Tokens, Kontextfüllstand in %, Kosten und Dauer anzeigt."
  t021: "/tools disable browser entfernt die Browser-Tools vorübergehend für die aktuelle Sitzung."
  t022: "/browser connect verbindet die Browser-Tools per CDP mit Ihrem laufenden Chromium-basierten Browser."
  t023: "/plugins listet installierte Plugins und deren Status auf."
  t024: "/cron verwaltet geplante Aufgaben — richten Sie wiederkehrende Prompts mit Zustellung an jede Plattform ein."
  t025: "/reload-mcp lädt die MCP-Server-Konfiguration im laufenden Betrieb neu, ohne Neustart."
  t026: "/usage zeigt Token-Verbrauch, Kostenaufschlüsselung und Sitzungsdauer an."
  t027: "/insights zeigt Nutzungsstatistiken der letzten 30 Tage an."
  t028: "/paste prüft Ihre Zwischenablage auf ein Bild und hängt es an Ihre nächste Nachricht an."
  t029: "/profile zeigt, welches Profil aktiv ist, und dessen Stammverzeichnis."
  t030: "/config zeigt Ihre aktuelle Konfiguration auf einen Blick."
  t031: "/stop beendet alle laufenden Hintergrundprozesse, die der Agent gestartet hat."
  t032: "@file:path/to/file.py fügt den Dateiinhalt direkt in Ihre Nachricht ein."
  t033: "@file:main.py:10-50 fügt nur die Zeilen 10-50 einer Datei ein."
  t034: "@folder:src/ fügt eine Verzeichnisbaum-Auflistung ein."
  t035: "@diff fügt Ihre nicht gestagten Git-Änderungen in die Nachricht ein."
  t036: "@staged fügt Ihre gestagten Git-Änderungen ein (git diff --staged)."
  t037: "@git:5 fügt die letzten 5 Commits mit vollständigen Patches ein."
  t038: "@url:https://example.com ruft eine Webseite ab und fügt ihren Inhalt ein."
  t039: "Die Eingabe von @ startet die Pfadvervollständigung im Dateisystem — navigieren Sie interaktiv zu jeder Datei."
  t040: "Kombinieren Sie mehrere Referenzen: \"Prüfe @file:main.py und @file:test.py auf Konsistenz.\""
  t041: "Alt+Enter fügt einen Zeilenumbruch für mehrzeilige Eingaben ein. (Windows Terminal fängt Alt+Enter ab — verwenden Sie stattdessen Ctrl+Enter.)"
  t042: "Ctrl+C unterbricht den Agenten. Zweimal innerhalb von 2 Sekunden drücken, um das Beenden zu erzwingen."
  t043: "Ctrl+Z legt Hermes in den Hintergrund — führen Sie fg in Ihrer Shell aus, um fortzufahren."
  t044: "Tab übernimmt den Geistertext der Auto-Vervollständigung oder vervollständigt Slash-Befehle."
  t045: "Geben Sie eine neue Nachricht ein, während der Agent arbeitet, um ihn zu unterbrechen und umzulenken."
  t046: "Alt+V fügt ein Bild aus Ihrer Zwischenablage in die Konversation ein."
  t047: "Beim Einfügen von 5+ Zeilen wird der Text automatisch in eine Datei gespeichert und stattdessen eine kompakte Referenz eingefügt."
  t048: "hermes -c setzt Ihre letzte CLI-Sitzung fort. hermes -c \"Projektname\" setzt nach Titel fort."
  t049: "hermes -w erstellt einen isolierten Git-Worktree — perfekt für parallele Agenten-Workflows."
  t050: "hermes -w -q \"Fix issue #42\" kombiniert Worktree-Isolation mit einer einmaligen Abfrage."
  t051: "hermes chat -t web,terminal aktiviert nur bestimmte Toolsets für eine fokussierte Sitzung."
  t052: "hermes chat -s github-pr-workflow lädt einen Skill bereits beim Start vor."
  t053: "hermes chat -q \"query\" führt eine einzelne nicht-interaktive Anfrage aus und beendet sich danach."
  t054: "hermes chat --max-turns 1000 überschreibt das Standardlimit von 500 Iterationen pro Zug."
  t055: "hermes chat --checkpoints aktiviert Dateisystem-Schnappschüsse vor jeder destruktiven Dateiänderung."
  t056: "hermes --yolo umgeht für die gesamte Sitzung alle Genehmigungsabfragen für gefährliche Befehle."
  t057: "hermes chat --source telegram markiert die Sitzung, damit Sie sie in hermes sessions list filtern können."
  t058: "hermes -p work chat läuft unter einem bestimmten Profil, ohne Ihr Standardprofil zu ändern."
  t059: "hermes doctor --fix diagnostiziert Konfigurations- und Abhängigkeitsprobleme und repariert sie automatisch."
  t060: "hermes dump gibt eine kompakte Zusammenfassung Ihrer Einrichtung aus — ideal für Fehlerberichte."
  t061: "hermes config set KEY VALUE legt Geheimnisse automatisch in .env ab und alles andere in config.yaml."
  t062: "hermes config edit öffnet config.yaml in Ihrem Standard-Editor."
  t063: "hermes config check sucht nach fehlenden oder veralteten Konfigurationsoptionen."
  t064: "hermes sessions browse öffnet eine interaktive Sitzungsauswahl mit Suche."
  t065: "hermes sessions stats zeigt die Anzahl der Sitzungen pro Plattform und die Datenbankgröße."
  t066: "hermes sessions prune --older-than 30 räumt alte Sitzungen auf."
  t067: "hermes skills search react --source skills-sh durchsucht das öffentliche Verzeichnis von skills.sh."
  t068: "hermes skills check prüft installierte Hub-Skills auf Upstream-Updates."
  t069: "hermes skills tap add myorg/skills-repo fügt eine eigene GitHub-Skill-Quelle hinzu."
  t070: "hermes skills snapshot export setup.json exportiert Ihre Skill-Konfiguration zur Sicherung oder Weitergabe."
  t071: "hermes mcp add github --command npx fügt MCP-Server über die Befehlszeile hinzu."
  t072: "hermes mcp serve betreibt Hermes selbst als MCP-Server für andere Agenten."
  t073: "hermes auth add lässt Sie mehrere API-Schlüssel für die Rotation im Zugangsdaten-Pool hinzufügen."
  t074: "hermes completion bash >> ~/.bashrc aktiviert die Tab-Vervollständigung für alle Befehle und Profile."
  t075: "hermes logs -f folgt agent.log in Echtzeit. --level WARNING --since 1h filtert die Ausgabe."
  t076: "hermes backup erstellt eine Zip-Sicherung Ihres gesamten Hermes-Stammverzeichnisses."
  t077: "hermes profile create coder erstellt ein isoliertes Profil, das zu einem eigenen Befehl wird."
  t078: "hermes profile create work --clone kopiert Ihre aktuelle Konfiguration und Ihre Schlüssel in ein neues Profil."
  t079: "hermes update synchronisiert neue mitgelieferte Skills automatisch in ALLE Profile."
  t080: "hermes gateway install richtet Hermes als Systemdienst ein (systemd/launchd)."
  t081: "hermes memory setup lässt Sie einen externen Memory-Anbieter konfigurieren (Honcho, Mem0 usw.)."
  t082: "hermes webhook subscribe erstellt ereignisgesteuerte Webhook-Routen mit HMAC-Validierung."
  t083: "Kosten sparen: hermes tools deaktiviert ungenutzte Tools, hermes skills config reduziert die Skills."
  t084: "/reasoning low oder /reasoning minimal senkt die Denktiefe unter den Standard (medium) — schnellere, günstigere Antworten."
  t085: "hermes models leitet Vision-, Komprimierungs- und Hilfsaufgaben an günstigere Modelle — senkt die Token-Kosten im Hintergrund um 85 %+, ohne Ihr Haupt-Chatmodell herabzustufen."
  t086: "Setzen Sie display.bell_on_complete: true in config.yaml, um einen Signalton zu hören, wenn lange Aufgaben abgeschlossen sind."
  t087: "Setzen Sie display.streaming: true, um Tokens in Echtzeit erscheinen zu sehen, während das Modell generiert."
  t088: "Setzen Sie display.show_reasoning: true, um die Gedankenkette des Modells zu verfolgen."
  t089: "Setzen Sie display.compact: true, um Leerraum in der Ausgabe zu reduzieren und Informationen dichter darzustellen."
  t090: "Setzen Sie display.busy_input_mode: queue, um Nachrichten in eine Warteschlange zu stellen, statt den Agenten zu unterbrechen, oder steer, um sie per /steer mitten im Lauf einzuspeisen."
  t091: "Setzen Sie display.resume_display: minimal, um beim Fortsetzen einer Sitzung die vollständige Konversationszusammenfassung zu überspringen."
  t092: "Setzen Sie compression.threshold: 0.50, um zu steuern, wann die automatische Komprimierung auslöst (Standard: 50 % des Kontexts)."
  t093: "Setzen Sie agent.max_turns: 1000, damit der Agent mehr Tool-Aufruf-Schritte pro Zug ausführen darf."
  t094: "Setzen Sie file_read_max_chars: 200000, um die maximale Inhaltsmenge pro read_file-Aufruf zu erhöhen."
  t095: "Setzen Sie approvals.mode: smart, damit ein LLM sichere Befehle automatisch genehmigt und gefährliche automatisch ablehnt."
  t096: "Setzen Sie fallback_model in config.yaml, um automatisch auf einen Ersatz-Anbieter auszuweichen."
  t097: "Setzen Sie privacy.redact_pii: true, um Benutzer-IDs und Telefonnummern zu hashen, bevor sie an das LLM gesendet werden."
  t098: "Setzen Sie browser.record_sessions: true, um Browser-Sitzungen automatisch als WebM-Videos aufzuzeichnen."
  t099: "Setzen Sie worktree: true in config.yaml, um immer einen Git-Worktree zu erstellen (entspricht hermes -w)."
  t100: "Setzen Sie security.website_blocklist.enabled: true, um bestimmte Domains für Web-Tools zu sperren."
  t101: "Setzen Sie cron.wrap_response: false, um die rohe Agenten-Ausgabe ohne Cron-Kopf- und Fußzeile zuzustellen."
  t102: "HERMES_TIMEZONE überschreibt die Server-Zeitzone mit einer beliebigen IANA-Zeitzonenangabe."
  t103: "Umgebungsvariablen lassen sich in config.yaml ersetzen: Verwenden Sie die Syntax ${VAR_NAME}."
  t104: "Schnellbefehle in config.yaml führen Shell-Befehle sofort und ohne Token-Verbrauch aus."
  t105: "Eigene Persönlichkeiten können in config.yaml unter agent.personalities definiert werden."
  t106: "provider_routing steuert bei OpenRouter die Sortierung der Anbieter sowie Whitelists und Blacklists."
  t107: "execute_code führt Python-Skripte aus, die Hermes-Tools programmatisch aufrufen — die Ergebnisse bleiben außerhalb des Kontexts."
  t108: "delegate_task startet standardmäßig bis zu 10 gleichzeitige Sub-Agenten (delegation.max_concurrent_children) mit isolierten Kontexten für parallele Arbeit."
  t109: "web_extract funktioniert mit PDF-URLs — übergeben Sie einen beliebigen PDF-Link, und er wird in Markdown umgewandelt."
  t110: "search_files basiert auf ripgrep und ist schneller als grep — verwenden Sie es statt grep im terminal."
  t111: "patch nutzt 9 Fuzzy-Matching-Strategien, sodass kleine Leerraum-Unterschiede Ihre Änderungen nicht scheitern lassen."
  t112: "patch unterstützt das V4A-Format für Massenänderungen an mehreren Dateien in einem einzigen Aufruf."
  t113: "read_file schlägt ähnliche Dateinamen vor, wenn eine Datei nicht gefunden wird."
  t114: "read_file dedupliziert automatisch — das erneute Lesen einer unveränderten Datei liefert nur einen kompakten Platzhalter."
  t115: "browser_vision macht einen Screenshot und analysiert ihn mit KI — funktioniert auch bei CAPTCHAs und visuellen Inhalten."
  t116: "browser_console kann JavaScript-Ausdrücke im Kontext der Seite auswerten."
  t117: "image_generate erzeugt Bilder mit FLUX 2 Pro und automatischer 2x-Hochskalierung."
  t118: "text_to_speech wandelt Text in Audio um — auf Telegram wird es als Sprachnachricht abgespielt."
  t119: "send_message erreicht aus einer Sitzung heraus jede verbundene Messaging-Plattform."
  t120: "Das todo-Tool hilft dem Agenten, komplexe mehrstufige Aufgaben während einer Sitzung im Blick zu behalten."
  t121: "session_search führt eine Volltextsuche über ALLE vergangenen Konversationen durch."
  t122: "Der Agent speichert Vorlieben, Korrekturen und Fakten zur Umgebung automatisch im Gedächtnis."
  t123: "/moa leitet einen schwierigen Prompt durch Ihr konfiguriertes Mixture-of-Agents-Modellset."
  t124: "Terminal-Befehle unterstützen einen Hintergrundmodus mit notify_on_complete für lang laufende Aufgaben."
  t125: "Hintergrundprozesse im Terminal unterstützen watch_patterns, um bei bestimmten Ausgabezeilen zu benachrichtigen."
  t126: "Das terminal-Tool unterstützt 6 Backends: lokal, Docker, SSH, Modal, Daytona und Singularity."
  t127: "Jedes Profil erhält eigene Konfiguration, API-Schlüssel, Gedächtnis, Sitzungen, Skills und Cron-Jobs."
  t128: "Profilnamen werden zu Shell-Befehlen — 'hermes profile create coder' erstellt den Befehl 'coder'."
  t129: "hermes profile export coder -o backup.tar.gz erstellt ein portables Profilarchiv."
  t130: "Wenn zwei Profile versehentlich denselben Bot-Token verwenden, wird das zweite Gateway mit einer klaren Fehlermeldung blockiert."
  t131: "Sitzungen erhalten nach dem ersten Austausch automatisch aussagekräftige Titel — keine manuelle Benennung nötig."
  t132: "Sitzungstitel unterstützen Abstammung: \"mein Projekt\" → \"mein Projekt #2\" → \"mein Projekt #3\"."
  t133: "Beim Beenden gibt Hermes einen Fortsetzungsbefehl mit Sitzungs-ID und Statistiken aus."
  t134: "hermes sessions export backup.jsonl exportiert alle Sitzungen zur Sicherung oder Analyse."
  t135: "hermes -r SESSION_ID setzt eine beliebige frühere Sitzung anhand ihrer ID fort."
  t136: "Das Gedächtnis ist ein eingefrorener Schnappschuss — Änderungen erscheinen erst beim nächsten Sitzungsstart im System-Prompt."
  t137: "Gedächtniseinträge werden automatisch auf Prompt-Injection- und Exfiltrationsmuster geprüft."
  t138: "Der Agent hat zwei Gedächtnisspeicher: persönliche Notizen (~2200 Zeichen) und Benutzerprofil (~1375 Zeichen)."
  t139: "Korrekturen, die Sie dem Agenten geben (\"nein, mach es so\"), werden oft automatisch im Gedächtnis gespeichert."
  t140: "Über 80 mitgelieferte Skills zu github, creative, mlops, productivity, research und mehr."
  t141: "Jeder installierte Skill wird automatisch zu einem Slash-Befehl — geben Sie / ein, um alle zu sehen."
  t142: "hermes skills install official/security/1password installiert optionale Skills aus dem Repository."
  t143: "Skills können sich auf bestimmte Betriebssysteme beschränken — manche laden nur unter macOS oder Linux."
  t144: "skills.external_dirs in config.yaml lässt Sie Skills aus eigenen Verzeichnissen laden."
  t145: "Der Agent kann mit skill_manage eigene Skills als prozedurales Gedächtnis anlegen."
  t146: "/plan schreibt einen Umsetzungsplan in Markdown nach .hermes/plans/, ohne etwas auszuführen."
  t147: "Cron-Jobs können Skills anhängen: hermes cron add --skill blogwatcher \"Check for new posts\"."
  t148: "Zustellziele für Cron umfassen telegram, discord, slack, email, sms und mehr als 12 weitere Plattformen."
  t149: "Beginnt eine Cron-Antwort mit [SILENT], wird die Zustellung unterdrückt — nützlich für reine Überwachungs-Jobs."
  t150: "Cron unterstützt relative Verzögerungen (30m), Intervalle (every 2h), Cron-Ausdrücke und ISO-Zeitstempel."
  t151: "Cron-Jobs laufen in völlig frischen Agenten-Sitzungen — die Prompts müssen in sich geschlossen sein."
  t152: "Der Sprachmodus funktioniert ganz ohne API-Schlüssel, wenn faster-whisper installiert ist (kostenlose lokale Spracherkennung)."
  t153: "Fünf TTS-Anbieter verfügbar: Edge TTS (kostenlos), ElevenLabs, OpenAI, NeuTTS (kostenlos, lokal), MiniMax."
  t154: "/voice on aktiviert den Sprachmodus in der CLI. Ctrl+B schaltet die Push-to-Talk-Aufnahme um."
  t155: "Streaming-TTS spielt Sätze ab, sobald sie generiert werden — Sie müssen nicht auf die vollständige Antwort warten."
  t156: "Sprachnachrichten auf Telegram, Discord, WhatsApp und Slack werden automatisch transkribiert."
  t157: "Hermes läuft auf 21 Messaging-Plattformen: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, E-Mail und mehr."
  t158: "hermes gateway install richtet es als Systemdienst ein, der beim Booten startet."
  t159: "DingTalk nutzt den Stream Mode — keine Webhooks und keine öffentliche URL nötig."
  t160: "BlueBubbles bringt iMessage über einen lokalen macOS-Server zu Hermes."
  t161: "Webhook-Routen unterstützen HMAC-Validierung, Rate Limiting und Ereignisfilterung."
  t162: "Der API-Server stellt einen OpenAI-kompatiblen Endpunkt bereit, der mit Open WebUI und LibreChat funktioniert."
  t163: "Discord-Sprachkanalmodus: Der Bot tritt dem Sprachkanal bei, transkribiert Gesprochenes und antwortet per Sprache."
  t164: "group_sessions_per_user: true gibt jeder Person in Gruppenchats eine eigene Sitzung."
  t165: "/sethome markiert einen Chat als Heimkanal für die Zustellung von Cron-Jobs."
  t166: "Das Gateway unterstützt inaktivitätsbasierte Zeitlimits — aktive Agenten können unbegrenzt laufen."
  t167: "Die Genehmigung gefährlicher Befehle hat 4 Stufen: einmalig, für diese Sitzung, dauerhaft (permanente Erlaubnisliste), ablehnen."
  t168: "Der Smart-Genehmigungsmodus nutzt ein LLM, um sichere Befehle automatisch zu genehmigen und gefährliche zu markieren."
  t169: "Der SSRF-Schutz blockiert private Netze, Loopback-, Link-Local- und Cloud-Metadaten-Adressen."
  t170: "Das Tirith-Pre-Exec-Scanning erkennt Homograph-URL-Spoofing und Pipe-to-Interpreter-Muster."
  t171: "MCP-Unterprozesse erhalten eine gefilterte Umgebung — nur sichere Systemvariablen werden durchgereicht."
  t172: "Kontextdateien (.hermes.md, AGENTS.md) werden vor dem Laden sicherheitsseitig auf Prompt-Injection geprüft."
  t173: "command_allowlist in config.yaml genehmigt bestimmte Shell-Befehlsmuster dauerhaft."
  t174: "Der Kontext wird beim Erreichen des Schwellenwerts automatisch komprimiert — Erinnerungen werden gesichert und der Verlauf zusammengefasst."
  t175: "Die Statusleiste wird gelb, dann orange, dann rot, während sich der Kontext füllt."
  t176: "SOUL.md ist die primäre Identitätsdatei des Agenten — passen Sie sie an, um sein Verhalten zu formen."
  t177: "Hermes lädt Projektkontext aus .hermes.md, AGENTS.md, CLAUDE.md oder .cursorrules (erster Treffer)."
  t178: "AGENTS.md-Dateien in Unterverzeichnissen werden schrittweise entdeckt, während der Agent in Ordner navigiert."
  t179: "Kontextdateien sind auf 20.000 Zeichen begrenzt, mit intelligenter Kürzung von Anfang und Ende."
  t180: "Fünf Browser-Anbieter: lokales Chromium, Browserbase, Browser Use, Camofox und Firecrawl."
  t181: "Camofox ist ein Anti-Detection-Browser — ein Firefox-Fork mit Fingerprint-Spoofing in C++."
  t182: "browser_navigate liefert automatisch einen Seiten-Schnappschuss — browser_snapshot muss danach nicht aufgerufen werden."
  t183: "browser_vision mit annotate=true blendet nummerierte Beschriftungen über interaktiven Elementen ein."
  t184: "hermes mcp öffnet eine interaktive Auswahl von Nous-geprüften MCPs, die Sie mit einem Tastendruck installieren können."
  t185: "hermes mcp catalog listet die Nous-geprüften MCP-Server auf, die mit dem Repository ausgeliefert werden."
  t186: "hermes mcp install <name> installiert einen Katalogeintrag, fragt Zugangsdaten ab und lässt Sie wählen, welche seiner Tools aktiviert werden."
  t187: "MCP-Server werden in config.yaml konfiguriert — sowohl stdio- als auch HTTP-Transport werden unterstützt."
  t188: "Tool-Filterung pro Server: tools.include erlaubt bestimmte Tools per Whitelist, tools.exclude sperrt sie per Blacklist."
  t189: "MCP-Server erzeugen zur Laufzeit automatisch Toolsets — mit hermes tools können Sie sie pro Plattform umschalten."
  t190: "MCP-OAuth-Unterstützung: auth: oauth aktiviert die browserbasierte Autorisierung mit PKCE."
  t191: "Checkpoints verursachen keinen Overhead, wenn keine Dateien geändert werden — standardmäßig aktiviert."
  t192: "Vor einem Rollback wird automatisch ein Schnappschuss gespeichert, damit Sie das Rückgängigmachen rückgängig machen können."
  t193: "/rollback macht auch den Konversationszug rückgängig, sodass sich der Agent nicht an zurückgerollte Änderungen erinnert."
  t194: "Checkpoints verwenden Schatten-Repositories in ~/.hermes/checkpoints/ — das .git Ihres Projekts wird nie angetastet."
  t195: "batch_runner.py verarbeitet Hunderte von Prompts parallel zur Erzeugung von Trainingsdaten."
  t196: "hermes chat -Q aktiviert den Ruhemodus für die programmatische Nutzung — Banner und Spinner werden unterdrückt."
  t197: "Das Speichern von Trajektorien (--save-trajectories) erfasst vollständige Tool-Nutzungsprotokolle für das Modelltraining."
  t198: "Drei Plugin-Typen: allgemein (Tools/Hooks), Memory-Anbieter und Kontext-Engines."
  t199: "hermes plugins install owner/repo installiert Plugins direkt von GitHub."
  t200: "Externe Memory-Anbieter: OpenViking, Mem0 sind mitgeliefert; Honcho, Hindsight und weitere über hermes plugins install."
  t201: "Plugin-Hooks umfassen pre/post_tool_call, pre/post_llm_call und transform_terminal_output zur Kanonisierung von Ausgaben."
  t202: "Prompt-Caching (Anthropic) senkt die Kosten, indem zwischengespeicherte Präfixe des System-Prompts wiederverwendet werden."
  t203: "Der Agent erzeugt Sitzungstitel automatisch in einem Hintergrund-Thread — ohne Auswirkung auf die Latenz."
  t204: "Intelligentes Modell-Routing kann einfache Anfragen automatisch an ein günstigeres Modell leiten."
  t205: "Slash-Befehle unterstützen Präfix-Abgleich: /h wird zu /help aufgelöst, /mod zu /model."
  t206: "Wenn Sie einen Dateipfad ins Terminal ziehen, werden Bilder automatisch angehängt oder als Kontext gesendet."
  t207: ".worktreeinclude im Stammverzeichnis Ihres Repos listet gitignorierte Dateien auf, die in Worktrees kopiert werden."
  t208: "hermes acp startet Hermes als ACP-Server für die Integration in VS Code, Zed und JetBrains."
  t209: "Eigene Anbieter: Speichern Sie benannte Endpunkte in config.yaml unter custom_providers."
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT injiziert einen System-Prompt, der nie im Verlauf gespeichert wird."
  t211: "credential_pool_strategies unterstützt die Rotationsstrategien fill_first, round_robin, least_used und random."
  t212: "hermes auth add nous oder hermes auth add openai-codex richtet OAuth-basierte Anbieter ein."
  t213: "Der API-Server unterstützt sowohl die Chat Completions API als auch die Responses API mit serverseitigem Zustand."
  t214: "tool_preview_length: 0 in der Konfiguration zeigt vollständige Dateipfade im Aktivitäts-Feed des Spinners."
  t215: "hermes status --deep führt tiefergehende Diagnoseprüfungen über alle Komponenten aus."
  t216: "Cron-Jobs können ein Python-Skript anhängen (--script), dessen stdout als Kontext in den Prompt injiziert wird."
  t217: "Cron-Skripte liegen in ~/.hermes/scripts/ und laufen vor dem Agenten — ideal für Pipelines zur Datensammlung."
  t218: "prefill_messages_file in config.yaml injiziert Few-Shot-Beispiele in jeden API-Aufruf, ohne sie je im Verlauf zu speichern."
  t219: "SOUL.md ersetzt die Standardidentität des Agenten vollständig — schreiben Sie sie um, um Hermes zu Ihrem eigenen zu machen."
  t220: "SOUL.md wird beim ersten Start automatisch mit einer Standardpersönlichkeit befüllt. Bearbeiten Sie sie zum Anpassen."
  t221: "/compress <focus topic> weist Ihrem Thema 60–70 % des Zusammenfassungsbudgets zu und kürzt den Rest aggressiv."
  t222: "Ab der zweiten Komprimierung aktualisiert der Kompressor die vorherige Zusammenfassung, statt von vorn zu beginnen."
  t223: "Vor dem Zurücksetzen einer Gateway-Sitzung schreibt Hermes wichtige Fakten automatisch im Hintergrund ins Gedächtnis."
  t224: "network.force_ipv4: true in config.yaml behebt Hänger auf Servern mit defektem IPv6 — per Monkey-Patch von socket."
  t225: "Das terminal-Tool erläutert gängige Exit-Codes: grep mit Rückgabewert 1 = 'Keine Treffer gefunden (kein Fehler)'."
  t226: "Fehlgeschlagene Terminal-Befehle im Vordergrund werden bis zu 3-mal mit exponentiellem Backoff wiederholt (2s, 4s, 8s)."
  t227: "Reine sudo-Befehle werden automatisch so umgeschrieben, dass SUDO_PASSWORD aus .env per Pipe übergeben wird — keine interaktive Abfrage nötig."
  t228: "execute_code-Helfer erfordern explizite Importe: from hermes_tools import json_parse, shell_quote, retry."
  t229: "Die 7 Sandbox-Tools von execute_code (web_search, terminal, read/write/search/patch) nutzen RPC — sie gelangen nie in den Kontext."
  t230: "Wer denselben Dateibereich 3-mal oder öfter liest, erhält eine Warnung. Ab dem 4. Mal wird hart blockiert, um Schleifen zu verhindern."
  t231: "write_file und patch erkennen, ob eine Datei seit dem letzten Lesen extern geändert wurde, und warnen vor veralteten Inhalten."
  t232: "Das V4A-Patch-Format unterstützt die Direktiven Add File, Delete File und Move File — nicht nur Update."
  t233: "MCP-Server können per Sampling LLM-Vervollständigungen zurückanfordern — der Agent wird so zum Tool für den Server."
  t234: "MCP-Server senden notifications/tools/list_changed, um Tools automatisch neu zu registrieren, ohne Neustart."
  t235: "delegate_task mit acp_command: 'claude' startet Claude Code als untergeordneten Agenten von jeder Plattform aus."
  t236: "Die Delegation hat einen Heartbeat-Thread — Aktivität des Kind-Agenten wird an den Eltern-Agenten weitergegeben und verhindert Gateway-Zeitüberschreitungen."
  t237: "Liefert ein Anbieter HTTP 402 (Zahlung erforderlich), fällt der Hilfs-Client automatisch auf den nächsten zurück."
  t238: "agent.tool_use_enforcement lenkt Modelle, die Aktionen beschreiben statt Tools aufzurufen — für GPT/Codex automatisch aktiv."
  t239: "agent.restart_after_turn_timeout lässt laufende Züge abschließen, bevor /restart in stop() eintritt; restart_drain_timeout ist nur das Budget für erzwungene Unterbrechungen, sobald stop() begonnen hat."
  t240: "agent.api_max_retries (Standard 3) legt fest, wie oft der Agent einen fehlgeschlagenen API-Aufruf wiederholt, bevor der Fehler angezeigt wird — senken Sie den Wert für schnellen Rückfall."
  t241: "Das Gateway hält AIAgent-Instanzen pro Sitzung im Cache — wird dieser Cache zerstört, funktioniert das Prompt-Caching von Anthropic nicht mehr."
  t242: "Jede Website kann Skills über /.well-known/skills/index.json bereitstellen — der Skills-Hub entdeckt sie automatisch."
  t243: "Das Skills-Audit-Log unter ~/.hermes/skills/.hub/audit.log protokolliert jede Installation und Entfernung."
  t244: "Veraltete Git-Worktrees werden beim Start automatisch bereinigt: saubere, vollständig gemergte Trees werden entfernt; ungespeicherte oder nicht gepushte Arbeit bleibt immer erhalten."
  t245: "Profile begrenzen den Hermes-Zustand über HERMES_HOME; Host-Tool-Unterprozesse behalten Ihr echtes HOME, sofern terminal.home_mode nicht auf profile steht."
  t246: "Die Umgebungsvariable HERMES_HOME_MODE (oktal, z. B. 0701) setzt eigene Verzeichnisrechte für den Zugriff durch Webserver."
  t247: "Container-Modus: Legen Sie .container-mode in HERMES_HOME ab, und die Host-CLI wechselt automatisch per exec in den Container."
  t248: "Ctrl+C hat 5 Prioritätsstufen: Aufnahme abbrechen → Eingabeaufforderungen abbrechen → Auswahl abbrechen → Agent unterbrechen → beenden."
  t249: "Jede Unterbrechung während eines Agentenlaufs wird mit Zeitstempel in ~/.hermes/interrupt_debug.log protokolliert."
  t250: "BROWSER_CDP_URL verbindet die Browser-Tools mit jedem laufenden Browser der Chromium-Familie — akzeptiert WebSocket, HTTP oder host:port."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true aktiviert erweiterte Anti-Erkennung mit angepasstem Chromium (Scale Plan)."
  t252: "Die CLI wechselt in Terminals mit weniger als 80 Spalten automatisch in den Kompaktmodus."
  t253: "Schnellbefehle gibt es in zwei Typen: exec (Shell-Befehl direkt ausführen) und alias (Weiterleitung an einen anderen Befehl)."
  t254: "Delegationsmodell pro Aufgabe: delegation.model und delegation.provider in der Konfiguration leiten Subagenten an günstigere Modelle."
  t255: "delegation.reasoning_effort steuert die Denktiefe für Subagenten unabhängig vom Hauptmodell."
  t256: "display.platforms in config.yaml erlaubt Anzeige-Overrides pro Plattform: {telegram: {tool_progress: all}}."
  t257: "human_delay.mode in der Konfiguration simuliert menschliche Tippgeschwindigkeit — Bereich über min_ms/max_ms konfigurierbar."
  t258: "Konfigurationsmigrationen laufen beim Laden automatisch — neue Konfigurationsschlüssel erscheinen ohne manuelles Eingreifen."
  t259: "GPT- und Codex-Modelle erhalten spezielle System-Prompt-Hinweise zu Tool-Disziplin und verpflichtender Tool-Nutzung."
  t260: "Gemini-Modelle erhalten zugeschnittene Anweisungen zu absoluten Pfaden, parallelen Tool-Aufrufen und nicht-interaktiven Befehlen."
  t261: "context.engine in config.yaml kann auf einen Plugin-Namen gesetzt werden, um alternative Strategien der Kontextverwaltung zu nutzen."
  t262: "Browser-Seiten-Schnappschüsse über 15.000 Zeichen werden gekürzt oder automatisch zusammengefasst; der vollständige Schnappschuss wird unter cache/web gespeichert und lässt sich mit read_file seitenweise lesen."
  t263: "Der Kompressor macht einen günstigen Vorlauf: Tool-Ausgaben über 200 Zeichen werden durch Platzhalter ersetzt, bevor das LLM läuft."
  t264: "Schlägt die Komprimierung fehl, werden weitere Versuche 10 Minuten lang pausiert, um die API nicht zu überlasten."
  t265: "Lange gefährliche Befehle (>70 Zeichen) erhalten in der Genehmigungsabfrage eine 'view'-Option, um zuerst den vollständigen Text zu sehen."
  t266: "Die Pegelanzeige zeigt während der Sprachaufnahme ▁▂▃▄▅▆▇-Balken auf Basis der RMS-Pegel des Mikrofons."
  t267: "Profilnamen dürfen nicht mit vorhandenen PATH-Programmen kollidieren — 'hermes profile create ls' würde abgelehnt."
  t268: "hermes profile create backup --clone-all kopiert alles (Konfiguration, Schlüssel, SOUL.md, Erinnerungen, Skills, Sitzungen)."
  t269: "Die Aufnahmetaste für Sprache ist über voice.record_key in config.yaml konfigurierbar — nicht nur Ctrl+B."
  t270: ".cursorrules- und .cursor/rules/*.mdc-Dateien werden automatisch erkannt und als Projektkontext geladen."
  t271: "Kontextdateien werden auf über 10 Prompt-Injection-Muster geprüft — unsichtbares Unicode, 'ignore instructions', Exfiltrationsversuche."
  t272: "GPT-5 und Codex verwenden im Nachrichtenformat die Rolle 'developer' statt 'system'."
  t273: "Hilfs-Overrides pro Aufgabe: auxiliary.vision.provider, auxiliary.compression.model usw. in config.yaml."
  t274: "Der Hilfs-Client behandelt 'main' als Anbieter-Alias — er wird zu Ihrem tatsächlichen Hauptanbieter + Modell aufgelöst."
  t275: "hermes claw migrate --dry-run zeigt eine Vorschau der OpenClaw-Migration, ohne etwas zu schreiben."
  t276: "Eingefügte Dateipfade mit Anführungszeichen oder maskierten Leerzeichen werden automatisch verarbeitet — kein manuelles Aufräumen nötig."
  t277: "Slash-Befehle lösen nie das Zusammenklappen großer Einfügungen aus — /command mit großen Argumenten funktioniert korrekt."
  t278: "Im Unterbrechungsmodus umgehen Slash-Befehle, die während der Agentenausführung eingegeben werden, die Unterbrechungslogik und laufen sofort."
  t279: "HERMES_DEV=1 umgeht die Erkennung des Container-Modus für die lokale Entwicklung."
  t280: "Jeder MCP-Server erhält ein eigenes Toolset (mcp-servername), das sich über hermes tools unabhängig umschalten lässt."
  t281: "MCP-Platzhalter ${ENV_VAR} in der Konfiguration werden beim Start des Servers aufgelöst — auch Variablen aus ~/.hermes/.env."
  t282: "Skills aus vertrauenswürdigen Repos (NousResearch) erhalten die Sicherheitsstufe 'trusted'; Community-Skills werden zusätzlich gescannt."
  t283: "Die Skills-Quarantäne unter ~/.hermes/skills/.hub/quarantine/ hält Skills vor, die auf eine Sicherheitsprüfung warten."
  t284: "/steer <prompt> fügt nach dem nächsten Tool-Aufruf eine Notiz ein — Richtung mitten in der Aufgabe anpassen, ohne zu unterbrechen."
  t285: "/goal <text> setzt ein dauerhaftes Ralph-Loop-Ziel — Hermes setzt Zug um Zug automatisch fort, bis ein Judge es als erledigt bewertet."
  t286: "/snapshot create [label] speichert einen vollständigen Schnappschuss der Hermes-Konfiguration; /snapshot restore <id> stellt ihn später wieder her."
  t287: "/copy [N] kopiert die letzte Antwort des Assistenten in Ihre Zwischenablage, oder mit einer Zahl die N-te von hinten."
  t288: "/redraw erzwingt ein vollständiges Neuzeichnen der UI und behebt Terminal-Verschiebungen nach tmux-Größenänderungen oder Artefakten durch Mausauswahl."
  t289: "/agents (Alias /tasks) zeigt aktive Agenten und laufende Hintergrund-Aufgaben in der aktuellen Sitzung."
  t290: "/footer schaltet die Gateway-Fußzeile in finalen Antworten um, die Modell, Kontext-% und cwd anzeigt."
  t291: "/busy queue|steer|interrupt legt fest, was Enter bewirkt, während Hermes arbeitet."
  t292: "/topic in Telegram-Direktnachrichten aktiviert den nutzerverwalteten Multi-Sitzungs-Topic-Modus — /topic <id> stellt frühere Sitzungen inline wieder her."
  t293: "/approve session|always führt einen ausstehenden gefährlichen Befehl mit dem gewählten Vertrauensbereich aus; /deny lehnt ihn ab."
  t294: "/restart startet das Gateway sanft neu, nachdem aktive Läufe abgeschlossen wurden, und benachrichtigt danach den Anfragenden."
  t295: "/kanban boards switch <slug> wechselt das aktive Multi-Projekt-Kanban-Board direkt aus dem Chat."
  t296: "/reload lädt ~/.hermes/.env in die laufende Sitzung neu — neue API-Schlüssel übernehmen, ohne neu zu starten."
  t297: "cronjob mit no_agent=True führt ein Skript nach Zeitplan aus und sendet dessen stdout direkt — null Tokens, kein LLM."
  t298: "Ein leerer stdout des Cron-Skripts bedeutet einen stillen Tick — nichts wird zugestellt, ideal für Schwellenwert-Wächter."
  t299: "HERMES_CRON_MAX_PARALLEL (Standard 4) begrenzt, wie viele Cron-Jobs pro Tick laufen, damit Lastspitzen Ihre Schlüssel nicht überlasten."
  t300: "Gateway-Hooks liegen unter ~/.hermes/hooks/<name>/ mit HOOK.yaml + handler.py — der Handler muss `handle` heißen."
  t301: "Hook-Ereignisse umfassen gateway:startup, session:start, agent:step und Wildcard-Abonnements wie command:*."
  t302: "Legen Sie eine Checkliste unter ~/.hermes/BOOT.md ab, und ein gateway:startup-Hook führt sie bei jedem Start als einmaligen Agenten aus."
  t303: "hermes curator run --dry-run zeigt eine Vorschau, was der Kurator archivieren oder zusammenführen würde, ohne etwas zu verändern."
  t304: "hermes curator pin <skill> schützt einen Skill fest sowohl vor automatischer Archivierung als auch vor dem skill_manage-Tool des Agenten."
  t305: "hermes curator rollback stellt Skills aus einem Schnappschuss vor dem Lauf wieder her — Backups liegen unter skills/.curator_backups/."
  t306: "hermes auth reset <provider> [target] löscht Cooldowns und Erschöpfungsmarker für einen ganzen Zugangsdaten-Pool oder für ein einzelnes Zugangsdatum per Index, ID oder Label."
  t307: "credential_pool_strategies.<provider>: round_robin rotiert Schlüssel gleichmäßig statt des Standards fill_first."
  t308: "use_gateway: true pro Tool leitet web, image, tts oder browser über Ihr Nous-Abonnement — keine zusätzlichen Schlüssel nötig."
  t309: "provider_routing.data_collection: deny schließt auf OpenRouter Anbieter aus, die Daten speichern."
  t310: "provider_routing.require_parameters: true leitet nur an Anbieter, die jeden Parameter Ihrer Anfrage unterstützen."
  t311: "HERMES_TUI_RESUME=1 verbindet sich beim Start automatisch wieder mit der letzten TUI-Sitzung — praktisch nach SSH-Abbrüchen."
  t312: "HERMES_TUI_THEME=light|dark|<hex> erzwingt das TUI-Theme auf Terminals, die COLORFGBG nicht setzen."
  t313: "Ctrl+G oder Ctrl+X Ctrl+E öffnet in der TUI den Eingabepuffer in $EDITOR für lange mehrzeilige Prompts."
  t314: "Die TUI rendert LaTeX inline — aus $E=mc^2$ wird Unicode-Mathematik statt rohem TeX."
  t315: "hermes dashboard startet eine lokale Web-UI unter 127.0.0.1:9119 — keine Daten verlassen localhost."
  t316: "hermes dashboard bettet die vollständige Hermes-TUI über xterm.js und ein WebSocket-PTY in Ihren Browser ein."
  t317: "Legen Sie eine YAML-Datei mit zwei Palettenfarben in ~/.hermes/dashboard-themes/ ab, um das gesamte Dashboard neu einzukleiden."
  t318: "Dashboard-Plugins sind Drop-in: manifest.json + JS-Bundle in ~/.hermes/dashboard-plugins/ — kein npm-Build erforderlich."
  t319: "layoutVariant: cockpit in einem Dashboard-Theme fügt eine 260px breite linke Leiste hinzu, die Plugins über den sidebar-Slot befüllen können."
  t320: "display.tool_progress_command: true stellt /verbose auf Messaging-Plattformen bereit; standardmäßig ist es nur in der CLI verfügbar."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result benachrichtigt nur, wenn Hintergrund-Aufgaben abgeschlossen sind (statt concise/all/error/off)."
  t322: "HERMES_WRITE_SAFE_ROOT beschränkt write_file/patch auf Verzeichnispräfixe; mehrere Pfade über os.pathsep (: oder ;)."
  t323: "HERMES_IGNORE_RULES überspringt die automatische Injektion von AGENTS.md, SOUL.md, .cursorrules, Gedächtnis und vorgeladenen Skills."
  t324: "HERMES_ACCEPT_HOOKS genehmigt in config.yaml deklarierte, noch unbekannte Shell-Hooks automatisch ohne TTY-Abfrage."
  t325: "auxiliary.goal_judge.model leitet den /goal-Judge an ein günstiges, schnelles Modell, damit die Schleifenkosten nahe null bleiben."
  t326: "Checkpoints überspringen Verzeichnisse mit mehr als 50.000 Dateien, um langsame Git-Operationen in riesigen Monorepos zu vermeiden."
  t327: "tts.provider: piper führt lokale TTS in 44 Sprachen auf der CPU aus — Stimmen werden automatisch nach ~/.hermes/cache/piper-voices/ heruntergeladen."
  t328: "tts.providers.<name>.type: command bindet jede CLI-TTS-Engine mit den Platzhaltern {input_path} und {output_path} ein."
  t329: "API_SERVER_ENABLED=true betreibt neben dem Gateway einen OpenAI-kompatiblen Endpunkt für Open WebUI und LibreChat."
  t330: "GATEWAY_PROXY_URL ermöglicht ein geteiltes Setup: Plattform-I/O lokal, Agentenarbeit an einen entfernten API-Server delegiert."
  t331: "MATRIX_DEVICE_ID fixiert eine stabile Geräte-ID für E2EE — ohne sie rotieren die Schlüssel bei jedem Start und ältere Nachrichten lassen sich nicht mehr entschlüsseln."
  t332: "TELEGRAM_WEBHOOK_SECRET ist erforderlich, sobald TELEGRAM_WEBHOOK_URL gesetzt ist — erzeugen Sie es mit openssl rand -hex 32."
  t333: "batch_runner.py --resume gleicht erledigte Prompts anhand ihres Textes ab, sodass eine Umsortierung des Datensatzes fertige Arbeit nicht erneut ausführt."
  t334: "/new startet an Ort und Stelle eine neue Sitzung (Alias /reset) — neue Sitzungs-ID, leerer Verlauf, die CLI bleibt offen."
  t335: "/clear leert den Terminalbildschirm UND startet eine neue Sitzung — ein Kürzel für einen visuellen Neuanfang."
  t336: "/history gibt die aktuelle Konversation inline aus, ohne die CLI zu verlassen — nützlich zum schnellen Nachlesen."
  t337: "/save schreibt die aktuelle Konversation auf die Festplatte, ohne die Sitzung zu beenden."
  t338: "/status zeigt Sitzungsinfos auf einen Blick: ID, Titel, Modell, Token-Verbrauch und verstrichene Zeit."
  t339: "/image <path> hängt eine lokale Bilddatei an Ihren nächsten Prompt an — ohne Einfügen oder Drag-and-drop."
  t340: "/platforms zeigt den Verbindungsstatus von Gateway und Messaging-Plattformen direkt im Chat."
  t341: "/commands blättert durch die vollständige Liste der Slash-Befehle und installierten Skills — nützlich auf Plattformen ohne Tab-Vervollständigung."
  t342: "/toolsets listet jedes verfügbare Toolset auf, damit Sie wissen, was -t/--toolsets akzeptiert."
  t343: "/voice tts schaltet den reinen TTS-Modus um — der Agent antwortet laut, aber Sie tippen Ihre Prompts weiterhin."
  t344: "/reload-skills durchsucht ~/.hermes/skills/ erneut, sodass Drop-in-Skills ohne Neustart der Sitzung erscheinen."
  t345: "/indicator kaomoji|emoji|unicode|ascii wählt den Stil der TUI-Beschäftigt-Anzeige, die während Agentenläufen erscheint."
  t346: "/debug lädt ein Support-Bundle hoch (Systeminfos + Logs) und liefert teilbare Links — funktioniert auch im Chat."
  t347: "hermes -z \"<prompt>\" ist der reinste One-Shot: nur die finale Antwort auf stdout, sonst nichts — ideal für Pipes in Skripten."
  t348: "hermes chat --pass-session-id injiziert die Sitzungs-ID in den System-Prompt, damit der Agent sich selbst darauf beziehen kann."
  t349: "hermes chat --image path/to/pic.png hängt ein lokales Bild an eine einzelne -q-Anfrage an, ohne separaten Upload-Schritt."
  t350: "hermes chat --ignore-user-config überspringt die aktive Benutzerkonfiguration — für reproduzierbare Fehlerberichte und CI-Läufe."
  t351: "hermes chat --source tool markiert programmatische Chats, damit sie die Liste von hermes sessions list nicht überladen."
  t352: "hermes dump --show-keys enthält geschwärzte Fingerabdrücke der API-Keys für tieferes Support-Debugging."
  t353: "hermes sessions rename <ID> \"neuer Titel\" benennt jede frühere Sitzung um; hermes sessions delete <ID> entfernt eine."
  t354: "hermes import stellt ein vollständiges Hermes-Backup-Zip wieder her; Sitzungs-Exporte als JSON/JSONL importieren Sie über die Seite „Sessions“ im Dashboard."
  t355: "hermes fallback verwaltet die fallback_model-Kette interaktiv — kein manuelles Editieren von config.yaml nötig."
  t356: "hermes pairing rotiert den Kopplungs-Token für Direktnachrichten — wer nach der Rotation zuerst schreibt, erhält Zugriff auf den Bot."
  t357: "hermes setup führt neue Nutzer in einem interaktiven Ablauf durch Anbieter, Keys und Plattform-Anbindung."
  t358: "hermes status --deep führt die vollständige Gesundheitsprüfung über alle Komponenten aus; das einfache hermes status ist die Schnellansicht."
  t359: "HERMES_AGENT_TIMEOUT=0 deaktiviert das Beenden eines laufenden Agenten bei Gateway-Inaktivität — nützlich für lange Recherche-Läufe."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 lädt repo-lokale Plugins aus ./.hermes/plugins/ automatisch — absichtlich mit Vertrauensprüfung."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 schaltet bei patch und write_file die Prüfung „Datei seit dem Lesen geändert“ ab."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true erlaubt Web-Tools den Zugriff auf localhost und private Netze — im Gateway-Modus standardmäßig aus."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 installiert beim ersten Start pro Profil automatisch zusätzliche Skills aus dem optionalen Katalog."
  t364: "HERMES_BUNDLED_SKILLS verweist auf einen eigenen Baum gebündelter Skills — genutzt von der Homebrew- und Nix-Paketierung."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 schreibt jede API-Request-Payload nach stdout statt in Log-Dateien."
  t366: "HERMES_OAUTH_TRACE=1 protokolliert geschwärzte OAuth-Token-Austausch- und Refresh-Versuche zum Debuggen der Anbieter-Authentifizierung."
  t367: "HERMES_STREAM_RETRIES (Standard 3) steuert die Wiederverbindungsversuche mitten im Stream bei vorübergehenden Netzwerkfehlern."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false unterdrückt die ⚡/⏳/⏩-Bestätigungen, wenn ein Nutzer einem beschäftigten Agenten schreibt."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (Standard 180s) legt fest, wie oft das Gateway bei langen Zügen Fortschrittsmeldungen sendet."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (Standard 900s) begrenzt, wie lange /restart auf laufende Runs wartet, bevor es erzwungen wird."
  t371: "HERMES_CHECKPOINT_TIMEOUT (Standard 30s) begrenzt das Erstellen von Dateisystem-Checkpoints — bei riesigen Monorepos erhöhen."
  t372: "image_gen.model in config.yaml wählt das FAL-Modell: flux-2/klein, gpt-image-2, nano-banana-pro und weitere."
  t373: "image_gen.provider leitet die Bilderzeugung statt über den Standard durch ein Plugin (OpenAI Images, Codex, FAL)."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY richten die Bildanalyse auf einen beliebigen OpenAI-kompatiblen Endpunkt."
  t375: "security.tirith_fail_open: false lässt Hermes Befehle blockieren, wenn der tirith-Scanner selbst mit einem Fehler abbricht."
  t376: "Die Umgebungsvariable TIRITH_FAIL_OPEN überschreibt die Konfiguration tirith_fail_open — ein schneller Schalter ohne Editieren von config.yaml."
  t377: "Chats mit --source tool sind in hermes sessions list standardmäßig ausgeblendet — setzen Sie --source explizit, um sie zu sehen."
  t378: "Sitzungs-IDs beginnen mit einem Zeitstempel (20250305_091523_abcd), sodass die Sortierung in ls und jq natürlich funktioniert."
  t379: "API_SERVER_MODEL_NAME passt den Modellnamen unter /v1/models an — unerlässlich für Open-WebUI-Setups mit mehreren Profilen."
  t380: "Dashboard-Plugins werden unter /dashboard-plugins/<name>/ ausgeliefert — legen Sie die Dateien in ~/.hermes/dashboard-plugins/ ab."
  placeholder:
    p01: "Fragen Sie etwas oder geben Sie / für Befehle ein…"
    p02: "Fasse zusammen, was in diesem Ordner liegt"
    p03: "Entwirf eine Antwort auf die letzte E-Mail in meinem Posteingang"
    p04: "Plane ein Feature und baue es dann Schritt für Schritt"
    p05: "Finde und behebe einen fehlschlagenden Test"
    p06: "Recherchiere dieses Thema und schreib mir eine kurze Zusammenfassung"
    p07: "Was hat sich in diesem Repo zuletzt geändert?"
    p08: "Mach aus diesen Notizen eine To-do-Liste"
    p09: "Erkläre diesen Fehler und wie ich ihn behebe"
    p10: "Richte eine Erinnerung ein oder plane eine wiederkehrende Aufgabe"
    p11: "Geben Sie / ein, um Befehle zu durchsuchen, oder Ctrl+P für die Palette"
