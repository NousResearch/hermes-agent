    fallback_prior_turn_content: "aucun nouveau contenu n'a été produit ce tour ; affichage du contexte précédent récupéré. Envoyez `continue` pour réessayer."
    redirect_restart_limit_exceeded: "la requête a été annulée par une nouvelle correction à chaque tentative, le tour s'est donc arrêté au lieu de réessayer indéfiniment. Votre dernière correction est mise en file comme prochain message."
    rebuilt_restart_limit_exceeded: "chaque fournisseur de la chaîne de repli a basculé en échec à son tour, le tour s'est donc arrêté au lieu de réessayer indéfiniment. Envoyez `continue` ou changez de fournisseur."
    budget_exhausted: "le budget d'itérations/de coût par tour a été épuisé avant d'obtenir une réponse finale. Envoyez `continue` pour poursuivre."
    ollama_runtime_context_too_small: "la fenêtre de contexte du modèle local était trop petite pour terminer. Augmentez la taille du contexte ou utilisez un modèle plus grand."
    pending_tool_result: "le tour s'est arrêté alors qu'un résultat d'outil était encore en attente et le modèle n'a produit aucun texte de suite. Envoyez `continue` pour le laisser résumer."
    interrupted_during_api_call: "la requête a été interrompue en cours d'appel avant de recevoir une réponse. Envoyez `continue` pour réessayer."
    max_iterations_reached: "la limite maximale d'itérations d'outils a été atteinte avant d'obtenir une réponse finale. Envoyez `continue` pour poursuivre, ou augmentez `max_iterations`."
    error_near_max_iterations: "une erreur s'est produite près de la limite d'itérations avant d'obtenir une réponse finale. Vérifiez la sortie de l'outil ci-dessus, puis envoyez `continue`."
    repeated_outer_errors: "le tour échouait sans cesse avec des erreurs répétées et a été arrêté prématurément au lieu de réessayer indéfiniment. Vérifiez les erreurs ci-dessus, puis envoyez `continue` pour réessayer."
  persistence:
    compression: "le tour a été arrêté car un autre processus compressait cette session. Votre message devrait déjà être enregistré — renvoyez-le une fois la compression terminée."
    compression_closed: "le tour a été arrêté car cette session a été renouvelée par la compression du contexte et sa continuation en cours n'a pas pu être reprise. Le stockage lui-même est sain — actualisez le client (ou démarrez un nouveau tour) pour qu'il récupère le nouvel identifiant de session, puis renvoyez votre message."
    turn_lease: "le tour a été arrêté car un autre processus Hermes a pris le contrôle de cette session. Votre réponse n'a pas été enregistrée — attendez que l'autre processus termine, puis renvoyez votre message."
    session_row_missing: "cette session a été supprimée du stockage alors que la discussion était encore ouverte, et Hermes n'a pas pu la recréer ; ce message n'a donc pas été enregistré. Renvoyez votre message ; si l'échec persiste, lancez `hermes {profile_arg}doctor`."
    locked: "le tour a été arrêté car le stockage de session était occupé (un autre processus Hermes écrivait dans la base d'état). Votre message devrait déjà être enregistré — renvoyez-le dans un instant."
    replaced: "le fichier de base de données des sessions a été remplacé pendant que Hermes tournait, ce message n'a donc pas été enregistré (une copie est conservée dans {home}/sessions/). Arrêtez Hermes (`hermes {profile_arg}gateway stop`), lancez `hermes {profile_arg}doctor` — et non `hermes {profile_arg}doctor --fix`, qui réparerait le mauvais fichier sur place — puis redémarrez-le et renvoyez votre message. Les étapes de récupération avancées figurent dans le journal."
    deleted_wal: "un autre processus Hermes détient encore une ancienne copie du journal d'écriture anticipée (WAL) de la base de données des sessions ; Hermes a donc cessé d'écrire pour préserver le fichier et ce message n'a pas été enregistré (une copie est conservée dans {home}/sessions/). Rien n'est perdu. Quittez tous les processus Hermes de ce profil (application Desktop, `hermes {profile_arg}gateway stop`, tableau de bord, cron), lancez `hermes {profile_arg}doctor` — il indique tout processus qui détient encore le journal — puis redémarrez Hermes et renvoyez votre message. Ne lancez pas `doctor --fix` et ne supprimez aucun fichier state.db tant qu'ils tournent. Guide : {recovery_docs}"
    corrupt: |-
      le tour a été arrêté car la base d'état a signalé une corruption structurelle (la transcription aurait été perdue au redémarrage). Libérer de l'espace disque ne servira à rien. Options de récupération :
      1. Lancez `hermes {profile_arg}doctor --fix`
      2. Arrêtez le gateway, puis récupérez avec :
         hermes {profile_arg}sessions recover --source {db_path} --inspect-only
         (s'il indique que la récupération est possible) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db
         — la récupération prend d'abord un instantané du fichier endommagé ; ne lancez PAS `sqlite3 ... \".recover\"` sur le state.db actif, une CLI sqlite3 vulnérable peut l'endommager davantage
      3. Restaurez une sauvegarde depuis {backups_dir}/
      Puis renvoyez votre message.
    fts_index: "le tour a été arrêté car l'index de recherche des sessions (FTS5) est corrompu et n'a pas pu être détaché ; ce message n'a donc pas été enregistré. Le stockage des messages lui-même n'est pas endommagé : ne lancez pas d'outils de récupération et ne restaurez pas de sauvegarde. Lancez `hermes {profile_arg}doctor --fix` (ou redémarrez Hermes, qui répare l'index à l'ouverture), puis renvoyez votre message."
    disk: "Hermes n'a pas pu enregistrer cette conversation sur le disque et s'est donc arrêté plutôt que de perdre vos messages. Le disque est probablement plein : libérez de l'espace (ou corrigez les permissions de {home}/state.db), puis renvoyez votre message."
    default: "Hermes n'a pas pu enregistrer cette conversation et s'est donc arrêté plutôt que de perdre vos messages. Causes possibles : le disque est plein, ou un autre processus Hermes détient la base de données. Fermez les autres fenêtres Hermes, lancez `hermes {profile_arg}doctor` pour vérifier le stockage, puis renvoyez votre message."
  file_mutation:
    header: "⚠️ Vérificateur de modifications de fichiers : {count} modification(s) de fichier ont ÉCHOUÉ ce tour, quoi qu'en dise le texte ci-dessus. Lancez `git status` ou `read_file` pour vérifier ce qui a réellement été appliqué."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "échec"
  shared:
    and_more: "  • … et {count} de plus"
    the_model: "Le modèle"
tips:
  t001: "/bg <prompt> exécute une tâche dans une session séparée pendant que la vôtre reste disponible ; /btw <question> répond à une question annexe sur cette conversation sans l'interrompre."
  t002: "/branch duplique la session actuelle pour explorer une autre piste sans perdre votre progression."
  t003: "/compress compresse manuellement le contexte de la conversation quand elle devient longue."
  t004: "/rollback liste les points de contrôle du système de fichiers — restaurez les fichiers modifiés par l'agent à n'importe quel état antérieur."
  t005: "/rollback diff 2 affiche ce qui a changé depuis le point de contrôle 2 sans rien restaurer."
  t006: "/rollback 2 src/file.py restaure un seul fichier depuis un point de contrôle précis."
  t007: "/title \"mon projet\" nomme votre session — reprenez-la plus tard avec /resume ou hermes -c."
  t008: "/resume reprend là où vous vous étiez arrêté dans une session nommée précédemment."
  t009: "/queue <prompt> met un message en file pour le tour suivant sans interrompre le tour en cours."
  t010: "/undo supprime le dernier échange utilisateur/assistant de la conversation."
  t011: "/retry renvoie votre dernier message — pratique quand la réponse de l'agent n'était pas tout à fait celle attendue."
  t012: "/verbose fait défiler l'affichage de la progression des outils : off → new → all → verbose."
  t013: "/reasoning high augmente la profondeur de réflexion du modèle. /reasoning show affiche le raisonnement."
  t014: "/fast active ou désactive le traitement prioritaire pour des réponses API plus rapides (selon le fournisseur)."
  t015: "/yolo ignore toutes les demandes d'approbation de commandes dangereuses pour le reste de la session."
  t016: "/model permet de changer de modèle en cours de session — essayez /model sonnet ou /model gpt-5."
  t017: "/model --global change votre modèle par défaut de façon permanente."
  t018: "/personality pirate donne une personnalité amusante — 14 options intégrées, de kawaii à shakespeare."
  t019: "/skin change le thème de la CLI — essayez ares, mono, slate, poseidon ou charizard."
  t020: "/statusbar affiche ou masque une barre persistante indiquant le modèle, les tokens, le % de contexte utilisé, le coût et la durée."
  t021: "/tools disable browser retire temporairement les outils navigateur pour la session en cours."
  t022: "/browser connect rattache les outils navigateur à votre navigateur de la famille Chromium déjà ouvert via CDP."
  t023: "/plugins liste les plugins installés et leur état."
  t024: "/cron gère les tâches planifiées — configurez des prompts récurrents livrés sur n'importe quelle plateforme."
  t025: "/reload-mcp recharge à chaud la configuration des serveurs MCP sans redémarrer."
  t026: "/usage affiche la consommation de tokens, la répartition des coûts et la durée de la session."
  t027: "/insights affiche les statistiques d'utilisation des 30 derniers jours."
  t028: "/paste vérifie si votre presse-papiers contient une image et la joint à votre prochain message."
  t029: "/profile indique quel profil est actif et son répertoire personnel."
  t030: "/config affiche votre configuration actuelle en un coup d'œil."
  t031: "/stop tue tous les processus d'arrière-plan lancés par l'agent."
  t032: "@file:path/to/file.py injecte le contenu d'un fichier directement dans votre message."
  t033: "@file:main.py:10-50 injecte uniquement les lignes 10 à 50 d'un fichier."
  t034: "@folder:src/ injecte l'arborescence d'un répertoire."
  t035: "@diff injecte vos modifications git non indexées dans le message."
  t036: "@staged injecte vos modifications git indexées (git diff --staged)."
  t037: "@git:5 injecte les 5 derniers commits avec leurs patches complets."
  t038: "@url:https://example.com récupère le contenu d'une page web et l'injecte."
  t039: "Taper @ déclenche la complétion des chemins du système de fichiers — naviguez vers n'importe quel fichier de façon interactive."
  t040: "Combinez plusieurs références : \"Relis @file:main.py et @file:test.py pour vérifier la cohérence.\""
  t041: "Alt+Enter insère un saut de ligne pour une saisie multiligne. (Windows Terminal intercepte Alt+Enter — utilisez Ctrl+Enter à la place.)"
  t042: "Ctrl+C interrompt l'agent. Appuyez deux fois en moins de 2 secondes pour forcer la sortie."
  t043: "Ctrl+Z suspend Hermes en arrière-plan — lancez fg dans votre shell pour reprendre."
  t044: "Tab accepte le texte fantôme de l'auto-suggestion ou complète les commandes slash."
  t045: "Tapez un nouveau message pendant que l'agent travaille pour l'interrompre et le réorienter."
  t046: "Alt+V colle une image depuis votre presse-papiers dans la conversation."
  t047: "Coller 5 lignes ou plus enregistre automatiquement le texte dans un fichier et insère une référence compacte à la place."
  t048: "hermes -c reprend votre session CLI la plus récente. hermes -c \"nom du projet\" reprend par titre."
  t049: "hermes -w crée un worktree git isolé — idéal pour les workflows d'agents en parallèle."
  t050: "hermes -w -q \"Corrige l'issue #42\" combine l'isolation par worktree et une requête ponctuelle."
  t051: "hermes chat -t web,terminal n'active que certains jeux d'outils pour une session ciblée."
  t052: "hermes chat -s github-pr-workflow précharge une skill au lancement."
  t053: "hermes chat -q \"requête\" exécute une seule requête non interactive puis quitte."
  t054: "hermes chat --max-turns 1000 remplace la limite par défaut de 500 itérations par tour."
  t055: "hermes chat --checkpoints active des instantanés du système de fichiers avant chaque modification destructive."
  t056: "hermes --yolo contourne toutes les demandes d'approbation de commandes dangereuses pour toute la session."
  t057: "hermes chat --source telegram étiquette la session pour la filtrer dans hermes sessions list."
  t058: "hermes -p work chat s'exécute sous un profil précis sans changer votre profil par défaut."
  t059: "hermes doctor --fix diagnostique et répare automatiquement les problèmes de configuration et de dépendances."
  t060: "hermes dump produit un résumé compact de votre installation — parfait pour les rapports de bug."
  t061: "hermes config set KEY VALUE dirige automatiquement les secrets vers .env et tout le reste vers config.yaml."
  t062: "hermes config edit ouvre config.yaml dans votre éditeur par défaut."
  t063: "hermes config check recherche les options de configuration manquantes ou obsolètes."
  t064: "hermes sessions browse ouvre un sélecteur de sessions interactif avec recherche."
  t065: "hermes sessions stats affiche le nombre de sessions par plateforme et la taille de la base de données."
  t066: "hermes sessions prune --older-than 30 nettoie les anciennes sessions."
  t067: "hermes skills search react --source skills-sh cherche dans l'annuaire public skills.sh."
  t068: "hermes skills check vérifie si des mises à jour sont disponibles pour les skills installées depuis le hub."
  t069: "hermes skills tap add myorg/skills-repo ajoute une source de skills GitHub personnalisée."
  t070: "hermes skills snapshot export setup.json exporte votre configuration de skills pour sauvegarde ou partage."
  t071: "hermes mcp add github --command npx ajoute des serveurs MCP depuis la ligne de commande."
  t072: "hermes mcp serve fait tourner Hermes lui-même comme serveur MCP pour d'autres agents."
  t073: "hermes auth add permet d'ajouter plusieurs clés API pour la rotation d'un pool d'identifiants."
  t074: "hermes completion bash >> ~/.bashrc active la complétion par Tab pour toutes les commandes et tous les profils."
  t075: "hermes logs -f suit agent.log en temps réel. --level WARNING --since 1h filtre la sortie."
  t076: "hermes backup crée une sauvegarde zip de tout votre répertoire personnel Hermes."
  t077: "hermes profile create coder crée un profil isolé qui devient sa propre commande."
  t078: "hermes profile create work --clone copie votre configuration et vos clés actuelles dans un nouveau profil."
  t079: "hermes update synchronise automatiquement les nouvelles skills intégrées vers TOUS les profils."
  t080: "hermes gateway install installe Hermes comme service système (systemd/launchd)."
  t081: "hermes memory setup permet de configurer un fournisseur de mémoire externe (Honcho, Mem0, etc.)."
  t082: "hermes webhook subscribe crée des routes webhook événementielles avec validation HMAC."
  t083: "Économisez : hermes tools désactive les outils inutilisés, hermes skills config allège les skills."
  t084: "/reasoning low ou /reasoning minimal réduit la profondeur de réflexion sous la valeur par défaut (medium) — réponses plus rapides et moins chères."
  t085: "hermes models route la vision, la compression et les tâches auxiliaires vers des modèles moins chers — réduit le coût des tokens d'arrière-plan de plus de 85 % sans dégrader votre modèle de chat principal."
  t086: "Définissez display.bell_on_complete: true dans config.yaml pour entendre une sonnerie à la fin des tâches longues."
  t087: "Définissez display.streaming: true pour voir les tokens apparaître en temps réel pendant que le modèle génère."
  t088: "Définissez display.show_reasoning: true pour suivre la chaîne de raisonnement du modèle."
  t089: "Définissez display.compact: true pour réduire les espaces dans la sortie et afficher l'information plus densément."
  t090: "Définissez display.busy_input_mode: queue pour mettre les messages en file au lieu d'interrompre l'agent, ou steer pour les injecter en cours d'exécution via /steer."
  t091: "Définissez display.resume_display: minimal pour sauter le récapitulatif complet de la conversation à la reprise d'une session."
  t092: "Définissez compression.threshold: 0.50 pour contrôler le déclenchement de la compression automatique (par défaut : 50 % du contexte)."
  t093: "Définissez agent.max_turns: 1000 pour laisser l'agent effectuer davantage d'appels d'outils par tour."
  t094: "Définissez file_read_max_chars: 200000 pour augmenter le contenu maximal par appel read_file."
  t095: "Définissez approvals.mode: smart pour laisser un LLM approuver automatiquement les commandes sûres et refuser les dangereuses."
  t096: "Définissez fallback_model dans config.yaml pour basculer automatiquement vers un fournisseur de secours."
  t097: "Définissez privacy.redact_pii: true pour hacher les identifiants utilisateur et numéros de téléphone avant l'envoi au LLM."
  t098: "Définissez browser.record_sessions: true pour enregistrer automatiquement les sessions navigateur en vidéos WebM."
  t099: "Définissez worktree: true dans config.yaml pour toujours créer un worktree git (équivalent de hermes -w)."
  t100: "Définissez security.website_blocklist.enabled: true pour bloquer certains domaines dans les outils web."
  t101: "Définissez cron.wrap_response: false pour livrer la sortie brute de l'agent sans l'en-tête ni le pied de page cron."
  t102: "HERMES_TIMEZONE remplace le fuseau horaire du serveur par n'importe quel identifiant de fuseau IANA."
  t103: "La substitution de variables d'environnement fonctionne dans config.yaml : utilisez la syntaxe ${VAR_NAME}."
  t104: "Les commandes rapides dans config.yaml exécutent instantanément des commandes shell sans consommer aucun token."
  t105: "Des personnalités personnalisées peuvent être définies dans config.yaml sous agent.personalities."
  t106: "provider_routing contrôle le tri, la liste blanche et la liste noire des fournisseurs OpenRouter."
  t107: "execute_code exécute des scripts Python qui appellent les outils Hermes par programmation — les résultats restent hors du contexte."
  t108: "delegate_task lance jusqu'à 10 sous-agents simultanés par défaut (delegation.max_concurrent_children) avec des contextes isolés pour le travail en parallèle."
  t109: "web_extract fonctionne sur les URL de PDF — passez n'importe quel lien PDF et il le convertit en markdown."
  t110: "search_files s'appuie sur ripgrep et est plus rapide que grep — utilisez-le à la place du grep du terminal."
  t111: "patch utilise 9 stratégies de correspondance floue pour que de petites différences d'espacement ne cassent pas les modifications."
  t112: "patch prend en charge le format V4A pour modifier plusieurs fichiers en un seul appel."
  t113: "read_file suggère des noms de fichiers similaires quand un fichier est introuvable."
  t114: "read_file déduplique automatiquement — relire un fichier inchangé renvoie un stub léger."
  t115: "browser_vision prend une capture d'écran et l'analyse avec l'IA — fonctionne pour les CAPTCHA et les contenus visuels."
  t116: "browser_console peut évaluer des expressions JavaScript dans le contexte de la page."
  t117: "image_generate crée des images avec FLUX 2 Pro et une mise à l'échelle 2x automatique."
  t118: "text_to_speech convertit du texte en audio — lu sous forme de bulles vocales sur Telegram."
  t119: "send_message peut joindre n'importe quelle plateforme de messagerie connectée depuis une session."
  t120: "L'outil todo aide l'agent à suivre les tâches complexes en plusieurs étapes au cours d'une session."
  t121: "session_search effectue une recherche plein texte dans TOUTES les conversations passées."
  t122: "L'agent enregistre automatiquement en mémoire vos préférences, vos corrections et des faits sur l'environnement."
  t123: "/moa fait passer un prompt difficile par votre ensemble de modèles Mixture of Agents configuré."
  t124: "Les commandes du terminal prennent en charge le mode arrière-plan avec notify_on_complete pour les tâches longues."
  t125: "Les processus d'arrière-plan du terminal prennent en charge watch_patterns pour alerter sur des lignes de sortie précises."
  t126: "L'outil terminal prend en charge 6 backends : local, Docker, SSH, Modal, Daytona et Singularity."
  t127: "Chaque profil dispose de sa propre configuration, de ses clés API, de sa mémoire, de ses sessions, de ses skills et de ses tâches cron."
  t128: "Les noms de profil deviennent des commandes shell — 'hermes profile create coder' crée la commande 'coder'."
  t129: "hermes profile export coder -o backup.tar.gz crée une archive de profil portable."
  t130: "Si deux profils partagent par erreur le même token de bot, le second gateway est bloqué avec une erreur explicite."
  t131: "Les sessions génèrent automatiquement un titre descriptif après le premier échange — aucun nommage manuel nécessaire."
  t132: "Les titres de session gèrent la filiation : \"mon projet\" → \"mon projet #2\" → \"mon projet #3\"."
  t133: "À la sortie, Hermes affiche une commande de reprise avec l'ID de session et des statistiques."
  t134: "hermes sessions export backup.jsonl exporte toutes les sessions pour sauvegarde ou analyse."
  t135: "hermes -r SESSION_ID reprend n'importe quelle session passée par son ID."
  t136: "La mémoire est un instantané figé — les changements n'apparaissent dans le prompt système qu'au démarrage de la session suivante."
  t137: "Les entrées de mémoire sont automatiquement analysées pour détecter les injections de prompt et les tentatives d'exfiltration."
  t138: "L'agent a deux espaces de mémoire : les notes personnelles (~2200 caractères) et le profil utilisateur (~1375 caractères)."
  t139: "Les corrections que vous donnez à l'agent (\"non, fais-le comme ça\") sont souvent enregistrées automatiquement en mémoire."
  t140: "Plus de 80 skills intégrées couvrant github, creative, mlops, productivity, research et bien d'autres."
  t141: "Chaque skill installée devient automatiquement une commande slash — tapez / pour toutes les voir."
  t142: "hermes skills install official/security/1password installe des skills optionnelles depuis le dépôt."
  t143: "Les skills peuvent être limitées à certains systèmes — certaines ne se chargent que sous macOS ou Linux."
  t144: "skills.external_dirs dans config.yaml permet de charger des skills depuis des répertoires personnalisés."
  t145: "L'agent peut créer ses propres skills comme mémoire procédurale grâce à skill_manage."
  t146: "/plan écrit un plan d'implémentation en markdown dans .hermes/plans/ sans rien exécuter."
  t147: "Les tâches cron peuvent embarquer une skill : hermes cron add --skill blogwatcher \"Vérifie les nouveaux articles\"."
  t148: "Les cibles de livraison cron incluent telegram, discord, slack, email, sms et plus de 12 autres plateformes."
  t149: "Si une réponse cron commence par [SILENT], la livraison est supprimée — pratique pour les tâches de simple surveillance."
  t150: "Cron accepte les délais relatifs (30m), les intervalles (every 2h), les expressions cron et les horodatages ISO."
  t151: "Les tâches cron s'exécutent dans des sessions d'agent entièrement neuves — les prompts doivent être autonomes."
  t152: "Le mode vocal fonctionne sans aucune clé API si faster-whisper est installé (reconnaissance vocale locale gratuite)."
  t153: "Cinq fournisseurs TTS disponibles : Edge TTS (gratuit), ElevenLabs, OpenAI, NeuTTS (local gratuit), MiniMax."
  t154: "/voice on active le mode vocal dans la CLI. Ctrl+B active ou désactive l'enregistrement en appuyer-pour-parler."
  t155: "Le TTS en streaming lit les phrases au fil de leur génération — pas besoin d'attendre la réponse complète."
  t156: "Les messages vocaux sur Telegram, Discord, WhatsApp et Slack sont transcrits automatiquement."
  t157: "Hermes fonctionne sur 21 plateformes de messagerie : Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, e-mail et plus."
  t158: "hermes gateway install l'installe comme service système démarré au boot."
  t159: "DingTalk utilise le Stream Mode — aucun webhook ni URL publique nécessaire."
  t160: "BlueBubbles apporte iMessage à Hermes via un serveur macOS local."
  t161: "Les routes webhook prennent en charge la validation HMAC, la limitation de débit et le filtrage d'événements."
  t162: "Le serveur API expose un endpoint compatible OpenAI, utilisable avec Open WebUI et LibreChat."
  t163: "Mode salon vocal Discord : le bot rejoint le salon, transcrit la parole et répond à la voix."
  t164: "group_sessions_per_user: true donne à chaque personne sa propre session dans les discussions de groupe."
  t165: "/sethome désigne une conversation comme canal principal pour la livraison des tâches cron."
  t166: "Le gateway gère des délais d'expiration basés sur l'inactivité — les agents actifs peuvent tourner indéfiniment."
  t167: "L'approbation des commandes dangereuses a 4 niveaux : once, session, always (liste d'autorisation permanente), deny."
  t168: "Le mode d'approbation intelligent utilise un LLM pour approuver automatiquement les commandes sûres et signaler les dangereuses."
  t169: "La protection SSRF bloque les réseaux privés, le loopback, les adresses link-local et les adresses de métadonnées cloud."
  t170: "Les ID de session sont préfixés par un horodatage (20250305_091523_abcd), donc le tri fonctionne naturellement avec ls et jq."
  t171: "Les sous-processus MCP reçoivent un environnement filtré — seules les variables système sûres sont transmises."
  t172: "Les fichiers de contexte (.hermes.md, AGENTS.md) sont analysés contre les injections de prompt avant chargement."
  t173: "command_allowlist dans config.yaml approuve de façon permanente certains motifs de commandes shell."
  t174: "Le contexte se compresse automatiquement quand il atteint le seuil — les souvenirs sont sauvegardés et l'historique résumé."
  t175: "La barre d'état passe au jaune, puis à l'orange, puis au rouge à mesure que le contexte se remplit."
  t176: "SOUL.md est le fichier d'identité principal de l'agent — personnalisez-le pour façonner son comportement."
  t177: "Hermes charge le contexte du projet depuis .hermes.md, AGENTS.md, CLAUDE.md ou .cursorrules (première correspondance)."
  t178: "Les fichiers AGENTS.md des sous-répertoires sont découverts progressivement à mesure que l'agent explore les dossiers."
  t179: "Les fichiers de contexte sont plafonnés à 20 000 caractères avec une troncature intelligente début/fin."
  t180: "Cinq fournisseurs de navigateur : Chromium local, Browserbase, Browser Use, Camofox et Firecrawl."
  t181: "Camofox est un navigateur anti-détection — un fork de Firefox avec falsification d'empreinte en C++."
  t182: "browser_navigate renvoie automatiquement un instantané de la page — inutile d'appeler browser_snapshot ensuite."
  t183: "browser_vision avec annotate=true superpose des étiquettes numérotées sur les éléments interactifs."
  t184: "hermes mcp ouvre un sélecteur interactif de MCP approuvés par Nous, installables en une touche."
  t185: "hermes mcp catalog liste les serveurs MCP approuvés par Nous fournis avec le dépôt."
  t186: "hermes mcp install <name> installe une entrée du catalogue, demande les identifiants et vous laisse choisir les outils à activer."
  t187: "Les serveurs MCP se configurent dans config.yaml — transports stdio et HTTP pris en charge."
  t188: "Filtrage d'outils par serveur : tools.include met des outils en liste blanche, tools.exclude en liste noire."
  t189: "Les serveurs MCP génèrent automatiquement des jeux d'outils à l'exécution — hermes tools peut les activer ou désactiver par plateforme."
  t190: "Prise en charge OAuth pour MCP : auth: oauth active l'autorisation via le navigateur avec PKCE."
  t191: "Les points de contrôle n'ont aucun surcoût quand aucun fichier n'est modifié — activés par défaut."
  t192: "Un instantané pré-rollback est enregistré automatiquement pour pouvoir annuler l'annulation."
  t193: "/rollback annule aussi le tour de conversation, si bien que l'agent ne se souvient pas des changements annulés."
  t194: "Les points de contrôle utilisent des dépôts fantômes dans ~/.hermes/checkpoints/ — le .git de votre projet n'est jamais touché."
  t195: "batch_runner.py traite des centaines de prompts en parallèle pour générer des données d'entraînement."
  t196: "hermes chat -Q active le mode silencieux pour un usage programmatique — masque la bannière et le spinner."
  t197: "L'enregistrement des trajectoires (--save-trajectories) capture les traces complètes d'utilisation des outils pour l'entraînement de modèles."
  t198: "Trois types de plugins : généraux (outils/hooks), fournisseurs de mémoire et moteurs de contexte."
  t199: "hermes plugins install owner/repo installe des plugins directement depuis GitHub."
  t200: "Fournisseurs de mémoire externes : Honcho, Hindsight, Mem0, OpenViking et d'autres via hermes plugins install."
  t201: "Les hooks de plugin incluent pre/post_tool_call, pre/post_llm_call et transform_terminal_output pour normaliser la sortie."
  t202: "Le cache de prompt (Anthropic) réduit les coûts en réutilisant les préfixes de prompt système déjà mis en cache."
  t203: "L'agent génère les titres de session dans un thread d'arrière-plan — aucun impact sur la latence."
  t204: "Le routage intelligent des modèles peut diriger automatiquement les requêtes simples vers un modèle moins cher."
  t205: "Les commandes slash acceptent la correspondance par préfixe : /h renvoie à /help, /mod à /model."
  t206: "Glisser un chemin de fichier dans le terminal joint automatiquement les images ou l'envoie comme contexte."
  t207: ".worktreeinclude à la racine de votre dépôt liste les fichiers ignorés par git à copier dans les worktrees."
  t208: "hermes acp exécute Hermes comme serveur ACP pour l'intégration à VS Code, Zed et JetBrains."
  t209: "Fournisseurs personnalisés : enregistrez des endpoints nommés dans config.yaml sous custom_providers."
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT injecte un prompt système qui n'est jamais conservé dans l'historique."
  t211: "credential_pool_strategies prend en charge les rotations fill_first, round_robin, least_used et random."
  t212: "hermes auth add nous ou hermes auth add openai-codex configure des fournisseurs basés sur OAuth."
  t213: "Le serveur API prend en charge à la fois Chat Completions et l'API Responses avec état côté serveur."
  t214: "tool_preview_length: 0 dans la configuration affiche les chemins de fichiers complets dans le flux d'activité du spinner."
  t215: "hermes status --deep effectue des vérifications de diagnostic approfondies sur tous les composants."
  t216: "Les tâches cron peuvent embarquer un script Python (--script) dont la sortie standard est injectée dans le prompt comme contexte."
  t217: "Les scripts cron vivent dans ~/.hermes/scripts/ et s'exécutent avant l'agent — parfait pour les pipelines de collecte de données."
  t218: "prefill_messages_file dans config.yaml injecte des exemples few-shot dans chaque appel API, sans jamais les enregistrer dans l'historique."
  t219: "SOUL.md remplace entièrement l'identité par défaut de l'agent — réécrivez-le pour faire d'Hermes le vôtre."
  t220: "SOUL.md est initialisé avec une personnalité par défaut au premier lancement. Modifiez-le pour le personnaliser."
  t221: "/compress <focus topic> consacre 60 à 70 % du budget du résumé à votre sujet et élague agressivement le reste."
  t222: "À partir de la deuxième compression, le compresseur met à jour le résumé précédent au lieu de repartir de zéro."
  t223: "Avant la réinitialisation d'une session gateway, Hermes sauvegarde automatiquement les faits importants en mémoire, en arrière-plan."
  t224: "network.force_ipv4: true dans config.yaml corrige les blocages sur les serveurs dont l'IPv6 est défaillant — patche socket à la volée."
  t225: "L'outil terminal annote les codes de sortie courants : grep renvoyant 1 = 'Aucune correspondance (pas une erreur)'."
  t226: "Les commandes terminal de premier plan en échec sont relancées jusqu'à 3 fois avec un délai exponentiel (2 s, 4 s, 8 s)."
  t227: "Les commandes sudo simples sont réécrites automatiquement pour recevoir SUDO_PASSWORD depuis .env — aucune saisie interactive nécessaire."
  t228: "Les helpers d'execute_code exigent des imports explicites : from hermes_tools import json_parse, shell_quote, retry."
  t229: "Les 7 outils sandbox d'execute_code (web_search, terminal, read/write/search/patch) passent par RPC — ils n'entrent jamais dans le contexte."
  t230: "Lire 3 fois ou plus la même région d'un fichier déclenche un avertissement. À partir de 4, c'est bloqué pour éviter les boucles."
  t231: "write_file et patch détectent si un fichier a été modifié de l'extérieur depuis la dernière lecture et signalent qu'il est périmé."
  t232: "Le format de patch V4A prend en charge les directives Add File, Delete File et Move File — pas seulement Update."
  t233: "Les serveurs MCP peuvent demander des complétions LLM en retour via le sampling — l'agent devient un outil pour le serveur."
  t234: "Les serveurs MCP envoient notifications/tools/list_changed pour déclencher le réenregistrement automatique des outils sans redémarrage."
  t235: "delegate_task avec acp_command: 'claude' lance Claude Code comme agent enfant depuis n'importe quelle plateforme."
  t236: "La délégation dispose d'un thread heartbeat — l'activité de l'enfant remonte au parent, ce qui évite les expirations du gateway."
  t237: "Quand un fournisseur renvoie HTTP 402 (paiement requis), le client auxiliaire bascule automatiquement vers le suivant."
  t238: "agent.tool_use_enforcement recadre les modèles qui décrivent des actions au lieu d'appeler les outils — auto pour GPT/Codex."
  t239: "agent.restart_after_turn_timeout laisse les tours en cours se terminer avant que /restart n'entre dans stop() ; restart_drain_timeout n'est que le budget d'interruption forcée une fois stop() lancé."
  t240: "agent.api_max_retries (3 par défaut) contrôle combien de fois l'agent réessaie un appel API échoué avant de remonter l'erreur — baissez-le pour un basculement rapide."
  t241: "Le gateway met en cache les instances AIAgent par session — détruire ce cache casse le cache de prompt Anthropic."
  t242: "N'importe quel site web peut exposer des skills via /.well-known/skills/index.json — le hub de skills les découvre automatiquement."
  t243: "Le journal d'audit des skills dans ~/.hermes/skills/.hub/audit.log trace chaque installation et suppression."
  t244: "Les worktrees git obsolètes sont nettoyés automatiquement au démarrage : les arbres propres et entièrement fusionnés sont supprimés ; le travail modifié ou non poussé est toujours préservé."
  t245: "Les profils délimitent l'état d'Hermes via HERMES_HOME ; les sous-processus d'outils sur l'hôte conservent votre vrai HOME sauf si terminal.home_mode vaut profile."
  t246: "La variable d'environnement HERMES_HOME_MODE (octal, ex. 0701) définit des permissions de répertoire personnalisées pour la traversée par le serveur web."
  t247: "Mode conteneur : placez .container-mode dans HERMES_HOME et la CLI hôte s'exécute automatiquement dans le conteneur."
  t248: "Ctrl+C a 5 niveaux de priorité : annuler l'enregistrement → annuler les invites → annuler le sélecteur → interrompre l'agent → quitter."
  t249: "Chaque interruption pendant une exécution de l'agent est consignée dans ~/.hermes/interrupt_debug.log avec horodatage."
  t250: "BROWSER_CDP_URL connecte les outils navigateur à n'importe quel navigateur de la famille Chromium en cours d'exécution — accepte WebSocket, HTTP ou host:port."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true active l'anti-détection avancée avec un Chromium personnalisé (Scale Plan)."
  t252: "La CLI passe automatiquement en mode compact dans les terminaux de moins de 80 colonnes."
  t253: "Les commandes rapides existent en deux types : exec (exécute directement une commande shell) et alias (redirige vers une autre commande)."
  t254: "Modèle de délégation par tâche : delegation.model et delegation.provider dans la configuration routent les sous-agents vers des modèles moins chers."
  t255: "delegation.reasoning_effort contrôle indépendamment la profondeur de réflexion des sous-agents."
  t256: "display.platforms dans config.yaml permet des surcharges d'affichage par plateforme : {telegram: {tool_progress: all}}."
  t257: "human_delay.mode dans la configuration simule une vitesse de frappe humaine — plage min_ms/max_ms configurable."
  t258: "Les migrations de version de configuration s'exécutent automatiquement au chargement — les nouvelles clés apparaissent sans intervention manuelle."
  t259: "Les modèles GPT et Codex reçoivent des consignes spéciales dans le prompt système pour la discipline et l'usage obligatoire des outils."
  t260: "Les modèles Gemini reçoivent des directives adaptées : chemins absolus, appels d'outils en parallèle et commandes non interactives."
  t261: "context.engine dans config.yaml peut désigner un nom de plugin pour d'autres stratégies de gestion du contexte."
  t262: "Les instantanés de page navigateur de plus de 15 000 caractères sont tronqués ou résumés automatiquement ; l'instantané complet est enregistré dans cache/web pour être parcouru avec read_file."
  t263: "Le compresseur effectue une pré-passe peu coûteuse : les sorties d'outils de plus de 200 caractères sont remplacées par des marqueurs avant l'appel au LLM."
  t264: "Quand une compression échoue, les tentatives suivantes sont suspendues pendant 10 minutes pour éviter de marteler l'API."
  t265: "Les commandes dangereuses longues (>70 caractères) offrent une option 'view' dans l'invite d'approbation pour voir d'abord le texte complet."
  t266: "La visualisation du niveau audio affiche des barres ▁▂▃▄▅▆▇ pendant l'enregistrement vocal, selon le niveau RMS du micro."
  t267: "Les noms de profil ne peuvent pas entrer en conflit avec des binaires existants du PATH — 'hermes profile create ls' serait refusé."
  t268: "hermes profile create backup --clone-all copie tout (configuration, clés, SOUL.md, mémoires, skills, sessions)."
  t269: "La touche d'enregistrement vocal est configurable via voice.record_key dans config.yaml — pas seulement Ctrl+B."
  t270: "Les fichiers .cursorrules et .cursor/rules/*.mdc sont détectés et chargés automatiquement comme contexte de projet."
  t271: "Les fichiers de contexte sont contrôlés contre plus de 10 schémas d'injection de prompt — Unicode invisible, « ignore les instructions », tentatives d'exfiltration."
  t272: "GPT-5 et Codex utilisent le rôle 'developer' au lieu de 'system' dans le format des messages."
  t273: "Surcharges auxiliaires par tâche : auxiliary.vision.provider, auxiliary.compression.model, etc. dans config.yaml."
  t274: "Le client auxiliaire traite 'main' comme un alias de fournisseur — il correspond à votre fournisseur et modèle principaux réels."
  t275: "hermes claw migrate --dry-run prévisualise la migration OpenClaw sans rien écrire."
  t276: "Les chemins de fichiers collés avec des guillemets ou des espaces échappés sont gérés automatiquement — aucun nettoyage manuel nécessaire."
  t277: "Les commandes slash ne déclenchent jamais le repli des gros collages — /command avec de gros arguments fonctionne correctement."
  t278: "En mode interruption, les commandes slash saisies pendant l'exécution de l'agent contournent la logique d'interruption et s'exécutent immédiatement."
  t279: "HERMES_DEV=1 contourne la détection du mode conteneur pour le développement local."
  t280: "Chaque serveur MCP obtient son propre jeu d'outils (mcp-servername) activable indépendamment via hermes tools."
  t281: "Les marqueurs ${ENV_VAR} des MCP dans la configuration sont résolus au lancement du serveur — y compris les variables de ~/.hermes/.env."
  t282: "Les skills provenant de dépôts de confiance (NousResearch) reçoivent le niveau de sécurité 'trusted' ; les skills communautaires subissent une analyse supplémentaire."
  t283: "La quarantaine des skills dans ~/.hermes/skills/.hub/quarantine/ conserve les skills en attente de revue de sécurité."
  t284: "/steer <prompt> injecte une note après le prochain appel d'outil — réorientez la tâche en cours sans l'interrompre."
  t285: "/goal <text> fixe un objectif permanent en boucle Ralph — Hermes enchaîne les tours automatiquement jusqu'à ce qu'un juge déclare la tâche terminée."
  t286: "/snapshot create [label] enregistre un instantané complet de la configuration d'Hermes ; /snapshot restore <id> permet d'y revenir plus tard."
  t287: "/copy [N] copie la dernière réponse de l'assistant dans votre presse-papiers, ou la N-ième en partant de la fin avec un nombre."
  t288: "/redraw force un rafraîchissement complet de l'interface, corrigeant les décalages du terminal après un redimensionnement tmux ou des artefacts de sélection à la souris."
  t289: "/agents (alias /tasks) affiche les agents actifs et les tâches d'arrière-plan en cours dans la session actuelle."
  t290: "/footer active ou désactive le pied de page du gateway sur les réponses finales, indiquant le modèle, le % de contexte et le cwd."
  t291: "/busy queue|steer|interrupt contrôle ce que fait la touche Enter pendant qu'Hermes travaille."
  t292: "/topic dans les messages privés Telegram active le mode topics multi-sessions géré par l'utilisateur — /topic <id> restaure des sessions passées en ligne."
  t293: "/approve session|always exécute une commande dangereuse en attente avec la portée de confiance choisie ; /deny la rejette."
  t294: "/restart redémarre proprement le gateway après avoir laissé finir les exécutions actives, puis prévient le demandeur une fois revenu en ligne."
  t295: "/kanban boards switch <slug> change le tableau Kanban multi-projets actif depuis le chat."
  t296: "/reload recharge ~/.hermes/.env dans la session en cours — prenez en compte de nouvelles clés API sans redémarrer."
  t297: "cronjob avec no_agent=True exécute un script selon un planning et envoie directement sa sortie standard — zéro token, zéro LLM."
  t298: "Une sortie standard vide d'un script cron signifie un tick silencieux — rien n'est livré, parfait pour les chiens de garde à seuil."
  t299: "HERMES_CRON_MAX_PARALLEL (4 par défaut) limite le nombre de tâches cron exécutées par tick pour que les rafales ne saturent pas vos clés."
  t300: "Les hooks du gateway vivent sous ~/.hermes/hooks/<name>/ avec HOOK.yaml + handler.py — le handler doit s'appeler `handle`."
  t301: "Les événements de hook incluent gateway:startup, session:start, agent:step et les abonnements génériques command:*."
  t302: "Déposez une checklist ~/.hermes/BOOT.md et un hook gateway:startup l'exécutera comme agent ponctuel à chaque démarrage."
  t303: "hermes curator run --dry-run prévisualise ce que le curateur archiverait ou consoliderait sans rien modifier."
  t304: "hermes curator pin <skill> verrouille une skill contre l'archivage automatique comme contre l'outil skill_manage de l'agent."
  t305: "hermes curator rollback restaure les skills depuis un instantané pré-exécution — les sauvegardes vivent sous skills/.curator_backups/."
  t306: "hermes auth reset <provider> [target] efface les temps de repos et les indicateurs d'épuisement d'un pool d'identifiants entier, ou d'un seul identifiant par index, id ou libellé."
  t307: "credential_pool_strategies.<provider>: round_robin fait tourner les clés de façon équitable au lieu du fill_first par défaut."
  t308: "use_gateway: true par outil route web, image, tts ou browser via votre abonnement Nous — aucune clé supplémentaire."
  t309: "provider_routing.data_collection: deny exclut les fournisseurs qui conservent les données sur OpenRouter."
  t310: "provider_routing.require_parameters: true ne route que vers les fournisseurs prenant en charge chaque paramètre de votre requête."
  t311: "HERMES_TUI_RESUME=1 se rattache automatiquement à la session TUI la plus récente au lancement — pratique après une coupure SSH."
  t312: "HERMES_TUI_THEME=light|dark|<hex> force le thème de la TUI sur les terminaux qui ne définissent pas COLORFGBG."
  t313: "Ctrl+G ou Ctrl+X Ctrl+E dans la TUI ouvre le tampon de saisie dans $EDITOR pour les longs prompts multilignes."
  t314: "La TUI affiche le LaTeX en ligne — $E=mc^2$ devient des maths Unicode au lieu de TeX brut."
  t315: "hermes dashboard lance une interface web locale sur 127.0.0.1:9119 — aucune donnée ne quitte localhost."
  t316: "hermes dashboard intègre la TUI Hermes complète dans votre navigateur via xterm.js et un PTY WebSocket."
  t317: "Déposez un YAML dans ~/.hermes/dashboard-themes/ avec deux couleurs de palette pour rhabiller tout le tableau de bord."
  t318: "Les plugins du tableau de bord se déposent tels quels : manifest.json + bundle JS dans ~/.hermes/dashboard-plugins/ — aucun build npm requis."
  t319: "layoutVariant: cockpit dans un thème du tableau de bord ajoute une barre latérale gauche de 260px que les plugins peuvent remplir via l'emplacement sidebar."
  t320: "display.tool_progress_command: true expose /verbose sur les plateformes de messagerie ; par défaut, il est réservé à la CLI."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result ne vous notifie qu'à la fin des tâches d'arrière-plan (au lieu de concise/all/error/off)."
  t322: "HERMES_WRITE_SAFE_ROOT restreint write_file/patch à des préfixes de répertoires ; plusieurs chemins via os.pathsep (: ou ;)."
  t323: "HERMES_IGNORE_RULES désactive l'injection automatique d'AGENTS.md, SOUL.md, .cursorrules, de la mémoire et des skills préchargées."
  t324: "HERMES_ACCEPT_HOOKS approuve automatiquement les hooks shell inédits déclarés dans config.yaml, sans invite dans le terminal."
  t325: "auxiliary.goal_judge.model envoie le juge de /goal vers un modèle rapide et peu coûteux pour garder le coût des boucles proche de zéro."
  t326: "Les points de contrôle ignorent les répertoires de plus de 50 000 fichiers pour éviter des opérations git lentes sur les monorepos géants."
  t327: "tts.provider: piper exécute une TTS locale en 44 langues sur CPU — les voix se téléchargent automatiquement dans ~/.hermes/cache/piper-voices/."
  t328: "tts.providers.<name>.type: command branche n'importe quel moteur TTS en ligne de commande grâce aux placeholders {input_path} et {output_path}."
  t329: "API_SERVER_ENABLED=true lance un point de terminaison compatible OpenAI à côté du gateway, pour Open WebUI et LibreChat."
  t330: "GATEWAY_PROXY_URL met en place une configuration scindée : les E/S des plateformes en local, le travail de l'agent délégué à un serveur API distant."
  t331: "MATRIX_DEVICE_ID fixe un ID d'appareil stable pour l'E2EE — sans lui, les clés changent à chaque démarrage et le déchiffrement de l'historique casse."
  t332: "TELEGRAM_WEBHOOK_SECRET est obligatoire dès que TELEGRAM_WEBHOOK_URL est défini — générez-le avec openssl rand -hex 32."
  t333: "batch_runner.py --resume reconnaît les prompts déjà traités par leur texte, donc réordonner le jeu de données ne relance pas le travail terminé."
  t334: "/new démarre une nouvelle session sur place (alias /reset) — nouvel ID de session, historique vierge, la CLI reste ouverte."
  t335: "/clear efface l'écran du terminal ET démarre une nouvelle session — un seul raccourci pour repartir à zéro visuellement."
  t336: "/history affiche la conversation en cours directement dans la CLI sans la quitter — pratique pour une relecture rapide."
  t337: "/save écrit la conversation en cours sur le disque sans terminer la session."
  t338: "/status affiche les infos de session en un coup d'œil : ID, titre, modèle, consommation de tokens et temps écoulé."
  t339: "/image <path> joint un fichier image local à votre prochain prompt, sans coller ni glisser-déposer."
  t340: "/platforms affiche l'état de connexion du gateway et des plateformes de messagerie, directement depuis le chat."
  t341: "/commands pagine la liste complète des commandes slash et des skills installées — pratique sur les plateformes sans complétion par tabulation."
  t342: "/toolsets liste tous les toolsets disponibles pour savoir ce qu'accepte -t/--toolsets."
  t343: "/voice tts bascule en mode TTS seul — l'agent répond à voix haute mais vous continuez à taper vos prompts."
  t344: "/reload-skills rescanne ~/.hermes/skills/ pour que les skills déposées apparaissent sans redémarrer la session."
  t345: "/indicator kaomoji|emoji|unicode|ascii choisit le style de l'indicateur d'activité de la TUI affiché pendant les exécutions de l'agent."
  t346: "/debug téléverse un bundle de support (infos système + journaux) et renvoie des liens partageables — fonctionne aussi dans le chat."
  t347: "hermes -z \"<prompt>\" est le one-shot le plus pur : la réponse finale sur stdout, rien d'autre — idéal pour les pipes dans des scripts."
  t348: "hermes chat --pass-session-id injecte l'ID de session dans le prompt système pour que l'agent puisse y faire référence lui-même."
  t349: "hermes chat --image path/to/pic.png joint une image locale à une requête -q unique, sans étape de téléversement séparée."
  t350: "hermes chat --ignore-user-config ignore la configuration utilisateur active — pour des rapports de bug reproductibles et des exécutions en CI."
  t351: "hermes chat --source tool étiquette les chats programmatiques pour qu'ils n'encombrent pas hermes sessions list."
  t352: "hermes dump --show-keys inclut des empreintes masquées des clés API pour un débogage plus poussé avec le support."
  t353: "hermes sessions rename <ID> \"nouveau titre\" renomme n'importe quelle session passée ; hermes sessions delete <ID> en supprime une."
  t354: "hermes import restaure un zip de sauvegarde Hermes complet ; les exports JSON/JSONL de sessions s'importent depuis la page Sessions du tableau de bord."
  t355: "hermes fallback gère la chaîne fallback_model de manière interactive — sans modifier config.yaml à la main."
  t356: "hermes pairing renouvelle le token d'appairage des DM — la première personne qui écrit après le renouvellement obtient l'accès au bot."
  t357: "hermes setup guide les nouveaux utilisateurs à travers le fournisseur, les clés et le branchement des plateformes en un seul parcours interactif."
  t358: "hermes status --deep lance le bilan de santé complet de chaque composant ; hermes status seul donne la vue rapide."
  t359: "HERMES_AGENT_TIMEOUT=0 désactive l'arrêt pour inactivité du gateway sur un agent en cours — utile pour les longues sessions de recherche."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 charge automatiquement les plugins locaux au dépôt depuis ./.hermes/plugins/ — soumis à une validation de confiance par conception."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 désactive la protection « fichier modifié depuis votre lecture » sur patch et write_file."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true autorise les outils web à atteindre localhost et les réseaux privés — désactivé par défaut en mode gateway."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 installe automatiquement des skills supplémentaires du catalogue optionnel au premier lancement de chaque profil."
  t364: "HERMES_BUNDLED_SKILLS pointe vers une arborescence personnalisée de skills embarquées — utilisé par les paquets Homebrew et Nix."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 écrit la charge utile de chaque requête API sur stdout plutôt que dans les fichiers journaux."
  t366: "HERMES_OAUTH_TRACE=1 journalise (avec masquage) les échanges et renouvellements de tokens OAuth pour déboguer l'authentification des fournisseurs."
  t367: "HERMES_STREAM_RETRIES (3 par défaut) contrôle le nombre de tentatives de reconnexion en cours de flux lors d'erreurs réseau passagères."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false supprime les accusés de réception ⚡/⏳/⏩ quand un utilisateur écrit à un agent occupé."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (180s par défaut) définit la fréquence à laquelle le gateway envoie un point d'avancement sur les tours longs."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (900s par défaut) plafonne le temps pendant lequel /restart attend les exécutions en cours avant de forcer."
  t371: "HERMES_CHECKPOINT_TIMEOUT (30s par défaut) plafonne la création des points de contrôle du système de fichiers — augmentez-le sur les monorepos géants."
  t372: "image_gen.model dans config.yaml choisit le modèle FAL : flux-2/klein, gpt-image-2, nano-banana-pro, et d'autres."
  t373: "image_gen.provider fait passer la génération d'images par un plugin (OpenAI Images, Codex, FAL) au lieu du fournisseur par défaut."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY dirigent l'analyse d'images vers n'importe quel point de terminaison compatible OpenAI."
  t375: "API_SERVER_MODEL_NAME personnalise le nom du modèle sur /v1/models — indispensable pour les configurations Open WebUI multi-profils."
  t376: "Les plugins du tableau de bord sont servis depuis /dashboard-plugins/<name>/ — déposez les fichiers dans ~/.hermes/dashboard-plugins/."
  t377: "Les chats --source tool sont exclus de hermes sessions list par défaut — passez --source explicitement pour les voir."
