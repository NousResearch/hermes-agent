userMessages.backend.slowStart: "Tá Hermes ag glacadh níos mó ama ná mar is gnách le tosú. Fós ag fanacht… Mura gceanglaíonn sé choíche: taispeánann /logs aschur deiridh an chúlchórais; /quit agus rith `hermes doctor`."
userMessages.backend.slowStartStatus: "fós ag tosú…"
userMessages.backend.stderrProblem: "Chuaigh rud éigin amú laistigh de Hermes · /logs le haghaidh sonraí"
userMessages.backend.stderrProblemNamed: "Chuaigh rud éigin amú laistigh de Hermes ({0}) · /logs le haghaidh sonraí"
userMessages.credential.currentProvider: "an soláthraí reatha"
userMessages.credential.missingKey: "Níl aon eochair API socraithe do {0}, mar sin teipfidh ar theachtaireachtaí. Clóscríobh /model, roghnaigh {0}, agus greamaigh eochair (nó rith /setup)."
userMessages.details: "Sonraí: {0}"
userMessages.promptTimeout.secret: "Dúnadh an leid rúin: níor tugadh freagra in am, mar sin scipeáladh an chéim a bhí ag brath air. Seol d'iarratas arís nuair a bheidh tú réidh lena iontráil."
userMessages.promptTimeout.sudo: "Dúnadh leid an phasfhocail: níor tugadh freagra in am, mar sin scipeáladh an t-ordú. Seol d'iarratas arís nuair a bheidh tú réidh lena iontráil."
userMessages.promptTimeout.vaultCode: "Dúnadh leid an chóid fhíoraithe: níor tugadh freagra in am, mar sin scipeáladh an síniú isteach. Seol d'iarratas arís nuair a bheidh an cód agat."
userMessages.promptTimeout.vaultSaveLogin: "Dúnadh leid shábháil na logála isteach: níor tugadh freagra in am, mar sin níor sábháladh aon rud. Seol d'iarratas arís nuair a bheidh tú réidh."
userMessages.promptTimeout.vaultUnlockPrompt: "Dúnadh leid na díghlasála: níor tugadh freagra in am, mar sin d'fhan an bainisteoir pasfhocal faoi ghlas. Seol d'iarratas arís nuair a bheidh tú réidh lena dhíghlasáil."
userMessages.rpc.notConnected: "Níl Hermes ceangailte faoi láthair, mar sin níor seoladh é sin. Athcheanglaíonn sé go huathoibríoch; fan nóiméad agus bain triail eile as, nó clóscríobh /logs má leanann sé seo ar aghaidh."
userMessages.rpc.sessionNotFound: "Níl an comhrá seo ceangailte leis an gcúlchóras a thuilleadh (bhí sé díomhaoin nó atosaíodh an cúlchóras). Tá do stair sábháilte: clóscríobh /resume chun é a athoscailt."
userMessages.rpc.slashCrashed: "Níor chríochnaigh /{0}: thuairteáil cúntóir na n-orduithe. Bain triail eile as; clóscríobh /logs don rian."
userMessages.rpc.slashTimedOut: "Níor chríochnaigh /{0}: chuaigh cúntóir na n-orduithe thar am. Bain triail eile as; má leanann sé ag tarlú, clóscríobh /logs agus tuairiscigh na línte deiridh."
userMessages.rpc.timedOut: "Níor fhreagair Hermes laistigh de {0}s. Bain triail eile as; má leanann sé ag tarlú, clóscríobh /logs agus tuairiscigh na línte deiridh."
userMessages.rpc.versionSkew: "Níl comhéadan an teirminéil agus cúlchóras Hermes i gcomhréir le chéile (leaganacha éagsúla). Rith /update, nó scoir agus rith `hermes update`, ansin tosaigh an TUI arís."
userMessages.skills.noneInstalled: "Níl aon scil suiteáilte fós. Clóscríobh /skills browse chun an chatalóg a fheiceáil, nó /skills install <ainm>."
