    default_title: "Comhrá Hermes"
    root_lobby: "Tá an príomhchomhrá seo curtha in áirithe d'orduithe córais.\n\nChun comhrá Hermes nua a thosú, oscail an topaic All Messages ag barr chomhéadan an bhota seo agus seol teachtaireacht ar bith ann. Cruthóidh Telegram topaic nua don teachtaireacht sin; oibríonn gach topaic mar sheisiún Hermes neamhspleách."
    root_new: "Chun comhrá Hermes comhthreomhar nua a thosú, oscail an topaic All Messages ag barr chomhéadan an bhota seo agus seol teachtaireacht ar bith ann. Cruthóidh Telegram topaic nua dó.\n\nIs seisiún Hermes neamhspleách gach topaic. Ná húsáid /new taobh istigh de thopaic atá ann cheana ach amháin más mian leat seisiún reatha na topaice sin a athsholáthar."
    new_header: "Tosaíodh seisiún Hermes nua sa topaic seo.\n\nLeid: le haghaidh oibre comhthreomhaire, oscail All Messages agus seol teachtaireacht ann chun topaic ar leith a chruthú in ionad /new a úsáid anseo. Athsholáthraíonn /new an seisiún atá ceangailte leis an topaic reatha."
    help: "/topic — cumasaigh mód DM il-seisiúin (bot amháin, go leor comhráite comhthreomhara)\n\nÚsáid:\n  /topic             Cumasaigh mód topaice, nó taispeáin an stádas má tá sé ar siúl cheana\n  /topic help        Taispeáin an teachtaireacht seo\n  /topic off         Díchumasaigh mód topaice agus glan na ceangail topaice\n  /topic <id>        Taobh istigh de thopaic: athchóirigh seisiún roimhe seo de réir ID\n\nConas a oibríonn sé:\n1. Rith /topic uair amháin sa DM seo — seiceálann Hermes go bhfuil BotFather Threads\n   Settings cumasaithe agus casann sé mód il-seisiúin air.\n2. Tapáil All Messages ag barr an bhota agus seol teachtaireacht ar bith.\n   Cruthaíonn Telegram topaic nua don teachtaireacht sin; is seisiún Hermes\n   neamhspleách gach topaic (stair úr, comhthéacs úr).\n3. Éiríonn an DM fréimhe ina fhorhalla córais — seol /topic, /status,\n   /help, /usage ansin. Téann gnáthleideanna i dtopaic.\n4. Athshocraíonn /new taobh istigh de thopaic seisiún na topaice sin amháin.\n5. Athchóiríonn /topic <id> taobh istigh de thopaic seanseisiún isteach ann."
