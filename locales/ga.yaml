  t291: "Rialaíonn /busy queue|steer|interrupt cad a dhéanann brú Enter fad a bhíonn Hermes ag obair."
  t292: "Cumasaíonn /topic i DManna Telegram mód topaicí il-seisiúin faoi bhainistíocht an úsáideora — aischuireann /topic <id> seanseisiúin inlíne."
  t293: "Ritheann /approve session|always ordú contúirteach atá ag fanacht le do scóip iontaoibhe roghnaithe; diúltaíonn /deny dó."
  t294: "Atosaíonn /restart an gateway go caoin tar éis rití gníomhacha a dhraenáil, ansin cuireann sé scairt ar an iarrthóir nuair a bhíonn sé ar ais."
  t295: "Athraíonn /kanban boards switch <slug> an clár Kanban il-tionscadail gníomhach ó laistigh den chomhrá."
  t296: "Athlódálann /reload ~/.hermes/.env isteach sa seisiún atá ag rith — glac le heochracha API nua gan atosú."
  t297: "Ritheann cronjob le no_agent=True script de réir sceidil agus seolann a stdout go díreach — gan comharthaí, gan LLM."
  t298: "Ciallaíonn stdout folamh ó script cron tic ciúin — ní sheachadtar aon rud, foirfe do mhadraí faire tairsí."
  t299: "Cuireann HERMES_CRON_MAX_PARALLEL (réamhshocrú 4) uasteorainn ar líon na dtascanna cron a ritheann in aghaidh an tic ionas nach sáithíonn rabhartaí d'eochracha."
  t300: "Tá crúcaí gateway faoi ~/.hermes/hooks/<name>/ le HOOK.yaml + handler.py — ní mór `handle` a bheith mar ainm ar an láimhseálaí."
  t301: "I measc imeachtaí crúcaí tá gateway:startup, session:start, agent:step, agus síntiúis saoróige command:*."
  t302: "Cuir seicliosta ~/.hermes/BOOT.md ann agus ritheann crúca gateway:startup é mar ghníomhaire aon-uaire ag gach tosú."
  t303: "Réamhthaispeánann hermes curator run --dry-run cad a chuirfeadh an coimeádaí i gcartlann nó a chomhdhlúthódh sé gan aon rud a athrú."
  t304: "Fálaíonn hermes curator pin <skill> scil go crua in aghaidh uathchartlannú agus uirlis skill_manage an ghníomhaire araon."
  t305: "Aischuireann hermes curator rollback scileanna ó roghchóip réamhrite — tá cúltacaí faoi skills/.curator_backups/."
  t306: "Glanann hermes auth reset <provider> [target] tréimhsí fuaraithe agus bratacha ídithe ar linn dintiúr iomlán, nó ar dhintiúr amháin de réir innéacs, id, nó lipéid."
  t307: "Rothlaíonn credential_pool_strategies.<provider>: round_robin eochracha go cothrom in ionad an réamhshocraithe fill_first."
  t308: "Seolann use_gateway: true de réir uirlise web, image, tts, nó browser trí do shíntiús Nous — gan eochracha breise."
  t309: "Eisiann provider_routing.data_collection: deny soláthraithe a stórálann sonraí ar OpenRouter."
  t310: "Ní sheolann provider_routing.require_parameters: true ach chuig soláthraithe a thacaíonn le gach paraiméadar i d'iarratas."
  t311: "Athcheanglaíonn HERMES_TUI_RESUME=1 leis an seisiún TUI is déanaí go huathoibríoch ag am tosaithe — áisiúil tar éis titim SSH."
  t312: "Forchuireann HERMES_TUI_THEME=light|dark|<hex> téama an TUI ar theirminéil nach socraíonn COLORFGBG."
  t313: "Osclaíonn Ctrl+G nó Ctrl+X Ctrl+E sa TUI an maolán ionchuir in $EDITOR le haghaidh leideanna fada illíne."
  t314: "Rindreálann an TUI LaTeX inlíne — éiríonn $E=mc^2$ ina mhatamaitic Unicode in ionad TeX amh."
  t315: "Seolann hermes dashboard UI gréasáin áitiúil ag 127.0.0.1:9119 — ní fhágann aon sonraí localhost."
  t316: "Leabaíonn hermes dashboard TUI iomlán Hermes i do bhrabhsálaí trí xterm.js agus PTY WebSocket."
  t317: "Cuir YAML in ~/.hermes/dashboard-themes/ le dhá dhath pailéid chun craiceann nua a chur ar an deais iomlán."
  t318: "Is breiseáin drop-in iad breiseáin deaise: manifest.json + cuach JS in ~/.hermes/dashboard-plugins/ — ní gá tógáil npm."
  t319: "Cuireann layoutVariant: cockpit i dtéama deaise ráille clé 260px leis ar féidir le breiseáin é a líonadh trí shliotán an taobh-bharra."
  t320: "Nochtann display.tool_progress_command: true /verbose ar ardáin teachtaireachtaí; is don CLI amháin é de réir réamhshocraithe."
  t321: "Ní chuireann HERMES_BACKGROUND_NOTIFICATIONS=result scairt ort ach nuair a chríochnaíonn tascanna cúlra (i gcomparáid le concise/all/error/off)."
  t322: "Cuireann HERMES_WRITE_SAFE_ROOT srian ar write_file/patch go réimíreanna eolaire; conairí iolracha trí os.pathsep (: nó ;)."
  t323: "Scipeálann HERMES_IGNORE_RULES uath-instealladh AGENTS.md, SOUL.md, .cursorrules, na cuimhne, agus scileanna réamhlódáilte."
  t324: "Ceadaíonn HERMES_ACCEPT_HOOKS crúcaí blaoisce nach bhfacthas fós agus a dhearbhaítear in config.yaml go huathoibríoch gan leid TTY."
  t325: "Seolann auxiliary.goal_judge.model moltóir /goal chuig samhail shaor ghasta chun costas na lúibe a choinneáil gar do nialas."
  t326: "Scipeálann seicphointí eolairí le níos mó ná 50,000 comhad chun oibríochtaí git mall ar mhonastórtha ollmhóra a sheachaint."
  t327: "Ritheann tts.provider: piper TTS áitiúil 44 teanga ar an LAP — íoslódáiltear guthanna go huathoibríoch go ~/.hermes/cache/piper-voices/."
  t328: "Nascann tts.providers.<name>.type: command inneall TTS CLI ar bith le hionadchoinneálaithe {input_path} agus {output_path}."
  t329: "Ritheann API_SERVER_ENABLED=true críochphointe atá comhoiriúnach le OpenAI taobh leis an gateway le haghaidh Open WebUI agus LibreChat."
  t330: "Ritheann GATEWAY_PROXY_URL socrú scoilte: I/A ardáin go háitiúil, obair an ghníomhaire tarmligthe chuig freastalaí API cianda."
  t331: "Greamaíonn MATRIX_DEVICE_ID ID gléis cobhsaí le haghaidh E2EE — gan é, rothlaíonn eochracha ag gach tosú agus briseann díchriptiú na staire."
  t332: "Tá TELEGRAM_WEBHOOK_SECRET riachtanach aon uair a shocraítear TELEGRAM_WEBHOOK_URL — gin é le openssl rand -hex 32."
  t333: "Meaitseálann batch_runner.py --resume leideanna críochnaithe de réir a dtéacs ionas nach n-athritheann athordú tacair sonraí obair atá déanta."
  t334: "Tosaíonn /new seisiún úr san áit (ailias /reset) — ID seisiúin úr, stair ghlan, fanann an CLI ar oscailt."
  t335: "Glanann /clear scáileán an teirminéil AGUS tosaíonn seisiún nua — aicearra amháin le haghaidh athshocrú amhairc."
  t336: "Priontálann /history an comhrá reatha inlíne gan an CLI a fhágáil — úsáideach le haghaidh athléamh gasta."
  t337: "Scríobhann /save an comhrá reatha ar an diosca gan an seisiún a chríochnú."
  t338: "Taispeánann /status eolas an tseisiúin ar aon amharc: ID, teideal, samhail, úsáid comharthaí, agus am caite."
  t339: "Ceanglaíonn /image <path> comhad íomhá áitiúil le do chéad leid eile gan greamú ná tarraingt-agus-scaoileadh."
  t340: "Taispeánann /platforms stádas ceangail an gateway agus na n-ardán teachtaireachtaí ó laistigh den chomhrá."
  t341: "Leathanaíonn /commands an liosta iomlán d'orduithe slaise + scileanna suiteáilte — úsáideach ar ardáin gan comhlánú táib."
  t342: "Liostaíonn /toolsets gach tacar uirlisí atá ar fáil ionas go mbeidh a fhios agat cad a ghlacann -t/--toolsets leis."
  t343: "Scoránaíonn /voice tts mód TTS amháin — freagraíonn an gníomhaire os ard ach clóscríobhann tú do leideanna fós."
  t344: "Athscanann /reload-skills ~/.hermes/skills/ ionas go dtagann scileanna drop-in chun cinn gan an seisiún a atosú."
  t345: "Roghnaíonn /indicator kaomoji|emoji|unicode|ascii stíl an táscaire gnóthach TUI a thaispeántar le linn rití gníomhaire."
  t346: "Uaslódálann /debug cuach tacaíochta (eolas córais + logaí) agus filleann naisc inroinnte — oibríonn sé sa chomhrá freisin."
  t347: "Is é hermes -z \"<prompt>\" an aon-uaire is glaine: an freagra deiridh ar stdout, gan aon rud eile — foirfe le haghaidh píopála i scripteanna."
  t348: "Instealann hermes chat --pass-session-id ID an tseisiúin i leid an chórais ionas gur féidir leis an ngníomhaire tagairt dó féin."
  t349: "Ceanglaíonn hermes chat --image path/to/pic.png íomhá áitiúil le hiarratas -q amháin gan céim uaslódála ar leith."
  t350: "Scipeálann hermes chat --ignore-user-config cumraíocht ghníomhach an úsáideora — tuairiscí fabhtanna in-atáirgthe agus rití CI."
  t351: "Clibeálann hermes chat --source tool comhráite ríomhchláraithe ionas nach dtruaillíonn siad hermes sessions list."
  t352: "Cuireann hermes dump --show-keys méarloirg eochracha API atá folaithe san áireamh le haghaidh dífhabhtaithe tacaíochta níos doimhne."
  t353: "Athainmníonn hermes sessions rename <ID> \"new title\" seanseisiún ar bith; baineann hermes sessions delete <ID> ceann amháin."
  t354: "Aischuireann hermes import cúltaca zip iomlán Hermes; iompórtáiltear easpórtálacha seisiúin JSON/JSONL ó leathanach Sessions na deaise."
  t355: "Bainistíonn hermes fallback slabhra fallback_model go hidirghníomhach — gan aon eagarthóireacht láimhe ar config.yaml."
  t356: "Rothlaíonn hermes pairing token péireála DM — éilíonn an chéad duine a sheolann teachtaireacht tar éis an rothlaithe rochtain ar an mbot."
  t357: "Treoraíonn hermes setup úsáideoirí nua trí shocrú an tsoláthraí, na n-eochracha, agus na n-ardán in aon sreabhadh idirghníomhach amháin."
  t358: "Ritheann hermes status --deep an scuabadh sláinte iomlán ar gach comhpháirt; is é hermes status lom an t-amharc gasta."
  t359: "Díchumasaíonn HERMES_AGENT_TIMEOUT=0 marú neamhghníomhaíochta an gateway do ghníomhaire atá ag rith — úsáid é le haghaidh rití taighde fada."
  t360: "Lódálann HERMES_ENABLE_PROJECT_PLUGINS=1 breiseáin áitiúla an stóir ó ./.hermes/plugins/ go huathoibríoch — geataithe ar iontaoibh ó dhearadh."
  t361: "Múchann HERMES_DISABLE_FILE_STATE_GUARD=1 an garda 'athraíodh an comhad ó léigh tú é' ar patch agus write_file."
  t362: "Ligeann HERMES_ALLOW_PRIVATE_URLS=true d'uirlisí gréasáin localhost agus líonraí príobháideacha a rochtain — as de réir réamhshocraithe i mód gateway."
  t363: "Suiteálann HERMES_OPTIONAL_SKILLS=name1,name2 scileanna breise ón gcatalóg roghnach go huathoibríoch ar an gcéad rith de réir próifíle."
  t364: "Díríonn HERMES_BUNDLED_SKILLS ar chrann saincheaptha de scileanna cuachta — úsáidtear é ag pacáistiú Homebrew agus Nix."
  t365: "Dumpálann HERMES_DUMP_REQUEST_STDOUT=1 pálasta gach iarratais API chuig stdout in ionad comhaid logála."
  t366: "Logálann HERMES_OAUTH_TRACE=1 malartuithe tokens OAuth agus iarrachtaí athnuachana folaithe le haghaidh dífhabhtú fíordheimhnithe soláthraí."
  t367: "Rialaíonn HERMES_STREAM_RETRIES (réamhshocrú 3) iarrachtaí athcheangail i lár srutha ar earráidí líonra neamhbhuana."
  t368: "Ciúnaíonn HERMES_GATEWAY_BUSY_ACK_ENABLED=false na teachtaireachtaí admhála ⚡/⏳/⏩ nuair a sheolann úsáideoir teachtaireacht chuig gníomhaire gnóthach."
  t369: "Socraíonn HERMES_AGENT_NOTIFY_INTERVAL (réamhshocrú 180s) cé chomh minic a chuireann an gateway scairt ort le dul chun cinn ar shealanna fada."
  t370: "Cuireann HERMES_RESTART_DRAIN_TIMEOUT (réamhshocrú 900s) uasteorainn ar an bhfad a fhanann /restart le rití ar siúl roimh fhorchur."
  t371: "Cuireann HERMES_CHECKPOINT_TIMEOUT (réamhshocrú 30s) uasteorainn ar chruthú seicphointí an chórais comhad — ardaigh é ar mhonastórtha ollmhóra."
  t372: "Roghnaíonn image_gen.model in config.yaml an tsamhail FAL: flux-2/klein, gpt-image-2, nano-banana-pro, agus tuilleadh."
  t373: "Seolann image_gen.provider giniúint íomhánna trí bhreiseán (OpenAI Images, Codex, FAL) in ionad an réamhshocraithe."
  t374: "Díríonn AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY anailís físe ar chríochphointe ar bith atá comhoiriúnach le OpenAI."
  t375: "Saincheapann API_SERVER_MODEL_NAME ainm na samhla ar /v1/models — riachtanach do shocruithe Open WebUI il-phróifíle."
  t376: "Freastalaítear breiseáin deaise ó /dashboard-plugins/<name>/ — cuir comhaid isteach in ~/.hermes/dashboard-plugins/."
  t377: "Eisiatar comhráite --source tool ó hermes sessions list de réir réamhshocraithe — socraigh --source go follasach chun iad a fheiceáil."
  placeholder:
    p01: "Fiafraigh rud ar bith, nó clóscríobh / le haghaidh orduithe…"
    p02: "Déan achoimre ar a bhfuil sa bhfillteán seo"
    p03: "Dréachtaigh freagra ar an ríomhphost is déanaí i mo bhosca isteach"
    p04: "Pleanáil gné, ansin tóg í céim ar chéim"
    p05: "Aimsigh agus deisigh tástáil atá ag teip"
    p06: "Déan taighde ar an topaic seo agus scríobh achoimre dom"
    p07: "Cad a d'athraigh sa stór seo le déanaí?"
    p08: "Déan liosta le déanamh de na nótaí seo"
    p09: "Mínigh an earráid seo agus conas í a réiteach"
    p10: "Socraigh meabhrúchán nó sceidealaigh tasc athfhillteach"
    p11: "Clóscríobh / chun orduithe a bhrabhsáil, nó Ctrl+P don phailéad"
