explainer:
  no_reply_prefix: "⚠️ Gan freagra: "
  empty_response: "Níor thug {model} freagra an uair seo, fiú tar éis atrialacha. Seol `continue` chun triail eile a bhaint as, nó athraigh an tsamhail le /model."
  exit:
    all_retries_exhausted_no_response: "níor fhreagair soláthraí na samhla tar éis na n-atrialacha uile. Seol /retry, nó athraigh an tsamhail le /model."
    partial_stream_recovery: "stop an sruthú go luath agus níor aisghabhadh ach freagra páirteach. Seol `continue` chun leanúint ar aghaidh ón áit ar stop sé."
    fallback_prior_turn_content: "níor táirgeadh aon inneachar nua sa seal seo; á thaispeáint comhthéacs roimhe seo a aisghabhadh. Seol `continue` chun triail eile a bhaint as."
    redirect_restart_limit_exceeded: "cealaíodh an t-iarratas le ceartúchán nua ar gach iarracht, mar sin stop an seal in ionad atriail a dhéanamh go deo. Tá do cheartúchán is déanaí i scuaine mar an chéad teachtaireacht eile."
    rebuilt_restart_limit_exceeded: "lean gach soláthraí sa slabhra titime siar ag titim ar aghaidh chuig an gcéad cheann eile, mar sin stop an seal in ionad atriail a dhéanamh go deo. Seol `continue` nó athraigh an soláthraí."
    budget_exhausted: "ídíodh buiséad atriallta/costais an tseala roimh fhreagra deiridh. Seol `continue` chun leanúint ar aghaidh."
    ollama_runtime_context_too_small: "bhí fuinneog chomhthéacs na samhla áitiúla róbheag le críochnú. Méadaigh méid an chomhthéacs nó úsáid samhail níos mó."
    pending_tool_result: "stop an seal fad a bhí toradh uirlise fós ar feitheamh agus níor thug an tsamhail aon téacs leantach. Seol `continue` chun ligean dó achoimre a dhéanamh."
    interrupted_during_api_call: "cuireadh isteach ar an iarratas i lár glao roimh fhreagra a fháil. Seol `continue` chun triail eile a bhaint as."
    max_iterations_reached: "sroicheadh uasteorainn atriallta na n-uirlisí roimh fhreagra deiridh. Seol `continue` chun leanúint ar aghaidh, nó ardaigh `max_iterations`."
    error_near_max_iterations: "tharla earráid gar don teorainn atriallta roimh fhreagra deiridh. Seiceáil aschur na huirlise thuas, ansin seol `continue`."
    repeated_outer_errors: "lean an seal ag teip le hearráidí arís agus arís eile agus stopadh é go luath in ionad atriail a dhéanamh go deo. Seiceáil na hearráidí thuas, ansin seol `continue` chun triail eile a bhaint as."
  persistence:
    compression: "stopadh an seal mar go raibh próiseas eile ag dlúthú an tseisiúin seo. Ba cheart go mbeadh do theachtaireacht sábháilte cheana — seol í arís le do thoil tar éis an dlúthú a bheith críochnaithe."
    compression_closed: "stopadh an seal mar gur rothlaíodh an seisiún seo trí dhlúthú comhthéacs agus níorbh fhéidir glacadh lena leanúint bheo. Tá an stóras féin sláintiúil — athnuaigh an cliant (nó tosaigh seal nua) ionas go nglacfaidh sé le ID an tseisiúin nua, ansin seol do theachtaireacht arís."
    turn_lease: "stopadh an seal mar gur ghlac próiseas Hermes eile seilbh ar an seisiún seo. Níor sábháladh do fhreagra — fan go gcríochnóidh an próiseas eile, ansin seol do theachtaireacht arís."
    session_row_missing: "scriosadh an seisiún seo ón stóras fad a bhí an comhrá fós ar oscailt, agus níorbh fhéidir le Hermes é a athchruthú, mar sin níor sábháladh an teachtaireacht seo. Seol do theachtaireacht arís; má leanann sé ag teip, rith `hermes {profile_arg}doctor`."
    locked: "stopadh an seal mar go raibh stóras an tseisiúin gnóthach (bhí próiseas Hermes eile ag scríobh chuig an mbunachar sonraí staide). Ba cheart go mbeadh do theachtaireacht sábháilte cheana — seol í arís i gceann nóiméid le do thoil."
    replaced: "cuireadh comhad eile in ionad chomhad bhunachar sonraí na seisiún fad a bhí Hermes ag rith, mar sin níor sábháladh an teachtaireacht seo (coinnítear cóip in {home}/sessions/). Stop Hermes (`hermes {profile_arg}gateway stop`), rith `hermes {profile_arg}doctor` — ní `hermes {profile_arg}doctor --fix`, a dheiseodh an comhad mícheart san áit — ansin tosaigh é arís agus seol do theachtaireacht arís. Tá céimeanna athshlánaithe ardleibhéil sa loga."
    deleted_wal: "tá seanchóip de loga réamhscríofa an bhunachair sonraí seisiún fós i seilbh próisis Hermes eile, mar sin stop Hermes ag scríobh chun an comhad a choinneáil slán agus níor sábháladh an teachtaireacht seo (coinnítear cóip in {home}/sessions/). Níl aon rud caillte. Scoir gach próiseas Hermes ar an bpróifíl seo (aip Desktop, `hermes {profile_arg}gateway stop`, deais, cron), rith `hermes {profile_arg}doctor` — ainmníonn sé aon phróiseas a bhfuil an loga fós ina sheilbh — ansin tosaigh Hermes arís agus seol do theachtaireacht arís. Ná rith `doctor --fix` agus ná scrios aon chomhad state.db fad a bhíonn siad ag rith. Treoir: {recovery_docs}"
    corrupt: "stopadh an seal mar gur thuairiscigh an bunachar sonraí staide truailliú struchtúrach (chaillfí an traschríbhinn ar atosú). Ní chabhróidh spás diosca a scaoileadh. Roghanna athshlánaithe:\n1. Rith `hermes {profile_arg}doctor --fix`\n2. Stop an gateway, ansin athshlánaigh le:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (má thuairiscíonn sé gur féidir athshlánú) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — glacann an t-athshlánú roghchóip den chomhad damáistithe ar dtús; NÁ rith `sqlite3 ... \\\".recover\\\"` in aghaidh an state.db bheo, is féidir le CLI sqlite3 leochaileach é a thruailliú níos mó\n3. Aischuir ó chúltaca in {backups_dir}/\nAnsin seol do theachtaireacht arís."
    fts_index: "stopadh an seal mar go bhfuil innéacs cuardaigh na seisiún (FTS5) truaillithe agus níorbh fhéidir é a dhícheangal, mar sin níor sábháladh an teachtaireacht seo. Níl stór na dteachtaireachtaí féin damáistithe: ná rith uirlisí athshlánaithe agus ná haischuir cúltaca. Rith `hermes {profile_arg}doctor --fix` (nó atosaigh Hermes, a dheisíonn an t-innéacs ag am oscailte), ansin seol do theachtaireacht arís."
    disk: "Níorbh fhéidir le Hermes an comhrá seo a shábháil ar an diosca, mar sin stop sé seachas do theachtaireachtaí a chailleadh. Is dócha go bhfuil an diosca lán: scaoil roinnt spáis (nó ceartaigh na ceadanna ar {home}/state.db), ansin seol do theachtaireacht arís."
    default: "Níorbh fhéidir le Hermes an comhrá seo a shábháil, mar sin stop sé seachas do theachtaireachtaí a chailleadh. Cúiseanna féideartha: níl spás fágtha ar an tiomántán, nó tá próiseas Hermes eile ag coinneáil an bhunachair sonraí. Dún fuinneoga Hermes eile, rith `hermes {profile_arg}doctor` chun an stóras a sheiceáil, ansin seol do theachtaireacht arís."
  file_mutation:
    header: "⚠️ Fíoraitheoir athruithe comhaid: THEIP ar {count} eagarthóireacht chomhaid sa seal seo, d'ainneoin aon fhoclaíochta thuas a d'fhéadfadh a mhalairt a thabhairt le tuiscint. Rith `git status` nó `read_file` chun a dhearbhú cad a cuireadh i bhfeidhm i ndáiríre."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "theip"
  shared:
    and_more: "  • … agus {count} eile"
    the_model: "An tsamhail"
tips:
  t001: "Ritheann /bg <leid> tasc i seisiún ar leith fad a fhanann do sheisiún reatha saor; freagraíonn /btw <ceist> ceist thaobhach faoin gcomhrá seo gan cur isteach air."
  t002: "Déanann /branch forc den seisiún reatha ionas gur féidir leat treo eile a fhiosrú gan dul chun cinn a chailleadh."
  t003: "Dlúthaíonn /compress comhthéacs an chomhrá de láimh nuair a éiríonn rudaí fada."
  t004: "Liostaíonn /rollback seicphointí an chórais comhad — aischuir comhaid a d'athraigh an gníomhaire go staid ar bith roimhe seo."
  t005: "Réamhthaispeánann /rollback diff 2 a bhfuil athraithe ó sheicphointe 2 gan aon rud a aischur."
  t006: "Aischuireann /rollback 2 src/file.py comhad amháin ó sheicphointe áirithe."
  t007: "Ainmníonn /title \"my project\" do sheisiún — atosaigh é níos déanaí le /resume nó hermes -c."
  t008: "Leanann /resume ar aghaidh ón áit ar stop tú i seisiún ainmnithe roimhe seo."
  t009: "Cuireann /queue <leid> teachtaireacht i scuaine don chéad seal eile gan cur isteach ar an seal reatha."
  t010: "Baineann /undo an malartú úsáideora/cúntóra is déanaí den chomhrá."
  t011: "Athsheolann /retry do theachtaireacht is déanaí — úsáideach nuair nach raibh freagra an ghníomhaire i gceart."
  t012: "Rothlaíonn /verbose taispeáint dul chun cinn na n-uirlisí: off → new → all → verbose."
  t013: "Méadaíonn /reasoning high doimhneacht smaointeoireachta na samhla. Taispeánann /reasoning show an réasúnaíocht."
  t014: "Scoránaíonn /fast próiseáil tosaíochta le haghaidh freagraí API níos gasta (ag brath ar an soláthraí)."
  t015: "Léimeann /yolo thar gach leid ceadaithe d'orduithe contúirteacha don chuid eile den seisiún."
  t016: "Ligeann /model duit samhlacha a athrú i lár seisiúin — bain triail as /model sonnet nó /model gpt-5."
  t017: "Athraíonn /model --global do shamhail réamhshocraithe go buan."
  t018: "Socraíonn /personality pirate pearsantacht spraíúil — 14 rogha ionsuite ó kawaii go shakespeare."
  t019: "Athraíonn /skin téama an CLI — bain triail as ares, mono, slate, poseidon, nó charizard."
  t020: "Scoránaíonn /statusbar barra buan a thaispeánann an tsamhail, comharthaí, % líonta an chomhthéacs, costas, agus fad."
  t021: "Baineann /tools disable browser uirlisí brabhsálaí go sealadach don seisiún reatha."
  t022: "Ceanglaíonn /browser connect uirlisí brabhsálaí le do bhrabhsálaí de chlann Chromium atá ag rith, trí CDP."
  t023: "Liostaíonn /plugins na breiseáin shuiteáilte agus a stádas."
  t024: "Bainistíonn /cron tascanna sceidealta — socraigh leideanna athfhillteacha le seachadadh chuig ardán ar bith."
  t025: "Athlódálann /reload-mcp cumraíocht na bhfreastalaithe MCP go beo gan atosú."
  t026: "Taispeánann /usage úsáid comharthaí, miondealú costais, agus fad an tseisiúin."
  t027: "Taispeánann /insights anailísíocht úsáide don 30 lá is déanaí."
  t028: "Seiceálann /paste do ghearrthaisce le haghaidh íomhá agus ceanglaíonn í le do chéad teachtaireacht eile."
  t029: "Taispeánann /profile cén phróifíl atá gníomhach agus a heolaire baile."
  t030: "Taispeánann /config do chumraíocht reatha ar aon amharc."
  t031: "Maraíonn /stop gach próiseas cúlra atá ag rith agus a sceith an gníomhaire."
  t032: "Instealann @file:path/to/file.py inneachar an chomhaid go díreach isteach i do theachtaireacht."
  t033: "Ní instealann @file:main.py:10-50 ach línte 10-50 de chomhad."
  t034: "Instealann @folder:src/ liosta crainn eolaire."
  t035: "Instealann @diff d'athruithe git neamhstáitsithe isteach sa teachtaireacht."
  t036: "Instealann @staged d'athruithe git stáitsithe (git diff --staged)."
  t037: "Instealann @git:5 na 5 thiomantas is déanaí le paistí iomlána."
  t038: "Faigheann @url:https://example.com inneachar leathanaigh ghréasáin agus instealann é."
  t039: "Cuireann clóscríobh @ tús le comhlánú conairí an chórais comhad — nascleanúint go comhad ar bith go hidirghníomhach."
  t040: "Cuir tagairtí iolracha le chéile: \"Athbhreithnigh @file:main.py agus @file:test.py le haghaidh comhsheasmhachta.\""
  t041: "Cuireann Alt+Enter líne nua isteach le haghaidh ionchuir illíne. (Idircheapann Windows Terminal Alt+Enter — úsáid Ctrl+Enter ina ionad.)"
  t042: "Cuireann Ctrl+C isteach ar an ngníomhaire. Brúigh faoi dhó laistigh de 2 shoicind chun scor a fhorchur."
  t043: "Cuireann Ctrl+Z Hermes ar fionraí sa chúlra — rith fg i do bhlaosc chun atosú."
  t044: "Glacann Tab le téacs taibhse na huathmholta nó uathchomhlánaíonn sé orduithe slaise."
  t045: "Clóscríobh teachtaireacht nua fad a bhíonn an gníomhaire ag obair chun cur isteach air agus é a atreorú."
  t046: "Greamaíonn Alt+V íomhá ó do ghearrthaisce isteach sa chomhrá."
  t047: "Má ghreamaítear 5+ líne, sábháiltear iad go huathoibríoch i gcomhad agus cuirtear tagairt ghonta isteach ina n-ionad."
  t048: "Atosaíonn hermes -c do sheisiún CLI is déanaí. Atosaíonn hermes -c \"project name\" de réir teidil."
  t049: "Cruthaíonn hermes -w worktree git leithlisithe — foirfe le haghaidh sreabha oibre gníomhairí comhthreomhara."
  t050: "Cuireann hermes -w -q \"Fix issue #42\" leithlisiú worktree agus iarratas aon-uaire le chéile."
  t051: "Ní chumasaíonn hermes chat -t web,terminal ach tacair uirlisí sonracha le haghaidh seisiúin dhírithe."
  t052: "Réamhlódálann hermes chat -s github-pr-workflow scil ag am tosaithe."
  t053: "Ritheann hermes chat -q \"query\" iarratas neamh-idirghníomhach amháin agus scoireann."
  t054: "Sáraíonn hermes chat --max-turns 1000 an teorainn réamhshocraithe de 500 atriall in aghaidh an tseala."
  t055: "Cumasaíonn hermes chat --checkpoints roghchóipeanna den chóras comhad roimh gach athrú millteach ar chomhaid."
  t056: "Seachnaíonn hermes --yolo gach leid ceadaithe d'orduithe contúirteacha don seisiún iomlán."
  t057: "Clibeálann hermes chat --source telegram an seisiún le haghaidh scagtha in hermes sessions list."
  t058: "Ritheann hermes -p work chat faoi phróifíl shonrach gan do réamhshocrú a athrú."
  t059: "Déanann hermes doctor --fix diagnóis ar fhadhbanna cumraíochta agus spleáchais agus deisíonn iad go huathoibríoch."
  t060: "Aschuireann hermes dump achoimre ghonta ar do shocrú — iontach le haghaidh tuairiscí fabhtanna."
  t061: "Seolann hermes config set KEY VALUE rúin go .env go huathoibríoch agus gach rud eile go config.yaml."
  t062: "Osclaíonn hermes config edit config.yaml i d'eagarthóir réamhshocraithe."
  t063: "Scanann hermes config check le haghaidh roghanna cumraíochta atá ar iarraidh nó seanchaite."
  t064: "Osclaíonn hermes sessions browse roghnóir seisiún idirghníomhach le cuardach."
  t065: "Taispeánann hermes sessions stats líon na seisiún de réir ardáin agus méid an bhunachair sonraí."
  t066: "Glanann hermes sessions prune --older-than 30 seanseisiúin."
  t067: "Cuardaíonn hermes skills search react --source skills-sh eolaire poiblí skills.sh."
  t068: "Scanann hermes skills check scileanna mol suiteáilte le haghaidh nuashonruithe ón bhfoinse."
  t069: "Cuireann hermes skills tap add myorg/skills-repo foinse scileanna GitHub shaincheaptha leis."
  t070: "Easpórtálann hermes skills snapshot export setup.json do chumraíocht scileanna le haghaidh cúltaca nó roinnte."
  t071: "Cuireann hermes mcp add github --command npx freastalaithe MCP leis ón líne ordaithe."
  t072: "Ritheann hermes mcp serve Hermes féin mar fhreastalaí MCP do ghníomhairí eile."
  t073: "Ligeann hermes auth add duit eochracha API iolracha a chur leis le haghaidh rothlú linn dintiúr."
  t074: "Cumasaíonn hermes completion bash >> ~/.bashrc comhlánú táib do gach ordú agus próifíl."
  t075: "Leanann hermes logs -f agent.log i bhfíor-am. Scagann --level WARNING --since 1h an t-aschur."
  t076: "Cruthaíonn hermes backup cúltaca zip d'eolaire baile Hermes ar fad."
  t077: "Cruthaíonn hermes profile create coder próifíl leithlisithe a éiríonn ina hordú dá cuid féin."
  t078: "Cóipeálann hermes profile create work --clone do chumraíocht agus d'eochracha reatha go próifíl nua."
  t079: "Sioncrónaíonn hermes update scileanna cuachta nua le GACH próifíl go huathoibríoch."
  t080: "Socraíonn hermes gateway install Hermes mar sheirbhís córais (systemd/launchd)."
  t081: "Ligeann hermes memory setup duit soláthraí cuimhne seachtrach a chumrú (Honcho, Mem0, srl.)."
  t082: "Cruthaíonn hermes webhook subscribe bealaí webhook bunaithe ar imeachtaí le bailíochtú HMAC."
  t083: "Sábháil airgead: díchumasaíonn hermes tools uirlisí nach n-úsáidtear, bearrann hermes skills config na scileanna."
  t084: "Laghdaíonn /reasoning low nó /reasoning minimal doimhneacht na smaointeoireachta faoi bhun an réamhshocraithe (medium) — freagraí níos gasta agus níos saoire."
  t085: "Seolann hermes models tascanna físe, dlúthúcháin agus cúnta chuig samhlacha níos saoire — gearrann sé 85%+ de chostas comharthaí cúlra gan do phríomhshamhail chomhrá a ísliú."
  t086: "Socraigh display.bell_on_complete: true in config.yaml chun clog a chloisteáil nuair a chríochnaíonn tascanna fada."
  t087: "Socraigh display.streaming: true chun comharthaí a fheiceáil ag teacht i bhfíor-am fad a ghineann an tsamhail iad."
  t088: "Socraigh display.show_reasoning: true chun breathnú ar réasúnaíocht slabhra smaointe na samhla."
  t089: "Socraigh display.compact: true chun spás bán san aschur a laghdú le haghaidh eolais níos dlúithe."
  t090: "Socraigh display.busy_input_mode: queue chun teachtaireachtaí a chur i scuaine in ionad cur isteach ar an ngníomhaire, nó steer chun iad a instealladh i lár rite trí /steer."
  t091: "Socraigh display.resume_display: minimal chun athchoimre iomlán an chomhrá a scipeáil agus seisiún á atosú."
  t092: "Socraigh compression.threshold: 0.50 chun a rialú cathain a chuirtear tús le huathdhlúthú (réamhshocrú: 50% den chomhthéacs)."
  t093: "Socraigh agent.max_turns: 1000 chun ligean don ghníomhaire níos mó céimeanna glaonna uirlisí a ghlacadh in aghaidh an tseala."
  t094: "Socraigh file_read_max_chars: 200000 chun an t-uasinneachar in aghaidh glao read_file a mhéadú."
  t095: "Socraigh approvals.mode: smart chun ligean do LLM orduithe sábháilte a cheadú go huathoibríoch agus orduithe contúirteacha a dhiúltú go huathoibríoch."
  t096: "Socraigh fallback_model in config.yaml chun titim siar go huathoibríoch ar sholáthraí cúltaca."
  t097: "Socraigh privacy.redact_pii: true chun IDanna úsáideoirí agus uimhreacha gutháin a haiseáil roimh iad a sheoladh chuig an LLM."
  t098: "Socraigh browser.record_sessions: true chun seisiúin bhrabhsálaí a thaifeadadh go huathoibríoch mar fhíseáin WebM."
  t099: "Socraigh worktree: true in config.yaml chun worktree git a chruthú i gcónaí (mar an gcéanna le hermes -w)."
  t100: "Socraigh security.website_blocklist.enabled: true chun fearainn shonracha a bhlocáil ó uirlisí gréasáin."
  t101: "Socraigh cron.wrap_response: false chun aschur amh an ghníomhaire a sheachadadh gan ceanntásc/buntásc cron."
  t102: "Sáraíonn HERMES_TIMEZONE crios ama an fhreastalaí le teaghrán criosa ama IANA ar bith."
  t103: "Oibríonn ionadú athróg timpeallachta in config.yaml: úsáid an chomhréir ${VAR_NAME}."
  t104: "Ritheann mearorduithe in config.yaml orduithe blaoisce ar an toirt gan aon úsáid comharthaí."
  t105: "Is féidir pearsantachtaí saincheaptha a shainmhíniú in config.yaml faoi agent.personalities."
  t106: "Rialaíonn provider_routing sórtáil, liostú ceadaithe agus liostú coiscthe soláthraithe OpenRouter."
  t107: "Ritheann execute_code scripteanna Python a ghlaonn ar uirlisí Hermes go ríomhchláraithe — fanann na torthaí amach as an gcomhthéacs."
  t108: "Sceitheann delegate_task suas le 10 bhfo-ghníomhaire chomhreathacha de réir réamhshocraithe (delegation.max_concurrent_children) le comhthéacsanna leithlisithe le haghaidh oibre comhthreomhaire."
  t109: "Oibríonn web_extract ar URLanna PDF — tabhair nasc PDF ar bith dó agus tiontaíonn sé go markdown é."
  t110: "Tá search_files bunaithe ar ripgrep agus níos gasta ná grep — úsáid é in ionad grep sa teirminéal."
  t111: "Úsáideann patch 9 straitéis meaitseála doiléire ionas nach mbrisfidh mionéagsúlachtaí spáis bháin na heagarthóireachtaí."
  t112: "Tacaíonn patch le formáid V4A le haghaidh eagarthóireachtaí bulc ar chomhaid iolracha in aon ghlao amháin."
  t113: "Molann read_file ainmneacha comhaid cosúla nuair nach n-aimsítear comhad."
  t114: "Seachnaíonn read_file dúbailt go huathoibríoch — má athléitear comhad nach bhfuil athraithe, filltear stumpa éadrom."
  t115: "Glacann browser_vision seat scáileáin agus déanann anailís air le AI — oibríonn sé le CAPTCHAs agus inneachar amhairc."
  t116: "Is féidir le browser_console sloinn JavaScript a mheas i gcomhthéacs an leathanaigh."
  t117: "Cruthaíonn image_generate íomhánna le FLUX 2 Pro agus uas-scálú 2x uathoibríoch."
  t118: "Tiontaíonn text_to_speech téacs go fuaim — seinntear é mar bholgáin ghutha ar Telegram."
  t119: "Is féidir le send_message ardán teachtaireachtaí ceangailte ar bith a shroicheadh ó laistigh de sheisiún."
  t120: "Cabhraíonn an uirlis todo leis an ngníomhaire tascanna casta il-chéime a rianú le linn seisiúin."
  t121: "Déanann session_search cuardach lántéacs ar GACH comhrá roimhe seo."
  t122: "Sábhálann an gníomhaire roghanna, ceartúcháin agus fíricí timpeallachta sa chuimhne go huathoibríoch."
  t123: "Seolann /moa leid dheacair amháin trí do thacar samhlacha Mixture of Agents cumraithe."
  t124: "Tacaíonn orduithe teirminéil le mód cúlra le notify_on_complete le haghaidh tascanna fadrite."
  t125: "Tacaíonn próisis chúlra an teirminéil le watch_patterns chun rabhadh a thabhairt faoi línte aschuir sonracha."
  t126: "Tacaíonn an uirlis terminal le 6 inneall cúil: local, Docker, SSH, Modal, Daytona, agus Singularity."
  t127: "Faigheann gach próifíl a cumraíocht, a heochracha API, a cuimhne, a seisiúin, a scileanna agus a tascanna cron féin."
  t128: "Éiríonn ainmneacha próifílí ina n-orduithe blaoisce — cruthaíonn 'hermes profile create coder' an t-ordú 'coder'."
  t129: "Cruthaíonn hermes profile export coder -o backup.tar.gz cartlann próifíle iniompartha."
  t130: "Má roinneann dhá phróifíl token bot de thaisme, blocáiltear an dara gateway le hearráid shoiléir."
  t131: "Gineann seisiúin teidil thuairisciúla go huathoibríoch tar éis an chéad mhalartaithe — ní gá ainmniú de láimh."
  t132: "Tacaíonn teidil seisiún le líneáil: \"my project\" → \"my project #2\" → \"my project #3\"."
  t133: "Agus é ag scor, priontálann Hermes ordú atosaithe le ID an tseisiúin agus staitisticí."
  t134: "Easpórtálann hermes sessions export backup.jsonl gach seisiún le haghaidh cúltaca nó anailíse."
  t135: "Atosaíonn hermes -r SESSION_ID seisiún sonrach ar bith ón am atá thart de réir a ID."
  t136: "Is roghchóip reoite í an chuimhne — ní thagann athruithe chun cinn i leid an chórais ach ag tús an chéad seisiúin eile."
  t137: "Scantar iontrálacha cuimhne go huathoibríoch le haghaidh patrún instealladh leide agus sceite sonraí."
  t138: "Tá dhá stór cuimhne ag an ngníomhaire: nótaí pearsanta (~2200 carachtar) agus próifíl úsáideora (~1375 carachtar)."
  t139: "Is minic a shábháiltear ceartúcháin a thugann tú don ghníomhaire (\"ní hea, déan mar seo é\") sa chuimhne go huathoibríoch."
  t140: "Os cionn 80 scil chuachta a chlúdaíonn github, creative, mlops, productivity, research, agus tuilleadh."
  t141: "Éiríonn gach scil shuiteáilte ina hordú slaise go huathoibríoch — clóscríobh / chun iad uile a fheiceáil."
  t142: "Suiteálann hermes skills install official/security/1password scileanna roghnacha ón stór."
  t143: "Is féidir le scileanna iad féin a theorannú d'ardáin OS sonracha — ní lódáiltear cuid acu ach ar macOS nó Linux."
  t144: "Ligeann skills.external_dirs in config.yaml duit scileanna a lódáil ó eolairí saincheaptha."
