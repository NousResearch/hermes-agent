userMessages.rpc.notConnected: "A Hermes most nincs csatlakozva, így ez nem lett elküldve. Automatikusan újracsatlakozik; várj egy kicsit, és próbáld újra, vagy ha a hiba nem múlik, írd be: /logs."
userMessages.rpc.sessionNotFound: "Ez a beszélgetés már nem kapcsolódik a backendhez (tétlen volt, vagy a backend újraindult). Az előzményeid mentve vannak: a /resume paranccsal nyithatod újra."
