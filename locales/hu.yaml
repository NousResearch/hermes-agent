  t262: "A 15 000 karakternél hosszabb böngésző-pillanatképek csonkolódnak vagy automatikusan összegződnek; a teljes pillanatkép a cache/web mappába kerül read_file lapozáshoz."
  t263: "A tömörítő olcsó előfeldolgozást végez: a 200 karakternél hosszabb eszközkimeneteket helyőrzőre cseréli, mielőtt az LLM fut."
  t264: "Ha a tömörítés nem sikerül, a további próbálkozások 10 percre szünetelnek, hogy ne terheljék az API-t."
  t265: "A hosszú veszélyes parancsoknál (>70 karakter) a jóváhagyási kérdésben 'view' opció is van a teljes szöveg megtekintéséhez."
  t266: "A hangszintjelző ▁▂▃▄▅▆▇ sávokat mutat hangfelvétel közben a mikrofon RMS-szintje alapján."
  t267: "A profilnevek nem ütközhetnek meglévő PATH binárisokkal – a 'hermes profile create ls' parancsot a rendszer elutasítaná."
  t268: "A hermes profile create backup --clone-all mindent átmásol (konfiguráció, kulcsok, SOUL.md, memóriák, skillek, munkamenetek)."
  t269: "A hangfelvétel gombja a config.yaml voice.record_key beállításával módosítható – nem csak Ctrl+B lehet."
  t270: "A .cursorrules és a .cursor/rules/*.mdc fájlokat a Hermes automatikusan felismeri és projektkontextusként betölti."
  t271: "A kontextusfájlokban 10+ prompt-injekciós mintát szűrünk — láthatatlan Unicode, 'ignore instructions', adatszivárogtatási kísérletek."
  t272: "A GPT-5 és a Codex az üzenetformátumban 'system' helyett 'developer' szerepet használ."
  t273: "Feladatonkénti kiegészítő felülírások: auxiliary.vision.provider, auxiliary.compression.model stb. a config.yaml-ban."
  t274: "A kiegészítő kliens a 'main' értéket szolgáltató-aliasként kezeli — a tényleges elsődleges szolgáltatódra és modelledre oldja fel."
  t275: "A hermes claw migrate --dry-run megmutatja az OpenClaw-migráció eredményét anélkül, hogy bármit írna."
  t276: "Az idézőjelekkel vagy escape-elt szóközökkel beillesztett fájlútvonalakat automatikusan kezeljük — nem kell kézzel tisztogatni."
  t277: "A slash-parancsok sosem váltják ki a nagy beillesztések összecsukását — a /command nagy argumentumokkal is helyesen működik."
  t278: "Megszakítás módban az ügynök futása közben beírt slash-parancsok megkerülik a megszakítási logikát, és azonnal lefutnak."
  t279: "A HERMES_DEV=1 kikapcsolja a konténermód-felismerést helyi fejlesztéshez."
  t280: "Minden MCP-szerver saját eszközkészletet kap (mcp-szervernév), amely a hermes tools paranccsal külön ki-be kapcsolható."
  t281: "Az MCP ${ENV_VAR} helyőrzők a konfigban a szerver indításakor oldódnak fel — a ~/.hermes/.env változóival együtt."
  t282: "A megbízható tárolókból (NousResearch) származó skillek 'trusted' biztonsági szintet kapnak; a közösségi skilleket extra vizsgálat várja."
  t283: "A ~/.hermes/skills/.hub/quarantine/ alatti skill-karantén a biztonsági felülvizsgálatra váró skilleket tárolja."
  t284: "A /steer <prompt> a következő eszközhívás után beszúr egy megjegyzést — így menet közben terelheted az irányt megszakítás nélkül."
  t285: "A /goal <text> állandó Ralph-loop célt állít be — a Hermes körről körre automatikusan folytatja, amíg egy bíráló késznek nem ítéli."
  t286: "A /snapshot create [label] teljes állapot-pillanatképet ment a Hermes konfigurációjáról; a /snapshot restore <id> később visszaállítja."
  t287: "A /copy [N] a vágólapra másolja az asszisztens utolsó válaszát, számmal pedig a hátulról N-ediket."
  t288: "A /redraw teljes UI-újrarajzolást kényszerít ki — javítja a tmux-átméretezés vagy az egérkijelölés utáni terminálhibákat."
  t289: "A /agents (alias: /tasks) megmutatja az aktív ügynököket és a futó háttérfeladatokat az aktuális munkamenetben."
  t290: "A /footer ki-be kapcsolja az átjáró láblécét a végső válaszokon, amely a modellt, a kontextus %-ot és a munkakönyvtárat mutatja."
  t291: "A /busy queue|steer|interrupt szabályozza, mit tesz az Enter, amíg a Hermes dolgozik."
  t292: "A /topic Telegram-privátban bekapcsolja a felhasználó által kezelt többmunkamenetes topic módot — a /topic <id> helyben visszaállít korábbi munkameneteket."
  t293: "A /approve session|always a választott bizalmi hatókörrel futtatja a függőben lévő veszélyes parancsot; a /deny elutasítja."
  t294: "A /restart az aktív futások lezárása után kíméletesen újraindítja az átjárót, majd értesíti a kérőt, amikor újra elérhető."
  t295: "A /kanban boards switch <slug> a chaten belülről váltja az aktív többprojektes Kanban-táblát."
  t296: "A /reload újratölti a ~/.hermes/.env fájlt a futó munkamenetbe — az új API-kulcsok újraindítás nélkül életbe lépnek."
  t297: "A no_agent=True beállítású cronjob ütemezetten futtat egy szkriptet, és közvetlenül a stdout-ját küldi el — nulla token, nulla LLM."
  t298: "Ha a cron-szkript stdout-ja üres, a futás csendes marad — semmi sem kerül kézbesítésre, ideális küszöbfigyelő szkriptekhez."
  t299: "A HERMES_CRON_MAX_PARALLEL (alapértelmezés: 4) korlátozza, hány cron-feladat fut egy ciklusban, hogy a csúcsok ne terheljék túl a kulcsaidat."
  t300: "Az átjáró hookjai a ~/.hermes/hooks/<name>/ alatt élnek HOOK.yaml + handler.py formában — a handler neve kötelezően `handle`."
  t301: "A hook-események közé tartozik a gateway:startup, a session:start, az agent:step és a command:* helyettesítő karakteres feliratkozás."
  t302: "Tegyél egy ellenőrzőlistát a ~/.hermes/BOOT.md fájlba, és egy gateway:startup hook minden indításkor egyszeri ügynökként lefuttatja."
  t303: "A hermes curator run --dry-run megmutatja, mit archiválna vagy vonna össze a kurátor, anélkül, hogy bármit módosítana."
  t304: "A hermes curator pin <skill> bebetonoz egy skillt: sem az automatikus archiválás, sem az ügynök skill_manage eszköze nem nyúlhat hozzá."
  t305: "A hermes curator rollback egy futás előtti pillanatképből állítja vissza a skilleket — a mentések a skills/.curator_backups/ alatt vannak."
  t306: "A hermes auth reset <provider> [target] törli a várakozási időket és a kimerülési jelzőket egy teljes hitelesítőadat-készleten, vagy egyetlen elemen index, azonosító vagy címke alapján."
  t307: "credential_pool_strategies.<provider>: a round_robin egyenletesen váltogatja a kulcsokat az alapértelmezett fill_first helyett."
  t308: "Az eszközönkénti use_gateway: true a web-, kép-, TTS- vagy böngészőeszközt a Nous-előfizetéseden át irányítja — külön kulcsok nélkül."
  t309: "A provider_routing.data_collection: deny kizárja az adatokat tároló szolgáltatókat az OpenRouteren."
  t310: "A provider_routing.require_parameters: true csak olyan szolgáltatókhoz irányít, amelyek a kérésed minden paraméterét támogatják."
  t311: "A HERMES_TUI_RESUME=1 indításkor automatikusan visszacsatlakozik a legutóbbi TUI-munkamenethez — jól jön, ha megszakad az SSH."
  t312: "A HERMES_TUI_THEME=light|dark|<hex> kikényszeríti a TUI-témát olyan terminálokon, amelyek nem állítják be a COLORFGBG-t."
  t313: "A Ctrl+G vagy a Ctrl+X Ctrl+E a TUI-ban megnyitja a beviteli puffert az $EDITOR-ban hosszú, többsoros promptokhoz."
  t314: "A TUI a LaTeX-et soron belül rendereli — az $E=mc^2$ Unicode-matekként jelenik meg nyers TeX helyett."
  t315: "A hermes dashboard helyi webes felületet indít a 127.0.0.1:9119 címen — egyetlen bájt sem hagyja el a localhostot."
  t316: "A hermes dashboard a teljes Hermes TUI-t beágyazza a böngésződbe xterm.js és WebSocket PTY segítségével."
  t317: "Tegyél egy YAML-t a ~/.hermes/dashboard-themes/ mappába két palettaszínnel, és az egész dashboard új külsőt kap."
  t318: "A dashboard-pluginok bemásolással telepíthetők: manifest.json + JS-csomag a ~/.hermes/dashboard-plugins/ alatt — npm build nem kell."
  t319: "A layoutVariant: cockpit egy dashboard-témában 260 px-es bal oldali sávot ad, amelyet a pluginok a sidebar sloton át tölthetnek fel."
  t320: "A display.tool_progress_command: true elérhetővé teszi a /verbose parancsot az üzenetküldő platformokon; alapból csak CLI-ben van."
  t321: "A HERMES_BACKGROUND_NOTIFICATIONS=result csak a háttérfeladatok befejezésekor értesít (a concise/all/error/off helyett)."
  t322: "A HERMES_WRITE_SAFE_ROOT könyvtár-előtagokra korlátozza a write_file/patch eszközt; több útvonal os.pathsep (: vagy ;) jellel adható meg."
  t323: "A HERMES_IGNORE_RULES kihagyja az AGENTS.md, SOUL.md, .cursorrules, a memória és az előre betöltött skillek automatikus beszúrását."
  t324: "A HERMES_ACCEPT_HOOKS TTY-kérdés nélkül automatikusan jóváhagyja a config.yaml-ban deklarált, még nem látott shell-hookokat."
  t325: "Az auxiliary.goal_judge.model egy olcsó, gyors modellre irányítja a /goal bírálóját, így a ciklus költsége közel nulla marad."
  t326: "Az ellenőrzőpontok kihagyják az 50 000-nél több fájlt tartalmazó könyvtárakat, hogy óriási monorepókon ne lassuljanak be a git-műveletek."
  t327: "A tts.provider: piper 44 nyelvű helyi TTS-t futtat CPU-n — a hangok automatikusan a ~/.hermes/cache/piper-voices/ mappába töltődnek le."
  t328: "A tts.providers.<name>.type: command bármilyen CLI TTS-motort beköt az {input_path} és {output_path} helyőrzőkkel."
  t329: "Az API_SERVER_ENABLED=true OpenAI-kompatibilis végpontot futtat az átjáró mellett Open WebUI-hoz és LibreChathez."
  t330: "A GATEWAY_PROXY_URL osztott felállást ad: a platform I/O helyben fut, az ügynökmunka egy távoli API-szerverre kerül."
  t331: "A MATRIX_DEVICE_ID stabil eszközazonosítót rögzít az E2EE-hez — nélküle minden indításkor új kulcsok jönnek, és a régi üzenetek nem fejthetők vissza."
  t332: "A TELEGRAM_WEBHOOK_SECRET kötelező, ha a TELEGRAM_WEBHOOK_URL be van állítva — generáld így: openssl rand -hex 32."
  t333: "A batch_runner.py --resume szöveg alapján párosítja a kész promptokat, így az adathalmaz átrendezése nem futtatja újra a befejezett munkát."
  t334: "A /new helyben új munkamenetet indít (alias: /reset) — új munkamenet-azonosító, tiszta előzmények, a CLI nyitva marad."
  t335: "A /clear törli a terminálképernyőt ÉS új munkamenetet indít — egyetlen parancs a vizuális újrakezdéshez."
  t336: "A /history soron belül kiírja az aktuális beszélgetést a CLI elhagyása nélkül — hasznos egy gyors visszaolvasáshoz."
  t337: "A /save lemezre írja az aktuális beszélgetést a munkamenet lezárása nélkül."
  t338: "A /status egy pillantással mutatja a munkamenet adatait: azonosító, cím, modell, tokenhasználat és eltelt idő."
  t339: "A /image <path> helyi képfájlt csatol a következő promptodhoz beillesztés vagy húzd-és-ejtsd nélkül."
  t340: "A /platforms közvetlenül a chatből mutatja az átjáró és az üzenetküldő platformok kapcsolati állapotát."
  t341: "A /commands lapozva listázza az összes slash-parancsot és telepített skillt — hasznos ott, ahol nincs tab-kiegészítés."
  t342: "A /toolsets kilistázza az összes elérhető eszközkészletet, így tudod, mit fogad el a -t/--toolsets."
  t343: "A /voice tts a csak-TTS módot kapcsolja — az ügynök hangosan válaszol, de a promptjaidat továbbra is gépeled."
  t344: "A /reload-skills újraolvassa a ~/.hermes/skills/ mappát, így a bemásolt skillek a munkamenet újraindítása nélkül megjelennek."
  t345: "A /indicator kaomoji|emoji|unicode|ascii kiválasztja a TUI elfoglaltságjelzőjének stílusát, amely az ügynök futása alatt látszik."
  t346: "A /debug feltölt egy támogatási csomagot (rendszerinfó + naplók), és megosztható linkeket ad vissza — chatben is működik."
  t347: "A hermes -z \"<prompt>\" a legtisztább egylövetű mód: csak a végső válasz a stdout-on, semmi más — ideális szkriptekben csövezéshez."
  t348: "A hermes chat --pass-session-id beszúrja a munkamenet-azonosítót a rendszerpromptba, hogy az ügynök hivatkozhasson rá."
  t349: "A hermes chat --image path/to/pic.png helyi képet csatol egyetlen -q lekérdezéshez külön feltöltési lépés nélkül."
  t350: "A hermes chat --ignore-user-config kihagyja az aktív felhasználói konfigurációt — reprodukálható hibajelentésekhez és CI-futásokhoz."
  t351: "A hermes chat --source tool megjelöli a programozott chateket, hogy ne zsúfolják tele a hermes sessions list kimenetét."
  t352: "A hermes dump --show-keys kitakart API-kulcs-ujjlenyomatokat is tartalmaz a mélyebb támogatási hibakereséshez."
  t353: "A hermes sessions rename <ID> \"új cím\" bármely korábbi munkamenetet átnevez; a hermes sessions delete <ID> töröl egyet."
  t354: "A hermes import teljes Hermes biztonsági mentést (zip) állít vissza; a JSON/JSONL munkamenet-exportok a dashboard Sessions oldalán importálhatók."
  t355: "A hermes fallback interaktívan kezeli a fallback_model láncot — nem kell kézzel szerkeszteni a config.yaml-t."
  t356: "A hermes pairing lecseréli a DM-párosítási tokent — a csere utáni első üzenetküldő kapja meg a hozzáférést a bothoz."
  t357: "A hermes setup egyetlen interaktív folyamatban végigvezeti az új felhasználókat a szolgáltató, a kulcsok és a platformok bekötésén."
  t358: "A hermes status --deep minden komponensen teljes állapotellenőrzést futtat; a sima hermes status a gyors áttekintés."
  t359: "A HERMES_AGENT_TIMEOUT=0 kikapcsolja az átjáró inaktivitási leállítását a futó ügynöknél — hosszú kutatási futásokhoz."
  t360: "A HERMES_ENABLE_PROJECT_PLUGINS=1 automatikusan betölti a tárolóbeli pluginokat a ./.hermes/plugins/ alól — tervezetten bizalmi kapuval."
  t361: "A HERMES_DISABLE_FILE_STATE_GUARD=1 kikapcsolja a patch és a write_file 'a fájl megváltozott az olvasás óta' védelmét."
  t362: "A HERMES_ALLOW_PRIVATE_URLS=true engedi a webes eszközöknek a localhost és a privát hálózatok elérését — átjáró módban alapból ki van kapcsolva."
  t363: "A HERMES_OPTIONAL_SKILLS=name1,name2 profilonként az első futáskor automatikusan telepít további opcionális katalógus-skilleket."
  t364: "A HERMES_BUNDLED_SKILLS egyéni beépített skill-fára mutat — a Homebrew- és Nix-csomagolás használja."
  t365: "A HERMES_DUMP_REQUEST_STDOUT=1 minden API-kérés tartalmát a stdout-ra írja naplófájlok helyett."
  t366: "A HERMES_OAUTH_TRACE=1 kitakarva naplózza az OAuth-tokencseréket és frissítési kísérleteket a szolgáltatói hitelesítés hibakereséséhez."
  t367: "A HERMES_STREAM_RETRIES (alapértelmezés: 3) szabályozza az újracsatlakozási kísérleteket átmeneti hálózati hibáknál stream közben."
  t368: "A HERMES_GATEWAY_BUSY_ACK_ENABLED=false elnémítja a ⚡/⏳/⏩ nyugtázó üzeneteket, amikor valaki egy elfoglalt ügynöknek ír."
  t369: "A HERMES_AGENT_NOTIFY_INTERVAL (alapértelmezés: 180s) megadja, milyen gyakran küld az átjáró állapotjelentést hosszú köröknél."
  t370: "A HERMES_RESTART_DRAIN_TIMEOUT (alapértelmezés: 900s) korlátozza, meddig vár a /restart a folyamatban lévő futásokra, mielőtt kényszerít."
  t371: "A HERMES_CHECKPOINT_TIMEOUT (alapértelmezés: 30s) korlátozza a fájlrendszer-ellenőrzőpont létrehozását — óriási monorepókon emeld meg."
  t372: "Az image_gen.model a config.yaml-ban választja ki a FAL-modellt: flux-2/klein, gpt-image-2, nano-banana-pro és mások."
  t373: "Az image_gen.provider egy pluginon (OpenAI Images, Codex, FAL) át irányítja a képgenerálást az alapértelmezett helyett."
  t374: "Az AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY bármely OpenAI-kompatibilis végpontra irányítja a képelemzést."
  t375: "Az API_SERVER_MODEL_NAME testreszabja a modellnevet a /v1/models végponton — többprofilos Open WebUI felállásoknál elengedhetetlen."
  t376: "A dashboard-pluginok a /dashboard-plugins/<name>/ útvonalról szolgálódnak ki — másold a fájlokat a ~/.hermes/dashboard-plugins/ mappába."
  t377: "A --source tool chatek alapból nem szerepelnek a hermes sessions list kimenetében — add meg a --source kapcsolót kifejezetten, hogy lásd őket."
  placeholder:
    p01: "Kérdezz bármit, vagy írj / jelet a parancsokhoz…"
    p02: "Foglald össze, mi van ebben a mappában"
    p03: "Fogalmazz választ a legutóbbi e-mailemre"
    p04: "Tervezz meg egy funkciót, majd építsd fel lépésről lépésre"
    p05: "Keresd meg és javítsd ki a hibás tesztet"
    p06: "Kutasd fel ezt a témát, és írj róla rövid összefoglalót"
    p07: "Mi változott mostanában ebben a tárolóban?"
    p08: "Alakítsd ezeket a jegyzeteket teendőlistává"
    p09: "Magyarázd el ezt a hibát, és hogyan javítsam"
    p10: "Állíts be emlékeztetőt, vagy ütemezz ismétlődő feladatot"
    p11: "Írj / jelet a parancsokhoz, vagy nyomj Ctrl+P-t a palettához"
