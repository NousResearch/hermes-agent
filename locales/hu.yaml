    fallback_prior_turn_content: "ebben a körben nem született új tartalom; a helyreállított korábbi kontextus látható. Küldj `continue` üzenetet az újrapróbáláshoz."
    redirect_restart_limit_exceeded: "a kérést minden próbálkozásnál megszakította egy új korrekció, így a kör leállt, hogy ne próbálkozzon a végtelenségig. Az utolsó korrekciód a következő üzenetként vár a sorban."
    rebuilt_restart_limit_exceeded: "a tartaléklánc minden szolgáltatója folyton átadta a stafétát, így a kör leállt, hogy ne próbálkozzon a végtelenségig. Küldj `continue` üzenetet, vagy válts szolgáltatót."
    budget_exhausted: "a körre jutó iterációs/költségkeret még a végső válasz előtt elfogyott. Küldj `continue` üzenetet a folytatáshoz."
    ollama_runtime_context_too_small: "a helyi modell kontextusablaka túl kicsi volt a befejezéshez. Növeld a kontextusméretet, vagy használj nagyobb modellt."
    pending_tool_result: "a kör úgy állt le, hogy egy eszköz eredménye még függőben volt, és a modell nem írt hozzá folytatást. Küldj `continue` üzenetet, hogy összefoglalja."
    interrupted_during_api_call: "a kérés a hívás közepén, a válasz megérkezése előtt megszakadt. Küldj `continue` üzenetet az újrapróbáláshoz."
    max_iterations_reached: "az eszköziterációk maximális száma még a végső válasz előtt elérve. Küldj `continue` üzenetet a folytatáshoz, vagy emeld meg a `max_iterations` értékét."
    error_near_max_iterations: "az iterációs limit közelében hiba történt, még a végső válasz előtt. Nézd meg a fenti eszközkimenetet, majd küldj `continue` üzenetet."
    repeated_outer_errors: "a kör ismétlődő hibákkal folyton elakadt, ezért idő előtt leállt, hogy ne próbálkozzon a végtelenségig. Nézd meg a fenti hibákat, majd küldj `continue` üzenetet az újrapróbáláshoz."
  persistence:
    compression: "a kör leállt, mert egy másik folyamat éppen tömörítette ezt a munkamenetet. Az üzeneted valószínűleg már mentve van — kérlek, küldd el újra, amint a tömörítés befejeződött."
    compression_closed: "a kör leállt, mert a kontextustömörítés lecserélte ezt a munkamenetet, és az élő folytatását nem lehetett átvenni. A tároló maga rendben van — frissítsd a klienst (vagy kezdj új kört), hogy felvegye az új munkamenet-azonosítót, majd küldd el újra az üzenetedet."
    turn_lease: "a kör leállt, mert egy másik Hermes-folyamat átvette ezt a munkamenetet. A válaszod nem lett mentve — várd meg, amíg a másik folyamat befejezi, majd küldd el újra az üzenetedet."
    session_row_missing: "ezt a munkamenetet a tárolóból törölték, miközben a csevegés még nyitva volt, és a Hermes nem tudta újra létrehozni, így ez az üzenet nem lett mentve. Küldd el újra az üzenetedet; ha továbbra sem sikerül, futtasd a `hermes {profile_arg}doctor` parancsot."
    locked: "a kör leállt, mert a munkamenet-tároló foglalt volt (egy másik Hermes-folyamat írt az állapot-adatbázisba). Az üzeneted valószínűleg már mentve van — kérlek, küldd el újra egy pillanat múlva."
    replaced: "a munkamenet-adatbázis fájlját lecserélték, miközben a Hermes futott, így ez az üzenet nem lett mentve (egy másolat itt található: {home}/sessions/). Állítsd le a Hermest (`hermes {profile_arg}gateway stop`), futtasd a `hermes {profile_arg}doctor` parancsot — de NE a `hermes {profile_arg}doctor --fix` parancsot, mert az a rossz fájlt javítaná helyben —, majd indítsd újra, és küldd el még egyszer az üzenetedet. A haladó helyreállítási lépéseket a napló tartalmazza."
    deleted_wal: "egy másik Hermes-folyamat még a munkamenet-adatbázis írásnaplójának (WAL) egy régi példányát tartja fogva, ezért a Hermes a fájl védelmében leállította az írást, és ez az üzenet nem lett mentve (egy másolat itt található: {home}/sessions/). Semmi nem veszett el. Lépj ki minden Hermes-folyamatból ezen a profilon (Desktop app, `hermes {profile_arg}gateway stop`, dashboard, cron), futtasd a `hermes {profile_arg}doctor` parancsot — ez megnevezi a naplót még fogva tartó folyamatokat —, majd indítsd újra a Hermest, és küldd el még egyszer az üzenetedet. Amíg futnak, ne futtasd a `doctor --fix` parancsot, és ne törölj state.db fájlokat. Útmutató: {recovery_docs}"
    corrupt: "a kör leállt, mert az állapot-adatbázis szerkezeti sérülést jelzett (az átirat újraindításkor elveszett volna). A lemezhely felszabadítása nem segít. Helyreállítási lehetőségek:\n1. Futtasd a `hermes {profile_arg}doctor --fix` parancsot\n2. Állítsd le az átjárót, majd állítsd helyre így:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (ha helyreállíthatónak jelzi) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — a helyreállítás először pillanatképet készít a sérült fájlról; NE futtass `sqlite3 ... \".recover\"` parancsot az élő state.db fájlon, egy sebezhető sqlite3 CLI tovább ronthatja\n3. Állítsd vissza egy biztonsági mentésből innen: {backups_dir}/\nEzután küldd el újra az üzenetedet."
    fts_index: "a kör leállt, mert a munkamenet-keresési index (FTS5) sérült, és nem lehetett leválasztani, így ez az üzenet nem lett mentve. Az üzenettároló maga nem sérült: ne futtass helyreállító eszközöket, és ne állíts vissza biztonsági mentést. Futtasd a `hermes {profile_arg}doctor --fix` parancsot (vagy indítsd újra a Hermest, ami megnyitáskor megjavítja az indexet), majd küldd el újra az üzenetedet."
    disk: "A Hermes nem tudta lemezre menteni ezt a beszélgetést, ezért inkább leállt, mint hogy elvesszenek az üzeneteid. A lemez valószínűleg megtelt: szabadíts fel helyet (vagy javítsd a {home}/state.db jogosultságait), majd küldd el újra az üzenetedet."
    default: "A Hermes nem tudta menteni ezt a beszélgetést, ezért inkább leállt, mint hogy elvesszenek az üzeneteid. Lehetséges okok: megtelt a meghajtó, vagy egy másik Hermes-folyamat tartja fogva az adatbázist. Zárd be a többi Hermes-ablakot, futtasd a `hermes {profile_arg}doctor` parancsot a tároló ellenőrzéséhez, majd küldd el újra az üzenetedet."
  file_mutation:
    header: "⚠️ Fájlmódosítás-ellenőrző: {count} fájlszerkesztés SIKERTELEN volt ebben a körben, bármit is sugall a fenti szöveg. Futtasd a `git status` vagy a `read_file` parancsot, hogy lásd, mi került be valójában."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "sikertelen"
  shared:
    and_more: "  • … és még {count}"
    the_model: "A modell"
tips:
  t001: "A /bg <prompt> külön munkamenetben futtat egy feladatot, miközben a jelenlegi szabad marad; a /btw <question> mellékes kérdésre válaszol erről a beszélgetésről, anélkül hogy megszakítaná."
  t002: "A /branch elágaztatja a jelenlegi munkamenetet, így más irányt is kipróbálhatsz a haladás elvesztése nélkül."
  t003: "A /compress kézzel tömöríti a beszélgetés kontextusát, ha már túl hosszúra nyúlt."
  t004: "A /rollback kilistázza a fájlrendszer-ellenőrzőpontokat — az ügynök által módosított fájlokat bármely korábbi állapotra visszaállíthatod."
  t005: "A /rollback diff 2 megmutatja, mi változott a 2. ellenőrzőpont óta, anélkül hogy bármit visszaállítana."
  t006: "A /rollback 2 src/file.py egyetlen fájlt állít vissza egy adott ellenőrzőpontból."
  t007: "A /title \"my project\" nevet ad a munkamenetnek — később a /resume vagy a hermes -c paranccsal folytathatod."
  t008: "A /resume ott folytatja, ahol egy korábban elnevezett munkamenetben abbahagytad."
  t009: "A /queue <prompt> a következő körre sorol be egy üzenetet, a jelenlegi kör megszakítása nélkül."
  t010: "A /undo eltávolítja az utolsó felhasználó/asszisztens váltást a beszélgetésből."
  t011: "A /retry újraküldi az utolsó üzenetedet — hasznos, ha az ügynök válasza nem sikerült igazán jól."
  t012: "A /verbose az eszközök haladásának megjelenítését váltogatja: off → new → all → verbose."
  t013: "A /reasoning high növeli a modell gondolkodási mélységét. A /reasoning show megjeleníti az érvelést."
  t014: "A /fast bekapcsolja a prioritásos feldolgozást a gyorsabb API-válaszokért (szolgáltatófüggő)."
  t015: "A /yolo a munkamenet hátralévő részében kihagyja a veszélyes parancsok jóváhagyási kérdéseit."
  t016: "A /model paranccsal munkamenet közben válthatsz modellt — próbáld ki: /model sonnet vagy /model gpt-5."
  t017: "A /model --global véglegesen módosítja az alapértelmezett modelledet."
  t018: "A /personality pirate vicces személyiséget állít be — 14 beépített lehetőség a kawaii-tól a shakespeare-ig."
  t019: "A /skin megváltoztatja a CLI témáját — próbáld ki: ares, mono, slate, poseidon vagy charizard."
  t020: "A /statusbar állandó sávot kapcsol be, amely a modellt, a tokeneket, a kontextus telítettségét (%), a költséget és az időtartamot mutatja."
  t021: "A /tools disable browser ideiglenesen eltávolítja a böngészőeszközöket a jelenlegi munkamenetből."
  t022: "A /browser connect CDP-n keresztül csatolja a böngészőeszközöket a futó Chromium-alapú böngésződhöz."
  t023: "A /plugins kilistázza a telepített pluginokat és állapotukat."
  t024: "A /cron az ütemezett feladatokat kezeli — állíts be ismétlődő promptokat, kézbesítéssel bármelyik platformra."
  t025: "A /reload-mcp újraindítás nélkül, menet közben tölti újra az MCP-szerverek konfigurációját."
  t026: "A /usage megmutatja a tokenhasználatot, a költségek bontását és a munkamenet időtartamát."
  t027: "A /insights az utolsó 30 nap használati statisztikáit mutatja."
  t028: "A /paste képet keres a vágólapodon, és csatolja a következő üzenetedhez."
  t029: "A /profile megmutatja, melyik profil aktív, és hol van a saját mappája."
  t030: "A /config egy pillantással áttekinthetően mutatja a jelenlegi konfigurációdat."
  t031: "A /stop leállítja az ügynök által indított összes futó háttérfolyamatot."
  t032: "A @file:path/to/file.py közvetlenül beilleszti a fájl tartalmát az üzenetedbe."
  t033: "A @file:main.py:10-50 csak a fájl 10–50. sorait illeszti be."
  t034: "A @folder:src/ egy mappa fastruktúráját illeszti be."
  t035: "A @diff a nem stage-elt git változásaidat illeszti be az üzenetbe."
  t036: "A @staged a stage-elt git változásaidat illeszti be (git diff --staged)."
  t037: "A @git:5 az utolsó 5 commitot illeszti be teljes patch-ekkel."
  t038: "A @url:https://example.com letölti és beilleszti egy weboldal tartalmát."
  t039: "A @ beírása fájlrendszer-útvonal kiegészítést indít — interaktívan navigálhatsz bármelyik fájlhoz."
  t040: "Kombinálhatsz több hivatkozást: \"Review @file:main.py and @file:test.py for consistency.\""
  t041: "Az Alt+Enter új sort szúr be többsoros bevitelhez. (A Windows Terminal elkapja az Alt+Enter-t — használd helyette a Ctrl+Enter-t.)"
  t042: "A Ctrl+C megszakítja az ügynököt. Nyomd meg kétszer 2 másodpercen belül a kényszerített kilépéshez."
  t043: "A Ctrl+Z a háttérbe küldi a Hermest — a folytatáshoz futtasd a shellben az fg parancsot."
  t044: "A Tab elfogadja az automatikus javaslat szürke szövegét, vagy kiegészíti a slash-parancsokat."
  t045: "Írj új üzenetet, miközben az ügynök dolgozik, hogy megszakítsd és új irányba tereld."
  t046: "Az Alt+V képet illeszt be a vágólapodról a beszélgetésbe."
  t047: "5 vagy több sor beillesztésekor a tartalom automatikusan fájlba kerül, és helyette egy tömör hivatkozás jelenik meg."
  t048: "A hermes -c a legutóbbi CLI-munkamenetedet folytatja. A hermes -c \"project name\" cím alapján folytat."
  t049: "A hermes -w elkülönített git worktree-t hoz létre — ideális párhuzamos ügynök-munkafolyamatokhoz."
  t050: "A hermes -w -q \"Fix issue #42\" a worktree-elkülönítést egyszeri lekérdezéssel kombinálja."
  t051: "A hermes chat -t web,terminal csak a megadott eszközkészleteket kapcsolja be egy fókuszált munkamenethez."
  t052: "A hermes chat -s github-pr-workflow már indításkor betölt egy skillt."
  t053: "A hermes chat -q \"query\" egyetlen nem interaktív lekérdezést futtat, majd kilép."
  t054: "A hermes chat --max-turns 1000 felülírja az alapértelmezett, körönkénti 500 iterációs limitet."
  t055: "A hermes chat --checkpoints minden destruktív fájlmódosítás előtt fájlrendszer-pillanatképet készít."
  t056: "A hermes --yolo az egész munkamenetre kihagyja a veszélyes parancsok jóváhagyási kérdéseit."
  t057: "A hermes chat --source telegram megjelöli a munkamenetet, hogy a hermes sessions list kimenetében szűrhető legyen."
  t058: "A hermes -p work chat egy adott profil alatt fut, az alapértelmezett módosítása nélkül."
  t059: "A hermes doctor --fix diagnosztizálja és automatikusan kijavítja a konfigurációs és függőségi hibákat."
  t060: "A hermes dump tömör összefoglalót ad a telepítésedről — remek hibajelentésekhez."
  t061: "A hermes config set KEY VALUE a titkokat automatikusan a .env fájlba, minden mást a config.yaml-be irányít."
  t062: "A hermes config edit megnyitja a config.yaml fájlt az alapértelmezett szerkesztődben."
  t063: "A hermes config check hiányzó vagy elavult konfigurációs beállításokat keres."
  t064: "A hermes sessions browse interaktív, kereshető munkamenet-választót nyit meg."
  t065: "A hermes sessions stats platformonkénti munkamenetszámot és az adatbázis méretét mutatja."
  t066: "A hermes sessions prune --older-than 30 kitakarítja a régi munkameneteket."
  t067: "A hermes skills search react --source skills-sh a skills.sh nyilvános katalógusában keres."
  t068: "A hermes skills check a telepített hub-skillek frissítéseit ellenőrzi."
  t069: "A hermes skills tap add myorg/skills-repo egyedi GitHub skill-forrást ad hozzá."
  t070: "A hermes skills snapshot export setup.json exportálja a skill-konfigurációdat biztonsági mentéshez vagy megosztáshoz."
  t071: "A hermes mcp add github --command npx parancssorból ad hozzá MCP-szervereket."
  t072: "A hermes mcp serve magát a Hermest futtatja MCP-szerverként más ügynökök számára."
  t073: "A hermes auth add több API-kulcsot is felvehet a hitelesítőadat-készlet rotálásához."
  t074: "A hermes completion bash >> ~/.bashrc bekapcsolja a Tab-kiegészítést minden parancshoz és profilhoz."
  t075: "A hermes logs -f valós időben követi az agent.log fájlt. A --level WARNING --since 1h szűri a kimenetet."
  t076: "A hermes backup zip biztonsági mentést készít a teljes Hermes saját mappádról."
  t077: "A hermes profile create coder elkülönített profilt hoz létre, amely saját parancsként is elérhető."
  t078: "A hermes profile create work --clone átmásolja a jelenlegi konfigurációdat és kulcsaidat egy új profilba."
  t079: "A hermes update automatikusan szinkronizálja az új beépített skilleket MINDEN profilba."
  t080: "A hermes gateway install rendszerszolgáltatásként állítja be a Hermest (systemd/launchd)."
  t081: "A hermes memory setup segítségével külső memória-szolgáltatót állíthatsz be (Honcho, Mem0 stb.)."
  t082: "A hermes webhook subscribe eseményvezérelt webhook-útvonalakat hoz létre HMAC-ellenőrzéssel."
  t083: "Spórolj: a hermes tools kikapcsolja a nem használt eszközöket, a hermes skills config pedig lecsupaszítja a skilleket."
  t084: "A /reasoning low vagy /reasoning minimal az alapértelmezett (medium) alá csökkenti a gondolkodási mélységet — gyorsabb, olcsóbb válaszok."
  t085: "A hermes models a látás-, tömörítési és kiegészítő feladatokat olcsóbb modellekre irányítja — 85%+ megtakarítás a háttér-tokenköltségen, a fő chat-modelled lecserélése nélkül."
  t086: "Állítsd be a display.bell_on_complete: true értéket a config.yaml-ben, hogy hangjelzést kapj a hosszú feladatok végén."
  t087: "Állítsd be a display.streaming: true értéket, hogy a tokenek valós időben jelenjenek meg, ahogy a modell generálja őket."
  t088: "Állítsd be a display.show_reasoning: true értéket, hogy lásd a modell gondolatmenetét."
  t089: "Állítsd be a display.compact: true értéket, hogy kevesebb üres hellyel, sűrűbben jelenjenek meg az információk."
  t090: "Állítsd be a display.busy_input_mode: queue értéket, hogy az üzenetek sorba kerüljenek az ügynök megszakítása helyett, vagy a steer értéket, hogy futás közben a /steer paranccsal add át őket."
  t091: "Állítsd be a display.resume_display: minimal értéket, hogy munkamenet folytatásakor kimaradjon a teljes beszélgetés-összefoglaló."
  t092: "Állítsd be a compression.threshold: 0.50 értéket, hogy szabályozd, mikor induljon az automatikus tömörítés (alapértelmezés: a kontextus 50%-a)."
  t093: "Állítsd be az agent.max_turns: 1000 értéket, hogy az ügynök körönként több eszközhívási lépést tehessen."
  t094: "Állítsd be a file_read_max_chars: 200000 értéket, hogy megnöveld a read_file hívásonkénti maximális tartalmat."
  t095: "Állítsd be az approvals.mode: smart értéket, hogy egy LLM automatikusan jóváhagyja a biztonságos parancsokat, és elutasítsa a veszélyeseket."
  t096: "Állítsd be a fallback_model értéket a config.yaml-ben, hogy automatikusan tartalék szolgáltatóra váltson hiba esetén."
  t097: "Állítsd be a privacy.redact_pii: true értéket, hogy a felhasználói azonosítók és telefonszámok hashelve kerüljenek az LLM-hez."
  t098: "Állítsd be a browser.record_sessions: true értéket, hogy a böngésző-munkamenetek automatikusan WebM videóként rögzüljenek."
  t099: "Állítsd be a worktree: true értéket a config.yaml-ben, hogy mindig git worktree jöjjön létre (ugyanaz, mint a hermes -w)."
  t100: "Állítsd be a security.website_blocklist.enabled: true értéket, hogy bizonyos domaineket letilts a webeszközök számára."
  t101: "Állítsd be a cron.wrap_response: false értéket, hogy az ügynök nyers kimenete a cron fejléc/lábléc nélkül érkezzen."
  t102: "A HERMES_TIMEZONE bármilyen IANA időzóna-karakterlánccal felülírja a szerver időzónáját."
  t103: "A config.yaml-ben működik a környezeti változók behelyettesítése: használd a ${VAR_NAME} szintaxist."
  t104: "A config.yaml gyorsparancsai azonnal futtatnak shell-parancsokat, nulla tokenhasználattal."
  t105: "Egyedi személyiségeket a config.yaml agent.personalities szekciójában definiálhatsz."
  t106: "A provider_routing szabályozza az OpenRouter-szolgáltatók sorrendjét, engedélyezését és tiltását."
  t107: "Az execute_code Python-szkripteket futtat, amelyek programozottan hívják a Hermes-eszközöket — az eredmények nem terhelik a kontextust."
  t108: "A delegate_task alapértelmezés szerint legfeljebb 10 párhuzamos alügynököt indít (delegation.max_concurrent_children), elkülönített kontextussal a párhuzamos munkához."
  t109: "A web_extract PDF-URL-ekkel is működik — adj meg bármilyen PDF-linket, és markdownná alakítja."
  t110: "A search_files ripgrep-alapú és gyorsabb a grepnél — használd a terminálos grep helyett."
