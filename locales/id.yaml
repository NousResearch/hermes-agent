# Katalog pesan statis Hermes -- Bahasa Indonesia (id)
#
# Hanya pesan statis user-facing dari prompt approval CLI dan sejumlah balasan
# slash command gateway. Output agen, log, traceback error, output tool, dan
# deskripsi slash command tetap bahasa Inggris -- lihat agent/i18n.py.
#
# Key berupa dotted path; nesting hanya untuk readability. Nilai boleh berisi
# token {placeholder} untuk substitusi str.format. Parity key dengan en.yaml
# dijaga oleh tests/agent/test_i18n.py.

