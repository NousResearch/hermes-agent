  choose_long:     "      [o]nce (sekali)  |  [s]ession (sesi)  |  [a]lways (selalu)  |  [d]eny (tolak)"
  choose_short:    "      [o]nce (sekali)  |  [s]ession (sesi)  |  [d]eny (tolak)"
