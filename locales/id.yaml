  prompt_short:    "      Pilihan [o/s/D]: "
  choose_smart_deny: "      [o]nce (sekali)  |  [d]eny (tolak)"
  prompt_smart_deny: "      Pilihan [o/D]: "
  smart_deny_once_inputs: "o,once"
  smart_deny_deny_inputs: "d,deny"
  timeout:         "      ⏱ Tidak ada jawaban dalam {waited} — perintah tidak dijalankan. Minta lagi untuk mengulang, atau naikkan batasnya: hermes config set approvals.timeout {suggested}"
  allowed_once:    "      ✓ Diizinkan sekali"
  allowed_session: "      ✓ Diizinkan untuk sesi ini"
  allowed_always:  "      ✓ Ditambahkan ke daftar izin permanen"
