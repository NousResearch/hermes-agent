  t375: 'security.tirith_fail_open: false membuat Hermes memblokir perintah saat pemindai tirith sendiri error.'
  t376: Variabel TIRITH_FAIL_OPEN menimpa config tirith_fail_open — pengalih cepat tanpa menyunting config.yaml.
  t377: Chat --source tool dikecualikan dari hermes sessions list secara bawaan — setel --source secara eksplisit untuk melihatnya.
  t378: ID sesi berawalan stempel waktu (20250305_091523_abcd) sehingga pengurutan bekerja alami di ls dan jq.
  t379: API_SERVER_MODEL_NAME menyesuaikan nama model di /v1/models — penting untuk penyiapan Open WebUI multi-profil.
  t380: Plugin dashboard dilayani dari /dashboard-plugins/<name>/ — letakkan file ke ~/.hermes/dashboard-plugins/.
