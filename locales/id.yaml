explainer:
  no_reply_prefix: '⚠️ Tidak ada balasan: '
  empty_response: '{model} tidak menghasilkan balasan kali ini, meski sudah dicoba ulang. Kirim `continue` untuk mencoba lagi, atau ganti model dengan /model.'
  exit:
    all_retries_exhausted_no_response: penyedia model tidak menjawab setelah semua percobaan ulang. Kirim /retry, atau ganti model dengan /model.
    partial_stream_recovery: aliran terhenti lebih awal dan hanya sebagian balasan berhasil dipulihkan. Kirim `continue` untuk melanjutkan dari titik terhenti.
    fallback_prior_turn_content: tidak ada konten baru pada giliran ini; konteks sebelumnya yang dipulihkan ditampilkan. Kirim `continue` untuk mencoba lagi.
    redirect_restart_limit_exceeded: permintaan dibatalkan oleh koreksi baru pada setiap percobaan, sehingga giliran dihentikan agar tidak terus mengulang. Koreksi terakhir Anda diantrekan sebagai pesan berikutnya.
    rebuilt_restart_limit_exceeded: setiap penyedia dalam rantai cadangan terus gagal, sehingga giliran dihentikan agar tidak terus mengulang. Kirim `continue` atau ganti penyedia.
    budget_exhausted: batas iterasi/biaya per giliran habis sebelum ada jawaban akhir. Kirim `continue` untuk melanjutkan.
    ollama_runtime_context_too_small: jendela konteks model lokal terlalu kecil untuk menyelesaikan tugas. Perbesar konteks atau gunakan model yang lebih besar.
    pending_tool_result: giliran terhenti saat hasil alat masih tertunda dan model tidak memberi tindak lanjut. Kirim `continue` agar model merangkumnya.
    interrupted_during_api_call: permintaan terputus saat pemanggilan berlangsung, sebelum balasan diterima. Kirim `continue` untuk mencoba lagi.
    max_iterations_reached: batas maksimum iterasi alat tercapai sebelum jawaban akhir. Kirim `continue` untuk melanjutkan, atau naikkan `max_iterations`.
    error_near_max_iterations: terjadi kesalahan menjelang batas iterasi sebelum jawaban akhir. Periksa keluaran alat di atas, lalu kirim `continue`.
    repeated_outer_errors: giliran terus gagal dengan kesalahan berulang dan dihentikan lebih awal agar tidak terus mengulang. Periksa kesalahan di atas, lalu kirim `continue` untuk mencoba lagi.
  persistence:
    compression: giliran dihentikan karena proses lain sedang memadatkan sesi ini. Pesan Anda seharusnya sudah tersimpan — kirim lagi setelah pemadatan selesai.
    compression_closed: giliran dihentikan karena sesi ini dirotasi oleh pemadatan konteks dan kelanjutannya tidak dapat diambil alih. Penyimpanan tetap sehat — segarkan klien (atau mulai giliran baru) agar mengambil ID sesi baru, lalu kirim pesan Anda lagi.
    turn_lease: giliran dihentikan karena proses Hermes lain mengambil alih sesi ini. Balasan Anda tidak tersimpan — tunggu proses lain selesai, lalu kirim pesan lagi.
    session_row_missing: sesi ini dihapus dari penyimpanan saat percakapan masih terbuka, dan Hermes tidak dapat membuatnya kembali, sehingga pesan ini tidak tersimpan. Kirim lagi; jika terus gagal, jalankan `hermes {profile_arg}doctor`.
    locked: giliran dihentikan karena penyimpanan sesi sibuk (proses Hermes lain sedang menulis ke basis data status). Pesan Anda seharusnya sudah tersimpan — kirim lagi sebentar lagi.
    replaced: berkas basis data sesi diganti saat Hermes berjalan, sehingga pesan ini tidak tersimpan (salinan ada di {home}/sessions/). Hentikan Hermes (`hermes {profile_arg}gateway stop`), jalankan `hermes {profile_arg}doctor` — jangan `hermes {profile_arg}doctor --fix`, yang akan memperbaiki berkas keliru secara langsung — lalu jalankan kembali dan kirim pesan lagi. Langkah pemulihan lanjutan ada di log.
    deleted_wal: 'proses Hermes lain masih memegang salinan lama write-ahead log basis data sesi, sehingga Hermes berhenti menulis demi menjaga berkas dan pesan ini tidak tersimpan (salinan ada di {home}/sessions/). Tidak ada yang hilang. Tutup semua proses Hermes pada profil ini (aplikasi Desktop, `hermes {profile_arg}gateway stop`, dashboard, cron), jalankan `hermes {profile_arg}doctor` — perintah itu menyebut proses yang masih memegang log — lalu jalankan Hermes kembali dan kirim pesan lagi. Jangan jalankan `doctor --fix` atau hapus berkas state.db saat proses masih berjalan. Panduan: {recovery_docs}'
    corrupt: "giliran dihentikan karena basis data status melaporkan kerusakan struktur (transkrip akan hilang saat dimulai ulang). Mengosongkan ruang disk tidak akan membantu. Opsi pemulihan:\n1. Jalankan `hermes {profile_arg}doctor --fix`\n2. Hentikan gateway, lalu pulihkan dengan:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (jika dapat dipulihkan) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — pemulihan membuat snapshot berkas rusak terlebih dahulu; JANGAN jalankan `sqlite3 ... \".recover\"` pada state.db aktif, karena CLI sqlite3 yang rentan dapat merusaknya lebih jauh\n3. Pulihkan dari cadangan di {backups_dir}/\nLalu kirim pesan Anda lagi."
    fts_index: 'giliran dihentikan karena indeks pencarian sesi (FTS5) rusak dan tidak dapat dilepas, sehingga pesan ini tidak tersimpan. Penyimpanan pesan itu sendiri tidak rusak: jangan jalankan alat pemulihan atau pulihkan cadangan. Jalankan `hermes {profile_arg}doctor --fix` (atau mulai ulang Hermes, yang memperbaiki indeks saat dibuka), lalu kirim pesan lagi.'
    disk: 'Hermes tidak dapat menyimpan percakapan ini ke disk, sehingga berhenti agar pesan Anda tidak hilang. Disk mungkin penuh: kosongkan ruang (atau perbaiki izin pada {home}/state.db), lalu kirim pesan lagi.'
    default: 'Hermes tidak dapat menyimpan percakapan ini, sehingga berhenti agar pesan Anda tidak hilang. Kemungkinan penyebabnya: ruang penyimpanan habis, atau proses Hermes lain memegang basis data. Tutup jendela Hermes lain, jalankan `hermes {profile_arg}doctor` untuk memeriksa penyimpanan, lalu kirim pesan lagi.'
  file_mutation:
    header: '⚠️ Pemeriksa perubahan berkas: {count} pengeditan berkas GAGAL pada giliran ini, meskipun uraian di atas mungkin menyatakan sebaliknya. Jalankan `git status` atau `read_file` untuk memastikan perubahan yang benar-benar diterapkan.'
    entry: '  • `{path}` — [{tool}] {preview}'
    failed: gagal
  shared:
    and_more: '  • … dan {count} lainnya'
    the_model: Model
tips:
  t001: /bg <prompt> menjalankan tugas di sesi terpisah agar sesi ini tetap tersedia; /btw <question> menjawab pertanyaan sampingan tanpa mengganggu percakapan.
  t002: /branch membuat cabang sesi ini agar Anda bisa mencoba arah lain tanpa kehilangan kemajuan.
  t003: /compress memadatkan konteks percakapan secara manual saat percakapan panjang.
  t004: /rollback menampilkan titik pemulihan sistem berkas — pulihkan berkas yang diubah agen ke keadaan sebelumnya.
  t005: /rollback diff 2 menampilkan perubahan sejak titik pemulihan 2 tanpa memulihkan apa pun.
  t006: /rollback 2 src/file.py memulihkan satu berkas dari titik pemulihan tertentu.
  t007: /title "my project" memberi nama sesi Anda — lanjutkan nanti dengan /resume atau hermes -c.
  t008: /resume melanjutkan sesi bernama dari titik terakhir.
  t009: /queue <prompt> mengantrekan pesan untuk giliran berikutnya tanpa mengganggu giliran saat ini.
  t010: /undo menghapus pertukaran pengguna/asisten terakhir dari percakapan.
  t011: /retry mengirim ulang pesan terakhir Anda — berguna saat balasan agen kurang tepat.
  t012: '/verbose menggilir tampilan kemajuan alat: off → new → all → verbose.'
  t013: /reasoning high meningkatkan kedalaman penalaran model. /reasoning show menampilkan penalarannya.
  t014: /fast mengaktifkan atau menonaktifkan pemrosesan prioritas untuk balasan API lebih cepat (tergantung penyedia).
  t015: /yolo melewati semua permintaan izin perintah berbahaya selama sisa sesi.
  t016: /model memungkinkan Anda mengganti model di tengah sesi — coba /model sonnet atau /model gpt-5.
  t017: /model --global mengubah model bawaan Anda secara permanen.
  t018: /personality pirate memilih kepribadian unik — ada 14 pilihan bawaan dari kawaii hingga shakespeare.
  t019: /skin mengubah tema CLI — coba ares, mono, slate, poseidon, atau charizard.
  t020: /statusbar mengubah bilah tetap yang menampilkan model, token, persentase konteks terpakai, biaya, dan durasi.
  t021: /tools disable browser menonaktifkan alat browser sementara untuk sesi ini.
  t022: /browser connect menghubungkan alat browser ke browser keluarga Chromium yang sedang berjalan melalui CDP.
  t023: /plugins menampilkan plugin terpasang beserta statusnya.
  t024: /cron mengelola tugas terjadwal — atur prompt berulang yang dikirim ke platform mana pun.
  t025: /reload-mcp memuat ulang konfigurasi server MCP tanpa memulai ulang.
  t026: /usage menampilkan penggunaan token, rincian biaya, dan durasi sesi.
  t027: /insights menampilkan analitik penggunaan selama 30 hari terakhir.
  t028: /paste memeriksa gambar di papan klip dan melampirkannya ke pesan berikutnya.
  t029: /profile menampilkan profil aktif dan direktori home-nya.
  t030: /config menampilkan ringkasan konfigurasi Anda saat ini.
  t031: /stop menghentikan semua proses latar belakang yang dijalankan agen.
  t032: '@file:path/to/file.py memasukkan isi berkas langsung ke pesan Anda.'
  t033: '@file:main.py:10-50 hanya memasukkan baris 10-50 dari berkas.'
  t034: '@folder:src/ memasukkan daftar pohon direktori.'
  t035: '@diff memasukkan perubahan git yang belum di-stage ke pesan.'
  t036: '@staged memasukkan perubahan git yang sudah di-stage (git diff --staged).'
  t037: '@git:5 memasukkan 5 commit terakhir beserta patch lengkap.'
  t038: '@url:https://example.com mengambil dan memasukkan isi halaman web.'
  t039: Mengetik @ membuka pelengkapan path sistem berkas — jelajahi berkas secara interaktif.
  t040: 'Gabungkan beberapa rujukan: "Tinjau @file:main.py dan @file:test.py agar konsisten."'
  t041: Alt+Enter menambah baris baru untuk masukan multibaris. (Windows Terminal menangkap Alt+Enter — gunakan Ctrl+Enter.)
  t042: Ctrl+C menghentikan agen. Tekan dua kali dalam 2 detik untuk keluar paksa.
  t043: Ctrl+Z menangguhkan Hermes ke latar belakang — jalankan fg di shell untuk melanjutkan.
  t044: Tab menerima saran teks samar atau melengkapi perintah slash.
  t045: Ketik pesan baru saat agen bekerja untuk menghentikan dan mengarahkannya kembali.
  t046: Alt+V menempelkan gambar dari papan klip ke percakapan.
  t047: Menempelkan 5+ baris otomatis menyimpannya ke berkas dan memasukkan rujukan singkat.
  t048: hermes -c melanjutkan sesi CLI terbaru. hermes -c "project name" melanjutkan berdasarkan judul.
  t049: hermes -w membuat git worktree terpisah — cocok untuk alur kerja agen paralel.
  t050: 'hermes -w -q "Fix issue #42" menggabungkan worktree terpisah dengan kueri sekali jalan.'
  t051: hermes chat -t web,terminal hanya mengaktifkan kumpulan alat tertentu untuk sesi yang fokus.
  t052: hermes chat -s github-pr-workflow memuat skill saat awal.
  t053: hermes chat -q "query" menjalankan satu kueri tanpa interaksi lalu keluar.
  t054: hermes chat --max-turns 1000 mengubah batas bawaan 500 iterasi per giliran.
  t055: hermes chat --checkpoints mengaktifkan snapshot sistem berkas sebelum setiap perubahan berkas yang berisiko.
  t056: hermes --yolo melewati semua permintaan izin perintah berbahaya selama sesi.
  t057: hermes chat --source telegram menandai sesi agar dapat difilter di hermes sessions list.
  t058: hermes -p work chat berjalan dengan profil tertentu tanpa mengubah profil bawaan.
  t059: hermes doctor --fix mendiagnosis dan memperbaiki masalah konfigurasi dan dependensi otomatis.
  t060: hermes dump mengeluarkan ringkasan penyiapan — berguna untuk laporan bug.
  t061: hermes config set KEY VALUE otomatis menyimpan rahasia ke .env dan lainnya ke config.yaml.
  t062: hermes config edit membuka config.yaml di editor bawaan Anda.
  t063: hermes config check memeriksa opsi konfigurasi yang hilang atau usang.
  t064: hermes sessions browse membuka pemilih sesi interaktif dengan pencarian.
  t065: hermes sessions stats menampilkan jumlah sesi per platform dan ukuran basis data.
  t066: hermes sessions prune --older-than 30 membersihkan sesi lama.
  t067: hermes skills search react --source skills-sh mencari di direktori publik skills.sh.
  t068: hermes skills check memeriksa pembaruan skill hub yang terpasang.
  t069: hermes skills tap add myorg/skills-repo menambahkan sumber skill GitHub khusus.
  t070: hermes skills snapshot export setup.json mengekspor konfigurasi skill untuk cadangan atau dibagikan.
  t071: hermes mcp add github --command npx menambahkan server MCP dari baris perintah.
  t072: hermes mcp serve menjalankan Hermes sebagai server MCP untuk agen lain.
  t073: hermes auth add memungkinkan penambahan beberapa kunci API untuk rotasi kumpulan kredensial.
  t074: hermes completion bash >> ~/.bashrc mengaktifkan pelengkapan Tab untuk semua perintah dan profil.
  t075: hermes logs -f mengikuti agent.log langsung. --level WARNING --since 1h memfilter keluaran.
  t076: hermes backup membuat cadangan zip untuk seluruh direktori home Hermes.
  t077: hermes profile create coder membuat profil terpisah yang menjadi perintah tersendiri.
  t078: hermes profile create work --clone menyalin konfigurasi dan kunci saat ini ke profil baru.
  t079: hermes update menyinkronkan skill bawaan baru ke SEMUA profil secara otomatis.
  t080: hermes gateway install menyiapkan Hermes sebagai layanan sistem (systemd/launchd).
  t081: hermes memory setup mengatur penyedia memori eksternal (Honcho, Mem0, dll.).
  t082: hermes webhook subscribe membuat rute webhook berbasis peristiwa dengan validasi HMAC.
  t083: 'Hemat biaya: hermes tools menonaktifkan alat yang tidak dipakai, hermes skills config membatasi skill.'
  t084: /reasoning low atau /reasoning minimal mengurangi kedalaman penalaran dari bawaan (medium) — balasan lebih cepat dan murah.
  t085: hermes models mengarahkan tugas visual, kompresi, dan tambahan ke model yang lebih murah — memangkas biaya token latar belakang 85%+ tanpa menurunkan model percakapan utama.
  t086: 'Atur display.bell_on_complete: true di config.yaml untuk mendengar bunyi saat tugas panjang selesai.'
  t087: 'Atur display.streaming: true untuk melihat token muncul langsung saat model membuatnya.'
  t088: 'Atur display.show_reasoning: true untuk melihat proses penalaran model.'
  t089: 'Atur display.compact: true untuk mengurangi spasi pada keluaran agar informasi lebih padat.'
  t090: 'Atur display.busy_input_mode: queue agar pesan diantrekan, bukan menghentikan agen; atau steer untuk menyisipkannya saat proses berjalan melalui /steer.'
  t091: 'Atur display.resume_display: minimal untuk melewati rangkuman percakapan lengkap saat melanjutkan sesi.'
  t092: 'Atur compression.threshold: 0.50 untuk menentukan kapan kompresi otomatis berjalan (bawaan: 50% konteks).'
  t093: 'Atur agent.max_turns: 1000 agar agen dapat mengambil lebih banyak langkah pemanggilan alat per giliran.'
  t094: 'Atur file_read_max_chars: 200000 untuk menaikkan batas konten per pemanggilan read_file.'
  t095: 'Atur approvals.mode: smart agar LLM otomatis menyetujui perintah aman dan menolak yang berbahaya.'
  t096: Atur fallback_model di config.yaml untuk otomatis beralih ke penyedia cadangan saat gagal.
  t097: 'Atur privacy.redact_pii: true untuk melakukan hash pada ID pengguna dan nomor telepon sebelum dikirim ke LLM.'
  t098: 'Atur browser.record_sessions: true untuk merekam sesi browser secara otomatis sebagai video WebM.'
  t099: 'Atur worktree: true di config.yaml agar selalu membuat git worktree (sama seperti hermes -w).'
  t100: 'Atur security.website_blocklist.enabled: true untuk memblokir domain tertentu dari alat web.'
  t101: 'Atur cron.wrap_response: false untuk mengirim keluaran agen mentah tanpa pembuka/penutup cron.'
  t102: HERMES_TIMEZONE mengganti zona waktu server dengan nama zona waktu IANA apa pun.
  t103: 'Substitusi variabel lingkungan berlaku di config.yaml: gunakan sintaks ${VAR_NAME}.'
  t104: Perintah cepat di config.yaml menjalankan perintah shell segera tanpa memakai token.
  t105: Kepribadian khusus dapat ditetapkan di config.yaml pada agent.personalities.
  t106: provider_routing mengatur urutan, daftar izin, dan daftar blokir penyedia OpenRouter.
  t107: execute_code menjalankan skrip Python yang memanggil alat Hermes secara terprogram — hasilnya tidak masuk konteks.
  t108: delegate_task menjalankan hingga 10 subagen bersamaan secara bawaan (delegation.max_concurrent_children), masing-masing dengan konteks terpisah untuk pekerjaan paralel.
  t109: web_extract dapat membaca URL PDF — berikan tautan PDF dan alat ini mengubahnya ke markdown.
  t110: search_files didukung ripgrep dan lebih cepat daripada grep — gunakan sebagai pengganti grep di terminal.
  t111: patch memakai 9 strategi pencocokan fleksibel agar perbedaan spasi kecil tidak menggagalkan edit.
  t112: patch mendukung format V4A untuk edit banyak berkas dalam satu pemanggilan.
  t113: read_file menyarankan nama berkas serupa jika berkas tidak ditemukan.
  t114: read_file otomatis menghindari duplikasi — pembacaan ulang berkas yang tidak berubah hanya mengembalikan ringkasan ringan.
  t115: browser_vision mengambil tangkapan layar dan menganalisisnya dengan AI — dapat menangani CAPTCHA dan konten visual.
  t116: browser_console dapat mengevaluasi ekspresi JavaScript dalam konteks halaman.
  t117: image_generate membuat gambar dengan FLUX 2 Pro dan pembesaran otomatis 2x.
  t118: text_to_speech mengubah teks menjadi audio — diputar sebagai gelembung suara di Telegram.
  t119: send_message dapat menjangkau platform pesan terhubung mana pun dari dalam sesi.
  t120: Alat todo membantu agen melacak tugas rumit dengan banyak langkah selama sesi.
  t121: session_search melakukan pencarian teks lengkap di SEMUA percakapan sebelumnya.
  t122: Agen otomatis menyimpan preferensi, koreksi, dan fakta lingkungan ke memori.
  t123: /moa mengarahkan satu prompt sulit melalui kumpulan model Mixture of Agents yang Anda atur.
  t124: Perintah terminal mendukung mode latar belakang dengan notify_on_complete untuk tugas panjang.
  t125: Proses terminal di latar belakang mendukung watch_patterns untuk memberi tahu saat baris keluaran tertentu muncul.
  t126: 'Alat terminal mendukung 6 backend: local, Docker, SSH, Modal, Daytona, dan Singularity.'
  t127: Setiap profil memiliki konfigurasi, kunci API, memori, sesi, skill, dan tugas cron sendiri.
  t128: Nama profil menjadi perintah shell — 'hermes profile create coder' membuat perintah 'coder'.
  t129: hermes profile export coder -o backup.tar.gz membuat arsip profil portabel.
  t130: Jika dua profil tanpa sengaja memakai token bot yang sama, gateway kedua diblokir dengan pesan kesalahan yang jelas.
  t131: Sesi otomatis mendapat judul deskriptif setelah pertukaran pertama — tidak perlu memberi nama manual.
  t132: 'Judul sesi mendukung turunan: "my project" → "my project #2" → "my project #3".'
  t133: Saat keluar, Hermes menampilkan perintah untuk melanjutkan sesi beserta ID dan statistik.
  t134: hermes sessions export backup.jsonl mengekspor semua sesi untuk cadangan atau analisis.
  t135: hermes -r SESSION_ID melanjutkan sesi lama tertentu berdasarkan ID-nya.
  t136: Memori adalah snapshot tetap — perubahan baru muncul di prompt sistem saat sesi berikutnya dimulai.
  t137: Entri memori otomatis diperiksa untuk pola injeksi prompt dan pengiriman data keluar.
  t138: 'Agen memiliki dua penyimpanan memori: catatan pribadi (~2200 karakter) dan profil pengguna (~1375 karakter).'
  t139: Koreksi yang Anda berikan kepada agen ("tidak, lakukan begini") sering otomatis tersimpan ke memori.
  t140: Lebih dari 80 skill bawaan mencakup github, kreasi, mlops, produktivitas, riset, dan lainnya.
  t141: Setiap skill terpasang otomatis menjadi perintah slash — ketik / untuk melihat semuanya.
  t142: hermes skills install official/security/1password memasang skill opsional dari repo.
  t143: Skill dapat dibatasi ke sistem operasi tertentu — sebagian hanya dimuat di macOS atau Linux.
  t144: skills.external_dirs di config.yaml memungkinkan pemuatan skill dari direktori khusus.
  t145: Agen dapat membuat skill sendiri sebagai memori prosedural menggunakan skill_manage.
  t146: /plan menulis rencana implementasi markdown ke .hermes/plans/ tanpa menjalankannya.
  t147: 'Tugas cron dapat menyertakan skill: hermes cron add --skill blogwatcher "Check for new posts".'
  t148: Tujuan pengiriman cron meliputi telegram, discord, slack, email, sms, dan 12+ platform lainnya.
  t149: Jika balasan cron dimulai dengan [SILENT], pengiriman dibatalkan — berguna untuk tugas pemantauan saja.
  t150: Cron mendukung jeda relatif (30m), interval (every 2h), ekspresi cron, dan penanda waktu ISO.
  t151: Tugas cron berjalan dalam sesi agen yang benar-benar baru — prompt harus lengkap dan mandiri.
  t152: Mode suara dapat berjalan tanpa kunci API jika faster-whisper terpasang (pengenalan ucapan lokal gratis).
  t153: 'Ada lima penyedia TTS: Edge TTS (gratis), ElevenLabs, OpenAI, NeuTTS (lokal gratis), MiniMax.'
  t154: /voice on mengaktifkan mode suara di CLI. Ctrl+B mengubah perekaman tekan-untuk-bicara.
  t155: TTS streaming memutar kalimat saat dibuat — Anda tidak perlu menunggu seluruh balasan.
  t156: Pesan suara di Telegram, Discord, WhatsApp, dan Slack otomatis ditranskrip.
  t157: 'Hermes berjalan di 21 platform pesan: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, email, dan lainnya.'
  t158: hermes gateway install menyiapkannya sebagai layanan sistem yang dimulai saat boot.
  t159: DingTalk memakai Stream Mode — tidak memerlukan webhook atau URL publik.
  t160: BlueBubbles menghubungkan iMessage ke Hermes melalui server macOS lokal.
  t161: Rute webhook mendukung validasi HMAC, pembatasan laju, dan penyaringan peristiwa.
  t162: Server API menyediakan endpoint kompatibel OpenAI yang bekerja dengan Open WebUI dan LibreChat.
  t163: 'Mode kanal suara Discord: bot masuk VC, mentranskrip ucapan, lalu berbicara kembali.'
  t164: 'group_sessions_per_user: true memberi setiap orang sesi sendiri di percakapan grup.'
  t165: /sethome menjadikan percakapan sebagai kanal utama untuk pengiriman tugas cron.
  t166: Gateway mendukung batas waktu berdasarkan tidak adanya aktivitas — agen yang aktif dapat berjalan tanpa batas.
  t167: 'Izin perintah berbahaya memiliki 4 tingkat: sekali, sesi, selalu (daftar izin permanen), tolak.'
  t168: Mode izin cerdas memakai LLM untuk otomatis menyetujui perintah aman dan menandai yang berbahaya.
  t169: Perlindungan SSRF memblokir jaringan pribadi, loopback, link-local, dan alamat metadata cloud.
  t170: Pemindaian praeksekusi Tirith mendeteksi penyamaran URL homograf dan pola pipe ke interpreter.
  t171: Subproses MCP menerima lingkungan terfilter — hanya variabel sistem aman yang diteruskan.
  t172: Berkas konteks (.hermes.md, AGENTS.md) diperiksa untuk injeksi prompt sebelum dimuat.
  t173: command_allowlist di config.yaml memberi izin permanen untuk pola perintah shell tertentu.
  t174: Konteks otomatis dipadatkan saat mencapai ambang batas — memori disimpan dan riwayat diringkas.
  t175: Bilah status berubah menjadi kuning, lalu jingga, lalu merah saat konteks terisi.
  t176: SOUL.md adalah berkas identitas utama agen — sesuaikan untuk membentuk perilakunya.
  t177: Hermes memuat konteks proyek dari .hermes.md, AGENTS.md, CLAUDE.md, atau .cursorrules (yang pertama cocok).
  t178: Berkas AGENTS.md di subdirektori ditemukan bertahap saat agen menjelajahi folder.
  t179: Berkas konteks dibatasi 20.000 karakter dengan pemotongan cerdas pada awal/akhir.
  t180: 'Lima penyedia browser: Chromium lokal, Browserbase, Browser Use, Camofox, dan Firecrawl.'
  t181: Camofox adalah browser anti-deteksi — fork Firefox dengan pemalsuan sidik jari C++.
  t182: browser_navigate otomatis mengembalikan snapshot halaman — tidak perlu memanggil browser_snapshot setelahnya.
  t183: browser_vision dengan annotate=true menimpa label bernomor pada elemen interaktif.
  t184: hermes mcp membuka pemilih interaktif MCP yang disetujui Nous dan bisa dipasang dengan satu tombol.
  t185: hermes mcp catalog menampilkan daftar server MCP yang disetujui Nous dan disertakan di repo.
  t186: hermes mcp install <name> memasang entri katalog, meminta kredensial, dan membiarkan Anda memilih alat mana yang diaktifkan.
  t187: Server MCP dikonfigurasi di config.yaml — mendukung transport stdio maupun HTTP.
  t188: 'Penyaringan alat per server: tools.include sebagai whitelist dan tools.exclude sebagai blacklist untuk alat tertentu.'
  t189: Server MCP otomatis membuat toolset saat runtime — hermes tools dapat mengalihkannya per platform.
