  prompt_long:      "      Pilihan [s/i/a/T]:  "
  prompt_short:     "      Pilihan [s/i/T]:  "
  choose_smart_deny:  "      [s]ekali  |  [t]olak "
  prompt_smart_deny:  "      Pilihan [s/T]:  "
  smart_deny_once_inputs:  "s,sekali "
  smart_deny_deny_inputs:  "t,tolak "
  timeout:          "      ⏱ Timeout - menolak perintah "
  allowed_once:     "      ✓ Diizinkan sekali "
  allowed_session:  "      ✓ Diizinkan buat session ini "
  allowed_always:   "      ✓ Ditambahkan ke allowlist permanen "
  denied:           "      ✗ Ditolak "
  cancelled:        "      ✗ Dibatalkan "
