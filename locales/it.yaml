explainer:
  no_reply_prefix: "⚠️ Nessuna risposta: "
  empty_response: "{model} non ha prodotto una risposta questa volta, nemmeno dopo i tentativi ripetuti. Invia `continue` per riprovare, oppure cambia modello con /model."
  exit:
    all_retries_exhausted_no_response: "il provider del modello non ha risposto dopo tutti i tentativi. Invia /retry, oppure cambia modello con /model."
    partial_stream_recovery: "lo streaming si è interrotto in anticipo ed è stata recuperata solo una risposta parziale. Invia `continue` per riprendere dal punto in cui si è fermato."
    fallback_prior_turn_content: "in questo turno non è stato prodotto nuovo contenuto; viene mostrato il contesto precedente recuperato. Invia `continue` per riprovare."
    redirect_restart_limit_exceeded: "la richiesta è stata annullata da una nuova correzione a ogni tentativo, quindi il turno si è fermato invece di riprovare all'infinito. La tua ultima correzione è in coda come prossimo messaggio."
    rebuilt_restart_limit_exceeded: "ogni provider della catena di fallback ha continuato a cedere il passo al successivo, quindi il turno si è fermato invece di riprovare all'infinito. Invia `continue` oppure cambia provider."
    budget_exhausted: "il budget di iterazioni/costo per turno si è esaurito prima di una risposta finale. Invia `continue` per proseguire."
    ollama_runtime_context_too_small: "la finestra di contesto del modello locale era troppo piccola per finire. Aumenta la dimensione del contesto o usa un modello più grande."
    pending_tool_result: "il turno si è fermato mentre il risultato di uno strumento era ancora in attesa e il modello non ha prodotto altro testo. Invia `continue` per farglielo riassumere."
    interrupted_during_api_call: "la richiesta è stata interrotta a metà chiamata prima di ricevere una risposta. Invia `continue` per riprovare."
    max_iterations_reached: "è stato raggiunto il limite massimo di iterazioni degli strumenti prima di una risposta finale. Invia `continue` per proseguire, oppure aumenta `max_iterations`."
    error_near_max_iterations: "si è verificato un errore vicino al limite di iterazioni prima di una risposta finale. Controlla l'output dello strumento qui sopra, poi invia `continue`."
    repeated_outer_errors: "il turno ha continuato a fallire con errori ripetuti ed è stato fermato in anticipo invece di riprovare all'infinito. Controlla gli errori qui sopra, poi invia `continue` per riprovare."
  persistence:
    compression: "il turno è stato fermato perché un altro processo stava comprimendo questa sessione. Il tuo messaggio dovrebbe essere già salvato — invialo di nuovo al termine della compressione."
    compression_closed: "il turno è stato fermato perché questa sessione è stata ruotata dalla compressione del contesto e la sua continuazione attiva non ha potuto essere adottata. Lo storage è integro — aggiorna il client (o avvia un nuovo turno) così da usare il nuovo id di sessione, poi invia di nuovo il messaggio."
    turn_lease: "il turno è stato fermato perché un altro processo Hermes ha preso il controllo di questa sessione. La tua risposta non è stata salvata — attendi che l'altro processo finisca, poi invia di nuovo il messaggio."
    session_row_missing: "questa sessione è stata eliminata dallo storage mentre la chat era ancora aperta e Hermes non è riuscito a ricrearla, quindi questo messaggio non è stato salvato. Invia di nuovo il messaggio; se continua a fallire, esegui `hermes {profile_arg}doctor`."
    locked: "il turno è stato fermato perché lo storage della sessione era occupato (un altro processo Hermes stava scrivendo nel database di stato). Il tuo messaggio dovrebbe essere già salvato — invialo di nuovo tra un momento."
    replaced: "il file del database delle sessioni è stato sostituito mentre Hermes era in esecuzione, quindi questo messaggio non è stato salvato (una copia è conservata in {home}/sessions/). Ferma Hermes (`hermes {profile_arg}gateway stop`), esegui `hermes {profile_arg}doctor` — non `hermes {profile_arg}doctor --fix`, che riparerebbe il file sbagliato sul posto — poi riavvialo e invia di nuovo il messaggio. I passaggi di recupero avanzati sono nel log."
    deleted_wal: "un altro processo Hermes tiene ancora una vecchia copia del write-ahead log del database delle sessioni, quindi Hermes ha smesso di scrivere per proteggere il file e questo messaggio non è stato salvato (una copia è conservata in {home}/sessions/). Non è andato perso nulla. Chiudi ogni processo Hermes su questo profilo (app Desktop, `hermes {profile_arg}gateway stop`, dashboard, cron), esegui `hermes {profile_arg}doctor` — indica quale processo tiene ancora il log — poi riavvia Hermes e invia di nuovo il messaggio. Non eseguire `doctor --fix` né eliminare file state.db mentre sono in esecuzione. Guida: {recovery_docs}"
    corrupt: "il turno è stato fermato perché il database di stato ha segnalato una corruzione strutturale (la trascrizione sarebbe andata perduta al riavvio). Liberare spazio su disco non servirà. Opzioni di recupero:\n1. Esegui `hermes {profile_arg}doctor --fix`\n2. Ferma il gateway, poi recupera con:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (se segnala che è recuperabile) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — il recupero crea prima uno snapshot del file danneggiato; NON eseguire `sqlite3 ... \".recover\"` sullo state.db attivo, una CLI sqlite3 vulnerabile può corromperlo ulteriormente\n3. Ripristina da un backup in {backups_dir}/\nPoi invia di nuovo il messaggio."
    fts_index: "il turno è stato fermato perché l'indice di ricerca delle sessioni (FTS5) è corrotto e non ha potuto essere scollegato, quindi questo messaggio non è stato salvato. L'archivio dei messaggi non è danneggiato: non eseguire strumenti di recupero né ripristinare un backup. Esegui `hermes {profile_arg}doctor --fix` (o riavvia Hermes, che ripara l'indice all'apertura), poi invia di nuovo il messaggio."
    disk: "Hermes non è riuscito a salvare questa conversazione su disco, quindi si è fermato piuttosto che perdere i tuoi messaggi. Il disco è probabilmente pieno: libera spazio (o correggi i permessi su {home}/state.db), poi invia di nuovo il messaggio."
    default: "Hermes non è riuscito a salvare questa conversazione, quindi si è fermato piuttosto che perdere i tuoi messaggi. Cause possibili: il disco è pieno, oppure un altro processo Hermes sta tenendo occupato il database. Chiudi le altre finestre di Hermes, esegui `hermes {profile_arg}doctor` per controllare lo storage, poi invia di nuovo il messaggio."
  file_mutation:
    header: "⚠️ Verifica modifiche ai file: {count} modifiche FALLITE in questo turno, nonostante quanto il testo sopra possa far pensare. Esegui `git status` o `read_file` per confermare cosa è stato davvero applicato."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "non riuscito"
  shared:
    and_more: "  • … e altri {count}"
    the_model: "Il modello"
tips:
  t001: "/bg <prompt> esegue un'attività in una sessione separata mentre quella corrente resta libera; /btw <question> risponde a una domanda a margine su questa conversazione senza interromperla."
  t002: "/branch crea una diramazione della sessione corrente, così puoi esplorare una direzione diversa senza perdere i progressi."
  t003: "/compress comprime manualmente il contesto della conversazione quando diventa troppo lungo."
  t004: "/rollback elenca i checkpoint del filesystem: ripristina i file modificati dall'agente a qualsiasi stato precedente."
  t005: "/rollback diff 2 mostra in anteprima cosa è cambiato dal checkpoint 2 senza ripristinare nulla."
  t006: "/rollback 2 src/file.py ripristina un singolo file da un checkpoint specifico."
  t007: "/title \"mio progetto\" dà un nome alla sessione: riprendila più tardi con /resume o hermes -c."
  t008: "/resume riprende da dove avevi lasciato in una sessione a cui hai dato un nome in precedenza."
  t009: "/queue <prompt> mette in coda un messaggio per il turno successivo senza interrompere quello corrente."
  t010: "/undo rimuove dalla conversazione l'ultimo scambio utente/assistente."
  t011: "/retry reinvia il tuo ultimo messaggio: utile quando la risposta dell'agente non era proprio quella giusta."
  t012: "/verbose alterna la visualizzazione dell'avanzamento degli strumenti: off → new → all → verbose."
  t013: "/reasoning high aumenta la profondità di ragionamento del modello. /reasoning show mostra il ragionamento."
  t014: "/fast attiva o disattiva l'elaborazione prioritaria per risposte API più rapide (dipende dal provider)."
  t015: "/yolo salta tutte le richieste di approvazione per comandi pericolosi per il resto della sessione."
  t016: "/model ti permette di cambiare modello a metà sessione: prova /model sonnet o /model gpt-5."
  t017: "/model --global cambia in modo permanente il tuo modello predefinito."
  t018: "/personality pirate imposta una personalità divertente: 14 opzioni integrate, da kawaii a shakespeare."
  t019: "/skin cambia il tema della CLI: prova ares, mono, slate, poseidon o charizard."
  t020: "/statusbar attiva o disattiva una barra persistente che mostra modello, token, % di riempimento del contesto, costo e durata."
  t021: "/tools disable browser rimuove temporaneamente gli strumenti browser per la sessione corrente."
  t022: "/browser connect collega gli strumenti browser al tuo browser della famiglia Chromium già in esecuzione tramite CDP."
  t023: "/plugins elenca i plugin installati e il loro stato."
  t024: "/cron gestisce le attività pianificate: configura prompt ricorrenti con consegna su qualsiasi piattaforma."
  t025: "/reload-mcp ricarica a caldo la configurazione dei server MCP senza riavviare."
  t026: "/usage mostra l'utilizzo dei token, la ripartizione dei costi e la durata della sessione."
  t027: "/insights mostra le statistiche di utilizzo degli ultimi 30 giorni."
  t028: "/paste controlla se negli appunti c'è un'immagine e la allega al tuo prossimo messaggio."
  t029: "/profile mostra quale profilo è attivo e la sua directory home."
  t030: "/config mostra a colpo d'occhio la tua configurazione corrente."
  t031: "/stop termina tutti i processi in background avviati dall'agente."
  t032: "@file:path/to/file.py inserisce il contenuto del file direttamente nel tuo messaggio."
  t033: "@file:main.py:10-50 inserisce solo le righe 10-50 di un file."
  t034: "@folder:src/ inserisce l'elenco ad albero di una directory."
  t035: "@diff inserisce nel messaggio le tue modifiche git non ancora in stage."
  t036: "@staged inserisce le tue modifiche git in stage (git diff --staged)."
  t037: "@git:5 inserisce gli ultimi 5 commit con le patch complete."
  t038: "@url:https://example.com scarica e inserisce il contenuto di una pagina web."
  t039: "Digitando @ si attiva il completamento dei percorsi del filesystem: raggiungi qualsiasi file in modo interattivo."
  t040: "Combina più riferimenti: \"Rivedi @file:main.py e @file:test.py per verificarne la coerenza.\""
  t041: "Alt+Enter inserisce un a capo per l'input su più righe. (Windows Terminal intercetta Alt+Enter: usa Ctrl+Enter al suo posto.)"
  t042: "Ctrl+C interrompe l'agente. Premilo due volte entro 2 secondi per forzare l'uscita."
  t043: "Ctrl+Z sospende Hermes in background: esegui fg nella tua shell per riprenderlo."
  t044: "Tab accetta il testo suggerito in trasparenza o completa automaticamente i comandi slash."
  t045: "Digita un nuovo messaggio mentre l'agente sta lavorando per interromperlo e reindirizzarlo."
  t046: "Alt+V incolla un'immagine dagli appunti nella conversazione."
  t047: "Incollando 5 o più righe, il testo viene salvato automaticamente in un file e al suo posto viene inserito un riferimento compatto."
  t048: "hermes -c riprende la tua sessione CLI più recente. hermes -c \"nome progetto\" riprende in base al titolo."
  t049: "hermes -w crea un worktree git isolato: perfetto per flussi di lavoro con agenti in parallelo."
  t050: "hermes -w -q \"Fix issue #42\" combina l'isolamento del worktree con una query singola."
  t051: "hermes chat -t web,terminal abilita solo toolset specifici per una sessione mirata."
  t052: "hermes chat -s github-pr-workflow precarica una skill all'avvio."
  t053: "hermes chat -q \"query\" esegue una singola query non interattiva ed esce."
  t054: "hermes chat --max-turns 1000 sovrascrive il limite predefinito di 500 iterazioni per turno."
  t055: "hermes chat --checkpoints abilita gli snapshot del filesystem prima di ogni modifica distruttiva ai file."
  t056: "hermes --yolo ignora tutte le richieste di approvazione per comandi pericolosi per l'intera sessione."
  t057: "hermes chat --source telegram etichetta la sessione per filtrarla in hermes sessions list."
  t058: "hermes -p work chat esegue Hermes con un profilo specifico senza cambiare quello predefinito."
  t059: "hermes doctor --fix diagnostica e ripara automaticamente i problemi di configurazione e dipendenze."
  t060: "hermes dump produce un riepilogo compatto della tua installazione: ottimo per le segnalazioni di bug."
  t061: "hermes config set KEY VALUE indirizza automaticamente i segreti in .env e tutto il resto in config.yaml."
  t062: "hermes config edit apre config.yaml nel tuo editor predefinito."
  t063: "hermes config check cerca opzioni di configurazione mancanti o obsolete."
  t064: "hermes sessions browse apre un selettore interattivo di sessioni con ricerca."
  t065: "hermes sessions stats mostra il numero di sessioni per piattaforma e la dimensione del database."
  t066: "hermes sessions prune --older-than 30 elimina le sessioni vecchie."
  t067: "hermes skills search react --source skills-sh cerca nella directory pubblica skills.sh."
  t068: "hermes skills check controlla se le skill installate dall'hub hanno aggiornamenti upstream."
  t069: "hermes skills tap add myorg/skills-repo aggiunge una sorgente GitHub personalizzata per le skill."
  t070: "hermes skills snapshot export setup.json esporta la configurazione delle tue skill per backup o condivisione."
  t071: "hermes mcp add github --command npx aggiunge server MCP dalla riga di comando."
  t072: "hermes mcp serve esegue Hermes stesso come server MCP per altri agenti."
  t073: "hermes auth add ti permette di aggiungere più chiavi API per la rotazione del pool di credenziali."
  t074: "hermes completion bash >> ~/.bashrc abilita il completamento con Tab per tutti i comandi e i profili."
  t075: "hermes logs -f segue agent.log in tempo reale. --level WARNING --since 1h filtra l'output."
  t076: "hermes backup crea un backup zip dell'intera directory home di Hermes."
  t077: "hermes profile create coder crea un profilo isolato che diventa un comando a sé stante."
  t078: "hermes profile create work --clone copia la configurazione e le chiavi correnti in un nuovo profilo."
  t079: "hermes update sincronizza automaticamente le nuove skill integrate su TUTTI i profili."
  t080: "hermes gateway install configura Hermes come servizio di sistema (systemd/launchd)."
  t081: "hermes memory setup ti permette di configurare un provider di memoria esterno (Honcho, Mem0, ecc.)."
  t082: "hermes webhook subscribe crea route webhook basate su eventi con validazione HMAC."
  t083: "Risparmia: hermes tools disattiva gli strumenti inutilizzati, hermes skills config riduce le skill all'essenziale."
  t084: "/reasoning low o /reasoning minimal riduce la profondità di ragionamento sotto il valore predefinito (medium): risposte più rapide ed economiche."
  t085: "hermes models instrada visione, compressione e attività ausiliarie verso modelli più economici: taglia il costo dei token in background dell'85% o più senza declassare il tuo modello di chat principale."
  t086: "Imposta display.bell_on_complete: true in config.yaml per sentire un segnale acustico quando le attività lunghe terminano."
  t087: "Imposta display.streaming: true per vedere i token comparire in tempo reale mentre il modello li genera."
  t088: "Imposta display.show_reasoning: true per osservare la catena di ragionamento del modello."
  t089: "Imposta display.compact: true per ridurre gli spazi vuoti nell'output e avere informazioni più dense."
  t090: "Imposta display.busy_input_mode: queue per mettere in coda i messaggi invece di interrompere l'agente, oppure steer per iniettarli durante l'esecuzione tramite /steer."
  t091: "Imposta display.resume_display: minimal per saltare il riepilogo completo della conversazione alla ripresa della sessione."
  t092: "Imposta compression.threshold: 0.50 per controllare quando scatta la compressione automatica (predefinito: 50% del contesto)."
  t093: "Imposta agent.max_turns: 1000 per consentire all'agente più passaggi di chiamata agli strumenti per turno."
  t094: "Imposta file_read_max_chars: 200000 per aumentare il contenuto massimo per ogni chiamata a read_file."
  t095: "Imposta approvals.mode: smart per lasciare che un LLM approvi automaticamente i comandi sicuri e neghi quelli pericolosi."
  t096: "Imposta fallback_model in config.yaml per passare automaticamente a un provider di riserva in caso di errore."
  t097: "Imposta privacy.redact_pii: true per trasformare in hash ID utente e numeri di telefono prima di inviarli all'LLM."
  t098: "Imposta browser.record_sessions: true per registrare automaticamente le sessioni del browser come video WebM."
  t099: "Imposta worktree: true in config.yaml per creare sempre un worktree git (equivale a hermes -w)."
  t100: "Imposta security.website_blocklist.enabled: true per bloccare domini specifici negli strumenti web."
  t101: "Imposta cron.wrap_response: false per consegnare l'output grezzo dell'agente senza intestazione e piè di pagina del cron."
  t102: "HERMES_TIMEZONE sostituisce il fuso orario del server con qualsiasi stringa di fuso orario IANA."
  t103: "La sostituzione delle variabili d'ambiente funziona in config.yaml: usa la sintassi ${VAR_NAME}."
  t104: "I comandi rapidi in config.yaml eseguono comandi shell all'istante senza consumare token."
  t105: "Puoi definire personalità personalizzate in config.yaml sotto agent.personalities."
  t106: "provider_routing controlla l'ordinamento, la whitelist e la blacklist dei provider di OpenRouter."
  t107: "execute_code esegue script Python che chiamano gli strumenti di Hermes in modo programmatico: i risultati restano fuori dal contesto."
  t108: "delegate_task avvia fino a 10 subagenti concorrenti per impostazione predefinita (delegation.max_concurrent_children) con contesti isolati per il lavoro in parallelo."
  t109: "web_extract funziona anche con URL di PDF: passagli qualsiasi link a un PDF e lo converte in markdown."
  t110: "search_files si basa su ripgrep ed è più veloce di grep: usalo al posto di grep nel terminale."
  t111: "patch usa 9 strategie di corrispondenza fuzzy, così piccole differenze di spaziatura non rompono le modifiche."
  t112: "patch supporta il formato V4A per modifiche in blocco su più file in una singola chiamata."
  t113: "read_file suggerisce nomi di file simili quando un file non viene trovato."
  t114: "read_file deduplica automaticamente: rileggere un file invariato restituisce solo un breve segnaposto."
  t115: "browser_vision acquisisce uno screenshot e lo analizza con l'AI: funziona con CAPTCHA e contenuti visivi."
  t116: "browser_console può valutare espressioni JavaScript nel contesto della pagina."
  t117: "image_generate crea immagini con FLUX 2 Pro e upscaling automatico 2x."
  t118: "text_to_speech converte il testo in audio: su Telegram viene riprodotto come messaggio vocale."
  t119: "send_message può raggiungere qualsiasi piattaforma di messaggistica connessa dall'interno di una sessione."
  t120: "Lo strumento todo aiuta l'agente a tenere traccia di attività complesse in più passaggi durante una sessione."
  t121: "session_search esegue una ricerca full-text in TUTTE le conversazioni passate."
  t122: "L'agente salva automaticamente in memoria preferenze, correzioni e informazioni sull'ambiente."
  t123: "/moa instrada un singolo prompt difficile attraverso il set di modelli Mixture of Agents che hai configurato."
  t124: "I comandi del terminale supportano la modalità in background con notify_on_complete per le attività di lunga durata."
  t125: "I processi in background del terminale supportano watch_patterns per avvisarti su righe di output specifiche."
  t126: "Lo strumento terminal supporta 6 backend: local, Docker, SSH, Modal, Daytona e Singularity."
  t127: "Ogni profilo ha la propria configurazione, chiavi API, memoria, sessioni, skill e job cron."
  t128: "I nomi dei profili diventano comandi shell: 'hermes profile create coder' crea il comando 'coder'."
  t129: "hermes profile export coder -o backup.tar.gz crea un archivio portabile del profilo."
  t130: "Se due profili condividono per errore lo stesso token del bot, il secondo gateway viene bloccato con un errore chiaro."
  t131: "Le sessioni generano automaticamente titoli descrittivi dopo il primo scambio: non serve assegnare nomi a mano."
  t132: "I titoli delle sessioni supportano la discendenza: \"mio progetto\" → \"mio progetto #2\" → \"mio progetto #3\"."
  t133: "All'uscita, Hermes stampa un comando per riprendere con l'ID della sessione e le statistiche."
  t134: "hermes sessions export backup.jsonl esporta tutte le sessioni per backup o analisi."
  t135: "hermes -r SESSION_ID riprende una specifica sessione passata tramite il suo ID."
  t136: "La memoria è uno snapshot congelato: le modifiche compaiono nel prompt di sistema solo all'avvio della sessione successiva."
  t137: "Le voci di memoria vengono controllate automaticamente alla ricerca di pattern di prompt injection ed esfiltrazione."
  t138: "L'agente ha due archivi di memoria: note personali (~2200 caratteri) e profilo utente (~1375 caratteri)."
  t139: "Le correzioni che dai all'agente (\"no, fallo così\") vengono spesso salvate automaticamente in memoria."
  t140: "Oltre 80 skill integrate che coprono github, creatività, mlops, produttività, ricerca e altro ancora."
  t141: "Ogni skill installata diventa automaticamente un comando slash: digita / per vederle tutte."
  t142: "hermes skills install official/security/1password installa skill opzionali dal repository."
  t143: "Le skill possono limitarsi a sistemi operativi specifici: alcune si caricano solo su macOS o Linux."
  t144: "skills.external_dirs in config.yaml ti permette di caricare skill da directory personalizzate."
  t145: "L'agente può creare le proprie skill come memoria procedurale usando skill_manage."
  t146: "/plan scrive un piano di implementazione in markdown in .hermes/plans/ senza eseguire nulla."
  t147: "I job cron possono includere skill: hermes cron add --skill blogwatcher \"Check for new posts\"."
  t148: "Le destinazioni di consegna del cron includono telegram, discord, slack, email, sms e più di 12 altre piattaforme."
  t149: "Se una risposta del cron inizia con [SILENT], la consegna viene soppressa: utile per i job di solo monitoraggio."
  t150: "Il cron supporta ritardi relativi (30m), intervalli (every 2h), espressioni cron e timestamp ISO."
  t151: "I job cron vengono eseguiti in sessioni agente completamente nuove: i prompt devono essere autosufficienti."
  t152: "La modalità voce funziona senza alcuna chiave API se faster-whisper è installato (riconoscimento vocale locale gratuito)."
  t153: "Cinque provider TTS disponibili: Edge TTS (gratuito), ElevenLabs, OpenAI, NeuTTS (locale gratuito), MiniMax."
  t154: "/voice on abilita la modalità voce nella CLI. Ctrl+B attiva o disattiva la registrazione push-to-talk."
  t155: "Il TTS in streaming riproduce le frasi man mano che vengono generate: non devi aspettare la risposta completa."
  t156: "I messaggi vocali su Telegram, Discord, WhatsApp e Slack vengono trascritti automaticamente."
  t157: "Hermes funziona su 21 piattaforme di messaggistica: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, email e altre."
  t158: "hermes gateway install lo configura come servizio di sistema che si avvia al boot."
  t159: "DingTalk usa la Stream Mode: non servono webhook né URL pubblici."
  t160: "BlueBubbles porta iMessage in Hermes tramite un server macOS locale."
  t161: "Le route webhook supportano validazione HMAC, limitazione della frequenza e filtraggio degli eventi."
  t162: "Il server API espone un endpoint compatibile con OpenAI, utilizzabile con Open WebUI e LibreChat."
  t163: "Modalità canale vocale di Discord: il bot entra nel canale vocale, trascrive il parlato e risponde a voce."
  t164: "group_sessions_per_user: true assegna a ogni persona una sessione propria nelle chat di gruppo."
  t165: "/sethome contrassegna una chat come canale principale per le consegne dei job cron."
  t166: "Il gateway supporta timeout basati sull'inattività: gli agenti attivi possono lavorare senza limiti di tempo."
  t167: "L'approvazione dei comandi pericolosi ha 4 livelli: una volta, sessione, sempre (allowlist permanente), nega."
  t168: "La modalità di approvazione smart usa un LLM per approvare automaticamente i comandi sicuri e segnalare quelli pericolosi."
  t169: "La protezione SSRF blocca reti private, loopback, link-local e indirizzi dei metadati cloud."
  t170: "La scansione pre-esecuzione di Tirith rileva lo spoofing di URL con omoglifi e i pattern pipe-verso-interprete."
  t171: "I sottoprocessi MCP ricevono un ambiente filtrato: passano solo le variabili di sistema sicure."
  t172: "I file di contesto (.hermes.md, AGENTS.md) vengono controllati per prompt injection prima del caricamento."
  t173: "command_allowlist in config.yaml approva in modo permanente pattern specifici di comandi shell."
  t174: "Il contesto viene compresso automaticamente al raggiungimento della soglia: le memorie vengono salvate e la cronologia riassunta."
  t175: "La barra di stato diventa gialla, poi arancione, poi rossa man mano che il contesto si riempie."
  t176: "SOUL.md è il file di identità principale dell'agente: personalizzalo per modellarne il comportamento."
  t177: "Hermes carica il contesto del progetto da .hermes.md, AGENTS.md, CLAUDE.md o .cursorrules (prima corrispondenza)."
  t178: "I file AGENTS.md nelle sottodirectory vengono scoperti progressivamente man mano che l'agente entra nelle cartelle."
  t179: "I file di contesto sono limitati a 20.000 caratteri con troncamento intelligente di testa e coda."
  t180: "Cinque provider browser: Chromium locale, Browserbase, Browser Use, Camofox e Firecrawl."
  t181: "Camofox è un browser anti-rilevamento: un fork di Firefox con spoofing delle impronte digitali in C++."
  t182: "browser_navigate restituisce automaticamente uno snapshot della pagina: non serve chiamare browser_snapshot subito dopo."
  t183: "browser_vision con annotate=true sovrappone etichette numerate agli elementi interattivi."
  t184: "hermes mcp apre un selettore interattivo di MCP approvati da Nous che puoi installare con un solo tasto."
  t185: "hermes mcp catalog elenca i server MCP approvati da Nous inclusi nel repository."
  t186: "hermes mcp install <name> installa una voce del catalogo, chiede le credenziali e ti lascia scegliere quali dei suoi strumenti abilitare."
  t187: "I server MCP si configurano in config.yaml: sono supportati sia il trasporto stdio sia quello HTTP."
  t188: "Filtro degli strumenti per server: tools.include mette in whitelist e tools.exclude mette in blacklist strumenti specifici."
  t189: "I server MCP generano automaticamente toolset a runtime: hermes tools può attivarli o disattivarli per piattaforma."
  t190: "Supporto OAuth per MCP: auth: oauth abilita l'autorizzazione tramite browser con PKCE."
  t191: "I checkpoint non hanno alcun overhead quando nessun file viene modificato — sono attivi per impostazione predefinita."
  t192: "Uno snapshot pre-rollback viene salvato automaticamente, così puoi annullare l'annullamento."
  t193: "/rollback annulla anche il turno di conversazione, quindi l'agente non ricorda le modifiche ripristinate."
  t194: "I checkpoint usano repository shadow in ~/.hermes/checkpoints/ — il .git del tuo progetto non viene mai toccato."
  t195: "batch_runner.py elabora centinaia di prompt in parallelo per generare dati di addestramento."
  t196: "hermes chat -Q attiva la modalità silenziosa per l'uso programmatico — nasconde banner e spinner."
  t197: "Il salvataggio delle traiettorie (--save-trajectories) cattura tracce complete dell'uso degli strumenti per l'addestramento dei modelli."
  t198: "Tre tipi di plugin: generali (strumenti/hook), provider di memoria e motori di contesto."
  t199: "hermes plugins install owner/repo installa i plugin direttamente da GitHub."
  t200: "Provider di memoria esterni: Honcho, OpenViking e Mem0 sono inclusi; Hindsight e altri tramite hermes plugins install."
  t201: "Gli hook dei plugin includono pre/post_tool_call, pre/post_llm_call e transform_terminal_output per la canonicalizzazione dell'output."
  t202: "Il prompt caching (Anthropic) riduce i costi riutilizzando i prefissi del prompt di sistema in cache."
  t203: "L'agente genera automaticamente i titoli delle sessioni in un thread in background — nessun impatto sulla latenza."
  t204: "Il routing intelligente dei modelli può indirizzare automaticamente le richieste semplici a un modello più economico."
  t205: "I comandi slash supportano la corrispondenza per prefisso: /h corrisponde a /help, /mod a /model."
  t206: "Trascinare il percorso di un file nel terminale allega automaticamente le immagini o lo invia come contesto."
  t207: ".worktreeinclude nella radice del repository elenca i file ignorati da git da copiare nei worktree."
  t208: "hermes acp esegue Hermes come server ACP per l'integrazione con VS Code, Zed e JetBrains."
  t209: "Provider personalizzati: salva endpoint con nome in config.yaml sotto custom_providers."
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT inietta un prompt di sistema che non viene mai salvato nella cronologia."
  t211: "credential_pool_strategies supporta le rotazioni fill_first, round_robin, least_used e random."
  t212: "hermes auth add nous oppure hermes auth add openai-codex configura i provider basati su OAuth."
  t213: "Il server API supporta sia la Chat Completions API sia la Responses API con stato lato server."
  t214: "tool_preview_length: 0 nella configurazione mostra i percorsi completi dei file nel feed di attività dello spinner."
  t215: "hermes status --deep esegue controlli diagnostici più approfonditi su tutti i componenti."
  t216: "I job cron possono allegare uno script Python (--script) il cui stdout viene iniettato nel prompt come contesto."
  t217: "Gli script cron vivono in ~/.hermes/scripts/ e vengono eseguiti prima dell'agente — perfetti per pipeline di raccolta dati."
  t218: "prefill_messages_file in config.yaml inietta esempi few-shot in ogni chiamata API, senza mai salvarli nella cronologia."
  t219: "SOUL.md sostituisce completamente l'identità predefinita dell'agente — riscrivilo per rendere Hermes davvero tuo."
  t220: "SOUL.md viene inizializzato con una personalità predefinita al primo avvio. Modificalo per personalizzarlo."
  t221: "/compress <focus topic> destina il 60-70% del budget del riepilogo al tuo argomento e taglia con decisione il resto."
  t222: "Dalla seconda compressione in poi, il compressore aggiorna il riepilogo precedente invece di ripartire da zero."
  t223: "Prima di un reset della sessione gateway, Hermes salva automaticamente in memoria i fatti importanti, in background."
  t224: "network.force_ipv4: true in config.yaml risolve i blocchi sui server con IPv6 difettoso — applica un monkey-patch a socket."
  t225: "Lo strumento terminal annota i codici di uscita comuni: grep che restituisce 1 = 'Nessuna corrispondenza (non è un errore)'."
  t226: "I comandi terminal in foreground non riusciti vengono ritentati automaticamente fino a 3 volte con backoff esponenziale (2s, 4s, 8s)."
  t227: "I comandi sudo semplici vengono riscritti automaticamente per ricevere SUDO_PASSWORD da .env tramite pipe — nessun prompt interattivo."
  t228: "Gli helper di execute_code richiedono import espliciti: from hermes_tools import json_parse, shell_quote, retry."
  t229: "I 7 strumenti sandbox di execute_code (web_search, terminal, read/write/search/patch) usano RPC — non entrano mai nel contesto."
  t230: "Leggere la stessa regione di un file 3 o più volte genera un avviso. Dalla quarta volta viene bloccato per prevenire i loop."
  t231: "write_file e patch rilevano se un file è stato modificato dall'esterno dopo l'ultima lettura e avvisano che è obsoleto."
  t232: "Il formato patch V4A supporta le direttive Add File, Delete File e Move File — non solo Update."
  t233: "I server MCP possono richiedere completamenti LLM tramite sampling — l'agente diventa uno strumento per il server."
  t234: "I server MCP inviano notifications/tools/list_changed per attivare la ri-registrazione automatica degli strumenti senza riavvio."
  t235: "delegate_task con acp_command: 'claude' avvia Claude Code come agente figlio da qualsiasi piattaforma."
  t236: "La delega ha un thread heartbeat — l'attività del figlio si propaga al genitore, evitando i timeout del gateway."
  t237: "Quando un provider restituisce HTTP 402 (pagamento richiesto), il client ausiliario passa automaticamente al successivo."
  t238: "agent.tool_use_enforcement indirizza i modelli che descrivono le azioni invece di chiamare gli strumenti — automatico per GPT/Codex."
  t239: "agent.restart_after_turn_timeout lascia terminare i turni in corso prima che /restart entri in stop(); restart_drain_timeout è solo il budget per l'interruzione forzata una volta iniziato stop()."
  t240: "agent.api_max_retries (predefinito 3) controlla quante volte l'agente ritenta una chiamata API fallita prima di mostrare l'errore — abbassalo per un fallback rapido."
  t241: "Il gateway mette in cache le istanze AIAgent per sessione — distruggere questa cache rompe il prompt caching di Anthropic."
  t242: "Qualsiasi sito web può esporre skill tramite /.well-known/skills/index.json — l'hub delle skill le scopre automaticamente."
  t243: "Il log di audit delle skill in ~/.hermes/skills/.hub/audit.log traccia ogni operazione di installazione e rimozione."
  t244: "I worktree git obsoleti vengono puliti automaticamente all'avvio: gli alberi puliti e completamente uniti vengono rimossi; il lavoro non committato o non pushato viene sempre preservato."
  t245: "I profili delimitano lo stato di Hermes tramite HERMES_HOME; i sottoprocessi degli strumenti host mantengono la tua HOME reale a meno che terminal.home_mode sia profile."
  t246: "La variabile d'ambiente HERMES_HOME_MODE (ottale, es. 0701) imposta permessi di directory personalizzati per l'attraversamento da parte del server web."
  t247: "Modalità container: metti .container-mode in HERMES_HOME e la CLI host passa automaticamente in esecuzione nel container."
  t248: "Ctrl+C ha 5 livelli di priorità: annulla registrazione → annulla prompt → annulla selettore → interrompi agente → esci."
  t249: "Ogni interruzione durante l'esecuzione dell'agente viene registrata in ~/.hermes/interrupt_debug.log con timestamp."
  t250: "BROWSER_CDP_URL collega gli strumenti browser a qualsiasi browser della famiglia Chromium in esecuzione — accetta WebSocket, HTTP o host:port."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true attiva l'anti-rilevamento avanzato con Chromium personalizzato (piano Scale)."
  t252: "La CLI passa automaticamente alla modalità compatta nei terminali più stretti di 80 colonne."
  t253: "I comandi rapidi supportano due tipi: exec (esegue direttamente un comando shell) e alias (reindirizza a un altro comando)."
  t254: "Modello di delega per attività: delegation.model e delegation.provider nella configurazione indirizzano i subagenti a modelli più economici."
  t255: "delegation.reasoning_effort controlla in modo indipendente la profondità di ragionamento dei subagenti."
  t256: "display.platforms in config.yaml consente override di visualizzazione per piattaforma: {telegram: {tool_progress: all}}."
  t257: "human_delay.mode nella configurazione simula la velocità di digitazione umana — intervallo min_ms/max_ms configurabile."
  t258: "Le migrazioni di versione della configurazione avvengono automaticamente al caricamento — le nuove chiavi compaiono senza intervento manuale."
  t259: "I modelli GPT e Codex ricevono indicazioni speciali nel prompt di sistema per la disciplina e l'uso obbligatorio degli strumenti."
  t260: "I modelli Gemini ricevono direttive su misura per percorsi assoluti, chiamate parallele agli strumenti e comandi non interattivi."
  t261: "context.engine in config.yaml può essere impostato al nome di un plugin per strategie alternative di gestione del contesto."
  t262: "Gli snapshot delle pagine browser oltre i 15.000 caratteri vengono troncati o riassunti automaticamente; lo snapshot completo viene salvato in cache/web per la lettura paginata con read_file."
  t263: "Il compressore esegue una pre-passata economica: gli output degli strumenti oltre i 200 caratteri vengono sostituiti da segnaposto prima di eseguire l'LLM."
  t264: "Quando la compressione fallisce, i tentativi successivi vengono sospesi per 10 minuti per non martellare l'API."
  t265: "I comandi pericolosi lunghi (>70 caratteri) hanno un'opzione 'view' nel prompt di approvazione per vedere prima il testo completo."
  t266: "La visualizzazione del livello audio mostra le barre ▁▂▃▄▅▆▇ durante la registrazione vocale in base ai livelli RMS del microfono."
  t267: "I nomi dei profili non possono coincidere con binari presenti nel PATH — 'hermes profile create ls' verrebbe rifiutato."
  t268: "hermes profile create backup --clone-all copia tutto (configurazione, chiavi, SOUL.md, memorie, skill, sessioni)."
  t269: "Il tasto di registrazione vocale è configurabile tramite voice.record_key in config.yaml — non solo Ctrl+B."
  t270: "I file .cursorrules e .cursor/rules/*.mdc vengono rilevati e caricati automaticamente come contesto del progetto."
  t271: "I file di contesto supportano oltre 10 pattern di prompt injection — Unicode invisibile, 'ignore instructions', tentativi di esfiltrazione."
  t272: "GPT-5 e Codex usano il ruolo 'developer' invece di 'system' nel formato dei messaggi."
  t273: "Override ausiliari per attività: auxiliary.vision.provider, auxiliary.compression.model, ecc. in config.yaml."
  t274: "Il client ausiliario tratta 'main' come alias di provider — si risolve nel tuo provider primario + modello effettivi."
  t275: "hermes claw migrate --dry-run mostra in anteprima la migrazione da OpenClaw senza scrivere nulla."
  t276: "I percorsi di file incollati con virgolette o spazi con escape vengono gestiti automaticamente — nessuna pulizia manuale."
  t277: "I comandi slash non attivano mai il collasso degli incolla lunghi — /command con argomenti grandi funziona correttamente."
  t278: "In modalità interrupt, i comandi slash digitati durante l'esecuzione dell'agente saltano la logica di interruzione e vengono eseguiti subito."
  t279: "HERMES_DEV=1 salta il rilevamento della modalità container per lo sviluppo locale."
  t280: "Ogni server MCP ha il proprio toolset (mcp-servername) che può essere attivato o disattivato indipendentemente tramite hermes tools."
  t281: "I segnaposto MCP ${ENV_VAR} nella configurazione vengono risolti all'avvio del server — incluse le variabili da ~/.hermes/.env."
  t282: "Le skill da repository fidati (NousResearch) hanno il livello di sicurezza 'trusted'; le skill della community ricevono scansioni aggiuntive."
  t283: "La quarantena delle skill in ~/.hermes/skills/.hub/quarantine/ contiene le skill in attesa di revisione di sicurezza."
  t284: "/steer <prompt> inietta una nota dopo la prossima chiamata a uno strumento — correggi la direzione a metà attività senza interrompere."
  t285: "/goal <text> imposta un obiettivo permanente in stile Ralph-loop — Hermes continua automaticamente turno dopo turno finché un giudice non dichiara fatto."
  t286: "/snapshot create [label] salva uno snapshot completo dello stato della configurazione di Hermes; /snapshot restore <id> lo ripristina in seguito."
  t287: "/copy [N] copia l'ultima risposta dell'assistente negli appunti, oppure l'N-esima dalla fine indicando un numero."
  t288: "/redraw forza un ridisegno completo dell'interfaccia, correggendo lo sfasamento del terminale dopo un ridimensionamento in tmux o artefatti da selezione col mouse."
  t289: "/agents (alias /tasks) mostra gli agenti attivi e le attività in background in esecuzione nella sessione corrente."
  t290: "/footer attiva o disattiva il footer del gateway sulle risposte finali, con modello, % di contesto e cwd."
  t291: "/busy queue|steer|interrupt controlla cosa fa la pressione di Enter mentre Hermes sta lavorando."
  t292: "/topic nei DM di Telegram attiva la modalità argomenti multi-sessione gestita dall'utente — /topic <id> ripristina inline le sessioni passate."
  t293: "/approve session|always esegue un comando pericoloso in attesa con l'ambito di fiducia scelto; /deny lo rifiuta."
  t294: "/restart riavvia il gateway in modo controllato dopo aver lasciato terminare le esecuzioni attive, poi avvisa chi l'ha richiesto quando è di nuovo attivo."
  t295: "/kanban boards switch <slug> cambia la board Kanban multi-progetto attiva direttamente dalla chat."
  t296: "/reload ricarica ~/.hermes/.env nella sessione in esecuzione — recupera nuove chiavi API senza riavviare."
  t297: "cronjob con no_agent=True esegue uno script a orario e invia direttamente il suo stdout — zero token, zero LLM."
  t298: "Uno stdout vuoto dello script cron significa tick silenzioso — non viene consegnato nulla, perfetto per watchdog a soglia."
  t299: "HERMES_CRON_MAX_PARALLEL (predefinito 4) limita quanti job cron girano per tick, così i picchi non saturano le tue chiavi."
  t300: "Gli hook del gateway vivono in ~/.hermes/hooks/<name>/ con HOOK.yaml + handler.py — l'handler deve chiamarsi `handle`."
  t301: "Gli eventi hook includono gateway:startup, session:start, agent:step e le sottoscrizioni con wildcard command:*."
  t302: "Metti una checklist in ~/.hermes/BOOT.md e un hook gateway:startup la esegue come agente one-shot a ogni avvio."
  t303: "hermes curator run --dry-run mostra in anteprima cosa il curatore archivierebbe o consoliderebbe senza modificare nulla."
  t304: "hermes curator pin <skill> protegge una skill sia dall'archiviazione automatica sia dallo strumento skill_manage dell'agente."
  t305: "hermes curator rollback ripristina le skill da uno snapshot pre-esecuzione — i backup stanno in skills/.curator_backups/."
  t306: "hermes auth reset <provider> [target] azzera cooldown e flag di esaurimento su un intero pool di credenziali, o su una sola credenziale per indice, id o etichetta."
  t307: "credential_pool_strategies.<provider>: round_robin alterna le chiavi in modo uniforme invece del fill_first predefinito."
  t308: "use_gateway: true per strumento instrada web, image, tts o browser attraverso il tuo abbonamento Nous — nessuna chiave extra."
  t309: "provider_routing.data_collection: deny esclude su OpenRouter i provider che conservano i dati."
  t310: "provider_routing.require_parameters: true instrada solo verso provider che supportano ogni parametro della tua richiesta."
  t311: "HERMES_TUI_RESUME=1 si ricollega automaticamente alla sessione TUI più recente all'avvio — comodo dopo una caduta SSH."
  t312: "HERMES_TUI_THEME=light|dark|<hex> forza il tema della TUI sui terminali che non impostano COLORFGBG."
  t313: "Ctrl+G o Ctrl+X Ctrl+E nella TUI apre il buffer di input in $EDITOR per prompt lunghi su più righe."
  t314: "La TUI rende LaTeX inline — $E=mc^2$ diventa matematica Unicode invece di TeX grezzo."
  t315: "hermes dashboard avvia un'interfaccia web locale su 127.0.0.1:9119 — nessun dato lascia localhost."
  t316: "hermes dashboard incorpora la TUI completa di Hermes nel browser tramite xterm.js e una PTY WebSocket."
  t317: "Metti un YAML in ~/.hermes/dashboard-themes/ con due colori di palette per cambiare l'aspetto dell'intera dashboard."
  t318: "I plugin della dashboard sono drop-in: manifest.json + bundle JS in ~/.hermes/dashboard-plugins/ — nessuna build npm richiesta."
  t319: "layoutVariant: cockpit in un tema della dashboard aggiunge una barra laterale sinistra di 260px che i plugin possono popolare tramite lo slot sidebar."
  t320: "display.tool_progress_command: true espone /verbose sulle piattaforme di messaggistica; per impostazione predefinita è solo CLI."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result avvisa solo quando le attività in background terminano (rispetto a concise/all/error/off)."
  t322: "HERMES_WRITE_SAFE_ROOT limita write_file/patch a prefissi di directory; più percorsi tramite os.pathsep (: o ;)."
  t323: "HERMES_IGNORE_RULES salta l'iniezione automatica di AGENTS.md, SOUL.md, .cursorrules, memoria e skill precaricate."
  t324: "HERMES_ACCEPT_HOOKS approva automaticamente gli hook shell mai visti dichiarati in config.yaml senza un prompt TTY."
  t325: "auxiliary.goal_judge.model instrada il giudice di /goal a un modello economico e veloce per tenere il costo del loop vicino a zero."
  t326: "I checkpoint saltano le directory con più di 50.000 file per evitare operazioni git lente su monorepo enormi."
  t327: "tts.provider: piper esegue un TTS locale su CPU in 44 lingue — le voci si scaricano automaticamente in ~/.hermes/cache/piper-voices/."
  t328: "tts.providers.<name>.type: command collega qualsiasi motore TTS a riga di comando con i segnaposto {input_path} e {output_path}."
  t329: "API_SERVER_ENABLED=true esegue un endpoint compatibile OpenAI accanto al gateway per Open WebUI e LibreChat."
  t330: "GATEWAY_PROXY_URL esegue una configurazione divisa: I/O delle piattaforme in locale, lavoro dell'agente delegato a un server API remoto."
  t331: "MATRIX_DEVICE_ID fissa un ID dispositivo stabile per E2EE — senza di esso le chiavi ruotano a ogni avvio e la decifratura dello storico si rompe."
  t332: "TELEGRAM_WEBHOOK_SECRET è obbligatorio ogni volta che TELEGRAM_WEBHOOK_URL è impostato — generalo con openssl rand -hex 32."
  t333: "batch_runner.py --resume riconosce i prompt completati in base al testo, così i riordini del dataset non rieseguono il lavoro già fatto."
  t334: "/new avvia una nuova sessione sul posto (alias /reset) — nuovo ID di sessione, cronologia pulita, la CLI resta aperta."
  t335: "/clear pulisce lo schermo del terminale E avvia una nuova sessione — una sola scorciatoia per un reset visivo."
  t336: "/history stampa la conversazione corrente inline senza uscire dalla CLI — utile per una rilettura veloce."
  t337: "/save scrive la conversazione corrente su disco senza terminare la sessione."
  t338: "/status mostra le informazioni della sessione a colpo d'occhio: ID, titolo, modello, utilizzo dei token e tempo trascorso."
  t339: "/image <path> allega un file immagine locale al tuo prossimo prompt senza incollare o trascinare."
  t340: "/platforms mostra lo stato di connessione del gateway e delle piattaforme di messaggistica direttamente dalla chat."
  t341: "/commands mostra paginato l'elenco completo dei comandi slash e delle skill installate — utile sulle piattaforme senza completamento con Tab."
  t342: "/toolsets elenca tutti i toolset disponibili, così sai cosa accetta -t/--toolsets."
  t343: "/voice tts attiva o disattiva la modalità solo TTS — l'agente risponde a voce ma tu continui a digitare i prompt."
  t344: "/reload-skills riesamina ~/.hermes/skills/ così le skill aggiunte a mano compaiono senza riavviare la sessione."
  t345: "/indicator kaomoji|emoji|unicode|ascii sceglie lo stile dell'indicatore di attività della TUI mostrato durante le esecuzioni dell'agente."
  t346: "/debug carica un bundle di supporto (info di sistema + log) e restituisce link condivisibili — funziona anche in chat."
  t347: "hermes -z \"<prompt>\" è il one-shot più puro: risposta finale su stdout e nient'altro — ideale per le pipe negli script."
  t348: "hermes chat --pass-session-id inietta l'ID di sessione nel prompt di sistema così l'agente può farvi riferimento."
  t349: "hermes chat --image path/to/pic.png allega un'immagine locale a una singola query -q senza un passaggio di upload separato."
  t350: "hermes chat --ignore-user-config salta la configurazione utente attiva — segnalazioni di bug riproducibili ed esecuzioni CI."
  t351: "hermes chat --source tool contrassegna le chat programmatiche così non intasano hermes sessions list."
  t352: "hermes dump --show-keys include le impronte oscurate delle chiavi API per un debug di supporto più approfondito."
  t353: "hermes sessions rename <ID> \"new title\" rinomina qualsiasi sessione passata; hermes sessions delete <ID> ne elimina una."
  t354: "hermes import ripristina un backup zip completo di Hermes; le esportazioni JSON/JSONL delle sessioni si importano dalla pagina Sessions della dashboard."
  t355: "hermes fallback gestisce la catena fallback_model in modo interattivo — niente modifiche a mano a config.yaml."
  t356: "hermes pairing ruota il token di pairing dei DM — il primo che scrive dopo la rotazione ottiene l'accesso al bot."
  t357: "hermes setup guida i nuovi utenti nella configurazione di provider, chiavi e piattaforme in un unico flusso interattivo."
  t358: "hermes status --deep esegue il controllo di salute completo su ogni componente; hermes status semplice è la vista rapida."
  t359: "HERMES_AGENT_TIMEOUT=0 disattiva la terminazione per inattività del gateway per un agente in esecuzione — utile per lunghe sessioni di ricerca."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 carica automaticamente i plugin locali del repository da ./.hermes/plugins/ — protetti da un controllo di fiducia per design."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 disattiva la protezione 'file modificato dopo la lettura' su patch e write_file."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true consente agli strumenti web di raggiungere localhost e reti private — disattivato per impostazione predefinita in modalità gateway."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 installa automaticamente skill extra del catalogo opzionale al primo avvio di ogni profilo."
  t364: "HERMES_BUNDLED_SKILLS punta a un albero personalizzato di skill incluse — usato dal packaging Homebrew e Nix."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 scarica su stdout il payload di ogni richiesta API invece che nei file di log."
  t366: "HERMES_OAUTH_TRACE=1 registra, oscurati, gli scambi e i tentativi di refresh del token OAuth per il debug dell'autenticazione dei provider."
  t367: "HERMES_STREAM_RETRIES (predefinito 3) controlla i tentativi di riconnessione a metà stream in caso di errori di rete transitori."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false silenzia i messaggi di conferma ⚡/⏳/⏩ quando un utente scrive a un agente occupato."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (predefinito 180s) imposta ogni quanto il gateway invia aggiornamenti di avanzamento sui turni lunghi."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (predefinito 900s) limita quanto /restart attende le esecuzioni in corso prima di forzare."
  t371: "HERMES_CHECKPOINT_TIMEOUT (predefinito 30s) limita il tempo di creazione dei checkpoint del filesystem — aumentalo su monorepo enormi."
  t372: "image_gen.model in config.yaml sceglie il modello FAL: flux-2/klein, gpt-image-2, nano-banana-pro e altri."
  t373: "image_gen.provider instrada la generazione di immagini attraverso un plugin (OpenAI Images, Codex, FAL) invece del predefinito."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY puntano l'analisi visiva a qualsiasi endpoint compatibile OpenAI."
  t375: "security.tirith_fail_open: false fa sì che Hermes blocchi i comandi quando lo scanner tirith stesso va in errore."
  t376: "La variabile d'ambiente TIRITH_FAIL_OPEN sovrascrive la configurazione tirith_fail_open — un interruttore rapido senza modificare config.yaml."
  t377: "Le chat --source tool sono escluse da hermes sessions list per impostazione predefinita — imposta --source esplicitamente per vederle."
  t378: "Gli ID di sessione hanno un prefisso timestamp (20250305_091523_abcd), così l'ordinamento funziona naturalmente in ls e jq."
  t379: "API_SERVER_MODEL_NAME personalizza il nome del modello su /v1/models — essenziale per configurazioni Open WebUI multi-profilo."
  t380: "I plugin della dashboard vengono serviti da /dashboard-plugins/<name>/ — metti i file in ~/.hermes/dashboard-plugins/."
  placeholder:
    p01: "Chiedi qualsiasi cosa, o digita / per i comandi…"
    p02: "Riassumi cosa c'è in questa cartella"
