    max_iterations_reached: "最終回答の前に、ツールイテレーションの上限に達しました。`continue` を送信して続行するか、`max_iterations` を引き上げてください。"
    error_near_max_iterations: "最終回答の前、イテレーション上限の付近でエラーが発生しました。上のツール出力を確認してから、`continue` を送信してください。"
    repeated_outer_errors: "繰り返しエラーでターンが失敗し続けたため、無限に再試行せずに早期停止しました。上のエラーを確認してから、`continue` を送信して再試行してください。"
  persistence:
    compression: "別のプロセスがこのセッションを圧縮中だったため、ターンを停止しました。メッセージはすでに保存されているはずです — 圧縮が完了してからもう一度送信してください。"
    compression_closed: "このセッションがコンテキスト圧縮によってローテーションされ、その継続セッションを引き継げなかったため、ターンを停止しました。ストレージ自体は正常です — クライアントを更新（または新しいターンを開始）して新しいセッション ID を反映させてから、メッセージをもう一度送信してください。"
    turn_lease: "別の Hermes プロセスがこのセッションを引き継いだため、ターンを停止しました。返信は保存されていません — もう一方のプロセスが終了するのを待ってから、メッセージをもう一度送信してください。"
    session_row_missing: "チャットを開いている間にこのセッションがストレージから削除され、Hermes が再作成できなかったため、このメッセージは保存されていません。メッセージをもう一度送信してください。失敗が続く場合は `hermes {profile_arg}doctor` を実行してください。"
    locked: "セッションストレージが使用中だったため（別の Hermes プロセスが状態データベースに書き込み中）、ターンを停止しました。メッセージはすでに保存されているはずです — 少し待ってからもう一度送信してください。"
    replaced: "Hermes の実行中にセッションデータベースファイルが置き換えられたため、このメッセージは保存されていません（コピーは {home}/sessions/ に保持されています）。Hermes を停止（`hermes {profile_arg}gateway stop`）し、`hermes {profile_arg}doctor` を実行してください — `hermes {profile_arg}doctor --fix` は誤ったファイルをその場で修復してしまうため使わないでください — その後 Hermes を再起動し、メッセージをもう一度送信してください。高度な復旧手順はログに記載されています。"
    deleted_wal: "別の Hermes プロセスがセッションデータベースの write-ahead log の古いコピーをまだ保持しているため、ファイルを保護するために Hermes は書き込みを停止し、このメッセージは保存されていません（コピーは {home}/sessions/ に保持されています）。データは失われていません。このプロファイルのすべての Hermes プロセス（Desktop アプリ、`hermes {profile_arg}gateway stop`、ダッシュボード、cron）を終了し、`hermes {profile_arg}doctor` を実行してください — ログを保持しているプロセスが表示されます — その後 Hermes を再起動し、メッセージをもう一度送信してください。プロセスの実行中に `doctor --fix` を実行したり state.db ファイルを削除したりしないでください。ガイド: {recovery_docs}"
    corrupt: "状態データベースが構造的な破損を報告したため（再起動時に会話記録が失われるおそれがありました）、ターンを停止しました。ディスク容量を空けても解決しません。復旧の選択肢:\n1. `hermes {profile_arg}doctor --fix` を実行する\n2. ゲートウェイを停止し、次のコマンドで復旧する:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   （復旧可能と報告された場合）hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — 復旧処理は先に破損ファイルのスナップショットを取ります。稼働中の state.db に対して `sqlite3 ... \".recover\"` を実行しないでください。脆弱な sqlite3 CLI はさらに破損させる可能性があります\n3. {backups_dir}/ のバックアップから復元する\nその後、メッセージをもう一度送信してください。"
    fts_index: "セッション検索インデックス（FTS5）が破損しており切り離せなかったため、ターンを停止し、このメッセージは保存されていません。メッセージストア自体は損傷していません。復旧ツールの実行やバックアップからの復元は行わないでください。`hermes {profile_arg}doctor --fix` を実行（または Hermes を再起動すると起動時にインデックスが修復されます）してから、メッセージをもう一度送信してください。"
    disk: "Hermes はこの会話をディスクに保存できなかったため、メッセージを失わないよう停止しました。ディスクが満杯の可能性があります。空き容量を確保（または {home}/state.db の権限を修正）してから、メッセージをもう一度送信してください。"
    default: "Hermes はこの会話を保存できなかったため、メッセージを失わないよう停止しました。考えられる原因: ドライブの空き容量不足、または別の Hermes プロセスがデータベースを保持している。他の Hermes ウィンドウを閉じ、`hermes {profile_arg}doctor` でストレージを確認してから、メッセージをもう一度送信してください。"
  file_mutation:
    header: "⚠️ ファイル変更検証: 上の文面がどう示していようと、このターンで {count} 件のファイル編集が失敗しました。`git status` または `read_file` を実行して、実際に反映された内容を確認してください。"
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "失敗"
  shared:
    and_more: "  • … 他 {count} 件"
    the_model: "モデル"
tips:
  t001: "/bg <prompt> は現在のセッションを空けたまま別セッションでタスクを実行します。/btw <question> は会話を中断せずに、この会話に関する補足の質問に答えます。"
  t002: "/branch は現在のセッションを分岐させ、進捗を失わずに別の方向を試せるようにします。"
  t003: "/compress は会話が長くなったときに、コンテキストを手動で圧縮します。"
  t004: "/rollback はファイルシステムのチェックポイント一覧を表示します。エージェントが変更したファイルを以前の任意の状態に復元できます。"
  t005: "/rollback diff 2 は何も復元せずに、チェックポイント 2 以降の変更内容をプレビューします。"
  t006: "/rollback 2 src/file.py は特定のチェックポイントから単一のファイルを復元します。"
  t007: "/title \"my project\" でセッションに名前を付けられます。あとで /resume または hermes -c で再開できます。"
  t008: "/resume は以前に名前を付けたセッションの続きから再開します。"
  t009: "/queue <prompt> は現在のターンを中断せずに、次のターン用にメッセージをキューに入れます。"
  t010: "/undo は会話から直前のユーザーとアシスタントのやり取りを削除します。"
  t011: "/retry は直前のメッセージを再送信します。エージェントの応答がいまひとつだったときに便利です。"
  t012: "/verbose はツールの進捗表示を off → new → all → verbose の順に切り替えます。"
  t013: "/reasoning high はモデルの思考の深さを上げます。/reasoning show は推論内容を表示します。"
  t014: "/fast は API 応答を高速化する優先処理のオン/オフを切り替えます（プロバイダーによります）。"
  t015: "/yolo はセッションの残りの間、危険なコマンドの承認プロンプトをすべてスキップします。"
  t016: "/model でセッション中にモデルを切り替えられます。/model sonnet や /model gpt-5 を試してみてください。"
  t017: "/model --global はデフォルトのモデルを恒久的に変更します。"
  t018: "/personality pirate で楽しいパーソナリティを設定できます。kawaii から shakespeare まで 14 種類の組み込みオプションがあります。"
  t019: "/skin は CLI のテーマを変更します。ares、mono、slate、poseidon、charizard を試してみてください。"
  t020: "/statusbar はモデル、トークン、コンテキスト使用率 %、コスト、経過時間を表示する常設バーのオン/オフを切り替えます。"
  t021: "/tools disable browser は現在のセッションの間だけ、ブラウザツールを一時的に外します。"
  t022: "/browser connect は CDP 経由で、起動中の Chromium 系ブラウザにブラウザツールを接続します。"
  t023: "/plugins はインストール済みのプラグインとその状態を一覧表示します。"
  t024: "/cron はスケジュールされたタスクを管理します。任意のプラットフォームへ配信する定期プロンプトを設定できます。"
  t025: "/reload-mcp は再起動せずに MCP サーバー設定をホットリロードします。"
  t026: "/usage はトークン使用量、コストの内訳、セッションの経過時間を表示します。"
  t027: "/insights は過去 30 日間の使用状況の分析を表示します。"
  t028: "/paste はクリップボードに画像があるか確認し、次のメッセージに添付します。"
  t029: "/profile はどのプロファイルが有効か、およびそのホームディレクトリを表示します。"
  t030: "/config は現在の設定をひと目で確認できます。"
  t031: "/stop はエージェントが起動した実行中のバックグラウンドプロセスをすべて終了します。"
  t032: "@file:path/to/file.py はファイルの内容をメッセージに直接挿入します。"
  t033: "@file:main.py:10-50 はファイルの 10〜50 行目だけを挿入します。"
  t034: "@folder:src/ はディレクトリツリーの一覧を挿入します。"
  t035: "@diff はステージされていない git の変更をメッセージに挿入します。"
  t036: "@staged はステージ済みの git の変更（git diff --staged）を挿入します。"
  t037: "@git:5 は直近 5 件のコミットを完全なパッチ付きで挿入します。"
  t038: "@url:https://example.com は Web ページを取得して、その内容を挿入します。"
  t039: "@ を入力するとファイルシステムのパス補完が起動し、任意のファイルへ対話的に移動できます。"
  t040: "複数の参照を組み合わせられます: \"Review @file:main.py and @file:test.py for consistency.\""
  t041: "Alt+Enter で改行を挿入して複数行を入力できます。（Windows Terminal は Alt+Enter を横取りするため、代わりに Ctrl+Enter を使ってください。）"
  t042: "Ctrl+C はエージェントを中断します。2 秒以内に 2 回押すと強制終了します。"
  t043: "Ctrl+Z は Hermes をバックグラウンドにサスペンドします。シェルで fg を実行すると再開できます。"
  t044: "Tab は自動サジェストのゴーストテキストを確定するか、スラッシュコマンドを補完します。"
  t045: "エージェントの作業中に新しいメッセージを入力すると、中断して方向を変えられます。"
  t046: "Alt+V はクリップボードの画像を会話に貼り付けます。"
  t047: "5 行以上を貼り付けると自動的にファイルに保存され、代わりにコンパクトな参照が挿入されます。"
  t048: "hermes -c は直近の CLI セッションを再開します。hermes -c \"project name\" はタイトルで再開します。"
  t049: "hermes -w は隔離された git worktree を作成します。並列のエージェントワークフローに最適です。"
  t050: "hermes -w -q \"Fix issue #42\" は worktree による隔離と単発クエリを組み合わせます。"
  t051: "hermes chat -t web,terminal は特定のツールセットだけを有効にして、目的を絞ったセッションを開始します。"
  t052: "hermes chat -s github-pr-workflow は起動時にスキルを事前読み込みします。"
  t053: "hermes chat -q \"query\" は非対話のクエリを 1 回実行して終了します。"
  t054: "hermes chat --max-turns 1000 はターンあたりデフォルト 500 回の反復上限を上書きします。"
  t055: "hermes chat --checkpoints は破壊的なファイル変更のたびに、事前にファイルシステムのスナップショットを取ります。"
  t056: "hermes --yolo はセッション全体で危険なコマンドの承認プロンプトをすべてバイパスします。"
  t057: "hermes chat --source telegram はセッションにタグを付け、hermes sessions list で絞り込めるようにします。"
  t058: "hermes -p work chat はデフォルトを変えずに、特定のプロファイルで実行します。"
  t059: "hermes doctor --fix は設定と依存関係の問題を診断し、自動で修復します。"
  t060: "hermes dump はセットアップの要約をコンパクトに出力します。バグ報告に最適です。"
  t061: "hermes config set KEY VALUE はシークレットを .env に、それ以外を config.yaml に自動で振り分けます。"
  t062: "hermes config edit はデフォルトのエディターで config.yaml を開きます。"
  t063: "hermes config check は不足している設定項目や古くなった設定項目をスキャンします。"
  t064: "hermes sessions browse は検索付きの対話型セッションピッカーを開きます。"
  t065: "hermes sessions stats はプラットフォーム別のセッション数とデータベースのサイズを表示します。"
  t066: "hermes sessions prune --older-than 30 は古いセッションを整理します。"
  t067: "hermes skills search react --source skills-sh は skills.sh の公開ディレクトリを検索します。"
  t068: "hermes skills check はインストール済みのハブスキルに上流の更新がないかスキャンします。"
  t069: "hermes skills tap add myorg/skills-repo はカスタムの GitHub スキルソースを追加します。"
  t070: "hermes skills snapshot export setup.json はバックアップや共有のためにスキル設定をエクスポートします。"
  t071: "hermes mcp add github --command npx はコマンドラインから MCP サーバーを追加します。"
  t072: "hermes mcp serve は Hermes 自体を他のエージェント向けの MCP サーバーとして実行します。"
  t073: "hermes auth add で認証情報プールのローテーション用に複数の API キーを追加できます。"
  t074: "hermes completion bash >> ~/.bashrc はすべてのコマンドとプロファイルの Tab 補完を有効にします。"
  t075: "hermes logs -f は agent.log をリアルタイムで追跡します。--level WARNING --since 1h で出力を絞り込めます。"
  t076: "hermes backup は Hermes のホームディレクトリ全体の zip バックアップを作成します。"
  t077: "hermes profile create coder は隔離されたプロファイルを作成し、それ自体が独立したコマンドになります。"
  t078: "hermes profile create work --clone は現在の設定とキーを新しいプロファイルにコピーします。"
  t079: "hermes update は新しい同梱スキルをすべてのプロファイルに自動で同期します。"
  t080: "hermes gateway install は Hermes をシステムサービス（systemd/launchd）として設定します。"
  t081: "hermes memory setup で外部メモリプロバイダー（Honcho、Mem0 など）を設定できます。"
  t082: "hermes webhook subscribe は HMAC 検証付きのイベント駆動 Webhook ルートを作成します。"
  t083: "コスト削減: hermes tools で未使用のツールを無効化し、hermes skills config でスキルを絞り込めます。"
  t084: "/reasoning low または /reasoning minimal は思考の深さをデフォルト（medium）より下げ、応答をより速く安価にします。"
  t085: "hermes models はビジョン、圧縮、補助タスクを安価なモデルに振り分けます。メインのチャットモデルを落とさずに、バックグラウンドのトークンコストを 85% 以上削減できます。"
  t086: "config.yaml で display.bell_on_complete: true を設定すると、長いタスクの完了時にベルが鳴ります。"
  t087: "display.streaming: true を設定すると、モデルの生成に合わせてトークンがリアルタイムで表示されます。"
  t088: "display.show_reasoning: true を設定すると、モデルの思考の連鎖（chain-of-thought）を確認できます。"
  t089: "display.compact: true を設定すると出力の空白が減り、より密度の高い情報表示になります。"
  t090: "display.busy_input_mode: queue を設定するとエージェントを中断せずにメッセージをキューに入れ、steer を設定すると /steer 経由で実行中に注入します。"
  t091: "display.resume_display: minimal を設定すると、セッション再開時の会話全体の振り返り表示をスキップします。"
  t092: "compression.threshold: 0.50 を設定して、自動圧縮が発動するタイミングを制御できます（デフォルト: コンテキストの 50%）。"
  t093: "agent.max_turns: 1000 を設定すると、エージェントがターンあたりに実行できるツール呼び出しのステップ数が増えます。"
  t094: "file_read_max_chars: 200000 を設定すると、read_file 呼び出し 1 回あたりの最大コンテンツ量が増えます。"
  t095: "approvals.mode: smart を設定すると、LLM が安全なコマンドを自動承認し、危険なコマンドを自動拒否します。"
  t096: "config.yaml で fallback_model を設定すると、バックアップのプロバイダーへ自動でフェイルオーバーします。"
  t097: "privacy.redact_pii: true を設定すると、LLM に送信する前にユーザー ID と電話番号をハッシュ化します。"
  t098: "browser.record_sessions: true を設定すると、ブラウザセッションを WebM 動画として自動録画します。"
  t099: "config.yaml で worktree: true を設定すると、常に git worktree を作成します（hermes -w と同じ）。"
  t100: "security.website_blocklist.enabled: true を設定すると、Web ツールから特定のドメインをブロックします。"
  t101: "cron.wrap_response: false を設定すると、cron のヘッダー/フッターなしでエージェントの生の出力を配信します。"
  t102: "HERMES_TIMEZONE は任意の IANA タイムゾーン文字列でサーバーのタイムゾーンを上書きします。"
  t103: "config.yaml では環境変数の展開が使えます。${VAR_NAME} 構文を使ってください。"
  t104: "config.yaml のクイックコマンドは、トークンを一切消費せずにシェルコマンドを即座に実行します。"
  t105: "カスタムのパーソナリティは config.yaml の agent.personalities 以下で定義できます。"
  t106: "provider_routing は OpenRouter のプロバイダーの並び順、ホワイトリスト、ブラックリストを制御します。"
  t107: "execute_code は Hermes のツールをプログラムから呼び出す Python スクリプトを実行します。結果はコンテキストに入りません。"
  t108: "delegate_task はデフォルトで最大 10 個のサブエージェント（delegation.max_concurrent_children）を同時に起動し、隔離されたコンテキストで並列作業を行います。"
  t109: "web_extract は PDF の URL にも対応しています。PDF のリンクを渡すと Markdown に変換します。"
  t110: "search_files は ripgrep ベースで grep より高速です。ターミナルの grep の代わりに使ってください。"
  t111: "patch は 9 種類のあいまい一致戦略を使うため、わずかな空白の違いで編集が失敗することはありません。"
  t112: "patch は V4A 形式に対応しており、1 回の呼び出しで複数ファイルを一括編集できます。"
  t113: "read_file はファイルが見つからないときに、似た名前のファイルを提案します。"
  t114: "read_file は自動で重複を排除します。変更のないファイルを再読み込みすると軽量なスタブを返します。"
  t115: "browser_vision はスクリーンショットを撮って AI で分析します。CAPTCHA や視覚的なコンテンツにも使えます。"
  t116: "browser_console はページのコンテキストで JavaScript 式を評価できます。"
  t117: "image_generate は FLUX 2 Pro で画像を生成し、自動で 2 倍にアップスケールします。"
  t118: "text_to_speech はテキストを音声に変換します。Telegram では音声バブルとして再生されます。"
  t119: "send_message はセッション内から、接続済みの任意のメッセージングプラットフォームに送信できます。"
  t120: "todo ツールは、セッション中にエージェントが複雑な複数ステップのタスクを追跡するのに役立ちます。"
  t121: "session_search は過去のすべての会話を対象に全文検索を行います。"
  t122: "エージェントは好み、修正内容、環境に関する事実を自動的にメモリへ保存します。"
  t123: "/moa は難しいプロンプト 1 つを、設定済みの Mixture of Agents モデルセットに通します。"
  t124: "ターミナルコマンドは長時間タスク向けに、notify_on_complete 付きのバックグラウンドモードに対応しています。"
  t125: "ターミナルのバックグラウンドプロセスは watch_patterns に対応しており、特定の出力行で通知できます。"
  t126: "terminal ツールは local、Docker、SSH、Modal、Daytona、Singularity の 6 つのバックエンドに対応しています。"
  t127: "各プロファイルは独自の設定、API キー、メモリ、セッション、スキル、cron ジョブを持ちます。"
  t128: "プロファイル名はシェルコマンドになります。'hermes profile create coder' で 'coder' コマンドが作られます。"
  t129: "hermes profile export coder -o backup.tar.gz は持ち運び可能なプロファイルのアーカイブを作成します。"
  t130: "2 つのプロファイルが誤って同じボットトークンを共有した場合、2 つ目のゲートウェイは明確なエラーでブロックされます。"
  t131: "セッションは最初のやり取りのあとに説明的なタイトルを自動生成するため、手動で名前を付ける必要はありません。"
  t132: "セッションタイトルは系譜に対応しています: \"my project\" → \"my project #2\" → \"my project #3\"。"
  t133: "終了時に Hermes はセッション ID と統計情報を含む再開コマンドを表示します。"
  t134: "hermes sessions export backup.jsonl はバックアップや分析のためにすべてのセッションをエクスポートします。"
  t135: "hermes -r SESSION_ID は ID を指定して過去の任意のセッションを再開します。"
  t136: "メモリは固定されたスナップショットです。変更は次のセッション開始時にのみシステムプロンプトに反映されます。"
  t137: "メモリの項目は、プロンプトインジェクションや情報流出のパターンがないか自動的にスキャンされます。"
  t138: "エージェントには 2 つのメモリストアがあります: 個人メモ（約 2200 文字）とユーザープロファイル（約 1375 文字）です。"
  t139: "エージェントへの修正指示（\"いや、こうやって\"など）は、多くの場合メモリに自動保存されます。"
  t140: "github、creative、mlops、productivity、research など、80 を超えるスキルが同梱されています。"
  t141: "インストール済みのスキルはすべて自動的にスラッシュコマンドになります。/ を入力すると一覧を確認できます。"
  t142: "hermes skills install official/security/1password はリポジトリからオプションのスキルをインストールします。"
  t143: "スキルは特定の OS プラットフォームに限定できます。macOS または Linux でのみ読み込まれるスキルもあります。"
  t144: "config.yaml の skills.external_dirs で、カスタムディレクトリからスキルを読み込めます。"
  t145: "エージェントは skill_manage を使って、手続き的メモリとして独自のスキルを作成できます。"
  t146: "/plan は何も実行せずに、Markdown の実装計画を .hermes/plans/ に書き出します。"
  t147: "cron ジョブにはスキルを付けられます: hermes cron add --skill blogwatcher \"Check for new posts\"。"
  t148: "cron の配信先には telegram、discord、slack、email、sms のほか 12 以上のプラットフォームがあります。"
  t149: "cron の応答が [SILENT] で始まる場合、配信は抑制されます。監視専用のジョブに便利です。"
  t150: "cron は相対的な遅延（30m）、間隔（every 2h）、cron 式、ISO タイムスタンプに対応しています。"
  t151: "cron ジョブは完全に新しいエージェントセッションで実行されるため、プロンプトはそれ単体で完結している必要があります。"
  t152: "faster-whisper がインストールされていれば、音声モードは API キーなしで動作します（無料のローカル音声認識）。"
  t153: "TTS プロバイダーは 5 つ利用できます: Edge TTS（無料）、ElevenLabs、OpenAI、NeuTTS（無料・ローカル）、MiniMax。"
  t154: "/voice on は CLI で音声モードを有効にします。Ctrl+B でプッシュトゥトーク録音を切り替えます。"
  t155: "ストリーミング TTS は文が生成されるそばから再生するため、応答全体を待つ必要がありません。"
  t156: "Telegram、Discord、WhatsApp、Slack の音声メッセージは自動的に文字起こしされます。"
  t157: "Hermes は Telegram、Discord、Slack、WhatsApp、Signal、Matrix、IRC、Microsoft Teams、メールなど 21 のメッセージングプラットフォームで動作します。"
  t158: "hermes gateway install は起動時に自動で開始するシステムサービスとして設定します。"
  t159: "DingTalk は Stream Mode を使うため、Webhook や公開 URL は不要です。"
  t160: "BlueBubbles はローカルの macOS サーバー経由で iMessage を Hermes に接続します。"
  t161: "Webhook ルートは HMAC 検証、レート制限、イベントフィルタリングに対応しています。"
  t162: "API サーバーは Open WebUI や LibreChat と互換性のある OpenAI 互換エンドポイントを公開します。"
  t163: "Discord のボイスチャンネルモード: ボットが VC に参加し、発話を文字起こしして音声で返答します。"
  t164: "group_sessions_per_user: true を設定すると、グループチャットで各メンバーに専用のセッションが割り当てられます。"
  t165: "/sethome はチャットを cron ジョブ配信のホームチャンネルとして設定します。"
  t166: "ゲートウェイは非アクティブ状態に基づくタイムアウトに対応しているため、稼働中のエージェントは無期限に実行できます。"
  t167: "危険なコマンドの承認には 4 段階あります: once、session、always（恒久的な許可リスト）、deny。"
  t168: "スマート承認モードは LLM を使って安全なコマンドを自動承認し、危険なコマンドにフラグを立てます。"
  t169: "SSRF 保護はプライベートネットワーク、ループバック、リンクローカル、クラウドメタデータのアドレスをブロックします。"
  t170: "Tirith の実行前スキャンは、ホモグラフによる URL 偽装やパイプからインタープリターへ渡すパターンを検出します。"
  t171: "MCP のサブプロセスにはフィルタリングされた環境変数が渡されます。安全なシステム変数だけが通過します。"
  t172: "コンテキストファイル（.hermes.md、AGENTS.md）は読み込み前にプロンプトインジェクションのセキュリティスキャンを受けます。"
  t173: "config.yaml の command_allowlist は特定のシェルコマンドパターンを恒久的に承認します。"
  t174: "コンテキストがしきい値に達すると自動的に圧縮されます。メモリが書き出され、履歴が要約されます。"
  t175: "ステータスバーはコンテキストが埋まるにつれて黄、橙、赤の順に色が変わります。"
  t176: "SOUL.md はエージェントの主要なアイデンティティファイルです。カスタマイズして振る舞いを形作れます。"
  t177: "Hermes は .hermes.md、AGENTS.md、CLAUDE.md、.cursorrules（最初に見つかったもの）からプロジェクトのコンテキストを読み込みます。"
  t178: "サブディレクトリの AGENTS.md ファイルは、エージェントがフォルダーに入るにつれて段階的に検出されます。"
  t179: "コンテキストファイルは 20,000 文字が上限で、先頭と末尾を残すスマートな切り詰めが行われます。"
  t180: "ブラウザプロバイダーは 5 つあります: ローカルの Chromium、Browserbase、Browser Use、Camofox、Firecrawl。"
  t181: "Camofox は検出回避型のブラウザです。C++ によるフィンガープリント偽装を備えた Firefox のフォークです。"
  t182: "browser_navigate は自動的にページのスナップショットを返すため、あとから browser_snapshot を呼ぶ必要はありません。"
  t183: "browser_vision に annotate=true を指定すると、操作可能な要素に番号付きラベルを重ねて表示します。"
  t184: "hermes mcp は Nous 承認済み MCP の対話型ピッカーを開き、キー 1 つでインストールできます。"
  t185: "hermes mcp catalog はリポジトリに同梱されている Nous 承認済みの MCP サーバーを一覧表示します。"
  t186: "hermes mcp install <name> はカタログの項目をインストールし、認証情報の入力を求め、有効にするツールを選択させてくれます。"
  t187: "MCP サーバーは config.yaml で設定します。stdio と HTTP の両方のトランスポートに対応しています。"
  t188: "サーバーごとのツールフィルタリング: tools.include で特定のツールをホワイトリストに、tools.exclude でブラックリストに登録します。"
  t189: "MCP サーバーは実行時にツールセットを自動生成します。hermes tools でプラットフォームごとにオン/オフを切り替えられます。"
  t190: "MCP の OAuth 対応: auth: oauth を設定すると、PKCE を使ったブラウザベースの認可が有効になります。"
  t191: "チェックポイントはファイルが変更されない限りオーバーヘッドがゼロで、デフォルトで有効です。"
  t192: "ロールバック前のスナップショットが自動保存されるため、取り消しをさらに取り消せます。"
  t193: "/rollback は会話のターンも取り消すため、エージェントはロールバックされた変更を覚えていません。"
  t194: "チェックポイントは ~/.hermes/checkpoints/ 内のシャドウリポジトリを使います。プロジェクトの .git には一切触れません。"
  t195: "batch_runner.py は学習データ生成のために数百のプロンプトを並列処理します。"
  t196: "hermes chat -Q はプログラムからの利用向けにクワイエットモードを有効にし、バナーとスピナーを表示しません。"
  t197: "トラジェクトリ保存（--save-trajectories）は、モデル学習用にツール使用の完全なトレースを記録します。"
  t198: "プラグインには 3 種類あります。汎用（ツール/フック）、メモリプロバイダー、コンテキストエンジンです。"
  t199: "hermes plugins install owner/repo で GitHub から直接プラグインをインストールできます。"
  t200: "外部メモリプロバイダーとして OpenViking、Mem0 が同梱されており、Honcho、Hindsight などは hermes plugins install で追加できます。"
  t201: "プラグインフックには pre/post_tool_call、pre/post_llm_call、出力の正規化用の transform_terminal_output などがあります。"
  t202: "プロンプトキャッシュ（Anthropic）は、キャッシュ済みのシステムプロンプトのプレフィックスを再利用してコストを削減します。"
  t203: "エージェントはセッションタイトルをバックグラウンドスレッドで自動生成するため、レイテンシへの影響はゼロです。"
  t204: "スマートなモデルルーティングにより、簡単な質問を自動的に安価なモデルへ振り分けられます。"
  t205: "スラッシュコマンドは前方一致に対応しています。/h は /help に、/mod は /model に解決されます。"
  t206: "ファイルパスをターミナルにドラッグすると、画像は自動的に添付され、それ以外はコンテキストとして送信されます。"
  t207: "リポジトリのルートに置いた .worktreeinclude に、ワークツリーへコピーする gitignore 済みファイルを列挙できます。"
  t208: "hermes acp は Hermes を ACP サーバーとして起動し、VS Code、Zed、JetBrains と連携できます。"
  t209: "カスタムプロバイダー: config.yaml の custom_providers に名前付きエンドポイントを保存できます。"
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT は、履歴に一切保存されないシステムプロンプトを注入します。"
  t211: "credential_pool_strategies は fill_first、round_robin、least_used、random のローテーションに対応しています。"
  t212: "hermes auth add nous または hermes auth add openai-codex で、OAuth ベースのプロバイダーを設定できます。"
  t213: "API サーバーは Chat Completions と、サーバー側で状態を保持する Responses API の両方に対応しています。"
  t214: "設定で tool_preview_length: 0 にすると、スピナーのアクティビティ表示にファイルパスが省略なしで表示されます。"
  t215: "hermes status --deep は、すべてのコンポーネントに対してより詳しい診断チェックを実行します。"
  t216: "cron ジョブには Python スクリプト（--script）を添付でき、その標準出力がコンテキストとしてプロンプトに注入されます。"
  t217: "cron スクリプトは ~/.hermes/scripts/ に置かれ、エージェントより先に実行されます。データ収集パイプラインに最適です。"
  t218: "config.yaml の prefill_messages_file は、すべての API 呼び出しに few-shot の例を注入します。履歴には保存されません。"
  t219: "SOUL.md はエージェントのデフォルトのアイデンティティを完全に置き換えます。書き換えて Hermes を自分のものにしましょう。"
  t220: "SOUL.md は初回実行時にデフォルトのパーソナリティで自動生成されます。編集してカスタマイズしてください。"
  t221: "/compress <focus topic> は要約予算の 60〜70% を指定したトピックに割り当て、残りを大胆に切り詰めます。"
  t222: "2 回目以降の圧縮では、圧縮エンジンはゼロからやり直すのではなく前回の要約を更新します。"
  t223: "ゲートウェイセッションのリセット前に、Hermes は重要な事実をバックグラウンドで自動的にメモリへ書き出します。"
  t224: "config.yaml で network.force_ipv4: true にすると、IPv6 が壊れたサーバーでのハングを修正します（socket をモンキーパッチします）。"
  t225: "terminal ツールは一般的な終了コードに注釈を付けます。例: grep が 1 を返した場合は「一致なし（エラーではありません）」。"
  t226: "失敗したフォアグラウンドのターミナルコマンドは、指数バックオフ（2 秒、4 秒、8 秒）で最大 3 回自動再試行されます。"
  t227: "単独の sudo コマンドは .env の SUDO_PASSWORD をパイプする形に自動書き換えされるため、対話的なプロンプトは不要です。"
  t228: "execute_code のヘルパーは明示的なインポートが必要です: from hermes_tools import json_parse, shell_quote, retry。"
  t229: "execute_code の 7 つのサンドボックスツール（web_search、terminal、read/write/search/patch）は RPC を使い、コンテキストには一切入りません。"
  t230: "同じファイル領域を 3 回以上読むと警告が出ます。4 回以上ではループ防止のため強制的にブロックされます。"
  t231: "write_file と patch は、最後に読んだ後にファイルが外部で変更されていないかを検出し、古くなっている場合は警告します。"
  t232: "V4A パッチ形式は Update だけでなく、Add File、Delete File、Move File のディレクティブにも対応しています。"
  t233: "MCP サーバーはサンプリングによって LLM の補完を逆に要求できます。エージェントがサーバーのツールになるわけです。"
  t234: "MCP サーバーが notifications/tools/list_changed を送ると、再起動なしでツールが自動的に再登録されます。"
  t235: "delegate_task に acp_command: 'claude' を指定すると、どのプラットフォームからでも Claude Code を子エージェントとして起動できます。"
  t236: "委譲にはハートビートスレッドがあり、子の活動が親に伝わるため、ゲートウェイのタイムアウトを防げます。"
  t237: "プロバイダーが HTTP 402（支払いが必要）を返すと、補助クライアントは自動的に次のプロバイダーへフォールバックします。"
  t238: "agent.tool_use_enforcement は、ツールを呼ばずに操作を説明するだけのモデルをステアします。GPT/Codex では auto です。"
  t239: "agent.restart_after_turn_timeout は /restart が stop() に入る前に進行中のターンを完了させます。restart_drain_timeout は stop() 開始後の強制中断までの猶予に過ぎません。"
  t240: "agent.api_max_retries（デフォルト 3）は、失敗した API 呼び出しをエラーとして表面化させる前に何回再試行するかを制御します。素早くフォールバックしたいなら小さくしてください。"
  t241: "ゲートウェイはセッションごとに AIAgent インスタンスをキャッシュします。このキャッシュを破棄すると Anthropic のプロンプトキャッシュが壊れます。"
  t242: "どの Web サイトも /.well-known/skills/index.json でスキルを公開でき、スキルハブが自動的に検出します。"
  t243: "~/.hermes/skills/.hub/audit.log のスキル監査ログには、すべてのインストールと削除の操作が記録されます。"
  t244: "古い git ワークツリーは起動時に自動整理されます。クリーンで完全にマージ済みのツリーは削除され、変更や未プッシュの作業があるものは必ず保持されます。"
  t245: "プロファイルは HERMES_HOME で Hermes の状態を分離します。terminal.home_mode が profile でない限り、ホスト側ツールのサブプロセスは本来の HOME を維持します。"
  t246: "環境変数 HERMES_HOME_MODE（8 進数、例: 0701）で、Web サーバーがたどれるようにディレクトリのパーミッションを指定できます。"
  t247: "コンテナモード: HERMES_HOME に .container-mode を置くと、ホストの CLI が自動的にコンテナ内で実行されます。"
  t248: "Ctrl+C には 5 段階の優先順位があります。録音のキャンセル → プロンプトのキャンセル → ピッカーのキャンセル → エージェントの中断 → 終了。"
  t249: "エージェント実行中のすべての中断は、タイムスタンプ付きで ~/.hermes/interrupt_debug.log に記録されます。"
  t250: "BROWSER_CDP_URL はブラウザツールを実行中の任意の Chromium 系ブラウザに接続します。WebSocket、HTTP、host:port を受け付けます。"
  t251: "BROWSERBASE_ADVANCED_STEALTH=true は、カスタム Chromium による高度な検出回避を有効にします（Scale プラン）。"
  t252: "CLI は幅が 80 桁未満のターミナルでは自動的にコンパクトモードに切り替わります。"
  t253: "クイックコマンドには 2 種類あります。exec（シェルコマンドを直接実行）と alias（別のコマンドへリダイレクト）です。"
  t254: "タスクごとの委譲モデル: 設定の delegation.model と delegation.provider で、サブエージェントを安価なモデルへ振り分けられます。"
  t255: "delegation.reasoning_effort は、サブエージェントの思考の深さを独立して制御します。"
  t256: "config.yaml の display.platforms で、プラットフォームごとに表示設定を上書きできます: {telegram: {tool_progress: all}}。"
  t257: "設定の human_delay.mode は人間のタイピング速度を模倣します。min_ms/max_ms の範囲を設定できます。"
  t258: "設定のバージョン移行は読み込み時に自動的に実行されるため、新しい設定キーは手作業なしで現れます。"
  t259: "GPT と Codex のモデルには、ツール規律と必須のツール使用に関する特別なシステムプロンプトの指針が与えられます。"
  t260: "Gemini モデルには、絶対パス、並列ツール呼び出し、非対話的コマンドに関する専用の指示が与えられます。"
  t261: "config.yaml の context.engine にプラグイン名を設定すると、別のコンテキスト管理戦略を使えます。"
  t262: "15,000 文字を超えるブラウザページのスナップショットは切り詰めまたは自動要約され、全文は read_file でページ送りできるよう cache/web に保存されます。"
  t263: "圧縮エンジンは安価な前処理を行います。LLM を実行する前に、200 文字を超えるツール出力をプレースホルダーに置き換えます。"
  t264: "圧縮が失敗すると、API への連打を避けるため以降の試行が 10 分間停止されます。"
  t265: "長い危険なコマンド（70 文字超）には、承認プロンプトに全文を先に確認できる「view」オプションが付きます。"
  t266: "音声録音中は、マイクの RMS レベルに基づいて ▁▂▃▄▅▆▇ のバーで音量が可視化されます。"
  t267: "プロファイル名は既存の PATH 上のバイナリと重複できません。「hermes profile create ls」は拒否されます。"
  t268: "hermes profile create backup --clone-all は、設定、キー、SOUL.md、メモリ、スキル、セッションのすべてをコピーします。"
  t269: "音声録音キーは config.yaml の voice.record_key で設定できます。Ctrl+B に限りません。"
  t270: ".cursorrules と .cursor/rules/*.mdc ファイルは自動検出され、プロジェクトのコンテキストとして読み込まれます。"
  t271: "コンテキストファイルは 10 種類以上のプロンプトインジェクションのパターンを検出します。不可視の Unicode、「指示を無視せよ」、情報の持ち出しの試みなどです。"
  t272: "GPT-5 と Codex はメッセージ形式で 'system' の代わりに 'developer' ロールを使います。"
  t273: "タスクごとの補助モデルの上書き: config.yaml の auxiliary.vision.provider、auxiliary.compression.model など。"
  t274: "補助クライアントは 'main' をプロバイダーの別名として扱い、実際のプライマリプロバイダーとモデルに解決します。"
  t275: "hermes claw migrate --dry-run は、何も書き込まずに OpenClaw からの移行内容をプレビューします。"
  t276: "引用符付きやスペースがエスケープされた状態で貼り付けたファイルパスは自動的に処理されるため、手で整える必要はありません。"
  t277: "スラッシュコマンドは大量貼り付けの折りたたみを引き起こしません。大きな引数を付けた /command も正しく動作します。"
  t278: "中断モードでは、エージェント実行中に入力したスラッシュコマンドは中断ロジックを経由せず即座に実行されます。"
  t279: "HERMES_DEV=1 は、ローカル開発のためにコンテナモードの検出を回避します。"
  t280: "各 MCP サーバーには独自のツールセット（mcp-servername）があり、hermes tools で個別にオン/オフできます。"
  t281: "設定内の MCP の ${ENV_VAR} プレースホルダーはサーバー起動時に解決され、~/.hermes/.env の変数も対象です。"
  t282: "信頼済みリポジトリ（NousResearch）のスキルは「trusted」セキュリティレベルになり、コミュニティのスキルは追加のスキャンを受けます。"
  t283: "~/.hermes/skills/.hub/quarantine/ のスキル隔離領域には、セキュリティレビュー待ちのスキルが保管されます。"
  t284: "/steer <prompt> は次のツール呼び出しの後にメモを注入します。中断せずにタスクの途中で方向を修正できます。"
  t285: "/goal <text> は継続的な Ralph ループの目標を設定します。ジャッジが完了と判定するまで、Hermes はターンを自動で続けます。"
  t286: "/snapshot create [label] は Hermes 設定の完全な状態スナップショットを保存し、/snapshot restore <id> で後から戻せます。"
  t287: "/copy [N] は最後のアシスタント応答をクリップボードにコピーします。番号を付けると最後から N 番目をコピーします。"
  t288: "/redraw は UI 全体を強制的に再描画し、tmux のリサイズやマウス選択の残骸によるターミナルのずれを直します。"
  t289: "/agents（別名 /tasks）は、現在のセッションで動作中のエージェントと実行中のバックグラウンドタスクを表示します。"
  t290: "/footer は最終応答に付くゲートウェイのフッター（モデル、コンテキスト使用率、cwd）の表示を切り替えます。"
  t291: "/busy queue|steer|interrupt は、Hermes の作業中に Enter を押したときの動作を制御します。"
  t292: "Telegram の DM で /topic を使うと、ユーザー管理のマルチセッショントピックモードが有効になり、/topic <id> で過去のセッションをその場で復元できます。"
  t293: "/approve session|always は保留中の危険なコマンドを選んだ信頼範囲で実行し、/deny は拒否します。"
  t294: "/restart は実行中の処理を完了させてからゲートウェイを安全に再起動し、復帰後に要求者へ通知します。"
  t295: "/kanban boards switch <slug> で、チャット内からアクティブなマルチプロジェクトの Kanban ボードを切り替えられます。"
  t296: "/reload は実行中のセッションに ~/.hermes/.env を再読み込みします。再起動せずに新しい API キーを反映できます。"
  t297: "no_agent=True の cronjob はスクリプトをスケジュール実行し、その標準出力をそのまま送信します。トークンも LLM もゼロです。"
  t298: "cron スクリプトの標準出力が空ならサイレントティックとなり、何も配信されません。しきい値の監視に最適です。"
  t299: "HERMES_CRON_MAX_PARALLEL（デフォルト 4）は 1 ティックあたりに実行する cron ジョブ数を制限し、バーストでキーが飽和しないようにします。"
  t300: "ゲートウェイフックは ~/.hermes/hooks/<name>/ に HOOK.yaml と handler.py を置きます。ハンドラー名は `handle` にする必要があります。"
  t301: "フックのイベントには gateway:startup、session:start、agent:step、そして command:* のワイルドカード購読があります。"
  t302: "~/.hermes/BOOT.md にチェックリストを置くと、gateway:startup フックが起動ごとにワンショットのエージェントとして実行します。"
  t303: "hermes curator run --dry-run は、何も変更せずにキュレーターがアーカイブや統合する内容をプレビューします。"
  t304: "hermes curator pin <skill> は、自動アーカイブとエージェントの skill_manage ツールの両方からスキルを保護します。"
  t305: "hermes curator rollback は実行前のスナップショットからスキルを復元します。バックアップは skills/.curator_backups/ にあります。"
  t306: "hermes auth reset <provider> [target] は、認証情報プール全体、またはインデックス・id・ラベルで指定した 1 件のクールダウンと枯渇フラグをクリアします。"
  t307: "credential_pool_strategies.<provider>: round_robin は、デフォルトの fill_first ではなくキーを均等に巡回させます。"
  t308: "ツールごとに use_gateway: true を設定すると、web、image、tts、browser を Nous サブスクリプション経由で使えます。追加のキーは不要です。"
  t309: "provider_routing.data_collection: deny は、OpenRouter 上でデータを保存するプロバイダーを除外します。"
  t310: "provider_routing.require_parameters: true は、リクエストのすべてのパラメーターに対応するプロバイダーだけにルーティングします。"
  t311: "HERMES_TUI_RESUME=1 は起動時に最新の TUI セッションへ自動で再接続します。SSH が切れた後に便利です。"
  t312: "HERMES_TUI_THEME=light|dark|<hex> は、COLORFGBG を設定しないターミナルで TUI のテーマを強制します。"
  t313: "TUI で Ctrl+G または Ctrl+X Ctrl+E を押すと、入力バッファを $EDITOR で開けます。長い複数行のプロンプトに便利です。"
  t314: "TUI は LaTeX をインラインで描画します。$E=mc^2$ は生の TeX ではなく Unicode の数式として表示されます。"
  t315: "hermes dashboard は 127.0.0.1:9119 でローカル Web UI を起動します。データは localhost の外に一切出ません。"
  t316: "hermes dashboard は xterm.js と WebSocket PTY を使い、Hermes の TUI をそのままブラウザに埋め込みます。"
  t317: "~/.hermes/dashboard-themes/ にパレット色 2 つを書いた YAML を置くだけで、ダッシュボード全体の見た目を変えられます。"
  t318: "ダッシュボードプラグインはドロップイン方式です。~/.hermes/dashboard-plugins/ に manifest.json と JS バンドルを置くだけで、npm ビルドは不要です。"
  t319: "ダッシュボードテーマで layoutVariant: cockpit を指定すると、プラグインが sidebar スロットから内容を配置できる 260px の左レールが追加されます。"
  t320: "display.tool_progress_command: true でメッセージングプラットフォームにも /verbose が公開されます。デフォルトでは CLI 限定です。"
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result は、バックグラウンドタスクの完了時だけ通知します（他に concise/all/error/off）。"
  t322: "HERMES_WRITE_SAFE_ROOT は write_file/patch の書き込み先をディレクトリプレフィックスに制限します。複数パスは os.pathsep（: または ;）で区切ります。"
  t323: "HERMES_IGNORE_RULES は AGENTS.md、SOUL.md、.cursorrules、メモリ、プリロードされたスキルの自動注入をスキップします。"
  t324: "HERMES_ACCEPT_HOOKS は、config.yaml で宣言された未確認のシェルフックを TTY のプロンプトなしで自動承認します。"
  t325: "auxiliary.goal_judge.model で /goal のジャッジを安価で高速なモデルに振り分け、ループのコストをほぼゼロに抑えられます。"
  t326: "チェックポイントは、巨大なモノレポで git 操作が遅くなるのを避けるため、ファイル数が 50,000 を超えるディレクトリをスキップします。"
  t327: "tts.provider: piper は 44 言語対応のローカル TTS を CPU で実行します。音声モデルは ~/.hermes/cache/piper-voices/ に自動ダウンロードされます。"
  t328: "tts.providers.<name>.type: command は、{input_path} と {output_path} のプレースホルダーで任意の CLI TTS エンジンを接続します。"
  t329: "API_SERVER_ENABLED=true は、Open WebUI や LibreChat 向けに、ゲートウェイと並行して OpenAI 互換エンドポイントを起動します。"
  t330: "GATEWAY_PROXY_URL は分離構成を実現します。プラットフォームの入出力はローカルで、エージェントの処理はリモートの API サーバーに委ねます。"
  t331: "MATRIX_DEVICE_ID は E2EE 用の固定デバイス ID を指定します。未設定だと起動ごとにキーが変わり、過去メッセージの復号が壊れます。"
  t332: "TELEGRAM_WEBHOOK_URL を設定する場合は TELEGRAM_WEBHOOK_SECRET が必須です。openssl rand -hex 32 で生成できます。"
  t333: "batch_runner.py --resume は完了済みプロンプトをテキスト内容で照合するため、データセットの順序が変わっても完了した作業を再実行しません。"
  t334: "/new はその場で新しいセッションを開始します（別名 /reset）。新しいセッション ID、空の履歴、CLI は開いたままです。"
  t335: "/clear はターミナル画面を消去し、さらに新しいセッションを開始します。見た目のリセットをワンステップで行えます。"
  t336: "/history は CLI を離れずに現在の会話をインラインで表示します。さっと読み返すのに便利です。"
  t337: "/save はセッションを終了せずに現在の会話をディスクに書き込みます。"
  t338: "/status はセッション情報（ID、タイトル、モデル、トークン使用量、経過時間）を一目で確認できます。"
  t339: "/image <path> は、貼り付けやドラッグ＆ドロップなしでローカルの画像ファイルを次のプロンプトに添付します。"
  t340: "/platforms はゲートウェイとメッセージングプラットフォームの接続状態をチャット内から表示します。"
  t341: "/commands はスラッシュコマンドとインストール済みスキルの全一覧をページ送りで表示します。タブ補完のないプラットフォームで便利です。"
  t342: "/toolsets は利用可能なすべてのツールセットを一覧表示し、-t/--toolsets に何を渡せるかがわかります。"
  t343: "/voice tts は TTS のみのモードを切り替えます。エージェントの応答は音声で読み上げられ、プロンプトはこれまで通りタイプします。"
  t344: "/reload-skills は ~/.hermes/skills/ を再スキャンするため、セッションを再起動せずに追加したスキルが現れます。"
  t345: "/indicator kaomoji|emoji|unicode|ascii で、エージェント実行中に表示される TUI のビジーインジケーターのスタイルを選べます。"
  t346: "/debug はサポートバンドル（システム情報とログ）をアップロードして共有用リンクを返します。チャットでも使えます。"
  t347: "hermes -z \"<prompt>\" は最も純粋なワンショット実行です。最終回答だけを stdout に出力するため、スクリプトでのパイプ処理に理想的です。"
  t348: "hermes chat --pass-session-id はセッション ID をシステムプロンプトに注入し、エージェントが自身のセッションを参照できるようにします。"
  t349: "hermes chat --image path/to/pic.png は、別途アップロードせずに 1 回の -q クエリにローカル画像を添付します。"
  t350: "hermes chat --ignore-user-config はアクティブなユーザー設定をスキップします。再現可能なバグ報告や CI 実行に向いています。"
  t351: "hermes chat --source tool はプログラムからのチャットにタグを付け、hermes sessions list を散らかさないようにします。"
  t352: "hermes dump --show-keys は、より詳しいサポートデバッグ用にマスク済みの API キーのフィンガープリントを含めます。"
  t353: "hermes sessions rename <ID> \"new title\" で過去のセッション名を変更でき、hermes sessions delete <ID> で削除できます。"
  t354: "hermes import は Hermes の完全バックアップ zip を復元します。セッションの JSON/JSONL エクスポートはダッシュボードの Sessions ページから取り込めます。"
  t355: "hermes fallback は fallback_model チェーンを対話的に管理します。config.yaml を手で編集する必要はありません。"
  t356: "hermes pairing は DM ペアリングトークンを更新します。更新後に最初にメッセージを送った人がボットへのアクセスを得ます。"
  t357: "hermes setup は、プロバイダー、キー、プラットフォームの接続設定を 1 つの対話フローで初回ユーザーに案内します。"
  t358: "hermes status --deep はすべてのコンポーネントの完全なヘルスチェックを実行します。通常の hermes status は簡易表示です。"
  t359: "HERMES_AGENT_TIMEOUT=0 は実行中のエージェントに対するゲートウェイの無操作による強制終了を無効にします。長時間の調査に使ってください。"
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 は ./.hermes/plugins/ のリポジトリ内プラグインを自動読み込みします。設計上、信頼確認を経ます。"
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 は、patch と write_file の「読んだ後にファイルが変更された」ガードをオフにします。"
  t362: "HERMES_ALLOW_PRIVATE_URLS=true は Web ツールから localhost やプライベートネットワークへのアクセスを許可します。ゲートウェイモードではデフォルトでオフです。"
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 は、プロファイルごとの初回実行時にオプションカタログの追加スキルを自動インストールします。"
  t364: "HERMES_BUNDLED_SKILLS はカスタムの同梱スキルツリーを指します。Homebrew と Nix のパッケージングで使われます。"
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 は、すべての API リクエストのペイロードをログファイルではなく stdout に出力します。"
  t366: "HERMES_OAUTH_TRACE=1 は、プロバイダー認証のデバッグ用にマスク済みの OAuth トークン交換と更新の試行を記録します。"
  t367: "HERMES_STREAM_RETRIES（デフォルト 3）は、一時的なネットワークエラー時のストリーム途中での再接続回数を制御します。"
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false は、作業中のエージェントにユーザーがメッセージを送った際の ⚡/⏳/⏩ の応答メッセージを抑制します。"
  t369: "HERMES_AGENT_NOTIFY_INTERVAL（デフォルト 180s）は、長いターンでゲートウェイが進捗を通知する間隔を設定します。"
  t370: "HERMES_RESTART_DRAIN_TIMEOUT（デフォルト 900s）は、/restart が強制実行に移る前に進行中の処理を待つ時間の上限です。"
  t371: "HERMES_CHECKPOINT_TIMEOUT（デフォルト 30s）はファイルシステムのチェックポイント作成時間の上限です。巨大なモノレポでは大きくしてください。"
  t372: "config.yaml の image_gen.model で FAL のモデルを選べます。flux-2/klein、gpt-image-2、nano-banana-pro などです。"
  t373: "image_gen.provider は、デフォルトの代わりにプラグイン（OpenAI Images、Codex、FAL）経由で画像生成をルーティングします。"
  t374: "AUXILIARY_VISION_BASE_URL と AUXILIARY_VISION_API_KEY で、画像解析を任意の OpenAI 互換エンドポイントに向けられます。"
  t375: "security.tirith_fail_open: false にすると、tirith スキャナー自体がエラーになった場合に Hermes はコマンドをブロックします。"
  t376: "環境変数 TIRITH_FAIL_OPEN は tirith_fail_open の設定を上書きします。config.yaml を編集せずに素早く切り替えられます。"
  t377: "--source tool のチャットはデフォルトで hermes sessions list から除外されます。表示するには --source を明示的に指定してください。"
  t378: "セッション ID はタイムスタンプで始まる（20250305_091523_abcd）ため、ls や jq で自然に並べ替えられます。"
  t379: "API_SERVER_MODEL_NAME は /v1/models に表示されるモデル名をカスタマイズします。複数プロファイルの Open WebUI 構成では必須です。"
  t380: "ダッシュボードプラグインは /dashboard-plugins/<name>/ から配信されます。ファイルを ~/.hermes/dashboard-plugins/ に置いてください。"
  placeholder:
