    p02: "このフォルダーの内容を要約して"
    p03: "受信トレイの最新メールへの返信を下書きして"
    p04: "機能を計画して、段階的に実装して"
    p05: "失敗しているテストを見つけて修正して"
    p06: "このトピックを調査して概要をまとめて"
    p07: "このリポジトリで最近何が変わった？"
    p08: "このメモを To-Do リストにして"
