    error_near_max_iterations: "최종 답변 전에 반복 한도 근처에서 오류가 발생했어요. 위의 도구 출력을 확인한 뒤 `continue`를 보내세요."
    repeated_outer_errors: "턴이 반복되는 오류로 계속 실패해서 무한히 재시도하지 않고 일찍 멈췄어요. 위의 오류를 확인한 뒤 `continue`를 보내 다시 시도하세요."
  persistence:
    compression: "다른 프로세스가 이 세션을 압축하고 있어서 턴을 멈췄어요. 메시지는 이미 저장되어 있을 거예요 — 압축이 끝난 뒤 다시 보내 주세요."
    compression_closed: "컨텍스트 압축으로 이 세션이 교체되었고 실시간 이어받기를 할 수 없어서 턴을 멈췄어요. 저장소 자체는 정상이에요 — 클라이언트를 새로 고치거나 새 턴을 시작해 새 세션 ID를 받은 뒤 메시지를 다시 보내 주세요."
    turn_lease: "다른 Hermes 프로세스가 이 세션을 넘겨받아서 턴을 멈췄어요. 답변은 저장되지 않았어요 — 다른 프로세스가 끝나길 기다린 뒤 메시지를 다시 보내 주세요."
    session_row_missing: "채팅이 열려 있는 동안 이 세션이 저장소에서 삭제되었고 Hermes가 다시 만들 수 없어서 이 메시지는 저장되지 않았어요. 메시지를 다시 보내 주세요. 계속 실패하면 `hermes {profile_arg}doctor`를 실행하세요."
    locked: "세션 저장소가 사용 중이어서(다른 Hermes 프로세스가 상태 데이터베이스에 쓰고 있었어요) 턴을 멈췄어요. 메시지는 이미 저장되어 있을 거예요 — 잠시 후 다시 보내 주세요."
    replaced: "Hermes가 실행되는 동안 세션 데이터베이스 파일이 교체되어 이 메시지는 저장되지 않았어요 (복사본은 {home}/sessions/에 보관돼요). Hermes를 중지하고(`hermes {profile_arg}gateway stop`), `hermes {profile_arg}doctor`를 실행한 뒤 — `hermes {profile_arg}doctor --fix`는 잘못된 파일을 그 자리에서 수리하니 사용하지 마세요 — 다시 시작하고 메시지를 한 번 더 보내 주세요. 고급 복구 절차는 로그에 있어요."
    deleted_wal: "다른 Hermes 프로세스가 세션 데이터베이스의 미리 쓰기 로그(WAL) 이전 복사본을 아직 잡고 있어서, 파일을 안전하게 지키기 위해 Hermes가 쓰기를 멈췄고 이 메시지는 저장되지 않았어요 (복사본은 {home}/sessions/에 보관돼요). 잃어버린 것은 없어요. 이 프로필의 모든 Hermes 프로세스(Desktop 앱, `hermes {profile_arg}gateway stop`, 대시보드, 크론)를 종료하고 `hermes {profile_arg}doctor`를 실행하세요 — 로그를 아직 잡고 있는 프로세스를 알려 줘요 — 그런 다음 Hermes를 다시 시작하고 메시지를 한 번 더 보내 주세요. 프로세스가 실행 중인 동안에는 `doctor --fix`를 실행하거나 state.db 파일을 삭제하지 마세요. 가이드: {recovery_docs}"
    corrupt: "상태 데이터베이스에서 구조적 손상이 보고되어(재시작 시 대화 기록이 사라질 수 있어요) 턴을 멈췄어요. 디스크 공간을 확보해도 도움이 되지 않아요. 복구 방법:\n1. `hermes {profile_arg}doctor --fix` 실행\n2. 게이트웨이를 중지한 뒤 다음으로 복구:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (복구 가능하다고 나오면) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — 복구 시 손상된 파일의 스냅샷을 먼저 만들어요. 실행 중인 state.db에 `sqlite3 ... \".recover\"`를 절대 실행하지 마세요. 취약한 sqlite3 CLI가 손상을 더 키울 수 있어요\n3. {backups_dir}/의 백업에서 복원\n그런 다음 메시지를 다시 보내 주세요."
    fts_index: "세션 검색 인덱스(FTS5)가 손상되었고 분리할 수 없어서 턴을 멈췄고 이 메시지는 저장되지 않았어요. 메시지 저장소 자체는 손상되지 않았으니 복구 도구를 실행하거나 백업을 복원하지 마세요. `hermes {profile_arg}doctor --fix`를 실행하거나(또는 Hermes를 재시작하면 열 때 인덱스를 수리해요) 메시지를 다시 보내 주세요."
    disk: "Hermes가 이 대화를 디스크에 저장할 수 없어서 메시지를 잃지 않도록 멈췄어요. 디스크가 가득 찼을 가능성이 커요. 공간을 확보하거나 {home}/state.db의 권한을 고친 뒤 메시지를 다시 보내 주세요."
    default: "Hermes가 이 대화를 저장할 수 없어서 메시지를 잃지 않도록 멈췄어요. 가능한 원인: 드라이브 공간 부족, 또는 다른 Hermes 프로세스가 데이터베이스를 잡고 있는 경우예요. 다른 Hermes 창을 닫고 `hermes {profile_arg}doctor`로 저장소를 확인한 뒤 메시지를 다시 보내 주세요."
  file_mutation:
    header: "⚠️ 파일 변경 검증기: 위의 문구가 어떻게 보이든, 이번 턴에 파일 편집 {count}건이 실패했어요. `git status`나 `read_file`로 실제 반영된 내용을 확인하세요."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "실패"
  shared:
    and_more: "  • … 외 {count}개 더"
    the_model: "모델"
tips:
  t001: "/bg <prompt>는 현재 세션을 그대로 두고 별도 세션에서 작업을 실행해요. /btw <question>은 대화를 끊지 않고 이 대화에 관한 부수적인 질문에 답해요."
  t002: "/branch는 현재 세션을 분기해서 진행 상황을 잃지 않고 다른 방향을 탐색할 수 있게 해요."
  t003: "/compress는 대화가 길어졌을 때 컨텍스트를 수동으로 압축해요."
  t004: "/rollback은 파일 시스템 체크포인트 목록을 보여줘요 — 에이전트가 수정한 파일을 이전 상태로 되돌릴 수 있어요."
  t005: "/rollback diff 2는 아무것도 복원하지 않고 체크포인트 2 이후 변경 사항만 미리 보여줘요."
  t006: "/rollback 2 src/file.py는 특정 체크포인트에서 파일 하나만 복원해요."
  t007: "/title \"my project\"로 세션에 이름을 붙여요 — 나중에 /resume이나 hermes -c로 다시 이어갈 수 있어요."
  t008: "/resume은 이전에 이름을 붙인 세션을 중단한 지점부터 다시 이어가요."
  t009: "/queue <prompt>는 현재 턴을 끊지 않고 다음 턴에 보낼 메시지를 대기열에 넣어요."
  t010: "/undo는 대화에서 마지막 사용자/어시스턴트 교환을 제거해요."
  t011: "/retry는 마지막 메시지를 다시 보내요 — 에이전트의 답변이 만족스럽지 않을 때 유용해요."
  t012: "/verbose는 도구 진행 표시를 순환해요: off → new → all → verbose."
  t013: "/reasoning high는 모델의 생각 깊이를 높여요. /reasoning show는 추론 내용을 표시해요."
  t014: "/fast는 더 빠른 API 응답을 위한 우선 처리를 전환해요 (제공자에 따라 달라요)."
  t015: "/yolo는 세션이 끝날 때까지 위험한 명령에 대한 승인 요청을 모두 건너뛰어요."
  t016: "/model로 세션 중에 모델을 바꿀 수 있어요 — /model sonnet이나 /model gpt-5를 시도해 보세요."
  t017: "/model --global은 기본 모델을 영구적으로 변경해요."
  t018: "/personality pirate는 재미있는 성격을 설정해요 — kawaii부터 shakespeare까지 14가지 내장 옵션이 있어요."
  t019: "/skin은 CLI 테마를 바꿔요 — ares, mono, slate, poseidon, charizard를 시도해 보세요."
  t020: "/statusbar는 모델, 토큰, 컨텍스트 사용률 %, 비용, 경과 시간을 보여주는 고정 표시줄을 전환해요."
  t021: "/tools disable browser는 현재 세션에서 브라우저 도구를 일시적으로 제거해요."
  t022: "/browser connect는 CDP를 통해 실행 중인 Chromium 계열 브라우저에 브라우저 도구를 연결해요."
  t023: "/plugins는 설치된 플러그인과 상태를 보여줘요."
  t024: "/cron은 예약 작업을 관리해요 — 반복 프롬프트를 설정하고 어떤 플랫폼으로든 전달할 수 있어요."
  t025: "/reload-mcp는 재시작 없이 MCP 서버 설정을 즉시 다시 불러와요."
  t026: "/usage는 토큰 사용량, 비용 내역, 세션 경과 시간을 보여줘요."
  t027: "/insights는 최근 30일간의 사용량 분석을 보여줘요."
  t028: "/paste는 클립보드에 이미지가 있는지 확인하고 다음 메시지에 첨부해요."
  t029: "/profile은 활성 프로필과 그 홈 디렉터리를 보여줘요."
  t030: "/config는 현재 설정을 한눈에 보여줘요."
  t031: "/stop은 에이전트가 시작한 모든 백그라운드 프로세스를 종료해요."
  t032: "@file:path/to/file.py는 파일 내용을 메시지에 직접 삽입해요."
  t033: "@file:main.py:10-50은 파일의 10-50행만 삽입해요."
  t034: "@folder:src/는 디렉터리 트리 목록을 삽입해요."
  t035: "@diff는 스테이징되지 않은 git 변경 사항을 메시지에 삽입해요."
  t036: "@staged는 스테이징된 git 변경 사항(git diff --staged)을 삽입해요."
  t037: "@git:5는 최근 5개 커밋을 전체 패치와 함께 삽입해요."
  t038: "@url:https://example.com은 웹 페이지 내용을 가져와서 삽입해요."
  t039: "@를 입력하면 파일 시스템 경로 자동 완성이 시작돼요 — 어떤 파일이든 대화형으로 찾아갈 수 있어요."
  t040: "여러 참조를 조합할 수 있어요: \"@file:main.py와 @file:test.py의 일관성을 검토해 줘.\""
  t041: "Alt+Enter는 여러 줄 입력을 위해 줄바꿈을 넣어요. (Windows Terminal은 Alt+Enter를 가로채니 대신 Ctrl+Enter를 사용하세요.)"
  t042: "Ctrl+C는 에이전트를 중단해요. 2초 안에 두 번 누르면 강제 종료돼요."
  t043: "Ctrl+Z는 Hermes를 백그라운드로 보내요 — 셸에서 fg를 실행하면 다시 돌아와요."
  t044: "Tab은 자동 제안 고스트 텍스트를 수락하거나 슬래시 명령을 자동 완성해요."
  t045: "에이전트가 작업 중일 때 새 메시지를 입력하면 작업을 중단하고 방향을 바꿀 수 있어요."
  t046: "Alt+V는 클립보드의 이미지를 대화에 붙여 넣어요."
  t047: "5줄 이상을 붙여 넣으면 자동으로 파일에 저장되고 대신 간결한 참조가 삽입돼요."
  t048: "hermes -c는 가장 최근 CLI 세션을 재개해요. hermes -c \"project name\"은 제목으로 재개해요."
  t049: "hermes -w는 격리된 git 워크트리를 만들어요 — 병렬 에이전트 워크플로에 딱 맞아요."
  t050: "hermes -w -q \"Fix issue #42\"는 워크트리 격리와 일회성 질의를 결합해요."
  t051: "hermes chat -t web,terminal은 특정 도구 세트만 활성화해서 집중된 세션을 만들어요."
  t052: "hermes chat -s github-pr-workflow는 시작 시 스킬을 미리 불러와요."
  t053: "hermes chat -q \"query\"는 비대화형 질의를 한 번 실행하고 종료해요."
  t054: "hermes chat --max-turns 1000은 턴당 기본 500회 반복 한도를 재정의해요."
  t055: "hermes chat --checkpoints는 파괴적인 파일 변경 전마다 파일 시스템 스냅샷을 활성화해요."
  t056: "hermes --yolo는 세션 전체에서 위험한 명령에 대한 승인 요청을 모두 건너뛰어요."
  t057: "hermes chat --source telegram은 hermes sessions list에서 필터링할 수 있도록 세션에 태그를 붙여요."
  t058: "hermes -p work chat은 기본 프로필을 바꾸지 않고 특정 프로필로 실행해요."
  t059: "hermes doctor --fix는 설정과 의존성 문제를 진단하고 자동으로 복구해요."
  t060: "hermes dump는 간결한 설정 요약을 출력해요 — 버그 보고에 유용해요."
  t061: "hermes config set KEY VALUE는 비밀 값을 .env로, 나머지는 config.yaml로 자동 분류해서 저장해요."
  t062: "hermes config edit는 기본 편집기로 config.yaml을 열어요."
  t063: "hermes config check는 누락되었거나 오래된 설정 옵션을 검사해요."
  t064: "hermes sessions browse는 검색 기능이 있는 대화형 세션 선택기를 열어요."
  t065: "hermes sessions stats는 플랫폼별 세션 수와 데이터베이스 크기를 보여줘요."
  t066: "hermes sessions prune --older-than 30은 오래된 세션을 정리해요."
  t067: "hermes skills search react --source skills-sh는 skills.sh 공개 디렉터리를 검색해요."
  t068: "hermes skills check는 설치된 허브 스킬의 업스트림 업데이트를 검사해요."
  t069: "hermes skills tap add myorg/skills-repo는 사용자 지정 GitHub 스킬 소스를 추가해요."
  t070: "hermes skills snapshot export setup.json은 백업이나 공유를 위해 스킬 설정을 내보내요."
  t071: "hermes mcp add github --command npx는 명령줄에서 MCP 서버를 추가해요."
  t072: "hermes mcp serve는 Hermes 자체를 다른 에이전트를 위한 MCP 서버로 실행해요."
  t073: "hermes auth add로 자격 증명 풀 순환을 위한 API 키를 여러 개 추가할 수 있어요."
  t074: "hermes completion bash >> ~/.bashrc는 모든 명령과 프로필에 대한 탭 자동 완성을 활성화해요."
  t075: "hermes logs -f는 agent.log를 실시간으로 따라가요. --level WARNING --since 1h로 출력을 필터링해요."
  t076: "hermes backup은 Hermes 홈 디렉터리 전체를 zip 파일로 백업해요."
  t077: "hermes profile create coder는 격리된 프로필을 만들고, 그 프로필은 자체 명령이 돼요."
  t078: "hermes profile create work --clone은 현재 설정과 키를 새 프로필로 복사해요."
  t079: "hermes update는 새로 번들된 스킬을 모든 프로필에 자동으로 동기화해요."
  t080: "hermes gateway install은 Hermes를 시스템 서비스(systemd/launchd)로 설정해요."
  t081: "hermes memory setup으로 외부 메모리 제공자(Honcho, Mem0 등)를 설정할 수 있어요."
  t082: "hermes webhook subscribe는 HMAC 검증이 포함된 이벤트 기반 웹훅 경로를 만들어요."
  t083: "비용을 아끼세요: hermes tools로 사용하지 않는 도구를 비활성화하고, hermes skills config로 스킬을 줄여요."
  t084: "/reasoning low나 /reasoning minimal은 생각 깊이를 기본값(medium) 아래로 낮춰요 — 더 빠르고 저렴한 응답을 받아요."
  t085: "hermes models는 비전, 압축, 보조 작업을 더 저렴한 모델로 라우팅해요 — 주 채팅 모델을 낮추지 않고도 백그라운드 토큰 비용을 85% 이상 줄여요."
  t086: "config.yaml에 display.bell_on_complete: true를 설정하면 긴 작업이 끝날 때 알림음이 울려요."
  t087: "display.streaming: true를 설정하면 모델이 생성하는 토큰을 실시간으로 볼 수 있어요."
  t088: "display.show_reasoning: true를 설정하면 모델의 사고 과정 추론을 지켜볼 수 있어요."
  t089: "display.compact: true를 설정하면 출력의 공백을 줄여 정보를 더 촘촘하게 보여줘요."
  t090: "display.busy_input_mode: queue를 설정하면 에이전트를 끊는 대신 메시지를 대기열에 넣고, steer로 설정하면 /steer를 통해 실행 중에 메시지를 주입해요."
  t091: "display.resume_display: minimal을 설정하면 세션 재개 시 전체 대화 요약을 건너뛰어요."
  t092: "compression.threshold: 0.50을 설정해서 자동 압축이 실행되는 시점을 제어해요 (기본값: 컨텍스트의 50%)."
  t093: "agent.max_turns: 1000을 설정하면 에이전트가 턴당 더 많은 도구 호출 단계를 수행할 수 있어요."
  t094: "file_read_max_chars: 200000을 설정하면 read_file 호출당 최대 내용 길이가 늘어나요."
  t095: "approvals.mode: smart를 설정하면 LLM이 안전한 명령은 자동 승인하고 위험한 명령은 자동 거부해요."
  t096: "config.yaml에 fallback_model을 설정하면 백업 제공자로 자동 전환돼요."
  t097: "privacy.redact_pii: true를 설정하면 LLM에 보내기 전에 사용자 ID와 전화번호를 해시 처리해요."
  t098: "browser.record_sessions: true를 설정하면 브라우저 세션을 WebM 영상으로 자동 녹화해요."
  t099: "config.yaml에 worktree: true를 설정하면 항상 git 워크트리를 만들어요 (hermes -w와 같아요)."
  t100: "security.website_blocklist.enabled: true를 설정하면 웹 도구에서 특정 도메인을 차단해요."
  t101: "cron.wrap_response: false를 설정하면 크론 머리말/꼬리말 없이 에이전트 출력을 그대로 전달해요."
  t102: "HERMES_TIMEZONE은 서버 시간대를 어떤 IANA 시간대 문자열로든 재정의해요."
  t103: "config.yaml에서 환경 변수 치환을 사용할 수 있어요: ${VAR_NAME} 문법을 쓰세요."
  t104: "config.yaml의 빠른 명령은 토큰을 전혀 쓰지 않고 셸 명령을 즉시 실행해요."
  t105: "사용자 지정 성격은 config.yaml의 agent.personalities 아래에 정의할 수 있어요."
  t106: "provider_routing은 OpenRouter 제공자 정렬, 허용 목록, 차단 목록을 제어해요."
  t107: "execute_code는 Hermes 도구를 프로그래밍 방식으로 호출하는 Python 스크립트를 실행해요 — 결과가 컨텍스트에 쌓이지 않아요."
  t108: "delegate_task는 기본적으로 최대 10개의 서브에이전트(delegation.max_concurrent_children)를 격리된 컨텍스트로 동시에 생성해서 병렬 작업을 수행해요."
  t109: "web_extract는 PDF URL에도 동작해요 — PDF 링크를 넘기면 마크다운으로 변환해요."
  t110: "search_files는 ripgrep 기반이라 grep보다 빨라요 — terminal에서 grep을 쓰는 대신 이걸 사용하세요."
  t111: "patch는 9가지 퍼지 매칭 전략을 사용해서 사소한 공백 차이로 편집이 실패하지 않아요."
  t112: "patch는 한 번의 호출로 여러 파일을 일괄 편집하는 V4A 형식을 지원해요."
  t113: "read_file은 파일을 찾을 수 없을 때 비슷한 파일 이름을 제안해요."
  t114: "read_file은 자동으로 중복을 제거해요 — 변경되지 않은 파일을 다시 읽으면 가벼운 스텁만 반환해요."
  t115: "browser_vision은 스크린샷을 찍어 AI로 분석해요 — CAPTCHA와 시각적 콘텐츠에도 동작해요."
  t116: "browser_console은 페이지 컨텍스트에서 JavaScript 표현식을 평가할 수 있어요."
  t117: "image_generate는 FLUX 2 Pro로 이미지를 만들고 자동으로 2배 업스케일해요."
  t118: "text_to_speech는 텍스트를 음성으로 변환해요 — Telegram에서는 음성 메시지로 재생돼요."
  t119: "send_message는 세션 안에서 연결된 어떤 메시징 플랫폼으로든 메시지를 보낼 수 있어요."
  t120: "todo 도구는 세션 중에 에이전트가 복잡한 다단계 작업을 추적하도록 도와요."
  t121: "session_search는 과거의 모든 대화를 대상으로 전문 검색을 수행해요."
  t122: "에이전트는 선호 사항, 수정 지시, 환경 정보를 자동으로 메모리에 저장해요."
  t123: "/moa는 어려운 프롬프트 하나를 설정된 Mixture of Agents 모델 세트로 라우팅해요."
  t124: "terminal 명령은 오래 걸리는 작업을 위해 notify_on_complete가 포함된 백그라운드 모드를 지원해요."
  t125: "terminal 백그라운드 프로세스는 특정 출력 줄에 알림을 보내는 watch_patterns를 지원해요."
  t126: "terminal 도구는 6가지 백엔드를 지원해요: local, Docker, SSH, Modal, Daytona, Singularity."
  t127: "각 프로필은 자체 설정, API 키, 메모리, 세션, 스킬, 크론 작업을 가져요."
  t128: "프로필 이름은 셸 명령이 돼요 — 'hermes profile create coder'는 'coder' 명령을 만들어요."
  t129: "hermes profile export coder -o backup.tar.gz는 이동 가능한 프로필 아카이브를 만들어요."
  t130: "두 프로필이 실수로 같은 봇 토큰을 공유하면 두 번째 게이트웨이는 명확한 오류와 함께 차단돼요."
  t131: "세션은 첫 교환 후 설명적인 제목을 자동으로 생성해요 — 직접 이름을 붙일 필요가 없어요."
  t132: "세션 제목은 계보를 지원해요: \"my project\" → \"my project #2\" → \"my project #3\"."
  t133: "종료할 때 Hermes는 세션 ID와 통계가 포함된 재개 명령을 출력해요."
  t134: "hermes sessions export backup.jsonl은 백업이나 분석을 위해 모든 세션을 내보내요."
  t135: "hermes -r SESSION_ID는 ID로 특정 과거 세션을 재개해요."
  t136: "메모리는 고정된 스냅샷이에요 — 변경 사항은 다음 세션 시작 시에만 시스템 프롬프트에 반영돼요."
  t137: "메모리 항목은 프롬프트 주입과 데이터 유출 패턴이 있는지 자동으로 검사돼요."
  t138: "에이전트에는 두 가지 메모리 저장소가 있어요: 개인 메모(~2200자)와 사용자 프로필(~1375자)."
  t139: "에이전트에게 주는 수정 지시(\"아니, 이렇게 해 줘\")는 종종 메모리에 자동 저장돼요."
  t140: "github, creative, mlops, productivity, research 등 80개 이상의 번들 스킬이 있어요."
  t141: "설치된 모든 스킬은 자동으로 슬래시 명령이 돼요 — /를 입력하면 전체 목록을 볼 수 있어요."
  t142: "hermes skills install official/security/1password는 저장소의 선택형 스킬을 설치해요."
  t143: "스킬은 특정 OS 플랫폼으로 제한할 수 있어요 — 일부는 macOS나 Linux에서만 불러와져요."
  t144: "config.yaml의 skills.external_dirs로 사용자 지정 디렉터리에서 스킬을 불러올 수 있어요."
  t145: "에이전트는 skill_manage를 사용해 절차적 메모리로 자체 스킬을 만들 수 있어요."
  t146: "/plan은 아무것도 실행하지 않고 .hermes/plans/에 마크다운 구현 계획을 작성해요."
  t147: "크론 작업에 스킬을 붙일 수 있어요: hermes cron add --skill blogwatcher \"Check for new posts\"."
  t148: "크론 전달 대상에는 telegram, discord, slack, email, sms 외 12개 이상의 플랫폼이 있어요."
  t149: "크론 응답이 [SILENT]로 시작하면 전달이 억제돼요 — 모니터링 전용 작업에 유용해요."
  t150: "크론은 상대 지연(30m), 간격(every 2h), 크론 표현식, ISO 타임스탬프를 지원해요."
  t151: "크론 작업은 완전히 새로운 에이전트 세션에서 실행돼요 — 프롬프트는 그 자체로 완결되어야 해요."
  t152: "faster-whisper가 설치되어 있으면 API 키 없이도 음성 모드를 쓸 수 있어요 (무료 로컬 음성 인식)."
  t153: "음성 합성 제공자는 다섯 가지예요: Edge TTS (무료), ElevenLabs, OpenAI, NeuTTS (무료 로컬), MiniMax."
  t154: "/voice on으로 CLI에서 음성 모드를 켤 수 있어요. Ctrl+B로 푸시 투 토크 녹음을 전환해요."
  t155: "스트리밍 음성 합성은 문장이 생성되는 대로 바로 재생해요 — 전체 응답을 기다릴 필요가 없어요."
  t156: "Telegram, Discord, WhatsApp, Slack의 음성 메시지는 자동으로 음성 인식돼요."
  t157: "Hermes는 21개 메시징 플랫폼에서 동작해요: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, 이메일 등이에요."
  t158: "hermes gateway install은 게이트웨이를 부팅 시 자동 시작되는 시스템 서비스로 등록해요."
  t159: "DingTalk은 Stream Mode를 사용해요 — 웹훅이나 공개 URL이 필요 없어요."
  t160: "BlueBubbles는 로컬 macOS 서버를 통해 iMessage를 Hermes에 연결해요."
  t161: "웹훅 라우트는 HMAC 검증, 요청 제한, 이벤트 필터링을 지원해요."
  t162: "API 서버는 Open WebUI, LibreChat과 호환되는 OpenAI 호환 엔드포인트를 제공해요."
  t163: "Discord 음성 채널 모드: 봇이 음성 채널에 참여해 말을 인식하고 음성으로 대답해요."
  t164: "group_sessions_per_user: true로 설정하면 그룹 채팅에서 사람마다 별도의 세션을 갖게 돼요."
  t165: "/sethome은 해당 채팅을 크론 작업 결과가 전달되는 홈 채널로 지정해요."
  t166: "게이트웨이는 비활성 기반 시간 초과를 지원해요 — 활동 중인 에이전트는 무기한 실행될 수 있어요."
  t167: "위험 명령 승인에는 4단계가 있어요: once, session, always (영구 허용 목록), deny."
  t168: "스마트 승인 모드는 LLM으로 안전한 명령은 자동 승인하고 위험한 명령은 표시해요."
  t169: "SSRF 보호는 사설 네트워크, 루프백, 링크 로컬, 클라우드 메타데이터 주소를 차단해요."
  t170: "Tirith 사전 실행 검사는 동형 문자 URL 위장과 파이프-인터프리터 패턴을 감지해요."
  t171: "MCP 하위 프로세스에는 필터링된 환경 변수만 전달돼요 — 안전한 시스템 변수만 통과해요."
  t172: "컨텍스트 파일(.hermes.md, AGENTS.md)은 불러오기 전에 프롬프트 인젝션 보안 검사를 거쳐요."
  t173: "config.yaml의 command_allowlist는 특정 셸 명령 패턴을 영구적으로 승인해요."
  t174: "컨텍스트가 임계값에 도달하면 자동으로 압축돼요 — 메모리를 저장하고 기록을 요약해요."
  t175: "컨텍스트가 차오를수록 상태 표시줄이 노란색, 주황색, 빨간색으로 바뀌어요."
  t176: "SOUL.md는 에이전트의 핵심 정체성 파일이에요 — 직접 수정해서 행동을 바꿀 수 있어요."
  t177: "Hermes는 .hermes.md, AGENTS.md, CLAUDE.md, .cursorrules 중 먼저 발견되는 파일에서 프로젝트 컨텍스트를 불러와요."
  t178: "하위 디렉터리의 AGENTS.md 파일은 에이전트가 폴더로 이동할 때마다 점진적으로 발견돼요."
  t179: "컨텍스트 파일은 20,000자로 제한되며, 앞뒤를 남기는 스마트 잘라내기가 적용돼요."
  t180: "브라우저 제공자는 다섯 가지예요: 로컬 Chromium, Browserbase, Browser Use, Camofox, Firecrawl."
  t181: "Camofox는 탐지 회피 브라우저예요 — C++ 핑거프린트 위장을 적용한 Firefox 포크예요."
  t182: "browser_navigate는 페이지 스냅샷을 자동으로 반환해요 — 이후에 browser_snapshot을 호출할 필요가 없어요."
  t183: "browser_vision에 annotate=true를 주면 상호작용 가능한 요소 위에 번호 라벨을 겹쳐 표시해요."
  t184: "hermes mcp는 Nous가 승인한 MCP를 키 한 번으로 설치할 수 있는 대화형 선택기를 열어요."
  t185: "hermes mcp catalog는 저장소에 포함된 Nous 승인 MCP 서버 목록을 보여줘요."
  t186: "hermes mcp install <name>은 카탈로그 항목을 설치하고 자격 증명을 묻은 뒤, 어떤 도구를 활성화할지 고를 수 있게 해요."
  t187: "MCP 서버는 config.yaml에서 설정해요 — stdio와 HTTP 전송 방식을 모두 지원해요."
  t188: "서버별 도구 필터링: tools.include는 특정 도구만 허용하고 tools.exclude는 특정 도구를 제외해요."
  t189: "MCP 서버는 실행 시 도구 세트를 자동 생성해요 — hermes tools로 플랫폼별로 켜고 끌 수 있어요."
  t190: "MCP OAuth 지원: auth: oauth를 설정하면 PKCE 기반 브라우저 인증이 활성화돼요."
  t191: "체크포인트는 수정된 파일이 없으면 부담이 전혀 없어요 — 기본적으로 활성화되어 있어요."
  t192: "롤백 전 스냅샷이 자동으로 저장되므로 되돌리기를 다시 되돌릴 수도 있어요."
  t193: "/rollback은 대화 턴도 함께 되돌리므로, 에이전트는 롤백된 변경을 기억하지 않아요."
  t194: "체크포인트는 ~/.hermes/checkpoints/의 섀도 저장소를 사용해요 — 프로젝트의 .git은 절대 건드리지 않아요."
  t195: "batch_runner.py는 학습 데이터 생성을 위해 수백 개의 프롬프트를 병렬로 처리해요."
  t196: "hermes chat -Q는 프로그램에서 쓰기 좋은 조용한 모드를 켜요 — 배너와 스피너를 숨겨요."
  t197: "궤적 저장(--save-trajectories)은 모델 학습용으로 도구 사용 전체 기록을 남겨요."
  t198: "플러그인은 세 종류예요: 일반(도구/훅), 메모리 제공자, 컨텍스트 엔진."
  t199: "hermes plugins install owner/repo로 GitHub에서 직접 플러그인을 설치할 수 있어요."
  t200: "외부 메모리 제공자: OpenViking, Mem0은 기본 포함이고, Honcho, Hindsight 등은 hermes plugins install로 설치해요."
  t201: "플러그인 훅에는 pre/post_tool_call, pre/post_llm_call, 그리고 출력 정규화용 transform_terminal_output이 있어요."
  t202: "프롬프트 캐싱(Anthropic)은 캐시된 시스템 프롬프트 접두부를 재사용해 비용을 줄여요."
  t203: "에이전트는 백그라운드 스레드에서 세션 제목을 자동 생성해요 — 지연 시간에 영향이 없어요."
  t204: "스마트 모델 라우팅은 단순한 질문을 더 저렴한 모델로 자동 전달할 수 있어요."
  t205: "슬래시 명령은 접두어 일치를 지원해요: /h는 /help로, /mod는 /model로 해석돼요."
  t206: "파일 경로를 터미널로 드래그하면 이미지는 자동 첨부되고 그 외 파일은 컨텍스트로 전송돼요."
  t207: "저장소 루트의 .worktreeinclude에는 워크트리로 복사할 gitignore된 파일을 나열해요."
  t208: "hermes acp는 VS Code, Zed, JetBrains 연동을 위해 Hermes를 ACP 서버로 실행해요."
  t209: "사용자 정의 제공자: config.yaml의 custom_providers 아래에 이름 붙인 엔드포인트를 저장해요."
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT는 기록에 절대 저장되지 않는 시스템 프롬프트를 주입해요."
  t211: "credential_pool_strategies는 fill_first, round_robin, least_used, random 순환 방식을 지원해요."
  t212: "hermes auth add nous 또는 hermes auth add openai-codex로 OAuth 기반 제공자를 설정해요."
  t213: "API 서버는 Chat Completions와 서버 측 상태를 갖는 Responses API를 모두 지원해요."
  t214: "설정에서 tool_preview_length: 0으로 두면 스피너 활동 피드에 전체 파일 경로가 표시돼요."
  t215: "hermes status --deep은 모든 구성 요소에 대해 더 깊은 진단 검사를 실행해요."
  t216: "크론 작업에 Python 스크립트(--script)를 붙이면 그 stdout이 프롬프트에 컨텍스트로 주입돼요."
  t217: "크론 스크립트는 ~/.hermes/scripts/에 두고 에이전트보다 먼저 실행돼요 — 데이터 수집 파이프라인에 딱 맞아요."
  t218: "config.yaml의 prefill_messages_file은 모든 API 호출에 퓨샷 예시를 주입하며, 기록에는 저장되지 않아요."
  t219: "SOUL.md는 에이전트의 기본 정체성을 완전히 대체해요 — 다시 써서 Hermes를 나만의 것으로 만들어 보세요."
  t220: "SOUL.md는 첫 실행 시 기본 성격으로 자동 생성돼요. 편집해서 원하는 대로 바꿔 보세요."
  t221: "/compress <focus topic>은 요약 예산의 60-70%를 지정한 주제에 할당하고 나머지는 과감하게 줄여요."
  t222: "두 번째 이후 압축에서는 처음부터 다시 만드는 대신 이전 요약을 업데이트해요."
  t223: "게이트웨이 세션 초기화 전에 Hermes는 중요한 사실을 백그라운드에서 메모리에 자동 저장해요."
  t224: "config.yaml의 network.force_ipv4: true는 IPv6가 고장난 서버에서의 멈춤을 해결해요 — socket을 몽키패치해요."
  t225: "terminal 도구는 흔한 종료 코드에 설명을 달아요: grep이 1을 반환하면 '일치 항목 없음 (오류 아님)'이에요."
  t226: "실패한 포그라운드 터미널 명령은 지수 백오프(2초, 4초, 8초)로 최대 3번까지 자동 재시도해요."
  t227: "단독 sudo 명령은 .env의 SUDO_PASSWORD를 파이프로 넘기도록 자동 재작성돼요 — 대화형 입력이 필요 없어요."
  t228: "execute_code 헬퍼는 명시적으로 임포트해야 해요: from hermes_tools import json_parse, shell_quote, retry."
  t229: "execute_code의 샌드박스 도구 7개(web_search, terminal, read/write/search/patch)는 RPC를 사용해요 — 컨텍스트에 절대 들어가지 않아요."
  t230: "같은 파일 영역을 3번 이상 읽으면 경고가 표시돼요. 4번 이상이면 루프 방지를 위해 강제 차단돼요."
  t231: "write_file과 patch는 마지막 읽기 이후 파일이 외부에서 수정되었는지 감지해 오래된 내용이라고 경고해요."
  t232: "V4A 패치 형식은 Update뿐 아니라 Add File, Delete File, Move File 지시문도 지원해요."
  t233: "MCP 서버는 샘플링을 통해 LLM 완성을 역으로 요청할 수 있어요 — 에이전트가 서버의 도구가 되는 거예요."
  t234: "MCP 서버가 notifications/tools/list_changed를 보내면 재시작 없이 도구가 자동으로 다시 등록돼요."
  t235: "delegate_task에 acp_command: 'claude'를 주면 어떤 플랫폼에서든 Claude Code를 자식 에이전트로 실행해요."
  t236: "위임에는 하트비트 스레드가 있어요 — 자식의 활동이 부모에 전파되어 게이트웨이 시간 초과를 막아요."
  t237: "제공자가 HTTP 402(결제 필요)를 반환하면 보조 클라이언트는 자동으로 다음 제공자로 대체해요."
  t238: "agent.tool_use_enforcement는 도구를 호출하지 않고 행동을 설명만 하는 모델을 바로잡아요 — GPT/Codex에는 자동 적용돼요."
  t239: "agent.restart_after_turn_timeout은 /restart가 stop()에 들어가기 전에 진행 중인 턴을 끝내게 해요; restart_drain_timeout은 stop() 시작 후 강제 중단까지의 여유 시간일 뿐이에요."
  t240: "agent.api_max_retries(기본값 3)는 오류를 표시하기 전에 실패한 API 호출을 몇 번 재시도할지 정해요 — 빠른 대체를 원하면 낮추세요."
  t241: "게이트웨이는 세션별로 AIAgent 인스턴스를 캐시해요 — 이 캐시를 없애면 Anthropic 프롬프트 캐싱이 깨져요."
  t242: "어떤 웹사이트든 /.well-known/skills/index.json으로 스킬을 공개할 수 있어요 — 스킬 허브가 자동으로 찾아내요."
  t243: "~/.hermes/skills/.hub/audit.log의 스킬 감사 로그는 모든 설치와 제거 작업을 기록해요."
  t244: "오래된 git 워크트리는 시작 시 자동 정리돼요: 깨끗하고 완전히 병합된 트리는 제거되고, 변경 중이거나 푸시되지 않은 작업은 항상 보존돼요."
  t245: "프로필은 HERMES_HOME으로 Hermes 상태를 분리해요; 호스트 도구의 하위 프로세스는 terminal.home_mode가 profile이 아닌 한 실제 HOME을 유지해요."
  t246: "HERMES_HOME_MODE 환경 변수(8진수, 예: 0701)는 웹 서버 접근을 위한 사용자 정의 디렉터리 권한을 설정해요."
  t247: "컨테이너 모드: HERMES_HOME에 .container-mode를 두면 호스트 CLI가 자동으로 컨테이너 안에서 실행돼요."
  t248: "Ctrl+C에는 5단계 우선순위가 있어요: 녹음 취소 → 프롬프트 취소 → 선택기 취소 → 에이전트 중단 → 종료."
  t249: "에이전트 실행 중 발생한 모든 중단은 타임스탬프와 함께 ~/.hermes/interrupt_debug.log에 기록돼요."
  t250: "BROWSER_CDP_URL은 브라우저 도구를 실행 중인 어떤 Chromium 계열 브라우저에든 연결해요 — WebSocket, HTTP, host:port 형식을 받아요."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true는 사용자 정의 Chromium 기반의 고급 탐지 회피를 켜요 (Scale Plan)."
  t252: "CLI는 폭이 80열보다 좁은 터미널에서 자동으로 컴팩트 모드로 전환돼요."
  t253: "빠른 명령은 두 종류를 지원해요: exec(셸 명령 직접 실행)와 alias(다른 명령으로 연결)."
  t254: "작업별 위임 모델: 설정의 delegation.model과 delegation.provider로 서브에이전트를 더 저렴한 모델로 보낼 수 있어요."
  t255: "delegation.reasoning_effort는 서브에이전트의 생각 깊이를 독립적으로 제어해요."
  t256: "config.yaml의 display.platforms로 플랫폼별 표시 설정을 덮어쓸 수 있어요: {telegram: {tool_progress: all}}."
  t257: "설정의 human_delay.mode는 사람이 타이핑하는 속도를 흉내 내요 — min_ms/max_ms 범위를 조정할 수 있어요."
  t258: "설정 버전 마이그레이션은 불러올 때 자동으로 실행돼요 — 새 설정 키가 손대지 않아도 나타나요."
  t259: "GPT와 Codex 모델에는 도구 사용 규율과 필수 도구 사용에 관한 특별한 시스템 프롬프트 안내가 들어가요."
  t260: "Gemini 모델에는 절대 경로, 병렬 도구 호출, 비대화형 명령에 맞춘 지시가 들어가요."
  t261: "config.yaml의 context.engine을 플러그인 이름으로 설정하면 다른 컨텍스트 관리 전략을 쓸 수 있어요."
  t262: "15,000자를 넘는 브라우저 페이지 스냅샷은 잘리거나 자동 요약돼요; 전체 스냅샷은 cache/web에 저장되어 read_file로 나눠 읽을 수 있어요."
  t263: "압축기는 가벼운 사전 처리를 먼저 해요: LLM 실행 전에 200자를 넘는 도구 출력을 자리 표시자로 대체해요."
  t264: "압축이 실패하면 API 과다 호출을 피하기 위해 10분 동안 추가 시도를 멈춰요."
  t265: "70자를 넘는 긴 위험 명령은 승인 프롬프트에 전체 내용을 먼저 볼 수 있는 'view' 옵션이 생겨요."
  t266: "음성 녹음 중에는 마이크 RMS 레벨에 따라 ▁▂▃▄▅▆▇ 막대로 오디오 레벨을 표시해요."
  t267: "프로필 이름은 기존 PATH 실행 파일과 겹칠 수 없어요 — 'hermes profile create ls'는 거부돼요."
  t268: "hermes profile create backup --clone-all은 모든 것(설정, 키, SOUL.md, 메모리, 스킬, 세션)을 복사해요."
  t269: "음성 녹음 키는 config.yaml의 voice.record_key로 바꿀 수 있어요 — Ctrl+B만 쓸 수 있는 건 아니에요."
  t270: ".cursorrules와 .cursor/rules/*.mdc 파일은 자동으로 감지되어 프로젝트 컨텍스트로 불러와져요."
  t271: "컨텍스트 파일은 10가지 이상의 프롬프트 인젝션 패턴을 검사해요 — 보이지 않는 유니코드, 'ignore instructions', 유출 시도 등이에요."
  t272: "GPT-5와 Codex는 메시지 형식에서 'system' 대신 'developer' 역할을 사용해요."
  t273: "작업별 보조 모델 설정: config.yaml에서 auxiliary.vision.provider, auxiliary.compression.model 등을 지정할 수 있어요."
  t274: "보조 클라이언트는 'main'을 제공자 별칭으로 취급해요 — 실제 기본 제공자 + 모델로 해석돼요."
  t275: "hermes claw migrate --dry-run은 아무것도 쓰지 않고 OpenClaw 마이그레이션 결과를 미리 보여줘요."
  t276: "따옴표나 이스케이프된 공백이 포함된 채로 붙여 넣은 파일 경로는 자동으로 처리돼요 — 직접 정리할 필요가 없어요."
  t277: "슬래시 명령은 대량 붙여넣기 접기를 절대 일으키지 않아요 — 긴 인자를 가진 /command도 정상 동작해요."
  t278: "인터럽트 모드에서 에이전트 실행 중 입력한 슬래시 명령은 인터럽트 로직을 건너뛰고 즉시 실행돼요."
  t279: "HERMES_DEV=1은 로컬 개발을 위해 컨테이너 모드 감지를 건너뛰어요."
  t280: "각 MCP 서버는 자체 도구 세트(mcp-servername)를 가지며, hermes tools로 독립적으로 켜고 끌 수 있어요."
  t281: "설정의 MCP ${ENV_VAR} 자리 표시자는 서버 실행 시점에 해석돼요 — ~/.hermes/.env의 변수도 포함해요."
  t282: "신뢰된 저장소(NousResearch)의 스킬은 'trusted' 보안 등급을 받고, 커뮤니티 스킬은 추가 검사를 거쳐요."
  t283: "~/.hermes/skills/.hub/quarantine/의 스킬 격리 구역에는 보안 리뷰를 기다리는 스킬이 보관돼요."
  t284: "/steer <prompt>는 다음 도구 호출 뒤에 메모를 끼워 넣어요 — 중단 없이 작업 도중 방향을 조정할 수 있어요."
  t285: "/goal <text>는 지속적인 Ralph 루프 목표를 설정해요 — 판정자가 완료라고 할 때까지 Hermes가 턴을 계속 이어가요."
  t286: "/snapshot create [label]은 Hermes 설정의 전체 상태 스냅샷을 저장하고, /snapshot restore <id>로 나중에 되돌릴 수 있어요."
  t287: "/copy [N]은 마지막 어시스턴트 응답을 클립보드에 복사하고, 숫자를 주면 뒤에서 N번째 응답을 복사해요."
  t288: "/redraw는 UI 전체를 다시 그려서 tmux 크기 조정이나 마우스 선택 잔상으로 생긴 터미널 어긋남을 고쳐요."
  t289: "/agents(별칭 /tasks)는 현재 세션의 활동 중인 에이전트와 실행 중인 백그라운드 작업을 보여줘요."
  t290: "/footer는 최종 답변에 모델, 컨텍스트 %, cwd를 보여주는 게이트웨이 푸터를 켜고 꺼요."
  t291: "/busy queue|steer|interrupt는 Hermes가 작업 중일 때 Enter를 누르면 어떻게 동작할지 정해요."
  t292: "Telegram DM에서 /topic은 사용자가 관리하는 다중 세션 토픽 모드를 켜요 — /topic <id>로 이전 세션을 바로 복원할 수 있어요."
  t293: "/approve session|always는 대기 중인 위험 명령을 선택한 신뢰 범위로 실행하고, /deny는 거부해요."
  t294: "/restart는 진행 중인 실행을 마무리한 뒤 게이트웨이를 안전하게 재시작하고, 복구되면 요청자에게 알려줘요."
  t295: "/kanban boards switch <slug>로 채팅 안에서 활성 다중 프로젝트 칸반 보드를 바꿀 수 있어요."
  t296: "/reload는 실행 중인 세션에 ~/.hermes/.env를 다시 불러와요 — 재시작 없이 새 API 키를 적용할 수 있어요."
  t297: "no_agent=True로 만든 cronjob은 예약된 시간에 스크립트를 실행하고 stdout을 그대로 전달해요 — 토큰도 LLM도 쓰지 않아요."
  t298: "크론 스크립트의 stdout이 비어 있으면 조용히 넘어가요 — 아무것도 전달되지 않아서 임계값 감시용으로 딱 맞아요."
  t299: "HERMES_CRON_MAX_PARALLEL(기본값 4)은 틱마다 실행되는 크론 작업 수를 제한해서 급증으로 키가 포화되지 않게 해요."
  t300: "게이트웨이 훅은 ~/.hermes/hooks/<name>/ 아래에 HOOK.yaml + handler.py로 두고, 핸들러 이름은 반드시 `handle`이어야 해요."
  t301: "훅 이벤트에는 gateway:startup, session:start, agent:step, 그리고 command:* 와일드카드 구독이 있어요."
  t302: "~/.hermes/BOOT.md에 체크리스트를 넣어 두면 gateway:startup 훅이 부팅마다 일회성 에이전트로 실행해요."
  t303: "hermes curator run --dry-run은 큐레이터가 무엇을 보관하거나 통합할지 아무것도 바꾸지 않고 미리 보여줘요."
  t304: "hermes curator pin <skill>은 스킬을 자동 보관과 에이전트의 skill_manage 도구 양쪽에서 완전히 보호해요."
  t305: "hermes curator rollback은 실행 전 스냅샷에서 스킬을 복원해요 — 백업은 skills/.curator_backups/ 아래에 있어요."
  t306: "hermes auth reset <provider> [target]은 자격 증명 풀 전체, 또는 인덱스·id·라벨로 지정한 자격 증명 하나의 쿨다운과 소진 플래그를 지워요."
  t307: "credential_pool_strategies.<provider>: round_robin은 기본값 fill_first 대신 키를 균등하게 순환해요."
  t308: "도구별 use_gateway: true는 web, image, tts, browser를 Nous 구독으로 라우팅해요 — 추가 키가 필요 없어요."
  t309: "provider_routing.data_collection: deny는 OpenRouter에서 데이터를 저장하는 제공자를 제외해요."
  t310: "provider_routing.require_parameters: true는 요청의 모든 파라미터를 지원하는 제공자에게만 라우팅해요."
  t311: "HERMES_TUI_RESUME=1은 실행 시 가장 최근 TUI 세션에 자동으로 다시 연결해요 — SSH가 끊긴 뒤에 유용해요."
  t312: "HERMES_TUI_THEME=light|dark|<hex>는 COLORFGBG를 설정하지 않는 터미널에서 TUI 테마를 강제로 지정해요."
  t313: "TUI에서 Ctrl+G 또는 Ctrl+X Ctrl+E를 누르면 긴 여러 줄 프롬프트를 위해 입력 버퍼가 $EDITOR로 열려요."
  t314: "TUI는 LaTeX를 인라인으로 렌더링해요 — $E=mc^2$가 원본 TeX 대신 유니코드 수식으로 표시돼요."
  t315: "hermes dashboard는 127.0.0.1:9119에서 로컬 웹 UI를 실행해요 — 데이터가 localhost 밖으로 전혀 나가지 않아요."
  t316: "hermes dashboard는 xterm.js와 WebSocket PTY를 통해 브라우저 안에 전체 Hermes TUI를 내장해요."
  t317: "~/.hermes/dashboard-themes/에 팔레트 색 두 개를 담은 YAML을 넣으면 대시보드 전체의 스킨이 바뀌어요."
  t318: "대시보드 플러그인은 드롭인 방식이에요: ~/.hermes/dashboard-plugins/에 manifest.json + JS 번들만 넣으면 돼요 — npm 빌드가 필요 없어요."
  t319: "대시보드 테마의 layoutVariant: cockpit은 플러그인이 sidebar 슬롯으로 채울 수 있는 260px 왼쪽 레일을 추가해요."
  t320: "display.tool_progress_command: true는 메시징 플랫폼에서 /verbose를 사용할 수 있게 해요. 기본값은 CLI 전용이에요."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result는 백그라운드 작업이 끝날 때만 알려요 (concise/all/error/off와 비교해 보세요)."
  t322: "HERMES_WRITE_SAFE_ROOT는 write_file/patch를 지정한 디렉터리 접두사로 제한해요. 여러 경로는 os.pathsep(: 또는 ;)로 구분해요."
  t323: "HERMES_IGNORE_RULES는 AGENTS.md, SOUL.md, .cursorrules, 메모리, 미리 불러온 스킬의 자동 주입을 건너뛰어요."
  t324: "HERMES_ACCEPT_HOOKS는 config.yaml에 선언된 새 셸 훅을 TTY 프롬프트 없이 자동으로 승인해요."
  t325: "auxiliary.goal_judge.model은 /goal 판정을 저렴하고 빠른 모델로 라우팅해서 루프 비용을 거의 0에 가깝게 유지해요."
  t326: "체크포인트는 파일이 50,000개를 넘는 디렉터리를 건너뛰어 거대한 모노레포에서 느린 git 작업을 피해요."
  t327: "tts.provider: piper는 44개 언어의 로컬 음성 합성을 CPU에서 실행해요 — 음성은 ~/.hermes/cache/piper-voices/에 자동으로 다운로드돼요."
  t328: "tts.providers.<name>.type: command는 {input_path}와 {output_path} 플레이스홀더로 어떤 CLI 음성 합성 엔진이든 연결해요."
  t329: "API_SERVER_ENABLED=true는 게이트웨이와 함께 OpenAI 호환 엔드포인트를 실행해서 Open WebUI와 LibreChat에 쓸 수 있어요."
  t330: "GATEWAY_PROXY_URL은 분리 구성을 실행해요: 플랫폼 I/O는 로컬에서, 에이전트 작업은 원격 API 서버에 위임해요."
  t331: "MATRIX_DEVICE_ID는 E2EE용 장치 ID를 고정해요 — 없으면 시작할 때마다 키가 바뀌어 과거 메시지 복호화가 깨져요."
  t332: "TELEGRAM_WEBHOOK_URL을 설정하면 TELEGRAM_WEBHOOK_SECRET이 반드시 필요해요 — openssl rand -hex 32로 생성하세요."
  t333: "batch_runner.py --resume은 완료된 프롬프트를 텍스트 내용으로 매칭해서 데이터셋 순서가 바뀌어도 끝난 작업을 다시 실행하지 않아요."
  t334: "/new는 그 자리에서 새 세션을 시작해요 (별칭 /reset) — 새 세션 ID, 깨끗한 기록, CLI는 그대로 열려 있어요."
  t335: "/clear는 터미널 화면을 지우고 동시에 새 세션을 시작해요 — 한 번에 시각적으로 초기화하는 단축키예요."
  t336: "/history는 CLI를 벗어나지 않고 현재 대화를 바로 출력해요 — 빠르게 다시 읽어볼 때 유용해요."
  t337: "/save는 세션을 끝내지 않고 현재 대화를 디스크에 저장해요."
  t338: "/status는 세션 정보를 한눈에 보여줘요: ID, 제목, 모델, 토큰 사용량, 경과 시간."
  t339: "/image <path>는 붙여넣기나 드래그 앤 드롭 없이 다음 프롬프트에 로컬 이미지 파일을 첨부해요."
  t340: "/platforms는 채팅 안에서 바로 게이트웨이와 메시징 플랫폼 연결 상태를 보여줘요."
  t341: "/commands는 전체 슬래시 명령 + 설치된 스킬 목록을 페이지 단위로 보여줘요 — 탭 완성이 없는 플랫폼에서 유용해요."
  t342: "/toolsets는 사용 가능한 모든 도구 세트를 나열해서 -t/--toolsets에 무엇을 넘길 수 있는지 알려줘요."
  t343: "/voice tts는 음성 합성 전용 모드를 전환해요 — 에이전트는 소리로 답하지만 프롬프트는 계속 타이핑해요."
  t344: "/reload-skills는 ~/.hermes/skills/를 다시 스캔해서 세션을 재시작하지 않고도 드롭인 스킬이 나타나게 해요."
  t345: "/indicator kaomoji|emoji|unicode|ascii는 에이전트가 실행 중일 때 표시되는 TUI 작업 표시기 스타일을 골라요."
  t346: "/debug는 지원 번들(시스템 정보 + 로그)을 업로드하고 공유 가능한 링크를 돌려줘요 — 채팅에서도 동작해요."
  t347: "hermes -z \"<prompt>\"는 가장 순수한 일회성 실행이에요: stdout에 최종 답변만 출력하고 다른 건 없어요 — 스크립트 파이프에 이상적이에요."
  t348: "hermes chat --pass-session-id는 세션 ID를 시스템 프롬프트에 주입해서 에이전트가 자기 세션을 참조할 수 있게 해요."
  t349: "hermes chat --image path/to/pic.png는 별도 업로드 단계 없이 단일 -q 질의에 로컬 이미지를 첨부해요."
  t350: "hermes chat --ignore-user-config는 활성 사용자 설정을 건너뛰어요 — 재현 가능한 버그 리포트와 CI 실행에 좋아요."
  t351: "hermes chat --source tool은 프로그램에서 실행한 채팅에 태그를 붙여 hermes sessions list를 어지럽히지 않게 해요."
  t352: "hermes dump --show-keys는 마스킹된 API 키 지문을 포함해서 더 깊은 지원 디버깅에 도움이 돼요."
  t353: "hermes sessions rename <ID> \"new title\"은 과거 세션의 이름을 바꾸고, hermes sessions delete <ID>는 세션 하나를 삭제해요."
  t354: "hermes import는 전체 Hermes 백업 zip을 복원해요. 세션 JSON/JSONL 내보내기는 대시보드의 Sessions 페이지에서 가져와요."
  t355: "hermes fallback은 fallback_model 체인을 대화형으로 관리해요 — config.yaml을 직접 편집할 필요가 없어요."
  t356: "hermes pairing은 DM 페어링 토큰을 교체해요 — 교체 후 처음 메시지를 보낸 사람이 봇 접근 권한을 얻어요."
  t357: "hermes setup은 처음 사용하는 분을 제공자, 키, 플랫폼 연결까지 하나의 대화형 흐름으로 안내해요."
  t358: "hermes status --deep은 모든 구성 요소에 대해 전체 상태 점검을 실행해요. 그냥 hermes status는 빠른 요약 보기예요."
  t359: "HERMES_AGENT_TIMEOUT=0은 실행 중인 에이전트에 대한 게이트웨이 비활성 종료를 비활성화해요 — 긴 리서치 작업에 쓰세요."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1은 ./.hermes/plugins/의 저장소 로컬 플러그인을 자동으로 불러와요 — 설계상 신뢰 확인을 거쳐요."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1은 patch와 write_file의 '읽은 후 파일이 변경됨' 보호를 꺼요."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true는 웹 도구가 localhost와 사설 네트워크에 접근할 수 있게 해요 — 게이트웨이 모드에서는 기본적으로 꺼져 있어요."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2는 프로필별 첫 실행 시 선택 카탈로그의 추가 스킬을 자동으로 설치해요."
  t364: "HERMES_BUNDLED_SKILLS는 사용자 지정 번들 스킬 트리를 가리켜요 — Homebrew와 Nix 패키징에서 사용해요."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1은 모든 API 요청 페이로드를 로그 파일 대신 stdout으로 출력해요."
  t366: "HERMES_OAUTH_TRACE=1은 제공자 인증 디버깅을 위해 마스킹된 OAuth 토큰 교환과 갱신 시도를 기록해요."
  t367: "HERMES_STREAM_RETRIES(기본값 3)는 일시적인 네트워크 오류 시 스트림 중간 재연결 시도 횟수를 정해요."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false는 바쁜 에이전트에 사용자가 메시지를 보낼 때 나오는 ⚡/⏳/⏩ 확인 메시지를 꺼요."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL(기본값 180s)은 긴 턴에서 게이트웨이가 진행 상황을 얼마나 자주 알릴지 정해요."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT(기본값 900s)은 /restart가 강제 종료 전에 진행 중인 실행을 기다리는 최대 시간을 정해요."
  t371: "HERMES_CHECKPOINT_TIMEOUT(기본값 30s)은 파일 시스템 체크포인트 생성 시간을 제한해요 — 거대한 모노레포에서는 늘리세요."
  t372: "config.yaml의 image_gen.model은 FAL 모델을 골라요: flux-2/klein, gpt-image-2, nano-banana-pro 등이 있어요."
  t373: "image_gen.provider는 이미지 생성을 기본값 대신 플러그인(OpenAI Images, Codex, FAL)으로 라우팅해요."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY는 비전 분석을 어떤 OpenAI 호환 엔드포인트로든 연결해요."
  t375: "security.tirith_fail_open: false는 tirith 스캐너 자체가 오류를 내면 Hermes가 명령을 차단하게 해요."
  t376: "TIRITH_FAIL_OPEN 환경 변수는 tirith_fail_open 설정을 덮어써요 — config.yaml을 편집하지 않고 빠르게 전환할 수 있어요."
  t377: "--source tool 채팅은 기본적으로 hermes sessions list에서 제외돼요 — 보려면 --source를 명시적으로 지정하세요."
  t378: "세션 ID는 타임스탬프로 시작해요 (20250305_091523_abcd). 그래서 ls와 jq에서 자연스럽게 정렬돼요."
  t379: "API_SERVER_MODEL_NAME은 /v1/models에 표시되는 모델 이름을 바꿔요 — 다중 프로필 Open WebUI 구성에 꼭 필요해요."
  t380: "대시보드 플러그인은 /dashboard-plugins/<name>/에서 제공돼요 — 파일을 ~/.hermes/dashboard-plugins/에 넣으세요."
