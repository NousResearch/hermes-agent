  goal_cleared:     "✓ Objetivo limpo."
  no_active_goal:   "Nenhum objetivo ativo."
  config_read_failed: "⚠️ Não foi possível ler config.yaml: {error}"
  config_save_failed: "⚠️ Não foi possível salvar config: {error}"

  # Saída do comando /model -- mostrado após uma troca de modelo ou ao listar modelos.
  # Nomes de provedores, IDs de modelos, strings de capacidade e figuras de custo NÃO
  # são traduzidos -- são identificadores/valores, não prosa. Apenas os rótulos
  # ("Provedor:", "Contexto:", etc.) e as linhas de ajuda/rodapé são localizados.
  model:
    error_prefix:           "Erro: {error}"
    switched:               "Modelo alterado para `{model}`"
    provider_label:         "Provedor: {provider}"
    context_label:          "Contexto: {tokens} tokens"
    max_output_label:       "Saída máxima: {tokens} tokens"
    cost_label:             "Custo: {cost}"
    capabilities_label:     "Capacidades: {capabilities}"
    prompt_caching_enabled: "Cache de prompt: ativado"
    warning_prefix:         "Aviso: {warning}"
    saved_global:           "Salvo em config.yaml (`--global`)"
    session_only_hint:      "_(apenas nesta sessão — adicione `--global` para persistir)_"
    current_label:          "Atual: `{model}` em {provider}"
    current_tag:            " (atual)"
    more_models_suffix:     " (+{count} a mais)"
    usage_switch_model:     "`/model <nome>` — alterar modelo"
    usage_switch_provider:  "`/model <nome> --provider <slug>` — alterar provedor"
    usage_persist:          "`/model <nome> --global` — persistir"

  agents:
    header:                "🤖 **Agentes e Tarefas Ativos**"
    active_agents:         "**Agentes ativos:** {count}"
    this_chat:             " · este chat"
    more:                  "... e {count} a mais"
    running_processes:     "**Processos em segundo plano em execução:** {count}"
    async_jobs:            "**Trabalhos assíncronos do Gateway:** {count}"
    background_delegations: "**Delegações em segundo plano:** {count}"
    none:                  "Nenhum agente ativo ou tarefas em execução."
    state_starting:        "iniciando"
    state_running:         "em execução"

