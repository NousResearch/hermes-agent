# Hermes static-message catalog -- Português do Brasil
#
# Catálogo de mensagens estáticas do Hermes. Apenas mensagens estáticas 
# voltadas para o usuário dos prompts de aprovação do CLI e algumas 
# respostas de comandos slash do gateway residem aqui. Saídas geradas 
# pelo agente, linhas de log, tracebacks de erro, saídas de ferramentas 
# e descrições de comandos slash permanecem em inglês e NÃO são 
# traduzidas -- veja agent/i18n.py para racional do escopo.
#
# As chaves são caminhos pontilhados; o aninhamento abaixo é apenas 
# para legibilidade. Os valores podem conter tokens {placeholder} para 
# substituição str.format. Ao adicionar uma nova chave, adicione-a em 
# TODOS os arquivos de locale (en/zh/ja/de/es/fr/tr/uk/pt-br) no mesmo commit --
# tests/agent/test_i18n.py verifica a paridade do catálogo.

approval:
  # Prompt de aprovação do CLI -- mostrado quando um comando perigoso precisa de revisão do usuário.
  dangerous_header: "⚠️  COMANDO PERIGOSO: {description}"
  choose_long:     "      [o]uma vez  |  [s]essão  |  [a]sempre  |  [d]negar"
  choose_short:    "      [o]uma vez  |  [s]essão  |  [d]negar"
  prompt_long:     "      Escolha [o/s/a/D]: "
  prompt_short:    "      Escolha [o/s/D]: "
  choose_smart_deny: "      [o]uma vez  |  [d]negar"
  prompt_smart_deny: "      Escolha [o/D]: "
  smart_deny_once_inputs: "o,uma vez,um vez"
  smart_deny_deny_inputs: "d,neg,negar"
  timeout:         "      ⏱ Tempo esgotado - negando comando"
  allowed_once:    "      ✓ Permitido uma vez"
  allowed_session: "      ✓ Permitido para esta sessão"
  allowed_always:  "      ✓ Adicionado à lista de permissões permanentes"
  denied:          "      ✗ Negado"
  cancelled:       "      ✗ Cancelado"
  blocklist_message: "Este comando está na lista de bloqueio incondicional e não pode ser aprovado."

gateway:
