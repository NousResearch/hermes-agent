    routing_fallback_warning: "⚠ auxiliary.background_review.provider='{task_provider}' (modelul '{task_model}') nu a putut fi rutat ({error}); revenirea la {provider}/{model}"
    reasoning_effort_warning: "⚠ auxiliary.background_review.reasoning_effort='{effort}' nu are efect în timp ce modelul de revizuire nu este modelul principal"
    memory_op_line: "{label} {glyph} {preview}"
    skill_patched_verbose: "📝 Abilitatea „{name}” a fost corectată: „{old}” → „{new}”"
    skill_changed_verbose: "📝 Abilitatea „{name}” {verb}: {description}"
    skill_message_verbose: "📝 {message}"
    skill_action: "Skill {action}"
    label_updated: "{label} actualizat"
    skill_result: "Abilitatea „{name}” {verb}{path}"
    skill_verb:
      created: "creat"
      rewritten: "rescrisă"
      patched: "petic"
      written: "scris"
      removed: "îndepărtat"
      deleted: "șters"
    label:
      skill: "Îndemânare"
      memory: "Memorie"
      user: "Profil de utilizator"
    summary_cli: "💾 Recenzie de auto-îmbunătățire: {summary}"
    summary_callback: "💾 Revizuire de auto-îmbunătățire: {summary}"
    aux_failure_label: "revizuire de fundal"
  notice:
    uncompressed_context_overflow: "⚠️ Contextul sesiunii (~{tokens} tokeni) depășește fereastra de context a modelului (~{context_length} tokeni) cu compresia dezactivată (compression.enabled: false). Folosește /compact pentru a comprima istoricul sau activează compresia în config.yaml."
explainer:
  no_reply_prefix: "⚠️ Niciun răspuns:"
  empty_response: "{model} nu a produs un răspuns de data aceasta, chiar și după reîncercări. Trimite `continue` pentru a încerca din nou sau schimbă modelele cu /model."
  exit:
    all_retries_exhausted_no_response: "furnizorul de modele nu a răspuns după toate încercările. Trimite /retry sau schimbă modelele cu /model."
    partial_stream_recovery: "Streamingul s-a oprit devreme și a fost recuperat doar un răspuns parțial. Trimite `continue` pentru a relua de unde s-a oprit."
    fallback_prior_turn_content: "nu a fost produs niciun conținut nou în acest rînd; arătând contextul anterior recuperat. Trimite `continue` pentru a reîncerca."
    redirect_restart_limit_exceeded: "cererea a fost anulată printr-o nouă corecție la fiecare încercare, așa că tura sa oprit în loc să reîncerce pentru totdeauna. Ultima corectare este pusă în coadă ca următorul mesaj."
    rebuilt_restart_limit_exceeded: "fiecare furnizor din lanțul de rezervă a continuat să eșueze, așa că tura sa oprit în loc să reîncerce pentru totdeauna. Trimite `continue` sau schimbă furnizorul."
    budget_exhausted: "bugetul de iterație/cost pe tură a fost epuizat înainte de un răspuns final. Trimite `continue` pentru a continua."
    ollama_runtime_context_too_small: "fereastra de context a modelului local era prea mică pentru a fi finalizată. Mărește dimensiunea contextului sau folosește un model mai mare."
    pending_tool_result: "runda s-a oprit în timp ce un rezultat al instrumentului era încă în așteptare și modelul nu a produs niciun text ulterior. Trimite `continue` pentru a-l lăsa să rezume."
    interrupted_during_api_call: "cererea a fost întreruptă la mijlocul apelului înainte de a primi un răspuns. Trimite `continue` pentru a reîncerca."
    max_iterations_reached: "limita maximă de iterație a instrumentului a fost atinsă înainte de un răspuns final. Trimite `continue` pentru a continua sau ridică `max_iterations`."
    error_near_max_iterations: "a apărut o eroare în apropierea limitei de iterație înainte de un răspuns final. Verifică rezultatul instrumentului de mai sus, apoi trimite `continue`."
    repeated_outer_errors: "turnul a continuat să eșueze cu erori repetate și a fost oprit devreme în loc să reîncerce pentru totdeauna. Verifică erorile de mai sus, apoi trimite `continue` pentru a reîncerca."
  persistence:
    compression: "turnul a fost oprit deoarece un alt proces comprima această sesiune. Mesajul dvs. ar trebui să fie deja salvat - te rugăm să-l trimite din nou după finalizarea compresiei."
    compression_closed: "turnul a fost oprit deoarece această sesiune a fost rotită prin compresia contextului și continuarea ei live nu a putut fi adoptată. Spațiul de stocare în sine este sănătos - reîmprospătează clientul (sau începe o nouă tură), astfel încât să preia noul ID de sesiune, apoi trimite mesajul din nou."
    turn_lease: "runda a fost oprită deoarece un alt proces Hermes a preluat această sesiune. Răspunsul dvs. nu a fost salvat — așteaptă ca celălalt proces să se termine, apoi trimite mesajul din nou."
    session_row_missing: "această sesiune a fost ștearsă din stocare în timp ce chatul era încă deschis și Hermes nu a putut să o recreeze, așa că acest mesaj nu a fost salvat. Trimite mesajul din nou; dacă continuă să eșueze, rulează `hermes {profile_arg}doctor`."
    locked: "turnarea a fost oprită deoarece stocarea sesiunii era ocupată (un alt proces Hermes era scris în baza de date de stat). Mesajul dvs. ar trebui să fie deja salvat - te rugăm să-l trimite din nou într-un moment."
    replaced: "fișierul bazei de date de sesiune a fost înlocuit în timp ce Hermes rula, deci acest mesaj nu a fost salvat (o copie este păstrată în {home}/sessions/). Oprește Hermes (`hermes {profile_arg}gateway stop`), rulează `hermes {profile_arg}doctor` — nu `hermes {profile_arg}doctor --fix`, care ar repara fișierul greșit la locul său — apoi pornește-l din nou și trimite mesajul încă o dată. Pașii avansati de recuperare sunt în jurnal."
    deleted_wal: "un alt proces Hermes deține încă o copie veche a jurnalului de scriere anticipată a bazei de date de sesiune, așa că Hermes a încetat să scrie pentru a păstra fișierul în siguranță și acest mesaj nu a fost salvat (o copie este păstrată în {home}/sessions/). Nimic nu se pierde. Ieși din fiecare proces Hermes de pe acest profil (aplicație desktop, `hermes {profile_arg}gateway stop`, tablou de bord, cron), rulează `hermes {profile_arg}doctor` — denumește orice proces care mai deține jurnalul — apoi pornește Hermes din nou și trimite încă o dată mesajul. Nu rulează `doctor --fix` și nu șterge niciun fișier state.db în timp ce rulează. Ghid: {recovery_docs}"
    corrupt: "tura a fost oprită deoarece baza de date de stat a raportat corupție structurală (transcrierea s-ar fi pierdut la repornire). Eliberarea spațiului pe disc nu va ajuta. Opțiuni de recuperare:

      1. Rulează `hermes {profile_arg}doctor --fix`

      2. Oprește gateway-ul, apoi recuperează cu:

      \   hermes {profile_arg}sessions recover --source {db_path} --inspect-only

      \   (dacă raportează recuperabil) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db

      \   — recuperarea captează mai întâi fișierul deteriorat; NU rulează `sqlite3 ... \".recover\"` împotriva live state.db, un sqlite3 vulnerabil CLI îl poate corupe și mai mult

      3. Restaurează dintr-o copie de rezervă în {backups_dir}/

      Apoi trimite mesajul din nou."
    fts_index: "runda a fost oprită deoarece indexul de căutare al sesiunii (FTS5) este corupt și nu a putut fi detașat, așa că acest mesaj nu a fost salvat. Magazinul de mesaje în sine nu este deteriorat: nu rulează instrumente de recuperare și nu restaurează o copie de siguranță. Rulează `hermes {profile_arg}doctor --fix` (sau repornește Hermes, care repară indexul la deschidere), apoi trimite mesajul din nou."
    disk: "Hermes nu a putut salva această conversație pe disc, așa că s-a oprit în loc să vă piardă mesajele. Discul este probabil plin: eliberează spațiu (sau repară permisiunile pe {home}/state.db), apoi trimite mesajul din nou."
    default: "Hermes nu a putut salva această conversație, așa că s-a oprit în loc să vă piardă mesajele. Cauze posibile: unitatea este în afara spațiului sau un alt proces Hermes deține baza de date. Închide alte ferestre Hermes, rulează `hermes {profile_arg}doctor` pentru a verifica stocarea, apoi trimite mesajul din nou."
  file_mutation:
    header: "⚠️ Verificator de mutații de fișiere: {count} editare(e) fișier(e) EȘUAT(e) această tură, în ciuda oricărei formulări de mai sus care ar putea sugera altfel. Rulează `git status` sau `read_file` pentru a confirma ce a aterizat de fapt."
    entry: "• `{path}` — [{tool}] {preview}"
    failed: "a eșuat"
  shared:
    and_more: "• … și {count} mai mult"
    the_model: "Modelul"
tips:
  t001: "/bg <prompt> rulează o sarcină într-o sesiune separată, în timp ce cea actuală rămâne liberă; /btw <question> răspunde la o întrebare secundară despre această conversație fără a o întrerupe."
  t002: "/branch bifurcă sesiunea curentă, astfel încât să poți explora o altă direcție fără a pierde progresul."
  t003: "/compress comprimă manual contextul conversației atunci când lucrurile devin lungi."
  t004: "/rollback listează punctele de control ale sistemului de fișiere — restaurează fișierele modificate de agent în orice stare anterioară."
  t005: "/rollback diff 2 previzualizează ceea ce s-a schimbat de la punctul de control 2 fără a restaura nimic."
  t006: "/rollback 2 src/file.py restaurează un singur fișier dintr-un anumit punct de control."
  t007: "/title „proiectul meu” denumește sesiunea dvs. — reia-o mai târziu cu /resume sau hermes -c."
  t008: "/resume reia de unde ați rămas într-o sesiune numită anterior."
  t009: "/queue <prompt> pune în coadă un mesaj pentru următorul turn fără a-l întrerupe pe cel curent."
  t010: "/undo elimină ultimul schimb de utilizator/asistent din conversație."
  t011: "/retry retrimite ultimul mesaj - util atunci când răspunsul agentului nu a fost corect."
  t012: "/verbose cicluri de afișare a progresului instrumentului: oprit → nou → toate → detaliate."
  t013: "/reasoning mare crește profunzimea gândirii modelului. /reasoning afișează raționamentul."
  t014: "/fast comută procesarea cu prioritate pentru răspunsuri API mai rapide (depende de furnizor)."
  t015: "/yolo omite toate solicitările periculoase de aprobare a comenzii pentru restul sesiunii."
  t016: "/model vă permite să schimbi modelele la mijlocul sesiunii — încearcă sonetul /model sau /model gpt-5."
  t017: "/model --global vă schimbă permanent modelul implicit."
  t018: "/personality pirat stabilește o personalitate distractivă — 14 opțiuni încorporate de la kawaii la Shakespeare."
  t019: "/skin modifică tema CLI — încearcă ares, mono, slate, poseidon sau charizard."
  t020: "/statusbar comută o bară persistentă care arată modelul, simbolurile, procentul de umplere a contextului, costul și durata."
  t021: "/tools dezactivarea browserului elimină temporar instrumentele browserului pentru sesiunea curentă."
  t022: "/browser connect atașează instrumentele de browser la browserul din familia Chromium care rulează prin CDP."
  t023: "/plugins listează pluginurile instalate și starea acestora."
  t024: "/cron gestionează sarcinile programate — configurează solicitări recurente cu livrare pe orice platformă."
  t025: "/reload-mcp reîncarcă la cald configurația serverului MCP fără repornire."
  t026: "/usage arată utilizarea simbolurilor, defalcarea costurilor și durata sesiunii."
  t027: "/insights afișează analize de utilizare pentru ultimele 30 de zile."
  t028: "/paste verifică clipboard-ul pentru o imagine și o atașează la următorul mesaj."
  t029: "/profile arată ce profil este activ și directorul său principal."
  t030: "/config arată configurația dvs. curentă dintr-o privire."
  t031: "/stop oprește toate procesele de fundal care rulează generate de agent."
  t032: "@file:path/to/file.py injectează conținutul fișierului direct în mesajul tău."
  t033: "@file:main.py:10-50 injectează numai liniile 10-50 dintr-un fișier."
  t034: "@folder:src/ injectează o listă de arbore de directoare."
  t035: "@diff injectează modificările tale git neetapăte în mesaj."
  t036: "@staged injectează modificările git în etape (git diff --staged)."
  t037: "@git:5 injectează ultimele 5 comite-uri cu patch-uri complete."
  t038: "@url:https://example.com preia și injectează conținutul unei pagini web."
  t039: "Tastând @ declanșează finalizarea căii sistemului de fișiere — navighează la orice fișier în mod interactiv."
  t040: "Combină mai multe referințe: „Examinează @file:main.py și @file:test.py pentru consecvență”."
  t041: "Alt+Enter inserează o nouă linie pentru introducerea pe mai multe linii. (Terminalul Windows interceptează Alt+Enter — folosește în schimb Ctrl+Enter.)"
  t042: "Ctrl+C întrerupe agentul. Apasă de două ori în 2 secunde pentru a forța ieșirea."
  t043: "Ctrl+Z suspendă Hermes în fundal — rulează fg în shell pentru a relua."
  t044: "Tab acceptă text fantomă cu sugestii automate sau completează automat comenzile oblice."
  t045: "Tastează un mesaj nou în timp ce agentul lucrează pentru a-l întrerupe și redirecționa."
  t046: "Alt+V lipește o imagine din clipboard în conversație."
  t047: "Lipirea a peste 5 linii salvează automat într-un fișier și inserează o referință compactă."
  t048: "hermes -c reia cea mai recentă sesiune CLI. hermes -c „numele proiectului” reia după titlu."
  t049: "hermes -w creează un arbore de lucru git izolat — perfect pentru fluxurile de lucru ale agenților paraleli."
  t050: "hermes -w -q „Remediază problema #42” combină izolarea arborelui de lucru cu o interogare unică."
  t051: "hermes chat -t web,terminal permite numai seturi de instrumente specifice pentru o sesiune concentrată."
  t052: "hermes chat -s github-pr-workflow preîncarcă o abilitate la lansare."
  t053: "hermes chat -q „interogare” rulează o singură interogare non-interactivă și iese."
  t054: "hermes chat --max-turns 1000 depășește limita implicită de 500 de iterații pe tură."
  t055: "hermes chat --checkpoints permite instantanee ale sistemului de fișiere înainte de fiecare schimbare distructivă a fișierului."
  t056: "hermes --yolo ocolește toate solicitările periculoase de aprobare a comenzii pentru întreaga sesiune."
  t057: "hermes chat --source telegram etichetează sesiunea pentru filtrare în lista de sesiuni hermes."
  t058: "hermes -p chatul de lucru rulează sub un anumit profil fără a modifica implicit."
  t059: "hermes doctor --remediază diagnosticele și reparațiile automate și problemele de dependență."
  t060: "Dump-ul hermes emite un rezumat compact de configurare - excelent pentru rapoartele de erori."
  t061: "hermes set de configurare KEY VALUE direcționează automat secretele către .env și orice altceva către config.yaml."
  t062: "hermes config edit deschide config.yaml în editorul dvs. implicit."
  t063: "hermes verifică configurația scanează pentru opțiuni de configurare lipsă sau învechite."
  t064: "Răsfoirea sesiunilor hermes deschide un selector interactiv de sesiuni cu căutare."
  t065: "Statisticile sesiunilor hermes arată numărul de sesiuni în funcție de platformă și dimensiunea bazei de date."
  t066: "hermes sesiunile tăiate --mai vechi de 30 curăță sesiunile vechi."
  t067: "hermes skill search react --source skills-sh caută în directorul public skills.sh."
  t068: "Verificarea competențelor hermes scanează abilitățile hub instalate pentru actualizări în amonte."
  t069: "Aptitudinile hermes atinge adaugă myorg/skills-repo adaugă o sursă de abilități GitHub personalizată."
  t070: "hermes export snapshot abilități setup.json exportă configurația abilităților pentru backup sau partajare."
  t071: "hermes mcp add github --command npx adaugă servere mcp din linia de comandă."
  t072: "hermes mcp-serve rulează hermes ca server mcp pentru alți agenți."
  t073: "hermes autentificare vă permite să adaugi mai multe chei API pentru rotația pool-ului de acreditări."
  t074: "hermes completare bash >> ~/.bashrc permite completarea filelor pentru toate comenzile și profilurile."
  t075: "hermes înregistrează -f urmărește agent.log în timp real. --level AVERTISMENT --deoarece 1h filtrează ieșirea."
  t076: "Backup-ul hermes creează o copie de rezervă zip a întregului director de acasă hermes."
  t077: "hermes profile create coder creează un profil izolat care devine propria sa comandă."
  t078: "hermes profile create work --clone copiază configurația curentă și cheile într-un profil nou."
  t079: "Actualizarea hermes sincronizează automat abilitățile noi cu TOATE profilurile."
  t080: "Instalarea gateway-ului hermes configurează hermes ca serviciu de sistem (systemd/launchd)."
  t081: "Configurarea memoriei hermes vă permite să configurezi un furnizor extern de memorie (Honcho, Mem0 etc.)."
  t082: "hermes webhook subscribe creează rute webhook bazate pe evenimente cu validare HMAC."
  t083: "Economisește bani: instrumentele hermes dezactivează instrumentele neutilizate, configurația abilităților hermes reduce abilitățile."
  t084: "/reasoning scăzut sau /reasoning reduce profunzimea gândirii sub valoarea implicită (medie) - răspunsuri mai rapide, mai ieftine."
  t085: "Modelele hermes direcționează sarcinile de viziune, compresie și auxiliare către modele mai ieftine — reduce costul simbolului de fundal cu 85%+, fără a modifica modelul principal de chat."
  t086: "Setează display.bell_on_complete: true în config.yaml pentru a auzi un sonerie când sarcinile lungi se termină."
  t087: "Setează afișarea.streaming: adevărat pentru a vedea tokenii care apar în timp real pe măsură ce modelul este generat."
  t088: "Setează display.show_reasoning: adevărat pentru a urmări raționamentul din lanțul de gândire al modelului."
  t089: "Setează display.compact: true pentru a reduce spațiul alb în ieșire pentru informații mai dense."
  t090: "Setează display.busy_input_mode: coada pentru a pune în coadă mesajele în loc să întrerupi agentul sau direcționează pentru a le injecta la mijlocul rulării prin /steer."
  t091: "Setează display.resume_display: minim pentru a sări peste rezumatul complet al conversației la reluarea sesiunii."
  t092: "Setează compresie.prag: 0,50 pentru a controla când se declanșează compresia automată (implicit: 50% din context)."
  t093: "Setează agent.max_turns: 1000 pentru a permite agentului să facă mai mulți pași de apelare a uneltelor pe tură."
  t094: "Setează file_read_max_chars: 200000 pentru a crește conținutul maxim pentru fiecare apel read_file."
  t095: "Setează approvals.mode: inteligent pentru a permite unui LLM să aprobe automat comenzile sigure și să le respingă automat pe cele periculoase."
  t096: "Setează fallback_model în config.yaml pentru a trece automat la un furnizor de rezervă."
  t097: "Setează privacy.redact_pii: true pentru a codifica codurile de utilizator și numerele de telefon înainte de a trimite la LLM."
  t098: "Setează browser.headed: true pentru a urmări fereastra locală Chromium în timp ce agentul navighează."
  t099: "Setează worktree: true în config.yaml pentru a crea întotdeauna un git worktree (la fel ca hermes -w)."
  t100: "Setează security.website_blocklist.enabled: true pentru a bloca anumite domenii din instrumentele web."
  t101: "Setează cron.wrap_response: false pentru a furniza rezultatul agentului brut fără antetul/subsolul cron."
  t102: "HERMES_TIMEZONE suprascrie fusul orar al serverului cu orice șir de fus orar IANA."
  t103: "Înlocuirea variabilelor de mediu funcționează în config.yaml: folosește sintaxa ${VAR_NAME}."
  t104: "Comenzile rapide din config.yaml rulează comenzile shell instantaneu, fără nicio utilizare a simbolurilor."
  t105: "Personalitățile personalizate pot fi definite în config.yaml sub agent.personalities."
  t106: "provider_routing controlează OpenRouter sortarea, lista albă și lista neagră a furnizorilor."
  t107: "execute_code rulează scripturi Python care apelează instrumentele Hermes în mod programatic - rezultatele rămân în afara contextului."
  t108: "delegate_task generează până la 10 sub-agenți concurenți în mod implicit (delegation.max_concurrent_children) cu contexte izolate pentru lucru paralel."
  t109: "web_extract funcționează pe URL-uri PDF - transmite orice link PDF și se convertește în markdown."
  t110: "search_files are suport ripgrep și este mai rapid decât grep - folosește-l în loc de terminal grep."
  t111: "patch-ul folosește 9 strategii de potrivire neclară, astfel încât diferențele minore de spații albe nu vor întrerupe editările."
  t112: "patch acceptă formatul V4A pentru editări în bloc de mai multe fișiere într-un singur apel."
  t113: "read_file sugerează nume de fișiere similare atunci când un fișier nu este găsit."
  t114: "read_file auto-deduplicates — recitirea unui fișier neschimbat returnează un stub ușor."
  t115: "Setează browser.user_data_dir la un folder pentru a păstra un profil Chromium persistent, astfel încât conectările la site să supraviețuiască între sesiuni."
  t116: "browser.chromium_args adaugă steaguri Chromium suplimentare la sesiunile de browser locale, de exemplu --lang=de."
  t117: "image_generate creează imagini cu FLUX 2 Pro și upscaling automat de 2x."
  t118: "text_to_speech convertește textul în audio — este redat ca bule de voce pe Telegram."
  t119: "send_message poate ajunge la orice platformă de mesagerie conectată din cadrul unei sesiuni."
  t120: "Instrumentul todo ajută agentul să urmărească sarcini complexe în mai mulți pași în timpul unei sesiuni."
  t121: "session_search efectuează căutarea textului integral în TOATE conversațiile anterioare."
  t122: "Agentul salvează automat preferințele, corecțiile și informațiile despre mediu în memorie."
  t123: "/moa direcționează un prompt hard prin setul de modele Mixture of Agents configurat."
  t124: "Comenzile terminalului acceptă modul de fundal cu notify_on_complete pentru sarcini de lungă durată."
  t125: "Procesele de fundal ale terminalelor acceptă watch_patterns pentru a alerta pe anumite linii de ieșire."
  t126: "Instrumentul terminal acceptă 6 backend-uri: local, Docker, SSH, Modal, Daytona și Singularity."
  t127: "Fiecare profil primește propria configurație, chei API, memorie, sesiuni, abilități și joburi cron."
  t128: "Numele profilurilor devin comenzi shell — „hermes profile create coder” creează comanda „coder”."
  t129: "hermes profile export coder -o backup.tar.gz creează o arhivă portabilă de profil."
  t130: "Dacă două profiluri partajează accidental un token bot, a doua poartă este blocată cu o eroare clară."
  t131: "Sesiunile generează automat titluri descriptive după primul schimb - nu este necesară denumirea manuală."
  t132: "Titlurile sesiunii acceptă descendență: „proiectul meu” → „proiectul meu #2” → „proiectul meu #3”."
  t133: "La ieșire, Hermes imprimă o comandă de reluare cu ID de sesiune și statistici."
  t134: "hermes exportă sesiuni backup.jsonl exportă toate sesiunile pentru backup sau analiză."
  t135: "hermes -r SESSION_ID reia orice anumită sesiune anterioară după ID-ul său."
  t136: "Memoria este un instantaneu înghețat — modificările apar în promptul de sistem numai la următoarea începere a sesiunii."
  t137: "Intrările de memorie sunt scanate automat pentru modele prompte de injecție și exfiltrare."
  t138: "Agentul are două depozite de memorie: note personale (~2200 caractere) și profil utilizator (~1375 caractere)."
  t139: "Corecțiile pe care le oferă agentului (\"nu, fă-o așa\") sunt adesea salvate automat în memorie."
  t140: "Peste 80 de abilități combinate care acoperă github, creație, mlops, productivitate, cercetare și multe altele."
  t141: "Fiecare abilitate instalată devine automat o comandă oblică - tastează / pentru a le vedea pe toate."
  t142: "hermes instalează competențe oficial/securitate/1parolă instalează competențe opționale din depozit."
  t143: "Abilitățile se pot limita la anumite platforme de sistem de operare - unele se încarcă numai pe macOS sau Linux."
  t144: "skills.external_dirs din config.yaml vă permite să încarci competențe din directoare personalizate."
  t145: "Agentul își poate crea propriile abilități ca memorie procedurală folosind skill_manage."
  t146: "/plan scrie un plan de implementare de reducere la .hermes/plans/ fără a executa nimic."
  t147: "Joburile Cron pot atașa competențe: hermes cron add --skill blogwatcher „Verifică postări noi”."
  t148: "Țintele de livrare Cron includ telegram, discord, slack, e-mail, sms și peste 12 platforme."
  t149: "Dacă un răspuns cron începe cu [SILENT], livrarea este suprimată - utilă doar pentru monitorizarea sarcinilor."
  t150: "Cron acceptă întârzieri relative (30 m), intervale (la fiecare 2 ore), expresii cron și marcaje de timp ISO."
  t151: "Lucrările Cron rulează în sesiuni de agent complet noi — solicitările trebuie să fie autonome."
  t152: "Modul Voce funcționează cu zero taste API dacă este instalat mai rapid-whisper (vorbire locală gratuită în text)."
  t153: "Cinci furnizori TTS disponibili: Edge TTS (gratuit), ElevenLabs, OpenAI, NeuTTS (gratuit local), MiniMax."
  t154: "/voice activat activează modul voce în CLI. Ctrl+B comută înregistrarea apăsare și vorbire."
  t155: "Streamingul TTS redă propozițiile pe măsură ce le generează - nu așteaptă răspunsul complet."
  t156: "Mesajele vocale de pe Telegram, Discord, WhatsApp și Slack sunt transcrise automat."
  t157: "Hermes rulează pe 21 de platforme de mesagerie: Telegram, Discord, Slack, WhatsApp, Signal, e-mail, Microsoft IQRC, e-mail, Microsoft IQQXZ, e-mail si mai mult."
  t158: "Instalarea gateway-ului hermes îl configurează ca un serviciu de sistem care pornește la pornire."
  t159: "DingTalk folosește modul Stream - nu este nevoie de webhook-uri sau URL-uri publice."
  t160: "BlueBubbles aduce iMessage la Hermes printr-un server local macOS."
  t161: "Rutele Webhook acceptă validarea HMAC, limitarea ratei și filtrarea evenimentelor."
  t162: "Serverul API expune un punct final compatibil cu OpenAI, compatibil cu Open WebUI și LibreChat."
  t163: "Mod canal vocal Discord: botul se alătură VC, transcrie vorbirea și răspunde."
  t164: "group_sessions_per_user: true oferă fiecărei persoane propria sa sesiune în chat-urile de grup."
  t165: "/sethome marchează un chat ca canal principal pentru livrările cron job."
  t166: "Gateway-ul acceptă timeout-uri bazate pe inactivitate — agenții activi pot rula pe termen nelimitat."
  t167: "Aprobarea comenzii periculoase are 4 niveluri: o dată, sesiune, întotdeauna (listă de permise permanentă), refuză."
  t168: "Modul de aprobare inteligentă folosește un LLM pentru a aproba automat comenzile sigure și pentru a le semnala pe cele periculoase."
  t169: "Protecția SSRF blochează rețelele private, adresele loopback, link-local și metadate în cloud."
  t170: "ID-urile de sesiune sunt prefixate de marca temporală (20250305_091523_abcd), astfel încât sortarea funcționează natural în ls și jq."
  t171: "Subprocesele MCP primesc un mediu filtrat - numai variantele de sistem sigure trec."
  t172: "Fișierele contextuale (.hermes.md, AGENTS.md) sunt scanate de securitate pentru injectare promptă înainte de încărcare."
  t173: "command_allowlist din config.yaml aprobă permanent anumite modele de comandă shell."
  t174: "Contextul se comprimă automat când atinge pragul — amintirile sunt spălate și istoricul rezumat."
  t175: "Bara de stare devine galbenă, apoi portocalie, apoi roșie pe măsură ce contextul se umple."
  t176: "SOUL.md este fișierul de identitate principal al agentului - personalizează-l pentru a modela comportamentul."
  t177: "Hermes încarcă contextul proiectului din .Hermes.md, AGENTS.md, CLAUDE.md sau .cursorules (prima potrivire)."
  t178: "Fișierele subdirectorului AGENTS.md sunt descoperite progresiv pe măsură ce agentul navighează în foldere."
  t179: "Fișierele de context sunt limitate la 20.000 de caractere cu trunchiere inteligentă a capului/cozii."
  t180: "Backend-uri ale browserului: Chromium local, Lightpanda, Browserbase, Browser Use și Firecrawl - plus Camofox ca plugin."
  t181: "Camofox (anti-detecție Firefox) este acum un plugin: hermes plugins instalează camofox."
  t182: "browser_exec rulează mai mulți pași de browser într-un apel Python — navighează, extrage și fă clic împreună."
  t183: "browser.dialog_policy stabilește modul în care sunt gestionate dialogurile din pagina nativă: must_respond (agentul răspunde cu browser_dialog), auto_dismiss sau auto_accept."
  t184: "hermes mcp deschide un selector interactiv de MCP-uri aprobate de Nous pe care le poți instala dintr-o apăsare de tastă."
  t185: "hermes mcp listează serverele mcp aprobate de Nous livrate împreună cu repo."
  t186: "hermes mcp instalează <name> instalează o intrare de catalog, solicită acreditări și vă permite să alegi care dintre instrumentele sale să activezi."
  t187: "Serverele MCP sunt configurate în config.yaml — sunt acceptate atât transporturile stdio, cât și HTTP."
  t188: "Filtrarea instrumentelor pe server: instrumente.include liste albe și instrumente.exclude instrumente specifice listelor negre."
  t189: "Serverele MCP generează automat seturi de instrumente în timpul rulării — instrumentele hermes le pot comuta pe platformă."
  t190: "MCP Suport OAuth: auth: oauth permite autorizarea bazată pe browser cu PKCE."
  t191: "Punctele de control nu au suprasarcină atunci când niciun fișier nu este modificat - activat în mod implicit."
  t192: "Un instantaneu pre-rollback este salvat automat, astfel încât să poți anula anularea."
  t193: "/rollback anulează, de asemenea, rândul conversației, astfel încât agentul nu își amintește modificările anulate."
  t194: "Punctele de control folosesc shadow repo în ~/.hermes/checkpoints/ — .git al proiectului nu este niciodată atins."
  t195: "batch_runner.py procesează sute de solicitări în paralel pentru generarea datelor de antrenament."
  t196: "hermes chat -Q activează modul silențios pentru utilizare programatică — suprimă banner-ul și spinnerul."
  t197: "Salvarea traiectoriei (--save-trajectories) surprinde urmele complete de utilizare a instrumentului pentru antrenamentul modelului."
  t198: "Trei tipuri de plugin: general (instrumente/cârlige), furnizori de memorie și motoare de context."
  t199: "hermes instalează plugin-uri proprietarul/repo instalează pluginuri direct de la GitHub."
  t200: "Furnizori externi de memorie: Honcho, Hindsight, Mem0, OpenViking și multe altele prin instalarea pluginurilor hermes."
  t201: "Cârligele de plugin includ pre/post_tool_call, pre/post_llm_call și transform_terminal_output pentru canonizarea ieșirii."
  t202: "Memorarea promptă în cache (Anthropic) reduce costurile prin reutilizarea prefixelor prompte de sistem din cache."
  t203: "Agentul generează automat titluri de sesiune într-un fir de fundal - impact zero latență."
  t204: "Rutarea inteligentă a modelului poate direcționa automat interogări simple către un model mai ieftin."
  t205: "Comenzile Slash acceptă potrivirea prefixelor: /h se rezolvă în /help, /mod la /model."
  t206: "Tragerea unei căi de fișier în terminal atașează automat imagini sau trimite ca context."
  t207: ".worktreeinclude în rădăcina repo-ului tău listează fișierele gitignorate pentru a le copia în worktrees."
  t208: "hermes acp rulează hermes ca server ACP pentru integrarea VS Code, Zed și JetBrains."
  t209: "Furnizori personalizează: salvează punctele finale numite în config.yaml sub custom_providers."
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT injectează un prompt de sistem care nu a persistat niciodată în istorie."
  t211: "credential_pool_strategies acceptă fill_first, round_robin, minimum_used și rotația aleatorie."
  t212: "hermes auth add nous sau hermes auth add openai-codex setează furnizori bazează pe OAuth."
  t213: "Serverul API acceptă atât Terminări de chat, cât și răspunsuri API cu stare pe server."
  t214: "tool_preview_length: 0 în config arată căile complete ale fișierelor în fluxul de activitate al filatorului."
  t215: "Stare hermes --deep execută verificări de diagnosticare mai profunde pentru toate componentele."
  t216: "Joburile Cron pot atașa un script Python (--script) al cărui stdout este injectat în prompt ca context."
  t217: "Scripturile Cron trăiesc în ~/.hermes/scripts/ și rulează înaintea agentului - perfect pentru conductele de colectare a datelor."
  t218: "prefill_messages_file în config.yaml injectează câteva exemple în fiecare apel API, niciodată salvat în istoric."
  t219: "SOUL.md înlocuiește complet identitatea implicită a agentului — rescrie-o pentru a face Hermes propriul dvs."
  t220: "SOUL.md este auto-seeded cu o personalitate implicită la prima rulare. Editează-l pentru a personaliza."
  t221: "/compress <focus topic> alocă 60-70% din bugetul rezumat subiectului dvs. și reduce agresiv restul."
  t222: "La compresia secundă +, compresorul actualizează rezumatul anterior în loc să înceapă de la zero."
  t223: "Înainte de resetarea unei sesiuni de gateway, Hermes șterge automat faptele importante în memorie în fundal."
  t224: "network.force_ipv4: adevărat în config.yaml remediază blocările pe serverele cu IPv6 stricat — socket monkey-patches."
  t225: "Instrumentul terminal adnotă codurile de ieșire comune: grep returning 1 = „Nu s-au găsit potriviri (nu o eroare)”."
  t226: "Comenzile terminale din prim-plan eșuate se reîncercă automat de până la 3 ori cu retragere exponențială (2s, 4s, 8s)."
  t227: "Comenzile sudo goale sunt rescrise automat pentru a canaliza SUDO_PASSWORD din .env - nu este nevoie de prompt interactiv."
  t228: "Ajutoarele execute_code necesită importuri explicite: din hermes_tools import json_parse, shell_quote, reîncearcă."
  t229: "Cele 7 instrumente sandbox ale execute_code (căutare_web, terminal, citire/scriere/căutare/patch) folosesc RPC - nu introdu niciodată context."
  t230: "Citirea aceleiași regiuni de fișier de peste 3 ori declanșează un avertisment. La 4+, este blocat pentru a preveni buclele."
  t231: "write_file și patch detectează dacă un fișier a fost modificat extern de la ultima citire și avertizează despre oboseală."
  t232: "Formatul de corecție V4A acceptă directivele Adăugare fișier, Ștergere fișier și Mutare fișier - nu doar Actualizare."
  t233: "Serverele MCP pot solicita completări LLM înapoi prin eșantionare — agentul devine un instrument pentru server."
  t234: "Serverele MCP trimit notificări/instrumente/list_changed pentru a declanșa reînregistrarea automată a instrumentului fără repornire."
  t235: "delegate_task cu acp_command: „claude” generează codul claude ca agent copil de pe orice platformă."
  t236: "Delegarea are un fir de inimă — activitatea copilului se propagă către părinte, prevenind expirarea timpului de gateway."
  t237: "Când un furnizor returnează HTTP 402 (se solicită plata), clientul auxiliar revine automat la următorul."
  t238: "agent.tool_use_enforcement conduce modele care descriu acțiuni în loc să apeleze instrumente — automat pentru GPT/Codex."
  t239: "agent.restart_after_turn_timeout permite ca rundele în curs să se termine înainte ca /restart să intre în stop(); restart_drain_timeout este doar bugetul de întrerupere forțată odată ce stop() începe."
  t240: "agent.api_max_retries (implicit 3) controlează de câte ori agentul reîncearcă un apel API eșuat înainte de a arăta eroarea — coboară-o pentru a te retrage rapid."
  t241: "Gateway-ul memorează în cache instanțe AIAgent pe sesiune — distrugerea acestui cache întrerupe memorarea în cache a promptului Anthropic."
  t242: "Orice site web poate expune abilități prin /.well-known/skills/index.json - hub-ul de abilități le descoperă automat."
  t243: "Jurnalul de auditare a competențelor de la ~/.hermes/skills/.hub/audit.log urmărește fiecare operațiune de instalare și de eliminare."
  t244: "Arborii de lucru git vechi sunt curăță automat: arborii curați îmbină sunt îndepărtează; Arborii inactivi murdari sau neîmpingiți sunt arhivează mai întâi și pot fi restaurează cu restaurarea arborelui de lucru hermes."
  t245: "Profilurile acoperă starea Hermes prin HERMES_HOME; Subprocesele instrumentului gazdă vă păstrează HOME adevărată, cu excepția cazului în care terminal.home_mode este profil."
  t246: "HERMES_HOME_MODE env var (octal, de exemplu, 0701) setează permisiuni de director personalizate pentru traversarea serverului web."
  t247: "Modul container: plasează .container-mode în HERMES_HOME și auto-execurile gazdei CLI în container."
  t248: "Ctrl+C are 5 niveluri de prioritate: anulează înregistrarea → anulează solicitările → anulează selectorul → întrerupe agentul → ieși."
  t249: "Întreruperile din timpul rulării unui agent sunt înregistrate în agent.log (vizualizare cu `hermes logs`); setează HERMES_DEBUG_INTERRUPT=1 pentru o urmărire detaliată."
  t250: "BROWSER_CDP_URL conectează instrumentele browserului la orice browser din familia Chromium care rulează - acceptă WebSocket, HTTP sau host:port."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true permite antidetecția avansată cu Chromium personalizat (plan de scară)."
  t252: "CLI comută automat la modul compact în terminale mai înguste de 80 de coloane."
  t253: "Comenzile rapide acceptă două tipuri: exec (executarea directă a comenzii shell) și alias (redirecționarea către o altă comandă)."
  t254: "Model de delegare pe sarcină: delegation.model și delegation.provider în config ruta subagenți către modele mai ieftine."
  t255: "delegation.resoning_effort controlează în mod independent profunzimea gândirii pentru subagenți."
  t256: "display.platforms în config.yaml permite înlocuiri de afișare pe platformă: {telegram: {tool_progress: all}}."
  t257: "human_delay.mode în config simulează viteza de tastare umană — interval configurabil min_ms/max_ms."
  t258: "Migrările versiunii de configurare rulează automat la încărcare — apar chei noi de configurare fără intervenție manuală."
  t259: "Modelele GPT și Codex beneficiază de îndrumări speciale de sistem prompte pentru disciplina și utilizarea obligatorie a instrumentului."
  t260: "Modelele Gemini primesc directive personalizate pentru căi absolute, apeluri de instrumente paralele și comenzi non-interactive."
  t261: "context.engine din config.yaml poate fi setat la un nume de plugin pentru strategii alternative de gestionare a contextului."
  t262: "Cu un browser cloud, adresele URL localhost și LAN se deschid într-un Chromium local (browser.auto_local_for_private_urls, activat în mod implicit)."
  t263: "Compresorul face o pre-pass ieftină: ieșirile instrumentului de peste 200 de caractere sunt înlocuite cu substituenți înainte ca LLM să ruleze."
  t264: "Când compresia eșuează, încercările ulterioare sunt întrerupte timp de 10 minute pentru a evita ciocănirea API."
  t265: "Comenzile lungi periculoase (>70 de caractere) primesc o opțiune de „vizualizare” în promptul de aprobare pentru a vedea mai întâi textul integral."
  t266: "Vizualizarea nivelului audio arată ▂▃▄▅▆▇ bare în timpul înregistrării vocale pe baza nivelurilor RMS ale microfonului."
  t267: "Numele profilurilor nu se pot ciocni cu binarele PATH existente — „hermes profile create ls” va fi respins."
  t268: "hermes profile create backup --clone-all copiază totul (config, chei, SOUL.md, amintiri, abilități, sesiuni)."
  t269: "Tasta de înregistrare vocală este configurabilă prin voice.record_key în config.yaml - nu doar Ctrl+B."
  t270: "Fișierele .cursorrules și .cursor/rules/*.mdc sunt detectate automat și încărcate ca context de proiect."
  t271: "Fișierele contextuale acceptă peste 10 modele de injectare prompte — Unicode invizibil, „ignore instrucțiuni”, încercări de exfilare."
  t272: "GPT-5 și Codex folosesc rolul „dezvoltator” în loc de „sistem” în formatul mesajului."
  t273: "Anulări auxiliare per sarcină: auxiliary.vision.provider, auxiliary.compression.model etc. în config.yaml."
  t274: "Clientul auxiliar tratează „principal” ca un alias de furnizor — se rezolvă la furnizorul tău principal real + model."
  t275: "hermes import-agent openclaw --dry-run previzualizează migrarea OpenClaw fără a scrie nimic."
  t276: "Căile de fișiere lipite cu ghilimele sau spațiile evacuate sunt gestionate automat - nu este necesară curățarea manuală."
  t277: "Comenzile Slash nu declanșează niciodată colapsul de lipire mare - /command cu argumente mari funcționează corect."
  t278: "În modul de întrerupere, comenzile slash introduse în timpul execuției agentului ocolesc logica de întrerupere și rulează imediat."
  t279: "HERMES_DEV=1 ocolește detectarea modului container pentru dezvoltarea locală."
  t280: "Fiecare server MCP primește propriul set de instrumente (MCP-servername) care poate fi comutat independent prin instrumentele hermes."
  t281: "Substituenții MCP ${ENV_VAR} din configurație sunt rezolvă la generarea serverului - inclusiv varsurile de la ~/.hermes/.env."
  t282: "Abilitățile din repos-uri de încredere (NousResearch) obțin un nivel de securitate „de încredere”; abilitățile comunității primesc scanare suplimentară."
  t283: "Carantină de competențe de la ~/.hermes/skills/.hub/quarantine/ deține competențe în așteptarea examinării de securitate."
  t284: "/steer <prompt> injectează o notă după următorul apel al instrumentului - deplasează direcția la mijlocul sarcinii fără a întrerupe."
  t285: "/goal <text> stabilește un obiectiv permanent de tip Ralph-loop — Hermes continuă automat rundă după rundă până când un evaluator spune gata."
  t286: "/snapshot create [label] salvează un instantaneu complet de stare a configurației Hermes; Restaurarea /snapshot <id> revine mai târziu."
  t287: "/copy [N] copiază ultimul răspuns al asistentului în clipboard-ul dvs. sau al N-a de la ultimul cu un număr."
  t288: "/redraw forțează o revopsire completă a interfeței de utilizare, reparând deviația terminalului după redimensionarea tmux sau artefactele de selecție a mouse-ului."
  t289: "/agents (alias /tasks) arată agenții activi și activitățile de fundal care rulează în sesiunea curentă."
  t290: "/footer comută subsolul gateway-ului la răspunsurile finale care arată modelul, contextul % și cwd."
  t291: "/busy coada|direcționare|întrerupe controlează ce face apăsarea Enter în timp ce Hermes funcționează."
  t292: "/topic în Telegram DMs activează modul de subiecte cu mai multe sesiuni gestionat de utilizator — /topic <id> restaurează sesiunile anterioare în linie."
  t293: "Sesiunea /approve|rulează întotdeauna o comandă periculoasă în așteptare cu domeniul de încredere ales; /deny îl respinge."
  t294: "/restart repornește cu grație gateway-ul după epuizarea rulărilor active, apoi trimite ping solicitantului când face backup."
  t295: "Comutatorul plăcilor /kanban <slug> modifică panoul Kanban activ cu mai multe proiecte din chatul interior."
  t296: "/reload reîncarcă ~/.hermes/.env în sesiunea de rulare — ridică noi chei API fără a reporni."
  t297: "cronjob cu no_agent=True rulează un script conform programului și își trimite direct stdout - zero tokens, zero LLM."
  t298: "Un script cron gol stdout înseamnă bifare silențioasă - nu este livrat nimic, perfect pentru cei de pază de prag."
  t299: "HERMES_CRON_MAX_PARALLEL (implicit 4) limitează câte job-uri cron rulează pe bifă, astfel încât exploziile să nu sature cheile."
  t300: "Cârligele de gateway se află sub ~/.hermes/hooks/<name>/ cu HOOK.yaml + handler.py — handler-ul trebuie să fie numit `handle`."
  t301: "Evenimentele Hook includ abonamente gateway:startup, session:start, agent:step și command:* wildcard."
  t302: "Aruncă o listă de verificare ~/.hermes/BOOT.md și un hook gateway:startup îl rulează ca agent one-shot la fiecare pornire."
  t303: "hermes curator run --dry-run previzualizează ceea ce curatorul ar arhiva sau consolida fără a modifica nimic."
  t304: "hermes curator pin <skill> blochează o abilitate atât împotriva arhivării automate, cât și a instrumentului skill_manage al agentului."
  t305: "hermes curator rollback restaurează abilitățile dintr-un instantaneu înainte de rulare — backup-urile se află sub skills/.curator_backups/."
  t306: "hermes resetare autentificare <provider> [țintă] șterge perioadele de răcire și semnalizatoarele de epuizare pe un întreg grup de acreditări sau pe o acreditări prin index, id sau etichetă."
  t307: "credential_pool_strategies.<provider>: round_robin ciclează cheile în mod uniform în loc de implicit fill_first."
  t308: "use_gateway: rutele reale per instrumente web, imagine, tts sau browser prin abonamentul Nous - fără chei suplimentare."
  t309: "provider_routing.data_collection: deny exclude furnizorii de stocare a datelor pe OpenRouter."
  t310: "provider_routing.require_parameters: adevărat numai rute către furnizorii care acceptă fiecare parametru din solicitarea dvs."
  t311: "HERMES_TUI_RESUME=1 se re-atașează automat la cea mai recentă sesiune TUI la lansare - util după ce SSH scade."
  t312: "HERMES_TUI_THEME=light|dark|<hex> forțează tema TUI pe terminalele care nu setează COLORFGBG."
  t313: "Ctrl+G sau Ctrl+X Ctrl+E în TUI deschide tamponul de intrare în $EDITOR pentru solicitări lungi pe mai multe linii."
  t314: "TUI redă LaTeX în linie — $E=mc^2$ devine matematică Unicode în loc de TeX brut."
  t315: "Tabloul de bord hermes lansează o interfață de utilizare web locală la 127.0.0.1:9119 — zero date părăsesc localhost."
  t316: "Tabloul de bord hermes încorporează hermes TUI complet în browser-ul dvs. prin xterm.js și un WebSocket PTY."
  t317: "Plasează un YAML în ~/.hermes/dashboard-themes/ cu două culori ale paletei pentru a reface întregul tablou de bord."
  t318: "Pluginurile pentru tabloul de bord sunt drop-in: manifest.json + pachet JS în ~/.hermes/dashboard-plugins/ — nu este necesară construcția npm."
  t319: "layoutVariant: cabina de pilotaj într-o temă de tablou de bord adaugă o șină stângă de 260 de pixeli pe care pluginurile o pot popula prin slotul barei laterale."
  t320: "display.tool_progress_command: true expune /verbose pe platformele de mesagerie; este doar CLI în mod implicit."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=rezultatul emite ping numai când sarcinile de fundal se termină (vs concise/toate/eroare/dezactivate)."
  t322: "HERMES_WRITE_SAFE_ROOT restricționează write_file/patch la prefixele de director; căi multiple prin os.pathsep (: sau ;)."
  t323: "HERMES_IGNORE_RULES omite injectarea automată a AGENTS.md, SOUL.md, .cursorrules, memorie și abilități preîncărcate."
  t324: "HERMES_ACCEPT_HOOKS aprobă automat cârligele shell nevăzute declarate în config.yaml fără un prompt TTY."
  t325: "auxiliary.goal_judge.model direcționează judecătorul /goal către un model rapid ieftin pentru a menține costul buclei aproape de zero."
  t326: "Punctele de control omit directoarele cu peste 50.000 de fișiere pentru a evita operațiunile git lente pe monorepo-uri masive."
  t327: "tts.provider: piper rulează TTS local în 44 de limbi pe CPU — vocile se descarcă automat în ~/.hermes/cache/piper-voices/."
  t328: "tts.providers.<name>.type: cabluri de comandă orice motor CLI TTS cu substituenți {input_path} și {output_path}."
  t329: "API_SERVER_ENABLED=true rulează un punct final compatibil cu OpenAI alături de gateway-ul pentru Open WebUI și LibreChat."
  t330: "GATEWAY_PROXY_URL rulează o configurare împărțită: platformă I/O local, lucrul agent delegat la un server API la distanță."
  t331: "MATRIX_DEVICE_ID fixează un ID stabil de dispozitiv pentru E2EE — fără el, cheile rotesc fiecare pornire și decriptează întreruperile istorice."
  t332: "TELEGRAM_WEBHOOK_SECRET este necesar ori de câte ori este setat TELEGRAM_WEBHOOK_URL — generează cu openssl rand -hex 32."
  t333: "batch_runner.py --resume content-potrivește solicitările finalizate prin text, astfel încât reordonările setului de date să nu ruleze din nou lucrarea terminată."
  t334: "/new începe o nouă sesiune (alias /reset) — ID-ul sesiunii proaspăt, istoric curat, CLI rămâne deschis."
  t335: "/clear șterge ecranul terminalului ȘI începe o nouă sesiune - o comandă rapidă pentru o resetare vizuală."
  t336: "/history tipărește conversația curentă în linie fără a părăsi CLI — util pentru o recitire rapidă."
  t337: "/save scrie conversația curentă pe disc fără a încheia sesiunea."
  t338: "/status arată informații despre sesiune dintr-o privire: ID, titlu, model, utilizarea simbolului și timpul scurs."
  t339: "/image <path> atașează un fișier imagine local pentru următoarea solicitare fără a lipi sau glisa și plasa."
  t340: "/platforms arată starea conexiunii gateway-ului și platformei de mesagerie chiar din interiorul chat-ului."
  t341: "/commands paginează întreaga listă de comandă oblică + abilități instalate — utilă pe platforme fără completarea filei."
  t342: "/toolsets listează fiecare set de instrumente disponibil, astfel încât să știi ce acceptă -t/--toolsets."
  t343: "/voice tts comută în modul numai TTS — agentul răspunde cu voce tare, dar încă introdu solicitările."
  t344: "/reload-skills scanează din nou ~/.hermes/skills/, astfel încât abilitățile introduse apar fără a reporni sesiunea."
  t345: "/indicator kaomoji|emoji|unicode|ascii alege stilul de indicator de ocupat TUI afișat în timpul rulărilor agentului."
  t346: "Încărcarea /debug încarcă un rezumat (versiuni, chei de configurare, număr de erori; fără text de jurnal) și returnează un link care poate fi partajat - funcționează și în chat."
  t347: "hermes -z „<prompt>” este cel mai pur one-shot: răspunsul final pe stdout, nimic altceva — ideal pentru canalizarea în scripturi."
  t348: "hermes chat --pass-session-id injectează ID-ul sesiunii în promptul de sistem, astfel încât agentul să-l poată auto-referi."
  t349: "hermes chat --image path/to/pic.png atașează o imagine locală la o singură interogare -q fără un pas separat de încărcare."
  t350: "hermes chat --ignore-user-config omite configurația utilizatorului activ - rapoarte reproductibile de erori și rulări CI."
  t351: "hermes chat --instrumentul sursă etichetează chat-urile programatice, astfel încât să nu aglomereze lista de sesiuni hermes."
  t352: "hermes dump --show-keys include amprentele digitale ale tastelor API pentru o depanare mai profundă a suportului."
  t353: "hermes redenumește sesiunile <ID> „titlu nou” redenumește orice sesiune anterioară; Sesiunile hermes șterge <ID> elimină una."
  t354: "Importul hermes restabilește un zip complet de rezervă hermes; sesiunea JSON/JSONL exportă importul din pagina Sesiuni de tablou de bord."
  t355: "hermes fallback gestionează interactiv lanțul fallback_model — fără editare manuală a config.yaml."
  t356: "Împerecherea hermes rotește jetonul de asociere DM - primul mesager după rotație pretinde acces la bot."
  t357: "Configurarea hermes ghidează utilizatorii începători prin cablurile furnizorului, cheilor și platformei într-un singur flux interactiv."
  t358: "Stare hermes --deep rulează întreaga stare de sănătate a fiecărei componente; starea hermes simplă este vizualizarea rapidă."
  t359: "HERMES_AGENT_TIMEOUT=0 dezactivează oprirea inactivității gateway-ului pentru un agent care rulează - folosește-l pentru cursuri lungi de cercetare."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 încarcă automat pluginurile repo-local de la ./.hermes/plugins/ — încrederea prin proiectare."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 dezactivează protecția „fișier modificat de când l-ați citit” pe patch și write_file."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true permite instrumentelor web să atingă rețelele locale și private - dezactivat implicit în modul gateway."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 instalează automat abilități suplimentare de catalog opțional la prima rulare per profil."
  t364: "HERMES_BUNDLED_SKILLS puncte către un arbore personalizat de abilități grupate — folosit de ambalajele Homebrew și Nix."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 descarcă fiecare sarcină utilă de solicitare API către stdout în loc de fișierele jurnal."
  t366: "HERMES_OAUTH_TRACE=1 înregistrează schimbul de simboluri OAuth șterse și încercările de reîmprospătare pentru autentificarea furnizorului de depanare."
  t367: "HERMES_STREAM_RETRIES (implicit 3) controlează încercările de reconectare la mijlocul fluxului în cazul erorilor tranzitorii de rețea."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false reduce la tăcere mesajele de confirmare ⚡/⏳/⏩ atunci când un utilizator trimite mesaje unui agent ocupat."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (implicit 180 s) stabilește cât de des gateway-ul trimite actualizări de progres la rundele lungi."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (implicit 900 de secunde) limitează cât timp așteaptă /restart pentru rulările în timpul zborului înainte de a forța."
  t371: "HERMES_CHECKPOINT_TIMEOUT (implicit 30 de secunde) limitează crearea punctului de control al sistemului de fișiere - ridică-l pe monorepo uriașe."
  t372: "image_gen.model în config.yaml alege modelul FAL: flux-2/klein, gpt-image-2, nano-banana-pro și multe altele."
  t373: "image_gen.provider direcționează generarea de imagini printr-un plugin (OpenAI Images, Codex, FAL) în loc de implicit."
  t374: "Analiză AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY la orice punct final compatibil cu OpenAI."
  t375: "API_SERVER_MODEL_NAME personalizează numele modelului pe /v1/modele - esențial pentru setările Open WebUI cu mai multe profiluri."
  t376: "Pluginurile pentru tabloul de bord sunt difuzate de la /dashboard-plugins/<name>/ — plasează fișierele în ~/.hermes/dashboard-plugins/."
  t377: "--source chat-urile instrumentului sunt excluse din lista de sesiuni hermes în mod implicit — setează --source în mod explicit pentru a le vedea."
  placeholder:
    p01: "Întreabă orice sau tastează / pentru comenzi..."
    p02: "Rezumă ce se află în acest folder"
    p03: "Scrie un răspuns la ultimul e-mail din căsuța mea de e-mail"
    p04: "Planifică o caracteristică, apoi construiește-o pas cu pas"
    p05: "Găsește și remediază un test care eșuează"
    p06: "Cercetează acest subiect și scrie-mi un scurt"
    p07: "Ce s-a schimbat recent în acest repo?"
    p08: "Transformă aceste note într-o listă de lucruri de făcut"
    p09: "Explică această eroare și cum să o remediază"
    p10: "Setează un memento sau programează o sarcină recurentă"
    p11: "Tastează / pentru a răsfoi comenzi sau Ctrl+P pentru paletă"
