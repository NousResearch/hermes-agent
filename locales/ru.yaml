explainer:
  no_reply_prefix: "⚠️ Нет ответа: "
  empty_response: "{model} в этот раз не дала ответа даже после повторных попыток. Отправьте `continue`, чтобы попробовать ещё раз, или смените модель через /model."
  exit:
    all_retries_exhausted_no_response: "провайдер модели не ответил после всех повторных попыток. Отправьте /retry или смените модель через /model."
    partial_stream_recovery: "потоковый вывод прервался раньше времени, удалось восстановить только часть ответа. Отправьте `continue`, чтобы продолжить с места остановки."
    fallback_prior_turn_content: "в этом ходе не было создано нового содержимого; показан восстановленный предыдущий контекст. Отправьте `continue`, чтобы повторить."
    redirect_restart_limit_exceeded: "запрос отменялся новой корректировкой при каждой попытке, поэтому ход остановлен вместо бесконечных повторов. Ваша последняя корректировка поставлена в очередь как следующее сообщение."
    rebuilt_restart_limit_exceeded: "каждый провайдер в цепочке резервных постоянно переключался на следующий, поэтому ход остановлен вместо бесконечных повторов. Отправьте `continue` или смените провайдера."
    budget_exhausted: "бюджет итераций/стоимости на ход исчерпан до получения окончательного ответа. Отправьте `continue`, чтобы продолжить."
    ollama_runtime_context_too_small: "окно контекста локальной модели оказалось слишком маленьким, чтобы завершить работу. Увеличьте размер контекста или используйте более крупную модель."
    pending_tool_result: "ход остановлен, пока результат инструмента ещё ожидался, а модель не выдала продолжения. Отправьте `continue`, чтобы она подвела итог."
    interrupted_during_api_call: "запрос был прерван во время вызова до получения ответа. Отправьте `continue`, чтобы повторить."
    max_iterations_reached: "достигнут лимит итераций инструментов до получения окончательного ответа. Отправьте `continue`, чтобы продолжить, или увеличьте `max_iterations`."
    error_near_max_iterations: "возникла ошибка вблизи лимита итераций до получения окончательного ответа. Проверьте вывод инструмента выше, затем отправьте `continue`."
    repeated_outer_errors: "ход раз за разом завершался ошибками и был остановлен досрочно вместо бесконечных повторов. Проверьте ошибки выше, затем отправьте `continue`, чтобы повторить."
  persistence:
    compression: "ход остановлен, потому что другой процесс сжимал этот сеанс. Ваше сообщение уже должно быть сохранено — отправьте его ещё раз после завершения сжатия."
    compression_closed: "ход остановлен, потому что этот сеанс был ротирован сжатием контекста, а его живое продолжение не удалось подхватить. Само хранилище в порядке — обновите клиент (или начните новый ход), чтобы он подхватил новый id сеанса, затем отправьте сообщение ещё раз."
    turn_lease: "ход остановлен, потому что другой процесс Hermes перехватил этот сеанс. Ваш ответ не был сохранён — дождитесь завершения другого процесса, затем отправьте сообщение ещё раз."
    session_row_missing: "этот сеанс был удалён из хранилища, пока чат был ещё открыт, и Hermes не смог его пересоздать, поэтому это сообщение не сохранено. Отправьте сообщение ещё раз; если ошибка повторяется, запустите `hermes {profile_arg}doctor`."
    locked: "ход остановлен, потому что хранилище сеансов было занято (другой процесс Hermes записывал в базу состояния). Ваше сообщение уже должно быть сохранено — отправьте его ещё раз чуть позже."
    replaced: "файл базы данных сеансов был заменён во время работы Hermes, поэтому это сообщение не сохранено (копия хранится в {home}/sessions/). Остановите Hermes (`hermes {profile_arg}gateway stop`), запустите `hermes {profile_arg}doctor` — не `hermes {profile_arg}doctor --fix`, который починил бы не тот файл на месте, — затем запустите снова и отправьте сообщение ещё раз. Подробные шаги восстановления есть в логе."
    deleted_wal: "другой процесс Hermes всё ещё держит старую копию журнала упреждающей записи базы сеансов, поэтому Hermes прекратил запись ради сохранности файла, и это сообщение не сохранено (копия хранится в {home}/sessions/). Ничего не потеряно. Закройте все процессы Hermes этого профиля (приложение Desktop, `hermes {profile_arg}gateway stop`, панель управления, cron), запустите `hermes {profile_arg}doctor` — он назовёт процесс, который ещё держит журнал, — затем запустите Hermes снова и отправьте сообщение ещё раз. Не запускайте `doctor --fix` и не удаляйте файлы state.db, пока они работают. Руководство: {recovery_docs}"
    corrupt: "ход остановлен, потому что база состояния сообщила о структурном повреждении (транскрипт был бы утерян при перезапуске). Освобождение места на диске не поможет. Варианты восстановления:\n1. Запустите `hermes {profile_arg}doctor --fix`\n2. Остановите шлюз, затем восстановите командой:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (если она сообщает, что восстановление возможно) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — восстановление сначала делает снимок повреждённого файла; НЕ запускайте `sqlite3 ... \".recover\"` на живом state.db: уязвимая версия sqlite3 CLI может повредить его ещё сильнее\n3. Восстановите из резервной копии в {backups_dir}/\nЗатем отправьте сообщение ещё раз."
    fts_index: "ход остановлен, потому что индекс поиска по сеансам (FTS5) повреждён и его не удалось отключить, поэтому это сообщение не сохранено. Само хранилище сообщений не повреждено: не запускайте инструменты восстановления и не откатывайтесь на резервную копию. Запустите `hermes {profile_arg}doctor --fix` (или перезапустите Hermes — индекс восстанавливается при открытии), затем отправьте сообщение ещё раз."
    disk: "Hermes не смог сохранить этот разговор на диск и остановился, чтобы не потерять ваши сообщения. Скорее всего, диск переполнен: освободите место (или исправьте права доступа к {home}/state.db), затем отправьте сообщение ещё раз."
    default: "Hermes не смог сохранить этот разговор и остановился, чтобы не потерять ваши сообщения. Возможные причины: на диске закончилось место или базу данных держит другой процесс Hermes. Закройте другие окна Hermes, запустите `hermes {profile_arg}doctor` для проверки хранилища, затем отправьте сообщение ещё раз."
  file_mutation:
    header: "⚠️ Проверка изменений файлов: {count} правок файлов в этом ходе НЕ УДАЛИСЬ, что бы ни говорилось в тексте выше. Запустите `git status` или `read_file`, чтобы проверить, что реально применилось."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "не удалось"
  shared:
    and_more: "  • … и ещё {count}"
    the_model: "Модель"
tips:
  t001: "/bg <промпт> запускает задачу в отдельном сеансе, не занимая текущий; /btw <вопрос> отвечает на побочный вопрос об этом разговоре, не прерывая его."
  t002: "/branch создаёт ответвление текущего сеанса, чтобы попробовать другое направление, не теряя прогресс."
  t003: "/compress вручную сжимает контекст разговора, когда он становится слишком длинным."
  t004: "/rollback показывает контрольные точки файловой системы — верните файлы, изменённые агентом, к любому прежнему состоянию."
  t005: "/rollback diff 2 показывает, что изменилось с контрольной точки 2, ничего не восстанавливая."
  t006: "/rollback 2 src/file.py восстанавливает один файл из указанной контрольной точки."
  t007: "/title \"мой проект\" даёт сеансу имя — потом его можно возобновить через /resume или hermes -c."
  t008: "/resume продолжает ранее названный сеанс с того места, где вы остановились."
  t009: "/queue <промпт> ставит сообщение в очередь на следующий ход, не прерывая текущий."
  t010: "/undo убирает из разговора последний обмен репликами пользователя и ассистента."
  t011: "/retry заново отправляет ваше последнее сообщение — полезно, когда ответ агента получился не совсем тем."
  t012: "/verbose переключает режим отображения хода инструментов по кругу: off → new → all → verbose."
  t013: "/reasoning high увеличивает глубину размышлений модели. /reasoning show показывает сами рассуждения."
  t014: "/fast включает и выключает приоритетную обработку для более быстрых ответов API (зависит от провайдера)."
  t015: "/yolo отключает все запросы одобрения опасных команд до конца сеанса."
  t016: "/model позволяет сменить модель прямо в сеансе — попробуйте /model sonnet или /model gpt-5."
  t017: "/model --global навсегда меняет вашу модель по умолчанию."
  t018: "/personality pirate задаёт забавную личность — 14 встроенных вариантов, от kawaii до shakespeare."
  t019: "/skin меняет тему CLI — попробуйте ares, mono, slate, poseidon или charizard."
  t020: "/statusbar включает постоянную строку с моделью, токенами, заполненностью контекста в %, стоимостью и длительностью."
  t021: "/tools disable browser временно убирает инструменты браузера на текущий сеанс."
  t022: "/browser connect подключает инструменты браузера к вашему запущенному браузеру семейства Chromium через CDP."
  t023: "/plugins показывает установленные плагины и их состояние."
  t024: "/cron управляет запланированными задачами — настройте повторяющиеся промпты с доставкой на любую платформу."
  t025: "/reload-mcp перезагружает конфигурацию MCP-серверов на лету, без перезапуска."
  t026: "/usage показывает расход токенов, разбивку стоимости и длительность сеанса."
  t027: "/insights показывает аналитику использования за последние 30 дней."
  t028: "/paste ищет в буфере обмена изображение и прикрепляет его к вашему следующему сообщению."
  t029: "/profile показывает, какой профиль активен, и его домашний каталог."
  t030: "/config показывает вашу текущую конфигурацию одним взглядом."
  t031: "/stop завершает все фоновые процессы, запущенные агентом."
  t032: "@file:path/to/file.py вставляет содержимое файла прямо в ваше сообщение."
  t033: "@file:main.py:10-50 вставляет только строки 10–50 файла."
  t034: "@folder:src/ вставляет дерево каталога."
  t035: "@diff вставляет в сообщение ваши непроиндексированные изменения git."
  t036: "@staged вставляет ваши проиндексированные изменения git (git diff --staged)."
  t037: "@git:5 вставляет последние 5 коммитов с полными патчами."
  t038: "@url:https://example.com загружает веб-страницу и вставляет её содержимое."
  t039: "Ввод @ включает автодополнение путей файловой системы — переходите к любому файлу интерактивно."
  t040: "Комбинируйте несколько ссылок: \"Проверь @file:main.py и @file:test.py на согласованность.\""
  t041: "Alt+Enter вставляет перенос строки для многострочного ввода. (Windows Terminal перехватывает Alt+Enter — используйте Ctrl+Enter.)"
  t042: "Ctrl+C прерывает агента. Нажмите дважды в течение 2 секунд для принудительного выхода."
  t043: "Ctrl+Z сворачивает Hermes в фон — выполните fg в оболочке, чтобы вернуться."
  t044: "Tab принимает серый текст автоподсказки или дополняет слеш-команды."
  t045: "Введите новое сообщение, пока агент работает, чтобы прервать его и перенаправить."
  t046: "Alt+V вставляет изображение из буфера обмена в разговор."
  t047: "При вставке 5+ строк текст автоматически сохраняется в файл, а в поле ввода подставляется компактная ссылка на него."
  t048: "hermes -c возобновляет последний CLI-сеанс. hermes -c \"project name\" возобновляет сеанс по названию."
  t049: "hermes -w создаёт изолированный git worktree — идеально для параллельной работы нескольких агентов."
  t050: "hermes -w -q \"Fix issue #42\" сочетает изоляцию в worktree с однократным запросом."
  t051: "hermes chat -t web,terminal включает только указанные наборы инструментов для сфокусированного сеанса."
  t052: "hermes chat -s github-pr-workflow предзагружает навык при запуске."
  t053: "hermes chat -q \"query\" выполняет один неинтерактивный запрос и завершает работу."
  t054: "hermes chat --max-turns 1000 переопределяет лимит по умолчанию в 500 итераций за ход."
  t055: "hermes chat --checkpoints включает снимки файловой системы перед каждым разрушительным изменением файлов."
  t056: "hermes --yolo отключает все запросы одобрения опасных команд на весь сеанс."
  t057: "hermes chat --source telegram помечает сеанс, чтобы его можно было отфильтровать в hermes sessions list."
  t058: "hermes -p work chat запускает Hermes под указанным профилем, не меняя профиль по умолчанию."
  t059: "hermes doctor --fix диагностирует и автоматически исправляет проблемы с конфигурацией и зависимостями."
  t060: "hermes dump выводит компактную сводку по вашей установке — удобно для отчётов об ошибках."
  t061: "hermes config set KEY VALUE автоматически записывает секреты в .env, а всё остальное — в config.yaml."
  t062: "hermes config edit открывает config.yaml в вашем редакторе по умолчанию."
  t063: "hermes config check ищет отсутствующие или устаревшие параметры конфигурации."
  t064: "hermes sessions browse открывает интерактивный выбор сеанса с поиском."
  t065: "hermes sessions stats показывает число сеансов по платформам и размер базы данных."
  t066: "hermes sessions prune --older-than 30 удаляет старые сеансы."
  t067: "hermes skills search react --source skills-sh ищет в публичном каталоге skills.sh."
  t068: "hermes skills check проверяет установленные из хаба навыки на наличие обновлений."
  t069: "hermes skills tap add myorg/skills-repo добавляет собственный источник навыков на GitHub."
  t070: "hermes skills snapshot export setup.json экспортирует конфигурацию навыков для резервной копии или обмена."
  t071: "hermes mcp add github --command npx добавляет MCP-серверы из командной строки."
  t072: "hermes mcp serve запускает сам Hermes как MCP-сервер для других агентов."
  t073: "hermes auth add позволяет добавить несколько API-ключей для ротации пула учётных данных."
  t074: "hermes completion bash >> ~/.bashrc включает автодополнение по Tab для всех команд и профилей."
  t075: "hermes logs -f показывает agent.log в реальном времени. --level WARNING --since 1h фильтрует вывод."
  t076: "hermes backup создаёт zip-архив со всем домашним каталогом Hermes."
  t077: "hermes profile create coder создаёт изолированный профиль, который становится отдельной командой."
  t078: "hermes profile create work --clone копирует текущую конфигурацию и ключи в новый профиль."
  t079: "hermes update автоматически синхронизирует новые встроенные навыки во ВСЕ профили."
  t080: "hermes gateway install настраивает Hermes как системную службу (systemd/launchd)."
  t081: "hermes memory setup позволяет настроить внешний провайдер памяти (Honcho, Mem0 и др.)."
  t082: "hermes webhook subscribe создаёт событийные webhook-маршруты с проверкой HMAC."
  t083: "Экономьте: hermes tools отключает неиспользуемые инструменты, hermes skills config сокращает набор навыков."
  t084: "/reasoning low или /reasoning minimal уменьшает глубину размышлений ниже уровня по умолчанию (medium) — ответы быстрее и дешевле."
  t085: "hermes models направляет зрение, сжатие и вспомогательные задачи на более дешёвые модели — сокращает фоновый расход токенов на 85%+ без понижения основной модели чата."
  t086: "Задайте display.bell_on_complete: true в config.yaml, чтобы слышать сигнал по завершении долгих задач."
  t087: "Задайте display.streaming: true, чтобы видеть токены в реальном времени по мере генерации."
  t088: "Задайте display.show_reasoning: true, чтобы наблюдать цепочку рассуждений модели."
  t089: "Задайте display.compact: true, чтобы убрать лишние пустые строки и уплотнить вывод."
  t090: "Задайте display.busy_input_mode: queue, чтобы ставить сообщения в очередь вместо прерывания агента, или steer, чтобы вставлять их по ходу работы через /steer."
  t091: "Задайте display.resume_display: minimal, чтобы не выводить полный пересказ разговора при возобновлении сеанса."
  t092: "Задайте compression.threshold: 0.50, чтобы управлять моментом срабатывания автосжатия (по умолчанию: 50% контекста)."
  t093: "Задайте agent.max_turns: 1000, чтобы позволить агенту делать больше шагов с вызовами инструментов за ход."
  t094: "Задайте file_read_max_chars: 200000, чтобы увеличить максимальный объём содержимого на один вызов read_file."
  t095: "Задайте approvals.mode: smart, чтобы LLM автоматически одобряла безопасные команды и отклоняла опасные."
  t096: "Задайте fallback_model в config.yaml, чтобы автоматически переключаться на резервного провайдера."
  t097: "Задайте privacy.redact_pii: true, чтобы хэшировать ID пользователей и номера телефонов перед отправкой в LLM."
  t098: "Задайте browser.record_sessions: true, чтобы автоматически записывать сеансы браузера в видео WebM."
  t099: "Задайте worktree: true в config.yaml, чтобы всегда создавать git worktree (то же, что hermes -w)."
  t100: "Задайте security.website_blocklist.enabled: true, чтобы заблокировать определённые домены для веб-инструментов."
  t101: "Задайте cron.wrap_response: false, чтобы доставлять чистый вывод агента без заголовка и подвала cron."
  t102: "HERMES_TIMEZONE переопределяет часовой пояс сервера любым идентификатором часового пояса IANA."
  t103: "В config.yaml работает подстановка переменных окружения: используйте синтаксис ${VAR_NAME}."
  t104: "Быстрые команды в config.yaml мгновенно выполняют команды оболочки без расхода токенов."
  t105: "Собственные личности можно описать в config.yaml в разделе agent.personalities."
  t106: "provider_routing управляет сортировкой, белым и чёрным списками провайдеров OpenRouter."
  t107: "execute_code запускает Python-скрипты, программно вызывающие инструменты Hermes, — результаты не попадают в контекст."
  t108: "delegate_task по умолчанию запускает до 10 параллельных подагентов (delegation.max_concurrent_children) с изолированными контекстами для параллельной работы."
  t109: "web_extract работает с URL PDF-файлов — передайте любую ссылку на PDF, и он преобразует его в markdown."
  t110: "search_files работает на ripgrep и быстрее grep — используйте его вместо grep в терминале."
  t111: "patch использует 9 стратегий нечёткого сопоставления, поэтому небольшие различия в пробелах не ломают правки."
  t112: "patch поддерживает формат V4A для массовых правок нескольких файлов одним вызовом."
  t113: "read_file предлагает похожие имена файлов, если файл не найден."
  t114: "read_file автоматически устраняет дубли — повторное чтение неизменённого файла возвращает лёгкую заглушку."
  t115: "browser_vision делает снимок экрана и анализирует его с помощью ИИ — работает для CAPTCHA и визуального контента."
  t116: "browser_console может вычислять выражения JavaScript в контексте страницы."
  t117: "image_generate создаёт изображения с помощью FLUX 2 Pro и автоматически увеличивает их в 2 раза."
  t118: "text_to_speech преобразует текст в аудио — в Telegram оно воспроизводится как голосовое сообщение."
  t119: "send_message может отправить сообщение в любую подключённую платформу прямо из сеанса."
  t120: "Инструмент todo помогает агенту отслеживать сложные многошаговые задачи в течение сеанса."
  t121: "session_search выполняет полнотекстовый поиск по ВСЕМ прошлым разговорам."
  t122: "Агент автоматически сохраняет в память предпочтения, исправления и факты об окружении."
  t123: "/moa прогоняет один сложный промпт через настроенный вами набор моделей Mixture of Agents."
  t124: "Команды терминала поддерживают фоновый режим с notify_on_complete для долгих задач."
  t125: "Фоновые процессы терминала поддерживают watch_patterns для оповещения о нужных строках вывода."
  t126: "Инструмент terminal поддерживает 6 бэкендов: local, Docker, SSH, Modal, Daytona и Singularity."
  t127: "У каждого профиля свои конфигурация, API-ключи, память, сеансы, навыки и cron-задачи."
  t128: "Имена профилей становятся командами оболочки — 'hermes profile create coder' создаёт команду 'coder'."
  t129: "hermes profile export coder -o backup.tar.gz создаёт переносимый архив профиля."
  t130: "Если два профиля случайно используют один и тот же токен бота, второй шлюз блокируется с понятной ошибкой."
  t131: "Сеансы автоматически получают осмысленные названия после первого обмена сообщениями — называть их вручную не нужно."
  t132: "Названия сеансов поддерживают преемственность: \"my project\" → \"my project #2\" → \"my project #3\"."
  t133: "При выходе Hermes выводит команду для возобновления с ID сеанса и статистикой."
  t134: "hermes sessions export backup.jsonl экспортирует все сеансы для резервной копии или анализа."
  t135: "hermes -r SESSION_ID возобновляет любой прошлый сеанс по его ID."
  t136: "Память — это замороженный снимок: изменения попадают в системный промпт только при следующем запуске сеанса."
  t137: "Записи памяти автоматически проверяются на признаки промпт-инъекций и утечки данных."
  t138: "У агента два хранилища памяти: личные заметки (~2200 символов) и профиль пользователя (~1375 символов)."
  t139: "Поправки, которые вы даёте агенту (\"нет, сделай вот так\"), часто автоматически сохраняются в память."
  t140: "Более 80 встроенных навыков: github, creative, mlops, productivity, research и другие."
  t141: "Каждый установленный навык автоматически становится слеш-командой — введите /, чтобы увидеть их все."
  t142: "hermes skills install official/security/1password устанавливает дополнительные навыки из репозитория."
  t143: "Навыки могут быть ограничены определёнными ОС — некоторые загружаются только на macOS или Linux."
  t144: "skills.external_dirs в config.yaml позволяет загружать навыки из своих каталогов."
  t145: "Агент может создавать собственные навыки как процедурную память с помощью skill_manage."
  t146: "/plan записывает план реализации в markdown в .hermes/plans/, ничего не выполняя."
  t147: "К cron-задачам можно прикреплять навыки: hermes cron add --skill blogwatcher \"Check for new posts\"."
  t148: "Каналы доставки cron: telegram, discord, slack, email, sms и ещё более 12 платформ."
  t149: "Если ответ cron-задачи начинается с [SILENT], доставка подавляется — удобно для задач чистого мониторинга."
  t150: "Cron поддерживает относительные задержки (30m), интервалы (every 2h), cron-выражения и ISO-метки времени."
  t151: "Cron-задачи выполняются в полностью новых сеансах агента — промпты должны быть самодостаточными."
  t152: "Голосовой режим работает без единого API-ключа, если установлен faster-whisper (бесплатное локальное распознавание речи)."
  t153: "Доступно пять TTS-провайдеров: Edge TTS (бесплатно), ElevenLabs, OpenAI, NeuTTS (бесплатно, локально), MiniMax."
  t154: "/voice on включает голосовой режим в CLI. Ctrl+B переключает запись в режиме push-to-talk."
  t155: "Потоковый TTS озвучивает предложения по мере их генерации — не нужно ждать полного ответа."
  t156: "Голосовые сообщения в Telegram, Discord, WhatsApp и Slack расшифровываются автоматически."
  t157: "Hermes работает на 21 платформе обмена сообщениями: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, email и другие."
  t158: "hermes gateway install настраивает шлюз как системную службу, запускающуюся при загрузке."
  t159: "DingTalk использует Stream Mode — вебхуки и публичный URL не нужны."
  t160: "BlueBubbles подключает iMessage к Hermes через локальный сервер на macOS."
  t161: "Маршруты вебхуков поддерживают проверку HMAC, ограничение частоты запросов и фильтрацию событий."
  t162: "API-сервер предоставляет OpenAI-совместимую конечную точку, работающую с Open WebUI и LibreChat."
  t163: "Режим голосового канала Discord: бот заходит в голосовой канал, расшифровывает речь и отвечает голосом."
  t164: "group_sessions_per_user: true даёт каждому участнику группового чата собственный сеанс."
  t165: "/sethome отмечает чат как домашний канал для доставки результатов cron-задач."
  t166: "Шлюз поддерживает тайм-ауты по бездействию — активные агенты могут работать сколь угодно долго."
  t167: "Одобрение опасных команд имеет 4 уровня: однократно, на сеанс, всегда (постоянный allowlist), отклонить."
  t168: "Умный режим одобрения использует LLM, чтобы автоматически одобрять безопасные команды и помечать опасные."
  t169: "Защита от SSRF блокирует приватные сети, loopback, link-local и адреса облачных метаданных."
  t170: "Предварительное сканирование Tirith выявляет подмену URL омоглифами и конструкции вида «pipe в интерпретатор»."
  t171: "Подпроцессы MCP получают отфильтрованное окружение — передаются только безопасные системные переменные."
  t172: "Файлы контекста (.hermes.md, AGENTS.md) перед загрузкой проверяются на промпт-инъекции."
  t173: "command_allowlist в config.yaml навсегда одобряет указанные шаблоны shell-команд."
  t174: "Контекст автоматически сжимается при достижении порога — память сбрасывается в хранилище, а история сводится в сводку."
  t175: "По мере заполнения контекста строка состояния становится жёлтой, затем оранжевой, затем красной."
  t176: "SOUL.md — основной файл идентичности агента; отредактируйте его, чтобы задать поведение."
  t177: "Hermes загружает контекст проекта из .hermes.md, AGENTS.md, CLAUDE.md или .cursorrules (первый найденный)."
  t178: "Файлы AGENTS.md в подкаталогах обнаруживаются постепенно, по мере того как агент переходит в папки."
  t179: "Файлы контекста ограничены 20 000 символами с умной обрезкой начала и конца."
  t180: "Пять браузерных провайдеров: локальный Chromium, Browserbase, Browser Use, Camofox и Firecrawl."
  t181: "Camofox — браузер с защитой от обнаружения: форк Firefox с подменой отпечатка на C++."
  t182: "browser_navigate автоматически возвращает снимок страницы — вызывать browser_snapshot после него не нужно."
  t183: "browser_vision с annotate=true накладывает нумерованные метки на интерактивные элементы."
  t184: "hermes mcp открывает интерактивный выбор одобренных Nous MCP-серверов, которые устанавливаются одним нажатием."
  t185: "hermes mcp catalog выводит список одобренных Nous MCP-серверов, поставляемых с репозиторием."
  t186: "hermes mcp install <name> устанавливает запись из каталога, запрашивает учётные данные и позволяет выбрать, какие из его инструментов включить."
  t187: "MCP-серверы настраиваются в config.yaml — поддерживаются транспорты stdio и HTTP."
  t188: "Фильтрация инструментов для каждого сервера: tools.include разрешает, а tools.exclude запрещает конкретные инструменты."
  t189: "MCP-серверы автоматически создают наборы инструментов во время работы — hermes tools может включать их для каждой платформы отдельно."
  t190: "Поддержка OAuth в MCP: auth: oauth включает авторизацию через браузер с PKCE."
  t191: "Контрольные точки не создают накладных расходов, пока файлы не изменяются — включены по умолчанию."
  t192: "Снимок перед откатом сохраняется автоматически, так что вы можете отменить саму отмену."
  t193: "/rollback также отменяет ход разговора, поэтому агент не помнит откаченных изменений."
  t194: "Контрольные точки используют теневые репозитории в ~/.hermes/checkpoints/ — .git вашего проекта не затрагивается."
  t195: "batch_runner.py параллельно обрабатывает сотни промптов для генерации обучающих данных."
  t196: "hermes chat -Q включает тихий режим для программного использования — скрывает баннер и спиннер."
  t197: "Сохранение траекторий (--save-trajectories) записывает полные трассы использования инструментов для обучения моделей."
  t198: "Три типа плагинов: общие (инструменты/хуки), провайдеры памяти и движки контекста."
  t199: "hermes plugins install owner/repo устанавливает плагины напрямую с GitHub."
  t200: "Внешние провайдеры памяти: Honcho, OpenViking, Mem0 встроены; Hindsight и другие — через hermes plugins install."
  t201: "Хуки плагинов включают pre/post_tool_call, pre/post_llm_call и transform_terminal_output для нормализации вывода."
  t202: "Кэширование промптов (Anthropic) снижает стоимость за счёт повторного использования кэшированных префиксов системного промпта."
  t203: "Агент генерирует названия сеансов в фоновом потоке — без влияния на задержку."
  t204: "Умная маршрутизация моделей может автоматически направлять простые запросы более дешёвой модели."
  t205: "Слеш-команды поддерживают сопоставление по префиксу: /h раскрывается в /help, /mod — в /model."
  t206: "Перетаскивание пути к файлу в терминал автоматически прикрепляет изображения или отправляет файл как контекст."
  t207: ".worktreeinclude в корне репозитория перечисляет игнорируемые git файлы, которые нужно копировать в worktree."
  t208: "hermes acp запускает Hermes как ACP-сервер для интеграции с VS Code, Zed и JetBrains."
  t209: "Пользовательские провайдеры: сохраняйте именованные конечные точки в config.yaml в разделе custom_providers."
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT внедряет системный промпт, который никогда не сохраняется в историю."
  t211: "credential_pool_strategies поддерживает ротацию fill_first, round_robin, least_used и random."
  t212: "hermes auth add nous или hermes auth add openai-codex настраивает провайдеров на основе OAuth."
  t213: "API-сервер поддерживает и Chat Completions, и Responses API с состоянием на стороне сервера."
  t214: "tool_preview_length: 0 в конфигурации показывает полные пути к файлам в ленте активности спиннера."
  t215: "hermes status --deep выполняет углублённые диагностические проверки всех компонентов."
  t216: "К cron-задаче можно прикрепить Python-скрипт (--script), чей stdout внедряется в промпт как контекст."
  t217: "Cron-скрипты лежат в ~/.hermes/scripts/ и выполняются до запуска агента — идеально для конвейеров сбора данных."
  t218: "prefill_messages_file в config.yaml внедряет few-shot-примеры в каждый вызов API, не сохраняя их в историю."
  t219: "SOUL.md полностью заменяет стандартную идентичность агента — перепишите его, чтобы сделать Hermes своим."
  t220: "SOUL.md при первом запуске автоматически заполняется личностью по умолчанию. Отредактируйте его под себя."
  t221: "/compress <тема> отводит 60–70% бюджета сводки вашей теме и агрессивно сокращает всё остальное."
  t222: "При втором и последующих сжатиях компрессор обновляет предыдущую сводку, а не начинает с нуля."
  t223: "Перед сбросом сеанса шлюза Hermes в фоне автоматически сохраняет важные факты в память."
  t224: "network.force_ipv4: true в config.yaml устраняет зависания на серверах со сломанным IPv6 — патчит socket на лету."
  t225: "Инструмент terminal поясняет распространённые коды выхода: grep, вернувший 1, = «Совпадений не найдено (не ошибка)»."
  t226: "Неудавшиеся команды терминала в переднем плане автоматически повторяются до 3 раз с экспоненциальной задержкой (2с, 4с, 8с)."
  t227: "Команды sudo без пароля автоматически переписываются так, чтобы передавать SUDO_PASSWORD из .env — интерактивный запрос не нужен."
  t228: "Хелперы execute_code требуют явного импорта: from hermes_tools import json_parse, shell_quote, retry."
  t229: "7 sandbox-инструментов execute_code (web_search, terminal, read/write/search/patch) работают через RPC — их вывод никогда не попадает в контекст."
  t230: "Чтение одной и той же области файла 3+ раз вызывает предупреждение. При 4+ оно жёстко блокируется, чтобы предотвратить зацикливание."
  t231: "write_file и patch определяют, был ли файл изменён извне после последнего чтения, и предупреждают об устаревших данных."
  t232: "Формат патчей V4A поддерживает директивы Add File, Delete File и Move File — не только Update."
  t233: "MCP-серверы могут запрашивать у LLM ответы через sampling — агент сам становится инструментом для сервера."
  t234: "MCP-серверы отправляют notifications/tools/list_changed, чтобы инструменты перерегистрировались автоматически без перезапуска."
  t235: "delegate_task с acp_command: 'claude' запускает Claude Code как дочернего агента с любой платформы."
  t236: "У делегирования есть heartbeat-поток — активность дочернего агента передаётся родителю и предотвращает тайм-ауты шлюза."
  t237: "Если провайдер возвращает HTTP 402 (требуется оплата), вспомогательный клиент автоматически переключается на следующего."
  t238: "agent.tool_use_enforcement подталкивает модели, которые описывают действия вместо вызова инструментов — для GPT/Codex включается автоматически."
  t239: "agent.restart_after_turn_timeout даёт текущим ходам завершиться до того, как /restart вызовет stop(); restart_drain_timeout — лишь лимит принудительного прерывания после начала stop()."
  t240: "agent.api_max_retries (по умолчанию 3) задаёт, сколько раз агент повторяет неудавшийся вызов API перед показом ошибки — уменьшите для быстрого переключения на резерв."
  t241: "Шлюз кэширует экземпляры AIAgent по сеансам — сброс этого кэша ломает кэширование промптов Anthropic."
  t242: "Любой сайт может публиковать навыки через /.well-known/skills/index.json — хаб навыков находит их автоматически."
  t243: "Журнал аудита навыков в ~/.hermes/skills/.hub/audit.log фиксирует каждую установку и удаление."
  t244: "Устаревшие git worktree очищаются при запуске автоматически: чистые, полностью слитые деревья удаляются; незакоммиченная или неотправленная работа всегда сохраняется."
  t245: "Профили изолируют состояние Hermes через HERMES_HOME; подпроцессы инструментов на хосте сохраняют ваш настоящий HOME, если terminal.home_mode не равен profile."
  t246: "Переменная окружения HERMES_HOME_MODE (восьмеричная, например 0701) задаёт свои права на каталог для обхода веб-сервером."
  t247: "Контейнерный режим: положите .container-mode в HERMES_HOME — и CLI на хосте автоматически выполнится внутри контейнера."
  t248: "У Ctrl+C пять уровней приоритета: отменить запись → отменить запросы → закрыть выбор → прервать агента → выйти."
  t249: "Каждое прерывание во время работы агента записывается в ~/.hermes/interrupt_debug.log с отметками времени."
  t250: "BROWSER_CDP_URL подключает браузерные инструменты к любому запущенному браузеру семейства Chromium — принимает WebSocket, HTTP или host:port."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true включает продвинутую защиту от обнаружения с кастомным Chromium (тариф Scale)."
  t252: "CLI автоматически переключается в компактный режим в терминалах уже 80 столбцов."
  t253: "Быстрые команды бывают двух типов: exec (напрямую выполняет shell-команду) и alias (перенаправляет на другую команду)."
  t254: "Отдельная модель для делегирования: delegation.model и delegation.provider в конфигурации направляют подагентов на более дешёвые модели."
  t255: "delegation.reasoning_effort независимо управляет глубиной размышления подагентов."
  t256: "display.platforms в config.yaml позволяет переопределять отображение для каждой платформы: {telegram: {tool_progress: all}}."
  t257: "human_delay.mode в конфигурации имитирует скорость человеческого набора — диапазон настраивается через min_ms/max_ms."
  t258: "Миграции версий конфигурации выполняются автоматически при загрузке — новые ключи появляются без ручного вмешательства."
  t259: "Модели GPT и Codex получают специальные указания в системном промпте о дисциплине и обязательном использовании инструментов."
  t260: "Модели Gemini получают отдельные директивы об абсолютных путях, параллельных вызовах инструментов и неинтерактивных командах."
  t261: "context.engine в config.yaml можно задать именем плагина, чтобы использовать альтернативную стратегию управления контекстом."
  t262: "Снимки страниц браузера длиннее 15 000 символов обрезаются или автоматически суммируются; полный снимок сохраняется в cache/web для постраничного чтения через read_file."
  t263: "Компрессор делает дешёвый предварительный проход: выводы инструментов длиннее 200 символов заменяются заглушками ещё до запуска LLM."
  t264: "Если сжатие не удалось, следующие попытки приостанавливаются на 10 минут, чтобы не заваливать API запросами."
  t265: "Для длинных опасных команд (>70 символов) в запросе одобрения появляется вариант 'view' — можно сначала посмотреть полный текст."
  t266: "Визуализация уровня звука показывает полоски ▁▂▃▄▅▆▇ во время голосовой записи на основе RMS-уровня микрофона."
  t267: "Имена профилей не могут совпадать с бинарниками в PATH — 'hermes profile create ls' будет отклонено."
  t268: "hermes profile create backup --clone-all копирует всё (конфигурацию, ключи, SOUL.md, память, навыки, сеансы)."
  t269: "Клавиша голосовой записи настраивается через voice.record_key в config.yaml — не обязательно Ctrl+B."
  t270: "Файлы .cursorrules и .cursor/rules/*.mdc обнаруживаются автоматически и загружаются как контекст проекта."
  t271: "Контекстные файлы проверяются на 10+ шаблонов инъекций в промпт — невидимый Unicode, 'ignore instructions', попытки утечки данных."
  t272: "GPT-5 и Codex используют в формате сообщений роль 'developer' вместо 'system'."
  t273: "Вспомогательные переопределения по задачам: auxiliary.vision.provider, auxiliary.compression.model и т. д. в config.yaml."
  t274: "Вспомогательный клиент считает 'main' псевдонимом провайдера — он разворачивается в ваш реальный основной провайдер и модель."
  t275: "hermes claw migrate --dry-run показывает, как пройдёт миграция из OpenClaw, ничего не записывая."
  t276: "Пути к файлам, вставленные с кавычками или экранированными пробелами, обрабатываются автоматически — чистить вручную не нужно."
  t277: "Слеш-команды никогда не сворачиваются как большая вставка — /команда с объёмными аргументами работает корректно."
  t278: "В режиме прерывания слеш-команды, введённые во время работы агента, обходят логику прерывания и выполняются сразу."
  t279: "HERMES_DEV=1 отключает определение контейнерного режима для локальной разработки."
  t280: "Каждый MCP-сервер получает свой набор инструментов (mcp-servername), который можно включать и выключать отдельно через hermes tools."
  t281: "Плейсхолдеры MCP ${ENV_VAR} в конфигурации подставляются при запуске сервера — включая переменные из ~/.hermes/.env."
  t282: "Навыки из доверенных репозиториев (NousResearch) получают уровень безопасности 'trusted'; навыки сообщества проходят дополнительное сканирование."
  t283: "Карантин навыков в ~/.hermes/skills/.hub/quarantine/ хранит навыки, ожидающие проверки безопасности."
  t284: "/steer <промпт> вставляет заметку после следующего вызова инструмента — корректируйте направление посреди задачи без прерывания."
  t285: "/goal <текст> задаёт постоянную цель Ralph-цикла — Hermes продолжает ход за ходом, пока судья не скажет, что готово."
  t286: "/snapshot create [метка] сохраняет полный снимок состояния конфигурации Hermes; /snapshot restore <id> позже его возвращает."
  t287: "/copy [N] копирует последний ответ ассистента в буфер обмена, а с числом — N-й ответ с конца."
  t288: "/redraw принудительно перерисовывает весь интерфейс, исправляя сбои терминала после изменения размера tmux или артефактов выделения мышью."
  t289: "/agents (псевдоним /tasks) показывает активных агентов и запущенные фоновые задачи в текущем сеансе."
  t290: "/footer переключает нижний колонтитул шлюза в финальных ответах с моделью, % контекста и cwd."
  t291: "/busy queue|steer|interrupt определяет, что делает нажатие Enter, пока Hermes работает."
  t292: "/topic в личных сообщениях Telegram включает режим тем с несколькими сеансами под вашим управлением — /topic <id> возвращает прошлые сеансы прямо в чат."
  t293: "/approve session|always выполняет ожидающую опасную команду с выбранным вами уровнем доверия; /deny отклоняет её."
  t294: "/restart аккуратно перезапускает шлюз после завершения активных запусков, а затем уведомляет запросившего, когда всё снова работает."
  t295: "/kanban boards switch <slug> меняет активную многопроектную доску Kanban прямо из чата."
  t296: "/reload перечитывает ~/.hermes/.env в работающем сеансе — подхватывайте новые API-ключи без перезапуска."
  t297: "cronjob с no_agent=True запускает скрипт по расписанию и отправляет его stdout напрямую — ноль токенов, ноль LLM."
  t298: "Пустой stdout cron-скрипта означает тихий тик — ничего не доставляется, идеально для сторожевых проверок порогов."
  t299: "HERMES_CRON_MAX_PARALLEL (по умолчанию 4) ограничивает число cron-задач за тик, чтобы всплески не перегружали ваши ключи."
  t300: "Хуки шлюза живут в ~/.hermes/hooks/<имя>/ с HOOK.yaml и handler.py — обработчик должен называться `handle`."
  t301: "События хуков включают gateway:startup, session:start, agent:step и подписки по маске command:*."
  t302: "Положите чеклист в ~/.hermes/BOOT.md — и хук gateway:startup будет выполнять его одноразовым агентом при каждой загрузке."
  t303: "hermes curator run --dry-run показывает, что куратор архивировал бы или объединил, ничего не меняя."
  t304: "hermes curator pin <навык> жёстко защищает навык и от автоархивации, и от инструмента skill_manage агента."
  t305: "hermes curator rollback восстанавливает навыки из снимка перед запуском — резервные копии лежат в skills/.curator_backups/."
  t306: "hermes auth reset <провайдер> [цель] сбрасывает задержки и флаги исчерпания для всего пула учётных данных или для одного из них — по индексу, id или метке."
  t307: "credential_pool_strategies.<провайдер>: round_robin перебирает ключи по кругу вместо стратегии fill_first по умолчанию."
  t308: "use_gateway: true для отдельного инструмента направляет web, image, tts или browser через вашу подписку Nous — без дополнительных ключей."
  t309: "provider_routing.data_collection: deny исключает провайдеров OpenRouter, которые хранят данные."
  t310: "provider_routing.require_parameters: true направляет запросы только к провайдерам, поддерживающим каждый параметр вашего запроса."
  t311: "HERMES_TUI_RESUME=1 автоматически подключается к последнему сеансу TUI при запуске — удобно после обрыва SSH."
  t312: "HERMES_TUI_THEME=light|dark|<hex> принудительно задаёт тему TUI в терминалах, которые не выставляют COLORFGBG."
  t313: "Ctrl+G или Ctrl+X Ctrl+E в TUI открывает буфер ввода в $EDITOR для длинных многострочных промптов."
  t314: "TUI отображает LaTeX прямо в тексте — $E=mc^2$ превращается в математические символы Unicode вместо сырого TeX."
  t315: "hermes dashboard запускает локальный веб-интерфейс на 127.0.0.1:9119 — данные не покидают localhost."
  t316: "hermes dashboard встраивает полный TUI Hermes в браузер через xterm.js и PTY по WebSocket."
  t317: "Положите YAML с двумя цветами палитры в ~/.hermes/dashboard-themes/ — и вся панель сменит оформление."
  t318: "Плагины панели подключаются простым копированием: manifest.json + JS-бандл в ~/.hermes/dashboard-plugins/ — сборка npm не нужна."
  t319: "layoutVariant: cockpit в теме панели добавляет левую полосу шириной 260px, которую плагины могут заполнять через слот sidebar."
  t320: "display.tool_progress_command: true открывает /verbose на платформах обмена сообщениями; по умолчанию команда доступна только в CLI."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result уведомляет только о завершении фоновых задач (в отличие от concise/all/error/off)."
  t322: "HERMES_WRITE_SAFE_ROOT ограничивает write_file/patch указанными префиксами каталогов; несколько путей — через os.pathsep (: или ;)."
  t323: "HERMES_IGNORE_RULES отключает автоподстановку AGENTS.md, SOUL.md, .cursorrules, памяти и предзагруженных навыков."
  t324: "HERMES_ACCEPT_HOOKS автоматически одобряет ещё не виденные shell-хуки из config.yaml без запроса в TTY."
  t325: "auxiliary.goal_judge.model направляет судью /goal на дешёвую быструю модель, чтобы стоимость цикла оставалась почти нулевой."
  t326: "Контрольные точки пропускают каталоги с более чем 50 000 файлов, чтобы избежать медленных git-операций в огромных монорепозиториях."
  t327: "tts.provider: piper запускает локальный TTS на CPU с поддержкой 44 языков — голоса автоматически скачиваются в ~/.hermes/cache/piper-voices/."
  t328: "tts.providers.<name>.type: command подключает любой CLI-движок TTS через плейсхолдеры {input_path} и {output_path}."
  t329: "API_SERVER_ENABLED=true поднимает рядом со шлюзом OpenAI-совместимый эндпоинт для Open WebUI и LibreChat."
  t330: "GATEWAY_PROXY_URL включает раздельную схему: ввод-вывод платформ локально, работа агента делегируется удалённому API-серверу."
  t331: "MATRIX_DEVICE_ID закрепляет постоянный ID устройства для E2EE — без него ключи меняются при каждом запуске, и расшифровка истории ломается."
  t332: "TELEGRAM_WEBHOOK_SECRET обязателен, если задан TELEGRAM_WEBHOOK_URL — сгенерируйте его командой openssl rand -hex 32."
  t333: "batch_runner.py --resume сопоставляет выполненные промпты по тексту, поэтому перестановка датасета не перезапускает готовую работу."
  t334: "/new начинает новый сеанс на месте (псевдоним /reset) — новый ID сеанса, чистая история, CLI остаётся открытым."
  t335: "/clear очищает экран терминала И начинает новый сеанс — один шаг для визуального сброса."
  t336: "/history выводит текущий разговор прямо в CLI, не покидая его — удобно, чтобы быстро перечитать."
  t337: "/save записывает текущий разговор на диск, не завершая сеанс."
  t338: "/status показывает сведения о сеансе одним взглядом: ID, название, модель, расход токенов и прошедшее время."
  t339: "/image <путь> прикрепляет локальный файл изображения к вашему следующему промпту без вставки и перетаскивания."
  t340: "/platforms показывает состояние подключения шлюза и платформ обмена сообщениями прямо из чата."
  t341: "/commands выводит постранично полный список слеш-команд и установленных навыков — удобно на платформах без автодополнения по Tab."
  t342: "/toolsets перечисляет все доступные наборы инструментов, чтобы вы знали, что принимает -t/--toolsets."
  t343: "/voice tts включает режим «только TTS» — агент отвечает голосом, а вы по-прежнему печатаете промпты."
  t344: "/reload-skills заново сканирует ~/.hermes/skills/, чтобы добавленные навыки появились без перезапуска сеанса."
  t345: "/indicator kaomoji|emoji|unicode|ascii выбирает стиль индикатора занятости TUI, который показывается во время работы агента."
  t346: "/debug загружает бандл поддержки (сведения о системе + логи) и возвращает ссылки, которыми можно поделиться — работает и в чате."
  t347: "hermes -z \"<промпт>\" — самый чистый одноразовый запуск: в stdout только итоговый ответ и ничего больше — идеально для конвейеров в скриптах."
  t348: "hermes chat --pass-session-id добавляет ID сеанса в системный промпт, чтобы агент мог ссылаться на него."
  t349: "hermes chat --image path/to/pic.png прикрепляет локальное изображение к одиночному запросу -q без отдельного шага загрузки."
  t350: "hermes chat --ignore-user-config пропускает активную пользовательскую конфигурацию — для воспроизводимых отчётов об ошибках и запусков в CI."
  t351: "hermes chat --source tool помечает программные чаты, чтобы они не засоряли hermes sessions list."
  t352: "hermes dump --show-keys включает замаскированные отпечатки API-ключей для более глубокой отладки с поддержкой."
  t353: "hermes sessions rename <ID> \"новое название\" переименовывает любой прошлый сеанс; hermes sessions delete <ID> удаляет его."
  t354: "hermes import восстанавливает полный zip-архив резервной копии Hermes; экспорты сеансов в JSON/JSONL импортируются со страницы Sessions в панели управления."
  t355: "hermes fallback управляет цепочкой fallback_model интерактивно — без ручного редактирования config.yaml."
  t356: "hermes pairing перевыпускает токен сопряжения для личных сообщений — первый написавший после ротации получает доступ к боту."
  t357: "hermes setup проводит новых пользователей через настройку провайдера, ключей и платформ в одном интерактивном сценарии."
  t358: "hermes status --deep выполняет полную проверку состояния всех компонентов; обычный hermes status — быстрый обзор."
  t359: "HERMES_AGENT_TIMEOUT=0 отключает завершение работающего агента шлюзом по неактивности — используйте для долгих исследовательских запусков."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 автоматически загружает локальные плагины репозитория из ./.hermes/plugins/ — с обязательной проверкой доверия."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 отключает защиту «файл изменился с момента чтения» в patch и write_file."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true разрешает веб-инструментам обращаться к localhost и частным сетям — в режиме шлюза по умолчанию выключено."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 автоматически устанавливает дополнительные навыки из опционального каталога при первом запуске профиля."
  t364: "HERMES_BUNDLED_SKILLS указывает на собственное дерево встроенных навыков — используется при упаковке для Homebrew и Nix."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 выводит содержимое каждого API-запроса в stdout вместо файлов логов."
  t366: "HERMES_OAUTH_TRACE=1 логирует замаскированные попытки обмена и обновления OAuth-токенов для отладки авторизации у провайдера."
  t367: "HERMES_STREAM_RETRIES (по умолчанию 3) задаёт число попыток переподключения посреди потока при временных сетевых ошибках."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false отключает подтверждения ⚡/⏳/⏩, когда пользователь пишет занятому агенту."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (по умолчанию 180s) задаёт, как часто шлюз сообщает о ходе выполнения на долгих ходах."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (по умолчанию 900s) ограничивает, сколько /restart ждёт завершения текущих запусков перед принудительным перезапуском."
  t371: "HERMES_CHECKPOINT_TIMEOUT (по умолчанию 30s) ограничивает время создания контрольной точки файловой системы — увеличьте на огромных монорепозиториях."
  t372: "image_gen.model в config.yaml выбирает модель FAL: flux-2/klein, gpt-image-2, nano-banana-pro и другие."
  t373: "image_gen.provider направляет генерацию изображений через плагин (OpenAI Images, Codex, FAL) вместо варианта по умолчанию."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY направляют анализ изображений на любой OpenAI-совместимый эндпоинт."
  t375: "security.tirith_fail_open: false заставляет Hermes блокировать команды, когда сам сканер tirith выдаёт ошибку."
  t376: "Переменная окружения TIRITH_FAIL_OPEN переопределяет настройку tirith_fail_open — быстрый переключатель без правки config.yaml."
  t377: "Чаты с --source tool по умолчанию исключены из hermes sessions list — укажите --source явно, чтобы увидеть их."
  t378: "ID сеансов начинаются с метки времени (20250305_091523_abcd), поэтому они естественно сортируются в ls и jq."
  t379: "API_SERVER_MODEL_NAME задаёт имя модели в /v1/models — незаменимо для многопрофильных установок Open WebUI."
  t380: "Плагины панели управления раздаются из /dashboard-plugins/<name>/ — положите файлы в ~/.hermes/dashboard-plugins/."
