    p04: "Спланируй функцию, а затем реализуй её шаг за шагом"
    p05: "Найди и исправь падающий тест"
    p06: "Изучи эту тему и напиши мне краткую справку"
    p07: "Что недавно изменилось в этом репозитории?"
    p08: "Преврати эти заметки в список дел"
