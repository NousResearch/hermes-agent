    new_header: "В этом топике начат новый сеанс Hermes.\n\nСовет: для параллельной работы откройте «Все сообщения» и отправьте сообщение туда, чтобы создать отдельный топик, вместо /new здесь. /new заменяет сеанс, привязанный к текущему топику."
    help: "/topic — включить многосеансовый режим в ЛС (один бот, много параллельных чатов)\n\nИспользование:\n  /topic             Включить режим топиков или показать статус, если он уже включён\n  /topic help        Показать это сообщение\n  /topic off         Выключить режим топиков и сбросить привязки топиков\n  /topic <id>        Внутри топика: восстановить предыдущий сеанс по ID\n\nКак это работает:\n1. Выполните /topic один раз в этих ЛС — Hermes проверит, что в BotFather\n   включены Threads Settings, и активирует многосеансовый режим.\n2. Нажмите «Все сообщения» вверху бота и отправьте любое сообщение.\n   Telegram создаст для него новый топик; каждый топик —\n   независимый сеанс Hermes (новая история, новый контекст).\n3. Корневые ЛС становятся системным лобби — отправляйте туда /topic, /status,\n   /help, /usage. Обычные промпты пишите в топике.\n4. /new внутри топика сбрасывает сеанс только этого топика.\n5. /topic <id> внутри топика восстанавливает в него старый сеанс."
