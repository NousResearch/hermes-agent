  t096: "Yedek bir sağlayıcıya otomatik geçiş için config.yaml içinde fallback_model ayarlayın."
  t097: "Kullanıcı kimliklerini ve telefon numaralarını LLM'e göndermeden önce hash'lemek için privacy.redact_pii: true ayarlayın."
