  t022: "/browser connect tarayıcı araçlarını CDP üzerinden çalışan Chromium tabanlı tarayıcınıza bağlar."
  t023: "/plugins kurulu eklentileri ve durumlarını listeler."
  t024: "/cron zamanlanmış görevleri yönetir — herhangi bir platforma teslim edilen yinelenen istemler kurun."
  t025: "/reload-mcp MCP sunucu yapılandırmasını yeniden başlatmadan anında yeniden yükler."
  t026: "/usage token kullanımını, maliyet dağılımını ve oturum süresini gösterir."
  t027: "/insights son 30 günün kullanım analizlerini gösterir."
  t028: "/paste panonuzda görsel olup olmadığını kontrol eder ve sonraki mesajınıza ekler."
  t029: "/profile hangi profilin etkin olduğunu ve ana dizinini gösterir."
  t030: "/config mevcut yapılandırmanızı tek bakışta gösterir."
  t031: "/stop ajanın başlattığı tüm çalışan arka plan süreçlerini sonlandırır."
  t032: "@file:path/to/file.py dosya içeriğini doğrudan mesajınıza ekler."
  t033: "@file:main.py:10-50 bir dosyanın yalnızca 10-50. satırlarını ekler."
