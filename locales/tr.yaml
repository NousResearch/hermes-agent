    compression_closed: "tur durduruldu çünkü bu oturum bağlam sıkıştırmasıyla döndürüldü ve canlı devamı devralınamadı. Depolamanın kendisi sağlam — yeni oturum kimliğini alması için istemciyi yenileyin (veya yeni bir tur başlatın), sonra mesajınızı yeniden gönderin."
    turn_lease: "tur durduruldu çünkü başka bir Hermes süreci bu oturumu devraldı. Yanıtınız kaydedilmedi — diğer sürecin bitmesini bekleyin, sonra mesajınızı yeniden gönderin."
    session_row_missing: "bu oturum sohbet hâlâ açıkken depolamadan silindi ve Hermes onu yeniden oluşturamadı; bu nedenle bu mesaj kaydedilmedi. Mesajınızı yeniden gönderin; sorun sürerse `hermes {profile_arg}doctor` çalıştırın."
    locked: "tur durduruldu çünkü oturum depolaması meşguldü (başka bir Hermes süreci durum veritabanına yazıyordu). Mesajınız zaten kaydedilmiş olmalı — lütfen birazdan yeniden gönderin."
    replaced: "oturum veritabanı dosyası Hermes çalışırken değiştirildi; bu nedenle bu mesaj kaydedilmedi (bir kopyası {home}/sessions/ altında tutuluyor). Hermes'i durdurun (`hermes {profile_arg}gateway stop`), `hermes {profile_arg}doctor` çalıştırın — `hermes {profile_arg}doctor --fix` DEĞİL; o, yanlış dosyayı yerinde onarır — sonra yeniden başlatıp mesajınızı bir kez daha gönderin. İleri düzey kurtarma adımları günlükte."
    deleted_wal: "başka bir Hermes süreci oturum veritabanının önceden yazma günlüğünün (WAL) eski bir kopyasını hâlâ tutuyor; bu yüzden Hermes dosyayı korumak için yazmayı durdurdu ve bu mesaj kaydedilmedi (bir kopyası {home}/sessions/ altında tutuluyor). Hiçbir şey kaybolmadı. Bu profildeki her Hermes sürecinden çıkın (Masaüstü uygulaması, `hermes {profile_arg}gateway stop`, panel, cron), `hermes {profile_arg}doctor` çalıştırın — günlüğü hâlâ tutan süreçleri adıyla gösterir — sonra Hermes'i yeniden başlatıp mesajınızı bir kez daha gönderin. Süreçler çalışırken `doctor --fix` çalıştırmayın ve hiçbir state.db dosyasını silmeyin. Kılavuz: {recovery_docs}"
    corrupt: "tur durduruldu çünkü durum veritabanı yapısal bozulma bildirdi (yeniden başlatmada transkript kaybolacaktı). Disk alanı boşaltmak işe yaramaz. Kurtarma seçenekleri:\n1. `hermes {profile_arg}doctor --fix` çalıştırın\n2. Gateway'i durdurun, sonra şununla kurtarın:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (kurtarılabilir bildirirse) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — kurtarma önce hasarlı dosyanın anlık görüntüsünü alır; canlı state.db üzerinde `sqlite3 ... \\\".recover\\\"` ÇALIŞTIRMAYIN, güvenlik açığı olan bir sqlite3 CLI dosyayı daha da bozabilir\n3. {backups_dir}/ içindeki bir yedekten geri yükleyin\nArdından mesajınızı yeniden gönderin."
    fts_index: "tur durduruldu çünkü oturum arama dizini (FTS5) bozuk ve ayrılamadı; bu nedenle bu mesaj kaydedilmedi. Mesaj deposunun kendisi hasarlı değil: kurtarma araçları çalıştırmayın ve yedek geri yüklemeyin. `hermes {profile_arg}doctor --fix` çalıştırın (veya Hermes'i yeniden başlatın; dizini açılışta onarır), sonra mesajınızı yeniden gönderin."
    disk: "Hermes bu konuşmayı diske kaydedemedi; mesajlarınızı kaybetmektense durdu. Disk büyük olasılıkla dolu: biraz yer açın (veya {home}/state.db dosyasının izinlerini düzeltin), sonra mesajınızı yeniden gönderin."
    default: "Hermes bu konuşmayı kaydedemedi; mesajlarınızı kaybetmektense durdu. Olası nedenler: sürücüde yer kalmamış ya da başka bir Hermes süreci veritabanını tutuyor. Diğer Hermes pencerelerini kapatın, depolamayı kontrol etmek için `hermes {profile_arg}doctor` çalıştırın, sonra mesajınızı yeniden gönderin."
