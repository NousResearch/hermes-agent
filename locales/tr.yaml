  t228: "execute_code yardımcıları açık içe aktarma gerektirir: from hermes_tools import json_parse, shell_quote, retry."
  t229: "execute_code'un 7 sandbox aracı (web_search, terminal, read/write/search/patch) RPC kullanır — asla bağlama girmez."
  t230: "Aynı dosya bölgesini 3+ kez okumak uyarı tetikler. 4+ kez okumada döngüleri önlemek için kesin olarak engellenir."
  t231: "write_file ve patch, dosyanın son okumadan sonra dışarıdan değiştirildiğini algılar ve bayatlık konusunda uyarır."
  t232: "V4A yama biçimi yalnızca Update değil, Add File, Delete File ve Move File yönergelerini de destekler."
  t233: "MCP sunucuları sampling üzerinden LLM tamamlamaları isteyebilir — ajan, sunucu için bir araca dönüşür."
  t234: "MCP sunucuları, yeniden başlatma gerektirmeden otomatik araç yeniden kaydını tetiklemek için notifications/tools/list_changed gönderir."
  t235: "acp_command: 'claude' ile delegate_task, herhangi bir platformdan Claude Code'u alt ajan olarak başlatır."
  t236: "Delegasyonun bir heartbeat iş parçacığı vardır — alt ajan etkinliği üst ajana aktarılır ve gateway zaman aşımları önlenir."
  t237: "Bir sağlayıcı HTTP 402 (ödeme gerekli) döndürdüğünde yardımcı istemci otomatik olarak bir sonrakine geçer."
  t238: "agent.tool_use_enforcement, araç çağırmak yerine eylemleri betimleyen modelleri yönlendirir — GPT/Codex için otomatik."
  t239: "agent.restart_after_turn_timeout, /restart stop() aşamasına girmeden önce süren turların bitmesine izin verir; restart_drain_timeout ise yalnızca stop() başladıktan sonraki zorla kesme bütçesidir."
  t240: "agent.api_max_retries (varsayılan 3), ajanın hatayı göstermeden önce başarısız bir API çağrısını kaç kez yeniden deneyeceğini belirler — hızlı yedeğe geçiş için düşürün."
  t241: "Gateway, AIAgent örneklerini oturum başına önbelleğe alır — bu önbelleği yok etmek Anthropic istem önbelleğini bozar."
  t242: "Herhangi bir web sitesi /.well-known/skills/index.json üzerinden skill yayımlayabilir — skill hub'ı bunları otomatik keşfeder."
  t243: "~/.hermes/skills/.hub/audit.log konumundaki skill denetim günlüğü her kurma ve kaldırma işlemini kaydeder."
  t244: "Bayat git worktree'leri başlangıçta otomatik temizlenir: temiz, tamamen birleştirilmiş ağaçlar budanır; kirli veya push edilmemiş çalışmalar her zaman korunur."
  t245: "Profiller Hermes durumunu HERMES_HOME ile ayırır; terminal.home_mode profile olarak ayarlanmadıkça ana makine araç alt süreçleri gerçek HOME'unuzu korur."
  t246: "HERMES_HOME_MODE ortam değişkeni (sekizlik, örn. 0701), web sunucusu erişimi için özel dizin izinleri belirler."
  t247: "Container modu: HERMES_HOME içine .container-mode koyun; ana makine CLI'sı otomatik olarak container içine geçer."
  t248: "Ctrl+C'nin 5 öncelik kademesi vardır: kaydı iptal et → istemleri iptal et → seçiciyi iptal et → ajanı kes → çık."
  t249: "Ajan çalışması sırasındaki her kesme, zaman damgasıyla ~/.hermes/interrupt_debug.log dosyasına kaydedilir."
  t250: "BROWSER_CDP_URL, tarayıcı araçlarını çalışan herhangi bir Chromium ailesi tarayıcıya bağlar — WebSocket, HTTP veya host:port kabul eder."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true, özel Chromium ile gelişmiş tespit önlemeyi etkinleştirir (Scale Plan)."
  t252: "CLI, 80 sütundan dar terminallerde otomatik olarak kompakt moda geçer."
  t253: "Hızlı komutlar iki türü destekler: exec (kabuk komutunu doğrudan çalıştır) ve alias (başka bir komuta yönlendir)."
  t254: "Görev başına delegasyon modeli: yapılandırmadaki delegation.model ve delegation.provider, alt ajanları daha ucuz modellere yönlendirir."
  t255: "delegation.reasoning_effort, alt ajanların düşünme derinliğini bağımsız olarak denetler."
  t256: "config.yaml içindeki display.platforms, platform bazında görüntü geçersiz kılmalarına izin verir: {telegram: {tool_progress: all}}."
  t257: "Yapılandırmadaki human_delay.mode insan yazma hızını taklit eder — min_ms/max_ms aralığı ayarlanabilir."
  t258: "Yapılandırma sürüm geçişleri yüklemede otomatik çalışır — yeni yapılandırma anahtarları elle müdahale gerektirmeden görünür."
  t259: "GPT ve Codex modelleri, araç disiplini ve zorunlu araç kullanımı için özel sistem istemi yönlendirmesi alır."
  t260: "Gemini modelleri mutlak yollar, paralel araç çağrıları ve etkileşimsiz komutlar için özel yönergeler alır."
  t261: "config.yaml içindeki context.engine, alternatif bağlam yönetimi stratejileri için bir eklenti adına ayarlanabilir."
  t262: "15.000 karakteri aşan tarayıcı sayfa anlık görüntüleri kırpılır veya otomatik özetlenir; tam anlık görüntü read_file ile sayfalamak için cache/web altına kaydedilir."
  t263: "Sıkıştırıcı ucuz bir ön geçiş yapar: LLM çalışmadan önce 200 karakteri aşan araç çıktıları yer tutucularla değiştirilir."
  t264: "Sıkıştırma başarısız olduğunda API'yi yormamak için sonraki denemeler 10 dakika duraklatılır."
  t265: "Uzun tehlikeli komutlar (>70 karakter) için onay isteminde tam metni önce görmenizi sağlayan bir 'görüntüle' seçeneği bulunur."
  t266: "Ses düzeyi görselleştirmesi, sesli kayıt sırasında mikrofon RMS düzeylerine göre ▁▂▃▄▅▆▇ çubukları gösterir."
  t267: "Profil adları PATH'teki mevcut ikili dosyalarla çakışamaz — 'hermes profile create ls' reddedilir."
  t268: "hermes profile create backup --clone-all her şeyi kopyalar (yapılandırma, anahtarlar, SOUL.md, bellekler, skill'ler, oturumlar)."
  t269: "Ses kayıt tuşu config.yaml içindeki voice.record_key ile ayarlanabilir — Ctrl+B ile sınırlı değildir."
  t270: ".cursorrules ve .cursor/rules/*.mdc dosyaları otomatik algılanır ve proje bağlamı olarak yüklenir."
  t271: "Bağlam dosyaları 10+ istem enjeksiyonu desenine karşı denetlenir — görünmez Unicode, 'talimatları yoksay', sızdırma girişimleri."
  t272: "GPT-5 ve Codex, mesaj biçiminde 'system' yerine 'developer' rolünü kullanır."
  t273: "Görev başına yardımcı geçersiz kılmalar: config.yaml içinde auxiliary.vision.provider, auxiliary.compression.model vb."
  t274: "Yardımcı istemci 'main' değerini bir sağlayıcı takma adı olarak ele alır — gerçek birincil sağlayıcınız + modelinize çözümlenir."
  t275: "hermes claw migrate --dry-run, OpenClaw geçişini hiçbir şey yazmadan önizler."
  t276: "Tırnaklı veya kaçış boşluklu yapıştırılan dosya yolları otomatik işlenir — elle temizlik gerekmez."
  t277: "Slash komutları büyük yapıştırma daraltmasını asla tetiklemez — büyük argümanlı /command doğru çalışır."
  t278: "Kesme modunda, ajan çalışırken yazılan slash komutları kesme mantığını atlar ve hemen çalışır."
  t279: "HERMES_DEV=1, yerel geliştirme için container modu algılamasını atlar."
  t280: "Her MCP sunucusu, hermes tools ile bağımsız olarak açılıp kapatılabilen kendi araç setini (mcp-servername) alır."
  t281: "Yapılandırmadaki MCP ${ENV_VAR} yer tutucuları sunucu başlatılırken çözümlenir — ~/.hermes/.env içindeki değişkenler dahil."
  t282: "Güvenilir depolardan (NousResearch) gelen skill'ler 'trusted' güvenlik düzeyi alır; topluluk skill'leri ek taramadan geçer."
  t283: "~/.hermes/skills/.hub/quarantine/ konumundaki skill karantinası, güvenlik incelemesi bekleyen skill'leri tutar."
  t284: "/steer <prompt>, bir sonraki araç çağrısından sonra bir not enjekte eder — görev ortasında kesmeden yön verin."
  t285: "/goal <text>, kalıcı bir Ralph döngüsü hedefi belirler — bir hakem tamamlandı deyinceye dek Hermes tur tur otomatik devam eder."
  t286: "/snapshot create [label], Hermes yapılandırmasının tam durum anlık görüntüsünü kaydeder; /snapshot restore <id> daha sonra geri döndürür."
  t287: "/copy [N], son asistan yanıtını panonuza kopyalar; sayı verilirse sondan N'inci yanıtı kopyalar."
  t288: "/redraw tam bir arayüz yenilemesi zorlar; tmux yeniden boyutlandırması veya fare seçimi kalıntılarından sonraki terminal kaymalarını düzeltir."
  t289: "/agents (takma adı /tasks), geçerli oturumdaki aktif ajanları ve çalışan arka plan görevlerini gösterir."
  t290: "/footer, son yanıtlarda model, bağlam yüzdesi ve cwd gösteren gateway alt bilgisini açar/kapatır."
  t291: "/busy queue|steer|interrupt, Hermes çalışırken Enter'a basmanın ne yapacağını belirler."
  t292: "Telegram DM'lerinde /topic, kullanıcı yönetimli çoklu oturum konu modunu etkinleştirir — /topic <id> geçmiş oturumları yerinde geri yükler."
  t293: "/approve session|always, bekleyen tehlikeli komutu seçtiğiniz güven kapsamıyla çalıştırır; /deny reddeder."
  t294: "/restart, aktif çalışmaları tamamlayıp gateway'i düzgün biçimde yeniden başlatır, ardından geri geldiğinde isteyeni bilgilendirir."
  t295: "/kanban boards switch <slug>, aktif çok projeli Kanban panosunu sohbet içinden değiştirir."
  t296: "/reload, ~/.hermes/.env dosyasını çalışan oturuma yeniden yükler — yeniden başlatmadan yeni API anahtarlarını alın."
  t297: "no_agent=True ile cronjob, bir betiği zamanlanmış olarak çalıştırır ve stdout çıktısını doğrudan gönderir — sıfır token, sıfır LLM."
  t298: "Boş cron betiği stdout çıktısı sessiz tik demektir — hiçbir şey teslim edilmez; eşik bekçileri için idealdir."
  t299: "HERMES_CRON_MAX_PARALLEL (varsayılan 4), anahtarlarınızın ani yüklerle dolmaması için tik başına çalışan cron işi sayısını sınırlar."
  t300: "Gateway kancaları ~/.hermes/hooks/<name>/ altında HOOK.yaml + handler.py ile bulunur — işleyici `handle` adında olmalıdır."
  t301: "Hook olayları arasında gateway:startup, session:start, agent:step ve command:* joker abonelikleri bulunur."
  t302: "~/.hermes/BOOT.md dosyasına bir kontrol listesi koyun; gateway:startup hook'u her açılışta onu tek seferlik bir ajan olarak çalıştırır."
  t303: "hermes curator run --dry-run, curator'ın neleri arşivleyeceğini veya birleştireceğini hiçbir şeyi değiştirmeden önizler."
  t304: "hermes curator pin <skill>, bir skill'i hem otomatik arşivlemeye hem de ajanın skill_manage aracına karşı sıkı biçimde korur."
  t305: "hermes curator rollback, skill'leri çalıştırma öncesi anlık görüntüden geri yükler — yedekler skills/.curator_backups/ altında durur."
  t306: "hermes auth reset <provider> [target], bekleme sürelerini ve tükenme işaretlerini tüm kimlik bilgisi havuzunda ya da dizin, id veya etikete göre tek bir kimlik bilgisinde temizler."
  t307: "credential_pool_strategies.<provider>: round_robin, varsayılan fill_first yerine anahtarları eşit biçimde sırayla kullanır."
  t308: "Araç başına use_gateway: true, web, image, tts veya browser'ı Nous aboneliğiniz üzerinden yönlendirir — ek anahtar gerekmez."
  t309: "provider_routing.data_collection: deny, OpenRouter'da veri saklayan sağlayıcıları dışarıda bırakır."
  t310: "provider_routing.require_parameters: true, yalnızca isteğinizdeki her parametreyi destekleyen sağlayıcılara yönlendirir."
  t311: "HERMES_TUI_RESUME=1, başlatıldığında en son TUI oturumuna otomatik olarak yeniden bağlanır — SSH kopmalarından sonra işe yarar."
  t312: "HERMES_TUI_THEME=light|dark|<hex>, COLORFGBG ayarlamayan terminallerde TUI temasını zorla belirler."
  t313: "TUI'de Ctrl+G veya Ctrl+X Ctrl+E, uzun çok satırlı istemler için giriş arabelleğini $EDITOR içinde açar."
  t314: "TUI, LaTeX'i satır içinde işler — $E=mc^2$ ham TeX yerine Unicode matematik olarak görünür."
  t315: "hermes dashboard, 127.0.0.1:9119 adresinde yerel bir web arayüzü başlatır — localhost dışına hiçbir veri çıkmaz."
  t316: "hermes dashboard, xterm.js ve bir WebSocket PTY aracılığıyla tam Hermes TUI'sini tarayıcınıza gömer."
  t317: "~/.hermes/dashboard-themes/ içine iki palet rengi içeren bir YAML koyarak tüm panelin görünümünü değiştirin."
  t318: "Panel eklentileri yerleştir-çalıştır mantığıyla çalışır: ~/.hermes/dashboard-plugins/ içine manifest.json + JS paketi — npm derlemesi gerekmez."
  t319: "Panel temasında layoutVariant: cockpit, eklentilerin sidebar yuvası üzerinden doldurabileceği 260 piksellik bir sol şerit ekler."
  t320: "display.tool_progress_command: true, /verbose komutunu mesajlaşma platformlarında da kullanılabilir yapar; varsayılan olarak yalnızca CLI'dadır."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result, yalnızca arka plan görevleri bitince bildirim gönderir (diğer seçenekler: concise/all/error/off)."
  t322: "HERMES_WRITE_SAFE_ROOT, write_file/patch araçlarını belirli dizin öneklerine kısıtlar; birden çok yol os.pathsep (: veya ;) ile ayrılır."
  t323: "HERMES_IGNORE_RULES, AGENTS.md, SOUL.md, .cursorrules, bellek ve önceden yüklenen skill'lerin otomatik eklenmesini atlar."
  t324: "HERMES_ACCEPT_HOOKS, config.yaml içinde tanımlı ancak daha önce görülmemiş kabuk hook'larını TTY sorusu olmadan otomatik onaylar."
  t325: "auxiliary.goal_judge.model, /goal değerlendiricisini ucuz ve hızlı bir modele yönlendirerek döngü maliyetini sıfıra yakın tutar."
  t326: "Kontrol noktaları, devasa monorepo'larda yavaş git işlemlerini önlemek için 50.000'den fazla dosya içeren dizinleri atlar."
  t327: "tts.provider: piper, CPU üzerinde 44 dilli yerel TTS çalıştırır — sesler ~/.hermes/cache/piper-voices/ dizinine otomatik indirilir."
  t328: "tts.providers.<name>.type: command, {input_path} ve {output_path} yer tutucularıyla herhangi bir CLI TTS motorunu bağlar."
  t329: "API_SERVER_ENABLED=true, Open WebUI ve LibreChat için gateway'in yanında OpenAI uyumlu bir uç nokta çalıştırır."
  t330: "GATEWAY_PROXY_URL bölünmüş bir kurulum sağlar: platform G/Ç'si yerelde, ajan işi uzak bir API sunucusuna devredilir."
  t331: "MATRIX_DEVICE_ID, E2EE için sabit bir cihaz kimliği belirler — yoksa anahtarlar her başlatmada değişir ve geçmiş mesajların şifresi çözülemez."
  t332: "TELEGRAM_WEBHOOK_URL ayarlandığında TELEGRAM_WEBHOOK_SECRET zorunludur — openssl rand -hex 32 ile üretin."
  t333: "batch_runner.py --resume, tamamlanan istemleri metne göre eşleştirir; böylece veri kümesi yeniden sıralansa bile biten işler tekrar çalışmaz."
  t334: "/new, yerinde yeni bir oturum başlatır (takma adı /reset) — yeni oturum kimliği, temiz geçmiş, CLI açık kalır."
  t335: "/clear, terminal ekranını siler VE yeni bir oturum başlatır — görsel sıfırlama için tek kısayol."
  t336: "/history, CLI'dan çıkmadan geçerli konuşmayı satır içinde yazdırır — hızlı bir yeniden okuma için kullanışlıdır."
  t337: "/save, oturumu sonlandırmadan geçerli konuşmayı diske yazar."
  t338: "/status, oturum bilgilerini tek bakışta gösterir: kimlik, başlık, model, token kullanımı ve geçen süre."
  t339: "/image <path>, yapıştırma veya sürükle-bırak olmadan sonraki isteminize yerel bir görüntü dosyası ekler."
  t340: "/platforms, gateway ve mesajlaşma platformu bağlantı durumunu doğrudan sohbet içinden gösterir."
  t341: "/commands, tüm slash komutu + kurulu skill listesini sayfalar halinde gösterir — tab tamamlaması olmayan platformlarda işe yarar."
  t342: "/toolsets, -t/--toolsets seçeneğinin neleri kabul ettiğini bilmeniz için mevcut tüm araç setlerini listeler."
  t343: "/voice tts, yalnızca TTS modunu açıp kapatır — ajan yanıtlarını sesli okur ama istemlerinizi yine siz yazarsınız."
  t344: "/reload-skills, ~/.hermes/skills/ dizinini yeniden tarar; böylece eklenen skill'ler oturumu yeniden başlatmadan görünür."
  t345: "/indicator kaomoji|emoji|unicode|ascii, ajan çalışırken TUI'de gösterilen meşgul göstergesi stilini seçer."
  t346: "/debug, bir destek paketi (sistem bilgisi + günlükler) yükler ve paylaşılabilir bağlantılar döndürür — sohbette de çalışır."
  t347: "hermes -z \"<prompt>\" en saf tek seferlik kullanımdır: stdout'a yalnızca nihai yanıt, başka hiçbir şey yok — betiklerde borulamak için idealdir."
  t348: "hermes chat --pass-session-id, oturum kimliğini sistem istemine ekler; böylece ajan kendi oturumuna atıfta bulunabilir."
  t349: "hermes chat --image path/to/pic.png, ayrı bir yükleme adımı olmadan tek bir -q sorgusuna yerel bir görüntü ekler."
  t350: "hermes chat --ignore-user-config, etkin kullanıcı yapılandırmasını atlar — tekrarlanabilir hata raporları ve CI çalıştırmaları için."
  t351: "hermes chat --source tool, programatik sohbetleri etiketler; böylece hermes sessions list çıktısını kalabalıklaştırmazlar."
  t352: "hermes dump --show-keys, daha derin destek hata ayıklaması için maskelenmiş API anahtarı parmak izlerini de içerir."
  t353: "hermes sessions rename <ID> \"new title\" geçmiş herhangi bir oturumu yeniden adlandırır; hermes sessions delete <ID> bir oturumu siler."
  t354: "hermes import, tam bir Hermes yedek zip'ini geri yükler; oturum JSON/JSONL dışa aktarımları panelin Oturumlar sayfasından içe aktarılır."
  t355: "hermes fallback, fallback_model zincirini etkileşimli olarak yönetir — config.yaml'ı elle düzenlemek gerekmez."
  t356: "hermes pairing, DM eşleştirme belirtecini yeniler — yenilemeden sonra ilk mesaj gönderen kişi bota erişimi alır."
  t357: "hermes setup, ilk kez kullananları sağlayıcı, anahtarlar ve platform bağlantısı adımlarından tek bir etkileşimli akışta geçirir."
  t358: "hermes status --deep, tüm bileşenlerde eksiksiz bir sağlık taraması yapar; sade hermes status hızlı görünümdür."
  t359: "HERMES_AGENT_TIMEOUT=0, çalışan bir ajan için gateway'in hareketsizlik nedeniyle sonlandırmasını kapatır — uzun araştırma çalıştırmalarında kullanın."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1, ./.hermes/plugins/ içindeki depoya özel eklentileri otomatik yükler — tasarım gereği güven onayına bağlıdır."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1, patch ve write_file üzerindeki 'dosya okuduğunuzdan beri değişti' korumasını kapatır."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true, web araçlarının localhost'a ve özel ağlara erişmesine izin verir — gateway modunda varsayılan olarak kapalıdır."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2, profil başına ilk çalıştırmada isteğe bağlı katalogdan ek skill'leri otomatik kurar."
  t364: "HERMES_BUNDLED_SKILLS, özel bir paketlenmiş skill ağacını gösterir — Homebrew ve Nix paketlemesinde kullanılır."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1, her API isteğinin yükünü günlük dosyaları yerine stdout'a döker."
  t366: "HERMES_OAUTH_TRACE=1, sağlayıcı kimlik doğrulamasında hata ayıklamak için maskelenmiş OAuth belirteç değişimi ve yenileme denemelerini günlüğe yazar."
  t367: "HERMES_STREAM_RETRIES (varsayılan 3), geçici ağ hatalarında akış ortasında yeniden bağlanma denemelerinin sayısını belirler."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false, bir kullanıcı meşgul bir ajana mesaj yazdığında gönderilen ⚡/⏳/⏩ onay mesajlarını susturur."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (varsayılan 180s), uzun turlarda gateway'in ne sıklıkla ilerleme bildirimi göndereceğini ayarlar."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (varsayılan 900s), /restart komutunun zorlamadan önce devam eden çalıştırmaları ne kadar bekleyeceğini sınırlar."
  t371: "HERMES_CHECKPOINT_TIMEOUT (varsayılan 30s), dosya sistemi kontrol noktası oluşturma süresini sınırlar — devasa monorepo'larda yükseltin."
  t372: "config.yaml içindeki image_gen.model, FAL modelini seçer: flux-2/klein, gpt-image-2, nano-banana-pro ve daha fazlası."
  t373: "image_gen.provider, görüntü üretimini varsayılan yerine bir eklenti (OpenAI Images, Codex, FAL) üzerinden yönlendirir."
