explainer:
  no_reply_prefix: "⚠️ Немає відповіді: "
  empty_response: "{model} цього разу не дала відповіді навіть після повторних спроб. Надішліть `continue`, щоб спробувати ще раз, або змініть модель через /model."
  exit:
    all_retries_exhausted_no_response: "провайдер моделі не відповів після всіх повторних спроб. Надішліть /retry або змініть модель через /model."
    partial_stream_recovery: "потокове виведення зупинилося зарано, і вдалося відновити лише частину відповіді. Надішліть `continue`, щоб продовжити з місця зупинки."
    fallback_prior_turn_content: "на цьому ході нового вмісту не створено; показано відновлений попередній контекст. Надішліть `continue`, щоб повторити."
    redirect_restart_limit_exceeded: "запит скасовувався новим виправленням на кожній спробі, тому хід зупинено замість нескінченних повторів. Ваше останнє виправлення поставлено в чергу як наступне повідомлення."
    rebuilt_restart_limit_exceeded: "кожен провайдер у ланцюжку резервування раз за разом перемикався далі, тому хід зупинено замість нескінченних повторів. Надішліть `continue` або змініть провайдера."
    budget_exhausted: "бюджет ітерацій/вартості на хід вичерпано до отримання остаточної відповіді. Надішліть `continue`, щоб продовжити."
    ollama_runtime_context_too_small: "контекстне вікно локальної моделі виявилося надто малим, щоб завершити. Збільште розмір контексту або скористайтеся більшою моделлю."
    pending_tool_result: "хід зупинився, коли результат інструмента ще очікувався, а модель не створила подальшого тексту. Надішліть `continue`, щоб вона підсумувала."
    interrupted_during_api_call: "запит було перервано посеред виклику, перш ніж надійшла відповідь. Надішліть `continue`, щоб повторити."
    max_iterations_reached: "досягнуто максимальну кількість ітерацій інструментів до отримання остаточної відповіді. Надішліть `continue`, щоб продовжити, або збільште `max_iterations`."
    error_near_max_iterations: "поблизу ліміту ітерацій сталася помилка до отримання остаточної відповіді. Перегляньте вивід інструмента вище, а потім надішліть `continue`."
    repeated_outer_errors: "хід раз за разом завершувався повторюваними помилками і був зупинений завчасно замість нескінченних повторів. Перегляньте помилки вище, а потім надішліть `continue`, щоб повторити."
  persistence:
    compression: "хід зупинено, бо інший процес стискав цей сеанс. Ваше повідомлення вже має бути збережене — надішліть його ще раз після завершення стиснення."
    compression_closed: "хід зупинено, бо цей сеанс було замінено новим через стиснення контексту, а його активне продовження не вдалося підхопити. Саме сховище справне — оновіть клієнт (або почніть новий хід), щоб він отримав новий ідентифікатор сеансу, і надішліть повідомлення ще раз."
    turn_lease: "хід зупинено, бо інший процес Hermes перебрав цей сеанс. Вашу відповідь не збережено — дочекайтеся, поки інший процес завершить роботу, і надішліть повідомлення ще раз."
    session_row_missing: "цей сеанс було видалено зі сховища, поки чат ще був відкритий, і Hermes не зміг відтворити його, тому це повідомлення не збережено. Надішліть повідомлення ще раз; якщо помилка повторюється, виконайте `hermes {profile_arg}doctor`."
    locked: "хід зупинено, бо сховище сеансів було зайняте (інший процес Hermes записував у базу даних стану). Ваше повідомлення вже має бути збережене — надішліть його ще раз за хвилину."
    replaced: "файл бази даних сеансів було замінено під час роботи Hermes, тому це повідомлення не збережено (копія зберігається в {home}/sessions/). Зупиніть Hermes (`hermes {profile_arg}gateway stop`), виконайте `hermes {profile_arg}doctor` — не `hermes {profile_arg}doctor --fix`, який виправив би на місці не той файл — потім запустіть його знову й надішліть повідомлення ще раз. Додаткові кроки відновлення є в журналі."
    deleted_wal: "інший процес Hermes досі тримає стару копію журналу випереджувального запису (WAL) бази даних сеансів, тому Hermes припинив запис, щоб не пошкодити файл, і це повідомлення не збережено (копія зберігається в {home}/sessions/). Нічого не втрачено. Закрийте всі процеси Hermes у цьому профілі (застосунок Desktop, `hermes {profile_arg}gateway stop`, панель керування, cron), виконайте `hermes {profile_arg}doctor` — він назве процес, який ще тримає журнал — потім знову запустіть Hermes і надішліть повідомлення ще раз. Не запускайте `doctor --fix` і не видаляйте файли state.db, поки вони працюють. Посібник: {recovery_docs}"
    corrupt: "хід зупинено, бо база даних стану повідомила про структурне пошкодження (стенограму було б втрачено після перезапуску). Звільнення місця на диску не допоможе. Варіанти відновлення:\n1. Виконайте `hermes {profile_arg}doctor --fix`\n2. Зупиніть шлюз, потім відновіть командами:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (якщо повідомляє, що відновлення можливе) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — відновлення спочатку робить знімок пошкодженого файлу; НЕ запускайте `sqlite3 ... \".recover\"` проти робочого state.db — вразливий CLI sqlite3 може пошкодити його ще більше\n3. Відновіть із резервної копії в {backups_dir}/\nПотім надішліть повідомлення ще раз."
    fts_index: "хід зупинено, бо індекс пошуку сеансів (FTS5) пошкоджено і його не вдалося від'єднати, тому це повідомлення не збережено. Саме сховище повідомлень не пошкоджене: не запускайте інструменти відновлення й не відновлюйте резервну копію. Виконайте `hermes {profile_arg}doctor --fix` (або перезапустіть Hermes — він виправляє індекс під час відкриття), потім надішліть повідомлення ще раз."
    disk: "Hermes не зміг зберегти цю розмову на диск, тому зупинився, щоб не втратити ваші повідомлення. Імовірно, диск переповнений: звільніть місце (або виправте права доступу до {home}/state.db), потім надішліть повідомлення ще раз."
    default: "Hermes не зміг зберегти цю розмову, тому зупинився, щоб не втратити ваші повідомлення. Можливі причини: на диску закінчилося місце або інший процес Hermes утримує базу даних. Закрийте інші вікна Hermes, виконайте `hermes {profile_arg}doctor`, щоб перевірити сховище, потім надішліть повідомлення ще раз."
  file_mutation:
    header: "⚠️ Перевірка змін файлів: {count} правок файлів НЕ ВДАЛОСЯ застосувати в цьому ході, попри будь-які формулювання вище, які можуть свідчити про інше. Виконайте `git status` або `read_file`, щоб перевірити, що насправді збереглося."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "не вдалося"
  shared:
    and_more: "  • … і ще {count}"
    the_model: "Модель"
tips:
  t001: "/bg <prompt> запускає завдання в окремому сеансі, а поточний залишається вільним; /btw <question> відповідає на побіжне питання про цю розмову, не перериваючи її."
  t002: "/branch розгалужує поточний сеанс, щоб ви могли дослідити інший напрямок, не втрачаючи прогресу."
  t003: "/compress вручну стискає контекст розмови, коли вона стає надто довгою."
  t004: "/rollback показує контрольні точки файлової системи — відновлюйте файли, які змінив агент, до будь-якого попереднього стану."
  t005: "/rollback diff 2 показує, що змінилося після контрольної точки 2, нічого не відновлюючи."
  t006: "/rollback 2 src/file.py відновлює один файл із певної контрольної точки."
  t007: "/title \"мій проєкт\" дає назву вашому сеансу — пізніше відновіть його через /resume або hermes -c."
  t008: "/resume продовжує роботу з того місця, де ви зупинилися в раніше названому сеансі."
  t009: "/queue <prompt> ставить повідомлення в чергу на наступний хід, не перериваючи поточний."
  t010: "/undo видаляє з розмови останній обмін репліками (ваше повідомлення та відповідь асистента)."
  t011: "/retry повторно надсилає ваше останнє повідомлення — корисно, коли відповідь агента вийшла не зовсім вдалою."
  t012: "/verbose перемикає режим показу прогресу інструментів: off → new → all → verbose."
  t013: "/reasoning high збільшує глибину роздумів моделі. /reasoning show показує міркування."
  t014: "/fast перемикає пріоритетну обробку для швидших відповідей API (залежить від провайдера)."
  t015: "/yolo пропускає всі запити на схвалення небезпечних команд до кінця сеансу."
  t016: "/model дозволяє змінити модель посеред сеансу — спробуйте /model sonnet або /model gpt-5."
  t017: "/model --global назавжди змінює вашу модель за замовчуванням."
  t018: "/personality pirate вмикає веселу особистість — 14 вбудованих варіантів від kawaii до shakespeare."
  t019: "/skin змінює тему CLI — спробуйте ares, mono, slate, poseidon або charizard."
  t020: "/statusbar перемикає постійний рядок стану з моделлю, токенами, % заповнення контексту, вартістю та тривалістю."
  t021: "/tools disable browser тимчасово вилучає інструменти браузера з поточного сеансу."
  t022: "/browser connect під'єднує інструменти браузера до вашого запущеного браузера на основі Chromium через CDP."
  t023: "/plugins показує встановлені плагіни та їхній стан."
  t024: "/cron керує запланованими завданнями — налаштуйте повторювані запити з доставкою на будь-яку платформу."
  t025: "/reload-mcp перезавантажує конфігурацію MCP-серверів на льоту, без перезапуску."
  t026: "/usage показує використання токенів, розбивку вартості та тривалість сеансу."
  t027: "/insights показує аналітику використання за останні 30 днів."
  t028: "/paste перевіряє, чи є в буфері обміну зображення, і прикріплює його до вашого наступного повідомлення."
  t029: "/profile показує, який профіль активний, і його домашній каталог."
  t030: "/config стисло показує вашу поточну конфігурацію."
  t031: "/stop зупиняє всі фонові процеси, запущені агентом."
  t032: "@file:path/to/file.py вставляє вміст файлу безпосередньо у ваше повідомлення."
  t033: "@file:main.py:10-50 вставляє лише рядки 10-50 файлу."
  t034: "@folder:src/ вставляє дерево каталогу."
  t035: "@diff вставляє в повідомлення ваші неіндексовані зміни git."
  t036: "@staged вставляє ваші індексовані зміни git (git diff --staged)."
  t037: "@git:5 вставляє останні 5 комітів із повними патчами."
  t038: "@url:https://example.com завантажує та вставляє вміст вебсторінки."
  t039: "Введення @ запускає автодоповнення шляхів файлової системи — інтерактивно перейдіть до будь-якого файлу."
  t040: "Поєднуйте кілька посилань: \"Перевір @file:main.py та @file:test.py на узгодженість.\""
  t041: "Alt+Enter вставляє новий рядок для багаторядкового введення. (Windows Terminal перехоплює Alt+Enter — використовуйте натомість Ctrl+Enter.)"
  t042: "Ctrl+C перериває агента. Натисніть двічі протягом 2 секунд, щоб примусово вийти."
  t043: "Ctrl+Z згортає Hermes у фон — виконайте fg у своїй оболонці, щоб повернутися."
  t044: "Tab приймає текст-підказку автодоповнення або дописує слеш-команди."
  t045: "Введіть нове повідомлення, поки агент працює, щоб перервати його й скерувати в інший бік."
  t046: "Alt+V вставляє зображення з буфера обміну в розмову."
  t047: "Вставлення 5+ рядків автоматично зберігає їх у файл і замість них додає компактне посилання."
  t048: "hermes -c відновлює ваш останній сеанс CLI. hermes -c \"назва проєкту\" відновлює за назвою."
  t049: "hermes -w створює ізольоване робоче дерево git (worktree) — ідеально для паралельних робочих процесів агентів."
  t050: "hermes -w -q \"Виправ issue #42\" поєднує ізоляцію в робочому дереві з одноразовим запитом."
  t051: "hermes chat -t web,terminal вмикає лише певні набори інструментів для сфокусованого сеансу."
  t052: "hermes chat -s github-pr-workflow попередньо завантажує навичку під час запуску."
  t053: "hermes chat -q \"запит\" виконує один неінтерактивний запит і завершує роботу."
  t054: "hermes chat --max-turns 1000 перевизначає стандартний ліміт у 500 ітерацій на хід."
  t055: "hermes chat --checkpoints вмикає знімки файлової системи перед кожною руйнівною зміною файлів."
  t056: "hermes --yolo обходить усі запити на схвалення небезпечних команд протягом усього сеансу."
  t057: "hermes chat --source telegram позначає сеанс тегом для фільтрування в hermes sessions list."
  t058: "hermes -p work chat запускається під певним профілем, не змінюючи ваш профіль за замовчуванням."
  t059: "hermes doctor --fix діагностує та автоматично виправляє проблеми з конфігурацією й залежностями."
  t060: "hermes dump виводить компактне зведення налаштувань — зручно для звітів про помилки."
  t061: "hermes config set KEY VALUE автоматично зберігає секрети в .env, а все інше — у config.yaml."
  t062: "hermes config edit відкриває config.yaml у вашому редакторі за замовчуванням."
  t063: "hermes config check шукає відсутні або застарілі параметри конфігурації."
  t064: "hermes sessions browse відкриває інтерактивний вибір сеансів із пошуком."
  t065: "hermes sessions stats показує кількість сеансів за платформами та розмір бази даних."
  t066: "hermes sessions prune --older-than 30 очищає старі сеанси."
  t067: "hermes skills search react --source skills-sh шукає в публічному каталозі skills.sh."
  t068: "hermes skills check перевіряє встановлені навички з хабу на наявність оновлень."
  t069: "hermes skills tap add myorg/skills-repo додає власне джерело навичок на GitHub."
  t070: "hermes skills snapshot export setup.json експортує вашу конфігурацію навичок для резервного копіювання або обміну."
  t071: "hermes mcp add github --command npx додає MCP-сервери з командного рядка."
  t072: "hermes mcp serve запускає сам Hermes як MCP-сервер для інших агентів."
  t073: "hermes auth add дозволяє додати кілька API-ключів для ротації пулу облікових даних."
  t074: "hermes completion bash >> ~/.bashrc вмикає автодоповнення через Tab для всіх команд і профілів."
  t075: "hermes logs -f стежить за agent.log у реальному часі. --level WARNING --since 1h фільтрує вивід."
  t076: "hermes backup створює zip-архів усього домашнього каталогу Hermes."
  t077: "hermes profile create coder створює ізольований профіль, який стає окремою командою."
  t078: "hermes profile create work --clone копіює вашу поточну конфігурацію та ключі в новий профіль."
  t079: "hermes update автоматично синхронізує нові вбудовані навички з УСІМА профілями."
  t080: "hermes gateway install налаштовує Hermes як системну службу (systemd/launchd)."
  t081: "hermes memory setup дозволяє налаштувати зовнішнього провайдера пам'яті (Honcho, Mem0 тощо)."
  t082: "hermes webhook subscribe створює керовані подіями маршрути вебхуків із перевіркою HMAC."
  t083: "Заощаджуйте: hermes tools вимикає невикористовувані інструменти, hermes skills config скорочує набір навичок."
  t084: "/reasoning low або /reasoning minimal зменшує глибину роздумів нижче стандартного рівня (medium) — швидші й дешевші відповіді."
  t085: "hermes models спрямовує завдання зору, стиснення та допоміжні задачі на дешевші моделі — скорочує фонові витрати токенів на 85%+ без погіршення основної моделі чату."
  t086: "Установіть display.bell_on_complete: true у config.yaml, щоб чути сигнал після завершення довгих завдань."
  t087: "Установіть display.streaming: true, щоб бачити токени в реальному часі, поки модель їх генерує."
  t088: "Установіть display.show_reasoning: true, щоб спостерігати за ланцюжком міркувань моделі."
  t089: "Установіть display.compact: true, щоб зменшити порожній простір у виводі й ущільнити інформацію."
  t090: "Установіть display.busy_input_mode: queue, щоб ставити повідомлення в чергу замість переривання агента, або steer, щоб додавати їх під час роботи через /steer."
  t091: "Установіть display.resume_display: minimal, щоб пропускати повний переказ розмови під час відновлення сеансу."
  t092: "Установіть compression.threshold: 0.50, щоб керувати тим, коли спрацьовує автостиснення (за замовчуванням: 50% контексту)."
  t093: "Установіть agent.max_turns: 1000, щоб дозволити агенту робити більше кроків із викликами інструментів за хід."
  t094: "Установіть file_read_max_chars: 200000, щоб збільшити максимальний обсяг вмісту на один виклик read_file."
  t095: "Установіть approvals.mode: smart, щоб LLM автоматично схвалювала безпечні команди й відхиляла небезпечні."
  t096: "Установіть fallback_model у config.yaml, щоб автоматично перемикатися на резервного провайдера."
  t097: "Установіть privacy.redact_pii: true, щоб хешувати ідентифікатори користувачів і номери телефонів перед надсиланням до LLM."
  t098: "Установіть browser.record_sessions: true, щоб автоматично записувати сеанси браузера у відео WebM."
  t099: "Установіть worktree: true у config.yaml, щоб завжди створювати робоче дерево git (те саме, що hermes -w)."
  t100: "Установіть security.website_blocklist.enabled: true, щоб заблокувати певні домени для вебінструментів."
  t101: "Установіть cron.wrap_response: false, щоб доставляти сирий вивід агента без заголовка й підпису cron."
  t102: "HERMES_TIMEZONE перевизначає часовий пояс сервера будь-яким рядком часового поясу IANA."
  t103: "У config.yaml працює підстановка змінних середовища: використовуйте синтаксис ${VAR_NAME}."
  t104: "Швидкі команди в config.yaml миттєво виконують shell-команди без витрати токенів."
  t105: "Власні особистості можна визначити в config.yaml у розділі agent.personalities."
  t106: "provider_routing керує сортуванням провайдерів OpenRouter, їхніми білими та чорними списками."
  t107: "execute_code виконує Python-скрипти, які програмно викликають інструменти Hermes — результати не потрапляють у контекст."
  t108: "delegate_task за замовчуванням запускає до 10 паралельних субагентів (delegation.max_concurrent_children) з ізольованими контекстами для паралельної роботи."
  t109: "web_extract працює з URL-адресами PDF — передайте будь-яке посилання на PDF, і воно перетвориться на markdown."
  t110: "search_files працює на основі ripgrep і швидший за grep — використовуйте його замість grep у терміналі."
  t111: "patch використовує 9 стратегій нечіткого зіставлення, тож незначні відмінності в пробілах не зламають правки."
  t112: "patch підтримує формат V4A для масових правок у кількох файлах одним викликом."
  t113: "read_file пропонує схожі назви файлів, якщо файл не знайдено."
  t114: "read_file автоматично усуває дублювання — повторне читання незміненого файлу повертає легку заглушку."
  t115: "browser_vision робить знімок екрана й аналізує його за допомогою ШІ — працює з CAPTCHA та візуальним вмістом."
  t116: "browser_console може обчислювати вирази JavaScript у контексті сторінки."
  t117: "image_generate створює зображення за допомогою FLUX 2 Pro з автоматичним збільшенням у 2 рази."
  t118: "text_to_speech перетворює текст на аудіо — у Telegram відтворюється як голосове повідомлення."
  t119: "send_message може надіслати повідомлення на будь-яку підключену платформу обміну повідомленнями прямо із сеансу."
  t120: "Інструмент todo допомагає агенту відстежувати складні багатокрокові завдання впродовж сеансу."
  t121: "session_search виконує повнотекстовий пошук по ВСІХ минулих розмовах."
  t122: "Агент автоматично зберігає у пам'ять уподобання, виправлення та факти про середовище."
  t123: "/moa проганяє один складний запит через налаштований набір моделей Mixture of Agents."
  t124: "Команди терміналу підтримують фоновий режим із notify_on_complete для тривалих завдань."
  t125: "Фонові процеси терміналу підтримують watch_patterns для сповіщень про певні рядки виводу."
  t126: "Інструмент terminal підтримує 6 бекендів: local, Docker, SSH, Modal, Daytona та Singularity."
  t127: "Кожен профіль має власну конфігурацію, ключі API, пам'ять, сеанси, навички та cron-завдання."
  t128: "Назви профілів стають командами оболонки — 'hermes profile create coder' створює команду 'coder'."
  t129: "hermes profile export coder -o backup.tar.gz створює переносний архів профілю."
  t130: "Якщо два профілі випадково використовують один токен бота, другий шлюз блокується зі зрозумілою помилкою."
  t131: "Сеанси автоматично отримують описові назви після першого обміну — називати вручну не потрібно."
  t132: "Назви сеансів підтримують спадковість: \"мій проєкт\" → \"мій проєкт #2\" → \"мій проєкт #3\"."
  t133: "При виході Hermes виводить команду для відновлення з ID сеансу та статистикою."
  t134: "hermes sessions export backup.jsonl експортує всі сеанси для резервного копіювання чи аналізу."
  t135: "hermes -r SESSION_ID відновлює будь-який конкретний минулий сеанс за його ID."
  t136: "Пам'ять — це заморожений знімок: зміни з'являються в системному промпті лише на початку наступного сеансу."
  t137: "Записи пам'яті автоматично скануються на шаблони ін'єкції промптів і витоку даних."
  t138: "Агент має два сховища пам'яті: особисті нотатки (~2200 символів) і профіль користувача (~1375 символів)."
  t139: "Виправлення, які ви даєте агенту (\"ні, зроби ось так\"), часто автоматично зберігаються в пам'ять."
  t140: "Понад 80 вбудованих навичок для github, creative, mlops, productivity, research та іншого."
  t141: "Кожна встановлена навичка автоматично стає slash-командою — введіть /, щоб побачити їх усі."
  t142: "hermes skills install official/security/1password встановлює необов'язкові навички з репозиторію."
  t143: "Навички можуть обмежуватися певними ОС — деякі завантажуються лише на macOS або Linux."
  t144: "skills.external_dirs у config.yaml дозволяє завантажувати навички з власних каталогів."
  t145: "Агент може створювати власні навички як процедурну пам'ять за допомогою skill_manage."
  t146: "/plan записує план реалізації у markdown до .hermes/plans/, нічого не виконуючи."
  t147: "До cron-завдань можна прикріплювати навички: hermes cron add --skill blogwatcher \"Check for new posts\"."
  t148: "Цілі доставки cron включають telegram, discord, slack, email, sms і ще 12+ платформ."
  t149: "Якщо відповідь cron починається з [SILENT], доставка пригнічується — зручно для завдань лише з моніторингом."
  t150: "Cron підтримує відносні затримки (30m), інтервали (every 2h), cron-вирази та часові мітки ISO."
  t151: "Cron-завдання виконуються в повністю нових сеансах агента — запити мають бути самодостатніми."
  t152: "Голосовий режим працює без жодного ключа API, якщо встановлено faster-whisper (безкоштовне локальне розпізнавання мовлення)."
  t153: "Доступно п'ять TTS-провайдерів: Edge TTS (безкоштовно), ElevenLabs, OpenAI, NeuTTS (безкоштовно, локально), MiniMax."
  t154: "/voice on вмикає голосовий режим у CLI. Ctrl+B перемикає запис push-to-talk."
  t155: "Потокове TTS озвучує речення в міру їх генерації — не потрібно чекати повної відповіді."
  t156: "Голосові повідомлення в Telegram, Discord, WhatsApp і Slack транскрибуються автоматично."
  t157: "Hermes працює на 21 платформі обміну повідомленнями: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, email та інших."
  t158: "hermes gateway install налаштовує його як системну службу, що запускається під час завантаження."
  t159: "DingTalk використовує Stream Mode — вебхуки чи публічний URL не потрібні."
  t160: "BlueBubbles приносить iMessage у Hermes через локальний сервер на macOS."
  t161: "Маршрути вебхуків підтримують перевірку HMAC, обмеження частоти запитів і фільтрацію подій."
  t162: "API-сервер надає OpenAI-сумісний ендпоінт, який працює з Open WebUI та LibreChat."
  t163: "Режим голосового каналу Discord: бот приєднується до голосового каналу, транскрибує мовлення та відповідає голосом."
  t164: "group_sessions_per_user: true дає кожній людині власний сеанс у групових чатах."
  t165: "/sethome позначає чат як домашній канал для доставки результатів cron-завдань."
  t166: "Шлюз підтримує тайм-аути за бездіяльністю — активні агенти можуть працювати як завгодно довго."
  t167: "Схвалення небезпечних команд має 4 рівні: один раз, сеанс, завжди (постійний список дозволених), відхилити."
  t168: "Розумний режим схвалення використовує LLM, щоб автоматично схвалювати безпечні команди й позначати небезпечні."
  t169: "Захист від SSRF блокує приватні мережі, loopback, link-local та адреси метаданих хмарних провайдерів."
  t170: "ID сеансів починаються з мітки часу (20250305_091523_abcd), тож у ls і jq вони природно сортуються."
  t171: "Підпроцеси MCP отримують відфільтроване середовище — передаються лише безпечні системні змінні."
  t172: "Контекстні файли (.hermes.md, AGENTS.md) перед завантаженням скануються на ін'єкції промптів."
  t173: "command_allowlist у config.yaml назавжди схвалює певні шаблони shell-команд."
  t174: "Контекст автоматично стискається при досягненні порогу — пам'ять скидається на диск, а історія підсумовується."
  t175: "Рядок стану стає жовтим, потім оранжевим, потім червоним у міру заповнення контексту."
  t176: "SOUL.md — головний файл ідентичності агента; налаштуйте його, щоб сформувати поведінку."
  t177: "Hermes завантажує контекст проєкту з .hermes.md, AGENTS.md, CLAUDE.md або .cursorrules (перший знайдений)."
  t178: "Файли AGENTS.md у підкаталогах виявляються поступово, коли агент заходить у папки."
  t179: "Контекстні файли обмежені 20 000 символами з розумним обрізанням посередині (початок і кінець зберігаються)."
  t180: "П'ять провайдерів браузера: локальний Chromium, Browserbase, Browser Use, Camofox і Firecrawl."
  t181: "Camofox — браузер із захистом від виявлення: форк Firefox із підміною відбитків на C++."
  t182: "browser_navigate автоматично повертає знімок сторінки — викликати browser_snapshot після нього не потрібно."
  t183: "browser_vision з annotate=true накладає нумеровані мітки на інтерактивні елементи."
  t184: "hermes mcp відкриває інтерактивний вибір схвалених Nous MCP-серверів, які можна встановити одним натисканням."
  t185: "hermes mcp catalog показує список схвалених Nous MCP-серверів, що постачаються з репозиторієм."
  t186: "hermes mcp install <name> встановлює запис із каталогу, запитує облікові дані та дозволяє вибрати, які з його інструментів увімкнути."
  t187: "MCP-сервери налаштовуються в config.yaml — підтримуються транспорти stdio та HTTP."
  t188: "Фільтрація інструментів для кожного сервера: tools.include дозволяє, а tools.exclude забороняє конкретні інструменти."
  t189: "MCP-сервери автоматично створюють набори інструментів під час роботи — hermes tools може перемикати їх для кожної платформи."
  t190: "Підтримка OAuth для MCP: auth: oauth вмикає авторизацію через браузер із PKCE."
  t191: "Контрольні точки не створюють жодних накладних витрат, якщо файли не змінюються — увімкнено за замовчуванням."
  t192: "Знімок перед відкатом зберігається автоматично, тож ви можете скасувати саме скасування."
  t193: "/rollback також скасовує хід розмови, тому агент не пам'ятає відкочених змін."
  t194: "Контрольні точки використовують тіньові репозиторії в ~/.hermes/checkpoints/ — .git вашого проєкту ніколи не зачіпається."
  t195: "batch_runner.py паралельно обробляє сотні запитів для генерації навчальних даних."
  t196: "hermes chat -Q вмикає тихий режим для програмного використання — приховує банер і індикатор."
  t197: "Збереження траєкторій (--save-trajectories) фіксує повні сліди використання інструментів для навчання моделей."
  t198: "Три типи плагінів: загальні (інструменти та хуки), провайдери пам'яті та контекстні рушії."
  t199: "hermes plugins install owner/repo встановлює плагіни безпосередньо з GitHub."
  t200: "Зовнішні провайдери пам'яті: OpenViking вбудований; Honcho, Hindsight, Mem0 та інші — через hermes plugins install."
  t201: "Хуки плагінів включають pre/post_tool_call, pre/post_llm_call і transform_terminal_output для канонізації виводу."
  t202: "Кешування промптів (Anthropic) знижує витрати, повторно використовуючи кешовані префікси системного промпту."
  t203: "Агент генерує назви сеансів у фоновому потоці — без жодного впливу на затримку."
  t204: "Розумна маршрутизація моделей може автоматично скеровувати прості запити до дешевшої моделі."
  t205: "Slash-команди підтримують збіг за префіксом: /h розгортається в /help, /mod — у /model."
  t206: "Перетягування шляху до файлу в термінал автоматично прикріплює зображення або надсилає його як контекст."
  t207: ".worktreeinclude у корені репозиторію перелічує ігноровані git файли, які копіювати в робочі дерева."
  t208: "hermes acp запускає Hermes як ACP-сервер для інтеграції з VS Code, Zed і JetBrains."
  t209: "Власні провайдери: зберігайте іменовані ендпоінти в config.yaml у розділі custom_providers."
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT вставляє системний промпт, який ніколи не зберігається в історії."
  t211: "credential_pool_strategies підтримує ротацію fill_first, round_robin, least_used і random."
  t212: "hermes auth add nous або hermes auth add openai-codex налаштовує провайдерів на основі OAuth."
  t213: "API-сервер підтримує як Chat Completions, так і Responses API зі станом на боці сервера."
  t214: "tool_preview_length: 0 у конфігурації показує повні шляхи до файлів у стрічці активності індикатора."
  t215: "hermes status --deep виконує глибші діагностичні перевірки всіх компонентів."
  t216: "До cron-завдань можна прикріпити Python-скрипт (--script), чий stdout вставляється в запит як контекст."
  t217: "Cron-скрипти зберігаються в ~/.hermes/scripts/ і виконуються перед агентом — ідеально для конвеєрів збору даних."
  t218: "prefill_messages_file у config.yaml додає few-shot приклади до кожного виклику API, не зберігаючи їх в історії."
  t219: "SOUL.md повністю замінює типову ідентичність агента — перепишіть його, щоб зробити Hermes своїм."
  t220: "SOUL.md автоматично заповнюється типовою особистістю під час першого запуску. Відредагуйте його для налаштування."
  t221: "/compress <focus topic> виділяє 60–70% бюджету підсумку на вашу тему й агресивно скорочує решту."
  t222: "Під час другого й наступних стиснень компресор оновлює попередній підсумок, а не починає з нуля."
  t223: "Перед скиданням сеансу шлюзу Hermes автоматично скидає важливі факти в пам'ять у фоновому режимі."
  t224: "network.force_ipv4: true у config.yaml усуває зависання на серверах зі зламаним IPv6 — патчить socket під час роботи."
  t225: "Інструмент terminal пояснює поширені коди виходу: grep повертає 1 = 'No matches found (not an error)'."
  t226: "Невдалі команди терміналу у передньому плані автоматично повторюються до 3 разів з експоненційною затримкою (2с, 4с, 8с)."
  t227: "Команди з голим sudo автоматично переписуються так, щоб передавати SUDO_PASSWORD з .env — інтерактивний запит не потрібен."
  t228: "Помічники execute_code потребують явного імпорту: from hermes_tools import json_parse, shell_quote, retry."
  t229: "7 інструментів пісочниці execute_code (web_search, terminal, read/write/search/patch) працюють через RPC — ніколи не потрапляють у контекст."
  t230: "Читання тієї самої ділянки файлу 3+ рази викликає попередження. Після 4+ воно жорстко блокується, щоб запобігти циклам."
  t231: "write_file і patch виявляють, чи файл був змінений зовні після останнього читання, і попереджають про застарілість."
  t232: "Формат патчів V4A підтримує директиви Add File, Delete File і Move File — не лише Update."
  t233: "MCP-сервери можуть запитувати відповіді LLM у зворотному напрямку через sampling — агент стає інструментом для сервера."
  t234: "MCP-сервери надсилають notifications/tools/list_changed, щоб автоматично перереєструвати інструменти без перезапуску."
  t235: "delegate_task з acp_command: 'claude' запускає Claude Code як дочірнього агента з будь-якої платформи."
  t236: "Делегування має потік heartbeat — активність дочірнього агента передається батьківському, що запобігає тайм-аутам шлюзу."
  t237: "Коли провайдер повертає HTTP 402 (payment required), допоміжний клієнт автоматично переходить до наступного."
  t238: "agent.tool_use_enforcement скеровує моделі, які описують дії замість викликати інструменти — автоматично для GPT/Codex."
  t239: "agent.restart_after_turn_timeout дає поточним ходам завершитися, перш ніж /restart перейде до stop(); restart_drain_timeout — лише бюджет примусового переривання після початку stop()."
  t240: "agent.api_max_retries (за замовчуванням 3) визначає, скільки разів агент повторює невдалий виклик API, перш ніж показати помилку — зменште для швидкого перемикання."
  t241: "Шлюз кешує екземпляри AIAgent для кожного сеансу — знищення цього кешу ламає кешування промптів Anthropic."
  t242: "Будь-який сайт може публікувати навички через /.well-known/skills/index.json — хаб навичок знаходить їх автоматично."
  t243: "Журнал аудиту навичок у ~/.hermes/skills/.hub/audit.log фіксує кожне встановлення та видалення."
  t244: "Застарілі робочі дерева git автоматично прибираються під час запуску: чисті, повністю злиті дерева видаляються; незбережена або невідправлена робота завжди зберігається."
  t245: "Профілі ізолюють стан Hermes через HERMES_HOME; підпроцеси інструментів хоста зберігають ваш справжній HOME, якщо terminal.home_mode не дорівнює profile."
  t246: "Змінна середовища HERMES_HOME_MODE (вісімкова, напр. 0701) задає власні права доступу до каталогу для обходу вебсервером."
  t247: "Контейнерний режим: покладіть .container-mode у HERMES_HOME — і CLI хоста автоматично виконуватиметься всередині контейнера."
  t248: "Ctrl+C має 5 рівнів пріоритету: скасувати запис → скасувати запити → закрити вибір → перервати агента → вийти."
  t249: "Кожне переривання під час роботи агента записується в ~/.hermes/interrupt_debug.log з мітками часу."
  t250: "BROWSER_CDP_URL підключає браузерні інструменти до будь-якого запущеного браузера сімейства Chromium — приймає WebSocket, HTTP або host:port."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true вмикає розширений захист від виявлення з кастомним Chromium (план Scale)."
  t252: "CLI автоматично переходить у компактний режим у терміналах, вужчих за 80 стовпців."
  t253: "Швидкі команди бувають двох типів: exec (виконати shell-команду напряму) та alias (перенаправити на іншу команду)."
  t254: "Окрема модель для делегування: delegation.model і delegation.provider у конфігурації спрямовують субагентів на дешевші моделі."
  t255: "delegation.reasoning_effort незалежно керує глибиною роздумів субагентів."
  t256: "display.platforms у config.yaml дозволяє перевизначати параметри показу для кожної платформи: {telegram: {tool_progress: all}}."
  t257: "human_delay.mode у конфігурації імітує швидкість людського набору — діапазон min_ms/max_ms налаштовується."
  t258: "Міграції версій конфігурації виконуються автоматично під час завантаження — нові ключі з'являються без ручного втручання."
  t259: "Моделі GPT і Codex отримують спеціальні вказівки в системному промпті щодо дисципліни інструментів та обов'язкового їх використання."
  t260: "Моделі Gemini отримують окремі директиви щодо абсолютних шляхів, паралельних викликів інструментів і неінтерактивних команд."
  t261: "context.engine у config.yaml можна встановити в назву плагіна для альтернативних стратегій керування контекстом."
  t262: "Знімки сторінок браузера понад 15 000 символів обрізаються або автоматично підсумовуються; повний знімок зберігається в cache/web для посторінкового читання через read_file."
  t263: "Стискач робить дешевий попередній прохід: виводи інструментів понад 200 символів замінюються заповнювачами ще до запуску LLM."
  t264: "Якщо стиснення не вдалося, подальші спроби призупиняються на 10 хвилин, щоб не перевантажувати API."
  t265: "Довгі небезпечні команди (>70 символів) отримують у запиті схвалення опцію 'view', щоб спершу переглянути повний текст."
  t266: "Візуалізація рівня звуку показує стовпчики ▁▂▃▄▅▆▇ під час голосового запису на основі RMS-рівнів мікрофона."
  t267: "Назви профілів не можуть збігатися з наявними бінарними файлами в PATH — 'hermes profile create ls' буде відхилено."
  t268: "hermes profile create backup --clone-all копіює все (конфігурацію, ключі, SOUL.md, спогади, навички, сеанси)."
  t269: "Клавішу голосового запису можна змінити через voice.record_key у config.yaml — не лише Ctrl+B."
  t270: "Файли .cursorrules і .cursor/rules/*.mdc виявляються автоматично й завантажуються як контекст проєкту."
  t271: "Контекстні файли перевіряються на 10+ шаблонів ін'єкції промптів — невидимий Unicode, 'ignore instructions', спроби ексфільтрації."
  t272: "GPT-5 і Codex використовують у форматі повідомлень роль 'developer' замість 'system'."
  t273: "Окремі допоміжні перевизначення для кожного завдання: auxiliary.vision.provider, auxiliary.compression.model тощо у config.yaml."
  t274: "Допоміжний клієнт трактує 'main' як псевдонім провайдера — він розгортається у ваші справжні основні провайдера та модель."
  t275: "hermes claw migrate --dry-run показує попередній перегляд міграції з OpenClaw, нічого не записуючи."
  t276: "Шляхи до файлів, вставлені з лапками або екранованими пробілами, обробляються автоматично — чистити вручну не потрібно."
  t277: "Слеш-команди ніколи не спричиняють згортання великої вставки — /command з великими аргументами працює коректно."
  t278: "У режимі переривання слеш-команди, введені під час роботи агента, оминають логіку переривання й виконуються негайно."
  t279: "HERMES_DEV=1 вимикає виявлення контейнерного режиму для локальної розробки."
  t280: "Кожен MCP-сервер отримує власний набір інструментів (mcp-servername), який можна вмикати й вимикати окремо через hermes tools."
  t281: "Заповнювачі MCP ${ENV_VAR} у конфігурації розгортаються під час запуску сервера — зокрема змінні з ~/.hermes/.env."
  t282: "Навички з довірених репозиторіїв (NousResearch) отримують рівень безпеки 'trusted'; навички спільноти проходять додаткове сканування."
  t283: "Карантин навичок у ~/.hermes/skills/.hub/quarantine/ зберігає навички, що очікують перевірки безпеки."
  t284: "/steer <prompt> вставляє нотатку після наступного виклику інструмента — скеруйте напрямок посеред завдання, не перериваючи його."
  t285: "/goal <text> задає постійну ціль у стилі Ralph-циклу — Hermes автоматично продовжує хід за ходом, доки суддя не визнає її виконаною."
  t286: "/snapshot create [label] зберігає повний знімок стану конфігурації Hermes; /snapshot restore <id> пізніше відкочує до нього."
  t287: "/copy [N] копіює останню відповідь асистента в буфер обміну або N-ту з кінця, якщо вказати число."
  t288: "/redraw примусово перемальовує весь інтерфейс, усуваючи зсуви термінала після зміни розміру в tmux або артефактів виділення мишею."
  t289: "/agents (псевдонім /tasks) показує активних агентів і запущені фонові завдання в поточному сеансі."
  t290: "/footer вмикає й вимикає нижній колонтитул шлюзу у фінальних відповідях із моделлю, % контексту та cwd."
  t291: "/busy queue|steer|interrupt визначає, що робить натискання Enter, поки Hermes працює."
  t292: "/topic у приватних чатах Telegram вмикає режим багатосеансових тем, керованих користувачем — /topic <id> відновлює минулі сеанси прямо там."
  t293: "/approve session|always виконує очікувану небезпечну команду з вибраним вами обсягом довіри; /deny відхиляє її."
  t294: "/restart плавно перезапускає шлюз, дочекавшись завершення активних запусків, а потім повідомляє того, хто його запросив, коли все знову працює."
  t295: "/kanban boards switch <slug> змінює активну дошку Kanban серед кількох проєктів прямо з чату."
  t296: "/reload перечитує ~/.hermes/.env у запущений сеанс — підхопіть нові API-ключі без перезапуску."
  t297: "cronjob із no_agent=True запускає скрипт за розкладом і надсилає його stdout напряму — нуль токенів, нуль LLM."
  t298: "Порожній stdout cron-скрипта означає тихий тік — нічого не доставляється, ідеально для сторожових перевірок порогів."
  t299: "HERMES_CRON_MAX_PARALLEL (типово 4) обмежує кількість cron-завдань за один тік, щоб сплески не вичерпували ваші ключі."
  t300: "Хуки шлюзу лежать у ~/.hermes/hooks/<name>/ з HOOK.yaml + handler.py — обробник має називатися `handle`."
  t301: "Події хуків включають gateway:startup, session:start, agent:step і підписки за шаблоном command:*."
  t302: "Покладіть чекліст у ~/.hermes/BOOT.md — і хук gateway:startup виконуватиме його як одноразового агента під час кожного завантаження."
  t303: "hermes curator run --dry-run показує, що куратор архівував би чи об'єднав, нічого не змінюючи."
  t304: "hermes curator pin <skill> жорстко захищає навичку і від автоархівації, і від інструмента skill_manage агента."
  t305: "hermes curator rollback відновлює навички зі знімка, зробленого перед запуском — резервні копії лежать у skills/.curator_backups/."
  t306: "hermes auth reset <provider> [target] скидає паузи та позначки вичерпання для всього пулу облікових даних або для одного запису за індексом, id чи міткою."
  t307: "credential_pool_strategies.<provider>: round_robin рівномірно чергує ключі замість типового fill_first."
  t308: "use_gateway: true для окремого інструмента спрямовує web, image, tts або browser через вашу підписку Nous — без додаткових ключів."
  t309: "provider_routing.data_collection: deny виключає провайдерів OpenRouter, які зберігають дані."
  t310: "provider_routing.require_parameters: true маршрутизує лише до провайдерів, що підтримують кожен параметр вашого запиту."
  t311: "HERMES_TUI_RESUME=1 автоматично повертає вас до останнього сеансу TUI під час запуску — зручно після обриву SSH."
  t312: "HERMES_TUI_THEME=light|dark|<hex> примусово задає тему TUI в терміналах, які не встановлюють COLORFGBG."
  t313: "Ctrl+G або Ctrl+X Ctrl+E у TUI відкриває буфер введення в $EDITOR для довгих багаторядкових запитів."
  t314: "TUI відображає LaTeX прямо в тексті — $E=mc^2$ стає математичним Unicode замість сирого TeX."
  t315: "hermes dashboard запускає локальний вебінтерфейс на 127.0.0.1:9119 — жодні дані не залишають localhost."
  t316: "hermes dashboard вбудовує повний TUI Hermes у ваш браузер через xterm.js і WebSocket PTY."
  t317: "Покладіть YAML із двома кольорами палітри в ~/.hermes/dashboard-themes/, щоб повністю змінити вигляд панелі керування."
  t318: "Плагіни панелі керування підключаються простим копіюванням: manifest.json + JS-бандл у ~/.hermes/dashboard-plugins/ — збірка npm не потрібна."
  t319: "layoutVariant: cockpit у темі панелі керування додає ліву панель шириною 260px, яку плагіни можуть заповнювати через слот sidebar."
  t320: "display.tool_progress_command: true відкриває /verbose на платформах обміну повідомленнями; типово він доступний лише в CLI."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result сповіщає лише про завершення фонових завдань (на відміну від concise/all/error/off)."
  t322: "HERMES_WRITE_SAFE_ROOT обмежує write_file/patch префіксами каталогів; кілька шляхів розділяються через os.pathsep (: або ;)."
  t323: "HERMES_IGNORE_RULES пропускає автоматичне підключення AGENTS.md, SOUL.md, .cursorrules, пам'яті та попередньо завантажених навичок."
  t324: "HERMES_ACCEPT_HOOKS автоматично схвалює ще не бачені shell-хуки, оголошені в config.yaml, без запиту в TTY."
  t325: "auxiliary.goal_judge.model спрямовує суддю /goal на дешеву швидку модель, щоб вартість циклу була майже нульовою."
  t326: "Контрольні точки пропускають каталоги з понад 50 000 файлів, щоб уникнути повільних операцій git на величезних монорепозиторіях."
  t327: "tts.provider: piper запускає локальний TTS на CPU для 44 мов — голоси автоматично завантажуються в ~/.hermes/cache/piper-voices/."
  t328: "tts.providers.<name>.type: command підключає будь-який TTS-рушій із CLI через заповнювачі {input_path} і {output_path}."
  t329: "API_SERVER_ENABLED=true запускає поруч зі шлюзом OpenAI-сумісний ендпоінт для Open WebUI та LibreChat."
  t330: "GATEWAY_PROXY_URL вмикає розділену схему: введення/виведення платформ локально, робота агента делегується віддаленому API-серверу."
  t331: "MATRIX_DEVICE_ID закріплює стабільний ID пристрою для E2EE — без нього ключі змінюються під час кожного запуску, і розшифрування історії ламається."
  t332: "TELEGRAM_WEBHOOK_SECRET обов'язковий щоразу, коли задано TELEGRAM_WEBHOOK_URL — згенеруйте його через openssl rand -hex 32."
  t333: "batch_runner.py --resume зіставляє виконані запити за текстом, тож перестановки в наборі даних не запускають готову роботу повторно."
  t334: "/new починає новий сеанс на місці (псевдонім /reset) — новий ID сеансу, чиста історія, CLI залишається відкритим."
  t335: "/clear очищає екран термінала І починає новий сеанс — одна команда для візуального скидання."
  t336: "/history виводить поточну розмову прямо в CLI, не виходячи з нього — зручно, щоб швидко перечитати."
  t337: "/save записує поточну розмову на диск, не завершуючи сеанс."
  t338: "/status показує зведення про сеанс: ID, назву, модель, використання токенів і час, що минув."
  t339: "/image <path> прикріплює локальний файл зображення до вашого наступного запиту без вставляння чи перетягування."
  t340: "/platforms показує стан підключення шлюзу та платформ обміну повідомленнями прямо з чату."
  t341: "/commands виводить посторінково повний список слеш-команд і встановлених навичок — зручно на платформах без автодоповнення по Tab."
  t342: "/toolsets перелічує всі доступні набори інструментів, щоб ви знали, що приймає -t/--toolsets."
  t343: "/voice tts вмикає режим лише TTS — агент відповідає вголос, а ви й далі вводите запити з клавіатури."
  t344: "/reload-skills повторно сканує ~/.hermes/skills/, тож скопійовані туди навички з'являються без перезапуску сеансу."
  t345: "/indicator kaomoji|emoji|unicode|ascii обирає стиль індикатора зайнятості TUI, який показується під час роботи агента."
  t346: "/debug завантажує пакет для підтримки (інформація про систему + журнали) і повертає посилання для поширення — працює і в чаті."
  t347: "hermes -z \"<prompt>\" — найчистіший одноразовий запуск: лише фінальна відповідь у stdout і нічого більше — ідеально для конвеєрів у скриптах."
  t348: "hermes chat --pass-session-id вставляє ID сеансу в системний промпт, щоб агент міг на нього посилатися."
  t349: "hermes chat --image path/to/pic.png прикріплює локальне зображення до одного запиту -q без окремого кроку завантаження."
  t350: "hermes chat --ignore-user-config пропускає активну конфігурацію користувача — для відтворюваних звітів про помилки та запусків у CI."
  t351: "hermes chat --source tool позначає програмні чати, щоб вони не захаращували hermes sessions list."
  t352: "hermes dump --show-keys додає знеособлені відбитки API-ключів для глибшого налагодження з підтримкою."
  t353: "hermes sessions rename <ID> \"new title\" перейменовує будь-який минулий сеанс; hermes sessions delete <ID> видаляє один."
  t354: "hermes import відновлює повну резервну копію Hermes із zip; експорти сеансів у JSON/JSONL імпортуються зі сторінки Sessions панелі керування."
  t355: "hermes fallback інтерактивно керує ланцюжком fallback_model — без ручного редагування config.yaml."
  t356: "hermes pairing змінює токен зв'язування для приватних повідомлень — перший, хто напише після зміни, отримує доступ до бота."
  t357: "hermes setup проводить нових користувачів через налаштування провайдера, ключів і платформ в одному інтерактивному сценарії."
  t358: "hermes status --deep виконує повну перевірку стану всіх компонентів; звичайний hermes status — швидкий огляд."
  t359: "HERMES_AGENT_TIMEOUT=0 вимикає зупинку запущеного агента шлюзом через бездіяльність — для довгих дослідницьких запусків."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 автоматично завантажує локальні плагіни репозиторію з ./.hermes/plugins/ — з обов'язковою перевіркою довіри."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 вимикає захист «файл змінився після прочитання» для patch і write_file."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true дозволяє вебінструментам звертатися до localhost і приватних мереж — у режимі шлюзу типово вимкнено."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 автоматично встановлює додаткові навички з необов'язкового каталогу під час першого запуску кожного профілю."
  t364: "HERMES_BUNDLED_SKILLS вказує на власне дерево вбудованих навичок — використовується пакуванням Homebrew і Nix."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 виводить корисне навантаження кожного API-запиту в stdout замість файлів журналу."
  t366: "HERMES_OAUTH_TRACE=1 записує в журнал (зі знеособленням) обмін OAuth-токенами та спроби оновлення — для налагодження автентифікації провайдера."
  t367: "HERMES_STREAM_RETRIES (типово 3) задає кількість спроб перепідключення посеред потоку при тимчасових мережевих помилках."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false вимикає підтвердження ⚡/⏳/⏩, коли користувач пише зайнятому агентові."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (типово 180s) задає, як часто шлюз повідомляє про прогрес під час довгих ходів."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (типово 900s) обмежує, скільки /restart чекає на завершення поточних запусків, перш ніж примусово перезапуститися."
  t371: "HERMES_CHECKPOINT_TIMEOUT (типово 30s) обмежує час створення контрольної точки файлової системи — збільште його на величезних монорепозиторіях."
  t372: "image_gen.model у config.yaml обирає модель FAL: flux-2/klein, gpt-image-2, nano-banana-pro та інші."
  t373: "image_gen.provider спрямовує генерацію зображень через плагін (OpenAI Images, Codex, FAL) замість типового провайдера."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY спрямовують аналіз зображень на будь-який OpenAI-сумісний ендпоінт."
  t375: "API_SERVER_MODEL_NAME задає назву моделі в /v1/models — необхідно для багатопрофільних конфігурацій Open WebUI."
  t376: "Плагіни панелі керування роздаються з /dashboard-plugins/<name>/ — просто покладіть файли в ~/.hermes/dashboard-plugins/."
  t377: "Чати з --source tool типово не показуються в hermes sessions list — вкажіть --source явно, щоб їх побачити."
  placeholder:
