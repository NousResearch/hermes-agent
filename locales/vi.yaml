  choose_smart_deny: "      [o] một lần  |  [d] từ chối"
  prompt_smart_deny: "      Chọn [o/D]: "
  smart_deny_once_inputs: "o,once"
  smart_deny_deny_inputs: "d,deny"
  timeout:         "      ⏱ Hết giờ — đã từ chối lệnh"
  allowed_once:    "      ✓ Cho phép một lần"
  allowed_session: "      ✓ Cho phép trong phiên này"
  allowed_always:  "      ✓ Đã thêm vào danh sách cho phép vĩnh viễn"
