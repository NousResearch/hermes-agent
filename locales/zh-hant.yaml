    turn_lease: "這一輪已停止，因為另一個 Hermes 程序接管了此工作階段。你的回覆未儲存 — 請等另一個程序完成後再傳送一次訊息。"
    session_row_missing: "此工作階段在聊天仍開啟時已從儲存空間中刪除，且 Hermes 無法重新建立它，因此這則訊息未儲存。請再傳送一次訊息；若持續失敗，請執行 `hermes {profile_arg}doctor`。"
    locked: "這一輪已停止，因為工作階段儲存空間忙碌中（另一個 Hermes 程序正在寫入狀態資料庫）。你的訊息應該已經儲存 — 請稍後再傳送一次。"
    replaced: "工作階段資料庫檔案在 Hermes 執行期間被替換，因此這則訊息未儲存（副本保存在 {home}/sessions/）。請停止 Hermes（`hermes {profile_arg}gateway stop`），執行 `hermes {profile_arg}doctor` — 不要執行 `hermes {profile_arg}doctor --fix`，那會就地修復錯誤的檔案 — 然後重新啟動並再傳送一次訊息。進階復原步驟請見日誌。"
    deleted_wal: "另一個 Hermes 程序仍持有工作階段資料庫預寫日誌（WAL）的舊副本，因此 Hermes 為保護檔案已停止寫入，這則訊息未儲存（副本保存在 {home}/sessions/）。沒有任何資料遺失。請結束此設定檔下的所有 Hermes 程序（Desktop 應用程式、`hermes {profile_arg}gateway stop`、儀表板、排程任務），執行 `hermes {profile_arg}doctor` — 它會列出仍持有該日誌的程序 — 然後重新啟動 Hermes 並再傳送一次訊息。在這些程序執行期間，不要執行 `doctor --fix` 或刪除任何 state.db 檔案。指南：{recovery_docs}"
    corrupt: "這一輪已停止，因為狀態資料庫回報結構損毀（重新啟動後對話紀錄將會遺失）。釋放磁碟空間沒有幫助。復原選項：\n1. 執行 `hermes {profile_arg}doctor --fix`\n2. 停止閘道，然後用以下指令復原：\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   （若回報可復原）hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — 復原會先為損毀的檔案建立快照；切勿對執行中的 state.db 執行 `sqlite3 ... \".recover\"`，有漏洞的 sqlite3 CLI 可能使其損毀得更嚴重\n3. 從 {backups_dir}/ 中的備份還原\n然後再傳送一次訊息。"
    fts_index: "這一輪已停止，因為工作階段搜尋索引（FTS5）已損毀且無法卸離，因此這則訊息未儲存。訊息儲存區本身未受損：不要執行復原工具或還原備份。請執行 `hermes {profile_arg}doctor --fix`（或重新啟動 Hermes，開啟時會修復索引），然後再傳送一次訊息。"
    disk: "Hermes 無法將此對話儲存到磁碟，為避免遺失你的訊息而停止。磁碟可能已滿：請釋放一些空間（或修正 {home}/state.db 的權限），然後再傳送一次訊息。"
    default: "Hermes 無法儲存此對話，為避免遺失你的訊息而停止。可能原因：磁碟空間不足，或另一個 Hermes 程序正佔用資料庫。請關閉其他 Hermes 視窗，執行 `hermes {profile_arg}doctor` 檢查儲存狀態，然後再傳送一次訊息。"
