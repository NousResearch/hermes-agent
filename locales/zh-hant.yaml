tips:
  t001: "/bg <prompt> 會在獨立的工作階段執行任務，讓你目前的工作階段保持空閒；/btw <question> 則會回答關於此對話的附帶問題，而不會中斷對話。"
  t002: "/branch 會從目前的工作階段建立分支，讓你在不失去進度的情況下探索不同方向。"
  t003: "/compress 可在對話變長時手動壓縮對話上下文。"
  t004: "/rollback 會列出檔案系統檢查點 — 可將代理修改過的檔案還原到任何先前的狀態。"
  t005: "/rollback diff 2 會預覽自檢查點 2 以來的變更，而不會還原任何內容。"
  t006: "/rollback 2 src/file.py 會從特定檢查點還原單一檔案。"
  t007: "/title \"my project\" 可為你的工作階段命名 — 之後可用 /resume 或 hermes -c 恢復。"
  t008: "/resume 可從先前已命名的工作階段接續你上次的進度。"
  t009: "/queue <prompt> 會將訊息排入佇列供下一輪使用，而不會中斷目前的回合。"
  t010: "/undo 會從對話中移除最後一組使用者／助理的交流。"
  t011: "/retry 會重新傳送你的最後一則訊息 — 當代理的回應不太理想時很實用。"
  t012: "/verbose 會循環切換工具進度的顯示方式：off → new → all → verbose。"
  t013: "/reasoning high 會提高模型的思考深度。/reasoning show 則會顯示推理內容。"
  t014: "/fast 會切換優先處理，以取得更快的 API 回應（取決於提供方）。"
  t015: "/yolo 會在本次工作階段的剩餘時間內略過所有危險指令的批准提示。"
  t016: "/model 讓你在工作階段中途切換模型 — 試試 /model sonnet 或 /model gpt-5。"
  t017: "/model --global 會永久變更你的預設模型。"
  t018: "/personality pirate 可設定有趣的人格 — 內建 14 種選項，從 kawaii 到 shakespeare。"
  t019: "/skin 可變更 CLI 主題 — 試試 ares、mono、slate、poseidon 或 charizard。"
  t020: "/statusbar 會切換一個常駐狀態列，顯示模型、tokens、上下文佔用率 %、費用與持續時間。"
  t021: "/tools disable browser 會在目前的工作階段暫時移除瀏覽器工具。"
  t022: "/browser connect 會透過 CDP 將瀏覽器工具連接到你正在執行的 Chromium 系列瀏覽器。"
  t023: "/plugins 會列出已安裝的外掛及其狀態。"
  t024: "/cron 用於管理排程任務 — 設定週期性提示，並將結果送達任何平台。"
  t025: "/reload-mcp 會熱重載 MCP 伺服器設定，無需重新啟動。"
  t026: "/usage 會顯示 token 用量、費用明細與工作階段持續時間。"
  t027: "/insights 會顯示最近 30 天的用量分析。"
  t028: "/paste 會檢查你的剪貼簿是否有圖片，並將其附加到你的下一則訊息。"
  t029: "/profile 會顯示目前啟用的設定檔及其主目錄。"
  t030: "/config 讓你一眼看清目前的設定。"
  t031: "/stop 會終止代理啟動的所有執行中背景程序。"
  t032: "@file:path/to/file.py 會將檔案內容直接插入你的訊息。"
  t033: "@file:main.py:10-50 只會插入檔案的第 10 到 50 行。"
  t034: "@folder:src/ 會插入目錄樹列表。"
  t035: "@diff 會將你尚未暫存的 git 變更插入訊息。"
  t036: "@staged 會插入你已暫存的 git 變更（git diff --staged）。"
  t037: "@git:5 會插入最近 5 次提交及完整修補內容。"
  t038: "@url:https://example.com 會抓取網頁內容並插入訊息。"
  t039: "輸入 @ 會觸發檔案系統路徑自動完成 — 可互動式瀏覽到任何檔案。"
  t040: "可組合多個參照：「Review @file:main.py and @file:test.py for consistency.」"
  t041: "Alt+Enter 會插入換行以輸入多行內容。（Windows Terminal 會攔截 Alt+Enter — 請改用 Ctrl+Enter。）"
  t042: "Ctrl+C 會中斷代理。在 2 秒內連按兩次可強制結束。"
  t043: "Ctrl+Z 會將 Hermes 暫停到背景 — 在你的 shell 執行 fg 即可恢復。"
  t044: "Tab 可接受自動建議的灰色提示文字，或自動完成指令。"
  t045: "在代理工作時輸入新訊息，即可中斷並重新引導它。"
  t046: "Alt+V 會將剪貼簿中的圖片貼入對話。"
  t047: "貼上 5 行以上的內容時，會自動儲存為檔案，並改為插入精簡的參照。"
  t048: "hermes -c 會恢復你最近的 CLI 工作階段。hermes -c \"project name\" 則依標題恢復。"
  t049: "hermes -w 會建立隔離的 git 工作樹 — 非常適合平行的代理工作流程。"
  t050: "hermes -w -q \"Fix issue #42\" 結合了工作樹隔離與一次性查詢。"
  t051: "hermes chat -t web,terminal 只啟用特定工具集，讓工作階段更聚焦。"
  t052: "hermes chat -s github-pr-workflow 會在啟動時預先載入技能。"
  t053: "hermes chat -q \"query\" 會執行單次非互動查詢後結束。"
  t054: "hermes chat --max-turns 1000 會覆寫每回合預設的 500 次迭代上限。"
  t055: "hermes chat --checkpoints 會在每次破壞性檔案變更前啟用檔案系統快照。"
  t056: "hermes --yolo 會在整個工作階段略過所有危險指令的批准提示。"
  t057: "hermes chat --source telegram 會為工作階段加上標記，方便在 hermes sessions list 中篩選。"
  t058: "hermes -p work chat 會以特定設定檔執行，而不變更你的預設。"
  t059: "hermes doctor --fix 會診斷並自動修復設定與依賴項問題。"
  t060: "hermes dump 會輸出精簡的安裝環境摘要 — 非常適合用於錯誤回報。"
  t061: "hermes config set KEY VALUE 會自動將機密寫入 .env，其餘則寫入 config.yaml。"
  t062: "hermes config edit 會用你的預設編輯器開啟 config.yaml。"
  t063: "hermes config check 會掃描缺少或過時的設定選項。"
  t064: "hermes sessions browse 會開啟可搜尋的互動式工作階段選擇器。"
  t065: "hermes sessions stats 會顯示各平台的工作階段數量與資料庫大小。"
  t066: "hermes sessions prune --older-than 30 會清理舊的工作階段。"
  t067: "hermes skills search react --source skills-sh 會搜尋 skills.sh 公開目錄。"
  t068: "hermes skills check 會掃描已安裝的 hub 技能是否有上游更新。"
  t069: "hermes skills tap add myorg/skills-repo 會新增自訂的 GitHub 技能來源。"
  t070: "hermes skills snapshot export setup.json 會匯出你的技能設定，供備份或分享。"
  t071: "hermes mcp add github --command npx 可從命令列新增 MCP 伺服器。"
  t072: "hermes mcp serve 會將 Hermes 本身作為 MCP 伺服器執行，供其他代理使用。"
  t073: "hermes auth add 讓你新增多個 API 金鑰，用於憑證池輪替。"
  t074: "hermes completion bash >> ~/.bashrc 會為所有指令與設定檔啟用 Tab 自動完成。"
  t075: "hermes logs -f 會即時追蹤 agent.log。--level WARNING --since 1h 可篩選輸出。"
  t076: "hermes backup 會為你的整個 Hermes 主目錄建立 zip 備份。"
  t077: "hermes profile create coder 會建立一個隔離的設定檔，並成為獨立的指令。"
  t078: "hermes profile create work --clone 會將你目前的設定與金鑰複製到新的設定檔。"
  t079: "hermes update 會自動將新的內建技能同步到所有設定檔。"
  t080: "hermes gateway install 會將 Hermes 設定為系統服務（systemd/launchd）。"
  t081: "hermes memory setup 讓你設定外部記憶提供方（Honcho、Mem0 等）。"
  t082: "hermes webhook subscribe 會建立事件驅動的 webhook 路由，並附帶 HMAC 驗證。"
  t083: "省錢技巧：hermes tools 可停用未使用的工具，hermes skills config 可精簡技能。"
  t084: "/reasoning low 或 /reasoning minimal 會將思考深度降到預設（medium）以下 — 回應更快、更便宜。"
  t085: "hermes models 會將視覺、壓縮與輔助任務路由到更便宜的模型 — 背景 token 費用可減少 85% 以上，而不必降級你的主要聊天模型。"
  t086: "在 config.yaml 中設定 display.bell_on_complete: true，長任務完成時就會響鈴提醒。"
  t087: "設定 display.streaming: true，即可在模型生成時即時看到 token 出現。"
  t088: "設定 display.show_reasoning: true，即可觀看模型的思維鏈推理。"
  t089: "設定 display.compact: true 可減少輸出中的空白，讓資訊更緊湊。"
  t090: "設定 display.busy_input_mode: queue 可將訊息排入佇列而不中斷代理；設為 steer 則可透過 /steer 在執行中途插入訊息。"
  t091: "設定 display.resume_display: minimal 可在恢復工作階段時略過完整的對話回顧。"
  t092: "設定 compression.threshold: 0.50 可控制自動壓縮的觸發時機（預設：上下文的 50%）。"
  t093: "設定 agent.max_turns: 1000 可讓代理在每回合執行更多工具呼叫步驟。"
  t094: "設定 file_read_max_chars: 200000 可提高每次 read_file 呼叫的內容上限。"
  t095: "設定 approvals.mode: smart 可讓 LLM 自動批准安全指令，並自動拒絕危險指令。"
  t096: "在 config.yaml 中設定 fallback_model，即可自動容錯移轉到備用提供方。"
  t097: "設定 privacy.redact_pii: true 可在傳送給 LLM 前，先將使用者 ID 與電話號碼雜湊處理。"
  t098: "設定 browser.record_sessions: true 可自動將瀏覽器工作階段錄製為 WebM 影片。"
  t099: "在 config.yaml 中設定 worktree: true，即可一律建立 git 工作樹（等同 hermes -w）。"
  t100: "設定 security.website_blocklist.enabled: true 可封鎖網頁工具存取特定網域。"
  t101: "設定 cron.wrap_response: false 可直接送出代理的原始輸出，不加排程頁首／頁尾。"
  t102: "HERMES_TIMEZONE 可用任何 IANA 時區字串覆寫伺服器時區。"
  t103: "config.yaml 支援環境變數替換：使用 ${VAR_NAME} 語法。"
  t104: "config.yaml 中的快速指令可立即執行 shell 指令，完全不消耗 token。"
  t105: "自訂人格可在 config.yaml 的 agent.personalities 底下定義。"
  t106: "provider_routing 可控制 OpenRouter 提供方的排序、白名單與黑名單。"
  t107: "execute_code 會執行以程式方式呼叫 Hermes 工具的 Python 腳本 — 結果不會進入上下文。"
  t108: "delegate_task 預設最多可同時啟動 10 個子代理（delegation.max_concurrent_children），各自擁有隔離的上下文以平行工作。"
  t109: "web_extract 支援 PDF 網址 — 傳入任何 PDF 連結，它就會轉換為 markdown。"
  t110: "search_files 以 ripgrep 為基礎，比 grep 更快 — 請用它取代終端機的 grep。"
  t111: "patch 使用 9 種模糊比對策略，因此細微的空白差異不會讓編輯失敗。"
  t112: "patch 支援 V4A 格式，可在單次呼叫中大量編輯多個檔案。"
  t113: "read_file 在找不到檔案時會建議相似的檔名。"
  t114: "read_file 會自動去重 — 重新讀取未變更的檔案只會回傳輕量的存根。"
  t115: "browser_vision 會擷取螢幕截圖並用 AI 分析 — 適用於 CAPTCHA 與視覺內容。"
  t116: "browser_console 可在頁面上下文中評估 JavaScript 表達式。"
  t117: "image_generate 使用 FLUX 2 Pro 生成圖片，並自動放大 2 倍。"
  t118: "text_to_speech 會將文字轉換為音訊 — 在 Telegram 上以語音泡泡播放。"
  t119: "send_message 可在工作階段中傳送訊息到任何已連接的通訊平台。"
  t120: "todo 工具可協助代理在工作階段中追蹤複雜的多步驟任務。"
  t121: "session_search 可對所有過去的對話進行全文搜尋。"
  t122: "代理會自動將偏好、修正與環境資訊儲存到記憶。"
  t123: "/moa 會將一個困難的提示交由你設定的 Mixture of Agents 模型組處理。"
  t124: "終端機指令支援背景模式，搭配 notify_on_complete 可處理長時間執行的任務。"
  t125: "終端機背景程序支援 watch_patterns，可在出現特定輸出行時發出提醒。"
  t126: "terminal 工具支援 6 種後端：local、Docker、SSH、Modal、Daytona 與 Singularity。"
  t127: "每個設定檔都有自己的設定、API 金鑰、記憶、工作階段、技能與排程任務。"
  t128: "設定檔名稱會成為 shell 指令 — 'hermes profile create coder' 會建立 'coder' 指令。"
  t129: "hermes profile export coder -o backup.tar.gz 會建立可攜式的設定檔封存檔。"
  t130: "如果兩個設定檔不小心共用同一個 bot token，第二個閘道會被阻擋並顯示明確的錯誤。"
  t131: "工作階段會在第一次交流後自動產生描述性標題 — 無需手動命名。"
  t132: "工作階段標題支援系譜：\"my project\" → \"my project #2\" → \"my project #3\"。"
  t133: "結束時，Hermes 會印出包含工作階段 ID 與統計資料的恢復指令。"
  t134: "hermes sessions export backup.jsonl 會匯出所有工作階段，供備份或分析。"
  t135: "hermes -r SESSION_ID 可依 ID 恢復任何特定的過去工作階段。"
  t136: "記憶是凍結的快照 — 變更只會在下次工作階段開始時出現在系統提示詞中。"
  t137: "記憶項目會自動掃描提示注入與資料外洩的模式。"
  t138: "代理有兩個記憶儲存區：個人筆記（約 2200 字元）與使用者資料（約 1375 字元）。"
  t139: "你給代理的修正（「不對，要這樣做」）通常會自動儲存到記憶。"
  t140: "內建超過 80 個技能，涵蓋 github、creative、mlops、productivity、research 等類別。"
  t141: "每個已安裝的技能都會自動成為指令 — 輸入 / 即可查看全部。"
  t142: "hermes skills install official/security/1password 可從儲存庫安裝選用技能。"
  t143: "技能可限制在特定作業系統平台 — 有些只會在 macOS 或 Linux 上載入。"
  t144: "config.yaml 中的 skills.external_dirs 讓你從自訂目錄載入技能。"
  t145: "代理可以使用 skill_manage 建立自己的技能，作為程序性記憶。"
  t146: "/plan 會將 markdown 實作計畫寫入 .hermes/plans/，而不執行任何操作。"
  t147: "排程任務可附加技能：hermes cron add --skill blogwatcher \"Check for new posts\"。"
  t148: "排程送達目標包括 telegram、discord、slack、email、sms 以及 12 個以上的其他平台。"
  t149: "如果排程回應以 [SILENT] 開頭，就會抑制送達 — 適合僅做監控的任務。"
  t150: "排程支援相對延遲（30m）、間隔（every 2h）、cron 表達式與 ISO 時間戳記。"
  t151: "排程任務會在全新的代理工作階段中執行 — 提示必須自成一體。"
  t152: "只要安裝了 faster-whisper，語音模式不需任何 API 金鑰即可使用（免費的本機語音轉文字）。"
  t153: "共有五種 TTS 提供方：Edge TTS（免費）、ElevenLabs、OpenAI、NeuTTS（免費本機）、MiniMax。"
  t154: "/voice on 會在 CLI 中啟用語音模式。Ctrl+B 可切換按住說話錄音。"
  t155: "串流 TTS 會在句子生成的同時播放 — 不必等完整回覆結束。"
  t156: "Telegram、Discord、WhatsApp 與 Slack 上的語音訊息會自動轉錄。"
  t157: "Hermes 可在 21 個訊息平台上運作：Telegram、Discord、Slack、WhatsApp、Signal、Matrix、IRC、Microsoft Teams、電子郵件等。"
  t158: "hermes gateway install 會將閘道設定為開機自動啟動的系統服務。"
  t159: "DingTalk 使用 Stream Mode — 不需要 webhook 或公開網址。"
  t160: "BlueBubbles 透過本機 macOS 伺服器把 iMessage 帶進 Hermes。"
  t161: "Webhook 路由支援 HMAC 驗證、速率限制與事件過濾。"
  t162: "API 伺服器提供與 OpenAI 相容的端點，可搭配 Open WebUI 和 LibreChat 使用。"
  t163: "Discord 語音頻道模式：bot 會加入語音頻道、轉錄語音並以語音回應。"
  t164: "group_sessions_per_user: true 讓群組聊天中的每個人都擁有自己的工作階段。"
  t165: "/sethome 會將某個聊天標記為主頻道，用來接收排程任務的投遞結果。"
  t166: "閘道支援以閒置為基準的逾時 — 活躍中的代理可以無限期執行。"
  t167: "危險指令的批准有 4 個層級：僅此一次、本工作階段、永遠（永久允許清單）、拒絕。"
  t168: "智慧批准模式會用 LLM 自動批准安全指令，並標記危險指令。"
  t169: "SSRF 防護會封鎖私有網路、loopback、link-local 與雲端 metadata 位址。"
  t170: "Tirith 執行前掃描可偵測同形字 URL 偽裝與 pipe 到直譯器的模式。"
  t171: "MCP 子程序只會收到經過濾的環境變數 — 僅安全的系統變數能通過。"
  t172: "上下文檔案（.hermes.md、AGENTS.md）在載入前會先掃描是否含有提示注入。"
  t173: "config.yaml 中的 command_allowlist 可永久批准特定的 shell 指令模式。"
  t174: "上下文達到門檻時會自動壓縮 — 記憶會先寫入，歷史則會被摘要。"
  t175: "隨著上下文逐漸填滿，狀態列會依序變成黃色、橘色、紅色。"
  t176: "SOUL.md 是代理的主要身分檔案 — 自訂它即可塑造代理的行為。"
  t177: "Hermes 會從 .hermes.md、AGENTS.md、CLAUDE.md 或 .cursorrules 載入專案上下文（取第一個符合者）。"
  t178: "當代理進入子資料夾時，會逐步發現其中的 AGENTS.md 檔案。"
  t179: "上下文檔案上限為 20,000 字元，超出時會智慧保留頭尾並截斷中間。"
  t180: "五種瀏覽器提供方：本機 Chromium、Browserbase、Browser Use、Camofox 與 Firecrawl。"
  t181: "Camofox 是反偵測瀏覽器 — 以 Firefox 分支為基礎，用 C++ 偽裝指紋。"
  t182: "browser_navigate 會自動回傳頁面快照 — 之後不必再呼叫 browser_snapshot。"
  t183: "browser_vision 搭配 annotate=true 會在互動元素上疊加編號標籤。"
  t184: "hermes mcp 會開啟互動式選擇器，列出 Nous 核准的 MCP，按一個鍵即可安裝。"
  t185: "hermes mcp catalog 會列出隨儲存庫附帶、經 Nous 核准的 MCP 伺服器。"
  t186: "hermes mcp install <name> 會安裝目錄中的項目、提示你輸入憑證，並讓你選擇要啟用哪些工具。"
  t187: "MCP 伺服器在 config.yaml 中設定 — 同時支援 stdio 與 HTTP 傳輸。"
  t188: "每個伺服器可各自過濾工具：tools.include 列出允許的工具，tools.exclude 列出排除的工具。"
  t189: "MCP 伺服器會在執行時自動產生工具集 — 可用 hermes tools 依平台個別切換。"
  t190: "MCP OAuth 支援：auth: oauth 會啟用透過瀏覽器並使用 PKCE 的授權流程。"
  t191: "沒有檔案被修改時，檢查點完全不會產生額外負擔 — 預設啟用。"
  t192: "還原前會自動儲存一份快照，所以你可以把復原再復原回來。"
  t193: "/rollback 也會撤銷該輪對話，因此代理不會記得已被還原的變更。"
  t194: "檢查點使用 ~/.hermes/checkpoints/ 下的影子儲存庫 — 絕不會碰你專案的 .git。"
  t195: "batch_runner.py 可平行處理數百個提示，用於產生訓練資料。"
  t196: "hermes chat -Q 會啟用安靜模式，適合程式化使用 — 不顯示橫幅與轉圈動畫。"
  t197: "軌跡儲存（--save-trajectories）會記錄完整的工具使用軌跡，供模型訓練使用。"
  t198: "外掛有三種類型：一般（工具／hook）、記憶提供方，以及上下文引擎。"
  t199: "hermes plugins install owner/repo 可直接從 GitHub 安裝外掛。"
  t200: "外部記憶提供方：內建 OpenViking、Mem0；Honcho、Hindsight 等更多可透過 hermes plugins install 安裝。"
  t201: "外掛 hook 包含 pre/post_tool_call、pre/post_llm_call，以及用來標準化輸出的 transform_terminal_output。"
  t202: "提示快取（Anthropic）透過重用已快取的系統提示詞前綴來降低費用。"
  t203: "代理會在背景執行緒中自動產生工作階段標題 — 完全不影響延遲。"
  t204: "智慧模型路由可自動把簡單的查詢導向較便宜的模型。"
  t205: "指令支援前綴比對：/h 會解析為 /help，/mod 解析為 /model。"
  t206: "把檔案路徑拖進終端機會自動附加圖片，或作為上下文送出。"
  t207: "在儲存庫根目錄放 .worktreeinclude，列出要複製到工作樹中的 gitignore 檔案。"
  t208: "hermes acp 會以 ACP 伺服器模式執行 Hermes，可整合 VS Code、Zed 與 JetBrains。"
  t209: "自訂提供方：在 config.yaml 的 custom_providers 下儲存具名端點。"
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT 會注入一段絕不會寫入歷史的系統提示詞。"
  t211: "credential_pool_strategies 支援 fill_first、round_robin、least_used 與 random 輪替。"
  t212: "hermes auth add nous 或 hermes auth add openai-codex 可設定以 OAuth 為基礎的提供方。"
  t213: "API 伺服器同時支援 Chat Completions 與 Responses API，並提供伺服器端狀態。"
  t214: "在設定中將 tool_preview_length: 0 可在轉圈動畫的活動列中顯示完整檔案路徑。"
  t215: "hermes status --deep 會對所有元件執行更深入的診斷檢查。"
  t216: "排程任務可附加 Python 腳本（--script），其 stdout 會作為上下文注入提示。"
  t217: "排程腳本放在 ~/.hermes/scripts/，會在代理之前執行 — 非常適合資料收集流程。"
  t218: "config.yaml 中的 prefill_messages_file 會在每次 API 呼叫注入 few-shot 範例，且絕不寫入歷史。"
  t219: "SOUL.md 會完全取代代理的預設身分 — 重寫它，讓 Hermes 成為你自己的代理。"
  t220: "SOUL.md 會在首次執行時自動填入預設人格。編輯它即可自訂。"
  t221: "/compress <focus topic> 會把 60-70% 的摘要預算分配給你的主題，並大幅精簡其餘部分。"
  t222: "第二次以後的壓縮，壓縮器會更新先前的摘要，而不是從頭開始。"
  t223: "閘道工作階段重設之前，Hermes 會在背景自動把重要事實寫入記憶。"
  t224: "在 config.yaml 中設定 network.force_ipv4: true 可修正 IPv6 故障的伺服器上的卡頓問題 — 會 monkey-patch socket。"
  t225: "terminal 工具會為常見的結束碼加上說明：grep 回傳 1 = 「找不到符合項目（不是錯誤）」。"
  t226: "失敗的前景終端機指令會以指數退避（2 秒、4 秒、8 秒）自動重試最多 3 次。"
  t227: "單獨的 sudo 指令會自動改寫為從 .env 以 pipe 傳入 SUDO_PASSWORD — 不需要互動式輸入。"
  t228: "execute_code 的輔助函式需要明確匯入：from hermes_tools import json_parse, shell_quote, retry。"
  t229: "execute_code 的 7 個沙箱工具（web_search、terminal、read/write/search/patch）透過 RPC 執行 — 絕不會進入上下文。"
  t230: "重複讀取同一檔案區段 3 次以上會觸發警告。達到 4 次以上就會被強制封鎖，以防止迴圈。"
  t231: "write_file 與 patch 會偵測檔案在上次讀取後是否被外部修改，並警告內容已過時。"
  t232: "V4A patch 格式支援 Add File、Delete File 與 Move File 指示 — 不只有 Update。"
  t233: "MCP 伺服器可透過 sampling 反向請求 LLM 補全 — 代理成為伺服器的工具。"
  t234: "MCP 伺服器送出 notifications/tools/list_changed 即可觸發工具自動重新註冊，無需重新啟動。"
  t235: "delegate_task 搭配 acp_command: 'claude' 可從任何平台將 Claude Code 生成為子代理。"
  t236: "委派有心跳執行緒 — 子代理的活動會傳遞給父代理，避免閘道逾時。"
  t237: "當提供方回傳 HTTP 402（需要付款）時，輔助客戶端會自動退回到下一個提供方。"
  t238: "agent.tool_use_enforcement 會引導那些只描述動作而不呼叫工具的模型 — GPT/Codex 會自動啟用。"
  t239: "agent.restart_after_turn_timeout 讓進行中的回合在 /restart 進入 stop() 之前先完成；restart_drain_timeout 只是 stop() 開始後的強制中斷時限。"
  t240: "agent.api_max_retries（預設 3）控制代理在顯示錯誤前重試失敗 API 呼叫的次數 — 調低可更快切換備援。"
  t241: "閘道會為每個工作階段快取 AIAgent 實例 — 清除這個快取會破壞 Anthropic 的提示快取。"
  t242: "任何網站都可以透過 /.well-known/skills/index.json 公開技能 — 技能中心會自動發現它們。"
  t243: "~/.hermes/skills/.hub/audit.log 的技能稽核日誌會記錄每一次安裝與移除操作。"
  t244: "過期的 git 工作樹會在啟動時自動清理：乾淨且已完全合併的樹會被移除；有未提交或未推送的工作則一律保留。"
  t245: "設定檔透過 HERMES_HOME 隔離 Hermes 狀態；除非 terminal.home_mode 設為 profile，主機工具子程序會保留你真正的 HOME。"
  t246: "HERMES_HOME_MODE 環境變數（八進位，例如 0701）可設定自訂目錄權限，供網頁伺服器穿越存取。"
  t247: "容器模式：在 HERMES_HOME 放置 .container-mode，主機 CLI 就會自動 exec 進入容器。"
  t248: "Ctrl+C 有 5 個優先層級：取消錄音 → 取消提示 → 取消選擇器 → 中斷代理 → 離開。"
  t249: "代理執行期間的每次中斷都會連同時間戳記記錄到 ~/.hermes/interrupt_debug.log。"
  t250: "BROWSER_CDP_URL 可將瀏覽器工具連接到任何執行中的 Chromium 系列瀏覽器 — 接受 WebSocket、HTTP 或 host:port。"
  t251: "BROWSERBASE_ADVANCED_STEALTH=true 會啟用搭配自訂 Chromium 的進階反偵測（Scale 方案）。"
  t252: "在寬度不足 80 欄的終端機中，CLI 會自動切換為精簡模式。"
  t253: "快速指令支援兩種類型：exec（直接執行 shell 指令）與 alias（重新導向到另一個指令）。"
  t254: "按任務設定委派模型：設定中的 delegation.model 與 delegation.provider 可將子代理導向較便宜的模型。"
  t255: "delegation.reasoning_effort 可獨立控制子代理的思考深度。"
  t256: "config.yaml 中的 display.platforms 允許依平台覆寫顯示設定：{telegram: {tool_progress: all}}。"
  t257: "設定中的 human_delay.mode 會模擬人類打字速度 — 可設定 min_ms/max_ms 範圍。"
  t258: "設定版本遷移會在載入時自動執行 — 新的設定鍵會自動出現，無需手動介入。"
  t259: "GPT 與 Codex 模型會收到特別的系統提示詞指引，強調工具紀律與必須使用工具。"
  t260: "Gemini 模型會收到專屬指示：使用絕對路徑、平行呼叫工具，以及使用非互動式指令。"
  t261: "config.yaml 中的 context.engine 可設為外掛名稱，以使用其他的上下文管理策略。"
  t262: "超過 15,000 字元的瀏覽器頁面快照會被截斷或自動摘要；完整快照會儲存到 cache/web，可用 read_file 分頁讀取。"
  t263: "壓縮器會先做一次低成本的預處理：超過 200 字元的工具輸出會在 LLM 執行前先替換為佔位符。"
  t264: "壓縮失敗時，後續嘗試會暫停 10 分鐘，以避免對 API 造成轟炸。"
  t265: "過長的危險指令（超過 70 字元）在批准提示中會多一個「view」選項，讓你先查看完整內容。"
  t266: "語音錄音期間會依麥克風 RMS 音量顯示 ▁▂▃▄▅▆▇ 音量條。"
  t267: "設定檔名稱不能與 PATH 中既有的執行檔衝突 — 「hermes profile create ls」會被拒絕。"
  t268: "hermes profile create backup --clone-all 會複製全部內容（設定、金鑰、SOUL.md、記憶、技能、工作階段）。"
  t269: "語音錄音鍵可透過 config.yaml 中的 voice.record_key 設定 — 不限於 Ctrl+B。"
  t270: ".cursorrules 與 .cursor/rules/*.mdc 檔案會被自動偵測，並作為專案上下文載入。"
  t271: "上下文檔案掃描支援 10 種以上的提示注入模式 — 隱形 Unicode、「忽略指示」、外洩嘗試等。"
  t272: "GPT-5 與 Codex 在訊息格式中使用 'developer' 角色，而非 'system'。"
  t273: "按任務覆寫輔助設定：config.yaml 中的 auxiliary.vision.provider、auxiliary.compression.model 等。"
  t274: "輔助客戶端把 'main' 視為提供方別名 — 會解析為你實際使用的主要提供方與模型。"
  t275: "hermes claw migrate --dry-run 可預覽 OpenClaw 遷移，而不會寫入任何內容。"
  t276: "貼上帶有引號或跳脫空格的檔案路徑會自動處理 — 不需手動清理。"
  t277: "指令絕不會觸發大量貼上的收合 — 帶有大量參數的 /command 也能正常運作。"
  t278: "在中斷模式下，代理執行期間輸入的指令會繞過中斷邏輯並立即執行。"
  t279: "HERMES_DEV=1 會略過容器模式偵測，方便本機開發。"
  t280: "每個 MCP 伺服器都有自己的工具集（mcp-servername），可透過 hermes tools 獨立切換。"
  t281: "設定中的 MCP ${ENV_VAR} 佔位符會在伺服器啟動時解析 — 包含來自 ~/.hermes/.env 的變數。"
  t282: "來自受信任儲存庫（NousResearch）的技能會取得「trusted」安全等級；社群技能則會進行額外掃描。"
  t283: "~/.hermes/skills/.hub/quarantine/ 的技能隔離區存放等待安全審查的技能。"
  t284: "/steer <prompt> 會在下一次工具呼叫後注入一則備註 — 在任務進行中調整方向而不中斷。"
  t285: "/goal <text> 會設定一個持續的 Ralph 循環目標 — Hermes 會一輪接一輪自動繼續，直到評審判定完成。"
  t286: "/snapshot create [label] 會儲存 Hermes 設定的完整狀態快照；之後可用 /snapshot restore <id> 還原。"
  t287: "/copy [N] 會把最後一則助理回覆複製到剪貼簿，加上數字則複製倒數第 N 則。"
  t288: "/redraw 會強制重繪整個 UI，修正 tmux 調整大小或滑鼠選取殘影造成的終端機錯位。"
  t289: "/agents（別名 /tasks）會顯示目前工作階段中活躍的代理與執行中的背景任務。"
  t290: "/footer 可切換最終回覆上的閘道頁尾，顯示模型、上下文百分比與 cwd。"
  t291: "/busy queue|steer|interrupt 控制 Hermes 工作時按下 Enter 的行為。"
  t292: "在 Telegram 私訊中，/topic 會啟用由使用者管理的多工作階段主題模式 — /topic <id> 可就地恢復過去的工作階段。"
  t293: "/approve session|always 會以你選擇的信任範圍執行待批准的危險指令；/deny 則拒絕它。"
  t294: "/restart 會在等待進行中的執行結束後平順地重新啟動閘道，恢復後再通知發出請求的人。"
  t295: "/kanban boards switch <slug> 可直接在聊天中切換目前使用的多專案 Kanban 看板。"
  t296: "/reload 會將 ~/.hermes/.env 重新載入到執行中的工作階段 — 不必重新啟動即可套用新的 API 金鑰。"
  t297: "設定 no_agent=True 的 cronjob 會依排程執行腳本並直接送出其 stdout — 零 token、零 LLM。"
  t298: "排程腳本的 stdout 為空代表靜默執行 — 不會投遞任何內容，非常適合門檻監控。"
  t299: "HERMES_CRON_MAX_PARALLEL（預設 4）限制每次觸發可同時執行的排程任務數量，避免瞬間爆量耗盡你的金鑰。"
  t300: "閘道 hook 位於 ~/.hermes/hooks/<name>/，包含 HOOK.yaml 與 handler.py — 處理函式必須命名為 `handle`。"
  t301: "Hook 事件包含 gateway:startup、session:start、agent:step，以及 command:* 萬用字元訂閱。"
  t302: "放一份 ~/.hermes/BOOT.md 檢查清單，gateway:startup hook 就會在每次開機時以單次代理執行它。"
  t303: "hermes curator run --dry-run 可預覽 curator 會歸檔或整併哪些內容，而不實際更動任何東西。"
  t304: "hermes curator pin <skill> 會將技能牢牢鎖住，同時防止自動歸檔與代理的 skill_manage 工具更動它。"
  t305: "hermes curator rollback 會從執行前的快照還原技能 — 備份位於 skills/.curator_backups/。"
  t306: "hermes auth reset <provider> [target] 會清除整個憑證池的冷卻與耗盡標記，也可依索引、id 或標籤只清除單一憑證。"
  t307: "credential_pool_strategies.<provider>: round_robin 會平均輪替金鑰，取代預設的 fill_first。"
  t308: "針對單一工具設定 use_gateway: true，可將 web、image、tts 或 browser 經由你的 Nous 訂閱路由 — 不需額外金鑰。"
  t309: "provider_routing.data_collection: deny 會在 OpenRouter 上排除會儲存資料的提供方。"
  t310: "provider_routing.require_parameters: true 只會路由到支援你請求中每個參數的提供方。"
  t311: "HERMES_TUI_RESUME=1 會在啟動時自動重新連接最近的 TUI 工作階段 — SSH 斷線後特別好用。"
  t312: "HERMES_TUI_THEME=light|dark|<hex> 可在未設定 COLORFGBG 的終端機上強制指定 TUI 主題。"
  t313: "在 TUI 中按 Ctrl+G 或 Ctrl+X Ctrl+E，可用 $EDITOR 開啟輸入緩衝區，方便撰寫多行長提示。"
  t314: "TUI 會即時渲染 LaTeX — $E=mc^2$ 會顯示為 Unicode 數學符號，而非原始 TeX。"
  t315: "hermes dashboard 會在 127.0.0.1:9119 啟動本機網頁 UI — 資料完全不離開 localhost。"
  t316: "hermes dashboard 透過 xterm.js 與 WebSocket PTY，在瀏覽器中內嵌完整的 Hermes TUI。"
  t317: "在 ~/.hermes/dashboard-themes/ 放一份只含兩個調色盤顏色的 YAML，即可為整個儀表板換上新外觀。"
  t318: "儀表板外掛即放即用：把 manifest.json 與 JS bundle 放進 ~/.hermes/dashboard-plugins/ — 不需 npm 建置。"
  t319: "在儀表板主題中設定 layoutVariant: cockpit，會新增 260px 的左側欄，外掛可透過 sidebar 插槽填入內容。"
  t320: "display.tool_progress_command: true 會在訊息平台上開放 /verbose；預設僅限 CLI。"
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result 只在背景任務完成時通知（其他選項：concise/all/error/off）。"
  t322: "HERMES_WRITE_SAFE_ROOT 將 write_file/patch 限制在指定目錄前綴內；多個路徑以 os.pathsep（: 或 ;）分隔。"
  t323: "HERMES_IGNORE_RULES 會略過 AGENTS.md、SOUL.md、.cursorrules、記憶與預先載入技能的自動注入。"
  t324: "HERMES_ACCEPT_HOOKS 會自動批准 config.yaml 中宣告但尚未見過的 shell hook，不會出現 TTY 提示。"
  t325: "auxiliary.goal_judge.model 可將 /goal 的評判交給便宜又快速的模型，讓循環成本趨近於零。"
  t326: "檢查點會略過超過 50,000 個檔案的目錄，避免在超大型 monorepo 上執行緩慢的 git 操作。"
  t327: "tts.provider: piper 在 CPU 上執行支援 44 種語言的本機 TTS — 語音會自動下載到 ~/.hermes/cache/piper-voices/。"
  t328: "tts.providers.<name>.type: command 可透過 {input_path} 與 {output_path} 佔位符接上任何 CLI TTS 引擎。"
  t329: "API_SERVER_ENABLED=true 會與閘道一併執行 OpenAI 相容端點，供 Open WebUI 與 LibreChat 使用。"
  t330: "GATEWAY_PROXY_URL 可執行分離式架構：平台 I/O 在本機處理，代理工作委派給遠端 API 伺服器。"
  t331: "MATRIX_DEVICE_ID 為 E2EE 固定一個穩定的裝置 ID — 若未設定，每次啟動都會輪替金鑰，歷史訊息將無法解密。"
  t332: "只要設定了 TELEGRAM_WEBHOOK_URL，就必須同時設定 TELEGRAM_WEBHOOK_SECRET — 可用 openssl rand -hex 32 產生。"
  t333: "batch_runner.py --resume 依文字內容比對已完成的提示，因此資料集重新排序後不會重跑已完成的工作。"
  t334: "/new 會就地開始全新的工作階段（別名 /reset）— 新的工作階段 ID、乾淨的歷史，CLI 維持開啟。"
  t335: "/clear 會清除終端機畫面「並」開始新的工作階段 — 一個快速鍵完成視覺重置。"
  t336: "/history 會直接在 CLI 內印出目前的對話，不必離開 — 適合快速回顧。"
  t337: "/save 會將目前的對話寫入磁碟，而不結束工作階段。"
  t338: "/status 一眼掌握工作階段資訊：ID、標題、模型、token 用量與已耗時。"
  t339: "/image <path> 會為你的下一個提示附加本機圖片檔，不必貼上或拖放。"
  t340: "/platforms 可直接在聊天中查看閘道與訊息平台的連線狀態。"
  t341: "/commands 會分頁列出完整的指令與已安裝技能清單 — 在沒有 Tab 補全的平台上特別實用。"
  t342: "/toolsets 列出所有可用的工具集，讓你知道 -t/--toolsets 接受哪些值。"
  t343: "/voice tts 切換純 TTS 模式 — 代理以語音回覆，但你仍以打字輸入提示。"
  t344: "/reload-skills 會重新掃描 ~/.hermes/skills/，讓直接放入的技能無需重啟工作階段即可出現。"
  t345: "/indicator kaomoji|emoji|unicode|ascii 可選擇代理執行期間 TUI 顯示的忙碌指示器樣式。"
  t346: "/debug 會上傳支援套件（系統資訊 + 日誌）並回傳可分享的連結 — 在聊天中也能用。"
  t347: "hermes -z \"<prompt>\" 是最純粹的單次執行：只將最終答案輸出到 stdout，別無其他 — 最適合在腳本中串接管線。"
  t348: "hermes chat --pass-session-id 會將工作階段 ID 注入系統提示詞，讓代理能自我引用。"
  t349: "hermes chat --image path/to/pic.png 可為單次 -q 查詢附加本機圖片，不需另外上傳。"
  t350: "hermes chat --ignore-user-config 會略過目前使用者的設定 — 適合可重現的錯誤回報與 CI 執行。"
  t351: "hermes chat --source tool 會為程式化的聊天加上標記，避免它們塞滿 hermes sessions list。"
  t352: "hermes dump --show-keys 會包含經遮蔽的 API 金鑰指紋，便於更深入的支援除錯。"
  t353: "hermes sessions rename <ID> \"new title\" 可重新命名任何過去的工作階段；hermes sessions delete <ID> 可刪除一個。"
  t354: "hermes import 可還原完整的 Hermes 備份 zip；工作階段的 JSON/JSONL 匯出檔則可從儀表板的 Sessions 頁面匯入。"
  t355: "hermes fallback 可互動式管理 fallback_model 鏈 — 不必手動編輯 config.yaml。"
  t356: "hermes pairing 會輪替私訊配對 token — 輪替後第一個傳訊息的人取得 bot 的存取權。"
  t357: "hermes setup 以單一互動流程引導首次使用者完成提供方、金鑰與平台的設定。"
  t358: "hermes status --deep 會對每個元件執行完整的健康檢查；單純的 hermes status 則是快速檢視。"
  t359: "HERMES_AGENT_TIMEOUT=0 會停用閘道對執行中代理的閒置終止 — 適合長時間研究任務。"
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 會自動載入 ./.hermes/plugins/ 中的儲存庫本機外掛 — 設計上受信任機制把關。"
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 會關閉 patch 與 write_file 的「檔案自你讀取後已變更」防護。"
  t362: "HERMES_ALLOW_PRIVATE_URLS=true 允許網頁工具存取 localhost 與私有網路 — 閘道模式下預設關閉。"
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 會在每個設定檔首次執行時自動安裝額外的選用目錄技能。"
  t364: "HERMES_BUNDLED_SKILLS 指向自訂的內建技能目錄樹 — Homebrew 與 Nix 封裝會用到。"
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 會將每個 API 請求內容輸出到 stdout，而非寫入日誌檔。"
  t366: "HERMES_OAUTH_TRACE=1 會記錄經遮蔽的 OAuth token 交換與更新嘗試，用於除錯提供方驗證。"
  t367: "HERMES_STREAM_RETRIES（預設 3）控制遇到暫時性網路錯誤時串流中途重連的次數。"
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false 會在使用者傳訊給忙碌中的代理時，關閉 ⚡/⏳/⏩ 確認訊息。"
  t369: "HERMES_AGENT_NOTIFY_INTERVAL（預設 180s）設定長回合中閘道回報進度的頻率。"
  t370: "HERMES_RESTART_DRAIN_TIMEOUT（預設 900s）限制 /restart 在強制重啟前等待進行中執行的最長時間。"
  t371: "HERMES_CHECKPOINT_TIMEOUT（預設 30s）限制檔案系統檢查點的建立時間 — 在超大型 monorepo 上可調高。"
  t372: "config.yaml 中的 image_gen.model 可選擇 FAL 模型：flux-2/klein、gpt-image-2、nano-banana-pro 等。"
  t373: "image_gen.provider 可將圖片生成改由外掛（OpenAI Images、Codex、FAL）處理，取代預設方式。"
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY 可將視覺分析指向任何 OpenAI 相容端點。"
  t375: "security.tirith_fail_open: false 會讓 Hermes 在 tirith 掃描器本身出錯時封鎖指令。"
  t376: "TIRITH_FAIL_OPEN 環境變數會覆寫 tirith_fail_open 設定 — 不必編輯 config.yaml 即可快速切換。"
  t377: "--source tool 的聊天預設不會出現在 hermes sessions list — 明確指定 --source 才能看到。"
  t378: "工作階段 ID 以時間戳記為前綴（20250305_091523_abcd），在 ls 與 jq 中排序自然正確。"
  t379: "API_SERVER_MODEL_NAME 可自訂 /v1/models 上的模型名稱 — 多設定檔的 Open WebUI 環境必備。"
  t380: "儀表板外掛由 /dashboard-plugins/<name>/ 提供 — 把檔案放進 ~/.hermes/dashboard-plugins/ 即可。"
