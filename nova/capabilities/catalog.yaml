# NOVA capability catalog — what the Hermes runtime provides, and NOVA's posture on it.
#
# Generated by the audit in docs/audits/NOVA_HERMES_CAPABILITY_AUDIT.md. Every entry
# cites a real file and symbol. Fields whose answer the audit could not PROVE are
# `unknown` rather than guessed — `unknown` is a finding, not a placeholder to fill in
# later from intuition.
#
# runtime_enforcement ladder (project standard):
#   declared    config/schema/type exists; no runtime consumer proven
#   wired       a runtime call site reads it
#   enforced    the runtime refuses or acts on it
#   tested      covered by a test in this repo
#   live_proven observed in this audit against the real runtime, output recorded
#
# nova_status: none | partial | surfaced
# customer_visible / customer_editable: whether it may be shown/edited by a TENANT
#   administrator through the Control Center (operator-only capabilities are false).

