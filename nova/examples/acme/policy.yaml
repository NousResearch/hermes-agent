# Business actions, named in the customer's language rather than the runtime's.
# The person who decides that refunds need approval is not the person who knows which
# tool issues one; this file is where those two meet.
actions:
  refund:
    description: Issue a refund to a customer
    tools: [crm_refund]
    requires_approval: true

  account_deletion:
    description: Permanently delete a customer record
    tools: [crm_delete_customer]
    requires_approval: true

  send_external_email:
    description: Send a message to someone outside the company
    # The runtime's outbound message tool. Its arguments are `action` (send, list, react),
    # `target` (platform:recipient) and `message` — the content.
    tools: [send_message]
    # Not required tenant-wide; an individual agent may still require it.
    requires_approval: false

# Named permissions and the tools they grant. An agent's `permissions:` list draws
# from these.
permissions:
  read_customers:
    description: Look up customer records
    tools: [crm_lookup, crm_search]

  create_ticket:
    description: Raise a support ticket
    tools: [ticket_create, ticket_update]

  read_inventory:
    description: Read warehouse and stock data
    tools: [erp_stock_query]

  contact_suppliers:
    description: Message suppliers about stock and deliveries
    tools: [send_message]

# Tools every agent keeps regardless of its permissions. Without these an allow-list
# would produce agents that run work and never close it.
baseline_tools:
  - kanban_complete
  - kanban_block
  - kanban_comment
  - kanban_heartbeat
  - kanban_request_review
  - kanban_show
  - clarify
  - todo_list

defaults:
  # Deny anything no rule mentions. The posture a security review will ask for; switch to
  # `allow` while a deployment is still being mapped out.
  unlisted_tool: deny

# Risk triage and earned autonomy for approval-gated calls (docs/platform/EARNED_AUTONOMY.md).
# Shadow mode with the fake provider: every call still goes to a person, triage records what
# it would have done, and the example runs without any key. To try the real provider, set
# `provider: typesafe` and put TYPESAFE_API_KEY in the agent's credentials. `enforce` is
# refused with the fake provider, and an action only graduates when an administrator confirms
# a promotion it has earned — never by editing this file.
autonomy:
  provider: fake
  mode: shadow
  data: metadata_only
  timeout_seconds: 2.0
  actions:
    send_external_email:
      questions: default
