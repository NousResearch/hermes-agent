# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: altitude
description: 'Altitude: balances and transactions; reviewed read tools enabled by default.'
source: https://docs.altitude.xyz/mcp/setup

# Official vendor-hosted remote MCP (URL-only — Hermes never spawns a local
# process for this entry). Native OAuth 2.1 + Dynamic Client Registration
# through a WorkOS AuthKit tenant (verified live: RFC 9728 protected-resource
# metadata -> AS metadata with registration_endpoint). The protected-resource
# document advertises the tenant with a root slash (https://<tenant>.authkit.app/)
# and the AS metadata names it without one, so browser sign-in needs Hermes to
# accept that root-slash issuer equivalence (open fixes: #133681, #113762,
# #132253). Until one merges, sign-in fails with an issuer mismatch.
#
# Altitude's documented tools are read-only except generate_exports, which
# prepares a PDF/CSV statement for the signed-in user (no email is sent);
# it and download_export are excluded by default below. The
# server cannot create, approve or submit payments, change Workspace settings,
# or move funds, and connecting does not change the account's permissions.

transport:
  type: http
  url: https://mcp.altitude.xyz/mcp

auth:
  type: oauth

# Preselect the reviewed read surface for fresh installs. Existing selections
# survive reinstalls; the CLI can clear filters on empty discovery or when all
# advertised tools are selected. This is a default, not a runtime capability cap.
# Export generation and download remain available through explicit configuration.
tools:
  default_enabled:
    - whoami
    - list_workspaces
    - list_accounts
    - search_transactions
    - get_bill_settings
    - get_receipt_settings
    - list_export_options
    - get_export_status

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - altitude
    - business banking
  hosts:
    - altitude.xyz

post_install: |
  Compatibility: browser sign-in requires the upstream OAuth root-slash
  issuer fix (tracked in #133681, #113762 and #132253). Without it,
  installation succeeds but login fails with an issuer mismatch;
  restarting or retrying does not fix this. This entry does not patch OAuth.

  Before using the connection, disable server-requested model sampling and
  use untrusted-server approval handling in the active Hermes profile:
    hermes config set mcp_servers.altitude.sampling.enabled false
    hermes config set mcp_servers.altitude.trust untrusted
  The catalog cannot currently set these policies automatically, and the
  installer may already have probed the server before showing this guidance.
  Restart the session after changing them. Untrusted-server handling is
  additional approval protection, not a guarantee that all tools are read-only.
  Read results can still contain sensitive financial data and untrusted text.

  On first connection Hermes opens a browser to sign in to
  Altitude (or run `hermes mcp login altitude`). Approve access,
  then restart the session so tools load.

  Statement generation and download are not preselected; enable
  them with `hermes mcp configure altitude`. Existing selections survive
  reinstalls. Empty discovery or selecting every advertised tool can clear
  the CLI's filter; review the resulting selection before using financial tools.

  Results follow your existing Altitude Workspace permissions.
  Review or disconnect clients under Settings → My account →
  MCP connections in the Altitude app.
