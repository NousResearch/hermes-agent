# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
#
# Schema version 1.
manifest_version: 1

name: apple-mail
description: Read, search, send, reply, forward, and organize Apple Mail on macOS.
source: https://github.com/sweetrb/apple-mail-mcp

# Published npm package — npx fetches and runs it. No install/clone step is
# needed (transport.command IS the install, per the npm/uvx note). Pinned to
# the exact version validated on macOS per catalog policy (no auto-update;
# auditable); bump the pin via PR after validating a new release.
#
# How this pin was validated (catalog policy: "version validated on macOS").
# On macOS, `npx -y apple-mail-mcp@2.19.14`:
#   - completes an MCP `initialize` handshake reporting serverInfo.version
#     2.19.14 — i.e. the bytes npx resolved are the bytes pinned here;
#   - returns a full `tools/list` of 52 tools, every one carrying a description;
#   - resolves all 18 `tools.default_enabled` entries below against that
#     list, so no allow-listed name went stale across the bump.
# Tools added since the previous pin are deliberately left OUT of
# default_enabled — widening the default surface is the maintainers' call.
# Re-run all three checks before moving this pin.
#
# Earlier pins, both ahead of the >=2-week age policy: 2.17.6 (2026-09-03,
# fast-uri security fix: 4 high-severity GHSAs reachable via ajv's JSON-schema
# validation on every tool call), 2.17.10 (2026-09-10: on a
# British/Australian/Irish Mac, which says "Not authorised", `doctor` and
# `health-check` reported `permissions: ok` on a genuine TCC refusal —
# sweetrb/apple-mail-mcp#218), and 2.19.6 (2026-09-14, see the release notes
# for that range if needed — superseded below).
#
# 2.19.14 is re-pinned on the same footing. Two more defects landed in
# default_enabled tools since 2.19.6, both reported against a real
# `j5pu@icloud.com` mailbox (sweetrb/apple-mail-mcp#246):
#   - `list-messages`/`search-messages` could report a search-result total
#     that exceeded the mailbox's own real message count (traced to a bug in
#     the vendored `imapflow` dependency's `ESEARCH` response handling, which
#     can fabricate a huge match count from a stale cached `exists` value),
#     and page into ids that were never real, silently returning zero results
#     past offset 0. The two tools now cross-check the search-derived total
#     against a fresh `STATUS` call before trusting it, and fail loud instead
#     of returning a fabricated total (2.19.11).
#   - When that new guard trips, the resulting "IMAP list failed in every
#     requested mailbox" error discarded the actual underlying IMAP failure
#     reason before it reached the caller — exactly what happened to @j5pu
#     immediately after upgrading, leaving them (and us) unable to diagnose
#     why their INBOX started failing outright. `list-messages`/
#     `search-messages` now include the real per-mailbox error text in both
#     the all-failed exception and the partial-failure note (2.19.14).
#     mail#246 is REOPENED pending @j5pu's reply with that new detail — the
#     underlying INBOX-access problem on their account is not yet understood.
# 2.19.7-2.19.10 and 2.19.13 land only on tools outside default_enabled
# (dateSent parity on the AppleScript rows, a send/create-draft
# retry-duplication fix, a search `body` parameter, the new
# `get-message-rfc822` tool, and a reply/forward saved-draft window-close
# fix) — capability additions and write-tool fixes, not defects in
# default_enabled tools, so they don't independently justify a re-pin under
# this catalog's defect-only carve-out; they ride along because 2.19.11 and
# 2.19.14 do. 2.18.0 and 2.18.1 land only on send/mutation tools that are
# disabled below.
transport:
  type: stdio
  command: "npx"
  args:
    - "-y"
    - "apple-mail-mcp@2.19.14"

# Drives Apple Mail locally via AppleScript; no credentials.
auth:
  type: none

# Read-only by default: browse, search, message/thread reads, counts,
# attachment listing/content, contacts, and diagnostics. Send / reply /
# forward / draft / delete / move / flag / mark-as / mailbox- and
# rule-mutation / template-mutation tools stay disabled unless the user
# enables them at install time — so a failed tool probe or a non-TTY
# install still yields a safe, non-mutating surface.
tools:
  default_enabled:
    - doctor
    - health-check
    - get-sync-status
    - list-accounts
    - list-mailboxes
    - list-messages
    - search-messages
    - get-message
    - get-thread
    - get-unread-count
    - get-mail-stats
    - list-attachments
    - fetch-attachment
    - search-contacts
    - resolve-message-id
    - list-rules
    - list-templates
    - get-template

post_install: |
  Requires macOS — the server controls Apple Mail via AppleScript and will
  prompt for Automation access to Mail on first use. Automation access to
  Mail is the ONLY permission it needs: unlike apple-notes and apple-photos,
  no tool here reads a protected location directly, so Full Disk Access is
  not required. That includes the default-enabled `fetch-attachment` — Mail
  itself writes the attachment out under Automation and the server reads it
  back from a private temp directory it created, so the mail store is never
  touched by this process.

  It ships read-only by default (browse, search, read, diagnostics); the
  send / reply / forward / delete / move tools act on your real mailbox and
  stay disabled until you enable them in the install-time checklist or the
  tool filter.

  Start a new Hermes session to load the Apple Mail tools.
