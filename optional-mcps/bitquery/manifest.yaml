# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: bitquery
description: 'On-chain data: DEX trades, prices, trader PnL, fund tracing, and address labels.'
source: https://docs.bitquery.io/docs/mcp/mcp-server/

# Official vendor-hosted remote MCP (URL-only — Hermes never spawns a local
# process for this entry). Native OAuth 2.1 + Dynamic Client Registration
# (verified live: RFC 9728 protected-resource metadata -> AS metadata with
# registration_endpoint); Hermes's MCP client + mcp_oauth_manager handle
# discovery, PKCE, token exchange, and refresh.

transport:
  type: http
  url: https://mcp.bitquery.io/mcp

auth:
  type: oauth

# Excluded: the free-form SQL tool, which needs a paid Bitquery plan. Every
# tool on this server is read-only (readOnlyHint: true); nothing signs or
# sends a transaction.
tools:
  default_excluded:
    - execute_sql

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - bitquery
    - dex trades
    - on-chain data
  hosts:
    - bitquery.io

post_install: |
  On first connection Hermes opens a browser to sign in to your
  Bitquery account (or run `hermes mcp login bitquery`). Approve access,
  then restart the session so tools load.

  A Bitquery account starts with a free 7-day trial. execute_sql is
  off by default because it needs a paid plan; turn it on with:
    hermes mcp configure bitquery
