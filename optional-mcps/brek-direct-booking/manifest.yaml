# Vendor-hosted remote MCP; catalog admission requires maintainer review.
manifest_version: 1

name: brek-direct-booking
description: "Search Airbnb vacation rentals and find direct booking options for the same homes."
source: https://www.brek.ai/help/connectors

transport:
  type: http
  url: https://api.brek.ai/mcp

auth:
  type: none

tools:
  default_enabled:
    - lookup_direct_booking
    - search_vacation_rentals

suggest:
  keywords:
    - "brek direct booking"
    - "direct booking"
    - "vacation rentals"
    - "Airbnb cabins"
  hosts:
    - airbnb.com
    - brek.ai
  examples:
    - "Find a direct-booking page for https://www.airbnb.com/rooms/13208131."
    - "Can I book this Airbnb rental directly through its property manager?"
    - "Find pet-friendly cabins with a hot tub in South Lake Tahoe for November 16–19."

post_install: |
  No account, API key, payment details or PMS access is required.
  Restart the session after installation to discover lookup_direct_booking
  and search_vacation_rentals.

  Search by destination, dates, guests, property type and amenities to see
  Airbnb source-platform trip totals and mapped owner links when available.
  Or provide a specific Airbnb room URL or exact listing ID for a direct
  booking lookup. Coverage varies; no match is a normal result. Follow
  next_offset when additional search or lookup results are requested.

  Source-platform trip totals are not direct-booking quotes. Travelers must
  confirm direct prices, availability, fees, terms and any savings on the
  booking website. The tools do not contact hosts, make reservations or
  process payments.

  Documentation: https://www.brek.ai/help/connectors
  Privacy: https://www.brek.ai/privacy#direct-booking-mcp
  Contact: leo@pageonelab.com.
