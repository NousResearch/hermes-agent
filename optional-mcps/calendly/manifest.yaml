# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: calendly
connector_slug: calendly
description: Scheduling links, events, and invitees from Calendly.
source: https://developer.calendly.com/calendly-mcp-server

# Official vendor-hosted remote MCP (URL-only — Rabbit never spawns a local
# process for this entry). Native OAuth 2.1 + Dynamic Client Registration
# (verified live: RFC 9728 protected-resource metadata -> AS metadata with
# registration_endpoint); Rabbit's MCP client + mcp_oauth_manager handle
# discovery, PKCE, token exchange, and refresh.

transport:
  type: http
  url: https://mcp.calendly.com

auth:
  type: oauth

# Excluded: vendor skill-discovery pair (instruction-loading indirection —
# Rabbit skills/tool_search cover this).
tools:
  default_excluded:
    - list_calendly_skills
    - load_calendly_skill

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - calendly
    - scheduling
  hosts:
    - calendly.com

post_install: |
  On first connection Rabbit opens a browser to authorize with
  Calendly (or run `rabbit mcp login calendly`). Approve access,
  then restart the session so tools load.
