# Catalog submission; Nous review is required before inclusion.
manifest_version: 1
name: cardzmc
description: Pokemon and One Piece PSA 10 reference prices, populations, history, and market rankings.
source: https://mcp.cardz.game/
transport:
  type: http
  url: https://mcp.cardz.game/mcp
auth:
  type: none
tools:
  default_enabled:
    - search_cards
    - get_card
    - get_market
suggest:
  keywords:
    - cardzmc
    - cardz marketcap
  hosts:
    - cardzmarketcap.com
    - mcp.cardz.game
post_install: |
  No account, API key, or credentials are required. Start a new session to use
  search_cards, get_card, and get_market. Results include source dates and USD
  reference prices. This connection only reads public card and market data.
