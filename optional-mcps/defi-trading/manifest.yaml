# Paper-safe market-data profile for Hermes Agentic Trader repair.
# defi-trading-mcp@2.1.3 also contains aggregator-backed portfolio/quote/write
# tools, but that exact release routes those requests to a plaintext HTTP
# endpoint. They are intentionally excluded from the default tool surface.
manifest_version: 1

name: defi-trading
description: CoinGecko market intelligence for the Hermes Agentic Trader repair track.
source: https://github.com/edkdev/defi-trading-mcp

transport:
  type: stdio
  command: npx
  args:
    - "-y"
    - "defi-trading-mcp@2.1.3"

auth:
  type: api_key
  env:
    - name: COINGECKO_API_KEY
      prompt: "CoinGecko API key"
      required: true
      secret: true

tools:
  default_enabled:
    - get_token_price
    - get_coingecko_networks
    - get_supported_dexes
    - get_trending_pools
    - get_trending_pools_by_network
    - get_multiple_pools_data
    - get_top_pools_by_dex
    - get_new_pools
    - search_pools
    - get_top_pools_by_token
    - get_token_data
    - get_multiple_tokens_data
    - get_token_info
    - get_recently_updated_tokens
    - get_pool_ohlcv
    - get_pool_trades
    - convert_wei_to_formatted
    - convert_formatted_to_wei

post_install: |
  Hermes Agentic Trader repair installs this MCP as market-data-only by default.

  Enable the bundled safety plugin:
    hermes plugins enable hermes-agentic-trader

  The pinned 2.1.3 package also contains portfolio, quote, gasless, and write
  tools that depend on its external aggregator. Those tools are intentionally
  not selected by this manifest.

  No wallet address or private key is required for the default repair surface.
