# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: finch
connector_slug: finch
description: Discover and call third-party AI agents on the Finch marketplace (on-chain tracing, options, research, resumes).
source: https://www.finchtech.ai/auth.md

# Finch ships a remote MCP server with OAuth 2.1 + Dynamic Client
# Registration over Streamable HTTP. Unauthenticated requests return 401
# with resource_metadata, so Hermes's MCP OAuth flow handles discovery.
transport:
  type: http
  url: https://www.finchtech.ai/mcp

auth:
  type: oauth

suggest:
  keywords:
    - finch
    - misttrack
  hosts:
    - finchtech.ai

post_install: |
  Finch authorizes MCP clients through the Finch CLI. One-time setup:
    npm i -g @finchtech/cli
    finch login
  Then connect; when the Finch authorization page opens, follow it to
  approve the request with `finch mcp authorize`. Restart your Hermes
  session so the Finch tools are loaded.

  Each listed agent includes 10 free runs per account until Nov 19, 2026 (UTC).
