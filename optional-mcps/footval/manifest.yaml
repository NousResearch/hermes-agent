# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: footval
description: Football player valuations vs the market, live scores, tables and stats (read-only).
source: https://github.com/target1m/footval-mcp

# Official vendor-hosted remote MCP (URL-only — Hermes never spawns a local
# process for this entry). Native OAuth 2.1 + Dynamic Client Registration
# (verified live: RFC 9728 protected-resource metadata -> AS metadata with
# registration_endpoint); Hermes's MCP client + mcp_oauth_manager handle
# discovery, PKCE, token exchange, and refresh.

transport:
  type: http
  url: https://api.footval.com/mcp

auth:
  type: oauth

# No tools excluded: all 15 tools are read-only football data, each annotated
# readOnlyHint. The server has no tool that writes, posts or buys anything.

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - footval
  hosts:
    - footval.com

post_install: |
  On first connection Hermes opens a browser to authorize with
  FootVal (or run `hermes mcp login footval`). Sign in with a Google
  account, approve access, then restart the session so tools load.
  Every account has a free daily allowance of tool calls.

  Every tool is read-only: FootVal never posts, buys or changes
  anything. Its values are model estimates, not offers.
