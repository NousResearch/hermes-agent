# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: goalcraft
description: Show long goals as funnels on a live dashboard and report agent progress.
source: https://github.com/oponfil/goalcraft/blob/main/docs/MCP.md

# Official vendor-hosted remote MCP (URL-only — Hermes never spawns a local
# process for this entry). Native OAuth 2.1 + Dynamic Client Registration
# (verified live: RFC 9728 protected-resource metadata -> AS metadata with
# registration_endpoint); Hermes's MCP client + mcp_oauth_manager handle
# discovery, PKCE, token exchange, and refresh.

transport:
  type: http
  url: https://goalcraft.ai/mcp

auth:
  type: oauth

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - goalcraft
  hosts:
    - goalcraft.ai

post_install: |
  On first connection Hermes opens a browser to sign in to
  Goalcraft (or run `hermes mcp login goalcraft`). Approve access,
  then restart the session so tools load. Your funnels appear at
  https://goalcraft.ai/app/.
