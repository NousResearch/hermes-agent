# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: hugging_face
description: >-
  Models, datasets, Spaces, and papers from the Hugging Face Hub.
source: https://huggingface.co/docs/hub/agents-mcp

# Official vendor-hosted remote MCP (URL-only — Rabbit never spawns a local
# process for this entry). Native OAuth 2.1 + Dynamic Client Registration;
# Rabbit's MCP client + mcp_oauth_manager handle discovery, PKCE, token
# exchange, and refresh.
# Underscored name so UIs render "Hugging Face", not "Huggingface".
transport:
  type: http
  url: https://huggingface.co/mcp

auth:
  type: oauth

# Composer-suggestion triggers (desktop brand pills).
suggest:
  keywords:
    - hugging face
    - huggingface
  hosts:
    - huggingface.co
    - hf.co

post_install: |
  On first connection Rabbit opens a browser to authorize with
  Hugging Face (or run `rabbit mcp login hugging_face`). Approve access,
  then restart the session so tools load.
