manifest_version: 1
name: postonce
description: Discover connected social accounts and save social content as PostOnce drafts for review.
source: https://postonce.to/integrations/hermes

# Official vendor-hosted remote MCP (URL-only: Hermes never spawns a local
# process for this entry). Native OAuth 2.1 + Dynamic Client Registration
# with loopback redirects; Hermes's MCP client + mcp_oauth_manager handle
# discovery, PKCE, token exchange, and refresh.
transport:
  type: http
  url: https://postonce.to/mcp

auth:
  type: oauth

tools:
  default_enabled:
    - list_accounts
    - create_draft
    - get_draft

suggest:
  keywords:
    - postonce
  hosts:
    - postonce.to

post_install: |
  Requires a PostOnce Creator or Pro account. On first connection Hermes
  opens a browser to authorize with PostOnce (or run
  `hermes mcp login postonce`). Sign in to PostOnce and select Allow access,
  then restart the session so tools load.

  Before starting a new session or reloading: installing over an existing
  postonce entry can replace trust fields while preserving its previous
  tool selection. Review and restore your previous trust restrictions and
  tool selection first. The three draft-workflow defaults apply only to a
  fresh entry; an existing selection may include publishing tools.

  Ask Hermes to list your connected PostOnce accounts, then save your
  supplied content as a draft without destinations. Use a stable
  idempotency_key on create_draft, and get_draft with the returned id to
  confirm inbox status and content. Reuse the same key and payload after an
  uncertain creation response. The fresh-entry starter selection does not
  publish or schedule social posts.

  Review the tool checklist and retain only the operations you need.
  Additional operations need your explicit direction. Keep any existing
  trust restrictions in place.
  Setup and optional shared skill: https://postonce.to/integrations/hermes

  To disconnect, remove the postonce MCP entry from this profile and revoke
  Hermes in PostOnce Preferences > AI agents > Connected apps. Removing the
  MCP configuration alone does not revoke access. Delete the stored token
  file ~/.hermes/mcp-tokens/postonce.json (or the active profile's
  mcp-tokens/postonce.json) afterward.
