# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: rentahuman
description: Find people and manage real-world work through RentAHuman.
source: https://rentahuman.ai/docs#mcp

transport:
  type: http
  url: https://rentahuman.ai/api/mcp

auth:
  type: oauth

tools:
  # Start with public read-only discovery. Account access and state-changing
  # tools stay disabled until the user explicitly selects them in mcp configure.
  default_enabled:
    - search_humans
    - browse_taste_humans
    - list_bounties
    - search_bounties

suggest:
  keywords:
    - rentahuman
    - hire a human
    - real-world task
  hosts:
    - rentahuman.ai

post_install: |
  On first connection, Hermes opens a browser to sign in to RentAHuman and
  approve access to your account. By default, this catalog entry enables only
  public, read-only discovery tools. Account data and tools that post or fund
  bounties, message people, accept applicants, book services, or manage payments
  remain disabled until you explicitly select them with:
    hermes mcp configure rentahuman

  Review each selected tool before enabling it. Use state-changing and payment
  actions only when the account owner has asked for them, and review the action
  and amount before proceeding.
