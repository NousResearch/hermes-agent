# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 2

name: tripo
description: Generate, texture, rig, animate, and convert 3D models with Tripo.
source: https://developers.tripo3d.ai

# Tripo-hosted remote MCP (Streamable HTTP) with native OAuth 2.1 + Dynamic
# Client Registration + PKCE. Nothing to install locally; no API key.
transport:
  type: http
  url: https://openapi-mcp.tripo3d.ai/mcp

auth:
  type: oauth

# With normal approvals enabled, calls without readOnlyHint: true ask first.
# YOLO / approvals-off can bypass this. `trust` needs manifest_version 2.
trust: untrusted

suggest:
  keywords:
    - tripo
    - tripo3d
  hosts:
    - tripo3d.ai

post_install: |
  Requires Hermes with manifest_version 2 and trust: untrusted support.
  If Hermes reports an unsupported version, update Hermes; do not downgrade
  the manifest and do not remove the trust setting to bypass the check.

  Sign in through Hermes' OAuth prompt (or run `hermes mcp login tripo`).
  Approve access in the browser. If tools are not discovered immediately,
  reconnect or start a new session.

  Generation and processing tools spend credits from your Tripo account.
  With normal approvals enabled, trust: untrusted asks before calls without
  readOnlyHint: true; read-only plan, balance, usage and task status do not
  need this approval. YOLO / approvals-off modes can bypass that prompt.
  This is per-call approval, not a hard Tripo credit budget. Static host
  cost declarations are not the Tripo billing ledger.
  Show each billed step, the final model and a sourced estimate or
  "cost not estimated"; wait for confirmation.
  Changed model, parameters or quantity require fresh confirmation.
  tripo_plan is guidance, not a server-enforced authorization ticket.
  Finish with tripo_usage for all task IDs to report actual credits.

  You can review or turn off tools any time with:
    hermes mcp configure tripo
