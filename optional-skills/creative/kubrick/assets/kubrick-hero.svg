  <g opacity="0.85"><circle cx="541" cy="230" r="7" fill="#cbfbff" filter="url(#glow)"/><circle cx="776" cy="465" r="6" fill="#ffd1a1" filter="url(#glow)"/><circle cx="430" cy="582" r="8" fill="#29dfff" opacity="0.5" filter="url(#glow)"/></g>
