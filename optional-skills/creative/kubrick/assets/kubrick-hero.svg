<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 784" role="img" aria-labelledby="title desc">
  <title id="title">Kubrick</title>
  <desc id="desc">Abstract cinematic hero artwork with fractured glass, cyan and amber light beams, and a bold Kubrick wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#02070b"/><stop offset="0.55" stop-color="#05080b"/><stop offset="1" stop-color="#120906"/></linearGradient>
    <linearGradient id="cyanBeam" x1="0" y1="0.5" x2="1" y2="0.5"><stop offset="0" stop-color="#08d9ff" stop-opacity="0"/><stop offset="0.35" stop-color="#36e4ff" stop-opacity="0.95"/><stop offset="1" stop-color="#b9fbff" stop-opacity="0"/></linearGradient>
    <linearGradient id="amberBeam" x1="0" y1="0.5" x2="1" y2="0.5"><stop offset="0" stop-color="#fff2bd" stop-opacity="0"/><stop offset="0.4" stop-color="#ff9a18" stop-opacity="0.98"/><stop offset="1" stop-color="#ff4d00" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="film" width="76" height="76" patternUnits="userSpaceOnUse"><rect x="8" y="11" width="38" height="28" rx="5" fill="none" stroke="#732316" stroke-opacity="0.28"/></pattern>
  </defs>
  <rect width="1168" height="784" fill="url(#bg)"/><rect x="0" width="52" height="784" fill="url(#film)" opacity="0.45"/><rect x="1116" width="52" height="784" fill="url(#film)" opacity="0.55"/>
  <g opacity="0.9"><polygon points="0,350 610,405 0,440" fill="url(#cyanBeam)" filter="url(#glow)"/><polygon points="1168,280 680,410 1168,470" fill="url(#amberBeam)" filter="url(#glow)"/><polygon points="350,0 516,420 463,0" fill="url(#cyanBeam)" opacity="0.55"/><polygon points="932,0 720,470 1010,0" fill="url(#amberBeam)" opacity="0.32"/></g>
