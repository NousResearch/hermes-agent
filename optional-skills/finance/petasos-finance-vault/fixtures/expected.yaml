# Fixture expectations — every fixture must parse to these values (subset match:
# every key listed must equal the parsed value; extra parsed fields are fine).
# After fixing a bank's email shape, capture the new email as a fixture here and
# update its expect block from --probe output, cross-checked against the ledger.
# ALL bundled fixtures are SYNTHETIC samples shaped like real bank emails
# (owner decision 14/10: the public repo carries no personal data or samples).
# Capture YOUR real emails vault-side (_Ledger/fixtures/) — they shadow these.

acb__balance-alert__voucher.txt:
  expect:
    kind: ACB
    acct: "12345678"
    bal_after: 15000000
    date: "01/12/2026"
    amount: 200000
    dir: OUT
    content: "VOUCHER EXCHANGE-011226-15:12:53 0113813889"

acb__balance-alert__atm.txt:
  expect:
    kind: ACB
    acct: "12345678"
    bal_after: 9000000
    date: "01/12/2026"
    amount: 5000000
    dir: OUT

