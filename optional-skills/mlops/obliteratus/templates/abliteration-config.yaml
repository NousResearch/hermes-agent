# OBLITERATUS ablation-study YAML (obliteratus run <this-file>)
# For one-off refusal removal, prefer: obliteratus obliterate <path> --method advanced

model:
  name: /abs/path/to/ckpt
  task: causal_lm
  dtype: bfloat16
  device: cuda

dataset:
  name: wikitext
  subset: wikitext-2-raw-v1
  split: test
  text_column: text
  max_samples: 100

strategies:
  - name: layer_removal
  - name: head_pruning
  - name: ffn_ablation
  - name: embedding_ablation
    params:
      chunk_size: 48

metrics:
  - perplexity

batch_size: 4
max_length: 256
output_dir: results/my_run
