# OSV-Scanner configuration for the lockfiles at the repository root (uv.lock).
#
# hermes-agent advisories: main carries version 0.0.0 on purpose (upstream
# 9cc319f9, "main carries 0.0.0 and dev distance counts from release tags"), so
# OSV compares the editable root package against every advisory published for
# hermes-agent on PyPI. On 2026-10-02 the same lockfile at version 0.21.5 scanned
# clean against these advisories (PR #106), and main has since only moved forward
# from that code. Each advisory is listed by ID, not by package, so a new
# hermes-agent advisory still shows up. ignoreUntil forces a re-check.

[[IgnoredVulns]]
id = "PYSEC-2026-2509"
ignoreUntil = 2027-01-14
reason = "Fixed upstream in hermes-agent 0.15.0; this fork's code is past 0.21.5. Matched only because main carries the 0.0.0 placeholder version."

