name: deepseek-web-tools
repo: https://github.com/fedebyes/hermes-deepseek-web-tools
sha: 2402ccd6ad21a1eaee0ba69371245e3088711334
description: "DeepSeek's server-side web tools as one Hermes tool: the model searches, opens pages and checks facts inside a single call, then answers with structured citations. thinking is opt-in (the server default is on and bills up to ~20 searches), and page text is never returned - use web_extract when you need the content. Disclosure — each web_research call sends the query, any URLs and image URL the model passes to api.deepseek.com with your DEEPSEEK_API_KEY; DeepSeek's servers search and open those pages and bill each search to your account (up to ~20 per call when thinking is on); no other network host, no shell commands, no files written."
maintainer: Fedebyes
tier: community
category: web
requires_hermes: ">=0.22.5"
version: "1.0.3"
title: "DeepSeek Web Tools"
readme: true
capabilities:
  provides_tools: [web_research]
  provides_hooks: []
  provides_middleware: []
  requires_env: [DEEPSEEK_API_KEY]
