  # ---- 显示 ----
  display:
    #: 紧凑横幅｜开启时以单行紧凑横幅代替完整 ASCII 横幅与工具/技能摘要。默认关闭。｜范围:true/false｜生效:下一会话
    compact: false
    #: 当前人格｜当前选中的人格名称（如 helpful、concise、technical 或自定义人格），可通过 /personality 切换；留空为默认。｜范围:字符串｜生效:下一会话
    personality: ''
    #: 恢复会话显示方式｜恢复会话时如何显示历史：minimal-简要回顾，full-完整回顾最近对话，off-不显示。默认 full。｜范围:minimal|full|off｜生效:下一会话
    resume_display: full
    #: 回顾对话轮数｜恢复会话回顾中最多显示的用户+助手对话对数。默认 10。｜范围:整数｜生效:下一会话
    resume_exchanges: 10
    #: 回顾用户消息长度｜回顾中用户消息截断的最大字符数。默认 300。｜范围:整数｜生效:下一会话
    resume_max_user_chars: 300
    #: 回顾助手消息长度｜回顾中非最后一条助手消息截断的最大字符数。默认 200。｜范围:整数｜生效:下一会话
    resume_max_assistant_chars: 200
    #: 回顾助手消息行数｜回顾中非最后一条助手消息截断的最大行数。默认 3。｜范围:整数｜生效:下一会话
    resume_max_assistant_lines: 3
    #: 回顾跳过纯工具调用｜回顾中跳过只有工具调用的助手条目，避免被“[N 个工具调用]”刷屏。默认开启。｜范围:true/false｜生效:下一会话
    resume_skip_tool_only: true
    #: 运行中输入行为｜智能体运行时用户输入的处理方式：interrupt-打断当前运行，queue-排队等待本轮结束，steer-引导注入当前运行。默认 interrupt。｜范围:interrupt|queue|steer｜生效:下一会话
    busy_input_mode: interrupt
    #: 引导确认气泡｜steer 模式下是否显示“已引导到当前运行”的确认气泡（关闭不影响引导本身）。默认开启。｜范围:true/false｜生效:下一会话
    busy_steer_ack_enabled: true
    #: CLI 多行快捷键｜经典 CLI 中启用 Ctrl+J 换行、行尾反斜杠续行、Shift+Enter 等多行输入快捷键。默认开启。｜范围:true/false｜生效:下一会话
    cli_multiline_shortcuts: true
    #: 默认界面｜启动 chat 时使用的界面：cli-prompt_toolkit 命令行，tui-Ink 终端界面；--cli/--tui 参数优先。默认 cli。｜范围:cli|tui｜生效:下一会话
    interface: cli
    #: CLI 布局风格｜命令行界面外观：modern-现代（符号行，状态栏在输入框下），classic-经典（带边框面板）。默认 modern。｜范围:modern|classic｜生效:下一会话
    cli_layout: modern
    #: TUI 原生滚动｜TUI 使用终端主缓冲区与原生滚动历史，而非自定义备用屏幕视口。默认关闭。｜范围:true/false｜生效:下一会话
    tui_native: false
    #: TUI 自动恢复会话｜启动 TUI 时自动恢复最近一次面向用户的会话（类似 -c）。默认关闭。｜范围:true/false｜生效:下一会话
    tui_auto_resume_recent: false
    #: 桌面端恢复上次会话｜桌面端冷启动时重新打开上次的对话/页面。默认开启。｜范围:true/false｜生效:下一会话
    resume_last_session: true
    #: 子智能体提示｜首次委派子智能体时在 TUI 中显示一次“/agents 可实时查看”的提示。默认开启。｜范围:true/false｜生效:下一会话
    tui_agents_nudge: true
    #: 完成时响铃｜智能体完成回复时发出终端响铃。默认关闭。｜范围:true/false｜生效:下一会话
    bell_on_complete: false
    #: 提问时响铃｜出现需要用户处理的阻塞提示（澄清/审批/sudo）时响铃。默认关闭。｜范围:true/false｜生效:下一会话
    bell_on_prompt: false
    #: 显示推理过程｜在回复前实时流式显示模型的推理/思考内容；关闭则思考期间只显示加载动画。默认开启。｜范围:true/false｜生效:下一会话
    show_reasoning: true
    #: 完整推理回顾｜回复后的推理回顾默认折叠为 10 行；开启则完整显示。默认关闭。｜范围:true/false｜生效:下一会话
    reasoning_full: false
    #: 记忆更新通知｜后台自我改进（记忆更新）在聊天中的通知方式：off-不通知（复盘仍运行），on-简短提示“记忆已更新”，verbose-附带内容预览。默认 on。｜范围:off|on|verbose｜生效:下一会话
    memory_notifications: 'on'
    #: 后台进程通知｜后台终端进程结束时网关的通知方式：concise-一行摘要（失败附输出尾部），all-运行更新与最终原始输出，result-仅最终输出，error-仅非零退出时输出，off-不通知。默认 concise。｜范围:concise|all|result|error|off｜生效:下一会话
    background_process_notifications: concise
    #: 流式输出｜在终端中逐 token 流式显示回复，而非等待完整回复后再渲染。｜范围:true/false｜生效:下一会话
    streaming: false
    #: 显示时间戳｜在消息上显示时间戳（CLI 标签、TUI 行、桌面端对话记录）。默认关闭。｜范围:true/false｜生效:下一会话
    timestamps: false
    #: 时间戳格式｜时间戳的 strftime 格式，如 "%H:%M" 或 "%b-%d %H:%M"。默认 %H:%M。｜范围:字符串｜生效:下一会话
    timestamp_format: '%H:%M'
    #: 最终回复 Markdown｜最终回复中 Markdown 的处理方式：render-渲染显示，strip-去除标记，raw-原样输出。默认 strip。｜范围:render|strip|raw｜生效:下一会话
    final_response_markdown: strip
    #: 保留输出历史｜经典 CLI 在 Ctrl+L、/redraw 与窗口调整清屏后保留最近输出。默认开启。｜范围:true/false｜生效:下一会话
    persistent_output: true
    #: 保留输出行数｜清屏后重放的最近输出最大行数。默认 200。｜范围:整数｜生效:下一会话
    persistent_output_max_lines: 200
    #: 重绘时清空滚动区｜经典 CLI 完整重绘/调整大小时同时清空终端滚动历史，用于终端或 tmux 残留旧提示的情况。默认关闭。｜范围:true/false｜生效:下一会话
    cli_rebuild_scrollback_on_redraw: false
    #: 保留已处理提示｜已处理的审批/澄清提示在滚动历史中保留一行摘要。默认开启。｜范围:true/false｜生效:下一会话
    persist_prompts: true
    #: 内联 diff 预览｜对 write_file/patch/skill_manage 显示内联差异预览。默认开启。｜范围:true/false｜生效:下一会话
    inline_diffs: true
    #: 内联图片显示｜CLI/TUI 对话中图片的显示方式：auto-自动检测，kitty-Kitty 图形协议，iterm-iTerm2 协议，unicode-字符块近似，off-不显示。默认 auto。｜范围:auto|kitty|iterm|unicode|off｜生效:下一会话
    inline_images: auto
    #: 文件写入核验｜本轮有文件写入/补丁失败且之后未成功覆盖时，在最终回复后附一行提醒，防止模型误报成功。默认开启。｜范围:true/false｜生效:下一会话
    file_mutation_verifier: true
    #: 额度提醒｜在状态栏显示 Nous 额度相关提醒（用量区间、赠额用尽、余额耗尽/恢复）；关闭不影响 /usage。默认开启。｜范围:true/false｜生效:下一会话
    credits_notices: true
    #: 无回复原因说明｜一轮结束却没有可用回复时（重试后为空、流截断、达到上限等）附一行原因说明，而非仅显示“(empty)”。默认开启。｜范围:true/false｜生效:下一会话
    turn_completion_explainer: true
    #: 显示费用｜在状态栏显示美元费用。默认关闭。｜范围:true/false｜生效:下一会话
    show_cost: false
    #: 显示电量｜在状态栏最前显示电池电量（无电池时无效果）。默认关闭。｜范围:true/false｜生效:下一会话
    battery: false
    #: 专注视图｜专注视图（/focus）：仅影响显示，隐藏工具进度并统计隐藏行数，不影响模型所见内容。默认关闭。｜范围:true/false｜生效:下一会话
    focus_view: false
    #: 专注前工具进度｜退出专注视图时恢复的工具进度显示级别（如 off/new/all/verbose）。默认 all。｜范围:字符串｜生效:下一会话
    focus_saved_tool_progress: all
    #: 界面主题｜CLI 视觉主题：default-默认，ares-Ares 风格，mono-单色，slate-石板灰；也可用 ~/.hermes/skins/ 中的自定义主题。｜范围:default|ares|mono|slate｜生效:下一会话
    skin: default
    #: 界面语言｜静态界面文本（审批提示、部分网关命令回复）的语言：en、zh、ja、de、es、fr、tr、uk，未知值按 en 处理；不影响智能体回复。｜范围:字符串｜生效:下一会话
    language: en
    #: TUI 忙碌指示器｜TUI 忙碌时的指示样式：kaomoji-颜文字，emoji-表情，unicode-盲文点阵动画，ascii-纯 ASCII。可用 /indicator 切换。默认 kaomoji。｜范围:kaomoji|emoji|unicode|ascii｜生效:下一会话
    tui_status_indicator: kaomoji
    #: CLI 刷新间隔｜经典 CLI 空闲时重绘的间隔秒数，保持状态栏时钟等实时更新；0 表示关闭。默认 1.0。｜范围:小数｜生效:下一会话
    cli_refresh_interval: 1.0
    #: Vim 键位｜在 CLI 输入框中启用 Vi/Vim 键位绑定（默认使用 emacs 风格）。默认关闭。｜范围:true/false｜生效:下一会话
    vim_mode: false
    user_message_preview:
      #: 消息预览首行数｜CLI 中回显已提交用户消息时显示的开头行数。默认 2。｜范围:整数｜生效:下一会话
      first_lines: 2
      #: 消息预览末行数｜CLI 中回显已提交用户消息时显示的结尾行数。默认 2。｜范围:整数｜生效:下一会话
      last_lines: 2
    #: 中间过程消息｜网关：发送轮次中途的自然状态消息；桌面端：保留工具调用间的叙述而不折叠为最终消息。默认开启。｜范围:true/false｜生效:下一会话
    interim_assistant_messages: true
    #: 屏蔽警告通知｜开启后隐藏引擎警告/失败通知（不影响任务结果、手动命令与日志）。默认关闭。｜范围:true/false｜生效:下一会话
    suppress_warning_notifications: false
    #: 显示评述通道｜Codex Responses 的评述内容：开启-作为中途更新推送，关闭-归入推理内容（仅在显示推理时可见）。默认开启。｜范围:true/false｜生效:下一会话
    show_commentary: true
    #: 网关 /verbose 命令｜在消息网关中启用 /verbose 命令以调整工具进度显示。默认关闭。｜范围:true/false｜生效:下一会话
    tool_progress_command: false
    #: 工具预览长度｜工具调用预览的最大字符数；0 表示不限制。｜范围:整数｜生效:下一会话
    tool_preview_length: 0
    #: 友好工具标签｜内置工具使用人性化状态标签（如“正在读取 <文件>”）；自定义/插件/MCP 工具仍显示原始预览。默认开启。｜范围:true/false｜生效:下一会话
    friendly_tool_labels: true
    #: 回合摘要行｜CLI 每轮结束显示一行摘要（耗时、编辑文件数、读取文件数、执行命令数）。默认开启。｜范围:true/false｜生效:下一会话
    turn_summary: true
    #: 动画显示 token 数｜CLI 加载动画上显示本轮累计输出 token 数。默认开启。｜范围:true/false｜生效:下一会话
    spinner_token_flow: true
    #: 工具进度分组｜支持编辑消息的网关中工具进度的展示：accumulate-合并到一个气泡持续编辑，separate-每个工具单独一条消息。默认 accumulate。｜范围:accumulate|separate｜生效:下一会话
    tool_progress_grouping: accumulate
    #: 自定义状态短语｜长时间运行时显示的状态短语来源：path/paths 指向 YAML 文件或目录，mode 取 append-追加（默认） replace-替换。默认空（使用内置短语）。｜范围:append|replace｜生效:下一会话
    status_phrases: {}
    #: 推理摘要样式｜推理摘要的渲染样式：code-代码块，blockquote-引用块（> ），subtext-Discord 小号灰字（-# ）。默认 code。｜范围:code|blockquote|subtext｜生效:下一会话
    reasoning_style: code
    #: 系统通知自动删除｜在支持删除的平台（Telegram）上，N 秒后自动删除临时系统通知（如“新会话已开始”）；0 表示关闭。｜范围:整数｜生效:下一会话
    ephemeral_system_ttl: 0
    platforms:
      telegram:
        #: Telegram 流式输出｜Telegram 上是否流式输出回复（原生草稿流式，较流畅）；仍受 streaming.enabled 总开关控制。默认开启。｜范围:true/false｜生效:下一会话
        streaming: true
      discord:
        #: Discord 流式输出｜Discord 上是否流式输出回复（基于编辑消息，可能闪烁）；仍受总开关控制。默认关闭。｜范围:true/false｜生效:下一会话
        streaming: false
      slack:
        #: Slack 流式输出｜Slack 上是否流式输出回复（基于编辑消息，可能闪烁）；仍受总开关控制。默认关闭。｜范围:true/false｜生效:下一会话
        streaming: false
      wecom:
        #: 企业微信流式输出｜企业微信（WeCom）上是否使用原生流式消息输出回复；仍受总开关控制。默认开启。｜范围:true/false｜生效:下一会话
        streaming: true
    runtime_footer:
      #: 运行信息页脚｜在网关最终消息末尾附加运行信息页脚（如 模型 · 上下文占比 · 工作目录）。默认关闭。｜范围:true/false｜生效:下一会话
      enabled: false
      #: 页脚字段｜页脚显示的字段及顺序，默认 [model, context_pct, cwd]；可选附加 latency、served_model。｜范围:列表｜生效:下一会话
      fields: [model, context_pct, cwd]
    status_bar:
      #: 状态栏字段｜CLI/TUI 状态栏显示的字段（如 model、context_pct、cache_hit、latency、git_branch、duration 等）；非空时仅显示所列字段，空则用默认集合。｜范围:列表｜生效:下一会话
      fields: []
    pet:
      #: 启用桌宠｜启用 Petdex 动画吉祥物（纯装饰，跨 CLI/TUI/桌面端，不影响提示缓存）。默认关闭。｜范围:true/false｜生效:下一会话
      enabled: false
      #: 桌宠标识｜当前桌宠的 slug（位于 pets/ 目录）；留空则使用第一个已安装的。｜范围:字符串｜生效:下一会话
      slug: ''
      #: 桌宠渲染方式｜auto-自动检测（kitty/iTerm2/sixel，否则字符块），kitty/iterm/sixel-对应终端图形协议，unicode-半块字符，off-不显示。默认 auto。｜范围:auto|unicode|off｜生效:下一会话
      render_mode: auto
      #: 桌宠缩放｜相对原始 192×208 帧的缩放比例。默认 0.33。｜范围:小数｜生效:下一会话
      scale: 0.33
      #: 桌宠字符列宽｜终端中桌宠占用列宽的强制值；0 表示按缩放比例推算。｜范围:整数｜生效:下一会话
      unicode_cols: 0

  # ---- Web 应用 ----
  webapp:
    #: 启用 Web 应用｜启用网关内置的 Web 应用监听服务。默认关闭。｜范围:true/false｜生效:重启
    enabled: false
    #: Web 应用监听地址｜Web 应用绑定的主机地址，默认 127.0.0.1（仅本机访问）。｜范围:字符串｜生效:重启
    host: 127.0.0.1
    #: Web 应用端口｜Web 应用监听端口，默认 9120。｜范围:整数｜生效:重启
    port: 9120
    #: Web 应用公开地址｜Web 应用对外访问的公开 URL（经反向代理时填写）；留空则自动推断。｜范围:字符串｜生效:重启
    public_url: ''

  # ---- 仪表盘 ----
  dashboard:
    #: 仪表盘主题｜Web 仪表盘视觉主题：default-默认，midnight-午夜深色，ember-余烬暖色，mono-单色，cyberpunk-赛博朋克，rose-玫瑰色。｜范围:default|midnight|ember|mono|cyberpunk|rose｜生效:重启
    theme: default
    #: 回合进程隔离｜仪表盘回合进程隔离的灰度开关。默认关闭。｜范围:true/false｜生效:重启
    turn_isolation: false
    #: 计算宿主心跳间隔｜进程隔离模式下计算宿主进程的心跳间隔（秒）。默认 15。｜范围:整数｜生效:重启
    compute_host_heartbeat_secs: 15
    #: 计算宿主重启上限｜计算宿主进程崩溃后最多自动重启的次数。默认 3。｜范围:整数｜生效:重启
    compute_host_respawn_max: 3
    #: 显示 token 统计｜显示 token/费用分析页面；数据为本地下限估算（不含辅助调用、重试等），可能远低于实际账单。默认关闭。｜范围:true/false｜生效:重启
    show_token_analytics: false
    #: 受信反向代理｜可信任其 X-Forwarded-Proto/-For 头的反向代理 IP 或 CIDR 列表；回环地址始终可信，拒绝通配与 /0。｜范围:列表｜生效:重启
    trusted_proxies: []
    #: WebSocket 心跳间隔｜非回环绑定时 WebSocket 保活 ping 的间隔秒数。默认 20。｜范围:小数｜生效:重启
    ws_ping_interval: 20.0
    #: WebSocket 心跳超时｜非回环绑定时 WebSocket ping 无响应的超时秒数。默认 20。｜范围:小数｜生效:重启
    ws_ping_timeout: 20.0
    #: 断连会话回收宽限｜客户端断开后，孤立会话被中断/回收前的宽限秒数；0 表示永久保留。默认 20。｜范围:小数｜生效:重启
    ws_orphan_reap_grace_s: 20.0
    #: 断连运行判停时长｜断连后仍在运行的回合，仅在活动时钟空闲超过该秒数后才中断；0 表示宽限期到即中断。默认 600。｜范围:小数｜生效:重启
    ws_orphan_activity_stale_s: 600.0
    #: 启动清理孤儿会话｜网关启动时关闭由已退出网关遗留的 tui/桌面/子智能体会话记录（仍可恢复），避免显示为永久“活跃”。默认开启。｜范围:true/false｜生效:重启
    startup_orphan_sweep: true
    oauth:
      #: OAuth 客户端 ID｜仪表盘 OAuth 登录门禁使用的客户端 ID（由 Portal 分配）；留空表示不启用 OAuth 提供方。环境变量优先。｜范围:字符串｜生效:重启
      client_id: ''
      #: OAuth Portal 地址｜OAuth 门禁使用的 Portal 地址；留空表示生产环境默认地址。｜范围:字符串｜生效:重启
      portal_url: ''
    basic_auth:
      #: 基础认证用户名｜仪表盘用户名/密码登录的用户名；留空则不启用基础认证。｜范围:字符串｜生效:重启
      username: ''
      #: 基础认证密码哈希｜密码的 scrypt 哈希值（推荐，优先于明文密码）。｜范围:字符串｜生效:重启
      password_hash: ''
      #: 基础认证密码｜明文密码（在内存中哈希）；建议改用 password_hash。｜范围:字符串｜生效:重启
      password: ''
      #: 会话签名密钥｜用于签名会话令牌的密钥，建议 32 字节以上随机值；留空则每进程随机生成（重启后会话失效）。｜范围:字符串｜生效:重启
      secret: ''
      #: 登录会话有效期｜基础认证登录会话的有效秒数；0 表示使用插件默认值（12 小时）。｜范围:整数｜生效:重启
      session_ttl_seconds: 0
    session_token_auth:
      #: 会话令牌认证｜允许预置的仪表盘会话令牌（HERMES_DASHBOARD_SESSION_TOKEN，字面值或 file:<路径>）访问受保护仪表盘；关闭则不使用。默认开启。｜范围:true/false｜生效:重启
      enabled: true
    drain_auth:
      #: 排空认证范围｜排空控制令牌认证的授权范围（scope）。默认 drain。｜范围:字符串｜生效:重启
      scope: drain
      #: 排空密钥最短长度｜排空控制密钥（环境变量 HERMES_DASHBOARD_DRAIN_SECRET）的最少字符数，弱密钥会被拒绝。默认 43（约 256 位）。｜范围:整数｜生效:重启
      min_secret_chars: 43
    #: 仪表盘公网地址｜仪表盘对外完整地址（协议+主机+可选前缀，如 https://example.com/pdr），用于 OAuth 回调与 Host/Origin 校验；留空则根据请求头推断。｜范围:字符串｜生效:重启
    public_url: ''

  # ---- 隐私 ----
  privacy:
    #: 隐私信息脱敏｜开启后对发送给大模型的上下文中的用户 ID 做哈希处理并去除电话号码。默认关闭。｜范围:true/false｜生效:下一会话
    redact_pii: false

  # ---- 语音合成 ----
  tts:
    #: 语音合成服务｜文字转语音提供商：edge-微软 Edge 免费语音（默认） elevenlabs-高品质付费语音 openai-OpenAI TTS xai-xAI 语音 minimax-MiniMax mistral-Mistral Voxtral gemini-Google Gemini TTS neutts-本地 NeuTTS kittentts-本地 KittenTTS piper-本地 Piper。｜范围:edge|elevenlabs|openai|xai|minimax|mistral|gemini|neutts|kittentts|piper｜生效:下一会话
    provider: edge
    #: 本地引擎保温时长｜本地 TTS 引擎（Piper、KittenTTS）在最后一次关闭语音后继续保持加载的秒数，以便快速重新启用。0 表示立即卸载。默认 60。｜范围:整数｜生效:下一会话
    keep_warm_seconds: 60
    streaming:
      #: 流式首句最短长度｜流式 TTS 单独朗读的首句最短字符数，更短的开头会与下一句合并。英文建议 20，中文等 CJK 语音建议约 6。默认 20。｜范围:整数｜生效:下一会话
      min_len: 20
    edge:
      #: Edge 发音人｜Edge TTS 使用的音色，默认 en-US-AriaNeural；中文可用 zh-CN-XiaoxiaoNeural 等。｜范围:en|zh｜生效:下一会话
      voice: en-US-AriaNeural
    elevenlabs:
      #: ElevenLabs 音色 ID｜ElevenLabs 语音的 voice_id，默认 pNInz6obpgDQGcFmaJgB（Adam）。｜范围:字符串｜生效:下一会话
      voice_id: pNInz6obpgDQGcFmaJgB
      #: ElevenLabs 模型｜ElevenLabs 语音合成模型，默认 eleven_multilingual_v2。｜范围:字符串｜生效:下一会话
      model_id: eleven_multilingual_v2
    openai:
      #: OpenAI TTS 模型｜OpenAI 语音合成模型，默认 gpt-4o-mini-tts。｜范围:字符串｜生效:下一会话
      model: gpt-4o-mini-tts
      #: OpenAI 音色｜OpenAI TTS 音色，默认 alloy；可选 ash、ballad、cedar、coral、echo、fable、marin、nova、onyx、sage、shimmer、verse。｜范围:字符串｜生效:下一会话
      voice: alloy
      #: 声音克隆授权声明｜原样放入请求体的授权声明字段，供要求克隆音色授权的 OpenAI 兼容服务使用（否则返回 consent_required）；留空不发送。｜范围:字符串｜生效:下一会话
      consent_attestation: ''
      #: PCM 采样率｜流式播放的原始 PCM 采样率，OpenAI 输出 24000 Hz；兼容服务若通过响应头报告采样率会自动覆盖。默认 24000。｜范围:整数｜生效:下一会话
      pcm_sample_rate: 24000
    gemini:
      #: Gemini TTS 模型｜Gemini 语音合成模型，默认 gemini-2.5-flash-preview-tts。｜范围:字符串｜生效:下一会话
      model: gemini-2.5-flash-preview-tts
      #: Gemini 音色｜Gemini TTS 音色，默认 Kore。｜范围:字符串｜生效:下一会话
      voice: Kore
      #: Gemini 音频标签｜Gemini 3.1：开启后由辅助模型改写 TTS 脚本并插入 [音频标签] 以增强表现力。默认关闭。｜范围:true/false｜生效:下一会话
      audio_tags: false
      #: 表演指导文件｜可选的本地文本文件，提供语音表演指导；可包含 {transcript} 占位符，否则会将实际文本追加在后面。｜范围:字符串｜生效:下一会话
      persona_prompt_file: ''
    xai:
      #: xAI 音色 ID｜xAI 语音音色 ID，默认 eve，也可填自定义音色 ID。｜范围:字符串｜生效:下一会话
      voice_id: eve
      #: xAI 语音语言｜xAI 合成语言，BCP-47 代码（如 en、pt-BR）或 auto。默认 en。｜范围:字符串｜生效:下一会话
      language: en
      #: xAI 语速｜xAI 语速倍率，范围 0.7~1.5，默认 1.0。｜范围:小数｜生效:下一会话
      speed: 1.0
      #: xAI 自动语气标签｜开启后通过大模型改写自动插入富有表现力的音频标签。默认关闭。｜范围:true/false｜生效:下一会话
      auto_speech_tags: false
      #: 流式延迟优化｜流式延迟优化级别 0~2，越高延迟越低但音质可能下降。默认 0。｜范围:整数｜生效:下一会话
      optimize_streaming_latency: 0
      #: xAI 采样率｜xAI 输出采样率：22050/24000/44100/48000，默认 24000。｜范围:整数｜生效:下一会话
      sample_rate: 24000
      #: xAI 码率｜MP3 码率（仅在编码为 mp3 时生效），默认 128000。｜范围:整数｜生效:下一会话
      bit_rate: 128000
    mistral:
      #: Mistral TTS 模型｜Mistral 语音合成模型，默认 voxtral-mini-tts-2603。｜范围:字符串｜生效:下一会话
      model: voxtral-mini-tts-2603
      #: Mistral 音色 ID｜Mistral 语音音色 ID，默认为 Paul - Neutral 音色。｜范围:字符串｜生效:下一会话
      voice_id: c69964a6-ab8b-4f8a-9465-ec0925096ec8
    minimax:
      #: MiniMax TTS 模型｜MiniMax 语音合成模型，默认 speech-02-hd。｜范围:字符串｜生效:下一会话
      model: speech-02-hd
      #: MiniMax 音色 ID｜MiniMax 音色 ID，默认 English_expressive_narrator。｜范围:字符串｜生效:下一会话
      voice_id: English_expressive_narrator
    kittentts:
      #: KittenTTS 模型｜本地 KittenTTS 模型，默认 KittenML/kitten-tts-nano-0.8-int8（nano 25MB、micro 41MB、mini 80MB）。｜范围:字符串｜生效:下一会话
      model: KittenML/kitten-tts-nano-0.8-int8
      #: KittenTTS 音色｜KittenTTS 音色，默认 Jasper。｜范围:字符串｜生效:下一会话
      voice: Jasper
    neutts:
      #: NeuTTS 参考音频｜NeuTTS 参考语音音频文件路径；留空使用内置默认音色。｜范围:字符串｜生效:下一会话
      ref_audio: ''
      #: NeuTTS 参考文本｜NeuTTS 参考语音对应的文本文件路径；留空使用内置默认。｜范围:字符串｜生效:下一会话
      ref_text: ''
      #: NeuTTS 模型｜NeuTTS 使用的 HuggingFace 模型仓库，默认 neuphonic/neutts-air-q4-gguf。｜范围:字符串｜生效:下一会话
      model: neuphonic/neutts-air-q4-gguf
      #: NeuTTS 运行设备｜NeuTTS 推理设备：cpu-CPU（默认） cuda-NVIDIA GPU mps-Apple 芯片 GPU。｜范围:cpu|cuda|mps｜生效:下一会话
      device: cpu
    piper:
      #: Piper 音色｜Piper 音色名称（首次使用时下载）或 .onnx 文件的绝对路径，默认 en_US-lessac-medium。｜范围:字符串｜生效:下一会话
      voice: en_US-lessac-medium
    deepinfra:
      #: DeepInfra TTS 模型｜DeepInfra 语音合成模型；留空则使用在线目录中第一个 TTS 模型。｜范围:字符串｜生效:下一会话
      model: ''
      #: DeepInfra 音色｜DeepInfra TTS 音色，默认 default。｜范围:字符串｜生效:下一会话
      voice: default

  # ---- 语音识别 ----
  stt:
    #: 启用语音识别｜启用语音转文字（处理语音消息和语音输入）。默认开启。｜范围:true/false｜生效:下一会话
    enabled: true
    #: 回显识别文本｜将网关收到的语音消息识别出的原文以 🎙️ 消息回显给用户。默认开启。｜范围:true/false｜生效:下一会话
    echo_transcripts: true
    #: 识别语言｜全局语音识别语言提示（各提供商的语言设置可覆盖），默认 en（Whisper 对短音频自动检测易出错）；留空表示自动检测，中文可设 zh。｜范围:字符串｜生效:下一会话
    language: en
    #: 实时识别｜说话时实时显示部分识别文本（支持 openai/xai/elevenlabs），失败时回退到文件识别。默认关闭。｜范围:true/false｜生效:下一会话
    streaming: false
    #: 上传前裁剪静音｜上传云端识别前用 ffmpeg 裁剪静音（本地 whisper 使用 VAD），失败则上传原始音频。默认开启。｜范围:true/false｜生效:下一会话
    cloud_trim_silence: true
    #: 静音阈值｜低于此音量（dB）视为静音，默认 -40。｜范围:整数｜生效:下一会话
    cloud_trim_threshold_db: -40
    #: 停顿保留时长｜每段停顿保留的毫秒数，以保持自然节奏，默认 300。｜范围:整数｜生效:下一会话
    cloud_trim_keep_ms: 300
    local:
      #: 本地 Whisper 模型｜本地 faster-whisper 模型大小：tiny-最小最快 base-基础（默认） small-小 medium-中 large-v3-最大最准 turbo-大模型加速版。｜范围:faster|tiny|base|small|medium|large|turbo｜生效:下一会话
      model: base
      #: 本地识别语言｜本地识别语言；留空继承 stt.language，可设 en、zh 等强制指定。｜范围:字符串｜生效:下一会话
      language: ''
      #: 初始提示词｜传给本地 Whisper 的初始提示文本，可用于引导专有名词或标点风格。｜范围:字符串｜生效:下一会话
      initial_prompt: ''
      #: 语音活动检测｜启用 Silero VAD 过滤非语音片段以减少幻觉；处理音乐/环境音时可关闭。默认开启。｜范围:true/false｜生效:下一会话
      vad: true
      #: 最小静音切分｜分割语音块所需的最短静音时长（毫秒），默认 500。｜范围:整数｜生效:下一会话
      vad_min_silence_ms: 500
      #: 无语音概率阈值｜片段的无语音概率高于此值且平均对数概率低于 logprob_threshold 时丢弃该片段。默认 0.6。｜范围:小数｜生效:下一会话
      no_speech_prob_threshold: 0.6
      #: 对数概率阈值｜与无语音概率阈值配合使用，平均对数概率低于此值的片段可能被丢弃。默认 -1.0。｜范围:小数｜生效:下一会话
      logprob_threshold: -1.0
      #: 空闲卸载时间｜本地模型空闲多少秒后卸载以释放内存；0 表示永不卸载（例如 300 表示 5 分钟后释放）。｜范围:整数｜生效:下一会话
      unload_after_idle_seconds: 0
    groq:
      #: Groq Whisper 模型｜Groq 语音识别模型：whisper-large-v3-turbo-速度更快（默认） whisper-large-v3-准确率更高。｜范围:字符串｜生效:下一会话
      model: whisper-large-v3-turbo
      #: Groq 识别语言｜Groq 识别语言；留空继承 stt.language。｜范围:字符串｜生效:下一会话
      language: ''
    openai:
      #: OpenAI 识别模型｜OpenAI 转写模型：whisper-1-经典 Whisper（默认） gpt-4o-mini-transcribe-轻量版 gpt-4o-transcribe-高精度版 gpt-transcribe-新一代转写模型。｜范围:字符串｜生效:下一会话
      model: whisper-1
      #: OpenAI 实时识别模型｜开启 stt.streaming 时使用的实时转写模型：gpt-live-transcribe-支持说话中途增量输出（默认） gpt-transcribe gpt-4o-transcribe gpt-4o-mini-transcribe。｜范围:字符串｜生效:下一会话
      streaming_model: gpt-live-transcribe
      #: OpenAI 识别语言｜OpenAI 识别语言；留空继承 stt.language。｜范围:字符串｜生效:下一会话
      language: ''
      #: OpenAI 识别超时｜请求超时（秒），为自托管后端冷启动留出时间。默认 60。｜范围:整数｜生效:下一会话
      timeout: 60
      #: OpenAI 重试次数｜OpenAI SDK 传输层重试次数，默认 1。｜范围:整数｜生效:下一会话
      max_retries: 1
    mistral:
      #: Mistral 识别模型｜Mistral Voxtral 转写模型：voxtral-mini-latest-最新版（默认） voxtral-mini-2602-固定版本。｜范围:字符串｜生效:下一会话
      model: voxtral-mini-latest
      #: Mistral 识别语言｜Mistral 识别语言；留空继承 stt.language。｜范围:字符串｜生效:下一会话
      language: ''
    xai:
      #: xAI 识别模型｜xAI 转写模型：grok-voice-transcribe-2.0-新版（默认） grok-voice-transcribe-1.0-旧版。｜范围:字符串｜生效:下一会话
      model: ''
      #: xAI 识别语言｜xAI 识别语言；留空继承 stt.language。｜范围:字符串｜生效:下一会话
      language: ''
    elevenlabs:
      #: ElevenLabs 识别模型｜ElevenLabs Scribe 转写模型：scribe_v2-新版（默认） scribe_v1-旧版。｜范围:scribe_v2|scribe_v1｜生效:下一会话
      model_id: scribe_v2
      #: ElevenLabs 语言代码｜ElevenLabs 识别语言代码（三字母，如 eng、spa、zho）；留空继承 stt.language。｜范围:字符串｜生效:下一会话
      language_code: ''
      #: 标注音频事件｜在转写文本中标注笑声、掌声等音频事件。默认关闭。｜范围:true/false｜生效:下一会话
      tag_audio_events: false
      #: 说话人分离｜区分不同说话人并标注。默认关闭。｜范围:true/false｜生效:下一会话
      diarize: false
    deepinfra:
      #: DeepInfra 识别模型｜DeepInfra 语音识别模型；留空使用在线目录中第一个 STT 模型。｜范围:字符串｜生效:下一会话
      model: ''

  # ---- 语音对话 ----
  voice:
    #: 语音对话模式｜桌面端语音对话的实现方式：chained-语音识别→智能体处理→语音合成串联（默认，使用 stt/tts 配置） gpt-live-由 OpenAI GPT-Live 全双工语音模型接管麦克风与扬声器，并将实际请求委托给智能体（需 OpenAI API Key）。｜范围:chained|gpt|GPT｜生效:下一会话
    voice_chat_mode: chained
    gpt_live:
      #: GPT-Live 模型｜gpt-live 模式使用的实时语音模型，默认 gpt-live-1。｜范围:字符串｜生效:下一会话
      model: gpt-live-1
      #: GPT-Live 音色｜gpt-live 模式的音色，默认 marin；可选 quartz、ripple、vesper、willow、stone、gleam、meridian 等。｜范围:字符串｜生效:下一会话
      voice: marin
      #: GPT-Live 附加指令｜追加到实时语音模型人设中的额外说明（语气、节奏、语言等）。｜范围:字符串｜生效:下一会话
      instructions: ''
    #: 录音快捷键｜CLI/TUI 中开始/停止录音的快捷键，默认 ctrl+b。｜范围:字符串｜生效:下一会话
    record_key: ctrl+b
    #: 语音提交方式｜TUI 中语音识别结果的提交方式：direct-识别后立即发送（默认） draft-作为可编辑草稿放入输入框。｜范围:direct|draft｜生效:下一会话
    submit_mode: direct
    #: 最长录音时长｜单次录音的最大时长（秒），默认 120。｜范围:整数｜生效:下一会话
    max_recording_seconds: 120
    #: 自动朗读回复｜开启后自动将智能体的回复转为语音播放。默认关闭。｜范围:true/false｜生效:下一会话
    auto_tts: false
    #: 自动朗读范围｜自动朗读的触发范围：all-所有回复都朗读（默认） voice_only-仅在用户使用语音输入时朗读。｜范围:all|voice_only｜生效:下一会话
    auto_tts_mode: all
    #: 客户端直连语音服务｜桌面远程客户端直接调用 STT/TTS 提供商（会话开始时经认证接口获取配置与密钥），而不经网关中转。默认开启。｜范围:true/false｜生效:下一会话
    client_direct: true
    #: 录音提示音｜CLI 语音模式下录音开始/结束时播放提示音。默认开启。｜范围:true/false｜生效:下一会话
    beep_enabled: true
    #: 提示音音量｜提示音音量倍率，0.0~1.0，默认 0.3。｜范围:小数｜生效:下一会话
    beep_volume: 0.3
    #: 思考提示音｜智能体工作时播放环境气泡音（音量同提示音音量）。默认开启。｜范围:true/false｜生效:下一会话
    thinking_sound: true
    #: 静音判定阈值｜RMS 音量低于此值视为静音（0~32767），默认 200。｜范围:整数｜生效:下一会话
    silence_threshold: 200
    #: 静音自动停止｜连续静音多少秒后自动停止录音，默认 3.0。｜范围:小数｜生效:下一会话
    silence_duration: 3.0
    #: 允许插话打断｜用户开始说话时打断智能体并停止语音播放。默认开启。｜范围:true/false｜生效:下一会话
    barge_in: true
    #: 插话保护时间｜TTS 开始播放后多少秒内不触发插话检测（麦克风保持开启），默认 0.5。｜范围:小数｜生效:下一会话
    barge_in_grace_seconds: 0.5
    #: 插话触发倍数｜插话触发阈值 = 安静环境底噪 × 此倍数（底噪在播放前校准），默认 3.0。｜范围:小数｜生效:下一会话
    barge_in_threshold_multiplier: 3.0
    #: 结束语音口令｜完整说出其中某个短语（不区分大小写、忽略标点）即结束语音对话而不发送给智能体，默认 ["stop"]；空列表表示禁用。｜范围:列表｜生效:下一会话
    stop_phrases: [stop]

  # ---- 视觉 ----
  vision:
    #: 图片嵌入字节预算｜单张嵌入图片的字节预算（限制在 64KiB~4MiB），默认 256KiB；密集表格截图看不清时可调大。｜范围:整数｜生效:下一会话
    embed_target_bytes: 262144
    #: 单图分析次数上限｜每个会话中 vision_analyze 对同一图片（含区域裁剪）的嵌入次数上限。留空表示子智能体内为 3 次、主智能体不限；填数字则全局生效；0 表示不限。｜范围:可空｜生效:下一会话
    max_calls_per_image: null
    #: 重放最近图片数｜从数据库重建的轮次中重新发送最近多少张用户图片；0 表示关闭。默认 3。｜范围:整数｜生效:下一会话
    replay_recent_images: 3

  # ---- 唤醒词 ----
  wake_word:
    #: 启用唤醒词｜启用免手动的唤醒词：常驻设备端热词检测，检测到后开启新的语音会话。默认关闭。｜范围:true/false｜生效:下一会话
    enabled: false
    #: 唤醒词生效界面｜由哪个界面响应唤醒词：auto-第一个申请的界面（默认） cli-命令行 tui-终端界面 gui-桌面图形界面。｜范围:auto|cli|tui|gui｜生效:下一会话
    surface: auto
    #: 麦克风设备｜PortAudio 输入设备的索引或名称；留空使用系统默认设备。｜范围:可空｜生效:下一会话
    input_device: null
    #: 音频采集方式｜唤醒词音频来源：auto-自动（默认） local-本机麦克风 client-由桌面客户端推送麦克风音频。｜范围:auto|local|client｜生效:下一会话
    capture: auto
    #: 唤醒词引擎｜唤醒词检测引擎：auto-自动选择当前平台支持的引擎（默认） openwakeword-免费开源引擎 sherpa-sherpa-onnx 关键词检测 porcupine-Picovoice Porcupine（需 PORCUPINE_ACCESS_KEY）。｜范围:auto|openwakeword|sherpa|porcupine｜生效:下一会话
    provider: auto
    #: 唤醒短语｜唤醒短语；对 sherpa 引擎即实际检测的短语，对其他引擎仅为显示标签（检测由模型/关键词决定）。默认 hey hermes。｜范围:字符串｜生效:下一会话
    phrase: hey hermes
    #: 唤醒灵敏度｜检测阈值 0.0~1.0，越高越严格（误触发越少）。默认 0.6。｜范围:小数｜生效:下一会话
    sensitivity: 0.6
    #: 确认帧数｜仅 openWakeWord：需连续多少帧超过阈值才触发；越高误触越少但延迟越大，1 表示单帧触发。默认 3。｜范围:整数｜生效:下一会话
    confirmation_frames: 3
    #: 唤醒时新建会话｜唤醒后开启全新会话；关闭则继续当前会话。默认开启。｜范围:true/false｜生效:下一会话
    start_new_session: true
    #: 按配置档路由｜仅 sherpa：同时监听所有启用唤醒词的配置档的短语，并路由到对应配置档。默认开启。｜范围:true/false｜生效:下一会话
    profile_routing: true
    openwakeword:
      #: openWakeWord 模型｜openWakeWord 模型：hey_hermes（默认）、内置模型名（如 hey_jarvis、alexa）或自定义 .tflite 模型路径。｜范围:字符串｜生效:下一会话
      model: hey_hermes
    sherpa:
      #: sherpa 模型目录｜sherpa-onnx 关键词检测模型目录；留空则自动下载小型英文 zipformer 模型。｜范围:字符串｜生效:下一会话
      model_dir: ''
    porcupine:
      #: Porcupine 关键词｜Porcupine 内置关键词（如 jarvis、computer）或自定义 .ppn 文件路径，默认 jarvis。｜范围:字符串｜生效:下一会话
      keyword: jarvis

  # ---- 拟人延迟 ----
  human_delay:
    #: 模拟打字延迟｜消息平台中模拟人类回复节奏：off-关闭，typing-按自然打字节奏延迟，fixed-在 min_ms~max_ms 之间随机延迟。默认 off。｜范围:off|typing|fixed｜生效:下一会话
    mode: 'off'
    #: 最小延迟｜模拟延迟的最小毫秒数。默认 800。｜范围:整数｜生效:下一会话
    min_ms: 800
    #: 最大延迟｜模拟延迟的最大毫秒数。默认 2500。｜范围:整数｜生效:下一会话
    max_ms: 2500

  # ---- 上下文 ----
  context:
    #: 上下文管理引擎｜接近 token 上限时如何管理上下文：default-内置有损摘要压缩器，custom-使用插件提供的上下文引擎（如 lcm）。｜范围:default|custom｜生效:下一会话
    engine: compressor
    memory_trim:
      #: 内存回收｜在智能体/TUI 清理节点归还空闲的 glibc 内存页。默认开启。｜范围:true/false｜生效:下一会话
      enabled: true
      #: 内存回收冷却｜两次内存回收之间的最短间隔秒数。默认 60。｜范围:小数｜生效:下一会话
      cooldown_seconds: 60.0
      #: 回收日志频率｜每 N 次周期性回收记录一次 INFO 日志。默认 1。｜范围:整数｜生效:下一会话
      log_every_n: 1
      #: 回收日志最小变化｜内存变化小于该 MB 时不记录 INFO 日志；0 表示全部记录。｜范围:小数｜生效:下一会话
      info_log_min_delta_mb: 0.0

  # ---- 记忆 ----
  memory:
    #: 启用长期记忆｜启用持久化记忆：将有限的精选记忆注入系统提示词。默认开启。｜范围:true/false｜生效:下一会话
    memory_enabled: true
    #: 启用用户画像｜启用用户画像记忆（记录用户偏好与背景）。默认开启。｜范围:true/false｜生效:下一会话
    user_profile_enabled: true
    #: 预取溢出｜允许外部记忆召回结果使用输出溢出机制（hooks.output_spill）。默认关闭。｜范围:true/false｜生效:下一会话
    prefetch_spill_enabled: false
    #: 记忆写入审批｜开启后前台记忆写入需即时确认，后台写入进入待审批队列（可在记忆管理中批准/拒绝）。默认关闭。｜范围:true/false｜生效:下一会话
    write_approval: false
    #: 记忆字符上限｜智能体记忆的字符上限，默认 2200（约 800 tokens）。｜范围:整数｜生效:下一会话
    memory_char_limit: 2200
    #: 用户画像字符上限｜用户画像的字符上限，默认 1375（约 500 tokens）。｜范围:整数｜生效:下一会话
    user_char_limit: 1375
    #: 记忆回顾间隔｜内置记忆的定期回顾间隔（轮次），默认 10；使用会自动提取的外部记忆提供商时可设为 0。｜范围:整数｜生效:下一会话
    nudge_interval: 10
    #: 外部记忆提供商｜外部记忆插件：空-仅使用内置记忆（默认） byterover-ByteRover 本地优先记忆 retaindb-RetainDB 持久记忆。也可使用插件目录中安装的 honcho、mem0 等。｜范围:byterover|retaindb｜生效:下一会话
    provider: ''

  # ---- 子任务委派 ----
  delegation:
    #: 委派后端｜子智能体任务路由策略：default-使用下方各项设置，也可填写其他后端名（如 profile_routes），对应设置在 delegation.backends 中。｜范围:字符串｜生效:下一会话
    backend: default
    #: 委派后端配置｜按委派后端名称存放的专属设置（与“委派后端”选项配合）。默认空。｜范围:键值对｜生效:下一会话
    backends: {}
    #: 子智能体模型｜子智能体使用的模型，如 google/gemini-3-flash-preview；留空则继承父智能体。｜范围:字符串｜生效:下一会话
    model: ''
    #: 子智能体提供商｜子智能体使用的提供商，如 openrouter；留空则继承父智能体的提供商与凭据。｜范围:字符串｜生效:下一会话
    provider: ''
    #: 子智能体备用链｜子智能体的备用提供商链（格式同顶层）；留空则未固定的子智能体继承父链，[] 表示禁用回退。｜范围:可空｜生效:下一会话
    fallback_providers: null
    #: 子智能体接口地址｜子智能体直连的 OpenAI 兼容端点地址；留空不使用。｜范围:字符串｜生效:下一会话
    base_url: ''
    #: 子智能体 API 密钥｜delegation.base_url 对应的 API 密钥；留空时回退到 OPENAI_API_KEY。｜范围:字符串｜生效:下一会话
    api_key: ''
    #: 子智能体接口协议｜delegation.base_url 的传输协议：chat_completions、codex_responses、anthropic_messages；留空则根据 URL 自动识别。｜范围:字符串｜生效:下一会话
    api_mode: ''
    #: 子任务请求覆盖｜每次委派调用都附加的请求参数（如 service_tier），其中 extra_body 子项合并进请求体；显式值优先。默认空。｜范围:键值对｜生效:下一会话
    request_overrides: {}
    #: 子智能体压缩阈值｜子智能体压缩触发点的绝对 token 上限（≥16000 才生效），与比例阈值取较低者；0 表示与父智能体一致（默认）。｜范围:整数｜生效:下一会话
    compression_threshold_tokens: 0
    #: 继承 MCP 工具集｜限定子智能体工具集时仍保留父智能体的 MCP 工具集；关闭则严格按指定工具集。默认开启。｜范围:true/false｜生效:下一会话
    inherit_mcp_toolsets: true
    #: 子智能体最大轮数｜每个子智能体的工具调用轮数上限（独立于父智能体）。默认 250。｜范围:整数｜生效:下一会话
    max_iterations: 250
    #: 子结果摘要上限｜子智能体返回结果的单条字符硬上限，超出部分溢出到缓存文件可再读取；0 表示仅用动态预算。默认 24000。｜范围:整数｜生效:下一会话
    max_summary_chars: 24000
    #: 子智能体无进展超时｜子智能体无任何进展的最长秒数（最低 30），并非总时长；0 表示不限制（默认）。｜范围:整数｜生效:下一会话
    child_timeout_seconds: 0
    #: 子智能体推理强度｜子智能体的推理强度：留空-继承父智能体，minimal-最小，low-低，medium-中，high-高，xhigh-很高，max-最大，ultra-极致。｜范围:minimal|low|medium|high|xhigh|max|ultra｜生效:下一会话
    reasoning_effort: ''
    #: 最大并行子智能体｜每批并行运行的子智能体数及并发后台任务数上限（最少 1），超出的异步任务改为同步执行。默认 10。｜范围:整数｜生效:下一会话
    max_concurrent_children: 10
    #: 首块等待时间｜兄弟子智能体等待第一个子智能体首个输出块（以共享缓存前缀）的最长秒数；0 表示关闭。｜范围:整数｜生效:下一会话
    prefix_stagger_seconds: 0
    #: 独立返回结果｜开启时后台批量任务每完成一个（或一组）就单独返回；关闭则整批完成后合并为一条消息返回。默认关闭。｜范围:true/false｜生效:下一会话
    independent_completions: false
    #: 网关委派模式｜网关中委派的执行方式：inline-在当前轮内等待合并结果，background-后台运行，auto-在关闭中间消息的平台上用 inline。默认 auto。｜范围:inline|background|auto｜生效:下一会话
    gateway_mode: auto
    #: 最大委派深度｜委派树深度上限：1-扁平（子智能体不能再委派），2-编排者→执行者，3 及以上更深；每层都会倍增成本。默认 1。｜范围:整数｜生效:下一会话
    max_spawn_depth: 1
    #: 允许编排者角色｜是否允许 role="orchestrator" 的子智能体（总开关）。默认开启。｜范围:true/false｜生效:下一会话
    orchestrator_enabled: true
    #: 单次运行子智能体上限｜一次性运行（chat -q / --oneshot）最多可派生的子智能体总数；0 表示不限制。默认 2。｜范围:整数｜生效:下一会话
    oneshot_max_children: 2
    #: 子智能体自动审批｜子智能体的审批总是非交互处理：false-自动拒绝，true-自动批准一次；均记录审计日志，仅建议在可信批处理中开启。默认关闭。｜范围:true/false｜生效:下一会话
    subagent_auto_approve: false
    #: 转发子进程通知｜将子智能体后台进程的完成/匹配通知转发给父智能体；关闭则不转发（异步委派结果始终送达）。默认关闭。｜范围:true/false｜生效:下一会话
    surface_child_process_notifications: false
    #: 可恢复保留时长｜可恢复的子智能体任务保留的小时数。默认 48。｜范围:整数｜生效:下一会话
    resumable_ttl_hours: 48
    #: 可恢复任务上限｜最多保留的可恢复子智能体任务数。默认 32。｜范围:整数｜生效:下一会话
    max_resumable: 32
    #: 自动恢复子任务｜自动恢复中断的子智能体任务（会无人值守消耗 token），超过截止时间仍失败则放弃。默认关闭。｜范围:true/false｜生效:下一会话
    auto_resume: false
    #: 自动恢复截止时间｜自动恢复子任务的截止时间（分钟），超时后以失败结束。默认 360。｜范围:整数｜生效:下一会话
    auto_resume_deadline_minutes: 360

  # ---- 目标 ----
  goals:
    #: 目标最大续行轮数｜/goal 持续目标循环自动暂停前的最大续行轮数，防止判定失误导致无限消耗。默认 20。｜范围:整数｜生效:下一会话
    max_turns: 20

  # ---- 循环任务 ----
  loops:
    #: 循环最小间隔｜/loop 固定间隔的最小值（秒），更短的间隔会被提高到此值。默认 30。｜范围:整数｜生效:下一会话
    min_interval_seconds: 30
    #: 循环最大次数｜未指定次数时，循环唤醒达到此次数后自动暂停；0 表示不限。默认 100。｜范围:整数｜生效:下一会话
    max_ticks: 100
    #: 自适应间隔下限｜自适应节奏（未指定间隔）循环的起始/最小间隔（秒），默认 60。｜范围:整数｜生效:下一会话
    self_paced_floor_seconds: 60
    #: 自适应间隔上限｜自适应节奏循环在回复不再变化时指数退避的最大间隔（秒），默认 900。｜范围:整数｜生效:下一会话
    self_paced_ceiling_seconds: 900

  # ---- 多模型协作 ----
  moa:
    #: 默认 MoA 预设｜/moa 使用的默认混合智能体（Mixture of Agents）预设名称，默认 default。｜范围:字符串｜生效:下一会话
    default_preset: default
    #: 当前 MoA 预设｜当前激活的 MoA 预设名称；留空表示未启用。｜范围:字符串｜生效:下一会话
    active_preset: ''
    #: 保存 MoA 追踪｜将每次 MoA 轮次（参考模型与聚合模型的输入/输出/用量）以 JSONL 写入追踪目录以便审计。默认关闭。｜范围:true/false｜生效:下一会话
    save_traces: false
    #: MoA 追踪目录｜MoA 追踪文件的保存目录；留空使用数据目录下的 moa-traces。｜范围:字符串｜生效:下一会话
    trace_dir: ''
    #: MoA 隐私过滤｜对顾问模型输出中的个人信息/凭据进行脱敏：空-关闭（默认） display-仅脱敏界面展示和追踪记录（聚合模型仍看到原文） full-同时脱敏注入聚合模型提示词的内容。｜范围:display|full｜生效:下一会话
    privacy_filter: ''
    presets:
      default:
        #: 参考模型列表｜default 预设的参考（顾问）模型列表，每项包含 provider 和 model，例如 openai-codex/gpt-5.5、openrouter/deepseek/deepseek-v4-pro。｜范围:列表｜生效:下一会话
        reference_models: [{model: gpt-5.5, provider: openai-codex}, {model: deepseek/deepseek-v4-pro, provider: openrouter}]
        aggregator:
          #: 聚合模型提供商｜default 预设中聚合模型的提供商，默认 openrouter。｜范围:字符串｜生效:下一会话
          provider: openrouter
          #: 聚合模型｜default 预设中负责综合参考意见的聚合模型，默认 anthropic/claude-opus-4.8。｜范围:字符串｜生效:下一会话
          model: anthropic/claude-opus-4.8
        #: 启用默认预设｜是否启用 default 预设。默认开启。｜范围:true/false｜生效:下一会话
        enabled: true

  # ---- 技能 ----
  skills:
    #: 外部技能目录｜额外加载的共享技能目录列表（只读，支持 ~ 与 ${VAR}），如 ["~/.agents/skills"]。｜范围:列表｜生效:下一会话
    external_dirs: []
    #: 新技能保存目录｜智能体通过 skill_manage 创建的技能保存位置；留空为当前配置档本地目录。｜范围:字符串｜生效:下一会话
    create_dir: ''
    #: 项目技能发现｜在 git 仓库中加载 <根>/.hermes/skills/ 与 .agents/skills/ 作为最高优先级技能（仅限受信项目）；关闭则不扫描。默认开启。｜范围:true/false｜生效:下一会话
    project_discovery: true
    #: 受信项目目录｜允许加载项目内技能的受信项目根目录列表，由 `skills trust/untrust` 命令管理。｜范围:列表｜生效:下一会话
    trusted_project_dirs: []
    #: 自动加载技能｜在每个新会话中固定完整加载的技能名称列表；不存在或已禁用的会警告并跳过。｜范围:列表｜生效:下一会话
    auto_load: []
    #: 技能模板变量｜在 SKILL.md 中替换 ${HERMES_SKILL_DIR}、${HERMES_SESSION_ID} 等模板变量。默认开启。｜范围:true/false｜生效:下一会话
    template_vars: true
    #: 技能内联命令｜预先执行 SKILL.md 中的 !`cmd` 片段并内联其输出；存在执行技能作者代码的风险，社区安装的技能从不自动执行。默认关闭。｜范围:true/false｜生效:下一会话
    inline_shell: false
    #: 内联命令超时｜每个 !`cmd` 片段的执行超时秒数。默认 10。｜范围:整数｜生效:下一会话
    inline_shell_timeout: 10
    #: 扫描智能体创建技能｜对智能体自行编写的技能进行安全扫描，危险结果作为工具错误返回；从技能中心安装的始终会扫描。默认关闭。｜范围:true/false｜生效:下一会话
    guard_agent_created: false
    #: Tier1 安全建议扫描｜安装技能时额外运行 NVIDIA SkillEvaluator Tier 1 扫描（需 skillevaluator 在 PATH 中），仅提示不阻断。默认开启。｜范围:true/false｜生效:下一会话
    tier1_advisory: true
    #: 技能修改审批｜开启后 skill_manage 的修改一律暂存待审批（/skills pending、diff、approve/reject）。默认关闭。｜范围:true/false｜生效:下一会话
    write_approval: false
    #: 技能审计账本｜每次技能修改都追加到审计账本（含前后哈希），支持 curator ledger / rollback 回滚；不作为门禁。默认开启。｜范围:true/false｜生效:下一会话
    ledger: true
    #: 账本大小上限｜审计账本文件的字节上限，超出后去重并删除最旧条目；0 表示永久只追加。默认 5 MiB。｜范围:整数｜生效:下一会话
    ledger_max_bytes: 5242880

  # ---- 技能整理 ----
  curator:
    #: 启用技能整理｜启用技能整理器：后台维护智能体自建的技能，将长期未用的标记为过期，并归档（不删除）已过时的技能。默认开启。｜范围:true/false｜生效:下一会话
    enabled: true
    #: 整理间隔｜两次整理运行之间的间隔（小时），默认 168（7 天）。｜范围:整数｜生效:下一会话
    interval_hours: 168
    #: 最小空闲时间｜智能体空闲至少多少小时后才运行整理，默认 2。｜范围:整数｜生效:下一会话
    min_idle_hours: 2
    #: 过期判定天数｜技能未使用超过多少天标记为过期，默认 14。｜范围:整数｜生效:下一会话
    stale_after_days: 14
    #: 归档判定天数｜技能未使用超过多少天移入 skills/.archive/（可恢复），默认 30。｜范围:整数｜生效:下一会话
    archive_after_days: 30
    #: 合并相似技能｜启用基于大模型的技能合并（构建综合技能）；关闭则只做确定性的闲置清理，无辅助模型开销。默认关闭。｜范围:true/false｜生效:下一会话
    consolidate: false
    #: 清理内置技能｜开启后内置技能也会像自建技能一样因闲置而被清理；从技能中心安装的技能永不清理。默认关闭。｜范围:true/false｜生效:下一会话
    prune_builtins: false
    #: 归档保留天数｜已归档技能的保留天数；0 表示永久保留，大于 0 时允许手动清除命令删除更早的归档（不会自动执行）。默认 0。｜范围:整数｜生效:下一会话
    archive_ttl_days: 0
    backup:
      #: 合并前备份｜在合并（会就地改写技能内容）之前对技能目录做快照备份，可回滚。默认开启。｜范围:true/false｜生效:下一会话
      enabled: true
      #: 备份保留份数｜保留最近多少份技能快照，默认 2。｜范围:整数｜生效:下一会话
      keep: 2

  # ---- Slack ----
  slack:
    #: 频道需 @ 提及｜Slack 频道中需 @机器人 才会回复。默认开启。｜范围:true/false｜生效:重启
    require_mention: true
    #: 免提及频道｜无需 @ 即可回复的 Slack 频道 ID，逗号分隔。｜范围:字符串｜生效:重启
    free_response_channels: ''
    #: 允许的频道｜设置后仅在这些 Slack 频道 ID 中回复（白名单），逗号分隔；留空不限制。｜范围:字符串｜生效:重启
    allowed_channels: ''
    #: 强制提及频道｜始终需要 @ 提及才回复的 Slack 频道 ID，逗号分隔。｜范围:字符串｜生效:重启
    require_mention_channels: ''
    #: 忽略提及他人的消息｜消息开头 @ 了其他用户且未同时 @ 机器人时忽略该消息。默认关闭。｜范围:true/false｜生效:重启
    ignore_other_user_mentions: false
    #: 话题回复需提及｜在 Slack 话题（thread）回复中也需要 @ 提及。默认关闭。｜范围:true/false｜生效:重启
    thread_require_mention: false
    #: Slack 频道提示｜频道 ID → 临时系统提示（仅对该频道生效，不进入缓存前缀）。默认空。｜范围:键值对｜生效:重启
    channel_prompts: {}

  # ---- Discord ----
  discord:
    #: 频道需 @ 提及｜Discord 服务器频道中需 @机器人 才会回复。默认开启。｜范围:true/false｜生效:重启
    require_mention: true
    #: 免提及频道｜无需 @ 即可回复的 Discord 频道 ID，逗号分隔。｜范围:字符串｜生效:重启
    free_response_channels: ''
    #: 允许的频道｜设置后仅在这些 Discord 频道 ID 中回复（白名单），逗号分隔；留空不限制。｜范围:字符串｜生效:重启
    allowed_channels: ''
    #: 自动创建话题｜在频道中被 @ 时自动创建话题（thread）进行回复。默认开启。｜范围:true/false｜生效:重启
    auto_thread: true
    #: 免提及频道自动话题｜免提及频道默认直接回复；开启后每条顶层消息也会单独开一个话题。默认关闭。｜范围:true/false｜生效:重启
    free_response_auto_thread: false
    #: 话题内需提及｜在话题中也需要 @ 提及（适用于多机器人话题）。默认关闭。｜范围:true/false｜生效:重启
    thread_require_mention: false
    #: 机器人需显式提及｜其他机器人发送的消息必须在正文中 @本机器人 才触发回复，仅回复引用不算。仅对可信旧中继可关闭；不影响人类用户。默认开启。｜范围:true/false｜生效:重启
    bots_require_inline_mention: true
    #: 回填历史消息｜被触发时附带频道近期消息记录（找回因需提及而被忽略的消息）。默认开启。｜范围:true/false｜生效:重启
    history_backfill: true
    #: 历史回填条数｜历史回填时最多扫描的消息条数，默认 50。｜范围:整数｜生效:重启
    history_backfill_limit: 50
    missed_message_backfill:
      #: 补发离线消息｜重连或启动后重放离线期间错过的消息。默认关闭。｜范围:true/false｜生效:重启
      enabled: false
      #: 补发频道｜需要补发的频道 ID，逗号分隔；留空则使用免提及频道。｜范围:字符串｜生效:重启
      channels: ''
      #: 补发时间窗口｜仅检查最近多少秒内的消息，默认 21600（6 小时）。｜范围:整数｜生效:重启
      window_seconds: 21600
      #: 补发扫描上限｜每次重连最多扫描的消息总数，默认 100。｜范围:整数｜生效:重启
      limit: 100
      #: 补发处理上限｜每次重连最多处理的补发消息数，默认 10。｜范围:整数｜生效:重启
      max_dispatches: 10
      #: 单条最大重试｜单条消息在整个生命周期内最多重新处理的次数，默认 3。｜范围:整数｜生效:重启
      max_attempts: 3
    #: 处理状态表情｜处理消息时添加 👀/✅/❌ 表情反应表示状态。默认开启。｜范围:true/false｜生效:重启
    reactions: true
    #: 连接探活间隔｜检查 Discord WebSocket 就绪/心跳状态的间隔（秒），默认 15；任一探活参数为 0 即禁用探活。｜范围:整数｜生效:重启
    websocket_liveness_interval_seconds: 15
    #: 探活失败阈值｜连续探活失败多少次判定连接异常，默认 2。｜范围:整数｜生效:重启
    websocket_liveness_failure_threshold: 2
    #: 心跳确认最大间隔｜心跳 ACK 超过多少秒未更新视为异常，默认 60。｜范围:整数｜生效:重启
    websocket_heartbeat_ack_max_age_seconds: 60
    #: 最大连接延迟｜WebSocket 延迟超过多少秒视为异常，默认 30。｜范围:整数｜生效:重启
    websocket_max_latency_seconds: 30
    #: 事件最长静默｜连接仍回应心跳但超过多少秒未收到任何事件即视为失聪并重连，默认 14400（4 小时）；0 表示禁用。｜范围:整数｜生效:重启
    websocket_event_max_silence_seconds: 14400
    #: Discord 频道提示｜频道 ID → 临时系统提示（仅对该频道生效）。默认空。｜范围:键值对｜生效:重启
    channel_prompts: {}
    #: 私信角色授权服务器｜填写服务器（guild）ID 后，该服务器中拥有允许角色的成员也可通过私信使用机器人；留空或 0 表示关闭。｜范围:字符串｜生效:重启
    dm_role_auth_guild: ''
    #: 允许的服务器操作｜discord 管理工具允许执行的操作，逗号分隔（如 list_guilds、list_channels、fetch_messages、pin_message、add_role 等）；留空表示全部（受机器人权限限制）。｜范围:字符串｜生效:重启
    server_actions: ''
    #: 允许任意附件（已弃用）｜已弃用、无实际作用（附件总会缓存，由消息授权控制访问），仅为兼容旧配置保留。｜范围:true/false｜生效:重启
    allow_any_attachment: false
    #: 附件大小上限｜单个缓存附件的最大字节数（写入时会占用内存）；0 表示不限。默认 33554432（32MB）。｜范围:整数｜生效:重启
    max_attachment_bytes: 33554432
    #: 审批时提及用户｜发出审批请求时 @ 允许的用户，便于在共享频道中及时注意到。默认关闭。｜范围:true/false｜生效:重启
    approval_mentions: false
    #: 语音频道空闲超时｜语音频道无活动多少秒后自动离开；0 表示一直停留直到手动离开。默认 300。｜范围:整数｜生效:重启
    voice_channel_inactivity_timeout_seconds: 300
    #: 语音播放超时｜强制停止语音频道播放前的最短秒数（会根据音频时长自动延长），默认 120。｜范围:整数｜生效:重启
    voice_playback_timeout_seconds: 120
    voice_fx:
      #: 启用语音混音｜语音频道软件混音器总开关（思考背景音、口头确认与 TTS 叠加）。默认关闭。｜范围:true/false｜生效:重启
      enabled: false
      #: 播放思考背景音｜工具运行时播放空闲“思考”背景音。默认开启。｜范围:true/false｜生效:重启
      ambient_enabled: true
      #: 背景音文件｜自定义循环背景音频文件路径；留空使用合成音。｜范围:字符串｜生效:重启
      ambient_path: ''
      #: 背景音音量｜空闲背景音音量，0.0~1.0，默认 0.18。｜范围:小数｜生效:重启
      ambient_gain: 0.18
      #: 说话时背景音量｜播放语音时背景音被压低后的音量，默认 0.06。｜范围:小数｜生效:重启
      duck_gain: 0.06
      #: 语音音量｜TTS 与口头确认的音量，0.0~1.0，默认 1.0。｜范围:小数｜生效:重启
      speech_gain: 1.0
      #: 口头确认｜在第一次工具调用前说一句简短确认语。默认开启。｜范围:true/false｜生效:重启
      ack_enabled: true
      #: 确认语列表｜随机选用的口头确认语列表；空列表表示禁用。｜范围:列表｜生效:重启
      ack_phrases: [Let me look into that., One moment., Checking on that now., Give me a sec., On it.]

  # ---- Telegram ----
  telegram:
    #: 处理状态表情｜处理消息时添加 👀/✅/❌ 表情反应表示状态。默认关闭。｜范围:true/false｜生效:重启
    reactions: false
    #: Telegram 会话提示｜会话/群组 ID → 临时系统提示（仅对该会话生效）。默认空。｜范围:键值对｜生效:重启
    channel_prompts: {}
    #: 允许的群聊｜设置后仅在这些 Telegram 群组/超级群组 ID 中回复，逗号分隔；留空不限制。｜范围:字符串｜生效:重启
    allowed_chats: ''
    extra:
      #: 原生富文本消息｜使用 Bot API 10.1 原生富文本消息（表格、任务列表、公式）；关闭则使用传统 MarkdownV2（更便于复制纯文本）。默认关闭。｜范围:true/false｜生效:重启
      rich_messages: false
      #: 富文本草稿（实验）｜实验性：私聊中的富文本流式预览草稿。默认关闭。｜范围:true/false｜生效:重启
      rich_drafts: false
      #: 纯文本草稿｜使用只会增长的纯文本原始预览草稿。默认关闭。｜范围:true/false｜生效:重启
      plain_drafts: false
      #: 中日韩富文本｜中日韩文本默认使用 MarkdownV2（Telegram 桌面/macOS 客户端会显示乱码）；在不受影响的客户端上可开启以获得原生富文本表格。默认关闭。｜范围:true/false｜生效:重启
      allow_cjk_rich_messages: false
      #: 私信自动开话题｜话题模式下，私信根消息会自动开启一个新话题。默认关闭。｜范围:true/false｜生效:重启
      dm_topic_auto_transfer: false

