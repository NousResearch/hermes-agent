    require_mention: true
    #: 免提及频道｜无需 @ 即可回复的 Mattermost 频道 ID，逗号分隔。｜范围:字符串｜生效:重启
    free_response_channels: ''
    #: 允许的频道｜设置后仅在这些 Mattermost 频道 ID 中回复（白名单），逗号分隔。｜范围:字符串｜生效:重启
    allowed_channels: ''
    #: Mattermost 频道提示｜频道 ID → 临时系统提示（仅对该频道生效）。默认空。｜范围:键值对｜生效:重启
    channel_prompts: {}

  # ---- Matrix ----
  matrix:
    #: 房间需 @ 提及｜Matrix 房间中需 @机器人 才会回复。默认开启。｜范围:true/false｜生效:重启
    require_mention: true
    #: 免提及房间｜无需 @ 即可回复的 Matrix 房间 ID，逗号分隔。｜范围:字符串｜生效:重启
    free_response_rooms: ''
    #: 允许的房间｜设置后仅在这些 Matrix 房间 ID 中回复（白名单），逗号分隔。｜范围:字符串｜生效:重启
    allowed_rooms: ''

  # ---- 执行审批 ----
  approvals:
    #: 危险命令审批模式｜执行危险命令前的审批方式：manual-每次都需人工确认 smart-由辅助模型自动批准低风险命令、其余需人工确认（默认） off-关闭审批，全部自动执行（等同 --yolo）。｜范围:manual|smart|off｜生效:下一会话
    mode: smart
    #: 审批超时｜审批请求无人响应多少秒后按拒绝处理（CLI 与网关通用），默认 300。｜范围:整数｜生效:下一会话
    timeout: 300
    #: Discord 审批超时｜Discord 审批按钮保持可点击的时长（秒，最少 30），默认 300。｜范围:整数｜生效:下一会话
    discord_prompt_timeout: 300
    #: 定时任务审批策略｜定时任务遇到危险命令时的处理：deny-立即拒绝，让智能体另寻办法（默认） approve-自动批准。｜范围:deny|approve｜生效:下一会话
    cron_mode: deny
    #: 单次查询审批策略｜单次查询（-q）模式下遇到危险命令（无人可以应答）时的处理：deny-立即拒绝（默认） approve-自动批准。｜范围:deny|approve｜生效:下一会话
    single_query_mode: deny
    #: 无人值守审批策略｜无人值守平台（webhook、API 服务等无审批通道）遇到危险命令时的处理：deny-立即拒绝（默认） approve-自动批准。｜范围:deny|approve｜生效:下一会话
    unattended_mode: deny
    #: 智能审批附加规则｜追加到智能审批守护模型系统提示词中的额外规则，例如“涉及 /etc 的命令一律升级为人工审批”。｜范围:字符串｜生效:下一会话
    smart_policy: ''
    #: 连续拒绝熔断阈值｜同一会话中守护模型连续拒绝多少次后升级为硬停（要求向用户报告或请求人工批准）；批准会重置计数，0 表示关闭。默认 3。｜范围:整数｜生效:下一会话
    denial_breaker_threshold: 3
    #: 命令黑名单｜不区分大小写的 fnmatch 通配模式列表，匹配的终端命令即使在 --yolo 或审批关闭时也会被阻止，例如 "git push --force*"。｜范围:列表｜生效:下一会话
    deny: []
    #: 审批人｜聊天中可以响应审批/确认/澄清请求的人：["*"]-任何已准入成员（默认） []-仅请求者和管理员（及列出的 ID）。｜范围:列表｜生效:下一会话
    approvers: ['*']
    #: 重载 MCP 前确认｜执行 /reload-mcp 前先确认（重载会使提示缓存失效）。选择“始终批准”后会设为关闭。默认开启。｜范围:true/false｜生效:下一会话
    mcp_reload_confirm: true
    #: 破坏性命令确认｜/clear、/new、/reset、/undo 等会丢弃状态的命令执行前先确认。默认开启。｜范围:true/false｜生效:下一会话
    destructive_slash_confirm: true

  # ---- 插件 ----
  plugins:
    #: 插件克隆超时｜单次插件 Git 克隆/拉取/检出的超时秒数（单次网络操作最长 1 小时）。默认 300。｜范围:整数｜生效:下一会话
    clone_timeout_seconds: 300
    #: 插件钩子超时｜进程内 Python 插件钩子回调的墙钟时长上限（秒）；pre_tool_call 超时按拒绝处理；0 表示不限制，超过 600 会被钳制。默认 30。｜范围:整数｜生效:下一会话
    hook_callback_timeout: 30
    #: 插件加载超时｜单个插件导入与 register() 的时限（秒），超时则跳过该插件（原因“load timed out”），其余继续加载；0 表示不限制，超过 600 会被钳制。默认 10。｜范围:整数｜生效:下一会话
    load_timeout_seconds: 10
    #: 插件更新检查间隔｜只读检查插件更新的间隔小时数；0 表示关闭。应用更新仍需显式操作或开启自动应用。默认 24。｜范围:整数｜生效:下一会话
    auto_update_check_hours: 24
    #: 自动应用插件更新｜无人值守自动应用目录插件与跟踪 git 插件的更新（经过相同的扫描/同意流程）。默认关闭。｜范围:true/false｜生效:下一会话
    auto_apply: false
    #: 插件隔离方式｜第三方 Python 插件的运行位置：in_process-导入主进程运行（默认），host-在每个配置档独立的插件宿主进程中运行，崩溃不影响主程序。｜范围:in_process|host｜生效:下一会话
    isolation: in_process
    host:
      #: 插件宿主启动器｜插件宿主进程的 argv 前缀（如沙箱运行器）；[] 表示普通子进程。｜范围:列表｜生效:下一会话
      launcher: []

  # ---- 认证 ----
  auth:
    #: 借用外部登录｜当 PDR 智能体自身没有可用登录时，自动借用并刷新 Codex CLI / Claude Code 的登录凭据。关闭则只使用 PDR 智能体自己的登录（两个程序共用一个登录可能互相登出）。默认开启。｜范围:true/false｜生效:下一会话
    adopt_external_logins: true
    #: Codex 登录方式｜登录 OpenAI Codex 的方式：device_code-打开网址并输入验证码（默认） browser-本地回调（localhost:1455）的授权码 + PKCE 浏览器登录，适用于禁用设备码授权的组织；端口被占用时回退为设备码。｜范围:device_code|browser｜生效:下一会话
    codex_login_flow: device_code

  # ---- 安全 ----
  security:
    #: 允许访问私有地址｜允许网页、视觉、媒体工具及云/CDP 浏览器访问私有 IP 地址（不影响本地/边车 Chromium）。默认关闭。｜范围:true/false｜生效:下一会话
    allow_private_urls: false
    #: Fake-IP 网段｜本地 TUN 代理（Mihomo/Clash fake-ip、Surge 增强模式）用于应答 DNS 的 CIDR 网段；这些网段内的地址视为代理占位地址而非内网主机。留空按常规私有地址判定。｜范围:列表｜生效:下一会话
    fake_ip_ranges: []
    #: 脱敏密钥信息｜在输出与日志中自动遮蔽 API Key、Token 等机密信息。默认开启。｜范围:true/false｜生效:下一会话
    redact_secrets: true
    #: 脱敏电话号码｜遮蔽回复和聊天中的 E.164 电话号码；关闭后仅显示电话号码，其他机密仍会脱敏。默认开启。｜范围:true/false｜生效:下一会话
    redact_phone_numbers: true
    #: 允许训练数据级别｜确认在非交互模式下允许切换到会用提示词训练的服务商级别（启动时仍会警告）。默认关闭。｜范围:true/false｜生效:下一会话
    allow_data_training_tiers_noninteractive: false
    approval:
      #: 审批呈现通道｜人工审批请求的呈现通道：builtin-使用内置的 CLI/TUI/网关/ACP 界面（默认）；填写插件名则使用该插件通道。｜范围:字符串｜生效:下一会话
      transport: builtin
      #: 审批通道回退｜审批通道超时/出错/响应无效时的处理：deny-直接拒绝（默认） builtin-回退到内置审批界面。｜范围:deny|builtin｜生效:下一会话
      transport_fallback: deny
    #: 保护指令文件｜写入智能体指令文件（AGENTS.md、CLAUDE.md、SOUL.md、.cursorrules、项目内 .hermes 配置）始终需要人工审批，即使在 yolo 模式下。默认开启。｜范围:true/false｜生效:下一会话
    protected_instruction_files: true
    #: 额外保护文件模式｜额外需要保护的文件名通配模式（匹配文件名），例如 "*.mdc"。｜范围:列表｜生效:下一会话
    protected_instruction_extra_patterns: []
    website_blocklist:
      #: 启用网站黑名单｜启用网站访问黑名单。默认关闭。｜范围:true/false｜生效:下一会话
      enabled: false
      #: 黑名单域名｜禁止访问的域名列表。｜范围:列表｜生效:下一会话
      domains: []
      #: 共享黑名单文件｜共享的黑名单文件路径列表，文件中的域名会一并加入黑名单。｜范围:列表｜生效:下一会话
      shared_files: []
    #: 已确认安全公告｜用户已阅读并处理的供应链安全公告 ID 列表，已确认的公告不再在启动时提示。｜范围:列表｜生效:下一会话
    acked_advisories: []
    #: 允许按需安装依赖｜首次启用某个需要额外依赖的后端（如 elevenlabs）时，自动从 PyPI 安装其依赖包；关闭则需手动安装（适用于受限/离线环境）。默认开启。｜范围:true/false｜生效:下一会话
    allow_lazy_installs: true

  # ---- 定时任务 ----
  cron:
    #: 补跑错过的任务｜开启时补跑错过的周期任务；关闭则跳过超出宽限窗口的错过任务。默认开启。｜范围:true/false｜生效:下一会话
    catch_up_missed: true
    #: 允许智能体建定时任务｜允许定时任务中运行的智能体使用 cronjob 工具集创建任务；默认关闭以防无人值守的调度循环。｜范围:true/false｜生效:下一会话
    allow_agent_scheduling: false
    #: 定时任务预检｜派发前校验 API 密钥、技能与投递平台是否就绪，失败时标记 blocked_config 并告警一次，不调用 LLM；关闭则在运行中失败。默认开启。｜范围:true/false｜生效:下一会话
    preflight: true
    #: 定时任务模型｜定时任务默认使用的模型；优先级：任务固定模型 > cron.model > 主模型。留空则跟随主模型。｜范围:字符串｜生效:下一会话
    model: ''
    #: 定时任务模型提供商｜与 cron.model 配套的推理提供商（不是调度器提供商）；留空按全局配置解析。｜范围:字符串｜生效:下一会话
    model_provider: ''
    #: 调度器提供商｜决定任务何时触发的调度器：留空-内置进程内 60 秒定时器，或填写已安装的调度插件名（如 chronos）；不可用时回退内置。｜范围:字符串｜生效:下一会话
    provider: ''
    chronos:
      #: Chronos Portal 地址｜Chronos 调度所用的 NAS/Portal 基础地址（负责设置/取消一次性任务并签发触发 JWT）。默认 https://portal.nousresearch.com。｜范围:字符串｜生效:下一会话
      portal_url: https://portal.nousresearch.com
      #: Chronos 回调地址｜本智能体可公网访问的基础地址，NAS 会 POST 到 {callback_url}/api/cron/fire；留空则 Chronos 不可用并回退内置定时器。｜范围:字符串｜生效:下一会话
      callback_url: ''
      #: JWT 受众｜触发 JWT 预期的 audience 值（如 agent:{instance_id}）。｜范围:字符串｜生效:下一会话
      expected_audience: ''
      #: NAS JWKS 地址｜用于校验触发 JWT 签名的 JWKS 地址；留空则拒绝所有令牌。｜范围:字符串｜生效:下一会话
      nas_jwks_url: ''
    #: 包装任务输出｜投递定时任务结果时加上任务名标题和“智能体看不到此消息”页脚；关闭则输出干净内容。默认开启。｜范围:true/false｜生效:下一会话
    wrap_response: true
    delivery:
      #: 投递推送通知｜将定时任务投递标记为需推送通知（例如 Telegram 不静音）；关闭则静默投递。默认开启。｜范围:true/false｜生效:下一会话
      notify: true
    #: 可续接投递｜让定时任务投递可被回复续接（结果进入目标会话上下文/线程）；关闭则投递仅存在于任务自身会话。默认关闭。｜范围:true/false｜生效:下一会话
    mirror_delivery: false
    #: 最大并行任务数｜每次调度最多并行运行的到期任务数；留空/0 表示不限制，1 表示串行。｜范围:可空｜生效:下一会话
    max_parallel_jobs: null
    #: 输出保留份数｜每个任务保留的最近输出 .md 文件数；0 或负数表示不清理。默认 50。｜范围:整数｜生效:下一会话
    output_retention: 50
    #: 脚本任务超时｜无智能体的脚本型定时任务超时秒数。默认 3600。｜范围:整数｜生效:下一会话
    script_timeout_seconds: 3600
    #: 会话库初始化超时｜定时任务中打开/迁移会话数据库（state.db）的超时秒数；0 表示不限制。默认 10。｜范围:整数｜生效:下一会话
    session_db_timeout_seconds: 10
    #: 媒体发送超时｜网关投递时每个媒体附件的发送超时秒数。默认 300。｜范围:整数｜生效:下一会话
    media_send_timeout_seconds: 300
    #: 要求重启安全作用域｜无用户会话的 systemd 网关中：false-以外部子进程直接运行任务（警告一次，无 cgroup 隔离），true-拒绝运行并提示启用 linger。默认关闭。｜范围:true/false｜生效:下一会话
    require_restart_safe_scope: false
    #: 重复失败提醒间隔｜同一错误重复失败时，首次告警后静默该小时数再提醒一次；0 表示每次失败都告警。默认 6。｜范围:整数｜生效:下一会话
    failure_repeat_alert_hours: 6

  # ---- 看板 ----
  kanban:
    #: 创建时自动订阅｜从有持久投递通道的会话创建看板任务时，自动订阅其完成与阻塞事件。默认开启。｜范围:true/false｜生效:下一会话
    auto_subscribe_on_create: true
    #: 网关投递看板通知｜由本网关轮询并投递看板订阅通知；不负责通知的配置档可关闭以省去空闲探测。默认开启。｜范围:true/false｜生效:下一会话
    notify_in_gateway: true
    #: 网关内运行调度器｜在网关进程内运行看板调度器；单独部署调度器或不希望网关派生执行者时关闭。默认开启。｜范围:true/false｜生效:下一会话
    dispatch_in_gateway: true
    #: 自动派发评审｜自动认领评审列中的任务，并用内置 sdlc-review 技能启动指派的配置档；全部手动评审时可关闭。默认开启。｜范围:true/false｜生效:下一会话
    review_dispatch: true
    #: 调度间隔｜看板调度器两次运行之间的秒数；越小响应越快，越大数据库压力越小。默认 60。｜范围:整数｜生效:下一会话
    dispatch_interval_seconds: 60
    #: 连续失败上限｜同一任务/配置档连续非成功尝试达到该次数后自动阻塞；重新指派会重置计数。默认 2。｜范围:整数｜生效:下一会话
    failure_limit: 2
    #: 执行者日志轮转大小｜执行者 stdout/stderr 日志在启动时轮转的字节阈值。默认 2 MiB。｜范围:整数｜生效:下一会话
    worker_log_rotate_bytes: 2097152
    #: 日志备份份数｜执行者日志轮转保留的备份数。默认 1。｜范围:整数｜生效:下一会话
    worker_log_backup_count: 1
    #: 编排配置档｜Triage 拆解后根/编排任务使用的配置档；留空为 default 配置档。｜范围:字符串｜生效:下一会话
    orchestrator_profile: ''
    #: 默认指派对象｜编排者无法匹配已安装配置档时的默认指派对象；留空为 default 配置档。｜范围:字符串｜生效:下一会话
    default_assignee: ''
    #: 全局运行任务上限｜整机同时处于运行状态的任务数上限（跨所有看板与调度通道）；留空则按内存推算（约 总内存/512MiB，限制在 2~8），无法读取内存时不限制。｜范围:可空｜生效:下一会话
    max_in_progress: null
    #: 单配置档运行上限｜单个配置档同时运行的执行者数上限，超出任务延到下次调度；留空表示不限制。｜范围:可空｜生效:下一会话
    max_in_progress_per_profile: null
    #: 可认领配置档｜多个主目录共享看板时，本调度器可认领的配置档名称（列表或逗号分隔）；留空表示任何已有配置档，设置后严格限制（空列表不认领任何任务）。｜范围:可空｜生效:下一会话
    dispatch_profiles: null
    #: 自动拆解｜每次调度自动对 Triage 任务运行拆解器；关闭则需手动执行 decompose 或在仪表盘点击。默认开启。｜范围:true/false｜生效:下一会话
    auto_decompose: true
    #: 每次拆解数量｜每次调度最多拆解的 Triage 任务数，限制辅助 LLM 突发调用。默认 3。｜范围:整数｜生效:下一会话
    auto_decompose_per_tick: 3
    #: 心跳超时回收｜运行中任务超过该秒数无心跳即回收至就绪状态（先终止仍在运行的本地执行者）；0 表示关闭。默认 14400。｜范围:整数｜生效:下一会话
    dispatch_stale_timeout_seconds: 14400
    #: 修复孤儿任务｜每次调度重新排队认领记录损坏且执行者已退出的运行中任务；关闭则保留现场供人工排查。默认开启。｜范围:true/false｜生效:下一会话
    reconcile_orphans: true
    #: 完成订阅保留天数｜从不归档的看板上，已完成且无活动超过该天数的任务订阅会被清理；0 表示关闭。默认 30。｜范围:整数｜生效:下一会话
    done_sub_retention_days: 30

  # ---- Bot 模式 ----
  bot_mode:
    #: 消息信封有效期｜Bot 模式跨连接消息在发件箱中的有效秒数，过期不再投递并回复发送方 queued_expired；0 表示不过期。默认 900。｜范围:整数｜生效:下一会话
    envelope_ttl_seconds: 900
    #: 目标忙碌等待时长｜投递到忙碌的目标配置档时排队等待当前轮结束的最长秒数，超时返回 target_busy 错误。默认 120。｜范围:整数｜生效:下一会话
    turn_wait_seconds: 120

  # ---- 代码执行 ----
  code_execution:
    #: 代码执行模式｜execute_code 的运行方式：project-在会话工作目录使用当前 venv/conda 的 Python（可用项目依赖），strict-在隔离临时目录使用 PDR 智能体自身的 Python（最大隔离）。默认 project。｜范围:project|strict｜生效:下一会话
    mode: project
    #: 内核空闲超时｜会话代码内核空闲超过该秒数后被关闭。默认 1800。｜范围:整数｜生效:下一会话
    kernel_idle_timeout: 1800
    #: 最大会话内核数｜同时保留的会话代码内核数量上限，超出按 LRU 淘汰。默认 4。｜范围:整数｜生效:下一会话
    max_session_kernels: 4

  # ---- 工具 ----
  tools:
    tool_search:
      #: 工具搜索｜工具搜索模式：用 tool_search/tool_describe/tool_call 桥接工具替代延迟加载的工具，按需展开。auto/on-存在延迟工具时启用（默认 auto） off-关闭，所有工具直接提供给模型。｜范围:字符串｜生效:下一会话
      enabled: auto
      #: 清单预算比例｜工具清单预算占模型上下文长度的百分比（0~100），实际预算取此值与 listing_max_tokens 的较小者。默认 5。｜范围:整数｜生效:下一会话
      threshold_pct: 5
      #: 默认搜索条数｜模型未指定 limit 时每次工具搜索返回的条数，默认 5。｜范围:整数｜生效:下一会话
      search_default_limit: 5
      #: 最大搜索条数｜模型每次查询可请求的最大条数（1~50），默认 25。｜范围:整数｜生效:下一会话
      max_search_limit: 25
      #: 嵌入工具清单｜是否在桥接工具描述中嵌入工具目录：auto-放得下时嵌入，否则降级为仅名称（默认） on-同 auto，显式开启 off-始终只提供桥接工具。｜范围:auto|on|off｜生效:下一会话
      listing: auto
      #: 清单 Token 上限｜嵌入工具清单的绝对 Token 上限（200~60000），默认 4000。｜范围:整数｜生效:下一会话
      listing_max_tokens: 4000
      #: 延迟加载工具｜默认由桥接工具代替、按需加载的工具名列表（如 computer_use、session_search、image_generate 等）；填写后整体替换默认列表，[] 表示全部直接加载。｜范围:列表｜生效:下一会话
      defer: [computer_use, session_search, image_generate, todo_list, process_manage, cronjob_manage, browser_vault, text_to_speech, manage_connections, drive_preview, gui_tour, desktop_preview, annotate_preview, manage_catalog, show_tip, desktop_project, close_terminal, set_theme, read_terminal, read_window_below, focus_pane]
    connectors:
      #: 启用远程连接器｜通过工具网关发现和管理远程连接器；还需要已登录门户账号才可用。默认开启。｜范围:true/false｜生效:下一会话
      enabled: true

  # ---- 日志 ----
  logging:
    #: 日志级别｜agent.log 记录的最低日志级别：DEBUG-调试详细信息 INFO-常规信息（默认） WARNING-仅警告及以上 ERROR-仅错误。｜范围:DEBUG|INFO|WARNING|ERROR｜生效:重启
    level: INFO
    #: 日志文件大小｜单个日志文件轮转前的最大大小（MB），默认 5。｜范围:整数｜生效:重启
    max_size_mb: 5
    #: 日志备份数量｜保留的轮转日志备份数量，默认 3。｜范围:整数｜生效:重启
    backup_count: 3

  # ---- 模型目录 ----
  model_catalog:
    #: 远程模型目录｜从远程地址获取精选的 OpenRouter / Nous Portal 模型列表（失败时使用内置快照），使模型选择列表无需升级即可更新。默认开启。｜范围:true/false｜生效:下一会话
    enabled: true
    #: 模型目录地址｜远程模型目录清单的 URL。｜范围:字符串｜生效:下一会话
    url: https://hermes-agent.nousresearch.com/docs/api/model-catalog.json
    #: 目录缓存时长｜模型目录磁盘缓存的有效期（分钟），网络失败时继续使用过期缓存。默认 20。｜范围:整数｜生效:下一会话
    ttl_minutes: 20
    #: 自建模型清单地址｜按提供商覆盖模型精选清单的地址（同一 schema），如 openrouter: {url: ...}。默认空。｜范围:键值对｜生效:下一会话
    providers: {}

  # ---- models.dev 元数据 ----
  models_dev:
    #: models.dev 地址｜模型注册表（上下文窗口、能力、价格）的获取地址，可指向镜像；留空为默认 https://models.dev/api.json。｜范围:字符串｜生效:下一会话
    url: ''

  # ---- 网络 ----
  network:
    #: 强制 IPv4｜跳过 IPv6 仅使用 IPv4，避免 IPv6 不可用时连接长时间挂起。默认关闭。｜范围:true/false｜生效:重启
    force_ipv4: false

  # ---- 监控 ----
  monitoring:
    #: 安装实例 ID｜附加在导出监控信号上的稳定实例标识，便于运维区分实例；留空则首次使用时自动生成 UUID，清空可轮换。不含任何账号身份信息。｜范围:字符串｜生效:重启
    install_id: ''
    gateway_health_export:
      #: 导出网关健康数据｜通过 OTLP 向运维端点导出网关健康与脱敏诊断数据（不含提示词、消息、工具参数等内容）。默认关闭。｜范围:true/false｜生效:重启
      enabled: false
      #: 导出指标｜导出网关运行指标。默认开启（需总开关启用）。｜范围:true/false｜生效:重启
      metrics_enabled: true
      #: 导出诊断事件｜导出诊断事件。默认开启（需总开关启用）。｜范围:true/false｜生效:重启
      diagnostic_events_enabled: true
      #: 导出警告错误事件｜导出警告与错误事件。默认开启（需总开关启用）。｜范围:true/false｜生效:重启
      warning_error_events_enabled: true
      #: 指标导出间隔｜指标导出间隔（秒），默认 60。｜范围:整数｜生效:重启
      export_interval_seconds: 60
      #: 日志导出间隔｜日志事件导出间隔（秒），默认 5。｜范围:整数｜生效:重启
      logs_export_interval_seconds: 5
      resource_attributes:
        #: 服务名称｜导出数据中的 service.name 资源属性，默认 hermes-gateway。｜范围:字符串｜生效:重启
        "service.name": hermes-gateway
        #: 部署环境名称｜导出数据中的 deployment.environment.name 资源属性，默认 production。｜范围:字符串｜生效:重启
        "deployment.environment.name": production
    export:
      otlp:
        #: 启用 OTLP 导出｜启用 OTLP 导出目标。默认关闭。｜范围:true/false｜生效:重启
        enabled: false
        #: OTLP 端点｜OTLP 接收端地址（如 OTEL Collector、DataDog）。｜范围:字符串｜生效:重启
        endpoint: ''
        #: OTLP 请求头环境变量｜OTLP 导出请求头名 → 存放其值的环境变量名（值本身放 .env）。默认空。｜范围:键值对｜生效:重启
        headers_env: {}

  # ---- 托管房间 ----
  hosted_rooms:
    discussion:
      #: 讨论最大轮数｜托管房间中每次讨论的最大轮数（正整数），修改后需重启所属服务。默认 3。｜范围:整数｜生效:下一会话
      max_rounds: 3
      #: 讨论最大消息数｜托管房间中每次讨论的最大消息数（正整数），修改后需重启所属服务。默认 10。｜范围:整数｜生效:下一会话
      max_messages: 10

  # ---- 消息网关 ----
  gateway:
    #: 非托管网关空闲退出｜由客户端自动启动的网关空闲多少秒后退出；0 表示禁用。默认 600。｜范围:整数｜生效:重启
    unmanaged_idle_exit_seconds: 600
    #: 中断宽限时间｜收到 SIGTERM 后被中断的智能体在销毁前可收尾的秒数，默认 1。｜范围:整数｜生效:重启
    signal_interrupt_grace_timeout: 1
    #: 系统服务安装选择｜是否将网关安装为系统服务的记录：留空-未选择 install-安装 decline-拒绝。｜范围:install|decline｜生效:重启
    service_install_choice: null
    #: 投递记录账本｜在数据库中记录最终回复的投递状态；网关在发送确认前崩溃时，重启后会重新投递（可能重复，至少投递一次）。关闭则崩溃时可能丢失正在投递的回复。默认开启。｜范围:true/false｜生效:重启
    delivery_ledger: true
    #: 平台连接超时｜启动或重连时等待单个消息平台连接完成的秒数，默认 30；Discord 斜杠命令很多时可调大。0 或负数表示无限等待。｜范围:整数｜生效:重启
    platform_connect_timeout: 30
    #: 事件循环看门狗｜守护线程探测 asyncio 事件循环，连续未响应时转储线程堆栈并以重启码退出，由 systemd/launchd 拉起，避免僵死。默认开启。｜范围:true/false｜生效:重启
    loop_watchdog: true
    #: 看门狗探测间隔｜两次探测之间的秒数，默认 30。｜范围:小数｜生效:重启
    loop_watchdog_probe_interval_s: 30.0
    #: 看门狗探测超时｜探测超过多少秒未被处理即记为一次失败，默认 10。｜范围:小数｜生效:重启
    loop_watchdog_probe_timeout_s: 10.0
    #: 看门狗最大失败次数｜连续失败多少次后强制退出重启，默认 3。｜范围:整数｜生效:重启
    loop_watchdog_max_strikes: 3
    #: 数据库调用检查｜调试用：检测在事件循环上执行的会话数据库调用：off-关闭（默认） warn-每处记录一次警告 raise-直接报错。｜范围:off|warn|raise｜生效:重启
    sessiondb_loop_guard: 'off'
    #: 允许所有用户｜允许所有用户使用机器人，无需白名单（安全相关，需谨慎）。默认关闭。｜范围:true/false｜生效:重启
    allow_all_users: false
    bot_loop_guard:
      #: 机器人互聊保护｜防止机器人之间无限对话循环。默认开启。｜范围:true/false｜生效:重启
      enabled: true
      #: 窗口内最大事件数｜时间窗口内允许的机器人消息数，超过后进入冷却。默认 20。｜范围:整数｜生效:重启
      max_events: 20
      #: 统计时间窗口｜统计机器人消息数的时间窗口（秒），默认 300。｜范围:整数｜生效:重启
      window_seconds: 300
      #: 冷却时长｜触发保护后的冷却时间（秒），默认 600。｜范围:整数｜生效:重启
      cooldown_seconds: 600
      #: 最大往返次数｜单次交流中允许的机器人消息往返次数，默认 4。｜范围:整数｜生效:重启
      max_hops: 4
      #: 机器人回复期待应答｜将机器人的回复视为期待再次应答的消息。默认关闭。｜范围:true/false｜生效:重启
      bot_replies_expect_reply: false
    #: 启动看门狗｜进程启动时启用看门狗，若在期限内事件循环未就绪则强制退出重启。默认开启。｜范围:true/false｜生效:重启
    startup_watchdog: true
    #: 启动看门狗超时｜启动看门狗的期限（秒），默认 300。｜范围:整数｜生效:重启
    startup_watchdog_timeout_seconds: 300
    #: 写入 sessions.json｜继续写入旧版 sessions/sessions.json 路由索引镜像（主副本在数据库中），供外部工具和降级使用。默认开启。｜范围:true/false｜生效:重启
    write_sessions_json: true
    #: 多配置档复用网关｜主机上所有配置档共用一个网关：默认配置档的网关同时连接各配置档的机器人（各自独立的密钥与配置）。这是唯一支持的拓扑，设为 false 会被警告并忽略。默认开启。｜范围:true/false｜生效:重启
    multiplex_profiles: true
    #: 自动迁移为复用网关｜升级后是否自动将多配置档安装迁移为单一复用网关；关闭则由你手动决定何时迁移。默认开启。｜范围:true/false｜生效:重启
    auto_multiplex_migration: true
    #: 配置档路由规则｜将默认配置档机器人收到的聊天路由到其他配置档的规则列表，每项含 profile、platform 以及 chat_id/user_id/guild_id 等匹配条件，最具体的规则优先。｜范围:列表｜生效:重启
    profile_routes: []
    scale_to_zero:
      #: 缩容空闲超时｜启用缩容到零（scale-to-zero）时，空闲多少分钟后让中继传输进入休眠以便平台挂起机器；0 或负数使用默认值。默认 2。｜范围:整数｜生效:重启
      idle_timeout_minutes: 2
    restart_loop_guard:
      #: 重启循环上限｜自动恢复会话导致连续重启的次数上限，超过后本次启动跳过自动恢复（仍正常处理消息）；0 表示禁用。默认 3。｜范围:整数｜生效:重启
      max_restarts: 3
      #: 重启统计窗口｜判定连续重启的最小时间窗口（秒），默认 60。｜范围:整数｜生效:重启
      window_seconds: 60
      #: 重启最大间隔｜两次启动间隔不超过多少秒视为同一重启链，默认 300。｜范围:整数｜生效:重启
      max_gap_seconds: 300
    respawn_storm:
      #: 重启风暴阈值｜滑动窗口内允许的启动次数，超过后启动前进行指数退避等待；0 或负数表示禁用。默认 5。｜范围:整数｜生效:重启
      max_starts: 5
      #: 重启风暴窗口｜统计启动次数的滑动窗口（秒），默认 120。｜范围:整数｜生效:重启
      window_seconds: 120
    message_timestamps:
      #: 消息时间戳｜在模型上下文中为用户消息添加时间戳前缀（如 [Tue 2026-04-28 13:40:53 CEST]），增强时间感知；保存的记录不受影响。默认关闭。｜范围:true/false｜生效:重启
      enabled: false
    #: 入站媒体大小上限｜网关接收图片/音频/视频时允许缓冲到内存并缓存的最大字节数，防止超大文件导致内存溢出；0 表示不限。默认 134217728（128MiB）。｜范围:整数｜生效:重启
    max_inbound_media_bytes: 134217728
    #: 使用环境代理设置｜允许各平台适配器读取 HTTP_PROXY/HTTPS_PROXY/NO_PROXY/SSL_CERT_FILE 等环境变量并自动检测系统代理；若网关继承了不该使用的代理可关闭（各平台专用代理变量仍有效）。默认开启。｜范围:true/false｜生效:重启
    trust_env: true
    #: 严格媒体投递｜开启后，仅允许投递缓存目录、允许目录列表中或最近生成的文件，防止提示词注入窃取主机机密（推荐公开网关开启）；关闭则除系统/凭据敏感路径外均可投递。默认关闭。｜范围:true/false｜生效:重启
    strict: false
    #: 媒体投递允许目录｜允许上传文件的额外根目录（项目目录、挂载共享等）绝对路径列表，缓存目录始终受信任。严格与非严格模式均生效。｜范围:列表｜生效:重启
    media_delivery_allow_dirs: []
    #: 信任最近文件｜严格模式下，信任修改时间在 trust_recent_files_seconds 内的文件（即使不在允许目录中），系统路径仍被阻止；关闭则为纯白名单模式。默认开启。｜范围:true/false｜生效:重启
    trust_recent_files: true
    #: 最近文件时间窗口｜判定为“最近文件”的时间窗口（秒），仅在严格模式下生效。默认 600。｜范围:整数｜生效:重启
    trust_recent_files_seconds: 600
    api_server:
      #: API 最大并发运行｜OpenAI 兼容 API 服务的最大并发智能体运行数，超出返回 HTTP 429；0 表示不限。默认 10。｜范围:整数｜生效:重启
      max_concurrent_runs: 10
      #: 历史工具输出上限｜存储的 /v1/responses 对话历史中，每条工具输出和参数的最大字符数；0 表示原样存储。默认 0。｜范围:整数｜生效:重启
      history_tool_output_max_chars: 0

  # ---- 流式输出 ----
  streaming:
    #: 流式输出｜向消息平台实时流式推送回复（修改后需重启网关）；关闭则每次回复作为一条完整消息发送。会额外消耗编辑/草稿 API 调用。默认关闭。｜范围:true/false｜生效:下一会话
    enabled: false
    #: 流式传输方式｜流式推送方式：auto-支持时用原生草稿（Telegram 私聊），其他平台用编辑消息（默认） draft-使用草稿，不支持时回退编辑 edit-仅逐步编辑消息 off-关闭。｜范围:auto|draft|edit|off｜生效:下一会话
    transport: auto
    #: 编辑最小间隔｜两次逐步编辑之间的最小秒数（Telegram 约每秒 1 次限制），默认 0.8。｜范围:小数｜生效:下一会话
    edit_interval: 0.8
    #: 缓冲刷新阈值｜累积多少字符后刷新缓冲区，使短回复感觉即时。默认 24。｜范围:整数｜生效:下一会话
    buffer_threshold: 24
    #: 流式光标｜附加在生成中消息末尾的光标字符，默认 ▉。｜范围:字符串｜生效:下一会话
    cursor: ' ▉'
    #: 最终消息重发阈值｜仅 Telegram：大于 0 时，若预览已显示至少这么多秒，最终结果作为新消息发送，使时间戳反映完成时间。默认 0（关闭）。｜范围:小数｜生效:下一会话
    fresh_final_after_seconds: 0.0

  # ---- 会话管理 ----
  sessions:
    #: 自动清理会话｜定期删除超过保留天数且已结束的会话（打开、置顶或进行中的会话不会删除）。默认关闭（删除历史需主动开启）。｜范围:true/false｜生效:下一会话
    auto_prune: false
    #: 会话保留天数｜已结束会话历史的保留天数（按最后活动时间计算），默认 90。｜范围:整数｜生效:下一会话
    retention_days: 90
    #: 自动归档会话｜将长时间无活动的会话自动归档（仅隐藏，不删除），置顶会话除外。默认关闭。｜范围:true/false｜生效:下一会话
    auto_archive: false
    #: 自动归档天数｜会话空闲多少天后自动归档（需开启自动归档），默认 3。｜范围:整数｜生效:下一会话
    auto_archive_days: 3
    #: 显示子智能体会话｜在会话列表（桌面侧边栏、仪表盘）中显示子智能体运行记录，嵌套在父会话下。默认关闭。｜范围:true/false｜生效:下一会话
    show_subagents: false
    #: 清理后压缩数据库｜清理删除数据后执行 VACUUM 回收磁盘空间（会短暂阻塞写入，仅在启动时且碎片超过 25% 时执行）。默认开启。｜范围:true/false｜生效:下一会话
    vacuum_after_prune: true
    #: 压缩最小间隔｜两次 VACUUM 之间的最少天数，默认 30。｜范围:整数｜生效:下一会话
    min_vacuum_interval_days: 30
    #: 维护最小间隔｜两次自动维护（清理/归档）之间的最少小时数，默认 24。｜范围:整数｜生效:下一会话
    min_interval_hours: 24
    #: 全文索引优化提示｜关于紧凑全文索引布局（可回收约 60% 数据库空间）的提示：advise-升级时提示可回收空间（默认） require-以“必需”措辞提示 off-不提示。｜范围:advise|require|off｜生效:下一会话
    fts_optimize_notice: advise
    #: 慢搜索阈值｜会话搜索耗时达到此毫秒数时记录一条日志；0 表示记录每次搜索。默认 1000。｜范围:整数｜生效:下一会话
    search_slow_ms: 1000
    #: 恢复会话消息上限｜交互式恢复会话时允许加载的最大活跃消息数，防止超大会话耗尽内存；0 表示不限。默认 20000。｜范围:整数｜生效:下一会话
    max_resume_messages: 20000
    #: 导出消息上限｜导出单个会话时允许的最大消息数；0 表示不限。默认 20000。｜范围:整数｜生效:下一会话
    max_export_messages: 20000
    #: 无人查看会话结束｜本地会话在轮次结束后无人查看多少秒即标记结束（仍可恢复）；0 表示永不。默认 300。｜范围:小数｜生效:下一会话
    orphan_end_grace_s: 300.0

  # ---- 引导 ----
  onboarding:
    #: 已展示的引导提示｜系统自动记录已展示过的首次引导提示，一般无需手动修改。默认空。｜范围:键值对｜生效:下一会话
    seen: {}
    #: 首次画像引导｜首次对话时的引导方式：ask-主动提议建立用户画像，off-仅普通自我介绍。默认 ask。｜范围:ask|off｜生效:下一会话
    profile_build: ask
    #: 桌面端首次运行状态｜桌面端首次运行引导状态（仅根配置档）：留空-全新安装，true-下次启动时运行，false-已完成。｜范围:true|false｜生效:下一会话
    run: null

  # ---- 遥测 ----
  telemetry:
    shared_metrics:
      #: 收集匿名指标｜在本地收集隐私安全的聚合指标。默认关闭。｜范围:true/false｜生效:重启
      enabled: false
      #: 上传匿名指标｜将收集的聚合指标上传（需同时开启收集）。默认关闭。｜范围:true/false｜生效:重启
      send: false
      #: 指标上传地址｜聚合指标的接收端点；非 HTTPS 地址仅允许 localhost。｜范围:字符串｜生效:重启
      endpoint: https://telemetry.nousresearch.com/v1/telemetry

  # ---- 诊断 ----
  doctor:
    #: 诊断探测超时｜`doctor --live` 实际调用探测的单次超时秒数。默认 10。｜范围:整数｜生效:下一会话
    live_probe_timeout: 10

  # ---- 更新 ----
  updates:
    #: 检查更新｜启用被动的版本/横幅更新检查（显式 update --check 始终可用）。默认开启。｜范围:true/false｜生效:下一会话
    check: true
    #: 更新前备份｜更新前的安全备份：quick-快照关键小文件（配置、.env、定时任务等，跳过 >1GiB），full-quick 加完整备份 zip，off-不备份。默认 quick。｜范围:quick|full|off｜生效:下一会话
    pre_update_backup: quick
    #: 保留备份份数｜保留的完整备份 zip 数量（至少 1），快速快照始终只保留 1 份。默认 5。｜范围:整数｜生效:下一会话
    backup_keep: 5
    #: 非交互更新本地改动｜在聊天应用/网关中更新 PDR 智能体（无终端提示）时如何处理未提交的本地源码修改：stash-暂存并在更新后重新应用，discard-丢弃。终端更新总是会询问。｜范围:stash|discard｜生效:下一会话
    non_interactive_local_changes: stash
    #: 自动切换停留分支｜代码停留在功能分支且工作区干净时，自动切换到更新目标分支（提交保留在原分支）；工作区有修改则跳过更新。默认开启。｜范围:true/false｜生效:下一会话
    auto_switch_parked_branch: true
    #: 停留分支策略｜停留分支有未合并提交时：switch-切换到更新目标（提交保留在原分支，不冲突），update_in_place-打标签后把目标分支合并进当前分支（冲突则停止）。默认 switch。｜范围:switch|update_in_place｜生效:下一会话
    parked_branch_strategy: switch
    #: 更新 cua-driver｜更新时同时刷新已安装的 cua-driver（仅 macOS）；在 /Applications 不可写的非管理员账户上请关闭。默认开启。｜范围:true/false｜生效:下一会话
    refresh_cua_driver: true

  # ---- 语言服务 ----
  lsp:
    #: 启用 LSP 诊断｜在 write_file/patch 后使用语言服务器（pyright、gopls、rust-analyzer 等）进行诊断检查，仅在 git 工作树中生效；关闭则完全不启动语言服务器。默认开启。｜范围:true/false｜生效:下一会话
    enabled: true
    #: 诊断等待模式｜诊断等待方式：document-仅等待当前文件的诊断（默认） full-同时请求整个工作区诊断（较慢）。｜范围:document|full｜生效:下一会话
    wait_mode: document
    #: 诊断等待超时｜等待诊断结果的最长秒数，默认 5。｜范围:小数｜生效:下一会话
    wait_timeout: 5.0
    #: 首次预热超时｜语言服务器尚未启动时首次请求的时间预算（含启动、初始化、首次构建）；0 表示与 wait_timeout 相同。默认 0。｜范围:小数｜生效:下一会话
    warmup_timeout: 0.0
    #: 故障重试间隔｜语言服务器失败后多少秒再重试；0 表示在进程生命周期内不再重试。默认 0。｜范围:小数｜生效:下一会话
    broken_retry_seconds: 0.0
    #: 排除的工作区｜不运行语言服务器的工作区根目录（glob 模式，支持 ~），例如超大的单体仓库。必须为列表。｜范围:列表｜生效:下一会话
    exclude_roots: []
    #: 受信任工作区｜允许语言服务器加载项目代码（项目虚拟环境、node_modules、构建文件等）的目录列表；启动目录与会话工作区始终受信任，其他检出仅运行不执行项目代码的服务器。｜范围:列表｜生效:下一会话
    trusted_workspaces: []
    #: 服务器安装策略｜缺少语言服务器时：auto-首次使用时通过 npm/go/pip 自动安装（默认） manual-仅使用 PATH 中已有程序 off-同 manual。｜范围:auto|manual|off｜生效:下一会话
    install_strategy: auto
    #: Node 包管理器｜安装 npm 类语言服务器使用的包管理器：npm（默认）、pnpm 或 yarn；指定的管理器未安装时跳过安装，不会静默回退。｜范围:字符串｜生效:下一会话
    package_manager: npm
    #: 服务器空闲超时｜语言服务器空闲多少秒后关闭（按需重启）；0 表示一直保留。默认 600。｜范围:小数｜生效:下一会话
    idle_timeout: 600.0
    #: 自定义语言服务｜自定义 LSP 服务：command 启动命令、extensions 文件扩展名、root_markers 根目录标记等；需手动安装。默认空。｜范围:键值对｜生效:下一会话
    servers: {}

  # ---- X 搜索 ----
  x_search:
    #: X 搜索模型｜X（Twitter）搜索调用的 xAI 模型，任何具备 x_search 能力的 Grok 模型均可，默认 grok-4.5。｜范围:字符串｜生效:下一会话
    model: grok-4.5
    #: X 搜索推理强度｜支持推理的模型使用的推理强度；留空保持模型默认。｜范围:可空｜生效:下一会话
    reasoning_effort: null
    #: X 搜索超时｜请求超时（秒，最少 30），复杂查询可能需要 60~120 秒。默认 180。｜范围:整数｜生效:下一会话
    timeout_seconds: 180
    #: X 搜索重试次数｜遇到 5xx、读取超时或连接错误时的重试次数，默认 2。｜范围:整数｜生效:下一会话
    retries: 2

  # ---- 保险库 ----
  vault:
    #: 保险库密钥存储｜新建凭据保险库的密钥存放方式：file-存为权限 0600 的 vault.key 文件（默认） keychain-存入系统钥匙串（不可用时回退文件）。｜范围:file|keychain｜生效:下一会话
    key_storage: file
    onepassword:
      #: 启用 1Password 登录源｜允许浏览器凭据保险库使用 1Password（op CLI）中带网址的登录项。默认开启。｜范围:true/false｜生效:下一会话
      enabled: true
      #: 1Password 账号｜op --account 使用的账号简称；留空使用默认账号。｜范围:字符串｜生效:下一会话
      account: ''
      #: op 程序路径｜op 可执行文件的绝对路径；留空从 PATH 查找。｜范围:字符串｜生效:下一会话
      binary_path: ''
      #: 服务账号令牌变量｜保存 1Password 服务账号令牌的环境变量名（无头认证，无需解锁提示），默认 OP_SERVICE_ACCOUNT_TOKEN。｜范围:字符串｜生效:下一会话
      service_account_token_env: OP_SERVICE_ACCOUNT_TOKEN
    bitwarden:
      #: 启用 Bitwarden 登录源｜允许浏览器凭据保险库使用 Bitwarden（bw CLI，密码管理器）登录项，需先执行一次 bw login。默认开启。｜范围:true/false｜生效:下一会话
      enabled: true
      #: bw 程序路径｜bw 可执行文件的绝对路径；留空从 PATH 查找。｜范围:字符串｜生效:下一会话
      binary_path: ''

  # ---- 密钥管理 ----
  secrets:
    bitwarden:
      #: 启用 Bitwarden 机密｜启动时从 Bitwarden Secrets Manager 拉取凭据（代替写入 .env）；关闭则不会连接 BSM，也不会自动安装 bws。默认关闭。｜范围:true/false｜生效:下一会话
      enabled: false
      #: 访问令牌变量｜保存机器账号访问令牌的环境变量名（应放在 .env 或 shell 中），默认 BWS_ACCESS_TOKEN。｜范围:字符串｜生效:下一会话
      access_token_env: BWS_ACCESS_TOKEN
      #: BSM 项目 ID｜要同步的 Bitwarden Secrets Manager 项目 UUID。｜范围:字符串｜生效:下一会话
      project_id: ''
      #: 机密缓存时长｜在再次请求 Bitwarden 前复用缓存的秒数；0 表示不复用缓存。默认 300。｜范围:整数｜生效:下一会话
      cache_ttl_seconds: 300
      encrypted_cache:
        #: 启用加密缓存｜网络/超时故障时回退使用 AES-GCM 加密的本地最近一次有效缓存（认证失败不回退）。默认关闭。｜范围:true/false｜生效:下一会话
        enabled: false
        #: 缓存最长过期时间｜加密缓存在故障时可继续使用的最长过期秒数，默认 0。｜范围:整数｜生效:下一会话
        max_stale_seconds: 0
      #: 覆盖已有环境变量｜BSM 中的值覆盖已有环境变量，使在 Bitwarden 中轮换后无需修改 .env 即生效。默认开启。｜范围:true/false｜生效:下一会话
      override_existing: true
      #: 自动安装 bws｜首次使用时自动下载 bws 到数据目录的 bin 下；关闭则需 bws 已在 PATH 中。默认开启。｜范围:true/false｜生效:下一会话
      auto_install: true
      #: Bitwarden 服务器地址｜传给 bws 的 BWS_SERVER_URL；留空为美国云，欧盟用 https://vault.bitwarden.eu，自托管填自己的地址。｜范围:字符串｜生效:下一会话
      server_url: ''
    onepassword:
      #: 启用 1Password 机密｜启动时通过 op CLI 从 1Password 读取凭据；关闭则从不调用 op。默认关闭。｜范围:true/false｜生效:下一会话
      enabled: false
      #: 1Password 变量映射｜环境变量名 → op://保险库/条目/字段，每项用一次 op read 解析。默认空。｜范围:键值对｜生效:下一会话
      env: {}
      #: 1Password 账号｜op read --account 使用的账号简称或登录地址；留空使用默认账号。｜范围:字符串｜生效:下一会话
      account: ''
      #: 服务账号令牌变量｜保存 1Password 服务账号令牌的环境变量名，用于无头认证；未设置则使用交互/桌面端会话。默认 OP_SERVICE_ACCOUNT_TOKEN。｜范围:字符串｜生效:下一会话
      service_account_token_env: OP_SERVICE_ACCOUNT_TOKEN
      #: op 程序路径｜op 可执行文件的绝对路径（避免依赖 PATH）；留空从 PATH 查找。｜范围:字符串｜生效:下一会话
      binary_path: ''
      #: 机密缓存时长｜在进程内和磁盘上缓存读取值的秒数；0 同时禁用两层缓存。默认 300。｜范围:整数｜生效:下一会话
      cache_ttl_seconds: 300
      #: 覆盖已有环境变量｜覆盖已有环境变量使轮换生效；关闭则以 .env 中的值为准。默认开启。｜范围:true/false｜生效:下一会话
      override_existing: true

  # ---- 桌面 Bot ----
  bot_desktop:
    #: 机器人桌面分辨率｜无头机器人桌面（Xfce 屏幕）的分辨率，默认 1440x900。｜范围:字符串｜生效:下一会话
    geometry: 1440x900
    #: 自动启动桌面｜computer_use 首次在无头主机上需要显示器时自动启动机器人桌面。默认关闭。｜范围:true/false｜生效:下一会话
    auto_start: false
    #: 最低空闲内存｜空闲内存低于此值（MB）时拒绝启动桌面，避免内存不足导致网关被杀；0 表示不检查。默认 1536。｜范围:整数｜生效:下一会话
    min_free_memory_mb: 1536
    #: 空闲停止时间｜桌面无人使用多少分钟后停止（下次使用时重启）；0 表示一直保持。默认 30。｜范围:整数｜生效:下一会话
    idle_stop_minutes: 30
    #: 桌面运行位置｜机器人桌面（及 computer_use、浏览器）的运行位置：auto-跟随终端后端（沙箱可承载时在沙箱内，local 时在网关主机；modal/daytona/vercel 无法承载时拒绝）（默认） terminal-始终在终端后端内 gateway-始终在网关主机上（在沙箱之外运行，需明确选择）。｜范围:auto|terminal|gateway｜生效:下一会话
    placement: auto

  # ---- 电脑操作 ----
  computer_use:
    #: cua-driver 遥测｜是否允许 cua-driver 上游的 PostHog 遥测；关闭（默认）时在子进程环境中设置 CUA_DRIVER_RS_TELEMETRY_ENABLED=0。｜范围:true/false｜生效:下一会话
    cua_telemetry: false
    #: 开机自启驱动｜仅 Windows：注册每次登录启动 cua-driver-serve 的计划任务（通过 SSH 操控 Windows 时需要）；关闭则按需启动。默认关闭。｜范围:true/false｜生效:下一会话
    autostart: false
    #: 原生 Wayland｜Linux 下存在 WAYLAND_DISPLAY 时，为 cua-driver 启用原生 Wayland 桥接。默认关闭。｜范围:true/false｜生效:下一会话
    native_wayland: false
    #: 截图最长边｜驱动截图最长边的像素上限，用于缩小多模态负载；0 表示不限制。默认 1456。｜范围:整数｜生效:下一会话
    max_image_dimension: 1456
    #: 操作后捕获模式｜每次操作后捕获屏幕的方式：som-截图加元素标注，ax-仅无障碍元素无图片（更快），vision-仅像素截图。默认 som。｜范围:som|ax|vision｜生效:下一会话
    capture_after_mode: som
    #: 无障碍元素上限｜每次捕获遍历无障碍树时收集的元素数上限，过大会显著变慢；0 表示使用驱动默认（2000）。默认 200。｜范围:整数｜生效:下一会话
    ax_max_elements: 200
    #: 禁用光标覆盖层｜是否禁用 cua-driver 光标覆盖层（空闲时可能占满 CPU）：留空-自动（macOS 与无头/WSL2 上禁用），true-始终禁用，false-始终启用。｜范围:cua|true|false｜生效:下一会话
    no_overlay: null
    #: 权限模式｜电脑操控的审批边界：standard-使用 cua-driver 自身审批，bounded-无运行时提示，能力清单以外的操作一律拒绝。不接受 unrestricted。默认 standard。｜范围:standard|cua|bounded｜生效:下一会话
    permission_mode: standard
    #: 能力清单路径｜bounded 权限模式下使用的已审核能力清单文件路径（支持 ~）。｜范围:字符串｜生效:下一会话
    capability_manifest: ''
    #: 允许未签名驱动｜仅 macOS：允许未签名的 CuaDriver.app 用于私有会话守护进程，仅供本地开发驱动使用。默认关闭。｜范围:true/false｜生效:下一会话
    allow_unsigned_driver: false

  # ---- 代理 ----
  proxy:
    #: 启用出站凭据代理｜仅 Docker：启用出站凭据防火墙（iron-proxy），沙箱中只看到占位令牌，出站时由代理替换为真实凭据。需先完成出站代理设置并启动；Modal/SSH/Daytona 暂不支持。默认关闭。｜范围:true/false｜生效:重启
    enabled: false
    #: 代理隧道端口｜代理隧道监听端口，沙箱会获得 HTTPS_PROXY=http://<主机>:<端口>。默认 9090。｜范围:整数｜生效:重启
    tunnel_port: 9090
    #: 自动安装代理｜自动下载固定版本的 iron-proxy 到数据目录的 bin 下；关闭则需 iron-proxy 已在 PATH 中。默认开启。｜范围:true/false｜生效:重启
    auto_install: true
    #: 真实凭据来源｜iron-proxy 启动时加载真实上游凭据的来源：env-从进程环境变量读取（默认） bitwarden-每次代理重启时通过 bws 从 Bitwarden 拉取（需启用 secrets.bitwarden）。｜范围:iron|env|bitwarden｜生效:重启
    credential_source: env
    #: 强制 Docker 走代理｜已启用出站代理但未配置/未运行时，拒绝启动 Docker 沙箱；关闭则回退为携带真实凭据直接出站。默认开启。｜范围:true/false｜生效:重启
    enforce_on_docker: true
    #: 允许回退环境变量｜凭据来源为 bitwarden 但缺少令牌/项目 ID 或拉取为空时，回退使用主机环境变量（迁移期间有用）；关闭则直接报错。默认关闭。｜范围:true/false｜生效:重启
    allow_env_fallback: false
    #: 上游禁止网段｜SSRF 防护禁止访问的 CIDR 网段；留空则默认禁止回环、链路本地（含 169.254.169.254 元数据）和 RFC1918 私有网段。｜范围:可空｜生效:重启
    upstream_deny_cidrs: null
    #: 额外允许主机｜除内置主流提供商外额外允许访问的上游主机列表，支持 *.foo.com 通配。｜范围:列表｜生效:重启
    extra_allowed_hosts: []

  # ---- 桌面端 ----
  desktop:
    #: 界面字体｜桌面应用聊天与界面文字的 CSS font-family（如 OpenDyslexic），置于主题字体之前；留空使用主题字体。终端字体见 terminal.font_family。｜范围:字符串｜生效:下一会话
    font_family: ''
    #: 扫描 Git 仓库｜为项目侧边栏扫描发现 Git 仓库；未配置扫描根目录时不会扫描。默认开启。｜范围:true/false｜生效:下一会话
    repo_scan_enabled: true
    #: 仓库扫描根目录｜扫描 Git 仓库的根目录列表，需显式配置。｜范围:列表｜生效:下一会话
    repo_scan_roots: []
    #: 扫描排除路径｜扫描仓库时排除的路径列表。｜范围:列表｜生效:下一会话
    repo_scan_exclude_paths: []
    #: Electron 启动参数｜每次启动附加的 Electron 参数列表，例如 ["--ozone-platform=x11"] 或 GPU 兼容参数。｜范围:列表｜生效:下一会话
    electron_flags: []
    #: 渲染进程内存上限｜渲染进程 V8 老生代内存上限（MB），超出时仅重载渲染进程而非卡死整机；0 表示使用 Chromium 默认值。默认 0。｜范围:整数｜生效:下一会话
    renderer_max_old_space_mb: 0
    #: Linux 显示后端｜Linux Ozone 显示后端：auto-使用 Chromium 默认（默认） x11-通过 XWayland 运行（适用于不支持 Wayland 置顶的合成器，如 COSMIC） wayland-强制原生 Wayland。｜范围:auto|x11|wayland｜生效:下一会话
    ozone_platform_hint: auto
    #: 禁用 GPU 加速｜GPU 加速策略：auto-仅在远程显示（SSH/VNC/RDP）时禁用（默认） true-始终使用软件渲染（适用于无 GPU 虚拟机） false-始终启用 GPU。｜范围:auto|true|false｜生效:下一会话
    disable_gpu: auto
    #: Linux 密钥存储｜Linux 下存储令牌的密钥环（Chromium --password-store）：auto-自动检测 KWallet 或 freedesktop secrets（默认） gnome-libsecret/kwallet/kwallet5/kwallet6-强制指定 basic-不加密存储。非 Linux 忽略。｜范围:auto|gnome|basic｜生效:下一会话
    password_store: auto
    #: 无障碍树｜向系统（macOS/Windows）暴露渲染进程的无障碍树，使听写/输入法等工具能向输入框输入文字；关闭可提升性能。默认开启。｜范围:true/false｜生效:下一会话
    renderer_accessibility: true
    #: 管理启动器条目｜Linux：开启时每次启动更新自动生成的 XDG 启动器条目；关闭则保留已有的自定义条目（缺失时仍会创建）。默认开启。｜范围:true/false｜生效:下一会话
    manage_launcher_entry: true
    #: macOS 签名身份｜仅 macOS：本地重建应用时用于重新签名的代码签名身份（登录钥匙串证书，自签名亦可），使系统权限授予在更新后保留；留空使用默认临时签名。｜范围:字符串｜生效:下一会话
    macos_signing_identity: ''
    #: SSH 程序路径｜仅 Windows：用于 SSH 连接与终端的 ssh 客户端路径（如 Git for Windows 的 ssh.exe）；留空依次使用系统 OpenSSH、Git 自带 ssh.exe、PATH。修改后需重启应用。｜范围:字符串｜生效:下一会话
    ssh_path: ''
    auto_continue:
      #: 崩溃后自动续跑｜因崩溃中断的轮次在恢复时，若中断时间较近则自动重新提交被中断的提示；过旧则仅显示已恢复的部分记录。默认开启。｜范围:true/false｜生效:下一会话
      enabled: true
      #: 续跑时效｜中断发生在多少分钟内才自动续跑，默认 15。｜范围:整数｜生效:下一会话
      freshness_minutes: 15
      #: 最大续跑次数｜同一被中断轮次最多自动重跑次数（防止崩溃循环），默认 2。｜范围:整数｜生效:下一会话
      max_attempts: 2

  # ---- Nous Portal ----
  nous:
    #: Nous 保活间隔上限｜Nous 认证保活任务的间隔上限（秒），实际由服务器签发的凭据有效期推算；0 表示关闭保活线程。默认 900。｜范围:整数｜生效:下一会话
    keepalive_interval_seconds: 900
    #: Anthropic 模型线路｜Nous Portal 上 anthropic/* 模型的传输线路：chat-/v1/chat/completions（默认），native-/v1/messages 原生 Messages 协议，auto-先用 chat，在已知安全的上游自动切换到 native。｜范围:chat|native|auto｜生效:下一会话
    anthropic_wire: chat
    #: Nous 免费层｜未配置其他提供商时，首次使用自动建立免费 Nous 身份并可通过 /login 登录；关闭则完全禁用免费层。默认开启。｜范围:true/false｜生效:下一会话
    guest: true

  # ---- Google Vertex ----
  vertex:
    #: GCP 项目 ID｜Google Vertex AI（Gemini）使用的 GCP 项目 ID；留空则从服务账号 JSON（或 ADC）中读取。｜范围:字符串｜生效:下一会话
    project_id: ''
    #: Vertex 区域｜Vertex AI 区域，默认 global（Gemini 3.x 预览模型必须使用 global，区域端点会 404）；仅当模型固定在某区域时才填如 us-central1。｜范围:字符串｜生效:下一会话
    region: global

  # ---- 本地模型运行时 ----
  local_runtime:
    #: 启用本地模型运行时｜启用托管的 llama.cpp 本地运行时（受监管的 llama-server 路由模式）；关闭时仅检测你自行运行的外部 llama-server。默认关闭。｜范围:true/false｜生效:下一会话
    enabled: false
    #: 本地推理后端｜llama.cpp 计算后端：auto-自动（NVIDIA 用 CUDA、macOS 用 Metal、其他 GPU 用 Vulkan，否则 CPU）（默认）；也可显式指定 cuda、metal、vulkan、hip、cpu。｜范围:字符串｜生效:下一会话
    backend: auto
    #: 最大驻留模型数｜路由进程中同时驻留内存的最大模型数，默认 4。｜范围:整数｜生效:下一会话
    models_max: 4
    #: 本地服务端口｜托管 llama-server 的端口；0 表示启动时自动选择空闲端口。默认 0。｜范围:整数｜生效:下一会话
    port: 0
    #: 额外探测端口｜检测外部 llama-server 时额外探测的端口列表（8080 之外）。｜范围:列表｜生效:下一会话
    detect_ports: []
# <<< hermes:end
