# ============================================================================
# PDR 系统核心配置（唯一入口）
# ----------------------------------------------------------------------------
# - 平台级配置只认本文件；Web「系统配置」页面保存时写回本文件（保留注释），并在
#   src.src_opr_config_change_log_di 记一条变更，附写入后文件的 SHA-256。
# - 租户级覆盖（仅 hermes 段中允许租户配置的项）存于 src.src_opr_config_value_f，不写回本文件。
# - 密钥不写在这里：用 ${ENV:变量名} 引用，值放在 pdr/.env（.env 只放密钥）。
# - 每个配置项上方的 `#:` 行是页面元数据，格式：
#       #: 中文名｜说明｜范围:<取值范围>｜生效:<热加载|下一会话|重启>
#   页面的分组、表单控件、校验与生效提示全部由这些行生成，改配置项时请同步改这一行。
# ============================================================================

app:
  #: 系统名称｜页面标题与浏览器标签显示的名称｜范围:字符串｜生效:热加载
  name: PDR
  #: 运行环境｜dev-开发（开启接口文档与详细错误） prod-生产｜范围:dev|prod｜生效:重启
  env: dev
  #: 后端监听地址｜FastAPI 服务绑定的地址｜范围:IP 地址｜生效:重启
  host: 127.0.0.1
  #: 后端端口｜FastAPI 服务端口｜范围:1-65535｜生效:重启
  port: 8600
  #: 数据目录｜上传原件、派生文件、各租户 hermes profile 的根目录；相对路径以本文件所在目录为基准｜范围:路径｜生效:重启
  data_dir: ./.pdr/data
  #: 默认语言｜界面语言，当前仅提供中文｜范围:zh-CN｜生效:热加载
  locale: zh-CN
  #: 时区｜日志、分区日期 travel_date 与看板统计使用的时区｜范围:IANA 时区名｜生效:重启
  timezone: Asia/Shanghai

# 两套独立前端：管理端与用户端是两个工程、两个端口（生产为两个域名），互不链接。
# 令牌带受众 aud=admin / aud=portal，后端 /api/admin/* 与 /api/portal/* 分别校验，交叉使用一律 401。
admin_web:
  #: 管理端端口｜管理端前端（按登录者角色权限显示菜单与功能）的端口｜范围:1-65535｜生效:重启
  port: 5173
  #: 管理端访问地址｜生产环境的管理端域名，用于跨域白名单与令牌受众校验｜范围:URL｜生效:重启
  public_url: http://127.0.0.1:5173
  #: 管理端页面标题｜浏览器标签与登录页显示的名称｜范围:字符串｜生效:热加载
  title: PDR 管理端

portal_web:
  #: 用户端端口｜用户端前端（只有问答界面）的端口｜范围:1-65535｜生效:重启
  port: 5174
  #: 用户端访问地址｜生产环境的用户端域名，用于跨域白名单与令牌受众校验｜范围:URL｜生效:重启
  public_url: http://127.0.0.1:5174
  #: 用户端页面标题｜为空时显示“租户名称 · 智能问答”｜范围:字符串｜生效:热加载
  title: ""
  #: 推荐问题数｜问答首页展示的推荐问题个数（由租户在管理端维护）｜范围:0-8｜生效:热加载
  suggested_question_qty: 4
  #: 允许临时附件｜用户端提问时可上传仅对本次对话有效的附件（不进入内容流水线）｜范围:true/false｜生效:热加载
  allow_attachment: true
  #: 单条问题字数上限｜用户端输入框的最大字数｜范围:50-4000｜生效:热加载
  max_question_chars: 500
  #: 使用示例数据｜后端问答接口完成前，用户端使用内置示例数据运行（登录、问答、出处、历史均可体验）；接口完成后改为 false｜范围:true/false｜生效:重启
  mock_api: true

install:
  #: 镜像选择策略｜安装依赖时选择下载源：fastest-并发测速选最快 first-按顺序选第一个可用 fixed-固定使用指定源｜范围:fastest|first|fixed｜生效:重启
  strategy: fastest
  #: 测速超时｜每个候选源的测速超时秒数｜范围:1-30｜生效:重启
  probe_timeout_seconds: 3
  #: Python 包源｜strategy=fixed 时使用；其余情况作为候选首位｜范围:URL｜生效:重启
  pip_index: ""
  #: Python 包候选源｜参与测速的 PyPI 镜像｜范围:URL 列表｜生效:重启
  pip_candidates: [https://pypi.org/simple, https://pypi.tuna.tsinghua.edu.cn/simple, https://mirrors.aliyun.com/pypi/simple, https://mirrors.cloud.tencent.com/pypi/simple]
  #: 前端包源｜strategy=fixed 时使用｜范围:URL｜生效:重启
  npm_registry: ""
  #: 前端包候选源｜参与测速的 npm 镜像｜范围:URL 列表｜生效:重启
  npm_candidates: [https://registry.npmjs.org, https://registry.npmmirror.com]

database:
  #: 主库类型｜业务与数仓主库；mysql 仅用于兼容部署（无行级安全与向量检索）｜范围:postgres|mysql｜生效:重启
  primary: postgres
  postgres:
    #: PostgreSQL 主机｜主库地址｜范围:主机名或 IP｜生效:重启
    host: 127.0.0.1
    #: PostgreSQL 端口｜主库端口｜范围:1-65535｜生效:重启
    port: 5432
    #: 数据库名｜PDR 使用的数据库，库内按分层建 schema：src/ods/dwd/dws/ads/dim｜范围:字符串｜生效:重启
    dbname: pdr
    #: 应用账号｜后端连接用户（非超级用户，否则行级安全不生效）｜范围:字符串｜生效:重启
    user: pdr_app
    #: 应用账号密码｜引用 .env 中的密钥｜范围:${ENV:变量名}｜生效:重启
    password: ${ENV:PDR_PG_PASSWORD}
    #: 连接池大小｜每个后端进程的连接池上限｜范围:1-200｜生效:重启
    pool_size: 20
    #: 启用行级安全｜在库内用 RLS 策略二次校验租户与区域隔离（推荐开启）｜范围:true/false｜生效:重启
    rls_enabled: true
  mysql:
    #: 启用 MySQL｜开启后 ADS 层报表同步到 MySQL 报表库，供 BI 工具读取｜范围:true/false｜生效:重启
    enabled: false
    #: MySQL 主机｜报表库地址｜范围:主机名或 IP｜生效:重启
    host: 127.0.0.1
    #: MySQL 端口｜报表库端口｜范围:1-65535｜生效:重启
    port: 3306
    #: 应用账号｜报表库连接用户｜范围:字符串｜生效:重启
    user: pdr_app
    #: 应用账号密码｜引用 .env 中的密钥｜范围:${ENV:变量名}｜生效:重启
    password: ${ENV:PDR_MYSQL_PASSWORD}
    #: 同步的分层｜从 PostgreSQL 同步到 MySQL 的数据分层｜范围:ads|dws|dim 的组合｜生效:热加载
    sync_layers: [ads]
    #: 同步周期｜报表同步的 cron 表达式｜范围:cron 表达式｜生效:热加载
    sync_cron: "*/30 * * * *"

redis:
  #: Redis 地址｜任务队列、缓存与会话存储；格式 redis://主机:端口/库号｜范围:redis URL｜生效:重启
  url: redis://127.0.0.1:6379/0
  #: Redis 密码｜引用 .env 中的密钥，无密码留空｜范围:${ENV:变量名}｜生效:重启
  password: ${ENV:PDR_REDIS_PASSWORD}
  #: 键前缀｜所有 Redis 键的前缀，多套环境共用一个 Redis 时用于区分｜范围:字符串｜生效:重启
  key_prefix: "pdr:"

storage:
  #: 存储类型｜原件与派生文件的存储：local-本地目录 s3-S3 兼容对象存储（MinIO/OSS/COS）｜范围:local|s3｜生效:重启
  backend: local
  s3:
    #: 对象存储地址｜S3 兼容服务的 endpoint｜范围:URL｜生效:重启
    endpoint: ""
    #: 存储桶｜存放文件的 bucket｜范围:字符串｜生效:重启
    bucket: pdr
    #: Access Key｜引用 .env 中的密钥｜范围:${ENV:变量名}｜生效:重启
    access_key: ${ENV:PDR_S3_ACCESS_KEY}
    #: Secret Key｜引用 .env 中的密钥｜范围:${ENV:变量名}｜生效:重启
    secret_key: ${ENV:PDR_S3_SECRET_KEY}

security:
  #: 登录令牌密钥｜签发 JWT 的密钥｜范围:${ENV:变量名}｜生效:重启
  jwt_secret: ${ENV:PDR_JWT_SECRET}
  #: 登录有效期｜访问令牌有效时长（分钟）｜范围:5-1440｜生效:热加载
  access_token_minutes: 120
  #: 刷新有效期｜刷新令牌有效时长（天）｜范围:1-90｜生效:热加载
  refresh_token_days: 14
  #: 登录失败锁定次数｜连续失败达到该次数锁定账号 15 分钟｜范围:3-20｜生效:热加载
  max_login_fail_qty: 5
  #: 平台租户编码｜平台运营方租户；该租户的共享行（字典、权限点）对所有租户只读可见｜范围:字符串｜生效:重启
  platform_tenant_code: platform
  #: 初始管理员账号｜首次启动时创建的平台超级管理员｜范围:字符串｜生效:重启
  bootstrap_admin_user: admin
  #: 初始管理员密码｜首次启动时使用；为空则随机生成并打印到启动日志｜范围:${ENV:变量名}｜生效:重启
  bootstrap_admin_password: ${ENV:PDR_ADMIN_PASSWORD}
  #: 默认数据范围｜新建角色未配置数据范围时采用：1-本租户全部 2-本区域及下级 3-仅本区域 5-仅本人创建｜范围:1|2|3|5｜生效:热加载
  default_scope_type: 2

mineru:
  #: 接入方式｜http-调用 mineru-kit api-server（推荐） cli-本机调用 mineru 命令行｜范围:http|cli｜生效:热加载
  mode: http
  #: 服务地址｜MinerU HTTP 服务地址（/v1/tasks 接口）｜范围:URL｜生效:热加载
  base_url: http://127.0.0.1:8610
  #: 由 PDR 拉起服务｜python start_run.py 时自动启动 mineru-kit api-server｜范围:true/false｜生效:重启
  autostart: true
  #: 解析档位｜flash-最快（Office 本地解析） basic-CPU 可跑 standard-需 VLM advanced-最高质量需 GPU｜范围:flash|basic|standard|advanced｜生效:热加载
  tier: basic
  #: OCR 模式｜auto-自动判断 force-强制 OCR off-不做 OCR（仅文字层 PDF）｜范围:auto|force|off｜生效:热加载
  ocr_mode: auto
  #: 模型下载源｜写入 MINERU_MODEL_SOURCE：auto-先 HuggingFace 后 ModelScope huggingface modelscope-国内推荐 local-离线｜范围:auto|huggingface|modelscope|local｜生效:重启
  model_source: modelscope
  #: 单任务超时｜单个文件解析的最长等待秒数｜范围:30-7200｜生效:热加载
  timeout_seconds: 900
  #: 状态轮询间隔｜轮询 /v1/tasks/{task_id} 的间隔秒数｜范围:1-60｜生效:热加载
  poll_interval_seconds: 3

media:
  #: ffmpeg 路径｜抽帧、抽音轨与元数据（ffprobe）所用程序，留空从 PATH 查找｜范围:路径｜生效:热加载
  ffmpeg_bin: ""
  #: 抽帧方式｜scene-场景切换 interval-固定间隔 both-两者合并去重｜范围:scene|interval|both｜生效:热加载
  frame_mode: both
  #: 场景切换阈值｜ffmpeg scene 分值超过该值视为切换｜范围:0.1-0.9｜生效:热加载
  scene_threshold: 0.35
  #: 固定抽帧间隔｜固定间隔模式下每隔多少秒抽一帧｜范围:1-600｜生效:热加载
  frame_interval_seconds: 10
  #: 单个视频最多帧数｜超过时按时间均匀保留｜范围:10-2000｜生效:热加载
  max_frame_qty: 300
  #: 帧画面描述｜用智能体的视觉辅助模型为关键帧生成描述（产生模型费用）｜范围:true/false｜生效:热加载
  frame_caption: false
  asr:
    #: 语音识别引擎｜local-本机 faster-whisper openai-OpenAI 兼容转写接口 hermes-复用智能体的语音识别配置｜范围:local|openai|hermes｜生效:热加载
    provider: local
    #: 识别模型｜本机引擎的模型规格｜范围:tiny|base|small|medium|large-v3｜生效:热加载
    model: small
    #: 识别语种｜auto-自动检测，或指定 zh/en 等｜范围:auto|语种代码｜生效:热加载
    language: auto
    #: 词级时间戳｜输出每个词的起止时间（用于字幕精确对齐）｜范围:true/false｜生效:热加载
    word_timestamps: true
    #: 转写接口地址｜provider=openai 时使用｜范围:URL｜生效:热加载
    base_url: ""
    #: 转写接口密钥｜provider=openai 时使用｜范围:${ENV:变量名}｜生效:热加载
    api_key: ${ENV:PDR_ASR_API_KEY}

pipeline:
  #: 允许的模态｜可上传的模态类型｜范围:image|pdf|excel|word|markdown|video|audio 的组合｜生效:热加载
  modalities: [image, pdf, excel, word, markdown, video, audio]
  #: 单文件大小上限｜上传单个文件的最大 MB 数（音视频另见下项）｜范围:1-2048｜生效:热加载
  max_file_mb: 200
  #: 音视频大小上限｜音视频单文件最大 MB 数｜范围:1-10240｜生效:热加载
  max_media_file_mb: 2048
  #: 同租户去重｜同一租户内相同 SHA-256 的文件提示重复并可直接关联已有资产｜范围:true/false｜生效:热加载
  dedup_by_sha256: true
  #: 解析 worker 数｜每个后端节点同时执行的解析任务数｜范围:1-64｜生效:重启
  worker_concurrency: 2
  retry:
    #: 最大执行次数｜自动阶段失败后的最多执行次数（含首次）｜范围:1-10｜生效:热加载
    max_attempt_qty: 3
    #: 首次重试等待｜指数退避的初始秒数，第 n 次重试等待 初始值×2^(n-1)｜范围:1-3600｜生效:热加载
    backoff_seconds: 30
    #: 最长重试等待｜退避等待上限秒数｜范围:60-86400｜生效:热加载
    backoff_max_seconds: 3600
  stages:
    #: 需要人工核对｜关闭后解析成功直接进入标注｜范围:true/false｜生效:热加载
    review_required: true
    #: 需要标注｜关闭后核对完成直接进入分类｜范围:true/false｜生效:热加载
    label_required: false
    #: 模型预标注｜进入标注阶段前用辅助模型生成候选标注｜范围:true/false｜生效:热加载
    label_prefill: true
    #: 模型分类建议｜分类阶段由辅助模型给出候选分类与置信度｜范围:true/false｜生效:热加载
    classify_suggest: true
    #: 自动采纳阈值｜模型分类置信度不低于该值时自动采纳，无需人工确认；1 表示总是人工确认｜范围:0.5-1｜生效:热加载
    classify_auto_accept_rate: 1.0
  chunk:
    #: 切片 token 上限｜入库时知识切片的最大 token 数｜范围:128-4096｜生效:热加载
    max_tokens: 800
    #: 切片重叠 token｜相邻切片的重叠 token 数｜范围:0-512｜生效:热加载
    overlap_tokens: 80

knowledge:
  #: 向量模型接口｜OpenAI 兼容 embeddings 接口地址｜范围:URL｜生效:热加载
  embedding_base_url: ""
  #: 向量模型｜生成切片向量的模型名称｜范围:字符串｜生效:热加载
  embedding_model: text-embedding-3-small
  #: 向量维度｜与向量模型一致｜范围:64-4096｜生效:重启
  embedding_dim: 1536
  #: 向量接口密钥｜引用 .env 中的密钥｜范围:${ENV:变量名}｜生效:热加载
  embedding_api_key: ${ENV:PDR_EMBEDDING_API_KEY}
  #: 检索返回条数｜智能体每次知识检索返回的切片数｜范围:1-50｜生效:热加载
  top_k: 8
  #: 向智能体暴露检索工具｜以 MCP 服务形式把租户知识库挂到该租户的智能体（下一会话生效）｜范围:true/false｜生效:下一会话
  expose_mcp: true

agent_runtime:
  #: 由 PDR 拉起智能体网关｜启动时运行 hermes gateway（api_server 平台），多租户共用一个监听｜范围:true/false｜生效:重启
  autostart: true
  #: 智能体网关地址｜hermes api_server 地址；租户请求走 /p/<profile>/ 前缀｜范围:URL｜生效:重启
  base_url: http://127.0.0.1:8642
  #: 网关密钥｜hermes API_SERVER_KEY｜范围:${ENV:变量名}｜生效:重启
  api_key: ${ENV:PDR_HERMES_API_KEY}
  #: profile 名前缀｜租户对应的 hermes profile 名为 前缀+租户编码｜范围:字符串｜生效:重启
  profile_prefix: t_

logging:
  #: 日志级别｜后端日志级别｜范围:DEBUG|INFO|WARNING|ERROR｜生效:热加载
  level: INFO
  #: 审计日志保留天数｜src.src_cus_operate_log_di 分区保留天数，过期分区按天删除｜范围:30-3650｜生效:热加载
  audit_retention_days: 180

# ============================================================================
# 智能体（hermes-agent）配置：平台级默认值。页面「智能体配置」按分组展示，
# 生效方式默认「下一会话」——进行中的会话不重建系统提示，以保护提示缓存。
# ============================================================================
# >>> hermes:begin
# 以下由 pdr/scripts/gen_config_yaml.py 依据 pdr-agent 的 DEFAULT_CONFIG 生成；可直接修改取值，
# 重新生成时保留已修改的值。租户级覆盖存于 src.src_opr_config_value_f，不写入本文件。
hermes:

  # ---- 通用 ----
  #: 默认模型｜主智能体默认使用的模型名，如 anthropic/claude-sonnet-4.6；可被 --model 参数临时覆盖，留空则按已配置的提供商自动选择。｜范围:字符串｜生效:下一会话
  model: ''
  #: 自定义提供商｜按名称定义的自定义模型提供商（base_url、api_mode、模型列表等）；密钥放 .env，不写在这里。默认空。｜范围:键值对｜生效:下一会话
  providers: {}
  #: 备用提供商链｜主模型出错或被限流时按顺序切换的备用提供商/模型列表，每项形如 {provider, model}；空列表表示不启用回退。｜范围:列表｜生效:下一会话
  fallback_providers: []
  #: 凭据池轮换策略｜按提供商指定多把密钥的轮换策略：fill_first-用满再换 round_robin-轮询 least_used-最少使用 random-随机。默认空（使用内置策略）。｜范围:fill_first|round_robin|least_used|random｜生效:下一会话
  credential_pool_strategies: {}
  #: 启用的工具集｜主智能体启用的工具集列表，默认 ["hermes-cli"]（PDR 智能体的标准工具集）。｜范围:列表｜生效:下一会话
  toolsets: [hermes-cli]
  #: 最大并发会话数｜CLI、TUI/仪表盘与消息平台合计的活跃对话会话上限；留空或 0 表示不限制。｜范围:可空｜生效:下一会话
  max_concurrent_sessions: null
  #: 内存常驻会话上限｜TUI/桌面/仪表盘会话在内存中的软性 LRU 上限，超出后淘汰最久未活动且无客户端连接的会话（重新打开时从磁盘恢复）；0/空表示关闭。默认 16。｜范围:整数｜生效:下一会话
  max_live_sessions: 16
  #: 上下文文件字符上限｜单个自动加载的上下文文件（SOUL.md、AGENTS.md、CLAUDE.md 等）截断前的最大字符数；留空则随模型窗口自动缩放（2 万~50 万），正整数为固定上限。｜范围:可空｜生效:下一会话
  context_file_max_chars: null
  #: 上下文文件读取超时｜读取单个上下文文件的最长等待秒数，超时则跳过并警告，防止网络文件系统阻塞启动。默认 5。｜范围:小数｜生效:下一会话
  context_file_read_timeout: 5.0
  #: 单次读文件字符上限｜read_file 单次调用最多返回的字符数，超出时要求使用偏移/分段读取。默认 100000。｜范围:整数｜生效:下一会话
  file_read_max_chars: 100000
  #: MCP 发现等待时间｜首次构建智能体时等待后台 MCP 服务器发现的最长秒数；未赶上的服务器会在后续轮次间补充加载。默认 1.5。｜范围:小数｜生效:下一会话
  mcp_discovery_timeout: 1.5
  #: 单次查询 MCP 等待｜单次查询模式（-q/-z）下等待 MCP 发现的最长秒数；该模式无后续刷新，因此更长。默认 15。｜范围:小数｜生效:下一会话
  mcp_single_query_discovery_timeout: 15.0
  #: 预填充消息文件｜JSON 文件路径，内容为 {role, content} 列表，在每次 API 调用开头注入作少样本引导；不会保存到会话或日志。留空不使用。｜范围:字符串｜生效:下一会话
  prefill_messages_file: ''
  #: 时区｜IANA 时区名，如 Asia/Shanghai、America/New_York；留空使用系统/服务器本地时区。｜范围:字符串｜生效:下一会话
  timezone: ''
  #: WhatsApp 配置｜WhatsApp 适配器的平台专属设置键值对。默认空。｜范围:键值对｜生效:下一会话
  whatsapp: {}
  #: 命令永久白名单｜已永久允许的危险命令模式列表（通过“始终允许”审批添加）。｜范围:列表｜生效:下一会话
  command_allowlist: []
  #: 快捷命令｜用户自定义、绕过智能体循环直接执行的快捷命令（仅支持 exec 类型）：名称 → {type, command}。默认空。｜范围:键值对｜生效:下一会话
  quick_commands: {}
  #: 平台提示覆盖｜按平台名覆盖系统提示中的平台提示：{append: 文本}-在内置提示后追加 {replace: 文本}-替换内置提示；直接写字符串等同 append。默认空。｜范围:键值对｜生效:下一会话
  platform_hints: {}
  #: Shell 钩子｜按事件注册的 Shell 钩子命令；首次使用需审批，审批记录存于 shell-hooks-allowlist.json。默认空。｜范围:键值对｜生效:下一会话
  hooks: {}
  #: 自动接受 Shell 钩子｜无需 TTY 确认自动接受新注册的 Shell 钩子（网关/定时任务等非交互运行需开启才能加载新钩子）。默认关闭。｜范围:true/false｜生效:下一会话
  hooks_auto_accept: false
  #: 自定义人格｜名称 → 系统提示，或名称 → {description, system_prompt, tone, style}。默认空。｜范围:键值对｜生效:下一会话
  personalities: {}
  #: 模型元数据覆盖｜按模型覆盖上下文长度、能力等元数据，参与模型元数据解析链。默认空。｜范围:键值对｜生效:下一会话
  model_overrides: {}
  #: 粘贴折叠行数｜支持括号粘贴的终端中，粘贴内容达到该换行数即折叠为文件引用；0 表示关闭。默认 5。｜范围:整数｜生效:下一会话
  paste_collapse_threshold: 5
  #: 粘贴折叠行数(兼容)｜不支持括号粘贴的终端使用的同类换行数阈值（结合字符/换行启发式判断）；0 表示关闭。默认 5。｜范围:整数｜生效:下一会话
  paste_collapse_threshold_fallback: 5
  #: 粘贴折叠字符数｜单行粘贴达到该字符数也折叠为文件引用；0 表示关闭。默认 2000。｜范围:整数｜生效:下一会话
  paste_collapse_char_threshold: 2000

  # ---- 备用模型 ----
  fallback:
    #: 限流不切换阈值｜主提供商被限流且声明的重置时间短于此秒数时，留在主模型上等待重试而不切换到备用模型；0 表示关闭（默认）。｜范围:整数｜生效:下一会话
    min_switch_reset_seconds: 0

  # ---- 会话数据库 ----
  database:
    #: 数据库日志模式｜所有 PDR 智能体 SQLite 数据库的日志模式。默认 wal；在 fsync 不可靠或共享文件系统（macOS virtiofs、NFS、SMB）上可改为 delete，因为 WAL 在这些环境下不保证崩溃安全。｜范围:字符串｜生效:重启
    journal_mode: wal
    #: WAL 自动检查点｜WAL 自动检查点阈值（页数，整数）。留空使用 SQLite 默认值（1000 页）。｜范围:可空｜生效:重启
    wal_autocheckpoint: null
    #: 日志文件大小上限｜WAL/日志文件的大小上限（字节，整数）。留空使用 SQLite 默认值（不限制）。｜范围:可空｜生效:重启
    journal_size_limit: null

  # ---- 运行时 ----
  runtime:
    #: 文件描述符软上限｜服务进程的打开文件数（nofile）软限制，会被钳制到硬上限；0/false/null 表示不调整。默认 4096。｜范围:整数｜生效:重启
    nofile_soft_limit: 4096
    #: malloc 分配区上限｜glibc MALLOC_ARENA_MAX 上限，用于抑制多线程内存膨胀；0/false/null 表示不设置。默认 4。｜范围:整数｜生效:重启
    malloc_arena_max: 4

  # ---- 会话 ----
  session:
    #: 按终端续接会话｜开启时 `-c/--continue` 恢复当前终端（tmux/kitty 窗格、tty）上次的会话；关闭则恢复全局最近一次会话。默认开启。｜范围:true/false｜生效:下一会话
    terminal_continue: true

  # ---- 附件 ----
  attachments:
    #: 附件存放位置｜会话附件（上传文件、粘贴文本）的暂存位置：hermes-home-存放在配置档主目录的 attachments 下（默认，容器后端会挂载此目录） workspace-存放在会话工作区的 .hermes/attachments 下，使智能体总能读回自己的附件。｜范围:hermes|workspace｜生效:下一会话
    storage: hermes-home

  # ---- 智能体核心 ----
  agent:
    #: 单次最大轮数｜每次运行的工具调用轮数上限；留空为不限制（默认），正整数为上限，"none"/"unlimited"/0/-1 也表示不限制。｜范围:可空｜生效:下一会话
    max_turns: null
    #: 轮数预警比例｜轮数上限即将耗尽前，向模型发送一次性预警的比例（0~1 之间，如 0.75）；留空表示关闭。｜范围:可空｜生效:下一会话
    budget_warning_ratio: null
    #: 运行时长预算｜每次运行的墙钟时间预算（秒）；设置后在用到 80% 时提示收尾，并把提供商超时限制在剩余预算内。留空表示关闭。｜范围:可空｜生效:下一会话
    run_budget_seconds: null
    #: 网关空闲超时｜网关中智能体完全空闲（未调用工具、未接收 API 响应）超过该秒数即终止本轮；0 表示不限制。默认 1800。｜范围:整数｜生效:下一会话
    gateway_timeout: 1800
    #: 会话租约等待超时｜同一会话已有活跃轮次时，新消息最多等待的秒数，超时则拒绝并提示重发；应保持较短。非正数按 5 秒处理。｜范围:整数｜生效:下一会话
    gateway_turn_lease_timeout: 5
    agent_cache:
      #: 智能体缓存上限｜网关中按会话缓存的智能体实例数（LRU 上限）；缓存保留热提示前缀与完整对话。默认 128。｜范围:整数｜生效:下一会话
      max_size: 128
      #: 缓存空闲过期｜缓存中的智能体空闲超过该秒数即被淘汰。默认 3600。｜范围:整数｜生效:下一会话
      idle_ttl_secs: 3600
      #: 缓存内存高水位｜匿名内存（RSS）超过该 MB 数时卸载最久未用的会话记录（下轮从磁盘重载）；auto-按 cgroup 内存限制或总内存推算，数字-显式指定，0/off-关闭该清理。｜范围:字符串｜生效:下一会话
      memory_high_mb: auto
      #: 单次最多淘汰数｜每次内存清理最多卸载的会话数，避免集中清理卡住网关。默认 16。｜范围:整数｜生效:下一会话
      max_evictions_per_pass: 16
      #: 保护最近会话数｜内存清理时始终不触碰的最近使用会话数量。默认 8。｜范围:整数｜生效:下一会话
      protect_recent: 8
    #: 停止时强制中断时限｜网关开始停止/排空后，强制中断仍在运行轮次前的等待秒数；0 表示立即中断。应小于 systemd TimeoutStopSec。｜范围:整数｜生效:下一会话
    restart_drain_timeout: 0
    #: 定时任务排空时限｜停止/排空时为定时任务与 api_server 运行保留的最短等待秒数（被中断的定时任务会记为失败）；0 表示不保留。默认 30。｜范围:整数｜生效:下一会话
    cron_drain_timeout: 30
    #: 空闲重启告警间隔｜就地重启（/restart、更新等）会等到无工作进行时才执行；每过该秒数仍有任务在跑就记录一次警告并继续等待。默认 1800。｜范围:整数｜生效:下一会话
    restart_after_turn_timeout: 1800
    #: 智能体构建等待上限｜提交的提示等待延迟构建（MCP 发现、模型元数据、技能扫描）完成的最长秒数，超时则明确报错。默认 600。｜范围:整数｜生效:下一会话
    build_wait_timeout: 600
    #: API 最大重试次数｜API 出错（断连、超时、5xx）时 PDR 智能体层面的重试次数；设为 1 可更快切换到备用提供商。默认 3。｜范围:整数｜生效:下一会话
    api_max_retries: 3
    #: 自动恢复轮次｜重试与备用链都用尽且尚无输出时，再自动等待并重试的轮数（带倒计时，可按 Esc 中止）；鉴权/计费等错误不进入。0 表示关闭。默认 5。｜范围:整数｜生效:下一会话
    auto_recovery_cycles: 5
    #: 流结束排空时间｜Codex/Responses 流收到终止帧后继续读取的秒数，以便中继完成收尾；0 表示不等待。默认 2.0。｜范围:小数｜生效:下一会话
    stream_drain_timeout: 2.0
    empty_response_guard:
      #: 空响应重试保护｜开启时对确定性空响应（无声拒答、零输出 token）减少重试以免重复计费；关闭则恢复无条件重试 3 次。默认开启。｜范围:true/false｜生效:下一会话
      enabled: true
      #: 空响应成本阈值｜单次空响应估算输入成本 ≥ 该美元数时，重试次数从 3 次降为 1 次。默认 0.25。｜范围:小数｜生效:下一会话
      cost_threshold_usd: 0.25
    #: 快速模式｜请求快速服务档位的策略：留空/normal-关闭，fast-始终使用，auto-每轮前 fast_auto_seconds 秒使用，cold-仅会话首轮使用。｜范围:fast|auto|cold｜生效:下一会话
    service_tier: ''
    #: 快速模式时长｜快速模式为 auto/cold 时，每轮（或首轮）使用快速档位的秒数。默认 60。｜范围:整数｜生效:下一会话
    fast_auto_seconds: 60
    #: 回复详略程度｜仅 Responses 接口的 text.verbosity 参数：留空-不发送，可选 low（简略）/ medium（适中）/ high（详细）。｜范围:字符串｜生效:下一会话
    text_verbosity: ''
    #: Daybreak 网络安全通道｜在 ChatGPT/Codex 订阅中启用 OpenAI Daybreak（可信网络安全访问），仅对账号目录中列出的模型生效，本身不授予权限。默认关闭。｜范围:true/false｜生效:下一会话
    daybreak: false
    #: 强制工具调用提示｜在系统提示中要求模型直接调用工具而非描述动作：auto-仅 gpt/codex 模型，true/false-对所有模型强制开/关，或填写模型名子串列表。｜范围:字符串｜生效:下一会话
    tool_use_enforcement: auto
    #: 执行纪律提示｜注入执行纪律提示块（坚持用工具、写后回读、核对计数等），按模型名每会话选定一次：auto-常见需要的模型系列，true/false-强制开/关，或模型名子串列表。｜范围:字符串｜生效:下一会话
    execution_guidance: auto
    #: 意图后自动续行｜模型只说“我去做…”却未调用工具时，注入“立即执行”提醒并继续（每轮最多 2 次）：auto-仅 codex_responses 模式，true-所有模式，false-从不，或模型名子串列表。｜范围:auto|true|false｜生效:下一会话
    intent_ack_continuation: auto
    #: 防停滞保护｜开启后检测相同参数与结果的重复工具调用（3 次以上追加提示），并在模型说要继续却无动作时重新提示一次；关闭则两者均禁用。默认开启。｜范围:true/false｜生效:下一会话
    stall_guards: true
    #: 任务完成指引｜为所有模型加入“把事做完”的提示块：不停在半成品，受阻时不编造结果。约 80 个缓存 token。默认开启。｜范围:true/false｜生效:下一会话
    task_completion_guidance: true
    #: 并行工具调用指引｜提示模型把相互独立的读取/搜索/只读命令合并到同一轮并行调用。约 70 个缓存 token。默认开启。｜范围:true/false｜生效:下一会话
    parallel_tool_call_guidance: true
    #: 环境探测｜仅在检测到非默认状态（缺 pip、pip/python 不匹配、PEP 668 无 uv）时，把 Python 工具链信息写入系统提示；docker/modal/ssh 后端跳过。默认开启。｜范围:true/false｜生效:下一会话
    environment_probe: true
    #: Bot 模式协议说明｜在系统提示中加入 Bot 模式队友消息协议段（仅在桌面端 Bot 模式管理时生效）。默认开启。｜范围:true/false｜生效:下一会话
    bot_mode_protocol: true
    #: 环境提示文本｜追加到系统提示环境说明中的文本，供宿主（沙箱、托管平台）描述代理/凭据/挂载布局；环境变量 HERMES_ENVIRONMENT_HINT 优先。默认空。｜范围:字符串｜生效:下一会话
    environment_hint: ''
    #: 编程上下文模式｜在交互式编程界面中为系统提示加入编程简报与 git/工作区快照：auto-交互且当前目录是代码仓库时启用，focus-auto 基础上精简为编程工具集，on-处处强制，off-关闭。｜范围:auto|focus|on|off｜生效:下一会话
    coding_context: auto
    #: 编程常驻指令｜附加到编程简报后的常驻指令（字符串或列表），如项目级工作流规则；下一会话生效，不破坏提示缓存。｜范围:字符串｜生效:下一会话
    coding_instructions: ''
    #: 验证补充指引｜验证闭环发现修改缺少新鲜验证证据时，附加针对 UI 创作与干净 diff 的指导；关闭则只保留简短提醒。默认开启。｜范围:true/false｜生效:下一会话
    verify_guidance: true
    #: 最多验证提醒次数｜每轮最多连续发出的 pre_verify “继续”提醒次数，防止死循环。默认 3。｜范围:整数｜生效:下一会话
    max_verify_nudges: 3
    #: 结束前要求验证｜代码修改后，在有新鲜验证证据或说明无法验证前拒绝给出最终答复：false-关闭（默认），true-处处开启，auto-仅交互式编程界面与程序化调用方开启。｜范围:true/false｜生效:下一会话
    verify_on_stop: false
    #: 空闲超时预警｜在达到网关空闲超时前，空闲该秒数时发出一次警告（不中断）；0 表示关闭。默认 900。｜范围:整数｜生效:下一会话
    gateway_timeout_warning: 900
    #: 澄清问题等待时限｜智能体通过澄清工具提问后等待用户回复的最长秒数，超时则以“用户未在规定时间内回复”继续；0 或负数为不限制。默认 90。｜范围:整数｜生效:下一会话
    clarify_timeout: 90
    #: “仍在处理”提示间隔｜网关定期发送“仍在处理”状态消息的间隔秒数；0 表示关闭。默认 180。｜范围:整数｜生效:下一会话
    gateway_notify_interval: 180
    #: 会话停滞检测｜会话有排队消息但智能体活动时钟停滞超过该秒数时，提醒用户尝试 /new（仅通知）；0 表示关闭。默认 300。｜范围:整数｜生效:下一会话
    session_stall_timeout: 300
    #: 记录修复升级阈值｜10 分钟内发送前记录修复次数达到该值时，记录一次错误并提示使用 /debug 或 doctor 排查；0 表示不升级。默认 3。｜范围:整数｜生效:下一会话
    sanitizer_heal_escalation_threshold: 3
    #: 重连告警时长｜平台持续重连失败超过该秒数后，在网关状态中标记为需要关注（不会停止重试）；0 表示关闭。默认 7200。｜范围:整数｜生效:下一会话
    reconnect_attention_after: 7200
    #: 中断续接有效期｜崩溃/重启打断运行后，仅当最后一条记录新于该秒数时，才在下条用户消息前注入“上一轮被中断”提示；0 表示总是注入。默认 3600。｜范围:整数｜生效:下一会话
    gateway_auto_continue_freshness: 3600
    #: 启动恢复等待上限｜网关启动时等待自动恢复轮次后再放行新消息的最长秒数，超时后恢复任务转入后台；0 表示一直等待。默认 30。｜范围:整数｜生效:下一会话
    gateway_startup_restore_drain_timeout: 30
    #: 启动预热等待上限｜网关启动预热（导入、工具 schema、上下文文件）可阻挡新消息的最长秒数，超时后在后台继续预热；0 表示关闭预热（惰性初始化）。默认 20。｜范围:整数｜生效:下一会话
    gateway_startup_warmup_timeout: 20
    #: 本地模型流停滞上限｜本地提供商（Ollama、llama-cpp 等）流式输出停滞判定的上限秒数，防止本地服务卡死时无限等待；环境变量 HERMES_LOCAL_STREAM_STALE_TIMEOUT 优先。默认 900。｜范围:整数｜生效:下一会话
    local_stream_stale_timeout: 900
    #: 流最长存活时间｜单个流式响应的总时长上限（秒）；0 表示关闭（默认）。｜范围:整数｜生效:下一会话
    stream_max_lifetime: 0
    #: 图片输入方式｜用户附图如何传给主模型：auto-模型支持视觉且未单独配置视觉辅助模型时原生传图，否则转文字；native-始终原生传图；text-始终先用视觉分析转为文字描述。｜范围:auto|native|text｜生效:下一会话
    image_input_mode: auto
    #: 禁用的工具集｜从主智能体中排除的工具集名称列表。默认空。｜范围:列表｜生效:下一会话
    disabled_toolsets: []
    #: 按模型推理强度｜模型名 → 推理强度的映射，当前模型匹配时覆盖“推理强度”全局设置；键含点号，请在 config.yaml 或页面键值编辑器中填写。默认空。｜范围:键值对｜生效:下一会话
    reasoning_overrides: {}
    #: 推理回显补位｜在无推理内容的工具调用轮补发空推理字段（DeepSeek、Kimi、MiMo 等要求，按提供商自动识别）；仅自定义网关代理这类模型时需手动开启。默认关闭。｜范围:true/false｜生效:下一会话
    reasoning_echo: false
    turn_liveness:
      #: 轮次无进展超时｜一轮在该秒数内没有任何可观测进展时，记录并强制中断以便重试；≤0 表示关闭。默认 600。｜范围:小数｜生效:下一会话
      timeout_s: 600.0
      #: 进展检测间隔｜轮次活性看门狗的采样间隔（秒）。默认 15。｜范围:小数｜生效:下一会话
      poll_s: 15.0

  # ---- 终端执行 ----
  terminal:
    #: 终端执行后端｜智能体执行终端命令的环境：local-本机直接执行 docker-在 Docker 容器中执行 ssh-通过 SSH 在远程主机执行 modal-在 Modal 云沙箱执行 daytona-在 Daytona 云沙箱执行 vercel_sandbox-在 Vercel Sandbox 中执行。默认 local。｜范围:local|docker|ssh|modal|daytona|vercel_sandbox｜生效:下一会话
    backend: local
    #: Modal 接入方式｜Modal 后端的接入方式。运行时实际识别的值为 auto-自动选择 direct-使用自己的 Modal 凭据 managed-使用托管的 Modal；界面中的 sandbox/function 不是运行时有效值，会回退为 auto。默认 auto。｜范围:auto|direct|managed｜生效:下一会话
    modal_mode: auto
    #: 远程后端降级模式｜远程后端连接类故障（SSH 主机不可达、Docker 守护进程未运行）时的处理：warn-返回带原因和重试提示的降级结果（默认） fail-直接抛出错误和堆栈。｜范围:warn|fail｜生效:下一会话
    degraded_mode: warn
    #: 工作目录｜终端命令的工作目录，消息网关等场景使用此目录。默认 .（当前目录）。｜范围:字符串｜生效:下一会话
    cwd: .
    #: 临时文件目录｜终端会话临时文件（后台日志、pid、代码执行沙箱）的根目录。留空则用 TMPDIR/TMP/TEMP，否则用数据目录下的 cache/terminal（72 小时后自动清理）。必须是已存在的绝对路径，自定义路径不会自动清理。｜范围:字符串｜生效:下一会话
    temp_dir: ''
    #: 终端字体｜桌面应用内置终端（xterm.js）的 CSS font-family，例如 'CaskaydiaCoveNerdFont', monospace。留空使用内置默认字体（JetBrains Mono 等）。｜范围:字符串｜生效:下一会话
    font_family: ''
    #: 命令超时｜单条终端命令的默认超时时间（秒），默认 180。｜范围:整数｜生效:下一会话
    timeout: 180
    #: 终止宽限时间｜向宿主进程树（如浏览器守护进程）发送 SIGTERM 后，等待多少秒再升级为 SIGKILL。0 表示只发 SIGTERM。默认 2。｜范围:小数｜生效:下一会话
    daemon_term_grace_seconds: 2.0
    #: 单次运行等待后台｜单次命令行运行（-q/-Q/-z）结束前，最多等待带完成通知的后台进程多少秒，以免过早退出导致结果无法投递。0 表示不等待。默认 600。｜范围:小数｜生效:下一会话
    oneshot_completion_wait_seconds: 600.0
    #: 后台等待自动通知｜开启后，对后台进程连续两次无变化的等待/轮询会自动转为完成通知并停止轮询；关闭则保持旧的轮询方式。默认开启。｜范围:true/false｜生效:下一会话
    process_wait_auto_notify: true
    #: 环境变量透传｜允许传入沙箱终端/代码执行环境的环境变量名列表（技能声明的必需变量会自动加入）。｜范围:列表｜生效:下一会话
    env_passthrough: []
    #: 客户端环境透传｜CLI/TUI 客户端为其工具额外传递的非机密工具链环境变量名列表。｜范围:列表｜生效:下一会话
    client_env_passthrough: []
    #: 回同步大小上限｜远程后端回同步时，允许解压的状态归档最大字节数，默认 2 GiB；数据目录确实超过此大小时可调大。｜范围:整数｜生效:下一会话
    sync_back_max_bytes: 2147483648
    #: HOME 目录策略｜工具子进程使用的 HOME：auto-本机使用真实用户 HOME、容器使用数据目录下的 home（默认） real-强制使用真实 HOME profile-强制使用配置档目录下的 home，实现严格的配置档隔离。｜范围:auto|real|profile｜生效:下一会话
    home_mode: auto
    #: Shell 初始化文件｜构建会话环境快照时额外 source 的文件列表（用于 nvm/pyenv/asdf 等 PATH 设置），支持 ~ 和 ${VAR}，不存在的文件会跳过。留空且为 bash 时自动加载 ~/.profile、~/.bash_profile、~/.bashrc。｜范围:列表｜生效:下一会话
    shell_init_files: []
    #: 自动加载 bashrc｜在快照登录 shell 中依次 source ~/.profile、~/.bash_profile、~/.bashrc，以捕获 PATH、函数和别名。若某个 rc 文件在非交互模式下出错可关闭。默认开启。｜范围:true/false｜生效:下一会话
    auto_source_bashrc: true
    #: Docker 镜像｜docker 后端使用的容器镜像，默认 nousresearch/hermes-sandbox:desktop（含 Python、Node 及桌面显示栈）。｜范围:字符串｜生效:下一会话
    docker_image: nousresearch/hermes-sandbox:desktop
    #: Docker 转发环境变量｜从宿主机读取并转发到 Docker 容器内的环境变量名列表。｜范围:列表｜生效:下一会话
    docker_forward_env: []
    #: Docker 容器环境变量｜在 Docker 沙箱容器内设置的固定环境变量键值对（与转发宿主变量不同），如 SSH_AUTH_SOCK。默认空。｜范围:键值对｜生效:下一会话
    docker_env: {}
    #: Modal 镜像｜modal 后端使用的沙箱镜像，默认与 Docker 默认镜像相同。｜范围:字符串｜生效:下一会话
    modal_image: nousresearch/hermes-sandbox:desktop
    #: Daytona 镜像｜daytona 后端使用的沙箱镜像，默认与 Docker 默认镜像相同。｜范围:字符串｜生效:下一会话
    daytona_image: nousresearch/hermes-sandbox:desktop
    #: Vercel 沙箱镜像｜vercel_sandbox 后端使用的镜像：Vercel 托管镜像（如 vercel/sandbox/universal:latest）或 VCR 仓库[:tag]。｜范围:字符串｜生效:下一会话
    vercel_image: vercel/sandbox/universal:latest
    #: Vercel 旧版运行时｜旧版 Vercel Sandbox 运行时（已被 Vercel 弃用），设置后会覆盖镜像设置：node24-Node.js 24 node22-Node.js 22 python3.13-Python 3.13。留空则使用镜像。｜范围:node24|node22|python3.13｜生效:下一会话
    vercel_runtime: ''
    #: 容器 CPU 核数｜容器类后端（docker、modal、daytona、vercel_sandbox）的 CPU 限制，默认 1 核；对 local/ssh 无效。｜范围:整数｜生效:下一会话
    container_cpu: 1
    #: 容器内存｜容器类后端的内存限制（MB），默认 5120（5GB）。｜范围:整数｜生效:下一会话
    container_memory: 5120
    #: 容器磁盘｜容器类后端的磁盘限制（MB），默认 51200（50GB）。｜范围:整数｜生效:下一会话
    container_disk: 51200
    #: 容器持久化｜开启后容器文件系统在会话之间保留；关闭则每次会话使用全新环境。默认开启。｜范围:true/false｜生效:下一会话
    container_persistent: true
    #: Docker 卷挂载｜Docker 卷挂载列表，格式 宿主路径:容器路径（同 docker -v）。网关投递媒体时应写入容器内 /output 并输出宿主机可见路径。｜范围:列表｜生效:下一会话
    docker_volumes: []
    #: 挂载工作目录｜开启后将宿主机当前目录挂载到容器 /workspace（会削弱隔离性）。默认关闭。｜范围:true/false｜生效:下一会话
    docker_mount_cwd_to_workspace: false
    #: 容器网络访问｜关闭时以 --network=none 运行，容器内命令无法访问网络。默认开启。｜范围:true/false｜生效:下一会话
    docker_network: true
    #: Docker 额外参数｜原样追加到 docker run 的额外参数列表。｜范围:列表｜生效:下一会话
    docker_extra_args: []
    #: 共享内存大小｜Docker 沙箱的 /dev/shm 大小，默认 1g（Docker 默认 64MB 会导致 Chromium/Playwright、PyTorch 异常）。留空或 0 表示使用 Docker 默认值。｜范围:字符串｜生效:下一会话
    docker_shm_size: 1g
    #: 以宿主用户运行｜开启后以宿主机 uid:gid 运行容器（--user），使写入挂载目录的文件归属当前用户而非 root。需要以 root 启动的镜像请保持关闭。默认关闭。｜范围:true/false｜生效:下一会话
    docker_run_as_host_user: false
    #: Snap Docker 兼容｜兼容 AppArmor 下 Snap 安装的 Docker（如 Ubuntu 云镜像）：开启后去掉 --init 和 no-new-privileges 两个参数，其余加固保留。默认关闭。｜范围:true/false｜生效:下一会话
    docker_snap_compat: false
    #: 共享容器标识｜多个受信任配置档共用同一 Docker 容器时使用的共享标识；留空则每个配置档独立容器。｜范围:字符串｜生效:下一会话
    docker_shared_container_key: ''
    #: 持久化 Shell｜SSH 后端下，在命令之间保留导出的环境变量（工作目录总是保留）；关闭则每条命令都从登录环境重新开始。默认开启。｜范围:true/false｜生效:下一会话
    persistent_shell: true

  # ---- 网页工具 ----
  web:
    #: 网页工具后端｜web_search 与 web_extract 共用的默认后端（如 firecrawl、exa、tavily、parallel、searxng 等）。留空则自动选择。｜范围:字符串｜生效:下一会话
    backend: ''
    #: 网页搜索后端｜单独覆盖 web_search 的后端（例如 searxng）；留空则使用 web.backend。｜范围:字符串｜生效:下一会话
    search_backend: ''
    #: 网页提取后端｜单独覆盖 web_extract 的后端（例如 native）；留空则使用 web.backend。｜范围:字符串｜生效:下一会话
    extract_backend: ''
    #: 提取字符上限｜web_extract 每个页面的字符预算，超出部分截断（完整文本保存在缓存中）。默认 15000。｜范围:整数｜生效:下一会话
    extract_char_limit: 15000
    #: 免密钥回退｜未配置任何网页后端或密钥时，在 exa、parallel、firecrawl、keenable 的免费公开接口间轮询使用，遇限流自动切换。不会抢占已配置的后端。默认开启。｜范围:true/false｜生效:下一会话
    keyless_fallback: true
    #: 免密钥救援｜已选后端调用失败时，本次调用改用免密钥轮询重试一次，下次仍使用原后端。web.keyless_fallback 关闭时无效。默认开启。｜范围:true/false｜生效:下一会话
    keyless_rescue: true
    #: 网页工具供应商档位｜按供应商指定免费/付费通道：free-始终走匿名免费端点 paid-始终用密钥（缺密钥报错）；未设置则有密钥走付费、否则走免费轮换。默认空。｜范围:free|paid｜生效:下一会话
    provider_tier: {}
    #: 启用网页缓存｜为 web_search 和 web_extract 启用 TTL 缓存：TTL 内相同查询直接返回缓存结果，并发相同搜索合并为一次请求，仅缓存成功结果。默认开启。｜范围:true/false｜生效:下一会话
    cache_enabled: true
    #: 缓存有效期｜网页搜索/提取缓存的有效期（分钟），默认 20。｜范围:整数｜生效:下一会话
    cache_ttl_minutes: 20
    #: 缓存豁免主机｜始终实时抓取、不使用提取缓存的主机列表（如预发布环境、隧道地址）。支持精确匹配、*.通配符和域名后缀；localhost 和私有 IP 总是豁免。｜范围:列表｜生效:下一会话
    cache_exempt_hosts: []

  # ---- 浏览器 ----
  browser:
    #: 浏览器空闲超时｜浏览器会话在智能体循环之间无活动多少秒后自动关闭，默认 120。｜范围:整数｜生效:下一会话
    inactivity_timeout: 120
    #: 浏览器启动超时｜本地 Chromium 打开 DevTools 端口的等待时间（秒），默认 30；实际启动至少等待 120 秒（首次冷启动需解包配置）。｜范围:整数｜生效:下一会话
    command_timeout: 30
    #: 有界面模式｜以有界面模式（可见窗口）运行本地浏览器，并在轮次之间保持窗口打开；空闲会话仍会按 browser.inactivity_timeout 回收。默认关闭。｜范围:true/false｜生效:下一会话
    headed: false
    #: 允许私有地址｜旧版的私有网络地址访问开关（同 security.allow_private_urls），本地/边车 Chromium 会忽略此项。默认关闭。｜范围:true/false｜生效:下一会话
    allow_private_urls: false
    #: 浏览器引擎｜本地浏览器引擎：auto-使用 Chromium（默认） lightpanda-每个会话运行 lightpanda serve（导航更快，不支持截图）；chrome 视同 auto。使用云浏览器、cdp_url 或真实配置时忽略。｜范围:auto|lightpanda｜生效:下一会话
    engine: auto
    #: 浏览器程序路径｜本地会话使用的 Chromium 可执行文件路径。留空则依次使用包管理器安装的 chromium、Docker 镜像内置版本或系统 chromium。｜范围:字符串｜生效:下一会话
    executable_path: ''
    #: 浏览器用户数据目录｜本地会话共享的持久 Chromium 配置目录；留空则每个会话使用一次性的全新配置。｜范围:字符串｜生效:下一会话
    user_data_dir: ''
    #: Chromium 额外参数｜本地会话额外传给 Chromium 的启动参数列表，例如 ["--lang=de"]。｜范围:列表｜生效:下一会话
    chromium_args: []
    #: 私有地址用本地浏览器｜使用云浏览器时，局域网/localhost 地址自动改用本地 Chromium 打开；关闭则拒绝访问此类地址。默认开启。｜范围:true/false｜生效:下一会话
    auto_local_for_private_urls: true
    #: CDP 连接地址｜持久 CDP 端点地址，用于连接已在运行的 Chromium/Chrome。留空则不使用。｜范围:字符串｜生效:下一会话
    cdp_url: ''
    #: 使用真实浏览器配置｜同意使用你真实的登录状态浏览：复制默认 Chromium 配置（Cookie、登录、偏好）的快照供智能体使用。关闭时会删除该快照，避免凭据残留。仅支持 Chromium 系浏览器。默认关闭。｜范围:true/false｜生效:下一会话
    use_real_profile: false
    #: 自动关闭占用浏览器｜仅 Windows：正在运行的 Chrome/Edge/Brave 会锁定 Cookie 数据库。开启后智能体会先征询，批准后关闭该配置的浏览器（未保存标签会丢失）以便复制配置；不会自动强杀。默认关闭。｜范围:true/false｜生效:下一会话
    real_profile_autoclose: false
    #: 固定浏览器配置｜指定真实配置浏览时快照哪个源配置目录（例如 Profile 2）。留空使用浏览器最近使用的配置；指定目录不存在时不会回退，而是使用未登录的新浏览器。｜范围:字符串｜生效:下一会话
    real_profile_pin: ''
    #: 弹窗处理策略｜浏览器 JS 弹窗（alert/confirm 等）的处理方式：must_respond-必须由智能体响应（默认） auto_dismiss-自动取消 auto_accept-自动确认。仅在支持 CDP 的后端生效。｜范围:must_respond|auto_dismiss|auto_accept｜生效:下一会话
    dialog_policy: must_respond
    #: 弹窗超时｜must_respond 策略下，弹窗无人响应多少秒后自动取消，默认 300。｜范围:整数｜生效:下一会话
    dialog_timeout_s: 300
    #: Camofox 插件配置｜Camofox 浏览器插件读取的自由键值配置（该能力已移出核心）。默认空。｜范围:键值对｜生效:下一会话
    camofox: {}

  # ---- 工作树 ----
  worktrees:
    #: 归档未提交工作树｜清理过期 git 工作树时，对有未提交/未推送改动的工作树先归档再删除；关闭则永不删除此类工作树。默认开启。｜范围:true/false｜生效:下一会话
    archive_dirty: true
    #: 归档文件大小上限｜大于此大小（MB）的未跟踪文件不归档，包含此类文件的工作树将被保留。默认 50。｜范围:整数｜生效:下一会话
    archive_max_file_mb: 50
    #: 归档保留天数｜清理任务删除超过此天数的归档引用；0 表示永久保留。默认 30。｜范围:整数｜生效:下一会话
    archive_retention_days: 30
    #: 工作树总容量上限｜空闲工作树的总大小预算（GB），超出时优先归档并删除最旧的空闲工作树。0 表示不限制。默认 0。｜范围:整数｜生效:下一会话
    max_total_gb: 0
    #: 安装状态保留天数｜已不存在的检出所对应的安装状态目录，超过此天数未使用即删除；0 表示永不删除。默认 14。｜范围:整数｜生效:下一会话
    install_state_retention_days: 14

  # ---- 检查点 ----
  checkpoints:
    #: 启用文件检查点｜每轮首次写文件时为工作目录做快照，可用 /rollback 回滚。默认关闭。｜范围:true/false｜生效:下一会话
    enabled: false
    #: 最多快照数｜每个工作目录保留的检查点数量上限，超出后清理旧快照。默认 20。｜范围:整数｜生效:下一会话
    max_snapshots: 20
    #: 检查点总容量上限｜检查点存储总大小上限（MB），超出时按项目轮流删除最旧检查点；0 表示不限制。默认 500。｜范围:整数｜生效:下一会话
    max_total_size_mb: 500
    #: 单文件大小上限｜大于该 MB 的文件（数据集、模型权重等）不纳入快照；0 表示不过滤。默认 10。｜范围:整数｜生效:下一会话
    max_file_size_mb: 10
    #: 自动清理检查点｜后台定期删除超过保留天数的项目快照并压缩存储（不会删除工作目录已丢失的孤儿项）。默认开启。｜范围:true/false｜生效:下一会话
    auto_prune: true
    #: 检查点保留天数｜项目最后使用超过该天数后，其检查点会被自动清理。默认 7。｜范围:整数｜生效:下一会话
    retention_days: 7
    #: 清理最小间隔｜两次自动清理之间的最短间隔（小时）。默认 24。｜范围:整数｜生效:下一会话
    min_interval_hours: 24

  # ---- MCP 服务 ----
  mcp:
    #: 配置变更自动重载 MCP｜config.yaml 中 mcp_servers 变更时自动重连 MCP（会使提示缓存失效）；关闭时仅提示使用 /reload-mcp。默认开启。｜范围:true/false｜生效:下一会话
    auto_reload_on_config_change: true
    #: MCP 并发连接数｜每次发现过程中同时连接（并启动子进程）的 MCP 服务器数量上限；0 表示不限制。默认 4。｜范围:整数｜生效:下一会话
    discovery_concurrency: 4

  # ---- 工具输出 ----
  tool_output:
    #: 终端输出上限｜终端工具输出的字符上限（保留首尾），默认 50000（约 1.2~1.5 万 tokens）。｜范围:整数｜生效:下一会话
    max_bytes: 50000
    #: 读取行数上限｜单次 read_file 可请求的最大行数，超过将被截断。默认 2000。｜范围:整数｜生效:下一会话
    max_lines: 2000
    #: 单行长度上限｜read_file 带行号视图中每行的最大字符数，默认 2000。｜范围:整数｜生效:下一会话
    max_line_length: 2000

  # ---- 工具循环防护 ----
  tool_loop_guardrails:
    #: 循环警告｜当模型重复失败或无进展的工具调用时发出软性提醒。默认开启。｜范围:true/false｜生效:下一会话
    warnings_enabled: true
    #: 循环强制停止｜达到硬停阈值时强制终止重复的工具调用（交互会话）。默认关闭，以免打断交互流程。｜范围:true/false｜生效:下一会话
    hard_stop_enabled: false
    #: 非交互强制停止｜在无人值守的网关/定时任务中启用硬停（无人可以手动 /stop）；交互式 CLI/TUI/桌面端仍只警告。默认开启。｜范围:true/false｜生效:下一会话
    non_interactive_hard_stop_enabled: true
    warn_after:
      #: 相同失败警告阈值｜完全相同的工具调用连续失败多少次后发出警告，默认 2。｜范围:整数｜生效:下一会话
      exact_failure: 2
      #: 同工具失败警告阈值｜同一工具连续失败多少次后发出警告，默认 3。｜范围:整数｜生效:下一会话
      same_tool_failure: 3
      #: 无进展警告阈值｜幂等工具调用连续无进展多少次后发出警告，默认 2。｜范围:整数｜生效:下一会话
      idempotent_no_progress: 2
    hard_stop_after:
      #: 相同失败停止阈值｜完全相同的工具调用连续失败多少次后强制停止，默认 5。｜范围:整数｜生效:下一会话
      exact_failure: 5
      #: 同工具失败停止阈值｜同一工具连续失败多少次后强制停止，默认 8。｜范围:整数｜生效:下一会话
      same_tool_failure: 8
      #: 无进展停止阈值｜幂等工具调用连续无进展多少次后强制停止，默认 5。｜范围:整数｜生效:下一会话
      idempotent_no_progress: 5
    loop_caps:
      #: 每轮搜索上限｜每一轮最多调用 web_search 的次数，每轮重置且始终生效。0 表示不限。默认 50。｜范围:整数｜生效:下一会话
      max_web_searches: 50
      #: 每轮子智能体上限｜每一轮最多派生的子智能体数量，每轮重置且始终生效。0 表示不限。默认 50。｜范围:整数｜生效:下一会话
      max_subagents: 50

  # ---- 上下文压缩 ----
  compression:
    #: 启用上下文压缩｜上下文接近窗口上限时自动摘要压缩历史。默认开启。｜范围:true/false｜生效:下一会话
    enabled: true
    #: 压缩前要求检查点｜开启后，除非活动记忆提供方确认并完成检查点，否则拒绝有损压缩。默认关闭。｜范围:true/false｜生效:下一会话
    checkpoint_required: false
    #: 压缩进度通知｜开启后，常规压缩进度状态也推送到聊天网关；失败通知与手动 /compress 反馈始终可见。默认关闭。｜范围:true/false｜生效:下一会话
    progress_notices: false
    #: 压缩触发比例｜上下文占用超过该比例时触发压缩；窗口小于 512K 的模型下限为 0.75（只升不降）。默认 0.50。｜范围:小数｜生效:下一会话
    threshold: 0.5
    #: 压缩触发 token 数｜可选的绝对 token 阈值，与比例阈值取较低者触发压缩；留空表示仅按比例。｜范围:可空｜生效:下一会话
    threshold_tokens: null
    #: 保留尾部比例｜压缩后作为最近尾部保留的阈值比例。默认 0.20。｜范围:小数｜生效:下一会话
    target_ratio: 0.2
    #: 尾部保留模式｜lean-精简尾部（约窗口 2.5%，1 万~2.5 万 token）加分块摘要与索引，保留 token 少约 3 倍；legacy-按 0.20×阈值原样保留尾部。默认 lean。｜范围:lean|legacy｜生效:下一会话
    tail_mode: lean
    #: 保留最近消息数｜压缩时至少不压缩的最近消息条数（尾部总量仍受 token 限制）。默认 20。｜范围:整数｜生效:下一会话
    protect_last_n: 20
    #: 尾部最少用户消息｜压缩后尾部保证保留的真实用户消息条数；工具输出很大时可调高（如 3）。默认 1。｜范围:整数｜生效:下一会话
    min_tail_user_messages: 1
    #: 压缩最大尝试次数｜一轮内压缩重试的最大回合数（1~10），用尽后报“已达最大压缩次数”。默认 3。｜范围:整数｜生效:下一会话
    max_attempts: 3
    #: 主动裁剪触发 token｜独立于比例阈值、不调用 LLM 的工具结果裁剪触发点（token 数），如 48000；0 表示关闭。每次裁剪会打断提示缓存。｜范围:整数｜生效:下一会话
    proactive_prune_tokens: 0
    #: 裁剪最小结果长度｜主动裁剪仅处理大于该字符数的工具结果（最小 200）。默认 8000。｜范围:整数｜生效:下一会话
    proactive_prune_min_result_chars: 8000
    #: 裁剪最少回收量｜主动裁剪至少能回收该数量 token 时才执行；0 表示不设门槛。默认 4096。｜范围:整数｜生效:下一会话
    proactive_prune_min_reclaim_tokens: 4096
    #: 微压缩｜每轮结束后把最旧的一段对话折叠进滚动摘要以分摊压缩成本；会每轮打断提示缓存，默认关闭。｜范围:true/false｜生效:下一会话
    micro_compact: false
    #: 微压缩频率｜每 N 轮执行一次微压缩（最小 1）；仅在启用微压缩时生效。默认 1。｜范围:整数｜生效:下一会话
    micro_compact_every_n_turns: 1
    #: 滚动摘要整理阈值｜滚动摘要超过该 token 数时，下一次微压缩会重新摘要整理。默认 2000。｜范围:整数｜生效:下一会话
    micro_compact_defrag_threshold_tokens: 2000
    #: 会话强制压缩条数｜网关会话卫生检查中，消息条数达到该值即强制压缩。默认 5000。｜范围:整数｜生效:下一会话
    hygiene_hard_message_limit: 5000
    #: 卫生压缩无进展超时｜网关等待会话卫生压缩在无进展情况下的最长秒数（仍在输出 token 会延长等待）。默认 30。｜范围:整数｜生效:下一会话
    hygiene_timeout_seconds: 30
    #: 卫生压缩总时限｜即使仍在输出 token，卫生压缩等待的绝对上限秒数（不小于无进展超时）。默认 600。｜范围:整数｜生效:下一会话
    hygiene_total_ceiling_seconds: 600
    #: 卫生压缩失败冷却｜卫生压缩失败后再次尝试前的冷却秒数。默认 300。｜范围:整数｜生效:下一会话
    hygiene_failure_cooldown_seconds: 300
    #: 压缩时消息最长挂起｜卫生摘要进行中时，新到用户消息最多被挂起的秒数，超时则不压缩直接处理。默认 10。｜范围:整数｜生效:下一会话
    hygiene_max_turn_hold_seconds: 10
    #: 压缩无进展超时｜智能体内部压缩（自动、/compress、预检）无进展的最长等待秒数；0 表示不使用该包装。不低于辅助压缩请求超时。默认 120。｜范围:整数｜生效:下一会话
    context_timeout_seconds: 120
    #: 压缩总时限｜压缩摘要阶段即使仍在输出也不超过的绝对等待秒数。默认 600。｜范围:整数｜生效:下一会话
    context_total_ceiling_seconds: 600
    #: 保留开头消息数｜除系统提示外始终原样保留的开头消息条数；0 表示只保留系统提示、摘要与尾部。默认 3。｜范围:整数｜生效:下一会话
    protect_first_n: 3
    #: 摘要失败时中止｜开启后，自动压缩摘要失败时中止压缩而不是用“摘要不可用”占位替换中间内容；会话保持原大小直到 /compress 或 /new。默认关闭。｜范围:true/false｜生效:下一会话
    abort_on_summary_failure: false
    #: Codex 模型阈值上调｜在 ChatGPT Codex OAuth 线路上，对 gpt-5.4/5.5/5.6 等被限制为 272K 窗口的模型把压缩触发点提高到 85%；关闭则使用全局阈值。默认开启。｜范围:true/false｜生效:下一会话
    codex_gpt55_autoraise: true
    #: 阈值上调提示｜显示一次性的阈值上调提示横幅；关闭仅隐藏提示，不影响上调。默认开启。｜范围:true/false｜生效:下一会话
    codex_gpt55_autoraise_notice: true
    #: Codex 应用服务压缩｜Codex app-server 线程的压缩方式：native-由 Codex 自行决定，hermes-按 PDR 智能体阈值触发线程压缩，off-从不自动触发。默认 native。｜范围:app|native|hermes|off｜生效:下一会话
    codex_app_server_auto: native
    #: Responses 服务端压缩｜在 Responses API 上启用 OpenAI 服务端压缩（仅 gpt-5.6 系列于官方或 Codex 后端），本地压缩作为后备。默认关闭。｜范围:true/false｜生效:下一会话
    codex_responses_native: false
    #: 服务端压缩阈值｜服务端压缩触发的绝对输入 token 数；留空则跟随本地阈值并留安全余量，显式值只会向下钳制。｜范围:可空｜生效:下一会话
    codex_responses_compact_threshold: null
    #: 原地压缩｜压缩时不更换会话 ID（无父会话链、不重新编号），压缩前的内容在同一 ID 下软归档且仍可搜索；关闭则使用旧的轮换式压缩。默认开启。｜范围:true/false｜生效:下一会话
    in_place: true
    #: 按模型压缩阈值｜模型名子串 → 压缩触发比例（覆盖全局阈值，最长匹配优先），键可加 <提供商>: 前缀限定路由，如 {"glm-5.2": 0.40}。默认空。｜范围:键值对｜生效:下一会话
    model_thresholds: {}
    #: 空闲后预先压缩｜会话空闲超过该秒数后再恢复时，先压缩再回复（如 1800 = 30 分钟）；0 表示关闭（默认）。｜范围:整数｜生效:下一会话
    idle_compact_after_seconds: 0
    #: 提前准备摘要｜接近触发点时在后台预先生成下一份摘要，压缩时若仍覆盖相同消息则直接使用。默认关闭。｜范围:true/false｜生效:下一会话
    prepare_ahead: false

  # ---- 提示缓存 ----
  prompt_caching:
    #: 提示缓存时长｜Anthropic 提示缓存 TTL：5m-5 分钟，1h-1 小时，auto-人工交互会话用 1h、子智能体/定时任务等用 5m；false/off/none 等表示关闭缓存。默认 5m。｜范围:字符串｜生效:下一会话
    cache_ttl: 5m

  # ---- OpenRouter ----
  openrouter:
    #: OpenRouter 响应缓存｜启用 OpenRouter 响应缓存（X-OpenRouter-Cache 头）：相同请求直接返回缓存结果且不计费；与 Anthropic 提示缓存相互独立。默认开启。｜范围:true/false｜生效:下一会话
    response_cache: true
    #: 响应缓存有效期｜OpenRouter 响应缓存的有效期（秒，1~86400），仅在启用响应缓存时生效。默认 300。｜范围:整数｜生效:下一会话
    response_cache_ttl: 300
    #: 最低编码评分｜pareto-code 路由的最低编码能力评分（0.0~1.0），仅当模型为 openrouter/pareto-code 时生效；越高越强也越贵，0.65 为中档，留空则由 OpenRouter 选择最强模型。默认 0.65。｜范围:小数｜生效:下一会话
    min_coding_score: 0.65

  # ---- AWS Bedrock ----
  bedrock:
    #: Bedrock 区域｜AWS Bedrock 区域；留空则使用 AWS_REGION 环境变量，再回退 us-east-1。仅当提供商为 bedrock 时使用。｜范围:字符串｜生效:下一会话
    region: ''
    discovery:
      #: 自动发现模型｜通过 ListFoundationModels 自动发现 Bedrock 可用模型。默认开启。｜范围:true/false｜生效:下一会话
      enabled: true
      #: 模型提供方过滤｜仅发现这些模型提供方的模型，例如 ["anthropic", "amazon"]；留空表示全部。｜范围:列表｜生效:下一会话
      provider_filter: []
      #: 发现结果刷新间隔｜模型发现结果的缓存时长（秒），默认 3600。｜范围:整数｜生效:下一会话
      refresh_interval: 3600
    guardrail:
      #: 护栏 ID｜Bedrock Guardrails 护栏 ID（需先在控制台创建），例如 abc123def456。留空则不启用护栏。｜范围:字符串｜生效:下一会话
      guardrail_identifier: ''
