description: "Hermes does the work. 1guy brings it back to you. One desk over your whole Hermes: every session, scheduled job and to-do is a card you touch, put away, schedule or talk to, and one companion on top tells you the few things that need you. Each card opens its own titled Hermes session and streams the reply in place; a talk bar routes a typed line to the right card or just does it. Adds a 1guy page with four lenses (today, board, time, inbox), a docked ticker and a to-do pane; on a new install he introduces himself with starting points built from what is really there. Disclosure — reads state.db (read-only SQLite), cron/jobs.json, cron/output, cache/delegation/live, skill folder names and mcp_servers names in config.yaml read-only; reads and writes tasklist.md in the Hermes home (created if missing; appends a short ^anchor to a line when it gets a thread); keeps its own state in plugin-data/1guy. While the board is open it makes short background calls on your active model through ctx.llm to write card headlines, one-line session outcomes and proposed piles, and to route typed lines (these carry card titles and short session excerpts and spend your tokens; ONEGUY_HEADLINES=off disables the headline calls and ONEGUY_OUTCOMES=off the outcome lines). Talking to a card creates a normal Hermes session through the desktop app and sends that card's context into it; when the card is finished or quiet for 48h that session is archived through the desktop app (messages kept, back when the card is opened; ONEGUY_THREAD_TIDY=off disables). Pressing 'run now' on a job card runs `hermes cron run <id>`. It reads no mail or calendar itself: if your Hermes has an email or calendar skill (checked by folder and MCP server NAME only) it offers to create one read-only scheduled Hermes job, `1guy-mail-cal` (`hermes cron create`, then `hermes cron run`), which runs an agent turn with your own mail and calendar tools three times a day (7am, noon, 5pm); later, on that job only, `hermes cron run` when the board is opened over a digest older than an hour (at most hourly) and `hermes cron edit` to update a job made by an older version; and shows what that job wrote. No network calls of its own, no telemetry, no credentials read or stored."
