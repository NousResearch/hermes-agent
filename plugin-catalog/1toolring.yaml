description: "One API key and one prepaid balance for thousands of pay-per-call tools from third-party providers, through 1ToolRing's hosted MCP server (Streamable HTTP at https://mcp.1toolring.com/mcp, API key auth): live Google search results, keyword and SEO data, Google Maps places, e-commerce prices, stock, crypto and exchange-rate data, people and company enrichment, email and contact finding, social media data, web scraping, jobs, weather, and AI image, video and voice tools. Four MCP tools: discover_tools, inspect_tool and get_tool_run (free, read-only) and run_tool (paid). Bundles the 1toolring skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local code: every tool call, with its arguments, goes to mcp.1toolring.com, and run_tool spends the key owner's prepaid 1ToolRing balance at the price inspect_tool shows (failed runs are not charged; no subscription). The package marks the server untrusted, so Hermes asks before every run_tool call. The key is read from ONETOOLRING_API_KEY in the profile .env (or the plugin's settings form) and sent as a bearer header. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
