description: "LinkedIn posts in the user's own voice through 2pr.io's official MCP server (Streamable HTTP at https://2pr.io/api/mcp, OAuth 2.1 sign-in, no keys in config): draft and refine posts, schedule or publish them to LinkedIn and X, read the comment inbox and post approved replies, and pull post and profile analytics. Bundles two workflow skills: linkedin-posting and linkedin-engagement. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to 2pr.io, which stores the user's drafts, scheduled posts and analytics under their 2pr.io account and publishes through LinkedIn's and X's official APIs. Publishing, scheduling and replying are public actions; the package marks the server untrusted, so Hermes asks before any tool that is not annotated read-only (publishing, scheduling, replying, deleting) and refuses them where nobody can answer. Needs a 2pr.io Pro or Team plan. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
