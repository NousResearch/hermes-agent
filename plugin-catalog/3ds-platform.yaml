title: Nintendo 3DS
description: "Talk to Hermes from a Nintendo 3DS: a gateway platform for the Hermes 3DS homebrew app, with streaming replies, approvals and clarify questions, sessions, skills, jobs, model and slash-command pickers, pictures, documents, audio, voice messages, camera photos and spoken replies, over an end-to-end encrypted Noise IK link (LAN, or away from home through Tailscale Funnel). Disclosure — opens a TCP listener on all interfaces (port 7333) and a UDP discovery responder (7334); paired consoles (Noise IK keys in the plugin's data folder, paired by one-time LAN-only code) get full agent chat including approval answers; opt-in away mode publishes a persistent public Tailscale Funnel to a loopback listener; runs `tailscale`, `ffmpeg` and the desktop file opener, and downloads image links in replies; the dev-only `security: plaintext` setting accepts unauthenticated connections."
