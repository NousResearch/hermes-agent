title: Nintendo 3DS
description: "Talk to Hermes from a Nintendo 3DS: a gateway platform for the Hermes 3DS homebrew app, with streaming replies, approvals and clarify questions, a chat per Hermes profile (Bot Mode bots, with their pictures; new bots made from the 3DS), sessions (rename, delete), skills and tool sets (on and off), scheduled jobs (make, change, delete), model and slash-command pickers, pictures, documents, files sent from the SD card, audio, voice messages, camera photos and spoken replies, a setup checker (`hermes 3ds doctor`) and a notice when a newer release is out, over an end-to-end encrypted Noise IK link (LAN, or away from home through Tailscale Funnel). Disclosure — opens a TCP listener on all interfaces (port 7333) and a UDP discovery responder (7334); paired consoles (Noise IK keys in the plugin's data folder, paired by one-time LAN-only code) get full agent chat including approval answers; they can also send files of up to 8 MB into Hermes' image and document cache, make, change and delete cron jobs (through `cronjob_manage`), rename and permanently delete their own chat's sessions, and turn skills and tool sets off and on for 3DS chats, which writes `skills.platform_disabled.3ds` and `platform_toolsets.3ds` in the profile's `config.yaml`; about once a day the gateway makes one request to `api.github.com` for this project's newest release (no user, device or version in it; `update_check: false` turns it off); opt-in away mode publishes a persistent public Tailscale Funnel to a loopback listener; runs `tailscale`, `ffmpeg` and the desktop file opener, and downloads image links in replies; making a bot from the 3DS runs `hermes profile create <name> --clone-from <main> --no-alias` (copies config, API keys and skills) and `hermes -p <name> config set platforms.3ds.enabled true`; with `gateway.multiplex_profiles` on, paired consoles reach every profile that has the 3ds platform on, whose requests run in that profile's home and secret scope, and each profile's plugin copy finds the one listener through an in-memory `sys.modules` registry holding only this plugin's adapters; the dev-only `security: plaintext` setting accepts unauthenticated connections."
