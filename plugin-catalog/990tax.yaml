description: "IRS public records on 1.9 million+ US tax-exempt organizations through 990.tax's free MCP server (Streamable HTTP at https://990.tax/mcp, no sign-in, no keys in config): search by name or EIN, exempt status and automatic revocations, missing filing years, Form 990 revenue, expenses, assets and officer pay, which annual return applies and when it's due, statistics and rankings by state and category, and IRS e-file reject codes. Bundles two skills: nonprofit-lookup and form-990-filing. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to 990.tax, run by Digital Tax LLC (an IRS-authorized e-file provider, not the IRS). All eight tools are annotated read-only and the package marks the server untrusted, so Hermes would ask before any tool that is not. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
