title: Account Pool
description: "Run several accounts of one provider in Hermes' credential pool: `hermes account <provider> <action>` adds accounts with email verification, shows live usage per account, keeps the least-used account first (fill_first + a 5-minute balance timer), parks accounts for hours or on a weekly schedule, shows which bot is on which account and its tokens at API prices, and alerts on dead logins, a full pool or a runaway bot. Adapters for anthropic and openai-codex; generic commands for any pool provider. Optional Accounts page in Hermes Desktop. Disclosure — it WRITES credentials: add/relogin/remove/park/unpark/balance change logins in auth.json through Hermes' CredentialPool API or `hermes auth add/remove`; park moves an entry with its OAuth tokens to account-pool-parked.json (mode 600) and balance refreshes those tokens with Hermes' own refresh functions; page sign-in uses Hermes' OAuth client ids. Network: api.anthropic.com (oauth usage/profile), claude.ai and Anthropic's token endpoint, chatgpt.com/backend-api/wham/usage, auth.openai.com, Telegram through `hermes send`; no telemetry. `setup` writes plugins.enabled of every profile (via hermes config set / plugins enable), links the tracker into every profile and, with --timer, a systemd user timer. Runs systemctl --user, notify-send, hermes config set, hermes auth, hermes send; reads every profile's config.yaml and state.db (read-only) and /proc. The command registers in the default profile only and provides no tools."
