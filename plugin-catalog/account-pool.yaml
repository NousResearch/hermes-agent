title: Account Pool
description: "Run several accounts of one provider in Hermes' credential pool: `hermes account <provider> <action>` adds accounts with email verification, shows live usage per account, keeps the least-used account first (fill_first + a 5-minute balance timer over every provider with accounts), parks accounts for hours or on a weekly schedule, shows which bot is on which account and its tokens at API prices, alerts on dead logins, a full pool or a runaway bot, and can start an idle account's 5-hour window with one tiny request (wake). Adapters for anthropic and openai-codex; generic commands for any pool provider. Optional Accounts page in Hermes Desktop. Linux and Windows. Disclosure — it HOLDS and WRITES credentials (not rule-11 compliant, see the PR): park moves an entry with its OAuth tokens to account-pool-parked.json (mode 600) and balance reads the usage of parked accounts and refreshes their tokens with Hermes' refresh functions; live usage and the email check call api.anthropic.com/api/oauth/usage and /profile and chatgpt.com/backend-api/wham/usage with each account's token and Hermes' usage-fetcher client headers; Desktop sign-in runs OAuth in the page backend with Hermes' client ids, and Codex browser sign-in listens on 127.0.0.1:1455 for up to 15 minutes; wake (a command, a page button, or the timer after the opt-in `wake auto-on`) sends one one-word request per account, through Hermes' Anthropic client or the Codex Responses endpoint, and reads the account's model list; reads auth.json for the provider list and doctor. Other writes go through Hermes' CredentialPool API or `hermes auth add/remove`. Telegram through `hermes send`; no telemetry. `setup` writes plugins.enabled of every profile, links the tracker into every profile and, with --timer, a systemd user timer (Linux) or a Task Scheduler task for the user (Windows, no admin rights). Runs systemctl --user and notify-send (Linux), schtasks and powershell.exe for notifications (Windows), hermes config set, hermes plugins enable, hermes auth, hermes send; reads every profile's config.yaml and state.db (read-only), and /proc on Linux. The command registers in the default profile only and provides no tools."
