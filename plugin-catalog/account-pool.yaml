title: Account Pool
description: "Run several accounts of one provider in Hermes' credential pool: `hermes account <provider> <action>` adds accounts with email verification, shows live usage per account, keeps the least-used account first (fill_first + a 5-minute balance timer over every provider with accounts), parks accounts for hours or on a weekly schedule, shows which bot is on which account and its tokens at API prices, and alerts on dead logins, a full pool or a runaway bot. Adapters for anthropic and openai-codex; generic commands for any pool provider. Optional Accounts page in Hermes Desktop. Disclosure — it HOLDS and WRITES credentials (not rule-11 compliant, see the PR): park moves an entry with its OAuth tokens to account-pool-parked.json (mode 600) and balance refreshes those tokens with Hermes' refresh functions; live usage and the email check call api.anthropic.com/api/oauth/usage and /profile and chatgpt.com/backend-api/wham/usage with each account's token and Hermes' usage-fetcher client headers; Desktop sign-in runs OAuth in the page backend with Hermes' client ids, and Codex browser sign-in listens on 127.0.0.1:1455 for up to 15 minutes; reads auth.json for the provider list and doctor. Other writes go through Hermes' CredentialPool API or `hermes auth add/remove`. Telegram through `hermes send`; no telemetry. `setup` writes plugins.enabled of every profile, links the tracker into every profile and, with --timer, a systemd user timer. Runs systemctl --user, notify-send, hermes config set, hermes plugins enable, hermes auth, hermes send; reads every profile's config.yaml and state.db (read-only) and /proc. The command registers in the default profile only and provides no tools."
