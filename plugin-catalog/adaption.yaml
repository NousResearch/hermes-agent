description: "Dataset import, adaptation, augmentation, translation, localization, synthetic generation (Invent), and AutoScientist fine-tuning through Adaption's hosted MCP server, with three workflow skills bundled. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — every tool call goes to Adaption's hosted server (api.prod.adaptionlabs.ai) and acts on the user's Adaption account, tagged with a fixed hermes-plugin source parameter and header; the tool set is served by that server at runtime and is not covered by the pinned sha. Sign-in runs the pinned mcp-remote@0.1.49 through npx (Node.js 20.18.1+ and npm required; its own npm dependencies resolve to their latest matching versions at first run) with Adaption's pre-registered public OAuth client, which opens a browser and a local callback port on first use and stores OAuth tokens under ~/.mcp-auth. Launching runs spends Adaption credits; the package marks the server untrusted, so Hermes asks before every tool the server does not mark read-only (including cost estimates) and refuses them in unattended runs."
