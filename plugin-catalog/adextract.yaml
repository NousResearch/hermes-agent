description: "Competitor ad research for your agent through adextract's hosted MCP server (Streamable HTTP at https://mcp.adextract.co/mcp): search the public ad libraries of Meta, Google, LinkedIn and TikTok, open single-ad details, and analyze any ad image or video. Bundles five research skills. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to mcp.adextract.co with an API key you create, sent as an Authorization header and read from your profile environment. The server records tool name, time, success and credits used per account, not search queries, and may email the account address about the account. Each successful call uses one credit, declared in the package's cost table. All 13 tools are annotated read-only and the server is marked untrusted. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
