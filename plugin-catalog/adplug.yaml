description: >-
  Manage Google Ads, Meta Ads, LinkedIn Ads, Microsoft Ads and Reddit Ads in Hermes Agent. Analyse performance, find wasted spend and build or optimise campaigns with your approval. Agent Plugins v1 package: 16 PPC skills, one per platform plus 11 for jobs like client briefs, audits, ad copy and routines. The skills were written and are used by a PPC expert with 12 years in the field and $100M+ in ad spend managed. Sign-in is Hermes' own OAuth 2.1 through one hermes mcp add command: no Node.js, npx or API keys. On a paid plan, add HubSpot and the agent judges lead quality and sends qualified leads back to Google, Microsoft, LinkedIn and Reddit as offline conversions. Disclosure: creates and edits real campaigns that spend real money. The skills have the agent preview every change and wait for an explicit yes, new campaigns and ads start paused or as drafts, and scheduled runs only read and propose. AdPlug won't run a Google Ads or HubSpot change without a preview, and with trust: untrusted Hermes asks before every AdPlug change. Every AdPlug tool call goes to api.adplug.app.
