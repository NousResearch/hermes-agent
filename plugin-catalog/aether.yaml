description: "Living themes for Hermes Desktop: ask Hermes for any look and it paints a full palette plus an animated WebGL scene behind your chats, or pick one of eighteen scenes, put any of ten finishes on it, recolour it in an editor that keeps text readable, let the scene react to the pointer, and switch to or recolour the theme plugins you already have from other creators. Disclosure — no network calls of its own, no telemetry, no credentials or API keys; themes Hermes makes are stored in the profile's plugin-data; picking Inter, IBM Plex Sans, Space Grotesk or Courier Prime as a theme font loads it from Google Fonts through Hermes Desktop's own theme typography; with pointer reaction on, the Desktop half listens to pointer movement and clicks inside the Hermes window, records nothing and sends nothing; to credit other creators' themes, the agent half reads the installed plugins' plugin.yaml, Desktop script and one picture from their own folders, read only and local only."
