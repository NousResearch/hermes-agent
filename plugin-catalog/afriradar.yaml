title: AfriRadar
description: "Nigerian and Kenyan fund data from the regulators (SEC Nigeria weekly, CMA Kenya quarterly): rank, compare and project funds, keep a watchlist, and get a weekly report of what moved. Eight tools, a zero-token /afriradar command, two automation blueprints and one switchable routing hook; stdlib only, no API key, no telemetry. Disclosure: reads public CSVs from www.afriradar.com only; stores your watchlist in Hermes plugin state."
maintainer: Risingtell
tier: community
category: tools
requires_hermes: ">=0.22.0"
