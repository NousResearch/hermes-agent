name: agenda-guardian
title: Agenda Guardian
repo: https://github.com/Moodtuner997/hermes-agenda-guardian
sha: e13ed40fc2569cd26fac43ef57198a075c78042a
version: "0.3.0"
description: "A day and week planner for people whose discipline cannot be the plan. You write your rules once (work hours, protected time, focus window, longest stretch, tasks per day), estimate each task, and report the real time when it is done: from the third finished task of a kind it multiplies your estimates by your own median error and says so. It places tasks in the free time around the meetings of any calendar source (the Google Workspace skill, an ICS file or URL, a JSON file, or any command that prints event JSON), every block states the rule it comes from, and a full day says what does not fit. Activities that are not tasks (sport, a long call, an errand) get a sheet (real length, time before and after, when it fits): asked where one could go, it answers with reasons read from eight weeks of your own calendar history, asks about what the calendar cannot show, and writes nothing until you say yes. Writing to a Google calendar is off until you type /day write on yourself; then it only adds events it marks as its own, only after a validated proposal, never edits an event, and can only remove the events it wrote. After a written session it asks how long it really took, so the next proposal follows your pace. Optional morning brief and block reminders run as two script-only cron jobs. Deterministic, no model call. English and French. Slash command, CLI, thirteen agent tools and a Today / Week dashboard tab. Disclosure — no network by default; with an ICS URL it fetches that URL; with the google or cmd source it runs the program you configure (no shell, 25 s timeout); reads the calendar source you configure (event titles and times, for the next days and, when you ask for a proposal, the eight weeks before) and, for onboarding only, the timezone and language lines of config.yaml, whether the Google Workspace skill and its sign-in file exist (the file is never opened) and the name and schedule of your other cron jobs (prompts are not read); writes its own data folder (one SQLite file: rules, tasks, activity sheets, habits, proposals and the record of what it wrote), after /day cron on two small Python scripts in HERMES_HOME/scripts and two cron jobs named agenda-guardian-brief and agenda-guardian-nudge created through the cronjob_manage tool, and, only after you typed /day write on and validated a proposal, new events (up to three per session) whose description carries an [agenda-guardian:...] marker, created and removed through the Google Workspace skill's calendar create and calendar delete on the primary calendar (a deletion is refused unless the event id is in its own record and the marker is still on the event); registers one system-prompt section of rules for the agent; no model calls; no stored credentials; no background process; no telemetry; registers no hook or middleware."
maintainer: Moodtuner997
