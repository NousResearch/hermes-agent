name: agenda
title: Agenda
repo: https://github.com/zzzubair/hermes-agenda
sha: "28d6eceea3622a24a4b910dcd02a183ff504a140"
version: "1.0.1"
description: "Your agent's own todo list, brought up in conversation when items are due. Disclosure: adds due items to each turn (pre_llm_call, capped by max_tokens); stores items in plaintext under $HERMES_HOME/agenda/; runs `hermes wake` or `hermes cron` only for deadline reminders, and no cron jobs from inside a cron run unless cron.allow_agent_scheduling is on; no network calls, telemetry or credentials."
maintainer: zzzubair
tier: community
category: automation
requires_hermes: ">=0.23.0"
docs_url: https://github.com/zzzubair/hermes-agenda/blob/28d6eceea3622a24a4b910dcd02a183ff504a140/README.md
readme: true
platforms: [linux, macos]
capabilities:
  provides_tools: [agenda]
  provides_hooks: [pre_llm_call]
  provides_middleware: []
  requires_env: []
known_issues:
  - "The agenda tool appears in new sessions after enabling; existing chats only get the per-turn list."
  - "Hard-deadline reminders need either the wake plugin (reminders: wake) or a cron delivery target (reminders: cron, cron_deliver). With neither, items still come up the next time you talk to the agent."
