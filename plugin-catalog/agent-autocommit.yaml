name: agent-autocommit
version: "1.0.0"
repo: https://github.com/gatoarmen/agent-autocommit
sha: a8f138449b5fd8b1ddcf6ebc2d68e0e9506f7a36
subdir: agent_autocommit
description: "Every agent commits its own edits locally at the end of each turn: only its own hunks, authored as its profile, never a push. In a Kanban turn the commit message carries the card id and its Why: line, and when the card is done each repo it changed gets a WHY.md entry. Does nothing until you set roots. Disclosure — runs local git commands (status, hash-object, commit-tree, update-ref) in repos under your configured roots; skips repos with a remote by default; saves first-edit file snapshots and a commits.jsonl log under <hermes root>/cache/agent-autocommit; reads kanban.db files read-only to get card titles; no network calls, no credentials, no telemetry."
maintainer: gatoarmen
tier: community
category: automation
docs_url: https://github.com/gatoarmen/agent-autocommit/blob/a8f138449b5fd8b1ddcf6ebc2d68e0e9506f7a36/README.md
platforms: [linux, macos]
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - post_llm_call
    - kanban_task_completed
  provides_middleware: []
  requires_env: []
