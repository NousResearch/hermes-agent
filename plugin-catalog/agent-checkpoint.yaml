title: Agent Checkpoint
description: "Durable progress checkpoints for long, budget-capped Hermes runs: at 50% of a run's budget the plugin tells the agent to persist everything found so far, and at 80% of the time budget / 90% of the turn budget it persists the checkpoint itself — a checkpoint file plus, in kanban runs, a task comment — evaluated at tool-call boundaries and by a per-session watchdog thread, with interval checkpoint coverage for uncapped runs. It guarantees a paper trail, not completion. Disclosures: no network calls; reads the kanban DB read-only for cap discovery; writes checkpoint files under $HERMES_HOME/agent-checkpoints/ and posts kanban task comments by writing the board DB directly (raw sqlite mirroring kanban_db.add_comment — no public comment API exists); runs one daemon watchdog thread per session, exiting at session end; uses two private core imports (hermes_cli.kanban_db.kanban_db_path, hermes_cli.goals.load_goal) that draw warnings, never failures, from hermes plugins validate; no credentials, no telemetry, no self-update."
maintainer: mbgulden
tier: community
category: automation
requires_hermes: ">=0.20.5"
version: "0.3.0"
docs_url: https://github.com/mbgulden/agent-checkpoint/blob/21013a3ffaad456da8d7c6955756770ed94d69c3/README.md
