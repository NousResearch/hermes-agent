name: agent-janitor
version: "0.3.1"
repo: https://github.com/ZidoCode/agent-janitor
sha: f8306948aa8edd0f7197dc9890ccd4fa19dd7aee
description: "Process hygiene for agent machines — finds the background processes your agent left behind (dev servers, tunnels, watchers, nohup jobs) using evidence signals (ppid=1 reparent, port listener via /proc/net/tcp{,6}, dev-server traits, TTL exceeded) and attributes them to the originating tool call via agent-ledger's ledger when present. Dry-run by default: nothing is killed until you write policy_mode=enforce; system daemons and host/VM management agents are exempt by name, a user-editable whitelist covers your real infrastructure, and each kill re-reads the cmdline first (SIGTERM, 2s, SIGKILL with PID-reuse check). stdlib-only, fails open."
maintainer: ZidoCode
tier: community
category: tools
requires_hermes: ">=0.21.6"
docs_url: https://github.com/ZidoCode/agent-janitor#readme
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - post_tool_call
  provides_middleware: []
  requires_env: []
