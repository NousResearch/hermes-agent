name: agent-ledger
repo: https://github.com/ZidoCode/agent-ledger
sha: dd90932640e2423fbbfa142794e03b6a1386aa92
description: Write-ahead ledger for agent side effects. Catches tool calls issued but never confirmed (e.g. lost to a compaction turn teardown), injects a verification prompt so the agent checks real state, and scores the agent's activity against the OWASP Top 10 for Agentic Applications 2026 (ASI02/05/08/10/11) with a daily posture audit.
maintainer: ZidoCode
tier: community
requires_hermes: ">=0.19"
docs_url: https://github.com/ZidoCode/agent-ledger#readme
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - pre_llm_call
    - on_session_start
  provides_middleware: []
  requires_env: []
