known_issues:
  - "Turn on both switches on the Agent Runs row in Capabilities → Plugins (Agent for the backend, Desktop for the pane), then restart the gateway once, between chats."
  - "Lists only runs it saw while they were running: runs that ended before install, or while the gateway was off, do not appear."
  - "Runs started with --no-session-persistence (including Hermes' own Claude model calls) have no log to show."
