version: "0.1.0"
description: "A read-only Hermes Desktop pane that lists the coding-agent runs on this computer (Claude Code today) and follows each one's log live: status, project folder, the Hermes chat or cron job that started it, and every prompt, message and tool call. It finds runs by itself, however they were started (a Hermes chat's background terminal, cron, a terminal, an IDE): no hooks, flags or setup. Also a status-bar count of live runs, a ⌘K command and an Open large view. Disclosure — reads the process list (command lines of all processes; environment and working folder of Claude Code processes only, to tell where a run came from and which config folder it uses; environment values stay in the backend and the pane gets flags only, never the prompt). Reads Claude Code's files read-only: ~/.claude/sessions/<pid>.json and the session logs under ~/.claude/projects/ (or a run's CLAUDE_CONFIG_DIR); never the .key files and never writes to ~/.claude. Writes only plugin-data/agent-runs/runs.json in the active profile's Hermes home (recently seen runs, so finished ones survive a gateway restart). Asks Hermes for chat titles to label runs. Never sends input to a run or stops one. No network, no subprocesses, no model calls, no telemetry, no update check."
