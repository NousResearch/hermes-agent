name: agent-security-guard
repo: https://github.com/xMannixx/Agent-Security-Guard
sha: 1ee28c5a8d8a915d070ca39047e4abe22f0a8a6a
subdir: plugin
title: Agent Security Guard
description: 'Deterministic guard against prompt injection turning into actions. Results of web, search
  and browser tools reach the model wrapped as untrusted data; every planned tool call is checked
  against fixed action and sequence rules before it runs. After outside content entered a turn, a
  shell command, file write, install, config change or external send goes to Hermes''s approval
  prompt; a secret is not sent out through web, e-mail, upload or push tools; the agent does not
  rewrite its own guard or skills on its own initiative. No model decides; every decision is recorded
  in a hash-chained audit trail. Disclosure — no network calls, no shell commands, no background
  process, no credentials, no Python dependencies. Reads its policy from
  /etc/agent-security-guard/guard.yaml or guard.yaml in the Hermes home; for file tools it resolves the named
  path (realpath, stat) without reading the file; writes its audit trail (mode 0600) to
  $XDG_STATE_HOME/agent-security-guard. Sees tool calls, not what runs inside a shell command; not a
  sandbox.'
maintainer: xMannixx
tier: community
category: tools
requires_hermes: ">=0.21.6"
version: "0.4.3"
docs_url: https://github.com/xMannixx/Agent-Security-Guard
readme: true
platforms: []
known_issues:
  - Sees tool calls, not what happens inside a shell command; the approval prompt after outside content is the protection there.
  - Messaging tools (send_message) are audited, not stopped, also when the text holds a secret.
  - One audit trail per OS user; Hermes profiles each read their own guard.yaml but share the trail.
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - pre_tool_call
    - transform_tool_result
  provides_middleware: []
  requires_env: []
