title: Agent Security Guard
description: "Deterministic guard against prompt injection turning into actions. Results of web, search and browser tools, of shell downloads from another host and of MCP servers marked trust: untrusted reach the model wrapped as untrusted data; every planned tool call is checked against fixed action and sequence rules before it runs. After outside content entered a turn, a shell command, file write, install, config change, external send, a browser action that types or clicks, input to a running process or a write-capable MCP tool goes to Hermes's approval prompt; a secret is not sent out through web, e-mail, upload or push tools; the agent does not rewrite its own guard or skills on its own initiative. No model decides; every decision is recorded in a hash-chained audit trail. Disclosure — no network calls, no shell commands, no background process, no credentials, no Python dependencies. Reads its policy from /etc/agent-security-guard/guard.yaml or guard.yaml in the Hermes home; loads its rule engine from /usr/local/lib/agent-security-guard/src or agent-security-guard/src in the Hermes home ahead of the pinned copy when an operator installed one there; for file tools it resolves the named path (realpath, stat) without reading the file; parses browser_exec code with Python's ast module without running it; reads (never writes) Hermes's MCP registry for each tool's readOnlyHint and its server's trust level (tools.mcp_tool, tools.mcp_tool_schema, tools.mcp_tool_scope; switch mcp_hints); writes its audit trail (mode 0600) to $XDG_STATE_HOME/agent-security-guard. Sees tool calls, not what runs inside a shell command; not a sandbox."
maintainer: xMannixx
tier: community
category: tools
requires_hermes: ">=0.21.6"
version: "0.5.0"
docs_url: https://github.com/xMannixx/Agent-Security-Guard
readme: true
platforms: []
known_issues:
  - Sees tool calls, not what happens inside a shell command; the approval prompt after outside content is the protection there.
  - Messaging tools (send_message) are audited, not stopped, also when the text holds a secret.
  - Reading a page and acting on it in the same turn is asked about by design; the next turn starts clean.
  - MCP readOnlyHint is taken on trust; results of MCP servers count as outside content only when the server is marked trust untrusted or listed in untrusted_content_tools.
  - The browser_exec check is an allow-list over the parsed code, not a sandbox; code it does not know is asked about after outside content.
  - The MCP facts come from private Hermes modules (no public seam yet); if they change, the guard falls back to treating MCP tools by name and tool_tiers.
  - One audit trail per OS user; Hermes profiles each read their own guard.yaml but share the trail.
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - pre_tool_call
    - transform_tool_result
  provides_middleware: []
  requires_env: []
