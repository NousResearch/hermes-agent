title: Agent Security Guard
description: "Deterministic guard against prompt injection turning into actions. Results of web, search and browser tools and of shell downloads from another host reach the model wrapped as untrusted data; every planned tool call is checked against fixed action and sequence rules before it runs. After outside content entered a turn, a shell command, file write, install, config change, external send, a browser action that types or clicks, or input to a running process goes to Hermes's approval prompt; a secret is not sent out through web, e-mail, upload or push tools; the agent does not rewrite its own guard or skills on its own initiative. No model decides; every decision is recorded in a hash-chained audit trail. An opt-in Hermes Desktop page shows what was asked about, blocked and allowed and why, checks the audit trail, and switches the mode (a weaker mode asks first). Disclosure — no network calls, no shell commands, no background process, no credentials, no Python dependencies. Reads its policy from /etc/agent-security-guard/guard.yaml or guard.yaml in the Hermes home and re-reads it when it changes (checked at most once a second); loads its rule engine from /usr/local/lib/agent-security-guard/src or agent-security-guard/src in the Hermes home ahead of the pinned copy when an operator installed one there, and reloads its own copy when an update replaced it; for file tools it resolves the named path (realpath, stat) without reading the file; parses browser_exec code with Python's ast module without running it; writes its audit trail (mode 0600) to $XDG_STATE_HOME/agent-security-guard. The Desktop page reads that trail through three GET dashboard routes and switches the mode through the plugin RPC method mode.set, which rewrites only the top-level mode: line of guard.yaml in the Hermes home (created with mode 0600 if missing; never the /etc policy, refused when that or AGENT_SECURITY_GUARD_MODE decides the mode) and records each change in the audit trail. It never answers an approval. Sees tool calls, not what runs inside a shell command; not a sandbox."
