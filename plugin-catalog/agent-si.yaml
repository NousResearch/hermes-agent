description: "Sourced, model-free memory: a brain of facts that cite sources and quotes, plus search over past Hermes, Claude Code, Codex and Grok sessions on this machine, in one ranked list. No model, no key, no network, no dependencies. Refuses to store words the user didn't say; says when sources disagree. Disclosure: reads Hermes' state.db in the active home and the session files of Claude Code (~/.claude/projects), Codex (~/.codex/sessions) and Grok (~/.grok/sessions) when present (index_sessions: no turns this off); writes only inside the active Hermes home; one background thread refreshes the index after each turn; the engine and the session index are vendored from the author's public repositories (vendor/VENDORED.md)."
