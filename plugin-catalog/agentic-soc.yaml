name: agentic-soc
title: Hermes Agentic SOC
repo: https://github.com/CyStrat-Services-GmbH/hermes-agentic-soc
sha: 34288f92ae91ce8d33691629b4bdcd9138223be1
description: "Evidence-first SOC and DFIR work for Hermes: seven defense specialist personas (L1 triage, independent L2 analysis, incident handling, threat hunting, DFIR compromise assessment, detection engineering, vulnerability management), 44 skills, 25 technology scaffolds and deterministic THOR triage for THOR 10.7 (JSON v2) and THOR 11 (JSON v3) with exact event counts, correlation, audit trail and human approval. Analysis and response are separate roles with separate decision rights; every persona carries an intake contract, an owned/not-owned decision list, a handoff contract naming what the receiver must re-verify, and a direct human emergency path. Everything is local file work. Disclosure — runs the user's own separately licensed THOR executable (path set in plugin settings) on operator-allowed scan directories, and can create a new Hermes profile through the local `hermes` CLI that gets a persona SOUL.md and a copy of the plugin's skills; both actions run only after Hermes approval, and child processes get a minimal environment (PATH, locale and temp vars, THOR's own THOR_LICENSE when set; HERMES_HOME for the `hermes` CLI). Reads evidence files only inside operator-configured roots and writes reports, a pseudonym salt and an audit log under the plugin's data directory; no network calls."
maintainer: CyStrat-Services-GmbH
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/CyStrat-Services-GmbH/hermes-agentic-soc
version: "0.2.7"
platforms: []
known_issues:
  - "Local THOR triage needs a separately licensed THOR executable: set `thor_path` in the plugin settings. No THOR binary, signature or rule set is bundled or downloaded."
  - "Evidence analysis parses THOR 10 JSON v2 and THOR 11 JSON v3. JSON v1 is refused with a hint to re-export with `--jsonv2`; legacy text and CSV exports are not parsed."
  - "Offensive-research profiles and skills are not part of this release; they are planned for a later version and nothing of them is present, previewable or enableable here."
capabilities:
  provides_tools:
    - soc_capabilities
    - soc_template_list
    - soc_template_install
    - thor_lite_scan
    - thor_parse
    - thor_first_assessment
    - soc_alert_triage
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
