name: agentiker-code-intel
repo: https://github.com/IVRZ-da/agentiker-code-intel
sha: a5076f1a2f3c11c3bc08c0ce8beb7ecaf1ba3d15
description: >-
  AST-aware code intelligence for the local repository: symbol outlines and
  structural search (tree-sitter), ast-grep pattern queries, LSP
  go-to-definition and find-all-references, call graphs and dependency
  analysis, plus safe cross-file refactoring (rename, replace body, insert,
  move, delete) for 9 languages. Ships 7 namespace dispatchers with an op
  parameter instead of 70 individual tools, so the schema cost per turn stays
  small. Works fully offline; LSP servers are optional and only installed when
  the user opts in, otherwise the tools fall back to AST analysis.
maintainer: IVRZ-da
tier: community
category: tools
requires_hermes: ">=0.23.1"
docs_url: https://github.com/IVRZ-da/agentiker-code-intel#readme
version: "0.6.37"
platforms: []
capabilities:
  provides_tools:
    - code_search
    - code_lsp
    - code_graph
    - code_edit
    - code_review
    - code_git
    - code_meta
  provides_hooks:
    - on_session_end
    - pre_llm_call
    - post_tool_call
  provides_middleware: []
  requires_env: []
