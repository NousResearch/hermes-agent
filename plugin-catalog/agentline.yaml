name: agentline
title: AgentLine
repo: https://github.com/prakhar-raj-031104/hermes-agentline
sha: 58b9e7b8ec880a059de01f9ee9d7e620defe9ca3
description: "A real phone number for Hermes: place calls that a hosted voice carries out and get the transcript back, send and read SMS, text your agent like any other chat, and let a live caller's question reach Hermes mid-call, with the answer spoken on the call or texted if it takes too long. Disclosure — talks only to api.agentline.cloud: HTTPS from the tools, plus one outbound WebSocket (wss://api.agentline.cloud/v1/events/ws) held open while the gateway runs, so no public URL or open port is needed; sends call briefs, text bodies, destination numbers, contacts and the agent's answers to live caller questions; AgentLine carries the call audio and produces transcripts, the plugin never handles audio; calls, texts and numbers are billed to your own AgentLine account; agentline_call, agentline_sms, agentline_buy_number and agentline_agent go through Hermes's approval gate from a pre_tool_call hook, which shows the whole call brief, greeting, voice or text and fails closed when nobody can approve; Hermes's send_message to an agentline: target texts AGENTLINE_ALLOWED_USERS, the home channel and allowed_numbers without a prompt, needs approval for any other number and is refused in cron runs; emergency, premium-rate and non-US/Canada numbers are refused on every path, including the gateway's own send paths, and every text counts against the daily SMS limit; only numbers in AGENTLINE_ALLOWED_USERS can text or call the agent, everyone else is ignored without a reply; stores today's call and text counts in plugin data, no transcripts, messages or credentials; the API key is read through Hermes's secret scope; one Python dependency (websockets>=12,<16); no shell commands, child processes, telemetry or self-update."
maintainer: prakhar-raj-031104
tier: community
category: platform
requires_hermes: ">=0.23.0"
version: "1.1.0"
docs_url: https://github.com/prakhar-raj-031104/hermes-agentline#readme
capabilities:
  provides_tools:
  - agentline_status
  - agentline_agent
  - agentline_buy_number
  - agentline_call
  - agentline_call_result
  - agentline_hangup
  - agentline_sms
  - agentline_messages
  - agentline_contacts
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env:
  - AGENTLINE_API_KEY
