  requires_env: []
known_issues:
  - Run hermes memory setup after installation to select AgentMemory and configure the backend credential.
  - There is no durable offline capture queue. Profile and author filters are application-level scope, not separate server credentials.
  - Native memory replacement tracking uses POSIX file locking; this entry is limited to Linux and macOS.
