subdir: integrations/hermes
version: "0.9.31"
description: >-
  Persistent memory provider with automatic recall, conversation capture, and native
  memory_save, memory_recall, and memory_search tools. Memory is scoped to the active
  Hermes profile, project, and message author by default. Requires a separately running
  AgentMemory server. Disclosure: recall queries, conversation excerpts (up to 500 user
  and 2,000 assistant characters per turn), native memory writes, workspace paths, and
  scoped session identifiers are sent to the configured AgentMemory URL (localhost:3111
  by default). Credentials come through Hermes's scoped secret API. Runs git rev-parse
  to resolve the project and stores non-secret URL configuration and memory ownership
  records in the active Hermes home. Remote plaintext HTTP warns but is permitted unless
  AGENTMEMORY_REQUIRE_HTTPS=1. No telemetry, self-updater, or background daemon is started
  by the plugin.
maintainer: rohitg00
