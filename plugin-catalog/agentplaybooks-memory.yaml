description: "Private AgentPlaybooks memory for Hermes: bounded keyword recall across personal and team sources, exact native memory-write mirroring, archive and history. Disclosure — keywords derived from each turn's query are sent to the configured AgentPlaybooks service for recall from your personal and configured team playbooks; explicit native memory writes are mirrored there. Defaults to agentplaybooks.ai over HTTPS; localhost HTTP is supported, and remote intranet HTTP requires an explicit opt-in that sends the API key unencrypted. Team and shared playbooks are configured explicitly: the agent can write, archive and permanently delete entries in configured team playbooks (shared playbooks are read-only), and teammates' entries are recalled into context."
maintainer: matebenyovszky
tier: community
category: memory
requires_hermes: ">=0.22.4"
version: "0.3.0"
docs_url: https://github.com/matebenyovszky/agentplaybooks/tree/f31e9c3af6520cebda1c0712447b4b487ffc12a7/packages/hermes-memory/agentplaybooks
