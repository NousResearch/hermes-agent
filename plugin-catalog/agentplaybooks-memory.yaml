description: "Private AgentPlaybooks memory for Hermes: bounded keyword recall with acknowledgement filtering, brief repeated-query suppression and per-source failure cooldown across personal and team sources, exact native memory-write mirroring, archive and history. Disclosure — keywords derived from eligible user queries are sent to the configured AgentPlaybooks service for recall from your personal and configured team playbooks; explicit native memory writes are mirrored there. Defaults to agentplaybooks.ai over HTTPS; localhost HTTP is supported, and remote intranet HTTP requires an explicit opt-in that sends the API key unencrypted. Team and shared playbooks are configured explicitly: the agent can write, archive and permanently delete entries in configured team playbooks (shared playbooks are read-only), and teammates' entries are recalled into context."
maintainer: matebenyovszky
tier: community
