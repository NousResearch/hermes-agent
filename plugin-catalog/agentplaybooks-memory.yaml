description: "Private AgentPlaybooks memory for Hermes: explicit recall by default, optional bounded automatic recall, native memory-write mirroring, archive and history. Registration, initialization, unused prefetch and profile switching make no network requests. Disclosure — explicit searches and opted-in automatic recall send query keywords to the configured AgentPlaybooks service for your personal and configured team sources; explicit native memory writes are mirrored there. Automatic recall has acknowledgement filtering, brief repeated-query suppression, a request/time budget and per-source failure cooldown. Defaults to agentplaybooks.ai over HTTPS; localhost HTTP is supported, and remote intranet HTTP requires an explicit opt-in that sends the API key unencrypted. Team and shared playbooks are configured explicitly: the agent can write, archive and permanently delete entries in configured team playbooks (shared playbooks are read-only), and teammates' entries are recalled into context."
maintainer: matebenyovszky
