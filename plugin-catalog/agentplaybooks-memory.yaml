name: agentplaybooks-memory
repo: https://github.com/matebenyovszky/agentplaybooks
sha: f31e9c3af6520cebda1c0712447b4b487ffc12a7
subdir: packages/hermes-memory/agentplaybooks
description: >-
  Private AgentPlaybooks memory for Hermes: bounded keyword recall across personal and team sources,
  exact native memory-write mirroring, archive and history. Disclosure — keywords derived from each
  turn's query are sent to the configured AgentPlaybooks service for recall; explicit native memory
  writes are mirrored there. Defaults to agentplaybooks.ai over HTTPS. Localhost HTTP is supported;
  remote intranet HTTP requires explicit opt-in. Team/shared playbooks are configured explicitly.
maintainer: matebenyovszky
tier: community
category: memory
requires_hermes: ">=0.22.4"
version: "0.3.0"
docs_url: https://github.com/matebenyovszky/agentplaybooks/tree/f31e9c3af6520cebda1c0712447b4b487ffc12a7/packages/hermes-memory/agentplaybooks
