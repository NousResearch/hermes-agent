description: "Portable agent setup for Hermes: a skill for on-demand CLI audits, cross-client config sync, Agent Plugin packaging, playbook recovery, and Bot Mode profile export. Requires Node.js 20+ and separately installed @agentplaybooks/cli@0.4.0. Disclosure — skill-only; the separately installed apb CLI does the work. Local writes (including `apb sync --target=hermes --apply`, which edits Hermes config/MCP settings) require --apply; hosted pull/push contact agentplaybooks.ai after `apb login`, and `apb push --apply` uploads your project's persona, instructions, skills and MCP references (secret names, not values)."
