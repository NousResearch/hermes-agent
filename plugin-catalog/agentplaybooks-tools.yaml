description: >-
  Connect AgentPlaybooks skills and hosted MCP/OpenAPI tools to Hermes, with guided setup,
  profile selection, permission diagnostics and an authenticated MCP check. Requires Node.js 20+
  and @agentplaybooks/cli@0.8.1; the CLI is installed separately. Disclosure — skill-only; the
  separately installed apb CLI does the work. `apb hermes setup --apply` restores complete skill
  trees into the chosen project and edits the selected Hermes profile's config.yaml to register
  those skills and a local stdio relay for the hosted playbook MCP endpoint. The relay is a child
  process that forwards actual requests, answers MCP pings locally and sends no idle HTTP keepalives;
  existing HTTP configurations need an explicit migration. Local writes require --apply; setup also probes
  MCP initialization and tool listing using a scoped key from the process environment, without
  invoking tools. `doctor` checks profile credential variable names without exposing their values.
  Hosted operations contact agentplaybooks.ai (or an explicitly configured service); skill restore
  uses `apb login`, and `apb push --apply` uploads project configuration (secret references, not values).
