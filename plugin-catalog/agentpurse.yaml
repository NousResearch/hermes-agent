name: agentpurse
repo: https://github.com/maaz-bin-hassan/agentpurse
sha: 84a1ed7cc9dbac462a5bde8b65f6d105cc56b20b
subdir: plugins/hermes
version: "1.0.0"
title: AgentPurse
description: "Search, quote, and buy from an AgentPurse allowance on the PayPal sandbox. Every purchase waits for Hermes' approval prompt and is sent only after a person approves it; YOLO, approvals off, auto-approve modes, and smart (model) approval cannot spend. A per-chat spend limit and /purse kill sit in front of the clerk. Disclosure — calls the author's AgentPurse service at agentpurse.vercel.app (POST /mcp and GET /api/spends/:id; the server uses the PayPal sandbox and Channel3 for product data) with AGENTPURSE_API_KEY from Hermes's secret scope, sending quotes, purchase sentences and the task/page excerpt the agent supplies; request_purchase and watch_price each wait for a person to answer Hermes's approval prompt (YOLO, approvals off, smart approval and unattended runs cannot spend), but an approved price watch later lets AgentPurse file the purchase server-side with no second Hermes prompt (/purse kill cancels open watches); a kill switch, quote cache, one-time approval grants and per-chat spent cents live in plugin state; PayPal sandbox money only, and a receipt is not a retailer order."
maintainer: maaz-bin-hassan
tier: community
category: tools
requires_hermes: ">=0.22.7"
docs_url: https://github.com/maaz-bin-hassan/agentpurse/blob/84a1ed7cc9dbac462a5bde8b65f6d105cc56b20b/plugins/hermes/README.md
known_issues:
  - PayPal sandbox only. A captured payment is not a retailer order.
capabilities:
  provides_tools:
    - search_merchants
    - search_products
    - get_product
    - check_price
    - find_alternatives
    - get_quote
    - request_purchase
    - watch_price
    - list_watches
    - cancel_watch
    - get_budget
    - list_receipts
  provides_hooks:
    - pre_tool_call
    - post_approval_response
  provides_middleware: []
  requires_env:
    - AGENTPURSE_API_KEY
