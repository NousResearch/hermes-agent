title: Agents Hub
description: "A Hermes Desktop page for coordinating profiles, chats, approvals, project goals, Kanban tasks, and Codex / Claude usage. Disclosure: reads profile state and project/Kanban databases, runs Git status/diff, and writes Hub state; explicit owner actions can manage profiles, cron, file rollback, blocked Kanban drafts, and logins. Kanban heartbeat (60 s) and account switching (5 min, with an earlier usage-triggered check) are independently opt-in and disabled by default. Heartbeat can promote/create Kanban cards. Account switching uses Hermes pool APIs to change priority and never removes credentials automatically. Confirmed manual removal uses hermes auth remove; Claude login uses hermes auth add anthropic. Provider usage requests use Hermes APIs. See the README for all triggers and commands. No telemetry."
