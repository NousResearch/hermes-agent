title: Agents Hub
description: "One Hermes Desktop page to chat with, steer and coordinate every profile: agent faces with moods, live turns as steps, goals the agents keep current, a switcher for agents with several conversations, saved tools the agent can reopen by name, Markdown preview, changed files with diff, approve and rollback, inline permission requests, running commands of every agent, scheduled jobs, a team roster agents read to hand work off through Kanban, and Claude / Codex usage under the chat box. Ships three skills (agents-hub:hub-operating, team-coordination, hub-setup) so agents learn the Hub on their own. Disclosure — Reads every profile's state.db, config, cron jobs and processes.json plus the shared kanban.db (read-only); runs git status / diff in the repositories it shows; writes only its own state under HERMES_HOME/agents-hub/, cron jobs and profiles you create from the Hub, and files you explicitly restore to an earlier message (backed up first). Usage numbers come from Hermes's read-only usage readers (Anthropic and OpenAI usage endpoints with the login Hermes already holds, at most every 10 minutes); the Claude login button runs Hermes's own `hermes auth add anthropic` and forwards the pasted code to it without storing it. Every permission answer is the owner's click; saved tools open a link or file only on the owner's click, and commands are copied, never run. Imports a few undocumented Hermes modules (cron creation, profile creation, dashboard OAuth status, profile scope). No telemetry."
