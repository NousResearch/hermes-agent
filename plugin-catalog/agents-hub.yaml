title: Agents Hub
description: "A Hermes Desktop page for coordinating profiles, chats, approvals, project goals, Kanban tasks, and Codex / Claude usage. Disclosure — reads profile state and project/Kanban databases, runs Git status/diff, and writes its own Hub state; explicit owner actions can manage profiles, cron jobs, file rollback, blocked Kanban drafts and logins; the Kanban heartbeat (every 60 s, may promote or create Kanban cards) and Codex/Claude account switching (every 5 minutes, plus an earlier check when usage hits a limit) are each opt-in and off by default; account switching only changes credential priority with hermes auth priority and never removes credentials, and only a confirmed owner click runs hermes auth remove; Claude login runs hermes auth add anthropic; usage is read through Hermes's account-usage API; no telemetry."
