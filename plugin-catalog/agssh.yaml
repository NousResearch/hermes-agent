name: agssh
repo: https://github.com/mosesman831/agssh
sha: 3d47bf8e6ca8606a8377ba50b1250249f3164dfd
subdir: "plugin/agssh"
description: "SSH hosts as first-class agent tools. Register your hosts once, then the model calls agssh / agssh-read / agssh-find / agssh-hosts instead of assembling `ssh -i key user@host 'quoted string'`. Commands travel as one byte-exact argv element, the tool returns the real remote exit code (never a `| tail` status), output is capped with a full-text spill file, and every call multiplexes over one persistent ControlMaster connection per host so rapid agent calls never exhaust sshd MaxStartups. Dangerous commands go through Hermes' own approval gate, and a pre_tool_call hook blocks raw terminal ssh to registered hosts so exit codes and the audit log cannot be bypassed. No pty and no background jobs: interactive prompts fail fast rather than hang. Disclosure — the model runs shell commands (dangerous ones go through Hermes approval) and reads or searches files on the SSH hosts you register, with your existing SSH keys and remote privileges. It reads ~/.ssh/config for host names, keeps ControlMaster sockets and lock files in ~/.ssh, imports any existing ~/.config/agssh/hosts.json or ~/.config/persist-ssh.json read-only, and appends an audit log of executed commands (first 200 characters, secrets redacted) to the Hermes logs directory. No network service, no telemetry, no third-party host."
maintainer: mosesman831
tier: community
category: tools
docs_url: https://github.com/mosesman831/agssh#readme
version: "1.2.0"
platforms: [linux, macos]
capabilities:
  provides_tools: [agssh, agssh-read, agssh-find, agssh-hosts]
  provides_hooks: [pre_tool_call]
  provides_middleware: []
  requires_env: []
