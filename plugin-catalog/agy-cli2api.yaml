description: "Multi-account Google Antigravity CLI provider for Hermes with 0.2s quota auto-swap (429/403 failover), native protobuf SQLite payload decoding, optional per-account --conversation resume (AGY2API_STATEFUL), Hermes host tool calling, and zero external Python dependencies. Disclosure — spawns the local Google agy CLI binary as a child process using signed-in profiles on disk (~/.gemini_profiles/<email> and ~/.gemini/antigravity-cli/antigravity-oauth-token.*) or routes to a user-configured HTTP server via AGY_CLI2API_BASE_URL; copies token files into per-profile dirs without reading or logging token contents and touches last_check.timestamp to suppress agy auto-update prompts; reads/cleans local agy SQLite conversation DBs unless AGY2API_CLEANUP_DB=false; automated subscription usage counts against your signed-in account(s) and is subject to Google Antigravity's Terms of Service; independent community project, not affiliated with or endorsed by Google."
