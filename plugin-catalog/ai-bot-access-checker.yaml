description: "Check whether AI crawlers and search bots can reach a web page: GPTBot, OAI-SearchBot, ChatGPT-User, ClaudeBot, Claude-SearchBot, Claude-User, PerplexityBot, Perplexity-User, Googlebot, Google-Extended, bingbot, Applebot-Extended and CCBot. For each bot it reports the robots.txt rule that applies (RFC 9309, including rules added by Cloudflare's managed robots.txt) and whether the server or firewall refuses that User-Agent while a normal browser gets the page. Bundles the ai-bot-access-check skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: the one tool, check_ai_bot_access, is read-only and runs on the hosted server at https://tools.seopaslaugos.io/mcp (Streamable HTTP, no keys, no sign-in, no local process); that server sends about 14 HTTP GET requests to the URL the user asks about, from Cloudflare's network, and caches the result for 10 minutes. The tool set is served at runtime and is not covered by the pinned sha; the server source is in the same repository. Rate limits: 20 checks a minute per IP, 6 a minute per checked site."
