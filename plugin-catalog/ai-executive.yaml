description: >-
  Ask your AI Executive assistant a question and see today's calendar, open tasks and the calls that
  need you, through AI Executive's hosted MCP server (Streamable HTTP, OAuth 2.1), with a daily-brief
  skill bundled. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/). Disclosure —
  hosted-only connector with no local code: every tool call goes to connect.aiexec.me, signed in as the
  user with the Google account on their AI Executive membership (a paid AI Executive or After Hours AI
  plan is required; sign-in does not create an account). Calendar, task and conversation summaries from
  the user's account are pulled into the session context, and so reach the user's model provider; phone
  numbers arrive masked. Both tools are read-only; nothing is booked, sent, purchased or published.
  AI Executive logs each call's metadata. The tool list comes from the server at run time, so the
  pinned commit doesn't cover it. Hermes stores and refreshes the OAuth tokens. OAuth must be enabled with
  `hermes mcp add ai-executive --url https://connect.aiexec.me/mcp --auth oauth`;
  the bundled mcp.json alone yields 401.
