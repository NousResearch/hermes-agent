name: ai-lab
title: Hermes AI Lab
repo: https://github.com/BZK-kais/hermes-ai-lab
sha: b830d8adba81af0820fae2bbeb5b86bdb7fcc9f5
description: "Prepare experiments, compare local models and activate qualified configurations in Hermes. Disclosure — Runs local training, conversion, serving and evaluation jobs (up to 24 hours) with the tools you configure; the model can read your configured RunPod, Hugging Face, S3 and GCS connections and export a redacted Hermes session into the AI Lab workspace, while creating, stopping or deleting paid cloud resources, uploads, and upstream MCP tool calls run only from the `hermes ai-lab` / `ailab` operator CLI. Remote inference through a configured connection may incur charges."
maintainer: BZK-kais
tier: community
category: models
requires_hermes: ">=0.23.1"
version: "1.1.1"
capabilities:
  provides_tools:
    - ai_lab_status
    - ai_lab_list_local_models
    - ai_lab_hf_model_info
    - ai_lab_probe_endpoint
    - ai_lab_connections
    - ai_lab_connection_probe
    - ai_lab_operations
    - ai_lab_plan
    - ai_lab_run
    - ai_lab_job
    - ai_lab_provider_action
    - ai_lab_dataset_validate
    - ai_lab_artifact_inspect
    - ai_lab_generate
    - ai_lab_profile
    - ai_lab_experiment
    - ai_lab_analyze
    - ai_lab_benchmark
    - ai_lab_optimize
    - ai_lab_onboarding
    - ai_lab_mission
    - ai_lab_registry
