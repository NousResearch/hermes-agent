title: AI Subscriptions
description: "Your AI subscriptions and token usage in Hermes Desktop. A page with Overview, Usage and Plans tabs, plus a status-bar chip where you pick which subscriptions to keep. Quota comes from Hermes's own model.options and usage.bars RPCs; the page polls Hermes' cached windows (Hermes refreshes them in its own background threads) and only its Refresh button asks for an explicit refresh; token usage covers Hermes, Claude Code and the Grok CLI, clicking a day shows that day's per-source, per-model and hourly breakdown, and measured tokens per second are shown per model, per day and overall. Disclosure: read-only reads outside the plugin's data - Hermes state.db and models_dev_cache.json, ~/.claude/projects/**/*.jsonl and ~/.grok/logs/unified.jsonl plus ~/.grok/sessions/*/*/summary.json (token counts only). No credential, .env or auth.json reads, no network calls, no shell commands, no background processes, no telemetry."
