description: "Check from chat whether ChatGPT, Gemini, Perplexity and Claude mention, rank and cite a brand against its competitors, which Google searches show an AI Overview, where buyers ask for recommendations on Reddit, and what to fix on a site's pages so AI engines can read and cite them. Four workflow skills (AI visibility check, GEO site audit, AI Overview check, cost estimate) drive seven Actors on Apify's hosted MCP server (Streamable HTTP at https://mcp.apify.com). Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only, no local code. Disclosure — every tool call goes to Apify's hosted MCP server at mcp.apify.com and starts a pay-per-result run of an Actor published by the plugin's author (Apify user muhammadafzal), who is paid for each run; runs are billed to the user's own Apify account (about USD 0.005 to 0.06 per result, up to USD 0.16 for a rank check with both add-ons, plus about USD 0.005 to 0.0125 per run; a ten-prompt, four-engine rank and citation report is about USD 4.42). Brand and competitor names, domains, prompts, URLs and search terms are sent to Apify; the Actors send the prompts to the AI engines through the Actor owner's model access, fetch the user's public pages, load Google results pages or search public Reddit, and the results (AI answers, cited URLs, audit scores, public Reddit posts with usernames) are kept in the user's Apify datasets. Apify sign-in is OAuth, which Hermes runs only for a server in the user's own config, so the README has the user add the same-name server with `hermes mcp add ai-visibility --auth oauth`; that entry replaces the package's own, so the user adds `trust: untrusted` to it to keep Hermes asking before each paid run. The tool set is served by the remote server at runtime and is not covered by the pinned sha. No telemetry. Independent tool, not affiliated with OpenAI, Google, Perplexity, Anthropic or Reddit."
