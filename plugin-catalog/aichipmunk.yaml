description: Pairs this machine's Hermes bots with the AI Chipmunk mobile app from inside Hermes Desktop — pick a bot, get the reachable host, profile and API key as a scannable code. Registers a `hermes aichipmunk` CLI command, a desktop page and a dashboard API; no tools or hooks. Disclosure — it adds a `tailscale serve` entry carrying the API server's port onto the tailnet (and only on a machine with no Tailscale CLI does it fall back to setting `platforms.api_server.host` and restarting that gateway), reads `API_SERVER_KEY` from the owning profile's secret scope at pairing time and renders it locally as the pairing code, and shells out to the `tailscale` and `hermes` CLIs; it makes no other network calls and touches no core files. Pairing requires Tailscale on this machine and on the phone.
