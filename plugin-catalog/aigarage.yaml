known_issues:
  - "The Agent Wikis Pro key is optional and needs one extra command, because a portable mcp.json cannot carry an optional header: hermes mcp add agentwikis --url \"https://agentwikis.com/mcp\" --auth header, answer yes, paste the key, then /reload-mcp. Without it everything free keeps working."
