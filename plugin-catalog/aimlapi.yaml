subdir: aimlapi
description: "AI/ML API — 10,000+ models and MCP tools, with an OpenAI-compatible chat API and an optional MCP server; /model picker lists the hottest and tool-capable chat models, and on builds with model_setup_flow `hermes model` can sign you up and top up in the browser. Disclosure — sends your prompts and AIMLAPI_API_KEY to api.aimlapi.com, a third-party API that routes to upstream vendors (OpenAI, Anthropic, Google, DeepSeek and others), billed in prepaid aimlapi.com credits; the guided `hermes model` step (interactive terminal only) sends your email to auth.aimlapi.com / app.aimlapi.com, can create an aimlapi.com account and an API key named \"Hermes Agent\", and opens an aimlapi.com / Stripe checkout in your browser for a top-up of $20 or more with auto top-up preselected (answer Off to decline); new accounts are created as partner checkouts under this integration's partner id. At the end of that step it asks (default No) whether to add the aimlapi.com MCP server; on yes it writes mcp_servers.aimlapi to config.yaml (url https://mcp.aimlapi.com/mcp, header Authorization: Bearer ${AIMLAPI_API_KEY} as an env reference, never the key itself, trust: untrusted so every billed generation/chat/Toolbox call asks first), or auth: oauth with no key when the aimlapi provider points at a non-aimlapi.com endpoint; an existing entry is never overwritten. Opt-in AIMLAPI_ATTRIBUTION=1 adds integration attribution headers on requests to aimlapi.com (on the MCP entry only for the exact host mcp.aimlapi.com)."
maintainer: aimlapi.com
tier: community
category: models
requires_hermes: ">=0.22.0"
docs_url: https://github.com/aimlapi/hermes-provider-aimlapi#readme
