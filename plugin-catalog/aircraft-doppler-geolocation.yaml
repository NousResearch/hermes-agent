description: "Detect aircraft flyovers in a recording (Doppler tones, plus experimental ground-reflection broadband jet passes) and estimate where it was made by scoring them against adsb.lol ADS-B history, with a posterior heatmap, 68/95% areas and a confidence flag. Provides the doppler_detect and doppler_locate tools and a dopplergeo CLI. Results on unseen real recordings are weak (2 of 18 held-out runs under 3 km); treat output as a hypothesis. Disclosure — doppler_locate / dopplergeo locate makes unauthenticated HTTPS GETs to GitHub (adsb.lol release assets, streamed, about 3 GB read per uncached day; only the crop is cached), raw.githubusercontent.com (tar1090-db types), the Copernicus DEM S3 bucket and Open-Meteo; offline mode uses the local cache only; no credentials, uploads or telemetry. doppler_detect and the skill scripts make no network calls; scripts run ffmpeg (no shell) on the recording you name and write CSV/PNG/JSON at the output path you give. PyPI packages (numpy, scipy, soundfile, matplotlib, tifffile) install only after Hermes dependency consent. The method can geolocate where a recording was made, so use it only on recordings you are entitled to analyse."
