description: >-
  Find aircraft flyover Doppler curves in a recording, fit speed and distance,
  and score candidate locations against ADS-B tracks you supply. No network or
  credentials. Scripts run ffmpeg on the path you pass and write CSV, PNG, and
  JSON beside it. PyPI packages install only after Hermes dependency consent.
