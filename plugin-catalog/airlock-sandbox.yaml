sha: 86d342dace0280fcd867b3e135c0aa428a4c3c93
subdir: ""
description: >-
  Terminal backend that routes Hermes command execution through an external Airlock
  policy engine and disposable Docker sandbox, then surfaces verifiable receipts
  (RFC 8785 JCS, SHA-256, Ed25519, prev_hash chain) with BLOCKED / ALLOWED / VERIFIED
  status (`hermes config set terminal.backend airlock_sandbox`). Disclosure — network
  calls to the configured Airlock HTTPS base URL (`/healthz`, `/api/pubkey`,
  `/api/arena`, `/api/receipt/{id}`); optional secret `AIRLOCK_API_TOKEN` via Hermes
  secret scope; no host shell of its own (commands run only inside Airlock when
  policy allows). Hermes dangerous-command approvals are not bypassed.
