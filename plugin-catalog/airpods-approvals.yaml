name: airpods-approvals
title: AirPods Approvals
repo: https://github.com/cineglobe/hermes-airpods-approvals
sha: ee02dc0b56157ccd3c2e97639fc9e0d19f550119
description: >-
  Hear Hermes approvals and questions in your AirPods and answer with your head: nod to approve,
  shake to deny. Gestures are recognised by rhythm, with a tap in each ear as you go, and drive the
  real approval through approval.respond. A nod only ever approves once, and a timeout or lost
  AirPods sends nothing. Desktop-only plugin with a small native helper built from source on your
  Mac, because head motion isn't reachable from a plugin: Install in the plugin's settings opens
  the bundled desktop/Install Helper.command in Terminal, which builds and starts it. Disclosure — the helper runs without a
  window or menu bar item only while Hermes Desktop is open, listens on 127.0.0.1 with a paired
  handshake, and reads head motion only during a question, which never leaves the Mac. Prompts are
  written and spoken by Gemini: the approval's description and Hermes-redacted command are sent to
  generativelanguage.googleapis.com to phrase a short question and to speak it, using your Gemini
  key, which the helper keeps in the macOS Keychain. On Gemini's free tier, Google may use this content to improve its products. No
  telemetry.
