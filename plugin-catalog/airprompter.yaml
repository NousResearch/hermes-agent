name: airprompter
title: AirPrompter
repo: https://github.com/airprompter/airprompter-hermes-plugin
sha: 7279b39155417018d533a85f7b99381fcf2bcb13
description: "AirPrompter connects Hermes to your saved prompt and workflow library, so you can find, run, create, and update reusable prompts and multi-step workflows. This is a portable Agent Plugins v1 package submitted by AirPrompter, which runs the service. It contains no local code: it adds one skill and one remote MCP server (https://mcp.airprompter.com/mcp). Hermes stores and refreshes the sign-in tokens; none are in the package. Every read, save, and run goes to AirPrompter, with what the call carries. What the tools return reaches your model provider through the session: your saved prompts and workflows, including the saved prompt text a run hands back for the assistant to follow. Write tools change your saved AirPrompter library, and Hermes asks before each one. The tool list comes from the AirPrompter server at run time, so a pinned commit does not fix it. There is no background process and no self-update, and the package itself sends no telemetry. Every workflow you run through this plugin is reported to AirPrompter and saved as a run record on your account. This reporting cannot be turned off. You need an AirPrompter account. Disclosure — hosted-only connector with no local code: every read, save and run goes to AirPrompter (mcp.airprompter.com) after you sign in with `hermes mcp login`, and what the tools return, including saved prompt text a workflow run hands the assistant to follow, reaches your model provider through the session. Each workflow run is saved as a run record on your AirPrompter account (inputs, file or page references, step status and timing, token counts and model name, and step outputs if your account opted in to storing them), and this cannot be turned off; AirPrompter also keeps usage analytics. Write tools change your saved library; keep trust: untrusted on the config.yaml entry so Hermes asks before them. The tool list comes from the server at runtime and is not covered by the pinned sha."
maintainer: AirPrompter
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://airprompter.com/docs
version: "0.2.8"
readme: true
platforms: []
known_issues:
  - "The package's mcp.json cannot complete sign-in, because Agent Plugins v1 has no OAuth field. Add mcp_servers.airprompter to ~/.hermes/config.yaml with url https://mcp.airprompter.com/mcp, auth: oauth and trust: untrusted, then run `hermes mcp login airprompter` and `hermes mcp test airprompter`, and start a new session or run /reload-mcp. A config.yaml entry replaces the package's, so keep trust: untrusted in it."
  - "Write tools change your saved AirPrompter library, and running a workflow creates a run record on your AirPrompter account. This reporting cannot be turned off."
