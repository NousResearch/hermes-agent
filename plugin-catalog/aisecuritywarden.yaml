name: aisecuritywarden
title: aiSecurityWarden
repo: https://github.com/SoftDevEng/aiSecurityWarden-hermes
sha: eb47333f889c28559d6e77923425da42973a6ac6
description: "Keep your bots' API keys out of .env. Hermes loads them at startup from an encrypted vault; revoke a bot's access in one click, or require a phone approval. Disclosure — when enabled, runs your installed aiSecurityWarden `swctl` client (argv only, allowlisted environment, up to 180 s to allow a phone approval) at Hermes start-up, which contacts the aiSecurityWarden server your machine token was set up with, and loads every secret in that token's project into Hermes's environment (existing values are kept unless `override_existing` is on); the plugin itself makes no network calls and never reads the token."
maintainer: SoftDevEng
