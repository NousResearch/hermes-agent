title: Aixy
description: >-
  Guided Aixy inference setup with optional MCP tools: hermes aixy setup selects an available
  model or route, and hermes aixy mcp connects tools later. MCP is skipped by default.
  Disclosure — exposes CLI commands only, with no automatic hooks or runtime tools. Explicit
  inference setup sends the project key in an authenticated GET /models to the configured Aixy
  gateway (https://api.aixy-gateway.com/v1 by default), rejects redirects, and asks before
  updating the selected Hermes profile's provider and main model settings. The key is stored
  through Hermes' credential writer as AIXY_API_KEY; provider settings contain a variable
  reference. No inference requests are sent during setup. Optional MCP setup starts the
  installed Hermes CLI as a child process for browser OAuth, credential storage and tool
  selection against the independent MCP endpoint (https://api.aixy-gateway.com/mcp by default).
  The child uses the selected profile, disables inherited unattended and YOLO flags, and
  receives no key in command arguments. Setup requires an interactive terminal. No additional
  dependencies, telemetry, persistent background processes or self-updater.
