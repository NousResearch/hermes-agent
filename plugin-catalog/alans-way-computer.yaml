known_issues:
  - "Needs a Hermes build with the pluggable computer-use API (merged to main after 0.21.5). On older Hermes the plugin installs and does nothing. Install alans-way first and run its workspace setup, which writes the workspace_browser block this provider reuses."
  - "Hermes asks for approval on every computer_use action type until it is granted. For an unattended Telegram bot, grant them once with Always in Telegram, or add cua:<action>:background entries to command_allowlist (see the README). Takes effect after a gateway restart."
  - "The pinned README requires in-process loading and says plugins.isolation: host is unsupported because the provider hands Hermes a live router session. The current admission validator reports host readiness; remote isolation compatibility has not been verified."
  - "Typing without a target field works only on the VM's own desktop, where it types at the focused window (still approval-gated). On the user's computer the app never takes focus, so the agent uses set_value on a field instead."
  - "The VM desktop path needs xdotool, a screenshot tool (scrot, maim or ImageMagick import), the AT-SPI bus and python3-gi on the VM. Without them those calls fail and the agent reports it; setup.sh warns about what is missing."
  - "A default som capture skips the screenshot request when snapshot geometry establishes 35% named-control coverage; older apps without geometry still require a screenshot to check it and may omit it from the model. Use mode vision to request it explicitly, or mode ax for an element-only capture. When a screenshot is omitted, coordinate= and element bounds are screen pixels."
  - "Mac and Windows action replies update the held element list without shifting surviving numbers. On Linux, capture again before acting by number after a tree change; cut replies do not prove an unseen control is gone. A timeout or hung app can leave the action's outcome uncertain: capture before retrying."
  - "This release changes provider code and README: snapshot deltas, screenshot elision from snapshot geometry, window binding and observed-host guards need the paired app/router support. Older apps retain full-list and screenshot fallback; a mismatched window clears the target. Native Mac app tasks and production VM-to-computer timing at this pin remain unverified."
  - "Admission validation passes with a private-import warning: __init__.py uses tools.mcp_tool_config._resolve_stdio_command to resolve the router launcher; this internal helper may change across Hermes releases."
