title: "Alan's Way Plugin: Computer Use"
description: "Computer-use provider for Hermes: the stock computer_use tool drives desktop apps on the user's computer through the Alan's Workspace app, and on the VM's own desktop when the computer is offline. Needs the Alan's Way Plugin's workspace setup. Select it with computer_use.backend: alans-way-computer (the Alan's Way Plugin's setup.sh sets this when it installs the provider; in the catalog flow it prints the command). Disclosure — starts the workspace router from the profile's mcp_servers.workspace_browser block (command and args from config.yaml, with a filtered environment plus HERMES_WORKSPACE_ALLOW_DESKTOP_ACTIONS=1, which lets this private router child serve desktop input) as a long-running node child per session. The filtered environment passes PATH, HOME, locale and OS basics, plus DISPLAY, XAUTHORITY and DBUS_SESSION_BUS_ADDRESS so the router's VM-desktop fallback finds the X display and session bus; no keys or tokens. It talks to the router over stdio (app lists, element trees, screenshots and input actions). The router reaches the user's computer over SSH on the user's tailnet and falls back to the VM's desktop, where it uses xdotool, a screenshot tool and the AT-SPI accessibility bus if they are installed (the provider installs none of them). The provider never takes the focused window on the user's computer, and every input action still goes through Hermes's computer_use approval gate (cua:*:background entries in command_allowlist, which the Alan's Way Plugin's --allow-desktop-actions adds, skip the prompt). The provider itself makes no network calls. On Hermes 0.21.5, which has no provider API, it installs and does nothing. Since 0.21.0, captures keep element numbers stable across action replies on Mac and Windows, fold in changed controls and report removed numbers; a truncated list never treats unseen controls as removed. Linux keeps the whole-tree generation guard, so capture again before acting by number after a change. Action replies describe nearby changes and can mark the effect confirmed. Default som captures skip the screenshot call entirely when finite snapshot window geometry proves named controls cover at least 35%; older snapshots without geometry still fetch a screenshot to measure coverage and may omit it from the model; mode vision explicitly includes it and mode ax requests no screenshot. Replies identify the coordinate space and explain locked screens, missing permissions, unreadable or cut trees, hung apps and uncertain outcomes before a retry. Captures request generation-based snapshot deltas, validate them against the held tree and retry once for a full list on invalid or mismatched deltas; older apps may return full or unchanged lists. Once a reply identifies a window, later captures, screenshots and input stay bound to that window; capture(window_id=...) selects another. Mismatched window replies clear the target and require a fresh capture. Desktop actions carry expect_host from the observed host so a routing switch refuses input before dispatch; app IDs and element numbers must be reacquired after a switch. Element trees, generation, bound window ID, screenshots' geometry and host OS are session memory, with no new persistent provider state, tools, hooks, middleware, required environment variables or direct network destinations. Hermes's unmodified CI-pinned scanner reports SAFE: 0 HIGH, 2 MEDIUM (python_subprocess: the long-running router Popen in __init__.py and its bounded 40-second --probe subprocess) and 0 LOW. Browser commit approvals are separate from this provider's unchanged computer_use approval gate."
