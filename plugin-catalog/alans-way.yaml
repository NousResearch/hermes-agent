version: "0.21.5"
title: "Alan's Way Plugin"
description: "Idle check-ins from the primary bot of a Hermes gateway on a Linux machine or a macOS guest VM: when the bound Telegram chat has been quiet for two hours, during 08:00-22:00 in the user's timezone, the bot checks in once (does one safe step and reports it, suggests one, or asks one question), backing off when unanswered. The model tool can only make check-ins quieter; more often, resume and wider hours are operator-only via /proactivity or the CLI. After install, the workspace-setup skill walks the agent through setting up Alan's Workspace (a separate desktop app for the user's computer: macOS or Windows) and Tailscale; desktop input goes only through Hermes's approval-gated computer_use tool. Disclosure — once the gateway connects Telegram, a background thread checks every 60 seconds. When the bound Telegram DM has been quiet (2 h by default, doubling per unanswered check-in, 08:00-22:00 user time), it injects an internal user-role prompt into that chat (needs plugins.entries.alans-way.allow_gateway_injection, which setup sets), so the bot runs a turn on its own and may take one \"safe, reversible\" step; the user still approves tool calls in Telegram. Its pre_llm_call/post_llm_call hooks see every session's turns and store only the bound chat's timestamps in plugin state. On first load it reads $HERMES_HOME/companion/proactivity/proactivity.sqlite3 once, read-only. The plugin itself makes no network calls. The workspace-setup skill has the agent clone this repo at the catalog pin and run setup.sh, which does the following. (1) Installs long-running services (Alan's Tools: a managed Chrome/Chromium on a loopback-only debugging port, the first free port from 9223 up, plus a browser broker and an optional availability watcher): systemd units hermes-alans-way-chromium, -browser and mac-watch with loginctl enable-linger where systemd is running; supervisord programs alans-way-chromium, alans-way-browser and alans-way-mac-watch, written to a conf.d file, where it is not (VM images and containers); a KeepAlive LaunchAgent on a macOS guest; logon Scheduled Tasks on Windows. When no X display is running it also installs and runs Xvfb on :99 (unit hermes-alans-way-xvfb or program alans-way-xvfb, -nolisten tcp). (2) Installs packages when they are missing, only as root or with passwordless sudo, through apt, dnf or yum: Google Chrome stable (the current .deb downloaded from dl.google.com on amd64 apt hosts, which also adds Google's apt repository, so the host keeps taking Chrome updates from Google), else the distro chromium package, else Playwright 1.49.1 Chromium through npx (root only); and xvfb. It only warns, and installs nothing, for xdotool, scrot, at-spi2-core and python3-gi, which the VM desktop path needs. (3) Appends the user's computer's public key to ~/.ssh/authorized_keys (administrators_authorized_keys on a Windows admin account) with a from= restriction to the Tailscale ranges 100.64.0.0/10 and fd7a:115c:a1e0::/48, rewriting an existing unrestricted line for the same key; pins its host key in known_hosts and adds a ControlMaster block to ~/.ssh/config for Tailscale hosts only (with a tailscale nc ProxyCommand when Tailscale runs in userspace-networking mode). (4) Adds a TimeoutStartSec=180 drop-in to the hermes-gateway unit. Hermes refuses plugin file changes while a gateway is running, so setup drain-stops that profile's gateway (SIGUSR1 under supervisord, else systemctl stop or hermes gateway stop), replays the refused plugin install or update, and starts it again. With --restart it restarts the gateway only if setup changed something the gateway loads (or an earlier restart never happened), detached about ten seconds after printing its summary: by SIGUSR1 drain under supervisord, else a transient systemd-run timer or hermes gateway restart. (5) For the main profile and every profile with its own Telegram bot, writes a managed mcp_servers.workspace_browser block (removing other entries that run this router, with a backup; a re-run keeps the computer address and OS it already holds, and --mac-ssh none
  removes them), turns off the built-in browser toolset for Telegram and cron (--keep-browser leaves it on), turns computer_use on for Telegram and cron, and sets computer_use.backend to alans-way-computer when it installed or found that provider (under the skill's --skip-plugin flow it only warns and prints the config command). It reads each profile's TELEGRAM_BOT_TOKEN only to derive the numeric bot id. It warns, and changes nothing, when a copy of the workspace-operations skill in a profile's skills directory shadows the plugin's. The workspace router reaches the user's computer over SSH on their tailnet; on the user's computer it calls the local API of Alan's Workspace on 127.0.0.1 with that app's bearer token. The skill's moved-VM checklist has the agent read the app's preferences.json on the user's computer over the same SSH path and tell the human where the VNC password lives without pasting it. The Alan's Workspace setup page has the human run the alans-way connect script from its main branch on their own computer, and the agent may install Tailscale with its official install script. The manual --allow-desktop-actions setup flag, which the skill offers but never adds itself, adds cua:*:background entries to command_allowlist. On a Hermes without the computer-use provider API, including 0.21.5, it also exposes workspace_computer_action, which drives the user's desktop, Terminal included, with no approval. The repo also holds bootstrap-orgo.sh and migrate.sh, which the plugin, setup.sh and the skills never run: a user runs them by hand to provision a fresh supervisord Linux computer (it fetches the Hermes and Tailscale installers over HTTPS, pipes setup.sh from this repo's main branch into bash unless --repo-ref is given, installs openssh-server if absent, writes supervisord programs, and POSTs the Tailscale login URL with a shared secret to a --callback URL when one is given) or to copy ~/.hermes, including .env, auth.json and state.db, to another host over SSH (it also looks up each profile's bot username at api.telegram.org with that profile's bot token). Since 0.21.0, every enabled profile also gets a default-on Telegram texting voice: an additional pre_llm_call hook reads that profile's voice mode and adds a tone note to Telegram turns, and transform_llm_output can remove a known leading assistant opener from the final Telegram reply. Messages containing backticks, quotes, indentation or silence markers are left unchanged by that polish. /tone texting|default|status and hermes tone store the mode under voice in Hermes plugin state; setup.sh --tone applies it to each configured profile. It layers over the user's persona without writing SOUL.md or agent.system_prompt. Check-ins now name one concrete open thread. /proactivity now requests one immediately from the bound chat even when paused or outside active hours, without changing the settings or unanswered-check-in count. Morning briefs are off by default: /proactivity brief on (or the operator CLI) enables one daily internal user-role prompt near active_start, with 0-20 minutes of jitter, at most two hours late and skipped after recent user activity. It asks the model to consult calendar and email read-only if those tools exist. The existing proactivity tool may disable the brief but cannot enable it; settings.morning_brief and last_brief_date are stored in the existing idle plugin state. The workspace router adds a commit object to the existing browser open/action tools for purchases, bookings, sends, posts, submissions, deletions and account changes. It checks control names, selectors, refs, action-looking URLs, batches, scripts, keys and dialogs against page state; missing page knowledge needs a snapshot or explicit commit. Shared commit-name patterns allow benign Buy it again, Book a demo and Subscribe & Save labels without excusing other commit-bearing words. It asks through MCP elicitation (60-second default wait, configurable with HERMES_ROUTER_APPROVAL_MS), refuses unavailable, declined, timed-out or stale approvals, drops agent-supplied approval receipts and adds a single-use receipt bound to the approved tab and epoch. An approved commit is never replayed after a lost connection or host change. It appends commit decisions to commit-decisions.jsonl beside the mac-watch state file, creating the log with mode 0600: timestamp, bot id, page origin, decision and any supplied kind, summary, amount, currency and counterparty, or the detected target. Page/control/challenge and pending-approval state is held in memory. The same two skills now prefer Hermes web_search/web_extract for plain lookups and the user's computer for interactive search, hand CAPTCHAs to the human, poll at most every 30 seconds for up to 30 minutes, and switch sources after two challenges in ten minutes. The router stops remembering challenge pages for failover and reports changed tab ids in result metadata. The operations skill covers the app's automatic takeover after its grace period; CAPTCHA and recording holds and Take-back cooldowns still keep the bot out. It also asks the agent to save durable facts and preferences to memory, never live tab state. The setup skill pins the companion app source to 31ac0de9ee22307e2df03feb08a5e5217a90243b and adds a long-chat reference: report effective compression and summary routing read-only, then only with explicit consent for each profile enable compression.proactive_prune_tokens at 48000, with 8000-character eligibility and 4096-token minimum reclaim, using the profile-scoped config CLI and keeping custom values, micro_compact and summary routing. This writes the approved profile's config.yaml and records prior values outside the repo for undo; setup.sh does not run it. A weekly time-saved report is a user-created Hermes cron recipe, not an installed job. setup.sh --verify now checks the running service manager, display, SSH ProxyCommand and managed browser's loopback /json/version endpoint, and reports noVNC reachability from its actual bind address. Manual supervisord restart guidance drains with USR1 first. The repo also adds scripts/voice_eval.py, user-run only: it sends fixed fictional scenarios and replies to Anthropic models through the SDK or claude -p for scoring and optionally writes a JSON result; the plugin, setup and skills never run it."
