name: alchemy-task
repo: https://github.com/Darengb/alchemy-task
sha: a3f90e0d358c132447b6eda1f774475f0aa3ccfc
description: "Alchemy Task does the work before the work: it turns messy real-world work into finely researched tasks, ready for your agent to do for you. Disclosure — research and discovery start read-only Hermes subagents on your model that can read your files, past sessions, Hermes memory files and the Git history of repositories under your home folder (credential files excluded; a pre_tool_call hook blocks write, shell, send and credential reads); discovery readers must be read-only tools and scheduled runs cannot create or change scheduled jobs unless you set cron.allow_agent_scheduling; task files are Markdown in a Git workspace you choose, committed and pushed with your own git setup; setup copies loader scripts into $HERMES_HOME/scripts/ and creates scheduled jobs after you approve them (a 30-minute research sweep, an hourly script, and one per discovery stream that checks every 30 minutes and wakes the agent only at your chosen time, on a manual run or for a pending follow-up), and can change Hermes's timezone if you agree; background threads poll the Start-in-chat queue every second and, for chats linked to a task, write automatic checkpoints (one small model call, a commit and push) after 30 idle minutes; Start in chat posts into your messaging chat only if you grant allow_gateway_injection; optional iPhone Reminders sync uses the Hermes mobile connector. No telemetry."
maintainer: Darengb
title: "Alchemy Task"
tier: community
category: tools
requires_hermes: ">=0.22.5"
version: "0.1.0"
