sha: 365db2f98f4d1d7b46f2306b84ac177dbcea88ad
description: "Evidence-bound scoped memory for Hermes agents, over the Weft substrate: each turn is written to a local SQLite store under the active profile, recall is scoped before it is ranked (deny-by-default, deterministic, never widened by anything read), and every recall returns a receipt naming the scope consulted, the ids selected and the tier. Duplicates are not re-ingested, deletions cascade, corrections preserve lineage. Registers as memory.provider: aletheia and exposes weft_recall, weft_ingest, weft_forget and weft_receipt, with recall on a worker thread so a turn's prefetch is not blocked; the built-in memory store keeps running alongside it. Disclosure — the plugin's code ships in the weft-memory PyPI package (installed as weft-memory>=1.0,<2, so it is outside this catalog pin); every primary-agent turn is stored in a local SQLite store under the active profile (no network calls, no telemetry, no credentials on the Hermes path); the required bge-m3 embedder and cross-encoder reranker (~0.7 GB) must already be in the local Hugging Face cache, downloaded from their official Hugging Face repositories, and are not vendored; optional OCR (Qwen3.5-2B, 2.5 GB) and Whisper (547 MB) enable image and audio ingest; macOS on Apple silicon only (mlx); AGPL-3.0, and weft-memory is AGPL-3.0 as well."
