description: "Self-contained native whole-file WebSocket TTS and synchronous file ASR with its own catalogue. Native Token Plan speech synthesis and file transcription through Hermes voice delivery and transcription tools. TTS and ASR have isolated Global/China Personal/Team providers and read scoped keys through public Hermes APIs. ASR may invoke existing ffmpeg/ffprobe found with shutil.which; no binary download, PAYG fallback, telemetry, automatic model substitution, paid resubmission, PCM streaming or realtime calling. One selected account key is needed, not every optional variable. Disclosure — sends the text to synthesize, or the audio file to transcribe, with the selected account's Token Plan key to Alibaba's fixed regional Token Plan host (token-plan.maas.qwencloudapi.com for Global, token-plan.maas.qianwenaiapi.com for China); transcription may run the ffmpeg/ffprobe already installed on the machine (never downloaded) to convert audio; keys are read through Hermes's secret API; no telemetry."
