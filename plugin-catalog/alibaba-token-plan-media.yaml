description: "Derived from dashscope-image and dashscope-video; self-contained native image/video, whole-file WebSocket TTS and synchronous file ASR with its own catalogue. Native Token Plan image/video generation, whole-file TTS and synchronous ASR through Hermes tools and voice delivery. Sends the chosen scoped key, prompts and bounded user images/audio to fixed Token Plan hosts; guarded public HTTPS source/artifact transfers and local cached outputs. ASR has isolated Global/China Personal/Team providers and may invoke existing ffmpeg/ffprobe; no binary download, PAYG fallback, telemetry, automatic model substitution, paid resubmission, PCM streaming or realtime calling. Private host-helper compatibility warnings are disclosed. One selected account key is needed, not every optional variable."
