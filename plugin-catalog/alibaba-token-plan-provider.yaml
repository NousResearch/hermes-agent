description: "Improved standalone chat provider following upstream #52915/#70120; supported overrides replace bundled basic Personal profiles and add Team profiles. Alibaba Token Plan chat with isolated Global/China and Personal/Team accounts, entitlement-aware ordered catalogues, reasoning controls and legacy aliases. Sends the selected profile key and prompts to its regional Token Plan host; no PAYG fallback. Optional account variables are configured only for the selected accounts. /models is not inference health. Read migration guidance before replacing shell installations."
