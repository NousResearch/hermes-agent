description: >-
  Free, read-only crypto data in Hermes: project metrics and TVL history, chains, fees and revenue,
  funding rounds and investors, DeFi yield pools, stablecoins, token unlocks and DAO treasuries,
  through AlphaGrowth's hosted MCP server (Streamable HTTP, no account or API key), with three
  research skills bundled. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/).
  Disclosure — hosted-only connector with no local code: every tool call is an HTTPS request to
  alphagrowth.io/mcp, and the returned data joins the session context, so it reaches the user's
  model provider. No tool writes, trades or moves money (all 37 are annotated readOnlyHint).
  AlphaGrowth logs each call (tool and arguments, client name and version, user agent, IP and
  approximate location); arguments and location are deleted and IPs hashed after 30 days, records
  deleted after 180 days. The tool list comes from the server at run time, so the pinned commit
  doesn't cover it.
