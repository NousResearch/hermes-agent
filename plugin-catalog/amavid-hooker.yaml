description: >-
  Generate and edit UGC images and videos with Grok Imagine (xAI) straight from
  Hermes. Drag an Amazon product to Telegram (or any prompt), and Hermes turns it
  into a ready-to-post creative: image generation and editing, text-to-video,
  image-to-video, reference-to-video, and visual flow canvas. Portable Agent
  Plugins v1 package (mcp.json + skills/), no plugin code. Requires Node.js 20+
  and the official Grok CLI; each user signs in via their own Grok CLI OAuth
  session (grok login --oauth). Tokens stay in ~/.grok/auth.json and are never
  returned by MCP tools. Disclosure — media generation may consume the user's
  xAI quota; requests go only to auth.x.ai and api.x.ai plus the Grok CLI auth
  flow; generated files stay local; the local canvas listens on loopback.
