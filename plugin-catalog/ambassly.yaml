description: "Run Stripe-based affiliate programs, per-content links, referrals and commission review through Ambassly's hosted MCP server, with a workflow skill bundled. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/). Disclosure: every tool call goes to https://ambassly.com/api/mcp and needs an Ambassly account with a scoped API key in AMBASSLY_API_KEY, sent as a Bearer header. Company-key tools can create programs and affiliates, approve or reject commissions and add Stripe webhook signing secrets; the package marks the server untrusted so Hermes asks before write-capable calls, and the skill requires a person to decide each commission. Affiliate and commission data returned by tools reach the model provider. The tool list comes from the server at run time and is not covered by the pinned sha."
