sha: 0f35366996a71b72ff93dc81e291bbda564b4bf0
version: "0.1.0"
title: Ample
description: "Ample (ample.computer) as native tools: deploy the websites and web apps Hermes builds to public HTTPS URLs, release changes to the same URLs, read build and runtime logs, list and delete apps; bundled skill ample:web-apps. Disclosure — maintained by Ample, the hosting service it deploys to; talks to Ample's API (https://api.ample.computer); on first use downloads the pinned Ample CLI 0.1.36 from Ample's release server (https://get.ample.computer/releases/0.1.36/, SHA-256 checked, never self-updated; cli_path uses your own binary instead) and runs it as a subprocess with an allowlisted environment and its crash reports off; ample_deploy uploads the folder it is given (home, Hermes home and credential directories refused) and writes ample.toml and .ample/ into it; with no AMPLE_CLIENT_ID/AMPLE_CLIENT_SECRET or AMPLE_TOKEN set, the first deploy signs up for a free Ample account (deleted after two days unless claimed) and saves its credential in Hermes's .env. A pre_tool_call hook sends every delete (scoped to that app) and the first publish of each folder to Hermes's approval gate; only folders the user has published, recorded in plugin state, skip it. No telemetry, no background processes."
maintainer: ishanray
tier: community
category: tools
requires_hermes: ">=0.21.5"
docs_url: https://github.com/ishanray/hermes-ample#readme
readme: true
capabilities:
  provides_tools:
  - ample_deploy
  - ample_logs
  - ample_apps
  - ample_app_delete
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env: []
