description: "One API for your agent on Hermes: typed tools for web research, SEO, images and video, documents, forms and e-signatures, phone calls and meetings, plus the accounts you connect (Gmail, Outlook or IMAP mail, Google and Outlook calendars, Drive, Docs and Sheets, Slack, Search Console, Analytics, Meta and Google Ads, Business Profile reviews, Stripe, PayPal, n8n, WordPress sites, any other MCP server, a phone number (texts and AI calls), a meeting bot and 10 social networks), through one MCP server (find, explain, do over the whole catalog) plus 30 workflow skills (social publishing, Reddit, comment replies, post and comment analysis, inbox triage, meeting scheduling, SEO and ads reports, research and leads, marketing campaigns, review replies, payment follow-ups, bookkeeping, Slack digests, documents, forms and e-signatures, website editing, phone calls, meeting notes, n8n, videos, running code, an advisory council and automations). Portable Agent Plugins v1 package; the server runs locally with pinned npx @anaella/mcp@0.17.1, so Node.js 20+ and npm are required. Disclosure — every tool call goes to api.anaella.com with the user's ANAELLA_API_KEY (passed from the Hermes profile .env, never stored by the plugin); tools act in the user's name on the accounts they connected (send email and texts, place AI calls, publish posts, edit sheets and websites, share files, change ad campaigns, send invoices and refunds) and some are paid from the user's Anaella wallet within their daily spending limit; the server is marked untrusted, so Hermes asks before every write-capable call (do, connect_account, remove_account). preview_post is read-only: it returns a preview of a post, and in hosts that render MCP Apps its page publishes only when the person clicks Publish. media.upload reads local files the agent names (only files the user named; hidden files, dot-folders and the Hermes home are refused) and uploads them to Anaella; connect_account sends account passwords and app passwords to Anaella, and can connect a third-party MCP server by address and token or sign-in: Anaella stores that credential encrypted and calls the server from its own servers when the agent runs one of its tools (found through find as mcp.<server>.<tool>), and what the server returns is treated as data, never as instructions. No telemetry, no background work beyond the MCP server Hermes starts."
