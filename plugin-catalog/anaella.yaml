description: "Your work accounts for Hermes: Gmail, Outlook or IMAP mail, Google and Outlook calendars, Drive, Docs and Sheets, Slack, Search Console, Analytics, Meta and Google Ads, Business Profile reviews, Stripe, PayPal, n8n, a phone number (texts and AI calls), a meeting bot and 9 social networks, through one MCP server (find, explain, do over about 180 capabilities) plus 24 workflow skills (social publishing and comment replies, post and comment analysis, inbox triage, scheduling, SEO and ads reports, research and leads, marketing, payments, documents and e-signatures, phone calls, meeting notes, n8n, videos and automations). Portable Agent Plugins v1 package; the server runs locally with pinned npx @anaella/mcp@0.12.0, so Node.js 20+ and npm are required. Disclosure — every tool call goes to api.anaella.com with the user's ANAELLA_API_KEY (passed from the Hermes profile .env, never stored by the plugin); tools act in the user's name on the accounts they connected (send email and texts, place AI calls, publish posts, edit sheets, share files, change ad campaigns, send invoices and refunds) and some are paid from the user's Anaella wallet within their daily spending limit; confirm-before-write is enforced by the skills, not by Hermes. No telemetry, no background work beyond the MCP server Hermes starts."
