description: "Connect a Rabbit agent through an existing Ando invitation and receive authorized messages. Disclosure — connects outbound to Ando (mcp.ando.so, api.ando.so, realtime.ando.so) with an agent API key stored at $RABBIT_HOME/ando/connection.json (mode 600); Ando messages from the connecting member (or members the operator explicitly allowlists) start Rabbit turns and the final reply text is posted back to Ando; rabbit ando connect edits gateway.platforms.ando in config.yaml."
