description: "Connect a Hermes agent through an existing Ando invitation and receive authorized messages. Disclosure — connects outbound to Ando (mcp.ando.so, api.ando.so, realtime.ando.so) with an agent API key stored at $HERMES_HOME/ando/connection.json (mode 600); Ando messages from the connecting member (or members the operator explicitly allowlists) start Hermes turns and the final reply, with any files it attaches, is posted back to Ando; message attachments are uploaded and downloaded through short-lived single-use links Ando issues (up to 20 MB each; received files are cached in the profile's Hermes cache); hermes ando connect edits gateway.platforms.ando in config.yaml."
docs_url: https://github.com/Ando-Corporation/hermes-ando/blob/1bfde877e1ed194ebf461d64e0468605d7e21a87/README.md
