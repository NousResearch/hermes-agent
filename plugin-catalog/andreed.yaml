name: andreed
repo: https://github.com/Agozie180/andreed
sha: 482f06793dbd307fcdfc8a9f43ba1d0ced21a4c7
title: Andreed
description: "Diagnose overheating, freezes, slowness, low RAM, full storage and cellular data usage on an authorized Android phone over local ADB. Phone changes require fresh human approval through Hermes."
maintainer: Agozie180
tier: community
category: tools
version: "0.2.0"
requires_hermes: ">=0.21.6"
docs_url: https://github.com/Agozie180/andreed#readme
platforms: [windows, macos, linux]
capabilities:
  provides_tools:
    - andreed_doctor
    - andreed_scan
    - andreed_force_stop
    - andreed_set_background_data
    - andreed_trim_caches
  provides_hooks:
    - pre_tool_call
    - post_approval_response
    - post_tool_call
  provides_middleware: []
  requires_env: []
