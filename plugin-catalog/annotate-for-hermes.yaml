  - https://raw.githubusercontent.com/LarryLemonBot/annotate-for-hermes/71c688fd2dd26554e404b467b48bff6d2ecfdb32/docs/annotation-preview.png
known_issues:
  - "Development preview: requires the response-annotations v1 Desktop API from PR #146959. Stock Hermes through v0.23.0 does not provide it. This pin is the macOS hackathon preview; its v0.23.0 developer patch is newer than the original core proposal. Do not merge this entry until the API is released and both compatibility floors are updated."
  - "Only macOS runtime behavior has been exercised. Windows, Linux, screen readers, touch, and the official updater path remain unverified."
  - "Unsaved popover comments and source highlights do not survive an app reload. Draft attachments do."
