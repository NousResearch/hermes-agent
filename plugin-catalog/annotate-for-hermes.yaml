name: annotate-for-hermes
repo: https://github.com/LarryLemonBot/annotate-for-hermes
sha: 340b244423562d52d66de265159fe0f5151b9995
title: "Annotate for Hermes"
description: >-
  Annotate for Hermes adds response annotations: highlight assistant text, add
  comments and collect your feedback in one attachment inside the message composer.
  Review, edit or remove each annotation, then send all selections with an ordinary
  reply. Disclosure — Desktop-only; uses the public composer
  annotation API and draft/session SDK, renders its own popovers, and temporarily
  highlights selected text. No network calls, credentials, telemetry, model calls,
  Python hooks, automatic sends, self-updater or changes to application files.
maintainer: LarryLemonBot
tier: community
category: desktop
version: "1.0.0"
requires_hermes: ">=0.22.5"
docs_url: https://github.com/LarryLemonBot/annotate-for-hermes#readme
platforms: [linux, macos, windows]
image: https://raw.githubusercontent.com/LarryLemonBot/annotate-for-hermes/340b244423562d52d66de265159fe0f5151b9995/docs/catalog-banner.png
screenshots:
  - https://raw.githubusercontent.com/LarryLemonBot/annotate-for-hermes/340b244423562d52d66de265159fe0f5151b9995/docs/annotation-preview.png
known_issues:
  - "Development preview: requires the response-annotations v1 Desktop API from PR #146959. Stock Hermes 0.22.5 does not provide it. Do not merge this entry until the API is released and both compatibility floors are updated."
  - "Unsaved popover comments and source highlights do not survive an app reload. Draft attachments do."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []

