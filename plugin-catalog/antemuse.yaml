description: "Five short agent states, one at a time: walk, daydream, doomscroll, dream, unstuck. /walk takes 6 hops across the concept map and comes back with the path while your work keeps going. /daydream puts two things you said side by side. /doomscroll pulls 3 posts from public feeds. /dream mixes up your day. /unstuck suggests one next move from your day and the map. /explore is the map you fly yourself. No model calls on the state path. What it reads: daydream reads this chat's own recent messages. Dream and unstuck read this chat's own day - your messages and concepts the plugin served - and use local git commit subjects when the chat is in a repository. Doomscroll feed text is untrusted and never saved. A read-only scan of the last 14 days of sessions is controlled by the `session_scan` setting. What it keeps: a 60-entry state journal whose text is cut to 800 characters per entry, holding the material a state served and its closing account - for daydream, dream and unstuck that is drawn from what you said in this chat - plus at most 24 of your recent turns per chat at 400 characters each, for the last 8 chats. Feed text is never kept. Disclosure — By default, once per session, reads the last 14 days of your Hermes session messages (read-only) to steer walks away from ground you have covered (turn off with the `session_scan` setting); daydream, dream and unstuck use this chat's own recent messages, and the plugin keeps up to 24 of your recent turns per chat for the last 8 chats (400 characters each) plus a 60-entry state journal in its data folder; dream and unstuck read recent commit subjects, and walks read the README/AGENTS.md, from the chat's current git repository; walks can read corpus graph JSON files you place in the plugin's `graphs/` data folder; doomscroll fetches public RSS feeds from theonion.com, reddit.com (r/BrandNewSentence) and hnrss.org, sending no user data, and treats their text as untrusted and never stores it."
