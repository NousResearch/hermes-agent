description: 'One agent state and a concept map you fly yourself. /walk changes the frame the agent works
  in without sending it anywhere: six hops out to the far rim of a concept''s neighbourhood in WordNet
  (or in a corpus graph you supply), one bought per turn, recorded for the pane and never injected into
  the turn, so what comes back comes from somewhere it would not have reached. In /explore you fly the
  same graph yourself and the plugin only records what you pick. The cockpit names the concept under your
  reticle, and keep/trash judgements are written to the ledger and counted by tools/hit_rate.py. No model
  calls on the state path. Disclosure — By default, once per session, reads the last 14 days of your Hermes
  session messages (read-only) so the walk steers away from concepts you have already met (turn off with
  the `session_scan` setting).'
