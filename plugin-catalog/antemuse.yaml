known_issues:
- The picture is two desktop panes — the Antemuse map, and the cockpit /explore is flown in. Chat carries
  no visualization and a terminal gets the same text record; there is no terminal takeover since 0.10.30.
- 'Windows: the installer and runtime are pure Python and the suite passes on Linux; there is no Windows-specific
  path, so the pane is expected to work but is unverified there.'
- The exploration library (spark, keep, collider, selection) is present but runtime-gated behind experimental.enabled
  and makes no quality claim.
