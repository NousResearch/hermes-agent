description: "Five bounded agent states, one at a time: walk, daydream, doomscroll, dream, and unstuck. /walk takes six graph hops while work continues; /daydream pairs the person's own memories; /doomscroll delivers three gated public feed items; /dream recombines local git commit subjects; /unstuck gives one direction from history and the concept graph. /explore remains the separate person-driven map. No model calls on the state path. Disclosure — By default, once per session, reads the last 14 days of your Hermes session messages (read-only) to steer walks away from ground you have covered (turn off with the `session_scan` setting); daydream pairs your own recent messages, which the plugin keeps (last 24) in its data folder; dream and unstuck read today's commit subjects, and walks read the README/AGENTS.md, from the current git repository; walks can read corpus graph JSON files you place in the plugin's `graphs/` data folder; doomscroll fetches public RSS feeds from theonion.com, reddit.com (r/BrandNewSentence) and hnrss.org, sending no user data, and treats their text as untrusted and never stores it."
