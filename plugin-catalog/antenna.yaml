description: "Signed messaging with paired Hermes and OpenClaw agents, with receiver-controlled live and opt-in non-YOLO headless delivery. Disclosure — runs a loopback-only Node receiver when listen_port is set (you expose only its HTTPS receive route); messages from paired peers become agent turns in the sessions you approve and may cause tool use, and opt-in background delivery runs them in non-YOLO sessions only; smart scanning sends message text through your configured provider; ClawReef Public Groups use a plaintext relay that ClawReef can read; identity keys, peer credentials, holds and receipts live in the profile's plugin-data/antenna (0700/0600) and backups contain credentials; policy and storage commands rewrite config.yaml (comments and formatting are lost)."
