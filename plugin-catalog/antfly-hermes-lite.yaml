description: >-
  Local-first context and long-term memory for Hermes backed by Antfly Lite.
  Provides scoped cross-session recall, automatic completed-turn and fact
  capture, curated-memory mirroring, compression checkpoints, and governed MCP
  knowledge retrieval. Lexical mode is embedded and keyless; optional semantic
  recall sends memory text and queries only to the operator-configured
  OpenAI-compatible embedding endpoint. Disclosure — on first use, the plugin
  verifies and extracts its bundled native runtime into the selected Hermes
  profile; it starts no service, downloads nothing, and sends no telemetry.
maintainer: Antfly
