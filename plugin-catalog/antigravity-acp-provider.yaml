subdir: hermes-plugin/antigravity-acp
version: "0.7.11"
description: >-
  Independent Hermes provider for Google's official Antigravity ACP server.
  Disclosure: runs the Google server as a child process; authentication and
  third-party network access occur through that runtime. The provider never
  auto-approves native execution: native run_command is disabled at session
  launch, native file-mutation or command permission frames are rejected, and
  the client advertises no fs/write_text_file capability and denies every ACP
  file-write callback, so shell and file work goes through Hermes' own
  approval-gated terminal and file tools. Google restricts use of personal
  Antigravity OAuth by third-party clients; account and authentication
  eligibility must be checked against Google's current terms. Not affiliated
  with or endorsed by Google.
