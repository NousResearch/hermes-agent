description: "Independent Hermes provider for Google's official Antigravity ACP server. Disclosure — runs Google's official Antigravity ACP server (installed by the project's installer from dl.google.com, sha256-pinned) as a child process that holds its own Google sign-in and sends prompts, conversation context and files it reads to Google; the server's native shell and file-edit tools are refused, so shell and file work goes through Hermes' own approval-gated tools; Google restricts third-party use of personal Antigravity OAuth, so check your account's terms; not affiliated with or endorsed by Google."
