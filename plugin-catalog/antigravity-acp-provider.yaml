subdir: hermes-plugin/antigravity-acp
version: "0.7.7"
description: >-
  Independent Hermes provider for Google's official Antigravity ACP server.
  Disclosure: runs the Google server as a child process; authentication and
  third-party network access occur through that runtime. Supported native file
  edits and commands are automatically approved after plugin checks and may
  bypass Hermes terminal approval; workspace checks are not an OS sandbox.
  This behavior may conflict with catalog rule 12. Google restricts use of
  personal Antigravity OAuth by third-party clients; account and authentication
  eligibility must be checked against Google's current terms. Not affiliated
  with or endorsed by Google.
maintainer: rhgo1749
