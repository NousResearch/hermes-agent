title: Antigravity OAuth Plus
description: "Google Antigravity for Hermes with live account model discovery, Hermes-native context handling, cached quota in /usage, and an opt-in five-hour/weekly reset dock. Disclosure — Derived from antigravity-subscription-directsdk and antigravity-oauth; inference, /usage and /credits reads run through Google's official agy CLI and count against the Antigravity/Gemini subscription it is signed in to. The full Hermes system prompt and SOUL.md are written to a temp workspace GEMINI.md each turn. agy runs with Hermes's full environment in a per-session private temp HOME. The plugin symlinks agy's token file into that HOME, hard-links it or as a last resort copies it (copy2 reads the token bytes), and on macOS it also symlinks ~/Library/Keychains. A token refresh by agy through those links can update your real agy login. The plugin itself never writes the vendor store. It probes the OS keyring for presence only and may fall back to /root/.gemini/antigravity-cli when HOME has no token. The opt-in widget setup writes one adapter file to $HERMES_HOME/tui-widgets."
maintainer: taylorwtf
tier: community
category: models
requires_hermes: ">=0.21.5"
