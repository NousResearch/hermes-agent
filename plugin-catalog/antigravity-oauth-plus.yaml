known_issues:
  - "The provider reuses the official agy CLI credential store through the inherited isolated-HOME symlink/hardlink/copy fallback; see the README security disclosure for maintainer review."
  - "Native /usage reads cached quota; refresh explicitly. The optional TUI widget requires explicit profile-local setup."
  - "Unknown model context uses Hermes' native fallback and is not an authoritative Antigravity limit."
