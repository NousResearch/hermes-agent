description: "Runs Hermes on an Antigravity subscription via the agy CLI. Supports native multimodal vision and video, streams progressively and opts into host streaming when the profile declares it; persists trajectories via agy --conversation (239k); discovers models per account; maps effort; reports /usage quota; aborts native tool steps; reaps orphaned plugin workers whose owner temp dir is gone and cleans every ephemeral session dir on close; declares per-model vision capability so attached images route natively. Windows console children spawn with CREATE_NO_WINDOW. Inference and /usage reads count against your subscription; links the antigravity-oauth-token into a private temp HOME deleted on close; probes keyring presence (Secret Service, Keychain, Credential Manager), reading no secrets; symlinks ~/Library/Keychains on macOS; never writes vendor credential stores; strips credential-looking env vars before spawning agy (ANTIGRAVITY_ENV_STRICT allow-list); ANTIGRAVITY_DEBUG_PROMPT_DIR writes every prompt to disk. Disclosure — routes inference and /usage quota reads through Google's official agy CLI under your subscription (usage counts against it); links (symlink, else hardlink/copy) the antigravity-oauth-token into a per-session private temp HOME deleted on close; probes OS keyring presence (Linux Secret Service, macOS Keychain, Windows Credential Manager) without reading secrets; on macOS symlinks ~/Library/Keychains for CLI session reuse; never writes to vendor credential stores; strips credential-looking environment variables before spawning agy (name heuristic; ANTIGRAVITY_ENV_STRICT for an allow-list) and disables agy's background auto-updater in its child environment; image, video and audio inputs (data URLs, local media files and public http(s) URLs, which the host downloads up to 25 MB) are passed to agy and uploaded to Google, and files it downloads into its own media cache are deleted when the session closes. Disclosure — the opt-in ANTIGRAVITY_DEBUG_PROMPT_DIR env var writes every outgoing prompt (full conversation text) to that directory."
