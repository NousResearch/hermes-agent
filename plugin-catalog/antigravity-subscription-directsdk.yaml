name: antigravity-subscription-directsdk
repo: https://github.com/soyelmismo/hermes-antigravity-subscription
sha: 3d691dadfdd515083237337c4a9747389a18ca4a
description: >-
  Run Hermes on an Antigravity / Gemini subscription via the official agy CLI (DirectSDK path).
  Streams tokens progressively, maps thinking effort, bounds context to 200k tokens with tool
  output pruning, and aborts native tool steps. Disclosure: routes inference through Google's
  official agy CLI under your subscription; symlinks the antigravity-oauth-token into a
  per-session private temp HOME deleted on close; probes OS keyring presence (Linux Secret Service,
  macOS Keychain, Windows Credential Manager) without reading secrets; on macOS symlinks
  ~/Library/Keychains for CLI session reuse. Never writes to vendor credential stores.
maintainer: soyelmismo
tier: community
category: models
requires_hermes: ">=0.21.0"
