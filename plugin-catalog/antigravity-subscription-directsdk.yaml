name: antigravity-subscription-directsdk
repo: https://github.com/soyelmismo/hermes-antigravity-subscription
sha: 0d5a3160f69f0c3302e3f49d9d2820093a544116
description: "Runs Hermes on an Antigravity subscription via the agy CLI. Streams progressively and opts into host streaming when the profile declares it; persists trajectories via agy --conversation (239k); discovers models per account; maps effort; reports /usage quota; aborts native tool steps. Windows console children spawn with CREATE_NO_WINDOW. Inference and /usage reads count against your subscription; links the antigravity-oauth-token into a private temp HOME deleted on close; probes keyring presence (Secret Service, Keychain, Credential Manager), reading no secrets; symlinks ~/Library/Keychains on macOS; never writes vendor credential stores; strips credential-looking env vars before spawning agy (ANTIGRAVITY_ENV_STRICT allow-list); ANTIGRAVITY_DEBUG_PROMPT_DIR writes every prompt to disk."
maintainer: soyelmismo
tier: community
category: models
