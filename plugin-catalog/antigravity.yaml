version: "1.5.0"
readme: true
platforms:
- linux
- macos
- windows
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - ANTIGRAVITY_CLIENT_ID
  - ANTIGRAVITY_CLIENT_SECRET
