description: "Google Antigravity / Cloud Code Assist inference provider (native direct-API client, v1.5.0). Speaks daily-cloudcode-pa.googleapis.com through its own HTTPS transport - no agy binary, no external process. Credentials via Hermes onboarding only; no writes to Hermes private state. Multi-account registry with reactive 429 failover, proactive per-model quota check, quota-approach warning, retired-model filtering."
