description: "Read-only access to your AnvilAds Google Ads data from Hermes, via the AnvilAds Connect AI MCP server (Streamable HTTP at https://anvilads.com/mcp): connected ad accounts, campaigns from the latest stored snapshot, performance summaries (spend, clicks, conversions, CPA), the latest morning or weekly report, lead totals, and ad audit grades, plus a bundled skill teaching the morning-check workflow. AnvilAds is an AI agent that builds, launches, and optimizes Google Ads; the owner approves every launch in the AnvilAds dashboard. Disclosure — hosted-only connector with no local code: every tool call goes to anvilads.com, authenticated with your ANVILADS_API_KEY (a per-business key created in the AnvilAds dashboard, sent as a bearer header only to that host). The tool set is served by the remote server at runtime and is not covered by the pinned sha; the vendor documents it as read-only (seven tools over stored data, no writes, no live Google Ads calls)."
