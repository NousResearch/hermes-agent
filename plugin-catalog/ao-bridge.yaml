title: AO Bridge
description: 'Agent Orchestrator bridge for the Hermes web dashboard: a Kanban board
  over the local AO daemon where every AO project''s sessions render as cards across
  Queued/Running/Review/Blocked/Done/Archive columns mapped from live session state.
  Spawn workers into any registered project (project + harness + name + prompt),
  send user-authored messages to running sessions, kill sessions (with confirmation),
  and watch the board refresh on a 5s poll. Third-party dashboard plugin: adds a
  dashboard tab plus a backend API router at /api/plugins/ao-bridge/ that talks only
  to the local AO daemon REST API (loopback, no secrets, no external calls). Pair
  with the ao gateway platform plugin if you want spawned workers chatting back.'
