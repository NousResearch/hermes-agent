name: api-architect
repo: https://github.com/monyinet/api-architect
sha: "6c115c889028e89335a37a1d717d42662fe0ea98"
description: >-
  Compile API specs into first-class Hermes tools. Takes any OpenAPI 3 / Swagger 2 /
  Postman v2.1 spec by URL, compiles endpoints + params with per-endpoint provenance
  into a schema-checked manifest, and serves four tools: architect_learn (fetch +
  compile), architect_commit (human-approved draft→active review; a commit can
  replace an active manifest), architect_list (manifests persist across sessions) and
  api_call (schema-checked execution — invalid params fail locally, never as server
  400s, so the model self-corrects). Cuts HTML deep-scraping by design: no spec, no
  invented endpoints. Disclosure — network: fetches user-supplied spec URLs and calls
  API hosts the user committed via architect_commit; private networks (loopback,
  RFC1918, link-local, ULA — including numeric/decimal/hex and IPv6-mapped smuggled
  forms) are denied by default with an opt-in allow_private_hosts setting; redirects
  are not followed; request timeout + response size caps; no telemetry, nothing
  leaves the machine except the calls the user asked for. Credentials: only through
  Hermes routes (config_schema type secret, read via agent.secret_scope at call
  time); manifests store the slot NAME and the approved hostname, never the value; no
  .env / auth.json / keychain reads; no OAuth flows. Each slot is pinned by the owner
  to one exact hostname (api_key_1_host / api_key_2_host): a commit whose manifest
  host differs is refused, and the executor re-checks it against the manifest's
  recorded host before the secret is read — a model-supplied secret_binding, a
  hostile spec's servers[0].url or a hand-edited manifest cannot route a key, and
  re-pointing a slot stops older manifests from sending it. Hooks: provides
  pre_tool_call (only), which escalates architect_commit and every non-GET api_call
  to the host human-approval gate (message carries "<method> <host><path>") and
  blocks both inside cron runs via ctx.current_cron_execution(); there is no confirm
  argument and the handlers refuse a gated action the hook did not clear for that
  exact call, so the model cannot authorize its own write. Zero python_dependencies
  (stdlib only). 281 stdlib tests at the pinned commit + real E2E (learn → draft
  refusal → commit → HTTP 200 call; approval-gated destructive call; invented
  endpoints and SSRF refused).
maintainer: monyinet
tier: community
category: tools
requires_hermes: ">=0.22.0"
version: "0.1.0"
image: "https://raw.githubusercontent.com/monyinet/api-architect/6c115c889028e89335a37a1d717d42662fe0ea98/assets/hero.png"
capabilities:
  provides_tools:
  - architect_learn
  - architect_commit
  - architect_list
  - api_call
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env: []
