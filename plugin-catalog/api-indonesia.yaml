description: "Indonesian public data from official sources through API Indonesia's hosted MCP server (Streamable HTTP at https://mcp.apiindonesia.id/mcp, API key auth): administrative regions down to villages with Kemendagri codes, postal codes, region boundaries, public holidays and cuti bersama, prayer times, Hijri calendar, schools, universities, hospitals, BMKG earthquakes, weather and warnings, Bank Indonesia exchange rates, minimum wage (UMP), NIK/NPWP format checks, QRIS parsing, rupiah terbilang, halal and BPOM lookups, OJK investment lists, KBBI, Al-Quran and Alkitab. Bundles the api-indonesia skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local code: every tool call, with its arguments, goes to mcp.apiindonesia.id and spends the key owner's API Indonesia credits (Rp2 per successful call, failed calls are free; new accounts get a one-time 3,000 credit bonus, no monthly free tier). The key is read from API_INDONESIA_KEY in the profile .env (or the plugin's settings form) and sent as a bearer header. All tools are read-only lookups and calculators. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
