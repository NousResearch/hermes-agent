description: |
  Indonesian public data from official sources, right inside your agent: regions down to villages, postal codes, holidays, prayer times, BMKG weather and earthquakes, and more. Connects to API Indonesia's hosted MCP server with your API key.

  - Regions and places: provinces down to villages with Kemendagri codes, postal codes, region boundaries
  - Calendar: public holidays and cuti bersama, prayer times, Hijri dates
  - Public services: schools, universities, hospitals, BMKG earthquakes, weather and warnings
  - Money and checks: Bank Indonesia exchange rates, minimum wage (UMP), NIK/NPWP format checks, QRIS parsing, rupiah terbilang
  - References: halal and BPOM lookups, OJK investment lists, KBBI, Al-Quran and Alkitab
  - Bundles the api-indonesia skill; Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only

  Disclosures
  - Hosted-only connector with no local code: every tool call, with its arguments, goes to mcp.apiindonesia.id.
  - Successful calls spend the key owner's API Indonesia credits; failed calls are not charged.
  - The key is read from API_INDONESIA_KEY in the profile .env (or the plugin's settings form) and sent as a bearer header.
  - All tools are read-only lookups and calculators.
  - The tool set is served by the remote server at runtime and is not covered by the pinned sha.
