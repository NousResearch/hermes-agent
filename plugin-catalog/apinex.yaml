description: >-
  APInex as Hermes model providers on one key: `apinex` serves Claude 5.5 and Free-tier Claude
  models over APInex's native Anthropic Messages API (so Hermes' Anthropic prompt caching and
  extended thinking apply), and `apinex-openai` serves GPT-6.1, Gemini 4 Argon, DeepSeek V4.1,
  GLM 5.3, Qwen 3.8, Kimi K3.1, Grok 4.7 and 17 Free-tier ($0.00/1M) chat models over its
  OpenAI-compatible API. Each /model picker lists that side's tool-capable chat models from the
  account's GET /v1/models list, omitting non-tool and media endpoints, with 1M/500K context
  windows and native image input declared per model. Maintained by APInex. Disclosure — registers
  two model providers at import and nothing else (no tools, hooks, commands or threads). Prompts,
  tool schemas and APINEX_API_KEY go to https://api.apinex.bond (/v1/messages and
  /v1/chat/completions) through Hermes' own clients, and APInex forwards each request to the
  upstream vendor serving the model. The model list is Hermes' standard GET
  https://api.apinex.bond/v1/models request with the key; the plugin makes no network requests of
  its own, adds no headers, sends no telemetry, reads or writes no files and stores no credentials.
