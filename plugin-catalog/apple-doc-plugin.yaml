name: apple-doc-plugin
title: Apple Developer Documentation Studio
repo: https://github.com/AndrewMason7/apple-doc-plugin
sha: 97e98169fe7d8e40654a639da4d490f6a28a34ed
version: "1.1.0"
description: "Offline-first Apple Developer Documentation suite for Hermes: 95,899 symbols across 30 Apple frameworks with sub-5ms SQLite FTS5 search, React/Web/Android-to-SwiftUI idiom RRF, automatic Swift compiler diagnostic grounding hook, @apple: context references, /apple-docs demo command, inline ::apple-doc cards, an interactive Hermes Desktop Studio docked beside your chat session, and an Apple Docs search tab in the web dashboard. Disclosure — reads its bundled data/apple-docs.db SQLite index in read-only mode; writes no files during normal Hermes operation (the one exception is the first optional Node-bridge start, which installs npm dependencies, including native install scripts, and builds inside the plugin folder — that step also reaches the npm registry); adds a short ::apple-doc directive guidance snippet to the system prompt, and intercepts failed swift/swiftc/xcodebuild terminal outputs via transform_terminal_output (offline, configurable via compiler_grounding); get_documentation and Desktop live symbol inspection fetch https://developer.apple.com/tutorials/data/documentation/<symbol>.json over HTTPS (2.5s timeout, 2 MiB cap, local SQLite fallback); spawns no subprocesses and needs no credentials by default (if prefer_node_bridge is enabled or dense vectors are hydrated, starts a local Node >=22 MCP subprocess; GEMINI_API_KEY is read strictly via Hermes secret_scope, and ambient Google Application Default Credentials are disabled under the bridge so no other tool's login can authenticate the plugin); no telemetry or self-updater."
maintainer: AndrewMason7
tier: community
category: tools
requires_hermes: ">=0.22.5"
docs_url: https://github.com/AndrewMason7/apple-doc-plugin#readme
readme: true
