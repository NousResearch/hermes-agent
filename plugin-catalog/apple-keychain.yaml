name: apple-keychain
title: Apple Keychain
repo: https://github.com/robbiemu/hermes-agent
sha: b7fc3d471cff3d74be740248218e5966a10d84c3
subdir: plugins/apple-keychain
description: >-
  Load Hermes secrets from macOS Keychain, with interactive setup, profile .env import,
  safe rotation and recovery. Disclosure: reads explicitly configured Keychain items;
  operator commands can write items and remove a verified imported .env entry after
  confirmation. Compiles the included C helper locally with Apple developer tools;
  uses Security.framework and local macOS commands. Imports some private Hermes
  configuration helpers. See the README's catalog-rule-11 discussion.
maintainer: robbiemu
tier: community
category: general
requires_hermes: ">=0.23.0"
version: "0.1.0"
platforms:
  - macos
