name: applysent
title: ApplySent
repo: https://github.com/applysent/applysent-mcp
sha: b155702087dcff30bf7c82fb53ad48d49c132007
description: >-
  Job search and job applications through ApplySent's hosted MCP server (Streamable HTTP, OAuth 2.1
  with dynamic client registration and PKCE): search jobs that fit the user's résumé, tailor the
  résumé per job, answer the employer's screening questions from the user's profile, and apply on
  the employer's own form (Greenhouse, Lever, Ashby, Workday and other ATS), one job at a time.
  Ships a skill that tells the agent to preview every application and get the user's yes before
  sending it. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/applysent/SKILL.md),
  configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to
  ApplySent's MCP server at applysent.com, signed in as the user through ApplySent's OAuth sign-in,
  and counts against that account's ApplySent plan. Tool results (job listings, the user's profile
  and résumé text) enter the session context and so reach the user's model provider. Write-capable
  tools: profile and résumé edits, saved searches, and apply_to_job, which submits a real job
  application to an employer under the user's name; the server only accepts it with a single-use
  confirmation token returned by preview_application for that one job. Hermes stores and refreshes
  the OAuth tokens. The tool list comes from ApplySent's server at run time, so the pinned commit
  doesn't cover it. OAuth must be enabled with
  `hermes mcp add applysent --url https://applysent.com/api/mcp --auth oauth --connect-timeout 300`;
  the bundled mcp.json alone yields 401.
maintainer: ApplySent
