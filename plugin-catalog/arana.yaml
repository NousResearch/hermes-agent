description: "Read-only internet research for agents. The portable package ships a skill for the installed Arana CLI (14 channels, 40 read-only actions) and a local stdio MCP server with four public web tools: list_capabilities, read_url, read_many and search. Disclosure — the MCP server is the separately installed Arana CLI (`arana mcp` on PATH), which the plugin does not bundle or download and which is not covered by the pinned sha; install the official GitHub release and verify its SHA-256 sidecar first. Pages you read are fetched through r.jina.ai and searches run through Exa's public MCP endpoint (mcp.exa.ai), so the URLs and queries you send go to those services; send only public URLs and queries. The public MCP tools need no login, credentials, browser profile, install, update or write action. The standalone CLI also has login workflows, optional tool installs (`arana update`) and browser-assisted actions outside the MCP allowlist, used only on explicit operator direction through Hermes' terminal. No telemetry. The plugin does not update itself."
