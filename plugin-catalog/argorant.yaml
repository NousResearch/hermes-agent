description: "Argorant through its hosted MCP server (Streamable HTTP at https://mcp.argorant.com/mcp, OAuth sign-in with the user's Argorant account, no keys in config): find B2B leads by job, industry, company and place, with free counts and masked previews; reveal or export checked work emails; save lists; check email lists the user already has; write, test and launch cold email campaigns from the user's own mailboxes; and read, label and answer replies. Bundles the argorant workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: every tool call goes to Argorant's hosted server (mcp.argorant.com) and acts on the user's Argorant account; the tool set is served by that server at runtime and is not covered by the pinned sha. Sign-in runs the pinned mcp-remote@0.1.49 through npx (Node.js 20.18.1+ and npm required), which opens a browser and a local callback port on first use and stores OAuth tokens under ~/.mcp-auth. Revealing, exporting, finding emails, checking email lists and adding people to a campaign spend the user's Argorant credits; launching a campaign and answering a reply send real email from the user's connected mailboxes; buying credits or ordering mailboxes can charge the card saved in the workspace after the user's yes. The package marks the server untrusted, so Hermes asks before every tool the server does not mark read-only and refuses them in unattended runs."
