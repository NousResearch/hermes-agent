name: argos
title: ARGOS (Godot editor)
repo: https://github.com/Tormen28/argos
sha: 5dec794291b7636f77298ae3174700042668586b
version: "1.2.0"
description: >-
  Lets Hermes agents drive a live Godot 4 editor through a local MCP server
  with trust=untrusted: read the scene tree, create / move / delete nodes,
  undo-grouped action.batch, AnimationPlayer/AnimationTree play/stop,
  set properties with the editor's real undo/redo, open / save / create scenes,
  play and stop the game, validate GDScript with --check-only, and capture PNG
  screenshots (named sessions under .argos/captures/). Launch / check / play
  require ARGOS_PROJECT allowlist. Agent Plugins v1 package (plugin.json +
  mcp.json + skills/). Disclosure - the Godot addon opens a WebSocket on
  127.0.0.1 only (ports 9080-9090) guarded by a CSPRNG token rotated each
  editor start and stored in <project>/.argos/; writes state, history and
  screenshots under <project>/.argos/ (captures only under .argos/captures or
  res://; no abs/..; no overwrite) and to requested PNG paths; runs shell
  commands (launches the Godot editor, godot --check-only, plays scenes, which
  executes the target project's own GDScript - use on trusted projects);
  argos_raw forwards any ARGOS action; needs a Python with websockets; no
  third-party network calls, no credentials, no telemetry, no self-update.
  Complements godot-studio (headless check/export) by covering live editor edits.
maintainer: Tormen28
tier: community
