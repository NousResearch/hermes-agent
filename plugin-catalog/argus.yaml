name: argus
repo: https://github.com/albertodvp/argus
sha: cca0fbc7343ab91dd2b42ad22c7171d2f8fbf1b7
subdir: argus
description: "Reads a Hermes agent by intents instead of sessions and reviews what it learns: links each skill edit to the goal that produced it, flags edits applied without evidence and proposes rules backed by several intents, each kept or rejected by a person and applied through Hermes. Disclosure — derive passes send turn text, tool-call and tool-result excerpts, skill diffs and SKILL.md to the auxiliary.argus model; reads every profile's state.db, curator ledger, blobs and SKILL.md read-only (skill directories from Hermes' skill_search_dirs; config.yaml is not parsed); starts detached `hermes argus derive` passes when the agent is idle; writes skills only on an explicit apply, through rollback_entry or skill_manage as actor user; no credentials, no telemetry."
maintainer: albertodvp
tier: community
category: general
requires_hermes: ">=0.22.5"
docs_url: https://github.com/albertodvp/argus#readme
version: "0.1.1"
platforms: [linux, macos]
readme: true
