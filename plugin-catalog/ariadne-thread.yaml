title: "Ariadne's Thread"
description: "n8n-style flows for Hermes Desktop: each cron job, webhook route and skill drawn as a chain of steps, with the scheduler's true cron status, run output, delivery targets and a health bar, plus in-place editing with history and undo. Desktop page plus a dashboard API router; no tools, hooks, middleware or env vars. Disclosure — reads cron/jobs.json, cron/output/<job id>/, webhook_subscriptions.json, every SKILL.md under skills/ and skills.external_dirs, config.yaml (external_dirs only), a script in scripts/ when opened, profiles/ folder names and the gateway channel directory; resolving delivery targets runs Hermes' scheduler code, which reads <PLATFORM>_HOME_CHANNEL values (inside another profile's secret scope when that profile is picked); webhook secrets are never sent to the UI. Writes only on Save, in the active profile only: SKILL.md (atomic, inside skills/ only), files in scripts/, a cron's prompt and deliver through cron.jobs, a webhook prompt through Hermes' webhook store (secret kept); each save first stores the replaced text under plugin-data/ariadne-thread/history (0600, newest 10 per target) and is refused if the file changed since it was opened. Ask agent only drafts a new chat; nothing runs until you send it. No cron runs, no shell commands, no processes, no network beyond the local Hermes backend, no credentials, no telemetry, no self-update. Uses private Hermes core imports (cron.jobs, cron.scheduler_delivery, gateway.channel_directory, hermes_cli.webhook, hermes_cli.web_server_profiles), listed in docs/risk-audit.md."
