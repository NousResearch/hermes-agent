known_issues:
  - Full-owner browser authority, not chat-only or independently device-revocable access.
  - Requires operator-configured Hermes Bot Mode, Web Access, HTTPS/WSS and correct sign-in callback/origin settings for remote use.
  - Windows local admission/hosting verified; remote OAuth, physical-browser accessibility and canonical model/history continuity are not certified by those checks.
  - Uploads, real profile portraits, Rooms navigation, production Stop and PWA/offline support are not implemented.
  - The previous artemis-owner-proof identity is a separate installation; follow the documented disable/remove-old and enable-new migration. No automatic rename or old-route redirect.
