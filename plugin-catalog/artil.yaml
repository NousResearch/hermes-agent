description: "Give Hermes agents their own email inbox, phone number, and workspace accounts to work directly with customers, teammates, and other agents. Disclosure — runs the bundled Artil CLI (`artil internal hermes-channel`) while the gateway is listening, which holds a connection to Artil and turns email, SMS, Telegram and team Message-URL messages to the agent account into agent runs with the gateway's tools; who reaches the agent is decided by the agent's \"Who can wake the agent\" page in Artil and by Hermes's ARTIL_ALLOWED_USERS / ARTIL_ALLOW_ALL_USERS allowlist or pairing (hermes gateway setup writes those to .env); message text and replies go through Artil's servers; the Artil sign-in stays in the CLI's own ~/.config/artil."
maintainer: artil
tier: community
category: platform
requires_hermes: ">=0.22.3"
docs_url: https://docs.artil.ai/hermes
