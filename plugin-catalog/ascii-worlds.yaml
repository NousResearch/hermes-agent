known_issues:
  - The author reviewed the 1.4.0 release candidates on macOS with Hermes Desktop (a general test; Desktop version and per-scene results were not recorded). The screenshots are browser captures of the plugin's own preview and settings page.
  - Fine glyph density at full speed, high counts, Depth and the optional whole-window layer use noticeable CPU. Battery saver and a bolder density turn the cost down.
  - 1.4.0 replaces the separate Background strength and Scene strength sliders with one Background opacity slider. The previous scene's old strength is folded in once, so some custom looks may change slightly.
  - Light-theme Cat and Owl faces, pale seeds, fish and swallows, and quiet halos or stars are lower-contrast. The whale deliberately leaves the frame for a while.
  - The pastry cat is unofficial fan art of Nyan Cat (created by Chris Torres) and is not covered by the plugin's MIT licence; see THIRD_PARTY_NOTICES.md.
