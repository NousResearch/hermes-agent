known_issues:
  - The author hand-tested the full 1.2.0 plugin on a Mac with Hermes Desktop and reports that everything worked (a general test; no Desktop version or per-scene results were recorded). This Whole-window-only catalog build is the same plugin without its second placement option; it was covered by automated tests, browser captures and the Hermes validator, not hand-tested. The screenshots are browser mock-host captures, not Mac screenshots. Windows and Linux are untested.
  - Fine glyph density at full speed, high counts and the optional whole-window layer use noticeable CPU. Battery saver and a bolder density turn the cost down.
  - Light-theme Cat and Owl faces, pale seeds, fish and swallows, and quiet halos or stars are lower-contrast. The whale deliberately leaves the frame for a while.
