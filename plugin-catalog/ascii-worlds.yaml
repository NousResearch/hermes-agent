title: ASCII Worlds
description: >-
  Thirty-seven quiet habitats drawn live in text glyphs for Hermes Desktop: koi, jellyfish,
  mantas, sea turtles, seahorses, a fish school, a whale, an octopus, hammerheads circling a
  bait ball, an anglerfish, butterflies, luna moths, dragonflies, swallows, a sleeping cat,
  axolotls, an owl, falling leaves and petals, fireflies, bubbles, dandelion seeds and a night
  sky with the real moon phase, plus pipes and thirteen character scenes: a platypus,
  capybara, penguins, rubber ducks, a pastry cat, a dinosaur runner, a dragon, bees, a wizard,
  arcade cabinets, a self-playing snake, a pirate ship and a rooftop ninja. Choose a habitat
  and its controls in Settings -> Plugins -> ASCII Worlds, and optionally let it animate across
  the whole window. Desktop-only (desktop/plugin.js inside the plugin SDK surface); no agent
  tools, hooks, middleware, env vars or network access.
