known_issues:
  - The author hand-tested the 1.3.0 builds on macOS with Hermes Desktop. The screenshots are browser captures of the plugin's own preview and settings page.
  - Fine glyph density at full speed, high counts, Depth and the optional whole-window layer use noticeable CPU. Battery saver and a bolder density turn the cost down.
  - Light-theme Cat and Owl faces, pale seeds, fish and swallows, and quiet halos or stars are lower-contrast. The whale deliberately leaves the frame for a while.
