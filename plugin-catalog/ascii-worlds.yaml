title: ASCII Worlds
description: >-
  Koi and jellyfish drawn live in text glyphs for Hermes Desktop. Choose how many and
  their colours in Settings -> Plugins -> ASCII Worlds, and optionally let them swim
  across the whole window. Desktop-only (desktop/plugin.js inside the plugin SDK
  surface); no agent tools, hooks, middleware, env vars or network access.
maintainer: dudicslevente
tier: community
category: desktop
requires_hermes: ">=0.21.6"
