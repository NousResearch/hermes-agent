title: ASCII Worlds
description: >-
  Twenty quiet habitats drawn live in text glyphs for Hermes Desktop: koi, jellyfish,
  mantas, sea turtles, seahorses, a fish school, a whale, an octopus, butterflies, luna
  moths, dragonflies, swallows, a sleeping cat, an owl, falling leaves and petals,
  fireflies, bubbles, dandelion seeds and a night sky. Choose a habitat and its controls
  in Settings -> Plugins -> ASCII Worlds, and optionally let it animate across the whole
  window. Desktop-only (desktop/plugin.js inside the plugin SDK surface); no agent tools,
  hooks, middleware, env vars or network access.
maintainer: dudicslevente
