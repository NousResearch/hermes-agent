known_issues:
  - Hand-tested on Hermes Desktop 0.22.6 on macOS only; Windows and Linux are untested.
  - Fine glyph density at full speed, especially with several jellyfish, uses noticeable CPU. Battery saver and a bolder density turn the cost down.
