description: "ASIN-HHC Proof of Pay: third-party verification for agent work — validate asin-hhc:receipt evidence receipts against the published schema, verify artifacts against a hash-chained public provenance index, and read the live HHC work-market board (open bounties, settlements with splits). Read-only. Disclosure — fetches the ASIN-HHC provenance index and live board snapshot over https from the configured base_url (default dbottrader.github.io, the author's GitHub Pages site), and fetches a receipt from a model-supplied receipt_url only when it is an https URL whose host resolves to public addresses only; read-only, no keys."
maintainer: dbottrader
tier: community
category: tools
requires_hermes: ">=0.19"
version: "0.1.0"
capabilities:
  provides_tools: [asin_hhc_verify_receipt, asin_hhc_check_provenance, asin_hhc_board]
  provides_hooks: []
  provides_middleware: []
  requires_env: []
