name: asin
title: Asin
repo: https://github.com/asindotdev/hermes-plugin-asin
sha: f9f8493400c7cbe47b43071a38c6f2011d5fa033
version: "1.1.0"
description: "Amazon prices for Hermes through the Asin API: search 11 Amazon stores, read a product's price history and seller offers, and keep a watchlist that checks prices on a schedule and emails on drops. Disclosure — sends the tool arguments to www.asin.dev with your ASIN_API_KEY. Searching, price history, known offers and the watchlist are free; a live offers read and each price check of a tracked product use 1 Asin credit (stated in each tool description). asin_track_product, asin_update_tracking, asin_check_now and asin_stop_tracking change your Asin watchlist, and Asin emails the account owner on price alerts; asin_stop_tracking removes a tracked product and its price history from your ASIN watchlist without a Hermes approval prompt. Reads the key only through Hermes's secret scope. Registers 11 tools, no hooks or middleware, writes no files, starts no processes, has no telemetry or self-updater, and uses only the Python standard library."
maintainer: asindotdev
tier: community
category: tools
requires_hermes: ">=0.21.6"
docs_url: https://github.com/asindotdev/hermes-plugin-asin#readme
readme: true
platforms: []
capabilities:
  provides_tools:
    - asin_search_amazon
    - asin_price_history
    - asin_get_offers
    - asin_read_offers
    - asin_track_product
    - asin_list_tracked
    - asin_tracked_product
    - asin_update_tracking
    - asin_check_now
    - asin_stop_tracking
    - asin_account
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - ASIN_API_KEY
