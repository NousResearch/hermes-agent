tier: community
category: tools
title: Asset Curator
version: "0.2.0"
requires_hermes: ">=0.23.1"
readme: true
# Windows was actually exercised. Extend only after equivalent platform checks.
platforms: [windows]
screenshots: []
known_issues:
  - "Explicit one-time Node >=20.18.1/npm dependency setup; no launch-time install."
  - "Browser assistance needs an installed Chrome/Edge and saved consent."
