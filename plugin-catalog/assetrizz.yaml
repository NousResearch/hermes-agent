description: >-
  Skill id assetrizz:assetrizz-composer. Search the assetrizz 2D game-asset
  catalog (FTS over slugs, tags, descriptions, styles, and categories) and
  compose scenes from those assets. Tools: assetrizz_search and assetrizz_scene.
  assetrizz_scene op=compose compiles a compact signed spec into a scene
  (four gameplay templates, and layer lint for collisions, HUD/playfield
  overlap, and off-canvas). This plugin repo is about 16 MB including a 15 MB
  SHA-256-pinned, scannable JSONL catalog (db/assets.jsonl). On first search
  the plugin builds a lean SQLite + FTS5 index in the plugin data directory.
  The 14,641 PNGs (about 1.65 GB, 23 style packs) live in
  https://github.com/mojomast/assetrizz and are not copied into the plugins
  folder. Asset mode is one of on_demand (default: fetch a single PNG from
  GitHub raw when you place, render, or preview it), local (you download the
  full library or chosen style packs once into a directory you pick), or
  offline (local files only, no network). Bulk library downloads are
  user-initiated only — use the Download library button in the Desktop pane
  (size estimate, progress, cancel) or python -m assetrizz_plugin.cli; they
  are not a model tool. Fetches go only to
  raw.githubusercontent.com/mojomast/assetrizz/v0.1.0/assets/… (library tag
  v0.1.0, commit 05339c228f55ac95ad21b5c947db0c6e36207cd4), use the Hermes
  SSRF guard, cap size, and verify SHA-256 from the catalog. Optional
  library_path still prefers a complete library checkout when you have one.
  Rendered scenes write PNG and JSON under the plugin data directory and, if
  you set it, the Export directory (must not be a filesystem root; never
  chosen by a tool argument). No credentials, no subprocesses. Hermes
  Desktop 0.23 or newer can show a dark compose pane that live-previews the
  current scene through ctx.rest and lets you install or remove a local
  library (deletion needs confirmation). The two tools still run when that
  pane is unavailable.
