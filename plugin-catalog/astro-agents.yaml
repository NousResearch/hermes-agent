description: "Verifiable planetary timing data for market analysis and backtesting through the Astro Agents MCP server (Streamable HTTP at https://astro-agent.dev/mcp, no sign-in, no keys in config): geocentric and heliocentric positions, declination, Gann planetary lines and a to-the-minute event calendar (ingresses, stations, eclipses), plus full Western and Vedic astrology (birth chart, transits, synastry, kundli D1-D60, dashas, doshas, KP, yogas, panchang, Gun Milan), computed from the NASA/JPL DE440 ephemeris with no LLM; every result carries a SHA-256 hash. Data for your own analysis, never a trading signal or forecast. Bundles the astrology skill (when to call which tool, input conventions). Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local code; every tool call sends the birth date, time and coordinates it is given to astro-agent.dev, and the tool set is served by that server at runtime, not covered by the pinned sha. Each client gets 1 free call, on the six $0.01-0.02 tools only; every premium and finance tool is always paid and returns REST payment instructions (x402 or MPP); nothing is charged over MCP and the package holds no wallet or key."
