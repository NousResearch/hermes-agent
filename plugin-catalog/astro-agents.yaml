description: "Verifiable planetary timing data for market analysis and backtesting through the Astro Agents MCP server (24 tools, Streamable HTTP at https://astro-agent.dev/mcp, no sign-in, no keys in config): geocentric and heliocentric positions, declination, Gann planetary lines, a to-the-minute event calendar (ingresses, stations, eclipses), sky analogues and crypto token launch charts and synastry, plus full Western and Vedic astrology (birth chart, transits, synastry, kundli D1-D60, dashas, doshas, KP, yogas, panchang, Gun Milan), computed from the NASA/JPL DE440 ephemeris with no LLM; every result carries a SHA-256 hash. Data for your own analysis, never a trading signal or forecast. Bundles the astrology skill (when to call which tool, input conventions). Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local code; every tool call sends the dates, times and coordinates it is given to astro-agent.dev, and the tool set is served by that server at runtime, not covered by the pinned sha. 1 free call per client on the $0.01-0.02 routes only (REST, MCP or A2A); every other route, finance included, is always paid. Over MCP a paid tool returns a standard x402 offer (USDC on Base or Solana) and is paid per call only if the user's own x402 MCP client signs it, or with prepaid credits when the user sets an X-Credits-Token header; the package holds no wallet, key or token."
