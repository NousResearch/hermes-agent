sha: 74a6c4171b8d5701012c28baf738fae7ce508d8a
version: "1.1.0"
description: "Sidecar by Atlas Omnia — your Hermes agent in desktop Excel for Mac. The plugin runs an HTTPS localhost bridge on ports 47640-47644, exposing 28 sidecar_excel_* tools and opt-in workbook plans. Manual CA trust and one sidebar Allow are required. Allowing lets the configured site use your Hermes agent and all its tools until revoke; use a site you control or trust and open only documents you trust. API_SERVER_KEY is read through Hermes, never sent to the sidebar or stored by the plugin; TLS private keys are owner-only. For TLS it can only vouch for localhost. The trust command does not limit the certificate to TLS, so protect the key file and remove the trust when you stop using Sidecar. Latest live run: 2026-11-11 about 00:26 in desktop Excel for Mac, plugin and sidebar built from a7b3fd7. Connect, Allow, a 3-row table with header in A1:B4 and =SUM(B2:B4) in B5 read back from the workbook; revoke dropped the sidebar to needs your OK. The bridge answered 200 to the configured origin and 403 to another origin. The sidebar used a private test site via addin_base, with CA trust in the login keychain; this Mac also has it in the System keychain. Earlier the same night at 35ef09e (behaviour unchanged since): reversal on request by clearing the range (no real undo), plugin reload with the sidebar open (it reconnected by itself and edited again), approval remembered after restarting Excel, next Connect after revoke asked for approval again. Not tested: Windows desktop Excel, dark theme, keyboard-only use, public Pages origin, TLS-only trust or all workbook tools/plans. Reopen the sidebar if it does not reconnect. The Excel test Mac also has System-keychain trust; that was not required in our Word and PowerPoint runs, which used login-keychain trust only. By default the plugin serves its bundled sidebar from the same HTTPS bridge at https://localhost:<actual-port>/sidecar-excel/; GitHub Pages or self-hosting is not required. A custom HTTPS site remains available through addin_base. Office.js loads from Microsoft. Hermes may send chat/workbook data to the configured provider. CLI approval/status never starts a listener. Remove matching CA trust manually before deleting the plugin tls directory; uninstall/revoke does not remove OS trust. No telemetry or self-updater. Apache-2.0; LICENSE and NOTICE included. No Microsoft or Nous Research endorsement. Disclosure — While the gateway runs, this plugin keeps an HTTPS listener on 127.0.0.1:47640-47644 and asks you to trust, by hand, a per-install root CA in your macOS login keychain. The CA can only vouch for localhost in TLS, but the trust command does not limit it to TLS, so protect its key file in the plugin's data folder and remove the trust when you stop using Sidecar. After you click Allow in Hermes, the sidebar site (by default the plugin's own localhost page) can run your full Hermes agent with all its tools through your API server until `/sidecar-excel revoke`. Workbook content goes to your configured model provider, and an opened workbook can inject instructions, so open only documents you trust. Dangerous-command approvals cannot be answered from the sidebar and time out as denied. Office.js loads from Microsoft. Uninstalling does not remove OS trust."
maintainer: AtlasOmnia
tier: community
category: tools
requires_hermes: ">=0.23.0"
readme: true
platforms: [macos]  # Windows desktop Excel untested
known_issues:
  - "The plugin-served localhost sidebar (1.1.0 default) is live-tested in desktop Word for Mac at 74a6c41; the identical bridge change is covered by Excel's automated suite but has not yet been live-tested in Excel."
  - "Live-tested only for the limited desktop Excel for Mac flow in the README; reload with an open sidebar reconnected and edited again. Windows desktop Excel is untested."
  - "The sidebar must reach https://localhost with the per-install local CA manually trusted; network restrictions or missing trust leave the sidebar on 'Hermes is not reachable'."
  - "The optional public GitHub Pages override has not been live-tested; hosting is not required for the bundled localhost default. TLS-only trust (-p ssl) and a server-auth EKU on the CA are planned hardening."
