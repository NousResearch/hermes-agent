    - sidecar_excel_format_range
    - sidecar_excel_conditional_format_range
    - sidecar_excel_freeze_panes
    - sidecar_excel_set_data_validation
    - sidecar_excel_create_sheet
    - sidecar_excel_delete_sheet
    - sidecar_excel_activate_sheet
    - sidecar_excel_insert_table
    - sidecar_excel_sort_table
    - sidecar_excel_filter_table
    - sidecar_excel_create_chart
    - sidecar_excel_find_replace
    - sidecar_excel_clear_range
    - sidecar_excel_autofill_formula
    - sidecar_excel_rename_sheet
    - sidecar_excel_copy_sheet
    - sidecar_excel_protect_sheet
    - sidecar_excel_unprotect_sheet
    - sidecar_excel_create_pivot_table
    - sidecar_excel_run_calculation
