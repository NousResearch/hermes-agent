name: atlas-sidecar-word
title: "Sidecar for Word"
repo: https://github.com/AtlasOmnia/sidecar
subdir: word/plugins/atlas-sidecar-word
docs_url: https://github.com/AtlasOmnia/sidecar/tree/74a6c4171b8d5701012c28baf738fae7ce508d8a/word#readme
sha: 74a6c4171b8d5701012c28baf738fae7ce508d8a
version: "1.2.0"
description: "Sidecar by Atlas Omnia — Your Hermes agent, in the sidebar of Microsoft Excel, Word, and PowerPoint. Sidecar puts your Hermes agent in a side panel next to the file you're working on. Ask it to draft, edit, analyze, or build without leaving your document, spreadsheet, or deck. In desktop Word for Mac it reads the document and selection, inserts and replaces text, applies exact-match edit plans, formatting, styles and comments. After one manual local-CA trust step and pane approval, the agent may read and write the bound document; this is not per-edit approval. No API keys stored by the plugin; TLS private keys are protected in plugin data. Your agent: it runs on your own Hermes setup, with the models and tools you already use. Setup: install the plugin, enable the Hermes API server, manually trust the per-install local CA using the printed user-scope command, run /sidecar-word manifest (or hermes sidecar-word manifest) to create and sideload a manifest for the plugin-served localhost sidebar, click Connect to Hermes and allow it in Hermes with /sidecar-word. GitHub Pages or self-hosting is not required by default; a self-hosted HTTPS site may still be selected through addin_base. Disclosure — runs an HTTPS listener at https://localhost:47630-47634 bound to IPv4 127.0.0.1 (first free port) inside the process that runs the Hermes gateway (or plugin host) from when the gateway loads the plugin (setting autostart, default on; off: from the first /sidecar-word or sidecar_word_* call) until Hermes exits; it accepts only the sidebar site's exact origin (plugin setting addin_base) and exactly one Host localhost:<actual-port>. A per-install CA and localhost certificate are generated in plugin-data/atlas-sidecar-word/tls/; private keys are owner-only, never logged. For TLS it can only vouch for localhost. The trust command does not limit the certificate to TLS, so protect the key file and remove the trust when you stop using Sidecar. TLS name constraints permit DNS localhost subtree and IP 127.0.0.1/32; no IPv6; CA validity is at most 825 days, leaf at most 397. Legacy unconstrained CAs refuse service: manually remove old trust before deleting the TLS directory and restarting. Protect its CA key and remove OS trust manually on uninstall. Requires cryptography>=43. A sidebar gets a session only after the user allows it in Hermes (/sidecar-word, or hermes sidecar-word allow); the approval is remembered as a SHA-256 hash of a per-sidebar grant in plugin-data/atlas-sidecar-word/approvals.json (owner-only) and revoked with /sidecar-word revoke. No Sidecar tool can approve; an agent with shell access could run the approval CLI subject to Hermes command approval. Allowing lets the whole configured origin use your Hermes agent and all its tools until revoke. Use a site you control or trust; open only documents you trust. Forwards the sidebar's chat requests to the user's Hermes API server on loopback (setting api_server_url, default http://127.0.0.1:8642) with API_SERVER_KEY (requires_env, secret) read through agent.secret_scope.get_secret, kept in memory only, never written, logged or sent to the sidebar. The sidebar page is bundled with the plugin and served at https://localhost:47630/sidecar-word/ (actual bound port in 47630-47634); it loads Office.js from appsforoffice.microsoft.com and sends document data only to the verified HTTPS localhost bridge. GitHub Pages or other hosting is not required; a self-hosted HTTPS site can still be selected through addin_base. A reproducible build (npm run build:sidebar) writes SHA256SUMS. Pane approval authorizes all known tools, including new content and formatting, only for a valid bound session with active approval. Unknown tools, invalid or missing sessions and revoked approvals fail closed. No comment-per-turn guard is claimed without a trustworthy turn id; tool calls from another Hermes chat than the sidebar's are refused. No other network calls, no shell commands, no telemetry, no self-updater. Same author as Workbench (hermes-office-desktop, Office for the web in Hermes Desktop); separate lineage (desktop Office sidebar), distinct sidecar_word_ tool names and ports, installable together. Sidecar is developed by Atlas Omnia. It is not affiliated with or endorsed by Microsoft or Nous Research. Microsoft, Excel, Word, and PowerPoint are trademarks of the Microsoft group of companies."
maintainer: AtlasOmnia
tier: community
category: tools
requires_hermes: ">=0.23.0"
readme: true
platforms: [macos]  # Windows desktop Word untested
known_issues:
  - "Live-tested 2026-11-11 about 19:40 in desktop Word for Mac at 74a6c41 with the plugin-served localhost sidebar (no external hosting): Connect, Allow, and a prompt that wrote a heading and a sentence into a new document."
  - "After updating or reloading the plugin, reopen the sidebar if it does not reconnect. Sidecar provides no real undo tool: use native Office Undo, verified for a supported short edit only. Asking Hermes to reverse an edit edits again."
  - "Trust the per-install local CA once using the printed login-keychain command. Remove it in Keychain Access > login > Certificates > Sidecar for Word local CA … > Delete (older installs: Sidecar local CA …), then delete the plugin tls folder."
  - "Historical pre-repair failure, superseded by accepted d4d0de9 repair: tested live in desktop Word for Mac on 2026-11-11 at about 00:29, with the plugin and sidebar built from 7eaf1fc. Connect and Allow worked. The prompt “Write the line Quarterly Summary as a Heading 1, then one short paragraph about fruit prices” wrote both paragraphs, which were read back from the document, but the first line ended as Normal, not Heading 1. OOXML merged the heading/body before an apply_edit_plan search failed with SearchStringInvalidOrTooLong on a retained 312-character ASCII find. Later recovery restored separate text paragraphs, but final style readback was Normal; the precise style-loss operation is unisolated. Revoke dropped the sidebar to “needs your OK”. Earlier the same night at 2387154 (historical run): heading text and a bulleted list written with readback; Heading 1 style applied when asked; reversal on request removed the text but left empty paragraphs (no real undo). Plugin reload with the sidebar open reconnected by itself; approval was remembered after restarting Word; the next Connect after revoke asked for approval again. The sidebar was served from a private test site via addin_base; the CA was trusted in the login keychain only. Windows desktop Word is not tested. Dark theme, keyboard-only use, Word for the web, the public GitHub Pages origin, and TLS-only trust are not tested."
  - "Retained evidence identifies the failed search as 312 ASCII characters, beyond Word’s 255-character search bound. OOXML had already merged the heading/body before that failure; final Heading 1 was Normal, but the exact operation losing style remains unisolated. Accepted d4d0de9 repair passed 429 JavaScript and 213 Python tests and bounded native Word 16.114.4/macOS 27.2 tests for heading/body styles, targeted repair, search boundaries, short-edit native Office Undo and revoke. Picture-only paragraph sharing, arbitrary rich formatting, fields/content controls and comprehensive native Unicode/5000-character replacement remain unqualified. The repaired bounds are: source and encoded queries are capped at 255 UTF-16 units, replacement capacity stays 5000, actual styles are read back, and failed searches must stop destructive recovery. Guidance is not a hard execution fence; use native Office Undo for recovery after uncertain mutations."
  - "Two internal error messages still say Hermes for Word."
  - "The sidebar must reach https://localhost from its HTTPS page with the local CA manually trusted for the current user. Local network policies may still block it; backend TLS tests are not live Office acceptance."
  - "The installer can override addin_base. The public default is https://atlasomnia.github.io/sidecar-word/; first public-origin live test is at publication. Planned hardening: TLS-only trust (-p ssl) and a server-auth EKU on the CA."
capabilities:
  provides_tools:
    - sidecar_word_get_document_overview
    - sidecar_word_read_selection
    - sidecar_word_read_document_text
    - sidecar_word_apply_edit_plan
    - sidecar_word_insert_text
    - sidecar_word_replace_selection
    - sidecar_word_find_replace
    - sidecar_word_format_selection
    - sidecar_word_get_document_structure
    - sidecar_word_apply_style
    - sidecar_word_insert_ooxml
    - sidecar_word_insert_comment
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - API_SERVER_KEY
