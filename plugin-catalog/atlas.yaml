platforms: [linux]
known_issues:
  - "All 43 scenes in docs/tutorial/a-week-with-atlas.md pass one by one, each from a prepared state. The single chained replay of the whole week from an empty home passes 27 of them so far."
  - "Proved with a stub model and a stub `hermes send` against real Hermes v0.23.0. Not yet exercised with a real model's answers or live Telegram delivery."
  - "`hermes atlas status` is registered and not built; it exits with an error."
