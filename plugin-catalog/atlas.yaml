title: Atlas
description: "Keeps your Pursuits current across your AI Harnesses (Claude Code, Codex, Devin, Hermes, and Sessions run through T3 Code) and sends you a daily brief with the next Step for each. Disclosure — reads, never writes, the Session stores of those tools under your home folder, and reads through a Harness folder that is a link; copies their transcripts verbatim into a local record folder (default ~/atlas, mode 0700), with detected secrets masked, best effort, in every derived file but not in the raw copies; sends Session text, detected secrets masked, to the model your Hermes is configured with, during `hermes atlas backfill` and then unattended on every tick (up to 20 Sessions per tick, one model call each, plus the Journal), which costs model calls; a model's answer can change what the record says about one Pursuit, so text inside a conversation can influence the next brief; claims messages addressed to Atlas in your Telegram home chat (the word atlas, a reply to a brief, a 10-minute window, /atlas), which then do not reach the Hermes agent, and answers there; sends the daily brief to that chat unprompted by running `hermes send`, and the brief and resume answers name this machine's host name, the folder and the git branch of each Step, which a group home chat shows to everyone in it; `hermes atlas setup` writes $HERMES_HOME/scripts/atlas_tick.sh and creates the `atlas-tick` Hermes cron job, which runs `hermes atlas tick` every 10 minutes; parks a Pursuit by itself, when it composes a daily brief, after it asked about that Pursuit twice and the latest ask went unanswered, and never ends one; serves a read and write API for its dashboard tab under /api/plugins/atlas/, behind the dashboard's own sign-in; deletes files in its own record folder when you tell it to forget a Session; records this machine's host name in the record; reads its own /proc/self/fd and /proc/self/maps to check which file SQLite opened. The agent tools and `hermes atlas mcp` are registered but not built at this pin. No telemetry, no network calls of its own, no stored credentials."
maintainer: zhaidarbek
tier: community
category: automation
