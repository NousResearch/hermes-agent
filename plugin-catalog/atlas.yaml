title: Atlas
description: "Keeps your Pursuits current across your AI Harnesses (Claude Code, Codex, Devin, Hermes, and Sessions run through T3 Code) and sends you a daily brief with the next Step for each. Disclosure — reads, never writes, the Session stores of those tools under your home folder, and reads through a Harness folder that is a link; copies their transcripts verbatim into a local record folder (default ~/atlas, mode 0700), with detected secrets masked, best effort, in every derived file but not in the raw copies; once you add ChatGPT or claude.ai, reads the export zips you drop in ~/atlas/inbox/ (in memory, capped, never group_chats.json), keeps their conversations verbatim the same way (claude.ai attachment text included), and deletes each zip after it imported every conversation in it, keeping one it cannot read; sends Session text, detected secrets masked, to the model your Hermes is configured with, during `hermes atlas backfill` and then unattended on every tick (up to 20 Sessions per tick, one model call each, plus the Journal, which a late Session such as an imported one makes it write again, and one call a day that adds to your Profile from that day's Steps, Journal lines and Session times, never transcript text), which costs model calls; a model's answer can change what the record says about one Pursuit, so text inside a conversation can influence the next brief; claims messages addressed to Atlas in your Telegram home chat (the word atlas, a reply to a brief or to the weekly Review, a 10-minute window, /atlas), which then do not reach the Hermes agent, and answers there; sends the daily brief to that chat unprompted by running `hermes send`, and the brief and resume answers name this machine's host name, the folder and the git branch of each Step (for a web chat, the conversation's title and day), which a group home chat shows to everyone in it; sends a second unprompted message, the weekly Review, once a week (Sunday 18:00 by default) to the same chat, also by running `hermes send`; it proposes Focus, ending and reopen changes and never changes a Pursuit by itself, and replies to it are claimed; `hermes atlas setup` writes $HERMES_HOME/scripts/atlas_tick.sh and creates the `atlas-tick` Hermes cron job, which runs `hermes atlas tick` every 10 minutes; parks a Pursuit by itself, when it composes a daily brief, after it asked about that Pursuit twice and the latest ask went unanswered, and never ends one; serves a read and write API for its dashboard tab under /api/plugins/atlas/, behind the dashboard's own sign-in; deletes files in its own record folder when you tell it to forget a Session; records this machine's host name in the record; reads its own /proc/self/fd and /proc/self/maps to check which file SQLite opened. Agent tools, in Hermes and over `hermes atlas mcp` (stdio, no network port), let an agent read Resume Notes and Journal days, leave Notes, and change a Resume Note only on your own typed message to Atlas in that Session (Claude Code bound through ~/.claude/sessions/<pid>.json and /proc/<pid>/stat, Codex through its call thread id): that message itself becomes one Decided line, and one Open question is removed only when the message, addressed to Atlas, states outright that it is settled and it is the only one; other changes, at most one decision and one question, are shown whole and wait until you reply apply; agent text is normalised to one line with its quotes and brackets replaced. No telemetry, no network calls of its own, no stored credentials."
maintainer: zhaidarbek
tier: community
category: automation
requires_hermes: ">=0.23.0"
docs_url: https://github.com/zhaidarbek/hermes-atlas#readme
