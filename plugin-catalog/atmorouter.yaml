description: "AtmoRouter — OpenAI-compatible gateway; one key for Claude, GPT, Gemini, GLM, Kimi, Qwen, DeepSeek, MiniMax and Grok models, with the /model picker fed by the live GET /v1/models catalog. Disclosure — sends your prompts, conversation history, tool definitions, tool results and ATMOROUTER_API_KEY to atmorouter.dev, which forwards each request to the infrastructure serving the chosen model; that infrastructure's processing location and retention vary per model and zero retention is not promised (AtmoRouter states its usage and billing records keep metadata rather than prompt or response content, and that it does not train on API request content; https://atmorouter.dev/privacy). Usage is billed per token from a prepaid AtmoRouter balance (QRIS, or USDT/USDC on Solana, BNB Chain or Polygon); prices vary by capacity offer and, with no saved budget, a request can route to any offer up to the highest advertised catalog tier, unless you set a minimum discount off official rates or exact rate caps under Budgets; failed upstream requests are not billed and the plugin itself makes no payments."
