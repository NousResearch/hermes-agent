description: "Gives a Hermes agent its own @atomicmail.ai address in one command, with no account or signup form (proof-of-work sign-up). Mail from the user's allowed addresses wakes the agent and its reply goes out in the same thread; every allowed sender's DKIM signature is checked first, so a forged From: cannot drive the agent. Tools read, search, send and reply, and schedule meetings with real calendar invitations (send, update, cancel, read RSVPs, answer invitations). Disclosure — network calls to Atomic Mail only (auth.atomicmail.ai for sign-up and sign-in, api.atomicmail.ai for JMAP: polling, reading, sending, invitations, and downloading each new allowed message for the DKIM check) plus DNS TXT lookups for DKIM keys (system resolver; when it returns nothing, DNS-over-HTTPS at cloudflare-dns.com, then dns.google; ATOMICMAIL_DNS_OVER_HTTPS=off disables that); a background polling task (every 20 s) while the gateway runs; Atomic Mail's anti-spam proof-of-work costs about 20-45 CPU-seconds per sign-in, roughly every 10 minutes while the gateway polls (a few percent of one core) and once per tool session otherwise; the inbox API key is stored in Hermes's .env through hermes_cli.config and read with the profile-scoped secret reader; seen-message ids in plugin-data/atomicmail/state.json; no telemetry."
maintainer: Atomic-Mail
tier: community
