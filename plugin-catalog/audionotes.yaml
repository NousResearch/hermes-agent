description: "Search and read your Audionotes voice notes, meeting transcripts and AI summaries through Audionotes' hosted MCP server (Streamable HTTP at https://api.audionotes.app/mcp, OAuth 2.1 with PKCE and dynamic client registration, scope notes:read, paid Audionotes account required). Four read-only tools (search_notes, list_notes, list_folders, get_note) plus the retrieve-notes skill, which tells the agent to cite the notes it used and to keep generated summaries apart from source transcripts. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — every tool call goes to Audionotes' hosted server (api.audionotes.app) and reads the signed-in user's own notes; the tool set is served by that server at runtime and is not covered by the pinned sha. Note titles, summaries and transcripts that match a request enter the session context and are sent to the user's model provider. The tools cannot create, edit, delete or share notes. Sign-in runs the pinned mcp-remote@0.1.49 through npx (Node.js 20.18.1+ and npm required), which opens a browser and a local callback port on first use and stores OAuth tokens under ~/.mcp-auth. The package marks the server untrusted; all four tools are annotated read-only."
