    - on_session_end
    - pre_tool_call
    - post_tool_call
    - pre_approval_request
    - post_approval_response
    - api_request_error
    - on_stream_start
    - on_stream_end
    - subagent_start
    - subagent_stop
  provides_middleware: []
  requires_env: []
