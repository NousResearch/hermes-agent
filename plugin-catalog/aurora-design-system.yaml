title: Aurora Design System
description: 'Two offline tools plus four skills that make a Hermes agent build real web UI with the Aurora CSS design system: aurora_search returns the family, the pack and the real markup of any of 2,223 documented objects from a bundled census; aurora_validate checks a page against that census (invented classes, packs used but not linked, gradients, !important, hand-written colours, duplicate headings, missing attribution) and returns failures and warnings in milliseconds. No network, no subprocess, no writes, no hooks.'
