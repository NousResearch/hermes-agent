name: auto-pin
repo: https://github.com/bmcfiv/hermes-plugin-auto-pin
sha: 4458088ccfe3b5371e16fdae37753956f1296713
description: "Automatically pin every new interactive session (desktop, CLI, TUI) and the branches you fork from them. Cron, one-shot, subagent and messaging sessions are left alone, and unpinning a session sticks. Disclosure — on each new desktop/CLI/TUI session it sets the session's pinned flag in Hermes's session database (state.db) through the shared SessionDB handle, and records each automatic pin in $HERMES_HOME/auto-pin/ledger.txt; no network, no tools."
maintainer: bmcfiv
tier: community
category: general
requires_hermes: ">=0.21.1"
docs_url: https://github.com/bmcfiv/hermes-plugin-auto-pin#readme
version: "1.0.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_start
  provides_middleware: []
  requires_env: []
