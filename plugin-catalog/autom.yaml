description: "Live Google Search results for the built-in web_search tool, through the Autom SERP API. Search only; pair it with an extract backend for web_extract. Disclosure — sends each search query to api.autom.dev with your AUTOM_API_KEY, and calls can use Autom credits. Reads the key only through Hermes's secret scope. Registers no tools, no hooks or middleware, writes no files, starts no processes, has no telemetry or self-updater, and uses only the Python standard library."
