description: >-
  Search your own files and configured chat/mail archives from Hermes with AutoRAG Lite.
  Local hybrid retrieval, file-name search, cited evidence and duplicate detection without
  editing original documents. Supports PDF, DOCX, PPTX, XLSX, Markdown and Korean HWP/HWPX;
  existing integrations include Slack, Discord, Telegram, WhatsApp, KakaoTalk, email,
  Notion and Obsidian. Bundles four skills and a Hermes Desktop Finder pane.
  Requires Node.js 24+; runs pinned @autorag/librarian@2.13.12 through npx stdio.
  The Desktop backend installs that same pinned package once in plugin data, with npm
  lifecycle scripts disabled. First refresh can provision minsync and jikji and download
  local embedding models (roughly 1.5 GB). Reads only configured folders and archives;
  writes its own index/report state. User-requested automation also writes rule/scripts
  and creates Hermes cron jobs. No telemetry, self-update or stored-login discovery.
  Search snippets read by Hermes reach its selected model provider; configured remote
  connectors or embedders use their selected services.
