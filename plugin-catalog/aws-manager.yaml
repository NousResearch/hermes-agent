name: aws-manager
title: AWS Manager
description: "Deploy, monitor, and verify AWS resources in Hermes Desktop, including EC2, Lambda, S3, DynamoDB, and API Gateway. Disclosure — uses the AWS access key you enter in plugin settings to create, change and delete real AWS resources (EC2, Lambda, S3, RDS, DynamoDB, API Gateway, VPC, Route 53, ECR/ECS, EventBridge, SQS, CloudFront) in your account from the dashboard; these can incur AWS charges. Every change is reviewed and applied by you in the UI, never by the agent."
