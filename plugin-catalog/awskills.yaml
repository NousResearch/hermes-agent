description: "About 100 portable skills for operating AI agents and the Aither/awdk toolchain: install the adk CLI and run an agent locally, find and install tool packs and skills, author and ship your own tool pack, use Aither from Hermes and other harnesses over skills, MCP and A2A, work safely in a shared git worktree, and debug agent failures. Portable Agent Plugins v1 package (plugin.json + skills/), skills only, no plugin code, no MCP server bundled. Disclosure - skills are instructions only, but some tell the agent to run local CLIs (adk, awnode) and fetch from github.com; nothing is sent to Aitherium unless the user runs those tools against Aitherium's hosted services."
