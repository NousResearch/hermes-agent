name: azure-mai-image
title: Microsoft Foundry MAI image generation
repo: https://github.com/joescars/hermes-mai-image
subdir: src/hermes_mai_image
sha: 1e0e4446ae56f805b3c268c6947215325d31768c
description: "Microsoft Foundry MAI text-to-image generation and image editing with up to five reference images as a Hermes image_gen provider (image_gen.provider: azure-mai). Maps Hermes aspect ratios onto MAI width/height presets and exposes the resource's own model list. Disclosure — sends your prompt, the optional source images and your MAI_FOUNDRY_API_KEY (read per request through Hermes secret scope for the active profile) over https to your own Azure AI Foundry resource; with the opt-in web_grounding option (MAI-Image-2.6, off by default) the service may send prompt-derived search queries to Bing; every generation bills your Foundry subscription with no Hermes approval prompt before spending. Results are downloaded into the Hermes image cache under $HERMES_HOME/cache/images/. No telemetry, shell commands, background processes, self-updates or extra Python dependencies beyond requests."
maintainer: joescars
tier: community
category: tools
requires_hermes: ">=0.21.6"
docs_url: https://github.com/joescars/hermes-mai-image#readme
version: "0.2.1"
readme: true
platforms: []
known_issues:
  - "The endpoint must be the Foundry *resource root* (for example https://your-resource.services.ai.azure.com); the provider appends /mai/v1 itself and rejects pasted /mai/v1 paths."
  - "Model discovery uses the resource's /models route, which not every Foundry resource exposes; when it is absent or empty the built-in MAI fallback catalog is used. Override the discovery path with MAI_FOUNDRY_MODELS_PATH."
  - "Editing accepts up to five JPEG/PNG source images (local paths or http(s) URLs); requests with more than five are rejected before any request is sent."
  - "Source images must be JPEG or PNG; GIF and WebP sources are rejected before upload with error_type invalid_input (no conversion is performed)."
  - "provider.py imports agent.file_safety.raise_if_read_blocked to vet local source-image paths. The manifest validator reports it as a private core import (catalog rule 9); it may need updating on a Hermes release."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - MAI_FOUNDRY_API_KEY
    - MAI_FOUNDRY_ENDPOINT
