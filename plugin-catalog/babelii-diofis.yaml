description: "Buy Indonesian digital products (pulsa, data vouchers and packages, PLN tokens, bill payments, e-wallet top-ups, game vouchers) plus physical goods, food, hotspot vouchers and services from other vendors, on Babelii, an Indonesian commerce platform, through its hosted commerce MCP server (Streamable HTTP at https://babelii.diofis.net/mcp/commerce/, no sign-in, no keys in config) plus two skills (a buying workflow and a signed-in account guide). Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only, no local code. Disclosure — hosted-only connector: every tool call goes to babelii.diofis.net, which receives the destination phone number or account identifier and the buyer name the user gives, to place the order; the plugin itself never contacts a payment provider, it hands the buyer a payment link that opens in the buyer's own browser. execute_purchase places a real order that becomes payable; agent orders are limited by the server (currently Rp25,000 per order and 3 per hour per identity). The package marks the server untrusted, so Hermes asks before every tool that is not annotated read-only (prepare_purchase, inquire_purchase, execute_purchase, renew_purchase) and refuses them where nobody can answer. No shell commands, no background processes, no files read outside the plugin, no stored credentials, no telemetry. Buyers with a Babelii account can point the same server key at https://babelii.diofis.net/mcp/account/ with OAuth sign-in (Hermes keeps the token, not the package) to pay from their balance by default or by payment link on request, and to read their own account (balance, ledger, top-ups, schedules, notifications; read only), or use a personal agent token from their account on a server without a browser; the package itself starts without sign-in and ships a second skill for that case. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
