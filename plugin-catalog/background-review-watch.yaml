name: background-review-watch
repo: https://github.com/vectorforge22/background-review-watch
sha: "75c6f45741021529e19f87bbf2803ea1b608aa5e"   # unreleased, 2026-10-19 (v0.5.0 renamed to background-review-watch + screenshots)
description: >-
  Status-bar chips for the background self-improvement review and batch
  context compaction: review running/done/stale with live elapsed time, a
  turn-countdown fill bar to the next nudge, an always-visible compaction chip
  (compacting/done/failed/stale with committed reduction or failure class),
  reply-guard recovery and review-overlap diagnostics, and a Settings page that
  tunes both orphan ceilings. Disclosure — renderer-only; polls filtered
  read-only tails of agent.log via host.logs to parse lifecycle markers;
  listens for review.summary/message.start/message.complete events; stores
  three small plugin-storage records (settings + last compaction + last
  review); no network calls beyond the local gateway, no credential access, no
  self-update.
