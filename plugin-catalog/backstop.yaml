name: backstop
repo: https://github.com/themahis/hermes-backstop
sha: 8e086334d379b6e25b4811577a7d33e9d5d93142
description: >-
  A build or test that fails in your own PowerShell, bash or zsh gets a read-only
  Hermes diagnosis (cause, quoted evidence, file:line, fix) that opens in Hermes Desktop;
  Fix it drafts the change into a normal chat you send yourself, and the next passing run
  closes the incident.
  Disclosure — each failure automatically starts one diagnosis session on your configured
  model (output tail redacted, command, cwd, project excerpts); reads project files and
  their size/mtime, never dot-paths or files on Hermes' read denylist, and never diagnoses a
  failure run from home, HERMES_HOME or a dot-directory; shell hook functions plus an opt-in
  profile/rc line; one gateway thread polls its spool every second. No own network calls,
  credentials or telemetry. One internal import (session-policy guard) is version-coupled;
  no runtime overrides or self-updater.
maintainer: themahis
tier: community
category: desktop
requires_hermes: ">=0.22.5"
