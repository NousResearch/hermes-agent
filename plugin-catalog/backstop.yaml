platforms: []
known_issues:
  - "Needs the Hermes Desktop app open: a failure waits up to 30 minutes for a Desktop window, then expires."
  - "End-to-end tested on Windows (PowerShell); bash and zsh hooks are tested in CI up to the spool record."
  - "Some gateways reject the max_turns request; Backstop then runs the diagnosis without a turn limit and shows a warning."
  - "Two private core imports (session-policy guard, egress redaction) may break on a Hermes release; the tools then refuse to run."
capabilities:
