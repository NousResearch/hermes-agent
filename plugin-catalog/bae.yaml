name: bae
title: bae
repo: https://github.com/jarrett-del/bae
sha: f450d4866e2675a798b9e3df2a030a9447c4ccca
description: "Your eBay sidekick for Hermes Agent: drop in item photos and quick notes to draft accurate listings, strip generic AI filler from existing Magical Listings, check active comps alongside your own past sales, and preview real net profit after Final Value Fees, Promoted Listings ad rates, and July 2026 USPS 139 dimensional weight before anything goes live. Includes a 4-station Seller Desk (/bae) and 350px Side Pane in Desktop and Webapp, built-in Casual C2C and Pro Store sample tours, Seller Hub Draft CRLF CSV export, inkFrog and myFitment CSV migration, category playbooks, Best Offer floor triage, bin-sorted packing lists, and zero-token scheduled checks. Every live eBay write waits for your approval: Hermes's own approval prompt when you approve in chat, or an Approve click in the Seller Desk; the agent cannot approve its own staged changes. Starts on sample data; connecting a live eBay account waits on Hermes support for eBay's sign-in (hermes-agent#142687), and Seller Hub Draft CSVs work today. Disclosure — makes zero network calls in sample mode (the default), sample tours or offline CSV mode; in live mode, when connected via hermes auth add hermes-ebay-ops:ebay, calls api.ebay.com, apiz.ebay.com, and apim.ebay.com exclusively through Hermes's OAuth broker; reads local photo paths passed to ebay_stage_listing, after checking each against Hermes's read denylist, and CSV files passed to ebay_import_migration_csv; registers one pre_tool_call hook that sends every agent-issued approval of a staged write to Hermes's approval prompt; writes only inside its own Hermes plugin data folder (SQLite ledgers and exported draft CSVs); runs no shell commands or background daemons; typing in the Seller Desk dock submits your prompt to a visible Hermes conversation."
maintainer: jarrett-del
tier: community
category: tools
