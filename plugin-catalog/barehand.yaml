subdir: barehand
description: Lets an agent operate a machine with no OS, network or agent on it (firmware menus, boot loaders, installers,
  rescue shells such as grub>) through the screen and keyboard alone. It provides a computer_use provider for QEMU
  virtual machines over QMP (or a VNC console), a barehand_machine tool, a hermes barehand CLI, a skill and a flight
  recorder. `hermes barehand up` starts local qemu processes that keep running after Hermes exits until `hermes
  barehand down`; no API key reaches them and the plugin makes no network calls. In recorded runs a model installed
  Debian 13 from the network installer (it repaired a grub> prompt on first boot from the installer's rescue mode)
  and Ubuntu Server 26.04 (it finished the stalled installer by hand) on blank aarch64 machines. `hermes barehand
  demo` replays a bundled recording. Evidence and the full disclosure are in the README and docs/results.
