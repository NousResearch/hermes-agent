description: "Control-Barrier Function (h(x) >= 0) and Lyapunov continuous safety shield that solves a real-time Quadratic Program (QP) to smoothly dampen aggressive tool actions. Disclosure — when the owner turns it on in the plugin settings, barrier-shield lowers the batch, limit, worker and concurrency arguments of the tools listed in rewritable_tools and reduces the model's sampling temperature; both are off by default and terminal commands are never modified."
