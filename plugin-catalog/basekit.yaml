name: basekit
repo: https://github.com/D0xedDevi0/hermes-basekit
sha: b7b7bf36a32720b389f984ccdc793284175b0249
description: >-
  Read-only live Base (chain 8453) intelligence — gas and real USD cost estimates,
  wallet portfolios, decoded transaction receipts, token facts with proxy detection, and
  windowed transfer/approval reads — plus a desktop pane, status-bar chip and a
  standard-library-only core with no PyPI dependencies.
maintainer: D0xedDevi0
tier: community
category: tools
requires_hermes: ">=0.22.7"
version: "1.0.0"
readme: true
capabilities:
  provides_tools:
    - base_network
    - base_portfolio
    - base_tx
    - base_token
    - base_activity
    - base_allowances
  provides_hooks:
    - pre_llm_call
  provides_middleware: []
  requires_env: []
