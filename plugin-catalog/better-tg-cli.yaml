description: "Telegram on your own account (not a bot) through a local MCP server and a skill: read and search chats, threads, comments and forum topics, press bot buttons, and send, edit, react or forward only after you approve each action. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — Runs the `better-tg-cli@0.41.2` npm package locally over stdio through `npx` (Node.js 20+; no runtime dependencies, downloaded from npm on first start), in the plugin's data folder. Network: Telegram's own servers over MTProto; the project's login service (better-tg-cli.com, API at tg-cli-broker.login-c2d.workers.dev) only while you log in with a login key; a once-a-day version check to registry.npmjs.org only when the CLI runs in your own terminal (never under Hermes; off with TG_NO_UPDATE_CHECK=1). No telemetry. Login happens once in your own terminal (`npx -y better-tg-cli onboard`), and the skill may install the CLI globally from npm, brew, scoop or the project's latest GitHub release install script (piped to sh, into ~/.local/bin) after asking you; the session and the app's API hash are the CLI's own, stored in its own items in the macOS Keychain, the Linux Secret Service, Windows DPAPI, 1Password (when configured) or a 0600 file in ~/.config/tg, and anyone holding that session controls the Telegram account. It never reads Hermes' secrets or another tool's login. mcp.json forwards only DBUS_SESSION_BUS_ADDRESS, XDG_RUNTIME_DIR and the CLI's own TG_PROFILE, TG_READ_ONLY, TG_LOG_LEVEL, TG_FLOOD_WAIT_MAX, TG_TRANSPORT, TG_NO_UPDATE_CHECK; no credential. Tools that change state (send, edit, delete for everyone, react, forward, pin, leave a chat, and saving media or exports to a folder the agent names) go through MCP elicitation, one Allow Once / Deny per action; unattended runs time out and nothing is sent. Writing without asking can only be switched on in a terminal or OS dialog, never over MCP; on Linux without a secret store that setting is a plain 0600 file the agent's terminal could edit. Login, logout and account transfer are not exposed. Results of most writes are recorded in a local audit log (audit.jsonl in the CLI's profile folder). Plugins (since 0.41): the agent can ask to install, update or remove a Better-TG-CLI plugin (third-party code from a public GitHub repo or a local folder) through telegram_write; the server shows the human the full install summary (source, pinned commit, permissions, effects, network origins, secrets) in an MCP elicitation and installs exactly that snapshot only after Allow, in any write mode; a --read-only server or TG_READ_ONLY refuses it. A plugin runs in a QuickJS-WASM sandbox without files, processes, environment or the Telegram session, reading only what its accepted permissions allow; when it declares network origins its commands may send data there (https to exactly those origins, private addresses refused), and each such run is a write that needs approval in mode ask. Plugin secrets are typed by the human in their own terminal only (never over MCP) and stored in the same secret store as the session; the plugin never sees them. Installed plugins and their data live under the CLI's profile folder, in a registry signed with a key in that secret store. The server runs its bundled CLI as a child process per tool call. The tool set comes from the pinned npm version."
