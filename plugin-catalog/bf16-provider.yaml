description: "bf16.ai serves uncensored open-weight models (DeepSeek V4.1 Flash, GLM-5.3, Kimi K3.1 Pro, and bf16 Auto routers) with 1M context, vision, structured tool calling, and low refusal rates for autonomous agents over an OpenAI-compatible API, prepaid per token. Live model list from the public /v1/models endpoint. Disclosure — registers one model provider and nothing else (no tools, hooks, middleware or shell commands); prompts, tool schemas and BF16_API_KEY go to https://api.bf16.ai/v1 (or BF16_BASE_URL if set) through Hermes's own client."
