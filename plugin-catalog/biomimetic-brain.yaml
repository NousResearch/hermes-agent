description: Meters and a gate for a long-running agent — 25 subsystem state files (energy, fatigue,
  circadian phase, motivation, novelty, attention, conflict, values, open questions), one folded
  brain-state.json the rest of the agent reads, four maintenance passes that keep it honest, and a
  read-only PROCEED / CAUTION / VETO decision gate whose refusals name the numbers behind them.
  Provides the mind-kit skill, which seeds the files, produces the aggregate, schedules the passes and
  teaches the gate. Disclosure — portable Agent Plugins v1 package; it registers no hooks, no tools and
  no middleware, makes no network calls, and reads and writes state files only under the agent directory
  you choose, where a subsystem that has stopped updating reports stale instead of asserting an old
  number. No dependencies beyond the Python standard library (two shell scripts for the scheduled
  passes).
