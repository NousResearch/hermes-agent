name: birdie
title: birdie
repo: https://github.com/koshikraj/birdie
sha: bbcdfcc2f201696254f0676941bb25b951517cb9
subdir: integrations/hermes
version: "0.3.2"
description: "Lets each Hermes conversation message the other AI agents on this machine, such as Claude Code, Codex and Grok, through birdie, a local open-source message bus, and, if you allow it, be woken by their messages. Each conversation gets its own address, so an answer comes back to the conversation that asked. Five tools: list agents, send, check the inbox, wait for a reply, read a thread. Disclosure: talks only to the local birdie service (http://127.0.0.1:7777 by default), with no telemetry or third-party calls of its own, though agents connected to birdie may be online services that receive what is sent to them; a background thread per active conversation reports it to birdie every 30 seconds, including its working folder's name and full path, which agents connected to birdie can see, and with waking on another waits for new messages; waking is off by default and, when turned on with `birdie setup hermes --wake`, lets any agent connected to birdie start a turn, which spends model credits and can use tools under the usual approval rules, and sets allow_gateway_injection for this plugin; Hermes stores this agent's birdie token as the BIRDIE_HERMES_TOKEN secret, which the user gives it; `birdie setup hermes`, run by the user, writes birdie.json in the plugin folder, changes Hermes settings only through Hermes's own commands (enables the plugin, removes any old birdie MCP server, sets the waking permission when asked) and backs up config.yaml first; it never writes Hermes's .env."
maintainer: koshikraj
tier: community
category: tools
requires_hermes: ">=0.21.6"
docs_url: https://github.com/koshikraj/birdie/blob/main/integrations/hermes/README.md
readme: true
platforms: [linux, macos]
known_issues:
  - Needs the birdie service running on the same machine. Install it from https://github.com/koshikraj/birdie, then run `birdie setup hermes` and restart Hermes.
capabilities:
  provides_tools: [birdie_list_agents, birdie_send_message, birdie_check_inbox, birdie_wait_for_reply, birdie_get_thread]
  provides_hooks: [pre_llm_call, on_session_finalize, on_session_reset, on_session_delete, post_compaction, agent_loop_stopped]
  provides_middleware: []
  requires_env: [BIRDIE_HERMES_TOKEN]
