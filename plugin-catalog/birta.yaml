name: birta
title: Birta
repo: https://github.com/birtadev/plugins
sha: c94100ac13d1dcdfac9ad82f282f7034119296fb
subdir: hermes
description: "Artifacts for Hermes. Birta is a shared workspace where people and agents turn drafts into finished work: Hermes publishes a website, HTML page, landing page, portfolio, report, docs or slide deck at a link you can share, and people leave feedback right on the page. With mention events on, @mention Hermes in a comment and it picks the request up on its own: makes the change, replies in the thread and publishes the next version. Disclosure — hosted-only: every tool call goes to birta.dev and acts on your Birta projects; publishing makes a version visible at the project address; optional mention events (off unless you set `events: true` and run the webhook gateway, and approved per subscription) let anyone who @mentions Hermes in your Birta review threads start an unattended agent run."
maintainer: birtadev
tier: community
category: tools
version: "1.1.2"
# Skills are named birta:<skill> from Hermes 0.22.6; older releases hash the namespace.
requires_hermes: ">=0.22.6"
docs_url: https://github.com/birtadev/plugins/tree/main/hermes
image: https://raw.githubusercontent.com/birtadev/plugins/c94100ac13d1dcdfac9ad82f282f7034119296fb/hermes/assets/banner.png
platforms: [linux, macos, windows]
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
known_issues:
- "Sign-in needs one extra command after install, because a portable mcp.json cannot declare OAuth: hermes mcp add birta --url https://birta.dev/mcp --auth oauth --connect-timeout 300"
