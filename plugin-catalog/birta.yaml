name: birta
title: Birta
repo: https://github.com/birtadev/plugins
sha: 476a6f0465d4490579b079f37819048f4e15bc0c
subdir: hermes
description: "Publish and share websites, HTML pages, landing pages, portfolios, reports, docs and slide decks at a link, collect feedback on the page, and have the agent apply it. Disclosure — hosted-only: every tool call goes to birta.dev and acts on your Birta projects; publishing makes a version visible at the project address; optional mention events (off unless you set `events: true` and run the webhook gateway, and approved per subscription) let anyone who @mentions Hermes in your Birta review threads start an unattended agent run."
maintainer: birtadev
tier: community
category: tools
version: "1.1.1"
# Skills are named birta:<skill> from Hermes 0.22.6; older releases hash the namespace.
requires_hermes: ">=0.22.6"
docs_url: https://github.com/birtadev/plugins/tree/main/hermes
image: https://raw.githubusercontent.com/birtadev/plugins/476a6f0465d4490579b079f37819048f4e15bc0c/hermes/assets/banner.png
platforms: [linux, macos, windows]
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
known_issues:
- "Sign-in needs one extra command after install, because a portable mcp.json cannot declare OAuth: hermes mcp add birta --url https://birta.dev/mcp --auth oauth --connect-timeout 300"
