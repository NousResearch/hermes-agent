name: bitquery
title: Bitquery
repo: https://github.com/bitquery/hermes-plugin
sha: 55c7cbe8591f355b31ca1405ce92419b3a5500a9
description: >-
  On-chain data in Hermes: token prices and candles, DEX trades, trader PnL, transfer tracing on 19
  chains, address labels and risk reports, Hyperliquid and Polymarket data, through Bitquery's
  hosted MCP server (Streamable HTTP, OAuth 2.1 with dynamic client registration and PKCE), with
  eight workflow skills bundled. Portable Agent Plugins v1 package (plugin.json + mcp.json +
  skills/). Disclosure — hosted-only connector with no local code: every tool call goes to
  Bitquery's MCP server at mcp.bitquery.io, signed in as the user through Bitquery's sign-in, and
  a first sign-in creates a Bitquery account on a free 7-day trial. The addresses, tokens and
  questions in a call are sent to Bitquery, each call uses credits from the user's Bitquery plan,
  and results are pulled into the session context, so they reach the user's model provider. Every
  tool is read-only (readOnlyHint on all of them): none signs or sends a transaction, places an
  order or changes the user's account. The tool list comes from Bitquery's server at run time, so
  the pinned commit doesn't cover it. Connect with browser sign-in,
  `hermes mcp add bitquery --url https://mcp.bitquery.io/mcp --auth oauth --connect-timeout 300`
  (Hermes stores and refreshes the OAuth tokens), or, where no browser can open, with a Bitquery
  access token,
  `hermes mcp add bitquery --url https://mcp.bitquery.io/mcp --auth header --connect-timeout 300`
  (Hermes keeps it as MCP_BITQUERY_API_KEY in the profile's .env and sends it as a Bearer header).
  The bundled mcp.json alone yields 401.
