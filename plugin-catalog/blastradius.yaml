name: blastradius
repo: https://github.com/valenciayuna/hermes-plugin-blastradius
sha: 86501785fc839cf269c1d9d032fea48226fd0c09
description: "Reads a destructive shell command before it runs and reports what it would actually delete: how many files, how many git can restore, how many it cannot, the total size, and which of them look valuable, then lets policy decide whether to show the report, block the call, or demand a one-shot blast_allow. Covers rm and rm -rf, git clean, git reset --hard, truncate -s 0, shell redirects, and mv overwrite, including nested bash -c, subshells, and chained commands with cd tracking; anything it cannot resolve is reported as unmeasured instead of guessed. Snapshots and verified restore exist as a separate step (blast_snapshot, blast_restore). Disclosure - no network; reads file metadata, directory listings, and the output of read-only git calls (git ls-files, git check-ignore, git rev-parse); writes snapshot copies under HERMES_HOME/plugin-data/; strict policy blocks the tool call while balanced and relaxed report and continue; local terminal backend only; no telemetry."
maintainer: valenciayuna
tier: community
docs_url: https://github.com/valenciayuna/hermes-plugin-blastradius
platforms: []
capabilities:
  provides_tools:
  - blast_radius
  - blast_allow
  - blast_snapshot
  - blast_snapshots
  - blast_restore
  - blast_policy
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env: []
