name: blazephoenix
title: BlazePhoenix
repo: https://github.com/blazephoenixxyz-crypto/blazephoenix-hermes-plugin
sha: a277468e0116b6cbbe610ebb000a325a61bd9527
version: "1.0.0"
description: "Swap quotes from BlazePhoenix, the on-chain DEX aggregator, measured on the user's own RPC and verified locally: net output, Phoenix Check verdict and unsigned Router calldata checked field by field before anything is signed. Base, Ethereum, Optimism, Arbitrum, Robinhood Chain. Disclosure: HTTPS calls to blazephoenix.xyz (prepare/decode, pure, no RPC; receives token addresses, amount, recipient and minimum, never the RPC URL) and eth_chainId/eth_call to the RPC URL the user sets. Never signs, never sends, never handles keys; no shell, no files, no background processes, no telemetry. Standard library only."
maintainer: Mitra
tier: community
category: tools
docs_url: https://github.com/blazephoenixxyz-crypto/blazephoenix-hermes-plugin#readme
requires_hermes: ">=0.23.0"
readme: true
platforms: []
capabilities:
  provides_tools: [blazephoenix_quote, blazephoenix_verify_calldata, blazephoenix_chains]
  provides_hooks: []
  provides_middleware: []
  requires_env: [BLAZEPHOENIX_RPC_BASE]
