description: >-
  Official Blender Lab MCP server over stdio, pinned to upstream v1.0.3,
  with a Blender workflow skill. Requires Blender 5.1+, its separately
  installed MCP add-on, Git and uv. First startup downloads Python dependencies;
  prepare the uv environment before connecting. Disclosure: tools execute
  arbitrary Python in Blender with the user's privileges. Hermes checks that
  Blender is installed (5.1+ on Windows and macOS) before it installs the
  plugin; server discovery does not prove scene readiness.
