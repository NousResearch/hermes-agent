subdir: ""
description: "Hermes writes ESP32 and Arduino code, compiles it with arduino-cli, tests it in the Wokwi simulator (sets sensor values, presses buttons, checks pins, serial output and OLED screenshots), fixes it within bounded attempts, and flashes real boards with approval. Disclosure — runs the user-installed arduino-cli and wokwi-cli as subprocesses (no shell, with timeouts); wokwi-cli sends compiled firmware and the circuit diagram to Wokwi's cloud using the user's Wokwi CI token (stored as a Hermes secret) and uses their Wokwi simulation minutes; arduino-cli may download cores and libraries on request; flashing a board and writing to a serial port always go through Hermes's approval prompt; projects, run folders, screenshots and history are stored in the plugin data directory; no telemetry."
