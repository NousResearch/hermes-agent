description: "Read-only MCP server and skill: search open senior roles (Manager to CEO) at the 500 largest US companies by seniority, function, work mode, place and pay. Agent Plugins v1 package (plugin.json + mcp.json + one skill), configuration only. Disclosure — every tool call goes to the public read-only MCP server at boardroomlist.com (https://boardroomlist.com/api/mcp), which only reads published role listings; results are summaries without the company name, full description or apply link, which the site shows to members on the role page. No sign-in, no key, nothing written, no local commands. The package marks the server untrusted. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
