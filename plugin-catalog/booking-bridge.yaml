name: booking-bridge
repo: https://github.com/kyle-bartlett/booking-bridge
sha: "63c12df5bfc6ff7b7ef7a4ffa3fd5721e02b3846"
version: "1.1.0"
title: Booking Bridge
description: "Find free time, then book, list, reschedule and cancel real Google Calendar consults (for example a Strategy consult) from Hermes. Signs in with the user's own Google OAuth client through hermes auth add booking-bridge:google; all calls go through credentialed_provider_request to www.googleapis.com only. Disclosure: network calls to Google Calendar API v3 only (scopes calendar.events and calendar.freebusy); write tools (book, reschedule, cancel) change the user's calendar, can email invitations to listed attendees, require confirm=true, and are sent to Hermes' own approval gate by a pre_tool_call hook (action approve), so Hermes asks the user first and fails closed in cron, single-query and one-shot runs and unattended platforms; the tools also refuse, changing nothing, in cron, single-query, kanban, webhook-style and any unrecognized platform or session source; booked events carry a private hash property to prevent duplicates; revoke with hermes auth logout booking-bridge:google; no shell commands, background processes, telemetry or stored credentials."
maintainer: kyle-bartlett
tier: community
category: tools
requires_hermes: ">=0.22.7"
docs_url: https://github.com/kyle-bartlett/booking-bridge/blob/63c12df5bfc6ff7b7ef7a4ffa3fd5721e02b3846/README.md
readme: true
capabilities:
  provides_tools: [list_availability, list_upcoming, book_event, reschedule_event, cancel_event]
  provides_hooks: [pre_tool_call]
  provides_middleware: []
  requires_env: [BOOKING_BRIDGE_CLIENT_ID, BOOKING_BRIDGE_CLIENT_SECRET]
known_issues:
  - "Needs the user's own Google Cloud OAuth client (Desktop app) with the Calendar API enabled; sign in once with hermes auth add booking-bridge:google."
  - "Google may show an unverified-app warning for a personal OAuth client in testing mode."
  - "Write tools go through Hermes' approval gate via a pre_tool_call hook. If the user sets approvals.mode: off or approvals.single_query_mode: approve, Hermes lets them through by design, and only the plugin's own confirm and platform checks remain."
