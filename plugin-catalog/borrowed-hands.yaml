subdir: borrowed-hands
version: "0.1.0"
description: "Lend your Mac's Xcode to a cloud Hermes. Hermes finds your paired Mac, compiles the Xcode project you granted (macOS arm64 or generic iOS Simulator, compile only) at an exact commit on a bh/* branch, and gets structured compiler diagnostics back: ask \"Build my demo project on my Mac\". Needs the separate Borrowed Hands Mac helper (Python source in the same repository) on an Apple silicon Mac with Xcode; the Mac connects out to Hermes and decides what may build. Disclosure — when `listen.enabled` is set (off by default) the plugin runs an HTTP/WebSocket listener inside `hermes gateway run` (default bind `0.0.0.0:8790`, routes `/bh/v1/ws` and an unauthenticated `/bh/v1/healthz`) that paired Macs dial into; connections are authenticated by a single-use pairing code and per-device Ed25519 keys. It keeps a server signing key and a SQLite database (paired device keys, signed job contracts, build diagnostics, audit log) in its plugin data dir; anything the agent can reach on the gateway host can read that key, and a holder of it can sign build requests to paired Macs within their grants. For a build with no commit it makes one anonymous HTTPS read of the granted public repository's branch list (public addresses only, no credentials, no redirects). Builds ask for Hermes approval; an \"always\" answer covers the same Mac, workspace, scheme, configuration and destination but not the commit or branch, so later commits build without a new prompt. The separate Mac helper is installed by the user from the repository checkout, is not covered by this catalog pin, and installs a LaunchAgent, a hidden build user, a root-owned dispatcher and a sudo rule limited to six exact dispatcher commands. No telemetry, no self-update."
maintainer: alext8900
tier: community
category: tools
docs_url: https://github.com/alext8900/borrowed-hands/blob/main/docs/QUICKSTART.md
requires_hermes: ">=0.22.7"
readme: true
platforms: [linux, macos]
known_issues:
  - "hands_screen_capture is registered but unavailable: no helper executor in this version."
  - "iOS Simulator support is compile-only: no boot, install, UI or tests."
  - "Public HTTPS repositories and bh/* commits only; private repositories and remote Swift packages are unsupported."
  - "Builds report wipe_ok=false for protected per-user state; complete persistent-state removal is not established."
capabilities:
  provides_tools:
    - hands_find
    - hands_system_info
    - hands_xcode_build
    - hands_job
    - hands_screen_capture
  provides_hooks:
    - pre_tool_call
    - post_tool_call
  provides_middleware: []
  requires_env: []
