  provides_hooks:
    - pre_llm_call
    - pre_tool_call
    - post_tool_call
    - transform_tool_result
    - post_llm_call
    - agent_loop_stopped
    - kanban_task_completed
    - kanban_task_blocked
    - kanban_task_claimed
    - on_kanban_worker_spawned
  provides_middleware: []
  requires_env: []
