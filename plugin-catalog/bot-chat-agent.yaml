description: "Agentic reply style, a block-only safety guard (secrets, deletes, destructive git, protected-branch pushes, outbound messages, expensive models) and a quiet Desktop status bar for Bot Mode's canonical \"Bot Chat\" sessions. Other sessions untouched. Disclosure — in sessions titled \"Bot Chat\" (and their subagent children) it injects a reply-style instruction into each turn and blocks tool calls matching its rules (secrets, deletes, destructive git, protected-branch pushes, outbound messages, expensive models); opens <HERMES_HOME>/state.db read-only to resolve session titles."
