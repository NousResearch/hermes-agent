title: Bot Chat Agent
description: >
  Agentic reply style, a block-only safety guard (secrets, deletes, destructive git,
  protected-branch pushes, outbound messages, expensive models) and a quiet Desktop
  status bar for Bot Mode's canonical "Bot Chat" sessions. Other sessions untouched.
  Disclosure: opens <HERMES_HOME>/state.db read-only (mode=ro) to resolve session
  titles; never writes state.db and never reads .env, auth.json or credentials.
