title: Hermes Bots
description: "Hermes Bots: a calmer Hermes Bot Chat that still does the work: short agentic replies, a block-only safety guard, a Desktop status card, mid-turn asks that are no longer dropped, background results delivered back to the same chat, a local short-term / long-term memory (decisions, project state, lessons; /memoria) with no API keys, and an opt-in panteón: Hermes may offer in one line to create a specialist bot and creates it only after your yes. Other sessions untouched. Disclosure — in sessions titled \"Bot Chat\" (and their subagent children) it injects a reply-style instruction, a bounded context / memory block, pending-ask reminders and (Desktop half enabled) a one-line specialist offer, and blocks tool calls matching its rules (secrets, deletes, destructive git, protected-branch pushes, outbound messages, expensive models, kanban-lock bypasses, obfuscated exec, memory-injection); it never approves anything. It opens <HERMES_HOME>/state.db and <HERMES_HOME>/kanban.db read-only; writes plugin-local files under <HERMES_HOME>/bot-chat-agent/ (memory.db, deliveries.db, status.json, panteon-auto.json, dm-delegations.json, optional project-card.md); serves a small dashboard API at /api/plugins/bot-chat-agent; the Desktop half (opt-in in Capabilities → Plugins) calls the app's own profiles.create / profiles.configure for ONE preset profile, only after the user's explicit yes; changes the Desktop reasoning.collapsedByDefault setting while a Bot Chat is focused and restores it on leave/disable; makes no third-party network calls, no telemetry and no credential reads. Background work uses Hermes kanban / the gateway dispatcher when team.assignees is configured; on Hermes 0.23, results are offered into the next turn. A ContextEngine named bot-chat is registered but off until context.engine: bot-chat is set."
maintainer: Tormen28
