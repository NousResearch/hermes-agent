known_issues:
  - "Per-turn cost: the plugin's own pre_llm_call hook takes about 15 ms p50 / 20 ms p95 on a Windows 11 PC and about 5 ms p50 on Linux (SQLite connections are shared per turn). Measured only with a mock model, so real-model time-to-first-token and the quality of the deterministic compactor are not measured; with context.engine: bot-chat requests were ~30% smaller than without the plugin in a mock 300-turn run. The engine is off by default."
  - "The panteón offer is an instruction injected into Bot Chat turns; a real model follows it most of the time, not guaranteed. The Desktop half must be switched on in Capabilities → Plugins for offers and profile creation."
  - "Background-result delivery on Hermes 0.23 uses the next-turn offer path; durable in-transcript writes need the core B1 API, which 0.23 does not expose. The core bot-loop guard (gateway.bot_loop_guard.max_hops, default 4) can refuse later delegations to the same teammate in one chat; the card then shows an error."
  - "Long-term memory is written only when the turn text contains clear cues (Decision:, Decisión:, We decided, Decidimos, Lesson:, Remember that, Recuerda que, From now on, …). There is no model and no network."
  - "Language follows the user (es/en/fr/pt/de, detected offline from the latest message; language: es|en|fr|pt|de forces one). Plugin-written text (status card, /memoria, /botmemory, /pantheon) is translated; lines the model writes (panteón offer, ready notice, stop explanation) get an instruction to answer in that language, which a real model usually but not always follows. Specialist role prompts and guard block messages stay en/es."
  - "hermes plugins remove takes out the Python half only; your data folder and the Desktop half (installed by the core) stay until you delete them."
capabilities:
