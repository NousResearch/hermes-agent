title: Bot Dashboard
description: "Two desktop panes in one plugin. Bot shows the focused bot's dashboard - profile and model, scheduled jobs, notes, the custom widgets that bot pinned for you, and optional tasks and projects from a markdown notes vault you point it at in the plugin settings; Group shows a group chat's members, activity, shared tasks and projects, and follows a group chat you open. Ships two agent tools in its own bot_dashboard toolset - bot_panel edits the bot's own panel, group_dashboard lets any member bot read or shape a group's dashboard - plus a pre_llm_call hook that adds a short panel snapshot on the first turn only (and an optional per-turn instruction, empty unless the user writes one). Disclosure - reads the local Hermes home (bot profiles, config.yaml, group room records) and, only if the user sets vault_path, markdown notes in that folder; writes only each bot's own panel files (widgets, notes, layout) under its profile and, when the user creates or ticks a task, that task's note in the configured vault folder. Widgets render in a sandboxed opaque-origin frame with a no-network Content-Security-Policy. The panes talk to the Hermes API on 127.0.0.1, with no third-party network calls, no shell commands and no stored credentials. Disclosure — reads the local Hermes home (every bot profile's profile.yaml, config.yaml, SOUL.md, skills list and avatar, plus the gateway's group-room tables in state.db/shared-state.db, read-only) and, only if the user sets vault_path, markdown notes in that folder; the bot_panel/group_dashboard tools can copy any .html file the model names into a widget, and any bot can edit any local group's dashboard; writes only panel files (widgets, notes, layout) under each bot's profile and under plugin-data/bot-dashboard/groups, plus, when the user creates or ticks a task, that task's note in the configured vault folder; widgets render in a sandboxed opaque-origin frame with a no-network Content-Security-Policy; an optional panel_rule setting (empty by default) adds the user's own instruction to every turn; no third-party network calls, no shell commands, no stored credentials."
maintainer: trookish
tier: community
category: desktop
