# Empty would mean "every platform". Add windows only after the Windows test run on GitHub is green.
platforms:
  - linux
  - macos
capabilities:
  provides_tools: [bot_drops_prepare]
  provides_hooks: []
  provides_middleware: []
  requires_env: []
known_issues:
  - Publishing needs the GitHub CLI signed in (gh auth login). Without it Bot Drops prepares the files for a manual upload.
  - Shared bots are public repositories; private sharing is not supported.
  - Built and tested on macOS. Windows support is new in 0.5.0 and not yet confirmed on a Windows machine, so this entry lists Linux and macOS.
  - On Hermes 0.23.0 a bot name that was removed earlier cannot be reused for a new bot; fixed in Hermes 0.23.1.
  - Profiles are not a security sandbox. Only adopt bots from people you trust.
requires_hermes: ">=0.23.0"
