name: bot-drops
title: Bot Drops
repo: https://github.com/brainarts-lab/bot-drops
sha: 954278ef95b62eaaee864aa7f8c1b60d2f50f304
version: "0.5.2"
description: "Share a Hermes bot as a link and a card, and adopt bots other people share as new profiles. A preview shows the bot's card, what it needs, the full text of each scheduled task and what was left out before anything is installed; adopting runs Hermes' own profile install on the exact reviewed commit and never changes existing profiles. Sharing packages the personality, the author's own text skills and any scheduled tasks (name, task text, schedule and skills only, arriving paused), renders a link card and a story image locally, and publishes them as a new public GitHub repository with a GitHub Pages bot page. Disclosure — a preview clones a public GitHub or GitLab repository over HTTPS with size, time and file limits and never installs anything; adopting creates a new profile through Hermes' own profile install with the shared bot's scheduled tasks paused. Publishing runs git and the user's own gh login to create a new PUBLIC GitHub repository and GitHub Pages page, only after an explicit confirmation in the plugin screen; the shared package holds the personality, the author's own text skills, the model provider/name and scheduled tasks (name, task text, schedule and skill names only). Keys, settings, memory, chats, plugins, MCP servers, Skills Hub skills and the delivery targets, scripts, folders and endpoints of scheduled tasks are never shared. Shared pages and cards carry a \"by BrainArts\" credit link to the author's X profile that the sharer can turn off. No telemetry, self-updater or background process."
maintainer: brainarts-lab
tier: community
category: desktop
