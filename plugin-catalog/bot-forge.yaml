sha: f00900fcd804e0a339f066f7f591a1694beca692
description: "Say \"make me a <role>\" and your agent spawns a complete Bot Mode Bot — name, face, SOUL.md, memory, tools, skills, routines, gateway — tested, with rollback. Then hire a whole crew in one call, ask what is waiting on you, and edit, teach, share and health-check Bots by chatting. Disclosure — spawns the hermes CLI to create and run Bot profiles under HERMES_HOME/profiles/, and installs its own small companion hook plugin (bot-forge-marks, two hooks, no tools) into each Bot profile it manages, enabling it in that profile's config.yaml; never the root profile. Disclosure — when a Bot journals a blocked/failed entry, the plugin emails its title and summary to your own address via the SMTP account in Hermes' EMAIL_* settings (TLS verified; off with notify_blocked or notify_email false); adopt_bots (off by default) installs the companion hook into every profile on load. Disclosure — handoff_agent and ask_agent accept reading_only, which runs the receiving Bot's turn with only the web and vision toolsets via `hermes chat -t`; it restricts that turn and is not a sandbox. Disclosure — delegate_outside spawns Claude Code, a third-party agent already installed on the host, with a scrubbed environment; Hermes does not dispatch its tools and no Hermes policy plugin governs them. It runs read-only unless the caller asks for edits, and an editing job runs in its own git worktree on its own branch rather than the user's working copy. Disclosure — share_agent's optional publish argument posts the Bot template (never chats or credentials, secret-scanned first) as an unlisted gist via the user's own signed-in gh CLI, and import_agent reads one back over https only. Disclosure — create_agent writes a shared policy file at HERMES_HOME/shared/BOT-POLICY.md if missing and inlines it into each new Bot's SOUL.md; update_agent can rewrite a Bot's SOUL.md to refresh it, backed up first. Disclosure — create_agent installs a second hooks-only plugin (bot-forge-sentinel, no tools) into each Bot, answering pre_tool_call to refuse or escalate that Bot's own declared approvals; off with enforce_approvals false. Disclosure — handoff_agent runs a turn in another Bot's own chat under the same environment allowlist as ask_agent, and request_takeover writes a blocked journal entry asking the user to take that Bot's screen for a sign-in."
maintainer: BkashJEE
