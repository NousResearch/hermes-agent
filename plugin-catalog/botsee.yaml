description: "AI-visibility research through BotSee's hosted Streamable HTTP MCP server (https://botsee.io/mcp), with a bounded workflow skill for reviewing existing analyses, competitor recommendations and cited sources, and planning audits. Portable Agent Plugins v1 package; no local server, OAuth bridge, hooks or self-updater. Disclosure — every tool call goes to BotSee's hosted MCP server at botsee.io with the user's own BotSee API key (MCP_BOTSEE_API_KEY, sent as a bearer header), and the tool set is served by that remote server at runtime and is not covered by the pinned sha; some BotSee tools spend account credits, generate billable content or top up the balance (including USDC payments), and the package marks the server untrusted so Hermes asks before every tool the server does not annotate as read-only and refuses those tools in cron and headless runs, which relies on BotSee's own read-only annotations; no spending cap is enforced."
