name: bounded-results
repo: https://github.com/1anter/hermes-research-plugins
sha: 48befeaf71f0bfed7916553d1a511c81a37a9c4b
subdir: plugins/bounded-results
description: "Bounded tool outputs with hash-addressed full-result retrieval. Disclosure — rewrites what the model sees for six tools (`evidence_history`, `evidence_compare`, `evidence_as_of`, `evidence_verify_support`, `evaluation_report`, `memory_search`): results over 4 KB are replaced by a preview and a hash, and the full text is kept in a local SQLite file under the profile's plugin-data directory with no automatic deletion. It only has an effect when a plugin providing those tools is installed. Nothing leaves the machine."
maintainer: 1anter
tier: community
category: tools
requires_hermes: '>=0.23.0'
version: 0.1.1
capabilities:
  provides_tools:
  - bounded_read
  provides_hooks:
  - transform_tool_result
  provides_middleware: []
  requires_env: []
