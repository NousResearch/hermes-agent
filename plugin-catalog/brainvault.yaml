description: "Memory you own for Hermes, by Wave OS. Hermes remembers on this computer right away, and a pasted page becomes memory cards. You mint the ones worth keeping to your own wallet's vault on the Theta blockchain with one approval in Wave Web (private by default, encrypted to you and this Hermes), and any Hermes you pair reads them back, fingerprint-checked. Ask Wavey answers Wave questions from chain-verified public cards. Disclosure — never signs, mints or holds wallet keys: minting happens on web.oswave.io, approved in the Wave Wallet Mint browser extension, and costs a one-time TFUEL network fee. Network calls go only to web.oswave.io (your vault's card index, sending your public wallet address; one-time end-to-end encrypted drops for pairing and Send to Wave, with the key kept in the link fragment; Wavey's public cards) and Theta's public RPC eth-rpc-api.thetatoken.org (read-only card reads and gas price). Stores a decrypt-only, wallet-revocable agent key in the OS keyring if installed, else a 0600 file in $HERMES_HOME/brainvault; reads Hermes's config.yaml only for its setup check. A background thread syncs every 10 minutes. Opens Wave Web in the browser for pairing and minting. No telemetry, no shell commands, no self-updating. Recall runs locally; recalled memories reach the user's model provider like any context."
