name: brownout
title: Brownout
repo: https://github.com/Osiyomeoh/brownout
sha: 22b2102c6b451ed5aeed5790623029b98ccae9e4
description: "Power-cut guard for the machine Hermes runs on. When mains power drops it messages you (Telegram or any hermes send target) with the battery level, measures the real drain and sends a runway, and on /brownout park (or by itself at critical battery if you don't answer) pauses active cron jobs and blocks new tool calls with a pre_tool_call hook. When power is back it resumes only the jobs it paused and tells you. Nothing is killed or deleted; it stops the next tool call, not one already running. Undelivered alerts are retried in order. Disclosure — one daemon thread per Hermes home polls power every poll_seconds (default 15) by running `pmset -g batt` (macOS), reading /sys/class/power_supply (Linux) or running `upsc` (NUT UPS, opt-in); alerts go out by running the documented `hermes send --to <notify_target> --file -` CLI with a 30 s timeout, using the gateway's own credentials. No network calls of its own, no credentials read, no telemetry. Writes only to <HERMES_HOME>/plugin-data/brownout/ (events log, state, command queue, watcher lock)."
maintainer: Osiyomeoh
tier: community
category: automation
requires_hermes: ">=0.23.0"
docs_url: https://github.com/Osiyomeoh/brownout/blob/22b2102c6b451ed5aeed5790623029b98ccae9e4/README.md
version: "0.1.1"
platforms: [linux, macos]
known_issues:
  - "Proven on real hardware on macOS (pmset). Linux sysfs and NUT UPS readers are covered by parser tests on recorded formats only."
