name: browser-viewer
repo: https://github.com/vittoriocompagno/hermes-browser-viewer
sha: 210d06334032e6fa55fc9232728cdc7f8a5b1661
description: "Live view and human takeover of the browser Hermes drives: stream its tabs to a web page on another device and click, type and scroll yourself to log in, pass 2FA or a CAPTCHA. Disclosure — starts a detached aiohttp server that listens on explicit IPv4 addresses (loopback plus the Tailscale address if tailscale is installed; never 0.0.0.0), over plain HTTP by default or HTTPS when the user opts in with hermes browser-viewer tls (tailscale cert contacts the Tailscale control plane and Let's Encrypt, and the machine name appears in public Certificate Transparency logs); login links are single-use (10 minutes) and are exchanged for an HttpOnly session cookie (7 days by default, Secure over HTTPS), and the start and link actions return such links to the session transcript; launches Chromium, or chrome-headless-shell when one is installed under the Hermes tools directory or on PATH (per-browser engine choice: auto, shell or chromium), with a persistent profile (cookies and logins) and CDP on 127.0.0.1, which makes its usual background connections; headless browsers send the user agent of a windowed Chrome, hide navigator.webdriver and send Accept-Language from the system locale; each managed headless browser also gets a detached Python process (standard library only, the same minimal environment) that holds one CDP connection for the life of that browser and rewrites client-hint headers on requests that still carry the browser's own values (BV_UA_OVERRIDE=0 turns it off); the link action starts the viewer server if it has stopped; stop closes the browser over CDP (Browser.close) before any signal so recent cookies reach disk; the server is started with the Python of the virtualenv that holds aiohttp; the server and Chromium get a minimal environment, not the Hermes one (proxy settings and desktop-session variables are passed on); runs chromium --version and chrome-headless-shell --version (answers cached in the plugin data dir), tailscale ip -4, tailscale status and tailscale cert (HTTPS mode only) and hermes config set|unset browser.cdp_url (the use action changes browser.cdp_url for every session of the profile, and browser_exec then acts with that browser's logins); status and list return each tab's origin and a truncated title to the session transcript; reads /proc and /proc/net/tcp on Linux (the same process facts through psutil on macOS) and Chromium builds under the Hermes tools directory; no telemetry from the plugin. Linux and macOS (Apple Silicon)."
maintainer: vittoriocompagno
tier: community
category: tools
requires_hermes: ">=0.23.1"
docs_url: https://github.com/vittoriocompagno/hermes-browser-viewer#readme
image: https://raw.githubusercontent.com/vittoriocompagno/hermes-browser-viewer/210d06334032e6fa55fc9232728cdc7f8a5b1661/docs/banner.png
