name: browser-viewer
repo: https://github.com/vittoriocompagno/hermes-browser-viewer
sha: edbbc78140adc2b053a0eda9ba85c3762e7ab454
description: "Live view and human takeover of the browser Hermes drives: stream its tabs to a web page on another device and click, type and scroll yourself to log in, pass 2FA or a CAPTCHA. Disclosure — starts a detached aiohttp server that listens on explicit IPv4 addresses (loopback plus the Tailscale address if tailscale is installed; never 0.0.0.0), over plain HTTP by default or HTTPS when the user opts in with hermes browser-viewer tls (tailscale cert contacts the Tailscale control plane and Let's Encrypt, and the machine name appears in public Certificate Transparency logs); login links are single-use (10 minutes) and are exchanged for an HttpOnly session cookie (7 days by default, Secure over HTTPS), and the start and link actions return such links to the session transcript; launches Chromium with a persistent profile (cookies and logins) and CDP on 127.0.0.1; runs chromium --version, tailscale ip -4, tailscale status and tailscale cert (HTTPS mode only) and hermes config set|unset browser.cdp_url (the use action changes browser.cdp_url for every session of the profile); reads /proc and Chromium builds under the Hermes tools directory; no telemetry. Linux only."
maintainer: vittoriocompagno
tier: community
category: tools
requires_hermes: ">=0.23.1"
docs_url: https://github.com/vittoriocompagno/hermes-browser-viewer#readme
version: "0.1.0"
platforms: [linux]
known_issues:
  - "Plain HTTP unless HTTPS is enabled with hermes browser-viewer tls: without it the session cookie and the stream are not encrypted on the wire, so use a private network such as Tailscale."
  - "A cold start can block the tool call for up to about 75 seconds."
capabilities:
  provides_tools:
    - browser_viewer
  provides_hooks: []
  provides_middleware: []
  requires_env: []
