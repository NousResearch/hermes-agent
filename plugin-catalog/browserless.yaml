# Browserless — cloud browser provider for Hermes' built-in browser tools.
#
# Owner-submitted by a Browserless maintainer. Registers one browser provider (no tools, hooks or
# middleware); select it with `browser.cloud_provider: browserless`.
name: browserless
title: Browserless
repo: https://github.com/browserless/browserless-mcp
sha: "7006ee45f0f44b3561d7b2b7fbc5c50cdb766e64"
subdir: hermes
description: "Run Hermes' built-in browser tools on Browserless cloud browsers: stealth mode, residential proxies, captcha solving and ad blocking, with no local Chrome. One Browserless browser per task; Hermes' agent-browser daemon and CDP supervisor share it through a local CDP multiplexer, and the browser is reconnected after network drops and closed when the task ends. Disclosure — while a browser task runs, starts a background thread with a WebSocket listener on 127.0.0.1 (random port, secret path, local Host header only); connects to Browserless (production-*.browserless.io) with BROWSERLESS_TOKEN, read via get_secret; Browserless usage is metered on your plan, and residential proxy traffic costs more; no files written unless BROWSERLESS_MUX_LOG is set; no telemetry."
maintainer: browserless
tier: community
category: web
docs_url: https://github.com/browserless/browserless-mcp/tree/7006ee45f0f44b3561d7b2b7fbc5c50cdb766e64/hermes
requires_hermes: ">=0.21.6"
version: "0.1.1"
readme: true
known_issues:
  - "If the Browserless session can't start (e.g. wrong token or plan concurrency limit), Hermes falls back to a local browser; set BROWSERLESS_MUX_LOG to see the reason."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - BROWSERLESS_TOKEN
