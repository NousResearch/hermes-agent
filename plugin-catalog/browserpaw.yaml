name: browserpaw
repo: https://github.com/GoldenLoaf24h/browserpaw
sha: dc1e7f3034adff341c22144ec50ad4bd9de88c85
subdir: "plugins/browserpaw-hermes"
description: >-
  Run the local BrowserPaw CLI as one Hermes tool and register its canonical Agent
  Skill for controlling the user's existing Chrome profile and learned workflows in
  ~/.browserpaw. Disclosure — installation requires the separately published
  browserpaw npm package and BrowserPaw Chrome extension; the agent can navigate,
  click, fill, upload, download, inspect page data and run learned recipes against
  logged-in sites without per-command shell expansion or Hermes approval prompts,
  so users should choose Hermes trust settings appropriate to unattended browser
  control. Model-supplied write paths (--out) are confined to ~/.browserpaw/out and
  checked via Hermes file-safety rules, read paths are checked via Hermes
  file-safety rules, and installer commands (setup, uninstall, doctor --fix) are
  refused. No MCP server, Jev/TypeSafe service, credential files or telemetry are
  bundled.
maintainer: GoldenLoaf24h
tier: community
category: web
requires_hermes: ">=0.21.5"
docs_url: "https://github.com/GoldenLoaf24h/browserpaw/tree/main/plugins/browserpaw-hermes#readme"
version: "5.0.1"
capabilities:
  provides_tools:
    - browserpaw
  provides_hooks: []
  provides_middleware: []
  requires_env: []
