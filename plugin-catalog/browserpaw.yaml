description: "Run the local BrowserPaw CLI as one Hermes tool and register its canonical Agent Skill for controlling the user's existing Chrome profile and learned workflows in ~/.browserpaw. Disclosure — runs the separately installed browserpaw npm CLI (not covered by this entry's pin) with its Chrome extension and loopback native host; without a Hermes approval prompt the agent can drive your real Chrome profile and logged-in sessions: navigate, click, fill and submit forms, run in-page JavaScript and raw CDP commands, read cookie values, history and bookmarks, upload local files to sites, download files, and save and auto-run learned workflows under ~/.browserpaw; output files are confined to ~/.browserpaw/out, file reads and writes are checked against Hermes' file-safety rules, the agent cannot run the CLI's setup, uninstall or doctor --fix commands, and its calls turn off the CLI's self-update; it reads no credentials itself and sends no telemetry."
maintainer: GoldenLoaf24h
