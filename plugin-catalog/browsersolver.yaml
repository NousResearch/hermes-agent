description: "Fetch web pages behind Cloudflare, DataDome and similar protections for the built-in web_extract tool, through the BrowserSolver web unlocker API. Extract only; pair it with a search backend for web_search. Disclosure — sends each URL to api.browsersolver.com with your BROWSERSOLVER_API_KEY, and calls can use BrowserSolver credits. Reads the key only through Hermes's secret scope. Registers no tools, no hooks or middleware, writes no files, starts no processes, has no telemetry or self-updater, and uses only the Python standard library."
maintainer: browsersolver
tier: community
category: web
