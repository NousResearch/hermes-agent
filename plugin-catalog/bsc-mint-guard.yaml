name: bsc-mint-guard
repo: https://github.com/Fuma2514/hermes-mint-guard
sha: 31f0ab7a9f522235e7daa4cdb6f96f919fb1ed5e
subdir: ""
description: "Safety-check a BSC ERC-721 free mint before you mint. Read-only on-chain reads, no keys, no signing, no spending. Disclosure — read-only on-chain lookups: the contract and wallet addresses you check are sent to third-party public BSC RPC providers (bsc.meowrpc.com, bsc-mainnet.public.blastapi.io, rpc-bsc.48.club, bsc-dataseed.bnbchain.org); no keys, signing or transactions."
maintainer: Fuma Ops II
tier: community
category: tools
requires_hermes: ">=0.21.6"
version: "1.0.0"
screenshots: []
readme: true
platforms: []
onboarding: false
known_issues:
  - "Price probe covers common view functions only (mintPrice, price, cost, mintCost, publicPrice, salePrice, getPrice). Contracts with a custom price function return price_unknown and verdict NEEDS_MANUAL_CHECK."
capabilities:
  provides_tools:
    - mint_check
    - mint_quote
    - wallet_mint_status
  provides_hooks:
    - post_tool_call
  provides_middleware: []
  requires_env: []
