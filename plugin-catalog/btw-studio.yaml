description: "Side-channel /btw workspace, $0 read-only SQLite session radar, and Δτ steer playbook for Hermes Desktop, CLI, Gateway, and Dashboard. Intercepts /btw mid-turn in the composer (with attachments, opt-in voice STT/TTS, and @session context) to render Markdown answers in a strip, popover, floating pane, or dialog without mutating the transcript or L0 prompt cache. Reads state.db?mode=ro at $0 for token/cache metrics, AST syntax checks, 10 loop-guard detectors, and cross-session file write conflicts, steers conversation_id-stable turns or child subagents mid-flight, formats output via a 6-axis reading lens ([0,1]^6), and retains only rules verified by 3-call Δτ behavioral contrast in BTW.md. Disclosure — registers 12 observer-only hooks returning None (never blocking or auto-approving), btw-studio.verified-playbook prompt section in lite/full modes, BTW_CONVERSATION_ID session env, auxiliary tasks btw_studio_fast and btw_studio_title calling ctx.llm (redacted <=32 KB digest; optional fast_base_url restricted to https:// or loopback without redirects), 55 FastAPI endpoints under /api/plugins/btw-studio/, 14 CLI subcommands, 12 gateway RPCs, and 8 Desktop host RPCs. Reads $HERMES_HOME/state.db?mode=ro (sibling profiles only when scan_sibling_profiles is on), curator logs/archived skills read-only on post_curator_run, .git/HEAD, config.yaml, MEMORY.md, up to 8 cwd-confined edited .py/.json files via ast.parse/json.loads, and denylisted workspace attachments. Opt-in gates (false/off by default, zero background LLM calls on telemetry): allow_web_search, allow_media_tools, wake_word_enabled, live_voice_enabled, tts_auto_speak, memory_md_sync_mode, scan_sibling_profiles, gamify_enabled; opt-in STT/TTS uses host providers or SSRF-validated Nous/Groq/OpenAI HTTPS audio endpoints via agent.secret_scope (TOOL_GATEWAY_USER_TOKEN, TOOL_GATEWAY_DOMAIN, GROQ_API_KEY, VOICE_TOOLS_OPENAI_KEY, OPENAI_API_KEY). Writes stay in ctx.state.data_dir unless memory_md_sync_mode or companion pet adoption is explicitly enabled; runs no shell commands, subprocesses, daemons, or self-updater."
