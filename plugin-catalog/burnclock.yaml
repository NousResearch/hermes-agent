title: Burnclock
description: "Status-bar chip and left-nav dashboard for the MIT burnclock CLI. The chip reads burnclock's local badge cache; the dashboard adds balance, runway, budget and the DeepSeek Flash off-peak clock, with an explicit refresh. Requires the separately installed burnclock CLI (pip install burnclock) and a populated cache. Disclosure — the chip runs a read-only shell command (cat of the cache) in your active local session every 60 seconds; the dashboard runs the pure-clock offpeak subcommand every 60 seconds, and its explicit Refresh button may invoke burnclock to collect balances using keys you configured separately. The plugin reads no credentials itself."
