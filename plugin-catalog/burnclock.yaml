title: Burnclock
description: "Status-bar chip and left-nav dashboard for the MIT burnclock CLI. The chip reads burnclock's local badge cache; the dashboard adds cached balance, runway, budget, the DeepSeek Flash off-peak clock, and an API-keys card. A key entered in the card is sent to the plugin's own local backend, written only to burnclock's keys file (mode 0600), and used only for the explicit `burnclock badge --refresh`; the desktop renderer stores no key and Hermes credentials are never read or forwarded. Requires the separately installed burnclock CLI (pip install burnclock). Disclosure — the chip runs a read-only shell command (cat of the cache) in your active local session every 60 seconds; the dashboard runs the pure-clock offpeak subcommand every 60 seconds. A key save or refresh command runs the burnclock CLI only when the user clicks that action; no other command is executed."
