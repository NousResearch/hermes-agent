title: Burnclock
description: "Status-bar chip and left-nav dashboard for the MIT burnclock CLI. The chip reads burnclock's local badge cache; the dashboard adds cached balance, runway, budget and the DeepSeek Flash off-peak clock. The plugin runs no provider refresh and reads no credentials — balances are refreshed by running `burnclock badge --refresh` in a terminal, where the CLI has its own environment. Requires the separately installed burnclock CLI (pip install burnclock) and a populated cache. Disclosure — the chip runs a read-only shell command (cat of the cache) in your active local session every 60 seconds; the dashboard runs the pure-clock offpeak subcommand every 60 seconds. Nothing else is read and no other command is executed."
