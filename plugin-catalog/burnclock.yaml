title: Burnclock
description: "Status-bar chip and left-nav dashboard for the MIT burnclock CLI. The chip reads burnclock's local badge cache; the dashboard adds cached balance, runway, budget, the DeepSeek Flash off-peak clock, and an API-keys card. A key entered in the card is sent to the plugin's own local backend, written only to burnclock's keys file (mode 0600), and used only for the explicit `burnclock badge --refresh`; the desktop renderer stores no key and Hermes credentials are never read or forwarded. Requires the separately installed burnclock CLI (pip install burnclock). Disclosure — the status-bar chip runs a read-only shell command (cat of burnclock's badge cache) in your active local session every 60 seconds, and the dashboard page runs `burnclock offpeak --json` every 60 seconds; a provider key you paste into the API-keys card is written to burnclock's own `~/.config/burnclock/env` (mode 0600), and Save or Refresh runs `burnclock badge --refresh`, which calls the chosen providers' APIs (DeepSeek, OpenRouter, Moonshot, MiniMax, fal) with those keys, only when you click."
