description: "Write, plan and schedule social media posts in a business's own voice through Buzzmark's hosted MCP server (Streamable HTTP at https://buzzmark.ai/mcp, OAuth sign-in, no keys in config): post ideas from this week's news, posts for Instagram, LinkedIn, Facebook, X, Threads and TikTok with a version per platform, a score for how much a post sounds like the brand, pictures, a week of posts planned around the best posting times, and what worked. Bundles the buzzmark workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — every tool call goes to Buzzmark's hosted server (buzzmark.ai) and acts on the user's Buzzmark account; the tool set is served by that server at runtime and is not covered by the pinned sha. Nothing posts right away: tools save, schedule, move and unschedule posts on the user's Buzzmark calendar and delete drafts, and write_posts, rewrite_post and create_image use the plan's monthly allowance. Sign-in runs the pinned mcp-remote@0.1.49 through npx (Node.js and npm required), which opens a browser and a local callback port on first use and stores OAuth tokens under ~/.mcp-auth. The package marks the server untrusted, so Hermes asks before every tool the server does not mark read-only and refuses them in unattended runs."
