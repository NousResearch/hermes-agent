subdir: public/byparr-tools
description: "Tools for any FlareSolverr-compatible challenge solver (Byparr, FlareSolverr): fetch solved HTML from a Cloudflare-walled page, harvest challenge cookies as a CDP payload to bridge into a browser, batch-fetch clean text for RAG, extract JSON-LD and metadata, check solver health, and retry a walled web_extract result through the solver via fail-open middleware. Every fetched URL passes the host URL policy, so loopback, private and cloud-metadata targets are refused. Disclosure: the tools open outbound HTTP connections to the solver address you configure in Settings, to an optional CDP browser endpoint for cookie injection, and to the URLs you ask them to fetch. Challenges are solved by a solver you run yourself; the plugin does not contact a hosted solver service."
maintainer: apoapostolov
