name: byparr-tools
repo: https://github.com/apoapostolov/hermes-agent-awesome-plugins
sha: 4f1802285f452d6d7fd29ba23c2435189c3c1acb
subdir: public/byparr-tools
description: "First-class tools for any FlareSolverr-compatible challenge solver (Byparr, FlareSolverr): fetch solved HTML from a Cloudflare-walled page, harvest challenge cookies as a CDP payload to bridge into a browser, batch-fetch clean text for RAG, extract JSON-LD and metadata, check solver health, and retry walled web_extract or browser_exec results through the solver via fail-open middleware. Disclosure: the tools open outbound HTTP connections to the solver address you configure in Settings, to an optional CDP browser endpoint for cookie injection, and to the URLs you ask them to fetch. Challenges are solved by a solver you run yourself; the plugin does not contact a hosted solver service."
maintainer: apoapostolov
tier: community
category: tools
