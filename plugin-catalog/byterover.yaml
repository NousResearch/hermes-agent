version: "1.0.2"
description: ByteRover memory provider — persistent knowledge tree with tiered retrieval (fuzzy text, then
  LLM-driven search), local-first with optional cloud sync. Formerly bundled with Hermes; maintained
  by Nous Research. Disclosure — needs the external brv CLI (installed separately; its documented
  installer is a curl-to-shell script from byterover.dev, or npm), which the provider runs as a
  subprocess on recall and turn sync; with BRV_API_KEY set, brv syncs memories to ByteRover's cloud.
maintainer: NousResearch
tier: official
category: memory
requires_hermes: ">=0.21.4"
