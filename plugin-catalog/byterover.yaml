description: "ByteRover memory provider: a persistent knowledge tree with tiered retrieval (fuzzy text, then LLM-driven search) through the external brv CLI, local-first with optional cloud sync; tools brv_query, brv_curate and brv_status, plus automatic per-turn and pre-compression capture. Formerly built into Hermes core; existing users are migrated automatically. A Hermes Labs plugin: built by Nous Research, not supported, and likely not maintained going forward. Fixes from the community are welcome. Disclosure — needs the brv CLI, installed separately (npm byterover-cli, or ByteRover's install script); the provider runs brv as a subprocess on every turn's recall and, in the background, on each substantive turn, each entry added to or replaced in the built-in MEMORY/USER stores and before context compression, passing up to the last 2,000 characters of the user and assistant messages; the knowledge tree lives in $HERMES_HOME/byterover; with BRV_API_KEY set, brv syncs that tree to ByteRover's cloud."
