sha: 6db63fe2cab9335d70b4ed3a523f37e6a79b13e2
description: "Answers about your own health that cite your DNA, Apple Health trends, medical records and new research, from a vault on your machine. Caduceus imports 23andMe, AncestryDNA, MyHeritage or FamilyTreeDNA raw data, a Promethease report, an Apple Health export and US health records (FHIR) into local SQLite, then gives your agent gene–drug checks (CPIC guidelines plus GLP-1 research), trends before and after a medication start, a rebuilt variant report, a one-page brief for your doctor and a research watch that puts studies on your own gene–drug pairs first. No DNA file yet? /caduceus demo loads an invented person to try it. Privacy levels are yours to choose: open by default, or standard, which hides Alzheimer's risk, hereditary cancer risk, carrier status, mental health and reproductive results until you unlock them. Information with limits, not medical advice. Disclosure — imports, search and reports run locally, and the vault is never uploaded as a whole; tool results (slices of your data) enter the conversation, so the model provider you chose sees them; a hook adds one fixed note, holding none of your data, to the first health, medication or DNA question of each chat when the vault has data (off with the `vault_hint` setting); the research watch (on by default, runs when you or the agent ask for it or on a schedule you create, off with the `research_watch` setting) sends gene and topic terms, the names of medications you recorded, and public marker and article IDs, never genotypes, to Europe PMC and NCBI; scheduled checks run model turns billed like any message; no telemetry. Includes a report-a-problem skill: the agent drafts a bug report, asks you to check it holds no health data, and files it to this repository with `gh` only after you approve the draft."
maintainer: 100yenadmin
