name: calendar-agenda

repo: https://github.com/sanpeita/hermes-calendar-agenda

sha: f2f0f9dc2798b0a6b3caf81379300ab107f35d30

description: Google Calendar agenda pane and outcome tracker — records what actually happened to each planned event (done / interrupted / cancelled / skipped, slot kept or released) in private extended properties, never touching titles or Google event status.

maintainer: sanpeita

tier: community

category: automation

requires_hermes: ">=0.21.5"

version: "0.1.0"

title: Google Calendar Agenda

known_issues:
  - "Requires the google-workspace skill installed and authorized in the same Hermes profile; Google credentials are used through that skill, never read by the plugin directly."
  - "Timezone is currently fixed to Asia/Tokyo (a constant in calendar_agenda_service.py)."

capabilities:
  provides_tools:
    - calendar_agenda_list_today
    - calendar_agenda_set_state
  provides_hooks: []
  provides_middleware: []
  requires_env: []
