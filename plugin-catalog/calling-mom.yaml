known_issues:
  - "Hermes has no public Kanban API for plugins yet: reading boards and their cards, and the writes behind answering, moving, parking (schedule_task), unblocking, completing, archiving and pinning a card to a model all go through hermes_cli.kanban_db / kanban_db_boards / kanban_db_connect; dashboard writes go through tools.registry dispatch (kanban_create and the other public tools). Every private import lives in one file, _core.py (kanban_db, kanban_db_boards, kanban_db_connect, agent.redact, hermes_cli.config, hermes_cli.profiles, hermes_cli.model_switch_providers, hermes_cli.curses_ui, hermes_state.SessionDB, agent.plugin_llm, tools.registry, gateway.session_context); if a Hermes update removes one, the plugin stays loaded, registers no hooks and 'hermes calling-mom doctor' names the cause."
  - "A gateway restart is needed after the plugin updates: its dashboard routes are imported when the gateway starts, so a running gateway keeps answering the old routes and the page's newer ones 404 until it restarts (the New card form says so)."
  - "A phone notice starts one 'hermes send' process (a few seconds); the sweep waits at most 15 s for it and the card stays in Needs you if the send fails."
  - "Advice arrives after the tool ran (transform_tool_result): it warns, it cannot prevent a command."
  - "The risk list is pattern based; an unusual command or secret format can pass."
