capabilities:
  provides_tools: [second_opinion, calling_mom_answer]
  provides_hooks: [kanban_task_claimed, kanban_task_blocked, on_kanban_worker_exited, transform_tool_result, on_kanban_dispatch_tick, pre_tool_call, post_api_request, on_human_input_request, on_human_input_resolved, api_request_error]
  provides_middleware: []
  requires_env: []
known_issues:
  - "Hermes has no public Kanban API for plugins yet: pinning a card to a model, unblocking it and reading boards go through hermes_cli.kanban_db. All private imports live in one file, _core.py; if a Hermes update removes one, the plugin stays loaded, registers no hooks and 'hermes calling-mom doctor' names the cause."
  - "Advice arrives after the tool ran (transform_tool_result): it warns, it cannot prevent a command."
  - "The risk list is pattern based; an unusual command or secret format can pass."
