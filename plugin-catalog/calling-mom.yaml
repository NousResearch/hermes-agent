version: "1.7.1"
title: Calling mom
description: "Lets a cheap model run your Kanban board and calls a stronger model only where the board or the tool results show it is needed. Mom (a good, affordable model) answers stuck signals, risky commands and completion checks; olymp (the expensive heavyweight) is asked only when mom escalates a rare high-stakes case, with hard limits per card and per day. Disclosure — once enabled, the plugin observes every kanban worker tool result (hashes and counts only, logged to logs/calling-mom.jsonl). With the advisor enabled AND a board or card opted in, redacted run excerpts go through Hermes's ctx.llm to the mom and olymp models you choose; the answer is appended to the tool result and written to the card with the public kanban_comment tool. A card line verify: <command> runs an allowlisted command (no shell, scrubbed environment) for cards created by trusted creators. hermes calling-mom setup writes the plugin's own config (calling_mom.* and its plugins.entries allowlist) with the values you pick, reads delegation.backends.model_map (read-only, to offer your Advanced Delegation routes) and creates one cron job, 'calling-mom: sweep', unless you pass --no-cron; the sweep reads the kanban databases and may push metrics to Pushgateway URLs you configure (off by default). No telemetry, no credentials stored. Since 1.4: a Desktop page (Needs you, Active cards, recent activity, status-bar chip) served by the plugin's dashboard route; it reads the log and the opted-in boards, writes only when you press a button (an answer card comment, a card move), and shows each running card's last assistant message read through Hermes' SessionDB (read-only, local, never sent to a model). web_verify (off by default) sends a one-line redacted claim to Hermes' own web_search tool. The sweep and the optional chat-wait count read board events and the human-input hooks (kinds and seconds only, never prompt or answer text). The plugin sends nothing to a server of its own; details in SECURITY.md of the repo. Since 1.7.0: what waits under \"Needs you\" is also sent once to your phone through Hermes' own messaging (setting calling_mom.notify.target, default off), and a reply there answers the card via the new tool calling_mom_answer; a held critical command can be fail-closed (opt-in calling_mom.preflight.fail_closed) so it stays blocked when Mom cannot check it; a new card can be started from the Dashboard page (POST /card through Hermes' public kanban_create); a card can be parked with \"Decide later\" and resumed from the Later section. Since 1.7.1: that New card form can also pin the card's model (a model of one of your authenticated providers, sent to kanban_create as model/provider; GET /new-card lists them)."
