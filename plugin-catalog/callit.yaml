version: "1.2.0"
title: CALLIT
description: "Turn any group chat into a prediction league: friends make calls on crypto prices, football or anything, challenge each other to 1v1 duels, run closest-guess pools, and Hermes referees — it settles from live data (or a named judge / weighted group vote) and keeps season leaderboards. Duels staked in SOL/USDC/USDT lock both stakes in an on-chain Solana escrow program (immutable, devnet by default) that can only pay the two players; Hermes signs the result with a per-install referee key and both players are refunded if it never does. Disclosure — makes read-only HTTPS calls to api.coingecko.com and site.api.espn.com, and calls the configured Solana RPCs (public mainnet RPC to verify `/callit paid` receipts; devnet by default for the escrow) to read bets, request devnet fee top-ups and send settle transactions signed by the referee key `CALLIT_RESOLVER_KEY` (a Hermes secret that holds only fee SOL, never a player's key); duel stakes sit in an unaudited, immutable escrow program that can only pay one of the two players or refund both, so use it for devnet/testing only; duel stake links open a page on the author's GitHub Pages site, which is outside the reviewed code and builds the transaction you sign in your wallet; stores calls, sides, votes, points, debts, public Solana addresses and an audit log in plugin-data/callit/data.db; `/callit referee on` creates one visible Hermes cron job that only referees its own chat's league; no shell commands, no telemetry."
maintainer: k58v2hbzkk-del
tier: community
category: tools
requires_hermes: ">=0.22.5"
capabilities:
  provides_tools: [callit_make_call, callit_duel, callit_pool, callit_play, callit_join, callit_vote, callit_board, callit_referee]
  provides_hooks: []
  provides_middleware: []
  requires_env: []
