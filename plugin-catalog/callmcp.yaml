description: |
  Give your Hermes agent a phone number. Ask it to call the pharmacy, the landlord or a shop: Kai places the call, gets through the phone menu, asks your question and reports what they said. If Kai needs something only you know, Hermes asks you mid-call.

  - Calls US and Canada businesses for you; your first call to a business line is free
  - Waits on hold and rings you when a real person picks up
  - Texts from its own number and takes the callback
  - Joins Zoom, Google Meet, Microsoft Teams or Webex meetings and emails you a summary
  - Bundles the callmcp skill; Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only

  Disclosures
  - Hosted-only connector with no local code: every tool call, with its arguments, goes to callmcp.ai (Streamable HTTP, API key auth).
  - Call audio, transcripts, texts, meeting notes and phone numbers are handled by KaiCalls, the company behind CallMCP; after the free first call, use counts toward a paid KaiCalls plan.
  - The package marks the server untrusted, so Hermes asks before every call, text or meeting.
  - The key is read from CALLMCP_API_KEY in the profile .env (or the plugin's settings form) and sent as a bearer header.
  - Same company as the kaicalls entry, different job: kaicalls runs a business's own phone line; callmcp gives the agent a number to make calls for its user.
  - The tool set is served by the remote server at runtime and is not covered by the pinned sha. No telemetry.
maintainer: KaiCalls
