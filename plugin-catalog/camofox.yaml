  - browser_navigate
  - browser_snapshot
  - browser_click
  - browser_type
  - browser_scroll
  - browser_back
  - browser_press
  - browser_get_images
  - browser_vision
  - browser_console
  - browser_import_cookies
  provides_hooks:
  - on_session_end
  - on_session_finalize
  provides_middleware: []
  requires_env:
  - CAMOFOX_URL
