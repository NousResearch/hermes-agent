description: "Page content as clean Markdown for the built-in web_extract tool, through the CaptureKit Content API. Extract only; pair it with a search backend for web_search. Disclosure — sends each URL to api.capturekit.dev with your CAPTUREKIT_API_KEY, and calls can use CaptureKit credits. Reads the key only through Hermes's secret scope. Registers no tools, no hooks or middleware, writes no files, starts no processes, has no telemetry or self-updater, and uses only the Python standard library."
