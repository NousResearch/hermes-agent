name: capturekit
title: CaptureKit
repo: https://github.com/capturekitdev/hermes-plugin-capturekit
sha: 22a177b360314bad6cc265e484dc71afc3de911e
version: "1.1.0"
description: "Web pages for Hermes through the CaptureKit API: page content as Markdown with metadata and links, screenshots and PDFs (full page, one element or a mobile view), and an AI profile of a page. Also a backend for the built-in web_extract tool. Disclosure — sends each URL and the tool arguments to api.capturekit.dev with your CAPTUREKIT_API_KEY, and calls use CaptureKit credits (1 per call; usage is free). capturekit_analyze has CaptureKit read the page with an AI model on its side. Reads the key only through Hermes's secret scope. Registers 4 tools and a web_extract backend, no hooks or middleware, writes one image or PDF per capturekit_screenshot call under $HERMES_HOME/cache/screenshots/ and no other files, starts no processes, has no telemetry or self-updater, and uses only the Python standard library."
maintainer: capturekitdev
tier: community
category: web
requires_hermes: ">=0.21.6"
docs_url: https://github.com/capturekitdev/hermes-plugin-capturekit#readme
readme: true
platforms: []
capabilities:
  provides_tools:
    - capturekit_page_content
    - capturekit_screenshot
    - capturekit_analyze
    - capturekit_usage
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - CAPTUREKIT_API_KEY
