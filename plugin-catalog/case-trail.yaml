description: "Trace case-history and treatment research to actual opinion passages; analyze supplied sources without a required repository. Disclosure: Sends search queries through the web provider you configured in Hermes and can fetch one public OpenJurist case page you select after a robots check. Stores source text and review notes privately. Novelty research tool, not legal advice; unaffiliated with Justia or OpenJurist."
