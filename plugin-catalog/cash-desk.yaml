    - cashdesk_queue
    - cashdesk_import
    - cashdesk_match
    - cashdesk_draft
    - cashdesk_revise
    - cashdesk_reply
    - cashdesk_hold
    - cashdesk_send
  provides_hooks:
    - pre_tool_call
    - subagent_start
    - subagent_stop
    - transform_llm_output
  provides_middleware: []
  requires_env: []
