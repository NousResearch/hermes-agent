known_issues:
  - "Imports CSV exports; there is no live connection to a bank or an accounting system."
  - "Reminders are in English; you can choose another language per customer or with default_language (Czech is the only other one so far)."
  - "With guard_outgoing_messages on, replies in that profile arrive whole instead of streaming."
capabilities:
