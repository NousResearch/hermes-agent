subdir: plugins/catalogo-it
title: Plugin Catalog (Italian)
description: >-
  The official Hermes plugin catalog in a native page (sidebar entry, route
  /catalogo, plus a command-palette entry) with an Italian interface and
  on-the-fly Italian descriptions: Google Translate first, MyMemory as a second
  public source, and a final fallback to the user's own local llama.cpp model.
  Disclosure — it fetches the public catalog feed
  (hermes-agent.nousresearch.com), translate.googleapis.com and
  api.mymemory.translated.net, and sends the plugin description to the local
  model endpoint only as the last fallback. That endpoint and its key come from
  Hermes' own config (model.base_url) and from the key Hermes generated for the
  local server ($HERMES_HOME/runtimes/llamacpp/.api_key), read through the
  plugin's own backend route; no credential is stored or sent anywhere else.
  Translation runs when a plugin entry is opened, not for the whole catalog.
  No telemetry. UI is Italian-first with an English bundle.
maintainer: Lazzdaycod
