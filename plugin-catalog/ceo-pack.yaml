sha: 0d019941743f4f885797874679862204a465ddc3
description: "CEO Pack gives you an AI C-suite inside Hermes. You say what your business needs in plain words, and the pack turns it into a plan — it works out which seat should own each job (money, legal, marketing, tech, operations, or the chief of staff), assigns it, and checks the work before calling it done. Anything big, priced, or hard to undo stops and asks for your approval first, so you stay the boss. v0.5.0 adds a dashboard tab with a live org chart, task board and approval center, a persistent task registry, delegation you can configure from chat, and a native Desktop plugin. Every answer is ELI5 — plain words a business owner can follow. For developers — stdlib-only, no network calls and no model calls. The plugin routes and verifies work on your Hermes model, suggests a free model by default, and keeps every task, decision, and run in a local registry. Disclosure — Type 1 approval is flag-not-block in v0.5.0: a task flagged approval_required waits for your approval in chat or the dashboard, but the assignment call itself does not block an unapproved task; a blocking pre_tool_call gate is design-only."
