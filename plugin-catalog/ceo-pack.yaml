platforms: []
known_issues:
  - Type 1 approval is flag-not-block in v0.5.0: a task flagged approval_required waits for owner approval in chat or the dashboard, but ceo_task_assign does not block an unapproved task; a blocking pre_tool_call gate is design-only.
  - Plugins are per-profile: install in the default profile (or the profile you work in); ceo-pack does not appear in other profiles.
  - The Desktop page needs a full Desktop app restart after updating (the shell syncs the desktop file at startup, not on reload); the gateway must also restart for live seat times.
  - No ceo_task_complete tool yet; ceo_assign does not track duplicates; ceo_task_create has no due-date field (use ceo_assign for dated work).
