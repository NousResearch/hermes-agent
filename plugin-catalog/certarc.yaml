description: "Practise free scenario questions for the CISM, CISSP, CISA, AAISM and AAIA exams in Hermes, with an explanation for every option. No account or keys. Also covers exam outlines and CertArc study guides, and can link to CertArc's free assessment when you finish a set. Bundles the certarc-practice skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to certarc.com through its free no-sign-in endpoint (https://certarc.com/mcp/grok, built first for Grok and usable by any MCP client), and the assessment links carry a source tag. The user opens those links and signs in themselves. The endpoint offers four tools, all annotated read-only, and none reads a learner's own study. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
