name: charter-tool
repo: https://github.com/drew-dot-com/hermes-toon
sha: 29d3b66e32a346b4f897c351ce24d83efb97e27f
version: "0.3.0"
subdir: src/charter_tool
description: >-
  Rent compute on Charter (charter.mainnet.toonprotocol.dev) from the agent's own toon node:
  charter_rent rents one short lease and runs one job in it, a fetch of 1 to 5 URLs or a Python 3
  script of at most 8 KiB with no network, and returns the output with what the call spent.
  Disclosure: every call spends real USDC from the operator's toon node wallet with no per-call
  confirmation, 0.001 USDC to open plus 0.007 USDC per one hour interval (at most 0.008 USDC per
  call at the default cap of 1 interval, 5 leases a day); CHARTER_MAX_INTERVALS and
  CHARTER_DAILY_LEASES are the operator's controls, with CHARTER_ALLOWED_IDS to limit who may call
  it. The plugin runs the operator's charter CLI (or CHARTER_BRIDGE_CMD) as a subprocess and hands
  it the TOON_PASSPHRASE_FILE path; it never reads the passphrase or any .env file itself.
maintainer: drew-dot-com
tier: community
category: tools
requires_hermes: ">=0.21.3"
docs_url: https://github.com/drew-dot-com/hermes-toon#third-plugin-charter-tool
platforms: [linux, macos]
capabilities:
  provides_tools:
    - charter_rent
  provides_hooks: []
  provides_middleware: []
  requires_env: []
