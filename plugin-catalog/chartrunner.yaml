description: "Read-only tools for ChartRunner, a gamified trading app on Solana: launch radar (new, trending, graduated) with the server's safety level and flags, the public buy verdict for a mint with a terminal review link, real-mode perp chart links for BTC, ETH, SOL, HYPE and DOGE, room and SIM battle links, finished cup standings checked against the anchor ChartRunner published, and a local verifier that rebuilds a chartrunner:v1 memo root from rows or a Merkle proof. Bundles one skill (desk) on when to use each tool and what a memo match does not prove. Hermes never signs: the tools return links, and every swap or perp order is reviewed in ChartRunner and signed by the user's own wallet. Disclosure: chartrunner_radar, chartrunner_spot and chartrunner_cup send unauthenticated HTTPS GET requests to https://chartrunner-app.vercel.app (override with CHARTRUNNER_ORIGIN) with the tab, mint or cup code the user asked about; no keys, cookies or wallet data are sent or stored. The other tools make no network calls. The cup anchor check compares against the anchor record from ChartRunner's API and does not read the Solana transaction."
