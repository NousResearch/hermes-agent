name: chat-shield
repo: https://github.com/james-see/chat-shield
sha: 75c4c0921df3f9ac5e87aaabba32d6b87a9eb5a0
description: "Automatically redacts personally identifiable information — names, addresses, emails, phone numbers, SSNs, financial accounts, government IDs, API keys, credit cards — before it reaches external LLM providers. Combines the on-device Rampart NER model (14.7 MB, runs locally) with configurable regex detectors for specialized identifiers. The LLM sees safe placeholders; the user sees original values restored. Two middleware hooks: llm_request redacts outgoing messages, llm_execution restores placeholders in the response (streaming and non-streaming). Includes /chat-shield slash command for stats and testing, config schema for the Desktop Settings form, and a bundled skill. Falls back to regex-only if the Rampart model is unavailable."
maintainer: james-see
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://github.com/james-see/chat-shield/blob/859abb51a3374c121d56cd5a0ad2c3b4ecc38f1b/README.md
version: "1.0.0"
platforms: []
capabilities:
