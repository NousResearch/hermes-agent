description: "One window for branching chats in Hermes Desktop. A side pane draws the open chat and its branches as a git graph, one node for each exchange. Branch from a node, ask on a model you pick, and merge back into any ancestor chat with Merge as-is or Digest. The model writes each digest through ctx.llm (auxiliary task chat_tree_digest, which follows the title generation model unless you set auxiliary.chat_tree_digest). Disclosure — Desktop pane reads up to 500 persisted session summaries and the transcripts, usage and subagent lists of the chats in the open lineage; it branches, resumes a chat, submits a prompt or sets a branch's model only when you click; Digest sends up to 24,000 characters of one chat (secrets redacted) to your configured auxiliary model (chat_tree_digest, defaults to the title-generation model) and only drafts the result in the composer; the Python history RPC opens the profile's state.db read-only for at most 30 chats of the open lineage; branch ids are shared with the side-chat plugin through the localStorage key __hermesSideChatBranchIds."
