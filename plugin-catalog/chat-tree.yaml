name: chat-tree
title: Chat Tree
repo: https://github.com/Ronitron007/hermes-chat-tree
sha: "e9c1d79bd9f7081dba850d7395d6fbb1f417a92d"
subdir: chat-tree
description: >-
  One window for branching chats in Hermes Desktop. A side pane draws the open
  chat and its branches as a git graph, one node for each exchange. Branch
  from a node, ask on a model you pick, and merge back into any ancestor chat
  with Merge as-is or Digest. The model writes each digest through ctx.llm
  (auxiliary task chat_tree_digest, which follows the title generation model
  unless you set auxiliary.chat_tree_digest). Disclosure: the desktop half
  reads up to 500 persisted session summaries (host.listPersistedSessions),
  the messages of the chats in the open lineage (session.transcript,
  session.history), context sizes (session.usage, session.stats,
  session.context_breakdown) and subagent.list. It calls session.branch only
  when you click Branch. It calls prompt.submit only for the question that you
  typed for a branch, and for Merge as-is, which sends the merge text as a
  message in the ancestor chat that you picked. Digest puts its text into the
  composer of the ancestor chat as a draft (host.composer.setDraft) and never
  sends it. config.set sets the model that you picked for a branch. A node click sends the app event hermes:timeline-reveal to the
  main chat viewport and scrolls the exchange into view. It finds the
  viewport and the exchange through app markup (data-session-anchor,
  data-slot, data-message-id). This is outside the Desktop SDK surface
  (catalog rule 8), because the SDK has no scroll API. The pane keeps its
  branch ids and digests in its plugin storage. It also shares
  its list of branch ids with the side-chat plugin (localStorage key __hermesSideChatBranchIds).
  The Python half serves two plugin RPC methods.
  plugin.chat-tree.digest.write sends the exchanges of one chat (at most
  24,000 characters, secrets redacted) to your configured model and returns
  the digest as a session event. plugin.chat-tree.history.read opens the
  local session store of Hermes (state.db in the profile home) read-only
  through hermes_state.SessionDB. It returns the messages of at most 30 chats
  of the open chat's lineage, never a hidden or archived chat, and at most
  400,000 characters of text. That text stays on the machine and goes to no
  model. No other network calls, credentials, file writes, shell, telemetry
  or self-updater.
