description: "Complete 2,545-question bilingual China Subject 1 driving exam bank with SuperMemo-2 (SM-2) spacing grader, MPS Order No. 172 bilateral treaty swap checker (FR/BE/AE/RS/HK/MO), 9 international airport 15-minute temporary permit desks, 5 municipal DMV guides, 25 GB5768 road signs, and Chinese DMV translation mapper through ChinaDriveTest's official MCP server (Streamable HTTP at https://chinadrivetest.com/api/mcp, no sign-in, no keys in config). Bundles the chinadrivetest workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure - hosted-only connector with no local runtime code, binaries, hooks, telemetry or self-updater; every tool call goes over HTTPS to chinadrivetest.com/api/mcp with only the question keyword, jurisdiction, airport code or route query arguments. All 8 tools are public, free, and annotated read-only (readOnlyHint: true, destructiveHint: false). The package marks the server untrusted (trust: untrusted), so Hermes asks before any tool not annotated read-only and refuses them in unattended runs. The remote tool inventory is served at runtime and is not covered by the pinned sha. Disclosure — hosted-only connector with no local runtime code, binaries, hooks, telemetry or self-updater; every tool call goes over HTTPS to chinadrivetest.com/api/mcp with only the question keyword, jurisdiction, airport code or route query arguments. All 8 tools are public, free, and annotated read-only (readOnlyHint: true, destructiveHint: false). The package marks the server untrusted (trust: untrusted), so Hermes asks before any tool not annotated read-only and refuses them in unattended runs. The remote tool inventory is served at runtime and is not covered by the pinned sha."
