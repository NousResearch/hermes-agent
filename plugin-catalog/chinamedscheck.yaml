description: "38-medication China Customs GACC Decree 442 legality screener, supply-allowance calculator, CAAC cabin sharps and cold-chain evaluator, bilingual pharmacy card generator, 4-airport Red Channel walkthroughs (PVG/PEK/CAN/PKX), and therapeutic substitute mesh through ChinaMedsCheck's official MCP server (Streamable HTTP at https://chinamedscheck.com/api/mcp, no sign-in, no keys in config). Bundles the chinamedscheck workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure - hosted-only connector with no local runtime code, binaries, hooks, telemetry or self-updater; every tool call goes over HTTPS to chinamedscheck.com/api/mcp with only the medication name, dosage, itinerary or airport query arguments. All 8 tools are public, free, and annotated read-only (readOnlyHint: true, destructiveHint: false). The package marks the server untrusted (trust: untrusted), so Hermes asks before any tool not annotated read-only and refuses them in unattended runs. The remote tool inventory is served at runtime and is not covered by the pinned sha."
