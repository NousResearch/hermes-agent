description: "China Top Tier-3A International Medical Center (IMC) procedure cost estimator, medical travel itinerary planner, and bilingual chief physician triage through ChinaMedVisit's official MCP server (Streamable HTTP at https://chinamedvisit.com/api/mcp, no sign-in, no keys in config). Benchmarks 50+ self-pay procedures (PET-CT, 3T MRI, painless endoscopy) with 70%-90% savings vs US cash rates. Bundles the chinamedvisit workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local runtime code: every tool call goes over HTTPS to chinamedvisit.com/api/mcp with the clinical query you give it (procedures, symptoms, travel dates), and the remote tool list is served by ChinaMedVisit at runtime, not covered by the reviewed pin; the package marks the server untrusted, so Hermes asks before any tool not annotated read-only and refuses those in unattended runs. Cost and triage output is the vendor's estimate, not medical advice."
