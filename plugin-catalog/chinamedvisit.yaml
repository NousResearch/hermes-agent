description: "China Top Tier-3A International Medical Center (IMC) procedure cost estimator, medical travel itinerary planner, and bilingual chief physician triage through ChinaMedVisit's official MCP server (Streamable HTTP at https://chinamedvisit.com/api/mcp, no sign-in, no keys in config). Benchmarks 50+ self-pay procedures (PET-CT, 3T MRI, painless endoscopy) with 70%-90% savings vs US cash rates. Bundles the chinamedvisit workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local runtime code, binaries, hooks, telemetry or self-updater; every tool call goes over HTTPS to chinamedvisit.com/api/mcp with only clinical query arguments. All tools are public, free, and annotated read-only (readOnlyHint: true, destructiveHint: false). The package marks the server untrusted (trust: untrusted), so Hermes asks before any tool not annotated read-only and refuses them in unattended runs. The remote tool inventory is served at runtime and is not covered by the pinned sha."
