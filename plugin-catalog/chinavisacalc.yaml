description: "China SAFEA Category A/B/C work permit scorer across employee, native teacher and WFOE tracks, score-deficit upgrade advisor, Circular [2023] No. 29 expat IIT vs SAD refund simulator, Labor Contract Law Art. 37/50 30-day job-transfer runway calculator, 21-country Apostille rules, and 7-city hub comparison through ChinaVisaCalc's official MCP server (Streamable HTTP at https://chinavisacalc.com/api/mcp, no sign-in, no keys in config). Bundles the chinavisacalc workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure - hosted-only connector with no local runtime code, binaries, hooks, telemetry or self-updater; every tool call goes over HTTPS to chinavisacalc.com/api/mcp with only the salary tier, resignation date, country code or city query arguments. All 8 tools are public, free, and annotated read-only (readOnlyHint: true, destructiveHint: false). The package marks the server untrusted (trust: untrusted), so Hermes asks before any tool not annotated read-only and refuses them in unattended runs. The remote tool inventory is served at runtime and is not covered by the pinned sha. Disclosure — hosted-only connector with no local runtime code, binaries, hooks, telemetry or self-updater; every tool call goes over HTTPS to chinavisacalc.com/api/mcp with only the salary tier, resignation date, country code or city query arguments. All 8 tools are public, free, and annotated read-only (readOnlyHint: true, destructiveHint: false). The package marks the server untrusted (trust: untrusted), so Hermes asks before any tool not annotated read-only and refuses them in unattended runs. The remote tool inventory is served at runtime and is not covered by the pinned sha."
