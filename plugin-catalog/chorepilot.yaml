  provides_tools:
    - chorepilot_status
    - chorepilot_chores
    - chorepilot_who_has
    - chorepilot_done
    - chorepilot_whoami
    - chorepilot_tools
    - chorepilot_call
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - CHOREPILOT_URL
    - CHOREPILOT_TOKEN
