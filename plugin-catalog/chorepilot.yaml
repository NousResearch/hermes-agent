version: "0.7.0"
description: "Your house and family chore board as Hermes tools, through ChorePilot's own MCP server on this machine, the LAN or Tailscale. Runs appliances (lights, climate, dishwasher/washer/dryer, sprinklers, vacuum and more via Home Assistant, Home Connect, MQTT or a simulator) and keeps a rotating chore board that devices verify. ChorePilot's policy decides every call: water/heat actions wait for the person's own yes in Telegram or the ChorePilot dashboard, kids' requests go to a parent's approval queue, and locks/alarm are never available to an agent. Bundles the chorepilot:household skill. Disclosure: each tool call is one HTTP request to the user's own CHOREPILOT_URL with the bearer token from CHOREPILOT_TOKEN (plain http only to loopback, private ranges, .local/.lan/.ts.net); no other network calls, no files read outside the plugin, no background processes, no telemetry. Stdlib only, no Python dependencies."
maintainer: WestWaters
tier: community
category: tools
docs_url: https://github.com/WestWaters/ChorePilot/blob/main/docs/HERMES.md
requires_hermes: ">=0.21.5"
