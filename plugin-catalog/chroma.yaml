title: Chroma
description: 'Theme browser and manager for the Hermes Desktop: browse 94 skins by pack, colour family
  or gallery, import VS Code and terminal themes, edit a skin''s palette, and apply a theme to this
  profile or everywhere. A Desktop plugin (desktop/plugin.js inside the plugin SDK surface) with a
  backend half that mints real gateway skins so the CLI and every connected Desktop follow the
  change; no agent tools, hooks, middleware or env vars. Derived from hermes-theme-picker by
  jdtimothy (MIT) - see the disclosure below.'
maintainer: TobiasDraven
