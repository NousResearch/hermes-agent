name: chronomancer
title: Chronomancer
repo: "https://github.com/mordor-forge/chronomancer"
sha: "3d173022c7fbab883733ab048c64effc551ee452"
description: "A shared plan for the Kanban cards of every profile on a gateway. Give a card a slot (a planned start and an estimate): the plugin parks the card and releases it at the start, with no cron job. Hermes Desktop shows one timeline with a lane per profile; drag a card to plan or move it. Slots that overlap and share a one-at-a-time label show as clashes, with the reason and the next free start. An orchestrator agent plans through five tools. The plan advises: it never blocks a card or a tool call. Disclosure — reads and writes the Kanban board through Hermes's kanban tools only; its Desktop backend imports the private core module tools.kanban_tools to register those tools in the dashboard process (validate warns about it); stores card titles, profile names and labels in its own plan.db change log for 30 days; runs one daemon timer thread per process that loads it; no network calls, no shell commands, no credentials."
maintainer: Gdetrane
tier: community
category: desktop
requires_hermes: ">=0.22.7"
version: "0.1.0"
readme: true
capabilities:
  provides_tools:
    - chrono_plan
    - chrono_slot
    - chrono_now
    - chrono_clear
    - chrono_label
  provides_hooks: []
  provides_middleware: []
  requires_env: []
