name: chronos
repo: https://github.com/Shikhyy/hermes-agent
sha: "5b2a4b4a2c43e8a9b1e7bf8d32484a651bffedf0"
subdir: plugins/chronos
title: Chronos
description: >-
  Speculative branching: try several candidate fixes in isolated git
  worktrees, verify each against the project's tests through Hermes' terminal
  tool, and merge only a verified winner through Hermes' file tools.
maintainer: Shikhyy
tier: community
category: tools
requires_hermes: ">=0.4.0"
docs_url: https://github.com/Shikhyy/hermes-agent/blob/5b2a4b4a2c43e8a9b1e7bf8d32484a651bffedf0/plugins/chronos/README.md
version: "1.0.0"
capabilities:
  provides_tools:
    - chronos_branch
    - chronos_evaluate
    - chronos_merge
    - chronos_rewind
    - chronos_status
  provides_hooks:
    - on_session_start
    - on_session_finalize
  provides_middleware: []
  requires_env: []
