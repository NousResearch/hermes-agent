sha: "657e15c76d93dd63c4b7d34e29e3ff84f7fd830b"
title: CI Red to Green
description: "When a watched GitHub Actions run goes red, Hermes messages you with the failing pytest tests; reply fix and the agent fixes a clone, and a PR is offered only after the plugin's own reading of Hermes's terminal output shows each failing test FAILED before the change, PASSED three runs in a row after it, and no new full-suite failures. The PR commit holds source files only (no tests, test config or CI files), and the plugin reports the PR's own CI result. Disclosure: polls the GitHub API for the watched repo every 30 s while a watch is on (one background thread, stops on /ci stop or restart), downloads failed job logs without forwarding the token to the log host, and creates a branch, commit and pull request only when you pick Open PR, all with CI_RED_TO_GREEN_GITHUB_TOKEN read through Hermes's secret scope; the plugin runs no shell commands itself, while the agent clones the repo into plugin-data/ci-red-to-green/worktrees/ and runs its tests through Hermes's terminal tool, with the first such command escalated to Hermes's approval prompt and git push from that folder blocked; stores watch settings, the current incident and recorded test results in plugin-data/ci-red-to-green/; no telemetry."
