known_issues:
  - >-
    A session-scoped /yolo and one-shot runs (hermes -z, which bypass approvals by design) are not visible to
    plugins: there Hermes passes agent builds, flashes and serial port openings without asking. Keep 'Allow
    flashing real boards' off (the default) while you use either.
  - >-
    Real boards need PlatformIO Core (pio), esptool and serial port access (group dialout, or uucp on Arch); the
    simulation mode needs none of them. Real boards tested on Linux only (ESP32-S3-DevKitC-1 and WT32-ETH01);
    macOS is covered by CI in simulation mode; ESP32-C3, ESP32-S2 and ESP32-C6 are checked offline only.
  - >-
    On the command line, install with --enable (or answer 'Enable now?' with y); otherwise the tools and the
    Bench backend stay off. Without a terminal (scripts, SSH, an agent) also add --yes-deps; otherwise Hermes skips
    the dependencies and the plugin stays off. After a command-line install the Desktop half stays off until you switch on Desktop in
    the Circuit Bench row under Capabilities > Plugins; installing from Hermes Desktop turns it on.
  - >-
    A firmware stuck in a crash loop can keep the board from entering its bootloader on its own: hold BOOT, tap
    RESET, release BOOT and flash again.
capabilities:
  provides_tools:
    - bench_project
    - bench_pins
    - bench_calc
    - bench_schematic
    - bench_solder
    - bench_board
    - bench_crash
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
