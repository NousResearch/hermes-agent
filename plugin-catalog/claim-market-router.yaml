name: claim-market-router
title: Claim Market Router
repo: https://github.com/misakamikotoghr-5205/hermes-hackathon-plugins
sha: "60c6281f2ee003bd64b77deffe2ea8b1bdce98b6"
subdir: claim-market-router
version: "1.0.0"
description: "Market-based subagent delegation provider (`delegation.backend: claim_market`) and optional `llm_request` reasoning-effort shaper derived from MISAKA Agent and Watt Window. Publishes task cards (`role_needed`, `complexity`, `max_cost_units`), synthesizes capability-fit and quota-health claims with shadow pricing, resolves disagreements via weighted voting, and explains infeasible budget constraints. Disclosure — when set as the delegation backend, routes each delegated subagent task to a model chosen from the candidates you list in `delegation.backends.claim_market.candidates` (with none listed, tasks keep the parent's model); makes no network calls of its own, runs no subprocesses and reads no credentials; stores token-usage counts and auction receipts in `plugin-data/claim-market-router/data.db`; its `llm_request` middleware does nothing unless `auto_effort_shaping` is on, and then only lowers `reasoning_effort` on the outgoing request."
maintainer: misakamikotoghr-5205
tier: community
category: models
requires_hermes: ">=0.22.5"
docs_url: https://github.com/misakamikotoghr-5205/hermes-hackathon-plugins/blob/main/claim-market-router/README.md
platforms: []
capabilities:
  provides_tools:
    - claim_market_auction
    - claim_market_ledger
  provides_hooks:
    - post_llm_call
    - post_api_request
  provides_middleware:
    - llm_request
  requires_env: []
