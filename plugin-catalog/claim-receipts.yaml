name: claim-receipts
repo: https://github.com/gwelby/claim-receipts
sha: d2e41bb74b4b80c59c90b3fae95d197c5face002
title: "Claim Receipts: what the agent said vs what it did"
description: "Records the file changes and commands a session's hooks observe, then gives each prose claim in the session one of four verdicts against that record: backed, unbacked, unverifiable, contradicted. Compares a claim with a capture; does not prove it true. Disclosure — reads Hermes's own session database (~/.hermes/state.db) read-only at session end; writes an append-only ledger under the plugin data dir; records file paths and terminal command strings; runs no shell commands; no network."
maintainer: gwelby
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/gwelby/claim-receipts
version: "0.1.0"
platforms: [linux]
capabilities:
  provides_tools: []
  provides_hooks: [pre_tool_call, post_tool_call, on_session_end]
  provides_middleware: []
  requires_env: []
