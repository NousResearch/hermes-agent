    - clawcall_get_balance
    - clawcall_place_call
    - clawcall_get_call
    - clawcall_get_call_transcript
    - clawcall_list_calls
    - clawcall_get_recording
    - clawcall_hangup_call
    - clawcall_get_call_settings
    - clawcall_update_call_settings
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - CLAWCALL_API_KEY
