known_issues:
  - "Tested on macOS. Windows and Linux are untested."
  - "Every editor pass needs a model set in Hermes. Without one, a pass says so and offers Open Settings; Quick check, Other words and Bring in (except a link and dictation) still work."
  - "Bring in a link needs a web tool set up in Hermes, and Talk it through needs Hermes speech-to-text (or a faster-whisper speech model already downloaded). Without speech-to-text the Talk it through buttons are left out."
  - "Dictation imports tools.voice_mode.transcribe_recording, which is not in Hermes's public plugin API. It is guarded and falls back to faster-whisper, so a Hermes release that moves it can disable Hermes-backed dictation."
  - "Run live on a Claude model (Haiku) through Hermes. OpenAI and local-model routes are untested; a model that cannot return the answer format shows a plain message and leaves the page unchanged."
  - "On Hermes 0.21.6 to 0.22.5 there is no desktop file store: Save as .md and .txt offer Copy instead, and the scene photographs are fetched on each open. Not yet run on a real 0.21.6."
  - "Colors come from your Hermes theme. Text contrast was measured against stand-ins for Hermes's default light and dark themes and four accents over every scene; an unusual custom theme was not checked."
  - "Removing the plugin leaves your writing in <HERMES_HOME>/plugin-data/clearing/ until you delete that folder."
capabilities:
  provides_tools: []
  provides_hooks:
    - post_auxiliary_call
  provides_middleware: []
  requires_env: []
