name: clearing
title: The Clearing
repo: https://github.com/Dgardenhire/hermes-clearing
sha: f6310b4d29924be7087cdd650bccc31eafb7066a
description: "The Clearing is a writing editor inside Hermes with 159 editing methods you can run by name: 11 editor passes, 9 composition checks drawn from Strunk's rules, 33 editorial methods, 56 craft techniques and 44 figures of speech it can find in your draft or suggest where one would help. Press Read my piece and it marks your own words with what to change, most important first. Nothing changes until you press Use this. Three reviewers, a newcomer, a skeptic and a line editor, can each read the piece and then argue it out. When a suggestion adds a fact you never wrote, it says so before you keep it, and the page shows how much of the piece is still your own words. A built-in quick check and dictionary work without a model. An independent community plugin, not made or endorsed by Nous Research. Disclosure: no network calls of its own. Editor passes go to the model you set in Hermes, only when you start one, with secrets removed by Hermes first; Bring in a link hands a public address to Hermes's web_extract after refusing non-public hosts; dictation goes to Hermes speech-to-text and, for a cloud service, waits until you press Send. Reads only files you pick, plus Hermes's speech-to-text setting and the Hugging Face model cache, both read-only. No shell commands, background processes, stored credentials or telemetry; one observe-only post_auxiliary_call hook reads the finish reason, model name and token counts of its own calls. When it falls back to a local faster-whisper model it sets KMP_DUPLICATE_LIB_OK=TRUE in the Hermes process. Your writing, its versions and a quote-stripped debug.log stay in <HERMES_HOME>/plugin-data/clearing/; Delete forever in the Trash erases a piece."
