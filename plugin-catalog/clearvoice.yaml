known_issues:
  - "English is the reference language: 7 of the 17 languages rebuild a sentence with a checked grammar pack (en, fr, de, es, it, pt, nl). The other 10 polish punctuation, capitalisation and politeness but never re-order words, and the pane says so."
  - "Japanese and Thai need an extra phonemiser (clearvoice[ja] / clearvoice[th]); the pane prints the install command when one is missing."
  - "No speaker adaptation: a general Whisper on an atypical voice is weaker than a model trained on that speaker."
