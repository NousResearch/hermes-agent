description: "cloro web search backend: live Google Search results for the built-in web_search tool (search only; pair it with an extract backend for web_extract). Disclosure — sends each search query and the configured country to api.cloro.dev with your CLORO_API_KEY, and each search uses cloro credits. Reads the key only through Hermes's secret scope. Registers no tools, hooks or middleware, writes no files, starts no processes, has no telemetry or self-updater, and uses only the Python standard library."
maintainer: cloro-dev
tier: community
category: web
requires_hermes: ">=0.21.6"
