name: clotho
title: Clotho
version: "0.1.0"
repo: https://github.com/NicWeinbrecht/hermes-clotho
sha: c2eb4419df4367f4f564fbe1a0725e5148b2ba91
description: "Spin every future of a Hermes task before any of it happens. Every side effect is captured in a ledger instead of performed, you review one report, untick what you don't want, and Apply replays exactly the effects you kept with no model calls. `hermes clotho fork` runs the same task as several timelines under different models, compares their effect ledgers and applies the one you keep; `cron` rehearses a scheduled job; `demo` replays a recorded real fork with no API key. Disclosure — during a rehearsal, read-only tools run for real (file reads and search, skills, session search, web_search, clarify, todo, delegate_task in `hermes clotho run`), so a web search reaches its search provider and may be metered; page fetches (web_extract, vision_analyze and similar) are held. File writes go to an APFS copy-on-write clone of your workspace under <HERMES_HOME>/plugin-data/clotho/. Shell commands and execute_code run inside that clone under macOS sandbox-exec with no network and no writes outside it; on Linux, or without sandbox-exec, they are captured without a preview. Messages, web requests, MCP and other plugins' tools, cron changes and memory writes are captured, never run; the agent is told the reply is unknown and carries on, so its final text may say things happened that did not (the report is the truth), and captured calls still fire other plugins' post_tool_call hooks with status ok. Hermes' background memory and skill review can run during a rehearsal and spends model tokens; its writes are captured and cannot be applied. Reads outside the workspace are allowed except a deny-list of credential stores (the SSH, GnuPG, AWS, Kubernetes and Docker folders, the GitHub CLI login, .netrc, git credentials, the keychains, every .env file, and Hermes' own .env and auth.json); the ledger and report store command output and file contents in plain text under plugin-data, so they can hold whatever the rehearsed commands printed. Every effect is ticked by default, messages and web requests included, except tools Clotho does not know, held fetches and commands it cannot preview, which run only if you name them with --only. Apply runs the kept effects through Hermes' real tools in your terminal, where Hermes auto-approves its own dangerous-command prompt in non-interactive use, so your tick is the approval; a single plain curl or wget call is re-run as that exact command. Apply stops before any change when a file changed since the rehearsal, when a folder on an effect's path became a symlink, or when a ticked effect certainly depends on an unticked one (--force applies anyway), and it never re-sends what it already sent. Fail closed: a plugin error during a rehearsal blocks the tool call, and `hermes clotho run` refuses to start the model unless its tool middleware runs ahead of every other middleware, and refuses ACP providers and any Claude-subscription provider whose native tools it cannot verify are off. `/clotho on` in a live session keeps its state in memory only, so a gateway restart or failed plugin reload ends the rehearsal and later calls run for real. `fork` starts one `hermes clotho run` process per timeline at the same time, each making real model calls up to --max-calls. `demo` makes no model calls: it clones Hermes' runtime copy-on-write into a temp folder with no keys, runs a local sink, proxy trap and stand-in model endpoint on 127.0.0.1, and leaves that folder in place. No network calls of its own, no telemetry, no stored credentials. Each rehearsed command's process group is killed when it returns, and so is a child that started its own session; one that clears its environment and leaves the rehearsal's folders lives on, still inside the sandbox."
maintainer: NicWeinbrecht
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/NicWeinbrecht/hermes-clotho#readme
