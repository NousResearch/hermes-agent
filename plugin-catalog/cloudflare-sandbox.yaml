name: cloudflare-sandbox
repo: https://github.com/kiyo-e/hermes-cloudflare-sandbox
sha: 75961d77109b185bdaeef650cc9f945df0aa0551
version: "0.1.0"
description: "Run Hermes terminal, file and execute_code tools in Cloudflare Containers, with the workspace saved to a snapshot when idle. Disclosure — you deploy the bundled Cloudflare Worker to your own account first; running containers is billed by Cloudflare; commands and file contents run in the container at HERMES_CF_ENDPOINT using HERMES_CF_TOKEN; the container has outbound internet by default (ENABLE_INTERNET); host env vars, skills and credentials are not copied into the container; dangerous-command approval stays on."
maintainer: kiyo-e
tier: community
category: tools
requires_hermes: ">=0.20.6"
docs_url: https://github.com/kiyo-e/hermes-cloudflare-sandbox#readme
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - HERMES_CF_ENDPOINT
  - HERMES_CF_TOKEN
