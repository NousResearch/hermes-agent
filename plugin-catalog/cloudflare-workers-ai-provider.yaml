image: https://raw.githubusercontent.com/AhmetArif0/hermes-cloudflare-workers-ai-provider/f6821d058d504ee6324b0d3217564b93124c09f9/docs/card.png
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - CLOUDFLARE_WORKERS_AI_API_TOKEN
  - CLOUDFLARE_WORKERS_AI_BASE_URL
