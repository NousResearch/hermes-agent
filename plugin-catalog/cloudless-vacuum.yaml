name: cloudless-vacuum
repo: https://github.com/camescasse/hermes-cloudless-vacuum
sha: 88419305995d04c6d0d6acb2dded91f8e6dee0b5
description: "Control a robot vacuum that runs Valetudo through its local REST API: read the state, list rooms, clean rooms by name or segment ID, rename rooms (robot docked), start, stop, pause, dock or locate the robot, set fan, water and mode presets, and start dock actions (empty dustbin, mop wash, mop dry). Calls a fixed set of endpoints only, connects directly (ignores proxy settings) and follows no redirects: no map reset, room split or join, no-go zone, Wi-Fi or settings changes. Disclosure — sends HTTP requests only to the configured VALETUDO_URL on the local network, with optional basic auth from VALETUDO_USERNAME / VALETUDO_PASSWORD (clear text over http://); the tools move a physical robot with no confirmation step; room names, robot state and the VALETUDO_URL address (in error messages) reach the model provider as tool results; no telemetry, no stored state, no background processes, standard library only. Not affiliated with the Valetudo project."
maintainer: camescasse
tier: community
category: tools
requires_hermes: ">=0.22.6"
