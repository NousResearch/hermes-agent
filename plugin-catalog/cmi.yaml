title: CMI — Context Manager Intelligence
description: "Deterministic, zero-LLM context engine (context.engine: cmi): fewer tokens resent on every request, so sessions last longer on the same plan. Old tool results and stale screenshots become short digests and old write payloads are removed from past calls, while tool pairs and a byte-stable cache prefix are kept; every original is stored first and comes back byte-exact with cmi_recall. When enabled, a pre_tool_call hook blocks a write whose payload is a CMI stub; a stub write that went through is flagged at the next request with the file's last known content. Replay of 26 real sessions with the provider cache modelled: 30% fewer tokens on average (modelled API cost -25%); live 195-request sessions: 49% fewer tokens. Disclosure: originals and a full-text index (SQLite FTS5) are written under $HERMES_HOME (0700/0600, 30-day retention, 512 MiB cap); regex credential detection skips recognized secrets but can miss some; no network calls, no LLM calls, no dependencies. Project memory (experimental) is on for sessions opened in a Hermes Desktop project folder and stores only claims a model publishes with the user's exact words as proof; turn it off with context.cmi.auto_project_binding false."
