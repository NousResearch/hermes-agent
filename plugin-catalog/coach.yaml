  provides_hooks: [post_llm_call, pre_llm_call, pre_verify, post_tool_call, subagent_start, subagent_stop, on_session_end]
  provides_middleware: []
  requires_env: [OPENROUTER_API_KEY, TYPESAFE_API_KEY]
