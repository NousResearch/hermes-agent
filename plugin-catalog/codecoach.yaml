platforms: [linux]
known_issues:
  - "Running code needs bubblewrap (bwrap) and each language's own compiler or interpreter. A language is offered only after a hello-world compiled and ran in the sandbox on your machine; without bwrap CodeCoach refuses to run any code and says what to install. That is why the entry lists Linux only."
  - "Speed depends on your model. On a local 27B model the first lesson of a project you describe appeared 2 to 3 minutes after Start (measured on 1.0); later steps are built in the background while you code. The ready-made project needs no model and opens in seconds."
  - "PHP, Lua, Perl, Haskell, Zig, Elixir and Lisp are offered too, without a ready-made project and with less testing than the nine languages in the description. TypeScript is not supported."
  - "In Practice, a drill's explanation is the model's own prose and can be wrong even when the answer key, the program's real output, is right. Since 1.1.1 an explanation that names a printed number the real output does not hold is left out; one that is wrong in words only can still get through."
capabilities:
  provides_tools:
    - codecoach_import
    - codecoach_next
    - codecoach_answer
    - codecoach_hint
    - codecoach_progress
    - codecoach_report
    - codecoach_ask
  provides_hooks: []
  provides_middleware: []
  requires_env: []
