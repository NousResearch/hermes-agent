sha: "68cbfb6a78bc16f3fb60c4a8dac21e4882a8c20d"
title: CodeCoach
description: "Teach yourself to code in C, C++, Python, JavaScript, Java, Go, Rust, Ruby or Bash: build a real program one small step at a time, practice by predicting what code prints, and take no-hints tests. Every example really ran in a sandbox, every pass is a real test, and it warns you when your model is weak in a language. Disclosure — Code runs inside a bubblewrap sandbox (no network; system folders and a language's own toolchain folder are mounted read-only, the rest of your home folder is not mounted); if you turn on `allow_unsandboxed_code` on a machine without bwrap, learner and model-written code runs directly on your host as your user with no Hermes approval prompt. Imported .txt/.md/.pdf files (any non-hidden path you or the agent names) are sent to your configured model. It makes background model calls you did not press a button for (the next step, a spare drill, and five short warm-ups per language; the setting `auto_fit_check` turns the warm-ups off)."
maintainer: heyitstony97-max
tier: community
category: desktop
version: "1.1.1"
requires_hermes: ">=0.22.7"
docs_url: https://github.com/heyitstony97-max/codecoach
readme: true
