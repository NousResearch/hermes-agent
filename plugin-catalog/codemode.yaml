title: Codemode
description: "Code-as-Orchestration: the model writes one JavaScript snippet that calls your MCP tools (plus web_search/web_extract) in a QuickJS sandbox, loops and filters there, and returns only the answer. Tool schemas are found on demand with BM25 searchTools(). Disclosure — every run starts a short-lived local Python child process hosting QuickJS (minimal env, no API keys, no fs/network access, killed on finish or timeout); tool calls go through ctx.dispatch_tool with Hermes' normal approvals; no network calls of its own, no telemetry, no stored credentials."
maintainer: junbo-hh
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/junbo-hh/hermes-codemode#readme
platforms: [linux, macos]
