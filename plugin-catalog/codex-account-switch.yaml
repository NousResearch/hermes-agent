description: Windows desktop plugin that switches which Codex login and which Claude subscription account
  every local Hermes profile uses, with one idle-only, verified restart of Hermes Desktop and the gateway.
  Refuses while any profile is busy, restores the previous selection if a step fails, and writes a receipt
  that says whether the switch took effect. Disclosure — before a switch it asks OpenAI for the target Codex
  login's usage and Anthropic for the target Claude login's owner; it sends nothing else and has no telemetry.
