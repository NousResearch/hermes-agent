description: >-
  Codex × ChatGPT inspired theme for the Hermes Desktop chat: dual light/dark
  palettes that follow the system appearance, graphite-on-paper typography
  (weight-carried hierarchy), a 10px radius system, hairline borders instead of
  shadows, the 6/10/16/24 spacing rhythm, and a 736px reading column with
  width presets. Settings → Plugins → Codex Theme offers an appearance-mode
  picker (follow system / dark / light) and reading-column width; the theme
  paints theme-level tokens only and never writes user-configurable settings
  such as --chat-text-scale. Disclosure — no network calls, no telemetry, no
  credentials; registers only through the Desktop plugin SDK (THEMES_AREA,
  PALETTE_AREA, ctx.registerSettingsPage, ctx.i18n); keeps one plugin-scoped
  settings record via ctx.storage.
