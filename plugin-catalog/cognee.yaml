description: "Cognee knowledge-graph memory for Hermes: every turn becomes entities and relationships in a graph, and the memory that fits is recalled automatically on each prompt, from Cognee Cloud or a local cognee server. Also remember, forget, recaps and code search, shared with Cognee's Claude Code, Codex and OpenClaw plugins. Maintained by Cognee. Disclosure — each turn plus its tool calls and results (redacted, capped) goes to Cognee Cloud or COGNEE_BASE_URL in remote mode, or to the local cognee server and on to your configured LLM provider (OpenAI by default) in local mode; unless recall is pinned, the server picks which of your readable datasets each recall searches; turns the server could not take are queued in ~/.cognee-plugin; the store lives in ~/.cognee, outside HERMES_HOME, shared across profiles and with Cognee's other plugins. Local mode installs cognee==1.6.6 and its dependencies (about 1 GB from PyPI) into ~/.cognee-plugin/hermes/runtime only when you choose it (`hermes memory setup cognee` or `hermes cognee install-runtime`; never at session start), runs a local cognee server from it (uvicorn on 127.0.0.1:8011) and a session-close watcher in the background; `install-runtime` asks before stopping a local server the plugin started; cognee sends anonymous telemetry unless TELEMETRY_DISABLED=1. The system prompt tells the agent to prefer Cognee memory over MEMORY.md/USER.md (COGNEE_MEMORY_STEER=false turns it off), and an answer that used recalled memory may end with a one-line Cognee credit drawn with the Cognee logo by a transform_llm_output hook (COGNEE_PLUGIN_CITE_MEMORY=off turns it off)."
maintainer: Cognee
tier: community
category: memory
docs_url: https://github.com/topoteretes/cognee-integrations/tree/main/integrations/hermes-agent#readme
