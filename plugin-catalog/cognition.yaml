name: cognition
repo: https://github.com/aska-digital/cognition-memory
sha: c63bb178e4ea981be3b2087a834e810a202ad2fc
version: "0.1.1"
description: "Cognition session-end memory — facts regex-extracted from your messages at session end, stored in a local SQLite queue and JSON log under one repo label, with fetch-first merge, per-entry provenance, and budgeted prefetch (tools: cognition_search, cognition_status, read-only cognition_dream). Disclosure — saves verbatim excerpts (up to 400 chars) of your own messages that match preference/decision phrases in plain local files under HERMES_HOME/cognition/ (SQLite queue, JSON commit log) and re-injects them into later prompts sent to your model provider; the author name is read from ~/.gitconfig; the plugin makes no network calls of its own."
maintainer: aska-digital
tier: community
category: memory
docs_url: https://github.com/aska-digital/cognition-memory#readme
readme: true
platforms: [linux, macos, windows]
capabilities:
  provides_tools:
  - cognition_search
  - cognition_status
  - cognition_dream
  provides_hooks: []
  provides_middleware: []
  requires_env: []
