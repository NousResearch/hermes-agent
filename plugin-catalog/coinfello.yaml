sha: 064bbb66ce281aa950bf5c7922949b53dd537c1e
version: "0.3.3"
description: "CoinFello for Hermes: the agent reads your CoinFello automation wallet (balances, positions, LP ranges, open orders, activity, prices, yields, swap and bridge quotes), prepares sends and swaps you approve in Hermes, and talks to Fello, CoinFello's DeFi agent. A desktop pane shows the wallet and portfolio with send, swap, earn and a daily trading allowance, and draws CoinFello's MCP App cards. Sign-in is the plugin's oauth: entry (hermes auth add coinfello:coinfello, OAuth 2.1 + PKCE against app.coinfello.com); Hermes stores and refreshes the grant and the plugin never holds a token. Disclosure — crypto wallet: the agent can move funds from your CoinFello automation wallet (keys held and signing done by CoinFello's server) within the daily limit you approve on CoinFello; coinfello_execute and every coinfello_chat message go through Hermes' approval prompt, and Fello can carry out on-chain actions from an approved chat message. Talks to app.coinfello.com (which records a daily activity event per session with your account id and wallet address), LI.FI's status API (li.quest), public chain RPCs (publicnode.com and others) for swap-venue lookup, static.cx.metamask.io for token icons and Google Fonts in cards; stores non-secret wallet/card state under the Hermes home and the plugin directory; the open Desktop pane polls status and balances."
maintainer: CoinFello
