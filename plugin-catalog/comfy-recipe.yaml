description: "Visible ComfyUI sessions, consent-based setup, workflow tools and media preparation inside Hermes. Disclosure — on first use it can install its own ComfyUI in a folder you choose: it downloads uv 0.13.7 (checksum-verified) from GitHub, Python 3.13, the latest ComfyUI release, PyTorch and ComfyUI-Manager (unpinned upstream versions), then starts ComfyUI on 127.0.0.1 with ComfyUI-Manager enabled, plus background installer, download and watchdog processes that can outlive the chat. Model downloads fetch public https URLs that workflows declare or that the agent supplies (bundled ones use Hugging Face; private and internal addresses are refused, and localhost mirrors need the allow_local_mirrors setting), and node packs install third-party code through ComfyUI-Manager with your permissions. Discovery reads process command lines and ComfyUI Desktop / StabilityMatrix settings. Prompts, workflows and uploaded files go to the selected ComfyUI. Media tools run ffmpeg. Session titles are written through the public SessionDB. Cloud Recipe workflows spend Comfy account credits when run in your signed-in ComfyUI window; the plugin's instructions tell the agent to ask first, but Hermes itself does not prompt before a paid run. No self-updater."
