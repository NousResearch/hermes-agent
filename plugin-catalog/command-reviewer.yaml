description: "Reviews every terminal/execute_code call before execution: deterministic hard rules block credential reads and destructive patterns, script contents are ingested and judged (not just filenames), an LLM reviewer with an injection-resistant prompt issues SAFE/SUSPICIOUS/MALICIOUS verdicts, and operator approve/deny decisions are recorded content-hash-bound so an unchanged script is never re-asked. Disclosure - the reviewer reads the contents of script files referenced by reviewed commands and sends them to your configured LLM provider; it shells out to docker exec to read sandbox files when the in-process environment is unavailable; reviewer failures fail closed to a human approval prompt; nothing is auto-approved. Disclosure — reviews every terminal/execute_code call before it runs; reads the contents of script files the command names (inside the Docker sandbox via `docker exec` when available, otherwise from the host path) and sends them, with the command text, to your configured auxiliary LLM; keeps an audit log and a precedent database of your approval decisions under $HERMES_HOME/plugin-data/command-reviewer/ and reads config.yaml (read-only) to see whether you answered \"Always\" to one of its prompts; can only block or escalate to the approval prompt, never auto-approves; ships in shadow mode (log only) until you set `mode: enforce`."
