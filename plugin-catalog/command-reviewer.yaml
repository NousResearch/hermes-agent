description: 'Reviews every `terminal` and `execute_code` call before execution: deterministic hard rules block credential reads and destructive patterns, script contents are ingested and judged (not just filenames), an LLM reviewer with an injection-resistant prompt issues SAFE/SUSPICIOUS/MALICIOUS verdicts, and operator approve/deny decisions are recorded content-hash-bound so an unchanged script is never re-asked. Disclosure - the reviewer reads the contents of script files the command names (inside the Docker sandbox via `docker exec` when available, otherwise from the host path), with the command text, and sends both to your configured auxiliary LLM; keeps an audit log, a precedent database of your approval decisions, and verdict caches keyed by script content hash and by command+content combination — the reviewer''s own SAFE and MALICIOUS verdicts are reused for identical commands and scripts with no LLM call, while SUSPICIOUS is never cached and always reaches the approval prompt — all under $HERMES_HOME/plugin-data/command-reviewer/; reads config.yaml (read-only) to see whether you answered \"Always\" to one of its prompts, and — for terminal commands only — whether your own approvals.deny globs will refuse it before spending LLM tokens on it; can only block or escalate to the approval prompt, never auto-approves; ships in shadow mode (log only) until you set `mode: enforce`.'
maintainer: spideysri2802
