description: "Commonplace — local-first curated memory in plain Markdown files on your own machine. Standing rules kept verbatim, a curated store with lexical recall, a handover card for fresh sessions, and a fail-closed pre-compress checkpoint (API v2) that archives the transcript before Hermes may compress it — and blocks compression when the archive cannot be written. No cloud, no API keys, no third-party dependencies. Maintained by Chris Newton. Disclosure — stores everything as plain, unencrypted Markdown under the active Hermes home's `commonplace/` directory, including a verbatim journal of every user/assistant turn and full-transcript archives written before each compression; none of it is pruned automatically. No network calls, credentials or third-party dependencies."
maintainer: ChrisAaronNewton
