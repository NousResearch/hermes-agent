name: commons
repo: https://github.com/Chrisyk/hermes-commons
sha: 2cbee284c7053074c313c48f8f794ccfbeeddeb0
description: "One live skill library for every profile on one machine. `hermes commons setup` scans every profile, reports identical, contained and conflicting copies of each skill, proposes a merge plan and changes nothing until you apply it; apply backs up every profile, moves old copies into a backup (never deletes), points each profile's skills.create_dir at the shared folder and verifies every skill still resolves. Each skill create, edit or patch made through Hermes' skill tool is committed to git in the shared folder, labelled with profile and session. Commands: `hermes commons setup|status|check|merge|promote|demote|log|undo|restore` and a read-only `/commons status|check`. Disclosure: reads every profile's config.yaml, skills folders, bundled manifest, hub lock and cron jobs.json. After confirmation it writes the shared skills folder, runs local `git` there (hooks disabled, no prompts, 30 s timeout), sets skills.create_dir and adds commons to plugins.enabled through `hermes config set`, moves replaced skill folders into <hermes home>/commons/backups (these hold copies of config.yaml, kept outside git and outside every skills folder), and rewrites old skill paths in cron prompts only where the new file exists. Optional hourly script-only cron job, created only with `setup --apply --schedule`. No network calls, no credentials stored."
maintainer: Chrisyk
tier: community
category: tools
requires_hermes: ">=0.23.0"
