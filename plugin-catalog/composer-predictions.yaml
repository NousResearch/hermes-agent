description: "Next-step prompt synthesis built for faster judgment and sharper follow-ups below the Hermes Desktop composer: prepares three complementary angles (clarification, refinement, next action) grounded in recent turns to keep vibe-coding flow unbroken, with 5s two-click protection on non-empty drafts, bilingual EN/zh-CN controls, zero prompt-cache mutation, and never auto-sends. Disclosure — Desktop-only plugin, on by default: after every completed assistant reply it reads up to the latest 6 visible user/assistant messages (12,000-character cap) via session.history and makes one extra stateless llm.oneshot request (task 'composer_predictions') through the session's configured model provider, which adds one model call per reply until you switch it off in the strip; it never writes conversation history, reads credential files, runs shell commands, or submits turns automatically."
