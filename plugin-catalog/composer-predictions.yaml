description: "Context-aware next-step prompts below the Hermes Desktop composer: suggests three editable follow-ups after each assistant reply with two-click replacement protection on non-empty drafts, bilingual EN/zh-CN controls, and never auto-sends. Disclosure — Desktop-only plugin that reads up to the latest 6 visible user/assistant messages (12,000-character cap) via session.history and makes one stateless llm.oneshot request (task 'composer_predictions') through the host's configured model provider; never writes conversation history, reads credential files, runs shell commands, or submits turns automatically."
