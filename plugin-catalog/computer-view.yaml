description: "Private Telegram desktop viewing and user takeover with cooperative tool fencing. Disclosure — Exposes a dedicated Linux virtual desktop to the owner's phone through a user-run HTTPS proxy/tunnel: it uses the profile's `TELEGRAM_BOT_TOKEN` to send a single-use 5-minute bearer link (30-minute session) to the configured owner's private Telegram chat via api.telegram.org, and anyone holding a live link can watch and, after \"Take control\", type and click on that desktop; while enabled its tool_execution middleware refuses browser_exec, computer_use and browser_vault in every session of the profile whenever the user holds control, before `hermes computer-view setup` has run, when `plugins.isolation` is not `in_process`, and after any failed browser action until the owner runs `hermes computer-view recover --local-owner`; `hermes computer-view assets` downloads a SHA-256-pinned noVNC archive from codeload.github.com."
