name: concord-for-hermes
title: Concord for Hermes
repo: https://github.com/Null007Void/concord-for-hermes
sha: 7f43f84e423b9db143f4ae68d88b517483a5513e
subdir: plugin
description: Coordinates allowlisted GitHub existing-file writes with revision checks, verified receipts and exact-operation replay.
maintainer: Null007Void
tier: community
category: tools
requires_hermes: ">=0.21.3"
version: "0.1.0"
docs_url: https://github.com/Null007Void/concord-for-hermes/blob/7f43f84e423b9db143f4ae68d88b517483a5513e/README.md
readme: false
known_issues:
  - Requires the GitHub CLI and operator-configured authentication; credential delegation is disclosed for maintainer review.
  - Protects only enrolled tool calls sharing a coordinator database; other tools and direct GitHub writes bypass it.
  - Replaces existing text files only; does not create files or modify GitHub Actions workflows.
capabilities:
  provides_tools:
    - concord_github_write
  provides_hooks: []
  provides_middleware: []
  requires_env: []
