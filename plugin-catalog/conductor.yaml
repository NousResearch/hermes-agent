name: conductor
title: Conductor
repo: https://github.com/capthvnsen/hermes-captain
sha: 335c54b5e80369980814c3c8f4e3869559dcbe2e
description: "Hermes leads coding agents on your machines: any terminal coding agent, T3 Code threads, and Orca terminals. It starts a run, waits with no model, and puts one message into the chat that asked when the run finishes, errors, stalls, or needs an approval; T3 and Orca runs can be steered and stopped. Two skills: brief turns a brain-dump into a brief, lead runs the work. Disclosure: runs the agent command you name, git status, and ssh and tmux when you give a host (arguments only, no shell strings from user text, never an approval-bypass flag); network is only ssh to hosts you name; keeps one wait thread per run and a detached agent process or tmux window; writes run records to its plugin data folder and event files, exit codes and logs under ~/.conductor; reads and stores no credentials; no telemetry. Finish messages on a messaging gateway need plugins.entries.conductor.allow_gateway_injection: true. Imports one private function, gateway.session_context.bound_session_key, guarded, to learn which chat asked."
maintainer: capthvnsen
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://github.com/capthvnsen/hermes-captain/blob/335c54b5e80369980814c3c8f4e3869559dcbe2e/README.md
version: "0.4.1"
platforms: [linux, macos]
capabilities:
  provides_tools:
    - conductor_doctor
    - conductor_run
    - conductor_mode
    - conductor_read
    - conductor_peek
    - conductor_wait
    - conductor_steer
    - conductor_stop
    - conductor_watch
  provides_hooks:
    - transform_llm_output
  provides_middleware: []
  requires_env: []
