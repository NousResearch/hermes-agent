name: conductor
title: Conductor
repo: https://github.com/capthvnsen/hermes-conductor
sha: 56b60f0b0bff8cec24bfd73403bce770f9d8a44f
description: "Hermes leads coding agents on your machines: any terminal coding agent, T3 Code threads, and Orca terminals. It starts a run, waits with no model, and puts one message into the chat that asked when the run finishes, errors, stalls, or needs an approval; T3 and Orca runs can be steered and stopped. It can run 10+ agents at once, one ping each. Two skills: brief researches, asks one round of questions and writes the brief; lead runs the work and checks each report. Disclosure: every start and steer goes through Hermes's approval gate (pre_tool_call approve); Hermes can launch only the built-in agents on this machine unless the owner lists SSH hosts and extra commands in plugins.entries.conductor.settings (both empty by default); runs the agent, git status, and ssh and tmux for a listed host (arguments only, no shell strings from user text, never an approval-bypass flag); children get a minimal environment plus only what that agent needs; network is only ssh to listed hosts; keeps one wait thread per run and a detached agent process or tmux window; writes run records to its plugin data folder and event files, exit codes and logs under ~/.conductor; reads and stores no credentials; no telemetry. Finish messages on a messaging gateway need plugins.entries.conductor.allow_gateway_injection: true."
maintainer: capthvnsen
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://github.com/capthvnsen/hermes-conductor/blob/56b60f0b0bff8cec24bfd73403bce770f9d8a44f/README.md
