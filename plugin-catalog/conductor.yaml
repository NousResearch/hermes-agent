name: conductor
title: Conductor
repo: https://github.com/capthvnsen/hermes-conductor
sha: 748185fd67f07fdd7d752731a4abfe6cfb4171f4
description: "Hermes leads coding agents on your machines: any terminal coding agent, T3 Code threads, and Orca terminals. It starts a run, waits with no model, and puts one message into the chat that asked when the run finishes, errors, stalls, or needs an approval; T3 and Orca runs can be steered and stopped. It can run 10+ agents at once, one ping each. Two skills: brief researches, asks one round of questions and writes the brief; lead runs the work and checks each report. Disclosure — every start and steer of a coding agent goes through Hermes's approval prompt; it runs only the built-in agents on this machine unless the owner lists extra commands and SSH hosts in plugins.entries.conductor.settings (both empty by default); runs the agent, git status, and ssh and tmux on listed hosts (argv only, no shell strings from user text, never an approval-bypass flag); the agents edit files and run commands with your user rights under their own approval settings; children get a minimal environment plus only the keys that agent needs; keeps one wait thread per run plus a detached agent process or tmux window; writes run records to its plugin data folder and event files, exit codes and logs under ~/.conductor on the machine running the agent; reads and stores no credentials; no telemetry. Finish messages on a messaging gateway need plugins.entries.conductor.allow_gateway_injection: true. In drive mode, which only the user can turn on, it asks Hermes to send up to 5 follow-ups per run on its own."
maintainer: capthvnsen
