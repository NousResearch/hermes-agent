description: "Hermes researches a thing and writes one exact, checked description of it: named parts at real sizes, how they fit, open and move, and how each is known, measured, designed or guessed. Construct turns that description into a live hologram in the chat and everything downstream: glTF with named parts and working joints for Blender, Godot, Unity or Unreal; exact CAD shapes (STEP, FreeCAD); prints and model kits with booklets; films; and NetLogo runs drawn as constructs. It reconstructs what exists, from a building to your own chair, and designs what does not: wholly new objects grounded in real counterparts (an invented ice-hauling spacecraft, reasoned from real spacecraft studies), or a physical product from software's documentation (a synthesizer's manual made into a hardware instrument concept), keeping evidence apart from design. Constructs combine into worlds (a room, a street, a game level), asked for in a sentence or made from one picture, each construct still whole inside it and rearranged by hand on the card; a game level exports as one Godot map with every hinged or sliding part on its joint. Disclosures: runs Construct's bundled Python (source, no binaries) in local subprocesses; optionally runs local programs the user already has (a Chromium-family browser headless for review stills, ffmpeg for films, FreeCAD for CAD, Blender for film renders, NetLogo for model runs), each found on the machine, never downloaded; reads only files the user names and writes only in its own data folder; long work (films, NetLogo runs, large builds) runs as local background jobs with progress in the chat; one network call only, downloading a gallery construct (its scene JSON, at most 8 MiB a file) from Construct's own repository at this version's tag, after the user approves it in Hermes' prompt (curl, with a minimal environment and no keys, only when Python has no certificates); no credentials, no telemetry. Disclosure — runs Construct's bundled Python (source, no binaries) in local subprocesses with a minimal allowlisted environment (no provider keys); optionally runs local programs the user already has (a Chromium-family browser headless over a local debugging port for review stills, ffmpeg, FreeCAD, Blender, and NetLogo/Java), each found via the plugin's settings, `CONSTRUCT_*` variables or PATH, never from tool arguments and never downloaded; NetLogo runs with agent-written setup/go code or a model outside the installed Models Library always go through Hermes' approval prompt and are refused in scheduled runs; other program runs ask only when the opt-in \"Ask before running programs\" setting is on; reads model and scene files at paths the agent or user gives it, and writes only in its data folder and the user-chosen projects folder; long work runs as local background jobs; in Desktop, the Construct pages run the plugin's own `/construct` commands in a \"Construct page\" session it creates per profile; one network call only, downloading a gallery construct (its scene JSON, at most 8 MiB a file) from Construct's own GitHub repository at this version's tag, after the user approves it in Hermes' prompt and never in scheduled runs (curl, with a minimal environment and no keys, only when Python has no certificates); no credentials, no telemetry."
capabilities:
