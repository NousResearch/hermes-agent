description: "Hermes researches a thing and writes one exact, checked description of it: named parts at real sizes, how they fit, open and move, and how each is known, measured, designed or guessed. Construct turns that description into a live hologram in the chat and everything downstream: glTF with named parts and working joints for Blender, Godot, Unity or Unreal; exact CAD shapes (STEP, FreeCAD); prints and model kits with booklets; films; and NetLogo runs drawn as constructs. It reconstructs what exists, from a building to your own chair, and designs what does not: wholly new objects grounded in real counterparts (an invented ice-hauling spacecraft, reasoned from real spacecraft studies), or a physical product from software's documentation (a synthesizer's manual made into a hardware instrument concept), keeping evidence apart from design. Disclosures: runs Construct's bundled Python (source, no binaries) in local subprocesses; optionally runs local programs the user already has (a Chromium-family browser headless for review stills, ffmpeg for films, FreeCAD for CAD, Blender for film renders, NetLogo for model runs), each found on the machine, never downloaded; reads only files the user names and writes only in its own data folder; long work (films, NetLogo runs, large builds) runs as local background jobs with progress in the chat; no network calls, no credentials, no telemetry. Disclosure — runs Construct's bundled Python (source, no binaries) in local subprocesses with a minimal allowlisted environment (no provider keys); optionally runs local programs the user already has (a Chromium-family browser headless over a local debugging port for review stills, ffmpeg, FreeCAD, Blender, and NetLogo/Java), each found via the plugin's settings, `CONSTRUCT_*` variables or PATH, never from tool arguments and never downloaded; NetLogo runs with agent-written setup/go code or a model outside the installed Models Library always go through Hermes' approval prompt and are refused in scheduled runs; other program runs ask only when the opt-in \"Ask before running programs\" setting is on; reads model and scene files at paths the agent or user gives it, and writes only in its data folder and the user-chosen projects folder; long work runs as local background jobs; no network calls, no credentials, no telemetry."
capabilities:
  provides_tools: [construct_start, construct_edit, construct_check, construct_inspect, construct_build, construct_review, construct_export, construct_film, construct_job, construct_command, construct_netlogo_run, construct_netlogo_draw]
  provides_hooks: [pre_tool_call]
