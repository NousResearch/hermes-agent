description: "Persistent, editable objects for Hermes, not one-off images or meshes. Hermes researches a thing; Construct keeps its parts, sizes and sources, checks it, and lets you change, combine and reuse the same object across worlds, film and print. Disclosure — runs Construct's bundled Python (source, no binaries) in local subprocesses with a minimal allowlisted environment (no provider keys); optionally runs local programs the user already has (a Chromium-family browser headless over a local debugging port for review stills, ffmpeg, FreeCAD, Blender, and NetLogo/Java), each found via the plugin's settings, `CONSTRUCT_*` variables or PATH, never from tool arguments and never downloaded; NetLogo runs with agent-written setup/go code or a model outside the installed Models Library always go through Hermes' approval prompt and are refused in scheduled runs; other program runs ask first, once for each program, while the \"Ask before running programs\" setting is on (on by default since 1.3.2; scheduled runs are then refused); reads model and scene files at paths the agent or user gives it, and writes only in its data folder and the user-chosen projects folder; long work runs as local background jobs; in Desktop, the Construct pages run the plugin's own `/construct` commands in a \"Construct page\" session it creates per profile; one network call only, downloading a gallery construct (its scene JSON, at most 8 MiB a file) from Construct's own GitHub repository at this version's tag, after the user approves it in Hermes' prompt and never in scheduled runs (curl, with a minimal environment and no keys, only when Python has no certificates); no credentials, no telemetry."
capabilities:
  provides_tools: [construct_start, construct_edit, construct_check, construct_inspect, construct_build, construct_review, construct_export, construct_film, construct_job, construct_command, construct_world, construct_netlogo_run, construct_netlogo_draw]
  provides_hooks: [pre_tool_call]
