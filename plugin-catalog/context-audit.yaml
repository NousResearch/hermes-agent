description: "Context-window forensics: per-turn input/output token estimates, the single largest tool output of each turn, oversized tool calls (args over 50 KB), and compaction events, recorded as metadata only (tool name, byte length, ids, timestamps — never args or results) in a local SQLite DB under HERMES_HOME/plugin-data/context-audit/. Adds a /context-audit slash command that prints the top 5 context eaters over a window with one mitigation per entry."
maintainer: ZidoCode
tier: community
category: tools
requires_hermes: ">=0.21.6"
docs_url: https://github.com/ZidoCode/context-audit#readme
