description: >-
  OmniNode-encased self-improving agent engine connecting five native Hermes
  surfaces (ContextEngine, MemoryProvider, DelegationProvider, 18 continuum_*
  agent tools with 4 lifecycle hooks and /continuum command, plus Hermes Desktop
  SDK and Web Dashboard views) over 30 cooperating cybernetic engines (112
  sub-engines), static AST CARD descriptors with .omni/cas SHA-256 lockfile
  integrity, declarative >> // | @ pipeline shape composition emitting canonical
  grid/1 cell receipts, shared 4-space nested embeddings (16d/32d/64d/128d),
  Matryoshka Top-K JumpReLU SAE & Crosscoder latent probing with ELK
  layer-divergence detection, surgical Null(A_anchor) activation steering (0.0
  anchor drift), a 172-axis TT-Cross adaptive grid with zero-token offline
  exploration, Cellular Sheaf consistency auditing, Split Conformal + Online ACI
  prediction sets, Kronecker HyperLoRA, atomic SQLite task leasing with maker !=
  checker verification, and portable compilation across 9 zero-dependency
  runtimes (bare-metal #![no_std] Rust, WebGL2 GLSL, JS, Python, SQL, C99,
  in-memory WASM, WAT, and WGSL, plus safetensors). Disclosure — runs 100%
  locally in-process over profile-scoped SQLite WAL and .omni/ storage; zero
  outbound network calls, zero background daemons, and zero external API keys
  required.
