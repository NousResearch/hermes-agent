readme: true
known_issues:
  - "Tested end to end on macOS with Hermes 0.23.1 and 0.22.7 (a scripted stand-in model drives the real agent loop); unit tests run in CI on Ubuntu and macOS; Windows is untested."
  - "The verify gate is bounded by agent.max_verify_nudges (3 by default); after that the reply goes out stamped Not done."
  - "Guard rails, not a sandbox: the guard stops the agent's ordinary routes early and the hashes are the backstop (a changed frozen file fails its test, a removed lock fails closed); a same-user process that sets out to evade both can still change files and approvals."
  - "Freeze, approve and unfreeze are done with /necro in the Hermes chat; from a shell they refuse (Hermes marks every hermes process as an agent harness) and say what to type instead."
capabilities:
  provides_tools:
    - necro_status
    - necro_check
  provides_hooks:
    - pre_verify
    - transform_llm_output
    - pre_tool_call
    - pre_llm_call
  provides_middleware: []
  requires_env: []
