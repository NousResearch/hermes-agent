name: corkboard
title: Corkboard
repo: https://github.com/elijahboston/hermes-corkboard
sha: 349d1f8417fb4d3c6cb9ca621cbe5bd7ba11aa0e
description: "One shared board, across every profile, of things only you can do. Agents pin a task, a yes/no question, a choice of up to four (their recommendation starred) or a text question instead of burying it in chat; you answer from a Desktop side pane, the full Corkboard page, `hermes corkboard` or `/corkboard`. Blocked kanban cards are pinned automatically and your answer goes back to the card as an \"Owner decision\" comment, which resumes the worker. Pins can clear themselves when a check passes (nameservers changed, a kanban card unblocked). Text pins never ask for secrets; credential needs are always tasks. Disclosure — keeps one SQLite board shared by all profiles at ~/.hermes/plugin-data/corkboard/data.db, so every profile with the plugin enabled (and any authorized gateway user via `/corkboard`) can read, answer, complete or dismiss every profile's pins and answers; runs `dig +short NS` for DNS checks and `hermes kanban show/list/comment` to read cards and post owner answers (an agent chooses which card a pin's answer is posted to); owner-added `--check-command` checks run a shell command (5s timeout) on `hermes corkboard check` without an approval prompt (the agent tool cannot create them); no network calls of its own beyond DNS lookups, no background process, no cron, no telemetry."
maintainer: elijahboston
