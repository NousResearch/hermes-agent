known_issues:
  - Looking up case citations needs a free CourtListener key. Statute and code citations need none, up to Corpus's 250 lookups a month from one network; a free Corpus key raises that.
  - It checks that a source exists at a citation, not that the source says what a draft claims. It is not legal advice.
