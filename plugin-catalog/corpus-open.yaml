name: corpus-open
title: Corpus Open
repo: https://github.com/teakesdev/corpus-open
sha: 6694628ff017b58b432e77485885e86128f5ff19
version: "0.6.0"
description: "For pro se and self-represented litigants: people handling their own lawsuit or court case without a lawyer. Legal citation checking for AI drafts. Under every reply, a citation guard lists each case, statute and code cite with what CourtListener (case law), Corpus (statutes from all 50 states) and the person's own case file hold at it, and flags a fake (hallucinated) citation before it reaches a court filing; a cite that cannot exist is caught with no lookup at all. A quote guard refuses a write that misquotes a filed document or cites the wrong page. Each session opens with the case's court deadlines, and an intake skill interviews the person one plain question at a time. Twelve tools keep a local litigation case folder (labeled facts with sources, evidence, deadlines, brief check, a packet for an attorney deciding whether to take the case, court rules, hash verification), /matter shows it, and Hermes Desktop gets a Case pane. Disclosure — cite checks are on by default for every case and send bare citations (never case text) to CourtListener (only once a key is set) and corpuslaw.us; each request is logged in the case folder, and checks can be turned off per case or everywhere (citation_guard local). Case files stay on the computer. The CourtListener key is read through Hermes's secret settings, falling back to the key the kit's own matter.py saves in ~/.config/matter-kit. On a session's first turn it adds the case's deadlines to the agent's context, and it asks for Hermes approval before shell or file commands that look like they change a registered case document. /matter watch on writes a deadline-check script into Hermes's scripts folder and prints a cron command for you to run; it schedules nothing itself. PDFs are read with the local pdftotext program when installed. Not a lawyer and not legal advice."
