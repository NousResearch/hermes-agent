title: Cortex Zero Adaptive
description: "Local 1B model directed adaptive browser automation with failure recovery. Implements the full OBSERVE→REASON→SELECT→EXECUTE→ANALYZE→ADAPT→VERIFY loop using llama-3.2-1b-cz-router (1.2B params, 128K context). The model selects actions from a structured catalog (baf-navigate, baf-click, baf-extract, baf-evaluate, baf-wait), encounters failures, analyzes them, and autonomously chooses alternative approaches — all within authorized engagement boundaries enforced by domain allowlists, operation allowlists, and fail-closed policy. Three mock demonstrations (navigation failure, element not found, policy blocked) and real BAF integration with 4/4 validation tests passing. Independent verification infrastructure separates model self-report from deterministic flag verification. Evidence logging to JSONL for audit trail. Reuses Cortex Zero Engine deterministic routing and BAF AutomationServer infrastructure."
