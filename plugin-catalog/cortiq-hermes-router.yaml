name: cortiq-hermes-router
repo: https://github.com/infosave2007/cortiq-hermes-router
sha: e671117b82d1ecbb39073c4c12ee699da9b75a50
description: >-
  AllaiGate model routing for Hermes — inexpensive models for simple tasks,
  stronger models for complex work. Classifies each turn (POST /v1/route),
  picks a model from your globalTiers/taskRules and rewrites the outgoing
  request via llm_request middleware. Config: ~/.config/cortiq-hermes-router/config.json,
  key: CORTIQ_ROUTER_KEY. Built-in statistics: /cortiq-router stats.
maintainer: infosave2007
tier: community
category: models
docs_url: https://github.com/infosave2007/cortiq-hermes-router#readme
version: "0.2.1"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: [llm_request]
  requires_env: [CORTIQ_ROUTER_KEY]
