name: cortiq-hermes-router
repo: https://github.com/infosave2007/cortiq-hermes-router
sha: 8ad73025e2d2523f14bf0d099de73175278097f4
description: "AllaiGate model routing for Hermes — inexpensive models for simple tasks, stronger models for complex work. Classifies every call of a turn (POST /v1/route), picks a model from your globalTiers/taskRules and rewrites the outgoing request via llm_request middleware; tier entries with their own endpoint (Ollama, LM Studio, vLLM, llama.cpp, cortiq, cloud) run through llm_execution with fail-open. Config: ~/.config/cortiq-hermes-router/config.json, key: CORTIQ_ROUTER_KEY. Built-in statistics: /cortiq-router stats. Disclosure — sends the text of every model call (the user's message, and on each tool-loop step the tool outputs, up to 12,000 characters by default) to the AllaiGate classifier (router.allaigate.com by default) with your CORTIQ_ROUTER_KEY; set `toolSteps: \"low\"` to send only the first message of each turn; tier entries with their own endpoint send the whole conversation to that endpoint; its config file (~/.config/cortiq-hermes-router/config.json) is shared by all profiles."
maintainer: infosave2007
tier: community
category: models
docs_url: https://api.allaigate.com/ru/
version: "0.5.2"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: [llm_request, llm_execution]
  requires_env: [CORTIQ_ROUTER_KEY]
