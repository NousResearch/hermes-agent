name: cortiq-hermes-router
repo: https://github.com/infosave2007/cortiq-hermes-router
sha: 378743eaa145910b88bfe98e4a3e508bbc78f24b
description: >-
  AllaiGate model routing for Hermes — inexpensive models for simple tasks,
  stronger models for complex work. Classifies every call of a turn (POST /v1/route),
  picks a model from your globalTiers/taskRules and rewrites the outgoing
  request via llm_request middleware; tier entries with their own endpoint
  (Ollama, LM Studio, vLLM, llama.cpp, cortiq, cloud) run through llm_execution
  with fail-open. Config: ~/.config/cortiq-hermes-router/config.json,
  key: CORTIQ_ROUTER_KEY. Built-in statistics: /cortiq-router stats.
maintainer: infosave2007
tier: community
category: models
docs_url: https://api.allaigate.com/ru/
version: "0.5.1"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: [llm_request, llm_execution]
  requires_env: [CORTIQ_ROUTER_KEY]
