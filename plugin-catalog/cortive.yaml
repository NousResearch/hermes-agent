capabilities:
  provides_tools: []
  provides_hooks: [pre_tool_call, transform_tool_result]
  provides_middleware: []
  requires_env: []
known_issues:
  - Needs the Cortive app (free beta, Apple silicon, macOS 14+) from https://github.com/KadenDevAi/cortive-releases; select it with `hermes config set memory.provider cortive`.
  - Meaning search needs Cortive 0.2.0 or later running; otherwise search and recall match words only, and automatic recall waits for messages that refer to saved material.
  - Voice recordings have no transcript, so the agent can find them but not read what was said.
requires_hermes: ">=0.21.5"
