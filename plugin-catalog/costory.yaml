description: "FinOps harness MCP for platform teams. Every cloud, data and LLM bill (AWS, Google Cloud, Azure, Oracle Cloud, Snowflake, Databricks, OpenAI, Anthropic and more) normalized in BigQuery and allocated to your teams. Read-only cloud access. Starter from $300/month, 30-day free trial. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/) connecting Hermes to Costory's hosted MCP at https://app-api.costory.io/mcp (Streamable HTTP, OAuth). Bundles seven FinOps skills: query, cost-change-investigation, virtual-dimensions, dashboards, reports, recipes and bigquery. Disclosure: hosted-only connector with no local code beyond the pin; every tool call goes to app-api.costory.io after browser OAuth (enterprise SSO on Costory Team and above). The tool set is served by the remote server at runtime and is not covered by the pinned sha. Costory has write-capable tools that create or change Costory objects only (alerts, reports, dashboards, events, allocation rules, archives), never cloud resources; plugin.json sets extensions.com.nousresearch.hermes.servers.costory.trust: untrusted so Hermes asks before writes and refuses them in unattended runs. No mcp-remote, no local credentials, no self-updater."
