name: counterparty
repo: https://github.com/Mattbusel/hermes-counterparty
sha: "e77aee29faa6e4fb3b0849682727c0328daa5e7b"
title: Counterparty
description: "Screens the companies your agent is about to pay, email, sign with or buy from. Before any outward action (email, payment, order, transfer, signature, form submit) a pre_tool_call hook reads the vendor, email domain or URL from the call and checks it against the DoD Section 1260H list, the FCC Covered List, Section 889, the UFLPA Entity List, the BIOSECURE list and OFAC sanctions, with the ownership chain from public records, then escalates hits through Hermes's own approval prompt with the finding and its legal citation (never auto-approves; fails closed under cron). Search and page results that mention a listed vendor get a one-time note. Tools cp_screen, cp_lookup, cp_credit, cp_who_owns_address and cp_brief answer on demand; /whoowns gives a cited one-page brief. Works offline from a bundled list snapshot and says so. Disclosure: HTTPS to shop.tensorust.com only (counterparty name, domain, description, amount); no telemetry, no shell, no credential reads; optional TENSORUST_API_KEY through Hermes's secret scope; data and API published by Tensorust LLC."
maintainer: Mattbusel
tier: community
category: tools
version: "0.1.1"
requires_hermes: ">=0.23.0"
docs_url: https://github.com/Mattbusel/hermes-counterparty
image: https://raw.githubusercontent.com/Mattbusel/hermes-counterparty/e77aee29faa6e4fb3b0849682727c0328daa5e7b/assets/card.png
readme: true
known_issues:
  - "The alias index covers the vendor groups the lists name and their named subsidiaries (18 groups as of the 2026-11-06 pull), not every shell company; a clear result means not on these lists under this name."
  - "Address ownership (cp_who_owns_address, /whoowns <address>) covers a set of US counties and says when an address is outside it."
capabilities:
  provides_tools:
    - cp_screen
    - cp_lookup
    - cp_credit
    - cp_who_owns_address
    - cp_brief
  provides_hooks: [pre_tool_call, transform_tool_result]
  provides_middleware: []
  requires_env: []
