description: "Read-only press release wire MCP server and skill: browse newsroom desks, list and search published company press releases, and read the opening of one with a link to the full release. Agent Plugins v1 package (plugin.json + mcp.json + one skill), configuration only. Disclosure — every tool call goes to the public read-only MCP server at courierpr.com (https://courierpr.com/api/mcp), which only reads published press releases (company-written announcements, not independent reporting); no sign-in, no key, nothing written, no local commands. The package marks the server untrusted. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
