description: "/cpa in chat for CLIProxyAPI (CPA) pools: account health per provider (active, limited, cooling, error, disabled), the CPA version with an update hint, and on request each account's live quota (Claude, Codex, xAI, Antigravity, Devin, Kimi, Kiro), the same usage reads as CPA's own web UI. Companion to cliproxyapi-provider and reads the same cliproxyapi config. Disclosure — only when you type /cpa, and with the management key env var you name per instance: GETs the credentials list from your configured CPA and CPA's own update check (at most once per 6 hours); for /cpa quota, POSTs CPA's api-call so CPA sends each built-in vendor's private usage request (Anthropic, ChatGPT/Codex, xAI, Google Antigravity, Codeium/Devin, Kimi) with that account's token, using the vendor clients' own User-Agent and client headers as CPA's web UI does (Antigravity and Devin are vendor POSTs, the rest GETs), then one plan request per Claude account (GET api.anthropic.com/api/oauth/profile) and per Antigravity account (POST loadCodeAssist on daily-cloudcode-pa.googleapis.com), from which only the plan fields are read, and GETs CPA plugin quota for Kiro; at most 20 accounts and 4 requests per account per run, 4 requests in flight. Stops at the first rejected key: one failed try, or up to 4 if the key is revoked mid-run; CPA bans an IP after five failed management logins. Writes only lock files and a rejected-key marker (salted HMAC, never a key) under $HERMES_HOME/cache/cliproxyapi/locks/. On Hermes 0.23.1 or later it also removes the management key env var, and on a routed instance the CPA key env var, from the environment of the terminal commands a chat session runs (setting hide_keys_from_shells, on by default). Known limit: that hides environment variables only, and only for commands run inside a chat session on the local terminal backend: shell hooks, cron job scripts, processes Hermes starts with the profile's credentials, processes started with no session, remote terminal backends (docker, ssh) and any command that can read the file Hermes loads keys from still see them; a variable whose name starts with HERMES_, or that another plugin already manages, stays visible; on older Hermes nothing is hidden."
