name: crash-lab
repo: https://github.com/8JBern/hermes-crash-lab
sha: 9a712f9714ff5687425f0ffc9ac7eb6f9eb441cb
description: >-
  Fault-injection and recovery testing for AI agents. Crash Lab manufactures the failure
  modes that break real agent workflows — a write that succeeds while the API reports a
  timeout, a malformed response, transient 503s — behind four registered tools
  (crash_start, crash_book, crash_inspect, crash_report), then measures whether the agent
  recovers correctly. An independent state oracle reads the simulated service's actual
  state and returns PASS/FAIL/UNVERIFIED; an agent's own explanation is never accepted as
  evidence. Fully offline: the booking service is fictional — no network calls, no real
  bookings, payments or accounts. Zero Python dependencies; writes JSON run files only in
  its own plugin-data directory. Disclosure — verdicts certify simulated service state
  only, not the agent's reasoning; run state is single-writer (one session per run_id);
  scenarios are fixed code constants, not a general fuzzer.
maintainer: 8JBern
tier: community
category: tools
docs_url: https://github.com/8JBern/hermes-crash-lab#readme
version: "1.0.1"
requires_hermes: ">=0.22.5"
platforms: [linux, macos, windows]
capabilities:
  provides_tools: [crash_start, crash_book, crash_inspect, crash_report]
  provides_hooks: []
  provides_middleware: []
  requires_env: []
