name: crash-recovery
title: Crash Recovery
version: "0.1.0"
repo: https://github.com/sammy-XXIV/hermes-crash-recovery
sha: 2d00ff5832a6a6d7aca0c09ef500a64a890efa14
description: >-
  Durable, hash-chained tool-call journal that blocks protected actions while a previous outcome is unknown, including after a crash or a new session. Operator reconciliation releases the recovery gate; actions are never automatically replayed.
  Disclosure — stores tool/session metadata, argument and result hashes, a local integrity checkpoint and operator evidence under the active profile's plugin-data directory; never auto-prunes. Serializes protected calls per profile. No network, shell execution, credential reads or background tasks in the plugin itself. Optional demos spawn and force-kill owned local workers; the native demo also opens a temporary loopback provider and starts/stops an isolated Hermes CLI/gateway.
maintainer: sammy-XXIV
tier: community
category: tools
requires_hermes: ">=0.23.1"
docs_url: https://github.com/sammy-XXIV/hermes-crash-recovery#readme
platforms: [linux, macos, windows]
readme: true
known_issues:
  - V1 serializes protected calls per profile; nested protected tools and concurrent protected calls can be refused.
  - A rejected approval or guardrail decision can conservatively require operator reconciliation.
  - Local tamper detection does not protect against complete replacement of both the journal and checkpoint; retain independent checkpoints when that threat matters.
capabilities:
  provides_tools: [crash_recovery_status, crash_recovery_verify]
  provides_hooks: [pre_tool_call]
  provides_middleware: [tool_execution]
  requires_env: []
