name: crashlab
title: CrashLab
repo: https://github.com/dolepee/crashlab
sha: 15b8e7f934023a3dc57643bf7828abca2e9dac1b
description: Reproduce lost-response duplicate writes, verify repairs against persisted state, and run a last-unit capacity campaign.
maintainer: dolepee
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.3.0"
docs_url: https://github.com/dolepee/crashlab/blob/15b8e7f934023a3dc57643bf7828abca2e9dac1b/README.md
platforms:
  - linux
screenshots:
  - https://raw.githubusercontent.com/dolepee/crashlab/15b8e7f934023a3dc57643bf7828abca2e9dac1b/external/kist/evidence/buggy-after-retry.png
  - https://raw.githubusercontent.com/dolepee/crashlab/15b8e7f934023a3dc57643bf7828abca2e9dac1b/external/kist/evidence/repaired-after-retry.png
  - https://raw.githubusercontent.com/dolepee/crashlab/15b8e7f934023a3dc57643bf7828abca2e9dac1b/docs/desktop-pane.png
known_issues:
  - "The Kist external example is one app and one Hermes one-shot repair; this is not a general autonomous-repair claim."
  - "Browser campaigns are validation-only; the inventory campaign runs HTTP concurrency against a loopback fixture with a deliberate test-only scheduling gate."
  - "Requires Node.js 20+, playwright-core and local Chromium; uses --no-sandbox, so run only trusted fixtures in isolation."
  - "Only the first matching request is interrupted; other fault.occurrence values are unsupported."
capabilities:
  provides_tools:
    - crashlab_validate
    - crashlab_run
    - crashlab_compare
    - crashlab_list
    - crashlab_campaign_list
    - crashlab_campaign_validate
    - crashlab_campaign_run
  provides_hooks: []
  provides_middleware: []
  requires_env: []
