name: crashlab
title: CrashLab
repo: https://github.com/dolepee/crashlab
sha: 42587d4397362ee2f2f4f18326d01408d39e7dbc
description: Reproduce a lost-response retry, inspect saved records, and verify the repair with a frozen case and legitimate-use control.
maintainer: dolepee
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.3.1"
docs_url: https://github.com/dolepee/crashlab/blob/42587d4397362ee2f2f4f18326d01408d39e7dbc/README.md
platforms:
  - linux
  - macos
screenshots:
  - https://raw.githubusercontent.com/dolepee/crashlab/42587d4397362ee2f2f4f18326d01408d39e7dbc/docs/dashboard-desktop.png
  - https://raw.githubusercontent.com/dolepee/crashlab/42587d4397362ee2f2f4f18326d01408d39e7dbc/docs/dashboard-mobile.png
known_issues:
  - "Kist is one externally sourced application repair, not evidence of adoption or general autonomous repair."
  - "The web dashboard is exercised in Hermes; the current native Desktop pane is SDK-validated but not visually verified in an installed Desktop app."
  - "External application templates require their own checkout, dependencies and case configuration."
  - "HTTP state observers trust application responses; SQLite observers read directly but are not an operating-system isolation boundary."
  - "Browser campaigns are validation-only; the inventory campaign runs HTTP concurrency against a loopback fixture with a deliberate test-only scheduling gate."
  - "Requires Node.js 20+, playwright-core and local Chromium; uses --no-sandbox, so run only trusted fixtures in isolation."
  - "Only the first matching request is interrupted; other fault.occurrence values are unsupported."
capabilities:
  provides_tools:
    - crashlab_validate
    - crashlab_run
    - crashlab_compare
    - crashlab_list
    - crashlab_campaign_list
    - crashlab_campaign_validate
    - crashlab_campaign_run
  provides_hooks: []
  provides_middleware: []
  requires_env: []
