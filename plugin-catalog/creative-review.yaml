name: creative-review
repo: https://github.com/peterpeeterspeter/hermes-creative-review
sha: 3f09cdce305c9c9db19ce9d752134ca1a35344e0
description: >-
  An art director's desk for your agent: a native Hermes Desktop workspace to
  visually review AI-generated images — compare a reference against generated
  versions side by side or blended, zoom and pan, click anywhere to drop
  numbered point annotations with notes, then "Request Revision" builds a
  structured brief (markers, coordinates, notes, reference, version lineage) and
  hands it to the LIVE Hermes conversation through host.composer.submit(), so
  the agent receives it as a real user turn. Revisions are linked to their
  parent image, and the final image can be approved and exported with its full
  review history as JSON or Markdown. Local-first: boards and history live in a
  SQLite database under the profile's plugin-data folder and images are read
  from disk in place. Disclosure — uses the authenticated Hermes backend API, which can be remote;
  revision submission can invoke the user-configured provider through Hermes.
  No direct third-party processing calls, mandatory cloud account, credentials,
  shell, background processes or telemetry; the plugin reads
  the local image files the user (or the agent) registers, by path, and writes
  exports into its own plugin-data folder.
maintainer: peterpeeterspeter
