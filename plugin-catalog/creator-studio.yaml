sha: 372427fcc25186feb5f501f9d47d993176094b6f
version: "0.2.3"
description: "Make media with Hermes from one request: researched lesson videos, two-host podcast episodes, captions for any recording, and narrated step-by-step tutorials. Bundles four plugins (YouTube Studio, Podcast Studio, Caption Studio, Tutorial Creator) into one entry. Disclosure: Research pages are fetched through an installed Camoufox browser you select (public addresses only). If you choose Gemini narration, each spoken line is sent to Google (Vertex) with your own Google Cloud login, behind a spend guard (default 0.50 USD). An HTTP speech recognizer, if you select one, receives audio only after your explicit consent. Runs FFmpeg and ffprobe, and for screen tutorials xwininfo, xprop, xdotool, pactl and xclip; the recorder starts one detached FFmpeg worker per take, and tutorial steps click and type through Hermes computer_use, so its approvals apply. Stores projects privately in plugin storage, one folder per part. No credential or project id is stored or shown. Nothing is uploaded or published."
maintainer: flabanabba8
