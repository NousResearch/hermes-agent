version: 0.5.2
description: "Make media with Hermes from one request: researched lesson videos, two-host podcast episodes, captions for any recording, narrated step-by-step tutorials, and clips cut from a YouTube video or stream by reading its transcript. Bundles five plugins (YouTube Studio, Podcast Studio, Caption Studio, Tutorial Creator, Clip Studio) into one entry. Disclosure — Research pages are fetched through the Camoufox browser you set in the plugin settings, in a fresh anonymous profile (public addresses only). On first use it lists the voices and speech recognizers this computer has and asks you which to use; it never picks one for you. If you choose Gemini narration, each spoken line is sent to Google, either to Vertex AI (aiplatform.googleapis.com) with a Google sign-in that Hermes holds for your own OAuth client (hermes auth add creator-studio:google; the plugin never sees the token), or to generativelanguage.googleapis.com with the Gemini API key in this plugin's settings (GEMINI_API_KEY, the same variable Hermes' own Gemini provider uses), behind a spend guard (default 0.50 USD). To find speech servers it sends read-only GET requests (/v1/models, /openapi.json) to 127.0.0.1 only, on ports 2022, 5000, 5002, 7860, 8000, 8001, 8020, 8080, 8880 and 9000, plus any loopback address you set. Caption Studio runs the recognizer command you set in the plugin settings, or uploads audio to the HTTPS speech service you set (public addresses only) or to Groq (api.groq.com) with your key, only when you allow uploads; the model cannot set commands, endpoints, keys or upload consent. Programs it starts get a minimal environment (paths, locale, display/audio session and proxy settings), never your provider keys. Clip Studio runs the yt-dlp you installed (or set in the plugin settings) and makes requests to YouTube only when you give it a link: the video page and one caption track, then the audio track if you ask for speech recognition, the sections you choose to cut, and, if you ask what chat reacted to, the public chat replay of a finished stream (other people's messages and display names; kept in private plugin storage, the raw download deleted once counted, names kept only for paid messages). It never uses browser cookies or a YouTube sign-in. Recognizing a whole recording continues in a background thread inside Hermes until its pieces are done. Clips, joined videos, titles, descriptions and thumbnails are written to plugin storage. Runs FFmpeg and ffprobe, an installed speech program if you choose one (espeak-ng, flite, piper), and for screen tutorials xwininfo, xprop, xdotool, pactl and xclip; the recorder starts one detached FFmpeg worker per take, and tutorial steps click and type through Hermes computer_use, so its approvals apply. Stores projects privately in plugin storage. Nothing is published."
