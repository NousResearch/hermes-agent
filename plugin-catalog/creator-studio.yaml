version: 0.4.2
description: 'Make media with Hermes from one request: researched lesson videos, two-host podcast episodes, captions for any recording, and narrated step-by-step tutorials. Bundles four plugins (YouTube Studio, Podcast Studio, Caption Studio, Tutorial Creator) into one entry. Disclosure: Research pages are fetched through an installed Camoufox browser you select (public addresses only). If you choose Gemini narration, each spoken line is sent to Google (Vertex) with a Google sign-in that Hermes holds for your own OAuth client (hermes auth add creator-studio:google; the plugin never sees the token), behind a spend guard (default 0.50 USD). On first use it finds what the computer has and asks which voice and recognizer to use; it never picks one for you. To list speech servers it sends GET /v1/models to 127.0.0.1 on ports 8000, 8080, 9000, 2022 and 8880 only (no redirects, 1 second timeout). A recognizer command, HTTP recognizer endpoint (and its key), the Camoufox install and other programs are set by you in the plugin settings, never by the model; an HTTP recognizer off this computer receives audio only after your upload consent. Every program it starts gets a minimal environment (PATH, HOME, LANG), never your provider keys. Runs FFmpeg and ffprobe, and for screen tutorials xwininfo, xprop, xdotool, pactl and xclip; the recorder starts one detached FFmpeg worker per take, and tutorial steps click and type through Hermes computer_use, so its approvals apply. Stores projects privately in plugin storage, one folder per part. No credential or project id is stored or shown. Nothing is uploaded or published.'
