title: Creature Workshop
description: "Manage your project's development lifecycle all in one place. A project describes itself once in its shellops .ops/ declaration, and the plugin reads it, runs the project's own shell/ops, and shows the result. Tools: workshop_project (the declaration, the release record, which declared tools are installed), workshop_install (check, or install the missing ones), workshop_test (the test plan of changed paths, or run them), workshop_lint. A system prompt section names the project when the session is in one. The Desktop pane shows the toolchain live with a green or red dot per tool, the declaration files and the release record; a status-bar chip counts installed tools. Disclosure — the tools run the project's own shell/ops as a subprocess in the project directory with its .envrc loaded, and nothing outside it; workshop_install with check false installs tools, fetching from the channel the declaration names (the host's package manager, cargo, npm, go, a git repository, Flathub, or an installer script the project ships); the backend runs shell/ops install --check for the pane on a timer and reads files under the project only; no network calls of the plugin's own, no telemetry, no credentials. Only projects with shell/ops and .ops/config/ are recognised."
maintainer: jerrod-storm
