name: credential-pool-switcher
repo: https://github.com/hendkai/hermes-account-switcher
sha: 92ca5f9b6f5c3cb1f4bc9df1e6154c64c4643faf
subdir: ""
description: "Switch between pooled provider accounts (e.g. multiple Claude logins) from chat (/switch), CLI, the agent, or a desktop status bar chip — lists every pooled account with its priority, bench state (benched / dead) and Anthropic usage (5 h, weekly and model-scoped bars in the chip popover), moves any account to the front of the rotation, rotates automatically to the login with the most usage headroom, refuses unsafe switches (dead logins, env:-fed API-key entries), verifies the new order afterwards, offers plan/dry-run previews, and guides account setup (`/switch setup`, after-install note, status bar chip with copyable `hermes auth add` commands). A pre_tool_call hook escalates every model-initiated real switch and auto run to the human-approval gate (list/plan stay direct), so a prompt-injected turn cannot silently redirect which account gets billed. Disclosure — reorders your Hermes credential pools through the pool's own move_entry (the call behind `hermes auth priority`); a pre_llm_call hook starts an automatic rotation in a short-lived background thread at most every 10 minutes (shared across Hermes processes), which reorders the pool WITHOUT a per-run approval prompt (the approval gate covers model-initiated tool calls only); turn it off with HERMES_CPS_AUTO_ROTATE=0; usage is read through Hermes' public agent.account_usage.fetch_account_usage(read_only=True), which sends each non-dead pooled Anthropic OAuth token (benched ones included) to api.anthropic.com to read that account's own usage, automatically every 10 minutes and when the chip popover opens; it keeps one small state file, credential-pool-switcher-state.json in the Hermes home (timestamps and the last result, no credentials); the plugin never reads or writes auth.json itself and never refreshes or stores tokens; its desktop chip polls `hermes credential-pool-switcher status --json` and runs `hermes credential-pool-switcher switch <label>` or `auto` when you click."
maintainer: hendkai
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "1.5.0"
platforms: []
readme: true
capabilities:
  provides_tools:
    - account_switch
  provides_hooks:
    - pre_tool_call
    - pre_llm_call
  provides_middleware: []
  requires_env: []
