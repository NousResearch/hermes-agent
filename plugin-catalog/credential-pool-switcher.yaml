sha: ce7082db4f8ab8463b860f3ee6ef7157805b656c
subdir: ""
description: "Switch between pooled provider accounts (e.g. multiple Claude logins) from chat (/switch), CLI, the agent, or a desktop status bar chip — lists every pooled account with its priority, bench state (benched / dead) and Anthropic usage, moves any account to the front of the rotation, refuses unsafe switches (dead logins, env:-fed API-key entries), verifies the new order afterwards, offers plan/dry-run previews, and guides account setup (`/switch setup`, after-install note, status bar chip with copyable `hermes auth add` commands). A pre_tool_call hook escalates every model-initiated real switch to the human-approval gate (list/plan stay direct), so a prompt-injected turn cannot silently redirect which account gets billed. Disclosure — reorders your Hermes credential pools through the pool's own move_entry (the call behind `hermes auth priority`), and Hermes asks for approval before each switch the model starts; the optional usage view calls Hermes' public agent.account_usage.fetch_account_usage(read_only=True) with each usable pooled Anthropic OAuth token, which sends it to api.anthropic.com to read that account's own usage; the plugin never reads or writes auth.json itself, never refreshes or stores tokens, and only runs read-only `hermes credential-pool-switcher status --json` from its desktop chip."
maintainer: hendkai
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "1.3.1"
platforms: []
readme: true
capabilities:
  provides_tools:
    - account_switch
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
