name: credential-pool-switcher
repo: https://github.com/hendkai/hermes-account-switcher
sha: 5eda051fc80abb901a1f7b34534dd22d28a163ff
subdir: ""
description: "Switch between pooled provider accounts (e.g. multiple Claude logins) from chat, CLI, or the agent — lists every pooled account with its priority and current marker, moves any account to the front of the rotation via hermes auth priority, refuses unsafe switches (env:-fed API-key entries), verifies the new order afterwards, and offers plan/dry-run previews. A pre_tool_call hook escalates every model-initiated real switch to the human-approval gate (list/plan stay direct), so a prompt-injected turn cannot silently redirect which account gets billed. Optional usage percentages call Hermes' public agent.account_usage.fetch_account_usage with each pooled OAuth token (sent to api.anthropic.com, read-only); tokens are never printed, logged, or written. Switching itself never edits auth.json. Disclosure — cross-platform, no telemetry."
maintainer: hendkai
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "1.1.0"
platforms: []
readme: true
capabilities:
  provides_tools:
    - account_switch
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
