subdir: ""
description: "Switch between pooled provider accounts (e.g. multiple Claude logins) from chat (/switch), CLI, the agent, or a desktop status bar chip — lists every pooled account with its priority, bench state (benched / dead) and Anthropic usage (5 h, weekly and model-scoped bars in the chip popover), moves any account to the front of the rotation, can rotate to the login with the most account-level usage headroom on demand (`/switch auto`; model-family caps stay informational, logins with an unknown cooldown are never promoted, usage eligibility is not message verification, the plugin sends no `/v1/messages` probes and does not write cooldowns; background rotation is opt-in and off by default), refuses unsafe switches (dead logins, env:-fed API-key entries), verifies the new order afterwards by exact entry id (an unverifiable move is reported as unverified, never as success), offers plan/dry-run previews, and guides account setup (`/switch setup`, after-install note, status bar chip with copyable `hermes auth add` commands). A pre_tool_call hook escalates every model-initiated real switch and auto run to the human-approval gate (list/plan stay direct), so a prompt-injected turn cannot silently redirect which account gets billed. Disclosure — reorders your Hermes credential pools through the pool's own move_entry (the call behind `hermes auth priority`); background rotation is OPT-IN and OFF by default: only after you set plugins.credential-pool-switcher.auto_rotate: true in config.yaml does the pre_llm_call hook start a rotation in a short-lived background thread at most every 10 minutes (shared across Hermes processes), which then reorders the pool WITHOUT a per-run approval prompt (the approval gate covers model-initiated tool calls only); usage is read through Hermes' public agent.account_usage.fetch_account_usage(read_only=True), which sends each non-dead pooled Anthropic OAuth token from Hermes' own login flows (manual:*, hermes_pkce; benched ones included; tokens borrowed from other tools such as claude_code or env are never sent) to api.anthropic.com to read that account's own usage, when you run /switch list, `auto` or open the chip popover (and every 10 minutes only if you opted in to background rotation); it keeps one small state file, credential-pool-switcher-state.json in the Hermes home (timestamps and the last result, no credentials); the plugin has no path of its own to auth.json: reads go through Hermes' public read-only agent.credential_pool.read_credential_pool accessor and fail closed when it is missing or the pool is unreadable, only a move loads the real pool (load_pool, then move_entry), the plugin never writes auth.json and never refreshes or stores tokens; its desktop chip polls `hermes credential-pool-switcher status --json` and runs `hermes credential-pool-switcher switch <label>` or `auto` when you click."
maintainer: hendkai
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "1.5.2"
platforms: []
readme: true
capabilities:
  provides_tools:
    - account_switch
  provides_hooks:
