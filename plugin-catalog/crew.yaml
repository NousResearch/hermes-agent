name: crew
repo: https://github.com/macd2/Crew
sha: 2485e745f756da366db6943ff46b7e9c31f31ed9
description: "One /crew message becomes verified work on the kanban board. A coordinator owns every card until its proof command exits 0 - one writer per card, an independent verifier, a hard token budget per card, and a live local dashboard of every card, run and tool call. Disclosure — install.py creates four crew-* profiles cloned from your chat profile (including its .env provider keys and memories), deletes non-crew skills in them, updates crew in other profiles and on Linux starts a loopback dashboard service (127.0.0.1:8799, transcript excerpts; --publish serves it to one tailnet login; not installed on native Windows, where you start it by hand); a Crew tab in the Hermes dashboard and a Crew page in Hermes Desktop build that board inside the Hermes backend, including its transcript excerpts and its acknowledge action, under /api/plugins/crew/ to anyone with dashboard access; a detached coordinator makes read-only model decisions and runs card proof commands unattended with a scrubbed env (in Git for Windows's bash on Windows), flagged or changed proofs only after the owner answers /crew-proof; card reports and questions are sent to the originating chat via hermes send; agent-written per-role lessons are injected into later crew turns."
maintainer: macd2
tier: community
category: automation
requires_hermes: ">=0.21.5"
docs_url: https://github.com/macd2/Crew#readme
version: "0.9.7"
image: https://raw.githubusercontent.com/macd2/Crew/2485e745f756da366db6943ff46b7e9c31f31ed9/assets/banner.png
