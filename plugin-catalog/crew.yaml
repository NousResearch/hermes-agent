name: crew
repo: https://github.com/macd2/Crew
sha: fd5df106117c99c764fe627da015e1bb248d774c
description: One /crew message becomes verified work on the kanban board. A coordinator owns every card
  until its proof command exits 0 - one writer per card, an independent verifier, a hard token budget per
  card, and a live local dashboard of every card, run and tool call.
maintainer: macd2
tier: community
category: automation
requires_hermes: ">=0.21"
docs_url: https://github.com/macd2/Crew#readme
version: "0.7.0"
platforms: [linux]
capabilities:
  provides_tools: []
  provides_hooks: [pre_tool_call, post_tool_call, pre_llm_call, post_api_request, api_request_error, on_kanban_dispatch_tick]
  provides_middleware: []
  requires_env: []
