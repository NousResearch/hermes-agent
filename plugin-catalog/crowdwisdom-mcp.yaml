description: "Crowd sentiment for US stocks, ETFs, crypto, futures and FX through CrowdWisdom Trading's official MCP server (Streamable HTTP at https://api.crowdwisdomtrading.com/mcp, no sign-in, no keys in config). Two read-only tools, get_crowd_sentiment_today and get_crowd_sentiment_week, return a score from -100 (everyone short) to +100 (everyone long) plus the number of distinct pro traders behind it. Free, 50 calls a day per IP. Agent Plugins v1 package (plugin.json + mcp.json), configuration only. Disclosure: hosted-only connector with no local code; every tool call sends the ticker to api.crowdwisdomtrading.com, which sees the caller's IP address for the daily limit. The hosted server is not open source; the package marks it untrusted. The tool set is served by the remote server at runtime and is not covered by the pinned sha. Aggregated crowd opinion for research, not investment advice."
