title: ctx checkpoint
description: "Memory provider that archives the direct user/assistant transcript into a ctx knowledge store before every compaction, deterministically and with no LLM in the path, and hands the resulting block IDs to the compaction summary so the exact wording stays recoverable. Set up from the Desktop/Dashboard memory form or `hermes memory setup ctx_checkpoint` (ctx URL and API key, no YAML editing; the Desktop form and the terminal setup test the connection before saving a changed URL or key); checkpoint limits and memory switches sit under Settings → Plugins; over MCP, `hermes memory status` tests the connection and shows the last checkpoint; compaction thresholds stay Hermes' defaults, which suit 1M-token windows. Best-effort by default; with compression.checkpoint_required (the operating mode the Desktop form and the terminal setup offer) it uses the fail-closed pre-compress checkpoint contract (#94639) and blocks compaction until the checkpoint is durable. Optional memory layer (`memory: true`, off by default): recall before each turn, ctx_query/ctx_store/ctx_search/ctx_get tools, a mirror of MEMORY.md/USER.md, fact extraction from compacted turns, session digests and a bundled `ctx-memory` skill, over the same ctx server. Disclosure — the turns about to be compacted (tool results and system prompts excluded; the ctx key the server entry signs in with and credentials in known shapes are masked, while unnamed values, plain-word passwords, card numbers and IBANs pass) and, with the memory layer on, the mirrored memory entries, extracted facts and digests (all redacted the same way) are written through Hermes' MCP dispatch to the ctx server you configure in mcp_servers; setup, when you run it, writes memory.ctx_checkpoint and that mcp_servers entry to config.yaml and the API key to .env as CTX_API_KEY, and compression.checkpoint_required only when you change the operating mode (turning it on needs a passing connection test; otherwise nothing is written); the connection test is Hermes' own MCP probe of that same entry; the plugin never writes compaction thresholds, holds no credentials of its own unless you opt into transport: rest (CTX_KEY in .env; that client redacts the key from every error text it produces and follows no HTTP redirect); to mask the ctx key it reads, through Hermes' config and env lookups (.env included), the key in that mcp_servers entry's Authorization or X-Context-Key header and CTX_API_KEY, and uses them for nothing else; of the other mcp_servers entries it reads only the names and enabled flags, to refuse one whose tool names would collide with its own; it makes no other network calls and has no telemetry; it reads state.db read-only, records the outcome of the last checkpoint and the checkpoint head ID of up to 512 recent sessions in HERMES_HOME/ctx_state/checkpoint-status.state (plus a lock file) and, with the memory layer on, keeps small dedupe state files there; once a session has a checkpoint, its system prompt carries a short pointer to it (head ID, its title and the read tools' names; no transcript text), also with the memory layer off; it imports the core modules agent.memory_provider, agent.redact, agent.secret_scope, tools.registry, tools.interrupt, hermes_constants, utils, hermes_cli.config, hermes_cli.mcp_config (the private _probe_single_server behind `hermes mcp test`) and plugins.memory.config_schema (the Desktop memory form)."
