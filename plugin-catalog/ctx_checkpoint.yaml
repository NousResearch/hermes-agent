title: ctx checkpoint
description: "Memory provider that archives the direct user/assistant transcript into a ctx knowledge store before every compaction, deterministically and with no LLM in the path, and hands the resulting block IDs to the compaction summary so the exact wording stays recoverable. Set up from the Desktop/Dashboard memory form or `hermes memory setup ctx_checkpoint` (ctx URL and API key, no YAML editing); compaction thresholds stay Hermes' defaults, which suit 1M-token windows. Best-effort on any supported Hermes; with compression.checkpoint_required on Hermes 0.21.1+ it uses the fail-closed pre-compress checkpoint contract (#94639) and blocks compaction until the checkpoint is durable. Optional memory layer (`memory: true`, off by default): recall before each turn, ctx_query/ctx_store/ctx_search/ctx_get tools, a mirror of MEMORY.md/USER.md, fact extraction from compacted turns, session digests and a bundled `ctx-memory` skill, over the same ctx server. Disclosure — the turns about to be compacted (tool results and system prompts excluded, secrets redacted twice) and, with the memory layer on, the mirrored memory entries, extracted facts and digests (all redacted the same way) are written through Hermes' MCP dispatch to the ctx server you configure in mcp_servers; setup, when you run it, writes memory.ctx_checkpoint and that mcp_servers entry to config.yaml and the API key to .env as CTX_API_KEY; the plugin never writes compaction settings, holds no credentials of its own unless you opt into transport: rest (CTX_KEY in .env), makes no other network calls and has no telemetry; with the memory layer on it keeps small dedupe state files under HERMES_HOME/ctx_state and reads state.db read-only; it imports the core modules agent.redact, agent.secret_scope, tools.registry and hermes_cli.config."
maintainer: GottZ
tier: community
category: memory
requires_hermes: ">=0.20.4"
