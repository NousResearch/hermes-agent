version: "0.1.1"
title: ctx handover
description: "Close your laptop after work and let the session go on on your server: ctx_handover moves a running Hermes session — the conversation, its project folder and the other files it works with — from one machine you own to another, and back. On the other machine you open the session and carry on, or, if you allow it there, the agent works on one more task by itself; without a direct connection, a single handover file does the job. How it works: the laptop pulls from the server (works behind NAT), the server receives a push, or a signed offline bundle (export/import) bridges machines without a direct route. The conversation (transcript) is transferred row by row and verified by hashes on both sides, git repositories keep branches, stash and uncommitted work, nothing local at the destination is overwritten, and the continuing agent gets a note about what changed. The source session is locked while a handover runs and retires only after the target confirms; a failed handover leaves it usable. Works without ctx; with ctx_checkpoint as memory provider and your consent in /handover setup it also records each handover in ctx. Not the core /handoff. Disclosure — network: HTTPS (plain HTTP only on loopback or for a peer you mark --allow-insecure) only to the gateways you pair, during pairing, doctor, status and handovers you start or claim; each handover sends the peer this machine's environment facts (OS, host and user name, home and Hermes home, shell, locale, versions, model and provider, tool versions, allowed roots and free space; never environment-variable values); doctor --measure uploads up to 15 MiB of zero-filled test data per peer; no third-party services, no telemetry, no update checks. Inbound: once a device is paired, Ed25519-signed routes under /api/plugins/ctx_handover/v1/ behind the dashboard sign-in let it take this profile's sessions with their working files (pull right) or write sessions and workspace copies under allow_roots (push right); a request's signature is checked before its rights and its body, a paired device can open only the kind of handover its right allows, and answers are signed over status, request nonce and body, not yet over method and path (a named limit in the README). Transferred data, unredacted (nothing is blacked out): the transcript, tool outputs and attachments; the session's working directory including git history and uncommitted and untracked files; files under your home the transcript references (asked first); bundles are unencrypted (0600). A secrets denylist keeps workspace .env files, keys and credential locations out unless you release a path with --include-secret, and Hermes' own credentials always out. Credentials: the peer's dashboard token or Basic login, proxy header values and the plugin's Ed25519 identity key live in the profile .env, read through agent.secret_scope.get_secret (falling back to Hermes' own hermes_cli.config reader when a key was created or rotated after the process started) and written through Hermes' .env writer; the stored dashboard credential opens the peer's whole dashboard (configuration, secrets, terminal), not only this plugin, so a reverse proxy that passes only /api/plugins/ctx_handover/ is recommended. Reads /proc (boot id, own PID-namespace link, /proc/self/status) for owner stamps and the umask, and Hermes' gateway status files to detect --yolo before a continuation. Lock: the source session is ended, archived, hidden and renamed through Hermes' session store, which holds even with the plugin disabled; new turns and tool calls on it are refused only while the plugin is loaded, so a session reopened from the archive with the plugin disabled continues as an independent copy. Commands: git without a shell (hooks, credential helpers, fsmonitor and LFS smudge off for received data); git and what it starts (git-lfs, helpers) get an environment built from an allowlist — the search path, the home folder, XDG_CONFIG_HOME, the temp folder, the time zone, SUDO_UID (for Hermes running as root through sudo on another user's repository) and on Windows the system variables git needs — so provider keys and tokens never reach them, and a clean filter of your own git configuration that needs other variables (for example sops) runs without them: a required one stops the handover, any other leaves the file unfiltered in the handover copy; git lfs checkout runs from the shipped objects with the standard Git LFS filter for that one call and is skipped when a path it would write is a symbolic link or lies behind one and git-lfs there is older than 3.7.1 or its version cannot be read (those large files then stay small LFS pointer files, and the final message names the link and recommends git-lfs 3.7.1 or newer); --version probes of developer tools; and with --continue plus allow_remote_continue on the target one hermes chat --resume single-query turn, which inherits the gateway's environment minus the auto-approve variables, because the turn needs the model provider's keys, and never starts when approvals are off there as far as the starting process can tell, or when the gateway cannot be identified. Background threads per handover; staging and a block cache in the plugin data folder (default up to 5 GiB, 3 days). Model use (refine: off disables it): one side question to the session's own model with the llm.side_question grant, or up to 60,000 characters of redacted transcript to your main model. Imports hermes_state, hermes_constants, hermes_cli.config, agent.secret_scope, agent.plugin_llm, agent.redact, plugins.plugin_storage, gateway.platforms.base, gateway.status and providers."
