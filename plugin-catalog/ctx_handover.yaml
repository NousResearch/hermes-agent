version: "0.1.0"
title: ctx handover
description: "Moves a live Hermes session and the working files it needs to another Hermes gateway you own and continues it there: the laptop pulls from the server (works behind NAT), the server receives a push, or a signed offline bundle (export/import) bridges machines without a direct route. The transcript is transferred row by row and verified by hashes on both sides, git repositories keep branches, stash and uncommitted work, nothing local at the destination is overwritten, and the continuing agent gets a note about what changed. The source is locked while a handover runs and retires only after the target confirms; a failed handover leaves it usable. Works without ctx; with ctx_checkpoint as memory provider and your consent in /handover setup it also records each handover in ctx. Not the core /handoff. Disclosure — network: HTTPS (plain HTTP only on loopback or for a peer you mark --allow-insecure) only to the gateways you pair, during pairing, doctor, status and handovers you start or claim; each handover sends the peer this machine's environment facts (OS, host and user name, home and Hermes home, shell, locale, versions, model and provider, tool versions, allowed roots and free space; never environment-variable values); doctor --measure uploads up to 15 MiB of zero-filled test data per peer; no third-party services, no telemetry, no update checks. Inbound: once a device is paired, Ed25519-signed routes under /api/plugins/ctx_handover/v1/ behind the dashboard sign-in let it take this profile's sessions with their working files (pull right) or write sessions and workspace copies under allow_roots (push right). Transferred data: the transcript, tool outputs and attachments unredacted; the session's working directory including git history and uncommitted and untracked files; files under your home the transcript references (asked first); bundles are unencrypted (0600). A secrets denylist keeps workspace .env files, keys and credential locations out unless you release a path with --include-secret, and Hermes' own credentials always out. Credentials: the peer's dashboard token or Basic login, proxy header values and the plugin's Ed25519 identity key live in the profile .env, read through agent.secret_scope.get_secret (falling back to Hermes' own hermes_cli.config reader when a key was created or rotated after the process started) and written through Hermes' .env writer; the stored dashboard credential opens the peer's whole dashboard (configuration, secrets, terminal), not only this plugin, so a reverse proxy that passes only /api/plugins/ctx_handover/ is recommended. Reads /proc (boot id, own PID-namespace link, /proc/self/status) for owner stamps and the umask, and Hermes' gateway status files to detect --yolo before a continuation. Lock: the source session is ended, archived, hidden and renamed through Hermes' session store, which holds even with the plugin disabled; new turns and tool calls on it are refused only while the plugin is loaded, so a session reopened from the archive with the plugin disabled continues as an independent copy. Commands: git without a shell (hooks, credential helpers, fsmonitor and LFS smudge off for received data), --version probes of developer tools, and with --continue plus allow_remote_continue on the target one hermes chat --resume single-query turn, never when approvals are off there or the gateway cannot be identified. Background threads per handover; staging and a block cache in the plugin data folder (default up to 5 GiB, 3 days). Model use (refine: off disables it): one side question to the session's own model with the llm.side_question grant, or up to 60,000 characters of redacted transcript to your main model. Imports hermes_state, hermes_constants, hermes_cli.config, agent.secret_scope, agent.plugin_llm, agent.redact, plugins.plugin_storage, gateway.platforms.base, gateway.status and providers."
maintainer: GottZ
