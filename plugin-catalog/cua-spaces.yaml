description: "Cua's own plugin: runs Hermes's terminal, file and code tools inside a Cua Space, an isolated Linux machine you can watch live, as a terminal backend (`hermes config set terminal.backend cua`). Disclosure — installs the `cua` Python SDK (>=0.5.0,<0.6); every command the agent runs and every file it touches go to the Space: on this machine for a local Space, or on Cua's cloud (cua.ai) or a machine you name, using the sign-in `cua auth login` saved (the plugin never reads or stores a token, and keeps CUA_API_KEY/CUA_DAEMON_TOKEN out of the Space). With the default `space: create` it makes a fresh Space per session and deletes it when Hermes finishes (`delete_on_exit`); because that Space is a disposable sandbox, Hermes skips its dangerous-command prompts there, as it does for its other container backends. A Space you name is never deleted and keeps the prompts."
