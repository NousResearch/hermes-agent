description: "Cursor model provider using the official proprietary Cursor SDK. Disclosure — uses Cursor's proprietary cursor-sdk (PyPI, bundled binary bridge on loopback) with the user's CURSOR_API_KEY; sends the full conversation, tool schemas/results and images (HTTPS URLs or base64) to Cursor; keeps private per-session SDK workspaces under HERMES_HOME/cache/cursor-sdk. Cursor built-in tools and MCP are requested off and Hermes keeps tool execution and approvals; native custom tools are opt-in (default off) with an inert executor. Plan-only exhaustion and rejected model parameters are terminal and fail closed without fallback. The SDK passes a loopback tool-callback token on the bridge argv (not the API key) and copies the gateway environment into the bridge process."
