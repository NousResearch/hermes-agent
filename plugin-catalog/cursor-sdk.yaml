name: cursor-sdk
repo: https://github.com/mcpeezy/hermes-cursor-sdk
sha: 0e546bc079ab23451a52a12ca02e8a55af34e217
description: >-
  Experimental model transport using the official Cursor Agent SDK.
  Requests go to Cursor through its official SDK. The plugin cannot enforce an
  included-only spending cap and never changes account spending settings.
  Instructions use a Cursor project rule, not a native system-role override.
  Permission and prompt-hierarchy equivalence remain unqualified.
  The plugin spawns Node and a local SDK agent, runs Git initialization in a
  plugin-owned workspace, and writes project rules, hooks, and SDK state under
  its own runtime directory. That state may contain private conversation data
  and currently remains on disk. Credentials come from Hermes's profile-scoped
  secret accessor. No credential store or vendor token file is read directly
  by plugin code. Text-only, buffered responses. The bundled model snapshot
  is not live entitlement discovery. Optional picker hooks require Hermes
  support. This plugin does not patch the desktop.
maintainer: mcpeezy
tier: community
category: models
requires_hermes: ">=0.22.0"
docs_url: https://github.com/mcpeezy/hermes-cursor-sdk#readme
version: "0.1.0"
readme: true
platforms:
  - macos
  - linux
known_issues:
  - "Experimental: included subscription billing and live permission equivalence are not verified."
  - "Node 22.13 or later and Git are required. Install the pinned npm dependencies in the plugin directory."
  - "Text-only, buffered responses. Model snapshot is not live entitlement discovery."
  - "SDK workspaces and conversation state remain under the installed plugin's runtime directory."
  - "Uses 3 private Hermes helper imports, disclosed in the README and entry PR."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - CURSOR_API_KEY
