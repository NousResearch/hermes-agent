description: >-
  Add custom dangerous command patterns to Hermes's built-in approval
  system. Users define regex patterns in YAML; a pre_tool_call hook sends
  block patterns to Hermes's human approval gate and blocks deny patterns
  immediately. Modifies no Hermes internals.
maintainer: scross01
tier: community
category: tools
requires_hermes: ">=0.21.4"
