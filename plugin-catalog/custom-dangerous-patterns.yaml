name: custom-dangerous-patterns
repo: https://github.com/scross01/hermes-custom-dangerous-patterns-plugin
sha: 788dc41c50201877d353e847626c8a096ab6968f
description: >-
  Add custom dangerous command patterns to Hermes's built-in approval
  system. Users define regex patterns in YAML; a pre_tool_call hook sends
  block patterns to Hermes's human approval gate and blocks deny patterns
  immediately. Modifies no Hermes internals.
maintainer: scross01
tier: community
category: tools
requires_hermes: ">=0.15"
version: "0.5.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env: []
