name: cut-sprite-sheet
repo: https://github.com/TakeshiTGAL/hermes-plugin-sprite-sheet
sha: abb003f824e1b2fe89682237a4e01d6227248683
version: "0.1.2"
requires_hermes: ">=0.21.6"
description: 'pixel art sprite sheet cutter. png to tileset splitter. cut pixel art into game tiles. sprite sheet from pixel png. 2d walk cycle sprite sheet. tileset cutter for pixel art. split png into sprite sheet. shore tiles tileset tool. pixel art walk cycle sheet. png sprite and shore tiles. Cuts a pixel-art png into frames. Tools: inspect_grid, slice_grid, place_kit for a 2D game. Disclosure — The png stays on this computer. Nothing is sent. No API key. No daily cap. A gateway room can call the tools. Stop them with hermes tools. While the plugin is enabled, its skill adds one line to the skills index of every session, including surfaces where the tools are turned off. One approval on one line via pre_tool_call. Choosing always covers only the same call when a person is present and the plan does not delete a file. That choice adds one plugin_rule:<tool>:<16 hex> line to command_allowlist in config.yaml. That line stays after the plugin is removed. The plugin itself refuses cron, hermes -q, webhook, msgraph_webhook, the API server, and the plugin host, even after always, so the same call still writes nothing there. A turn with no person and no gateway writes nothing, even after always. A plan that deletes a file asks on every call. An oversized line writes one list file, <stem>.paths.txt beside the png. A failed check writes nothing. Hermes yolo and approvals off skip that prompt when a person is present. cron, -q, and unattended sessions default to deny. A sprite writes <stem>.spriteframes.tres, <stem>.png.meta, <stem>.png.import, and <stem>.slice.json beside the png, and, unless emit_scene is false, <stem>_stage.gd and <stem>_stage.tscn. A tileset writes <stem>.tileset.tres, <stem>.png.meta, <stem>.png.import, <stem>.slice.json, and <stem>.<name>.asset plus <stem>.<name>.asset.meta for each tile. A tight tileset also writes <stem>.extruded.png and <stem>.extruded.png.import, and writes <stem>.extruded.png.meta in place of <stem>.png.meta. place_kit writes the sheet png, <stem>_tiles.png, those sidecars, the stage, and project.godot only when that file is missing. Those project files stay after uninstall. The always line stays in config.yaml. The skill index line stays only while the plugin is enabled. Empty, unknown, or a restrictive license is not written. Unknown text is copied and next warns. CC-BY-SA is copied and next names share-alike. No license chunk still writes and next says no rights are attached. Import once or play fails: godot --headless --editor --quit --path <project>. No solid-color box and no sound effect. Does not launch Godot or Unity. Play may write app-userdata. That folder stays. Uninstall leaves no cron job. Linux is untested. Unity editor 6000.6.6f1 on macOS kept the walk-sheet fileIDs after a reopen.'
maintainer: TakeshiTGAL
tier: community
category: tools
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-sprite-sheet
platforms:
  - macos
capabilities:
  provides_tools:
    - inspect_grid
    - slice_grid
    - place_kit
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
