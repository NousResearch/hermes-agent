version: "0.2.0"
description: "Local-first video editing studio: edit a talking video by deleting words from its transcript, style it for Instagram Reels, YouTube Shorts, TikTok or YouTube (animated word captions, face-tracked or blurred reframing, punch-ins and transitions, supplied music ducked under speech, platform loudness), find clips in long recordings, preview with automated quality checks, approve, then export the final, a cover, chapters and a local delivery package. Ships a Hermes Desktop Studio page, three agent tools for projects and background jobs (no approval tool: only a person can approve a final export) and a CLI. Requires FFmpeg/ffprobe on PATH; speech, vision and segmentation need optional Python packages and local model files. Disclosure — reads only the local media paths it is given and launches local FFmpeg/ffprobe and a Python worker subprocess with a minimal allowlisted environment (provider API keys and tokens are not forwarded); the worker interpreter comes only from CUTROOM_PYTHON, the plugin's bundled .venv or Hermes' own interpreter; projects, renders and reports are written only under its own workspace in the Hermes home and never overwrite sources or existing outputs; models are never downloaded automatically, and `cutroom setup-models --confirm-downloads` fetches pinned files from storage.googleapis.com (MediaPipe) and huggingface.co (faster-whisper) with SHA-256 verification. Two optional Studio actions run only from a person's click in the Desktop page, never from agent tools: Send to the cloud runs the person's own rclone CLI with its own configuration (Cutroom never reads rclone's config or tokens) to copy an approved export into a new folder on a remote the person chose, such as Google Drive; Record with OBS talks to OBS Studio's WebSocket server on a loopback address only, with the OBS password the person typed into the plugin's Desktop settings (stored by Hermes Desktop on that computer, sent only with OBS requests, never written to projects or logs). In chats on messaging services, finished renders are not shared automatically; the agent is told to ask first. No telemetry, no API keys, no self-update. Approval records a person's decision in the Desktop Studio page; it is a workflow record, not a security boundary against other code running as the same user."
