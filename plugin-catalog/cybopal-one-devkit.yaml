version: "0.2.3"
description: "Unofficial, not made or endorsed by CyboPal. Drive a CyboPal ONE (a 27-inch 4K screen on a 6-DOF robotic arm with the Pauli companion display) from Hermes: follow, posture presets, exact poses, gestures, both screens (markdown, pictures and videos), both cameras and an emergency stop; design new actions on the simulator and save them to run unchanged on the hardware. Works today against the open source CyboPal ONE DevKit live simulator. Disclosure — sends HTTP commands, screen text and any picture or video file the agent is given (PNG/JPEG/WebP/GIF/MP4/WebM, up to 64 MB, checked by content) only to the device_url setting (default http://127.0.0.1:5000), never following redirects or environment proxies; saves camera pictures (newest 30) and saved routines in the profile's plugin-data/cybopal-one-devkit; moves physical hardware when device_url points at a real CyboPal ONE (allow_motion off refuses all motion, and only the person's /cybopal resume command can release an emergency stop)."
