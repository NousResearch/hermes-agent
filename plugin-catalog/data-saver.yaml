sha: 443fe0729dbd2e21fe862f0e4d4347ecc81f9dd1
version: "0.1.1"
description: "A mobile-data budget for Hermes. A pre_tool_call hook forecasts how many megabytes a terminal command will download before it runs (pip/uv with dependencies, git clone, docker pull, Hugging Face, ollama, curl/wget) and sends anything over the daily or monthly budget to Hermes's own approval prompt, or blocks it in enforce mode. Execution middleware meters the real bytes each tool call and model request used from the OS network counters into a local ledger; a lean mode trims web results when the budget runs low. Tools: data_usage, data_forecast. Command: /datasaver. Hermes Agent Plugin Hackathon entry. Disclosure — forecasts send read-only metadata requests (package, repo, image or model name only; no credentials) to pypi.org, api.github.com, auth.docker.io, registry-1.docker.io, huggingface.co and registry.ollama.ai, and one header-only request to a URL named in a curl/wget command, before the command reaches the approval prompt; that URL and every redirect hop are probed only when Hermes' is_safe_url accepts them and every address they resolve to is public. The ledger (<HERMES_HOME>/plugin-data/data-saver/data.db) stores time, tool name, bytes and the first 300 characters of the command or URL (including any token written into it), locally. In lean mode it shortens web_extract and web_search results. Network counters are system-wide, so other apps' traffic during a tool call is counted. No telemetry, no shell commands, no background process."
maintainer: ahmardchain
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/ahmardchain/ahmardchain-hermes-data-saver#readme
capabilities:
  provides_tools:
    - data_usage
    - data_forecast
  provides_hooks:
    - pre_tool_call
  provides_middleware:
    - tool_request
    - tool_execution
    - llm_execution
  requires_env: []
