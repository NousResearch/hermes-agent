name: data-saver
title: Data Saver
repo: https://github.com/ahmardchain/ahmardchain-hermes-data-saver
sha: c77d941d2d4643dfbce30675fd6f3194c7babccb
version: "0.1.0"
description: "A mobile-data budget for Hermes. A pre_tool_call hook forecasts how many megabytes a terminal command will download before it runs (pip/uv with dependencies, git clone, docker pull, Hugging Face, ollama, curl/wget) and sends anything over the daily or monthly budget to Hermes's own approval prompt, or blocks it in enforce mode. Execution middleware meters the real bytes each tool call and model request used from the OS network counters into a local ledger; a lean mode trims web results when the budget runs low. Tools: data_usage, data_forecast. Command: /datasaver. Hermes Agent Plugin Hackathon entry. Disclosure — forecasts send read-only metadata requests (package, repo, image or model name only; no credentials) to pypi.org, api.github.com, auth.docker.io, registry-1.docker.io, huggingface.co and registry.ollama.ai, and one header-only request to a public URL named in a curl/wget command, before the command reaches the approval prompt; local and private addresses are never probed. The ledger (<HERMES_HOME>/plugin-data/data-saver/data.db) stores time, tool name, bytes and the first 300 characters of the command or URL, locally. Network counters are system-wide, so other apps' traffic during a tool call is counted. No telemetry, no shell commands, no background process."
maintainer: ahmardchain
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/ahmardchain/ahmardchain-hermes-data-saver#readme
capabilities:
  provides_tools:
    - data_usage
    - data_forecast
  provides_hooks:
    - pre_tool_call
  provides_middleware:
    - tool_request
    - tool_execution
    - llm_execution
  requires_env: []
