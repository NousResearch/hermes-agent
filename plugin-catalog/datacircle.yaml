sha: "9a96a1c52370c00412a78d39b6cbd4c988c6b72f"
version: "0.1.0"
description: "Find the best GTM APIs. Four tools on Datacircle's open API, with no key and no account: every API on Datacircle's sheet, who is best for each by score out of 100, every plan and its price, and one provider's ranks. Disclosure: each tool call makes one HTTPS GET to api.datacircle.dev with the tool's own arguments and nothing else. No key, no stored data, no shell commands, no background process, no telemetry. Tool results enter the session context and so reach the user's model provider."
maintainer: waynehamadi
tier: community
category: tools
requires_hermes: ">=0.23.1"
docs_url: https://datacircle.dev/api
readme: true
platforms: []
capabilities:
  provides_tools:
    - datacircle_list_apis
    - datacircle_best_plans
    - datacircle_search_plans
    - datacircle_provider
  provides_hooks: []
  provides_middleware: []
  requires_env: []
