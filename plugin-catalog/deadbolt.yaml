name: deadbolt
repo: https://github.com/seanebones-lang/deadbolt-hermes-plugin
sha: 177fff79a8b6308f8d182146ed8a6e21dc84c565
description: "Review and approve exact text-artifact writes through a local DeadBolt sidecar. Protects this plugin's commit tool only."
maintainer: seanebones-lang
tier: community
category: tools
title: "DeadBolt — reviewed artifact writes"
version: "0.1.0"
requires_hermes: ">=0.22.2"
docs_url: https://github.com/seanebones-lang/deadbolt-hermes-plugin#readme
platforms: [linux, macos]
readme: true
known_issues:
  - "Requires a separately installed DeadBolt 2.0.0 engine and operator-provisioned local sidecar, run, policy and scoped admission credential."
  - "Only this plugin's artifact commit route is gated; other Hermes tools, plugins, MCP routes and already-running work are outside its boundary."
  - "New files only, existing parent directories, 32 KiB request limit and five-minute exact approvals. Admitted filesystem failures require operator reconciliation."
capabilities:
  provides_tools: [deadbolt_prepare_write, deadbolt_commit_write]
  provides_hooks: []
  provides_middleware: []
  requires_env: []
