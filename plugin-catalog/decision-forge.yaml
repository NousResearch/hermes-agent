name: decision-forge
title: Decision Forge
repo: https://github.com/mintymac/decision-forge
sha: "d9aa33d261092db0cd4837e5d1ceed45273404e8"
description: >-
  Cognitive-ergonomic decision briefs and response-format router for Hermes Agent.
  Routes non-trivial responses across six research-grounded formats (Update, Choice,
  Triage, Experiment, Roadmap, People + direct bypass), lints decision hygiene
  (flagging fake urgency, uncalibrated confidence scores, and missing reversal
  conditions), compiles interactive ::preview HTML panels with data-hermes-send
  controls and plain-text fallbacks, bundles the decision-forge skill, and adds
  the interactive Decision Forge Field Guide and Handoff Composer to Hermes Desktop.
  Disclosure — makes no external network calls; stores compiled brief metadata locally
  in <HERMES_HOME>/plugins/decision-forge/state/briefs.jsonl and writes compiled HTML
  panels only to the caller-supplied output_path; no telemetry, background daemons,
  credential reads, or self-updating code.
