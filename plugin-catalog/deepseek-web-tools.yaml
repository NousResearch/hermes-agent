name: deepseek-web-tools
repo: https://github.com/fedebyes/hermes-deepseek-web-tools
sha: 2f0f2d040568f8e9eb57d58f25e6dedd8a87b718
description: "DeepSeek's server-side web tools as one Hermes tool: the model searches, opens pages and checks facts inside a single call, then answers with structured citations. thinking is opt-in (the server default is on and bills up to ~20 searches), and page text is never returned - use web_extract when you need the content. It can also ask the question over local documents (PDF/Office/text/image, up to 3 per call): each file is uploaded to the DeepSeek Files API first and referenced by id, because the vendor refuses documents inside a chat request. Disclosure — each web_research call sends the query, any URLs and image URL the model passes, and the bytes of any file named in files, to api.deepseek.com with your DEEPSEEK_API_KEY; DeepSeek's servers search and open those pages and bill each search to your account (up to ~20 per call when thinking is on), parse the uploaded documents, and keep them - there is no delete call. No other network host and no shell commands. The plugin writes one local file: a cache of upload ids and timestamps only, no path and no file name, under ~/.local/state/hermes, mode 0600."
maintainer: Fedebyes
tier: community
category: web
requires_hermes: ">=0.23.0"
version: "1.0.5"
title: "DeepSeek Web Tools"
readme: true
capabilities:
  provides_tools: [web_research]
  provides_hooks: []
  provides_middleware: []
  requires_env: [DEEPSEEK_API_KEY]
