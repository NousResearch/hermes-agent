name: deferred-questions
repo: https://github.com/web3blind/hermes-deferred-questions
sha: eeb86254725e8ba0d599f85d25c63488efd06364
description: "Durable non-blocking questions with exact answer binding and gateway continuation. Disclosure — its pre_gateway_dispatch hook sees every gateway message and consumes only `dq <id> …` answers from the stored recipient; with `enable_tool` on, the model can send questions to any chat the gateway already authorizes, and a question marked continue_agent resumes that chat's agent with the user's answer; questions and answers are stored unencrypted in $HERMES_HOME/deferred-questions/questions.sqlite3; it calls private gateway and adapter methods, so a Hermes update can break delivery until it is re-pinned."
maintainer: web3blind
tier: community
category: automation
requires_hermes: ">=0.21.6"
platforms: [linux, macos]
version: "0.2.4"
docs_url: https://github.com/web3blind/hermes-deferred-questions#readme
readme: true
capabilities:
  provides_tools: [deferred_questions]
  provides_hooks: [pre_gateway_dispatch]
  provides_middleware: []
  requires_env: []
