name: deferred-questions
repo: https://github.com/web3blind/hermes-deferred-questions
sha: eb54ec9efc79539251603d4777cd084fb9d8587e
description: "Durable non-blocking questions with exact answer binding and gateway continuation. Disclosure — pre_gateway_dispatch sees gateway messages, accepts answers only from the stored recipient and route, and may consume recognized stale/completed inputs; with enable_tool on, the model can send questions to any chat the gateway already authorizes, and continue_agent resumes the target chat with the answer; questions and answers are stored unencrypted in $HERMES_HOME/deferred-questions/questions.sqlite3; profile-local Unix-socket notices wake event-driven workers; pre_llm_call/on_session_end observe current input, turn IDs and terminal status to correlate technical completion for payload retirement, not business success or delivery; automatic header-only repair preserves originals in quarantine, and text-free receipts retain caller-supplied idempotency keys and request hashes; private gateway and adapter APIs can break after a Hermes update."
maintainer: web3blind
tier: community
category: automation
requires_hermes: ">=0.21.6"
platforms: [linux, macos]
version: "0.3.0"
docs_url: https://github.com/web3blind/hermes-deferred-questions#readme
readme: true
known_issues:
  - "Before upgrading, stop older gateway/CLI plugin processes and external store-replacement watchdogs, back up the ledger, and preserve its recovery metadata and stable lock files."
  - "No timed retry or expiry scheduler: a lost wake notice needs another explicit wake or reconnect; expiry is checked on access."
  - "Retired payloads are cleared from the live ledger, not external backups, quarantine copies, platform messages or Hermes history; uncertain continuations and storage-only answers can remain."
capabilities:
  provides_tools: [deferred_questions]
  provides_hooks: [pre_gateway_dispatch, pre_llm_call, on_session_end]
  provides_middleware: []
  requires_env: []
