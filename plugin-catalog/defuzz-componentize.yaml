description: "Optional Defuzz companion for turning Python scripts into reusable components checked against saved baseline output, with 14 declarative project kits, CLI and slash commands, bundled guidance, and a Desktop settings page. Requires Python 3.13 or newer. Disclosure — Runs the baseline and test commands named in a componentize spec (`golden.argv`, `tests.argv`), and imports and calls `register()` on any plugin trees the spec lists, with your user's permissions, without a sandbox and without a Hermes approval prompt, including when started from the `/componentize` slash command in chat; nested or detached commands can outlive a cancel. It reads the chosen projects, library, specs, inputs and job evidence; creates project folders, updates kit-owned AGENTS.md blocks and .gitignore/LFS rules; saves its two settings through Hermes; and writes job evidence and locks under `<library>/.componentize/<name>/` (or `--state-root`). Libc lookup may run system utilities (ldconfig, gcc, objdump). The plugin itself makes no network calls, but the commands and plugins it runs can reach your files and the internet. Linux only; needs Python 3.13 or newer."
