description: "Memory from the coding sessions already on this machine — Claude Code, Codex, Cursor, Hermes and the other agents deja reads, including history from before it was installed. No model, no API key, no server. Disclosure — runs the separately installed, unpinned deja binary (brew install deja-vu) as a subprocess; deja reads Claude Code, Codex, Cursor, Hermes and other agents' local transcript files, keeps its index under ~/.cache/deja, receives the turns Hermes compresses so it can hand them back after compaction, and recalled text from those agents is injected into Hermes turns, with lines deja marks \"User said (this project)\" requiring user confirmation before changing a command, file, rule, or config; nothing leaves the machine."
