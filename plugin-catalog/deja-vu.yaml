description: "Memory from the coding sessions already on this machine — Claude Code, Codex, Cursor, Hermes and the other agents deja reads, including history from before it was installed. No model, no API key, no server. Disclosure: the provider runs the local deja binary (must be on PATH; brew install deja-vu) as a subprocess; deja reads those agents' transcript files and keeps its index under ~/.cache/deja; nothing leaves the machine."
