name: delivery-gate
repo: https://github.com/ToniAdreal/delivery-gate
sha: 9665a67ba77bd41290faec61b0899bf3e8a353b7
description: >-
  Pre-delivery verification for Hermes Agent: runs the deterministic checks
  a task spec declares (test commands, lint, repro scripts) and releases the
  deliverable only when every required check passes, writing a replayable,
  hash-chained evidence record per run. The verdict comes from the
  deterministic checker, never from the model.
maintainer: ToniAdreal
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/ToniAdreal/delivery-gate#readme
version: "0.1.1"
platforms: []
capabilities:
  provides_tools: [delivery_gate_verify, delivery_gate_evidence]
  provides_hooks: []
  provides_middleware: []
  requires_env: []
