sha: ba7651d28bdbecb0e82f431b0c8d6dbc169ad3e0
version: "1.2.0"
description: >-
  Find curated website design references, inspect motion and implementation evidence,
  and retrieve reusable Vault components. Includes the details-design skill.
  Every tool call sends its arguments to https://api.details.so/mcp using the
  connected member's account. Available tools depend on that account's plan.
  The hosted tool set can change independently of the pinned plugin. Searches and
  inspections record usage and can consume Details credits. The package runs
  mcp-remote@0.1.49 through npx (Node.js 20.18.1+ and npm) for browser OAuth,
  opens a local callback on first use, and stores tokens locally under ~/.mcp-auth.
  The server is marked untrusted so Hermes asks before write-capable calls.
