name: detonator
title: "Detonator"
repo: https://github.com/shreyasudupi/hermes-plugin-detonator
sha: "d76011dce93a18edf5783abc270142454a16f3d8"
description: "Security testing sandbox for Hermes plugins and MCP servers: detonate a plugin or MCP server you did not write before you install it, and see whether it steals keys, phones home, runs shell commands or plants persistence. Test any catalog plugin by name (/detonate <name>, no commit SHA needed), any GitHub plugin by its link, or an update before you apply it (/detonate update <name>). After you approve the run, Detonator fetches the plugin at an exact commit and loads it inside a disposable Docker container (no network, read-only, non-root, all capabilities dropped) with a throwaway Hermes home full of decoy keys, drives its hooks and tools, jumps the clock to wake time bombs, and reports what it actually did: credential theft (even disguised or split up), network attempts, shell commands, persistence, prompt injection, tool poisoning, monkeypatching. A full test also watches from outside the plugin's container (a system-call tracer and a fake internet), so a plugin that hides from the inside monitor or fakes a clean result is still caught; a quicker inside-only test is offered, and every report says which test ran. MCP servers (/detonate-mcp <name>) are run the same way, acting as Hermes: every tool is listed and called, then the server is restarted with its clock 400 days ahead, catching poisoned tool descriptions, rug pulls, time bombs, hidden email recipients, sampling abuse and key theft. A malware and supply-chain safety check you can run in seconds, with deterministic rules, a plain-language reason and MITRE ATT&CK / ATLAS IDs per finding; advisory only, a clean run is evidence, not proof. Disclosure — requires Docker; runs git (fetches the target repo over the network) and docker on your machine, only after you approve each run (git ls-remote finds a repo's newest commit when you give no commit). One-time image builds pull a digest-pinned python:3.11-slim (and, for MCP, a digest-pinned node image) and install strace from Debian's signed package archive. For /detonate-mcp it reads only the named mcp_servers entry through Hermes's own config reader (a key written directly into that entry is flagged in the report with only its first four characters shown), and downloads the server's npm or PyPI package in a separate locked-down container (install scripts off, wheels only, runs as your user); package code runs only in the sandbox. That download uses your own proxy settings and certificate bundle if you have them, never host networking (a proxy on localhost is reached through a one-port relay). To read HTTPS the fake internet makes a short-lived test certificate for each run that only the sandbox trusts, never your machine. A full test starts two extra short-lived monitor containers next to the sandbox: the tracer gets the SYS_PTRACE capability, the fake internet NET_ADMIN and NET_BIND_SERVICE; the plugin's own container keeps all capabilities dropped and reaches only the fake internet, never the real one. It refuses to run unattended; writes reports under its own plugin-data folder; never reads your .env, auth.json or Hermes credentials."
