name: detonator
title: "Detonator"
repo: https://github.com/shreyasudupi/hermes-plugin-detonator
sha: "74aaaf1a74d5bd8244e28f389fb2e66c101ee1ce"
description: >-
  Security testing sandbox for Hermes plugins, MCP servers and skills: detonate a plugin, MCP
  server or skill you did not write before you install it, and see whether it steals keys, phones
  home, runs shell commands or plants persistence. Test any catalog plugin by name (/detonate
  <name>, no commit SHA needed), any GitHub plugin by its link, or an update before you apply it
  (/detonate update <name>). After you approve the run, Detonator fetches the plugin at an exact
  commit and loads it inside a disposable Docker container (no network, read-only, non-root, all
  capabilities dropped) with a throwaway Hermes home full of decoy keys, drives its hooks and
  tools, jumps the clock to wake time bombs, and reports what it actually did: credential theft
  (even disguised or split up), network attempts, shell commands, persistence, prompt injection,
  tool poisoning, monkeypatching. A full test also watches from outside the plugin's container (a
  system-call tracer and a fake internet), so a plugin that hides from the inside monitor or fakes
  a clean result is still caught; a quicker inside-only test is offered, and every report says
  which test ran. MCP servers (/detonate-mcp <name>) are run the same way, acting as Hermes: every
  tool is listed and called, then the server is restarted with its clock 400 days ahead, catching
  poisoned tool descriptions, rug pulls, time bombs, hidden email recipients, sampling abuse and
  key theft. Skills (/detonate-skill <folder | name | owner/repo/folder@sha>) get their SKILL.md
  read for planted instructions and download-and-run lures, then the scripts and commands they
  tell the agent to run are run in the sandbox with both outside monitors, and the hosts they
  reach are compared with the hosts they name. A test that writes or prints too much is stopped
  and reported (checked five times a second). Deterministic rules, a plain-language reason and MITRE ATT&CK /
  ATLAS IDs per finding; advisory only, a clean run is evidence, not proof.
  Disclosure — requires Docker; runs git (fetches the target repo over the network) and docker on
  your machine, only after you approve each run, except docker info and docker image inspect for /detonate check
  (git ls-remote finds a repo's newest commit when you give no commit); git runs without your
  personal or system git settings (only proxy, TLS and client-certificate settings and
  core.longpaths are kept), so your own filters and credential helpers never run on downloaded code.
  One-time image builds pull digest-pinned python:3.11-slim and node images (and, for skills, a
  digest-pinned python:3.11-bookworm) and install strace and iptables from Debian's signed package
  archive for the monitor image. For /detonate-mcp it reads only the named mcp_servers entry
  through Hermes's own config reader, and downloads the server's npm or PyPI package in a separate
  locked-down container (install scripts off, wheels only, no git or web-address dependencies,
  1 GB cap, runs as your user); package code runs only in the sandbox. That download uses your own
  proxy settings and certificate bundle if you have them, never host networking (a proxy on
  localhost is reached through a one-port relay). For /detonate-skill with an installed name it
  reads only SKILL.md files under your Hermes skills folder (and its .hub/quarantine) and the
  current project's .hermes/skills and .agents/skills to find it, and copies the skill into
  the run folder; nothing in your skills folder changes and nothing from the skill runs on your
  machine; the skill's fake home may hold runnable files. Other disk activity of more than about
  1.3 GB while a test runs ends that test early as ERROR. To read HTTPS the fake internet makes a short-lived test certificate for each run that
  only the sandbox trusts, never your machine. A full test starts two extra short-lived monitor
  containers next to the sandbox: the tracer gets the SYS_PTRACE capability, the fake internet
  NET_ADMIN and NET_BIND_SERVICE (to load one iptables rule inside its own empty network); the
  tested container keeps all capabilities dropped and reaches only the fake internet, never the
  real one. Folders the tested code locked are removed with a throwaway container (no network, no
  capabilities). It refuses to run unattended; writes reports under its own plugin-data folder;
  never reads your real keys or Hermes credentials.
