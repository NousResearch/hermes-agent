description: "Free website audits through Developh's MCP server (Streamable HTTP at https://www.developh.co/mcp, no sign-in, no keys in config): Google PageSpeed Insights on mobile for any public website, with the four Lighthouse scores, real-visitor Core Web Vitals when Google has them, the failing audits that weigh most, missing security headers and page weight. Bundles the website-audit skill, which turns the report into a ranked fix list for the site's stack. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to www.developh.co, and run_website_audit passes the address it is given to Google PageSpeed Insights. Audits are not stored. Three tools are annotated read-only (run_website_audit, studio_info, list_case_studies). request_contact writes: it sends a project inquiry with the name, email and message the person gives, which Developh stores and records in its analytics, and emails them a confirmation. The package marks the server untrusted, so Hermes asks before request_contact runs and refuses it in unattended runs. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
