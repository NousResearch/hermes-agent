description: "Open-source marketing toolkit for agencies and in-house teams, one listing with three skill groups and 207 skills registered as Hermes skills: Digital Marketing Pro (strategy, SEO/AEO/GEO, paid media, CRM, analytics; 164 skills), ContentForge (fact-checked long-form content with a run auditor; 22 skills) and SocialForge (a content calendar to images, carousels, video and copy; 21 skills). Skills only: no tools, hooks or background processes. Disclosure: optional stdlib scripts call third-party APIs only when the user runs them, with the user's own keys; live writes need a typed yes and, for writes the plugin sends itself, a single-use approval record that the script creates at prepare and the agent approves after the user's yes (Hermes does not prompt before those script runs); paid image and video generation is quoted first; nothing installs unless the user says yes; see the README and each group's PRIVACY.md."
