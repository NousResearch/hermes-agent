title: "Diké"
description: "Diké: checks the article citations of Chilean law in a legal brief against a sealed, hash-identified local copy of 25 statutes (Ley Chile), and refuses to certify what it cannot prove. Each citation comes back verified, with its identifier, source URL and text SHA-256, or unverified with the engine's reason (AMBIGUOUS, UNRESOLVABLE). Three tools (dike_verificar_citas on text or a .md/.txt/.docx path; dike_leer_articulo and dike_buscar_corpus, read-only on the corpus), two commands (/dike-verificar, /dike-estado) and two skills. Text in English, Spanish optional; statute text and engine codes stay in Spanish. Not legal advice: it never certifies that a provision supports an argument, nor that a dated copy is today's text. The opt-in Desktop page adds a Case Writer (a brief editor where only the engine can mark a citation verified, a pseudonymization step you control before any text leaves, and a chat about the brief in your own Hermes gateway), a read-only 3D map of the sealed corpus and a versioned case board; a Dashboard tab and a backend at /api/plugins/dike serve them. Disclosure — the vendored Diké engine runs in a child process (same interpreter, no shell, minimal environment without agent credentials), inside bubblewrap without network when it is available and in a declared degraded mode when it is not. One such sandboxed engine process stays up per session so the corpus is verified once (about 170 MB; it exits after 10 idle minutes or with Hermes). Two hooks (pre_llm_call, pre_tool_call) act only on Case Writer chat sessions, which carry a <dike-escritor v=\\\"1\\\"> envelope: they add fixed instructions and block every tool except skills, tool discovery and this plugin's three tools with text arguments; other sessions are untouched. Model calls happen only when you use that chat, case-board suggestions or opt-in prediction, through your own gateway, after pseudonymization unless you switch it off and confirm sending the real data. Reads only the text passed or the named regular .md/.txt/.docx file (no symlinks). Writes only under HERMES_HOME/plugin-data/dike: the corpus (about 300 MB, unpacked once after a SHA-256 check, checked by file stat on every call and fully re-hashed once per process), temporary files, engine caches, Case Writer briefs, pseudonym maps (they hold the real values; files 0600) and send and hook logs without content. The Desktop page adds one scoped <style> element and removes it on unload. No network of its own after dependency install, no telemetry, never signs.\nNotes: Diké verifies Chilean statute citations locally against a sealed corpus. Brief text leaves the machine only through the user's own Hermes gateway when they use the Case Writer chat, suggestions or prediction, and it is pseudonymised by default. Not crypto. The earlier verdict READY-DISCLOSE still holds, and the earlier disclosure amendment is still needed. The PR yaml at cbd83223 still reads \"after pseudonymization.\" with no opt-out clause, and \"named regular file\" without the .md/.txt/.docx qualifier, so the Disclosure above (the same text as our last review) replaces it. The entry is LISTED on main at 9780e467 (0.2.0), so this is a bump. Earlier non-blocking ask (private version import): NOT FIXED, now at `__init__.py:1420`. It stays non-blocking. The PR is no longer a draft (gh: isDraft=false). Yaml: name `dike`, version 0.10.0 and capabilities (3 tools, 2 hooks) are unchanged and match `plugin.yaml`; `requires_hermes >=0.23.0` is fine. The yaml adds 6 `screenshots:` URLs pinned at the same sha, all real PNGs in the tree. Gates: validate green, with one warning (the private import above); scanner `safe`. Hits are the same FP set as before: hex/char-code/unicode in the readable esbuild bundle, the disclosed `aislamiento.py` subprocess, `claims.json` documented commands, the CLAUDE/GEMINI dev docs, and test subprocesses. No exact pins are installed at runtime. The Desktop build-time pins in plugin.js are unchanged: Exact pin: @tiptap/core@3.32.2; Exact pin: @tiptap/extension-placeholder@3.32.2; Exact pin: @tiptap/pm@3.32.2;
  Exact pin: @tiptap/starter-kit@3.32.2; Exact pin: 3d-force-graph@1.79.0; Exact pin: three@0.183.2; Exact pin: esbuild@0.28.2 (dev). The PR touches only `plugin-catalog/dike.yaml`."
