description: "DingTalk (钉钉) messaging platform: Stream Mode bot connection, DMs and group chats with @mention gating, AI Card streaming replies, media download, per-user/per-chat allowlists, cron delivery through a robot webhook, and QR-code app registration in the setup wizard. Formerly built into Hermes core; existing users are migrated automatically. A Hermes Labs plugin: built by Nous Research, not supported, and likely not maintained going forward. Fixes from the community are welcome. Disclosure — messages, media and sender ids travel between DingTalk's servers (Alibaba) and your Hermes gateway over DingTalk's Stream Mode WebSocket using your own app Client ID and Client Secret; replies post to DingTalk session webhooks or the AI Card API, and reactions go through DingTalk's robot API; cron deliveries post to the robot webhook URL you configure. Media download codes in inbound messages are resolved to DingTalk download URLs. The optional setup-wizard QR registration calls DingTalk's registration API (oapi.dingtalk.com), whose scan page is branded OpenClaw."
