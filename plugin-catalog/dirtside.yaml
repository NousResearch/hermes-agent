description: >
  Remote brain, local hands: run the terminal and file tools on a device you
  own, chosen per conversation with /dirtside use, while Hermes keeps running on
  the server. A foreground device agent polls the gateway outbound only; every
  message is Ed25519-signed and replay-guarded; pairing pins the device key and
  one command revokes it. Disclosure: adds a terminal backend that executes
  shell scripts with the device user's privileges, signed device routes and
  dashboard-session controls on the gateway, /dirtside commands, a hermes
  dirtside CLI and a Desktop pane. Device policy enforces deny patterns and
  timeout, output and parallelism caps, not a filesystem sandbox. Approvals stay
  enabled. One Python dependency, PyNaCl. No telemetry.
