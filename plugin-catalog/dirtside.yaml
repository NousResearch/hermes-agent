name: dirtside
repo: https://github.com/the-ai-entrepreneur-ai-hub/hermes-dirtside
sha: e0e8f0c86622c072d52a2a580fef25f248f631bb
description: >
  Remote brain, local hands: run terminal commands on a device you own, chosen
  per conversation with /dirtside use, while Hermes keeps running on the
  server. The device dials out to the gateway and nothing on it listens; every
  message is Ed25519-signed and replay-guarded; pairing pins the device key, a
  device belongs to the sender who paired it, and one command revokes it.
  Disclosure: adds a terminal backend that executes shell scripts with the
  device user's privileges and a minimal environment, a tool_execution
  middleware that marks explicit terminal workdirs, signed device routes and
  dashboard-session controls on the gateway, /dirtside commands, a hermes
  dirtside CLI and a Desktop pane. Core's file tools resolve paths on the
  gateway. Device policy enforces deny patterns and timeout, output and
  parallelism caps, not a filesystem sandbox. Approvals stay enabled. One
  Python dependency, PyNaCl. No telemetry.
