description: "The DJ that grows with you — Hermes plugin for uzu-language beat making. Disclosure — The skills have the agent run Rscript (the author's maelstrom R package, installed separately from GitHub), llama-cli on an optional Rhythmancer 3B GGUF the user downloads from Hugging Face (Nanite-Labs/nanites-rhythmancer-3b-generator-gguf; not revision- or hash-pinned), and a local audio player (ffplay/aplay/paplay/afplay) through the terminal tool, writing rendered WAVs to the working directory; Strudel exports are strudel.cc share links built locally. No tools, hooks, commands or middleware are registered."
