title: "Docket"
description: "Quotes for trades businesses (plumbers, electricians, HVAC): describe a job in words or a voice note and Docket prices every line from the owner's own price book with a deterministic engine (the model only picks item codes; it never writes a number). The owner approves with one tap on Telegram, Slack, Discord or Desktop, the customer accepts on a quote page, and the owner books the day and closes out with an invoice. Includes a plain-words price book editor with preview before save, PDF quotes and invoices, follow-ups, a run sheet and a Desktop Jobs board. Disclosure: stores customers, quotes and invoices in a local SQLite file under plugin-data/docket; starts a local HTTP server for the customer accept page (127.0.0.1:8787 by default, in a background thread of the gateway); reads a price list file only when the owner names one; job descriptions and unreadable price lists go to the model configured in Hermes; the pre_transcription hook adds price book item names to the speech-to-text prompt; a pre_tool_call gate asks before sending a quote or saving price changes and blocks both from cron. No outbound network calls of its own, no shell commands, no credentials, no telemetry, no email sending."
