sha: ce657cd8671fe76e0b3950e6f9fb82ffe74d5b3f
description: "Checks that the README and Markdown docs still match the code after the agent edits files. When a write_file or patch call leaves the docs naming a command-line flag, environment variable, default value, npm script, make target or file that the code no longer has, the tool result gets a docs_drift block with file:line on both sides, in the same turn. When an edit adds a flag or environment variable that no doc mentions while the docs document its siblings, the result says so and says where the siblings are documented. Fixing the doc reports the finding as resolved, and the agent is reminded once before it finishes if drift from this session is still open. Also adds a docs_drift_scan tool (whole repository or changed files only), docs_drift_explain (the evidence behind one finding), a /drift command and a python -m docsdrift command line for CI. Deterministic and offline: Python standard library only, no model call, no network, no API key. Markdown and MDX docs only. Disclosure — to do its job the plugin runs git (ls-files, status, show, diff --name-only, check-ignore; read-only, with GIT_OPTIONAL_LOCKS=0) in the repository being edited and reads that repository's text files and .git/config. It does not open .env or key files (templates such as .env.example are read), writes nothing to disk, makes no network request and sends no telemetry."
maintainer: vigohan95
