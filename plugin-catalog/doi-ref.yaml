subdir: doi-ref
description: >-
  @doi:<doi> context references: attach a paper's, dataset's or software release's metadata to a
  message (title, authors, venue, publisher, date, type, citation count, license, abstract, and any
  retraction or correction notice), from Crossref or, for DOIs Crossref lacks such as arXiv and
  Zenodo, DataCite. Disclosure — sends an HTTPS GET per reference to api.crossref.org/works/<doi>
  and only on a not-found answer a second one to api.datacite.org/dois/<doi> (the referenced DOI
  leaves the machine; the publisher's site is never contacted); Crossref requests are queued one at
  a time to respect its rate limit; no API key, no caching, no files written, no subprocess;
  register() only adds the @doi: reference provider.
maintainer: EloquentBrush0x
