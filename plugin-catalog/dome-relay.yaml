name: dome-relay
repo: https://github.com/nerdcakes/hermes-dome-relay
sha: f36521b19ecc9a1af450b95aca704162a3ecd3de
subdir: ""
title: Dome Relay
description: >
  Escalate a task to another established agent through an always-on callback
  relay and read the result back in the conversation that sent it. Registers
  jobs with tools dome_relay_escalate, dome_relay_status, and dome_relay_cancel;
  a worker polls the relay; the relay (not this plugin) wakes a Grok Bot
  executive. Disclosure — sends job text to the HTTPS relay you configure
  (relay then forwards to your Grok Bot webhook, which spends Grok Bot usage on
  a successful wake); stores job metadata and results in the active Hermes
  profile database under plugin-data/dome-relay; the only plugin secret is
  DOME_RELAY_KEY via Hermes secret scope (register, cancel, read results). The
  Grok webhook URL/key and the executive callback key stay on the relay and the
  executive. Optional worker process: `hermes dome-relay worker` (polls while a
  job is open). No self-updater, no telemetry, no shell, no reading of
  unrelated credential files. A job is task text and optional https reference
  links; it does not authorize posting, sending, spending, or credential access.
maintainer: nerdcakes
tier: community
category: automation
requires_hermes: ">=0.23.0"
docs_url: https://github.com/nerdcakes/hermes-dome-relay#readme
version: "0.1.0"
readme: true
platforms: []
capabilities:
  provides_tools:
    - dome_relay_escalate
    - dome_relay_status
    - dome_relay_cancel
  provides_hooks:
    - pre_llm_call
  provides_middleware: []
  requires_env:
    - DOME_RELAY_KEY
