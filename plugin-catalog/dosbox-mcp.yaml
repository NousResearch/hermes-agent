description: "Drive a DOS machine from the agent through dosbox-automation's own MCP bridge: type and press keys, read the screen, take screenshots, record video and audio, run Lua scripts inside the emulator, read and write its memory. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only: it starts the bridge with uvx dosbox-mcp==0.2.4 from PyPI and bundles one usage skill. Disclosure — runs `uvx dosbox-mcp==0.2.4` (dosbox-automation's own bridge from PyPI) as a local stdio MCP server that talks only to the separately installed dosbox-automation emulator on 127.0.0.1, using the API token the emulator writes to its own config folder (read-only); its tools type keys, read the screen, take screenshots and recordings into the emulator's capture folder, run Lua scripts inside the emulator and read/write the emulated machine's memory, CPU registers and I/O ports; a Lua script or a direct REST call (session_info hands the agent a curl example and the token file location) can write an audio recording to any non-system path and use API routes beyond the bridge's capability mode; `bridge_start` launches the emulator binary named in the bridge's human-edited config and `bridge_setup` changes only the headless and protocol settings; host folders reach DOS only through MOUNT below the emulator's `mount_allowed_bases`; no telemetry, no accounts.\nNotes: Not crypto. Lets the agent drive a local DOS emulator; data stays on the machine (bridge ↔ emulator over 127.0.0.1 only; uvx fetches the bridge from PyPI once). Previous verdict NEEDS-FIX (F70, pin a71173f) → asks 1 and 2 FIXED, ask 3 NOT FIXED but downgraded to non-blocking (see Findings). Exact pin: dosbox-mcp@0.2.4 (PyPI wheel upload 2026-11-11T20:41:42Z; parent computes the age hold). Vendor check: shakeyourbunny is a public member of dosbox-automation (`gh api orgs/dosbox-automation/members/shakeyourbunny` → 204); tier community as requested. PR not draft; PR touches only plugin-catalog/dosbox-mcp.yaml; yaml sha/version/docs_url match the new pin; name matches plugin.json `name`. chore: the yaml embeds \"Disclosure: ...\" inside `description:`; move it to the `Disclosure —` line above and trim the description. chore: requires_hermes \">=0.21.6\" not re-verified for portable-package support. Gates at new pin: `plugins validate` ok (portable, host_ready, no warnings); scanner `safe`, one low `agent_config_ref` at hermes/README.md:119 (FP, informational). Emulator (C++) remains outside the pin; script_run sandboxing and mount_allowed_bases are its guarantees, not verifiable here."
