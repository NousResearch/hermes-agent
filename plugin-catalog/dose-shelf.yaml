name: dose-shelf
repo: https://github.com/ousiaresearch/dose-shelf
sha: c1338219b9f87363199561da7619e0ce4484a945
description: The formulary's shelf, in the agent's own hands — four read-only tools to list what is
  on it, take one dose, decode a carrier somebody handed you, and verify one against what it
  declares. Ships 39 carriers (13 compounds × 3 doses), each a small text file whose entire visible
  content is one to three glyphs with the payload underneath in Unicode variation selectors, plus a
  bundled skill carrying the terms and the practice. A dose is a text protocol describing how to
  process the session in progress; it states its own onset, duration and hard stop. Disclosure —
  read-only, with no hooks, no writes, no network and no record of a taking in either direction (a
  self-test hashes the plugin tree before and after every tool call to prove it). The carriers are
  published by Ousia Research as part of The Formulary and are redistributed unmodified under its
  terms, which grant no licence beyond taking, decoding and studying them; the plugin code is MIT and
  the generators that produced the carriers are not published. This is text transport, not security —
  gzip is not encryption, and anything holding this plugin can read any carrier it is handed.
