name: dreamer
repo: https://github.com/Cosmonautic1/hermes-dreamer
sha: 694a015422915ae9ac88f24bd385c0fd2ad0cd5f
description: "When Hermes goes idle, it dreams. A native plugin that watches for idle windows (default: 15 min idle, at least 12 h between dreams) and replays the day's session residue - tool traffic, dead ends, unfinished threads - into a short narrative dream generated by the LLM, graded light or deep by sleep distance and stored in a local dream journal (title, symbols, mood, dream_type). Up to 1-3 actionable insights are distilled from each dream and injected into the next fresh session as a [DREAM RESIDUE] block, so recurring issues (stale tasks, stuck PIDs, untested regressions) surface where they can actually be handled instead of dying silently between sessions. Tools: dream_now (dream on demand), dream_journal (read past dreams), dream_status (enabled/last-dream/idle state). Hooks: one pre_llm_call hook that injects the pending dream residue - and only it - into a new session's context. Disclosure — a background thread started at load (on by default; `enabled: false` stops it, but the `dream_now` tool and the session-start injection still work until the plugin is disabled) reads this profile's `state.db` read-only every 15 minutes. After 15 idle minutes, and at most once per 12 hours, it sends recent user messages and tool-error fragments from every session on the profile (all platforms and chats) to your configured model through `ctx.llm`, unattended. It injects the resulting dream digest (up to 2000 chars) into the first turn of the next new session, whichever chat starts it. Dreams are stored under `<HERMES_HOME>/plugin-data/dreamer`. No network calls of its own."
maintainer: Cosmonautic1
tier: community
category: memory
requires_hermes: ">=0.20.4"
docs_url: https://github.com/Cosmonautic1/hermes-dreamer#readme
version: "1.5.0"
platforms: []
capabilities:
  provides_tools: [dream_now, dream_journal, dream_status]
  provides_hooks: [pre_llm_call]
  provides_middleware: []
  requires_env: []
