name: dreamer
repo: https://github.com/Cosmonautic1/hermes-dreamer
sha: 694a015422915ae9ac88f24bd385c0fd2ad0cd5f
description: >-
  When Hermes goes idle, it dreams. A native plugin that watches for idle
  windows (default: 15 min idle, at least 12 h between dreams) and replays the
  day's session residue - tool traffic, dead ends, unfinished threads - into a
  short narrative dream generated by the LLM, graded light or deep by sleep
  distance and stored in a local dream journal (title, symbols, mood,
  dream_type). Up to 1-3 actionable insights are distilled from each dream and
  injected into the next fresh session as a [DREAM RESIDUE] block, so
  recurring issues (stale tasks, stuck PIDs, untested regressions) surface
  where they can actually be handled instead of dying silently between
  sessions. Tools: dream_now (dream on demand), dream_journal (read past
  dreams), dream_status (enabled/last-dream/idle state). Hooks: one
  pre_llm_call hook that injects the pending dream residue - and only it -
  into a new session's context. Disclosure: dream residue injections carry the
  same session text that is already local to the user's machine; the plugin
  makes no network calls of its own and the dream generation goes through the
  host's configured LLM with its own credentials via ctx.llm. Dreams are
  observations for waking reflection, not instructions - the shipped
  wake-audit skill instructs the agent to verify every dream claim against
  live state before acting on it.
maintainer: Cosmonautic1
tier: community
category: memory
requires_hermes: ">=0.19"
docs_url: https://github.com/Cosmonautic1/hermes-dreamer#readme
version: "1.5.0"
platforms: []
capabilities:
  provides_tools: [dream_now, dream_journal, dream_status]
  provides_hooks: [pre_llm_call]
  provides_middleware: []
  requires_env: []
