description: "Local memory provider (memory.provider: dreaming) after Anthropic's \"The components of agent memory\": every turn is kept as a transcript and the agent writes quick notes; an offline dream pass checks notes against the transcripts, resolves changes stated by reference (\"she handed everything over\", nicknames, \"what I said last time\"), and rewrites a linked wiki plus a short index loaded into every session. Tools via the memory provider: mem_search, mem_read, mem_write; CLI: hermes dreaming status|dream|search|show. Disclosure — memory stays in <hermes_home>/dreaming/ as markdown, JSONL and a SQLite FTS5 cache; the plugin makes no network calls of its own, and the dream pass sends transcript excerpts and memory files to the user's configured model through ctx.llm; with auto_dream on (default) a pass runs in a background thread at session start. No credentials, no shell commands, no telemetry, no self-updating."
