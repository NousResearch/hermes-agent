name: dropstation
title: Dropstation
repo: https://github.com/satiricalguru/Hermes-dropstation
sha: e6a5ba6958097b482bef9455af2b7f0f17a43170
description: >-
  Turn private local folders into Hermes inboxes with standing tasks. Drop a
  document or image to get a Markdown reply and a durable processing receipt.
  The adapter polls the configured owner-private spool and uses its filesystem
  permissions as the inbound authorization boundary. Its events skip messaging
  allowlists and pairing. Snapshots, reports and receipts are stored locally.
  The configured Hermes provider processes the source contents.
maintainer: satiricalguru
