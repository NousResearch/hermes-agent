name: ds4
title: DwarfStar (ds4)
repo: https://github.com/emilianbold/hermes-plugin-ds4
sha: 70b321586ef63b3186da48bffa267ef43fa5d310
description: "Run DeepSeek, GLM and Qwen models locally with DwarfStar (ds4), an inference engine for Apple Silicon. Turnkey from Hermes Desktop: one button installs the engine, downloads the model that fits your Mac and makes it your default; the server then starts with your first message and stops when idle. Unofficial. Disclosure — The one-button setup downloads a prebuilt ds4-server engine (about 1.7 MB) from this plugin's own GitHub release, built from antirez/ds4 by the repository's attested GitHub Actions workflow and checked against a pinned SHA-256, and downloads models of 86 to 366 GB from Hugging Face at pinned revisions; it runs ds4-server on 127.0.0.1 while Hermes uses it (with no authentication, so other programs on this Mac can reach that port), keeps ds4's prompt cache (which contains your prompts) under the plugin's data folder until you clear it, and sets the chosen model as your default."
maintainer: emilianbold
tier: community
category: models
version: "0.2.0"
requires_hermes: ">=0.23.0"
platforms:
  - macos
docs_url: https://github.com/emilianbold/hermes-plugin-ds4/blob/70b321586ef63b3186da48bffa267ef43fa5d310/README.md
screenshots:
  - https://raw.githubusercontent.com/emilianbold/hermes-plugin-ds4/70b321586ef63b3186da48bffa267ef43fa5d310/screenshots/desktop.png
  - https://raw.githubusercontent.com/emilianbold/hermes-plugin-ds4/70b321586ef63b3186da48bffa267ef43fa5d310/screenshots/desktop-storage.png
readme: true
known_issues:
  - The managed runtime needs Apple Silicon and 64 GB of memory or more (96 GB for the default model).
  - The model-provider client requires in-process plugin execution (plugins.isolation host is not supported).
  - Hermes keeps plugin data on uninstall; use Storage -> Remove everything first to free the models.
capabilities:
