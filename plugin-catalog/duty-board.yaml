description: "Dashboard tab for messaging users: conversations waiting on your reply, messages that got no reply, turns running now, undelivered background results and failing cron jobs, each with a one-click Open in Discord. Available in all 17 dashboard languages, including right-to-left Arabic. Disclosure — dashboard-only and read-only: opens HERMES_HOME/state.db with SQLite mode=ro (sessions, messages, turn leases, async delegations, goals) and reads cron/jobs.json and gateway_state.json; writes only HERMES_HOME/duty-board/dismissed.json. No network calls, no model calls, no credentials, no background processes."
