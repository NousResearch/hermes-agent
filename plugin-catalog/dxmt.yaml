description: "Long-term memory in a DXMT server you run: recall by meaning and keyword before each turn, durable facts extracted at session end and before compression, supersede and forget by id, and the same memories visible to every other agent and tool on the machine over REST and MCP. The server embeds, so no embedding key is needed in Hermes. Disclosure — conversation turns, extracted facts and built-in memory-tool writes are sent to the configured DXMT server (http://localhost:9999 by default; DXMT_URL or plugins.dxmt.server.url to change it) with DXMT_API_KEY if the server has one, read through Hermes; recalled memories come from that shared server, which other agents and tools on the machine can also write to; fact extraction sends session transcripts to Hermes's auxiliary LLM (task dxmt_extraction); `hermes memory setup` writes memory.provider and a plugins.dxmt block to config.yaml; no other endpoint, no telemetry, no shell access, no background process beyond prefetch and writer threads inside Hermes. Maintained by the DXMT project."
maintainer: dxmt
