version: "0.1.0"
description: "Hermes hears when a machine drifts from its own healthy sound. Enroll a robot joint, drone, fan, 3D printer, pump or engine from a few healthy recordings (a phone voice note works), then check new ones: drift in robust sigmas, the frequency bands that moved, and a spectrogram card in chat. Few-shot and training-free: frozen CED-base and EfficientAT mn10 encoders in onnxruntime, a per-band memory bank and self-calibration, about 0.6 s per check on CPU. Provides earshot_enroll, earshot_check, earshot_listen and earshot_status, plus a skill. Benchmarks in the README (DCASE 2024 embodiment machines, phone recordings of car engines). Disclosure: the first check downloads CED-base (87 MB, Apache-2.0) from huggingface.co/mispeech/ced-base at a pinned commit and verifies its sha256; the 12 MB mn10 ONNX graph ships in the repo, pinned by sha256, with the script that rebuilds it. Audio is processed locally and never uploaded. The microphone opens only during earshot_listen (optional sounddevice). Machine baselines and check history live in plugin-data/earshot. ffmpeg is used when present to decode voice notes and video."
