description: 'Eatwise (外卖营养教练) — local-first Chinese dietary coach: deterministic meal
  nutrition reviews, personal daily energy/nutrient targets, and consented on-device
  profile and meal history through 9 MCP tools over a bundled open food database
  (TFND + USDA FNDDS). No network, no accounts, no payments; profile schema rejects
  name/phone/ID/medical fields by design. Engine pinned to an immutable git commit
  (cbc08f6) over npx stdio; Portable Agent Plugins v1 package (mcp.json + skills/),
  needs Node.js 22.5+ on PATH. Disclosure — the engine''s MCP tool descriptions and error messages are Chinese-only while the skills are English-first.'
