description: "Research products, prices, competitor stores and suppliers from chat: Amazon (search, product pages, every seller's offer, seller profiles, Best Sellers on 23 storefronts), Walmart, Target, eBay, Google Shopping, TikTok Shop, Lazada, MercadoLibre (Spanish-language Latin American sites), any Shopify store's catalog and apps, and AliExpress and Alibaba suppliers. Five workflow skills (product research, price check across retailers, competitor store audit, product sourcing with a margin estimate, cost estimate) drive eleven Actors on Apify's hosted MCP server (Streamable HTTP at https://mcp.apify.com). Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only, no local code. Disclosure — every tool call goes to Apify's hosted MCP server at mcp.apify.com and starts a pay-per-result run of an Actor published by the plugin's author (Apify user muhammadafzal), who is paid for each run; runs are billed to the user's own Apify account (about USD 0.0015 to 0.025 per row, a few product-page and store-record fees up to USD 0.01, plus up to USD 0.083 per run). Keywords, product IDs and links, store URLs, seller IDs and an optional ZIP or postal code are sent to Apify; the Actors read public storefront and listing pages and never sign in to a marketplace, and the results are kept in the user's Apify datasets. Apify sign-in is OAuth, which Hermes runs only for a server in the user's own config, so the README has the user add the same-name server with `hermes mcp add ecommerce-research --auth oauth`; that entry replaces the package's own, so the user adds `trust: untrusted` to it to keep Hermes asking before each paid run. The tool set is served by the remote server at runtime and is not covered by the pinned sha. No telemetry. Independent tool, not affiliated with Amazon, Walmart, Target, eBay, Google, Shopify, TikTok, Lazada, MercadoLibre, AliExpress or Alibaba."
