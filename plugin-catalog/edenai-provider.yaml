description: "Eden AI models through its OpenAI-compatible API: live model list by name from /v3/models?view=models (tool-calling models in the picker), exact context windows, reasoning effort, a session id kept across compression, and delegate_task subagents named as threads of it. Disclosure — model provider; prompts, tool schemas and EDENAI_API_KEY go to api.edenai.run (or EDENAI_BASE_URL), then to the provider serving the model; each request also carries a conversation session id, delegate_task subagent ids, and fixed Hermes Agent attribution headers (HTTP-Referer, X-Title)."
