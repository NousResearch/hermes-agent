name: effortless-hermes
repo: https://github.com/ivcained/effortless-hermes
sha: cc6fde2c125f8670433c31ae25e1d952630be009
description: "Picks the reasoning effort for every prompt: a fast judge (Jev/TypeSafe, a local OpenAI-compatible model, or any custom API) reads the next message once per turn and rewrites the request's reasoning effort before it ships — easy questions run cheap, hard jobs get high. Port of effortless for Claude Code. Disclosure — sends the next message (≤4000 chars) plus a short recent-conversation excerpt (≤1600 chars) to the configured judge endpoint (default api.typesafe.ai for Jev; a local or custom OpenAI-compatible API otherwise), solely to pick the effort; the optional model_map setting (off by default) also switches the turn's model to the one you map to the verdict; keeps recent per-turn token counts in its own plugin state; no telemetry; secrets resolved only through Hermes' secret scope; stdlib-only, no pip dependencies."
maintainer: ivcained
tier: community
category: tools
requires_hermes: ">=0.21.7"
