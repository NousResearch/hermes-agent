title: ElevenLabs Sound Effects
description: 'ElevenLabs sound effects for Hermes: one tool, elevenlabs_sound_effect, that turns a text
  description ("glass shattering on a tile floor", "90s hip-hop drum loop, 90 BPM") into an audio file,
  0.5 to 30 seconds, optionally a seamless loop, and sends it to you in chat. Model, audio format and
  endpoint are plugin settings. Disclosure: uses your ElevenLabs API key (ELEVENLABS_API_KEY, the same
  key as Hermes''s ElevenLabs voice); every call is a paid generation billed to your ElevenLabs account.
  Only the sound description and its parameters are sent, to api.elevenlabs.io (or the data-residency
  endpoint you set). Files are written to cache/generated/audio under the Hermes home and never
  overwritten. One Python dependency (httpx, already part of Hermes).'
maintainer: NousResearch
tier: official
category: tools
requires_hermes: ">=0.22.0"
version: "1.0.0"
image: https://raw.githubusercontent.com/NousResearch/hermes-official-plugins/99c7b9574c3b6056f8d2286dc4e0295608dc1eed/assets/elevenlabs-sound-effects.jpg
docs_url: https://github.com/NousResearch/hermes-official-plugins/tree/main/elevenlabs-sound-effects
platforms: []
capabilities:
  provides_tools:
    - elevenlabs_sound_effect
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - ELEVENLABS_API_KEY
