name: elm
title: ELM
repo: https://github.com/Miawd3/ELM-Hermes-plugin
sha: f62fc2952e25208e8e6b22adfb98647caaa48818
subdir: stock-plugin
version: "0.4.0-preview"
description: >-
  Local, reviewable long-term memory. You save notes (or approve notes the model proposes) and
  matching notes are recalled automatically. Off until the owner turns it on from a terminal:
  for all Desktop/TUI/CLI chats at once (`hermes elm auto on`, notes shared across chats; any chat
  can opt out with `/elm private`) or per chat (`hermes elm grant`). The model can never turn it on.
  Works as a general plugin or in the memory slot (`memory.provider: elm`, with the recall
  indicator; `hermes memory setup elm` offers auto mode). Optional memory-aware delegation backend
  (`delegation.backend: elm`): you name agents (models or profiles) and ELM routes subagent tasks
  to the one that did best on similar earlier tasks.
  Disclosure — no network calls, dependencies, telemetry, self-updater or background daemon of its
  own. Data stays in the profile's plugin-data/elm SQLite file. Recalled notes are added to the
  current message and so reach your model provider; in auto mode notes saved in one chat are
  recalled in your other chats (never in messaging, cron, subagent or ACP chats). Two optional,
  per-chat opt-in features make model calls through Hermes's auxiliary model slots: a search planner
  (query text only) and an organizer (selected captured text). Opt-in capture stores finished turns
  as plain text locally. Routing stores agent names, up to 12 plain-word goal keywords, success and
  duration (no task or result text), only for chats with ELM on, scoped like notes. Deleting a chat
  deletes its chat-only notes, captures and routing history (shared notes stay). `hermes elm
  sessions` reads the profile's session list to help pick a chat ID.
maintainer: Miawd3
tier: community
category: memory
docs_url: https://github.com/Miawd3/ELM-Hermes-plugin/blob/f62fc2952e25208e8e6b22adfb98647caaa48818/stock-plugin/README.md
capabilities:
  provides_tools:
    - elm_memory
  provides_hooks:
    - pre_llm_call
    - post_llm_call
    - post_compaction
    - on_session_delete
    - subagent_start
    - subagent_stop
  provides_middleware: []
  requires_env: []
known_issues:
  - Preview. Recall is keyword-based (no embeddings); ask with words that appear in the note.
  - ELM is off after install. Turn it on with `hermes elm auto on` (all chats) or `hermes elm grant` (one chat).
  - Memory-aware routing needs the plugin enabled (`hermes plugins enable elm`), not only `memory.provider`.
  - Tested on Windows 11 and Linux; macOS not yet tested.
requires_hermes: ">=0.23.1"
