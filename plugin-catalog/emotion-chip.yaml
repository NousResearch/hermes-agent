name: emotion-chip
title: Emotion Chip
repo: https://github.com/100yenadmin/ai-emotion-chip
sha: 27bc9b157df27e9c81faa73c871bb84a224b44df
subdir: plugin
description: "Your Hermes agent decides how to say it: the sighs, whispers and pauses it writes, voiced by ElevenLabs or Fish Audio. It writes its own delivery into the text it speaks, a small score in square brackets (a sigh, a whispered line, a pause, a warm and amused tone), and Emotion Chip renders exactly that for ElevenLabs v4 or Fish Audio (s2.1-pro, Drama 3), each in its own dialect, adding nothing the agent did not write. With voice replies on in a chat (/voice on), the chip tells the agent when Hermes will read its reply aloud, so the agent can say it itself, score included, instead of Hermes reading the plain text (not on Discord). Registers the emotion-chip speech provider, a delivery guide in the system prompt, the emotion-chip-voice skill, the emotion-chip-report-problem skill (guides the agent through a bug report and posts nothing without the user's yes), the /chip command (status says whether the chip can speak and what to fix; why, quiet, register) the hermes chip command, which shows offline what each engine receives for any score, and two agent tools: chip_status (read-only) and chip_preview (offline). CC0 emotion data and pre-registered evaluations ship in the repository. Disclosure — with backend: eleven it sends your ElevenLabs API key, the rendered text, the model id, voice id, voice settings, an optional seed and, on v4 models, up to three earlier request ids from the same session (kept in memory for two hours) to api.elevenlabs.io over HTTPS; these are paid requests billed to your ElevenLabs account. The key is read at each call through the profile's secret scope and never stored. With the default backend: fish it sends nothing itself: it hands the rendered text to the Fish Audio plugin in the same process (which must be installed, enabled and signed in), and that plugin sends it to Fish Audio under its own disclosure and bills your Fish account; the chip reaches it through Hermes's speech-provider registry and imports its tag adapter. In every guide mode it registers the emotion-chip-report-problem skill, which is text only: the plugin sends and writes nothing for it, and the skill has the agent publish a report only after the user approves the exact text. With guide_mode: generate (the default) it registers the emotion-chip-voice skill, and while it is the speech provider it adds a delivery guide of up to 4,000 characters to the system prompt and registers pre_gateway_dispatch (described next). With guide_mode: generate it also registers two agent tools. chip_status reads the plugin's settings, Hermes's tts configuration and this session's last authored register and reports them; it sends nothing and changes nothing. chip_preview renders a score offline and returns the text each engine would receive and the cues it would drop; no synthesis, no network, nothing written. While the chip is the speech provider, each successful text_to_speech result gains an emotion_chip entry of at most 600 characters (the dialect, the agent's cue words, drops and notes); it stays in the conversation and is sent nowhere. The pre_gateway_dispatch hook: for each incoming message it asks the gateway whether it will read the reply aloud and keeps that answer in memory under the chat and message id (at most 256, never used after 15 minutes), used once to add one line to that message's turn; it never skips or changes a message, and registering the hook routes webhook and relay deliveries through Hermes's hooked ingress path. When another speech provider is selected, its tool_request middleware rewrites text_to_speech text containing a bracket for that provider (the Fish dialect on Fish S2 and Drama 3 models, or the ElevenLabs dialect on a v3/v4 model; for any other provider or model, including Hermes's default Edge, Fish S1 and ElevenLabs on older models, standalone bracketed words are removed as cues, a bracketed Step 2 too, while the words inside spans, numeric references such as [1] and code such as an array index stay), leaves command providers alone and records nothing. With signals on (off by default) it adds a dated situation line of up to 200 characters to the turn and, when a tool call fails, to that call's result. It reads Hermes's tts configuration (read-only) to pick the dialect, model and voice. It writes under the profile's plugin-data/emotion-chip/ only the generated skill and, unless delivery_log is off, delivery.jsonl (time, session id, sender
  id, platform, model, dialect, rendering group, cue words, parameters, kinds of drops and character count, never the spoken text), moved to delivery.1.jsonl at 5 MB so at most about 10 MB is kept; Hermes keeps its per-session state (task counters and timestamps, the ids of the last 16 tool calls counted, session keys, the messaging sender id and platform, the last situation and register lines, the quiet switch; the 50 most recent sessions) in the plugin's own namespaced folder under plugin-data/. Audio goes to the path Hermes supplies. No background processes, no shell commands, no telemetry."
