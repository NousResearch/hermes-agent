name: emotion-chip
title: Emotion Chip
repo: https://github.com/100yenadmin/ai-emotion-chip
sha: f4afab1e0e23f1691ad3ecf56982df2ab94aef72
subdir: plugin
description: "The agent decides how to say it. Your agent writes its own delivery into the text it speaks, a small bracket score such as [sigh], [whisper: it passed.], [pause] or [warm, amused], and Emotion Chip renders exactly that for ElevenLabs v4 or Fish Audio (s2.1-pro, Drama 3), each in its own dialect, adding nothing the agent did not write. Registers the emotion-chip speech provider, a delivery guide in the system prompt, the emotion-chip-voice skill and the /chip command (status, why, quiet, register). CC0 emotion data and pre-registered evaluations ship in the repository. Disclosure — with backend: eleven it sends your ElevenLabs API key, the rendered text, the model id, voice id, voice settings, an optional seed and, on v4 models, up to three earlier request ids from the same session (kept in memory for two hours) to api.elevenlabs.io over HTTPS; these are paid requests billed to your ElevenLabs account. The key is read at each call through the profile's secret scope and never stored. With the default backend: fish it sends nothing itself: it hands the rendered text to the Fish Audio plugin in the same process (which must be installed, enabled and signed in), and that plugin sends it to Fish Audio under its own disclosure and bills your Fish account; the chip reaches it through Hermes's speech-provider registry and imports its tag adapter. With guide_mode: generate (the default) it registers the emotion-chip-voice skill, and while it is the speech provider it adds a delivery guide of up to 4,000 characters to the system prompt; when another speech provider is selected, its tool_request middleware rewrites text_to_speech text containing a bracket for that provider (the Fish dialect, or the ElevenLabs dialect on a v3/v4 model; for any other provider, including Hermes's default Edge and ElevenLabs on older models, standalone bracketed words are removed as cues, a [Step 2] too, while the words inside spans, numeric references such as [1] and code such as items[index] stay), leaves command providers alone and records nothing. With signals on (off by default) it adds a dated situation line of up to 200 characters to the turn and, after a tool error, to other tools' results. It reads Hermes's tts configuration (read-only) to pick the dialect, model and voice. It writes under the profile's plugin-data/emotion-chip/ only the generated skill and, unless delivery_log is off, delivery.jsonl (time, session id, sender id, platform, model, dialect, rendering group, cue words, parameters, kinds of drops and character count, never the spoken text), moved to delivery.1.jsonl at 5 MB so at most about 10 MB is kept; Hermes keeps its per-session state (task counters and timestamps, session keys, the messaging sender id and platform, the last situation and register lines, the quiet switch; the 50 most recent sessions) in the plugin's own namespaced folder under plugin-data/. Audio goes to the path Hermes supplies. No background processes, no shell commands, no telemetry."
maintainer: 100yenadmin
tier: community
category: voice
requires_hermes: ">=0.22.2"
docs_url: https://github.com/100yenadmin/ai-emotion-chip/tree/f4afab1e0e23f1691ad3ecf56982df2ab94aef72/plugin#readme
version: "0.1.0"
image: https://raw.githubusercontent.com/100yenadmin/ai-emotion-chip/f4afab1e0e23f1691ad3ecf56982df2ab94aef72/docs/media/banner.png
screenshots:
  - https://raw.githubusercontent.com/100yenadmin/ai-emotion-chip/f4afab1e0e23f1691ad3ecf56982df2ab94aef72/docs/media/screenshot-cli.png
readme: true
platforms: [linux, macos]
known_issues:
  - "Full cues reach the voice on the text_to_speech tool path. Spoken replies, read-aloud and voice mode speak the reply text without cues, because Hermes has no seam yet that keeps cues for speech and strips them from the chat."
  - "The Fish backend needs the fish-audio plugin installed, enabled and signed in."
  - "ELEVENLABS_API_KEY is needed only with backend: eleven; the default Fish backend uses the fish-audio plugin's key."
  - "GPT-Live voice chat speaks through OpenAI's live voice model, not a speech provider, so the chip does not reach it."
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - post_tool_call
    - api_request_error
    - on_session_start
    - on_session_end
    - transform_tool_result
  provides_middleware:
    - tool_request
  requires_env:
    - ELEVENLABS_API_KEY
