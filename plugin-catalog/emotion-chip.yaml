platforms: [linux, macos]
known_issues:
  - "Full cues reach the voice on the text_to_speech tool path, and in chats with voice replies on, where the agent says its reply itself. Not on Discord, where Hermes plays its own reply in voice channels. Read-aloud and voice mode speak the reply text without cues, because Hermes has no seam yet that keeps cues for speech and strips them from the chat."
  - "The voice-replies line needs the plugin to run inside the gateway process (Hermes's default); an isolated plugin host gets no line, which is Hermes's behaviour without the chip."
  - "The Fish backend needs the fish-audio plugin installed, enabled and signed in."
  - "ELEVENLABS_API_KEY is needed only with backend: eleven; the default Fish backend uses the fish-audio plugin's key."
  - "In CLI and TUI voice mode on Fish, when Fish does not stream (streaming: off, or an isolated plugin host), sentences after the first lose the opening cue's voice settings unless they carry their own cue (ai-emotion-chip issue 2)."
  - "GPT-Live voice chat speaks through OpenAI's live voice model, not a speech provider, so the chip does not reach it."
capabilities:
  provides_tools:
    - chip_status
    - chip_preview
  provides_hooks:
    - pre_llm_call
    - post_tool_call
    - api_request_error
    - on_session_start
    - on_session_end
    - transform_tool_result
    - on_session_reset
    - pre_gateway_dispatch
  provides_middleware:
    - tool_request
  requires_env:
    - ELEVENLABS_API_KEY
