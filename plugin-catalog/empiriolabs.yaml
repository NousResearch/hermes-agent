description: "EmpirioLabs AI as a Hermes model provider (provider id `empiriolabs`): chat models with tool calling from the live EmpirioLabs AI catalog, each with its context window, image input and reasoning support declared to Hermes, a low-cost auxiliary model picked from the same catalog, and `reasoning_effort` sent only when you choose a level and the model accepts it. Submitted by EmpirioLabs AI. Disclosure — registers one model provider at import and nothing else (no tools, hooks, commands or threads); chat requests (prompts, tool definitions and tool results) go through Hermes' own client to https://api.empiriolabs.ai/v1 (or EMPIRIOLABS_BASE_URL) with EMPIRIOLABS_API_KEY, which Hermes reads, and are billed to that EmpirioLabs AI account; the plugin itself only reads the model catalog (GET /v1/models, kept in memory for an hour), writes no files and starts no processes."
