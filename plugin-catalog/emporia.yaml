known_issues:
  - "Tested on Linux. The dashboard console uses a Unix socket, so Windows is not supported."
  - "Keys in a password manager: the recommended way is the signer reading them (emporia signer add NAME --key-source 'ROLE=cmd:op read op://...'), with the vault token in the signer's folder, never the agent's. An agent-side cmd: key source still works but is not recommended: it runs the vendor CLI with an access token kept in the profile's settings, not through Hermes's secret sources (a Hermes unlock lasts one chat session; an agent signs unattended)."
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - pre_tool_call
    - post_llm_call
    - transform_tool_result
  provides_middleware: []
  requires_env:
    - EMPORIA_RELAY_URL
    - EMPORIA_AGENT_ID
    - EMPORIA_PYTHON
