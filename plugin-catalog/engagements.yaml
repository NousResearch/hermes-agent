name: engagements
title: Hermes Engagements
repo: https://github.com/latentoperator/hermes-engagements-plugin
sha: a74ae82b6e4a5b416ef93705dbd696e4bc138a62
version: "1.0.0-rc1"
description: >-
  Hermes is a powerful tool for shipping work to clients, no matter the industry or vertical.
  Engagements gives it a client notebook: each client and project is a plain Markdown record on your
  machine. Add a client or project from the Clients page or by pasting notes in any chat, approve the
  draft, and every agent working for that client can look up who to contact, how they like to work
  and where the files live. The agent keeps the record current with a dated source for every change.
  The Clients page works in Hermes Desktop and the web dashboard; it shows records but never edits
  them, and its Add buttons only start the chat that drafts one.
  Disclosure: local files only, no network requests, no telemetry, no shell commands, no background
  processes and no stored credentials. Reads and writes Markdown records under the library folder
  you choose (default is the profile's plugin-data folder), and reads the session's working
  directory, id and surface to link a chat to a project. Installs PyYAML 6.x.
maintainer: latentoperator
tier: community
category: memory
requires_hermes: ">=0.22.3"
docs_url: https://github.com/latentoperator/hermes-engagements-plugin/blob/a74ae82b6e4a5b416ef93705dbd696e4bc138a62/README.md
