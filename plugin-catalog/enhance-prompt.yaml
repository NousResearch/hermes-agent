title: Enhance Prompt
description: "A sparkle beside Send that rewrites the composer draft in place without sending it, in a voice you pick under Settings > Plugins > enhance-prompt (brief, structured, concise, detailed, questions, verify, or your own words), deepening it into a clarifier, a task list, then a phased plan on further clicks, with a one-click discard back to the original. Also registers the `/enhance` slash command and the `enhance_prompt` tool for the same rewrite from the agent, in the same voice. Draft read and write go through `host.composer`, so `@file` and `/command` chips survive. Disclosure — every click runs one stateless `llm.oneshot` call on your own gateway with the focused chat's model (the plugin's `enhance_prompt` auxiliary task, reasoning off, when no chat is focused), followed by a second short call to score the result, so it spends your model credits. It is not an agent turn: no tools run and nothing is written to a session you cannot see. Only the draft and the chosen voice's instructions are sent; the voice setting is read from your own gateway with `plugins.manage list`. It overrides no model, sends nothing to a third party, never sends the composer message, and carries no telemetry, no credentials and no self-update."
