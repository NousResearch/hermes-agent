known_issues:
  - "The Desktop half needs a Hermes build with the composer draft API (`host.composer`); on an older Desktop the sparkle reports that an update is needed."
  - "One model call per click, and the score is an extra call. Cancel stops the client-side wait only — the in-flight call may still finish."
  - "Uses the chat's model; there is no separate model setting. Switch the chat model first to enhance with another one. `/enhance` and the tool use the `enhance_prompt` auxiliary task, which has reasoning off by default."
  - "The voice shapes only the first click and `/enhance`; the task-list and phased-plan clicks and the score keep their own shape. A saved voice this version does not know falls back to `brief`."
  - "Not a fork of `prompt-enhancer`: this one is a separate plugin with an agent tool, a slash command, three deepening stages and a scorer."
  - "0.8.0 folds in the voices from the author's separate Prompt Lab plugin, which is not listed."
