requires_hermes: ">=0.21.5"
title: Enhance Prompt
description: "A sparkle beside Send that rewrites the composer draft in place without sending it, deepening it into a clarifier, a task list, then a phased plan on further clicks, with a one-click discard back to the original. Also registers the `/enhance` slash command and the `enhance_prompt` tool for the same rewrite from the agent. Draft read and write go through `host.composer`, so `@file` and `/command` chips survive. Disclosure — every click opens a hidden session on your own gateway and runs one rewrite with your model, plus an optional second hidden session to score the result, so it spends your model credits; sessions are closed after each read. The model follows the active chat by default and can be pinned to another model id in Settings, which needs the `llm.model_override` consent. The plugin reads its own settings through `plugins.manage`. Nothing is sent to a third party by the plugin itself, it never sends the composer message, and there is no telemetry and no self-update."
maintainer: tuancookiez-hub
