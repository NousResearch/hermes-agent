sha: f15fe1216cbb8cec3ddd61e8ff12936180cc5f42
subdir: "plugins/entropicmem"
description: >-
  Durable local memory for Hermes agents: SQLite FTS5 facts with cited, explainable recall; a
  Markdown vault with knowledge-graph export and an interactive visual graph; and turn-prefetch
  context injection with reason tokens. Write policy auto-redacts high-confidence secrets at write
  time (other PII types are warn-only findings) and stored-content injection screening flags and
  warns on recall and prefetch payloads (flag-and-warn, fail-open by design, not a blocking
  filter). Includes a 34-command CLI, destructive-op gates with automatic backups, and an
  append-only audit log. Disclosure — all memory data stays local (SQLite FTS5 + Markdown vault
  under HERMES_HOME); the CLI init command appends ENTROPICMEM_* settings to HERMES_HOME/.env; the
  optional sentence-transformers embedding extra downloads model weights from Hugging Face; the
  CLI ingest <url> command fetches a user-supplied URL. The provider itself has no network egress.
maintainer: Ufonik88
