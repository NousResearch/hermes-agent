name: entropicmem
repo: https://github.com/Ufonik88/EntropicMem
sha: 437c89b7da625928c41171e88d86f45af41342e1
subdir: "plugins/entropicmem"
description: >-
  Durable local memory for Hermes agents: SQLite FTS5 facts with cited,
  explainable recall; a Markdown vault with knowledge-graph export and an
  interactive visual graph; and turn-prefetch context injection with reason
  tokens. Write policy auto-redacts high-confidence secrets at write time
  (other PII types are warn-only findings) and stored-content injection
  screening flags and warns on recall and prefetch payloads (flag-and-warn,
  fail-open by design, not a blocking filter). Includes a 34-command CLI,
  destructive-op gates with automatic backups, and an append-only audit log.
maintainer: Ufonik88
tier: community
category: memory
requires_hermes: ">=0.21"
docs_url: https://github.com/Ufonik88/EntropicMem/blob/437c89b7da625928c41171e88d86f45af41342e1/docs/SELF_INSTALL.md
