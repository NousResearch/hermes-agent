description: "Durable local memory for Hermes agents: SQLite FTS5 facts with cited, explainable recall; a Markdown vault with knowledge-graph export and an interactive visual graph; and turn-prefetch context injection with reason tokens. Write policy auto-redacts high-confidence secrets at write time (other PII types are warn-only findings) and stored-content injection screening flags and warns on recall and prefetch payloads (flag-and-warn, fail-open by design, not a blocking filter). Includes a 38-command CLI, destructive-op gates with automatic backups, and an append-only audit log. Disclosure — all memory data (vault markdown, memory.db, index.db, backups) stays local under HERMES_HOME/entropicmem/; a shared publish DB defaults to HERMES_HOME/entropicmem-shared/. The CLI init command appends ENTROPICMEM_* settings to HERMES_HOME/.env (append-only). Vector embeddings are off by default; only with embeddings_enabled: true (provider) or ENTROPICMEM_EMBEDDINGS=1 / query --semantic (CLI) does it either download all-MiniLM-L6-v2 weights from huggingface.co on first use (optional sentence-transformers extra) or send memory text to a user-set ENTROPICMEM_EMBEDDINGS_BASE_URL; memory formation is off by default (formation.mode: off) and, when enabled, and for the CLI ingest command's LLM pass, sends conversation or document text to the user's active Hermes model through ctx.llm or, outside Hermes, to a user-set ENTROPICMEM_LLM_BASE_URL; otherwise the provider has no network egress. The CLI ingest command fetches a user-supplied URL; CLI graph export writes to ./export in the cwd by default and its HTML is self-contained: D3 and marked are vendored and inlined at export, so it renders over file:// with no network (only Google Fonts load from fonts.googleapis.com, with a system-font fallback offline); CLI graph serve starts a loopback HTTP server. entropicmem_profile (action=patch) edits the plugin's own Core-memory markdown (Persona/User_Profile), not Hermes core, and is off by default."
