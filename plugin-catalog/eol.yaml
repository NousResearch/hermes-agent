name: eol
title: End-of-Life Checks
repo: https://github.com/adriens/hermes-eol-plugin
sha: b55b3b662cfc50633ea2203e3832aaf13a9b4091
version: "0.3.0"
description: |
  Live end-of-life and support status for 480+ products (languages, OSes, databases, frameworks, cloud services) from endoflife.date, so the agent stops answering support dates from memory. Reads and writes geol (.geol.yaml) stack files.

  - eol_search: find a product's identifier from a name, alias, category or tag; list categories and tags
  - eol_product: every release cycle with release date, LTS, end of active support, end of life, latest patch, and the product's purl/CPE identifiers
  - eol_check: check many components at once, by product+version, purl (e.g. from an SBOM) or CPE, today or at any date: supported / security-only / eol, days left, newer patch, LTS-aware upgrade target, maintained cycles
  - eol_stack_check: check a .geol.yaml with geol check --strict rules (skip, manual_eol, lts_strategy, lts_grace_days, always-latest)
  - eol_stack_file: generate a .geol.yaml from the components found in a project; the agent writes it with write_file
  - pre_llm_call hint: when a message is about versions, upgrades or security fixes (local keyword match), one line is added to that turn pointing the model at the eol_* tools, so it checks instead of answering from memory; off with the context_hint setting
  - Complements CVE scanners such as Patch Sentinel: they ask "am I patched?", this asks "is this version still supported by its vendor?"

  Disclosures
  - Network: HTTPS GET to endoflife.date/api/v1 when a tool is called; only product names are sent (plus fetching the public purl/CPE mapping tables).
  - No file access: stack files are passed in and returned as text; writing goes through Hermes' write_file and its approvals.
  - No credentials, no shell commands, no background processes; 6-hour in-memory cache only.
  - The pre_llm_call hook only reads the current user message, matches keywords locally and appends a fixed note; it sends nothing anywhere.
  - Stdlib only, no Python dependencies (YAML via Hermes' public hermes_yaml helper).
maintainer: adriens
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/adriens/hermes-eol-plugin#readme
readme: true
platforms: []
capabilities:
  provides_tools: [eol_search, eol_product, eol_check, eol_stack_check, eol_stack_file]
  provides_hooks: [pre_llm_call]
  provides_middleware: []
  requires_env: []
