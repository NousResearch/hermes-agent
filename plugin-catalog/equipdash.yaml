description: "Run a rental or activity business on EquipDash through EquipDash's official MCP server (Streamable HTTP at https://app.equipdash.com/mcp/v1, OAuth sign-in, no keys in config): the day's pickups, returns and sessions, bookings, availability and prices, customers, items, payments, refunds and unsigned waivers. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only, with one skill that has the agent preview every change and wait for the person's yes. Disclosure: hosted-only connector with no local code; every tool call sends its arguments to app.equipdash.com and returns the signed-in business's own records (bookings, customer names and contact details, payments) to Hermes and its model service. Tools that create, change, cancel, charge, refund or email are write-capable; the package marks the server untrusted, so Hermes asks before each one and refuses them in unattended runs. Read-only tools carry readOnlyHint. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
