name: escalation-governor
repo: https://github.com/jusst01/escalation-governor
sha: 50fcf38919b721fe481a60f728bf7271b15b6e82
description: "Deterministic stuck-detection for Hermes sessions. Watches tool/API failure signals (consecutive tool errors, repeated identical calls, API error bursts, model calls without progress) and, when a threshold trips, injects a structured escalation packet (goal, what was tried, what failed) directing the agent to delegate the remaining work to a stronger model via delegate_task instead of retrying blindly; writes a per-session JSONL report with escalation and token-usage accounting. Disclosure: local code only; reads tool results and API status inside the session, writes one JSONL report file per session under ~/.hermes, opens no network connections, starts no processes, and never blocks a tool call (fail-open)."
maintainer: jusst
tier: community
category: automation
docs_url: https://github.com/jusst01/escalation-governor#readme
version: "0.1.0"
requires_hermes: ">=0.22.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: [pre_llm_call, post_tool_call, transform_tool_result, post_api_request, api_request_error, subagent_start, subagent_stop, on_session_end]
  provides_middleware: []
  requires_env: []
