description: "Global travel eSIM data usage calculator, phone hardware eSIM compatibility matrix (US eSIM-only vs HK dual physical nano-SIM), and international provider price comparison through EsimTao's official MCP server (Streamable HTTP at https://esimtao.com/api/mcp, no sign-in, no keys in config). Bundles the esimtao workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local runtime code, binaries, hooks, telemetry or self-updater; every tool call goes over HTTPS to esimtao.com/api/mcp with only the travel data or device parameters. All tools are public, free, and annotated read-only (readOnlyHint: true, destructiveHint: false). The package marks the server untrusted (trust: untrusted), so Hermes asks before any tool not annotated read-only and refuses them in unattended runs. The remote tool inventory is served at runtime and is not covered by the pinned sha."
