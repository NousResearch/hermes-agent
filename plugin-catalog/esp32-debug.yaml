name: esp32-debug
title: ESP32 Debug
repo: https://github.com/snakeyear/hermes-esp32-debug
sha: 65d59feafef8b499c171b021c456aaf22c60b7cf
description: "Read-only ESP32 debugging: find ESP32 boards on serial ports, read chip info, capture a bounded serial log, and decode panic backtraces to function and file:line against a hash-checked ELF."
maintainer: snakeyear
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/snakeyear/hermes-esp32-debug#readme
version: "0.1.2"
readme: true
platforms: []
known_issues:
  - "esp32_decode_backtrace needs the Espressif toolchain (Arduino-ESP32 core, PlatformIO or ESP-IDF) and the .elf of the flashed build."
  - "esp32_chip_info runs esptool, which resets the board; it requires confirm_reset=true."
  - "Close Arduino Serial Monitor / idf.py monitor first; an open port returns 'port_busy'."
capabilities:
  provides_tools:
    - esp32_list_ports
    - esp32_chip_info
    - esp32_serial_capture
    - esp32_decode_backtrace
  provides_hooks: []
  provides_middleware: []
  requires_env: []