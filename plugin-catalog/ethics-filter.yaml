sha: d1ecb60a48a9f2ffd5f7eab5029c11a5940b2651
subdir: plugin
version: "1.1.0"
title: Ethics Filter
description: "Score any decision across six ethics modules — environmental, fairness, transparency, leadership, framework, compliance — and get GREEN, AMBER or RED back with the reasoning attached. Ships /ethics and the ethics_evaluate tool. Disclosure — reads the rubrics and constitution templates bundled in the plugin and appends one JSONL record per scored evaluation (decision text, context and reasoning included) to $ETHICS_FILTER_AUDIT, default ~/.ethics-filter/audit.jsonl outside the Hermes profile; that file is never rewritten or deleted. With auto_score=true it asks the host agent's own model to score through Hermes, holding no separate key; no other network calls."
maintainer: RegeneratusLabs
tier: community
category: tools
docs_url: https://github.com/RegeneratusLabs/ethics-filter#readme
readme: true
platforms: [linux, macos, windows]
requires_hermes: ">=0.21.5"
capabilities:
  provides_tools:
    - ethics_evaluate
  provides_hooks: []
  provides_middleware: []
  requires_env: []
