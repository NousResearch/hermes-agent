name: evalroute
repo: https://github.com/keppy/hermes-plugin-evalroute
sha: 684c6a871787870519b41b8cef0a152334fbf8ee
description: Route a task to the right (model, reasoning effort) arm before you start.
  Classifies the task into a lane, prints a provenance-carrying route card, and installs
  per-model reasoning-effort defaults. Strong rules run locally; weak-signal
  classification calls the host LLM and consumes tokens. The separate harness
  and shim can make paid provider calls when explicitly run; no plugin-owned credentials.
maintainer: keppy
tier: community
category: tools
requires_hermes: ">=0.21"
version: "0.3.3"
docs_url: https://github.com/keppy/hermes-plugin-evalroute#readme
capabilities:
  provides_tools:
    - evalroute_route
  provides_hooks:
    - pre_llm_call
    - pre_command
    - post_llm_call
  provides_middleware: []
  requires_env: []
