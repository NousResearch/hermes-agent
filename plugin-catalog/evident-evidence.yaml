known_issues:
  - Requires a vision-capable configured model for interpreted reports; model calls may incur charges.
  - Anonymous desktop capture has bounded coverage; account actions, purchases and protected pages remain outside scope.
capabilities:
  provides_tools: [evident_memory, evident_save_test, evident_scan, evident_finish, evident_demo, evident_report, evident_browse, evident_screenshot, evident_explain, evident_observe, evident_verify, evident_inspect, evident_delete]
  provides_hooks: [pre_llm_call]
  provides_middleware: []
  requires_env: []
