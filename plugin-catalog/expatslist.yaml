description: "Read-only ExpatsList MCP server and skill: city guides from local business listings, questions and answers, classifieds and country reference tables (nomad visas, cost of living, healthcare, tax, safety, tipping). Agent Plugins v1 package (plugin.json + mcp.json + one skill), configuration only. Disclosure — every tool call goes to the public read-only MCP server at expatslist.org (https://expatslist.org/api/mcp), which only reads published site content (community-written listings, questions, classifieds and indicative country tables); no sign-in, no key, nothing written, no local commands. The package marks the server untrusted. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
