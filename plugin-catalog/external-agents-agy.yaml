known_issues:
  - Companion to external-agents at the same commit; direct primary-chat use is unsupported.
  - Requires separately installed official AGY CLI and vendor-managed supported login. No vendor binary or token store reader is included.
  - Requires in-process loading; the custom client cannot run under isolated plugin-host policy.
  - AGY can use network services and access files under its own permissions; workspace is not a filesystem sandbox.
  - Headless vendor approval dialogs cannot be forwarded to Hermes. No permission-bypass flags or blanket grants are installed.
  - Prompts appear in process arguments and task answers are cached locally. Vendor usage and cost are unknown.
  - On the tested Hermes host, directory providers remain discoverable when disabled; see upstream issue 137671. Disable the delegation backend as well and use a fresh conversation/process.
