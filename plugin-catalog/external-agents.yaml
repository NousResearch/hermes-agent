screenshots: []
known_issues:
  - Requires external-agents-agy installed separately at the same commit; companion installation is not automatic.
  - Early opt-in preview; only macOS arm64 is live-tested. Windows is unsupported.
  - Requires trusted in-process loading and an explicit local terminal policy.
  - AGY owns its tools, authentication and permissions; Hermes tool filters do not confine them.
  - No vendor approval bridge, live steering, resume parity or proven OS containment.
  - Prompts appear in process arguments; cached task answers are stored locally with owner-only POSIX permissions, not encryption.
  - On the tested Hermes host, disabling only the provider does not revoke routing; see upstream issue 137671. A fresh backend-disabled configuration refuses delegation.
