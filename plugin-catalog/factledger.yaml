sha: d3db59db67ac78d14cf8a4b45fc79d19ea26f9ee
subdir: plugin
version: "1.3.0"
description: >-
  A typed-facts ledger with structural truth — the agent records durable facts
  (prices, statuses, limits, decisions, capabilities) once and search/show them
  whenever they matter. For every (scope, subject, predicate) exactly one row is
  active; a new value closes the previous one (valid_to + superseded_by) instead
  of overwriting it, so contradictory versions never coexist and history is the
  audit trail. The full ledger stays queryable on demand, separate from the
  character-budgeted memory view that is injected every turn. Requests are facts
  with a lifecycle (task.<verb>): "done" cannot be written without evidence, and
  an overdue task with a newer fact on the same subject is flagged instead of
  being presented as still live. Topic recall reports when a term also appears
  outside the matched subject, so a brief never looks complete by omission.
  Tools: add, show, search, history, compile, stale, export, check, stats, plus
  factledger_standalone for the full CLI (brief, topics, audit, tasks,
  merge-subject). Local-first TSV store, stdlib only, no network, no credentials.
  Disclosure — none: no network calls, no shell commands, no background
  processes, no credential access; every tool reads or writes only the local
  ledger file.
maintainer: explorelifehus-eng
