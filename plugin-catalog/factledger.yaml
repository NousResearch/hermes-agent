name: factledger
title: Factledger
repo: https://github.com/explorelifehus-eng/factledger
sha: 77843ab263d8678bf44ce4b50b88d62cc5ae9b7e
subdir: plugin
version: "1.0.0"
description: >-
  A typed-facts ledger with structural truth — the agent records durable facts
  (prices, statuses, limits, decisions, capabilities) once and search/show them
  whenever they matter. For every (scope, subject, predicate) exactly one row is
  active; a new value closes the previous one (valid_to + superseded_by) instead
  of overwriting it, so contradictory versions never coexist and history is the
  audit trail. The full ledger stays queryable on demand, separate from the
  character-budgeted memory view that is injected every turn. Tools: add, show,
  search, history, compile, stale, export, check, stats. Local-first TSV store,
  stdlib only, no network, no credentials. Disclosure — none: no network calls,
  no shell commands, no background processes, no credential access; every tool
  reads or writes only the local ledger file.
maintainer: explorelifehus-eng
tier: community
