name: fail-shrink
repo: https://github.com/TakeshiTGAL/hermes-plugin-fail-shrink
sha: 58ccb473a250dcb1fa86fa4581f494e54a8a9bd2
description: 'When a pytest, jest, vitest, cargo test, go test, tsc, ruff, or eslint summary line shows, the result is a short block with that place and the same exit code. No summary line, or a poll with only output_preview, stays as Hermes returned it. Disclosure — writes it under plugin-data/fail-shrink after Hermes strips ANSI and redacts secrets; sends nothing, no child, no credential, no cron job, no daily cap; fail_full reads one log, writes nothing, no approval card; on every platform, so anyone who can talk to the agent can read the logs; hermes tools disable fail-shrink --platform hides the tool and leaves the hook; plugins disable stops the hook; logs remain until that directory is deleted.'
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: '>=0.21.4'
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-fail-shrink#readme
version: '0.1.0'
platforms: [linux, macos]
capabilities:
  provides_tools:
  - fail_full
  provides_hooks:
  - transform_tool_result
  - pre_llm_call
  provides_middleware: []
  requires_env: []
