description: "Context-diet plugin: compresses oversized tool results (head 60% + tail 40% + omission marker) before they enter the model context, cutting tokens, latency and cost. Adds /fastpath status|on|off|limit N|reset. Disclosure — local-only: no network, no shell, no credentials, no telemetry; writes only ~/.hermes/fastpath/state.json."
