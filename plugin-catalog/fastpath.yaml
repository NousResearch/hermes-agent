name: fastpath
title: fastpath
repo: https://github.com/siavashmirtaheri/fastpath-plugin
sha: 61a00a6e5866b39650a1d2a851ae9bc6961f7175
description: "Context-diet plugin: compresses oversized tool results (head 60% + tail 40% + omission marker) before they enter the model context, cutting tokens, latency and cost. Adds /fastpath status|on|off|limit N|reset. Disclosure - on by default, it rewrites every tool result longer than 12,000 characters (any tool, file reads and skills included) to its first and last parts with an omission marker, so the middle never reaches the model and is not saved anywhere; turn it off or raise the limit with /fastpath. Local-only: no network, no shell, no credentials, no telemetry; writes only ~/.hermes/fastpath/state.json. Backed by Metadigi (https://metadigi.ir)."
maintainer: siavashmirtaheri
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "1.0.0"
docs_url: https://github.com/siavashmirtaheri/fastpath-plugin#readme
readme: true
image: https://raw.githubusercontent.com/siavashmirtaheri/fastpath-plugin/61a00a6e5866b39650a1d2a851ae9bc6961f7175/docs/assets/banner.svg
