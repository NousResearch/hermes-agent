known_issues:
  - "Redacted auth headers are not replayed; pass fresh ones with faultline_replay(override_headers=...) for authenticated endpoints."
  - "Compressed (gzip/br) response bodies are proxied untouched but stored as a placeholder, so schema drift is only learned from uncompressed JSON."
  - "Chaos rules persist in the database and apply to every running proxy until removed."
  - "Both halves ship opt-in: enable the agent half (hermes plugins enable faultline, then restart the gateway) and flip the Desktop switch in Capabilities -> Plugins."
