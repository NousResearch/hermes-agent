known_issues:
  - "Feishu only: the plugin is a no-op on every other platform."
  - "Requires plugins.isolation: in_process (the default). Under host isolation the hook receives a placeholder gateway, so the plugin cannot resolve the receiving bot or the sender's authorization and does nothing."
  - "Topics do not nest: sent inside a topic, the trigger is stripped and the message stays in the current session."
  - "In a group, @-mentioning someone else alongside the bot makes the adapter prepend a [Mentioned: …] hint, so the trigger no longer starts the text and does not fire."
  - "The notes the plugin appends (empty-body placeholder, in-topic note, failure notes) are Chinese-only, whatever language the user writes in."
  - "If Feishu processes the reply but every response is lost, the plugin never learns the thread_id: the message falls back to the current session and the server-side topic can be left orphaned. Retries reuse one request UUID, which makes a duplicate topic unlikely but cannot resolve that ambiguity."
  - "Reads gateway/adapter internals (_delivery_adapter_for, the adapter's _client and _run_blocking). They exist in Hermes 0.22 and are used by bundled plugins, but a Feishu-adapter refactor can break topic creation — the message is then dispatched normally with a note, never dropped."
