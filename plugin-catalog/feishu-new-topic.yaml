title: Feishu New Topic
description: "Feishu/Lark only: a message starting with `#new ` (or the spoken phrase 开启一个新话题) opens a new Feishu topic on that message, which Hermes turns into a new session — a second lane, while the session that was already running keeps running with its turn untouched. That is the difference from `/new`, which interrupts the running turn and clears the conversation. Inside a topic the trigger is stripped, because Feishu topics do not nest; if topic creation fails the message is dispatched normally with a note. Disclosure — normally two Feishu OpenAPI calls (messages/{id}/reply with reply_in_thread, then messages/{id}/delete for a one-character placeholder reply), with reply retried up to three times on network errors or Feishu 2200, and no calls at all for cached duplicates, in-topic messages or unauthorised senders; calls go through the Feishu client of the bot that received the message (`_delivery_adapter_for`), and no credentials are handled; a dedupe map keyed by Feishu message id, holding {thread_id, timestamp}, persists through the plugin state file; the notes it appends are Chinese-only; nothing is rewritten unless the gateway's own authorization probe approves the sender. Requires plugins.isolation: in_process. README is bilingual (English + 中文)."
maintainer: kaigregliu
tier: community
category: platform
requires_hermes: ">=0.22"
