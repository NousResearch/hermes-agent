version: "0.3.5"
title: Feishu New Topic
description: "Feishu/Lark only: a message starting with `#new ` (or the spoken phrase 开启一个新话题) opens a new Feishu topic on that message, which Hermes turns into a new session — a second lane, while the session that was already running keeps running with its turn untouched. That is the difference from `/new`, which interrupts the running turn and clears the conversation. Inside a topic the trigger is stripped, because Feishu topics do not nest; if topic creation fails the message is dispatched normally with a note. Disclosure — Feishu/Lark only. Hooks `pre_gateway_dispatch` (runs before gateway auth) and checks the sender itself with the gateway's authorization probe; unauthorised senders, in-topic messages and cached duplicates cause no calls. For an authorised `#new` message it makes two Feishu OpenAPI calls through the receiving bot's own client (messages/{id}/reply with reply_in_thread, retried up to three times, then messages/{id}/delete of the one-character placeholder), sets the message's thread id so Hermes routes it to a new session, and strips the trigger from the text. Reaches gateway/adapter internals (`_is_user_authorized_for_source`, `_delivery_adapter_for`, the Feishu adapter's `_client` and `_run_blocking`), so a core refactor can stop topic creation (the message is then dispatched normally with a note). Keeps a 40-entry message-id → thread-id dedupe map in plugin state. Appended notes are Chinese-only. Requires plugins.isolation: in_process."
maintainer: kaigregliu
