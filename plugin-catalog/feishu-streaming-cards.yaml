name: feishu-streaming-cards
repo: https://github.com/hutao562/hermes-plugin-feishu-streaming
sha: fee5142d832b050dadb3ce01fb48b84ec7abd84a
subdir: plugin
description: "Feishu/Lark streaming cards (CardKit v2) for the Hermes gateway: every turn renders as one live typewriter card with a collapsible reasoning panel, a structured tool panel, in-card heartbeat, clarify single-select, document delivery, cron result cards and an in-footer model switcher. Disclosure — this is an opt-in enhancement that subclasses the bundled FeishuAdapter and registers under the same 'feishu' platform name (registry last-writer-wins), inheriting the bundled entry's setup/status contract surfaces; it talks only to the Feishu open platform APIs with the FEISHU_APP_ID/FEISHU_APP_SECRET you configure and sends message content there; card interaction buttons (model switch, clarify) are dispatched as the clicking user via Hermes synthetic events; English-first README with a Chinese translation alongside."
maintainer: hutao562
