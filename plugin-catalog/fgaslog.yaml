title: FGasLog
description: >-
  F-gas leak checks under Regulation (EU) 2024/573: one skill (leak check duty, intervals,
  record items of Art. 7) plus a local stdio MCP server with two tools, co2_equivalent
  (charge x GWP / 1000) and leak_check_interval (Art. 5(1) and 5(6)). Portable Agent
  Plugins v1 package (plugin.json + mcp.json + skills/), no plugin code. Disclosure: Hermes starts
  node src/server.js from the pinned checkout (no runtime dependencies, nothing downloaded);
  the server makes no network calls, stores no data and sends no telemetry. No credentials needed.
