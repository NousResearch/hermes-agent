name: field-academy
title: Field Academy
repo: https://github.com/Dgardenhire/hermes-field-academy
sha: d5ec84cf4997864fb5b6a346df2699a08cd1b764
description: "The School of Hermes. Hermes will sometimes tell you it saved something when it didn't, and Field Academy teaches you to catch that. In Foundations you work through 11 missions in a throwaway copy of Hermes with one thing quietly broken: you do a real job, say how you think it went, then look at what Hermes actually wrote to its files. After that come 34 missions on five trails in your own Hermes, each trail ending with a Field Record of your work. New in 0.9: Foundations and the trail map. Independent community plugin, not made or endorsed by Nous Research. Disclosure — no network calls of its own and no telemetry; registers six tools, two hooks, the /academy command and one skill. It creates and deletes practice profiles (named academy-practice) through Hermes, which copies your provider sign-in into each; Field Academy never reads .env, auth.json or other sign-in files. Before a practice profile's first chat it writes allowlisted settings, memory, a sample skill and sample files into that profile only, and may turn on its memory or skill write-approval setting; it never changes approvals.* or the command allowlist, and never writes your own profiles. Some missions add a filesystem connector (@modelcontextprotocol/server-filesystem, pinned) that Hermes downloads with npx, and scheduled practice jobs that, once repaired, run hourly on your model provider until you pause them. AI help (on by default) sends mission text, your answers and key-scrubbed practice excerpts to your own model; the in-chat practice offer (pre_llm_call, interactive sessions only) is off until you turn it on. It reads a file you name (UTF-8, max 5 MiB); on the Guide path it reads Hermes's run-history database read-only, jobs.json and up to 25 log files; progress, practice labs and Field Records stay in $HERMES_HOME/plugin-data/field-academy/."
maintainer: Dgardenhire
tier: community
category: desktop
requires_hermes: ">=0.22.0"
docs_url: https://linchpin.studio/school-of-hermes/manual/
known_issues:
- "Live-tested on macOS only. Linux and Windows run the same code and tests, but nobody has walked a mission there in Hermes."
- "Only the author has walked Field Academy in Hermes; nobody else has finished a trail yet. Walked live on Nov 11, 2026, on Hermes 0.23.1: Foundations mission 3 (Save a fact to memory and check it stuck) end to end, with AI help on Claude and the practice chat on the OpenAI route, and its Field Record saved and checked with shasum. In the connector mission, the practice chat was refused access outside its folder. Every screen was also checked in a test harness."
- "A repaired practice job runs every hour on your model provider until you pause it or delete the practice profile. Field Academy doesn't pause it for you."
- "The Field Record is self-issued. Its manifest shows a file changed after saving, but someone who edits the files and the manifest together can fake a pass."
- "Practice chats get Hermes's own file and terminal tools as any profile does. Hermes's file tools refuse to read sign-in files; a terminal command follows your approval settings."
- "The peak names drawn on the banner art are small and hard to read; the trail map below names every trail at full size."
