description: "Sidebar tab that searches and filters Hermes projects and sessions, including by project name, which the built-in search cannot. All, Projects and Sessions views; right-click a project to add a session, copy its folder path, rename, recolour, reorder or delete, and right-click a session to open, copy id, tag, archive or delete; plus per-session and per-project token and cost stats and a live context meter. Desktop only; no agent tools, hooks, middleware or env vars."
