known_issues:
  - Experimental beta. New-profile import and activation are blocked pending a supported safe host import contract.
  - The optional pinned Google Workspace skill bridge is not a stable SDK provider API and does not satisfy the outstanding SDK-only review requirement.
  - Independent finix:google authorization-lifecycle and full Windows/Linux recovery acceptance with the Workspace skill absent remain incomplete.
  - Requires separately installed age and age-keygen. Keep independent backups and the recovery key off the backup host.
