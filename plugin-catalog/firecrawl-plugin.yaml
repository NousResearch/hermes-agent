description: "Search, scrape, crawl, map, interact, monitor and research through Firecrawl's hosted MCP server, with Firecrawl skills. Adds the full Firecrawl tool set (Alexandria data providers, people and company search, developer, paper and US government search) beside the bundled Firecrawl web backend, using the same FIRECRAWL_API_KEY; supports Hermes-managed OAuth through a native MCP entry. Disclosure — Connects to Firecrawl's hosted MCP server at `mcp.firecrawl.dev` and sends it the queries, URLs, prompts and files the agent asks Firecrawl to process, authenticated with `FIRECRAWL_API_KEY` or a Hermes-managed Firecrawl OAuth sign-in; calls use Firecrawl account credits."
