description: "Search, scrape, crawl, map, interact, monitor and research through Firecrawl's hosted MCP server at /v2/mcp-oauth, with Firecrawl skills (get-started, routing, deep research and 16 workflow skills). Adds the full Firecrawl tool set (Alexandria data providers, people and company search, developer, paper and US government search) beside the bundled Firecrawl web backend. The packaged connection uses FIRECRAWL_API_KEY, the same key as the bundled backend; Hermes-managed OAuth on the same endpoint works through a native MCP entry. Disclosure — Connects to Firecrawl's hosted MCP server at `mcp.firecrawl.dev` and sends it the queries, URLs, prompts and files the agent asks Firecrawl to process, authenticated with `FIRECRAWL_API_KEY` or a Hermes-managed Firecrawl OAuth sign-in; calls use Firecrawl account credits."
maintainer: firecrawl
