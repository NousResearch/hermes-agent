platforms: [linux, macos]
known_issues:
  - "Hermes's text normaliser alters <|speaker:N|> markup and Drama 3 closing tags such as </whisper> on the plain text_to_speech path; use fish_speak for multi-speaker speech and Drama 3 word tags (NousResearch/hermes-agent#133131)."
  - "An empty API key field in Settings is hard to see, worst in the dark theme; a fix is proposed (NousResearch/hermes-agent#138994)."
  - "In Hermes Desktop voice conversations, part or all of a reply sometimes goes unspoken because Desktop stops passing it to speech mid-turn; this affects every speech provider, and fixes are proposed (NousResearch/hermes-agent#129305)."
  - "Under plugins.isolation: host the hermes fish terminal command is unavailable and voice replies use whole-file speech instead of streaming; /fish, the tools and both providers still work."
capabilities:
  provides_tools:
    - fish_speak
    - fish_voices
    - fish_transcribe
  provides_hooks:
    - transform_llm_output
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - FISH_API_KEY
