known_issues:
  - "Hermes's text normaliser alters <|speaker:N|> markup on the plain text_to_speech path; use fish_speak for multi-speaker speech (NousResearch/hermes-agent#133131)."
  - "Streaming voice uses the plugin streaming hook (#133723), first released in Hermes 0.21.6. The plugin itself still loads on 0.21.5 (its plugin.yaml floor) and speaks there with whole-file synthesis: sentence by sentence in CLI voice mode, and the whole reply in Desktop read-aloud and gateway voice."
  - "Under plugins.isolation: host the hermes fish terminal command is unavailable and voice replies use whole-file speech instead of streaming; /fish, the tools and both providers still work."
capabilities:
  provides_tools:
    - fish_speak
    - fish_voices
    - fish_transcribe
  provides_hooks:
    - transform_llm_output
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - FISH_API_KEY
