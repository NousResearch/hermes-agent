description: "Google Search, YouTube Data and YouTube Download. Search web pages, news, images, shopping offers, videos and places; retrieve YouTube video metadata, transcripts, captions, channel data and autocomplete; download video, audio or clips to your own storage. Includes standard and extended YouTube search and 15 task Skills. Requires your own FlashData API key and paid Credits. Disclosure — Connects to FlashData's hosted MCP service (data.flashdata.dev) with your own FLASHDATA_API_KEY; every search, YouTube read or download spends your paid FlashData Credits, and Hermes asks before running only the tools the server does not mark read-only, so most paid searches run without a prompt. The YouTube download tool sends the storage bucket and storage access credentials you supply to FlashData, and those values stay visible in the chat history."
