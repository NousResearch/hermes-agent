description: "iOS App Store market data in Hermes: young apps that already earn, app ideas scored from market data, top charts, App Store keyword research, keyword field checks, and daily rank and competitor tracking through Fledly's hosted MCP server (https://fledly.app/mcp, OAuth sign-in, no keys in config). Bundles the fledly workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — every tool call goes to Fledly's hosted server (fledly.app) and acts on the user's own Fledly account; the tool set is served by that server at runtime and is not covered by the pinned sha. track_app, track_keywords, untrack_keyword, track_competitor, untrack_competitor and save_idea change the user's tracked apps, searches, competitors and saved ideas; every other tool only reads, and nothing spends money. Sign-in runs the pinned mcp-remote@0.15.2 through npx (Node.js 20+ and npm required), which opens a browser and a local callback port on first use and stores OAuth tokens under ~/.mcp-auth. No telemetry."
