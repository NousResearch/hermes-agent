# Flower Shop - catalog entry. Schema: plugin-catalog/README.md (entry schema).

name: flower-shop
repo: https://github.com/k-reeeee/hermes-flower-shop
sha: "d11b0c63c38bc3db8a909f67f09e6d7906798843"
title: Flower Shop
description: >-
  An AI business operating workspace inside Hermes Desktop for a small flower
  shop: a business manager plus sales, inventory, production, finance, and
  logistics agents work from one SQLite record of orders, stock, production,
  deliveries, and money. Agents propose, the owner approves - order confirmation,
  stock receipts, adjustments, wastage, payments, and expenses create a pending
  approval decided from an inline chat card, the Approvals inbox, or an explicit
  chat relay. Includes Overview, Orders, Inventory and recipes, Production board,
  a read-only low-poly 3D Shop Floor fed by live production state, Delivery,
  Finance estimates labelled as estimates, an AI Team page, and a guided setup
  with removable demo data. Disclosure - all business data stays in one local
  SQLite database under the Hermes plugin-data directory; the plugin makes no
  network calls, stores no credentials, runs no shell commands, and sends no
  telemetry. Not an accounting ledger: finance figures are operational estimates
  plus recorded payments and expenses. Single shop, single user; no WhatsApp
  parsing, no bouquet canvas, no multi-branch support.
