known_issues:
  - Finance figures are operational estimates plus recorded payments and expenses, not an accounting ledger.
  - Single shop and single user; no multi-branch or multi-staff access control.
  - WhatsApp intake relies on the existing Hermes gateway; no special parsing in the plugin.
  - The bouquet canvas is not implemented; design references are images attached to orders.
