version: "1.0.2"
title: fluent
description: "Your agent becomes fluent in any program: checks the agent's terminal commands against the real --help and man pages of the programs you adopt, before they run. A long option the installed version doesn't have is stopped with the closest real one (--crf → -crf, --ammend → --amend), and subcommands it classifies as destructive (gh repo delete, docker image prune, rsync --delete) go to Hermes's own approval prompt. Adds /fluent (adopt, show, forget, undo, mode), an @cli:<program> context reference and a dashboard tab that draws the agent's tree (a branch per program, a fruit per error caught). Tested on 333 real valid commands (0 blocked) and 22 typical mistakes (22 caught), including the tar macOS ships. Disclosure — /fluent adopt <program> runs that program on the host (not the terminal backend) with --version/-version/version/-V and --help/-h/help, plus <command> --help per subcommand only when the help carries a git, Go/cobra, argparse or click marker (git: --list-cmds and <command> -h; ffmpeg: -h full; curl: --help all; git filter-branch is never run): no shell, closed stdin, empty temp cwd, own process group, filtered environment (PATH, HOME, USER, LOGNAME, TMPDIR, XDG dirs; no keys or tokens), 5 s per call, about 25 s per program; a program that ignores those arguments runs normally. It reads man pages and terminal.backend from config.yaml; in block mode (default) pre_tool_call vetoes commands with options the installed program lacks and escalates destructive ones to Hermes's approval prompt with a per-subcommand rule key, never approving anything (unattended runs follow Hermes policy, default deny); posts one-line notices; writes only under its plugin data directory; makes no network, model or telemetry calls."
maintainer: Bruno-coder21
