known_issues:
  - "Only acts on the local terminal backend and on long options of commands it read with high confidence; it trusts the binary on Hermes's own PATH, so a different copy on a session PATH (venv, nvm, direnv) can be judged against the wrong help."
  - "Risk classes are name and help-summary heuristics that only add prompts: many destructive forms are not asked about (git stash drop, gh api -X DELETE, rsync --delete-excluded), and its copy of Hermes's own patterns can drift, so a command may occasionally be asked twice."
  - "In cron and other unattended runs, commands fluent flags as destructive are refused under Hermes's default approval policy; use /fluent risk off or approvals.cron_mode for jobs that must delete."
  - "Live adoption progress and 'fluent caught' notices need the in-process gateway (default plugins.isolation). Tested on Linux; Windows is untested."
