name: fluxer-platform
repo: https://github.com/elkimek/hermes-fluxer-plugin
sha: f7765e0fd334432dc625adcc4b4435c943df77ed
version: "0.6.0"
description: >-
  Fluxer messaging with reliable replies, attachments, rich cards, read-only guild tools,
  and opt-in threads and experimental voice. Connects to Fluxer and configured speech services;
  optional voice runs background Python processes and reads configured local context and session data.
maintainer: elkimek
tier: community
category: platform
docs_url: https://github.com/elkimek/hermes-fluxer-plugin#readme
capabilities:
  provides_tools:
    - flux_recall
    - flux_search
    - flux_members
    - flux_audit
  provides_hooks:
    - pre_command
  provides_middleware: []
  requires_env:
    - FLUXER_BOT_TOKEN
