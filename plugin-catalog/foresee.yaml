description: >-
  Let AI assistants shop for home and auto insurance: compare instant quotes across every carrier.
  Connects to the hosted Foresee MCP server (Streamable HTTP at agents.go-foresee.com), with three
  workflow skills bundled. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure —
  portable Agent Plugins v1 package (hosted MCP server plus three skills), no Python and nothing runs
  locally; the vendor is Foresee Insurance Services, LLC (go-foresee.com). Every quote request sends
  the profile the user gives in chat (ZIP, age or date of birth, vehicles, drivers, driving record,
  home details) to agents.go-foresee.com with no account or API key. The live_carrier_quotes tool
  additionally sends the user's identity (name, date of birth, street address, email, optionally phone
  and driver's licence number) and, after the user's in-chat consent recorded verbatim, Foresee's
  agents submit those details to the selected insurance carriers, who may run a soft credit-based
  insurance score pull and contact the user. Foresee does not take payment or bind policies.
