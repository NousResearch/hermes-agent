name: forgebox
repo: https://github.com/nosliwhtes/forgebox
sha: d7a3bccdf24a0a98f96731be7c0a90d5ce03a7fb
description: >-
  Try-then-commit Git worktree workflow for Hermes Agent. Snapshots dirty
  repositories and journals tool calls. Best-effort hooks redirect known file
  paths and command working directories; shell command text is unchanged.
  This is not an OS sandbox and does not contain shell writes or external
  side effects. Review and apply changes explicitly with forgebox apply or
  the dashboard/Desktop panel, or discard the worktree. Requires Git on PATH.
maintainer: nosliwhtes
tier: community
category: tools
docs_url: https://github.com/nosliwhtes/forgebox#readme
version: "0.1.0"
requires_hermes: ">=0.21.6"
platforms: [linux, macos]
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - post_approval_response
  provides_middleware: []
  requires_env: []
