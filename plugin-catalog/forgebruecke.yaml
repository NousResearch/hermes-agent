name: forgebruecke
title: Forgebrücke
repo: https://github.com/studioluftbruecke/hermes-forgebruecke
sha: 71bb5c17e0f27df66d157f3b910ac4750dcdeaca
description: "A bridge between Hermes and your self-hosted Forgejo: Hermes works as its own account, writes follow Hermes' approval setting, and a desk in Hermes Desktop shows the pull requests that wait for you. Disclosure — Talks only to the Forgejo address you set, as a separate Hermes account whose token you provide; the optional personal write token is used only for the desk's Merge and Comment buttons on your click, and is available to Hermes. Per-repo flows run a background loop in the gateway that reviews new pull requests by starting `hermes -p <reviewer profile> chat` processes, which send each pull request's title, description and diff to that profile's model provider and post the verdict as a comment. The \"Create a reviewer profile\" button clones your profile (config.yaml, SOUL.md and every key in .env) into `forgebruecke-reviewer`, then removes its memories and the two Forgebrücke tokens through `hermes` commands. The optional mention channel, once enabled in the profile, answers Forgejo mentions from any commenter on repos where mentions are on. The git credential helper setup prints `git config --global` lines for you to run."
maintainer: studioluftbruecke
tier: community
