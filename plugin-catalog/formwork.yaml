name: formwork
title: Formwork
repo: https://github.com/ladyFaye1998/hermes-formwork
sha: b367b7021eef71ba051b8d585ed49edf807c9a6b
description: "Complete a packet of fillable PDFs inside Hermes Desktop. See each suggested answer on the original form, open its exact source page and quote, and review it before export. Enter a missing fact once and choose which matching fields should reuse it. Save editable PDFs and a review record in one ZIP. Disclosure — Formwork sends the full text of your supporting PDFs, form field details and rendered images of each form page to the model in its \"Formwork extraction\" auxiliary slot (it uses your Hermes Vision model until you set one), and it keeps imported PDFs, previews, exports and archived packets under plugin-data/formwork after the plugin is removed."
maintainer: ladyFaye1998
