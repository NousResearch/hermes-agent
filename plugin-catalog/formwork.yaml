name: formwork
title: Formwork
repo: https://github.com/ladyFaye1998/hermes-formwork
sha: b367b7021eef71ba051b8d585ed49edf807c9a6b
description: >-
  Complete a packet of fillable PDFs inside Hermes Desktop. See each suggested
  answer on the original form, open its exact source page and quote, and review
  it before export. Enter a missing fact once and choose which matching fields
  should reuse it. Save editable PDFs and a review record in one ZIP.
maintainer: ladyFaye1998
tier: community
category: desktop
requires_hermes: ">=0.23.1"
