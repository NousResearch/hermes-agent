name: fractal-memory-engine
repo: https://github.com/pCwOrM/hermes-fractal-memory
sha: a4d660fe4a186e4b68e063819659dbb82ba2d9c7
version: "1.0.1"
description: >-
  Hierarchical vectorless episodic memory, procedural attractor clustering,
  and O(1) complex coordinate anchoring for Hermes Agent. Eliminates external
  vector database and embedding model overhead via 3-ring orbital resonance
  decay and local JSON state persistence under HERMES_HOME/plugin-data.
maintainer: pCwOrM
tier: community
category: memory
requires_hermes: ">=0.21.0"
docs_url: https://github.com/pCwOrM/hermes-fractal-memory#readme
readme: true
platforms: [linux, macos, windows]
capabilities:
  provides_tools:
    - fractal_remember
    - fractal_recall
    - fractal_consolidate
    - fractal_memory_inspect
    - fractal_memory_wipe
  provides_hooks:
    - pre_llm_call
    - post_llm_call
  provides_middleware: []
  requires_env: []
