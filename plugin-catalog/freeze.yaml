name: freeze
title: Freeze
repo: https://github.com/mauricemohr88-debug/hermes-freeze
sha: a992ebae39a7a0c861169383ff4966e01e3ba2ff
version: "0.1.4"
description: "Let Hermes do a task once, then replay it without the model: /freeze turns the last turn's tool calls into a checked workflow (bindings, loops over lists, and model-worked values compiled into Python that must reproduce the recording exactly), and hermes freeze run repeats it with 0 model calls, stops on drift, never overwrites a file you edited, and hermes freeze schedule makes it a no-agent cron job. Disclosure — hooks record each turn's task, tool arguments, tool results (truncated at 256 KB), final answer and token counts in <HERMES_HOME>/plugin-data/freeze/data.db, pruned after 14 days; /freeze makes model calls through your active model (one per compiled step, at most 3 attempts) and sends the task, shortened tool results and the recorded value; replays run the frozen shell commands and file writes through Hermes' own tools and Hermes' approvals (unattended runs follow approvals.cron_mode, default deny), and run compiled code in a separate python -I process with a static check and a 10 s timeout; /freeze run starts hermes freeze run as a child process, --fallback agent starts hermes chat; schedule writes <HERMES_HOME>/scripts/freeze-<name>.sh and creates a cron job with hermes cron create --no-agent; no network calls of its own, no telemetry, no credentials."
maintainer: mauricemohr88-debug
tier: community
category: automation
requires_hermes: ">=0.23.0"
docs_url: https://github.com/mauricemohr88-debug/hermes-freeze/tree/a992ebae39a7a0c861169383ff4966e01e3ba2ff#readme
readme: true
