name: freshdesk
repo: https://github.com/aedelgod/hermes-plugin-freshdesk
sha: "005bee2c6a1d0857dbafd6bfac7a2e2e37619991"
description: "Generic Freshdesk API v2 tools for Hermes Agent. Unaffiliated community connector, not a Freshworks product. Disclosure: calls the account's native Freshdesk HTTPS origin with profile-scoped secrets FRESHDESK_DOMAIN and FRESHDESK_API_KEY; downloads an attachment into the Hermes cache only from that ticket's own attachment hosts; the two write tools escalate to Hermes human approval and fail closed when no person is present. No third-party dependencies, shell commands, telemetry, or self-updater."
maintainer: GFORGOV
tier: community
category: tools
requires_hermes: ">=0.21.4"
version: "0.1.1"
readme: true
docs_url: https://github.com/aedelgod/hermes-plugin-freshdesk#readme
platforms: []
capabilities:
  provides_tools:
    - freshdesk_list_tickets
    - freshdesk_get_ticket
    - freshdesk_search_tickets
    - freshdesk_list_conversations
    - freshdesk_get_contact
    - freshdesk_download_attachment
    - freshdesk_add_private_note
    - freshdesk_create_ticket
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - FRESHDESK_DOMAIN
    - FRESHDESK_API_KEY
