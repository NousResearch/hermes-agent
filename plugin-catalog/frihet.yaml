# Hermes plugin-catalog entry for hermes-frihet v0.1.0.
#
# Catalog: NousResearch/hermes-agent/plugin-catalog/frihet.yaml
# Per the catalog rules (plugin-catalog/README.md):
# - The maintainer of the plugin repository (Frihet-io) is the only one
#   authorised to submit the entry.
# - ``tier`` MUST be ``community`` — ``official`` in the catalog means
#   "maintained by NousResearch". We describe ourselves as the "Official
#   Hermes Agent integration for Frihet" in the description, not in the
#   catalog's tier label.
# - The SHA must be a 40-character full commit hash of a tagged, audited
#   commit of Frihet-io/hermes-frihet. Update via a new PR whenever we
