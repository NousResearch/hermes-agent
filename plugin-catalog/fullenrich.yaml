description: >-
  Search B2B people and companies, enrich work emails and phone numbers, and export results through FullEnrich's hosted MCP server. Includes nine workflow skills for prospecting, CSV enrichment, outreach drafting, meeting preparation and recruiting.
  Disclosure: MCP requests send search filters and contact identifiers or uploaded contact data to FullEnrich. A FullEnrich account is required; enrichment and exports can consume credits. Skills may use user-selected files and separately connected CRM or messaging tools; FullEnrich MCP itself does not send messages or write to a CRM. No local executable code, background service or telemetry implementation is bundled. OAuth is managed by Hermes through the separate sign-in command.
