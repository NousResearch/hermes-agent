sha: 9d07f0f9ba5303488b11cffd8133b5342f7e05c4
description: "FXMacroData macro and FX research with official-source releases, indicator history, release calendars, curves, FX, commodities, positioning and sourced research tasks. 100 native tools: 41 REST, 57 MCP, a USD brief and a version-pinned history snapshot. Disclosure: tool calls send their arguments, including user-entered research or positions, over HTTPS only to api.fxmacrodata.com and mcp.fxmacrodata.com; optional FXMACRODATA_API_KEY is read through the Hermes profile-scoped secret API and sent in request headers. Public USD catalogue, history and calendar require no key, account or card; other scope depends on data entitlement. No files written, shell commands, background processes or telemetry. Adds research guidance to the system prompt. Finite SSE capture; interactive MCP Apps preserved as data, not rendered. Remote MCP behaviour is not covered by the pinned source SHA. Host/model charges are separate."
