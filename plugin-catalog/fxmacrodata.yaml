name: fxmacrodata
repo: https://github.com/fxmacrodata/hermes-fxmacrodata
sha: 5b52feced342f945bb41b3fdb60c668f1f21d374
description: "FXMacroData macro and FX research: official-source economic releases, indicator history, release calendars, policy rates, yield curves, FX, commodities and COT positioning, with source citations. Native tools for 23 REST operations and 49 hosted MCP tools, plus a /fxmacrodata USD brief command. Disclosure: tool calls send their arguments over HTTPS to api.fxmacrodata.com and mcp.fxmacrodata.com only, with FXMACRODATA_API_KEY in a request header when it is set. The key is optional: without it the data catalogue, the USD release calendar and recent USD releases (15-minute delay) work, and other data answers with a subscribe message. No files written, no shell commands, no background processes, no telemetry."
maintainer: fxmacrodata
tier: community
