name: galaxymem
repo: https://github.com/k1ng0mar/galaxymem
sha: 48768998c89a378a564426812de2ae0912f14b35
description: "Entity-scoped memory provider with four epistemic networks (world, experience, opinion, observation), decay, hybrid vector and keyword recall, temporal queries, spreading activation and autonomous reflection, all in one local SQLite file. Exposes 18 gm_* tools and injects bright memories into the prompt. Disclosure: batched extraction, reflection, query expansion and reasoning call the LLM configured for auxiliary.galaxymem through Hermes credentials; the task follows the active model unless overridden. Embeddings run locally with fastembed; first use downloads BAAI/bge-small-en-v1.5 from Hugging Face, about 100 MB. The optional reranker downloads cross-encoder/ms-marco-MiniLM-L-6-v2 from Hugging Face. Data lives in $HERMES_HOME/galaxymem/db or GALAXYMEM_DB_PATH. No telemetry, no self-updater."
maintainer: k1ng0mar
tier: community
category: memory
requires_hermes: ">=0.23.0"
version: "0.2.3"
docs_url: https://github.com/k1ng0mar/galaxymem#readme
capabilities:
  provides_tools:
  - gm_store
  - gm_recall
  - gm_reflect
  - gm_create_entity
  - gm_merge_entity
  - gm_entity_card
  - gm_stats
  - gm_config
  - gm_mental_model
  - gm_reflect_now
  - gm_flush
  - gm_forget
  - gm_update_entity
  - gm_link_identity
  - gm_export
  - gm_session_search
  - gm_reason
  - gm_explain_recall
  provides_hooks:
  - system_prompt_block
  - prefetch
  - queue_prefetch
  - sync_turn
  - on_session_end
  - shutdown
  provides_middleware: []
  requires_env: []
