name: gambit
title: Gambit for Hermes
repo: "https://github.com/itsflownium/gambit-hackathon"
sha: "ba2af085fae9c9baddda86aa519a4ea9109259e7"
description: Play chess in a Hermes terminal or Desktop pane, understand mistakes, and replay or practice public Chess.com and Lichess matches.
maintainer: itsflownium
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.3.0"
readme: true
platforms: [macos]
docs_url: "https://github.com/itsflownium/gambit-hackathon/blob/ba2af085fae9c9baddda86aa519a4ea9109259e7/README.md"
screenshots:
  - "https://raw.githubusercontent.com/itsflownium/gambit-hackathon/ba2af085fae9c9baddda86aa519a4ea9109259e7/docs/terminal-preview.png"
  - "https://raw.githubusercontent.com/itsflownium/gambit-hackathon/ba2af085fae9c9baddda86aa519a4ea9109259e7/docs/import-preview.png"
known_issues:
  - Requires a separately installed local Stockfish executable; it is not bundled or downloaded automatically. Hermes Desktop is optional for the graphical pane.
  - The standalone terminal board requires an interactive terminal with Python curses support and uses a separate Gambit session in the active profile.
  - Hermes skips standalone CLI command registration with plugins.isolation set to host; /chess remains available in a Hermes conversation.
  - Slash shortcuts return direct board or local engine evidence; use ordinary chat or the standalone coaching pane for model explanations.
  - Full-match recap completion is announced through Desktop only. CLI/TUI chat can retrieve the result on a later request; the standalone dashboard has no summary command.
  - Imports completed public standard-chess games only; source publication delays and rate limits may apply. Chess.com Bot and Coach games are unavailable through public username lookup.
  - Uses the configured Hermes provider for moves and coaching; normal provider usage applies, and legal engine fallback is labelled when used.
  - The 60-second deadline covers board replies; separate explanations have their own provider response time.
  - Verified platform scope is macOS only; Linux, Windows and another physical computer have not been verified.
capabilities:
  provides_tools:
    - chess_state
    - chess_start
    - chess_move
    - chess_games
    - chess_replay
    - chess_review
    - chess_hint
    - chess_action
  provides_hooks:
    - pre_llm_call
  provides_middleware: []
  requires_env: []
