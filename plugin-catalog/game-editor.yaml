name: game-editor
repo: https://github.com/TakeshiTGAL/hermes-plugin-game-editor
sha: 03faf61b18e3fa3a6be3e1051c9e9ef9e8ee6612
version: "2.0.0"
requires_hermes: ">=0.21.6"
description: "In the Godot 4 project open in your editor, it places assets into the scene, plays the game, and the next plan fixes each error from its file and line. Disclosure — Needs Godot 4.7 or later, the Godot AI 4.x add-on, and uv. The first start downloads godot-ai==4.3.0 from pypi.org and files.pythonhosted.org. There is no API key. The editor is reached only on 127.0.0.1. A server this plugin starts sends no telemetry. The add-on follows godot_ai/telemetry_enabled (on by default) and can send usage to godot-ai-telemetry-v2-pudmurzsnq-uw.a.run.app. plan_change sends only the session list. apply_plan asks once. A plan that deletes, overwrites, drops unsaved work, writes outside the project or runs code it wrote is not made when what is lost exceeds 1,700 characters, and otherwise runs only after confirm_risky_plan. Play and tests ask once and run the project's code. Tools are on by default on every surface, including the gateway, so anyone who can message Hermes there can ask and approve. This plugin keeps no user list of its own. Cron, hermes chat -q and unattended runs decline. Data stays in <HERMES_HOME>/plugin-data/agent-plugin-game-editor-<id> after removal. Stop with hermes plugins disable game-editor, or hermes tools for one surface. macOS only. This package does not register pre_verify. Only whole words fell, sound, picked, door, timeout_lose or restart are tests, so paint the floor is not. A loop that prints STUDIO and quits 0 is not a pass. The running root must be this package's loop.gd. A child, inherited scene, autoload in project.godot or override.cfg, or other resource this package did not write is unverified script: and the path. Godot is not started for that autoload or a byte-different loop.gd. An embedded extra script starts the inspection process and does not run. The created directory has no override.cfg. Exit 0 needs unchanged check.gd and, for timeout_lose or restart, physics_frames of at least seconds times 60. Godot runs with --fixed-fps 60, so 60 seconds is 3600 frames at time scale 1. The Limit signal is not a pass, and stopping Limit before those frames is not exit 0. restart reads the scene from outside the loop and is true only after those frames, with the key on the floor, door collision back, player at the start with velocity near zero. A file-only row is not a pass. Web stays unserved until a trusted exit 0 is the latest row. After sha256 and sha512 match, the Godot 4.7.2 template from github.com is cached in plugin-data/game-editor/export-templates and served on 127.0.0.1 as index.html and a zip. It does not upload. The person uploads it. An empty gateway allow list leaves the tools on. Movie Maker runs only in a macOS window or the person's xvfb. With no display it is not recorded and no still is saved. Headless write-movie on Godot 4.7.2 exits with signal 11. Scale is the sentence size or 1 meter, pivot bottom center, collision box or convex. One CREDITS line names source, file and license, or unknown."
maintainer: TakeshiTGAL
tier: community
category: tools
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-game-editor
platforms: [macos]
capabilities:
  provides_tools:
    - mcp__game_editor__scene_look
    - mcp__game_editor__script_look
    - mcp__game_editor__file_look
    - mcp__game_editor__project_look
    - mcp__game_editor__change_guide
    - mcp__game_editor__plan_change
    - mcp__game_editor__apply_plan
    - mcp__game_editor__confirm_risky_plan
  provides_hooks: []
  provides_middleware: []
  requires_env: []
