name: game-editor
repo: https://github.com/TakeshiTGAL/hermes-plugin-game-editor
sha: 03faf61b18e3fa3a6be3e1051c9e9ef9e8ee6612
version: "2.0.0"
requires_hermes: ">=0.21.6"
description: "In the Godot 4 project open in your editor, it places assets into the scene, plays the game, and the next plan fixes each error from its file and line. Disclosure — Needs Godot 4.7 or later, the Godot AI 4.x add-on, and uv. The first start downloads godot-ai==4.3.0 from pypi.org and files.pythonhosted.org. There is no API key. The editor is reached only on 127.0.0.1. A server this plugin starts sends no telemetry. The add-on follows godot_ai/telemetry_enabled (on by default) and can send usage to godot-ai-telemetry-v2-pudmurzsnq-uw.a.run.app. plan_change sends only the session list. apply_plan asks once. A plan that deletes, overwrites, drops unsaved work, writes outside the project or runs code it wrote is not made when what is lost exceeds 1,700 characters, and otherwise runs only after confirm_risky_plan. Play and tests ask once and run the project's code. Tools are on by default on every surface, including the gateway, so anyone who can message Hermes there can ask and approve. This plugin keeps no user list of its own. Cron, hermes chat -q and unattended runs decline. Data stays in <HERMES_HOME>/plugin-data/agent-plugin-game-editor-<id> after removal. Stop with hermes plugins disable game-editor, or hermes tools for one surface. macOS only. The studio plan step writes res://studio/ files and, with no editor open, a project under <HERMES_HOME>/plugin-data/game-editor/studio-project, and runs headless Godot on code it wrote; each test, web export and recording needs confirm_risky_plan. studio import_asset copies a .glb, .wav, .ogg or .mp3 file of up to 64 MB from any absolute path the plan names into res://studio/imports/. studio web downloads the 1.3 GB Godot 4.7.2 export template from github.com once, only after its sha256 and sha512 match, keeps it in <HERMES_HOME>/plugin-data/game-editor/export-templates, and serves the Web build on 127.0.0.1 only; it never uploads. Headless studio steps delete files that appear in the project outside studio/ and build/ while Godot runs. The pass ledger stays in <HERMES_HOME>/plugin-data/game-editor after removal."
maintainer: TakeshiTGAL
tier: community
category: tools
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-game-editor
platforms: [macos]
capabilities:
  provides_tools:
    - mcp__game_editor__scene_look
    - mcp__game_editor__script_look
    - mcp__game_editor__file_look
    - mcp__game_editor__project_look
    - mcp__game_editor__change_guide
    - mcp__game_editor__plan_change
    - mcp__game_editor__apply_plan
    - mcp__game_editor__confirm_risky_plan
  provides_hooks: []
  provides_middleware: []
  requires_env: []
