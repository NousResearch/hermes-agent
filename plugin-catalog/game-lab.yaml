version: "0.4.0"
description: "Game Lab combines ModLab, Game Localization Studio, Sprites and experimental Playtest Pilot. ModLab works on a private game copy and invokes separately installed tools; localization drafts and exports RPG Maker MV/MZ text and the text of Unity Mono builds (JSON text assets, script-component strings and Assembly-CSharp string literals; patched copies of changed files only, the game folder is never written); Sprites inspects and previews character sheets. Playtest Pilot uses approved X11 input, captures screen pixels within the selected window, stores private evidence frames and returns reduced previews and optional local OCR hints; for a failed check it can build a short captioned MP4 from those frames with your FFmpeg, or cut one from a recording file you point to (that asks for approval). On first use ModLab reads Steam's library list and app manifests to find installed games, lists the files in the chosen game folder, runs read-only hardware checks, and asks which modding route to use. It never fills a disk: a free-space reserve, a total cap, pruning of old revisions and a confirm-first cleanup tool. The Universal Modder and REA programs are the ones you set in the plugin settings or find on PATH (the model cannot name a program), and each toolkit call and each playtest check asks for your approval. Every program it starts gets a minimal environment, never your provider keys. The plugin makes no network calls of its own. Disclosure — Playtest Pilot sends synthetic key presses and clicks to the X11 window you select (via xdotool and Hermes computer_use, each check or batch approved), captures that window's pixels and stores evidence frames in the plugin's data folder; ModLab reads your Steam library and app-manifest files to list installed games, copies the game folder you choose into plugin data (with a disk cap), Game Localization Studio reads the RPG Maker data file or Unity game folder you point it at and copies the files that hold text into plugin data, writes a JSONL units file into the draft folder, and reads translations back from the JSONL file path named in the tool call (absolute path; symlinks, credential folders and the Hermes home are refused); and, after your approval of each call, runs the Universal Modder / REA programs set in the plugin settings or found on PATH."
