name: game-lab
title: Game Lab
repo: https://github.com/flabanabba8/game-lab
sha: 889b60d8e4f7c4701e0cf7fdcb6ed297d2982ce2
version: 0.2.1
description: Game Lab combines ModLab, Game Localization Studio, Sprites and experimental
  Playtest Pilot. ModLab works on a private game copy and invokes separately installed
  tools; localization drafts and exports RPG Maker text; Sprites inspects and previews
  character sheets. Playtest Pilot uses approved X11 input, captures screen pixels
  within the selected window, stores private evidence frames and returns reduced previews
  and optional local OCR hints. The plugin makes no network calls of its own.
maintainer: flabanabba8
tier: community
category: tools
requires_hermes: '>=0.22.0'
