name: garmin-connect
title: "Garmin Connect (unofficial)"
repo: https://github.com/adrianlaborda/hermes-garmin
sha: "1077ef6c02547cee8ed3ef90e5ae304979fd6cf2"
version: "0.1.0"
description: "Unofficial community plugin for Garmin Connect data through Garmin's official Personal API: sleep, HRV, Body Battery, stress, steps, heart rate, activities, weight, heart-rate training load and fitness age, with deterministic baselines and trend flags (garmin_trends), a /garmin command, an optional one-line daily context, a morning readiness brief automation and a Hermes Desktop readiness panel. Fourteen read-only tools. The key is entered in Hermes Desktop under Settings > Plugins > garmin-connect (or with hermes config set), stored in the profile's .env as GARMIN_PERSONAL_API_KEY and read through Hermes's secret route. Disclosure: health data is fetched only from personal.connectapi.garmin.com (personal.connectapi.garmin.cn for region china), the only network host the plugin contacts, with GET requests plus one POST that exchanges the key for a short-lived token. No telemetry, no analytics, no self-update. Tool results go to the model provider you chose. Background threads: garmin-zone reads the Garmin profile's time zone when timezone is auto (at most once per 12 hours; a tool call waits at most 2 seconds for it), and garmin-context, which runs only with inject_daily_context on (off by default) and adds a one-line health summary to new chats: the turn waits at most 3 seconds, and the thread ends within about 30 seconds (15-second HTTP timeout, no retries). garmin_activity_fit saves original activity files under the profile's plugin-data folder. Not affiliated with Garmin; not medical advice."
maintainer: adrianlaborda
tier: community
category: tools
docs_url: https://github.com/adrianlaborda/hermes-garmin#readme
requires_hermes: ">=0.22.2"
