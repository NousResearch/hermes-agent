sha: "f9959e4b1006ced16d1c6d6647dabe7c99f5aeb1"
description: "Telegram/gateway reliability guard for Hermes — detects 409 polling conflicts, duplicate pollers, freezes, stale locks and missed deliveries, shows one health state (OK/DEGRADED/BLOCKED) and an approved recovery plan. Disclosure — read-only status by default; recovery never restarts, kills or rebinds anything by itself; no message bodies are stored, only pattern counts and recovery intents; no network calls, no credentials, no telemetry."
maintainer: kawsthingz
tier: community
category: tools
version: "1.0.0"
platforms: [linux, macos]
