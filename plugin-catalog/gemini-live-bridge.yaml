description: 'Realtime duplex voice chat with the Gemini Live API — a status-bar minibar
  for the Hermes desktop app (transcript, model catalog, thinking level, session token
  meter, auto-redial via session resumption). Full-proxy architecture: the plugin backend
  owns the upstream Live WebSocket and the user''s key (requires_env GOOGLE_API_KEY);
  the desktop UI only talks to localhost and receives single-use ephemeral tokens.
  No agent tools; desktop-focused, dashboard tab hidden.'
