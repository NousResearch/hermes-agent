sha: b8169912d618d462a46f88d9a692570b51de519c
description: >-
  Full-duplex Gemini Live voice calls in Hermes Desktop and the web dashboard. The voice takes the
  profile's name and hands real work to your Hermes agent while you keep talking. It can steer
  running jobs, threads, bot chats and subagents, use the profile's MCP tools, recall memory and
  past conversations, and report back when work finishes. Read-only local commands need three
  layers to agree: hard rules, a safety review and a contained run. Secret files are refused on
  every route. When a job needs approval, the voice says so and Approve and Deny buttons appear;
  the voice model can never answer one, and spoken approval is opt-in. Disclosure — pressing Start captures microphone audio and streams it from the
  client to generativelanguage.googleapis.com on a single-use ephemeral token; the Gemini key stays
  on the Hermes backend, read through Hermes' secret scope. Gemini also receives the voice's
  instructions, tool results, and, unless share_chat_context is off, the open chat's title and
  recent messages. On Gemini's free tier, Google may use this content to improve its products.
  Delegated work runs as a normal Hermes turn with that profile's tools and approvals. The opt-in
  readonly_shell and system_checks settings, both off by default, run bounded commands on the
  Hermes host. No telemetry and no background processes.
