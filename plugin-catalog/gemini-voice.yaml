platforms: []
known_issues:
  - "Requires in-process plugin execution: gateway platform adapters are refused under plugins.isolation: host."
  - "Polling, not push: a task starts up to poll_seconds (60 s) after Gemini creates the object, and Gemini does not announce the reply; you ask for it."
  - "Gemini app behaviour: one task is one new object said in one sentence, with the content named explicitly (\"... and put the text in it: ...\"); otherwise Gemini may answer the request itself and save only the title."
  - "The label word must survive speech recognition: choose one the Gemini app spells reliably (the default Hermes does); a rare name can be written as other words and the object is then not a task."
  - "Approval prompts cannot be answered by voice: such a command waits approvals.timeout and is refused; repeat it in a messaging app."
capabilities:
  provides_tools: []
  provides_hooks: [pre_tool_call]
  provides_middleware: []
  requires_env: [GEMINI_VOICE_CLIENT_ID, GEMINI_VOICE_CLIENT_SECRET, GEMINI_VOICE_REFRESH_TOKEN]
