known_issues:
  - "Hermes v0.23.1 requires the native mcp_servers OAuth entry in config.example.yaml alongside the portable plugin; the package alone does not complete sign-in."
  - "Connection, discovery and saved-profile/project reads were verified in Hermes. Creative/business execution, cancellation/recovery and monetization are separate workflow qualification; no talent hiring, payments, payouts or earnings operation is promised."
