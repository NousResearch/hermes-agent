name: genui
repo: https://github.com/agenticatech/genui-hermes-hackathon
sha: 9465bec650ec4ad78e517575822858e5c133033b
subdir: plugin
title: GenUI
description: "Live cards for Hermes Desktop: the agent shows a long task as a pre-designed card (a pull request, a release, a slow machine, files to clean up, a study session), updates it in place after every tool result, and asks for a decision with a button only when one is needed; the click (and what you ticked or answered in the card) goes back to the agent as one turn. Disclosure — no network calls, no telemetry, no credentials; writes one small JSON file per shown card in the plugin's data directory, removed after 30 days untouched; adds a short turn hint to Hermes Desktop turns only; cards run in a sandboxed frame, a click on a decision posts one visible message from the user, and a click on an http(s) link in a card (link targets come from the agent) opens it in the user's browser."
maintainer: agenticatech
tier: community
category: desktop
requires_hermes: ">=0.22.5"
version: "0.2.1"
