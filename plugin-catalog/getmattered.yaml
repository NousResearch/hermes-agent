description: "Find matched jobs and apply on the employer's own hiring system, with a resume tailored to each role. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted connector with no local runtime code, binaries, hooks, environment variables, telemetry or self-updater; every tool call goes over HTTPS to the GetMattered MCP server (Streamable HTTP at https://mcp.getmattered.com/mcp), which needs a GetMattered account signed in through the server's OAuth flow. Apply tools send the user's resume and application answers to the employer's hiring system, either automatically or after the user approves each one in a review queue. The package marks the server untrusted (trust: untrusted), so Hermes asks before any tool not annotated read-only and refuses them in unattended runs. The remote tool inventory is served at runtime and is not covered by the pinned sha."
