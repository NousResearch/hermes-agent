sha: bb0001012c5b213ce5a09b5905d859635c440c17
subdir: gh-ref
description: >-
  @gh:owner/repo#123 context references: attach a public GitHub issue or pull request to a
  message (title, state, labels, description, the latest comments; for pull requests also the
  branches, merge state and change size). Disclosure — sends anonymous HTTPS GET requests to
  api.github.com only (the referenced owner/repo and number leave the machine; no token, public
  repositories only, 60 requests an hour per IP address); no files written, no subprocess;
  register() only adds the @gh: reference provider.
