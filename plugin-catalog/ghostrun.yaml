name: ghostrun
repo: https://github.com/kdcyberdude/ghostrun
sha: f60fd815175ddc75ff9ff06f290c57b11ecd857b
title: GhostRun
description: "Recreate NES games as editable browser games. Train an AI player, rebuild levels and gameplay in Three.js, and add optional 3D visuals. Disclosure — Downloads and compiles pinned NeSLE source; runs local build and training commands; reads your ROM and project folders; starts training, a reference service and a watcher that can prompt reward edits and training restarts (up to 3 fixes per game). No credentials or telemetry."
maintainer: kdcyberdude
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/kdcyberdude/ghostrun#readme
version: "0.3.0"
platforms: [linux]
known_issues:
  - Training needs Linux and an NVIDIA GPU with CUDA (nvcc, a C++20 compiler and PyTorch in the configured Python).
  - You supply the ROM; none is included.
capabilities:
  provides_tools:
    - ghostrun_init
    - ghostrun_policy_check
    - ghostrun_recreation_check
    - ghostrun_reward_check
    - ghostrun_reward_audit
    - ghostrun_reward_lint
    - ghostrun_reward_balance
    - ghostrun_reward_search
    - ghostrun_engine_setup
    - ghostrun_engine_parity
    - ghostrun_train_start
    - ghostrun_train_stop
    - ghostrun_train_check
    - ghostrun_fix_begin
    - ghostrun_fix_validate
    - ghostrun_fix_apply
    - ghostrun_fix_review
    - ghostrun_assets_import
    - ghostrun_status
    - ghostrun_stage_set
    - ghostrun_isolation_check
    - ghostrun_compare
    - ghostrun_gate
    - ghostrun_reference_enter
    - ghostrun_builder_enter
    - ghostrun_oracle_start
    - ghostrun_oracle_stop
    - ghostrun_oracle_call
    - ghostrun_watch_start
    - ghostrun_watch_stop
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
