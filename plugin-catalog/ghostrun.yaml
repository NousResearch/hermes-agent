name: ghostrun
repo: https://github.com/kdcyberdude/ghostrun
sha: 74b312e62d1965c80c663216f004415f3940a752
title: GhostRun
description: "Recreate NES games as browser games you can play and change. GhostRun helps an agent learn the game, rebuild its levels and mechanics, check the result, and create a 3D version. Disclosure — `ghostrun_engine_setup` clones https://github.com/hbofz/NeSLE.git at pinned commit 0b04d8b9 and compiles it locally with nvcc/c++; runs git, nvcc, c++, nvidia-smi and the configured Python; starts long-running background processes only on explicit tool calls (GPU training, oracle service, watcher thread that can wake the agent to edit that game's reward reader and restart its training, max 3 fixes per game); reads the ROM path you give it and the configured builder folder; a pre_tool_call hook blocks builder sessions from reaching the reference game. No credentials, no telemetry, no bundled binaries."
maintainer: kdcyberdude
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/kdcyberdude/ghostrun#readme
version: "0.2.7"
platforms: [linux]
known_issues:
  - Training needs Linux and an NVIDIA GPU with CUDA (nvcc, a C++20 compiler and PyTorch in the configured Python).
  - You supply the ROM; none is included.
capabilities:
  provides_tools:
    - ghostrun_init
    - ghostrun_policy_check
    - ghostrun_recreation_check
    - ghostrun_reward_check
    - ghostrun_reward_audit
    - ghostrun_reward_lint
    - ghostrun_reward_balance
    - ghostrun_reward_search
    - ghostrun_engine_setup
    - ghostrun_engine_parity
    - ghostrun_train_start
    - ghostrun_train_stop
    - ghostrun_train_check
    - ghostrun_fix_begin
    - ghostrun_fix_validate
    - ghostrun_fix_apply
    - ghostrun_fix_review
    - ghostrun_assets_import
    - ghostrun_status
    - ghostrun_stage_set
    - ghostrun_isolation_check
    - ghostrun_compare
    - ghostrun_gate
    - ghostrun_reference_enter
    - ghostrun_builder_enter
    - ghostrun_oracle_start
    - ghostrun_oracle_stop
    - ghostrun_oracle_call
    - ghostrun_watch_start
    - ghostrun_watch_stop
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
