known_issues:
  - "Restart Hermes once after installing: the card's backend routes mount at startup."
  - "The card needs a Hermes Desktop with tool-media renderers; older Desktops and other surfaces show the plain GIF."
  - "gif_create needs an OpenAI Codex sign-in in Hermes and uses an undocumented Codex image endpoint that can change without notice; every other feature works without it."
  - "Not yet exercised inside a running Hermes Desktop by the author: the card and backend were tested headlessly against the real plugin code with a stand-in for the plugin SDK."
capabilities:
  provides_tools: [gif_open, gif_edit, gif_export, gif_create]
  provides_hooks: []
  provides_middleware: []
  requires_env: []
