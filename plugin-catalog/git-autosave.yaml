name: git-autosave
title: Git Autosave
repo: https://github.com/xiaoyaner0201/hermes-git-autosave
sha: b4b12d6bf79318c6708ab468327d52e7671d63f9
description: "Lightweight local alternative to directory checkpoints for Git projects. Before a mutating tool call it saves the affected repository's working state to a private local shadow ref (refs/hermes-autosave/<branch>, with reflog) through a private index, or copies the single existing file outside Git; `hermes autosave find` and `restore` recover a pre-edit version. Disclosure — runs local git subprocesses in repositories the agent touches (hooks, clean filters, fsmonitor and lazy fetch disabled); writes shadow refs/reflogs into those repositories' .git and unencrypted file copies into its plugin-data directory; never changes HEAD, branches, the real index or the working tree and never pushes; skips credential stores (.env, auth.json, .ssh, .aws, .docker, .kube, gh/gcloud/azure configs) and dependency directories; `hermes autosave sweep` reads the session database read-only and is scheduled by the user; no network, no background processes; it observes only and never blocks or approves a tool call."
maintainer: xiaoyaner0201
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://github.com/xiaoyaner0201/hermes-git-autosave#readme
version: "0.3.0"
readme: true
platforms: [linux, macos]
known_issues:
  - "One V4A patch that moves a symlink and then updates the moved path can miss the edited file on case-insensitive or Unicode-normalizing filesystems; commit first or send the Move and the Update as separate calls."
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
