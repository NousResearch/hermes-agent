# Catalog entry for NousResearch/hermes-agent: plugin-catalog/git-review.yaml
# Pinned to the merge commit of v0.2.1 (release published 2026-10-25). Bump sha and version together.
name: git-review
repo: https://github.com/mister-ideas/git-review
sha: 852cf479d587b6423c5fedbd170ebe184a882cf6
title: Git Review
description: "Git review pane for Hermes Desktop: every changed file in one continuous scroll, unified or split, with stage, unstage and discard per file or in bulk, a commit box (commit, commit and push, Cmd-Enter), push, create pull request, a branch scope since the default branch, syntax colours, and line citations into the composer as @line: references. The last-agent-turn, branch and commits scopes stay read-only. Writes run only when you press a button: the backend runs git add, reset, restore, rm --cached, commit and push inside authorized repositories, and Create pull request uses your own gh or glab CLI. Repository programs (hooks, filter drivers, signing, SSH) are off by default: commits skip hooks and such writes are refused unless run_repo_programs is on, and the read_only setting hides and refuses every write. Reads use git rev-parse, status, diff, log, show, cat-file, ls-files, for-each-ref, branch, remote, rev-list and hash-object with timeouts and output caps and external diff and textconv disabled, limited to authorized repositories (focused workspace, configured repos and roots, latest agent selection), this profile's config.yaml, and the cwd column of the sessions table in state.db. It writes only $HERMES_HOME/plugin-data/git-review/select.sqlite3 (agent selection requests) and Desktop plugin storage (display settings, turn baselines), never into a repository, and polls the local backend every 3 s (agent selections) and 5 s (live diffs) while the pane is open; no background processes, credentials or telemetry."
maintainer: mister-ideas
tier: community
category: desktop
requires_hermes: ">=0.21.6"
version: "0.2.1"
