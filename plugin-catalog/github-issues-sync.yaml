name: github-issues-sync
repo: https://github.com/dbrosnan/hermes-github-issues-sync
sha: 8a126f082af67b8a701da459b97840484af8768c
description: "Mirror GitHub issues onto Hermes kanban boards, one board per repository and one card per issue, and report claims, handoffs and blocks back on the issue. Pull-based and label-gated. In the default ready-only mode only open issues a human labelled agent-ready, with no open blocker, become work cards (created through hermes kanban create with an idempotency key, a worktree of the repo checkout, branch issue-<n>, a runtime cap and a completion contract), each assigned to the Hermes profile the issue's lane label maps to in the lanes setting (a lane may list several profiles; the one with the fewest open cards takes the card), or to the configured assignee; an issue with two lane labels is skipped and reported. The tasks mode also mirrors every other open issue as a placeholder card on a non-profile assignee (github by default) so the dispatcher never spawns it; the full mode adds one card per epic that waits on its sub-issue cards. Label changes replace, block or unblock cards, a closed issue archives its card, new sub-issues are linked to the epic card. The merged PR's Fixes #n closes the issue; the plugin never closes one. Syncs after dispatcher ticks (throttled), from /gh-sync in a session, or from hermes github-issues-sync sync in a terminal. Every setting is declared for the Desktop settings panel. Disclosure — runs gh and hermes as subprocesses from PATH (no shell): gh reads open issues (labels, blocked-by links, parent) and an issue's state, labels and comments, and writes labels and comments on issues of the configured repositories only; hermes kanban lists boards, creates a board named after each configured repository when board_per_repo is on (with the checkout as its default workdir), and lists, shows, creates, comments on, archives, blocks, unblocks and links cards. The issue body is copied verbatim into the card body with the issue URL, repository, workspace path and a kind marker. Posted on the issue: the Hermes profile name (the lane's or the default), card id and run number, the handoff summary and block reason (clipped to 2000 characters by default) and the PR URL, each comment carrying a hidden marker so an event is posted once. gh runs with the assignee profile's own GH_TOKEN or GH_CONFIG_DIR, read through agent.secret_scope, when the profile has one; otherwise the launch process's gh variables are dropped and gh uses its own stored login (require_profile_login: true points gh at an empty config directory under the profile home instead, so it fails unless the profile has its own login). One background thread for claim posts and tick-triggered syncs. Stores the last sync summary in plugin state. No network other than gh's, no telemetry, no self-update."
maintainer: dbrosnan
tier: community
category: automation
requires_hermes: ">=0.22.5"
docs_url: https://github.com/dbrosnan/hermes-github-issues-sync#readme
version: "0.3.1"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - kanban_task_claimed
    - kanban_task_completed
