name: github-issues-sync
repo: https://github.com/dbrosnan/hermes-github-issues-sync
sha: 561297d0ea2ccbab048a2a9c9981faf7ef1ac4e1
description: "Mirror agent-ready GitHub issues onto the Hermes kanban board, one card per issue, and report claims, handoffs and blocks back on the issue. Pull-based and label-gated: only open issues a human labelled agent-ready, with no open blocker, become cards (created through hermes kanban create with an idempotency key, a worktree of the repo checkout, branch issue-<n>, a runtime cap and a completion contract). The merged PR's Fixes #n closes the issue; the plugin never closes one. Syncs after dispatcher ticks (throttled), from /gh-sync in a session, or from hermes github-issues-sync sync in a terminal. Disclosure — runs gh and hermes as subprocesses from PATH (no shell): gh reads open issues with the ready label and an issue's state, labels and comments, and writes labels and comments on issues of the configured repositories only; hermes kanban lists, shows, creates and comments on cards. The issue body is copied verbatim into the card body with the issue URL, repository and workspace path. Posted on the issue: the Hermes profile name, card id and run number, the handoff summary and block reason (clipped to 2000 characters by default) and the PR URL, each comment carrying a hidden marker so an event is posted once. gh runs with the assignee profile's own GH_TOKEN or GH_CONFIG_DIR, read through agent.secret_scope, when the profile has one; otherwise the launch process's gh variables are dropped and gh uses its own stored login (require_profile_login: true fails closed instead). One background thread for claim posts and tick-triggered syncs. Stores the last sync summary in plugin state. No network other than gh's, no telemetry, no self-update."
maintainer: dbrosnan
tier: community
category: automation
requires_hermes: ">=0.22.5"
docs_url: https://github.com/dbrosnan/hermes-github-issues-sync#readme
version: "0.1.1"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - kanban_task_claimed
    - kanban_task_completed
    - kanban_task_blocked
    - on_kanban_dispatch_tick
  provides_middleware: []
  requires_env: []
