name: github-issues-sync
repo: https://github.com/dbrosnan/hermes-github-issues-sync
sha: d8d25093ff1654bbf73a23f9f55f25ec6c115db2
description: "Mirror agent-ready GitHub issues onto the Hermes kanban board, one card per issue, and report claims, handoffs and blocks back on the issue. Pull-based and label-gated: only open issues a human labelled agent-ready, with no open blocker, become cards (created through hermes kanban create with an idempotency key, a worktree of the repo checkout, branch issue-<n>, a runtime cap and a completion contract), each assigned to the Hermes profile the issue's lane label maps to in the lanes setting, or to the configured assignee; an issue with two lane labels is skipped and reported. The merged PR's Fixes #n closes the issue; the plugin never closes one. Syncs after dispatcher ticks (throttled), from /gh-sync in a session, or from hermes github-issues-sync sync in a terminal. Disclosure — runs gh and hermes as subprocesses from PATH (no shell): gh reads open issues with the ready label and an issue's state, labels and comments, and writes labels and comments on issues of the configured repositories only; hermes kanban lists, shows, creates and comments on cards. The issue body is copied verbatim into the card body with the issue URL, repository and workspace path. Posted on the issue: the Hermes profile name (the lane's or the default), card id and run number, the handoff summary and block reason (clipped to 2000 characters by default) and the PR URL, each comment carrying a hidden marker so an event is posted once. gh runs with the assignee profile's own GH_TOKEN or GH_CONFIG_DIR, read through agent.secret_scope, when the profile has one; otherwise the launch process's gh variables are dropped and gh uses its own stored login (require_profile_login: true points gh at an empty config directory under the profile home instead, so it fails unless the profile has its own login). One background thread for claim posts and tick-triggered syncs. Stores the last sync summary in plugin state. No network other than gh's, no telemetry, no self-update."
maintainer: dbrosnan
tier: community
category: automation
requires_hermes: ">=0.22.5"
docs_url: https://github.com/dbrosnan/hermes-github-issues-sync#readme
version: "0.2.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - kanban_task_claimed
    - kanban_task_completed
    - kanban_task_blocked
    - on_kanban_dispatch_tick
  provides_middleware: []
  requires_env: []
