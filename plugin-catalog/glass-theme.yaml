name: glass-theme
title: Glass Theme
repo: https://github.com/mykeura/glass-theme-for-hermes
sha: c55c64af8c8742e12b55d384b5bd4a4674137fc8
description: "Translucent glass surfaces for Hermes Desktop in light and dark, teal accent, with terminal colors that match. Disclosure — theme-only plugin: it registers one theme through the Desktop plugin SDK and injects no CSS, no DOM access and no stylesheet of its own; the palette ships light and dark sets and the desktop terminal pane takes its colours from them. The package also ships two optional CLI/TUI skins (glass-light, glass-dark) as plain YAML files the user copies into ~/.hermes/skins, plus an inert __init__.py whose register() does nothing so the Agent loader imports the package cleanly instead of reporting a missing module. No network requests, no agent tools, no hooks, no background processes, no settings page."
