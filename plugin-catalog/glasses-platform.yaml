known_issues:
  - "Preview: proven against the bundled simulators and a real Hermes gateway with real models (the G2 app in the official Even Hub simulator, Pebble with a Bobby-protocol client); not yet tested on real glasses, watches, voice boxes or an Omi pendant, or with the iOS app on a device."
  - "Each device needs a companion app or firmware that speaks one of its protocols: the community hermes-glasses iOS app in bridge mode, the bundled G2 app, xiaozhi firmware, an Omi app webhook or the Bobby app."
  - "Without a terminal, install with --yes-deps (it needs aiohttp and qrcode); otherwise the plugin installs but stays disabled."
capabilities:
  provides_tools: [glasses_capture_photo, glasses_show_text, glasses_buzz]
