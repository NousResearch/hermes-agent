name: glasses-platform
repo: https://github.com/100yenadmin/glasses-platform
sha: 1e2b2a95bcff75aad454316ff60fdc449a654c5f
title: Glasses Platform
description: "Your own Hermes agent on your smart glasses: it sees what you see, answers by voice, and taps you on the lens when something is due. A gateway platform that adds glasses as a channel over one WebSocket, with short spoken-style replies to the device that asked, camera photos (requested when you ask what you are looking at, or taken by the agent with its glasses_capture_photo tool), streamed replies for heads-up displays, approval and clarify prompts on every device, and cron and heartbeat pushes to all of a user's devices, queued in memory while they are offline. Speaks the bridge protocol of the community hermes-glasses iOS app (v0) and a richer v1; a simulator is included. Disclosure — opens a WebSocket listener on all interfaces (port 8765, /voice) that refuses to start without a device token; each device token gets full agent chat as its user, including answering approval prompts and clarify questions; photos are saved in Hermes's image cache; the device's new-session button answers Hermes's /new confirmation for that user; no outbound network calls, shell commands or telemetry."
maintainer: 100yenadmin
tier: community
category: platform
requires_hermes: ">=0.22.2"
docs_url: https://github.com/100yenadmin/glasses-platform#readme
version: "0.1.1"
image: https://raw.githubusercontent.com/100yenadmin/glasses-platform/ae428e4dc6bedb44c6abb65fec0cdc64326d5420/docs/media/banner.png
platforms: []
known_issues:
  - "Preview: proven against the bundled simulator and a real Hermes gateway with real models; not yet tested on real glasses or with the iOS app on a device."
  - "Needs a companion app that speaks its WebSocket protocol, such as the community hermes-glasses iOS app in bridge mode."
capabilities:
