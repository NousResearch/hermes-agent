title: Hermes Glasses
description: "Your own Hermes agent on your smart glasses and other devices: it sees what you see, answers by voice, and taps you on the lens when something is due. A gateway platform that adds glasses as a channel, with short spoken-style replies to the device that asked, camera photos (requested when you ask what you are looking at, or taken by the agent with its glasses_capture_photo tool), voice in and out through Hermes's own speech settings, streamed replies for heads-up displays, approval and clarify prompts on every device (approval cards with buttons, or a spoken yes or no), and cron and heartbeat pushes to all of a user's devices, kept for offline devices across gateway restarts. Also connects Even Realities G2 glasses (an Even Hub app you pack yourself), ESP32 voice boxes running the open-source xiaozhi firmware, the Omi pendant (real-time transcript webhook) and Pebble watches (the open-source Bobby app); devices that cannot keep a socket open (an Apple Watch through a Siri Shortcut, scripts) use an HTTP route. Pair a device with `hermes glasses pair` (QR code) or try it from the terminal with `hermes glasses try`. Speaks the bridge protocol of the community hermes-glasses iOS app (v0) and a richer v1; a simulator, JavaScript and Python clients and a conformance kit are included. Disclosure — opens an unencrypted listener on all interfaces (port 8765: WebSocket /voice, /xiaozhi and /bobby/<token>/query; HTTP /turn, /pending, /approval, /xiaozhi/ota/<token>, /omi/<token>/transcript and /bobby/<token>/quota) that refuses to start without a device token (use Tailscale or a TLS proxy off your home network; Omi's servers must reach the webhook over the internet); each device token, sent in a header, query or URL path, gets full agent chat as its user, bypassing the gateway allowlist, including answering approval prompts and clarify questions; `hermes glasses pair` writes device tokens to the profile .env, and the xiaozhi OTA reply gives the box its WebSocket address with its own token; with Omi, transcripts come from Omi's servers and answers go back through them; the agent can take a glasses camera photo at any time during a glasses conversation and photos are also captured automatically on visual keywords (auto_capture: off disables that), saved in Hermes's image cache; recordings and spoken replies use Hermes's own stt/tts settings, so a cloud speech provider receives the audio or text; pushes for offline devices are kept in $HERMES_HOME/glasses/outbox.json (owner-only); Omi transcript segments are held in memory until the session has been idle for ten minutes (the newest 256 per session); the device's new-session button answers Hermes's /new confirmation for that user; it runs a local ffmpeg (no shell) only to convert audio; no outbound network calls of its own and no telemetry."
