description: 'lei_lookup, lei_parents, lei_children, lei_search, and lei_isin return LEI records, ISINs, or name candidates. A parent is an official record, a reporting exception, or an explicit miss. Disclosure — sends the LEI, legal name, or ISIN you type to api.gleif.org (GLEIF) over HTTPS with no key, and does not follow redirects or use an HTTP proxy; tools stay on for every surface, including an empty gateway allowlist; the opt-in 08:00 job spends 0 tokens and does not fire until a scheduler serves this profile; local delivery keeps a line under cron/output and empty stdout sends nothing; removal leaves the cron job, scripts/gleif-watch.py, and plugin-data/gleif/watch.json; no GLEIF logo.'
maintainer: TakeshiTGAL
