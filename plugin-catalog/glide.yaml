name: glide
title: Glide
repo: https://github.com/kvnloo/glide
sha: 4bc0b5fb53f0d49541a72a535f3abb508c1f221e
description: "Kevin Rajan's Hermes frontend for Tern, built on alt-glitch/hermes-tern (MIT) and carrying about 890 commits of its own. One install gives `hermes tern`, which draws the chat as native Tern UI, plus `/glide`, a guided setup that makes Hermes learn from you and run more of its work locally. Added over the original: charts from Markdown tables, OpenUI and ephemeral-ui answer cards, 3D artifacts beside the chat, written artifacts and session links, Tern browser blocks, image delivery across hosts, LSP diagnostics cards, plan review with a todo HUD, native /btw side questions and read-only MCP/SSH report sheets, live wait tiles for subagents, fork-a-session panes, /rewind, /undo and /tree, native /settings and a /models provider hub, a Vim composer, a command palette and shortcut preferences, queue-or-steer busy input, opt-in live voice with helper lanes beside the thinking orb (role, model and real state from a local lane broker), a work dock, a thinking-orbs indicator, frontend channels (`hermes tern --channel`), and tool cards that report refusals, truncation and partial failures instead of hiding them. Glide guards two scarce resources: your attention and the agent's context window. `/glide focus` shows your current phase, next deep-work window and usual stop time, learned from your own local session timestamps (or from z0intelligence's `circadian` and a loopback Flowkit flow estimate when installed); a deep-work block holds non-critical agent notifications and approval asks for one digest at the end while critical ones still pass, and one wind-down card saves a resume note for the next session. `/glide` (also `hermes glide onboard`) is a chain of approve cards: detect the machine and local runtimes (and z0intelligence if installed); build a corrections memory from your past local sessions (your messages that start \"no,\", \"actually,\" or \"correction:\") and quote up to three matching corrections into each new turn through a pre_llm_call hook, using deterministic BM25 with no embeddings or model calls; a skill router catalog; a measured CPU hill climb whose referee says KEEP, REVERT or INCONCLUSIVE; offload of small tasks to an installed Ollama model with estimated savings; and an optional Taste board pane beside the chat. Disclosure — network: GitHub's API with the optional GITHUB_TOKEN for the pull request view; the user's own auxiliary model for live process charts; /glide taste talks only to a loopback Taste Atlas server (127.0.0.1:8789 by default); /glide focus reads only a loopback Flowkit server (127.0.0.1:8787 by default) if one answers; live-voice helper lanes poll only a loopback lane broker (127.0.0.1:8791 by default) and stay off without its local token file; no telemetry. Commands: runs the `tern` CLI to open files and splits; /glide runs `nvidia-smi`, `ollama list`/`ollama run` and, if installed, `z0int doctor --json` and `circadian show --json`, each only on an approved step and with a timeout; the hill climb runs a local CPU benchmark; nothing is installed or downloaded. Reads outside its data: the profile's Hermes session database, read-only (local sessions only; cron, delegated and hidden sessions skipped), and the session's background-process output. Writes only under the profile (`<profile>/glide/`). No background processes of its own. Install this or hermes-tern, not both: both register `hermes tern`."
maintainer: kvnloo
