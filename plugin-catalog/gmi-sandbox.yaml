description: "GMI Cloud Sandbox terminal backend: Hermes's terminal, file and code tools run inside an ephemeral cloud sandbox created from a ready template you provide (`hermes config set terminal.backend gmi_sandbox`). Commands are polled to completion and cancelled on interrupt; truncated output is reported as a failure. Disclosure — sends commands, file paths and file contents, plus your GMI_SANDBOX_API_KEY (read per request through Hermes secret scope), to console.gmicloud.ai and the sandbox data plane; every running sandbox spends GMI credits with no Hermes approval prompt (GMI bills compute and storage). The plugin creates and deletes its own sandboxes; it never attaches to pre-existing sandboxes. Snapshots, interactive streaming and browser/desktop forwarding are not implemented. Depends on the declared gmi-sandbox-sdk Python package; no telemetry, host shell commands, background processes or self-updates."
maintainer: avinxshKD
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/avinxshKD/hermes-gmi-sandbox/tree/593d6425e7d0e4d966b7dd96b16f738534e42d6f#readme
version: "0.1.0"
readme: true
platforms: []
known_issues:
  - "Live sandbox execution, file operations and cleanup have not been verified against GMI; this entry is pinned after offline tests only."
  - "The template must provide bash, python3 and any development tools your tasks need; Hermes's generic resource knobs do not resize the sandbox."
  - "Persistent container mode and per-task image overrides are refused."
  - "Command stdout and stderr are concatenated after completion, so their interleaving is not preserved."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - GMI_SANDBOX_API_KEY
