tier: community
category: tools
requires_hermes: ">=0.21.5"
version: "0.1.0"
capabilities:
  provides_tools: [verify_claim, evaluate_difference, qualify_conclusion]
  provides_hooks: [post_tool_call, transform_llm_output]
  provides_middleware: []
  requires_env: []
