name: go-whatsapp
repo: https://github.com/anpicasso/hermes-go-whatsapp
sha: 5932ef65020f95923722eda54d0ed15925a8ed17
version: "0.5.0"
requires_hermes: ">=0.23.1"
title: Go WhatsApp
description: >-
  Outbound WhatsApp tools through GOWA: registers GOWA's native MCP server and
  adds device listing, pairing, and removal. Setup can connect an existing
  server or explicitly install pinned GOWA v9.9.0 as a loopback-only
  authenticated native user service on Linux x86_64, macOS x86_64/arm64, or
  Windows x86_64; credentials are read from the active Hermes profile. Disclosure
  — agents can send messages and mutate WhatsApp state through the linked
  account; session databases grant account access. The plugin does not ingest
  incoming messages or configure webhooks.
maintainer: anpicasso
tier: community
category: tools
docs_url: https://github.com/anpicasso/hermes-go-whatsapp/blob/5932ef65020f95923722eda54d0ed15925a8ed17/README.md
image: https://raw.githubusercontent.com/anpicasso/hermes-go-whatsapp/5932ef65020f95923722eda54d0ed15925a8ed17/docs/banner.png
platforms:
  - linux
  - macos
  - windows
capabilities:
  provides_tools:
    - gowa_devices
    - gowa_device_login
    - gowa_device_remove
  provides_hooks: []
  provides_middleware: []
  requires_env: []
