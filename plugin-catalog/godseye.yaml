name: godseye
title: God's Eye View
repo: https://github.com/mojomast/hermes-godseye
sha: b9b184701e6bfa00128ff037138073a99f3c5f36
description: >-
  God's Eye View (bilawalsidhu/gods-eye-view, MIT) inside Hermes: 29 godseye_* public-data
  tools (aircraft, ships, satellites, quakes, fires, weather, infrastructure) backed by its MCP
  server, 33 godseye_live_* tools that let Hermes drive and read the live 3D globe open in a
  Desktop/Webapp pane, and HUD summaries generated with the Hermes model (ctx.llm) instead of
  OpenAI. Requires Node 24.14+ and a running God's Eye View checkout. No named-person search,
  face recognition or tracking of individuals. Disclosure — starts one node MCP child from the
  user's God's Eye View checkout; runs loopback-only HUD bridge (127.0.0.1:18791) and live relay
  (127.0.0.1:18792) threads gated by a random token stored 0600 in plugin-data; talks only to the
  user's God's Eye View app, which itself fetches public third-party data feeds; the pane
  backend adds a base tag, an opt-in UI flag, a Cesium worker shim and the live agent script
  inside the sandboxed frame only.
