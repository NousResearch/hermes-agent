name: godseye
title: Eye Of Hermes (EOH)
repo: https://github.com/mojomast/EOH
sha: 29de8b6fa24e1e1791180d32b31fef5dcd080fb9
description: >-
  Eye Of Hermes (EOH), built on God's Eye View (bilawalsidhu/gods-eye-view, MIT):
  11 composable godseye_* tools (godseye_view, godseye_query, godseye_layers,
  godseye_feeds, godseye_annotate, godseye_nav, godseye_track, godseye_scene,
  godseye_watch, godseye_capture, godseye_admin) for public data (aircraft, ships,
  satellites, quakes, fires, weather, infrastructure) backed by its MCP server, a
  live 3D globe pane in Hermes Desktop and the Webapp that Hermes can drive and
  read, and HUD summaries generated with the Hermes model (ctx.llm) instead of
  OpenAI. Requires Node 24 or newer (God's Eye View documents 24.14 or later, or
  26.x) and a running God's Eye View checkout. No named-person search, face
  recognition, or tracking of individuals. Disclosure — starts one node MCP child
  from the user's God's Eye View checkout; runs loopback-only HUD bridge
  (127.0.0.1:18791) and live relay (127.0.0.1:18792) threads gated by a random
  token stored 0600 in plugin-data; a pre_llm_call hook may add a short map line
  and queued watch alerts; an active area watch polls USGS, NASA FIRMS, OpenSky,
  the local app, or Overpass/Nominatim from a daemon thread; place search,
  routes, isochrones, Wayback metadata, and pin research call public services
  (Nominatim, Overpass, OSRM, Valhalla, Esri, Wikipedia, Wikidata, Wikimedia, and
  venue sites); feed tools talk to the user's God's Eye View app, which itself
  fetches public third-party data feeds; the pane backend adds a base tag, an
  opt-in UI flag, a Cesium worker shim and the live agent script inside the
  sandboxed frame only.
