    - godseye_query
    - godseye_layers
    - godseye_feeds
    - godseye_annotate
    - godseye_nav
    - godseye_track
    - godseye_scene
    - godseye_watch
    - godseye_capture
    - godseye_admin
  provides_hooks:
    - pre_llm_call
  provides_middleware: []
  requires_env:
    - GOOGLE_MAPS_API_KEY
    - GOOGLE_API_KEY
    - MAPILLARY_CLIENT_TOKEN
    - CESIUM_ION_TOKEN
    - FIRMS_MAP_KEY
    - FIRMS_API_KEY
    - FIRMS_KEY
    - NASA_FIRMS_KEY
    - AISSTREAM_API_KEY
    - TOMTOM_API_KEY
requires_hermes: ">=0.23.0"
