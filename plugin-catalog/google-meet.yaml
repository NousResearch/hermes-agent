name: google-meet
repo: https://github.com/NousResearch/hermes-official-plugins
sha: 5797795f57ed95bc14d55c1c4361d390b4de33f7
subdir: google-meet
description: 'Google Meet for Hermes: the agent joins a meet.google.com call you give it (meet_join),
  scrapes live captions into a transcript (meet_status, meet_transcript), can speak in the call in
  realtime mode (meet_say), leaves (meet_leave), and can run a transcribe-only bot on another machine
  through a remote node; `hermes meet setup|install|auth|join|node`. Explicit by design: it only joins
  URLs passed in, with no calendar scanning or auto-dial. Known limitation: a bot joined with meet_join
  leaves when that agent turn ends (hermes-official-plugins#518). Formerly built into Hermes core; existing users
  are migrated automatically. Disclosure: Python dependencies playwright and websockets; `hermes meet
  install` downloads Chromium through Hermes and, with --realtime, asks before running apt-get or brew
  for audio tools. The bot opens the Meet URL in headless Chromium, so Google Meet receives the guest
  name and the bot''s camera and microphone (Chromium''s fake devices in transcribe mode); `hermes meet
  join` (not the meet_join tool) signs in with a Google session you save via `hermes meet auth`,
  stored in your profile. Captions are scraped from the page into transcript.txt in the profile''s
  meetings folder (on the remote node in remote mode, whose WebSocket returns requested transcript
  lines) and reach your model provider only as tool output. Realtime mode sends the session
  instructions, voice and each meet_say text to the OpenAI Realtime API (wss://api.openai.com) with
  HERMES_MEET_REALTIME_KEY or OPENAI_API_KEY and plays the returned speech into the call; meeting
  audio is never sent to OpenAI. A remote node is reached over a plain WebSocket (no TLS built in)
  with a shared token you approve.'
maintainer: NousResearch
tier: official
category: general
requires_hermes: ">=0.21.7"
version: "0.3.0"
image: https://raw.githubusercontent.com/NousResearch/hermes-official-plugins/5797795f57ed95bc14d55c1c4361d390b4de33f7/assets/google-meet.jpg
docs_url: https://github.com/NousResearch/hermes-official-plugins/tree/main/google-meet
platforms:
  - linux
  - macos
known_issues:
  - "An agent meet_join bot is stopped when the turn that joined ends (NousResearch/hermes-official-plugins#518); remote nodes run transcribe mode only"
capabilities:
  provides_tools:
    - meet_join
    - meet_leave
    - meet_status
    - meet_transcript
    - meet_say
  provides_hooks:
    - on_session_end
  provides_middleware: []
  requires_env: []
