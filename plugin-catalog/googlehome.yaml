subdir: googlehome
description: "Google Home / Nest speaker as the mouth of a Hermes profile: replies are cast over the Cast v2 protocol with zero third-party dependencies, voice arrives from the host microphone through Hermes STT, and one speaker keeps one conversation. Adds googlehome_speak, googlehome_notify, googlehome_status, googlehome_volume and googlehome_devices, a Desktop page with push-to-talk and speaker controls, and hermes googlehome CLI commands. Disclosure — talks to the Google Home / Nest speaker over the local network (Cast TLS port 8009 and mDNS) and serves each spoken reply as an MP3 from an unauthenticated media server on all interfaces, so devices on the same LAN can fetch recent reply clips; runs a token-gated loopback control API (proxied for Desktop through the dashboard) that can start agent turns without gateway pairing; and spawns PowerShell SAPI or edge-tts to synthesize speech."
maintainer: karmsheel
tier: community
category: platform
requires_hermes: ">=0.21.5"
