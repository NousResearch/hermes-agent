  - https://raw.githubusercontent.com/karmsheel/google-home/b9a23c4f7ac3ea884ebeeb0cc0184f9960911c6f/docs/screenshots/02-controls.png
platforms: []
known_issues:
  - The speaker's own microphone cannot be used; voice input comes from the host machine's microphone through Hermes STT.
  - Casting takes the speaker over and interrupts whatever it is already playing.
capabilities:
