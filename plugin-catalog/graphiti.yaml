sha: 7ce136dc4954547637a668040a8dcd0d92857a6f
description: "Memory provider backed by your own self-hosted Graphiti knowledge graph, reached through Graphiti's MCP server over Streamable HTTP. Before each turn it recalls related facts from the profile's group plus shared groups (time-boxed, skipped for trivial prompts); at session end it stores one episode of user/assistant text (never tool output); it mirrors built-in MEMORY.md/USER.md writes; and it adds graphiti_search and graphiti_remember (no delete tools). Standard library only. Disclosure — sends captured conversation text, remembered notes and mirrored memory entries only to the Graphiti MCP URL the user configures (optionally via HTTPS_PROXY); that server sends episodes to its own LLM/embedding provider for extraction, which costs LLM calls per episode. Optional bearer token read via Hermes's secret route (GRAPHITI_MCP_TOKEN). Short-lived background threads only; no shell commands, no stored credentials, no telemetry."
