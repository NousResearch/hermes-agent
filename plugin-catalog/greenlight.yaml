sha: "8a611a6a4e61d8f3f917f88181b7b97e20637bba"
title: Greenlight
description: "Review and approve every xStocks trade before anything is sent. Ask Hermes for a trade and Greenlight shows what you pay, what you get, the fees, a simple risk check and your daily limit. Only after you approve do you get a link that opens the trade in your own wallet, so Greenlight never holds your keys or funds. Approve in the Hermes Desktop window or with /greenlight in the terminal and chat apps. Optional daily and per-trade limits, a stock allowlist and a price-change tolerance. Every decision is kept in a tamper-evident history. Includes a no-wallet practice trade. Disclosure — talks to api.xstocker.com and xstocker.com through the official xStocker SDK, bundled unmodified in vendor/agent-sdk (nothing is installed or downloaded at runtime and the plugin never updates itself); starts a short-lived node process per price request with a fixed command (node sdk-bridge.js), no shell and never an AI-chosen command; writes only to <HERMES_HOME>/plugin-data/greenlight/; reads no credentials; no telemetry; no Python dependencies; needs Node.js 18+."
maintainer: Datwebguy
tier: community
category: tools
requires_hermes: ">=0.21.5"
docs_url: https://github.com/Datwebguy/greenlight#readme
version: "0.1.0"
