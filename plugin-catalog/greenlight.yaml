title: Greenlight
description: "Explicit green-light approval for xStocks trades on Solana. propose_trade simulates an order against the live xStocks API through the official @xstocker/agent-sdk and returns a quote, a 0-100 risk score with its factors and the remaining daily cap, but never a transaction. The user approves or rejects in a native Desktop approval pane (also a status-bar chip, notifications and a /greenlight slash command for the terminal and messaging chats); only then does get_trade_status release an unsigned transaction or Solana Pay link, rebuilt fresh and refused if the quote drifted. Optional guardrails: daily cap, per-trade limit, allowed tickers, drift limit, release window. Every decision is written to a SHA-256 hash-chained local receipt log (list_receipts verifies it). A pre_tool_call hook blocks other tools from carrying an xStocks order link that no approved proposal released, and a pre_llm_call hook keeps the agent aware of pending proposals. Includes a no-wallet demo (/greenlight demo). Non-custodial: it never holds, reads or signs with a private key and never broadcasts. Disclosure — calls api.xstocker.com and xstocker.com through the official SDK, which is vendored unmodified in vendor/agent-sdk (npm integrity recorded in VENDORED.md), so nothing is installed or downloaded at runtime and the plugin never updates itself; spawns a short-lived node process per SDK call with a fixed command line (node sdk-bridge.js, JSON on stdin), no shell and never a model-chosen command; writes proposals and receipts only to <HERMES_HOME>/plugin-data/greenlight/; reads no credentials; no telemetry; no Python dependencies; needs Node.js 18+."
maintainer: Datwebguy
