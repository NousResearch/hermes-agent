title: Greenlight
description: "Greenlight is a Hermes Agent plugin that puts you in control of xStocks trading. Hermes can prepare a trade, but nothing is sent until you approve it. Ask for a trade and Greenlight shows what you pay, what you get, the fees, a simple risk check and your daily limit in a Hermes Desktop window. Only after you approve do you get a link, or a QR code for your phone's wallet, to confirm the trade in your own wallet, so Greenlight never holds your keys or funds. Approve in the Hermes Desktop window or with /greenlight in the terminal and chat apps. Optional daily and per-trade limits, a stock allowlist and a price-change tolerance. Every decision is kept in a tamper-evident history. Includes a no-wallet practice trade. Disclosure — crypto (Solana xStocks trading): talks to api.xstocker.com and xstocker.com, sending the wallet address, stock, amount, side and pay token for each quote and transaction signatures for status checks, through the official xStocker SDK (bundled unmodified in vendor/agent-sdk and used when Node.js 18+ is installed) or, without Node.js, directly over the same public HTTPS endpoints with Python's standard library; nothing is installed or downloaded at runtime and the plugin never updates itself; with Node.js, a short-lived node process per price request with a fixed command (node sdk-bridge.js), no shell and never an AI-chosen command; trades are released only after the user approves in the Desktop pane or with /greenlight approve (any user allowed to use that chat can run it) and are signed in the user's own wallet; writes only to <HERMES_HOME>/plugin-data/greenlight/ (or GREENLIGHT_DATA_DIR if set); reads no credentials; no telemetry; no Python dependencies; Node.js is optional."
maintainer: Datwebguy
tier: community
category: tools
requires_hermes: ">=0.21.5"
