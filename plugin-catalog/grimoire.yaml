title: Grimoire
description: "Ask about your CSV, JSON, Parquet and SQLite files in plain words: DuckDB answers with one SQL query, every number in the reply is checked against the query results, and a Data page gives charts, pivots, drill-down, data health and learning cards with no model tokens. Disclosure: reads only the data files you or the model name, read-only, with DuckDB's network, extension and other file access locked; no network calls; stores saved queries and settings in its plugin data; installs the duckdb Python package."
