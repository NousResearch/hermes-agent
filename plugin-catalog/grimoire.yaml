name: grimoire
repo: https://github.com/bettersandeep/grimoire
sha: 95cba9207e96d18459a16534aef90a0b8b81717a
title: Grimoire
description: "Ask about your CSV, JSON, Parquet and SQLite files in plain words: DuckDB answers with one SQL query, Grimoire flags any number in the reply that no query produced, and a Data page gives charts, pivots, drill-down, data health and learning cards with no model tokens. Disclosure — reads only the data files you or the model name (CSV, JSON, Parquet, SQLite; files a message mentions are attached automatically), read-only, always refusing Hermes' own folders and files Hermes' read guard blocks (files sent in chat are allowed), and refusing files under ~/.ssh, ~/.gnupg, ~/.aws, ~/.config, ~/.kube, ~/.docker and ~/Library unless allow_private_folders is set, with DuckDB's network, extension and other file access locked; copies SQLite files to a system temp folder as CSV, deleted on forget and at exit; a pre_tool_call hook blocks raw reads of large data files by other tools; no network calls, shell commands, background processes, credentials or telemetry; stores saved queries, settings and HTML reports in its plugin data; installs the duckdb Python package."
maintainer: bettersandeep
