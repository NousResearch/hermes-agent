sha: 7355adac27dd8e035d1612e749f74d9201f71bd1
title: Grimoire
description: "Ask about your CSV, JSON, Parquet and SQLite files in plain words: DuckDB answers with one SQL query, Grimoire flags any number in the reply that no query produced, and a Data page gives charts, pivots, drill-down, data health and learning cards with no model tokens. Disclosure — reads only the data files you or the model name (CSV, JSON, Parquet, SQLite; files a message mentions are attached automatically), read-only, refusing files under ~/.hermes, ~/.ssh, ~/.gnupg, ~/.aws, ~/.config, ~/.kube, ~/.docker and ~/Library unless allow_private_folders is set, with DuckDB's network, extension and other file access locked; copies SQLite files to a system temp folder as CSV; a pre_tool_call hook blocks raw reads of large data files by other tools; no network calls, shell commands, background processes, credentials or telemetry; stores saved queries, settings and HTML reports in its plugin data; installs the duckdb Python package."
