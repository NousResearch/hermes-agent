known_issues:
  - "Real twins need botport v0.2.1 on the Mac that has the Grok desktop app; you download it yourself (the Twins page opens the release file for your computer) and the plugin verifies it before it is run. Without it only the sample works. botport has no Windows build, so a Windows computer can link to your Mac but cannot share."
  - "Sharing between computers is signed, not encrypted by the plugin: on Tailscale it is encrypted by Tailscale; on a plain home network someone on that network can read twin names, descriptions and the settings that follow, the persona included (and skills, routines, and requests and answers, where you switched those on) but cannot change them. A twin's memory is the exception: the plugin encrypts it between the two computers."
  - "A linked computer finds the sharing one by the address in the link code. If a home-network address changes, unlink and link again (twins come back with their chats). Tailscale addresses do not change."
  - "From the Grok desktop app's local files, botport opens only the bot list and the selected bots' transcript files; those hold no instructions, skills, schedules or connections. Instructions are pasted by you or imported from the setup export the bot writes when you ask it (routines then arrive switched off, connections as names only); skills can travel through optional skill sync, whose Grok half was tested against botport in a pretend box with invented bots, not inside a Grok account; a bot's Grok memory and Grok model setting are not copied. Between your own computers skills and settings follow one way, from the Mac with the Grok app, and a connector must be set up on each computer (only its name follows)."
  - "Staying up to date while Hermes is closed is a terminal command (`hermes twin background on`), not a button. The Twins page was clicked through on macOS only; Linux (Omarchy, no other distribution) and Windows were tested with the terminal commands."
  - "Under plugins.isolation: host, Hermes skips plugin CLI commands, so `hermes twin` is unavailable; use `/twin` or the Twins page in Hermes Desktop."
