description: "Try Hermes without leaving Grok. Gives each Grok desktop-app bot a Hermes twin profile and a Desktop Twins page (conflicts, restore points); `hermes twin demo` needs no Grok account. Name and description changes reach the twin in seconds; instructions are pasted by you or imported from the setup export the bot writes about itself (routines arrive paused, connectors as names only, its memories are dropped); skills travel through optional guided skill sync (a sync bot in your own Grok account); a bot's Grok memory and model setting are not copied. Optional and off by default: the same twins on your other Hermes computers (macOS, Linux, Windows), linked once with a short code, with settings that follow by a fixed allowlist, skills, routines and end-to-end-encrypted memory each behind its own switch, and requests from one of your computers to a twin on another. Unofficial; not affiliated with xAI. Disclosure — Runs the user-installed external botport CLI (never bundled or downloaded; before it is ever run it is checked against the release SHA-256 digests shipped with the plugin or with `gh attestation verify` against hudsonwa/botport's release workflow, and its digest is pinned; `hermes twin setup --allow-unattested` is a recorded opt-out), plus `gh` (for that check only) and `hermes cron` (resume and pause on \"Move routines to Hermes\", create --paused when importing a setup export), each with a minimal environment; via botport it reads the Grok desktop app's bot list and the selected bots' local transcript files (capped, parsed for routine changes only) and writes the twin Hermes profiles it manages; the plugin writes plugin-data/grok-bot-twin/, its own marked blocks in twin profiles' SOUL.md, plugins.enabled, a copy of itself and the allowlisted settings in each twin profile, a note per removed twin in profiles/.deleted/, and, only with their switches on, twins' skill files, memory files and cron jobs; botport keeps one owner-only key file per twin; it runs one background metadata-check/sync thread (default every 60 s) and one Grok-folder watch once a session starts, plus threads for the sharing features only while they are on; it sends no telemetry; it calls Hermes' internal skill scanner (tools.skills_guard, fail-open) for the demo's skill preview. Network: none unless you switch on sharing; then the computer with the Grok app listens on ONE private address (its Tailscale address, else its home-network address; never all interfaces or a public one; TCP 18777) and your linked computers connect only to that address; linking proves a one-time 12-character link code (SPEKE; the code never travels) and every later call and answer is signed with a per-computer key; plain HTTP, encrypted by Tailscale on Tailscale, readable but not forgeable on a plain home network, except a twin's memory, which the plugin encrypts end to end. The plugin connects to no other host (only `gh` reaches GitHub, for the attestation check). A request from another of your computers (off on each computer until switched on there) runs as one ordinary Hermes chat turn of that twin, under that computer's own approval rules; a step that needs approval waits on that computer unless you chose there to let your own linked computers approve. An optional background helper (a launchd agent, systemd user unit or scheduled task of your own account, set up with launchctl, systemctl or schtasks; never root or SYSTEM) keeps a linked computer following while Hermes is closed."
