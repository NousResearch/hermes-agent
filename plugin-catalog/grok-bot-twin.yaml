readme: true
platforms: [macos, linux]
known_issues:
  - "Real twins need botport v0.2.1 (the release `hermes twin setup` verifies; other releases via botport_release_tag) on PATH (or botport_path), installed by you from its GitHub release; setup verifies the GitHub build attestation. Without it only the demo works (`hermes twin demo`)."
  - "From the Grok desktop app's local files, botport opens only the bot list (id, name, description) and the selected bots' transcript files (capped, parsed only for routine-change events); those files hold no instructions, skills, schedules or connectors. Instructions, routines and connectors stay on the by-hand list; skills can travel through your own Mirror bot routine."
  - "Under plugins.isolation: host, Hermes skips plugin CLI commands, so `hermes twin` is unavailable; use `/twin` or the Twins page in Hermes Desktop."
capabilities:
  provides_tools:
    - twin_status
    - twin_recent
  provides_hooks:
    - pre_llm_call
    - on_session_start
    - on_session_end
  requires_env: []
