name: grokbot-staff
repo: https://github.com/leoresendedop-sys/grokbot-staff
sha: 30840dcbbecefc659112acfd21609beaa0efc85c
description: >-
  A chief-of-staff and specialist team inside Hermes (chief, saas, design,
  vision-agents, computer-vision, x — or a team you configure), plus an optional
  fail-closed bridge that hands long-running work to your own Grok Bot. Local
  staff answers with your current Hermes model via ctx.llm. Slash commands
  /staff and /grokbot, a staff delegation backend for delegate_task, a bundled
  skill, and a Desktop pane for the roster, pending handoffs and recent jobs.
  The bridge does not call any Grok Bot API (there is none); it POSTs a JSON
  handoff to a webhook URL you set and/or writes handoffs/<id>.json in a folder
  you set, then collects results/<id>.json|.md|.txt or a pasted answer. Not an
  importer and not Grok Bot calling Hermes — Hermes delegating to Grok Bot.
  Disclosure — Network calls go only to the webhook URL you configure, and only
  when grokbot_delegate runs: https required (http allowed for localhost),
  redirects are never followed, URLs with userinfo are rejected, and the timeout
  is capped. The webhook URL is a secret setting (GROKBOT_STAFF_WEBHOOK_URL);
  tool output shows only scheme://host/.... Files: jobs are stored in the
  plugin's own data folder; if you set an inbox directory it writes
  handoffs/<id>.json there and reads results/<id>.* (job ids are validated to
  block path tricks; symlinks and files over 2 MB are ignored). Model calls go
  through Hermes (ctx.llm) with your current provider when a staff tool or
  slash command runs. No shell commands, no background processes, no telemetry,
  no self-updater. The Desktop pane imports only @hermes/plugin-sdk and react
  and reads a read-only /overview dashboard route.
maintainer: leoresendedop-sys
