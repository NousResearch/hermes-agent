description: 'Grok-like conversational feel for Hermes. Voice: a pre_llm_call hook injects one concise voice block per turn (answer first, 1-5 short lines, plain prose, no em dashes). Habit: ships the grok-habit skill (installed into profile skills dirs) so the bot adopts chat phrases like "every morning brief me on X" as its own scheduled habits and reports in one line without scheduler framing. Flow (desktop): a shimmering gerund status chip in the status bar and Stop/Continue pills under the composer; Stop sends the app''s own session.interrupt verb via host.request (background processes are not touched) and Continue resubmits "continue" through the composer bus, fail closed. Look (desktop): the GroklikeFeel theme (graphite chrome, ink on dark, blue accent, tight tracking) in Settings > Appearance. Disclosure: desktop UI is gated to an explicit GATED_PROFILES id list in plugin.js (fail closed until you add your own profile name); the plugin issues exactly one gateway RPC (session.interrupt) and only from its Stop pill; it reads app state but never touches app DOM; no telemetry; visibility switches are left to the app (display.show_reasoning / display.tool_progress).'
