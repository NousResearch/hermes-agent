name: grounder
repo: https://github.com/grounder-labs/grounder-hermes-plugin
sha: 7af036c8982518998145b674c46df8cbd316252e
description: "Grounder as the web_search and web_extract backend: each question goes to sources Grounder chose by hand, with chosen backups, reached only in a way the source allows, and a question that fits none of Grounder's sources gets no results and no charge. Two modes: Grounder provider (the default) returns those sources' results; Grounder direct finds the source's page and reads it on your Mac with Safari, as a summary (the default), the full page or highlights. Free searches need no account. Connect a Grounder search key or `hermes auth add grounder:grounder` for more. While Grounder is the web search backend, `/search` (on Slack, `/hermes search`) chooses the mode, page format and resolver and saves the choice on the Grounder account when connected, and `/search-direct-format` sets the format. Adds grounder_search. Grounder direct needs macOS 13 or later with Safari and Grounder's reader, installed as https://grounder.net/docs/direct shows, or built once from the plugin's own direct_reader.swift with Xcode's swiftc. Disclosure — each web_search query and its search options, and each web_extract page address Grounder reads, are sent to api.grounder.net, passed on to the sources that answer it and to the service providers that help run a search, and kept under your Grounder account indefinitely (a free search has no account); each search also sends your latest chat message as you typed it (up to 2,000 characters), which goes to api.grounder.net, may go to the service providers that help run a search, and is kept with the search the same way, and none is sent when Hermes gives the plugin no message, as in a scheduled job; when the model reads a page no Grounder search returned, your latest chat message (up to 2,000 characters) is sent as the ranking query; /search reads and writes your saved search setting on your Grounder account. Grounder direct on a Mac runs the reader as a local process, which requests the page straight from its site with a Safari user agent and no cookie or sign-in: it keeps none, and at load the plugin deletes, with macOS's security tool, any sign-ins an older version saved on the Mac (its folder under ~/Library/Application Support/Grounder Direct and its own grounder-direct keychain items, never another app's). The reader gets only HOME, PATH and its own settings from Hermes's environment. While connected, after a read of pages you named, the Mac also tells Grounder your question, your latest chat message (any address in it cut to its site and path, up to 2,000 characters) and each page's site and path, never its text, unless your account opted out of training. With Grounder's resolver chosen, a page's host name goes to Grounder for the DNS lookup. The summary format can send the opening of the page and your question to your active model in Hermes. With GROUNDER_X402_PRIVATE_KEY set (unset by default), a free search Grounder answers with an x402 payment request is paid from that wallet in USDC on Base to the payee Grounder names, at most GROUNDER_X402_MAX_PER_SEARCH US dollars a search (default 0.05) with no total limit beyond the wallet's balance and no approval prompt (scheduled and unattended runs included), the wallet's key kept in the profile's .env in plain text, and a search with a search key or a sign-in is never paid from it; usage context is off by default, and only after `hermes config set web.grounder.share_usage_context true` and a restart does a search also carry two random session and prompt tokens and the name of the model that asked; the first load in a profile makes Grounder the web_search and/or web_extract backend only where none is chosen yet, and writes Grounder's public OAuth client id to the profile's .env when no search key is set; answers that used Grounder get a Sources list and a \"Searched with\" line appended."
maintainer: grounder-labs
tier: community
category: web
requires_hermes: ">=0.22.3"
docs_url: https://github.com/grounder-labs/grounder-hermes-plugin#readme
version: "0.10.10"
title: Grounder
known_issues:
  - "/search and /search-direct-format are registered only while Grounder is the web search backend; a switch made in hermes tools takes effect at the next start"
  - "Usage context (the model's name and two random session and prompt tokens on each search) is off by default. hermes config set web.grounder.share_usage_context true, then restart Hermes, turns it on and registers the post_api_request hook"
  - "With no search key, the first load writes the public GROUNDER_OAUTH_CLIENT_ID to the profile's .env, which `hermes auth add` needs for the sign-in and which keeps Hermes's web tools on while Grounder is a selected backend"
  - "Signing in before Hermes has started once needs the client id first: hermes config set GROUNDER_OAUTH_CLIENT_ID https://api.grounder.net/oauth/clients/hermes-agent. A search key needs no client id"
  - "An account gets 50 free searches a day. Past that, searches use credit bought on the account"
  - "Grounder direct reads pages only on macOS 13 or later with Safari; on another system a Grounder direct read returns the reason instead of the page"
capabilities:
  provides_tools: [grounder_search]
  provides_hooks: [transform_tool_result, transform_llm_output, pre_tool_call, post_api_request, pre_llm_call]
  provides_middleware: []
  requires_env: []
