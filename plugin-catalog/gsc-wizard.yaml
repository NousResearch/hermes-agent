description: "Google Search Console, Bing Webmaster, Google Analytics 4, Merchant Center and Yandex Webmaster through GSC Wizard's hosted MCP server (Streamable HTTP at https://mcp.gscwizard.com/mcp, OAuth sign-in, no keys in config): 130+ tools for search analytics, ranking changes, anomaly and change-point detection, content decay, cannibalization, CTR curves, URL inspection and indexing tracking, sitemaps, IndexNow, Core Web Vitals, migrations, forecasts, GA4 reports and Merchant Center listings. Bundles 34 workflow skills (site audit, traffic drop, weekly report, quick wins, content decay, indexing health and more). Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: every tool call goes to GSC Wizard's hosted server (mcp.gscwizard.com) and reads the user's own connected Google, Bing, Yandex and Merchant Center accounts; the server logs each call (tool, property, status, duration, and arguments of write calls only) for 7 days; the tool set is served by that server at runtime and is not covered by the pinned sha. Write tools (site and tag management, IndexNow and sitemap submission, batch URL inspection, indexing tracker, content groups, annotations, shared reports, redirect mappings, feed audit) are refused on a read-only key, and the package marks the server untrusted, so Hermes asks before every tool the server does not mark read-only and refuses them in unattended runs. Requires a GSC Wizard plan or 7-day trial. Sign-in runs the pinned mcp-remote@0.15.2 through npx (Node.js 20.18.1+ and npm required), which opens a browser and a local callback port on first use and stores OAuth tokens under ~/.mcp-auth; without a stored token, an unattended run fails at Hermes's connect timeout instead of hanging. Users who need longer to sign in, or a headless setup, can replace the server with hermes mcp add gsc-wizard --url https://mcp.gscwizard.com/mcp --auth oauth (or an API key header) and keep the skills."
