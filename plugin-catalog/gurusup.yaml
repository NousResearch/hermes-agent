description: >-
  Your company's memory in Hermes: search decisions, people, customers and projects
  across every source your team connected to Gurusup (Slack, HubSpot, Notion,
  uploaded documents and more), with the sources behind each answer. Portable Agent
  Plugins v1 package (mcp.json + skills/), remote streamable-http with OAuth 2.1, no
  local code and no API keys. Disclosure: hosted-only connector; every tool call goes
  to Gurusup's MCP server at mcp.brain.gurusup.com and answers are limited to what the
  signed-in Gurusup account can see. Write tools save knowledge to the company's Gurusup workspace
  (add_company_knowledge, skills_publish) and send issue reports or feedback to Gurusup
  (report_issue, send_feedback); request_human_info can message a teammate on Slack or
  call them when its dispatch flag is set. OAuth must be enabled with
  `hermes mcp add gurusup-brain --url https://mcp.brain.gurusup.com/mcp --auth oauth`;
  the bundled mcp.json alone yields 401.
