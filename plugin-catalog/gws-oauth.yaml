name: gws-oauth
repo: https://github.com/anpicasso/hermes-gws-oauth
sha: 51c02e6c4aec7163b87e7f5b06965331823269c3
description: Multi-account Google Workspace tools and targeted Gmail, Drive and Calendar
  watches using native gws; draft proposal with known OAuth policy blockers.
maintainer: anpicasso
tier: community
category: tools
requires_hermes: '>=0.23.2'
docs_url: https://github.com/anpicasso/hermes-gws-oauth/blob/51c02e6c4aec7163b87e7f5b06965331823269c3/README.md
version: 0.8.0
platforms:
- linux
known_issues:
- 'Not currently eligible under catalog rule 11: native gws login, per-account credential
  files and refresh, plus in-memory Pub/Sub credential export/refresh, bypass the
  required Hermes-managed OAuth request architecture. Disclosure is not a waiver.'
- 'Rule 9 review warning: undocumented gateway session-context and private webhook
  route helpers; no runtime core overrides.'
- One trusted operator per profile. Full consent is the default; narrower scopes are
  available. Native gws 0.22.5 lacks PKCE/state; callback interception/deletion is
  best effort and explicit callbacks may enter model context/history.
- Runs gws subprocesses and an operator-supervised POSIX watch worker; writes profile
  credential/state/response files, calls Google APIs and configured Hermes webhook
  ingress, and forwards Workspace data to the agent/model provider.
- Google Cloud Desktop OAuth client and gws 0.22.5 required. Watches need external
  cloud/proxy setup. Local logout does not revoke Google consent. Credential replacement
  is recoverable, not crash-atomic; response files need manual cleanup.
- Same-session delivery has a concurrent reset race; admission is not delivery confirmation.
  Some one-shot routes require explicit cleanup. See docs/catalog-policy.md for full
  disclosure.
capabilities:
  provides_tools:
  - gws_login
  - gws_logout
  - gws_accounts
  - gws_api
  - gws_gmail_watch
  - gws_drive_watch
  - gws_calendar_watch
  - gws_gmail_search
  - gws_gmail_read
  - gws_gmail_draft
  - gws_gmail_send
  - gws_drive_search
  - gws_drive_read
  - gws_drive_upload
  - gws_drive_share
  - gws_calendar_list
  - gws_calendar_freebusy
  - gws_calendar_create
  - gws_calendar_update
  - gws_schema
  provides_hooks:
  - pre_gateway_dispatch
  - pre_tool_call
  provides_middleware: []
  requires_env: []
