name: habit
repo: https://github.com/scottleimroth/habit
sha: b81f141f70a8815f7c2cc152ef7fcc0d98db4a6f
title: Habit
description: >-
  Learns which commands you already approve, proposes a safe allowlist pattern after a few matching approvals, and only
  writes it to Hermes's command_allowlist after you run /habit accept. Wipes, download-and-execute pipes, git push and
  secret paths are never proposed, and /habit undo or /habit uninstall take every entry back.
  Disclosure: after /habit accept it writes command_allowlist in the active HERMES_HOME config (the official Always path).
  It keeps its own decisions in a local SQLite database through plugin_db. It imports some Hermes internals that the
  validator lists as private (tools.approval.approve_permanent, tools.approval._lock and _permanent_set, and
  gateway.session_context.session_is_messaging_surface), so a Hermes release can break it. No network calls, no telemetry,
  no credentials, no background process, no extra model.
maintainer: scottleimroth
tier: community
category: automation
requires_hermes: ">=0.21.5"
docs_url: https://github.com/scottleimroth/habit/blob/b81f141f70a8815f7c2cc152ef7fcc0d98db4a6f/README.md
