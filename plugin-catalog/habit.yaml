title: Habit
description: >-
  Learns which commands you already approve, proposes a safe allowlist pattern after a few matching approvals, and only
  writes it to Hermes's command_allowlist after you run /habit accept. Wipes, download-and-execute pipes, git push and
  secret paths are never proposed, and /habit undo or /habit uninstall take every entry back.
  Disclosure: uses Hermes's public config load/save functions to store accepted rules and remove them.
  Reads session context read-only; no writes to Hermes private state and no core overrides.
  Allowlist edits take effect on the next approval check in Hermes 0.23 and survive restart.
  Unidentified chat approvals and built-in smart/AI approver decisions are not learned.
  It keeps its own decisions in a local SQLite database through plugin_db.
  No network calls, no telemetry, no credentials, no background process, no extra model.
maintainer: scottleimroth
tier: community
category: automation
requires_hermes: ">=0.23.0"
