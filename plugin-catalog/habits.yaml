known_issues:
  - "Without a TypeSafe Jev key, steps that ask a question go to your Hermes model, slower, and those runs do not count toward your yes: a reflex with such a step stays learning."
  - "Measured on one user's install, with one cheap model and one decision model (Jev); 14 of 20 request wordings never seen before were recognized, the others go back to Hermes. The headline figures are from the builds of 10 November; an earlier build of 11 November (aad995e) was tried in 229 simulated turns on throwaway Hermes profiles (docs/BENCHMARKS.md); the fixes made after it are covered by tests and by one short pass of 9 real turns on the last build."
  - "The guard and the dream's exclusion of secrets are word-and-shape checks, not proofs; docs/SAFETY.md lists what they do not see."
  - "With permissions: hermes, Hermes does not ask about every deletion: on Hermes 0.23 a plain rm of one file is not flagged. Set permissions: strict to make the plugin refuse deleting commands."
  - "The dream proposes fixed actions only, and few real actions are local reads, so most practice counts that an action came back, not that a result matched."
  - "What the dream gives on day one is a list of repeated gestures and proposals; the saving comes once reflexes are assembled or made by asking. No gain from a dream-born reflex has been measured yet."
  - "The start on a loaded skill worked 2 of 2 on a real Hermes (11 November); a real MCP server: not tried."
  - "A scheduled habit's cron job exists from the save, before any yes; run hermes habits cleanup before you uninstall."
capabilities:
  provides_tools: [habit_run, habit_save]
  provides_hooks: [pre_llm_call, pre_tool_call, post_tool_call, post_llm_call, post_api_request, on_session_finalize, transform_tool_result]
  provides_middleware: []
  requires_env: []
