description: "Read-only journal reflection skill with opt-in local Vault MCP setup. Disclosure — after you run the bundled setup and add its local stdio MCP server yourself, the plugin reads Markdown notes from the one Vault directory you name (read-only), keeps its settings in ~/.config/habitude-agent/config.json and a search index in ~/.cache/habitude-agent/ (outside the Hermes profile), and returned journal excerpts are sent to your configured model provider; it makes no network calls of its own."
