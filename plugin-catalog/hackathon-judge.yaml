description: "Source-linked Hermes hackathon and catalog preflight with explicit human review gates Disclosure — the optional `validate` action runs `hermes plugins validate` on the plugin directory the agent names, through Hermes's terminal tool, which imports and executes that candidate plugin's code; it is gated only by a `trusted_code` flag the agent sets, and no approval prompt appears for that command. The default audit is static and read-only, with no network calls."
