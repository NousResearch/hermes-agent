known_issues:
  - Requires macOS/Linux and Hermes CLI on PATH; macOS verified, Linux integration unrun.
  - Local cancellation cannot revoke remote processing or billing already accepted by a provider.
  - Model rankings can be partial or omit categories; no broad relevance guarantee is claimed.
  - Podcast Index is optional and not live-tested; Reddit remains disabled pending approval.
  - Local retention cannot execute while Hermes is stopped; cleanup precedes access after restart and exported backups are operator-managed.
