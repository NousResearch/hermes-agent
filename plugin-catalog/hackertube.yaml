sha: 3e65af3b424bb932de944731340d99122f0a67ed
subdir: hackertube
description: "Source-backed media discovery with existing Hermes providers and a profile-local library. Disclosure — each explicit Search sends your question and candidate metadata to the Hermes auxiliary model you pick and your Hermes web-search backend (this may spend credits). It also queries hn.algolia.com, itunes.apple.com, openlibrary.org, librivox.org and, with your key, www.googleapis.com (YouTube) and api.podcastindex.org. Searches run in a Python worker subprocess that re-launches the `hermes` CLI from PATH with Hermes's environment (YOLO vars stripped). An hourly local thread purges expired records from plugin-data/hackertube/profile.db."
maintainer: rcmiller01
tier: community
category: web
requires_hermes: ">=0.23.0"
version: "0.2.2"
