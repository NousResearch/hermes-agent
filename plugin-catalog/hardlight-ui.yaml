known_issues:
  - "Requires native tool, command, and bundled-skill registration APIs; the plugin checks their presence at load time."
  - "On Windows, bounded source inspection returns an explicit compatibility error; reference, direction, contrast, and navigation tools remain available."
  - "Some canonical gateway/local command routers reject /hardlight; use natural-language requests and the bundled frontend-design skill instead."
  - "Optional browser evidence requires separately installed Playwright and a compatible browser; it is not installed automatically."
  - "Automated findings are bounded advisory evidence, not artistic, usability, or full WCAG certification."
