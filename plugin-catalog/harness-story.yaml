name: harness-story
title: "Harness Story"
repo: https://github.com/wronglebowsk/harness-story
sha: "ac6c59b1a85f254b2145443fbff495ce8516f81a"
description: "Plain-English session storyteller and Desktop workspace pane: reconstructs what you asked, the hidden Hermes startup context load (skills, connectors, plugins, tools, memory), why the model chose each tool or pivoted after errors, and a 5-bucket context window bar synchronized with an auto-scrolling Chronicle. Disclosure — reads state.db in read-only mode (?mode=ro) and non-secret skill/plugin/connector names from get_hermes_home() to summarize context load; writes live hook JSONL and rendered .json/.html story files only under plugin-data/harness-story/; optional narrative synthesis posts to the user-configured OpenAI-compatible base_url (empty by default; falls back deterministically when unset, offline, or with --no-llm). No third-party cloud calls, no shell execution, no stored credentials, and no self-updater."
maintainer: wronglebowsk
tier: community
category: desktop
requires_hermes: ">=0.20"
docs_url: https://github.com/wronglebowsk/harness-story
version: "0.1.0"
platforms: [linux, macos, windows]
capabilities:
  provides_tools:
    - harness_story_generate
    - harness_story_inspect
    - harness_story_compare
    - harness_story_render
    - harness_story_list
  provides_hooks:
    - on_session_start
    - pre_llm_call
    - pre_api_request
    - post_api_request
    - pre_tool_call
    - post_tool_call
    - on_skill_lifecycle
    - subagent_start
    - subagent_stop
    - post_compaction
    - post_llm_call
    - on_session_end
  provides_middleware: []
  requires_env: []
