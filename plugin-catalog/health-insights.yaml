description: Deterministic, local-first analysis of your own Apple Health data - weekly trends, rule-based
  concern checks, nutrition versus Dietary Reference Intakes, an IOM energy target and lab results. Portable
  Agent Plugins v1 package of six skills that drive the separately installed health-insights command line
  tool (pipx install from the repository); the plugin itself contains no executable. Works on a self-hosted
  HealthRelay or Health Bridge receiver database. Disclosure - it handles sensitive health data, so use a
  local model or one you trust; personal integrations (medication counts, push, model wording) are off by default.
