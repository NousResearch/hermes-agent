description: 'Local-first personal health records: encrypted on-device Vault (AES-GCM) for
  vitals, medications, activities, emotions, sleep, encounters, diagnosis mentions,
  medication plans and reminders, served through a Keychain-paired local daemon with 24
  scoped MCP tools. Zero-config first run: the plugin bootstraps Vault + daemon + agent
  pairing automatically under PLUGIN_DATA. Engine pinned to an immutable PyPI release
  (healthcare-mcp==0.2.1) over uvx stdio; Portable Agent Plugins v1 package (mcp.json +
  skills/), macOS only, Python 3.11+. Zero network by default; the optional LLM report-import
  endpoint stays off unless the user configures it. Approval-gated deletes, tamper-evident
  audit chain.'
