name: healthrelay
repo: https://github.com/mwdearing/hermes-healthrelay
sha: 561cb130d98493275d815a712d6aafd14fdac539
description: Read-only access to your own Apple Health data through a self-hosted HealthRelay receiver.
  Portable Agent Plugins v1 package with one stdio MCP server (nine read-only tools, no raw SQL, no write
  tools) and three skills for setup, review and troubleshooting. Requires your own HealthRelay receiver
  (health-bridge) and an iPhone app you sign yourself; the plugin ships neither. Disclosure - it exposes
  sensitive health data to whichever model you run, so use a local model or one you trust with that data.
