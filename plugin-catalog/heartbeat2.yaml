name: heartbeat2
title: HeartBeat 2.0
repo: https://github.com/electricsheephq/heartbeat2
sha: 799554b0ea7c92c762018edde7e98ea543039f42
description: "Give your agent a working life between your messages. Put it in charge of something and it keeps working on it on its own time. A role is a standing responsibility with a charter, a notebook the agent keeps between turns and a rhythm it sets itself, and it doesn't expire on a timer. Turn on own time and the agent gets regular turns of its own: it looks at its desk (its roles, what's due, what it noticed, the budget left) and decides what to do. You (with /pulse) or your agent (with the pulse tool) can also arm follow-ups at a time, recurring checks, a check-in after a long silence, or deterministic watchers on a file, process, URL, read-only command or Hermes event (kanban, subagent, API error, reactions) that cost no model call until something changes. Every wake is a turn in the same messaging conversation, on that chat's own model: no side model, cron session or subagent. Quiet work counts: a silent turn that makes progress is real work, and only wakes that keep finding nothing to do slow down, then pause and ask once. The guardrails are budgets you set: turns per day, an optional daily cost limit, turns per role, messages per day, the unanswered mute and quiet hours. They hold back messages and spending, not initiative, and the agent can tighten its own limits but never widen yours. A one-time reminder you ask for in chat bypasses the unanswered mute and daily caps; HeartBeat 2.0 grants that only in a turn that carries your message. Arming returns a one-line receipt saying when the wake will really fire. It delivers to messaging-gateway DMs by default (group and topic chats too when dm_only is off) and needs plugins.entries.heartbeat2.allow_gateway_injection: true. Ships the plugin skill `heartbeat2:heartbeat2-report-problem`, which drafts a bug report and files it with the GitHub CLI only after the user approves the exact text. Disclosure — wakes, watchers, roles and own-time turns run full turns on the conversation's own model, billed like any message, at your conversation's context size, with the conversation's normal tools and approval prompts; the agent can arm wakes, watchers and roles itself unless you set agent_can_create to ask_first or no; roles have no expiry, and the agent's recurring wakes and roles keep running turns during quiet hours, while the unanswered mute is on and after the daily message cap (only their messages are held), up to the daily turn cap and the optional daily_cost_limit_usd (no cost limit by default); own-time turns (off by default, own_time_hours) run without an assigned task; command watchers run allowlisted read-only commands (default gh pr view/checks, gh run view/list, git ls-remote/status/log) without an approval prompt, with no shell, a sanitized environment (no provider keys, GH_TOKEN or GITHUB_TOKEN) and the process group killed after 30 s, can use your stored git/gh credentials, and `git ls-remote <url>` / `gh -R` can contact any host your machine can reach; URL watchers make the GET requests you or the agent configured, without URL credentials, cookies, auth headers or proxies, always refuse cloud-metadata addresses and refuse private or local addresses unless url_allow_private is on; file watchers refuse paths Hermes blocks from reading; notes, summaries and event payloads are stored in plaintext in the profile's plugin-data; no telemetry."
