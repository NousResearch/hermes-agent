description: >-
  A shared room with Nori, a focus garden, focus timers, and study decks for Hermes Desktop.
  Disclosure — optional weather and city search use Open-Meteo; study imports, exports,
  and backups read or write user-selected local paths. Collections stay profile-scoped;
  explicitly loaded owned project documents may enter the configured model's context.
  Optional saved LaTeX images invoke an existing local TinyTeX runtime on macOS.
  No telemetry, credential-store access, independent daemon, or self-updater.
