known_issues:
  - Research and educational prototype; not a medical device, diagnosis or treatment recommendation.
  - Requires PLSI's Python dependencies (pydantic>=2,<3 and PyYAML>=6,<7), which Hermes installs on confirmation.
  - The install scanner reports a caution on unchanged upstream PLSI code (a variable named env in formula.py and pip install hints in error messages).
  - For an independent challenger, configure auxiliary.hebe_challenger to use a strong model different from your chat model; if that provider fails, Hermes falls back to another configured model.
requires_hermes: ">=0.23.0"
