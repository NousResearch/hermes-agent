title: helm
description: "A redesigned Hermes Desktop. A Desk home page (greeting and crew status, a prompt that hands work to any bot, Continue, Needs you, Today's scheduled jobs); pending tool approvals and questions from every bot's live chats answered in one place, on the Desk and in a sidebar pane, only on your click; a Session pane with the focused chat's live task plan; a themeable redesign layer across the app (three bases, seven accents, type, corners, density) on a Customize look page; status everywhere (titlebar, session rows, status bar); and a Bots board of rendered robots (191 Blender-rendered PNG layers) that become each bot's Hermes avatar. Disclosure — desktop half uses only Desktop SDK areas and public gateway calls the app itself makes: host.profiles.list and host.listPersistedSessions (held in memory), session.active_list, approval.pending, session.history (the focused chat's plan), cron.manage action list only (never adds, pauses or removes a job), host.onEvent for approval/clarify/todo events; approval.respond and clarify.respond only when you click Approve, Allow session, Deny or Send; profiles.create only from New bot; host.restartGateway only from the restart button on the flat-robots notice; with \"Robots as Hermes avatars\" on (the default) it checks each bot's avatar once a minute (profiles.get_asset) and sets a robot with profiles.set_asset on any bot with no avatar or with Bot Mode's 160 px face, replacing Bot Mode's face each time it returns, and leaves other images alone (an uploaded image exactly 160 or 256 px wide is mistaken for a generated one); sends a chat message only from the Desk prompt on Enter or Send. The theme layer is the SDK theme customCSS and selects the app's data-slot names in CSS only (validate warns on these selectors); JS never queries, observes or edits app markup. Writes its own ctx.storage and, when changed in its settings, the app's sessionListDensity and chatTextScale. The dashboard half is a read-only FastAPI router serving the bundled PNGs (fixed-pattern names, no writes, no Hermes internals imported). The agent half registers nothing. No third-party network calls, no shell, no credentials, no telemetry, no self-updater. tools/render/ holds the Blender source that produced the PNGs (not run by Hermes)."
