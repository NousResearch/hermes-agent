title: Hephaestus
description: "Ask for a plugin and your own agent writes it, checked by the official validator and doctor. It installs disabled; only you enable it. Disclosure: runs the hermes CLI (fixed argument list, no shell) to validate, doctor, enable, disable and remove plugins; writes forged plugins under HERMES_HOME/plugins and drafts and snapshots in its data folder; a pre_tool_call guard blocks the agent from enabling plugins. No network, no telemetry, no LLM calls."
maintainer: madebylegion
tier: community
category: tools
requires_hermes: ">=0.22.5"
docs_url: https://github.com/madebylegion/hermes-plugin-hephaestus#readme
