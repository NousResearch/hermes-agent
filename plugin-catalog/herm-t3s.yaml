description: "T3 Code-style triage for the Desktop session list, SDK-only: a coloured profile badge with a hover detail card (project, branch, model, counts, tokens, cost, preview), plus Snooze and Settle buttons revealed from a small clock at the end of each row. Disclosure — reads the session list and profile names from the local Hermes backend; Snooze and Settle set a session's archived flag (session.archive), and due snoozes are un-archived by a one-minute timer while the app is open; pending snoozes live in the plugin's storage; no network calls, credentials, shell commands or telemetry."
