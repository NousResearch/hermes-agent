description: "T3 Code-style triage for the Desktop session list, SDK-only: a coloured profile badge with a hover detail card (project, branch, model, counts, tokens, cost, preview), plus Snooze and Settle buttons revealed from a small clock at the end of each row. Disclosure — reads the session list and profile names from the local Hermes backend; Snooze sets a session's hidden flag (host.setPersistedSessionHidden) and a one-minute timer un-hides due snoozes while the app is open; Settle sets the archived flag (session.archive); pending snoozes live in the plugin's storage; no network calls, credentials, shell commands or telemetry."
