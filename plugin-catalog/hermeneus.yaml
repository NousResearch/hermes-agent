  - https://raw.githubusercontent.com/Bihruze/hermeneus/9b8b98c369281358226b948410e3e289c782f702/docs/media/pane-live-light.png
  - https://raw.githubusercontent.com/Bihruze/hermeneus/9b8b98c369281358226b948410e3e289c782f702/docs/media/setup-light.png
readme: true
# macos only: macOS is tested on real audio. The Windows backend is implemented
# and reviewed against documentation but has not run on a Windows machine, so
# it stays out of this entry; `hermes plugins install` refuses an OS the entry
# does not list (hermes_cli/plugins_cmd_catalog.py _refuse_unsupported_catalog_platform).
# Add windows only after a real Windows run (docs/windows.md lists the checks).
platforms:
  - macos
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - ELEVENLABS_API_KEY
