title: "Action Bar"
description: "A selection bar for Hermes Desktop with two kinds of action. Select text in a chat and a small bar appears: Reply, Ask, Explain, Summarize, Fact-check, Copy. Reply keeps the quote and one comment as a card above the composer; the cards go in front of your message as Markdown blockquotes when you send, so several passages each get their own comment in one message. Ask, Explain and Summarize open an answer card next to the highlight, with follow-up questions: the answer does not enter the chat and the agent does not see it, unless you click Send to chat, which puts it in the composer without sending. Fact-check is a template for the agent: it saves the quote as a reply card with a ready request to verify it, and calls no model. Actions are a label, a prompt and a place (answer card or agent), editable on a settings page, with an optional research set. Desktop-only (desktop/plugin.js inside the plugin SDK surface): no agent tools, hooks or env vars. Disclosure — reads the text you highlight (window.getSelection) in Hermes Desktop; an answer card (Ask/Explain/Summarize, or any action you set to answer in a card) sends the selected text (up to 6000 characters), up to 4000 characters of surrounding text and the card's earlier turns to your configured model through Hermes' stateless llm.oneshot request (the open chat's model, else the auxiliary model) and writes nothing to the session; Reply, Copy and an action for the agent (Fact-check by default) send nothing; a composer middleware prepends pending quoted replies to your next message; links in answers open in your browser only when clicked; no other network calls, no credentials, no telemetry."
