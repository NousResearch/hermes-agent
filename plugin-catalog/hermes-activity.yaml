title: Activity
description: "Hermes Desktop session analytics and provider-reported usage: annual heatmaps, token mix, model breakdowns and source-period summaries. Disclosure: the Hermes tab reads the selected profile's state.db in SQLite read-only mode. Providers uses an Activity-owned profile-local cache; explicit refresh reads existing provider credentials and calls CommandCode, Codex, OpenCode or Ollama APIs. Remote profiles run through the configured Hermes gateway. No telemetry, credential changes or automatic sign-in. Provider collection requires Node.js 22.18+. No Quota dependency."
