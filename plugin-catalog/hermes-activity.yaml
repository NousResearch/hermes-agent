description: "Hermes Desktop activity overview with a yearly contribution grid, token mix, model/platform breakdowns, tools, skills, and notable sessions. Disclosure — reads the selected Hermes profile's state.db through SQLite read-only mode. Desktop calls the plugin's fixed read-only command through profile-routed cli.exec; remote profiles use the configured Hermes gateway connection. No third-party API calls, credential reads, uploads, or telemetry."
