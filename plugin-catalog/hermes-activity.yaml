description: "Hermes Desktop session analytics and provider-reported usage: annual heatmaps, token mix, model breakdowns and source-period summaries. Disclosure: Hermes reads profile state.db read-only. Providers passive reads use an Activity aggregate cache and optionally quota_cache.json; explicit refresh uses the public Hermes Codex request broker and optional declared CommandCode, OpenCode and Ollama plugin secrets to call chatgpt.com, api.commandcode.ai, opencode.ai and ollama.com. No private credential-file reads, telemetry or sign-in flow. Remote profiles use the configured gateway. Node.js 22.18+ required; no Quota dependency."
