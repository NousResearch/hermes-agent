name: hermes-adaptive-effort
title: Adaptive Effort
repo: https://github.com/atostivint/hermes-adaptive-effort
sha: 9dedf09becf9a8986c7638f5c0d8825ff97cd34f
description: "Opt-in reasoning-effort routing: a selectable scorer (Jev, OpenAI Decisions, OpenRouter, Cloudflare Clef/Nace Drex, or a custom endpoint) classifies each request and sets the effort level on routes that support it — auto, once, always or off per session and for subagents, with a TUI status item, Desktop popup and dashboard. Disclosure — registers one llm_request middleware plus session/subagent lifecycle hooks; scoring calls go to the configured scorer endpoint only when routing is enabled (default off), keys are read by Hermes from the standard env vars, and the plugin changes only a supported effort field."
maintainer: atostivint
tier: community
category: models
version: "0.4.0"
docs_url: https://github.com/atostivint/hermes-adaptive-effort#readme
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_end
    - on_session_finalize
    - on_session_reset
    - subagent_start
    - subagent_stop
  provides_middleware:
    - llm_request
  requires_env: []
