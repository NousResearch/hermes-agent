sha: b607a595475f622eb61ab663c89e8cdbe4a369c8
description: "Choose a separate scorer to set the reasoning effort of each Hermes request. Disclosure — off by default; when a mode is enabled (or on an explicit `/hae probe`), sends the latest user message (or the parent-written subagent goal), truncated to 4000 characters, plus any configured guidance to the scorer you select (TypeSafe Jev at api.typesafe.ai by default, or OpenAI Decisions, OpenRouter, Cloudflare Workers AI, Nace at console.nace.ai, a seventh scorer — a local Ollama endpoint that needs no key — or a custom URL) using that service's key, or with no key at all for Ollama (local only) and for an unauthenticated custom endpoint; by default an enabled mode also sends up to 4 earlier user/assistant text messages (1200 characters each, up to 6 when configured; never on subagents or `/hae probe`) and a separate yes/no continuation question to the same scorer on each turn (set `dialogue_context_messages` or `continuation_downgrade_votes` to 0 to stop this), and an opt-in setting can also send the target model identity. The prompt stays on this machine only when the Ollama endpoint is local: this plugin cannot vouch for a remote address an operator types. Named effort vocabularies cover the fifteen exact `openai-codex` `codex_responses` ids, the exact `commandcode` `deepseek/deepseek-v4.1-flash` route and the OpenCode Go `chat_completions` routes, including five newly measured ids (`hy4-flash-free`, `qwen4-max`, `kimi-k2.7-code`, `longcat-2.0`, `iceman-contributor-free`); `allow_none` is opt-in and changes nothing today (no dynamic route's ladder declares `none`). `adaptive_effort_routes` is an operator opt-in that trades the prefix cache for per-turn effort on a chosen registered route. `/hae cache` reports seven-day per-route counters of effort-attributable cache loss; that store keeps no prompt text, session ids or request ids. `/hae` output is localized in French, German and Spanish on the Hermes core surface with an English fallback; the Desktop surface stays English. In Hermes Desktop it also sets the focused chat's session reasoning selector through the gateway `config.set` API after each applied change, and it keeps a prompt-free effort-change history (64 changes × 64 conversations), per-conversation mode overrides (at most 256 conversations) and per-route cache verdicts built from provider token counters (at most 128 routes) in its plugin data directory."
