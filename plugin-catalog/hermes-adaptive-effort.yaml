name: hermes-adaptive-effort
repo: https://github.com/atostivint/hermes-adaptive-effort
sha: c84f1389670cdd5ec4607b13bd32c4809878c415
description: "Choose a separate scorer to set the reasoning effort of each Hermes request. Disclosure — off by default; when a mode is enabled (or on an explicit `/hae probe`), sends the latest user message (or the parent-written subagent goal), truncated to 4000 characters, plus any configured guidance to the scorer you select (TypeSafe Jev at api.typesafe.ai by default, or OpenAI Decisions, OpenRouter, Cloudflare Workers AI, Nace at console.nace.ai, or a custom URL) using that service's key; opt-in settings can also send the target model identity, up to 6 earlier user/assistant text messages (1200 characters each) and a separate continuation question to the same scorer; in Hermes Desktop it also sets the focused chat's session reasoning selector through the gateway `config.set` API after each applied change, and it keeps a prompt-free effort-change history (64 changes × 64 conversations) and per-route cache verdicts built from provider token counters (at most 128 routes) in its plugin data directory."
maintainer: atostivint
tier: community
category: models
requires_hermes: ">=0.21.6"
docs_url: https://github.com/atostivint/hermes-adaptive-effort/blob/c84f1389670cdd5ec4607b13bd32c4809878c415/docs/README.md
