known_issues:
  - "Per-level effort intensity, cache, cost and quality remain unmeasured: the new OpenCode Go levels were checked only as HTTP-accepted (one 200 per level), not as distinct reasoning intensity."
  - "The Ollama scorer had no live call in this release, so `logprobs` support on a given build is unverified; the prompt stays local only when `ollama_endpoint` is local."
  - "Nine OpenCode Go ids return 403 model-access-disabled and `longcat-2.5-free` 429, so their effort vocabulary is unknown, not empty."
  - "`allow_none` changes nothing until a dynamic route's ladder lists `none`."
  - "The French, German and Spanish catalogs were machine-generated locally and hand-corrected, but not read by a native speaker; the Desktop surface stays English."
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_end
    - on_session_finalize
    - on_session_reset
    - subagent_start
    - subagent_stop
    - post_api_request
    - api_request_error
  provides_middleware:
    - llm_request
  # Provider credentials are conditional on the selected scorer, so none is
  # unconditionally required to load or use the plugin with a local endpoint
  # (the Ollama scorer needs no key at all).
  requires_env: []
