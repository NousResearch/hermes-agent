known_issues:
  - "Live per-level effort intensity is only partially validated: the named levels were measured as accepted (one HTTP 200 per level), not as producing distinct reasoning intensity, and cache, cost and quality are unmeasured."
  - "The Ollama scorer has no live call in this release, so `logprobs` support on a given Ollama build is unverified, and the prompt stays on this machine only when `ollama_endpoint` is local."
  - "`allow_none` changes nothing today: no registered dynamic route's ladder lists `none`."
  - "`custom_api_format: chat_completions` and OpenRouter chat-model scoring are unsupported (removed in 0.4.0); such configurations fail open with the effort unchanged."
