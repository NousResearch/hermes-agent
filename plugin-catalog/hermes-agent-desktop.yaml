description: "Hermes Agent Desktop: operate Windows apps through the accessibility tree instead of the screen. Reads a window's real UI as roles, names, states and refs, then clicks, fills a field, selects an option, toggles a checkbox, scrolls, sends a key combo, and manages windows and the clipboard. Actions are semantic and headless by default, so they do not take focus, move the cursor or synthesize keystrokes, and they fail closed rather than guess. desktop_install downloads the official vercel-labs/agent-desktop release for the running Windows target, verifies the archive against a sha256 pinned in the plugin, and proves the install by running version and status. Disclosure — the plugin runs the agent-desktop executable as a child process with arguments it builds; desktop_install is the only tool that uses the network, fetching the upstream GitHub release and, for an unpinned version, its checksums.txt; it reads window titles, labels, field values and the clipboard on request, which can contain private content. Windows only."
