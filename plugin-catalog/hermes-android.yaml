name: hermes-android
repo: https://github.com/TechFlipsi/FlipsiBridge
sha: 7ecca4ac7c63f8fda010ed21e53bebd825171e8c
subdir: hermes-android-plugin
description: "Remote Android device control for Hermes Agent: 58 android_* tools (read screen, tap/type/swipe, open apps, camera, screenshots & screen recording, files, notifications, microphone streaming, media, clipboard, SMS/calls, Health Connect) plus a companion Android bridge app (Kotlin/Compose). The phone dials out to a relay you host — works behind NAT, no port forwarding, no VPN — and chat plus device commands are end-to-end encrypted with a Double Ratchet, so the relay only ever sees ciphertext. Disclosure: tools act on the real, paired phone; the plugin is built for the Hermes Agent ecosystem and every device capability is an explicit opt-in switch (default denied)."
maintainer: TechFlipsi
tier: community
category: tools
requires_hermes: ">=0.3.0"
docs_url: https://github.com/TechFlipsi/FlipsiBridge
