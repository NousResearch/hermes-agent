# The Hermes plugin catalog entry for this plugin.
#
# THIS FILE IS NOT READ BY HERMES. It is kept here so the submission is a copy,
# not a reconstruction: the catalog lives in the hermes-agent repository, and
# admission is a pull request adding `plugin-catalog/hermes-anilist.yaml` with
# exactly these contents. Checklist: that repo's plugin-catalog/README.md.
#
#   sha     the commit that was reviewed — the v0.9.0 code plus the catalog docs
#           cleanup, not HEAD at any later moment. Bump it in the same PR that
#           bumps `version`, and never point it at a branch: the pin IS the trust
#           model. Quote it: an all-digit SHA unquoted is a YAML number and the
#           loader rejects it.
#           There is no minimum pin age: the 2-week maturity rule this entry was
#           waiting on was replaced upstream by the no-self-updater rule
#           (hermes-agent 48763a4d01, 2026-09-15), so admission turns on the pin
#           not being able to move itself — which this plugin has never done.
#           This pin is deliberately the docs-cleanup commit and not the v0.9.0
#           tag commit: `/docs/plugins/<name>` renders the README *at the pinned
#           sha*, so pinning the tag would publish a page still promising the PR
#           "once the pinned commit is two weeks old". The two commits differ in
#           documentation only — `git diff v0.9.0..<sha> --stat` touches nothing
#           the plugin runs — which is why `version` stays 0.9.0: the code at
#           this pin IS the 0.9.0 release.
#   image   the 2:1 banner on the catalog card and the plugin page hero, pinned
#           to `sha` so it cannot change under the review. This field is the
#           ONLY source of the hero: a README image near the top does not become
#           one. That was checked against live entries rather than guessed —
#           `image:` present ⇒ the page carries a hero (session-dashboard,
#           filebox); absent ⇒ it does not, README images notwithstanding
#           (boardstate, tailgate, hermes-resetwatch). The capture is 2032x1072
#           (1.90:1), so the page's centre-crop to 2:1 trims ~5% off the top and
#           bottom — window chrome only, nothing the picture is about.
#           No `screenshots:` list on purpose: that fills a separate gallery
#           section from the entry rather than the README, only ~4% of entries
#           declare one, and the README's own table already shows all three
#           captures (markdown images resolve against the pinned commit).
name: hermes-anilist
repo: https://github.com/BatataBF/hermes-anilist
sha: "0081dfd7b45a469eef1ec35d3d0797318694c640"
description: "AniList tracker for Hermes Desktop — airing countdowns, a season browser, a local or account-backed watchlist, episode alerts and a daily digest, plus agent tools that read your own list and answer about a single show. Disclosure — stores your pasted AniList token in the active profile .env (sent only to graphql.anilist.co); alerts and the daily digest are Hermes cron jobs it creates on the host you pick, and the digest job asks that host's agent to query the public AniList API itself."
maintainer: BatataBF
tier: community
category: desktop
requires_hermes: ">=0.21"
docs_url: https://github.com/BatataBF/hermes-anilist#readme
version: "0.9.0"
platforms: []
image: https://raw.githubusercontent.com/BatataBF/hermes-anilist/0081dfd7b45a469eef1ec35d3d0797318694c640/docs/screenshots/popover-upcoming.png
capabilities:
  # Must match what register(ctx) actually does at `sha`: `hermes plugins
  # validate` diffs these against reality and fails the entry on drift.
  provides_tools:
    - anilist_list
    - anilist_show
  provides_hooks: []
  provides_middleware: []
  # No env var is required to install or to read: the AniList token is optional
  # and lives in the profile's .env only after the user signs in from the pane.
  requires_env: []
