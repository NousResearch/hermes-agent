title: Hermes Arcade
description: "A neon arcade cabinet inside the Hermes dashboard: three playable canvas games (Snake, Breakout, Pong) with glow effects, particle bursts, chiptune synth SFX and an attract mode that plays itself. Persistent top-10 leaderboards with arcade-style initials entry are served by a FastAPI backend plugin and shared with the agent: LLM tools (arcade_games, arcade_top_scores, arcade_player_stats) let Hermes answer questions about your scores. No env vars, no hooks, no middleware; scores are stored only under the plugin's own data dir. The dashboard CSS loads Google Fonts (Orbitron / Press Start 2P) from fonts.googleapis.com — the only third-party network call. Disclosure — the dashboard tab loads Google Fonts (Orbitron / Press Start 2P) from fonts.googleapis.com and fonts.gstatic.com, which sends your IP and user agent to Google each time the tab opens; scores are stored locally in <HERMES_HOME>/plugin-data/hermes-arcade/scores.json."
