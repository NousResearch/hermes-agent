known_issues:
  - "Online play is a direct connection between the two computers, so the other player can see your IP address. The online screen says so before you connect."
  - "To set up an online match the game contacts the free public PeerJS signaling server (0.peerjs.com) and Google's public STUN server (stun.l.google.com). There is no relay server, so some strict networks (some offices and mobile carriers) cannot connect."
  - "The page loads its three fonts from Google Fonts each time it opens."
