sha: 750409b91e700e5ce4a1ae7b0b48fdfabc13623e
subdir: plugin
description: "Claude-style artifacts for Hermes: docs, sheets, whiteboards, slide decks, dashboards, designs, 3D models, films and design systems that Hermes makes and you edit in place, versioned, in a gallery and sandboxed viewer inside Hermes Desktop. Sheets calculate, dashboards re-run stored MCP queries, and everything exports locally (docx, xlsx, pptx, pdf, png, svg, mp4, glb). Disclosure — stores artifacts, versions, comments and a 30-day trash under the profile's plugin-data folder; reads and writes host files only inside the chat's working directory (never Hermes' home or hidden folders); live dashboards call your MCP servers through Hermes only for servers you add to plugins.entries.hermes-artifacts.mcp_allowlist, re-running a query without asking only when the agent ran that exact call in the chat (otherwise Hermes Desktop asks first; set require_approval to always ask); the agent may suggest the allowlist command, and on an unsandboxed terminal it could run it itself; runs your system node with a minimal environment to calculate sheets; the optional browser viewer listens on 127.0.0.1 only; no telemetry."
maintainer: MrSakal
