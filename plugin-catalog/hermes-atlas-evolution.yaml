readme: true
description: "Self-improvement and care for a whole Hermes home: turns tool failures that keep coming back into short lessons the agent reads, measures them and retires the useless ones; scores daily progress (Evolution index); runs Hermes' own doctor checks per profile offline; points out conflicting, duplicate or never-loaded plugins, unused skills and memory repeats; and vetoes agent commands that would take Hermes down. Terminal menu (`hermes evolution`) and a dashboard tab. Disclosure — No network access of its own and no telemetry; the reflector (on by default, at most 6 calls a day) sends redacted tool-error excerpts to the model you configured, through Hermes. It reads, read-only, every profile of the Hermes home (config.yaml, state.db, logs/agent.log, MEMORY.md/USER.md, skills, cron jobs, plugins and their install records), /proc, the hermes* systemd units and apt/dpkg state. It injects a lessons section into the system prompt and registers a pre_tool_call guard. By default (Assist mode) it changes only one thing on its own: an entry repeated word for word between MEMORY.md and USER.md (a backup copy is kept). In Auto mode, which you turn on, it also runs Hermes' own commands unattended (`curator lock`, `plugins install` by catalog name, `pm gc` weekly) and can rewrite and start a broken gateway systemd user service; every change except `pm gc` can be undone. Child processes never inherit YOLO or auto-approve variables. The owner-run `evolution system upgrade` runs apt as root and keeps a root-only snapshot of /etc."
