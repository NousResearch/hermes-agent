sha: 431c5fa31eceb5341504ef71db5b4bdb8d493036
description: >-
  Proactive follow-ups: reads the recent conversation, finds things worth returning to
  (care / utility / risk / curiosity) and comes back at the right moment — a check on the
  weather before a trip, the price of something bought yesterday, or just "did your throat
  get better?". Event-driven rather than a daily digest: a cheap no-LLM gate runs on the
  cron tick and only wakes the agent when something is actually due. Sending goes through
  followups.py send, which enforces the 90-minute cooldown, the 23:00–08:00 quiet window,
  muted categories, at most three items and six lines per message, and records the receipt
  immediately.
  Disclosure — it reads the Hermes session database (~/.hermes/state.db), read-only, only
  rows owned by the configured owner in their own DM/group topics, plus the cron job store
  (~/.hermes/cron/jobs.json) when doctor runs; it writes only its own plugin-data directory,
  copies two helper scripts into ~/.hermes/scripts/, and doctor --fix edits this plugin's own
  cron job via hermes cron edit. During a review the agent runs the plugin's helper and
  hermes send through its terminal tool; the optional offline scripts/decide.py calls
  hermes -z. No credentials are read and there is no telemetry.
maintainer: xiaok
tier: community
category: automation
