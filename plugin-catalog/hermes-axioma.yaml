title: Axioma
description: "Inline signal color in the agent's normal reply. The agent marks the few phrases that deserve a second look (stop, caution, go, whisper) and the plugin renders them per surface with color, a style cue and a word, never color alone: Desktop through KaTeX color, CLI/TUI through truecolor ANSI, Telegram/Discord/Slack as bold plus the word, SMS and email as the word only. Green renders only when a tool call Hermes reported as successful in this session backs it; a rarity budget caps marks per reply; in completed replies Axioma transforms, malformed tags in prose are removed when a recognized tag is present; malformed-only replies, preserved code and raw tags during streaming can still show brackets. A color-vision-safe palette and a style-and-words-only mode are one setting away. Secondary: an advisory card (intent, light, signal, question) staged before configured send/spend/spin/scrub tool calls and shown through Hermes's own approval prompt. Each card and notice carries a short card code (a keyed hash of the exact text shown, the tool, its arguments and the card id), logged when shown and again with the answer; /signals verify <code> reports in plain words whether what was staged, shown and answered line up (spec section 5.6, shown equals staged). New in 0.4.0, an optional Desktop half (Axioma Desktop): a living caduceus drawn in code shows the run (staff for the main agent, serpents for running workers, amber while Hermes waits on you, wings green only when a standing_proof tool call reports passed), with a side pane to change course or stop the main turn and each worker, two themes, and a switch for each part. New in 0.5.0, Axioma Charter: the axioma_charter tool and /charter command ask ten plain-English questions about what the agent may do and compile the answers into a readable CHARTER.md and a matching settings block for the owner to review and paste; it applies nothing itself. New in 0.6.0, two optional Desktop additions: an inline advice card the model may write in a reply on the Desktop surface only (light, one-sentence signal, who is affected, a question, and Hold / Go ahead buttons that only send that short reply to the same chat), and a small Axioma light on kanban board cards showing the worst advice recorded for that card's work. Advisor, not a gate: it never blocks, approves or executes anything. Disclosure — before configured send/spend/spin/scrub tool calls (by default send_message, email/post/publish tools, payment/checkout tools, cron and kanban creation, delegate_task, terminal deploy and git push/gh pr commands, and terminal rm/mv when no workspace is configured) it escalates the call to Hermes's own approval prompt with an advisory card, using a fresh rule key each time so remembered Session/Always approvals never skip later prompts; under cron and other unattended runs Hermes's approval policy (default deny) then refuses those calls; it never auto-approves or executes anything, makes no network, model or subprocess calls, reads credentials only as presence checks through agent.secret_scope, adds a short markup guide to the system context through pre_llm_call, rewrites the agent's reply text to render the marks, and writes metadata, salted span hashes and keyed card-code digests (no message bodies) to an owner-only SQLite file plus a separate owner-only key file under its own plugin data directory. Optional operator-configured preflights probe file-presence metadata for required SKILL.md paths under external skill roots and lstat metadata for external device-lock paths; the policy resolves configured workspace/output roots and candidate remove/move paths, including symlinks, for containment checks, without reading those files' contents. Pasted-card verification optionally imports undocumented gateway.platforms.base_exec_approval text helpers and agent.i18n.t behind one compatibility function to recognize localized host framing, falling back to built-in English text if they are absent or change; it neither inspects approval state nor overrides approval. The optional Desktop half registers
  a right-side pane, a status-bar item, two themes, three palette commands, a settings page and a full-window canvas drawn over the app at low opacity (7-24%) with pointer events off; it subscribes to all gateway events but uses only event types, worker id/goal/status/tool-count/tool-name fields and the passed boolean of a standing_proof result, never message text; on a button press it calls session.steer, session.interrupt, subagent.steer or subagent.interrupt with the text the user typed; it keeps its on/off switches in local plugin storage and makes no network or model calls. The axioma_charter tool and /charter command write two local files, CHARTER.md and charter-settings.yaml, in a charter folder inside the plugin's own data folder and read them back; they make no network or model call, never edit config.yaml or any profile, and apply nothing. The card-code key must be owner-only; if its permissions cannot be confirmed, durable verification is refused."
