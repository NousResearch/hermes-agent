version: "0.2.0"
title: Axioma
description: "Inline signal color in the agent's normal reply. The agent marks the few phrases that deserve a second look (stop, caution, go, whisper) and the plugin renders them per surface with color, a style cue and a word, never color alone: Desktop through KaTeX color, CLI/TUI through truecolor ANSI, Telegram/Discord/Slack as bold plus the word, SMS and email as the word only. Green renders only when a tool call Hermes reported as successful in this session backs it; a rarity budget caps marks per reply; malformed tags never leak. A color-vision-safe palette and a style-and-words-only mode are one setting away. Secondary: an advisory card (intent, light, signal, question) staged before configured send/spend/spin/scrub tool calls and shown through Hermes's own approval prompt. Advisor, not a gate: it never blocks, approves or executes anything. Disclosure: no network, model calls, subprocesses, background threads, telemetry or credential reads (agent.secret_scope.get_secret is used for presence only, for an optional provider-conflict check); writes flag metadata (no message bodies) to SQLite under its own plugin data directory; adds a short markup guide to the system context through pre_llm_call."
maintainer: percyhendrux123-prog
tier: community
category: tools
requires_hermes: ">=0.22.5"
docs_url: https://github.com/percyhendrux123-prog/hermes-axioma/blob/66b40e6c802c8b11da961b742b01dd0d958333bd/README.md
