known_issues:
  - "Signals are written by the model. A model that ignores the markup guide produces plain replies; nothing breaks, nothing is colored."
  - "Desktop color uses KaTeX inline math. Where the span or the reply would confuse Desktop's math parsing (code, links, stray $, characters KaTeX cannot draw), the phrase falls back to bold plus the word. Details in docs/HOST-GAPS.md."
  - "SCRUB detection for advisory cards is best-effort shell parsing: an unparsed remove/move is capped at CAUTION, and removes inside bash -c, eval, ssh, docker exec or scripts are not seen."
  - "Hermes shows only the first plugin's approval text, so when Axioma's card comes first another plugin's description is not shown (the human is still asked)."
