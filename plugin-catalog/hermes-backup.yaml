name: hermes-backup
repo: https://github.com/nizini-london/hermes-backup
sha: d9310525ab9d2fd0cd33e766f456941d069418a1
description: Encrypted restic backup and verified restore for the Hermes home — dual-target (local disk + S3), hot-database shadow copies, and a DR drill that proves restores actually come back.
maintainer: Shaun Xenon
tier: community
category: platform
requires_hermes: ">=0.22.5"
version: "0.1.0"
platforms: [linux, macos]
capabilities:
  provides_tools:
    - backup_status
    - backup_now
    - backup_list
    - backup_verify
    - backup_restore
    - backup_restore_commit
    - backup_drill
    - backup_setup
  provides_hooks: []
  provides_middleware: []
  requires_env: []
