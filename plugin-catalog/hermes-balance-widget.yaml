title: "Nine-Balance Whale Widget"
description: >-
  Nine AI provider balances in one desktop widget — live balance/usage and quota
  reads, token-based spend estimates with off-peak price windows, and an anime
  mascot per provider with rotating flavour lines (DeepSeek, MiniMax, GLM, Kimi,
  MiMo, ChatGPT, Claude, Gemini, Grok). Desktop-only: desktop/plugin.js inside
  the plugin SDK surface; no agent tools, hooks, middleware or env vars. Keys are
  entered in the widget's settings page and stored in plugin-scoped storage; the
  widget only calls those providers' official APIs. Ported from
  MeteorNOX/DeepSeek-Balance-Whale-Widget (MIT).
