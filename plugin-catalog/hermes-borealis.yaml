description: "A Hermes Desktop theme with a live dithered landscape behind the window: aurora curtains over mountain ridges and a mirroring lake by night, a two-ink pink and teal dawn by day. Install once, then switch with /skin borealis. Disclosure — theme-only desktop plugin: it registers one theme through the plugin SDK, and its stylesheet restyles parts of Desktop's own UI (tabs, composer, sidebar edge and background, wordmark colour) and clears the window's field backgrounds only while the theme is active, and the scene fades back behind text. While active it also adds one canvas behind the app and draws the scene on it with WebGL, watches the root element's theme, mode and accent attributes to show, recolour or remove that canvas, and reads the pointer's horizontal position to slide the ridges. No images or fonts; no network requests, no agent tools or hooks. The repo also ships borealis-cli, a still terminal skin for the CLI and TUI, installed separately by copying one YAML file into ~/.hermes/skins/."
