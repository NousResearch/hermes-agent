description: "Desktop fleet page plus a per-bot Home (status, metrics, alerts, tasks, routines, buttons) published by the bot as JSON. Disclosure — reads each local profile's home files, can run a declared cron routine from the UI, and opens chat, a path, or a URL the bot declared. Bot-declared run_action buttons run a script from the bot's home/actions/ folder. A script runs only after the user approves that exact file (SHA-256), is re-approved if it changes, and is limited to 30s and to that folder. No database, signup, or telemetry."
