name: hermes-cartographer
version: "1.0.0"
repo: https://github.com/nnazinwaogu/hermes-cartographer
sha: f8b6739af2aaa2f0da2c7c392e9d69e404deedee
description: "Code intelligence for Hermes Agent: a token-budgeted repo map, symbol definitions and references, deterministic first-turn context injection, and AST-safe cross-file rename for Python, backed by an incremental SQLite index. Four tools (code_map, symbol_find, symbol_refs, symbol_rename), one pre_llm_call hook, and /carto plus `hermes carto` subcommands. Disclosure: reads source files under the roots you configure and writes only its own index under plugin-data/hermes-cartographer/. No network, no model calls, no shell, no third-party dependencies."
maintainer: nnazinwaogu
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/nnazinwaogu/hermes-cartographer#readme
platforms: [linux, macos, windows]
capabilities:
  provides_tools: [code_map, symbol_find, symbol_refs, symbol_rename]
  provides_hooks: [pre_llm_call]
  provides_middleware: []
  requires_env: []
readme: true
