description: "Share Hermes Desktop conversations as long PNG screenshots, self-contained HTML, Markdown, JSON, or PDF — per-turn selection with gutter drag range-select, search, collapsing and share-scope control; light/dark theme override with syntax-highlighted code; remembered export preferences; session info (model, thinking level, cache hit, tok/s, Hermes version) in every export header and footer. The Hermes Desktop counterpart of dsh-share. Disclosure — makes no network calls; reads the conversation you share through the gateway's session.history / session.usage RPCs and the session.info gateway event, plus the session list for titles; writes to the clipboard or downloads a file only when you trigger an export. HTML exports keep the conversation's image and link URLs, which load when the file is opened."
