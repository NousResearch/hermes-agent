description: Share Hermes Desktop conversations as long PNG screenshots, self-contained HTML, or Markdown — per-turn selection, turn gutter, search, per-turn collapsing and session metadata. The Hermes Desktop counterpart of dsh-share. Disclosure — community plugin, not a Nous product; zero network calls (no `fetch`/`XMLHttpRequest`/`WebSocket` in the source); reads only the user's own sessions through the canonical `session.history`/`session.info` gateway RPCs; writes to the system clipboard or triggers file downloads only on explicit clicks.
