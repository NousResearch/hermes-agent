description: "A Hermes Desktop pane that edits and exports real video with your own FFmpeg — timeline, text, colour, speed, seven transitions — and carries a cinematic engine inside that writes the voiceover first and times every camera move to it. No account, no upload, no watermark, no telemetry. Disclosure — the pane starts a local video service on 127.0.0.1 protected by a per-install token and runs your own FFmpeg and Python helper scripts on your machine; with no keys set it makes no network calls, while optional providers you turn on send prompts or narration text to image.pollinations.ai, Microsoft edge-tts, Google Gemini, ElevenLabs or a custom HTTPS endpoint you configure, and the cinematic font step downloads fonts from GitHub. The cinematic pipeline runs each stage with a deliberately narrow environment, and the verifier now reports a check it could not evaluate as skipped instead of counting it as a pass."
maintainer: Tormen28
