description: >-
  Cloud Files for Hermes Desktop — browse, search, create folders and bulk-upload files and whole folders to the
  machine your agent runs on, read and edit its Markdown and text files (view first; nothing is written until you
  review the line diff and press Save), import files from the agent's own Google Drive, and hand the agent file
  locations from the chat + menu without re-uploading. Built for remote gateways (token or sign-in); works locally
  too. Disclosure — adds a file API to the gateway (dashboard plugin routes under the gateway's existing auth) that
  lists and searches the agent's working folders, reads Markdown and text files there, creates folders and writes
  uploaded or imported files. It overwrites only an existing Markdown or text file you explicitly Save in its editor
  (refused if the file changed since you opened it), never deletes, never follows links out of those folders, and
  never reaches the agent's Hermes home. Its only network use is Google Drive, on request and read-only, through the
  agent's own google-workspace skill (the plugin never reads the Google token); otherwise it makes no network calls.
