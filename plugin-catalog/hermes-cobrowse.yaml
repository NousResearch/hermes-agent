title: "Hermes CoBrowse"
description: "Real-time multi-window spatial co-browsing canvas and interactive human-in-the-loop web automation for Hermes Agent and Desktop with CDP screencasting, 8-way window resizing, Inspector Studio telemetry, and 2FA handoff. Disclosure — launches headless Chromium processes via Playwright and runs a local loopback HTTP/WebSocket server on 127.0.0.1:9876+; navigates to agent-supplied URLs and executes agent-supplied JS via cobrowse_eval_js; reads no local credentials or .env files and sends no external analytics."
maintainer: sandman-sh
tier: community
category: desktop
requires_hermes: ">=0.22.0"
