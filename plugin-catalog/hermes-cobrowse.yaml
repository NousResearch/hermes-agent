title: "Hermes CoBrowse"
description: "Real-time multi-window spatial co-browsing canvas and interactive human-in-the-loop web automation for Hermes Agent via a localhost web studio with CDP screencasting, 8-way window resizing, Inspector telemetry, and 2FA handoff. Disclosure — launches headless Chromium with a minimal sanitized env and runs a token-authenticated localhost server on 127.0.0.1:9876+ with Host/Origin checks; blocks local files and private/link-local IPs by default across redirects, redacts password/OTP values in DOM state, executes agent-supplied JS via cobrowse_eval_js, reads no local credentials, and sends no external telemetry."
maintainer: sandman-sh
tier: community
category: desktop
requires_hermes: ">=0.22.0"
