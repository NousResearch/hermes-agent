  provides_hooks: [post_tool_call, on_session_end]
  provides_middleware: []
  requires_env: []
known_issues:
  - "Each run makes several model calls on the providers you assign (shown as an estimate before it starts, with a budget cap, default $2). Subscription routes count $0 toward the budget; unknown API prices are not treated as free and can be entered by hand."
  - "Research first needs a web search provider set up in Hermes. Without one, the run goes on from your own evidence and says why."
  - "Pricing and billing detection read Hermes internals (agent.usage_pricing), all fail-soft; if those move in a future release, cost shows as unknown rather than wrong."
