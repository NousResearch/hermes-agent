  - https://raw.githubusercontent.com/abualnassr/hermes-committee/1db580442020af584bd17345f4ec743f03b2f1a8/docs/images/brief.png
  - https://raw.githubusercontent.com/abualnassr/hermes-committee/1db580442020af584bd17345f4ec743f03b2f1a8/docs/images/convene.png
