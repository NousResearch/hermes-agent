version: "0.4.2"
title: Hermes Committee
description: "A committee of AI models for hard decisions. You set the seats (each with its own role and model) and a chairman; the seats answer independently, rank each other's answers blind, debate the points they disagree on, and the chairman writes a decision with confidence, dissent, role-fit notes and next actions with owners. Evidence files (PDF, Word, Excel, CSV, text, photos) go to every model as cited [E1] passages; optional Research first searches the web once through Hermes's own web tools and adds checked [W1] passages before the seats start. Time and budget limits with a mid-run ask to extend, follow-up runs, saved committees, a live Desktop page (Brief, Convene, Decision) and a Markdown + PDF report. Disclosure — one run makes several calls through ctx.llm to each seat's and the chairman's model on your existing Hermes providers (typically 2-4 per seat plus 1-3 for the chairman; an estimate and a budget cap are shown before it starts; clerical steps ask for low reasoning, answers and the verdict for medium); with Research first on, the question (never file contents) goes to the web search provider set up in Hermes and up to 6 pages are read through web_extract; evidence files the user picks or names in chat are read and their text is sent to every participating model (paths named in chat inside the Hermes folder or matching known credential files are refused); runs, reports and evidence copies are kept under the plugin's data directory; the Desktop page's Convene button starts a new Hermes chat in the background to run the committee; a run uses worker threads inside Hermes and no background process outlives it; pricing reads Hermes internal pricing tables; no credentials read or stored; no telemetry."
maintainer: abualnassr
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/abualnassr/hermes-committee/blob/1db580442020af584bd17345f4ec743f03b2f1a8/README.md
readme: true
platforms: [linux, macos, windows]
