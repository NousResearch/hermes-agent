title: Composer Spellcheck
description: "Spell check for the Hermes Desktop composer - Desktop-only, one desktop/plugin.js inside the plugin SDK surface, with no agent tools, hooks, middleware or environment variables. It contributes right-click spelling suggestions as rows in the app's own composer context menu through the SDK's COMPOSER_AREAS.contextMenu contribution, so the app renders, orders and caps them and the plugin never draws, queries or mutates a menu of its own; candidates are ranked with Damerau-Levenshtein distance over the standard SCOWL/Hunspell English dictionary - the corpus Firefox and LibreOffice ship - embedded and affix-expanded at load. It keeps the dictionary's capitalisation: a lowercase proper noun such as 'english' is flagged, and the suggestion offered is the capitalised 'English'. Those rows need a newer Hermes than 0.22.5: the composer context-menu seam is upstream PR #143678, merged on 2026-10-23 and in no release yet. Hence requires_hermes is 0.22.5 - the current release, not newer - because on 0.22.5 the plugin still loads, the dictionary and the Custom Words page work, and it says so once when the right-click suggestions are unavailable instead of being refused. The red squiggles need the app to expose host.composer.setSpellcheck, which is in an open upstream PR and is in no release yet; the plugin feature-detects it, and until that lands its own suggestions work while Chromium's underline stays off - there is deliberately no DOM-attribute fallback. Words are managed on the Custom Words page and each one is added to the app's own spell-check dictionary through the SDK (host.spellcheck.addWord, removed symmetrically with removeWord), so a word you add is remembered by the app itself. Disclosures: the plugin keeps one write to the composer's DOM - with 'Ignore code spans' on it wraps backtick code spans in <code spellcheck=\"false\">, because no SDK surface exists yet for marking a region as non-prose (an upstream request is filed); and for a non-English locale it fetches that locale's .dic/.aff word list from raw.githubusercontent.com (the wooorm/dictionaries repo, pinned to a commit SHA), while English is embedded so an English user is fully offline - the fetched files are data only, and no code is fetched or executed."
