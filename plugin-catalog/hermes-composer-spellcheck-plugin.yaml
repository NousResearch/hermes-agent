sha: "3e7083206f942ec18a46dfbf62e184c9ea5e546f"
title: Composer Spellcheck
description: "Spell check for the Hermes Desktop composer. Restores the red squiggles the app opts out of, and adds a right-click suggestion menu ranked with Damerau-Levenshtein over the standard SCOWL/Hunspell English dictionary - the corpus Firefox and LibreOffice ship - so right-clicking a misspelling offers ranked alternatives inside the app's own Cut/Copy/Paste menu. Keeps the dictionary's capitalisation: a lowercase proper noun such as 'english' is flagged, and the suggestion offered is the capitalised 'English' that Chromium accepts. Adds a Custom Words page for words you add, which are written to Chromium's own custom dictionary so the native underline clears immediately. Disclosure - the plugin writes to Chromium's Custom Dictionary.txt in the app's user-data directory, and fetches a non-English dictionary from raw.githubusercontent.com on demand when the Language setting is not English. Desktop-only (desktop/plugin.js inside the plugin SDK surface); no agent tools, hooks, middleware or env vars."
