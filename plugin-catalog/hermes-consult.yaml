known_issues:
  - Requires Node.js 24 or later and a separately provisioned public HTTPS origin.
  - Subscription voice requires Hermes Live 0.9.1+ (consultation API; the catalog currently lists 0.9.0) and the user's installed Codex CLI login.
  - Funded OpenAI API voice E2E and production HTTPS/load verification remain outstanding.
