description: "Website voice consultations with an embedded server and bilingual Desktop settings. Disclosure — starts a local Node consultation server on 127.0.0.1 that you publish through your own HTTPS reverse proxy, so website visitors can send questions that are answered by your active Hermes model (one tool-less ctx.llm call per question, using your provider credits); stores business data, inquiries and usage in <HERMES_HOME>/consult/; voice sends audio to OpenAI, and the optional subscription voice lane launches your installed Codex CLI (its own login) or the Hermes Live module from the same profile; optional Turnstile contacts Cloudflare."
maintainer: dandacompany
tier: community
category: voice
requires_hermes: ">=0.22.5"
version: "0.2.3"
title: hermes-consult
