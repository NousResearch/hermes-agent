description: "Always-on context runway, live token generation speed (tok/s), Claude Code /context-style category breakdown, DIY status bar, multi-bot and multi-currency spend tracking, and in-place auto-compaction and memory budget controls for Hermes Desktop (EN / 中文). Desktop-only (desktop/plugin.js); no agent tools, hooks, middleware, or env vars. Disclosure — the Policy tab reads and updates only the active profile's compression.*, context.engine, and memory.* keys via window.hermesDesktop.api (/api/config and /api/config/schema) upon explicit user interaction (the plugin SDK has no route to those endpoints); preferences stay in plugin storage and nothing is sent to external hosts or reads credentials."
