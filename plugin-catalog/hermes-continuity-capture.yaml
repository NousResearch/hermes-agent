name: hermes-continuity-capture
repo: https://github.com/Goitonthefloor/hermes-continuity-capture
sha: f501eb0122110862f568940d70e5ef7935adbbe6
description: 'Records Hermes lifecycle events (session, subagent, and kanban task) as Continuity schema-v2 events in a local SQLite spool under the plugin data directory, and can forward them to a NATS/JetStream server you run yourself. Disclosure - binds nine lifecycle hooks and writes SQLite (spool_path defaults to spool.db in the plugin data directory, 90-day retention, periodic sweep; the file grows with event volume); free-text fields (prompts, tool results, args, summary, reason, tool_call_history) are dropped before the INSERT and only their length is kept, unless record_full_prompts is explicitly enabled. Delivery is opt-in: the default publish_mode is spool-only (nothing leaves the host); in core/jetstream mode a background thread publishes to your own NATS endpoint using the bundled standard-library client, and failed deliveries stay as error rows and are retried. Only the NATS server itself is external - it is not part of this plugin. Inactive until an operator enables it.'
maintainer: Goitonthefloor
tier: community
category: automation
requires_hermes: ">=0.21.5"
version: "0.2.1"
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_start
    - on_session_end
    - on_session_finalize
    - post_tool_call
    - subagent_start
    - subagent_stop
    - kanban_task_claimed
    - kanban_task_completed
    - kanban_task_blocked
  provides_middleware: []
  requires_env: []
