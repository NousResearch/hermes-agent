name: hermes-continuum
repo: https://github.com/mohamad-shafeez/hermes-continuum
sha: 5da4774fb7453447aeae61f3d3288dbbf20d914c
version: "0.3.0"
description: >-
  An integrated nine-system plugin for Hermes Agent that provides task
  continuity, review-first episodic memory, environment reality checks,
  evidence tracking, goal integrity, trust-aware tool policies, impact
  previews, retry-loop protection, and verified workflow distillation.
  Its systems share an append-only SQLite Event Spine and a Continuum
  Console for Hermes Desktop. Includes 12 tools, 11 lifecycle hooks,
  checkpoint export, and a review-first approach to generated artifacts.
  Live verification and test coverage are documented in the repository;
  not every capability has been verified in a live host workflow.
maintainer: mohamad-shafeez
tier: community
category: desktop
requires_hermes: ">=0.22.2"
docs_url: https://github.com/mohamad-shafeez/hermes-continuum#readme
readme: true
platforms: []
