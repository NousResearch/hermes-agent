  - https://raw.githubusercontent.com/mohamad-shafeez/hermes-continuum/5da4774fb7453447aeae61f3d3288dbbf20d914c/docs/screenshots/continuum-security-fresh.png
  - https://raw.githubusercontent.com/mohamad-shafeez/hermes-continuum/5da4774fb7453447aeae61f3d3288dbbf20d914c/docs/screenshots/continuum-security-checkpoints-fresh.png
capabilities:
