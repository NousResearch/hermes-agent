name: hermes-council
repo: https://github.com/girayk/hermes-council
sha: 18a66633acc045c251063721a1cf26f9a46d29de
description: LLM Council (karpathy/llm-council) as a Hermes plugin. Four fixed advisor
  seats (First-Principles Analyst, Skeptic, Pragmatist, Researcher) answer in parallel,
  anonymously review and rank each other, and a Chairman model synthesizes the final
  answer. Members borrow your existing provider credentials - no API keys. Registers
  a Council group in every model menu, a council_deliberate tool, /council, hermes
  council CLI, and a desktop panel.
maintainer: girayk
tier: community
category: models
version: "1.0.0"
