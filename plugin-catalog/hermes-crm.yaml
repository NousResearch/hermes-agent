name: hermes-crm
title: HermesCRM
repo: https://github.com/gptnius/hermes-crm
sha: da1d1412eaf10c3ea8ba0b4431cafdbc59c6bcae
description: "Native relationship management with agent tools, linked records, reports and dashboards. Disclosure — on your request the agent creates one-shot Hermes cron jobs (task follow-ups, internal CRM analysis assignments, and scheduled research runs that use Hermes' web/search tools on a public question you approve); jobs run unattended with CRM-only plus those tools, deliver locally, and cannot schedule further jobs. Optional PostgreSQL storage sends CRM records to the database URL you configure."
maintainer: gptnius
tier: community
category: desktop
requires_hermes: ">=0.23.0"
docs_url: https://github.com/gptnius/hermes-crm/blob/da1d1412eaf10c3ea8ba0b4431cafdbc59c6bcae/docs/USER_GUIDE.md
version: "0.1.0"
readme: true
known_issues:
  - "Small-workspace prototype; legacy record lists and form choices are bounded at 500 records."
  - "Native Desktop checked on macOS; broader platform, keyboard and accessibility coverage remains incomplete."
  - "Scheduled results require human review and do not establish that a business task is complete."
