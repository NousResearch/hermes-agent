description: "Operating skill for Hermes cron: lifecycle rules (pause vs disable vs remove, `in 30m` vs `30m`), four ways to avoid needless LLM runs (no_agent, wakeAgent pre-check, monitor, [SILENT]), verify-after-change, a layered runbook and a read-only doctor that complements `hermes cron doctor`. Portable Agent Plugins v1 package (plugin.json + skills/); no tools, hooks, middleware or env vars. Disclosure — no network calls; the doctor reads ~/.hermes/cron/jobs.json, ticker stamps and executions.db (read-only), writes nothing, and runs the local `hermes cron doctor` as an argument list without a shell."
