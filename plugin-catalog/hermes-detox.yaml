name: hermes-detox
repo: https://github.com/kellycryptos/hermes-detox
sha: c80180c302cbaf61aecbf433b7eb6f84a8913140
version: "0.1.0"
title: "Hermes Detox"
description: >-
  Tool output firewall for Hermes Agent. Intercepts oversized tool and terminal outputs before truncation, archives full raw text in local zero-network SQLite WAL storage, and provides compact, content-aware summaries with surgical line retrieval and search tools.
maintainer: kellycryptos
tier: community
category: tools
requires_hermes: ">=0.19.0"
docs_url: https://github.com/kellycryptos/hermes-detox#readme
readme: true
platforms: []
capabilities:
  provides_tools:
    - detox_inspect
    - detox_search
    - detox_status
  provides_hooks:
    - transform_terminal_output
    - transform_tool_result
    - on_session_reset
  provides_middleware: []
  requires_env: []
