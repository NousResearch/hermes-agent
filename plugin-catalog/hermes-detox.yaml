name: hermes-detox
repo: https://github.com/kellycryptos/hermes-detox
sha: 6a8e7b81f55134a856ced9592884d8a72aeb3efd
version: "0.1.0"
title: "Hermes Detox"
description: "Tool output firewall. Saves redacted tool output locally (unencrypted; redaction is pattern-based and can miss secrets; no network), gives the model a compact report, and retrieves exact lines on demand."
maintainer: kellycryptos
tier: community
category: tools
requires_hermes: ">=0.22.3"
docs_url: https://github.com/kellycryptos/hermes-detox#readme
readme: true
platforms: []
capabilities:
  provides_tools:
    - detox_inspect
    - detox_search
    - detox_status
  provides_hooks:
    - transform_terminal_output
    - transform_tool_result
    - on_session_reset
    - post_compaction
    - on_session_delete
  provides_middleware: []
  requires_env: []
