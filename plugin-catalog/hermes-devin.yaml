subdir: ""
title: Hermes Devin
description: 'Delegate coding tasks to the Devin CLI, on your computer or in Devin Cloud, with live progress
  cards and change review in Hermes Desktop. Every launch goes through Hermes approval; Cloud runs need a
  separate Cloud-managed-permissions confirmation. Disclosure: spawns the vendor devin CLI from PATH (devin
  acp, devin acp --cloud, devin auth status, devin models list), which edits files and runs shell commands
  in the chosen folder under the configured permission mode and talks to Cognition''s servers; uses the
  existing Devin CLI login and stores no credentials; Hermes provider, bot and tool secrets are stripped
  from the child environment; background runs continue after the turn up to their timeout; run history
  (prompts, diffs, command output) is saved under plugin-data/devin unless persist_runs is off. Independent
  community add-on, not affiliated with Cognition.'
maintainer: Adolanium
tier: community
category: tools
docs_url: https://github.com/Adolanium/hermes-devin#readme
