name: hermes-discord-rpc
repo: https://github.com/DarRahman/hermes-discord-presence
sha: 37ad1fb303ca86853dd96134b3dbe6b511f875a5
description: >-
  Native Discord Rich Presence (RPC) integration for Hermes Agent — real-time session, model, token, and tool tracking with local-only IPC. Disclosure — publishes your most recent session title, model name and token total to the local Discord client as Rich Presence every 3 s (visible to other Discord users); reads ~/.hermes/state.db read-only; on Linux may scan running Discord processes' environment via psutil to find XDG_RUNTIME_DIR; writes a small presence-ownership file in XDG_RUNTIME_DIR (or the system temp dir) and, under herdr, queries the local HERDR_SOCKET_PATH socket for pane focus.
maintainer: DarRahman
tier: community
version: "1.2.5"
category: general
docs_url: https://github.com/DarRahman/hermes-discord-presence/blob/main/README.md
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_end
  - on_session_finalize
  provides_middleware: []
  requires_env: []
