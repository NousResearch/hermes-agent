name: hermes-dpapi-secrets
repo: https://github.com/Yicheng-Mark/hermes-dpapi-secrets
sha: c1651a401370013493903883d7ec4a1c90731b41
description: >-
  Resolve Hermes environment variables at startup from a single secret file encrypted with
  the Windows Data Protection API, instead of keeping provider keys in plaintext in .env or
  auth.json. Config is secrets.dpapi.map, an ENV_VAR -> store-name mapping (bare names or
  dpapi:// names) plus an optional file path (default <HERMES_HOME>/secrets.dpapi). The file
  is one DPAPI blob keyed by the current Windows user profile, so it is unreadable by another
  Windows account and worthless off the machine; it is written by the bundled CLI
  (python -m hermes_dpapi_secrets set NAME, value read from a prompt or stdin, never from
  argv) and only read at runtime. Mapped names that are missing or empty are skipped with a
  warning; a file that is not ours, a blob this user cannot decrypt, or a payload that is not
  a flat string map is reported as an error with nothing injected. Disclosure - this source
  decrypts a file for every Hermes process that enables it: resolved values become
  environment variables of the Hermes process and its children, exactly like .env entries,
  so anything that can read that environment can see them. User-scope encryption only (the
  machine-wide flag is never used and is not exposed), and the at-rest protection is a bar
  for backups, cloud sync and dotfiles, not a boundary against code already running as the
  same user. Stdlib-only (ctypes): no Python dependencies, no subprocesses, no network calls,
  no self-update. Windows only. Applying fetched values stays the orchestrator's job; the
  plugin never writes os.environ itself.
maintainer: Yicheng-Mark
tier: community
category: tools
requires_hermes: ">=0.21.4"
docs_url: https://github.com/Yicheng-Mark/hermes-dpapi-secrets#readme
version: "0.1.0"
platforms:
- windows
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
