description: "Nightly deterministic memory consolidation (\"dreaming\"): corroborates candidate facts with what humans actually said on distinct days, proposes the few worth keeping with a verbatim edit anchor, asks whether stale memory entries still hold, and wakes the agent only when there is work — including a memory file close to its char limit. Fact sources: the holographic store, a SQLite or JSONL export, or none. Portable Agent Plugins v1 package (plugin.json + skills/); no tools, hooks, middleware or env vars. Disclosure — scripts make no network or LLM calls and read state.db and the fact store read-only (plus Hermes config.yaml's memory/timezone keys and the pending/memory approval queue); the user-run installer copies two gate scripts into $HERMES_HOME/scripts, seeds $HERMES_HOME/dreaming.json and creates (or with --rebind re-points) two Hermes cron jobs, through Hermes' cron API, bound to this plugin's own skill with only the memory toolset; with a chat --deliver target the report is attached as a session you can reply to. Those agent runs send recent human messages (up to 200 / 40k chars) and fact snippets to your configured model; state goes to $HERMES_HOME/cache and a diary to $HERMES_HOME/memories/DREAMS.md (configurable); memory files are changed by the agent through the regular memory tool, and with the holographic provider it also adds candidate facts via fact_store lowers trust on human-rejected facts via fact_feedback and, when keywords.enabled is set (off by default), adds search keywords to facts via fact_store update."
