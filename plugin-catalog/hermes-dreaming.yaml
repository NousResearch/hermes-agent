known_issues:
  - "Duplicate detection is a heuristic for questions, not proof that facts mean the same thing. Old facts require the owner to approve both complete texts. This section is disabled without holographic 0.19.0, outside profile scope, or when the provider database cannot be verified; a merge has no automatic unmerge."
  - "Cron maintenance requires a single configuration writer; the public cron update API cannot atomically reject every concurrent manual edit. A paused job may already have an execution in progress."
