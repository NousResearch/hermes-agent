subdir: ""
description: "Role-based authorization for Hermes Agent: OWNER, ADMIN, USER, GUEST roles, default-deny, per-tool and per-bot scoping, tamper-evident receipts, governed Linear issue creation, and versioned policy sync. Disclosure — a local Node MCP server whose principal is one static identity per profile (OWNER by default), so everyone who can talk to that profile acts as that principal; its roles govern only its own eight tools, not Hermes tools. `entity54_linear_create_issue` creates issues on api.linear.app with your LINEAR_API_KEY without a Hermes approval prompt; it needs a one-time `npm ci --omit=dev` in the installed `server/` directory and a manual `node scripts/setup.mjs` run that writes the signing keys to a local env file you copy into the profile `.env`."
maintainer: AGENTROPOLIS
tier: community
category: tools
