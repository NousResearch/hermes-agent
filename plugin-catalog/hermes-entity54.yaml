platforms: []
capabilities:
  provides_tools:
  - entity54_authorize
  - entity54_linear_create_issue
  - entity54_policy_export
  - entity54_policy_import
  - entity54_policy_activate
  - entity54_receipts_verify
  - entity54_events_list
  - entity54_status
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - ENTITY54_DATA_DIR
  - ENTITY54_PRINCIPAL_ID
  - ENTITY54_BOT_ID
  - ENTITY54_POLICY_KEY
  - ENTITY54_PSEUDONYM_KEY
  - ENTITY54_EVENTS_ENABLED
  - ENTITY54_LINEAR_TRANSPORT
  - LINEAR_API_KEY
known_issues:
- "Requires Node 22+ and a Hermes Agent install that supports Agent Plugins 1.0.0."
- "After install, run npm ci --omit=dev once inside the installed plugin directory (server/) to install the MCP server dependency."
- "Live Linear transport needs a LINEAR_API_KEY; without it Linear calls fail closed as not configured. A mock transport is available for demos and tests."
