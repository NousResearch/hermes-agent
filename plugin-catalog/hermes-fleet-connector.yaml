name: hermes-fleet-connector
title: Hermes Fleet Connector
repo: https://github.com/tony-simons-aiowa/hermes-fleet-connector
sha: "64dfb9a364c912952214a0996f114430b5d3573d"
description: "Owner-authorized Telegram pairing for Hermes Fleet through a separate connector service and private HTTPS origin. Phone invitations grant broad fleet:operator access. Disclosure — runs a separate connector service you start yourself, which launches a local `hermes serve` backend and a reverse proxy behind your HTTPS origin; a phone paired via a 120-second QR invitation (requested from your owner Telegram DM) gets broad operator access over the internet, including creating, editing and deleting cron jobs (unattended agent runs), dispatching Kanban tasks and reading media; it opens a private browser window locally to show the QR and keeps a control socket in the system temp directory."
maintainer: tony-simons-aiowa
tier: community
category: platform
requires_hermes: ">=0.21.6"
version: "0.1.5"
readme: true
platforms: [linux, macos]
known_issues:
  - "Validated with clean stock Hermes v0.21.6 and v0.22.1, Python 3.14, and plugins.isolation: in_process."
  - "Requires qrencode and a logged-in local GUI session with a private browser window and screen; headless or SSH-only display is refused."
  - "WSL2 to Windows Edge browser paint is experimental; native Windows is unsupported."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
