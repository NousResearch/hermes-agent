sha: ccfe915767c94067d0cb3c17f775aa3b054782d6
title: Game Center
description: 'Real board and card games inside Hermes: chess, go, checkers, connect four, reversi, gomoku, hex, breakthrough, sea battle, blackjack and slots, each with its own rules engine and a referee that refuses an illegal move and records it. Play the built-in computer at four levels, a friend on the same screen, or your own Hermes model through the games_play tool. Disclosure: writes only its own plugin data folder; local play makes no network calls. Online play is off until the user turns it on; then it talks to https://games.hermesnet.xyz (run by the author, changeable via lobby_url) and sends the chosen display name, a recovery key at sign-in, and match moves; polling happens only while the page is open. No telemetry, no phone-home, no self-updater.'
maintainer: KeyArgo
tier: community
category: general
requires_hermes: ">=0.23.0"
