name: hermes-gauge
repo: https://github.com/Asoria-ai/hermes-gauge
sha: 3c3afe9738dc75f392cd4b137ae2871521143d0e
description: "Context gauge — a live ring/dash showing how full your agent's context window is, per session and topic, with a desktop plugin, a memory optimizer (levels lean/standard/roomy, skills grouped by source and category) and tools (gauge_check, gauge_report, gauge_set_window, gauge_render, gauge_action, gauge_setup). Runs fully local: no API key, no telemetry. Disclosure — reads Hermes' state.db (read-only) for session titles; `/gauge setup` (alias `/gauge memory`) and `gauge_setup` read config.yaml, SOUL.md, the memories folders (including other profiles' when run from the default profile) and skills/ for size metrics, and never edit; the plugin never rewrites a skill itself, but `/gauge review apply`, or the scheduled review when the user sets `memory.review_mode: split`, lets the agent split the user's own long skills listed on the split plan into SKILL.md plus references/ (never published or external skills, never categories in `memory.skip_categories`); `gauge_action` lets the agent queue `/compact` and `/new` in the current session when you answer a gauge alert; with `alerts.route` set to `home` or `custom:` it runs `hermes send` to deliver alerts to that chat; `/gauge review schedule` runs `hermes cron` to create a nightly review job; `gauge_audit()` called directly from Python without a format runs `hermes doctor`; writes only under plugin-data/hermes-gauge/."
maintainer: Asoria-ai
tier: community
category: desktop
docs_url: https://github.com/Asoria-ai/hermes-gauge
version: "0.7.0"
