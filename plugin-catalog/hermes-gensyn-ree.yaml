name: hermes-gensyn-ree
repo: https://github.com/TakeshiTGAL/hermes-gensyn-plugins
sha: 9325a7b15d815ca05983885ddd6615eae5f2b7a6
subdir: packages/ree
description: "ree_validate_receipt, ree_verify_receipt, ree_infer. Validate does not re-execute and does not stand behind text_output, finish_reason, token_count, model.name, or ree_version. Verify re-executes on CPU. Infer runs one of three small models and writes one receipt. Disclosure — Local image gensynai/ree:v0.8.0, not pulled. Your docker pull is consent to the REE-Binary-License. Verify and infer mount ~/.cache/gensyn and ~/.cache/huggingface; a token file there is visible; no token is passed in the environment; the network is not limited to Hugging Face. Approval every time. Refused: cron, yolo, approvals off, single-query, unattended, host isolation, a missing approval API, or a cut question. Validate uses network none, does not ask, and returns no receipt text. A gateway user can start containers on your Docker daemon. Disable with hermes tools. Choosing always does not cover the next call. No state under <HERMES_HOME>/plugin-data/hermes-gensyn-ree. Not a hostile-code sandbox. No cron is created."
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: ">=0.21.6"
version: "0.1.0"
platforms:
  - linux
  - macos
capabilities:
  provides_tools:
    - ree_validate_receipt
    - ree_verify_receipt
    - ree_infer
  provides_hooks: []
  provides_middleware: []
  requires_env: []
