known_issues:
  - "Turn off tool search for the profile (hermes config set tools.tool_search.enabled off): with it on, large boards often fail inside the search bridge."
  - "A Desktop that connects to Hermes on another machine needs the drawing half installed in that Desktop too (Capabilities → Plugins → Install from Git)."
capabilities:
