name: hermes-genui
repo: https://github.com/sagarmainkar/hermes-genui
sha: 43de4cdba042ebb087e44ccd6e0ba4f87769b67b
description: >-
  Generative UI for Hermes Desktop: the agent answers with interactive blocks drawn inside the
  chat reply (charts with hover cards, KPI cards, sortable tables, day-by-day plans, photo
  strips, calculators with sliders and live charts, forms, checklists that keep their ticks,
  and step-by-step explainers with flow diagrams, simulations and a 3D layer stack). The model
  sends data only (JSON blocks, never HTML, scripts or SVG); the plugin validates every block
  and draws it with its own components, in the app's theme. Telegram, the CLI and other chat
  apps get readable Markdown instead. Ships nine recipe skills (hermes-genui:trip-planner,
  compare, explain and more). Disclosure — network calls only when the model uses a tool:
  market prices from Yahoo Finance (query1.finance.yahoo.com); photos from the Wikimedia
  Commons and Openverse APIs, from Unsplash, Pexels or Tavily only when the user adds that key,
  from the user's configured web search, and from the head (at most 256 KB) of the top result
  pages; each photo host is contacted briefly to check the picture loads (https only, public
  addresses only, DNS pinned, redirects re-checked). Boards are saved as JSON under the
  profile's plugin-data/hermes-genui/ folder; a recipe the user asks to save becomes a profile
  skill through Hermes's own skill_manage (write approval applies); no telemetry and no
  account. Adds a short
  drawing rule to the system prompt and, in Desktop only, a one-line reminder next to
  messages that ask for something visual.
maintainer: sagarmainkar
