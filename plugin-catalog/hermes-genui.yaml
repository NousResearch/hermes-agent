sha: 8eec8194d16bdff25919fed01dc382c8de1471ec
description: "Generative UI for Hermes Desktop and the Hermes Webapp: the agent answers with interactive blocks drawn inside the chat reply (charts with hover cards, KPI cards, sortable tables, day-by-day plans, photo strips, calculators with sliders and live charts, forms, checklists that keep their ticks, weather and Up next cards, and step-by-step explainers with flow diagrams, simulations and a 3D layer stack). Since 0.3 it also keeps pages in the sidebar: a Today page kept by a personal assistant the user sets up, which tracks bills, renewals, orders and replies owed from mail and calendar until each is resolved (it never sends, pays, replies or deletes), and dashboards drawn from the user's MCP servers and tools that can be kept as pages and refreshed. The model sends data only (JSON blocks, never HTML, scripts or SVG); the plugin validates every block and draws it with its own components, in the app's theme. Telegram, the CLI and other chat apps get readable Markdown instead. Ships sixteen recipe skills (hermes-genui:trip-planner, compare, explain, dashboard, personal-assistant and more). Disclosure — network calls only when the model uses a tool or a page the user made is open, carrying the model's search words, a ticker or a city: market prices from Yahoo Finance (query1.finance.yahoo.com); weather and place lookup from Open-Meteo (api.open-meteo.com, geocoding-api.open-meteo.com); photos from the Wikimedia Commons and Openverse APIs, from Unsplash or Pexels only when the user adds that key, from Tavily when a TAVILY_API_KEY is set (including one already set for Hermes's own Tavily web search), from the user's configured web search, and from the head (at most 256 KB) of the top result pages; each photo host is contacted briefly to check the picture loads (https only, public addresses only, DNS pinned, redirects re-checked). Scheduled jobs — created only when the user asks, as ordinary Hermes jobs they can see, pause and remove (a job the user removed or rescheduled is put back only if they say yes): the assistant's check (every 30 minutes; new mail and calendar entries, read through the user's own MCP server or a built-in sample mailbox, go to the profile's model), an optional ideas job (web search only, no mail tools; it gets a few plain words per item) and one refresh job per kept dashboard (it repeats the recorded read-only tool calls and sends their results to the profile's model). The plugin starts these jobs with Hermes's own CLI (hermes cron run) when the user presses Refresh or new items need ideas. The plugin's 'No scheduled jobs that send data to the model' setting (plugins.entries.hermes-genui.settings.local_only, also in Desktop's plugin settings) turns the real-mail assistant, ideas and kept dashboards off for that profile, including jobs made before it was switched on. Stored under the profile's plugin-data/hermes-genui/ folder: boards as JSON, the assistant's settings and tracked items (titles, dates, amounts, senders, short facts, never mail text), kept dashboards with their recorded calls, and the Today layout; with the sample mailbox one small script is written to the profile's scripts/ folder and removed when the assistant is stopped. A recipe the user asks to save becomes a profile skill through Hermes's own skill_manage (write approval applies); no telemetry and no account. Adds a short drawing rule to the system prompt and, in Desktop only, a one-line reminder next to messages that ask for something visual, steering answers to blocks instead of Hermes's ::preview widgets."
