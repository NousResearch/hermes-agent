name: hermes-gruvbox
repo: https://github.com/AgileIndustrialComplex/hermes-gruvbox
sha: bb8d6e1a23460947374d46b7059815dec63dc8cb
description: >-
  Six Gruvbox themes for the Hermes Desktop app — dark and light, each in hard, medium
  and soft. Installing the pack writes its skins into <hermes home>/skins/ and has
  desktop/plugin.js contribute the same six to the app's own theme picker, with their real
  labels and descriptions instead of the app's hard-coded "Hermes skin". No commands,
  tools, hooks, middleware, credentials, network access or background work, nothing runs on
  a turn — it only writes its own skin files, never config.yaml, and it never overwrites a
  skin you edited or switches your active theme.
