name: hermes-guard
title: Hermes Guard
repo: https://github.com/elianjuan-g/hermes-guard
sha: 6b8a32db62a4944f2b1c3757bd64e998b638e0c1
version: "1.1.2"
description: >-
  Defensive prompt-injection guard for Hermes Agent: a pre_llm_call hook scans every inbound message locally (deterministic patterns, no model calls) for Unicode smuggling, hidden instructions, special tokens, and Base64-decoded payloads; a pre_tool_call hook blocks RCE/subshell patterns, sensitive credential paths, and call-ID races. High-confidence attacks are blocked; suspicious messages are quarantined for manual review via the guard_review tool (release is manual re-send by design). Includes a Predator pattern store (human-corrected signatures), a SHA-256 hash-chained ledger, secret redaction, a live Posture Score, a 28-vector simulation arena (21 message + 7 tool-arg), and a standalone Obsidian & Gold HUD. Python stdlib + SQLite only.
  Disclosure — no network calls, no credentials read or stored, no data leaves the machine, no core overrides, no self-updater.
  Phase 3 verified live on Hermes 0.21.5 (validate 13/13, doctor OK, plugins list enabled, live hook-fire test: attack blocked on both hooks, benign passed); v1.1.2 re-verified the same way (validate 13/13, live hook-fire test 19/19 through the real plugin dispatch, 168/168 tests).
maintainer: elianjuan-g
tier: community
category: tools
requires_hermes: ">=0.21.5"
docs_url: https://github.com/elianjuan-g/hermes-guard
known_issues:
  - "Quarantine release is manual re-send; there is no one-click release. release/delete are owner-only slash commands (/guard-release, /guard-delete); the model tool cannot call them."
  - "Talking about jailbreak phrases — for example, quoting one to discuss it — can be flagged, because the scanner sees the pattern, not the intent."
  - "Very short Base64 tokens (<20 chars, or token entropy <4.0) are skipped by design to avoid false positives on ordinary words."
  - "register() uses one register_tool(name, toolset, schema, handler) call — the single form matching the 0.21.5 signature and current Hermes alike, live-verified on 0.21.5."
  - "Subshell patterns ($(…), backticks) are checked only for command-running tools (terminal, execute_code, shell) and are bounded to 512 chars; backticks / $(…) in write_file / read / note content are not blocked."
capabilities:
  provides_tools:
    - guard_review
  provides_hooks:
    - pre_llm_call
    - pre_tool_call
  provides_middleware: []
  requires_env: []
