sha: 998880b838ed789e6f32330ca6519381a89ff94a
version: "0.1.1"
description: "Multi-user Hermes: share Hermes with family, friends and teammates on Telegram. Each person gets their own chat, separate memory and only the access you approve, from read-only access to one tool to temporary access that ends on its own. Change or end guest access anytime. Multiple Telegram users share one bot, with no second Hermes install. Say what to share in plain words or pick from a menu, review the card and approve, then send the invitation. Every call a guest makes is checked against a signed, expiring Tenuo grant before it runs. Read-only sharing needs a tool that keeps reading and changing separate. Disclosure — runs a maintenance task every minute while the gateway runs (renews grants, sends end-of-access notices, applies data retention and deletes ended guest profiles); runs each guest turn as a local Hermes agent process in a separate guest profile, with tool calls going through a server on 127.0.0.1 that checks the guest's grant and then runs the shared tool through the plugin tool-dispatch API, where other plugins' pre_tool_call guards do not see it; guest turns use the owner's configured model and quota (a Codex sign-in through credentialed_provider_request, API keys through the profile secret scope, handed to the guest process over a private pipe and never stored in guest profiles); creates and deletes guest profiles; once sharing is set up it answers every private Telegram message from anyone but the owner before Hermes's own pairing, so people the bot already admitted get only their scoped guest access instead of the full agent, and new people get a no-access reply instead of a pairing code; when the owner enables sharing, adds itself to an explicit Telegram tool selection; stores signing keys, grants, access records and activity in its plugin data folder; its pre_tool_call hook refuses tool calls from anyone but the owner in Telegram sessions and checks the owner's calls against an owner grant (falling back to Hermes unless require_owner_warrant is set); its pre_llm_call hook adds sharing context to the owner's Telegram turns; registers /guests and a Telegram handler for the owner and guest commands. No network calls of its own beyond Telegram and the model provider through Hermes; no telemetry, no self-update."
maintainer: tenuo-ai
tier: community
category: tools
requires_hermes: ">=0.22.6"
docs_url: https://github.com/tenuo-ai/hermes-guests/blob/v0.1.1/docs/how-sharing-works.md
