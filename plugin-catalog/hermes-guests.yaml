name: hermes-guests
title: Hermes Guests
repo: https://github.com/tenuo-ai/hermes-guests
sha: 456e2517432a4bef0e44314a4122c7aa2cb460d4
version: "0.1.0"
description: "Let someone use part of your Hermes from their own Telegram chat, for as long as you choose. Say it in plain words (\"let Mia read the recipes and add to the shopping list until Sunday\") or pick from a menu, review the card, approve, and send the invitation. Each guest gets their own Hermes profile, chat and memory, and every call they make is checked against a signed, expiring Tenuo grant before it runs. Change, extend or end access from your own chat. Disclosure — runs a maintenance task every minute while the gateway runs (renews grants, sends end-of-access notices, applies data retention and deletes ended guest profiles); runs each guest turn as a local Hermes agent process in a separate guest profile, with tool calls going through a server on 127.0.0.1 that checks the guest's grant and then runs the shared tool through the plugin tool-dispatch API, where other plugins' pre_tool_call guards do not see it; guest turns use the owner's configured model and quota (a Codex sign-in through credentialed_provider_request, API keys through the profile secret scope, handed to the guest process over a private pipe and never stored in guest profiles); creates and deletes guest profiles; once sharing is set up it answers every private Telegram message from anyone but the owner before Hermes's own pairing, so people the bot already admitted get only their scoped guest access instead of the full agent, and new people get a no-access reply instead of a pairing code; when the owner enables sharing, adds itself to an explicit Telegram tool selection; stores signing keys, grants, access records and activity in its plugin data folder; its pre_tool_call hook refuses tool calls from anyone but the owner in Telegram sessions and checks the owner's calls against an owner grant (falling back to Hermes unless require_owner_warrant is set); its pre_llm_call hook adds sharing context to the owner's Telegram turns; registers /guests and a Telegram handler for the owner and guest commands. No network calls of its own beyond Telegram and the model provider through Hermes; no telemetry, no self-update."
maintainer: tenuo-ai
tier: community
category: tools
requires_hermes: ">=0.22.6"
docs_url: https://github.com/tenuo-ai/hermes-guests/blob/v0.1.0/docs/how-sharing-works.md
readme: true
known_issues:
  - "Telegram private chats with one owner. Group chats and other messaging apps are not supported yet."
  - "Guests use the owner's model and quota. Guest turns support a Codex sign-in, API-key providers and local models."
  - "Profile and process separation is not an OS sandbox. Share only tools whose effects you would accept from the guest."
capabilities:
  provides_tools:
    - guests_discover
    - guests_prepare_access
    - guests_list_access
    - guests_activity
    - guests_repair
    - guests_status
    - guests_data
    - guests_never
  provides_hooks:
    - pre_tool_call
    - pre_llm_call
  provides_middleware: []
  requires_env: []
