known_issues:
  - "Telegram private chats with one owner. Group chats and other messaging apps are not supported yet."
  - "Guests use the owner's model and quota. Guest turns support a Codex sign-in, API-key providers and local models."
  - "Profile and process separation is not an OS sandbox. Share only tools whose effects you would accept from the guest."
capabilities:
  provides_tools:
    - guests_discover
    - guests_prepare_access
    - guests_list_access
    - guests_activity
    - guests_repair
    - guests_status
    - guests_data
    - guests_never
  provides_hooks:
    - pre_tool_call
    - pre_llm_call
  provides_middleware: []
  requires_env: []
