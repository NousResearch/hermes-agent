name: hermes-guide
repo: https://github.com/iap/hermes-guide
sha: 2a57bbfdee1002a1e2569a791d18882249c7c671
description: "Read-only diagnostics for Hermes configuration: /hermes-doctor in-session and hermes guide in a terminal. Seven read-only health checks (config, mcp, skills, commands, hooks, plugins, memories) and points to 20 troubleshooting skills, installed separately as a skills tap, for what the built-in doctor doesn't cover. Complements — never replaces — hermes doctor. Disclosure — reads config.yaml, SKILL.md frontmatter, skill bundles, plugin manifests, the shell-hooks allowlist and the built-in MEMORY.md/USER.md stores read-only (the report quotes short memory snippets); /hermes-doctor and hermes guide run hermes config path and hermes hooks doctor as subprocesses (argument list, no shell), and hermes hooks doctor executes every approved shell hook once with a synthetic payload; with opt-in proactive: true it runs the checks in-process at each session start/end (no hooks executed) and once per process runs git ls-remote against the plugin's GitHub repo to log a newer-release notice (no download, no local writes). The 20 troubleshooting skills are not loaded by the plugin: they install separately from the repo as a skills tap, which this entry's pin does not cover."
maintainer: iap
tier: community
category: tools
requires_hermes: ">=0.21"
version: "0.7.1"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_start (opt-in proactive mode)
    - on_session_end (opt-in proactive mode)
  provides_middleware: []
  requires_env: []
docs_url: https://github.com/iap/hermes-guide#readme
