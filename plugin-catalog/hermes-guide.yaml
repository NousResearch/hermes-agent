sha: 638190f6c8ade88cca2358cd2621a1ca1b04b5a0
description: "Read-only diagnostics for Hermes configuration: /hermes-doctor in-session and hermes guide in a terminal. Nine read-only health checks (config, mcp, skills, commands, hooks, plugins, memories, sessions, update) and points to 22 troubleshooting skills, installed separately as a skills tap, for what the built-in doctor doesn't cover. Complements — never replaces — hermes doctor. Disclosure — reads config.yaml, SKILL.md frontmatter, skill bundles, plugin manifests, the shell-hooks allowlist and the built-in MEMORY.md/USER.md stores read-only (the report quotes short memory snippets); the sessions scope reads the tail of logs/agent.log read-only for runaway-session signatures (session ids, model names and token counts appear in the report); the update scope reads the update-lock record in the co-located hermes-agent checkout under $HERMES_HOME and probes it — owner-PID liveness, then a brief lock acquisition it releases immediately, opening the lock file writable, with a read-only fallback for a root-owned lock on POSIX (writes no content, never deletes the lock); registers one read-only plugin skill, hermes-guide:start, listed in model sessions while the plugin is enabled; /hermes-doctor and hermes guide run hermes config path and hermes hooks doctor as subprocesses (argument list, no shell), and hermes hooks doctor executes every approved shell hook once with a synthetic payload; with opt-in proactive: true it runs the checks (including the agent.log scan) in-process at each session start/end (no hooks executed) and once per process runs git ls-remote against the plugin's GitHub repo to log a newer-release notice (no download, no local writes). The 22 troubleshooting skills are not loaded by the plugin: they install separately from the repo as a skills tap, which this entry's pin does not cover."
maintainer: iap
tier: community
category: tools
requires_hermes: ">=0.21"
version: "0.8.7"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_start (opt-in proactive mode)
    - on_session_end (opt-in proactive mode)
  provides_middleware: []
  requires_env: []
