name: hermes-handle-it
repo: https://github.com/casualsav/hermes-handle-it
sha: efef35be377d243b22d8f5b390c9d32694f52569
description: "Handle It: your agent sits in the customer support chat so you don't have to. Hermes holds a company's live customer-support chat for you in its own browser, negotiates toward your goal for as long as it takes, and asks you before it agrees to an offer, pays, cancels or shares a detail you did not allow. Ends with the outcome and a saved transcript. Disclosure — Opens the support pages you name in a local Chromium (Playwright) with its own profile under $HERMES_HOME/hermes-handle-it, or in Hermes's own browser (with its signed-in sessions) when browser.cdp_url is set, public addresses only (every page, redirect hop and frame is checked; private, loopback, link-local and cloud metadata addresses are refused), types messages into them on your behalf, and saves transcripts and screenshots there. Never reads passwords or Hermes's vault: a sign-in is made by Hermes itself. For phone calls it talks to bland.ai's API with your own key (BLAND_API_KEY, read through Hermes's profile-scoped secrets), sends bland.ai your task and the details you allow to share, and places a call to a number you name only after you approve it; bland.ai's AI voice agent then speaks on the call and checks with you before agreeing to anything only when you expose its local approval bridge (127.0.0.1) through a public tunnel you set up as call_bridge_url, otherwise it agrees to nothing. bland.ai records the call when you ask, and call costs are yours, billed by bland.ai. No other network calls, no telemetry, no stored credentials."
maintainer: casualsav
tier: community
category: automation
title: Handle It
requires_hermes: ">=0.21.5"
docs_url: https://github.com/casualsav/hermes-handle-it
version: "0.1.0"
platforms: [linux, macos]
capabilities:
  provides_tools:
    - support_chat_start
    - support_chat_send
    - support_chat_wait
    - support_chat_end
    - support_call_start
    - support_call_wait
    - support_call_end
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - on_session_finalize
  provides_middleware: []
  requires_env:
    - BLAND_API_KEY
