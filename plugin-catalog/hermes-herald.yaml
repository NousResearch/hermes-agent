name: hermes-herald
repo: https://github.com/bennybuoy/hermes-herald
sha: aa63822d06963b68f643064dd086dd72d1ce9e3e
description: "Cross-profile agent dispatch for Hermes Agent — 12 tools for agents talking to agents: async dispatch with SSE completion, synchronous multi-turn chat, model-selectable in-process subagents, a durable SQLite run ledger, fail-closed per-target model-route discovery, and host-owned bare LLM inference. Disclosure — sends task text and bearer tokens to the Hermes API servers you configure (plaintext HTTP permitted, warn-only); stores full dispatch text in a local SQLite ledger; delegate_subagent may use any provider credential you have configured."
known_issues:
  - "Full local delegation requires plugins.isolation: in_process. This is a profile-wide trust setting, not a sandbox for untrusted plugins; shared-gateway profile scoping is supported."
  - "The isolated-host adapter is experimental and poll-only, requires compatible Hermes lifecycle transport (see the pinned README), and does not deliver automatic parent completion notifications."
maintainer: bennybuoy
tier: community
category: tools
requires_hermes: ">=0.21.0"
docs_url: https://github.com/bennybuoy/hermes-herald#readme
version: "1.2.0"
platforms: []
capabilities:
  provides_tools:
  - dispatch_agent
  - check_dispatch
  - collect_dispatches
  - dispatch_status
  - dispatch_chat
  - cancel_dispatch
  - delegate_subagent
  - llm_call
  - llm_direct
  - ping_profile
  - approve_dispatch
  - list_profile_models
  provides_hooks: []
  provides_middleware: []
  requires_env: []
