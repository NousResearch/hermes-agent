name: hermes-herald
repo: https://github.com/bennybuoy/hermes-herald
sha: e74c1041d2b13ac247501d57d516cb18644b3e78
description: "Cross-profile agent dispatch for Hermes Agent — 12 tools for agents talking to agents: async dispatch with SSE completion, synchronous multi-turn chat, model-selectable local subagents, a durable SQLite run ledger, fail-closed per-target multi-route model discovery, and host-owned or opt-in bare LLM inference with multimodal image input support. Disclosure — sends task text and bearer tokens to the Hermes API servers you configure (plaintext HTTP permitted, warn-only); opt-in llm_direct sends prompts and bearer tokens to the OpenAI-compatible endpoints you configure; llm_call and llm_direct accept multimodal image inputs (base64 data URLs, local image files, or https:// image URLs with SSRF/size/MIME guards) and forward them to the selected model/endpoint; stores full dispatch text in a local SQLite ledger; delegate_subagent may use any provider credential you have configured."
known_issues:
  - "Full local delegation, remote dispatch callbacks, and approve_dispatch require plugins.isolation: in_process (a profile-wide trust setting, not a sandbox; shared-gateway profile scoping is supported)."
  - "Under plugins.isolation: host, delegate_subagent uses the polling-only subset (delivery='poll'), and dispatch_agent(delivery='callback') and approve_dispatch fail closed (use delivery='none' with check_dispatch/collect_dispatches, dispatch_chat, llm_call, or llm_direct)."
maintainer: bennybuoy
tier: community
category: tools
requires_hermes: ">=0.21.1"
docs_url: https://github.com/bennybuoy/hermes-herald#readme
version: "1.3.0"
platforms: []
capabilities:
  provides_tools:
    - dispatch_agent
    - check_dispatch
    - collect_dispatches
    - dispatch_status
    - dispatch_chat
    - cancel_dispatch
    - delegate_subagent
    - llm_call
    - llm_direct
    - ping_profile
    - approve_dispatch
    - list_profile_models
  provides_hooks: []
  provides_middleware: []
  requires_env: []
