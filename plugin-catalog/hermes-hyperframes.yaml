title: "Hyperframes"
description: "Drive Hyperframes (Apache-2.0 HTML video compositions) from Hermes: six hyperframes_* agent tools (lint, managed Studio preview lifecycle, timeline readback, frame snapshots for visual verification, Studio-selection context bridge, MP4 render) plus a dashboard tab with project switching, the live Studio preview embedded, an agent chat bound to a real Hermes gateway session (async turns with polled status) — the same conversation a terminal sees via `hermes chat --resume`. Wraps a pinned local Hyperframes CLI (no npx) and talks only to loopback services: the local CLI and the gateway's own api_server. Disclosure — Runs the Hyperframes CLI (Node) on the host for projects under the projects_roots you configure (default ~/projects/personal and ~/projects/clients, or <hermes home>/projects when it exists), including a project's own node_modules/.bin/hyperframes, which executes that project's composition code; it starts and stops the Studio preview process and writes renders inside the project directory. The dashboard chat sends your messages to your own gateway api_server using API_SERVER_KEY, and every message costs a model call."
