title: "Hyperframes"
description: >-
  Drive Hyperframes (Apache-2.0 HTML video compositions) from Hermes: six
  hyperframes_* agent tools (lint, managed Studio preview lifecycle, timeline
  readback, frame snapshots for visual verification, Studio-selection context
  bridge, MP4 render) plus a dashboard tab with project switching, the live
  Studio preview embedded, an agent chat bound to a real Hermes gateway session (async turns with polled status) — the same conversation a terminal sees via `hermes chat --resume`.
  Wraps a pinned local Hyperframes CLI (no npx) and talks only to loopback
  services: the local CLI and the gateway's own api_server.
  Disclosure — heavy local actions: starts/kills the Studio preview process
  and runs the pinned CLI on the host, but only for projects under the
  user-configured projects_roots allowlist (a project's own
  node_modules/.bin/hyperframes binary is executed, so everything outside the
  roots is refused); the CLI subprocess gets a minimal environment
  (PATH/HOME/locale/TMPDIR — never the Hermes process env, so no provider
  keys reach it; extra names opt-in via env_passthrough); render output is
  confined to the project dir and never overwrites a non-video file; the
  chat credential (API_SERVER_KEY) is read through Hermes's secret API
  (agent.secret_scope.get_secret), never parsed from .env; the chat lane
  creates sessions in the local gateway and every message costs a real model
  call. No third-party network calls, no telemetry.
