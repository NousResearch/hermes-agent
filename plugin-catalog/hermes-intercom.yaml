subdir: ""
description: >-
  Discover and message existing Hermes sessions within one profile using
  session_list and session_send. Delivery uses only the public ctx.inject_message
  API with attributed native notices, hop limits, per-sender duplicate detection,
  bounded retry identities and per-target rate limits. CLI and unknown sender
  surfaces are refused. Unverified routes and dormant targets that the public
  API cannot reach are refused; there is no private gateway transport or automatic
  mounting. A scheduled result confirms scheduling, not execution or durable
  delivery. Disclosure: reads the profile's state.db sessions, gateway_routing
  and messages tables to discover targets and recover hop state. In shared
  gateways, session_list can expose other users' chat titles and metadata, and
  session_send can start model/tool turns in their chats; restrict the intercom
  toolset to owner-only platforms. Profile home and settings use public host
  APIs, and the host enforces injection permission. Appends metadata including
  session/request IDs and a body-hash prefix, but no message plaintext, to
  cache/hermes-intercom/audit.jsonl under the profile home, rotating at 2 MiB.
  POSIX mode 0600 is requested; Windows access follows directory ACLs. No added
  external service or runtime dependency; host-configured model/tool calls may
  use external services. The Desktop module renders nothing and does not modify
  the host DOM. Retry state is process-local and capped at 4096 operations, with
  completed entries evictable; there is no exactly-once guarantee.
maintainer: greqone
