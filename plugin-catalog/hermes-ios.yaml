name: hermes-ios
title: Hermes-iOS-sim
repo: https://github.com/akinduroifedayo/Hermes-iOS-sim
sha: 3a184e5d847dcd1c8363224ec3175498b10988c5
subdir: plugin
version: "1.0.0"
description: "Build and visually iterate on native iOS apps in Hermes Desktop through localhost. Runs Xcode commands and a pinned preview server; known dependency security limitations are disclosed in the README. Disclosure — on approval, setup downloads an exact-pinned serve-sim (0.1.49-beta.139.1) and its locked npm tree from registry.npmjs.org into the plugin's data dir. The plugin runs Xcode/simctl commands and keeps background serve-sim preview and watchdog processes on 127.0.0.1, whose simulator stream/input/start/shutdown routes are unauthenticated to local processes (shell execution stays disabled). It reads the local Hermes config to pick its lifecycle mode. Never expose, forward or tunnel the preview port."
maintainer: akinduroifedayo
tier: community
category: desktop
platforms:
  - macos
docs_url: https://github.com/akinduroifedayo/Hermes-iOS-sim/blob/3a184e5d847dcd1c8363224ec3175498b10988c5/README.md
known_issues:
  - >-
    Localhost only. Never expose, forward, or tunnel the preview port.
    serve-sim 0.1.49-beta.139.1 requires a loopback Host and runs with shell
    execution disabled; simulator stream/HID routes remain unauthenticated on
    loopback. Localhost does not eliminate malicious-browser risks.
  - >-
    Requires Xcode, an iOS Simulator runtime, Node.js 20+, and npm.
    No minimum compatible Hermes version or independent-Mac qualification is established.
  - >-
    Uses the read-only undocumented worker_config_snapshot host API for
    lifecycle selection; host changes can break automatic cleanup.
capabilities:
  provides_tools:
    - ios_iteration
    - ios_setup
  provides_hooks:
    - pre_tool_call
    - post_tool_call
  provides_middleware:
    - tool_execution
  requires_env: []
