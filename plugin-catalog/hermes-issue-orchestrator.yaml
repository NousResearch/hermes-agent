name: hermes-issue-orchestrator
repo: https://github.com/krantikaridev/hermes-issue-orchestrator
sha: "328a8604a1b28bbebde9fd9913be02a6bf7b991a"
description: GitHub issues as Hermes's task queue - claim, post progress with token counts, and hand off.
maintainer: krantikaridev
tier: community
category: automation
requires_hermes: ">=0.22.0"
version: "0.1.0"
readme: true
title: Hermes Issue Orchestrator
known_issues:
  - "Set plugins.entries.hermes-issue-orchestrator.settings.repo to your own repository before use; the default points at the author's sandbox."
capabilities:
  provides_tools:
    - issue_claim
    - issue_comment_progress
    - issue_handoff
  provides_hooks:
    - post_llm_call
    - post_api_request
  provides_middleware: []
  requires_env: []
