name: hermes-issue-sync
repo: https://github.com/elijahboston/hermes-issue-sync
sha: ed7dd85c5b4f38df55ac9ecb663ab220b8b1c8cc
description: "Two-way sync between Hermes kanban cards and Linear or Jira issues. Open issues with a chosen label in the projects you pick become cards; card status moves the issue through its workflow; a finished card posts its summary on the issue; a worker that blocks with a question gets it posted on the issue, and the first human reply there unblocks the card with the answer. Several connections (Linear workspaces, Jira sites, several projects each) run side by side, and one failing never stops the others. Desktop adds an Issue Sync panel, a status-bar chip and kanban card badges; /issues status and /issues show work from any chat. Disclosure — calls api.linear.app and your Jira Cloud site with your own API key or token (read by name through the profile secret scope, never stored); moves issues and posts comments as you, each signed \"— via Hermes issue-sync\", including each finished card's summary and each blocked card's question; turns the titles and descriptions of labelled issues into kanban cards, and the first reply on a blocked card's issue unblocks the card with that reply's text, so anyone who can label or comment on those issues supplies text your kanban workers act on (cards stay unassigned unless you set an assignee); runs a short background sync thread on kanban dispatcher ticks and runs `hermes kanban` subcommands to read and update the board; writes only to its own plugin data folder; no telemetry. On multi-profile gateways it binds the profile's secret scope itself through the public agent.secret_scope API until NousResearch/hermes-agent#151126 is fixed."
