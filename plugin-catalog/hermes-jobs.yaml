tier: community
category: automation
requires_hermes: ">=0.22.6"
docs_url: https://github.com/CrowBe/hermes-jobs/blob/9e6487950872fa844b7b35aa4408116739162e3f/README.md
version: "0.3.0"
platforms: []
capabilities:
  provides_tools:
    - hermes_jobs_discover
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - HERMES_JOBS_GOOGLE_CLIENT_ID
    - HERMES_JOBS_GOOGLE_CLIENT_SECRET
