    - hermes_jobs_discover
  provides_hooks: []
  provides_commands:
    - jobs
  provides_middleware: []
  requires_env:
    - HERMES_JOBS_GOOGLE_CLIENT_ID
    - HERMES_JOBS_GOOGLE_CLIENT_SECRET
