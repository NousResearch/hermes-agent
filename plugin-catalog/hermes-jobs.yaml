  - https://raw.githubusercontent.com/CrowBe/hermes-jobs/57ac3a76f17ea565dc4287c80756e0eff0a22eac/docs/screenshots/drag-all-events.png
  - https://raw.githubusercontent.com/CrowBe/hermes-jobs/57ac3a76f17ea565dc4287c80756e0eff0a22eac/docs/screenshots/confirm-reschedule.png
  - https://raw.githubusercontent.com/CrowBe/hermes-jobs/57ac3a76f17ea565dc4287c80756e0eff0a22eac/docs/screenshots/run-outcome.png
  - https://raw.githubusercontent.com/CrowBe/hermes-jobs/57ac3a76f17ea565dc4287c80756e0eff0a22eac/docs/screenshots/jobs-agenda.png
platforms: []
title: "hermes-jobs: Calendar sync for Hermes cron"
capabilities:
