description: "Twelve Egyptian gods in painted relief and gold leaf: Thoth, Ra, Isis, Osiris, Anubis, Horus, Bastet, Sekhmet, Set, Nut, Ptah and Hathor, as Hermes Desktop themes. Install once, then switch with /skin <name>. Disclosure — theme-only desktop plugin: it registers twelve themes through the plugin SDK, and their stylesheets restyle parts of Desktop's own UI (sidebar art, tabs, composer, wordmark) only while one of its themes is active. Fonts and art are bundled; no network requests, no agent tools or hooks."
