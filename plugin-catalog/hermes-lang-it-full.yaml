name: hermes-lang-it-full
repo: https://github.com/gradia64/hermes-lang-it-full
sha: d5a38c5d0394bb7f92b3cf53802c296f060d7b2d
description: >-
  Italian (Italiano) language pack for Hermes Desktop — 5,082 of 5,085 keys on
  main (firstRun, themePicker, connector accounts and the update-channel picker
  included; the 3 the pack format rejects are array/object leaves that fall
  back to English). Core, CLI and TUI keep the Italian catalogs already bundled
  with Hermes. Generated from the hand-reviewed typed catalog maintained in
  gradia64/hermes-agent (gradia-desktop-it branch); function-backed keys ship
  as positional {0} templates. Independent community translation, unrelated to
  hermes-lang-it. Disclosure — text-only catalogs plus an __init__.py whose
  register() is a no-op (kept so Desktop "Install from Git" accepts the pack,
  #138118); registering the pack never changes display.language, the user opts
  in via config.
