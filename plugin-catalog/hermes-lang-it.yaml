description: "Italian (Italiano) language pack for Hermes Agent — full UI translation across every surface: core (approval prompts, gateway/slash replies, CLI, tips), TUI, and Desktop catalogs (4378 keys). Checked against the English catalogs with hermes plugins validate: 3437/3437 core, 1259/1259 TUI, 4378/4378 desktop keys match. Parser-safe: hard-parsed menu brackets and [Y/n] prompts stay verbatim; placeholders, URLs and CLI flags preserved. Manifest-only plugin, no code execution, no network. Traduzione italiana completa dell'interfaccia Hermes Agent. Disclosure — text-only catalogs; registering the pack never changes display.language, the user opts in via config."
