description: "Italian (Italiano) language pack for Hermes Agent — UI translation for core (approval prompts, gateway/slash replies, CLI, tips), TUI and Desktop. Coverage: core 3437/3437, TUI 1259/1259 and Desktop ~5,000 keys (missing ones fall back to English). Parser-safe: hard-parsed menu brackets and [Y/n] prompts stay verbatim; placeholders, URLs and CLI flags preserved. Manifest-only plugin, no code execution, no network. Traduzione italiana dell'interfaccia Hermes Agent. Disclosure — text-only catalogs; registering the pack never changes display.language, the user opts in via config."
maintainer: Lazzdaycod
