description: >-
  Korean (한국어) language pack for Hermes Desktop — Desktop UI (4,962 of 5,065 keys on v0.21.7, 4,982 of 5,085 on main); CLI, gateway and TUI keep the Korean catalogs already bundled with Hermes. Independent translation from the English source; values identical to English are omitted so missing strings fall back to English. Disclosure — text-only catalogs plus an __init__.py whose register() is a no-op (kept so Desktop "Install from Git" accepts the pack, #138118); registering the pack never changes display.language, the user opts in via config.
