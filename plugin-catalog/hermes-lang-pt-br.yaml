title: Brazilian Portuguese (Português do Brasil) Language Pack
description: "Brazilian Portuguese (pt-BR) language pack for Hermes Agent covering all three UI surfaces — core CLI/gateway/platforms (3,433/3,433 keys), the Ink TUI (1,301/1,301) and the Desktop app (4,314 keys; untranslated ones fall back to English). All three catalogs checked against the English reference with `hermes plugins validate` — zero key or placeholder divergence. Core and TUI mirror the bundled `pt` locale, registered as a real `pt-br` variant so it wins over the `pt`/`pt-BR` alias; the Desktop catalog is the original contribution, since the Desktop app ships no Portuguese at all. Manifest-only plugin: flat dotted YAML catalogs under locales/, no code, no network, no dependencies. Registering the pack never changes display.language — the user opts in via `hermes config set display.language pt-br`. Disclosure — text-only catalogs; two `caution` hits from the install scanner are false positives on translated prose (an `install.sh | sh` URL inside a translated error message, and an 'update AGENTS.md' string). Tradução pt-BR da interface do Hermes Agent."
