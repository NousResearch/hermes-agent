title: Brazilian Portuguese (Português do Brasil) Language Pack
description: "Brazilian Portuguese (pt-BR) language pack for Hermes Agent covering all three UI surfaces — core CLI/gateway/platforms (3,535/3,535 keys), the Ink TUI (1,445/1,445) and the Desktop app (5,588/5,592). Every translatable key exists and every value is translated against the English source of `main` at the revision this release was cut from: zero unknown keys and zero placeholder divergence on all three surfaces, and the four remaining Desktop keys are arrays/structured values a text pack cannot carry. Checked with `hermes plugins validate` and with the pack's own `tools/verify_pack.py`, which also runs as public CI on every push. Core and TUI mirror the bundled `pt` locale, registered as a real `pt-br` variant so it wins over the `pt`/`pt-BR` alias; the Desktop catalog is the original contribution (first proposed upstream in PR #92590, 2026-08-23), since the Desktop app ships no Portuguese at all. Manifest-only plugin: flat dotted YAML catalogs under locales/, no code, no network, no dependencies. Registering the pack never changes display.language — the user opts in via `hermes config set display.language pt-br`. A weekly drift workflow reports when `main` adds or drops keys; nothing self-updates. Tradução pt-BR da interface do Hermes Agent."
