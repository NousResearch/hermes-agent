title: Thai (ภาษาไทย) Language Pack
description: >-
  Thai (ภาษาไทย) language pack covering all three Hermes UI surfaces — Desktop
  (5,024/5,030), core CLI/gateway/platforms (3,437/3,437), and the Ink TUI
  (1,259/1,259) — 9,720/9,726 keys total (99.9%). All three catalogs checked
  against the English reference with `hermes plugins validate`. Manifest-only
  plugin: flat nested YAML overlays under locales/, no code, no network, no
  dependencies. Registering the pack never changes display.language — the user
  opts in via `hermes config set display.language th`. Disclosure — text-only
  catalogs; the 6 untranslated Desktop keys (array/conditional shapes the YAML
  overlay cannot express) fall back to English, listed in the repo README.
