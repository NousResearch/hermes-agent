description: >-
  Vietnamese (Tieng Viet) language pack for Hermes Agent — full UI translation across every
  surface: core (approval prompts, gateway/slash replies, CLI, tips), TUI, and Desktop catalogs.
  9,600 keys validated 100% against the English catalogs (hermes plugins validate exit 0).
  Parser-safe: hard-parsed menu brackets and [Y/n] prompts stay verbatim; placeholders, URLs and
  CLI flags preserved. Manifest-only plugin, no code execution, no network. Ban dich tieng Viet
  day du cho toan bo giao dien Hermes Agent. Disclosure — text-only catalogs; registering the
  pack never changes display.language, the user opts in via config.
