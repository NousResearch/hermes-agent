  - https://raw.githubusercontent.com/dandacompany/hermes-live/64c111162caa340d416c4339191b0b47cddad83d/assets/codex-usage.png
known_issues:
  - "Codex voice and quota use the backend user's Codex CLI ChatGPT login, not Hermes-owned subscription authentication."
  - "Since 0.9.2 the Codex CLI child receives an allowlisted environment (PATH, HOME, USER, locale, temp, CODEX_HOME/XDG, proxy and CA variables) rather than a copy of Hermes's environment."
  - "Profiles sharing an OS user and CODEX_HOME can share the Codex account. Remote end-to-end calls and Windows/Linux have not been verified."
  - "Voice can keep waiting when a delegated Hermes task pauses for user input; answer in the chat. End another active voice call before starting."
capabilities:
