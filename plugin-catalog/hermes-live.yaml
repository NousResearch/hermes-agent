name: hermes-live
title: Hermes Live
repo: https://github.com/dandacompany/hermes-live
sha: c81c84f0e001014662cadb8b3e3dafa0c51b54f7
description: "Multi-provider live voice calls with Gemini, Grok, Qwen, and a Codex subscription in Hermes Desktop. Disclosure — voice audio and recent chat go only to the live-voice provider the user picks (Gemini, Grok or Qwen); the Codex option drives the user's own Codex CLI on its own ChatGPT login; tasks the voice model submits run as normal Hermes chat turns with the usual approvals."
maintainer: dandacompany
tier: community
category: voice
requires_hermes: ">=0.22.5"
version: "0.9.2"
docs_url: https://github.com/dandacompany/hermes-live#readme
readme: true
platforms: [macos]
