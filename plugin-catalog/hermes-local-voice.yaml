name: hermes-local-voice
title: Local Voice Notes
repo: https://github.com/soilgrowerx/hermes-local-voice
sha: "b84c82c0c54388573d3d32fdfa45cccbdb94dae3"
description: "Voice memos become text on the machine that recorded them: no API key, no account, and no audio leaving the host. Capture from PipeWire or ffmpeg, run faster-whisper locally, and the transcript arrives as a note. Four tools (transcribe_audio, voice_record_start, voice_record_stop, transcribe_last) plus a speech-to-text provider registered through ctx.register_transcription_provider, so core transcribes only admitted messages when stt.provider is set to hermes_local_voice. pre_llm_call attaches the pending transcript to the turn; the legacy pre_gateway_dispatch path is opt-in and off by default because it runs before sender authorization. Ships model management (list supported Whisper sizes with disk cost and cache status, download explicitly) and a live capture path with a silence gate so ambient room tone is never transcribed. Disclosure: all processing is local. Network access happens only when the user explicitly runs the model download command, which fetches weights from Hugging Face into the Hermes model directory; no telemetry, no automatic updates, no reads outside the Hermes home and the recording paths the plugin creates. Disclosure \\u2014 transcription runs locally with faster-whisper; when the user configures a loopback job server URL, audio files are POSTed to it and its reply is used as the transcript; the transcribe tool and the pre_llm_call hook read any local audio path named in the chat, and with cleanup enabled the tool deletes only recordings the plugin created; the opt-in auto_transcribe_inbound setting transcribes gateway voice messages before sender authorization; models are read from the Hermes model directory,  or , and are downloaded from Hugging Face only when the user runs the model download command; no telemetry, no automatic updates. Disclosure — transcription runs locally with faster-whisper; when the user configures a loopback job server URL, audio files are POSTed to it and its reply is used as the transcript; the transcribe tool and the pre_llm_call hook read any local audio path named in the chat, and with cleanup enabled the tool deletes only recordings the plugin created; the opt-in auto_transcribe_inbound setting transcribes gateway voice messages before sender authorization; models are read from the Hermes model directory, `~/.cache/huggingface/hub` or `HF_HOME`, and are downloaded from Hugging Face only when the user runs the model download command; no telemetry, no automatic updates."
maintainer: soilgrowerx
tier: community
category: voice
requires_hermes: ">=0.21.5"
docs_url: https://github.com/soilgrowerx/hermes-local-voice#readme
version: "0.1.1"
capabilities:
  provides_tools: [transcribe_audio, voice_record_start, voice_record_stop, transcribe_last]
  provides_hooks: [pre_llm_call]
  provides_middleware: []
  requires_env: []
