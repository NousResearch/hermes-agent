name: hermes-make-it-smart
repo: https://github.com/tesla963/hermes-make-it-smart
sha: 50a2a9b815a459a6ba3669fac3da558ac2e97477
description: >-
  Canonical catalog over every Hermes profile. Reads the local state.db files, gives each
  session the "NNN [Subject] MMM [Tag] [Tag] Description · Verb" name, and exposes faceted
  filters (subject, maker, context, intention, theme, year, project) as a native Desktop
  page. Includes a Pending view that attributes every memory/skill approval request to the
  session that produced it, and a Testing tab that simulates the rename, writes a mandatory
  backup, commits through the host's session.title API and offers one-click revert.
  Disclosure — reads session titles and message excerpts from the local Hermes databases on
  the user's machine; nothing is sent over the network; the only write is a session title,
  and only when the user presses Commit.
maintainer: tesla963
tier: community
category: productivity
docs_url: https://github.com/tesla963/hermes-make-it-smart#readme
