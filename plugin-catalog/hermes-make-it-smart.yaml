    - cellar_search
    - cellar_session
    - cellar_stats
    - cellar_series
    - cellar_rename
    - cellar_tag
    - cellar_bateria
    - cellar_index
    - cellar_verify
    - cellar_export
  provides_hooks:
    - on_session_end
  provides_middleware: []
  requires_env: []
