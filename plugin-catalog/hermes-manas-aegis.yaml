name: hermes-manas-aegis
title: Manas Aegis
repo: https://github.com/elianjuan-g/hermes-manas-aegis
sha: 4aac490839ff961d7595468dbd7947f9df0356c0
version: "2.6.2"
description: >-
  [ALPHA] Experimental Hermes guardrail (prototype, not standalone security):
  pattern-based pre-tool checks that can block or rewrite some risky tool
  arguments, with a canary honeypot, local telemetry and a loopback HUD,
  plus STIX 2.1 export. Opt-in, test environments only.
  Disclosure — the plugin makes HTTPS calls ONLY to two public, no-key
  sources, for the global threat-intel panel: CISA KEV
  (cisa.gov known_exploited_vulnerabilities.json) and the NVD CVE API 2.0
  (20 most recent CVEs). Auto-refresh: the HUD server re-checks the cache
  every 10 minutes and refetches when empty or older than 6 hours (max 40
  items, 12s timeout, 2 MB cap); a manual refresh button exists; without
  internet the last cache is kept and labelled possibly stale. No LLM call,
  no subprocess, no credentials read, no telemetry out. Intercepts pre_tool_call and
  pre_llm_call to scan arguments with 10 defined rules mapped to CWE / CAPEC /
  MITRE ATT&CK / OWASP Top 10 / CVSS / CWSS / EPSS / SSVC (10 experimental,
  0 planned — all enforced since v2.6.0); on a match it blocks the call or
  rewrites the arguments (honeypot redirect to a sandboxed decoy, or a
  safe-flag rewrite for git). v2.6.0 adds per-session taint tracking
  (credential read -> egress blocked), a real shell parser (chained
  commands split per segment, dangerous python -c blocked), SSRF
  fail-closed on DNS error (with an allowlist), a Posture Score (0-100 +
  grade), a Guard Arena (10 attack scenarios run against the live
  enforcement path on a disposable core), a time-travel audit (re-checks
  stored events against the new rules), and HUD hardening (CSRF token on
  all POSTs, 20/60s rate limit, opt-in token auth). CI runs unit + contract
  tests with a 70% coverage gate (measured 79%).
  v2.6.1 moves the Posture Score card into a compact minimalist box
  shown only on the Activity tab, moves all Activity content (KPIs,
  history, scope, scans) into the Activity panel so each tab shows
  fully different content, and adds a 180ms fade transition on tab
  switch.
  v2.6.2 fixes nine Argon-audit items against v2.6.1: the shell parser
  honours $(...)/backticks/newlines, argument inspection is recursive
  (with ~/ expansion), SSRF blocks multicast/unspecified, packaging is
  verified from real sdist/wheel contents, HUD writes are locked and
  atomic, clear-history also clears findings, the sound button is removed
  (no audio exists), the intel-refresh button shows a loading state, and
  five doc contradictions are fixed. Tests: 83/83 unit + contract
  (61 in v2.6.0 + 22 new).
  Serves a loopback-only HUD (http://127.0.0.1:18777) shown as an iframe in
  the Desktop Manas Aegis tab; writes redacted interception telemetry
  (manas_telemetry.json, live file + append-only archive, unlimited) and a
  local STIX 2.1 feed (stix21_taxii_feed.json) under the plugin data folder.
  The 6-vector barrage button runs the same 10 rules against synthetic
  attacks (labelled SIMULASI, counted separately, summary shown
  persistently) and reloads the HUD. The HUD is multilingual (15 languages,
  English default), supports user-defined rules
  (~/.hermes/manas-aegis-custom-rules.json), quick/full/network scans with
  on-HUD findings, and a global threat-intel panel fed by CISA KEV and the
  NVD CVE API (free, no key; awareness only, never presented as a device
  scan). The HUD visual system follows the C3iHub CISO dashboard design
  (deep slate, one severity scale, sidebar navigation, Lucide SVG icons)
  with dark + light themes (toggle, saved in the browser). The two query tools (manas_tactical_core,
  manas_stix_intelligence) need Hermes 0.23+ (register_tool parameters kwarg);
  the core guard hooks work on 0.21.0+.
maintainer: elianjuan-g
tier: community
category: tools
requires_hermes: ">=0.21.0"
docs_url: https://github.com/elianjuan-g/hermes-manas-aegis
known_issues:
  - "Alpha release: prototype guardrail, not standalone security; opt-in, test environments only."
  - "The two query tools (manas_tactical_core, manas_stix_intelligence) need Hermes 0.23+; on 0.21.x the doctor reports a register_tool parameters mismatch (core guard hooks unaffected)."
  - "The HUD's big KPI cards count only local activity and the plugin's
    internal rule/indicator count; the live CISA KEV + NVD feed appears
    only in the separate global-intel panel, as awareness only — the
    plugin does not check whether this device is affected by any
    listed CVE."
capabilities:
  provides_tools:
    - manas_tactical_core
    - manas_stix_intelligence
  provides_hooks:
    - on_session_start
    - pre_llm_call
    - pre_tool_call
    - transform_tool_result
    - transform_llm_output
  provides_middleware: []
  requires_env: []
