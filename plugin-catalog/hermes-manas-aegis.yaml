name: hermes-manas-aegis
title: Manas Aegis
repo: https://github.com/elianjuan-g/hermes-manas-aegis
sha: 2b0768c124dd548c9813bb97e4d22c107705ccc1
version: "2.5.1"
description: >-
  [ALPHA] Experimental Hermes guardrail (prototype, not standalone security):
  pattern-based pre-tool checks that can block or rewrite some risky tool
  arguments, with a canary honeypot, local telemetry and a loopback HUD,
  plus STIX 2.1 export. Opt-in, test environments only.
  Disclosure — no network call to third parties, no LLM call, no subprocess,
  no credentials read, no telemetry out. Intercepts pre_tool_call and
  pre_llm_call to scan arguments with 10 defined rules mapped to CWE / CAPEC /
  MITRE ATT&CK / OWASP Top 10 / CVSS / CWSS / EPSS / SSVC (8 experimental,
  2 planned); on a match it blocks the call or rewrites the arguments
  (honeypot redirect to a sandboxed decoy, or a safe-flag rewrite for git).
  Serves a loopback-only HUD (http://127.0.0.1:18777) shown as an iframe in
  the Desktop Manas Aegis tab; writes redacted interception telemetry
  (manas_telemetry.json, live file + append-only archive, unlimited) and a
  local STIX 2.1 feed (stix21_taxii_feed.json) under the plugin data folder.
  The 6-vector barrage button runs the same 10 rules against synthetic
  attacks (labelled SIMULASI, counted separately, summary shown
  persistently) and reloads the HUD. The HUD is multilingual (15 languages,
  English default), supports user-defined rules
  (~/.hermes/manas-aegis-custom-rules.json), quick/full/network scans with
  on-HUD findings, and a global threat-intel panel fed by CISA KEV and the
  NVD CVE API (free, no key; awareness only, never presented as a device
  scan). The HUD visual system follows the C3iHub CISO dashboard design
  (deep slate, one severity scale, sidebar navigation, Lucide SVG icons)
  with dark + light themes (toggle, saved in the browser). The two query tools (manas_tactical_core,
  manas_stix_intelligence) need Hermes 0.23+ (register_tool parameters kwarg);
  the core guard hooks work on 0.21.0+.
maintainer: elianjuan-g
tier: community
category: tools
requires_hermes: ">=0.21.0"
docs_url: https://github.com/elianjuan-g/hermes-manas-aegis
known_issues:
  - "Alpha release: prototype guardrail, not standalone security; opt-in, test environments only."
  - "The two query tools (manas_tactical_core, manas_stix_intelligence) need Hermes 0.23+; on 0.21.x the doctor reports a register_tool parameters mismatch (core guard hooks unaffected)."
  - "The HUD's big KPI cards count only local activity and the plugin's
    internal rule/indicator count; the live CISA KEV + NVD feed appears
    only in the separate global-intel panel, as awareness only — the
    plugin does not check whether this device is affected by any
    listed CVE."
capabilities:
  provides_tools:
    - manas_tactical_core
    - manas_stix_intelligence
  provides_hooks:
    - on_session_start
    - pre_llm_call
    - pre_tool_call
    - transform_tool_result
    - transform_llm_output
  provides_middleware: []
  requires_env: []
