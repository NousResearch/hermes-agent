description: "A live map you and Hermes share, docked beside the chat. Hermes plots places it finds on the web with real coordinates, flies the camera, drops pins with a note and source link, and draws routes. You click a pin or circle an area and Hermes receives what you picked. Two looks: a clean flat map and a cinematic globe. No keys and no cost. Disclosure — viewing the map sends tile requests (your IP address and the area viewed) to tiles.openfreemap.org; a bundled world outline is the offline fallback. Plotting and place search send place names and search text (and the visible map bounds for a visible-area search) from this machine to photon.komoot.io, a free service with no uptime guarantee; results are kept in memory for an hour. Google Maps links and a pin's source link open in the browser only when clicked. Selections you send become chat messages and reach your model provider. Pins, routes, camera and selections are stored in Hermes plugin storage on this machine. No background processes, no telemetry, no credentials, no self-update."
maintainer: tuancookiez-hub
