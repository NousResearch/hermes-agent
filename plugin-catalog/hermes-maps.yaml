  provides_hooks: []
  provides_middleware: []
  requires_env: []
known_issues:
  - "Hermes Desktop is required: the map is a Desktop pane. The tools still save their changes without it and report delivery as queued."
  - "Place lookup uses OpenStreetMap data through Photon. Places it does not list come back as not placed instead of getting a guessed pin, and each lookup takes several seconds."
  - "Routes are straight lines between stops, not road routes."
