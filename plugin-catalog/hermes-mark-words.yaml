description: "Underlines the words in Desktop assistant replies that are worth doubting (suspected inventions, unclear or ambiguous usages) and explains them on hover, with zero to two follow-up questions that fill the composer without sending. Disclosure - the plugin reads finished assistant replies from the Desktop transcript, stores its marks, ignored words and settings in the app's localStorage, and makes no model requests of its own: marks come in-band from the reply itself (directives the bundled reply-word-marks skill teaches the main model to write), and a reply without markers simply gets no marks. No telemetry, no credentials."
