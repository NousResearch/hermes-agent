description: "Underlines the words in Desktop assistant replies that are worth doubting (suspected inventions, unclear or ambiguous usages) and explains them on hover, with zero to two follow-up questions that fill the composer without sending. Disclosure - the plugin reads finished assistant replies and the last user message from the Desktop transcript, stores its marks, ignored words and settings in the app's localStorage, and calls no third-party service: marks come in-band from the reply itself, and replies without them fall back to one batched call through Hermes's own llm.oneshot helper whose request carries the reply text together with the last user message, so the auxiliary model can judge which words are new to this reader. No telemetry, no credentials."
