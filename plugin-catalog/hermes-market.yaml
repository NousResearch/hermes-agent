readme: true
platforms: [linux, macos]
title: Hermes Market
known_issues:
  - Seller execution and the local browser approval gateway are separately operated services.
  - The public demo uses a fixed Cloudflare Tunnel and depends on its host computer staying online.
  - Supports local simulation and Base Sepolia test USDC only; mainnet is disabled.
  - The Desktop SDK page opens public Browse and local owner and purchase workspaces in the browser.
capabilities:
  provides_tools:
    - service_search
    - service_draft
    - service_inspect
    - service_quote
    - service_purchase
    - service_status
  provides_hooks: []
  provides_middleware: []
  requires_env: []
