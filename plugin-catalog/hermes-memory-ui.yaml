description: "Hermes Dashboard and Desktop viewer for built-in, holographic, Mem0, Honcho, Mnemosyne, Hindsight, and ByteRover memory. Disclosure — reads built-in memory files for profiles authorized by Hermes and enabled for the plugin; provider views follow the active profile. The backend reads local memory stores, provider settings and configured credentials, including legacy configuration fallbacks. Provider queries may send search text and bank, peer, or user IDs to configured services. ByteRover uses the local `brv` CLI, Honcho may refresh OAuth, and a local embedded Hindsight contents request may start its daemon. The UI exposes no memory editing controls."
