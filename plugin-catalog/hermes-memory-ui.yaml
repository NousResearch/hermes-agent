description: "Hermes Dashboard and Desktop viewer for built-in, holographic, Mem0, Honcho, Mnemosyne, Hindsight, and ByteRover memory. Disclosure — reads the built-in memory files (MEMORY.md, USER.md) of the active profile and of any other profile you pick that Hermes authorizes and has the plugin enabled; provider views follow the active profile and read its memory stores, provider settings and configured API keys (keys are never returned to the UI), including legacy configuration fallbacks; on your action it sends search/recall/reflect text with the configured bank/peer/user IDs to the configured Mem0, Honcho and Hindsight endpoints (Hindsight Cloud default api.hindsight.vectorize.io) using those keys, and Honcho may refresh its OAuth token; ByteRover queries run the local `brv` CLI; for a local embedded Hindsight setup a contents read may start the `hindsight-embed` daemon; no memory is written."
