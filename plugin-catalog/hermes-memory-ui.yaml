description: "Read-only Hermes Dashboard and Desktop plugin for inspecting built-in, holographic, Mem0, Honcho, Mnemosyne, Hindsight, and ByteRover memory. Disclosure — reads built-in memory files and limits from profiles permitted by the host and the target profile's plugin settings; provider views stay on the active profile. Configured providers can receive queries and bank, peer, or user IDs; provider credentials are used server-side. ByteRover can invoke the local brv CLI, and inspecting local embedded Hindsight can start its daemon. The UI does not edit memory."
