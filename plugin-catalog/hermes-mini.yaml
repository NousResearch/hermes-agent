title: Hermes Mini
description: "A mobile-first chat app for your own Hermes agent, served from the Hermes dashboard and installable to the home screen: several chats, an inbox for scheduled-job results, live narration of what the agent is doing, to-dos, a schedules panel, a model and provider picker, dictation through Hermes' speech-to-text, and opt-in Web Push. Disclosure — serves a web app and routes from the dashboard behind its login (no own port); registers an in-process `hermes-mini` gateway platform for job delivery; in app chats only, adds a turn rule and job-delivery default to the prompt (pre_llm_call), appends a progress-update request to tool results during long turns (transform_tool_result), and blocks edits to its own files (pre_tool_call); writes the live narration line with small auxiliary-model calls on the user's provider; writes `platforms.hermes-mini.home_channel` to config.yaml once; runs ffmpeg for audio metadata, `hermes gateway restart -y --detach` plus a dashboard restart from its Restart button, and, for the optional computer view's clipboard, a Tk helper and xclip; opt-in Web Push to FCM/Mozilla/Apple push services; no telemetry."
