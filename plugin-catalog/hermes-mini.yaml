title: Hermes Mini
description: "A mobile-first chat app for your own Hermes agent, served from the Hermes dashboard and installable to the home screen: multiple chats, an inbox for scheduled-job results, search, bookmarks, to-dos, scheduled jobs and slash-triggered skills, collapsible live activity trees with inline thumbnails and opened links, a model/provider picker and approval-mode selector, profile editing, inline prompt and app-connection cards, Android share-sheet support, dictation through Hermes' speech-to-text, an optional computer view, and opt-in Web Push. Disclosure — serves a web app and routes from the dashboard behind its login (no own port); registers an in-process `hermes-mini` gateway platform for job delivery; in app chats only, adds a turn rule and job-delivery default to the prompt and blocks edits to its own files; reads Hermes' state.db read-only for Inbox, Search, and activity reconciliation; writes live activity-tree narration with small auxiliary-model calls on the user's provider; writes `platforms.hermes-mini.home_channel` to config.yaml once; only on explicit user action, calls Hermes' gateway methods to edit profile name/avatar, save provider API keys, or change `approvals.mode` (with confirmation before switching to Off; never auto-approves), and renders Hermes' own password/secret prompt cards (never runs sudo itself); lets the user answer an approval from a push notification; runs ffmpeg for audio metadata, `hermes gateway restart -y --detach` plus a dashboard restart from its Restart button, and, for the optional computer view's clipboard, a Tk helper and xclip; uses internal Hermes modules for dictation, the computer view, and provider inventory metadata, which may stop working after a Hermes update; opt-in Web Push to FCM/Mozilla/Apple/Windows push services; no telemetry."
