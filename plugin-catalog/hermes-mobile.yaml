name: hermes-mobile
repo: https://github.com/geniok1980/hermes-mobile-adapter
sha: 7fdaf232bc43df2d8b730c04bf7460557fb35c82
subdir: adapter/hermes_mobile
title: Hermes Mobile Adapter
description: >-
  WebSocket platform for your own mobile, desktop or web app: it talks to the agent directly —
  text, voice, images, video and documents in both directions, approval/clarify/slash cards
  answered from the app, streaming edits, typing and avatar state events, cron delivery to a
  chosen device. Ships TypeScript and Python SDKs, platform guides and an acceptance checklist.
  Disclosure — listens on loopback by default (the wildcard address only when set
  explicitly, behind a wss proxy); inbound media is written under $HERMES_HOME/mobile-media;
  secrets are read through Hermes's profile-scoped route; approval and clarify cards stay with
  Hermes; deliver frames are accepted only from the cron sender (loopback peer or a token from
  MOBILE_DELIVER_TOKENS); no telemetry, no third-party network calls, no self-update (the pinned
  SHA is the only update path).
maintainer: geniok1980
tier: community
category: platform
requires_hermes: ">=0.21.3"
docs_url: https://geniok1980.github.io/hermes-mobile-adapter/
version: "1.0.0"
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - MOBILE_TOKEN
