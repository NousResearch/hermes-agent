# Community catalog entry — hermes-monitor
#
# Owner-submitted: the plugin's contributors own and maintain the repo below.
# Exact-SHA pin (40-hex). No self-updating code: the desktop half ships as a
# static `desktop/plugin.js` and never fetches, downloads, or replaces itself.
name: hermes-monitor
repo: https://github.com/mr-3mm3/hermes-monitor
sha: "ec6a3ada338ca3e06fbfc246bc672c3c776b0988"   # v0.3.5 (main)
version: "0.3.5"
description: "Kanban worker health in the Desktop status bar — live activity per running card with stall and loop detection (same tool + same arguments repeated), plus a compact per-provider quota readout (the related ai-usage-tracker plugin covers quota windows as a standalone feature). Zero model tokens. Disclosure — opens HERMES_HOME/kanban.db and each profile's state.db read-only for worker activity; for quota chips it loads every provider credential pool Hermes knows (auth.json, environment, HERMES_HOME/.env and each profile's .env) read-only and calls Hermes' own account-usage fetchers for each configured provider (Anthropic, Codex, OpenRouter, DeepSeek at https://api.deepseek.com/user/balance, and any provider plugin exposing fetch_account_usage), sending each pool entry's own token to its own provider. Every profile, including the backend's own active profile, is read into an immutable read-only snapshot: quota reads never refresh, select or persist a credential, so no auth.json is ever modified. No other network egress."
maintainer: Hermes Monitor contributors (independent of Nous Research)
tier: community
category: desktop
requires_hermes: ">=0.21"
platforms: [linux, macos]
docs_url: https://github.com/mr-3mm3/hermes-monitor
screenshots:
  - https://raw.githubusercontent.com/mr-3mm3/hermes-monitor/ec6a3ada338ca3e06fbfc246bc672c3c776b0988/docs/footer.png
capabilities:
