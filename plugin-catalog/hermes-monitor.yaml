description: "Kanban worker health in the Desktop status bar — live activity per running card with stall and loop detection (same tool + same arguments repeated), plus a compact Claude/Codex/DeepSeek quota readout. Read-only access to local Hermes databases; zero model tokens. Disclosure — read-only: opens HERMES_HOME/kanban.db and each profile's state.db in read-only mode for worker activity; for quota chips calls Hermes' own account-usage fetchers (Anthropic, Codex) and https://api.deepseek.com/user/balance using the DEEPSEEK_API_KEY found in your environment, HERMES_HOME/.env or any profile's .env. No other network egress."
maintainer: mr-3mm3
