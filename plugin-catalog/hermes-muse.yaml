name: hermes-muse
repo: https://github.com/xiaohei-info/hermes-muse
sha: e71945c6dd76b19f54dfeb6fedde24a94876e1b5
version: "0.1.25"
description: >-
  A proactive personal agent for Hermes, inspired by Meta Muse. It follows goals
  and temporary interests, prepares reminders, maintains memory and a quiet Feed,
  and uses Hermes subagents for research. Patrols deliver selected reminders
  directly to the current profile's Bot Chat and run an assistant turn there. One Skill and six recurring
  Cron jobs, including weekly outcome/cost review and monthly workflow audit.
  These two scheduled reports propose changes and also go to Bot Chat.
  A native output hook finalizes approved patrol/watch notice bodies and adds shared
  Bot Chat receiving guidance to notices and weekly/monthly reports; ordinary conversations
  are unchanged. Private receiving turns apply shared guidance to all native Cron
  results, including existing non-Muse jobs, so replies stand alone without reading
  internal packets; those results remain excluded from user signals. Fixed jobs invoke the model
  on every scheduled tick; patrols inspect available connected sources/devices
  before deciding whether to notify, including weather and interest news when useful.
  Disclosure: first load creates profile-local muse files/SQLite state and owned
  scripts/Cron jobs; conversation hooks retain short real-user excerpts for upkeep;
  self-review reads profile-local native tool calls/results and owned Cron outcomes,
  splitting audit work across native read-only delegates, with chunked evidence reads;
  Muse Cron workers launched through the plugin inherit the actual parent model and
  connection, while ordinary chat retains profile delegation routing;
  keeping checkpoints, seven-day page receipts, task-stage outcomes and minimal
  findings rather than a second transcript;
  scheduled work uses the user's configured model/tools and may incur their normal
  costs. No telemetry, required external service, self-updater, core patch or SOUL
  replacement. Native remove leaves owned tasks for the documented assistant cleanup;
  residual launchers are silent after removal. No phone/read-receipt guarantee.
maintainer: xiaohei-info
tier: community
category: automation
requires_hermes: ">=0.21.5"
docs_url: https://github.com/xiaohei-info/hermes-muse/blob/e71945c6dd76b19f54dfeb6fedde24a94876e1b5/README.md
platforms: [linux, macos, windows]
capabilities:
  provides_tools: [muse_manage]
  provides_hooks: [pre_llm_call, post_llm_call, transform_llm_output, on_session_end]
  provides_middleware: []
  requires_env: []
