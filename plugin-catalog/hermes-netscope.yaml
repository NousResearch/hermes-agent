description: "Offline pcap/pcapng network capture analyzer with interactive HTML reports, protocol graphs, traffic replay at 1×/4×/16×, and deterministic anomaly heuristics (traffic bursts, scan patterns, DNS anomalies, cleartext ports). Stdlib-only, no network requests, no telemetry."
