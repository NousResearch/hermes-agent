description: 'Breaking-news ticker for Hermes Desktop: a continuously scrolling RSS/Atom/JSON-Feed
  strip docked above the statusbar, plus a full /newswire management page. Per-source
  favicons served through the SSRF-gated, IP-pinned icon proxy; feed search + discovery
  (Feedly public index + link-tag/well-known-path discovery); grouping modes; offline
  SQLite cache; in-app article reading via preview.open. Zero API keys, zero model
  tokens for routine operation.'
