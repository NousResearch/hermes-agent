subdir: public/hermes-next-steps
description: "Clickable next steps under a Hermes Desktop reply: the agent offers two to six concrete options and one click sends that option back as the user's next message. Several options can be ticked and sent together as one turn, options a decision classifier reads as worth taking now carry a Recommended tag and start ticked, options that could damage something can carry a RISKY pill once that setting is on, a chip can explain a misleading label in a dim second line, and, with the carry setting on, options an earlier reply left unanswered follow the newest reply with an age label and a dismiss cross. The classifier is optional: with no classifier plugin loaded the chips work and are simply never marked. This edition stays inside the plugin SDK and drops the injected chip-border animation and the scroll back to an offering reply, both of which reach into the app's own DOM; the personal edition carries both. Follow-up Chips draws the same slot under a reply, so disable it before enabling this. Makes no network calls of its own."
