screenshots: ["https://raw.githubusercontent.com/AtlasOmnia/workbench/3daa481d193bd16143720c23348ebc8fb058e2d7/assets/demo-highlight.gif"]
description: "Workbench by Atlas Omnia — Open and edit Word, Excel, PowerPoint, OneNote and Outlook for the web in Hermes Desktop. Live-tested in the automated harness and real Hermes Desktop sessions on macOS and Windows; see docs/live-evidence.md. Every edit requests Hermes approval and returns a readback/undo receipt; undo has exceptions (large Word snapshots, Excel over 10,000 cells, some PowerPoint edits and OneNote page creation), and history is lost on pane reload. powerpoint_add_speaker_notes returns Unsupported. Requires Microsoft sign-in and Upload My Add-in. A loopback HTTP bridge on 127.0.0.1:47615-47619 accepts the configured add-in origin and a user-typed single-use code, then a per-pane token; idle listeners release after ten minutes. Default add-in site: https://atlasomnia.github.io/workbench/office/live/ (GitHub Pages, outside this catalog pin; rebuild with scripts/build_addin.py and compare SHA256SUMS). Live runs used a private site; the public origin is first exercised at publication. The pane loads Microsoft Office.js. Document data enters the local Hermes conversation; OneNote pages and email indexed on request persist unencrypted in brain.db. Reads are capped at 20,000 characters for Word and Outlook bodies. No Graph, credentials, telemetry, shell commands or unattended runs. Outlook reads only the open item; mail and calendar drafts are never sent or saved and recipients/attendees never changed. Image URL fetches alone use outbound HTTPS (public addresses, checked redirects, PNG/JPEG, 4 MiB); local images are restricted to allowed folders. Full disclosures and known limits: README and docs/reference.md. Not affiliated with Microsoft or Nous Research."
maintainer: AtlasOmnia
tier: community
category: tools
requires_hermes: ">=0.22.5"
readme: true
platforms: [macos, windows]  # Windows: one real Hermes Desktop session passed the 5-prompt story on 2026-11-10 with a single profile.
known_issues:
  - "Windows: run Workbench in one Hermes profile at a time (two profiles can both bind port 47615)."
  - "Requires the Hermes Desktop app (macOS 13+ or Windows) on the same machine as the Hermes gateway, or with the bridge ports 47615-47619 forwarded; the browser Webapp (webapp.enabled) preview pane cannot host Office for the web."
  - "Pairing follows the chat session id: after auto-compression or a /rewind fork the pane reports NotPaired and needs a fresh office_connect code."
  - "powerpoint_add_speaker_notes is registered for schema parity but always returns Unsupported: Office.js for the web has no speaker-notes API."
  - "hermes plugins validate warns (rule 9) about two private Hermes imports in scripts/livetest/, developer-only live-test scripts that Hermes never loads."
