title: Officecraft
description: "The pixel-art office & kanban control room for Hermes Agent: see what your agents and kanban chains are doing, and act on them. Disclosure — reads the kanban boards, the profile list, session metadata and token usage (each profile's state.db) read-only; writes kanban cards, a new profile and approval answers only on a confirmed user action; optional notifications through Hermes messaging and optional LLM functions (off by default, monthly cap). No third-party network, no telemetry."
maintainer: KosmGit
tier: community
category: desktop
requires_hermes: ">=0.23.0"
