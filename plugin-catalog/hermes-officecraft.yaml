title: Officecraft
description: "The pixel-art office & kanban control room for Hermes Agent: see what your agents and kanban chains are doing, and act on them. Disclosure — reads the kanban boards, the profile list, each profile's cron delivery targets, and session metadata and token usage from each profile's state.db (read-only); on a confirmed user action it creates, comments on, unblocks and launches kanban cards and campaign boards, creates or edits a profile, and answers pending approvals (an \"always\" answer adds the command pattern to that profile's permanent allowlist); optional notifications go through Hermes messaging to recipients Hermes already knows; optional LLM functions use the Officecraft auxiliary model with a monthly cap; all of these are off by default. No third-party network, no telemetry."
maintainer: KosmGit
tier: community
category: desktop
