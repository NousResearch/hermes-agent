name: hermes-openready
repo: https://github.com/socraticblock/hermes-openready
sha: 9b661ad88a89edbaca3bfca2cfd639b564c30ced
title: Open-Ready Publish Guard
description: "Prepare an open-source release candidate from a private repository and refuse to publish it: five tools (status, doctor, candidate, verify, gate) plus a pre_tool_call hook that blocks or escalates any terminal command that would change a repository's visibility or create a public repository until the owner has approved that exact candidate digest. None of the tools can push, change visibility, or upload; candidate writes a local candidate directory and verify may emit a packet. The plugin shells out to the Open-Ready CLI, which is installed separately; the approval check runs from a temporary directory with GitHub tokens removed from its environment."
maintainer: socraticblock
category: automation
docs_url: https://github.com/socraticblock/hermes-openready#readme
version: "0.1.0"
requires_hermes: ">=0.20"
platforms: [linux, macos]
capabilities:
  provides_tools:
    - openready_status
    - openready_doctor
    - openready_candidate
    - openready_verify
    - openready_gate
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
