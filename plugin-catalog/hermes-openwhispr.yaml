description: >-
  Local-first OpenWhispr dictation history and shared notes for Hermes agents:
  find what the user said, search notes, transcribe local audio. Free local
  desktop bridge by default, paid cloud opt-in only. Skill-carrier plugin,
  no tools or hooks registered. Disclosure — reads the user's own dictation
  history and notes via the external OpenWhispr CLI; remote cloud calls only
  on explicit opt-in; the agent never opens credential files itself.
