name: hermes-osint-map
title: Hermes OSINT Map
repo: https://github.com/Adolanium/hermes-osint-map
sha: ffad00ee4dc84c9fc1cb5cb00d9934b56edc68f0
description: "A live situational-awareness globe in Hermes Desktop: earthquakes (USGS), disaster alerts (GDACS), natural events (NASA EONET), US severe weather (NWS), military and nearby aircraft (adsb.lol), satellites propagated live from CelesTrak elements, GDELT news incidents, about 5,000 official traffic cameras (Transport for London, with its short JamCam video clips, Caltrans, the Hong Kong Transport Department and Singapore LTA), shipping chokepoints and an opt-in live cyber-attack layer on a dithered 3D globe, with satellite orbits, aircraft tracks, a camera wall, a tour of what matters right now, day and night shading and night-vision, thermal and CRT looks, country dossiers (World Bank facts, events, headlines), NOAA space weather, markets, a feed of events, headlines and alerts, and a passive recon toolkit (DNS, RDAP, TLS, security headers, CT subdomains, CVE with CISA KEV, IP, GitHub, MAC). Seven agent tools (osint_situation, osint_events, osint_country, osint_recon, osint_news, osint_watch, osint_show) answer from the same sources in any chat; osint_show lets Hermes fly the Desktop globe, pin places and switch layers while it answers, and the page's Brief me, Ask Hermes and dossier buttons open a chat that uses them. In Hermes Desktop, answers about a place end with a live map card. Watches check an area on a schedule and alert only on new events. No keys needed; an optional TWELVEDATA_API_KEY (plugin setting, read through Hermes's secret scope) adds equities and commodities. Unofficial; not affiliated with any data provider. Disclosure — the gateway fetches public data from fixed hosts (earthquake.usgs.gov, eonet.gsfc.nasa.gov, gdacs.org, api.weather.gov, data.gdeltproject.org, api.adsb.lol, celestrak.org, services.swpc.noaa.gov, api.tfl.gov.uk, api.data.gov.sg, cwwp2.dot.ca.gov and static.data.gov.hk (camera lists), and camera stills and clips from TfL's JamCams bucket on s3-eu-west-1.amazonaws.com, images.data.gov.sg, cwwp2.dot.ca.gov and tdcctv.data.one.gov.hk, fetched only by camera id for cameras the user opens, api.worldbank.org, the BBC, Al Jazeera, DW, Guardian and France 24 RSS feeds, api.gdeltproject.org (GDELT article search, only when a news query is given, which sends up to six words of the query), api.coingecko.com, and api.twelvedata.com with the key in a header when set), cached and only while the page is open or a tool is called, with a hermes-osint-map User-Agent; the cyber-attack layer is off until the user turns it on and then reads threatmap-api.checkpoint.com, the undocumented feed behind Check Point's public threat map (unofficial; one stream, closed about 45 seconds after no page shows the layer); recon sends the domain, IP, CVE id, GitHub name or MAC prefix the user or agent enters to dns.google, rdap.org, crt.sh, cve.circl.lu, cisa.gov, ipwho.is, api.github.com and api.macvendors.com, and the TLS and headers lookups connect directly to the host named, refusing private, loopback, link-local, CGNAT and other internal addresses on every redirect, on ports 443/8443 (TLS) and 80/443/8080/8443 (headers) only; GDELT incidents are machine-coded from news coverage and labelled as such, incident titles are read from the article URL, and country-centroid locations are flagged as country-level; a watch is a normal Hermes scheduled job the user creates and can remove (named “OSINT watch · <name>”, every 15 minutes at the fastest), each check is one short model call with the user's default model plus the same public-source requests, and alerts go only to the destination the user picked (Hermes or a connected messaging channel); watch state (area, rules, the last 2,000 event ids seen, the last 20 alerts) and Hermes's latest globe scene are kept in the plugin's own state file under plugin-data; the page keeps its layer choices in Desktop plugin storage; no shell commands, no processes of its own, no telemetry."
