name: hermes-otel
repo: https://github.com/briancaffey/hermes-otel
sha: "18313bde815d4dc6ab238e982c6aa86a63a512f8"
subdir: hermes_otel
description: 'OpenTelemetry for Hermes Agent: sessions, LLM and API calls, tool calls, sub-agents and
  approvals as OTLP traces, metrics and logs to any OTLP backend. Disclosure — sends span data, including
  prompts, tool arguments and tool output, only to the backends you configure; by default (content_capture:
  full) whole prompts and responses, unclipped; preview clips to 1200 chars, off sends no content; with
  none configured it keeps a local SQLite store under $HERMES_HOME and sends nothing; installs opentelemetry-api,
  -sdk, opentelemetry-exporter-otlp-proto-http and PyYAML into the Hermes venv.'
maintainer: briancaffey
tier: community
category: general
requires_hermes: ">=0.21"
docs_url: https://briancaffey.github.io/hermes-otel/
version: "1.18.1"
image: https://raw.githubusercontent.com/briancaffey/hermes-otel/18313bde815d4dc6ab238e982c6aa86a63a512f8/docs/catalog-banner.png
capabilities:
  provides_tools: []
  provides_hooks:
  - api_request_error
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - on_session_start
  - post_api_request
  - post_approval_response
  - post_llm_call
  - post_tool_call
  - pre_api_request
  - pre_approval_request
  - pre_llm_call
  - pre_tool_call
  - subagent_start
  - subagent_stop
  provides_middleware: []
  requires_env: []
