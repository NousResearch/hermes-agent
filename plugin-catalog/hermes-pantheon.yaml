description: "Ten Hermes Desktop themes in dithered classical marble, one god each: Olympus, Nyx, Hades, Poseidon, Helios, Selene, Athena, Aphrodite, Medusa and Caduceus. Install once, then switch with /skin <name>. Disclosure — theme-only desktop plugin: it registers ten themes through the plugin SDK, and their stylesheets restyle parts of Desktop's own UI (sidebar art, tabs, composer, wordmark) only while a Pantheon theme is active. Fonts and art are bundled; no network requests, no agent tools or hooks."
