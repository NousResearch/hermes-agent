sha: fb12efdd1b4f8e95a3a45eeedfa203d106d1efd8
description: "Eighteen Hermes Desktop themes in dithered classical marble, one god each: all twelve Olympians plus Hades, Nyx, Helios, Selene and Medusa. Install once, then switch with /skin <name>. Matching terminal skins ship in cli/skins. Disclosure — theme-only desktop plugin: it registers eighteen themes through the plugin SDK, and their stylesheets restyle parts of Desktop's own UI (sidebar art, tabs, composer, wordmark) only while a Pantheon theme is active. It also watches Desktop's active theme: when a terminal skin named pantheon-<god> is active, it switches Desktop to that god's theme through the SDK's requestTheme. The terminal skins are plain YAML files the user copies into the Hermes skins folder by hand; the plugin does not install them or write any files. Fonts and art are bundled; no network requests, no agent tools or hooks."
