name: hermes-passbolt-secret-source
repo: https://gitlab.com/AndreasBBS/hermes-passbolt-secret-source
sha: 877c19c50e9de54725a36b7aba2088f4479e3eea
description: >-
  Passbolt secret source for Hermes: resolves passbolt:// references and can
  auto-forward every non-provider secret the bot's Passbolt identity can read,
  making Passbolt sharing/revoking the sandbox allowlist. Talks to a Passbolt
  server over HTTPS through go-passbolt-cli; no telemetry. Requires Hermes
  >= 0.21.6.
maintainer: AndreasBBS
tier: community
category: general
requires_hermes: ">=0.21.6"
docs_url: https://gitlab.com/AndreasBBS/hermes-passbolt-secret-source#readme
version: "1.0.0"
platforms: []
known_issues:
  - >-
    Auto-passthrough calls tools.env_passthrough.register_env_passthrough, which
    is not yet on Hermes' public plugin-API allowlist; validation passes with a
    private-import warning. See the PR for proposed public APIs.
  - >-
    Provider credentials are intentionally not auto-forwarded; Hermes' sandbox
    provider-credential blocklist still applies.
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - PASSBOLT_PASSWORD
