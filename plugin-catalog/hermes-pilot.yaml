sha: "69fef2bf5cd3eb937fb8b5c8862e03d30ba0df54"
description: "Drive an autonomous Hermes Agent from a phone or tablet. Hermes Pilot turns the decisions an agent needs into one-tap review sheets and annotated screenshots, carries a one-line idea through a Quick Review interview into a spec the batch runner can execute, then files and monitors the kanban batches — with kanban, chat, terminal and usage in one installable PWA. Since 0.2.0 the review queue also tracks each request through drafting → waiting → applying → done, chat is per-profile, and a coherence report flags where a repository's declared conventions (`.hermes-coherence.json`) and its recent commits have drifted apart. Ships three bundled skills (quick-review, annotation, spec-architect), a Hermes dashboard tab (pairing QR, bridge status, scan directories, service control) and the PWA bridge it talks to. Disclosure — the plugin runs a local HTTP/WebSocket bridge bound to 127.0.0.1 (default port 4097), authenticated with a 256-bit token generated on first run and stored 0600 under the plugin data folder; a paired phone or tablet gets an interactive login shell on this computer through the bridge's terminal, outside Hermes' approval prompts and sandbox, plus chat, kanban and session actions through the local `hermes` CLI; it reads the kanban SQLite databases and `~/.hermes/state.db` read-only (usage, cross-session search, live turns) and reads the repositories you register (git log/numstat, `docs/SPEC*.md`, an optional `.hermes-coherence.json`); it can control the Hermes gateway already running on this machine — drain, restart, stop and start go to the local dashboard API on 127.0.0.1:9119, and the emergency stop writes the `~/.hermes/ESTOP` sentinel through `hermes pause` and aborts running kanban tasks; it writes to disk in two places beyond its own data folder: `- **Status**: archived` is appended to a `SPEC*.md` inside a registered repository when you archive a spec, and `client-errors.log` records browser-side crashes under the plugin data folder; review sheets, annotation images, memos and uploads are stored locally under the plugin data folder; `node bin/hermes-pilot.mjs init` (run by you after `npm ci`, which installs the native node-pty module) copies three bundled skills into your Hermes skills folder and the dashboard files into your plugins folder; legacy akapen/mobile-pwa migration runs only when you confirm it, and removes old crons through `hermes cron remove`; a fresh install attaches to the gateway that is already running on this machine rather than starting its own; remote access is opt-in and left to you (documented Tailscale `serve`, never started by the plugin); `hermes-pilot service install` writes a launchd (macOS) or systemd --user (Linux) unit only on explicit command; the bundled Interactive Demo is a static mock that talks to no backend; no telemetry and no third-party upload."
maintainer: hajimemanila
tier: community
