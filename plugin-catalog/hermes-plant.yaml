title: Hermes Plant
description: "A calm houseplant for Hermes Desktop that grows slowly in real time over days and weeks. It sits above the app like the Hermes pet, takes no layout space and can be dragged anywhere. Click it for a care wheel: water, prune, rotate, feed, repot, or ask Hermes. Pruning shapes how it branches, so every plant differs, and neglect only pauses it. Two agent tools let Hermes check the plant and tend it when you ask. Original blue-ink artwork drawn in code. Reachable from the status bar, the command palette and the keyboard, and it speaks through the Hermes pet when one is showing. Disclosure: no network requests, no background model calls and no background processes; Ask Hermes submits one chat message only when you press it; the plant is kept in Desktop plugin storage and in plugin-data/hermes-plant/data.db; the plugin adds its own floating element to the page (Hermes has no SDK area for one) and removes it on unload, without reading or changing core markup."
