version: "1.1.0"
title: Hermes Plant
description: "A calm little garden for Hermes Desktop that grows in real time. It sits above the app like the Hermes pet, takes no layout space and can be dragged anywhere. Click a plant for a care wheel: water, prune, rotate, fertilize, repot, pick, sell, or ask Hermes. Four species (leafy plant, fern, cactus, little tree) grow in their own ways, pruning shapes how each one branches, and neglect only pauses them. Care earns play coins, and a small shop sells more plants and fertilizer, up to six pots. Bugs land now and then and can be shooed away. Two agent tools let Hermes check the garden and tend it when you ask. Original blue-ink artwork drawn in code. Reachable from the status bar, the command palette and the keyboard, and it speaks through the Hermes pet when one is showing. Disclosure: no network requests, no background model calls and no background processes; Ask Hermes submits one chat message only when you press it; coins are play money inside the plugin; the garden is kept in Desktop plugin storage and in plugin-data/hermes-plant/data.db; the plugin adds its own floating element to the page (Hermes has no SDK area for one) and removes it on unload, without reading or changing core markup."
