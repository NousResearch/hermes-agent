version: "0.4.1"
title: Plexus
description: "Your local markdown vault as a note graph, file tree and tabbed editor in one Hermes Desktop workspace tab, with Obsidian-style wikilinks, nested folder regions in the graph, link rewriting on rename, image and note embeds, and a ::vault chat link. Disclosure — reads and writes markdown files (and images for previews) only inside the one folder you grant, through Hermes Desktop's folder-scoped file API (ctx.files); deletes go to the OS trash. No network calls unless you turn on loading of images that notes link from the web (off by default; the image's host then sees your IP address). No shell commands, background processes, telemetry, agent tools or stored credentials."
