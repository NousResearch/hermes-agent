version: "0.1.0"
title: Plexus
description: "Your local markdown vault as a note graph, file tree and tabbed editor in one Hermes Desktop workspace tab, with Obsidian-style wikilinks, link rewriting on rename, image and note embeds, and a ::vault chat link. Disclosure — reads and writes markdown files (and images for previews) in the vault folder you choose, through the desktop app's file bridge; deletes go to the OS trash. No network calls, shell commands, background processes, telemetry, agent tools or stored credentials."
