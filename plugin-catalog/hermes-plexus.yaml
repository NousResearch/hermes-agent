known_issues:
  - "Desktop only: it needs host.openWorkspace and the folder-scoped file API (ctx.files)."
  - "No live file watching; the vault rescans when the window regains focus and after saves."
  - "Notes larger than 4 MiB (the ctx.files read limit) cannot be opened."
