name: hermes-plugin-zalo
repo: https://github.com/moken627-hub/hermes-plugin-zalo
sha: 4138ca8f9f619e8bc44b4449b51ec98b0672d40a
description: >-
  Zalo Bot Platform gateway adapter for Hermes Agent — relays messages between Zalo DMs/groups
  and the agent over the official Bot API (bot.zaloplatforms.com), long-polling or webhook mode.
  Adds group management, slash commands, moderation and CRM contact sync. Zero extra dependencies
  (uses httpx, already a Hermes dependency). Production-tested on multiple Vietnamese deployments.
  Disclosure — connects to the third-party Zalo service with the user's bot token; the token is
  read from environment/config, never transmitted anywhere except api.zaloplatforms.com.
maintainer: moken627-hub
tier: community
category: platform
requires_hermes: '>=0.19'
docs_url: https://github.com/moken627-hub/hermes-plugin-zalo#readme
version: "2.1.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - ZALO_BOT_TOKEN
