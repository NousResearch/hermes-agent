name: hermes-plugin-zalo
repo: https://github.com/moken627-hub/hermes-plugin-zalo
sha: 527fadd0126fbbe07dc02fa859218d120ce9c5e8
description: >-
  Zalo Bot Platform gateway adapter for Hermes Agent — relays messages between Zalo DMs/groups
  and the agent over the official Bot API (bot-api.zaloplatforms.com), long-polling or webhook
  mode. Adds slash commands and moderation. Zero extra dependencies (uses httpx, already a
  Hermes dependency). Production-tested on multiple Vietnamese deployments.
  Disclosure — connects to the third-party Zalo service with the user's bot token; the token is
  read from environment/config, never transmitted anywhere except bot-api.zaloplatforms.com.
maintainer: moken627-hub
tier: community
category: platform
requires_hermes: '>=0.19'
docs_url: https://github.com/moken627-hub/hermes-plugin-zalo#readme
version: "2.1.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - ZALO_BOT_TOKEN
