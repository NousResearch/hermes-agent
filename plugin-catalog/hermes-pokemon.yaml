title: Hermes Pokémon
description: >-
  A cozy pixel-art companion garden for Hermes Desktop with three starters,
  nicknames, fetch, berries, species-specific habits, XP, and optional evolution
  through all nine starter forms. Independent fan project bundling CHUNSOFT
  Pokémon sprites and SpriteCollab community contributions; artwork is
  excluded from the source-code MIT license. Uses local plugin
  storage and read-only focused-session activity, with no runtime network
  requests, credentials, backend, or model calls.
