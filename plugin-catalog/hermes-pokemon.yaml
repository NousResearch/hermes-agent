description: >-
  A cozy pixel-art companion garden for Hermes Desktop with three starters,
  nicknames, fetch, berries, welcome-back greetings, and species-specific habits.
  Independent fan project bundling CHUNSOFT Pokémon sprites via PMDCollab;
  artwork is excluded from the source-code MIT license. Uses local plugin
  storage and read-only focused-session activity, with no runtime network
  requests, credentials, backend, or model calls.
