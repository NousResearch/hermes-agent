name: hermes-portals
title: Hermes Portals
repo: https://github.com/ochikov/hermes-portals
sha: e336ce862a3f5c4ef7ddffd2590ff7c79a3a246c
description: "Stateful interactive tools with laptop-to-phone camera handoff and optional local Mac gesture control. Disclosure — `/portals start` launches a background local web companion (its own venv, built by a manual `scripts/setup.sh` that downloads hash-pinned Python/npm packages and a checksum-verified MediaPipe model from storage.googleapis.com); with a LAN IP it listens on all interfaces on port 8766 over unencrypted HTTP with token pairing; the optional source-built macOS app uses Camera and Accessibility permissions to move the cursor, click, scroll and switch apps from hand gestures."
maintainer: ochikov
tier: community
category: tools
requires_hermes: ">=0.20.5"
version: "0.3.0"
docs_url: https://github.com/ochikov/hermes-portals/blob/e336ce862a3f5c4ef7ddffd2590ff7c79a3a246c/README.md
readme: true
platforms: [macos, linux]
screenshots:
  - https://raw.githubusercontent.com/ochikov/hermes-portals/e336ce862a3f5c4ef7ddffd2590ff7c79a3a246c/docs/screenshots/laptop-diagram.png
  - https://raw.githubusercontent.com/ochikov/hermes-portals/e336ce862a3f5c4ef7ddffd2590ff7c79a3a246c/docs/screenshots/hand-demo.png
  - https://raw.githubusercontent.com/ochikov/hermes-portals/e336ce862a3f5c4ef7ddffd2590ff7c79a3a246c/docs/screenshots/laptop-calculator.jpg
  - https://raw.githubusercontent.com/ochikov/hermes-portals/e336ce862a3f5c4ef7ddffd2590ff7c79a3a246c/docs/screenshots/phone-calculator.jpg
known_issues:
  - "Trusted-LAN prototype: phone traffic uses HTTP, not TLS."
  - "Explicit scripts/setup.sh step is required after installation."
  - "Mac input requires macOS 13+, a local Swift build, Camera and Accessibility; no notarized binary is distributed."
capabilities:
  provides_tools: [portals_app, portals_diagram]
  provides_hooks: []
  provides_middleware: []
  requires_env: []
