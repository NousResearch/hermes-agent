name: hermes-profile-switcher
title: "Profile Switcher & Handoff"
repo: https://github.com/Vsemagush/hermes-profile-switcher
sha: 02795803b23c9001c21541379c73982b00525a13
description: >-
  Composer profile picker with explicit context handoff into a new chat and
  verified single-folder project inheritance. Disclosure — reads the connection
  and profile roster and focused session/project metadata. It may read the
  transcript to verify an empty source, even for Start fresh. Copy context and
  Brief handoff store selected source text in a new target-profile session.
  No automatic submission or model call. Cross-gateway handoffs have no inherited
  project; source chat, composer drafts and profile configuration are not modified.
