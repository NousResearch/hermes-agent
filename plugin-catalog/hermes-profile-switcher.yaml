platforms: []
onboarding: false
known_issues:
  - "Experimental Desktop UI plugin; v0.22.2 source contracts and user-reported smoke checks, not automated Electron certification or every OS/topology."
  - "Project inheritance requires a verified same-gateway single-folder checkout. Multi-folder/worktree/ambiguous structures are refused; another gateway opens without an inherited project."
  - "An unpersisted source draft requires live and transcript emptiness checks to agree and opens without inherited project context; unavailable or contradictory evidence refuses. The different-profile choice dialog is retained even when there is nothing to carry."
  - "Media-text filtering is best-effort: untyped HTTP links are kept; flattened unpadded data URI/caption boundaries may be ambiguous. Read the README before transferring private context."
  - "Known-chat recovery lasts only while the originating control is mounted. Source-drift guards cannot cancel a host openSession call already accepted by the SDK."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
