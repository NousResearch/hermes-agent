name: hermes-profile-switcher
title: "Profile Switcher & Handoff"
repo: https://github.com/Vsemagush/hermes-profile-switcher
sha: 2870396031642ff5a1181a8fc11471adcaf047d4
description: >-
  Composer profile picker with explicit context handoff into a new chat and
  verified single-folder project inheritance. Disclosure — reads focused
  session/project metadata; may read the live roster and transcript to verify
  empty sources, even for Start fresh. Copy context and Brief handoff store
  selected source text in a new target-profile session.
  No automatic submission or model call. Cross-gateway handoffs have no inherited
  project; source chat, composer drafts and profile configuration are not modified.
maintainer: Vsemagush
tier: community
category: desktop
version: "0.1.0"
requires_hermes: ">=0.22.2"
