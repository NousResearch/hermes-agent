description: >-
  Pushover deliverables for Hermes Agent (send-only). Registers four
  severity-tiered cron delivery platforms — pushover-quiet,
  pushover-normal, pushover-high and pushover-critical (emergency: repeats
  until acknowledged), so a cron job picks an intent with a plain
  deliver=pushover-<severity> — and a pushover_send_file agent tool that
  delivers an image as a real Pushover attachment (png/jpeg/gif, 5 MB,
  magic-byte verified against the 5,242,880-byte limit), returning the
  Pushover request id and, at emergency priority, the receipt id needed to
  cancel the repeating alert. Disclosure — sends HTTPS requests to
  https://api.pushover.net/1/messages.json only, carrying your Pushover app
  token, user key, message text and, via the tool, the bytes of the single
  image file you point it at (reads that one file; nothing else on disk);
  credentials are read through Hermes's scoped secret route
  (agent.secret_scope / get_scoped_secret) only, never from .env files or
  os.environ; configuration lives under
  plugins.entries.hermes-pushover-deliverables.settings and
  gateway.platforms.pushover-<severity>.extra; writes nothing on disk.
  Outbound-only: Pushover has no inbound chat surface, so there is no
  inbound or approval path, no telemetry, no background processes.
  Independent implementation; not affiliated with Pushover LLC.
maintainer: Jessy-Boo
tier: community
category: platform
requires_hermes: ">=0.21"
docs_url: https://github.com/Jessy-Boo/hermes-pushover-deliverables#readme
