name: hermes-quest
description: >-
  Read-only pixel-art RPG view of real Hermes Kanban and worker activity,
  with a live web dashboard tab and an optional native Desktop page.
  The Desktop page currently supports explicit local connections only;
  registry and SSH remote connections fail closed until a public SDK
  connection-lifecycle hook is available. Standalone demo data is synthetic.
