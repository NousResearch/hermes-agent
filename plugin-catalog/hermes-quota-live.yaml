title: "Hermes Quota Live"
description: "Real provider quota (OpenCode Go, OpenRouter, Copilot) inside the Hermes desktop app. Disclosure — calls OpenCode Go (opencode.ai), OpenRouter, GitHub (api.github.com/copilot_internal/user) and Z.ai/BigModel with the matching key you configured to read your own quota, every 30 seconds while the panel or status chip is shown; with HERMES_QUOTA_OQG=1 it also polls a local opencode-quota-gui on 127.0.0.1:4144; reads token usage, session titles and working directories from Hermes' state.db (read-only); writes nothing and sends no data elsewhere."
