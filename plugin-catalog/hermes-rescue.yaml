version: "0.1.0"
title: "Rescue"
description: "Keeps your agent from breaking Hermes, and says what really went wrong. Refuses agent tool calls that would delete or hand-edit Hermes's own data (sessions, state.db, memories, skills, settings, profiles, keys) and names the supported command instead; sends edits to settings, SOUL.md or memory files to Hermes's approval prompt with a snapshot first (/rescue undo); and when a reply fails or quietly comes from a backup, adds one plain line per attempt with the real cause and the fix (NousResearch/hermes-agent#144562, #147620). /rescue in every surface, plus a Desktop status chip and pane. Disclosure — reads tool-call arguments (command, path, code) to decide; writes plugin-data/hermes-rescue/rescue.db (event kind, short description, up to 200 characters of the command, provider/model/status of failed model calls, Rescue's explanation; about 2,000 events kept); copies files a risky change would touch (config.yaml, SOUL.md, memories/, skills/, state.db up to 300 MB) into plugin-data/hermes-rescue/snapshots/ before the change (newest 30 kept) and writes them back on /rescue undo (for state.db only the missing conversations and messages are added back; folders are merged; only inside the Hermes folders); never opens, copies, moves or overwrites .env, auth.json or the other credential stores Hermes lists (mirrored from hermes_cli/profiles.py); after a failed model call that ends a turn, a short-lived background thread posts the note to the same conversation with ctx.post_message (after 1.5 s in chat apps) and edits it if a later attempt answers. Never auto-approves (in YOLO mode Hermes itself approves the ask-first edits; refusals still hold). No network calls, no shell commands, no model calls, no stored credentials, no telemetry."
maintainer: 0xNexuz
