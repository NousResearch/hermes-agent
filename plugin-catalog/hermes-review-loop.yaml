description: >-
  Unattended GitHub pull-request review between two Hermes agents: one pushes fixes, a different one
  reviews, rounds are capped in verdicts, a watchdog reports silent stalls, and the loop never
  merges. Disclosure — runs Hermes agent turns unattended, each inside bubblewrap with terminal and
  file tools but no credentials, no network and none of your secret files; only a host-side broker
  writes to GitHub, with repo-scope tokens you provide in separate files; spawns host processes
  (bwrap, git, hermes workers); downloads PR source archives and pinned Rust crates on the host;
  creates webhook routes on your gateway and one cron watchdog job; deletes its own local review
  artifacts for merged or closed PRs. Nothing runs until you arm a loop, and fixer pushes stay off
  until you opt in. Opt-in extras — an observer that posts transition notices to the chat you name;
  issue triage that labels issues; issue fixes a maintainer hands over with a label (a new branch
  and PR, capped per day); the reviewer filing its non-blocking findings as issues; an experimental
  seat on your own Claude subscription, which needs the claude-subscription-directsdk plugin and the
  claude CLI installed and logged in (OAuth seats refresh through Hermes's own resolver). Linux
  only.
