description: "ROI measures your local-inference hardware payback on Hermes: recovery %, break-even date and a 4-tier verdict, live from your own sessions. Disclosure — reads state.db read-only (sessions/tokens/billing metadata across your local profiles; no raw messages); computes locally; no third-party network calls, no telemetry, no credentials read or stored; benchmark API prices, FX and electricity cost are whatever you type in."
