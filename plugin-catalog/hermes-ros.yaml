name: hermes-ros
title: ROS Robot Control
repo: https://github.com/arcabotai/hermes-ros
sha: 537a67e7ec8e4f1d219643e349605a741a532e08
version: "0.1.0"
description: "Drive and observe ROS / ROS 2 robots from Hermes over rosbridge: list topics, services and nodes, read odometry, grab camera frames for the vision model, publish, call services, drive and e-stop, with every tool call gated by a pre_tool_call safety interlock (speed and duration limits, optional geofence, topic and service write allowlists, a latching e-stop, every blocked call logged). Ships a built-in mock robot (2D sim with a camera and a red cone) so it runs with no ROS at all, a bundled safety skill, and an optional read-only dashboard tab. Disclosure — network: in rosbridge mode it opens one websocket to the rosbridge server you configure (default localhost:9090), lazily on first use; mock mode (default) makes no network connections. Files: camera snapshots, a blocked-call audit log, the e-stop latch and the last pose under the plugin data dir. No credentials. One dependency, websocket-client (already in Hermes's lock). With a real robot attached the agent can physically move it; limits default to 0.5 m/s, 1.0 rad/s and 5 s per command and are enforced outside the model."
maintainer: Arca Computer (arcabotai)
tier: community
category: tools
requires_hermes: ">=0.21.6"
docs_url: https://github.com/arcabotai/hermes-ros#readme
readme: true
capabilities:
  provides_tools:
    - ros_list
    - ros_echo
    - ros_drive
    - ros_publish
    - ros_call_service
    - ros_get_pose
    - ros_camera_snapshot
    - ros_stop
    - ros_status
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
