known_issues:
  - >-
    One mailbox per Hermes profile: several brands share the profile's single
    SMTP login until Hermes exposes per-instance secrets.
  - >-
    Reply intent is keyword-based; a reply it cannot decide opens a review item
    instead of guessing.
  - CSV import only (no .xlsx parsing yet).
