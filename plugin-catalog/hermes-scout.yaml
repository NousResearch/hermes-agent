version: "0.4.0"
description: "Search a folder of local notes, docs, code, PDFs and Word files by meaning and exact words with scout_search, and find related files with scout_similar. Questions are ranked by meaning; queries made of code-like names such as ERR_4291 put exact matches first (SQLite full-text BM25). Embeddings come from any OpenAI-compatible /embeddings endpoint (a local Ollama server by default), and an incremental SQLite index re-embeds only changed files. Adds a /scout command (doctor, status, index, clear) and a bundled skill. Standard library only. Disclosure: sends file chunks and search queries to the configured embeddings endpoint (localhost by default; a hosted endpoint receives the text of the files searched), and /scout doctor sends one fixed test sentence there; reads text files, and PDF and .docx files whose text it extracts locally, under the folder the model names, skipping hidden, dependency, gitignored, binary and oversized files and every path Hermes's file tools refuse; writes only its index under the plugin's data folder, which /scout clear empties; the optional SCOUT_API_KEY is read through Hermes's secret store and sent only to the configured endpoint."
