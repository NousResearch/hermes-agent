version: "0.3.0"
description: "Search a folder of local notes, docs or code by meaning and exact words with scout_search, and find related files with scout_similar. Files are split into overlapping chunks, embedded through any OpenAI-compatible /embeddings endpoint (a local Ollama server by default) and ranked by cosine similarity merged with a SQLite full-text (BM25) keyword ranking; an incremental SQLite index re-embeds only changed files. Standard library only. Disclosure: sends file chunks and search queries to the configured embeddings endpoint (localhost by default; a hosted endpoint receives the text of the files searched); reads text files under the folder the model names, skipping hidden, dependency, gitignored, binary and oversized files and every path Hermes's file tools refuse; writes only its index under the plugin's data folder; the optional SCOUT_API_KEY is read through Hermes's secret store and sent only to the configured endpoint."
maintainer: Shizoqua
tier: community
category: tools
requires_hermes: ">=0.21.0"
