name: hermes-sentinel
repo: https://github.com/SaltProphet/hermes-sentinel
sha: "2132c318cb611f9ebb342c03002ae936bed27dcb"
maintainer: Justin Strange
tier: community
category: tools
description: "Deterministic runtime circuit breaker and local execution auditor. Disclosure - blocks any turn whose new user message contains a credential-shaped string; refuses a repeated identical tool call on its third attempt when the previous two results were identical (8 for status/poll-style tools) and blocks the 30th consecutive identical call even when results change, until `/sentinel reset` or a different call; redacts credential-shaped text in every tool result and truncates each result to 4000 characters / 100 lines before the model sees it; stores audit events (redacted 200-char argument previews) in the active Hermes home's `plugin-data/hermes-sentinel/sentinel_audit.db`, falling back to memory-only or no auditing; no network calls, subprocesses or telemetry. Disclosure — blocks any turn whose new user message contains a credential-shaped string; refuses a repeated identical tool call on its third attempt when the previous two results were identical (8 for status/poll-style tools) and blocks the 30th consecutive identical call even when results change, until `/sentinel reset` or a different call; redacts credential-shaped text in every tool result and truncates each result to 4000 characters / 100 lines before the model sees it; stores audit events (redacted 200-char argument previews) in the active Hermes home's `plugin-data/hermes-sentinel/sentinel_audit.db`, falling back to memory-only or no auditing; no network calls, subprocesses or telemetry."
requires_hermes: ">=0.22.6"
version: "0.1.4"
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - pre_tool_call
    - post_tool_call
    - transform_tool_result
  provides_middleware: []
  requires_env: []
