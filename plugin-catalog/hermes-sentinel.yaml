name: hermes-sentinel
repo: https://github.com/SaltProphet/hermes-sentinel
commit: 456ce6ee84f0ce6d92bce112937214b7d844147b
author: Justin Strange
license: MIT
description: "Deterministic runtime circuit breaker, loop trap prevention, and execution truth auditor for Hermes Agent. Disclosure — registers pre_llm_call, pre_tool_call, and post_tool_call hooks; persists local audit logs to SQLite; zero network telemetry."
entrypoint: hermes_sentinel:register
hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
cli_commands:
  - sentinel
