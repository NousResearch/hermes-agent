version: "0.1.0"
title: ShapeRotator — verified engineering design
description: >-
  Parametric mechanical CAD and linear-static FEA for Hermes, with a claims checker: stress,
  deflection, safety factor or mass the agent quotes is checked against the analyses it actually ran,
  and a verification footer is appended to the reply. One toolset drives FreeCAD (headless,
  cross-platform) or Autodesk Inventor (Windows, COM); every feature reports a volume/topology delta;
  FEA (FreeCAD FEM + Gmsh + CalculiX) reports equilibrium, mesh convergence and an AS/NZS-aware yield
  safety factor, and a design sweep finds the lightest part meeting a target SF; drawings on both backends
  to the standard the user picks once per chat (AS 1100, ISO, ASME, DIN, BS 8888, JIS, GB), with PDF export
  gated on a QA check. Desktop pane: live 3D view, click a face
  to reference it in chat, stress map, evidence log. On Inventor, cad_native exposes 100+ inventor-forge
  tools (sheet metal + flat-pattern DXF, assemblies, interference, BOM, materials, mass properties,
  stress/modal analysis in Inventor's own Stress Analysis feeding the same evidence log).
  Disclosure — starts FreeCAD's Python as a worker process (which runs Gmsh and CalculiX) and, on
  Windows, can drive Autodesk Inventor over COM; cad_python runs Python inside the CAD app only after
  the user approves each call; reads files the user names; writes models, renders, FEA folders and exports
  in the session's job folder, and any write outside it (or a save over a file opened from elsewhere) goes
  through a Hermes approval prompt naming the path; child processes (FreeCAD worker, MCP servers, headless
  browser for the PDF report) get a minimal environment without provider keys; appends a verification footer to assistant
  replies that quote engineering figures; Inventor stress/modal analysis (no API exists) takes over the
  mouse and keyboard for about half a minute, only after the user approves each call; no network,
  telemetry or credentials. Inventor backend: inventor-forge (MIT, same author),
  vendored.
