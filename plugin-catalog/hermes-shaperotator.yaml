version: "0.2.0"
title: ShapeRotator — part and assembly design in real CAD
description: >-
  Parametric part and assembly design for Hermes in a real CAD program. One toolset drives FreeCAD (headless,
  cross-platform) or Autodesk Inventor (Windows, COM); every feature reports a volume/topology delta;
  FEA (FreeCAD FEM + Gmsh + CalculiX) reports equilibrium, mesh convergence and an AS/NZS-aware yield
  safety factor, and a design sweep finds the lightest part meeting a target SF; drawings on both backends
  to the standard the user picks once per chat (AS 1100, ISO, ASME, DIN, BS 8888, JIS, GB), with PDF export
  gated on a QA check. Desktop pane: live 3D view, click a face
  to reference it in chat, stress map, evidence log. On Inventor, cad_native exposes 200+ inventor-forge
  tools (sheet metal + flat-pattern DXF, assemblies, interference, BOM, materials, mass properties,
  stress/modal analysis in Inventor's own Stress Analysis feeding the same evidence log). Any stress,
  deflection, safety factor or mass the agent quotes is checked against the analyses it actually ran, and a
  verification footer is appended to the reply.
  Disclosure — starts FreeCAD's Python as a worker process (which runs Gmsh and CalculiX) and, on
  Windows, can drive Autodesk Inventor over COM; cad_python runs Python inside the CAD app only after
  the user approves each call; reads files the user names; writes models, renders, FEA folders and exports
  in the session's job folder, and any write outside it (a save over a file opened from elsewhere, changed
  parts an assembly save also writes) goes through a Hermes approval prompt naming the path, enforced by
  inventor-forge at each write (Inventor's own stress-analysis reports and solver scratch go to its working
  folders); Inventor runs as a separate instance per chat, closed when the chat ends (left open and shown if it
  has unsaved work); child processes (FreeCAD worker, MCP servers, headless
  browser for the PDF report) get a minimal environment without provider keys; appends a verification footer to assistant
  replies that quote engineering figures; Inventor stress/modal analysis (no API exists) takes over the
  mouse and keyboard for about half a minute, only after the user approves each call; network only
  when the user approves installing a CAD program's add-on: Inventor's add-on, inventor-forge (MIT, same
  author), is pip-installed into its own environment under the plugin data folder from GitHub at the commit
  pinned in backends/known.json (archive checked by sha256 when git is absent) plus pywin32 from PyPI, and
  then runs as a child MCP server while Inventor is in use; nothing updates itself; no telemetry or credentials.
