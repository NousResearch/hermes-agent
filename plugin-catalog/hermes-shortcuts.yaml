name: hermes-shortcuts
title: "Hermes Shortcuts (Share Sheet, Siri, Photo)"
repo: https://github.com/sergo565456/hermes-shortcuts
sha: 750ee0c155baaf672f39708d1d581b41fbe19b8a
version: "0.2.0"
description: "Share to Hermes from any iPhone or Android app, ask Hermes with Siri and hear the answer, or photograph a receipt, whiteboard or document as a task. iOS Shortcuts and Android HTTP Shortcuts call one token-protected endpoint; replies return in the HTTP response and are forwarded to your Telegram home channel (a Siri question only when it says \"save the answer\" or times out). Setup is three steps: `hermes shortcuts pair` prints a QR code, the iPhone \"Hermes Setup\" shortcut scans it into iCloud Drive/Shortcuts/hermes.json, and the shared shortcuts (which contain no token) read it. Disclosure: off until SHORTCUTS_TOKEN (32+ random chars; weak or placeholder tokens are refused) is set and the plugin is enabled; then the gateway runs an HTTP listener on 127.0.0.1:8645 (non-loopback bind needs SHORTCUTS_ALLOW_PUBLIC_BIND=true) that you expose through your own HTTPS tunnel or proxy. A single bearer token is the only authentication and every request acts as the owner. Requests run agent turns on shared, untrusted content; by default each action gets only the toolsets it needs (web, vision, plus memory for remember and cronjob for remind/ask; events get cronjob/todo only; no terminal, file, code execution, browser or MCP servers), enforced by toolsets_for_source and by a pre_tool_call hook that only acts in shortcuts sessions: it blocks any other tool, limits cronjob to create/list and makes created reminder jobs run once with no tools. `@file:`/`@url:`-style references in shared text are defanged (Hermes core would otherwise inline local files before the agent runs). Forwarded replies show URLs as code (no Telegram link previews). SHORTCUTS_TOOL_PROFILE=full opts into the platform's full toolset (then shared content can reach the terminal, directly or through cron jobs). Approvals are not bypassed. Uploads are cached in Hermes' media cache; sessions are stored in Hermes' session database; replies are sent to the configured platform's home channel. Registers the CLI command `hermes shortcuts pair`, which prints a QR code containing the server URL and SHORTCUTS_TOKEN (optional 0600 PNG; token text only with --show-token). The public URL comes only from --url or SHORTCUTS_PUBLIC_URL; pairing does not discover a tunnel. Shared text is redacted before it is stored, remembered, or forwarded. HEIC/HEIF photos are decoded when pillow-heif is installed and rejected otherwise. Each turn is labelled Siri, Share Sheet, Photo, or Event. Settings are declared in config_schema (the token is a secret). On the phone the token is stored in plain text in iCloud Drive/Shortcuts/hermes.json (synced to iCloud; end-to-end encrypted only with Advanced Data Protection) or, with manual setup, inside the shortcut."
