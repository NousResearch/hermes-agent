title: Slot Pet
description: "A grimy little slot machine pet for Hermes Desktop, drawn as low-resolution pixel art. It sits in the bottom right corner above the app, like the Hermes pet, takes no layout space and can be dragged anywhere. Drag its lever down and let go, or click the machine, to spin a five by three screen for play coins. Three in a line pays across, down or diagonally on 20 lines, so about three pulls in four pay something, and a line of sevens pays 100 times the bet. Bet any whole number of coins. A piggy bank beside it keeps coins safe and pays 1% interest an hour, worked out from saved timestamps, and its panel also holds the pay table and the sound switch. Reachable from the status bar, the command palette and the keyboard. Disclosure: coins are play money inside the plugin and cannot be bought, sold or cashed out; no network requests, no model calls and no background processes; spins use the browser's random numbers and the published pay table; sound effects are CC0 clips by Kenney built into the bundle, played only after a click or key press; the game is kept in Desktop plugin storage on this machine; the plugin adds its own floating element to the page (Hermes has no SDK area for one) and removes it on unload, without reading or changing core markup."
