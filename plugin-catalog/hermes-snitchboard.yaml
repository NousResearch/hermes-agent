known_issues:
  - "The analysis thresholds in snitchboard/config.py (beacon window and jitter bands, novelty depth, coverage tolerance, transfer thresholds, detection and aggregate caps) carry their defaults in this release. Only the twelve settings declared in plugin.yaml reach the plugin from Hermes configuration, so a threshold placed in the configuration file is dropped without warning rather than applied."
  - "Developed and verified on Hermes Agent v0.23.0 on Fedora Linux with plugins.isolation: host. The same code runs elsewhere but no other platform or isolation mode was exercised."
  - "Chain verification carries a 40-second budget so it stays inside the plugin host's 60-second response ceiling. On a very large history it reports that verification did not complete and gives no verdict, rather than returning a partial one."
  - "A trimmed record keeps a shortened summary that the chain does not cover. The chain still attests to that record's position and to the digest its full form held when sealed, so the integrity panel reports how many links rest on sealed digests."
  - "The reference collector supplies no byte counts, because the OpenSnitch database holds none, so any record it produces reports volume as unavailable. The demonstration records carry byte counts, so that panel is populated in demonstration mode only."
  - "Account names appear in clear while home paths are masked. Masking them reaches finding text and evidence lines as well as the tables, so it is recorded as a v0.2.0 item rather than done late."
  - "The reference collector reads connection times as naive local strings, so it must run in the same time zone as the firewall interface. The hour repeated when clocks go back is ambiguous."
  - "OpenSnitch records connections only while its own interface is running, and its purge setting removes old rows. Both show as gaps or as runs marked no_data, never as an all-clear."
  - "aggregates.total_connections and aggregates.dropped hold the window's counts in a collected record but repeat the daemon's lifetime counters in a demonstration record. Giving them a single meaning is a v0.2.0 item."
