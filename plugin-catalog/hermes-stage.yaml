name: hermes-stage
repo: https://github.com/davidpgil/hermes-stage
sha: fd21daf6f14724566d3d0b5acced24707c5d0d59
description: "A multi-profile terminal bot room for Hermes with one shared transcript, profile lens tabs, and public @name routing (`@everyone` and `@all` are not room addresses). Profiles load lazily; due cron jobs wake them, and public profile speech and cron notifications are mirrored from non-default profiles' state.db files into the room. Disclosure — joins the profiles you choose into one room: every room message (including other profiles' replies) is sent to each addressed profile's agent session, and a bot reply containing `@name` may wake a cold profile and start a turn (up to 3 rounds / 10 messages per discussion); starts a local gateway session for each profile in the room, saves the room transcript in plaintext under the Hermes state directory, and needs a one-time `npm install` of its Node dependencies (ink, react, string-width). The feed excludes tool calls, failed turns, private user prompts, assistant (pass) rows, and duplicate room rows."
maintainer: David Philipe Gil
tier: community
category: automation
requires_hermes: ">=0.23.1"
version: "0.66.8"
readme: true
platforms:
  - linux
  - macos
title: Hermes Stage
known_issues:
  - Approval UI is implemented but needs a pending approval to exercise end to end.
  - The room is plugin-owned, not Hermes Desktop's hosted group-room engine.
