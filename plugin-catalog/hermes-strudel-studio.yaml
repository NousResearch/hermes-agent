subdir: integration/hermes
description: >-
  Local Strudel live-coding studio for Hermes: write patterns, hit Play, and
  let the agent compose alongside you with one poptart_studio tool and a
  Desktop SandboxedFrame pane. Disclosure — lazily starts a Node sidecar on
  127.0.0.1 with a random per-install token stored mode 0600 under profile
  plugin-data (token never reaches guests or the browser); evaluated music
  runs only after user Play/apply in isolated frames (not an OS sandbox);
  Strudel patterns may fetch samples/CDN over the network; audio output to
  the host. AGPL-3.0-or-later with toaster GPL notices — review LICENSE and
  NOTICE before redistribute. No self-updater.
