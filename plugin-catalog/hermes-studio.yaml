name: hermes-studio
repo: https://github.com/PabloTheThinker/hermes-studio
sha: e3428e3ee05096ac933274fc6c134d4e584dc997
subdir: hermes_plugin/hermes-studio
title: Hermes Studio
description: >-
  Local video tools for any Hermes Agent: long video or link in, captioned
  shorts out, plus timeline edits, Canva-style designs and photo tools, as 14
  chat tools and a /studio chat slash. Whisper + FFmpeg on your machine. Never
  posts. Disclosure — every tool runs the separately installed hermes-studio
  CLI as a subprocess with a timeout (missing engine returns a
  missing_dependency error with the install command); hermes_studio_desk
  starts a detached local desk process on 127.0.0.1:3870 (loopback only);
  optional download of public media URLs via yt-dlp/HTTP when you pass a URL;
  optional local Ollama for clip titles; writes caption cues and a desk log
  under ~/.hermes/clips; caption lines are written by the calling Hermes
  agent; no credentials, no telemetry and no social publish.
maintainer: PabloTheThinker
tier: community
category: tools
requires_hermes: ">=0.19.0"
docs_url: https://github.com/PabloTheThinker/hermes-studio#readme
version: "0.6.1"
image: https://raw.githubusercontent.com/PabloTheThinker/hermes-studio/e3428e3ee05096ac933274fc6c134d4e584dc997/docs/catalog/banner.png
screenshots:
  - https://raw.githubusercontent.com/PabloTheThinker/hermes-studio/e3428e3ee05096ac933274fc6c134d4e584dc997/docs/catalog/01-timeline.jpg
  - https://raw.githubusercontent.com/PabloTheThinker/hermes-studio/e3428e3ee05096ac933274fc6c134d4e584dc997/docs/catalog/02-clips-library.jpg
  - https://raw.githubusercontent.com/PabloTheThinker/hermes-studio/e3428e3ee05096ac933274fc6c134d4e584dc997/docs/catalog/05-edit-timeline.jpg
platforms: []
known_issues:
  - Needs the Hermes Studio engine installed (curl install script or uv tool install) so agent tools can invoke the hermes-studio CLI. If the CLI is missing, each tool returns a missing_dependency error with those install commands.
capabilities:
  provides_tools:
    - hermes_studio_run
    - hermes_studio_transcribe
    - hermes_studio_plan
    - hermes_studio_list
    - hermes_studio_probe
    - hermes_studio_desk
    - hermes_studio_captions
    - hermes_studio_edit
    - hermes_studio_recommend
    - hermes_studio_copy
    - hermes_studio_restyle
    - hermes_studio_name
    - hermes_studio_design
    - hermes_studio_photo
  provides_hooks: []
  provides_middleware: []
  requires_env: []
