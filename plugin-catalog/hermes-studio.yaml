sha: 7a9d3325a17a08cb61af5dccbc0b8cfce60a1f5f
subdir: hermes_plugin/hermes-studio
title: Hermes Studio
description: >-
  Local NLE for any Hermes Agent: long video or link in, captioned shorts out;
  timeline editor, Canva-style designs and photo tools. Whisper + FFmpeg on
  your machine. Never posts. Disclosure — tools shell out to the hermes-studio
  CLI/engine (install separately); optional download of public media URLs via
  yt-dlp/HTTP when you pass a URL; localhost desk on loopback; caption lines
  are written by the calling Hermes agent, not by a separate speech model;
  chat slash /studio clip|captions|reframe throws a video into Studio from
  chat; optional local Ollama for clip titles; no telemetry and no social
  publish.
