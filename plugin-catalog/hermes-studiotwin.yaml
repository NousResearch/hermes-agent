known_issues:
  - A StudioTwin account, API key and wallet credits are required for cloud generation; prompts and authorized input media are sent to StudioTwin and its selected providers.
  - Paid tools use Hermes native approval. Obtain a fresh estimate for variable costs; the plugin imposes no session spend cap.
  - Full Desktop UI requires compatible Hermes SDK surfaces and separate Desktop enablement; remote setups need the UI installed on the client and the package and key on the backend.
  - Optional local processing requires backend-local Blender 4.2+, ffmpeg/ffprobe, or Node.js 22+ and Chrome/Chromium as applicable; render helpers disable Chromium's sandbox, so use trusted inputs or a separately isolated environment.
capabilities:
  # Cloud tools are discovered through mcp.json, not local register_tool calls.
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - STUDIOTWIN_API_KEY
