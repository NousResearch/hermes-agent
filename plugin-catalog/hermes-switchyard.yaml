description: "Jev-powered Hermes plugin for skill and model routing, typed assess, DOM/Cua computer use, adaptive reasoning effort with a per-turn receipt, and FTS rerank. Disclosure: by default, adaptive llm_request sends up to 1,200 characters of the clean current user message to TypeSafe or OpenRouter after Hermes redact_for_egress (no history or tool output). Greetings and thanks are decided locally with no Jev call. Without the Hermes redactor, adaptive effort sends closed-set request metadata only, not message text; set adaptive_reasoning_effort false to send nothing. On tool rounds, the default step check may also send closed-set tool kinds (read, write, exec, other) and a count, not tool names or tool output. Default hosted skill routing (hosted_sanitized) sends up to 4,000 characters of the current user turn after Hermes redact_for_egress, plus skill names, to the same provider; without that redactor the turn stays local. Light turns (greetings, closed acknowledgements, and read-only listings) skip that hosted skill call by default. Set automatic_skill_routing_mode to local_only to keep skill routing local. Model routing stays advisory. Off unless enabled: tool review, retrieval screening, conservative output handling, the smart approval provider, evidence prefetch (sends bounded source text), cross-tool stuck advice (sends bounded redacted error excerpts), early light bypass before catalog discover, and deferred Switchyard tool schemas. The consequential tool gate is off by default; when enabled it asks native Hermes approval for a closed set of destructive Python calls and for parsed shell commands named del, erase, or rd. It does not grant execution, auto-approve, or disable Hermes approval. Model-invoked jev_session_search_rerank and jev_computer_use send query, card, or public-page text (page text capped at 4,000 characters) only when the model calls them, using the plugin masking rather than Hermes redact_for_egress, and they stay gated on the default-true public_or_sanitized_data_ack."
