subdir: ""
description: "Jev-powered Hermes plugin for skill/model routing, typed assess, DOM/Cua computer use, adaptive reasoning effort with a per-turn receipt line, and FTS rerank. Disclosure: the default-on adaptive llm_request sends up to 1,200 characters of the current user message to TypeSafe/OpenRouter after Hermes redact_for_egress (no history or tool output); greetings and thanks are decided locally with no call; without the Hermes redactor it sends metadata only (disable via adaptive_reasoning_effort false). Separate default-on hosted skill routing sends up to 4,000 characters of each user turn after Hermes redact_for_egress, plus skill names, to the same provider; without the redactor it stays local (opt down to local_only). Model routing remains advisory. Disclosure — Adaptive effort now sends up to 1,200 redacted characters of the current user message per turn by default (v0.5.3 sent metadata only); jev_session_search_rerank and jev_computer_use DOM runs send query/card text and public-page text (≤4,000 chars) to the same provider using the plugin's own masking rather than Hermes redact_for_egress; both are model-invoked tools gated on the default-true public_or_sanitized_data_ack."
maintainer: bgrablin
tier: community
category: tools
requires_hermes: ">=0.21.3"
