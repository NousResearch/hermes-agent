known_issues:
  - "Limits page: the backend samples every openai-codex and anthropic pool account every 5 minutes with each account's own token from Hermes's pool (read-only usage fetch, no refresh on 401), and lists Codex banked reset credits at most hourly per account. No token is stored or logged."
  - "Limits page: when Hermes's anthropic pool is empty, it reads Claude Code's login ($CLAUDE_CONFIG_DIR or ~/.claude/.credentials.json) to show that account's limits and plan (api.anthropic.com/api/oauth/usage and /api/oauth/profile). An expired token is refreshed by Hermes's own Claude Code resolver, which writes it back for Claude Code."
  - "The backend uses Hermes internals (session DB and mutation helpers, account usage and credential pool helpers); a Hermes release that moves them can break the sidebar, Usage or Limits page until the plugin is updated."
capabilities:
  provides_tools: []
  provides_hooks: [pre_llm_call, on_session_end]
  provides_middleware: []
  requires_env: []
