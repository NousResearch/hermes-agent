known_issues:
  - "Limits page: the backend samples every openai-codex and anthropic pool account every 5 minutes with each account's own token from Hermes's pool, through Hermes's read-only usage fetch (no refresh on 401). At most hourly it lists the banked reset credits of the Codex account Hermes currently uses, sent by Hermes with its own sign-in. No token is stored or logged."
  - "Limits page: when Hermes's anthropic pool is empty, it reads Claude Code's login ($CLAUDE_CONFIG_DIR or ~/.claude/.credentials.json) to show that account's limits and plan (api.anthropic.com/api/oauth/usage and /api/oauth/profile). An expired token is refreshed by Hermes's own Claude Code resolver, reached through Hermes's public usage fetch, which writes it back for Claude Code."
  - "Unsent draft text, with its session's folder, is stored in the plugin's own data on the Hermes host so every Desktop connected to it can restore the draft; a cleared draft leaves a marker without text for 30 days."
  - "The backend uses Hermes internals (session DB, live session registry and mutation helpers, pool account routing helpers); a Hermes release that moves them can break the sidebar, Usage or Limits page until the plugin is updated."
capabilities:
  provides_tools: []
  provides_hooks: [pre_llm_call, on_session_end]
  provides_middleware: []
  requires_env: []
