title: T3 Sidebar
description: "T3 Code-style session sidebar for Hermes Desktop: Input/Done/Woke badges, Pinned/Working/Snoozed/Archived shelves, unsent-draft markers, project picker and filter, AutoTitler rename, a token/cost Usage page, and a Codex/Claude Limits page that pools accounts by plan, forecasts run-outs and wasted quota, and redeems banked Codex resets."
