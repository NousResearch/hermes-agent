title: T3 Sidebar
description: "T3 Code-style session sidebar for Hermes Desktop: Input/Done/Woke badges, Pinned/Working/Snoozed/Archived shelves, unsent drafts synced across Desktops, project picker and filter, AutoTitler rename, a token/cost Usage page, and a Codex/Claude Limits page that pools accounts by plan, forecasts run-outs and wasted quota, and redeems banked Codex resets. Disclosure — The Limits page reads Hermes's credential pool and, every 5 minutes, fetches rate limits for every openai-codex and anthropic pool account with that account's own token through Hermes's read-only usage fetch (chatgpt.com, api.anthropic.com). At most hourly it lists the active Codex sign-in's banked reset credits through Hermes's signed request, and a user-confirmed button redeems one banked Codex reset. When the anthropic pool is empty it reads Claude Code's login ($CLAUDE_CONFIG_DIR or ~/.claude/.credentials.json) and sends that token to api.anthropic.com (/api/oauth/usage, /api/oauth/profile). An expired login is refreshed by Hermes's Claude Code resolver, which writes the new token pair back to that file. Unsent composer drafts (text and folder) are stored in the plugin's data on the Hermes host and synced to every connected Desktop. A resumed turn un-archives its session's compression lineage in state.db. The backend reads private Hermes internals (live session registry, session DB and pool-routing helpers) and can break on a Hermes update."
maintainer: V1rgul
