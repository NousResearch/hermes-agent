name: hermes-tabs
repo: https://github.com/ai-ag2026/hermes-tabs
sha: 2840258ed2f42bdd30de2d434f301b3437637d82
subdir: hermes-plugin
title: "Hermes in the Browser"
description: "Settings page and guard rails for hermes-tabs, which lets Hermes work in individual tabs of your real, signed-in Chromium browser through an extension and an MCP relay. Disclosure — talks only to the hermes-tabs relay you configure (HERMES_TABS_RELAY, default 127.0.0.1:8766) with HERMES_TABS_ADMIN_TOKEN; caches the last seen settings in plugin-data/hermes-tabs/settings.json; the pre_tool_call hook rejects the tabs tools while switched off and blocked sites in Hermes' own browser tools and web_extract. No shell, no background processes, no telemetry."
maintainer: ai-ag2026
tier: community
category: tools
requires_hermes: ">=0.22.5"
docs_url: https://github.com/ai-ag2026/hermes-tabs#readme
version: "0.1.1"
platforms: []
known_issues:
  - Needs the hermes-tabs relay and browser extension from the same repository, and the relay registered as the MCP server named tabs. The plugin alone does nothing.
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - HERMES_TABS_ADMIN_TOKEN
