name: hermes-talk
repo: https://github.com/TheSmokeDev/hermes-talk
sha: 7dca8badd5983627d52689fb867bd5bcf300bc47
description: "Realtime voice for Hermes through terminal, Discord, dashboard and Desktop. Disclosure — Realtime on the ChatGPT subscription uses the profile's Codex sign-in only through Hermes's credentialed_provider_request (requires_auth: openai-codex); the plugin never reads, refreshes or holds a token. GPT-Live on the subscription (TALK_VOICE_MODE=live, TALK_LIVE_AUTH=subscription) starts one local `codex app-server` child per call on the Codex CLI's own login (API-key variables removed from its environment); that call uses the undocumented chatgpt.com Codex realtime endpoint, which is outside the vendor's published API terms and may change or stop working without notice. The app-server's Codex thread is ephemeral and fenced (no environment, read-only sandbox, approvals declined, apps, shell, web search, plugins, sub-agents and each configured MCP server disabled, replies only \"skip\"); Talk reads only the MCP server names to disable them, and each voice request costs one small Codex turn of subscription quota. Voice audio and conversation context go to the selected provider (OpenAI, xAI, Google, optionally ElevenLabs); on Desktop the voice model can list the profile's sessions, read their titles and recent messages, create sessions and queue or steer prompts into them without a per-action confirmation; spoken requests are handed to the user's Hermes agent, whose tools run under Hermes approvals. Optional surfaces, all off by default: Phone mode places calls to allowlisted numbers through the user's own Dograh account and its carrier (carrier, hosting and model charges may apply); its seven phone_* tools stay hidden until enabled, a pre_tool_call hook refuses phone_call without a fresh owner approval, a pre_llm_call hook adds a one-line note about open caller questions, and its in-call bridge is a token-authenticated listener on 127.0.0.1 that the user starts with `hermes talk phone bridge`. TALK_PROVIDER=local connects to a self-hosted Realtime server the user names; TALK_CASCADE_TTS=openai sends reply text to an OpenAI-compatible speech server the user names (plain ws:// or http:// only on loopback for both); `hermes talk echo HOST` streams audio to and from an Echo running hassmic on the LAN while that command runs; `python -m talk_twilio_server` is a separate process the user starts that answers their own Twilio number with Gemini Live behind webhook signature checks and a caller allowlist; Discord auto-join connects the profile's own bot to the operator's voice channel; the call journal keeps text-only call records under Hermes's home (30 days by default). Keys, including DOGRAH_API_KEY and DOGRAH_BRIDGE_TOKEN, are read through agent.secret_scope.get_secret. Unbound OpenAI Realtime in Desktop can browse the active session's workflows and installed plugins. An explicit spoken command can invoke a supported plugin handler immediately or queue a skill prompt under the host's permissions. Task-bound GPT-Live can search the selected peer and profile's advertised skills and toolsets. No telemetry."
maintainer: TheSmokeDev
tier: community
category: voice
requires_hermes: ">=0.23.0"
version: "0.25.0"
docs_url: https://github.com/TheSmokeDev/hermes-talk/blob/7dca8badd5983627d52689fb867bd5bcf300bc47/README.md
capabilities:
  provides_tools:
    - phone_prepare
    - phone_call
    - phone_status
    - phone_cancel
    - phone_kill_switch
    - phone_inbox
    - phone_reply
  provides_hooks:
    - on_session_end
    - subagent_start
    - subagent_stop
    - post_tool_call
    - pre_approval_request
    - pre_tool_call
    - pre_llm_call
  provides_middleware: []
  requires_env: []
