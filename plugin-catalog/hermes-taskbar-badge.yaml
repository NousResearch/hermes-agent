description: "Colour-coded badge on the Hermes taskbar button: a green disc for a turn finished in a session you have not opened, an amber ring while a session waits on an approval, a clarify or a password, a red triangle for a failure. Opening a session clears only that session; failure outranks waiting and waiting outranks finished. The settings page holds the three colours, a test button each, per-event overrides and a switch back to the plain grey count. Disclosure: the desktop half posts the current state to 127.0.0.1:8766 on the same machine once per event, and the Python half listens on that loopback port and calls the Windows overlay API from a background thread; nothing leaves the computer and no other network call is made. Where colour cannot be drawn, Chromium's grey count and the status-bar dot remain."
