name: hermes-teammates
title: Hermes Teammates
repo: https://github.com/100yenadmin/hermes-teammates
sha: b117f076a2eb2dc5ecf4fcb822de062972392ebf
description: "Give your agent a fixed team. You define each specialist's instructions, toolsets and model once, and the agent picks only a name: a reviewer limited to todo gets no built-in web, file or terminal tools, whatever the prompt says (built-in delegate_task children inherit the parent's toolsets). Teammates also works its own lane on Hermes' Kanban board inside the chat, where each card it finishes waits in Review, and keeps a per-profile ledger of every run's goal, status and result. Launches subagents only through the public ctx.subagent_lifecycle API. Stock Hermes; no patched core. Disclosure — adds eight tools (teammates_roster, teammate_assign, teammate_request_changes, teammate_chain, teammate_check, teammate_wait, teammate_message, teammate_stop) and a /teammates command; the model picks only a teammate name, and the operator's config decides what it means. Teammates run as in-process Hermes subagents using credentials selected by Hermes from the parent, delegation settings or an operator-configured teammate route where supported. Toolsets narrow the parent's tools at toolset granularity only (the file toolset includes write_file and patch); Hermes can add inherited MCP toolsets back unless delegation.inherit_mcp_toolsets is false. A teammate with invalid settings refuses to launch. A delegated child cannot start teammates. Steering uses the lifecycle steer where Hermes provides it, otherwise delegate_task's steer action with the turn-bound parent. Under plugins.isolation: host every tool except the roster refuses. Optionally the roster is read from an operator-named YAML file (roster_file, relative to the profile home or absolute, so several profiles can share one); the plugin never writes it. It keeps a per-profile SQLite run ledger in its plugin-data folder (goals, statuses, clipped summaries, complete final results up to 256 KB of text per run, role hashes and available token receipts; no full transcripts). It does not read credential stores. Where supported in-process, subagent_start and post_api_request hooks collect token receipts for mapped child sessions. For a card assigned to its non-profile lane, it claims the card through the Kanban DB, heartbeats the claim and its worker, then moves the card to review without a reviewer, or blocks it on failure, a stop or an unavailable result; it never completes a card. teammate_request_changes reopens a lane card that is in review (Hermes reopen_review_task), adds the feedback as a card comment and starts a teammate on it again; it never completes a card either. teammate_chain creates up to eight linked cards in its lane through Hermes' kanban_create (so Hermes wakes the creating chat when a card reaches review), archives the cards it created if the chain cannot be finished, and never completes a card; a lane card's teammate receives the finished results of the cards it depends on in its launch context. On Hermes builds with plugin prompt sections it adds one short paragraph (under 600 characters) about the Kanban lane to new top-level session prompts. The paragraph is rendered from its settings, carries no conversation content, and is left out without a usable teammate, for delegated children and under host isolation. It runs one in-process monitor thread per run to retain finished results and, for lane runs, keep the claim alive; no network calls, child processes or self-updates of its own. Completion-notice code exists but never injects on current Hermes because the host cannot bind notices to the receiving session; use teammate_wait instead. Includes a report-a-problem skill: the agent drafts a bug report and files it to this repository with gh only after the user approves the draft."
