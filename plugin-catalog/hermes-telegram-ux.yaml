name: hermes-telegram-ux
repo: https://github.com/pler1y/hermes-telegram-ux
sha: 9abdfa41ee51879bd392b55796b6f2d3da84bac5
version: "2.0.0"
description: Task-aware temporary Telegram progress grounded in Hermes tool events and results, with automatic cleanup.
maintainer: pler1y
tier: community
category: platform
requires_hermes: '>=0.21.3'
docs_url: https://github.com/pler1y/hermes-telegram-ux/blob/9abdfa41ee51879bd392b55796b6f2d3da84bac5/README.md
platforms:
- linux
- macos
capabilities:
  provides_tools:
  - telegram_ux_update
  provides_hooks:
  - pre_gateway_dispatch
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_approval_request
  - post_approval_response
  - on_interim_message
  - post_llm_call
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - subagent_start
  - subagent_stop
  provides_middleware: []
  requires_env: []
