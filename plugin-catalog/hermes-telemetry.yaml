name: hermes-telemetry
repo: https://github.com/nujovich/hermes-telemetry
sha: 11166c45cd3f636578ecf6c8caeb8780dae4c304
description: Observability + budget guardrails for Hermes Agent — tokens, cost, latency, tool calls per
  session and cron job. Persists to local SQLite. Exposes /stats and /budget slash commands.
maintainer: nujovich
tier: community
category: general
docs_url: https://github.com/nujovich/hermes-telemetry#readme
capabilities:
  provides_tools: []
  provides_hooks:
  - api_request_error
  - on_session_end
  - on_session_finalize
  - on_session_start
  - post_api_request
  - post_llm_call
  - post_tool_call
  - pre_api_request
  - pre_llm_call
  - pre_tool_call
  - subagent_start
  - subagent_stop
  provides_middleware: []
  requires_env: []
