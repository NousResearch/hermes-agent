known_issues:
  - The Desktop half of a unified package starts disabled per browser; enable it once in Capabilities ▸ Plugins.
  - raw.githubusercontent.com caches plain links for up to 5 minutes per client kind, so a just-published update can briefly still serve the previous file; the result also shows the commit-pinned URL, which is immediate.
  - A profile named by ?profile= is only used for credential resolution; the page lists the profiles of the Hermes home it runs in.
