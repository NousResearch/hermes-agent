name: hermes-tenuo
repo: https://github.com/tenuo-ai/hermes-tenuo
sha: 0bd7a19722bca8d6045ce4317cc4d451688772eb
description: >-
  Signed, expiring tool permissions for Hermes. Constrain tool names and
  arguments for sessions, cron jobs and delegated work, with local audit logs.

  Disclosure — ordinary calls pass through until a warrant is configured.
  Set require_warrant: true to block calls without one. A configured but
  unloadable warrant blocks calls, and a kanban worker without a per-task warrant
  is blocked. Tool names and arguments are appended to
  $HERMES_HOME/tenuo/audit.jsonl (disable with audit_log: false). When
  TENUO_CONNECT_TOKEN or TENUO_CONTROL_PLANE_URL are set, the bundled tenuo SDK
  (compiled Rust core) streams those decisions, including arguments, to that
  control plane.
title: Tenuo
maintainer: tenuo-ai
tier: community
category: tools
requires_hermes: ">=0.20"
docs_url: https://github.com/tenuo-ai/hermes-tenuo
version: "0.3.1"
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - on_session_start
    - on_session_end
    - subagent_start
  provides_middleware: []
  requires_env:
    - TENUO_WARRANT
    - TENUO_SIGNING_KEY
    - TENUO_TRUSTED_ROOT
