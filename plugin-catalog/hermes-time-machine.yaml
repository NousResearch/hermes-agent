name: hermes-time-machine
repo: https://github.com/ddaikodaiko/hermes-time-machine
sha: 1ac9c78e539dd518d6c8d8ffd64395b72bab30d4
version: "0.2.1"
title: Hermes Time Machine
description: "The rollback that knows what it can't undo. Incremental, time-bounded checkpoints that the agent itself can preview, restore or fork (atm_* tools, /timemachine); an approval at the point of no return (git push, npm publish, terraform apply and similar) that shows what becomes permanent and the exact compensation command; an effect ledger; and effect memory that reminds the model of pushes it can no longer see after /rollback, /undo, /retry or compaction. Disclosure — no shell commands, subprocesses, network calls, background processes or credentials; reads workspace files plus .git refs/config and package.json to capture pre-state; writes only under HERMES_HOME/plugin-data/hermes-time-machine, on a rewind the workspace (replaced files go to a trash directory), and on atm_fork a new sibling folder next to the workspace; adds a restore-point note to tool results and effect reminders to the model's context; asks for approval through Hermes before every model-requested restore and before irreversible commands, and never approves or blocks a tool call by itself; refuses filesystem roots, home and system directories."
maintainer: ddaikodaiko
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/ddaikodaiko/hermes-time-machine#readme
platforms: [linux, macos, windows]
capabilities:
  provides_tools:
    - atm_checkpoint
    - atm_rewind
    - atm_fork
    - atm_list
    - atm_effects
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - transform_tool_result
    - pre_llm_call
    - post_compaction
  provides_middleware: []
  requires_env: []
