description: "Profile-scoped commitment tracking and follow-up with owner-controlled source review. Disclosure — with owner consent, bounded Gmail/Calendar/chat content may reach the configured model, Hermes session history and messaging destination; optional default-off private evaluation makes raw model requests whose buffered EUR 5/month cap is an estimate, not an invoice; installs create no jobs until separately approved setup, which creates two recurring Hermes Cron jobs; local SQLite stores tracked items; Google helpers use an existing Workspace OAuth token; no Tingle-operated telemetry."
