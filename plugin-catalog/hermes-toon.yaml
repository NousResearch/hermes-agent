name: hermes-toon
repo: https://github.com/drew-dot-com/hermes-toon
sha: c22e7694a81df3e6509bafde948b84569efcd355
version: "0.1.0"
subdir: src/hermes_toon
description: >-
  Paid web extract over TOON: web_extract pays a TOON node about $0.001 per
  page from a local payer sidecar; the node fetches through an Anyone network
  exit and returns markdown with a wuzzy/crawl v1 content hash.
  Disclosure: with TOON_PAYER_URL set and web.extract_backend: toon, every
  web_extract spends from the sidecar's payment channel with no per-call
  confirmation; the sidecar's daily cap and origin allowlist are the controls.
maintainer: drew-dot-com
tier: community
category: web
requires_hermes: ">=0.21.3"
docs_url: https://github.com/drew-dot-com/hermes-toon#install
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - TOON_PAYER_URL
