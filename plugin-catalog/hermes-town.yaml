name: hermes-town
repo: https://github.com/sxuff/hermes-town
sha: f3b89401fafde0cd3ebaaccf01ea9e658bc66ff9
subdir: integrations/hermes-town-plugin
description: Local pixel-art town where every Hermes session is a resident and every tool call walks to a building. Passive lifecycle bridge to a loopback-only server; prompts, arguments, and output never leave the process.
maintainer: sxuff
tier: community
category: tools
requires_hermes: ">=0.21"
docs_url: https://github.com/sxuff/hermes-town#readme
version: "0.3.0"
image: https://raw.githubusercontent.com/sxuff/hermes-town/f3b89401fafde0cd3ebaaccf01ea9e658bc66ff9/artifacts/catalog-banner.png
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - post_llm_call
    - pre_tool_call
    - post_tool_call
    - on_session_start
    - on_session_end
    - on_session_finalize
    - on_session_reset
    - subagent_start
    - subagent_stop
  provides_middleware: []
  requires_env: []
