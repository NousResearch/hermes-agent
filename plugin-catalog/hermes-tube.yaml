known_issues:
  - "The extension is not on the Chrome Web Store: the plugin ships it built and copies it to a folder, and the person turns on Developer mode and loads that folder (Load unpacked or drag and drop) in Chrome, Edge, Brave, Chromium, Vivaldi, Opera or Arc. Hermes and the browser must run on the same computer (with Hermes inside WSL on Windows, the folder goes to the Windows user folder and the Windows browser is used)."
  - "Reading subscriptions and unsubscribing depend on YouTube's page layout; on a mismatch the extension reports a failure and clicks nothing."
  - "Run on macOS and, without a screen, on Debian 13 in a container. Windows (Hermes inside WSL 2, or installed natively) is covered by automated tests and a Linux container that imitates WSL, but has not yet run on a real Windows machine (Windows testers and pull requests are welcome); inside WSL the browser reaches the plugin through WSL's localhost forwarding (on by default), and natively the plugin does not hot-reload its code (restart Hermes after an update)."
  - "English and Brazilian Portuguese only. A few validation messages of the plugin's API may still be in Portuguese; routine and blueprint keys (bom-dia, favoritos, resumo-pasta, faxina-mensal, pasta-novos) are fixed Portuguese identifiers that show up in hermes cron list."
  - "First version: reading subscriptions, unsubscribing through the extension and the youtube.com sidebar were run on a real signed-in YouTube account with the interface in Brazilian Portuguese and one to three subscriptions; /tube status, tabs, triage buttons, routine install and the morning digest were run on one real Telegram chat. The other four routine messages, /tube topic on Telegram, chat video cards, adding a channel by link, other interface languages and long subscription lists are covered by automated tests only."
  - "The Home on youtube.com and the Extras are not part of this version; topic tabs are not re-searched on a schedule yet (refresh one by hand)."
  - "HermesTube does not use the official YouTube API: it reads public pages and clicks in the person's own browser. YouTube's Terms of Service may not allow this kind of automated access; use it at your own risk."
