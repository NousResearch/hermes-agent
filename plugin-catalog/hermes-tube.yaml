known_issues:
  - "A browser on another computer reaches HermesTube only on the same local network: the person turns on Another computer in Desktop, loads the downloaded extension there and pairs it with the address and a code. Not inside WSL, not over IPv6, and never beyond the local network."
  - "The extension does not come from the Chrome Web Store: the plugin ships it built. On the computer where Hermes runs, Set up the extension writes its folder (with Hermes inside WSL on Windows, in the Windows user folder, for the Windows browser). The person turns on Developer mode and drags the folder onto the Extensions page of Chrome, Edge, Brave, Chromium, Vivaldi, Opera or Arc, and the extension connects with a one-time invitation."
  - "Updating the extension from itself has run only in Chrome on macOS, not yet in Edge, Brave, Vivaldi, Opera or Arc. Chrome asks to Save changes to the folder on every update, and with Developer mode off Chrome turns the extension off when it reloads."
  - "Reading subscriptions and unsubscribing depend on YouTube's page layout; on a mismatch the extension reports a failure and clicks nothing."
  - "It has run on macOS and, without a screen, on Debian 13 in a container (not yet on Linux with a screen). Windows (Hermes inside WSL 2, or installed natively) is covered by automated tests and a Linux container that imitates WSL, but has not yet run on a real Windows machine (Windows testers and pull requests are welcome); inside WSL the Windows browser connects to the plugin at 127.0.0.1, and natively the plugin does not hot-reload its code (restart Hermes after an update)."
  - "English and Brazilian Portuguese only. Routine keys are English (morning-digest, favorites-alert, folder-digest, cleanup-monthly, new-without-folder); cron jobs that 0.1.0 installed under Portuguese names are renamed when the person confirms a /tube routines install or removal."
  - "It has run end to end on one real signed-in YouTube account (Chrome on macOS, interface in Brazilian Portuguese). For 0.2.2, in Google Chrome 158 on macOS, on one real signed-in YouTube account, with the plugin installed from scratch through Hermes Desktop's Install from Git: on the same Mac, the folder dragged onto the Extensions page, the extension connected by itself with the invitation, read 882 channels and showed the bar in YouTube's menu; on a second Mac of the same local network, Another computer turned on, the zip saved with Download the extension (.zip), the folder loaded, and pairing with the first address Hermes listed and the code, then the same 882 channels read in that browser and the bar on youtube.com. On both, after Hermes restarted, the extension reconnected by itself once the HermesTube page was open in Desktop, and removing the extension disconnected its device in Hermes. The extension's own client also sent 70 sealed requests with a body and 8 in parallel. Not run in 0.2.2: a second computer on Windows or Linux. Earlier versions: 0.2.1 in Google Chrome 158 (install from the repository with Hermes open; Set up the extension and connecting by itself with the invitation in its folder, with no code; nothing recorded before pairing, then the subscriptions read without a click, 879 channels, not compared with YouTube's own count; a cleanup list, then unsubscribing one channel and resubscribing it through the extension after Run now; the bar in YouTube's menu; and an update to other files under the same version number); reading 877 subscriptions (0.2.0, Chrome 157); unsubscribing and resubscribing through the extension with one to three subscriptions (0.1.0 and 0.2.0, Chrome 158); the 0.2.0 bar on youtube.com (its three places, the shortcut, Edit mode with reordering and Undo, favorites, the channel card, History undo, Export backup); and, for 0.1.0, /tube status, tabs, triage buttons, routine install and the morning digest on one real Telegram chat. Covered by automated tests only in this version: the bar's shortcut, Edit mode, favorites and channel card, a Hermes setting reaching the bar, Telegram, the other four routine messages, /tube topic on Telegram, chat video cards, adding a channel by link and other interface languages. Import backup, drag and drop in the bar, typing with an IME and Windows have not run in a real app."
  - "The Home on youtube.com and the Extras are not part of this version; topic tabs are not re-searched on a schedule yet (refresh one by hand)."
  - "After Hermes restarts, the plugin's server comes back the next time the HermesTube page opens in Desktop, a pairing starts or the tube_status tool runs; until then the extension shows Hermes as closed."
  - "HermesTube does not use the official YouTube API: it reads public pages and clicks in the person's own browser. YouTube's Terms of Service may not allow this kind of automated access; use it at your own risk."
capabilities:
  provides_tools:
    - tube_status
    - tube_feed
    - tube_channels
    - tube_add_channel
    - tube_organize
    - tube_cleanup_scan
    - tube_theme_create
    - tube_tab
    - tube_mark
  provides_hooks:
    - pre_llm_call
  provides_middleware: []
  requires_env: []
