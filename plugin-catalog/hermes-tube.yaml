description: "Take back control of what you watch. HermesTube puts your YouTube subscriptions in Hermes Desktop: tabs you make by folder, tag, channel or topic, a folder pane, a channel manager with undo, folder suggestions from your Hermes model, topic tabs it builds from YouTube search, and videos in Hermes's own player. New and still experimental: a cleanup list you approve, /tube buttons on Telegram and scheduled routines. Disclosure — the gateway fetches public www.youtube.com pages only (channel feeds and pages, uploads and Shorts playlists, video, /shorts and search pages, also in a background pass after refreshes), without login, and, for the favorites routine's Telegram message, one cover image per new video from i.ytimg.com; it connects to public addresses only and sends YouTube's anonymous consent cookie SOCS=CAI to YouTube hosts only; Desktop loads thumbnails and avatars from YouTube's image hosts and plays videos in Hermes's own embed. A separately installed Chrome extension, the only link to the YouTube account, unsubscribes only channels a person approved in Desktop or with the /tube cleanup buttons, and talks to a plugin server on 127.0.0.1 (ports 47615-47624) paired with a 6-digit code; the approve and pairing RPCs accept any client authenticated to the gateway. Organize, cleanup reasons and topic tabs send channel names and video titles to the user's model through ctx.llm, also from unattended blueprint jobs. After a button confirmation, /tube routines writes scripts to HERMES_HOME/scripts and creates cron jobs. The favorites routine sends each new video to Telegram by running hermes send with a fixed argument list; it reads cron/jobs.json read-only to find the chat and never reads the bot token. Only on a click in Desktop, Set up the extension copies the extension bundled in the plugin to a fixed HermesTube Extension folder in the home folder (refusing one it did not create) and opens the Extensions page of one Chromium browser (chosen from a closed list of those found in fixed install places; no profile is read) and the file manager with fixed argument lists and time limits; a second button only drafts a fixed help request in a new chat, which the person sends. Data in HERMES_HOME/plugin-data/hermes-tube; no shell commands, credentials or telemetry; the README lists the known limits. Formerly MyTube, by the same author; not affiliated with YouTube, Google or Nous Research."
