version: "0.2.2"
description: "Take back control of what you watch. HermesTube puts your YouTube subscriptions in Hermes Desktop: tabs you make by folder, tag, channel or topic, a folder pane, a channel manager with undo, folder suggestions from your Hermes model, topic tabs it builds from YouTube search, and videos in Hermes's own player. New and still experimental: a cleanup list you approve, /tube buttons on Telegram and scheduled routines. Disclosure: the gateway fetches public www.youtube.com pages only (channel feeds and pages, uploads and Shorts playlists, video, /shorts and search pages, also in a background pass after refreshes), without login, and, for the favorites routine's Telegram message, one cover image per new video from i.ytimg.com; it connects to public addresses only (198.18.0.0/15 only when declared in security.fake_ip_ranges) and sends YouTube's anonymous consent cookie SOCS=CAI to YouTube hosts only; Desktop loads thumbnails and avatars from YouTube's image hosts and plays videos in Hermes's own embed. A separately installed Chrome extension, the only link to the YouTube account, unsubscribes only channels a person approved in Desktop or at the /tube cleanup prompt of the local Hermes CLI (chat apps only list them), and only after one Run now click in its popup, which releases the current queue (up to 100 items) for 2 hours. It talks only to the plugin's own server (ports 47615-47624). That server listens on 127.0.0.1 by default; only when the person turns on Another computer in Desktop does it listen on 0.0.0.0, and then it admits only loopback and private IPv4 addresses on the Hermes computer's own subnets (no IPv6, no link-local, no public address, the machine's name never accepted as Host), and never without the cryptography package. With that option on, /health answers the local network without a token (service name, a random instance id, whether pairing is open, a session nonce). Every authenticated route runs on a sealed channel (HMAC-signed requests, AES-GCM bodies and answers, keys from the device token and a session the server issues); a token in a Bearer header is accepted only from loopback, for extensions older than 0.2.2. Pairing is approved on the Hermes computer: a one-time invitation inside the folder (loopback only) or a 6-digit code exchanged by SPAKE2, and the device token is returned encrypted under that exchange's key. Desktop reads and changes the choice through the plugin's REST routes GET/POST /network and downloads the extension for another computer as a zip through GET /extension/download, all behind Hermes's sign-in. On upgrade, existing pairings keep working, and an older extension on the Hermes computer keeps its token in a header until it is updated. The extension records nothing before pairing and keeps its token in its own IndexedDB, out of reach of the youtube.com content script; its bar on youtube.com can also organize the library after a real click (move, favorite, follow in HermesTube, reorder, Watch later, local playlists, its own preferences), cannot delete, rename, approve or queue anything, and its folder and channel changes enter the change history; the approve and pairing RPCs accept any client authenticated to the gateway. Organize, cleanup reasons and topic tabs send channel names and video titles to the user's model through ctx.llm. The plugin registers no automation blueprint; cron jobs made from the blueprints of earlier versions stay in the cron until the person removes them (tube_status lists them with the remove command; the plugin never edits the cron). After a button confirmation, /tube routines writes scripts to HERMES_HOME/scripts and creates cron jobs, which run with no tools or no model. The favorites routine sends each new video to Telegram by running hermes send with a fixed argument list; it reads cron/jobs.json read-only to find the chat and never reads the bot token. Only on a click in Desktop, Set up the extension copies the extension bundled in the plugin to a fixed HermesTube Extension folder in the home folder (refusing one it did not create) and opens the Extensions page of one Chromium browser (chosen from a closed list of those found in fixed install places; no profile is read) and the file manager with fixed argument lists and time limits; the extension rewrites its own folder only after the person clicks Update and Chrome's Save changes, with every file checked against Hermes's hashes first; a second button only drafts a fixed help request in a new chat, which the person sends. Data in HERMES_HOME/plugin-data/hermes-tube. For every profile, at most once a day during a refresh and with no network, the plugin deletes finished AI jobs after 30 days, expired searches and unsaved topic previews; the maintenance job of /tube routines also prunes the change history past 90 days or 10,000 rows and moves old ex-subscriptions out of the list. Child processes get a minimal environment without provider keys, except hermes send; no shell commands, credentials or telemetry; the README lists the known limits. Formerly MyTube, by the same author; not affiliated with YouTube, Google or Nous Research."
