description: Usage and cost footer appended to every reply — tokens, cache hit rate, cost and
  context occupancy, plus a per-tool time breakdown showing which tool actually consumed the
  wall clock. Waiting time (a blocking user prompt) is reported separately and excluded from
  the active-time denominator. Pure computation, never calls a model; any failure leaves the
  reply untouched.
