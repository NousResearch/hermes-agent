known_issues:
  - The Desktop half of a unified package starts disabled per browser; enable it once in Capabilities ▸ Plugins.
  - On a shell that loads plugins late, the first paint can be the native home for a moment before the page takes over; the sidebar entry always opens it.
  - A provider the gateway does not expose shows no usage meter.
