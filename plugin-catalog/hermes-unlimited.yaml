name: hermes-unlimited
repo: https://github.com/rrglab/hermes-unlimited
sha: f461a386a0ed614edbc20bc0a58b333bbc720bd4
description: "AI-native company operating tools with scoped Hermes Kanban, mission planning, memory, economics and read-only tool-to-agent discovery. Disclosure — Uses configured local Hermes CLI, per-tenant SQLite storage and loopback JustYou validation. Three feedback hooks collect local aggregate usage only with explicit, unexpired consent; publishing is separately opt-in. Host-dependent execution and connection tools are hidden unless trusted host capabilities are available; Socratic Council refuses if no real model seats are configured. No live payment settlement or independently verified customer fulfillment."
maintainer: rrglab
tier: community
category: platform
requires_hermes: ">=0.21.5"
version: "0.1.0-alpha.8"
title: "Hermes Unlimited"
readme: true
known_issues:
  - "Requires configured JustYou validator, signed Ed25519 profile bindings, isolated tenant boards and an explicitly configured provider/tenant database."
  - "No live payment settlement or independently attested customer fulfillment."
  - "Host-dependent mission, company-cycle, service-factory and connection-management capabilities are gated by check_fn; a default Hermes host lacks those custom callbacks."
  - "Tool-to-agent discovery generates unprivileged drafts and schema fingerprints only; it does not execute junior agents, choose models or connect accounts."
  - "Socratic Council needs five configured real Hermes model seats; chair synthesis on large evidence uses explicitly labelled excerpts and records omitted source text as uncertainty. Roles on one model are not independent model-family verification. No execution authority."
  - "Feedback events are profile-scoped, require explicit unexpired consent and do not independently verify customer outcomes."
capabilities:
  provides_tools:
    - hermes_unlimited_status
    - unlimited_adapter_discover
    - unlimited_junior_discovery
    - unlimited_adapter_chat_post
    - unlimited_company_task
    - unlimited_company_result
    - unlimited_company_create
    - unlimited_service_publish
    - unlimited_service_request
    - unlimited_company_list
    - unlimited_a2ui_surface
    - unlimited_service_dispatch
    - unlimited_service_result
    - unlimited_connection_manage
    - unlimited_mission_run
    - unlimited_economic_evaluate
    - unlimited_memory_recall
    - unlimited_service_factory
    - unlimited_socratic_council
    - unlimited_company_cycle
  provides_hooks:
    - post_api_request
    - post_tool_call
    - on_session_end
  provides_middleware: []
  requires_env:
    - HERMES_UNLIMITED_JUSTYOU_SESSION_TOKEN
