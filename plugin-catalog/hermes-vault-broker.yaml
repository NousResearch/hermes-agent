name: hermes-vault-broker
version: "0.1.0"
repo: https://github.com/Karasumikura/hermes-vault-broker
sha: 759529eb5270665ebcaf0c0431f2efe0ed4e25ed
description: "Fill saved logins from an out-of-process credential broker. The broker runs as its own system user with ProtectHome=yes, derives a KEK from a passphrase with scrypt and keeps the random data key (DEK) in checked mlock'd memory, and writes the password into the page itself over a DevTools endpoint taken ONLY from its own root-owned loopback config — the model cannot choose it, and a tab's websocket is refused unless its host:port matches. The agent sends (handle, origin) over a unix socket and gets a fill count back; SO_PEERCRED limits the gateway uid to status/list/fill while unlock/add/remove/init/lock stay with root and the broker's own uid. Exact-origin binding is re-asserted inside the tab immediately before the write. Import only accepts a JSON export the operator made themselves; the broker never opens Hermes's credential stores. An optional CDP-pipe mode lets the broker launch and own Chromium with no TCP debugging port. Linux; stdlib unittest suite; deps cryptography + websockets."
maintainer: Karasumikura
tier: community
category: security
docs_url: https://github.com/Karasumikura/hermes-vault-broker#readme
platforms:
  - linux
capabilities:
  provides_tools:
    - vault_broker_status
    - vault_broker_list
    - vault_broker_fill
  provides_hooks: []
  provides_middleware: []
  requires_env: []
