description: "Instant context compaction: replaces Hermes's LLM-written compaction summary with a deterministic projection built in milliseconds, with no model call. Keeps requests, commands and exit codes, errors, fixes and files read or changed, each line referencing the original message for recall via session_search. Disclosure — no network calls, shell commands or credentials; reads Hermes's config.yaml through Hermes's own loader; subclasses ContextCompressor and relies on its private methods, falling back to the stock compressor if they are missing."
