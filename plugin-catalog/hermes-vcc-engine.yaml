description: "Instant context compaction for Hermes Agent: builds the compaction summary in milliseconds with no LLM call, keeping the exact commands, exit codes, errors and files, each linked back to its original message for recall via session_search. Disclosure — no network calls, shell commands or credentials; reads Hermes's config.yaml through Hermes's own loader; subclasses ContextCompressor and relies on its private methods and two private Hermes helpers, falling back to the stock compressor if they are missing; with the opt-in only_local_models setting, compaction for a non-local chat model goes to Hermes's stock LLM summary."
