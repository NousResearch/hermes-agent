description: "Algorithmic (no-LLM) context compaction engine: builds summaries by deterministic regex extraction instead of a summarizer-model call — zero-token, byte-reproducible, inside the built-in ContextCompressor; compacted turns stay searchable via session_search. Disclosure — no network calls, no env vars, no secrets, no telemetry; registers no tools/hooks/middleware and reads only the turns the host passes for compaction; debug: true (default false) writes one metadata-only file $HERMES_HOME/vcc-debug.json. Derived from pi-vcc (MIT, sting8k)"
maintainer: rain-sk
