name: hermes-video-editor
title: Video Editor (local FFmpeg)
repo: https://github.com/oliverhees/hermes-video-editor
sha: 66035165c71e09b7f77a08aecc36e35c0b2dce14
version: "0.3.0"
description: >-
  Local video editor for your own footage: 45 FFmpeg tools for the agent (cut, silence removal, 9:16 reframe,
  captions, music with ducking, loudness, platform export and checks) plus a visual editor in Hermes Desktop
  with canvas, any number of tracks for text, shapes, video overlays and music, scenes and an English/German
  help. 100% local, no API key.
  Licence: PolyForm Noncommercial 1.0.0.
maintainer: oliverhees
category: tools
tier: community
requires_hermes: ">=0.21.5"
docs_url: https://github.com/oliverhees/hermes-video-editor/blob/66035165c71e09b7f77a08aecc36e35c0b2dce14/README.md
