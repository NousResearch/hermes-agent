title: Hermes Incremental Village
description: "A 3D Stone Age village in Hermes Desktop whose villagers are played by Hermes. You are their guide, not their god: you plant ideas, set a focus and give advice, and the villagers decide. Each villager sees only nearby tiles and plans its own day; the game validates every action and owns time, resources and death. The land is endless and starts dark, resources are finite, winter kills, and days you miss are worked out for free when you return. Ships a Desktop page (three.js r187 bundled, inside the plugin SDK surface), backend routes, a /village command and 4 agent tools. Disclosure: model calls happen only when you ask for a council (one batched structured call for all villagers, about 3-5k tokens) and are refused before the call if they would pass the daily token budget you set (default 30,000); councils are refused in cron runs. No network requests of its own, no downloads, no telemetry, no background work, no credentials. The save and token ledger live in Hermes plugin storage. An optional Rust build of the same rules is in the repository; the plugin never downloads or builds it and runs on plain Python without it."
