title: Hermes Incremental Village
description: "Three castaways grow into a city of thousands, inside Hermes Desktop. Hermes plays the named villagers and you are their guide, not their god: you plant ideas, set a focus and give advice, and they decide. Each villager follows a way of life (an ordered list of goals) that the game runs for free, and a council lets Hermes rethink it. Around them the folk multiply as homes and food allow, felling forest to make room, so the village spreads and uses up what is near. A technology tree of 19 ideas runs from fishing to flight, and up to 200 missed days are lived through while you are away. The game validates every action and owns time, resources and death. Ships a Desktop page (three.js r187 bundled, inside the plugin SDK surface) with a blue-ink look, backend routes, a /village command and 4 agent tools. Disclosure: model calls happen only when you ask for a council (one batched structured call for the named villagers, about 3-6k tokens) and are refused before the call if they would pass the daily token budget you set (default 30,000); councils are refused in cron runs. No network requests of its own, no downloads, no telemetry, no background work, no credentials, no native code. The save and token ledger live in Hermes plugin storage."
