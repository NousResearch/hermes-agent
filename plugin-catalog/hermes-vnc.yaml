title: Hermes VNC
version: "0.2.4"
description: "Computer-use backend that drives any machine reachable over VNC (RFB): the stock computer_use tool captures the remote screen and moves that machine's mouse and keyboard, so the agent can work on a second computer, a lab box or a cloud desktop with no Hermes process running on it. Select it with computer_use.backend: hermes-vnc and point computer_use.vnc.host at the target. VNC carries pixels only, so the backend runs in the screenshot lane: capture returns a PNG and no accessibility elements, element-addressed actions (click-by-element, focus_app, set_value) report unsupported_action instead of guessing, and list_apps / list_windows return empty lists rather than inventing an inventory. capture_max_width downscales each capture — vision tokens scale with the image's area, so this is the one setting that changes what a screenshot costs (measured 1920 -> 786 estimated tokens at 1024 wide on a 1600x900 desktop). It also ships an optional desktop pane that shows the remote screen while the agent works — off by default, a viewer that opens its own read-only connection and never sends input. Disclosure — connects only to the VNC server you configure (host and port) and sends it screenshots and input; the one credential is the VNC password, read from the variable named by password_env through Hermes's secret scope and never written or logged; no shell, no files read or written, no telemetry; one daemon thread runs Twisted's reactor, started on first connect and deliberately never stopped because the reactor is process-wide and cannot be restarted; one pinned dependency (vncdotool>=1.2,<2)."
