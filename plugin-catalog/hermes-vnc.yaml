known_issues:
  - "Needs a VNC server on the machine you want to drive (TightVNC, UltraVNC, TigerVNC, x11vnc, macOS Screen Sharing, or a cloud VM's VNC endpoint). Nothing is installed on the target beyond that."
  - "Enable the plugin, do not just install it: python_dependencies are installed by `hermes plugins enable hermes-vnc`, and enabling builds a new pm environment that an already-running gateway or CLI does not switch to. Install, enable, then restart the host — otherwise the tool reports vncdotool is not installed even though the environment now has it."
  - "Pixels only: RFB has no accessibility tree, so every action is by coordinate; focus_app, set_value and click-by-element answer unsupported_action, while list_apps and list_windows return empty lists rather than inventing an inventory."
  - "Typing covers printable ASCII; text outside Latin-1 (Cyrillic, Greek, CJK) is refused with unsupported_text, because RFB's cut-text message is Latin-1."
  - "capture_max_width trades click precision for tokens: click coordinates stay in native desktop space, so a downscaled frame makes the model multiply what it reads off the image. Native (0) is the default."
  - "The optional live view holds a second RFB connection, so the target must accept more than one viewer at a time — x11vnc -shared, TightVNC, UltraVNC and macOS Screen Sharing do by default. Frame rate is set by the round trip: measured ~100 ms per frame (9.7 fps) against a local server, ~1.1 s (0.9 fps) over an SSH tunnel to a cloud host. Do not enable x11vnc -ncache with it: that measured 11-23 s per frame, twenty times worse."
