version: "0.3.3"
description: "All of DeFi. One conversation. Hermes Wallet by CoinFello makes your agent the only DeFi interface you need: swap, bridge, lend, LP, trade perps, farm yield and automate strategy from your own CoinFello wallet. Fello, CoinFello's DeFi agent, plans and stages each step, and nothing runs until you approve your agent's transaction summary in Hermes, inside a daily spending limit CoinFello enforces. The wallet pane covers portfolio, activity, swap, send, earn, strategies and settings. Built by jacobc.eth, former Lead Managing Director at MetaMask. Sign-in is the plugin's oauth: entry (hermes auth add coinfello:coinfello, OAuth 2.1 + PKCE against app.coinfello.com); Hermes stores and refreshes the grant and the plugin never holds a token. Disclosure — crypto wallet: the agent can move funds from your CoinFello automation wallet (keys held and signing done by CoinFello's server) within the daily limit you approve on CoinFello; coinfello_execute and every coinfello_chat message go through Hermes' approval prompt, and Fello can carry out on-chain actions from an approved chat message. Talks to app.coinfello.com (which records a daily activity event per session with your account id and wallet address), LI.FI's status API (li.quest), public chain RPCs (publicnode.com and others) for swap-venue lookup, static.cx.metamask.io for token icons and Google Fonts in cards; stores non-secret wallet/card state under the Hermes home and the plugin directory; the open Desktop pane polls status and balances."
maintainer: CoinFello
