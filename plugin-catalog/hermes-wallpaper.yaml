sha: 839ab7a2a26913d8ff19aca1b49568ebf58a05d9
description: >-
  Put any image, GIF or short video from your drive behind the whole Hermes Desktop window. Pick it
  with the normal file dialog or drop it in, then tune opacity, blur, brightness, saturation,
  contrast, vignette, fit, anchor, zoom and mirroring; videos get speed, pause-when-hidden and
  reduced-motion controls, and a small library with an optional slideshow keeps several
  backgrounds. Quick controls in the status bar, a full settings page and command-palette commands.
  Disclosure — desktop-only (desktop/plugin.js, imports only @hermes/plugin-sdk and react): no
  backend, agent tools, hooks, env vars, network calls or telemetry. Picked files are copied into
  the plugin's own IndexedDB in the Desktop app's local profile and never leave that computer;
  settings use ctx.storage. While a wallpaper shows, the plugin adds its own fixed z-index -1 layer
  and one style tag under its own html attribute that applies Desktop's glass-mode transparent-surface
  rules (surface CSS variables, [data-contrib-shell] and [data-slot='sidebar-wrapper'] fills;
  data-glass-opaque/raised surfaces stay filled); turning it off or disabling the plugin removes all three.
