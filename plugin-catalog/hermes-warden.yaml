sha: a0ecbfab7132c574e500ac9364b18fea64900c86
version: "0.1.7"
description: "Bitwarden built into Hermes. Easy: a lock tab installs the Bitwarden CLI, signs you in and unlocks, no terminal; one-click copy with auto-clearing clipboard. Integrated: works in Hermes Desktop, the Webapp and any chat (9 agent tools, /warden, the Hermes display language). Safe: secrets are typed only in masked dialogs, the session key lives only in memory, and secrets leave only to your clipboard or commands you approve; the agent never reads them from the vault. Disclosure — runs the Bitwarden CLI (bw), which talks to your Bitwarden server; Have I Been Pwned is queried (5-char SHA-1 prefix) only for a password check you approve; the CLI installer, only when you press Install, uses Homebrew or npm (npm pinned to the same release) or downloads the official Bitwarden build from github.com/bitwarden/clients, checked against the published SHA-256; a background broker process per Hermes profile holds the session key in memory and exits when locked and idle, and each named profile signs in to Bitwarden separately; warden_run executes the shell command you approve directly on the Hermes host (outside any terminal sandbox) with the chosen vault secrets in its environment; bw serve, which you start from the Warden tab, exposes the unlocked vault on 127.0.0.1 with no authentication to any local process while it runs; exports you approve in csv, json or zip format are written to disk unencrypted; osascript is used on macOS for host dialogs and clipboard; a pre_tool_call hook blocks the agent's terminal from running bw or reading the clipboard for 15 minutes after a secret was copied; settings (no secrets) under <Hermes home>/plugin-data/hermes-warden. No telemetry. Not affiliated with Bitwarden or Nous Research."
maintainer: pedroberaldo87
tier: community
category: tools
requires_hermes: ">=0.22.6"
