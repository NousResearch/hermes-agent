known_issues:
  - "macOS and Linux only; Windows is not supported. Bitwarden Secrets Manager (bws) is not covered."
  - "In the Webapp, browsers do not let a page write the clipboard while its tab is in the background: if the tab is not focused when the 30-second timer ends, the plugin asks you to clear the clipboard yourself."
  - "The lock tab comes in 9 languages; only English and Brazilian Portuguese were reviewed by a person."
capabilities:
  provides_tools: [warden_status, warden_session, warden_find, warden_bw, warden_edit, warden_secret, warden_run, warden_transfer, warden_serve]
  provides_hooks: [pre_tool_call]
  provides_middleware: []
  requires_env: []
