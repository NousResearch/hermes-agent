name: hermes-warden
title: Hermes Warden
repo: https://github.com/pedroberaldo87/Hermes-Warden
sha: 278345ccd20f10293fd6fa505dc87c5c8c29f95c
version: "0.1.0"
description: "Bitwarden built into Hermes. Easy: a lock tab installs the Bitwarden CLI, signs you in and unlocks, no terminal; one-click copy with auto-clearing clipboard. Integrated: works in Hermes Desktop, the Webapp and any chat (9 agent tools, /warden, the Hermes display language). Safe: secrets are typed only in masked dialogs, the session key lives only in memory, and secrets leave only to your clipboard or commands you approve; the agent never sees them. Disclosure — runs the Bitwarden CLI (bw), which talks to your Bitwarden server; Have I Been Pwned is queried (5-char SHA-1 prefix) only for a password check you approve; the CLI installer uses Homebrew, npm or downloads the official Bitwarden build from github.com/bitwarden/clients (SHA-256 pinned) only when you press Install; a background broker process holds the session key in memory and exits when locked and idle; bw serve runs only while you keep it on; osascript is used on macOS for host dialogs and clipboard; a pre_tool_call hook blocks the agent's terminal from running bw or reading the clipboard for 15 minutes after a secret was copied; settings (no secrets) under <Hermes home>/plugin-data/hermes-warden. No telemetry. No login backend (browser_vault) is registered. Not affiliated with Bitwarden or Nous Research."
maintainer: pedroberaldo87
tier: community
category: tools
requires_hermes: ">=0.22.6"
docs_url: https://github.com/pedroberaldo87/Hermes-Warden
readme: true
platforms: [macos, linux]
