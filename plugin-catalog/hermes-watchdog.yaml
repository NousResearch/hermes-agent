title: Hermes Watchdog
description: "Scheduled jobs break without telling you. A job fails at 3am, so Hermes Watchdog tries the fix that fits (retry it, restart what broke, or pause it), then checks whether the next run worked. You only hear about it when the fix didn't take. Free, no API keys, one command to install. Disclosure - reads this profile's local cron store read-only, fires the failing job through Hermes's own cronjob tool or pauses it, and runs only the argv-list check steps a user-authored playbook declares; writes only its own plugin-data directory."
image: "https://raw.githubusercontent.com/33hodl/hermes-watchdog/5ebf52d622b71496cba308891ea68e32e1b2cded/docs/banner.png"
maintainer: 33hodl
tier: community
category: automation
requires_hermes: ">=0.22"
docs_url: https://github.com/33hodl/hermes-watchdog#readme
version: "0.1.8"
platforms: []
capabilities:
  provides_tools:
    - watchdog_status
    - watchdog_repair
    - watchdog_runbooks
  provides_hooks:
    - on_session_end
  provides_middleware: []
  requires_env: []
