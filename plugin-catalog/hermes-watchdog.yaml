name: hermes-watchdog
repo: https://github.com/33hodl/hermes-watchdog
sha: 10940840d9316877b781ace464d148dbb31b1a10
title: Watchdog
description: "Cron jobs that fix themselves: match each open cron incident to a playbook, run the repair (rerun the job, pause it, run a user-authored check, or escalate), then verify the failure actually cleared against Hermes's own incident and execution records, with a durable attempt ledger and a per-incident daily budget. Ships three tools, a /watchdog command, an on_session_end hook that repairs a failing cron turn in place, a bundled skill, and a Desktop pane plus status-bar chip. Disclosure — reads this profile's cron store read-only (jobs, incidents, executions) through late imports that degrade to \"upstream unavailable\" when a module moves, and fires the failing job through Hermes's own cronjob tool (the same path `hermes cron run` uses) or pauses it; a playbook 'check' step runs the argv list you authored, no shell, one bounded timeout per step; writes only its own plugin-data directory (a repair ledger SQLite DB and the playbooks you save); it never edits a job's prompt or schedule and never messages on your behalf."
maintainer: 33hodl
tier: community
category: automation
requires_hermes: ">=0.22"
docs_url: https://github.com/33hodl/hermes-watchdog#readme
version: "0.1.0"
platforms: []
capabilities:
  provides_tools:
    - watchdog_status
    - watchdog_repair
    - watchdog_runbooks
  provides_hooks:
    - on_session_end
  provides_middleware: []
  requires_env: []
