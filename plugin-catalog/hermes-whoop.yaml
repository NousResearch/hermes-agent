platforms: []
known_issues:
  - "WHOOP's docs say the redirect URI must match the one registered; Hermes signs in on 127.0.0.1 with an OS-assigned port. Register http://127.0.0.1/callback: WHOOP's OAuth server appears to be Ory Hydra, which accepts any port for a loopback redirect (RFC 8252), but WHOOP does not document this. If WHOOP reports a redirect mismatch, see the README's Limits section."
  - "As of 2026-11-07 the WHOOP sign-in and token refresh are tested only against Hermes's real OAuth code with WHOOP faked, not against a real WHOOP account. Demo mode needs no account."
capabilities:
  provides_tools: [whoop_today, whoop_history, whoop_trends, whoop_profile, whoop_status]
  provides_hooks: [pre_llm_call]
  provides_middleware: []
  requires_env: []
