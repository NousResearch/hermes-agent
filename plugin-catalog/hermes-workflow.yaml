name: hermes-workflow
title: Workflow Studio
repo: https://github.com/SaM-0777/hermes-workflows
sha: a23d8cf6d776ce5fdccdc28ec8f6563fa1dfe12d
description: "General-purpose visual workflow studio for designing, running, and iterating on multi-step agent and automation flows inside Hermes Desktop. Disclosure — workflow nodes are Python code that runs on this computer as your user through Hermes' execute_code (separate process, not a sandbox) with your user's file and network access; the model can create and edit nodes, and a model-requested run needs your Hermes approval and a click in the studio."
maintainer: SaM-0777
tier: community
category: desktop
version: "0.2.0"
requires_hermes: ">=0.23.0"
platforms:
  - macos
  - linux
  - windows
capabilities:
  provides_tools:
    - list_nodes
    - get_node_by_id
    - create_node
    - update_node
    - delete_node
    - list_workflows
    - get_workflow_by_id
    - create_workflow
    - update_workflow
    - delete_workflow
    - add_node_to_workflow
    - add_library_node_to_workflow
    - update_workflow_node
    - delete_workflow_node
    - duplicate_workflow_node
    - add_workflow_edge
    - remove_workflow_edge
    - request_run_workflow
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
known_issues:
  - "Beta release."
