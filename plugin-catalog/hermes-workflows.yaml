name: hermes-workflows
repo: https://github.com/jacobhausler/hermes-workflows
sha: edc8b3b556b9baf4379fe7a3e89dd457b03603c5
description: >-
  Agent-owned workflow graphs for Hermes — a background runner executes a JSON DAG of
  agent nodes, fan-outs (quorum) and human/machine gates with fingerprint replay-skip
  resume, cooperative steer, typed failure events and compact status payloads; ships a
  desktop DAG view, an inline transcript card and the authoring skill with measured budget
  recipes. Stock Hermes; no patched core required. Disclosure — every workflow run spawns
  a detached background runner (wf.py run <id>) that survives session end, gateway restart
  and plugin disable until the graph reaches a boundary or workflow stop; each agent node
  is a child hermes chat --query-file … --oneshot -Q … inheriting the runner's
  environment, and a node with profile set runs as that named profile (with its own
  credentials) only if the target's workflow_team.json lists the launcher; a gate's
  wait.until_argv runs an agent-authored fixed-argv command (no shell) directly from the
  runner, outside Hermes' tool-approval gate; run and amend send a one-token ping through
  Hermes' configured providers to check pinned model routes; state lives under
  $HERMES_HOME/workflows/ (or a configured runs_root). No scheduler, credential-store
  access or network of its own.
maintainer: jacobhausler
