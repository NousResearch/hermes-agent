known_issues:
  - "You need your own X developer app on the pay-per-use plan; X bills your app for reads (about $0.001 per bookmark for owned reads; a first sync of ~1,900 bookmarks was about $1.89, and from 2026-11-22 X also bills expanded objects)."
  - "Notion export needs `hermes mcp install notion` and mcp_allowlist: [\"notion\"] for this plugin (or an XBM_NOTION_TOKEN); one chat export writes all pages and shows progress."
capabilities:
  provides_tools: [xbm_digest, xbm_task, xbm_skill]
  provides_hooks: [pre_llm_call]
  provides_middleware: []
  requires_env: []
