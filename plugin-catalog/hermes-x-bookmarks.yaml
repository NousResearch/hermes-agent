version: "0.2.3"
description: "Reads your own X bookmarks (long posts and X Articles in full) through the official X API with your own X app, sorts them with your Hermes model (category, tags, kind, priority, summary) and exports them to a board on your Desktop, Obsidian notes, a Notion database or a Google Doc. Disclosure — calls api.x.com (read-only, keys of your own X app from the Hermes .env via secret scope, or Hermes' X OAuth 2.0 sign-in, or `xurl token` when you pick the xurl sign-in, which runs that CLI); sends post text to your configured Hermes model; only when you export there: Notion through Hermes' Notion connector (ctx.call_mcp to the notion MCP server, only if you add it to this plugin's mcp_allowlist; creates the database, two boards and pages, updates those pages) or api.notion.com with an optional XBM_NOTION_TOKEN, and docs.googleapis.com through Hermes' Google sign-in (your own Desktop client, scope drive.file only); writes an 'X Bookmarks' folder on your Desktop (or export_dir) and notes into your Obsidian vault's 'X Bookmarks' folder, and reads Obsidian's obsidian.json to find the open vault; bookmarks, labels and export ids are stored in plugin data; no credentials stored, no telemetry, no background process."
