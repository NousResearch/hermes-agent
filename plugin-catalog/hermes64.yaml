known_issues:
  - "Draft platform metadata is unresolved: native Linux authoring is unavailable; platforms: [] does not establish feature parity."
  - "Requires standard Godot 4.6.2 and matching hash-verified export templates for exports."
  - "Windows authoring requires Job Object runner opt-in; it has no OS network or write confinement."
  - "Windows cannot export macOS apps; final-package Mac and PC retests are pending in this draft."
  - "No general jumping, vehicle dynamics, multiplayer or seamless open world."
  - "Starter image audits can fail even when bots complete; agent-designed games require iteration."
  - "Official setup fetch is human-confirmed; optional export templates download is about 1.25 GB."
  - "macOS apps are ad-hoc signed, not notarized; other-Mac Gatekeeper acceptance is not established."
  - "Intermediate validation retains a private host-version-probe warning and an in-process isolation note; final dependency-install gate is pending."
