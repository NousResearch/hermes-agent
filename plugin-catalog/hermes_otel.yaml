name: hermes_otel
repo: https://github.com/briancaffey/hermes-otel
sha: "32554cf76c8dbeb8d382eaff9007112abf3f7b2c"
subdir: hermes_otel
description: "OpenTelemetry for Hermes Agent: sessions, LLM and API calls, tool calls, sub-agents and approvals as OTLP traces, metrics and logs to any OTLP backend. Disclosure — sends span data including prompts, tool arguments and tool output only to backends you configure (a backends: list or an OTEL_* variable); by default content_capture is full and unclipped (preview clips to 1200 chars, off sends none); vendor SDK keys already in the environment are used only after that opt-in; with nothing configured it keeps a local owner-only SQLite store under $HERMES_HOME and sends nothing; installs opentelemetry-api, -sdk, -exporter-otlp-proto-http and -exporter-otlp-proto-grpc (>=1.35,<2) and PyYAML."
maintainer: briancaffey
tier: community
category: general
requires_hermes: ">=0.21"
docs_url: https://briancaffey.github.io/hermes-otel/
version: "1.33.0"
image: https://raw.githubusercontent.com/briancaffey/hermes-otel/32554cf76c8dbeb8d382eaff9007112abf3f7b2c/docs/catalog-banner.png
capabilities:
  provides_tools: []
  provides_hooks:
  - agent_loop_stopped
  - api_request_error
  - kanban_task_blocked
  - kanban_task_claimed
  - kanban_task_completed
  - on_human_input_request
  - on_human_input_resolved
  - on_kanban_dispatch_tick
  - on_kanban_task_updated
  - on_kanban_worker_exited
  - on_kanban_worker_spawned
  - on_kanban_worker_stale_claim
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - on_session_start
  - on_skill_lifecycle
  - post_api_request
  - post_approval_response
  - post_auxiliary_call
  - post_llm_call
  - post_tool_call
  - pre_api_request
  - pre_approval_request
  - pre_auxiliary_call
  - pre_command
  - pre_llm_call
  - pre_tool_call
  - pre_transcription
  - pre_verify
  - subagent_start
  - subagent_stop
  - transform_llm_output
  - transform_terminal_output
  provides_middleware: []
  requires_env: []
