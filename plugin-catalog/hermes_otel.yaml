name: hermes_otel
repo: https://github.com/briancaffey/hermes-otel
sha: "d234865b13e997e0b3a50dc18aaad7c7d7b1b1fe"
subdir: hermes_otel
description: "OpenTelemetry for Hermes Agent: sessions, LLM and API calls, tool calls, sub-agents and approvals as OTLP traces, metrics and logs to any OTLP backend. Disclosure — sends span data including prompts, tool arguments and tool output only to backends you configure (a backends: list, an OTEL_* variable, or LANGSMITH_TRACING=true); by default content_capture is full and unclipped (preview clips to 1200 chars, off sends none); vendor SDK keys already in the environment are used only after that opt-in; with nothing configured it keeps a local owner-only SQLite store under $HERMES_HOME and sends nothing; installs opentelemetry-api, -sdk, -exporter-otlp-proto-http (>=1.35,<2) and PyYAML."
maintainer: briancaffey
tier: community
category: general
requires_hermes: ">=0.21"
docs_url: https://briancaffey.github.io/hermes-otel/
version: "1.18.2"
image: https://raw.githubusercontent.com/briancaffey/hermes-otel/d234865b13e997e0b3a50dc18aaad7c7d7b1b1fe/docs/catalog-banner.png
capabilities:
  provides_tools: []
  provides_hooks:
  - api_request_error
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - on_session_start
  - post_api_request
  - post_approval_response
  - post_llm_call
  - post_tool_call
  - pre_api_request
  - pre_approval_request
  - pre_llm_call
  - pre_tool_call
  - subagent_start
  - subagent_stop
  provides_middleware: []
  requires_env: []
