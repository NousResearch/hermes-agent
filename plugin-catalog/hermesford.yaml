title: HermesFord
description: 'An HD-2D pixel-art village page for Hermes Desktop: every chat is a villager who walks to the
  forge, library, woods or town hall depending on the tool its agent is running, waits at the town hall
  when the chat needs you, and goes home to sleep when the chat is not active. Click a villager to open
  its chat. Built on the Luminati engine (MIT). Desktop-only (desktop/plugin.js inside the plugin SDK
  surface, read-only session.list / session.active_list polling every 3 s); no agent tools, hooks,
  middleware, env vars or network calls.'
maintainer: XpycT
tier: community
category: desktop
requires_hermes: ">=0.22.5"
