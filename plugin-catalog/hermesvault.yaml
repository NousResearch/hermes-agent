description: "Keep secrets out of plaintext .env files: a local encrypted vault (FloorVault, AES-256-SIV) whose items Hermes loads as environment variables at startup (mapped source \"hermesvault\", hv: references), with a hermes hvault CLI to manage items. The vault key lives in your OS key store (Keychain, Secret Service, DPAPI) or HERMES_VAULT_KEY. Disclosure — reads and writes an encrypted store under <HERMES_HOME>/agent-vault (or secrets.hermesvault.dir); reads its own master key from the environment variable named by token_env (default HERMES_VAULT_KEY), else from FLOOR_VAULT_KEY or VAULT_MASTER_KEY, else from the OS key store (macOS Keychain, Linux Secret Service or Windows DPAPI; service floor-vault, shared with other FloorVault apps on the same account), where it creates a new key on first use; resolved values become environment variables of the Hermes process and its children, like .env entries; installs floorvault from PyPI (plus secretstorage on Linux, pyobjc-framework-Security on macOS); no network calls, no subprocesses, no self-update; protection is at rest, not against code already running as the same user."
