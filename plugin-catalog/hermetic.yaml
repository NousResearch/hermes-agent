name: hermetic
repo: https://github.com/forefy/hermetic
sha: f7026c949d8831b26910f2ebd3434e8c58cdff89
version: "1.1.1"
requires_hermes: ">=0.21.6"
description: "Status-bar popover for Hermes Desktop with three views: Costs (spend, cache, pricing drift, OpenRouter provider routing), AAI (skill changes, ratings, tests and replays) and HDR (posture, destinations, sensitive paths, what runs on its own). Disclosure — reads this profile's sessions (and other profiles' when you pick them) to audit tool calls, paths and hosts; can edit and save config.yaml and rewrite skill files when you ship or revert a version; AAI replays and judge runs resend conversation context and tool definitions to OpenRouter with your OpenRouter key and incur cost; HDR lists listening TCP ports via ps/lsof."
maintainer: forefy
tier: community
category: desktop
docs_url: https://github.com/forefy/hermetic#readme
