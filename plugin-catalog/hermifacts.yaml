sha: 2149ab882726547b7f269470537c7549a29353e6   # tag v0.1.2
version: "0.1.2"
title: Hermifacts
description: >-
  Turn an interactive HTML/JS/CSS artifact into an installable app: a standalone PWA
  and a native OS launcher (.desktop / .app / .cmd) that opens it in a chromeless
  window, running on the host's own Hermes model with no API keys anywhere. Apps call
  window.hermesApp.llm, which the plugin's backend proxies to the configured provider,
  so a shared app runs on the recipient's provider and no secret ever leaves a
  machine. Tool allowlists exclude execution, file-write, process-control,
  delegation, cron, messaging and computer-use tools because app bridge calls run
  outside a chat approval turn. Declared inputs (select, range, number, checkbox,
  text) broadcast live updates to window.hermesApp.onParamsChange so charts and
  views redraw as the control moves. Any app exports as a zero-secret hf1. share link or a .hermifact.json bundle,
  and imports always start in the sandbox tier. Three permission tiers — sandbox
  (isolated iframe, never allow-same-origin, per-app KV storage), app (Hermes LLM
  calls, OS notifications, explicitly allowlisted Hermes tools) and full (adds
  read/write inside one folder the user names) — each cryptographically pinned to
  SHA-256(html + inputs), so editing the code locks elevated access until re-approved.
  Seven agent tools (hermifact_create, _list, _get, _install, _export, _import,
  _delete) plus a /hermifacts command; desktop page, backend dashboard API, no hooks,
  no middleware, no required env vars.
maintainer: DECRUX9812
