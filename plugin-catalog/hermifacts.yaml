# Community catalog entry — hermifacts
#
# Owner-submitted: the PR author (`DECRUX9812`) owns and maintains the repo below.
# Exact-SHA pin (40-hex) on main at tag v0.1.2. No self-updating code: the plugin
# never fetches, downloads or replaces its own files. Its only network access is the
# host's own model call that an approved app makes through the plugin's backend bridge.
name: hermifacts
