description: "For people who work with health clinics of any specialty: estimate what a clinic's front desk loses each month to missed calls, unanswered WhatsApp messages and no-shows, from the numbers the clinic gives, and audit a clinic website for Google and AI search (crawling and indexing, AI crawlers, llms.txt, schema.org JSON-LD, local SEO), with a fix for each finding. Two skills by HeyCAi, the AI receptionist for health clinics. Portable Agent Plugins v1 package (plugin.json + skills/), skills only: no plugin code, no MCP server, no hooks. Disclosure: the skills are instructions only; the plugin makes no network calls of its own and needs no credentials and no patient data. The website audit tells the agent to read the clinic's public pages, for example with curl -sL and curl -sIL on the site's URLs (each command goes through Hermes' terminal approval); the front desk audit runs no commands. The repo's package.json, scripts/ and tests/ are dev tooling for the repo's tests and are not loaded by Hermes; answer N to the Node dependencies prompt at install."
