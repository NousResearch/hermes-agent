name: hicortex
repo: https://github.com/gamaze-labs/hicortex-hermes-plugin
sha: 3321a063bffb087dfcedc239a6f7aaf1ac0b8ef6
description: >-
  Shared fleet memory for Hermes agents: every connected agent learns from all other
  agents connected to the memory, wherever they run. Sessions across machines and harnesses are distilled
  into one common brain overnight — what one learns, the whole fleet recalls. Pushes a compact per-turn recall index (entries
  lazy-load via hicortex_get), injects fresh lessons plus a per-agent standing context block at
  session start — lesson blocks are delimited and carry an explicit reference-data framing line
  and provenance header — and exposes the full 9-tool memory surface (search, get, recent,
  ingest, lessons, index, graph, update, delete) through the shared server. The same server
  also serves Claude Code, OpenClaw, Pi and opencode agents, so mixed-harness fleets share one
  brain. Stdlib-only, no pip dependencies. Requires a running Hicortex server
  (npx @gamaze/hicortex init on any machine); data flow: each user message is sent to your
  configured Hicortex server for recall (default http://localhost:8787); session
  distillation runs on the server.
maintainer: gamaze-labs
tier: community
category: memory
docs_url: https://github.com/gamaze-labs/hicortex-hermes-plugin#readme
version: "0.7.10"
readme: true
capabilities:
  provides_tools:
    - hicortex_search
    - hicortex_get
    - hicortex_recent
    - hicortex_ingest
    - hicortex_lessons
    - hicortex_index
    - hicortex_graph
    - hicortex_update
    - hicortex_delete
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - HICORTEX_URL
    - HICORTEX_AUTH_TOKEN
