description: Hindsight long-term memory provider — knowledge graph, entity resolution and multi-strategy
  retrieval (recall/reflect/retain tools plus automatic per-turn capture); cloud, local embedded or local
  external mode. Maintained by Vectorize; the same provider that shipped in-tree. Disclosure — in
  local_embedded mode the plugin installs the `hindsight-all` PyPI package into the Hermes venv on first
  use through core's lazy-install path (honours security.allow_lazy_installs), and `hermes memory setup`
  fetches its bank-template catalog from raw.githubusercontent.com (vectorize-io/hindsight main).
