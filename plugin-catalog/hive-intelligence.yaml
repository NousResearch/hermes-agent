description: "Crypto data for AI agents through Hive's hosted MCP server (Streamable HTTP at https://mcp.hiveintelligence.xyz/mcp, OAuth sign-in, no keys in config): find a token, get its price, check token safety, research a token, analyze a wallet, read market positioning and the market overview, and look up DeFi yields and prediction markets. Portable Agent Plugins v1 package (plugin.json + mcp.json + the hive and hive-setup skills), no Python or executables. Needs a free Hive account (Free plan: 10,000 credits a month). Read-only: never trades, moves funds or signs anything. Disclosure — every tool call sends the tool name and its inputs (a token, wallet address or query) to mcp.hiveintelligence.xyz and spends the account's Hive credits; the tool list comes from Hive's server at run time, so the pinned commit doesn't cover it; when no Hive tools are connected, the bundled skills have the agent run the npm package `hive-intelligence@1.20.2` via `npx` on your machine, and `/hive-setup`'s one-command path (`hive init --all`, only after you say yes) edits every detected AI client's config and installs the `hive` CLI globally."
