description: "Local fact-store memory provider: SQLite with FTS5 keyword search, trust scores, entity linking and HRR (holographic reduced representation) recall, with no API key, network or model calls. The provider that shipped in-tree as plugins/memory/holographic, with the same provider name, config (plugins.hermes-memory-store) and memory_store.db, so `hermes update` moves existing users onto it. Taken over from Nous Research's handoff copy (NousResearch/hermes-plugin-holographic) and maintained by itpartypattaya; 0.2.x fixes probe/reason/related/contradict, non-Latin entity names, non-atomic writes and the never-written retrieval_count, honours the provider contract (read-only subagent/cron contexts, hermes_home, mirror metadata), and stops mirroring built-in memory into facts by default. Disclosure — local only: reads and writes one SQLite file per profile ($HERMES_HOME/memory_store.db unless db_path says otherwise); no network calls, subprocesses, credentials or telemetry; with auto_extract on (off by default) user messages that match preference/decision patterns are stored at session end."
