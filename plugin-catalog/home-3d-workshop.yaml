name: home-3d-workshop
title: Home 3D Workshop
repo: https://github.com/Wijt/hermes-home-3d-workshop
sha: "fb5bb263246b660367814a53d2bebeb7a051f975"
version: "0.1.0"
description: "A household 3D-printing workshop with a character (Mıstık by default; the name and the en/tr message language are settings, English by default). Family members ask in plain words; the agent finds MakerWorld models through Bambuddy, scales one, or designs a part in OpenSCAD (it writes the code, renders it, looks at the preview pictures and keeps every version), slices, and queues with manual start. A print starts only with the owner's approval; when a family member asks, the watcher passes the request to the owner with the exact command. A zero-token cron watcher tells the owner (technical, with a photo) and the family (one plain line, by name) about finish, failure, pause, HMS errors and the build plate. Each moment a person had to step in is logged, and repeats become upgrade proposals (for example a printed tilted base for auto-eject). Works with a Bambu Lab printer managed by Bambuddy, or with a built-in simulated printer (hermes home3d demo). Disclosure — Network: only the one Bambuddy URL you set, over HTTP on your LAN. When HOME3D_BAMBUDDY_API_KEY is set, it is sent as X-API-Key, unencrypted over plain http. MakerWorld lookups and downloads go through Bambuddy; the plugin makes no other network calls. Writes: import, scale, design upload, slice and queue add write to the Bambuddy library and queue without a prompt; queued items are always manual start. Queue remove only removes the asking person's own waiting items: never a job queued outside the workshop or another household member's job, not even for the owner (who can remove anything by hand in Bambuddy). Bambuddy settings are read (GET /settings/) and never changed. With Bambuddy's require_plate_clear off, Bambuddy may start its own auto-start items on a finished printer before the camera check; hermes home3d doctor warns about this. Chamber light: a tool photo or plate check switches it on for about 12 s and restores its earlier state. The cron watcher also switches it by itself for its plate checks and photos: at most once per pass (twice when a camera request fails), one photo near the end of each workshop print (other prints: one photo and plate check in one light cycle when they end), a check when a print ends, and re-checks that back off 15, 30, 60 and 120 min (at most 6) while a plate or a job waits. Approvals: start, resume and plate-clear confirm are blocked in cron and in runs with nobody present (kanban workers, chat -q, -z, --source tool; both checks fail closed), when a safety gate fails (printer busy or offline, active HMS error, plate not judged empty, another person's job ahead, plate not confirmed after a failed print, bed hot or of unknown temperature for a plate clear), and for unknown or non-owner senders, who are told that the owner approves with /home3d approve. A household member's blocked request is stored, and the watcher tells the owner once (when owner_target is set; otherwise the block tells the person to ask the owner directly). Only an owner session gets the Hermes approve prompt. The owner is any id in owner_ids, plus, while local_is_owner is true (the default), any local CLI, TUI or Desktop session and any slash command typed in the TUI, Desktop or web dashboard; turn local_is_owner off when others can reach the dashboard. On IRC and ntfy, where people choose their own ids, only an entry written with the platform (irc:<nick>) matches a sender. The tool handler also needs a single-use pass from that hook or from /home3d approve, so a call that skips the hook is refused, and it checks the plate with the camera right before the action. /home3d approve runs the gate and the action at once and stores nothing for later. yolo and approvals off skip the prompt in an owner session. Each rule_key is unique, so always does not carry over, and each always answer adds one unused command_allowlist line to config.yaml. Hook time: pre_tool_call reads only printer status and queue (at most 5 s per request, 12 s in all, never the camera), so it stays inside Hermes' 30 s hook limit; with a lower plugins.hook_callback_timeout it allows itself 0.4 of it. Stop and pause need no approval and pass no gate: anyone who can reach the agent can stop or pause a print. Hermes internals: besides ctx.current_cron_execution(), the cron and unattended checks read non-public Hermes internals from sys.modules (gateway.session_context.get_session_env, cron.execution_identity._CURRENT, gateway.session_finite, and hermes_cli.plugins._resolve_hook_callback_timeout for the hook deadline); they are never imported or patched. A check that raises counts as cron or unattended (fail closed); a renamed one is skipped. Subprocesses: hermes send for notices (with -p send_profile when set); hermes cron create, list and remove from hermes home3d setup and teardown; openscad for the name-tag and label-box templates and for the agent's designs, and xvfb-run for the design preview pictures, when they are installed (one render at a time, a 180 s default time limit, a CPU-time limit, a memory cap and an STL size cap; a design may read files only from its own folder and OpenSCAD's own libraries, checked in the source and in OpenSCAD's list of the files it read). hermes home3d setup writes HERMES_HOME/scripts/home3d_watch.py and creates one hermes cron create --no-agent --script job, every 2 minutes by default (720 runs a day, no daily cap); it runs while the Hermes scheduler (hermes gateway) runs. The job calls no model, and empty output sends nothing. The script reads HERMES_HOME/config.yaml (the plugin settings) and stays silent while the plugin is disabled or removed. The job and the script stay until hermes home3d teardown (after an uninstall: hermes cron remove and delete the script). Data stays local under HERMES_HOME/plugin-data/home-3d-workshop: a SQLite database (requests, jobs, household sender ids and names, approval requests, audit events), outbox.jsonl with every message, camera photos, model files, designs (OpenSCAD source, STL, preview pictures and facts for every version), a watcher log and a settings snapshot without secrets (the watcher's fallback). pre_llm_call adds up to 900 characters of context (persona, speaker, printer state): for household members and the local owner on the first turn, on printing turns and on printer state changes, else one speaker line; for other senders only on printing turns; inject_context: never turns it off. The tools are on for every surface, and while the plugin is enabled its two skills add one line each to the skills index of every session. Tested on Linux with Hermes 0.22.5. Verified on a real Bambuddy 1.3.0 with an A1: printer status, queue, Bambuddy settings, lit photo with plate check, MakerWorld import, slice, scale, queue add and remove, and the watcher in dry run on a real print (finish and plate check). The templates, a sample design and the file-access probes are tested with OpenSCAD 2021.01 in CI; a part designed with home3d_design was uploaded and sliced on the real Bambuddy. Planned on the real printer: start, stop, pause and resume, watcher notices and auto-eject with this plugin."
maintainer: Wijt
tier: community
category: tools
requires_hermes: ">=0.22.5"
docs_url: https://github.com/Wijt/hermes-home-3d-workshop#readme
known_issues:
  - "Bambu Lab printers through Bambuddy only (tested with Bambuddy 1.3.0 and an A1). The default backend is a simulated printer."
  - "Real-printer status: status, queue, settings, lit photo with plate check, import, slice, scale, queue add/remove, a designed part uploaded and sliced, and the watcher in dry run on a real print are verified; start, stop/pause/resume, watcher notices and auto-eject with this plugin are planned."
  - "Auto-eject needs your own tilted base and an end G-code preset; the plugin ships no G-code. Turn on Bambuddy's Require plate clear setting."
  - "The watcher cron job runs only while the Hermes scheduler runs (hermes gateway)."
  - "Designing parts needs openscad (and xvfb-run for preview pictures) on the Hermes machine; without it the agent uses ready models and the scale tool only."
  - "Tested on Linux only."
platforms: []
