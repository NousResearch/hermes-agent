  provides_tools:
  - home3d_status
  - home3d_camera
  - home3d_find_models
  - home3d_import
  - home3d_customize
  - home3d_design
  - home3d_slice
  - home3d_queue
  - home3d_start
  - home3d_stop
  - home3d_clear_plate
  - home3d_household
  - home3d_human_needed
  - home3d_upgrades
  provides_hooks:
  - pre_tool_call
  - post_tool_call
  - pre_llm_call
  provides_middleware: []
  requires_env: []
