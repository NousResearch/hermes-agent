name: homeassistant
repo: https://github.com/NousResearch/hermes-homeassistant
sha: f272c96b9a538a2327b23023341f571e563ea475
description: 'Home Assistant gateway platform (state-change events in, persistent notifications and cron notify
  delivery out) plus the homeassistant toolset (ha_list_entities, ha_get_state, ha_list_services, ha_call_service).
  Formerly built into Hermes core; existing users are migrated automatically.'
maintainer: NousResearch
tier: official
category: platform
requires_hermes: ">=0.21.5"
version: "2.0.0"
docs_url: https://github.com/NousResearch/hermes-homeassistant
platforms: []
capabilities:
  provides_tools:
    - ha_list_entities
    - ha_get_state
    - ha_list_services
    - ha_call_service
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - HASS_TOKEN
