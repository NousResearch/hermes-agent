platforms:
- linux
- macos
- windows
known_issues:
- Native phone-app panels are unverified; use a supported Desktop/browser renderer or enabled chat
  tools.
- Cloud deployments need persistent profile storage and one long-lived plugin host; stateless or
  round-robin multi-worker hosting is not supported.
capabilities:
  provides_tools:
  - homework_coach_intake
  - homework_coach_generate_packet
  - homework_coach_record_feedback
  - homework_coach_status
  - homework_coach_progress
  - homework_coach_set_curriculum
  - homework_coach_add_material
  provides_hooks: []
  provides_middleware: []
  requires_env: []
