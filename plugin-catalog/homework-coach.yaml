name: homework-coach
repo: https://github.com/andrewjsoukup/homework-coach
sha: 79ff46a3567c72995b58acfb63d8ec7640f028ac
title: Homework Coach
description: Homework photos and teacher updates become checked daily math practice PDFs and a separate
  parent key. Parent I/S/N feedback guides difficulty. Includes a class plan, read-back corrections,
  progress/history, a scheduling blueprint and a Desktop workspace. Data stays on the selected Hermes
  backend; photos and teacher content use the configured model provider. JSON uploads and direct
  downloads support remote clients.
maintainer: andrewjsoukup
tier: community
category: tools
requires_hermes: '>=0.22.5'
version: "0.2.4"
