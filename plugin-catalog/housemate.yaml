known_issues:
  - The wake phrase is "Hey Jarvis" (openWakeWord's stock model). A custom "Hey Hermes" model missed our accuracy bar on non-US accents and is not shipped.
  - openWakeWord's wake-word models are CC BY-NC-SA 4.0, so the wake pipeline is for non-commercial use.
  - Needs speech-to-text turned on in Hermes (stt.enabled, any provider) and a text-to-speech voice.
  - On Hermes 0.23.0 the Rooms page uses the plugin's REST routes; the plugin RPC path for newer builds is unit-tested only. Tested in the Webapp, not in the native Desktop app.
  - The first answer after a gateway restart takes about 7 s.
  - Tested on Windows 11 with Chrome; macOS and Safari are untested.
capabilities:
  provides_tools:
    - housemate_rooms
    - housemate_announce
    - housemate_timer_set
    - housemate_alarm_set
    - housemate_timer_list
    - housemate_timer_cancel
    - housemate_show
  provides_hooks:
    - pre_llm_call
  provides_middleware: []
  requires_env: []
