subdir: hermes
description: >-
  Review the HTML pages your agent writes, on the page itself: comment on the exact
  element, chart, table row or passage; Hermes is told about new comments, reads each one
  with its context, makes checked edits and replies. Pages can also be published as a
  GitHub issue or pull request description, and comments posted there are pulled back.
  Adds 11 tools, a pre_llm_call notice, a pre_tool_call approval gate, a skill, the /htmi
  command and a Review tab in the dashboard. Disclosure: runs its bundled engine with Node
  and runs git in the current repository, all with an explicit minimal environment (no
  provider keys); reads and writes documents only inside that repository, also refusing
  symbolic links that point outside (comments go to .htmi/annotations.jsonl); opening a
  review page starts a local review server bound to 127.0.0.1 that keeps running until
  /htmi stop or a restart; GitHub work (publish, pull comments, reply, edit a description)
  uses your own gh CLI login, only in the repository's origin remote and repositories you
  list in its github_repos setting, and every issue it creates and every description it
  replaces or edits waits for your approval in Hermes; no telemetry, no stored credentials,
  no third-party services.
