name: htmi
repo: https://github.com/Thamirawaran/htmi
sha: 85379a5ee3dc56ba274cd71d6d3a2caff218c8a1
subdir: hermes
description: >-
  Review the HTML pages your agent writes, on the page itself: comment on the exact
  element, chart, table row or passage; Hermes is told about new comments, reads each one
  with its context, makes checked edits and replies. Pages can also be published as a
  GitHub issue or pull request description, and comments posted there are pulled back.
  Adds 11 tools, a pre_llm_call notice, a skill, the /htmi command and a Review tab in the
  dashboard. Disclosure: runs its bundled engine with Node and runs git in the current
  repository; reads documents and writes comments only inside that repository
  (.htmi/annotations.jsonl); opening a review page starts a local review server bound to
  127.0.0.1 that keeps running until /htmi stop or a restart; GitHub actions (publish,
  pull comments, reply) use your own gh CLI login and run only when asked; no telemetry,
  no stored credentials, no third-party services.
maintainer: Thamirawaran
