name: hunk-consent-guard
title: Hunk Consent Guard
repo: https://github.com/misakamikotoghr-5205/hermes-hackathon-plugins
sha: "d4a7f0938b975c36c0d7fc65c8d32313a52d6f1b"
subdir: hunk-consent-guard
version: "1.0.0"
description: >-
  Brings Patch Review Desk and Cart Consent contracts into Hermes: stage multi-hunk file
  proposals, approve or reject individual hunks via `/hunk-desk` or `hermes hunk-desk`,
  automatically revoke approvals if the file's SHA-256 baseline drifts on disk, and record
  durable before/after rollback receipts in SQLite via `tool_execution` middleware.
  Disclosure — reads target workspace files during `write_file`/`patch` execution and
  explicit hunk proposal/apply/rollback commands; stores file snapshots (up to
  `max_snapshot_kb`, default 256 KB) and SHA-256 receipts in
  `plugin-data/hunk-consent-guard/data.db`; never modifies Hermes's built-in approval
  prompts or executes shell commands; no network calls.
maintainer: misakamikotoghr-5205
tier: community
category: tools
requires_hermes: ">=0.21.5"
docs_url: https://github.com/misakamikotoghr-5205/hermes-hackathon-plugins/blob/main/hunk-consent-guard/README.md
platforms: []
capabilities:
  provides_tools:
    - hunk_propose
    - hunk_review_status
    - hunk_apply_approved
    - hunk_rollback_receipt
  provides_hooks:
    - pre_tool_call
    - post_tool_call
  provides_middleware:
    - tool_execution
  requires_env: []
