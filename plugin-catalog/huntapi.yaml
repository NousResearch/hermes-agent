name: huntapi
title: HuntAPI
repo: https://github.com/huntapi/hermes-plugin-huntapi
sha: 30132cc8c94a0e20d29db4e6d1ffa3be5538f3f3
version: "1.1.0"
description: "Video and audio for Hermes through the HuntAPI media API: read the metadata of public videos from YouTube, TikTok, Instagram, Vimeo, X, Reddit and more, and download them as video or audio files. Disclosure — sends the tool arguments to api.huntapi.com with your HUNTAPI_API_KEY, and calls use HuntAPI credits (1 per metadata read or download; job status and usage are free). Downloads run on HuntAPI's servers and the files are served from HuntAPI's storage by link. Reads the key only through Hermes's secret scope. Registers 5 tools, no hooks or middleware, writes no files, starts no processes, has no telemetry or self-updater, and uses only the Python standard library."
maintainer: huntapi
tier: community
category: tools
requires_hermes: ">=0.21.6"
docs_url: https://github.com/huntapi/hermes-plugin-huntapi#readme
readme: true
platforms: []
capabilities:
  provides_tools:
    - huntapi_media_metadata
    - huntapi_video_download
    - huntapi_audio_download
    - huntapi_job_status
    - huntapi_usage
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - HUNTAPI_API_KEY
