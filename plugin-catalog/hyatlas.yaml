title: HyAtlas Memory
description: "HyAtlas v4 — self-hosted 7-layer memory provider backed by a pure-Go single-binary server you run yourself (chromem-go vectors, in-process BGE-small embeddings, bitemporal knowledge graph with source citations). Embeddings, the vector index and stored memories stay local. Ships agent tools (hyatlas_status/search/recent/add), a `hermes hyatlas` CLI, a Desktop pane with a starmap graph view, and a web dashboard. Disclosure — REQUIRES the separate hyatlas-go server binary, installed by the user from the repo's installer or GitHub release assets; the plugin never downloads or bundles it. NO LLM ENDPOINT IS ASSUMED, so extraction is opt-in: HYATLAS_LLM_BASE, HYATLAS_LLM_MODEL and HYATLAS_LLM_KEY are all unset by default, and without all three the server makes no LLM call — it stores the raw trace plus local embeddings and reports extraction_status \"unconfigured\". The installer, `hermes memory setup` and the Desktop settings form ask for these three and offer a free Nous Portal endpoint as a starting value you may accept or overwrite; accepting it is an explicit choice, not a default. CONVERSATION TEXT LEAVES THE MACHINE ONLY IF YOU CONFIGURE AN ENDPOINT: once configured, after each turn the plugin posts that turn (the current turn only, never the whole history) to the server, which sends it to your extraction LLM to derive facts, summaries and intentions. Set HYATLAS_MODE=lite for no LLM call at all regardless of configuration, or point the endpoint at a local OpenAI-compatible server to keep text on-machine. The mode sets what the system can reason about — lite fills L2 only, pro reasons within the turn just written and fills L1–L4 and L7, ultra adds a periodic pass over existing memories that merges contradictions, builds corroborated relations and generalises schemas, and is the only mode that fills L5 and L6. Blocking versus background extraction is a separate knob, HYATLAS_SYNC_EXTRACT. All other plugin traffic goes to the user-configured server (default 127.0.0.1:19528, loopback only). The plugin sets no HYATLAS_LLM_* variable, forwards no credential and invents no endpoint; the spawned server gets an explicitly allowlisted environment (OS essentials plus HYATLAS_* only) rather than a copy of the agent's, so provider tokens do not reach it. Optional subprocess spawn only when the auto_start setting is enabled (default off). No telemetry and no usage reporting; stored memories remain in the server's own data directory on the user's machine."
