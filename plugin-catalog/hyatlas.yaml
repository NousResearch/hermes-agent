title: HyAtlas Memory
description: "HyAtlas v4 — local-first 7-layer memory provider backed by a pure-Go single-binary server (chromem-go vectors, in-process BGE-small embeddings, async LLM fact extraction, bitemporal knowledge graph with source citations). Ships agent tools (hyatlas_status/search/recent/add), a `hermes hyatlas` CLI, a Desktop pane with a starmap graph view, and a web dashboard. Disclosure — requires the separate hyatlas-go server binary, installed by the user from the repo's installer or GitHub release assets; the plugin never downloads or bundles it. All plugin traffic goes to the user-configured server (default 127.0.0.1:19528); the server itself calls an LLM endpoint the user configures server-side for extraction — no LLM credentials live in or flow through the plugin. Optional subprocess spawn only when the auto_start setting is enabled (default off). No telemetry; all memory data stays on the user's machine."
