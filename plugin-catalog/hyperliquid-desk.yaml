platforms: [linux, macos]
title: Hyperliquid Desk
known_issues:
  - Node panels use the plugin author's hosted relay by default (node_feed "hosted"), a third-party network call to relay.perpdepth.com; when it can't serve, the node panels say why and public mode works as before. Set node_feed to "off" to turn node data off, or to your own engine socket or relay.
  - When the hosted relay is down, full or switched off, the node panels say which and public mode keeps working; a replay is never used in its place.
