description: "Run growth experiments with Hypotize, the agent-native Growth OS, through its hosted MCP server (https://api.hypotize.ai/mcp, OAuth sign-in, no keys in config): read what the team already tested, write hypothesis-first ideas, score them with ICE, PIE, RICE or a custom framework, move experiments through an enforced lifecycle and record measured outcomes and learnings. Bundles three skills: the experiment method, a read-only weekly pipeline review and a backlog import from a spreadsheet or Notion export. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: every tool call goes to Hypotize's hosted server (api.hypotize.ai) and acts on the user's Hypotize account with their role in each project; the tool set is served by that server at runtime and is not covered by the pinned sha. Sign-in runs the pinned mcp-remote@0.1.49 through npx (Node.js 20.18.1+ and npm required), which opens a browser and a local callback port on first use and stores OAuth tokens under ~/.mcp-auth. The package marks the server untrusted, so Hermes asks before every tool the server does not mark read-only and refuses them in unattended runs."
