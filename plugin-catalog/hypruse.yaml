known_issues:
  - "Needs Hyprland and the hypruse command 0.13 or newer on PATH (PyPI, AUR or Nix), which this plugin does not install. Check it with hermes computer-use doctor."
  - "set_value is not supported: hypruse has no verb that sets a value. Click the field and type, or click the control."
  - "Modifier keys held during a click, drag or scroll, and triple clicks, are not supported."
  - "The pointer never works in the background: coordinate clicks, drags and scrolls need delivery_mode='foreground' on the window you are in, and right, middle and double clicks by element work only in the foreground."
  - "som captures (marks) are sent at full size; max_image_dimension applies to vision captures only."
  - "computer_use has no launch action: run hypruse launch -- APP with the terminal tool to open an app on the agent's workspaces, then capture(app='APP')."
  - "Does not load under plugins.isolation: host, because Hermes loads computer-use providers only in its own process."
