description: "Hyprland computer use through the hypruse CLI: controls from the accessibility tree clicked by number, typing and keys sent to one window, and a background mode where the agent works in apps on its own workspaces (99 down to 90) while your cursor, focus and workspace stay put. Select it with `hermes config set computer_use.backend hypruse`. Disclosure: the provider is pure Python with no third-party dependencies. Each action runs the separately installed `hypruse` command (0.13 or newer), or the one named in `computer_use.hypruse.command` or HERMES_HYPRUSE_CMD, as a subprocess with no shell, and that child gets only the desktop session variables and HYPRUSE_* settings, never Hermes' API keys; `hermes computer-use doctor` also runs `hypruse doctor`. hypruse clicks, types and presses keys in your live session, and a foreground pointer action moves your cursor. With the optional `computer_use.hypruse.delivery: auto`, an action on the window you are in runs on your screen. Screenshots of the targeted window, or of the focused monitor for `app='screen'`, go to your model like any computer-use backend's, and each capture file is deleted once read. It reads hypruse's state file `$XDG_RUNTIME_DIR/hypruse/cli-state.json` and never writes it. No network calls, telemetry, stored data or credentials."
maintainer: IlyasKhallouki
tier: community
