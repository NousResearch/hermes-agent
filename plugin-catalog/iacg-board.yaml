title: IaCGenius Board — mission evidence dashboard tab
description: >-
  Web dashboard tab showing the IaC Genius mission board: findings, validation evidence with tool +
  version, repair attempts spent/allowed, disposition and next owner. It renders the snapshot the
  iacg-desk service writes and never invents live state; an empty state is shown until a snapshot
  exists. Disclosure — read-only; reads the desk's board.json/board.html over the local Unix socket
  or shared data dir; registers no agent tools, hooks or middleware; makes no network calls, runs no
  subprocess and stores nothing; no telemetry, no self-update.
