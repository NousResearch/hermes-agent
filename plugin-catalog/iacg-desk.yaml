title: IaC Genius Desk — validated Terraform/OpenTofu missions
description: >-
  Deterministic Terraform/OpenTofu mission desk on Hermes: a decision ledger asks the costly or
  irreversible questions before spend, freezes the agreed scope as one build-sheet hash, grounds
  every argument on the pinned binary provider schema, runs terraform validate / tflint / checkov /
  secret scan as evidence, repairs within a bounded budget, and delivers a reviewable PR whose body
  is the ledger. The model proposes; the toolchain decides. Disclosure — talks to a local Unix
  socket served by the iacg_desk desk service (or runs python -m iacg_desk as a subprocess); reads
  its own local.json + IACG_* config paths (not secrets); the desk's terraform init fetches providers
  read-only from the public registry into a shared cache; hard-refuses terraform/tofu apply and cloud
  write commands at pre_tool_call; holds no cloud credentials and never changes cloud state; GitHub
  delivery uses a desk-held token only after the gates and a named human approval, then reads the
  commit back; no telemetry, no self-update.
maintainer: RajaRenga
