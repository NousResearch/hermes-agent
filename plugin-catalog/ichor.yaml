name: ichor
title: Ichor
repo: https://github.com/mystiquemide/ichor
sha: e204b791a23a2495ef556a26b5627b5511290e3c
description: "Catches the moments you correct Hermes (a correction, /retry or /undo), pairs the rejected answer with the accepted one, scrubs secrets and personal data locally, and asks you once to keep, share or discard it with a one-letter reply. Kept pairs export as TRL preference JSONL and an Atropos environment, ready to fine-tune or run RL on your own model. Disclosure: registers post_llm_call, on_session_finalize and post_gateway_admission hooks and an /ichor command; post_gateway_admission consumes only the exact replies k, s, d, keep, share or discard in a direct chat within 120 seconds of an open card; posts and edits its own card messages; stores pairs in its plugin data directory (SQLite); requests the optional llm.side_question capability for a short mistake label, one call per captured pair, which spends the main model's tokens; makes network calls only on /ichor share, to huggingface.co with the optional HF_TOKEN, to a private dataset repo unless the user runs /ichor set public; no Python dependencies, no shell commands, no background processes, no telemetry."
maintainer: mystiquemide
tier: community
category: automation
requires_hermes: ">=0.23.0"
version: "0.1.2"
screenshots:
  - https://github.com/mystiquemide/ichor/releases/download/v0.1.2/ichor-card.png
  - https://github.com/mystiquemide/ichor/releases/download/v0.1.2/ichor-top-mistakes.png
capabilities:
  provides_tools: []
  provides_hooks:
    - post_llm_call
    - on_session_finalize
    - post_gateway_admission
  provides_middleware: []
  requires_env: []
