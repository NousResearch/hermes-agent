title: Igni
description: "Two complete card games inside Hermes Agent: a Gwent-style row war and an Arena mana duel, with 21 pixel-art cards, a hidden-hand rule-based opponent, a TUI scoreboard and a playable desktop page. Disclosure: no network calls, no telemetry, no credentials; reads and writes one active table plus a hand-free scoreboard snapshot under the profile's plugin data and $HERMES_HOME/igni/board.json; installs its optional TUI widget into $HERMES_HOME/tui-widgets; the desktop half is enabled by default and can be disabled in Capabilities."
maintainer: LangerSword
tier: community
category: tools
