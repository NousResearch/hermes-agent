description: "iLang, the native language of AI, through iLang Inc.'s official MCP server (Streamable HTTP at https://mcp.ilang.ai/mcp, no sign-in, no keys in config): the official runtime verified against the canon's sha256, a lite runtime, sections of the full specification, the canon grammar validator, dictionary and FAQ lookup, SOUL 2.0 and Source Book 2.9, and the engineering-book check. Bundles one workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to mcp.ilang.ai, which fetches the canon files it serves from runtime.ilang.app and does not store, log or reuse submitted content. The package holds no credentials. All nine tools are annotated read-only; the package still marks the server untrusted. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
