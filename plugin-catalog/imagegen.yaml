sha: f00dbf81e3b7c1a821086a508048a93eb5dc12b1
description: >-
  Image studio for Hermes Desktop: generate, compose from references, edit and
  upscale across FAL, Nous Portal, Magnific, Vertex AI and the Hermes image providers, with
  a guided prompt builder, campaign grids, a gallery and a local monthly budget.
  It can also serve the agent's image_generate calls when picked under Tools →
  Image Generation.
  Disclosure — Each generation is billed by the provider you pick (FAL, Magnific,
  Nous Portal, Vertex AI or a Hermes image provider). On its screen each one starts from a
  button you click; the agent spends only if you pick ImageGen under Tools →
  Image Generation or add the optional MCP server;
  prompts and reference images go to that provider (queue.fal.run, fal.run,
  api.magnific.com, aiplatform.googleapis.com, or a Hermes image provider, including
  Nous Portal and a linked ChatGPT subscription through Hermes's own providers). Prompt writing and image reading use
  your Hermes model through ctx.llm. Images, history and the spending ledger are
  stored in plugin-data/imagegen. Optional FAL_KEY, MAGNIFIC_API_KEY,
  VERTEX_API_KEY and VERTEX_PROJECT are plugin secrets. An optional command line runs single or batch
  generations only when someone starts it, as the `hermes imagegen` subcommand.
  It imports some non-public Hermes modules to read the image provider
  registry and the FAL catalog.
maintainer: phdigital01
