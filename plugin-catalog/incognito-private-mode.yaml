name: incognito-private-mode
repo: https://github.com/Tranquil-Flow/hermes-incognito-private-mode
sha: e59a3ce03cb68f804da667a087a74925de1d1be8
version: 0.3.0
description: >-
  Private mode, honestly: provider privacy flags, memory blocks stripped from
  main-chat requests (provenance-checked against the last 6 observed file
  versions, fail-closed outside that window), tool vetoes on unclassified
  tools, honest coverage labels, and consent-gated fenced history cleanup on
  close (exact-id + transcript + closed-state fences, archived chats excluded).
  Content-free outbound audit log (endpoints + verdicts only, local 0600). No
  telemetry; the plugin itself makes no network calls. Disclosed limits:
  auxiliary-call fan-out not stripped, MoA advisors receive the full
  unstripped request before private mode blocks the aggregation,
  provider-side retention guarantees impossible.
