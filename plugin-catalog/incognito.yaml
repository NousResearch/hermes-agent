name: incognito
repo: https://github.com/nicolasbuelvas/hermes-incognito
sha: 81bbc43046f885f5e19384712a96d23a4821f8b8
title: Hermes Incognito
description: "Zero-trace ephemeral and incognito sessions across Hermes CLI, TUI, Gateway, and Desktop: hides active chats from sidebars and cross-session searches, blocks persistent memory and skill mutations, strips profile and personal memory in RAM in strict clean-room mode, optionally masks outbound PII via a reversible RAM-only vault, zero-fills transcript and hook spill files before unlinking on close or TTL expiry, and emits content-free SHA-256 verification receipts. Disclosure — deletes the database rows, transcript files and hook-output files of chats marked incognito when you burn them, when they close, or when they reach their idle TTL (file contents are zero-filled first); the model cannot trigger a burn; while any incognito chat is active it blocks terminal, file-read, search and code tools from touching Hermes session storage in every session on the host; adds no-retention flags (`store: false`, OpenRouter `data_collection: deny`) to outbound model requests from incognito chats; stores content-free leases and receipt hashes under $HERMES_HOME/plugin-data/incognito/; makes no third-party network calls."
maintainer: nicolasbuelvas
tier: community
category: tools
version: "1.0.0"
requires_hermes: ">=0.22.0"
docs_url: https://github.com/nicolasbuelvas/hermes-incognito
platforms: []
capabilities:
  provides_tools:
    - incognito_control
    - incognito_verify
  provides_hooks:
    - on_session_start
    - pre_llm_call
    - pre_tool_call
    - transform_tool_result
    - post_compaction
    - on_session_end
    - on_session_finalize
    - on_session_reset
  provides_middleware:
    - llm_request
    - llm_execution
  requires_env: []
