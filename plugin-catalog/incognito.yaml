title: Hermes Incognito
description: "Ephemeral clean-room chats and fail-closed RAM PII masking across CLI, TUI, Gateway, and Desktop: hides active sessions, blocks memory and skill writes, strips profile and personal memory in RAM in strict mode, masks outbound personal details before sending, zero-fills transcript and hook spill files before unlinking on close or sweep, and supports confirmed Save with reversible Undo. Disclosure — deletes the database rows, transcript files and hook-output files of chats marked incognito when you burn them, when they close, or on a sweep after their idle TTL expires (file contents are zero-filled first); the model cannot trigger a burn; while any incognito chat is active it blocks terminal, file-read, search and code tools from touching Hermes session storage in every session on the host; adds no-retention flags (`store: false`, OpenRouter `data_collection: deny`) to outbound model requests from incognito chats; stores content-free leases, save-undo metadata and receipt hashes under $HERMES_HOME/plugin-data/incognito/; makes no third-party network calls."
maintainer: nicolasbuelvas
tier: community
category: tools
version: "1.0.1"
