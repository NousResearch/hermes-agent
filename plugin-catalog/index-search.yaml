name: index-search
repo: https://github.com/TakeshiTGAL/hermes-plugin-index-search
sha: a6f870f5e63ca2f9e13d6703871f55e063bda26d
description: "Search one index you run and watch one saved query, with index_search, index_health and index_watch. Disclosure — Sends MEILI_API_KEY as a Bearer token to your MEILI_HOST. Over plain http that key travels unencrypted, and a master or admin key is sent as given, so use a search-only key. The tools are on for every surface, including gateways: anyone you allow on your Hermes gateway can search with your key and approve a watch. Turn a surface off with hermes tools. index_watch schedule creates one cron job that runs a model turn every 15 minutes (two or more model requests when it calls the tool) with no daily cap, and it watches only the first 20 hits. The job stays after uninstall until you run hermes cron remove, with -p and the profile name when the profile is not default. Scheduling and unscheduling return one pre_tool_call approve line. Hermes shows it. yolo and approvals off skip the prompt. cron and unattended sessions default to deny. plugins.isolation: host still refuses the change, and the watch only posts a notice that it cannot run, on every run. Answering \"always\" covers only that same watch plan. A different plan asks again. The watch still uses Hermes cron and the write guard, so an update can stop it."
maintainer: TakeshiTGAL
tier: community
category: tools
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-index-search#readme
version: "0.1.3"
requires_hermes: ">=0.21.6"
image: https://raw.githubusercontent.com/TakeshiTGAL/hermes-plugin-index-search/a6f870f5e63ca2f9e13d6703871f55e063bda26d/assets/catalog-banner.png
platforms: []
capabilities:
  provides_tools:
  - index_search
  - index_health
  - index_watch
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env:
  - MEILI_HOST
  - MEILI_API_KEY
