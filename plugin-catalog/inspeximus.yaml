description: "Memory provider with keyed corrections you can undo. A correction retires the old value by key, so it stops being recalled, and inspeximus_revert puts the previous value back from the key alone, without anyone retyping what the record used to say. Recall before each turn returns retrieval minus what a later correction retired, so a value corrected three sessions ago cannot come back as context. Adds inspeximus_remember, inspeximus_correct, inspeximus_revert, inspeximus_forget and inspeximus_forget_me. Disclosure — installs the inspeximus package from PyPI (inspeximus>=3.23.1,<4, including its `inspeximus` command-line tools) into the Hermes environment; the provider makes no network calls and carries no telemetry: memories live in a local JSON file under the profile's Hermes home (or a path you set), recalled memories are added to each turn's context and to the compression summary prompt, and writes made with the built-in memory tool are mirrored into the store."
