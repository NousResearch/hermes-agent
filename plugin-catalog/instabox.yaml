title: instabox
description: "Terminal backend that runs Hermes terminal, execute_code and file tools in an instabox cloud sandbox, paused and resumed by name per task or created per session and deleted when it ends. Disclosure — requires an instabox API key (INSTABOX_API_KEY); every command and the files the file tools touch are sent to instabox; your Hermes skills, cache and skill-registered credential files are uploaded to ~/.hermes in the box, and skill and cache files changed in the box are copied back to your machine; boxes are created, paused, resumed and deleted in the key's workspace and billed to it; persistent mode keeps one paused box per task (each gateway session is its own task), and paused boxes keep their disk until deleted; commands in the box can become root without a password, and dangerous-command approval is skipped inside the box."
maintainer: InsForge
tier: community
category: tools
requires_hermes: ">=0.22.3"
