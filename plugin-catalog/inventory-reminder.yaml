name: inventory-reminder
repo: https://github.com/ether-btc/inventory-reminder
sha: 11fa2d37c4857cbd8c1d2d40912274e90fcb21c1
subdir: ""
description: >-
  Live, evidence-backed inventory of the host an agent is running on: repos (cloned vs
  online-only), skills, MCP servers, CLIs, chat-model providers, local plugins, cron jobs,
  profiles, local models and services, regenerated from ground truth by read-only scanners.
  Registers two tools — inventory_where(term) answers "do I already have X?" across every
  section with a ready detail line, and inventory_summary() returns a one-line digest for
  session bootstrap. Both read a cached digest file ($INVENTORY_JSON, else
  ~/.hermes/inventory.json); no live rescan per turn, no network, no writes. Credential
  handling is names-only: API-key variables are reported by NAME with a SET/UNSET flag, and
  their values are never read, stored or logged. Disclosure — the digest describes the host
  (repo names, skill names, CLI paths, model names, provider and profile names, cron job
  names, service names) and that text is returned to the model.
maintainer: ether-btc
tier: community
category: tools
requires_hermes: ">=0.19"
docs_url: https://github.com/ether-btc/inventory-reminder#readme
version: "1.1.0"
platforms: []
capabilities:
  provides_tools:
    - inventory_where
    - inventory_summary
  provides_hooks: []
  provides_middleware: []
  requires_env: []
