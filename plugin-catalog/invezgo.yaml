name: invezgo
title: Invezgo
repo: https://github.com/Invezgo/invezgo-hermes
sha: a6d8ef4c934fe3e2a2d4bae9ad67576707650d6d
description: >-
  Indonesia Stock Exchange (IDX/BEI) market data from the Invezgo API: company profiles, price and
  indicator charts, intraday and order book, running trade, broker summary and inventory, broker and
  sector stalker, sector rotation, shareholder composition (KSEI, >1%, >5%, insiders), financial
  statements, key stats, corporate calendar, news, disclosures and a formula screener, plus read access
  to the user's own Invezgo portfolio, watchlists, journal and trades. Tools are generated from the
  bundled OpenAPI spec (spec.json) at load time. Disclosure: every tool call is an HTTPS request to
  api.invezgo.com with the user's Invezgo API key and counts against their plan quota; results,
  including personal portfolio data, enter the session context and reach the user's model provider.
  Read-only by default; 18 write tools (watchlists, journals, trades, alerts, saved screeners) are
  registered only when INVEZGO_ALLOW_WRITE=1. No background processes, shell commands, stored files
  or telemetry.
maintainer: Invezgo
tier: community
category: tools
requires_hermes: ">=0.23.1"
docs_url: https://invezgo.com
