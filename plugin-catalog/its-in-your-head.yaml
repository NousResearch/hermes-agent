description: "It's in Your Head — a calm desktop instrument that shows how you work with Hermes: live tool activity (PULSE), a six-dimension working-style portrait, and drift trends, with optional opt-in directional adaptation (one bounded instruction per turn). Zero network by default; raw prompts and reasoning are never stored (derived features only). Optional local ONNX Tier-1 downloads a pinned model from Hugging Face only on explicit `/mirror engine enable`. Disclosure — no network by default; the optional local ONNX engine, enabled only by `/mirror engine enable`, downloads an Apache-2.0 embedding model (onnx-community/paraphrase-multilingual-MiniLM-L12-v2-ONNX) from Hugging Face, pinned by revision and per-file sha256, into the profile's plugin-data directory, and runs it in a Hermes-managed isolated environment (onnxruntime, CPU) as a local worker subprocess with a minimal environment, plus a small watchdog process that stops that worker if Hermes exits uncleanly. When the current profile has no portrait yet, the portrait view reads (read-only) this plugin's own data from your other Hermes profiles on the machine and shows the most recent one, labelled with its profile name. No credentials are stored, no telemetry is sent, and raw prompts and reasoning are never stored (derived features only)."
