description: "It's in Your Head — a calm desktop instrument that shows how you work with Hermes: live tool activity (PULSE), a six-dimension working-style portrait, and drift trends, with optional opt-in directional adaptation (one bounded instruction per turn). Zero network by default; raw prompts and reasoning are never stored (derived features only). Optional local ONNX Tier-1 downloads a pinned model from Hugging Face only on explicit `/mirror engine enable`."
