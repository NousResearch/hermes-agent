description: "Create, edit, design and export Apple Numbers, Keynote and Pages files: designed Keynote decks from data and the user's brand kit, spreadsheet cells, formulas and formatting, Pages text and tables, exports to PDF, Excel, Word and PowerPoint. Every write is backed up, made on a copy, re-read and checked, then swapped in; any change can be undone in one call. Arabic and right-to-left text round-trip exactly. Agent Plugins v1 package (plugin.json + mcp.json + skills/): a local stdio MCP server (65 tools) and a workflow skill. macOS. Disclosure: first start downloads iwork-studio==2.6.1 and its Python dependencies from PyPI with uvx (about 60 MB; built from the v2.6.1 tag by the repo's release workflow through PyPI trusted publishing; the server code is that release, not the pinned tree); Pages, exports, render checks and Keynote slide operations drive Numbers, Keynote and Pages through osascript, and macOS asks once for Automation access; it reads and writes only the iWork files it is pointed at, inside IWORK_STUDIO_ROOTS when set, and keeps backups in ~/.iwork-studio/backups (last 10 per file) and saved design kits in ~/.iwork-studio/kits; no network calls after the download, no telemetry, no self-updates."
