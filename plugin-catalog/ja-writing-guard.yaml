name: ja-writing-guard
repo: https://github.com/TakeshiTGAL/hermes-plugin-ja-writing-guard
sha: 02d5e3ac52e9851b086e271e1788aac2a154a592
description: 'ja_writing_check returns line, column and fix hint. Default is report; enforce rewrites a flagged answer only when numbers, names, URLs, code, and negation survive and the score drops under threshold. Disclosure — no network calls of its own; report only logs; enforce sends the answer and excerpts to your model via ctx.llm (one call, a second only if the rewrite fails the checks or stays over the threshold; up to 25 s) and replaces delivered and stored answer when they pass, which does not prove meaning is unchanged; post_tool_call notes MEDIA: turns so attachments stay; no user list; on every platform for a person there or the agent; hermes tools disable ja_writing --platform turns one off.'
maintainer: TakeshiTGAL
tier: community
category: tools
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-ja-writing-guard#readme
version: 0.1.1
requires_hermes: ">=0.21.4"
platforms: []
capabilities:
  provides_tools:
  - ja_writing_check
  provides_hooks:
  - transform_llm_output
  - post_tool_call
  provides_middleware: []
  requires_env: []
