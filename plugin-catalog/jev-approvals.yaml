description: "TypeSafe's Jev decision model as the smart-approval reviewer only: it cannot generate text and refuses any other prompt. Dual route - TypeSafe direct (default, needs a TYPESAFE_API_KEY) or OpenRouter (needs an OPENROUTER_API_KEY in the credential pool, not key_env - see README). Live upstream model listing, decision log, retries. Disclosure — every flagged command (redacted best-effort) and your smart-approval policy text leave the machine to a third-party AI (api.typesafe.ai, or openrouter.ai on the OpenRouter route) to decide APPROVE/DENY/ESCALATE; upstream errors fail closed to ESCALATE."
