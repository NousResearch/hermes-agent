description: "TypeSafe's Jev decision model as Hermes' smart-approval reviewer only: it cannot generate text and refuses every other task. Supports TypeSafe direct, OpenRouter, and configurable Jev-compatible HTTPS endpoints with optional endpoint-specific authentication; custom and aggregator routes use a plugin-owned dispatch placeholder that is never sent upstream, while TypeSafe direct still requires TYPESAFE_API_KEY. Validates typed answers and endpoint/redirect boundaries, redacts command credentials, caps oversized commands (64000 characters by default, halving to 16000 on a context-limit response) and never auto-approves a truncated command, and records bounded structured audit logs. Disclosure — each command routed to smart approval (redacted best-effort) and the operator's smart-policy text leave the machine for the configured third-party endpoint; provider or validation failures fail closed to ESCALATE."
