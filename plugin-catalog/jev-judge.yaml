name: jev-judge
repo: https://github.com/DoGMaTiiC/hermes-jev
sha: dfa109f268358b36068c7e436b819858f8913d7a
subdir: plugins/jev-judge
description: TypeSafe Jev as a judgment layer — a pre-tool gate (shadow by default, enforce
  escalates) on terminal, write_file and patch asking destructive / exfiltration / impact, plus
  a jev_ask tool for typed judgments. Thresholds in code, one JSONL line per decision, fail-open
  on every error path. Stdlib only, no Node; works with TYPESAFE_API_KEY or AI_GATEWAY_API_KEY.
  Disclosure — each judged call sends the tool name and its redacted arguments (≤600 chars each,
  ≤12 args) to TypeSafe or your configured gateway, using your key; shadow mode only logs.
maintainer: DoGMaTiiC
tier: community
category: tools
docs_url: https://github.com/DoGMaTiiC/hermes-jev/blob/main/plugins/jev-judge/README.md
