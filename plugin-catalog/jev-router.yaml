name: jev-router
repo: https://github.com/AlphaPerseii3000/jev-router
sha: 6c7fd6153bcd931de2a01a07dd83259a0f65aa76
description: Per-turn model and reasoning-effort routing decided by TypeSafe Jev, which rewrites the outgoing Ollama:Cloud provider request itself via the llm_request middleware. Ollama:Cloud only — no other provider is routed, and every failure path leaves the request byte-identical to a plugin-disabled run.
maintainer: AlphaPerseii3000
tier: community
category: models
requires_hermes: ">=0.21.4"
docs_url: https://github.com/AlphaPerseii3000/jev-router
version: "0.1.1"
platforms: []
capabilities:
  provides_tools:
    - jev_router_status
    - jev_router_route
  provides_hooks:
    - on_session_end
    - post_llm_call
  provides_middleware:
    - llm_request
  requires_env:
    - OPENROUTER_API_KEY
