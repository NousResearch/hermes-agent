description: >-
  Provider usage in a Desktop status-bar chip, popover and full page: subscription
  windows, API balances, reset times and profile-scoped account state. Includes
  data-only JSON connectors with explicit destination approval, setup cards for
  Claude, Gemini and Z.ai, a running-agents footer with honest unknowns, and an
  active-account Codex banked-reset preview/confirmation. Stock Hermes 0.23.1
  needs no core patch; xAI subscription credits and exact worker-account usage
  need optional host metadata and otherwise remain unavailable. Usage reads use
  Hermes account helpers or scoped API-key access and provider HTTPS endpoints;
  subscription tokens stay with Hermes. Custom definitions are HTTPS GET only,
  approved-host restricted, with no redirects or executable code. Confirming a
  Codex reset spends one banked reset; refresh and preview do not. No purchase,
  automatic redemption, telemetry or self-update. Screenshots and demo use real
  plugin components with clearly labeled synthetic data, not live accounts.
