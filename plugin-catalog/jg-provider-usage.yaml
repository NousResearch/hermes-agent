description: "Provider usage in a Desktop status-bar chip, popover and full page: subscription windows, API balances, reset times and profile-scoped account state. Signed-in OAuth accounts are listed even when the chat is on another provider. Includes data-only JSON connectors with explicit destination approval, setup cards for Claude, Gemini and Z.ai, a running-agents footer with honest unknowns, and an active-account Codex banked-reset preview/confirmation. Readers: Codex, OpenCode Go/Zen, DeepSeek, OpenRouter, Ollama Cloud, Nous, Claude subscription, Grok, Moonshot, Novita, DeepInfra, Fireworks and Arcee (the last four are fixture-tested against documented response shapes, not exercised against a funded account). Stock Hermes 0.23.1 needs no core patch; Grok reads through the host when it brokers xai-oauth, or through an opt-in compatibility setting that resolves the account through Hermes' own locked resolver rather than a token file. A Settings panel renders from an allowlisted per-profile JSON spec and refetches usage on save. Usage reads use Hermes account helpers or scoped API-key access and provider HTTPS endpoints; subscription tokens stay with Hermes. Custom definitions are HTTPS GET only, approved-host restricted, with no redirects or executable code. Confirming a Codex reset spends one banked reset; refresh and preview do not. No purchase, automatic redemption, telemetry or self-update. Screenshots and demo use real plugin components with clearly labeled synthetic data, not live accounts. Disclosure — reads your own usage/credit data with vendor client-identity headers (`User-Agent: codex-cli` to chatgpt.com for Codex reset credits; `x-xai-token-auth: xai-grok-cli` to cli-chat-proxy.grok.com for Grok billing), and with the compatibility setting enabled the xAI billing request carries the account's OAuth access token attached by Hermes' resolver; the usage page can read every local Hermes profile's provider usage through Hermes' profile scope; confirming a Codex reset in the page spends one banked reset; it reads state.db read-only for token totals and fetches DeepSeek's public pricing page every 12 hours."
