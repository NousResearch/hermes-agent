name: jp-corporate
repo: https://github.com/TakeshiTGAL/hermes-plugin-jp-corporate
sha: aa8b1cca93565dff2f082fba8c8a3f3754c5e522
description: 'Look up a Japanese company by name or 13-digit corporate number and read its gBizINFO record, from registration to subsidies, contracts, and financials. Disclosure — sends what you look up only to api.info.gbiz.go.jp with your GBIZINFO_API_TOKEN, read each call; no proxy, no disk writes; tools are on for every surface, so anyone you allow on a gateway uses your token; the skill adds one line to every skills index; on company talk (a 13-digit number, 株式会社 and other legal forms, known names) a pre_llm_call paragraph, even where tools are off, says to find jp_corp_search via tool_search not tool_describe, copy next_step on token_missing, and not state data or write 取得しました/確認できます the tool did not return.'
maintainer: TakeshiTGAL
tier: community
category: tools
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-jp-corporate#readme
version: 0.1.13
image: https://raw.githubusercontent.com/TakeshiTGAL/hermes-plugin-jp-corporate/aa8b1cca93565dff2f082fba8c8a3f3754c5e522/assets/catalog-banner.png
requires_hermes: ">=0.21.4"
platforms: []
capabilities:
  provides_tools:
  - jp_corp_search
  - jp_corp_profile
  provides_hooks:
  - pre_llm_call
  requires_env:
  - GBIZINFO_API_TOKEN
