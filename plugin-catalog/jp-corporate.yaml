name: jp-corporate
repo: https://github.com/TakeshiTGAL/hermes-plugin-jp-corporate
sha: c6f7c9a69a7dbb2f751ae5d7ecd7e79029fc7e7e
description: "Japanese corporate lookup (法人照会): find or verify a company by name or corporate number and read its gBizINFO record (basic info, subsidies, government contracts, awards, certifications, financials, patents, workplace data). Disclosure: sends the names, corporate numbers and prefectures you look up to api.info.gbiz.go.jp (METI) with your own free token; no other host, no files written."
maintainer: TakeshiTGAL
tier: community
category: tools
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-jp-corporate#readme
version: "0.1.0"
requires_hermes: ">=0.21.4"
platforms: []
capabilities:
  provides_tools:
  - jp_corp_search
  - jp_corp_profile
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - GBIZINFO_API_TOKEN
