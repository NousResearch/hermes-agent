name: jp-edinet
repo: https://github.com/TakeshiTGAL/hermes-plugin-edinet
sha: 0467f4ad66ec8fe66e1fbabb19a3afc17d5ace82
description: "Japanese filings on the EDINET API v2. It finds a Japanese company's annual securities report (yuho) and other financial reports filed on EDINET, and reads headline figures such as revenue and total assets from a filing. Disclosure — talks only to api.edinet-fsa.go.jp over HTTPS, and your EDINET_API_KEY rides in the URL as Subscription-Key. Each call reads EDINET_API_KEY for the active profile, and an HTTP proxy set in the environment is not used. The edinet toolset is on for every platform, including gateways, so anyone a gateway admits can call these tools with your key. With CHATWORK_ALLOWED_USERS unset, everyone in CHATWORK_ROOMS can call them. Turn the toolset off per platform with hermes tools. While the plugin is enabled, its skill adds one line to the skills index of every session, including surfaces where the tools are turned off, and its pre_llm_call paragraph is added on those surfaces too. There is no daily cap. The agent can call the three tools itself. A cron you add stays after uninstall until you remove it in Hermes. This plugin starts no child process and is not a sandbox. Search sends EDINET the filing date, and a download sends the document id and its type. Company name, securities code, EDINET code, and corporate number are filtered on your machine. found: false means that line is absent from that period in periods or in filing_company (CurrentYear or Prior1Year to Prior4Year), not proof the filing has no figure, and not 0. A past day's filing list can change. Lists, saved files, and a key fingerprint, not the key, stay at <HERMES_HOME>/plugin-data/jp-edinet per profile after uninstall. Delete that directory to remove them. The plugin relies on Hermes internals for the write check and the data folder. If an update moves those parts, the tools refuse and do not call EDINET. Test files are not loaded at startup. Since version 0.1.6 it returns those five consolidated periods in periods and the filing-company six lines in filing_company. A missing line is not copied from the other series. pre_llm_call adds one of three paragraphs only on a filing question (有報, 有価証券, 連結, 提出会社, the word EDINET, securities, or consolidated) or when edinet_search_filings, edinet_financials, or edinet_save_document was called in the previous turn, and adds nothing on other turns. A company name alone or an unrelated question does not add it. When the secret helper cannot be read, the paragraph says the helper could not be read and does not say the key is unset. When EDINET_API_KEY is unset, the paragraph says to call edinet_search_filings once with the company name only, not to invent a file date, and to copy the free-key next_step (WEEK0060, the unit, and the filing URL once a document id is known). When the key is set, the paragraph says to call edinet_financials once a doc_id is known, and otherwise edinet_search_filings with only the file dates the user wrote. Each paragraph says not to write successfully retrieved, verified, or obtained using. That ban is the same as 取得しました."
maintainer: TakeshiTGAL
