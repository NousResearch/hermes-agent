sha: 5233802cf0b5c29b595c0f1da20abbc823e09c0d
description: "Japanese laws for Hermes Agent, built on the e-Gov Law API: find a law by name, abbreviation or phrase, read one article as in force today or on a given date, and check amendment history and enforcement dates, with the source credit e-Gov's terms ask for. Disclosure: sends the law names, article numbers and search phrases you look up to laws.e-gov.go.jp; no API key, no other host, no files written."
maintainer: TakeshiTGAL
tier: community
category: tools
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-egov-law#readme
version: "0.1.0"
requires_hermes: ">=0.21.4"
platforms: []
capabilities:
  provides_tools:
  - egov_law_search
  - egov_law_article
  - egov_law_revisions
  provides_hooks: []
  provides_middleware: []
  requires_env: []
