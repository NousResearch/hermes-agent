name: jp-egov-law
repo: https://github.com/TakeshiTGAL/hermes-plugin-egov-law
sha: 8e9d79be21e8f60a96fa8724271095b82dd75608
description: "Unofficial plugin for Japanese law from the e-Gov law API: find a law by name, abbreviation or phrase, read one article as in force today or on a given date, and check amendment history and enforcement dates, with the source credit e-Gov's terms ask for. Not affiliated with the Digital Agency of Japan or e-Gov. Disclosure: sends the law names, article numbers and search phrases you look up to laws.e-gov.go.jp; no API key, no other host, no files written."
maintainer: TakeshiTGAL
tier: community
category: tools
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-egov-law#readme
version: "0.1.0"
requires_hermes: ">=0.21.4"
platforms: []
capabilities:
  provides_tools:
  - egov_law_search
  - egov_law_article
  - egov_law_revisions
  provides_hooks: []
  provides_middleware: []
  requires_env: []
