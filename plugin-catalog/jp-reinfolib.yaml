name: jp-reinfolib
repo: https://github.com/TakeshiTGAL/hermes-plugin-reinfolib
sha: 9191d0e5bd3539f3c55801c614c9b47cc7763494
description: Quarterly MLIT prices for one city, via reinfolib_quarter. Disclosure — sends your REINFOLIB_API_KEY as Ocp-Apim-Subscription-Key to www.reinfolib.mlit.go.jp (HTTPS, XIT001) or the host of REINFOLIB_BASE_URL. Plain http is refused except 127.0.0.1 and localhost, where the key is not encrypted. On for every surface, including gateways, so anyone you allow can call it with your key, with no approval prompt, including unattended cron, yolo, and approvals off. hermes tools does not stop /jp-reinfolib. Stop the slash command with allow_admin_from, user_allowed_commands, group_user_allowed_commands, or by disabling the plugin. After a GET returns, this process waits 1 second before the next, each GET stops after 30 seconds with no bytes, and there is no retry or daily cap. Blueprint jp-reinfolib:weekly-city-check is once a week (default Monday 09:00) and calls only this tool after you schedule it. This plugin does not create a cron job or write a file. A job you schedule stays until
  hermes cron remove and may include your MCP servers. HTTP 404 means no data for that request, not zero rows and not unchanged prices. A scheduled run is one model turn. A turn that calls the tool is at least two model requests. An empty slash allow list does not stop this tool. Registered only if register_automation_blueprint exists; else skip. A no-data week may be [SILENT] and not arrive. Data weeks are one short message. 「このサービスは、国土交通省の不動産情報ライブラリのAPI機能を使用していますが、提供情報の最新性、正確性、完全性等が保証されたものではありません」
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: '>=0.21.4'
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-reinfolib#readme
version: 0.1.0
platforms: []
capabilities:
  provides_tools:
  - reinfolib_quarter
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - REINFOLIB_API_KEY
