description: "JW3.ai non-custodial trading inside Hermes: 12 market/risk/Diary reads, Diary propose cards, and 4 human-approved execution tools — all thin wrappers over the local jw3 CLI, which owns the PAT and enforces server-side scope, kill-switch, fee, and idempotency gates. Bundles the jw3-ops skill and /jw3-status. Disclosure: every tool call shells out to the local `jw3` binary with a minimal env (PATH, HOME, XDG_CONFIG_HOME, TMPDIR, JW3_*); reads reach Supabase edge functions and exchange APIs; fund-moving tools dry-run (zero bytes sent) unless confirm=true, and every confirm=true call is escalated by a pre_tool_call hook to the Hermes approval gate with the exact command (per-ticket rule_key; unattended runs follow approvals.cron_mode / single_query_mode, default deny); the plugin holds no secrets and stores nothing. Requires an authenticated `jw3 auth login`."
