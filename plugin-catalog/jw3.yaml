description: "JW3.ai non-custodial trading inside Hermes: 12 market/risk/Diary reads, Diary propose cards, and 4 human-approved execution tools — all thin wrappers over the local jw3 CLI, which owns the PAT and enforces server-side scope, kill-switch, fee, and idempotency gates. Bundles the jw3-ops skill and /jw3-status. Disclosure — every tool call runs the local `jw3` CLI (installed separately from github.com/agnostic4321-ops/jw3-mcp-cli, not covered by the pinned sha) with a minimal env (PATH, HOME, XDG_CONFIG_HOME, TMPDIR, JW3_*); the CLI holds the JW3 PAT and reaches JW3.ai's Supabase edge functions and the user's exchange accounts; jw3_execute, jw3_close, jw3_exits and jw3_cancel dry-run unless confirm=true, and every confirm=true call goes through a Hermes approval prompt showing the exact command before it places, closes or cancels real orders with real funds (unattended runs follow the user's approval mode; an \"always\" answer pre-approves only that identical command); the plugin itself holds no secrets and stores nothing."
