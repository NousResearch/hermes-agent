description: "JW3.ai non-custodial trading inside Hermes: 12 market/risk/Diary reads, Diary propose cards, and 4 confirm-gated execution tools — all thin wrappers over the local jw3 CLI, which owns the PAT and enforces server-side scope, kill-switch, fee, and idempotency gates. Bundles the jw3-ops skill and /jw3-status. Disclosure: every tool call shells out to the local `jw3` binary; reads reach Supabase edge functions and exchange APIs; fund-moving tools dry-run (zero bytes sent) unless confirm=true with explicit per-trade approval; the plugin holds no secrets and stores nothing. Requires an authenticated `jw3 auth login`."
