name: k6pane
repo: https://github.com/fozagtx/k6pane
sha: 3a5d6f1aca07d9e032bb99f4ec960442a15f4ef3
version: "0.3.1"
title: k6pane
description: "Local load testing with Grafana k6 from chat. Three tools: k6pane_doctor (checks the k6 install and limits), k6pane_run (writes and runs a k6 test from a URL or a multi-step request flow with smoke, load, stress, spike, soak, constant or fixed-arrival-rate profiles, or runs your own k6 script) and k6pane_report (lists, reads and compares stored runs and flags latency, throughput and error regressions). Each run returns pass, fail, invalid (the requested load was never actually applied: dropped iterations, achieved rate short of target, or timeout) or error, with RPS, error rate, p50/p90/p95/p99 latency and a per-endpoint breakdown. Bundles the k6pane:load-testing skill. Targets are limited to localhost and private networks unless the user lists a host in the allowed_hosts setting; link-local and cloud metadata addresses (169.254.0.0/16, fe80::/10, fd00:ec2::254) are refused unless the exact host is allowlisted, and k6 is fenced with --blacklist-ip to exactly the validated IPs, so redirects, DNS rebinding and runtime-built URLs cannot reach anything else. VU, duration and request-rate caps reject oversized tests. One run at a time. Disclosure — runs the user's local k6 binary as a subprocess (never through a shell); sends load-test traffic only to the validated targets; resolves target hostnames via DNS; k6's anonymous usage report is disabled; no other network calls, no telemetry, no update checks. Writes each run (generated script, k6 summary, k6 log, parsed result, all redacted) under <HERMES_HOME>/plugin-data/k6pane/runs plus a run.lock file. Reads only k6 scripts the user points it at. Custom script/script_path tests are JavaScript that k6 runs directly on the host, outside the Hermes terminal sandbox and approval prompt, and k6's open() can read local files. Credentials: optional K6PANE_SECRET_<NAME> values, resolved per profile through agent.secret_scope.get_secret only when a test references ${secret.NAME}, passed to k6 through an inherited pipe (never disk or argv) and redacted from every stored file and tool result; k6 runs with a scrubbed environment. Standard library only, no Python dependencies; requires the k6 binary (not bundled)."
maintainer: fozagtx
tier: community
category: tools
requires_hermes: ">=0.7.0"
docs_url: https://github.com/fozagtx/k6pane/blob/3a5d6f1aca07d9e032bb99f4ec960442a15f4ef3/README.md
readme: true
platforms: [linux, macos]
known_issues:
  - "Requires the k6 binary on PATH (or the k6_bin setting); k6pane_doctor prints the install command. Tested with k6 v2.3.0."
  - "Secrets use k6's file secret source over an inherited pipe, which needs macOS or Linux; Windows is not supported."
capabilities:
  provides_tools:
    - k6pane_doctor
    - k6pane_run
    - k6pane_report
  provides_hooks: []
  provides_middleware: []
  requires_env: []
