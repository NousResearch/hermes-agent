sha: 69ba59fd459e0f70aad723f9da08ba4bf261e28f
description: "Your coding agent, paying attention to when you stop. It was already there while you worked, so it waits until the work is at a clean stopping point before it says anything — then offers a wind-down against the bedtime you chose, an opt-in pomodoro rest once per work block, saves your place so stopping costs nothing, and refuses to report a correlation the sample cannot support. Disclosure — reads Hermes's own session store (state.db, read-only: message timestamps, roles and tool names, no message text) to chart when you work; `sleep_import` reads the sleep export file you or the agent name (CSV, Gadgetbridge SQLite, Xiaomi folder), and `kairos_wearable` calls only MCP servers you list in `plugins.entries.kairos.mcp_allowlist`; adds short blocks to the conversation through `pre_llm_call` (wind-down nudge, break suggestion, the opt-in pomodoro offer, and once per new session the handoff note the agent saved when you last stopped, kept in the plugin's data folder), never into cron or subagent turns; `on_session_end` records, with the pomodoro on, when each turn ended, whether it completed, and its tool-call count (timestamps and counts only, in the plugin's own database); the optional quiet-hours guard can require approval for or block destructive terminal/file/code tool calls during hours you set."
