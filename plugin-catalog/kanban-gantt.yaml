description: 'Gantt timeline view for the Hermes kanban boards: a full /kanban-gantt desktop page rendering any board as a timeline of real work timestamps
  (created/started/review/done), with task creation (project, workspace, skills, model override, goal mode), re-parenting by drag & drop or from the
  drawer, dependency tree connectors, live-activity arcs, filters, bulk actions, and a dockable task detail drawer. Zero API keys, zero model tokens; live updates follow the plugin's /events websocket, which a gateway turns off with KANBAN_GANTT_WS=0 (the page then polls every 60 s and shows a Refresh button).'
