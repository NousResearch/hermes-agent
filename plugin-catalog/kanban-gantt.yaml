description: "Gantt timeline view for the Hermes kanban boards: a full /kanban-gantt desktop page rendering any board as a timeline of real work timestamps (created/started/review/done), with a collapsible tree column (boxed fold controls, tree connectors, per-board fold state, multi-parent links kept visible), an optional List view beside the timeline (task, assignee, status, last activity — the timeline stays the default), task creation (project, workspace, skills, model override, goal mode), re-parenting by drag & drop or from the drawer, live-activity arcs, filters, bulk actions, and a dockable task detail drawer. Zero API keys, zero model tokens; live updates follow the plugin's /events websocket, which a gateway turns off with KANBAN_GANTT_WS=0 (the page then polls every 60 s and shows a Refresh button). Disclosure — Desktop page plus dashboard routes that read and write the local kanban boards (create tasks with workspace path, skills, model override and goal mode; re-parent; move a task, with its children, to another board — the copy is verified there before the source rows and their links are deleted; edit status, assignee and description; bulk archive and delete); live updates over a dashboard-authenticated /events websocket, off with KANBAN_GANTT_WS=0; no third-party network."
