description: "One board, three views, and each answers a different question: List says what the work is, Timeline says when it happened, Graph says what hangs off what. The Graph view draws a card per task and an arrow per dependency, laid out top-down by longest path (or left to right, by status, or as a compact grid), with a transitive reduction that counts the arrows it implies instead of hiding them, links you draw, move and delete where they are drawn, and a click that lights the whole upstream and downstream lineage of a task. The Timeline renders any board as real work timestamps (created/started/review/done), with a collapsible tree column (boxed fold controls, tree connectors, per-board fold state, multi-parent links kept visible), live-activity arcs, filters, bulk actions, and a period selector from 6 hours to 7 days. The List view trades the bars for a dense table — task, assignee, status, last activity. Quick scopes (Running, Blocked, Open, All) narrow the board in all three views alike, and a lineage switch widens any of them to what leads to the selection and what follows it. Tasks are created from the page (project, workspace, skills, model override, goal mode), re-parented by drag & drop or from the drawer, and moved between boards with their children; any task with files carries a paperclip, its files listed on demand — the board payload carries only a count — and previewed by type (markdown, plain text, image, PDF, HTML in a sandboxed frame) or downloaded. Zero API keys, zero model tokens; live updates follow the plugin's /events websocket, which a gateway turns off with KANBAN_GANTT_WS=0 (the page then polls every 60 s and shows a Refresh button). Disclosure — Desktop page plus dashboard routes that read and write the local kanban boards (create tasks with workspace path, skills, model override and goal mode; re-parent; move a task, with its children, to another board — the copy is verified there before the source rows and their links are deleted; edit status, assignee and description; bulk archive and delete; read task attachment files from the board's own attachments folder for preview and download; read a task's worker log from the kanban worker-log folder); live updates over a dashboard-authenticated /events websocket, off with KANBAN_GANTT_WS=0; no third-party network."
