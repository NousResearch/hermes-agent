description: 'Live, read-only dependency graph of the Hermes kanban boards in Hermes Desktop: every board as a band, tasks as cards, dependencies as arrows
  with implied ones folded away. Click a task to light up its whole lineage with runs, last failure and the running worker''s latest tool calls; deep links
  open a task directly, and a stdlib CLI renders the same graph as a standalone HTML file. Zero API keys, zero model tokens.'
