name: kanban-task-threads
repo: https://github.com/diegomarino/kanban-task-threads
sha: fd621fc5e4e6ffc05e8c0b5b4649572e6bdd9c9d
description: "Give every Hermes kanban task a live Discord forum thread with a rewritten status card and append-only event log. Disclosure — sends task and lifecycle data to the configured Discord webhook (no host allowlist). Cards and event replies use built-in or operator-configured templates and may include identifiers, titles, status, assignment, branch and workspace metadata, relationships and blocking details, comments, event actors, reviewers, reasons, summaries, and configured dashboard links; the comment excerpt length is configurable. Fixed prerequisite announcements additionally send the prerequisite task ID, title, assignee, and up to 140 characters of its body and are not template-configurable. The absolute workspace path is off by default and requires explicit opt-in. Reads the kanban database read-only and stores thread mapping state under <kanban_home>/kanban/plugins/kanban-task-threads/. With an optional existing publisher-profile Discord bot token, reads forum and thread metadata; creates or repairs managed status tags and emojis; replaces applied tags on plugin-managed threads; renames threads; and archives or unarchives them. Discord fetches webhook avatars from the configured HTTPS asset origin."
maintainer: diegomarino
tier: community
category: automation
requires_hermes: ">=0.20"
docs_url: https://github.com/diegomarino/kanban-task-threads#readme
version: "0.4.0"
