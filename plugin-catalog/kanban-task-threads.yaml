name: kanban-task-threads
repo: https://github.com/diegomarino/kanban-task-threads
sha: 0ae90a3869b8f3508bb8d9a96bc87bebb1c03094
description: "Give every Hermes kanban task a live Discord forum thread with a rewritten status card and append-only event log. Disclosure — posts task title, status, assignee, branch, a ≤180-char comment excerpt and a 140-char prerequisite excerpt to the Discord webhook URL you configure (no host allowlist); reads the kanban DB read-only; stores thread state in <kanban_home>/kanban/plugins/kanban-task-threads/."
maintainer: diegomarino
tier: community
category: automation
requires_hermes: ">=0.20"
docs_url: https://github.com/diegomarino/kanban-task-threads#readme
version: "0.2.2"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - kanban_task_claimed
    - kanban_task_completed
    - kanban_task_blocked
    - on_kanban_task_updated
    - on_kanban_worker_spawned
    - on_kanban_worker_exited
    - on_kanban_worker_stale_claim
    - on_kanban_dispatch_tick
  provides_middleware: []
  requires_env:
    - KANBAN_TASK_THREADS_WEBHOOK_URL
