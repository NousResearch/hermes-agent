known_issues:
  - "Desktop-only package: leave its Agent switch off. With the Agent half enabled, agent.log reports a missing __init__.py on every start."
  - "Relies on the Kanban card markup and query keys of Hermes Desktop. After a Desktop update, cards can stop getting labels until the plugin is updated; the board keeps working."
