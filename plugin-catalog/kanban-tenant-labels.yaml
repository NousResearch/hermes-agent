sha: "48f4f34da212c8322e50dbcbbd4dfd2936ca6d41"
version: "0.3.0"
description: "Shows each Kanban card's tenant as a colored label on the card in Hermes Desktop, with automatic colors and pinned colors in Settings. Disclosure — the Desktop SDK has no Kanban card slot, so while the Kanban page is open the plugin adds one <span> to each card tile and watches the Kanban page with a MutationObserver; it reads task ids, titles and tenants from the bundled Kanban plugin's board snapshots in the SDK's queryClient; it stores pinned colors in ctx.storage; no network requests, no backend, no telemetry; no background processes beyond a 750 ms route check while Desktop runs."
maintainer: mszenfeld
tier: community
category: desktop
