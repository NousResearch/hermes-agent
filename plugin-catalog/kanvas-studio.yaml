title: Kanvas Studio
description: "Free, MIT open-source, local-first visual design engine driven by AI agents over MCP: adaptive Design Intelligence (7 mixable aesthetic lenses + proportional grids), multi-brand Brand Kits, quantitative Visual QA (0-100 score, multi-point/gradient WCAG contrast, margins, hierarchy, alignment), Smart Resize, multi-format Marketing Campaigns, Document Bridge (zero-dependency .xlsx/.csv I/O, Hybrid PDF round-trip, cross-platform PDF Quick Edit with layer locking and auto-fit text patches), Creative Reports & Editable Auto-Chart Engine (automatic tabular profiler generating native editable bar/line/hbar/donut charts, dynamic editorial covers, split visual insight pages, and styled paginated tables), data-aware Smart Presentation, native editable Data Visualization (bar/hbar/line/donut/table/diagram), Presentation Engine with zero-dependency editable PowerPoint (.pptx) export, Design-to-Code (HTML/CSS, React, Tailwind), reusable Asset Library, pure-JSON Community Ecosystem, live agent cursor choreography, auto-layout, components, pen vector tool, 2,100+ Lucide icons, any Google Font, canvas comments, and an optional Standalone Local Chat bar (BYOK/Ollama, automatically hidden inside Hermes Desktop). Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/kanvas-studio + desktop/plugin.js) with zero Python dependencies and zero npm runtime dependencies. The skill instructs the agent to treat design files, brand guidelines, community workflows, and canvas comments strictly as visual design content, never over user instructions or Hermes approvals. Disclosure: runs a local Node.js 18+ stdio MCP server (bin/kanvas.js mcp) exposing 23 kanvas_* tools that starts an on-demand loopback-only HTTP server on 127.0.0.1 (Host/Origin/X-Kanvas gated) and spawns locally installed Google Chrome or Microsoft Edge in headless mode for kanvas_view and raster/PDF kanvas_export (editable .pptx and code export need no browser); spawned child processes run with a minimal environment (envMinimal) so Hermes API keys and tokens (GH_TOKEN, GITHUB_TOKEN, model keys) are never inherited; in headless render mode external image URLs are restricted to public https:// hosts (private, loopback, and cloud-metadata addresses are refused); network access inside Hermes is only used to load Google Fonts stylesheets and explicitly placed public https:// images (standalone-only BYOK/Ollama chat is auto-hidden in Hermes Desktop and only calls a user-configured endpoint if explicitly enabled outside Hermes, storing masked config locally in _llm.json never returned or logged); designs, Brand Kits (brands/), Asset Library (assets-library/), and pure-JSON community extensions (community/) live locally in Hermes's plugin data folder (plugin-files/data/kanvas-studio) with zero arbitrary code execution; import/export tools read/write only paths explicitly passed in tool calls; no accounts, no paywalls, no cloud uploads, no telemetry."
