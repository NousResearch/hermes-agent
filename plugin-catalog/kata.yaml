known_issues:
  - "Approved katas are registered as additional kata_<name> tools at runtime; they are not listed in provides_tools because they do not exist until you approve one."
  - "Routines are linear. Branching on a result stays with the agent."
  - "Values inside free-form text output cannot be referenced; they become inputs instead."
