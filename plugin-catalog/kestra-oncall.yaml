name: kestra-oncall
title: Kestra On-Call
repo: https://github.com/zkasuran/hermes-kestra-oncall
sha: "9714ac0d65ec1c887c7b250ec6f8709791ee5e25"
description: >-
  Puts Hermes on call for Kestra. When an execution in an allowed namespace fails, Hermes reads the failed
  task, its error logs and what changed since the last good run, proposes the smallest fix to the flow and
  asks you in chat. After one approval it saves the fix as a new flow revision, replays the failed execution
  from the task that failed (tasks that already succeeded are not rerun), follows the replay and checks the
  result. A failed replay restores the previous revision if the flow is still at the fixed one. Kestra Pause
  tasks become chat questions you can answer from any Hermes surface. A Kestra on-call dashboard tab and Desktop
  pane list incidents, proposals and pauses (read-only).
  Disclosure: network: only the Kestra URL you configure (kestra_url, HTTPS required except for loopback and
  explicitly allowed private hosts), with the Kestra credentials you give Hermes (KESTRA_USERNAME and
  KESTRA_PASSWORD or KESTRA_API_TOKEN, read through Hermes secret scope). No other host, no telemetry.
  Writes to Kestra: a flow update, a replay, a rollback to the previous revision and resume or kill of a
  paused execution. Each needs a person: the typed command /kestra apply <id> <hash> (the hash must match the
  stored proposal) or Hermes's approval card for the two write tools with the whole stored diff, bound to the
  proposal hash. Diffs too long to read in full are refused. The write tools refuse in webhook, cron,
  single-query and unknown surfaces and the model-driven path refuses while Hermes approvals are bypassed.
  Fails closed: an empty namespaces setting allows nothing and protected_flows are diagnosis-only.
  Stored data: incidents, flow sources, error logs, task outputs, diffs, proposals and decision records in the
  plugin's profile-scoped SQLite database. Data sent elsewhere: the tools return flow sources, error logs,
  task outputs and execution inputs to the model, so they go to the profile's LLM provider. The dashboard routes
  under /api/plugins/kestra-oncall only read and show diffs and logs to anyone who can open the Hermes
  dashboard. hermes kestra-oncall setup --apply adds one named webhook route to config.yaml and never deploys a
  Kestra flow. Anyone holding WEBHOOK_SECRET can start a read-only model run against your Kestra.
  AI-assisted implementation.
