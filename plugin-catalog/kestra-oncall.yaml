known_issues:
  - "Kestra has no compare-and-set on flow updates, so the check-then-write window is narrowed by a fresh re-read and a read-back, not removed."
  - "Slash-command writes are typed approvals (/kestra apply <id> <hash>) because ctx.dispatch_tool does not run pre_tool_call hooks on Hermes main or v0.23.0 and a plugin command has no way to raise an approval card in a chat."
  - "Model-driven writes are refused while Hermes approvals are bypassed (--yolo, /yolo, approvals.mode: off). The check imports tools.approval.is_approval_bypass_active, which hermes plugins validate reports as one non-public import."
  - "Built for plugins.isolation: in_process (Hermes's default). Host isolation skips CLI registration and was not tested."
  - "Tested on Kestra 2.0.9 only. A failed Loop cannot be replayed on that version and a failed Subflow is diagnosis-only."
  - "The end-to-end run used Hermes main at c3354ea. On v0.23.0 scenarios S1, S1b, S2 and S3 passed, as did validate, doctor and the live plugin test."
capabilities:
  provides_tools:
    - kestra_status
    - kestra_incident_open
    - kestra_incidents
    - kestra_propose_fix
    - kestra_apply_fix
    - kestra_pauses
    - kestra_pause_decide
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
