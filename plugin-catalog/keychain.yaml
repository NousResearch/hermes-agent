name: keychain
title: macOS Keychain
repo: https://github.com/shoaibyazdani/hermes-keychain
sha: "50dfad30907b63351c2b3aa69443a87287d94527"
version: "0.1.0"
description: "Keep Hermes provider credentials in the macOS login keychain instead of plaintext .env. Registers a SecretSource (secrets.keychain), so startup resolution runs through Hermes's own orchestrator, after ~/.hermes/.env loads and before credentials are read, the same path the bundled Bitwarden and 1Password sources use. Bindings are explicit (secrets.keychain.env: ENV_VAR: keychain-account) or discovered from an index the plugin keeps inside the keychain, so `hermes keychain put NAME` is the whole setup. Adds keychain_status (vault-backed vs still-plaintext inventory; names, lengths and outcomes only), keychain_migrate (store, read back, compare, then replace the .env line with a comment mentioning the name; 0600 backup first) and keychain_audit (fetch/migrate trail), plus a `hermes keychain put|ls|rm|test|migrate|status|audit` CLI. Disclosure — reads and writes generic-password items in the user's login keychain through /usr/bin/security (service `hermes` by default); no network calls and no third-party service, nothing leaves the machine; the index of stored names lives in a keychain item (`hermes!index`) and the audit log in <hermes home>/plugin-data/keychain/audit.jsonl; only an explicit `keychain_migrate` rewrites ~/.hermes/.env (values removed, comment left behind, 0600 backup written) and it refuses to strip a line whose store did not verify; a locked keychain or denied ACL is a warning, never a startup block; a stored value is passed on argv for the single `security add-generic-password` call (visible to same-user processes for that moment) while reads, the once-per-process hot path, never put a value on argv. macOS-only, no Python dependencies, no env vars."
maintainer: shoaibyazdani
tier: community
category: security
requires_hermes: ">=0.23.0"
platforms: [macos]
readme: true
capabilities:
  provides_tools:
    - keychain_status
    - keychain_migrate
    - keychain_audit
  provides_hooks: []
  provides_middleware: []
  requires_env: []
