name: kin
title: Avatar
repo: https://github.com/vdimarco/hermes-kin
sha: d665c5d294081b81137efd28e4c912335150009c
description: "An avatar for Hermes Desktop that keeps an eye on your work. It tells you when a turn is stuck, done, or waiting on you. Pick one of twelve original characters, six 3D busts and six 2D cartoons, each with a voice of their own. An optional overlay adds a plain-English task drawer, opt-in voice, and screen diagnosis. Your avatar writes drafts and never sends for you."
maintainer: vdimarco
tier: community
category: desktop
requires_hermes: ">=0.22.0"
version: "0.3.0"
