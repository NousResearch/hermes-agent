description: "A cartoon avatar for Hermes Desktop that keeps an eye on your work. It tells you when a turn is stuck, done, or waiting on you. Pick one of six original characters, each with a voice of their own. An optional overlay adds a plain-English task drawer, opt-in voice, and screen diagnosis. Your avatar writes drafts and never sends for you."
