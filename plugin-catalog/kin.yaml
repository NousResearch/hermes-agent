tier: community
category: desktop
requires_hermes: ">=0.22.0"
version: "0.2.0"
screenshots:
  - https://raw.githubusercontent.com/vdimarco/hermes-kin/abdff63987a4287eee838afbee61a84efb64c9d3/docs/overlay-sections.png
  - https://raw.githubusercontent.com/vdimarco/hermes-kin/abdff63987a4287eee838afbee61a84efb64c9d3/docs/overlay-plain.png
capabilities:
  provides_tools: []
  provides_hooks: [post_tool_call, api_request_error, on_session_start, on_session_end, pre_llm_call]
  provides_middleware: []
  requires_env: []
