name: kin
title: Avatar
repo: https://github.com/vdimarco/hermes-kin
sha: 1c258c9c18c4c3104ad8c5e21faf749fb61fc962
description: "Gives Hermes Desktop a face. Pick one of thirteen original characters, six 3D busts and seven 2D cartoons, each with its own voice. It watches your sessions, frowns when a step fails, and grins when a turn finishes. An optional overlay adds a plain-English task drawer, voice input, and one-click screen diagnosis."
maintainer: vdimarco
tier: community
category: desktop
requires_hermes: ">=0.22.0"
version: "0.4.0"
image: https://raw.githubusercontent.com/vdimarco/hermes-kin/1c258c9c18c4c3104ad8c5e21faf749fb61fc962/docs/banner.png
