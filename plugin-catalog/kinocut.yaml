description: >-
  Guardrailed local video editing: Kinocut's MCP server plus two workflow skills
  (editing and short-form repurposing). Trim, caption, reformat and check quality
  with local FFmpeg. Portable Agent Plugins v1 configuration and skills, no plugin
  code. Requires uv and FFmpeg on PATH; launches uvx kinocut==1.16.4 over stdio.
  First launch downloads Kinocut and dependencies from PyPI. URL inputs download
  the requested media; font and model-weight features fetch assets from GitHub.
  Explicit Revideo dependency installation runs npm ci and may download renderer
  dependencies. Local FFmpeg editing and color grading need no account or API key.
  Kinocut's optional vision calls default off and require explicit configuration:
  legacy product descriptions use an Anthropic-compatible endpoint, while
  sampled-frame QC uses Anthropic. The README explains how to use the host's image
  model instead, including local models. Revideo and Hyperframes telemetry default
  off. Unverified Hyperframes browser previews and Docker renders require explicit
  telemetry consent. Hyperframes capture/snapshots disable implicit model analysis.
  These controls are not a network sandbox; see the plugin README for configuration
  and remaining network use.
