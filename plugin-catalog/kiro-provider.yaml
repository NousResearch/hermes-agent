description: "Native Kiro model provider over HTTPS, with control-plane REST calls routed to the account region, and AWS Builder ID / IAM Identity Center / Google / GitHub device login. Disclosure — dynamically registers an AWS OIDC public client named `hermes-kiro` during AWS login; Google/GitHub login uses Kiro's device flow at prod.us-east-1.auth.desktop.kiro.dev and its /refreshToken endpoint. Stores OAuth grants in Hermes' profile-scoped auth.json credential pool; prompts, tool schemas/results and base64 images are sent to the account's Kiro runtime endpoint. Claude and GPT catalog models declare vision, open-weight families and unknown model ids stay text-only."
