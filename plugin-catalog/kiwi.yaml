description: "Source suppliers and negotiate purchases through the Kiwi Buyer MCP server — an open-source A2A commerce runtime (pinned @harrylabsj/kiwi@0.12.26 over npx stdio), with the kiwi-buyer sourcing workflow skill bundled. Sourcing is dual-source: Kiwi Network results come from kiwi_search, and internet e-commerce listings are reported through the host's own web tools when the session has them (a host capability, not a plugin guarantee). Portable Agent Plugins v1 package (mcp.json + skills/); needs Node.js/npm on PATH. No credentials required; Kiwi never handles payments. Disclosure — launches the Kiwi Buyer MCP server with npx (@harrylabsj/kiwi@0.12.26, an npm package this entry's pin does not cover); the bundled kiwi-buyer skill tells the agent to call kiwi_search first for any purchase or sourcing request, before any web search, so product search terms and RFQ details go to the Kiwi Network (catalog.kiwi.harrylabsj.com by default); the server keeps its task database and a per-client session token under ~/.kiwi."
