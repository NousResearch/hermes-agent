description: "Kleos, the AI marketing team for small businesses, through its hosted MCP server (Streamable HTTP at https://app.getkleos.ai/mcp; OAuth 2.1 with PKCE, signed in with the user's own Kleos login; no keys in config). Thirty-one tools: list businesses, read the month's calendar and open slots, plan the next 30 days, draft a post or a blog article in the business's voice, save a post in the user's own words, list and approve drafts waiting for review, schedule an approved post to a connected channel, report results (posts published, impressions, clicks, leads) and whether ChatGPT, Google AI Mode and Perplexity recommend the business, read the tracked AI questions, buyer searches and competitor pages, read and record product updates, read and confirm the buyers' day-to-day topics, and the planning writes the Kleos director uses (a calendar entry with its reason, a slot brief, a tracked question, a competitor, a note). Bundles one skill (kleos) that says which tool fits which task and that nothing is published without the user asking. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local code: every tool call, and the optional OAuth sign-in, goes to app.getkleos.ai (New Odyssey), authenticated with the user's own Kleos OAuth login or an optional KLEOS_API_KEY sent as a bearer header; drafting, planning and AI-visibility checks spend the workspace's plan allowance, and approving or scheduling publishes to the business's connected channels (approve_draft can publish when the business has auto-publish on). The package marks the server untrusted, so Hermes asks before any tool not annotated read-only and refuses those in unattended runs; the tool set is served by the remote server at runtime and is not covered by the pinned sha."
