description: "Kleos, the AI marketing team for small businesses, through its hosted MCP server (Streamable HTTP at https://app.getkleos.ai/mcp; OAuth 2.1 with PKCE, signed in with the user's own Kleos login; no keys in config). Twelve tools: list businesses, read the month's calendar, plan the next 30 days, draft a post or a blog article in the business's voice, save a post in the user's own words, list and approve drafts waiting for review, schedule an approved post to a connected channel, report results (posts published, impressions, clicks, leads) and whether ChatGPT, Google AI Mode and Perplexity recommend the business, and read the buyers and problems the content is written for. Bundles one skill (kleos) that says which tool fits which task and that nothing is published without the user asking. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to app.getkleos.ai, which applies the user's role in their workspace, their plan's allowances and each business's approval settings, and records assistant actions in the workspace's audit log. Drafting, planning and AI-visibility checks spend the workspace's plan allowance; approving and scheduling publish to the business's own connected channels. The package marks the server untrusted, so Hermes asks before any tool not annotated read-only runs and refuses them in unattended runs. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
