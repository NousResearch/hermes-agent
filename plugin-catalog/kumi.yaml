description: "Kumi puts Hermes inside Ableton Live, REAPER and Renoise: it hears your mix, makes changes you can undo, and turns your samples into new sounds. Disclosure — after you approve setup, downloads the Kumi release this pin names for your platform (27–35 MB, SHA-256 checked) from github.com/user1303836/kumi/releases into HERMES_HOME/plugin-data/kumi/ and installs Kumi's part in your DAW (Live's Remote Script with its Kumi Ears device, a REAPER extension or a Renoise tool) at paths you approve; a newer release comes only with a new catalog pin. Runs Kumi's runtime and DAW bridge as local child processes on loopback that stop with the chat or after idling. Reads the open DAW project, the sample folders you list, HERMES_HOME/cache/generated/audio, VST3 metadata in the standard plug-in folders and, after you approve, an existing Kumi's DAW connection files. Writes the Max for Live devices, presets and wavetables you ask for as new files in Live's User Library, and copies your saved project beside it before some changes. Runs a DAW script you ask for with the DAW's access to your computer (asked first, with its code, once a chat has read outside content). Plays the project only for a listen or play you ask for. Sends FOCUS notes and measurements to your Hermes model, and with listen_interpretation on, a small band-energy image to the auxiliary model. Mirelo (paid, off by default): only with your key and a credit cap above 0, approved prompts and audio go to api.mirelo.ai and the transfer hosts it names. No telemetry."
