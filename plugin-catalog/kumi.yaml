known_issues:
  - "Your DAW runs on the computer that runs Hermes: Ableton Live 12 on macOS or Windows (tested on 12.4; 12.0–12.3 untested, with no offline renders), REAPER 7+ or Renoise 3.5+ (macOS, Windows, Linux)."
  - "In Hermes Desktop, switch Kumi on under Capabilities → Plugins to see its pane and sound map."
  - "Kumi reads WAV and AIFF; MP3, FLAC and other compressed audio need an ffmpeg you already have, allowed at setup."
  - "Listening in Live uses Max for Live: setup installs Kumi's Kumi Ears device."
