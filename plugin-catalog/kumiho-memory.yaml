title: Kumiho Memory
description: "Recall and save decisions, preferences and facts in your Kumiho Cloud workspace. Portable Agent Plugins v1 package with hosted OAuth MCP and six skills. Disclosure — connects to Kumiho's hosted MCP at https://mcp.kumiho.cloud/mcp (OAuth at control.kumiho.cloud, tokens held by Hermes); memory queries, including an automatic topic lookup near the start of relevant conversations, and approved captures are sent there; the server is marked `trust: untrusted`, so Hermes asks before every tool not annotated read-only. The optional backfill helper reads only files the user names and writes review packets to a new folder; Dream State can create a recurring Hermes cron task when asked (read-only by default). No local server, telemetry or background process."
