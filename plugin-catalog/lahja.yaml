description: "Arabic dialect speech-to-text (provider lahja), fully local: a dialect fine-tuned Whisper large-v3-turbo on whisper.cpp keeps Levantine, Gulf, Egyptian, Iraqi and Maghrebi speech as spoken instead of rewriting it as formal Arabic (WER 29% vs 41% for stock turbo with the same VAD, across 13 dialects), Silero VAD always on plus a filter for subtitle-credit hallucinations («ترجمة نانسي قنقر»), per-note language routing that never forces a non-Arabic language (English, including accented English the dialect model writes in Arabic letters, goes to a stock Whisper model you choose), and corrections taught once with /stt-fix. Disclosure — audio is decoded locally in a temp dir deleted after each call; nothing is uploaded. Network only in `hermes lahja setup`, which downloads SHA-256-pinned model files from huggingface.co. Runs ffmpeg and whisper-cli (fixed argv, no shell, timeout, minimal environment without Hermes' variables). Reads the audio Hermes passes, its own model files, and an optional other_languages_model .bin you configure. Writes model files and the two phrases of each /stt-fix correction to its plugin data dir. No audio or transcripts stored; no tools, hooks, background processes, telemetry or credentials."
