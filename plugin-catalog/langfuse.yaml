name: langfuse
repo: https://github.com/NousResearch/hermes-official-plugins
sha: d48cfa881dfcecb6121a6b65cc0be47b8cb60a22
subdir: langfuse
description: 'Langfuse observability for Hermes: one trace per turn, one generation per LLM call (usage
  and cost from Hermes'' own pricing, cache and reasoning tokens included), one observation per tool
  call and subagent. Content capture is sanitized by default (metadata-only and full are opt-in); sends
  traces only to the Langfuse project whose keys you set. Formerly built into Hermes core as
  observability/langfuse; existing users are migrated automatically.'
maintainer: NousResearch
tier: official
category: general
requires_hermes: ">=0.21.7"
version: "2.0.0"
image: https://raw.githubusercontent.com/NousResearch/hermes-official-plugins/d48cfa881dfcecb6121a6b65cc0be47b8cb60a22/assets/langfuse.jpg
docs_url: https://github.com/NousResearch/hermes-official-plugins/tree/main/langfuse
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_api_request
    - post_api_request
    - api_request_error
    - pre_llm_call
    - post_llm_call
    - pre_tool_call
    - post_tool_call
    - on_session_finalize
    - on_session_end
    - subagent_start
    - subagent_stop
  provides_middleware: []
  requires_env:
    - HERMES_LANGFUSE_PUBLIC_KEY
    - HERMES_LANGFUSE_SECRET_KEY
