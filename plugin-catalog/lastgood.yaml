name: lastgood
title: LastGood
repo: https://github.com/Dr-Enuf/lastgood
sha: 5edd3288ff825605830e6cc44320eebabd6208c6
subdir: plugin/lastgood
version: "0.4.2"
requires_hermes: ">=0.22.7"
description: >-
  LastGood records which of your preset checks passed on which tested
  state, and what restoring files will not undo. Checks you choose
  (file opens, words present, files exist, page loads) run after
  write_file or patch in an opted-in project, and on demand via
  /lastgood and /blame. Results are PASS, FAIL, or UNKNOWN, with a
  content fingerprint so changed files mark old results stale. Blame
  shows the first failing step and bounded configured-string presence
  deltas, not the cause. A ledger lists recognised tool calls a file
  rollback will not undo, without storing their arguments. Disclosure:
  the optional url_loads check fetches the http(s) address you
  configure. Link-local and cloud-metadata addresses are refused,
  including after redirects. Only you can add a page check, with
  /lastgood setup or by editing lastgood-config.json; the
  lastgood_setup tool cannot. Private ranges need the
  allow_private_urls setting. No shell commands, credentials, or
  background processes. Refuses a home folder, drive or filesystem
  root, or system folder as the project, and explains invalid setups
  with the accepted check types.
maintainer: Kenneth Ausmus (Dr-Enuf)
tier: community
category: tools
capabilities:
  provides_tools:
    - lastgood_check
    - lastgood_status
    - lastgood_blame
    - lastgood_report
    - lastgood_setup
  provides_hooks:
    - pre_tool_call
    - post_tool_call
  provides_middleware: []
  requires_env: []
