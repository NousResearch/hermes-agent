description: "Built something? Ask Hermes to prepare the launch, based on what posts.design learned from launches that worked: ideas from three real launch posts like yours, a post in your own words checked in code for slop, a share card from your own screenshots, colours and logo, and with /launch film a 14-second launch film in your brand plus a checklist so you don't post a sloppy video. You approve a preview first, then get the text, the card and a link that opens X with the post filled in. Disclosure: one posts.design search per run through your own posts MCP server, a fetch of your product site, brand kit and packs stored locally, two check-ins scheduled only if you say Yes, an optional Hermes Desktop page (off until you turn it on) whose read-only backend, served while the plugin is enabled, reads your packs and the times of the check-ins it scheduled, a launch film made only when you ask with /launch film, rendered on your machine by the renderer you set up (a configured command or HyperFrames on PATH) with HyperFrames telemetry off (Launch Desk downloads nothing itself; HyperFrames may download its own headless Chrome on its first render), plus posts.design's free playbook list and, on Pro, one playbook read (1 credit) the first time and again only when posts.design updates it, and nothing is ever posted; see the README for the full list."
