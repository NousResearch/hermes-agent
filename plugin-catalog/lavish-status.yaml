description: "A status-bar badge in Hermes Desktop for Lavish review pages (lavish-axi) that wait on you: a red count of pages that block and an orange count of pages that need a decision, hidden when both are 0 or when the data is stale. The tooltip lists the waiting pages and a click opens the sessions board in your browser. It only reads a summary file, ~/.hermes/lavish-kit/summary.json, that a Lavish status writer keeps fresh (the writer is not part of this plugin); without a fresh file the badge stays hidden. Disclosure — Reads one file, ~/.hermes/lavish-kit/summary.json in your real home directory (outside the plugin's own data), read-only, every 10 seconds through its dashboard route; a click opens the board URL from that file in your browser (http or https only). No writes, network calls, shell commands, background processes, credentials or telemetry."
