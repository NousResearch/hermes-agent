name: lazy-plugin
repo: https://github.com/RegeneratusLabs/lazy-plugin
sha: c6865376bbd0ebb55d269d35f6158a9d02e61bf9
version: "0.9.0"
title: "Lazy Plugin"
description: >-
  A dashboard page in Hermes Desktop where you describe a plugin and watch it get built. Say
  what you want — or start from a skill the agent wrote, or a job that runs on a schedule —
  and your own agent drafts the plan in a chat turn you can read, the code comes from four
  fixed templates, and the page shows a receipt: plan, files, validator result, and a real
  try-out of every tool (purrs, needs a key, blocked upstream, half-built, broken — with the
  exact failing line). Nothing installs itself, and publishing is a SHA-pinned catalog PR you
  send. Also callable as lazyplugin_create from any conversation.
maintainer: RegeneratusLabs
tier: community
category: tools
docs_url: https://github.com/RegeneratusLabs/lazy-plugin#readme
readme: true
requires_hermes: ">=0.23.0"
capabilities:
  provides_tools:
    - lazyplugin_create
    - lazyplugin_sources
    - lazyplugin_built
  provides_hooks: []
  provides_middleware: []
  requires_env: []
