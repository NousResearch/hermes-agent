version: "0.9.7"
title: "Lazy Plugin"
description: >-
  A dashboard page in Hermes Desktop where you describe a plugin and watch it get built. Say
  what you want — or start from a skill the agent wrote, or a job that runs on a schedule —
  and your own agent drafts the plan in a chat turn you can read, the code comes from four
  fixed templates, and the page shows a receipt: plan, files, validator result, and a real
  try-out of every tool (purrs, needs a key, blocked upstream, held back, half-built, broken —
  with the exact failing line). The build never runs what it wrote: the try-out is your click,
  a key only travels to a public https host, and a file tool stays inside its own data dir.
  Nothing installs itself, and publishing is a SHA-pinned catalog PR you send. Also callable as
  lazyplugin_create from any conversation.
maintainer: RegeneratusLabs
