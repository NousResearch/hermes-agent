description: "Manage ad campaigns on Meta, Google, TikTok, LinkedIn, Reddit, Apple, Bing, ChatGPT and Snapchat Ads through the hosted Lazy Ads MCP server (Streamable HTTP), with a workflow skill. Portable Agent Plugins v1 package with no executable code; needs a Lazy Ads API key in LAZY_ADS_API_KEY. Disclosure — every tool call is an HTTPS request to mcp.lazyads.ai carrying your API key as a Bearer header (dropped on cross-origin redirects), and the tools create and edit real campaigns that spend your ad budget; confirm-before-spend is enforced by skill instructions, not by Hermes (set trust: untrusted on the server to make Hermes ask before every write-capable call). No local processes, no telemetry, no self-update."
