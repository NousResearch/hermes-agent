sha: 0ca2acd72f7f9008ba7f24505cad2e58f764138b
description: "A new tool for high school debate students. Build a Lincoln-Douglas case with a coach, run a full timed round against an AI opponent, answer Extemp questions out loud, and study great speeches. You speak on a real clock that starts when you do. A practice judge writes a full ballot after every round and quotes your own lines back to you, and you can play each one back from your own recording. Try an answer twice and see what got better. Ballots are kept, and the habits that keep costing you are counted across them. Rhetoric lessons mark the figures in famous speeches. The coach asks questions first and writes nothing into your case until you press Add. In any Hermes chat, /debate gives you today's question. New in 0.2: Extemp answers spoken on a real clock, a Rhetoric room, a Ballots page that counts your habits across rounds and shows which way each is heading, and a Start here guide to the four rooms. Disclosure — an independent community plugin, not made or endorsed by Nous Research, the National Speech & Debate Association, AllSides or any news outlet. Registers a Desktop page, a dashboard API, the /debate command, two read-only agent tools (debate_record, debate_today; both refuse in scheduled jobs), three model rows and a debate-coach skill; no hooks, middleware or env vars. The microphone opens only while you press Start speaking. Recordings, transcripts, cases, ballots and your extemp file stay in $HERMES_HOME/plugin-data/ld-workbench/, with delete buttons in Settings. Takes go to Hermes's speech-to-text (a cloud provider gets a take only when you press Transcribe now on it) or to the plugin's own speech model, downloaded from huggingface.co (about 145 MB) only on a press. Pressing Hear it sends the AI opponent's or coach's speech text to the text-to-speech voice set up in Hermes. Its own network calls start on a button (Pull headlines: Google News RSS and outlet feeds, https only; Get up to speed: up to 4 public pages from your Hermes web search; a link you save, http or https), public addresses only, with time and size caps. Model calls go to your own Hermes model; with coach examples on, one runs in the background after each 60-second answer. Uses one private Hermes import (tools.voice_mode.transcribe_recording), guarded with a local fallback. No credentials, telemetry, background jobs or self-updates."
