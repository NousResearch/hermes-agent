name: lean-mode
repo: https://github.com/aoyamari/hermes-lean-mode
sha: "2b10a269808336cdce558a18ade3f62e9b6b0f2d"
subdir: ""
description: >-
  Cheap-model subagent (quick_run) with a dollar cap, auto-escalation when the
  cheap model fails, and an honest cost receipt. Each child call starts with
  4-10k prompt tokens vs the parent's 100-300k. Per-run budget cap (soft, stops
  within one call), watchdog timeout, escalation to the parent model, a
  restricted toolset (no delegation/memory/skills/clarify/cronjob), and a
  JSON audit logged to plugin-data/lean-mode/runs.jsonl.
  Requires the operator to configure lean: in config.yaml with a cheap model,
  parent model, prices and presets. Tested on Hermes v0.23.0. MIT licensed.
maintainer: Aoyama
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.1.0"
capabilities:
  provides_tools:
    - quick_run
  provides_hooks:
    - post_api_request
    - subagent_start
    - subagent_stop
  provides_middleware: []
  requires_env: []
