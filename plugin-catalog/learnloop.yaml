title: learnloop
description: >-
  Structured lessons and practice inside Hermes, after LearnHarness: /learnloop:study probes what you
  know, plans a path and teaches it one graded check at a time; /learnloop:practice drills it with a
  hint ladder. What you learn becomes a knowledge graph you can explore and practise from.
