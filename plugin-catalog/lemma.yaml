subdir: hermes-plugin
title: Lemma — Audit What Agents Read
description: 'An AI-scientist plugin that audits what your agent reads. Paste or mention a paper link and the ambient
  pre-LLM hook offers an audit unprompted; five tools (quick_audit, audit, status, judge, improve) extract testable
  claims, generate and run honest audit scripts behind a mandatory positive control, and render verdicts —
  supported, falsified, inconclusive — over an append-only evidence trail. The Desktop Audit Room pane shows live
  runs (stage, attempts, trace tail) and self-distrust flags (verify_gain) when a post-feedback flip to supported
  needs eyeballing. Everything stays local under plugin_data_dir. Disclosure: LLM-written audit scripts execute
  inside a sandbox (no network, workdir-only writes) and are refused where none exists; audit and improve run as
  detached background processes; network goes to Anthropic (LLM), arxiv.org/openreview.net (papers), and
  api.firecrawl.dev only if the user configures that key.'
maintainer: udirobert
tier: community
category: tools
version: "0.2.0"
docs_url: https://github.com/udirobert/lemma/tree/main/hermes-plugin
platforms: []
capabilities:
  provides_tools: [lemma_quick_audit, lemma_audit, lemma_status, lemma_judge, lemma_improve]
  provides_hooks: [pre_llm_call]
  provides_middleware: []
  requires_env: [ANTHROPIC_API_KEY]
