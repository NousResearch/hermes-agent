name: lethe
title: Lethe
repo: https://github.com/itsflownium/hermes-lethe
sha: f81b7fc0e4dd0fb648d096e33ee4b3c77475afd1
description: "Take one chat off the record with /lethe: nothing reaches memory, your profile or skills, the transcript is deleted, and a river shows every write it kept out."
maintainer: itsflownium
tier: community
category: memory
requires_hermes: ">=0.23.1"
docs_url: https://github.com/itsflownium/hermes-lethe#readme
version: "0.1.0"
image: https://raw.githubusercontent.com/itsflownium/hermes-lethe/f81b7fc0e4dd0fb648d096e33ee4b3c77475afd1/assets/social-preview.png
screenshots:
  - https://raw.githubusercontent.com/itsflownium/hermes-lethe/f81b7fc0e4dd0fb648d096e33ee4b3c77475afd1/assets/review/panel-light.png
  - https://raw.githubusercontent.com/itsflownium/hermes-lethe/f81b7fc0e4dd0fb648d096e33ee4b3c77475afd1/assets/review/panel-dark.png
readme: true
platforms: [linux, macos]
known_issues:
  - External memory providers (memory.provider) are not covered; Hermes syncs them outside tool calls. The README has a prompt for extending a local copy.
  - The end-of-chat receipt can't print at /exit in the CLI/TUI yet (the shared gateway drops plugin end-of-session messages); use /lethe-end first. The transcript is deleted either way.
  - In a brand-new Desktop chat, typing /lethe first hits Hermes's "Submission destination changed" error; use the panel's Start off the record.
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - pre_llm_call
    - post_llm_call
    - on_session_finalize
    - on_session_start
  provides_middleware: []
  requires_env: []
