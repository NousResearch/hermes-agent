description: >-
  Search and book real flights and hotels through the hosted LetsFG MCP server (Streamable HTTP,
  OAuth 2.1 + DCR), with the letsfg travel-booking workflow skill bundled: fares across airlines and
  the major travel sites, flexible dates, destinations in a region, bookable hotel rates, then book,
  follow and stop bookings. Portable Agent Plugins v1 package (mcp.json + skills/).
  Disclosure — hosted-only connector with no local code: every tool call goes to the vendor's
  remote MCP server at letsfg.co/mcp. Booking tools act on real money: a booking holds the price on
  the card saved on the user's LetsFG account (captured only once the airline or hotel confirms,
  released if it fails), is approved from an e-mail by default, and card details are only ever
  entered on letsfg.co, never in the conversation. Traveller details given for a booking (name,
  date of birth, passport, contact) are sent to LetsFG and saved on that account. OAuth must be
  enabled with
  `hermes mcp add letsfg --url https://letsfg.co/mcp --auth oauth --connect-timeout 300`;
  the bundled mcp.json alone yields 401.
