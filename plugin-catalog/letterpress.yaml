known_issues:
  - "The three designs, and PDF or image export of a designed piece, need Google Chrome, Chromium, Microsoft Edge or Brave, found in the usual install folders, on PATH, or at the path in LETTERPRESS_BROWSER. Without one the Designs screen says so and the Template version still works. The lookup has been run on a Mac; on Windows and Linux it is covered by tests only."
  - "Build from a website looks at the site in that browser on macOS and Linux only. On Windows it still reads the site's colors and fonts, but writes no style brief."
  - "A three-designs run takes several minutes on a small model."
  - "Updating the plugin while Letterpress is working reloads its page, and an outline in progress loses its place on screen."
  - "In the light theme, placeholder text and buttons that aren't ready yet are pale."
  - "Audio needs text to speech turned on in Hermes; without it the script is made and can be exported."
  - "Reading a logo or brand sheet needs a model that can see images."
  - "The source check proves a number or quote is in your sources, not that the source is right."
  - "The check covers numbers and quotes, not claims or framing: a sample deck headlined \"adds a site\" passed 19 of 19 when its sources said \"proposes\"."
