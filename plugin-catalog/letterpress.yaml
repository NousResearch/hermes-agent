sha: f67cc002118bbd81ba3b99c773c38ad4e46401f5
description: "Drop in your PDFs, Word files and text, and Letterpress turns them into a finished deck, one-pager, graphic or audio brief in your own brand. Pick from three deck designs (Editorial, Data board, Statement), mix slides between them, and revise any slide by asking in plain words. Ask questions of your sources and get answers that cite the paragraph. Numbers and quotes are checked against your sources before export, and a Source notes PDF sets each one beside the sentence it came from. The check covers numbers and quotes, not claims or framing, so read the headlines yourself. Five built-in brands, or make your own. Independent community plugin, not made or endorsed by Nous Research. Disclosure — Sends source text (secrets redacted by Hermes), questions, briefs and pictures of draft slides to the user's own Hermes model (auxiliary task \"Letterpress writing\") and audio scripts to the user's Hermes text-to-speech provider; fetches only web addresses the user enters, through Hermes's SSRF-safe client or the user's web_extract tool; starts a headless Chrome/Chromium/Edge/Brave child process (path from LETTERPRESS_BROWSER or IMPRINT_BROWSER, install folders or PATH) with only a minimal environment to render exports with network blocked and, on macOS/Linux, to view up to four pages of a user-named website through a public-address-only proxy on 127.0.0.1; runs sips on macOS; on first start copies its own earlier data from $HERMES_HOME/plugin-data/imprint/ when that folder holds this plugin's database, without changing it; writes only under $HERMES_HOME/plugin-data/letterpress/ (or LETTERPRESS_DATA_DIR / IMPRINT_DATA_DIR) and to paths picked in the save dialog."
