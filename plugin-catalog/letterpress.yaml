description: "Drop in your PDFs, Word files and text, and Letterpress turns them into a finished deck, one-pager, graphic or audio brief in your own brand. Pick from three deck designs (Editorial, Data board, Statement), mix slides between them, and revise any slide by asking in plain words. Ask questions of your sources and get answers that cite the paragraph. Numbers and quotes are checked against your sources before export, and a Source notes PDF sets each one beside the sentence it came from. The check covers numbers and quotes, not claims or framing, so read the headlines yourself. Five built-in brands, or make your own. Independent community plugin, not made or endorsed by Nous Research. Disclosure: source text (secrets redacted by Hermes), questions, briefs and pictures of draft slides go to the user's own Hermes model (auxiliary task 'Letterpress writing'); audio scripts to the user's Hermes text-to-speech provider (default Edge, Microsoft's online voice service). Web reads go only to addresses the user enters, via the user's web_extract tool or Hermes's SSRF-safe client (public addresses only, every redirect checked, size and time capped). Starts a headless Google Chrome, Chromium, Microsoft Edge or Brave as a child process with a throwaway profile (from LETTERPRESS_BROWSER or the earlier IMPRINT_BROWSER, else the usual install folders on macOS and Windows, else PATH); it draws designs and their PDF and image exports with all network requests blocked and, on macOS and Linux, views a website the user builds a brand from (up to four pages, read only, robots.txt respected) through a checking proxy on 127.0.0.1 that refuses non-public addresses. On macOS runs sips for one-pager previews. The browser and sips start with only PATH, HOME, the temporary-folder and language variables (plus DISPLAY, WAYLAND_DISPLAY and XDG_RUNTIME_DIR on Linux, and SYSTEMROOT, WINDIR, USERPROFILE, LOCALAPPDATA and APPDATA on Windows), never Hermes's own environment or keys. Reads only files the user picks, plus, once on first start, $HERMES_HOME/plugin-data/imprint/ (this plugin's name before Nov 12, 2026), which it copies into its own folder only when that folder holds this plugin's own database and its own folder is empty; the earlier folder is never changed; writes only to $HERMES_HOME/plugin-data/letterpress/ (or LETTERPRESS_DATA_DIR, or the earlier IMPRINT_DATA_DIR, if set), scratch folders it deletes, and paths picked in the save dialog. Background threads run only after a button press. No stored credentials, self-updates or telemetry. Registers no tools, hooks or middleware (only an auxiliary model task, a Desktop page and a dashboard API); calls the user's tools text_to_speech and web_extract by fixed name, and image_generate only through an API flag the shipped page never sends. Python dependencies: pypdf, python-docx, python-pptx, reportlab, Pillow. Bundles OFL fonts, no compiled code. Full detail in the README."
