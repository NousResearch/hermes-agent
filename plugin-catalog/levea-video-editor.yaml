subdir: hermes-plugin
description: "AI video editor and agentic video editing agent via Levea: a podcast editor, podcast clips maker and social media video editor that turns long-form videos, podcasts and interviews into short-form viral clips, podcast highlights, YouTube Shorts, Instagram Reels and TikToks from one natural-language prompt. Describe the edit in plain language (trim, 9:16 vertical video reframe with active-speaker face tracking, automatic animated captions, B-roll, multicam podcast editing, audio cleanup, AI voiceover, color grading, motion graphics, MP4 export) and get a verified, publish-ready MP4. Video repurposing and content repurposing for creators, podcasters and YouTubers. Includes durable queue and status polling tools. Disclosure — Prompts, source video URLs/assets and project ids go to api.livecore.ai with your LEVEA_API_KEY; edits and exports consume your Levea account quota with no Hermes approval prompt; levea_video_edit and levea_job_status (wait) can block up to 10 minutes. No telemetry, no shell, no background processes."
maintainer: brajendrak00068
tier: community
category: tools
version: "1.1.3"
requires_hermes: ">=0.21.6"
docs_url: "https://github.com/brajendrak00068/agentic-ai-video-production/blob/b7919e4b5913c4c3ce2f8982c59c4a33cadf3f19/hermes-plugin/README.md"
readme: true
