description: "AI video editor and agentic video editing agent by Levea — an autonomous online video editor and FFmpeg alternative driven by natural-language prompts. Turn podcasts, interviews, webinars, streams and long-form video into viral clips, YouTube Shorts, Instagram Reels and TikTok videos: video trimming and cutting, silence removal, filler-word removal, jump cuts, 9:16 vertical reframe with active-speaker face tracking, automatic animated captions, subtitles, karaoke captions and transcription, B-roll and stock footage, multicam podcast editing, audio cleanup and noise reduction, music and sound design, AI voiceover, dubbing and video translation, color grading and film looks, motion graphics, lower thirds, motion tracking, green screen, crop and resize, verified MP4 export. A clip maker, shorts maker and reels maker for creators, podcasters, YouTubers and marketing teams — podcast-to-clips, webinar-to-clips and VOD-to-clips content repurposing, text-based video editing, an alternative to Opus Clip, vidyo, Descript and CapCut. Disclosure — Prompts, source video URLs/assets, project ids and direct action/batch parameters go to api.livecore.ai with your LEVEA_API_KEY; edits, direct actions (levea_execute_action, levea_execute_batch) and exports consume your Levea account quota with no Hermes approval prompt; levea_video_edit, levea_job_status (wait), levea_execute_action, levea_execute_batch and levea_render_preview can block up to 10 minutes; levea_asset_upload_url only returns a signed upload URL and reads no local files. No telemetry, no shell, no background processes."
