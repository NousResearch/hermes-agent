name: lightningai
repo: https://github.com/dinosauria123/hermes-lightningai-provider
sha: e4350ca278f8994322fc3b79a55a52e83388b7da
description: >-
  Lightning AI as a Hermes model provider (--provider lightning, lightning-ai, lightningai):
  OpenAI-compatible gateway at https://lightning.ai/api/v1, models fetched live from /models.
  Disclosure — registers one model provider at import and nothing else (no tools, hooks, commands
  or threads); chat requests and the model list go to lightning.ai through Hermes' own client with
  LIGHTNING_API_KEY (or LIGHTNING_AI_API_KEY), optional LIGHTNING_BASE_URL overrides the endpoint;
  the plugin itself opens no connections, reads/writes no files and starts no processes.
maintainer: dinosauria123
tier: community
category: models
requires_hermes: ">=0.21.5"
version: "1.0.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - LIGHTNING_API_KEY
