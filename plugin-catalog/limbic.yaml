description: "Local long-term memory for Hermes agents. Everything stays on your machine: an SQLite store plus bundled embedding and NLI models, no telemetry, no LLMs.

Limbic is designed on the physiological brain, opaque and organic. Memories strengthen or atrophy with use, corrections replace what they superseded — all deterministic background mechanisms, zero LLM calls.

Algorithmic forgetting keeps atrophied memories out of the database. Recall is calibrated: when nothing in memory is confident enough, it abstains instead of guessing, so the agent answers honestly rather than surfacing near-misses. First start downloads ~1 GB of pinned models once, then runs fully offline. PolyForm Noncommercial 1.0.0 (commercial use requires a separate license)."
