description: "Local long-term memory for Hermes agents: facts and preferences stay on your machine in one SQLite file with bundled embedding and natural language inference (NLI) models, decaying and reconsolidating organically with use and abstaining rather than guessing. No LLM calls.\n\nDisclosures\n- Network: ~1.0GB of pinned, sha256-verified ONNX models download from huggingface.co on first session start (Arctic 2.0 L int8 ~570MB; MiniLMv2 NLI ~430MB). Optional spaCy models pip-install ~14.5MB from spaCy's GitHub releases \u2014 version not hash-pinned.\n- Local files: everything lives under HERMES_HOME (limbic.db, backup VACUUM snapshots) except the model cache ~/.cache/limbic, which is pruned at every model load \u2014 files not in the pinned manifest are deleted, so never point cache_dir at a shared folder. Faded facts are marked and removed only after a 7-day review window, never below the correction trust floor (0.30); room-shaped/platform ids are refused at the memory boundary (rejected_room_scoped) rather than minted into buckets.\n- forget: user-scoped two-step (list candidates, pick one) that appends a hash-only receipt (sha256, length, user id, fact id) to limbic.db.deletions.jsonl beside the database.\n- Operator CLI adds entity hygiene: hermes limbic entities --gc (dry-run default, --apply commits; counts SQL re-measured) — agent surface is exactly remember, recall, forget \u2014 no shell commands, no background services, no stored credentials, no telemetry."
