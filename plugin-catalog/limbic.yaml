description: "Self-organising memory provider (MemoryProvider ABC): local SQLite (WAL) with sqlite-vec KNN + FTS5 hybrid recall, adaptive trust scoring, activation maturation, interference-based forgetting, NLI-based correction detection and synaptic atrophy. No LLM cost — all lifecycle mechanisms are deterministic. Tools (remember/recall) and lifecycle hooks dispatch via the MemoryManager from the registered provider — this entry registers a MemoryProvider only, so provides_tools/provides_hooks are empty. Disclosure — on first use downloads ~1.1GB of ONNX models (Arctic Embed 2.0 L int8 embedding, ~570MB; MiniLMv2 NLI, ~430MB) from huggingface.co at pinned commits with hash checks into ~/.cache/limbic/ (outside HERMES_HOME); spaCy NER models are not downloaded and must be installed manually for entity extraction; memory stays local in limbic.db under HERMES_HOME, and hermes backup adds VACUUM snapshots under HERMES_HOME/backups; no telemetry. Since 0.6.0 each store records the embedder identity that produced its vectors (the embedder stamp); after an embedder-changing update stats surfaces stale_embedder=true until the bundled reindex re-embeds, so upgrades can't silently degrade retrieval. PolyForm Noncommercial 1.0.0 (commercial use requires a separate license)."
