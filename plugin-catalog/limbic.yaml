description: "Local long-term memory for Hermes agents: facts and preferences stay on your machine in one SQLite file with bundled embedding and natural language inference (NLI) models, decaying and reconsolidating organically with use and abstaining rather than guessing. No LLM calls.\n\nDisclosures\n- Network: first session start downloads ~1.0GB of pinned ONNX models from huggingface.co (Arctic Embed 2.0 L int8, ~570MB; MiniLMv2 NLI, ~430MB), pinned commits, sha256-verified.\n- Local files: reads and writes limbic.db and limbic_params.json under HERMES_HOME; ships the English spaCy pipeline (en_core_web_sm, ~15MB of model data) in the plugin folder; the model cache at ~/.cache/limbic (outside HERMES_HOME, USERPROFILE\\cache\\limbic on Windows) is pruned at every model load - files not in the pinned manifest are deleted, including unrelated files if a cache dir points at a shared folder.\n- Optional spaCy models: hermes limbic languages --set lang pip-installs ~14.5MB packages from spaCy's GitHub releases into Hermes's own Python environment (version not hash-pinned); hermes limbic setup pre-downloads both ONNX models.\n- Data lifecycle: memories whose trust score decays to zero are deleted automatically; hermes backup adds VACUUM snapshots under HERMES_HOME/backups.\n- Agent-facing tools are remember, recall and forget: forget lists candidate facts, deletes the one fact id the user picks, scoped to the current user, and appends a hash-only receipt (sha256, length, user id, fact id) to limbic.db.deletions.jsonl beside the database.\n- No shell commands, no long-running background services, no stored credentials, no telemetry."
