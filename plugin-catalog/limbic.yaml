description: "Self-organising memory provider (MemoryProvider ABC): local SQLite (WAL) with sqlite-vec KNN + FTS5 hybrid recall, adaptive trust scoring, activation maturation, interference-based forgetting, NLI-based correction detection and synaptic atrophy. No LLM cost — all lifecycle mechanisms are deterministic. The optional inline chat recall indicator is off by default (recall_indicator in limbic.yaml) and memory injection works identically either way. Recall is confidence-gated: when nothing clears the calibration floor, recall abstains (no_confident_match) instead of surfacing near-misses, and the agent answers from what it knows without attributing anything to memory. Tools (remember/recall) and lifecycle hooks dispatch via the MemoryManager from the registered provider — this entry registers a MemoryProvider only, so provides_tools/provides_hooks are empty. Disclosure — on first primary session start downloads ~1.0GB of ONNX models (Arctic Embed 2.0 L int8 embedding, ~570MB; MiniLMv2 NLI, ~430MB, on first contradiction check) from huggingface.co at pinned commits with hash checks into ~/.cache/limbic/ (outside HERMES_HOME); at every model load, every file in those cache folders that is not in the pinned manifest is deleted — including unrelated files if you point embedding/nli cache_dir at a shared folder — which reclaims stale orphans from prior versions (e.g. an older fp32 cache of ~2.2GB); the memory database is never touched; spaCy NER models are not downloaded and must be installed manually for entity extraction; memory stays local in limbic.db under HERMES_HOME, and hermes backup adds VACUUM snapshots under HERMES_HOME/backups; no telemetry. Stores created or reindexed on 0.6.0+ record the embedder that produced their vectors and report stale_embedder=true after an embedder change until `hermes limbic reindex`; stores from 0.5.x keep serving their fp32 vectors unflagged until reindexed. PolyForm Noncommercial 1.0.0 (commercial use requires a separate license)."
