description: "Local long-term memory for Hermes agents: facts and preferences stay on your machine in one SQLite file with bundled embedding and natural language inference (NLI) models, decaying and reconsolidating organically with use and abstaining rather than guessing. No LLM calls.\n\nDisclosures\n- Network: downloads ~1.0GB of pinned ONNX models from huggingface.co on first session start (Arctic Embed 2.0 L int8, ~570MB; MiniLMv2 NLI, ~430MB), verified against pinned commits and hashes; nothing else leaves the machine.\n- Local files: reads and writes limbic.db and limbic_params.json under HERMES_HOME, plus a model cache at ~/.cache/limbic (outside HERMES_HOME); at every model load it deletes files in those cache folders that are not in the pinned manifest.\n- No shell commands, no long-running background services, no stored credentials, no telemetry."
maintainer: dyiapanis
