name: lineage
repo: https://github.com/P0GL0L/hermes-lineage
sha: 61de70980f4322838a9b53f4802623146f1046c2
description: "Provenance for everything the agent produces: every file Hermes writes gets a receipt (what it was made from — files read, pages fetched, searches run — by which tool call, model and agent, with SHA-256 hashes) and a Desktop page draws the graph back to the sources, with observed / evidenced / inferred links labelled, never blended. Verify a file and its sources against recorded hashes; export Mermaid/DOT. Disclosure — hooks only (post_tool_call, pre/post_llm_call, post_api_request, api_request_error, post_auxiliary_call, subagent_start/stop, on_session_start/end); no tools, middleware, LLM calls or credentials; runs no commands. Hashes files the agent read or wrote, scans files the agent wrote (bounded text scan) and stats the working tree once after terminal/execute_code calls; receipts only for files the agent produced. Writes under plugin-data/lineage/ (SQLite, install.key) and, on request or with sidecar: true, <file>.receipt.json beside artifacts. Stores redacted, bounded previews of prompts, tool arguments and results (store_previews: false keeps ids and hashes only). Network only on an explicit `verify --refetch` (GET to the recorded source URLs, public hosts only; redirects are followed). No telemetry."
maintainer: P0GL0L
