description: "Plan, build and run LinkedIn and email outreach in LinkedCamp through LinkedCamp's hosted MCP server (Streamable HTTP at https://mcp.linkedcamp.com/mcp, OAuth sign-in with the account's API key, no keys in config): campaigns, audience search URLs, multi-step sequences, leads, unified inbox and AI-drafted replies, sending-account health, analytics, reply agents, and agency sub-accounts. Bundles the linkedcamp-outreach workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: every tool call goes to mcp.linkedcamp.com and acts on the user's LinkedCamp account. OAuth uses pinned mcp-remote@0.1.49 over npx stdio, so Node.js 20.18.1+ and npm are required; mcp-remote stores tokens under ~/.mcp-auth and opens the browser for the first sign-in. Some tools reach real people (campaign_launch starts outreach, message_send delivers immediately); the package marks the server untrusted, so Hermes asks before every write and refuses writes in unattended runs. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
