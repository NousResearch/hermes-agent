subdir: hermesPlugin
description: "Your agent, working your DMs the way you would. Ask Hermes who is waiting on a reply across X, Discord, Slack, Instagram and Reddit, read the whole thread, and get a draft in your own voice that sends only after you approve it. A log tab in the dashboard shows who is waiting, every account's session and today's sends against its daily limit. LinkedIn support is currently limited to a session-status check. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/) plus a dashboard tab. Disclosure — starts the separately installed logMcp executable as a long-running stdio process; log makes network calls directly to the social platforms the user signed into and reads account sessions, cookies and message history from its own ~/.logCli data directory. Write tools can send replies, DMs and posts, and can like or follow as the user's account; the server is marked untrusted so Hermes asks for approval. The dashboard tab's backend reads, read-only, log's session.json, governor_state.json and synced X inbox (inboxSync.json, including message previews) under ~/.logCli; it makes no network call, runs no command, writes nothing and never reads cookies. The optional router hook (logHooks, a pre_llm_call hook that runs log's own hook script before each model call) is a separate native plugin that `log launch --setup` installs from the same folder and the user enables by hand; it is not part of this entry. The MCP tool set comes from the user's installed log version at runtime and is not covered by this plugin's pinned commit."
