name: listeningkit-log
title: log by ListeningKit
repo: https://github.com/deepmroot/listeningkit-log
sha: 7c011e6bef6a7a806c002e89586c9e31026cb47f
description: >-
  Your agent, working your DMs the way you would. Ask Hermes who is waiting on
  a reply across X, Discord, Slack, Instagram and Reddit, read the whole thread,
  and get a draft in your own voice that sends only after you approve it.
  LinkedIn support is currently limited to a session-status check. Portable
  Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration
  only. Disclosure: starts the separately installed logMcp executable as a
  long-running stdio process; log makes network calls directly to the social
  platforms the user signed into and reads account sessions, cookies and
  message history from its own ~/.logCli data directory. Write tools can send
  replies, DMs and posts, and can like or follow as the user's account; the
  server is marked untrusted so Hermes asks for approval. The MCP tool set
  comes from the user's installed log version at runtime and is not covered by
  this plugin's pinned commit.
