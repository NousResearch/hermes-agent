name: live-translate
title: Live Translate
repo: https://github.com/WestWaters/hermes-live-translator
sha: ac49f1ca296ec7eb9631ead8e61dcd23da77c771
description: "Real-time speech-to-speech translation on your own computer: anyone speaks in any language and you hear them in yours, in their own voice, about 2-3 seconds behind. Hears ~100 languages (Qwen3-ASR + Whisper), translates between 201 (Qwen3.5-4B, a local server, a subscription, or the model Hermes already uses through ctx.llm), and speaks with the speaker's cloned voice in 23 languages and natural voices in 600+. One-way, two-way conversations and meetings/streams through a virtual audio device (Zoom, Meet, Teams, Discord, OBS, with OBS closed captions viewers can switch on); echo cancellation, background voices ignored, several speakers each with their own language and voice. Tools translate_start/stop/status/languages, /translate, hermes translate setup|start|file|serve|languages|devices, and an agent skill; optional desktop tray app (separate download). Disclosure — while translating it listens to the microphone or audio input you choose and plays to the output you choose; it never starts from a chat app or a scheduled job unless you enable allow_remote_start. Voice cloning uses a 5-second sample of each speaker on this computer only; temporary copies are deleted when the session stops. Each session's captions are saved to plugin-data/live-translate/sessions/*.jsonl. hermes translate setup builds a separate Python environment with uv (plus three voice-model environments on Windows/Linux) under plugin-data/live-translate, installs packages from PyPI, PyTorch's index (Windows/Linux) and llama.cpp's prebuilt-wheel index (abetlen.github.io), installs uv from PyPI into the plugin's data folder if it is missing, and downloads 6-9 GB of model weights from their official Hugging Face repos into the standard Hugging Face cache. While translating it runs the engine and voice-worker processes (stopped on Stop or when the session that started them ends) and a local server on 127.0.0.1:7865 only, protected by a per-run token and an Origin check. No network while translating with built-in or local models; a cloud model or voice you choose receives the session's text or audio with your key, read only through Hermes's secret store. No telemetry. Licences: Apache-2.0/MIT models by default; OmniVoice (best preset) is CC-BY-NC-4.0; on CPU-only machines Kokoro uses espeak-ng (GPL-3.0)."
maintainer: WestWaters
tier: community
category: voice
