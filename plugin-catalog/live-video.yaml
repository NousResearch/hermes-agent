subdir: ""                  # the plugin is the repository root
title: Live Video
description: "Give Hermes eyes in a live voice conversation. Point your phone at the room, talk normally, and the agent answers in duplex voice whilst the camera streams: ask what it can see and it answers from the current frame; ask to be told when something comes into view and the relay checks the frames for 90 seconds, verifies a sighting against the held image before claiming it, and says it once. The six-action tool starts the relay, hands you the URL to open, reads a session's transcript back to the agent, and replays what it saw — measured first-token latency was 0.57 s and 1.03 s across two turns on a modest VPS. Disclosure — audio and camera frames stream from your browser to a relay this plugin starts on port 8098 (loopback by default; a LAN bind is opt-in and protected by a token minted per start), and from there to generativelanguage.googleapis.com (Gemini Live, which also answers watch checks) using GEMINI_API_KEY read from Hermes' secret scope; `start` spawns `node server.js` from the plugin's own directory as a background process, which spawns a Python frame-change tracker (numpy, Pillow, torch); the tool reads the relay's transcript.log and server.log back to the agent; watch verification spends the key's quota. No telemetry, and the key is never written to disk."
maintainer: dacheah
tier: community
category: voice
requires_hermes: ">=0.22.5"
version: "1.3.8"
