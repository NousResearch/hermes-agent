known_issues:
  - "The frame tracker is a change detector, not an object detector: with the heartbeat disabled it can miss a small object arriving in an otherwise still scene."
  - "The verifier takes 3–7 s per look, so a sighting is voiced a few seconds after it appears; one watch window at a time, 90 s by default."
  - "Windows: the relay path is exercised there (spawn, health, tree kill), but not yet through the Hermes plugin loader."
capabilities:
  provides_tools:
    - live_video
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - GEMINI_API_KEY
