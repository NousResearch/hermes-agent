sha: f13a5af37c3322b8de5fca6d193ab20ec46189b8
version: 0.6.2
description: 'Create a provisional Live2D character from a brief with complete image parts, local cutout, placement, an experimental Umamo/JDK rig and Core motion review; also inspect and adjust a copy of an existing model. Disclosure: on first use it scans PATH and the hardware (read-only; it reports only whether image-service keys exist, yes or no) and asks which routes to use. It runs the JDK, the Kotlin/Umamo classpath (Umamo 0.5.0), the Python with Playwright and the Cubism viewer folder that you set in the plugin settings (the model cannot name a program, classpath or command), FFmpeg and a local headless browser, each with a minimal environment; the host image tool may use its configured provider. Optional official sample download requires the user’s licence acceptance. No SDK, Core, viewer, sample model, model layers or textures are bundled; the approved thumbnail contains character artwork. XY head turns, independent limbs and polished eyes are not provided.'
maintainer: flabanabba8
tier: community
