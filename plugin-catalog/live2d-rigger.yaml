name: live2d-rigger
title: Live2D Rigger
repo: https://github.com/flabanabba8/live2d-rigger
sha: 657345a77bd59088e66fdbaa2aed58007d16b9ce
version: 0.5.0
description: 'Create a provisional Live2D character from a brief with complete image
  parts, local cutout, placement, an experimental Umamo/JDK rig and Core motion review;
  also inspect and adjust a copy of an existing model. Disclosure: runs the user-configured
  JDK and Kotlin/Umamo compiler, FFmpeg and a local headless browser; the host image
  tool may use its configured provider. Optional official sample download requires
  the user’s licence acceptance. No SDK, Core, viewer, sample model, model layers
  or textures are bundled; the approved thumbnail contains character artwork. XY head
  turns, independent limbs and polished eyes are not provided.'
maintainer: flabanabba8
tier: community
category: tools
requires_hermes: '>=0.22.0'
docs_url: https://github.com/flabanabba8/live2d-rigger/blob/657345a77bd59088e66fdbaa2aed58007d16b9ce/README.md
