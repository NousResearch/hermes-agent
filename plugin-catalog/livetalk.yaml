name: livetalk
repo: https://github.com/cruzlxyz/livetalk
sha: 9a342b2eeb0413be3a1518a2511c9b59f15d53ea
description: >-
  Realtime duplex voice chat with the Hermes agent — a composer mini-bar for the Hermes
  desktop app with three interchangeable speech providers: Gemini Live, ElevenLabs Realtime
  and Grok Voice. The voice model answers small talk itself and delegates real work through a
  declared `talk` tool to a dedicated Hermes agent session; a second `recall` tool searches
  earlier turns of that session. One provider-aware Settings page holds the per-provider
  model, voice and language (each provider keeps its own values, and a voice or model change
  opens a fresh session rather than replaying the old configuration). Full-proxy architecture:
  the plugin backend owns the upstream WebSocket and reads the user's key through
  `agent.secret_scope.get_secret` (requires_env GOOGLE_API_KEY, ELEVENLABS_API_KEY,
  XAI_API_KEY — only the selected provider's key is needed); the desktop UI only talks to
  localhost. No Hermes agent tools registered; dashboard tab hidden. Disclosure — pressing
  Start captures microphone audio and streams it from the local backend to the selected
  provider (generativelanguage.googleapis.com, api.elevenlabs.io or the xAI realtime endpoint);
  input/output transcripts are held in backend memory for the session only; a Gemini session
  resumption handle is written to .resume.json and an xAI conversation id to .resume-grok.json
  inside the plugin's install directory; settings live in config.yaml under
  plugins.entries.livetalk.settings. Formerly gemini-live-bridge — renamed for the
  provider-neutral roadmap; the old repository URL redirects.
maintainer: cruzlxyz
