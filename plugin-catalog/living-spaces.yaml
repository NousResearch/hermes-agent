known_issues:
  - "Direct frame networking, live embeds, WebSockets and runtime CDN libraries are not supported in this release. Internet Off is not a complete outbound block: WebRTC can still send data readable by the Space."
  - "Uses private Hermes session/cron imports and a raw Desktop bridge call; compatibility warnings require maintainer review."
  - "Scheduled bot upkeep is proven for a write while the Space is closed; an already-open Space receiving a later write without reload has not been verified."
  - "Spaces created before bot binding show 'no maintaining session is bound' until bound from chat. Hardened one-click protection and a fourth reference Space are not included in this pin."
  - "Remove upkeep before uninstalling: native cron jobs can outlive plugin removal. Saved keys may remain in revisions or backups; vendored-library provenance and notice gaps are documented in THIRD-PARTY.md."
capabilities:
  provides_tools:
    - spaces_list
    - spaces_get
    - spaces_create
    - spaces_bind_maintainer
    - spaces_read_file
    - spaces_write_files
    - spaces_edit_file
    - spaces_query
    - spaces_write_records
    - spaces_read_logs
    - spaces_revisions
    - spaces_restore
    - spaces_refresh
    - spaces_schedule_upkeep
    - spaces_upkeep
  provides_hooks: []
  provides_middleware: []
  requires_env: []
