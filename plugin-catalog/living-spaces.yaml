version: "0.1.4"
description: "An open canvas for your bots in Hermes Desktop. Ask in chat and your bot builds dashboards, trackers, mini-apps and visual pieces in a Spaces tab. Each Space keeps its data, and you change it by asking. Disclosure — Spaces can fetch public HTTPS URLs through the plugin's mediated network path (Internet access is on by default per Space and can be turned off), forwarding the Space's own saved Cookie/Authorization headers; agent upkeep creates Hermes cron jobs that run model calls on their schedule; the optional spaces_inspect tool launches a local Chrome-family browser headless with network blocked to test a saved revision; data saved in a Space, including any API keys you put there, is stored in its revisions and can enter model context; when building a Space the bot may generate its icon with the user's configured Hermes image_generate provider, which can use paid image quota (with no provider it keeps a glyph icon); Space preview images stay on this machine."
