# Author: Living Spaces contributors. License: MIT (repository-root LICENSE).
description: "An open canvas for your bots in Hermes Desktop: build dashboards, trackers, mini-apps and visual pieces from chat, keep their data, and change them through chat. MIT-licensed. Disclosure — generated apps run in sandboxed frames; mediated public HTTPS can send Space data and user-supplied API keys to third parties. Keys saved as Space data are not encrypted by the plugin. Native Hermes cron provides upkeep; agent jobs use model calls and enabled tools. No telemetry."
maintainer: akinduroifedayo
tier: community
category: desktop
requires_hermes: ">=0.23.1"
docs_url: https://github.com/akinduroifedayo/living-spaces/blob/8134be424b5a5756a89278e729ab537475f45155/src/living-spaces/README.md
