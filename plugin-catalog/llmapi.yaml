subdir: llmapi
description: >-
  LLM API (llmapi.ai) as a Hermes model provider (`--provider llmapi`, alias `llm-api`, or LLM API
  in `hermes model`): Claude, GPT, Gemini, Kimi, DeepSeek, GLM, Qwen and more on one key, each on the
  API it works best on. Claude runs over the Anthropic Messages API (so Hermes' prompt caching
  applies), GPT-5 and later over the Responses API, everything else over Chat Completions. The picker
  lists LLM API's tool-capable chat models with 64K+ context from its public catalog, which also
  supplies context windows, image input, per-model reasoning levels and list prices; catalog aliases
  resolve in /model. Gateway errors (out of credits, spend caps, model not allowed for the key) map
  onto Hermes' fallback instead of a key rotation; /usage shows the credit balance and monthly cap;
  per-request cost is the billed amount when the gateway reports it, else a list-price estimate.
  Maintained by LLM API. Disclosure — registers one model provider at import and nothing else (no
  tools, hooks, commands or processes). Prompts, tool schemas and results, attached images and
  LLMAPI_API_KEY go to https://api.llmapi.ai/v1 (or LLMAPI_BASE_URL) through Hermes' own clients, and
  LLM API forwards each request to the upstream vendor serving the model. The plugin's own requests
  are GET /v1/models (public, sent without the key, cached in memory for an hour, sometimes on a
  short-lived background thread) and GET /v1/credits with the key for /usage and the picker's account
  usage; neither follows redirects. The first request of each user turn carries `X-Source:
  hermes-agent` and `X-LLMAPI-App-Id: hermes-provider-llmapi`, used only to count traffic from this
  plugin. No other telemetry, no files read or written, no stored credentials.
maintainer: llmapi-ai
