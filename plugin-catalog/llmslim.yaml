description: "Context engine that compresses older tool output and turns locally with LLMSlim instead of asking a model for a summary: no LLM call, deterministic output, and the start of the prompt is sent unchanged, so prompt caching keeps working. Select it with context.engine: llmslim. Disclosure: installs llmslim==0.11.2 from PyPI (with numpy, scikit-learn and jsonschema); registers no tools, hooks or middleware; makes no network calls, runs no shell commands, needs no credentials, writes no files and sends no telemetry; reads its settings from config.yaml through Hermes's config loader. Token counts use a character estimate unless tiktoken is already installed in Hermes's environment, in which case tiktoken may download its encoding file once."
maintainer: Thanatos9404
