known_issues:
  - "Needs the load-lock CLI >= 1.7.0: `npm install -g @aron98/load-lock` (Node >= 20). Without it every tool returns a clear error; the auto_install setting (off by default) can fetch the pinned version with npx instead."
  - "The Desktop pane and status chip ship disabled, like every Desktop half: turn them on once under Capabilities ▸ Plugins."
  - "Windows has a named-pipe transport that is unit-tested but not yet verified on a Windows machine."
