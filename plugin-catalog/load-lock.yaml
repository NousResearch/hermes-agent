sha: 3cf4f658bb745e02a1b1783c9a76a22e72ac0220
subdir: plugins/hermes
title: Load Lock
description: "A machine-wide load broker for coding agents: Hermes, Claude Code, OpenCode, Codex, Cursor and any MCP client share one heavy-work budget, so builds and test suites take turns instead of thrashing the machine. 19 load_lock_* tools (acquire, queue, offers, honest waits, background jobs that release their permit on exit, machine inspection), a policy brief at session start, a Load Lock dashboard tab, and a Desktop pane, status-bar chip and palette command. Disclosure — every tool shells out to the local load-lock CLI (Node >= 20, installed separately with npm), which auto-starts a per-user background daemon on a Unix socket with state in ~/.local/state/load-lock; load_lock_run_with_permit runs the command the agent passes in its own process group, and a pre_tool_call hook sends any command Hermes's dangerous-command detector flags (imported from tools.approval_detection) to the same approval gate as the terminal tool; machine inspection reads CPU, memory, load and cgroup limits; the optional auto_install setting (off by default) fetches the pinned npm package with npx, a network call to the npm registry; background work: the daemon, a heartbeat thread and job registry in the plugin process, and one idle `load-lock events --follow` tail in the process serving the dashboard; no telemetry, no credentials, no other network calls."
maintainer: aron98
tier: community
category: tools
version: "1.7.0"
requires_hermes: ">=0.23.0"
