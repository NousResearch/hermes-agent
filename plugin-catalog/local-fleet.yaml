title: Local Fleet
description: 'Your local inference fleet, operated from Hermes Desktop: routing across your own boxes (DGX Spark /
  GB10, Ollama, vLLM, LiteLLM, clusters behind one endpoint). Probes each box, makes the least busy healthy one the
  primary model, falls back to smaller models on smaller boxes, then to your cloud model, and switches back when a box
  recovers. Why-this-box inspector, flight recorder, outage rehearsal, drift detection, readiness, savings with its
  working, doctor. Optional: subagents across boxes (delegation backend fleet), side tasks on the fleet
  (auxiliary.<task>), keep the routed model loaded, private inference (primary, fallback chain, side tasks and
  subagents held to your boxes, failing rather than using cloud; not air-gapping). Writes model.*, fallback_providers,
  and on request delegation.backend and auxiliary.<task>; private on removes non-local fallback entries and puts them
  back on off; hermes fleet restore puts the primary back. Network: HTTP only to the boxes you register. Observer hooks
  record per-call endpoint, model, tokens and duration (never content) in its data dir. Read-only tools plus an
  Ollama-only model pull; no remote command execution.'
