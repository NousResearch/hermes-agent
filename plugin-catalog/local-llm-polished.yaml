subdir: local-llm-polished
description: >-
  Customizable transcript enhancement on local speech-to-text (local_llm_polished): faster-whisper
  or sherpa-onnx Parakeet V3 with long-audio chunking, then an optional bounded LLM pass whose
  instructions come from a custom skill (post_processing.skill), an inline prompt or the default,
  falling back to the raw transcript on failure. Disclosure — register() adds one transcription
  provider; audio is decoded locally, but post-processing is on by default and sends the transcript
  text to the LLM Hermes routes the stt_polish task to (remote unless pointed at a local endpoint),
  using Hermes' existing credentials via the auxiliary client; reads the body of the configured
  SKILL.md (max 64 KiB, never executed, no URL fetch); runs ffmpeg/ffprobe for resampling, speed
  changes and chunking; the opt-in Parakeet backend reads a local model export and on first use
  installs pinned sherpa-onnx and numpy from PyPI into ~/.hermes/plugin-runtimes/local-llm-polished/
  (auto_install_deps: false disables); no tools, hooks, background processes, telemetry or stored
  credentials.
