sha: 31e1c1c569bdca3f5829933207923f06c89c144b
description: >-
  Mac apps for Hermes through a separately installed LMCP app: Apple Mail,
  Microsoft 365 mail, Calendar, Teams, Slack, OneDrive, Office files, a
  logged-in browser and the terminal, with a skill for scoping tools on
  unattended jobs. Requires LMCP from local-mcp.com; no automatic install or
  updates. Disclosure — a thin launcher for the LMCP app by Colibird (same
  organization as this plugin); the plugin holds no logic or credentials and
  downloads nothing, but a shell launcher starts the server bundled inside that
  separately installed app (/Applications or ~/Applications), which reads
  local app data (Mail index, Teams cache, calendars), can send mail and
  messages, run terminal commands and drive a browser, uses an unofficial
  client for WhatsApp and updates itself outside Hermes. Tools that send or
  can't be undone require a confirm step in LMCP rather than Hermes approval.
  LMCP_DISABLE_TELEMETRY=1 turns off usage telemetry in the server process
  this plugin starts. The plugin's launcher also starts the LMCP app, which
  sends its own telemetry, plus a minimal liveness heartbeat (computer id,
  version, licence) that is not disabled.
