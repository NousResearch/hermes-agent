name: local-scout
repo: https://github.com/Angerosteles/local-scout
sha: 5f95fb967875e4c17eaa7dc5130e9b489be1d275
description: "Local privacy and safety layer for Hermes. Detected sensitive data (e-mails, phones, cards and CVVs, IBANs, SSNs, PESEL numbers, addresses, API keys, and passwords, 2FA codes and PINs without a known format; person names in prompts when turned on) is replaced with one-way placeholders on your machine before Hermes sends a request to a model: user prompts, file and terminal output, MCP tool results, tool-call arguments and auxiliary calls such as title generation, in CLI and gateway sessions. Also flags prompt injection in what the agent reads (flagged, not blocked), offers optional calibrated local triage, an optional basal method through a basal engine you run locally, and local Insights. Disclosure — enabling the plugin turns on masking of the data above on a fresh profile (person names are off until you choose `/scout names basic|deep`); `/scout` in a local chat or `hermes scout` shows and changes settings, `/scout masking off` turns it off and the choice persists; from messaging gateways `/scout` only shows status. With masking on it rewrites outgoing model requests on supported paths (auxiliary calls best-effort), tool-call arguments and tool/terminal/MCP results to replace detected data with one-way placeholders, adds a short system-prompt section and a `masking` skill telling the model to keep placeholders, appends a LOCAL_SCOUT_ALERT line (categories only, never values), adds a one-line note under a reply naming the data types detected (never values; `/scout note off` hides it), passes images and other non-text content through unscanned, and replaces a user message (or, if the whole scan fails, the entire request) with a withheld notice unless you set `scout configure --guard-mode open` for that profile; it stores no prompt contents or detected values, saves explicit settings locally and writes Insights counters only when Insights is on; local answers and learning are opt-in; a name in the first message of a Discord thread can appear in the Hermes thread title; with the optional answer grant it answers confident triage tickets locally and makes no main model call for them; the optional basal engine is reached on loopback only and receives unmasked candidate lines for password checks; it reads the profile config.yaml (title-generation setting only) and the history/dataset files you name in the CLI; state stays in its plugin-data directory, apart from export files you name in the CLI and a launcher link in the user cache directory; no other network calls, shell commands, background processes or stored credentials."
maintainer: Angerosteles
tier: community
category: tools
requires_hermes: ">=0.23.0,<0.24.0"
platforms: [linux, macos]
docs_url: https://github.com/Angerosteles/local-scout#readme
version: "1.8.0"
capabilities:
  provides_tools: [scout_handle, scout_calibrate, scout_inspect, scout_recipes, scout_choose, scout_train, scout_predict, scout_report, scout_calculate]
  provides_hooks: [post_tool_call, pre_api_request, pre_auxiliary_call, post_api_request, post_auxiliary_call, transform_llm_output, transform_tool_result, transform_terminal_output]
  provides_middleware: [llm_request, llm_execution]
  requires_env: []
