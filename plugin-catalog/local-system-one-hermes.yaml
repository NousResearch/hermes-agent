name: local-system-one-hermes
title: Local System One
repo: https://github.com/NMTZ-z/system-one-benchmark-lab
sha: da9f0d474aa4d5d7baa19b13d338cc1d8a0cbd8e
subdir: integrations/hermes/local-system-one-hermes
description: >-
  Local System One observes selected Hermes decisions through a separate local
  sidecar. Installation defaults to OFF; the first Shadow enables Search only.
  Shadow does not change provider requests. The default loopback sidecar uses a
  private per-profile token; processes owned by the same user may access it.
  Search can send a bounded task and recent context to the sidecar. Other Gates
  require opt-in and may send bounded response or failure context. A remote
  HTTPS sidecar requires explicit configuration and receives no local token;
  remote-sidecar security is outside this pilot's verified support.
  Canary request changes require separate explicit acknowledgement; production
  Canary has not been authorized or accepted in this pilot.
maintainer: NMTZ-z
tier: community
category: automation
requires_hermes: ">=0.21.4"
version: "0.10.0"
docs_url: https://github.com/NMTZ-z/system-one-benchmark-lab/tree/da9f0d474aa4d5d7baa19b13d338cc1d8a0cbd8e/integrations/hermes/local-system-one-hermes
readme: true
platforms: [macos]
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - post_llm_call
    - post_tool_call
    - on_session_end
  provides_middleware:
    - llm_request
  requires_env: []
