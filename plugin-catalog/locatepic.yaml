description: "Solar shadow azimuth and latitude geometry calculator, regional driving side and road marking encyclopedia, country calling code and ccTLD lookup, electrical plug/grid frequency reference, and EXIF GPS metadata tag inspector through LocatePic's official MCP server (Streamable HTTP at https://locatepic.com/api/mcp, no sign-in, no keys in config). Bundles the locatepic workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local runtime code, binaries, hooks, telemetry or self-updater; every tool call goes over HTTPS to locatepic.com/api/mcp with only the geometric angle, UTC timestamp or infrastructure clue query arguments. All 8 tools are public, free, and annotated read-only (readOnlyHint: true, destructiveHint: false). The package marks the server untrusted (trust: untrusted), so Hermes asks before any tool not annotated read-only and refuses them in unattended runs. The remote tool inventory is served at runtime and is not covered by the pinned sha."
