name: long-conversations
version: "0.1.0"
repo: https://github.com/cspears32/hermes-long-conversations
sha: 1a8dc52b7ae610f6db2d2ab0a7e7133b3a199807
description: "Persistent long-term conversations across session boundaries via structured handoff briefs and token monitoring. Disclosure — stores handoff briefs (topic, work in progress, decisions, open questions, next step; in aggressive mode auto-built from the first 200 characters of recent user messages) as plain JSON under HERMES_HOME/long-conversations/ and injects the pending brief into the first turn of the next session for the same chat or user (CLI briefs stay in one local scope and are not shown to messaging users); the model can change the plugin's settings with long_conv_config_set; an opt-in HERMES_LONG_CONV_BETA_LOG writes a local event log; no network calls."
maintainer: cspears32
tier: community
category: tools
requires_hermes: ">=0.21.6"
docs_url: https://github.com/cspears32/hermes-long-conversations#readme
platforms: []
capabilities:
  provides_tools:
    - long_conv_handoff
    - long_conv_load
    - long_conv_list
    - long_conv_config_get
    - long_conv_config_set
  provides_hooks:
    - pre_llm_call
    - post_api_request
    - on_session_start
    - on_session_end
  provides_middleware: []
  requires_env: []
