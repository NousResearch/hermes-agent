description: "Health coaching loop for Hermes: 9 config-free skills, 9 typed tools, and the weekly-crunch automation blueprint (outcome ledger, stress triage, biometric recovery/rebound verification). Local-first, stdlib-only, no credentials. Disclosure — stores health and coaching data in plaintext on this machine (`<HERMES_HOME>/scripts/.state/insight-ledger.jsonl` and the configured `health.db`, by default `<HERMES_HOME>/data/health.db`), and health values the tools return are sent to your active model provider."
maintainer: pridiuksson
tier: community
category: tools
