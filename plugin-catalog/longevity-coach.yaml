  provides_tools:
    - coach_ledger_add
    - coach_ledger_resolve
    - coach_ledger_report
    - coach_ledger_reflect
    - coach_stress_triage
    - coach_recovery_record
    - coach_recovery_verify
    - coach_recovery_report
    - coach_run_crunch
  provides_hooks: []
  provides_middleware: []
  requires_env: []
