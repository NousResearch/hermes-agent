description: >-
  looot gives Hermes one sign-in and one prepaid balance for 2,500+ data API endpoints from 90+ providers:
  work emails and phones, company and people search, Google results, web pages as markdown, news, local
  businesses. Portable Agent Plugins v1 package with the hosted MCP server (remote streamable-http, OAuth
  2.1 with dynamic client registration) and 21 skills. Disclosure: network calls go only to
  https://api.looot.ai; the run tool spends the user's prepaid balance, so the package declares the server
  trust untrusted and Hermes asks before each non-read-only call.
maintainer: looot
