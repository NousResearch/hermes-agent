name: looprunner
repo: https://github.com/itxLikhith/looprunner
sha: 1e56db78508be5d250288c26f17659117025d954
description: >-
  Set-and-forget autonomous QA loop runner for any repository. Runs your verify
  command each round, diagnoses failures with the host LLM, applies a minimal fix
  on a branch, opens a PR, and stops itself when it stalls or runs out of budget.
  Can watch a repository's issues and dispatch goal-mode kanban cards, checkpoint
  a stalled stage for a later retry, and gate PRs on a security review. Accepts
  project names instead of absolute paths and detects the verify command itself.
maintainer: itxLikhith
tier: community
category: automation
requires_hermes: ">=0.22.0"
version: "0.18.1"
tags: [automation, kanban, qa, testing, ci, security, issues]
known_issues:
  - "Optional: the heavy multi-agent security scan needs the hermes-security plugin installed. LoopRunner declares it as an advisory dependency and falls back to a built-in LLM review when it is absent."
capabilities:
  provides_tools:
    - loop_start
    - loop_tick
    - loop_verify
    - loop_status
    - loop_history
    - loop_analyze
    - loop_commit
    - loop_revert
    - loop_watch
    - loop_scan_issues
    - loop_security
    - loop_security_card
    - loop_detect
    - loop_checkpoint
    - loop_recommend
    - loop_pause
    - loop_resume
    - loop_stop
  provides_hooks:
    - pre_llm_call
    - post_tool_call
    - pre_tool_call
  provides_middleware: []
  requires_env: []
