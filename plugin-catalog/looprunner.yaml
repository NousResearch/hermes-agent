name: looprunner
repo: https://github.com/itxLikhith/looprunner
sha: 40505495fb8b04ca9d1d1522e1e78ec4ab89dc2f
description: >-
  Set-and-forget autonomous QA loop runner for any repository. Runs your verify
  command each round, diagnoses failures with the host LLM, applies a minimal fix
  on a branch, opens a PR, and stops itself when it stalls or runs out of budget.
maintainer: itxLikhith
tier: community
category: automation
requires_hermes: ">=0.22.0"
version: "0.8.0"
tags: [automation, qa, testing, ci, autonomous]
capabilities:
  provides_tools:
    - loop_start
    - loop_tick
    - loop_verify
    - loop_status
    - loop_history
    - loop_analyze
    - loop_recommend
    - loop_commit
    - loop_revert
    - loop_pause
    - loop_resume
    - loop_stop
  provides_hooks:
    - pre_llm_call
    - post_tool_call
    - pre_tool_call
  provides_middleware: []
  requires_env: []
