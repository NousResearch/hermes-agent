sha: "aaced5beb7bdb93cf7267060bb81fb49d4762c67"
version: "0.1.0"
description: "Protects the private documents in your Apple Photos library, on-device. A privacy check-up finds passports, payment cards, passwords and ID documents; Safe Send makes a redacted copy and re-reads it to prove nothing sensitive remains; Leak Guard, a pre_tool_call hook, blocks any Hermes tool call that would send a raw image of an ID document off the Mac. Also searches photos by person, place, scene or text in the image, lists expiry dates, creates albums and renders memory videos. Disclosure — macOS only; reads the Apple Photos library database and image files (needs Full Disk Access) through osxphotos; creates albums in Photos via AppleScript (photoscript) only when asked; runs Apple Vision text recognition locally and the local sips and ffmpeg binaries; the pre_tool_call hook inspects every tool call's arguments and reads image files they name; a transform_llm_output hook edits Hermes's replies (adds photo-grid/redaction cards or MEDIA lines, removes MEDIA lines for images that look like ID documents and Lumina file paths); exported photos, redacted copies and memory videos are written to the plugin's data folder and, on messaging platforms, delivered through Hermes's MEDIA lines to that chat service; the lumina_redact tool accepts any image file path on the Mac; recognised text is cached in the plugin's own data folder; Lumina makes no network requests of its own, stores no credentials and has no telemetry. Text of matched photos (snippets, or full text of up to 5 photos when asked) is returned to the model."
maintainer: samirsawarkar
