known_issues:
  - "macOS only. Hermes (or the terminal running it) needs Full Disk Access to read the Photos library; album creation asks for Automation permission for Photos."
  - "Text search, expiry and the privacy check-up rely on the text Apple Photos has already recognised; photos added in the last few days are read directly, a few seconds at a time, and a partial result says so."
  - "Leak Guard catches the common routes (image paths in terminal, code, browser and message tool calls) and is not a guarantee against a determined attacker. LUMINA_LEAK_GUARD=off disables it."
  - "The check-up reports four kinds (passports, payment cards, passwords, ID documents) and prefers missing a document over a false alarm. Tested on a small library; very large libraries are not yet measured."
  - "Memory videos use ffmpeg when installed and fall back to an animated GIF."
