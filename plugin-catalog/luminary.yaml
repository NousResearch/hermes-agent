version: "0.3.4"
description: "Luminary Memory — self-hosted, owner-scoped long-term memory with 4-strategy recall (semantic, keyword, temporal, graph), RRF fusion, and lifecycle maintenance. Runs on your machine: SQLite by default, optional PostgreSQL/pgvector. Disclosure — writes ~/.hermes/luminary/luminary.db and config.json; no network by default, optional LLM curation sends turn text to the configured OpenAI-compatible llm_base_url, optional pgvector connects to your DSN; reads the active Hermes profile home and Hermes secret scope (LUMINARY_LLM_API_KEY, LUMINARY_PG_DSN); no shell commands, no separate process, no telemetry."
maintainer: alertxsto
tier: community
category: memory
requires_hermes: ">=0.22.5"
docs_url: https://github.com/alertxsto/luminary-memory/blob/main/docs/hermes-integration.md
