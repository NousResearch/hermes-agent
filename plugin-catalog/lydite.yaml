known_issues:
  - "Linux only: the plugin's tools appear on Linux only, and Lydite's wall has been run on Linux only."
  - "Needs the lydite binary of the same release as this plugin (attested release of github.com/aoricloud/lydite; for lydite_findings, a binary that has `lydite findings`, newer than 0.4.0), Claude Code, gh and srt installed (under mur = natif, bubblewrap instead of srt, plus lydite-reseau when the profile has a `reseau` line), and a Lydite profile accepted by a human."
  - "A plan that places files (`place` lines) cannot be launched through the plugin: lydite_lancer and lydite_plan refuse it before anything starts (the plugin launches a copy of each plan, and a copy has no `.files` folder, which Lydite would refuse). Launch such a plan with `lydite launch` from a shell."
  - "Some names are still French: three tool names (lydite_lancer, lydite_etat, lydite_lecons), the plugin settings (binaire, profil, cle_nom, cle), the keys of profiles and plans, and a few lines Lydite writes. Lydite's commands have English words, and its usage and the lines about the pull request and CI are in English; pull request receipts are in English. The progress lines of a launch are still in French."
capabilities:
  provides_tools: [lydite_lancer, lydite_etat, lydite_lecons, lydite_plan, lydite_findings]
  provides_hooks: [pre_tool_call]
  provides_middleware: []
  requires_env: []
