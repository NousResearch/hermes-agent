subdir: hermes
description: "Hand a GitHub issue and the command that proves it done to Lydite from the chat. Lydite runs the job in Claude Code sessions, on the models its plan and its profile name, at the profile's provider (a profile can send its reviewer to Anthropic instead), replays your proof itself and opens a pull request, with a receipt, for the work that passed. Also reads the lessons kept for a repository, checks a plan file, and turns a hermes-security findings export into one plan per finding you choose: prove it by a failing test, then fix it. Disclosure: every launch goes to Hermes' human approval (it shows the repository, the work or, for a plan, its file name, size, task count, origin and SHA-256, the proof, and the profile with the target branch, `plan only` in a dry run; long values are cut with an ellipsis, the repository and a plan's proof line included; \"always\" covers only the same request: repository, profile, issue number, objective, target branch, dry run or launch, and proof or plan bytes; Hermes itself skips the prompt in several of its own modes: yolo, `approvals.mode: off`, a `hermes -z` one-shot, a run with nobody to answer whose approval mode is `approve`, and a request you already allowed), then the plugin starts the installed `lydite` binary (argument list, no shell) as a detached background process, with a closed environment list plus the provider key you set; Lydite runs git and gh on the host with your gh login and your git credentials, and Claude Code under your Claude Code login or, when the profile names a key, with that provider key (a reviewer sent to Anthropic stays under your login); it replays your proof with `sh -c`, reaches GitHub and its profile's provider, plus whatever the accepted profile opens (`reseau` domains, tools such as WebSearch, MCP servers), pushes a branch and opens the pull request (a dry run replays your proof on the base and runs the splitting session, then shows the plan: no wave, no push, no pull request), then waits up to 30 minutes for its CI and may run one more wave, not reviewed, on that branch if it is red, and wait again, unless a task of the wave is critical; under a required wall (`mur = exige`, the default, or `natif`) the sessions' commands run in Claude Code's sandbox and your proof is replayed inside the wall; under a profile you accepted with `mur = demande` (an objective, or a plan with no `report` origin line; an issue or a findings plan is refused) they may run outside it and see the provider key if there is one, and the proof is replayed on the host. The status, lessons, plan-check and findings tools start no wave and ask no approval: they run `lydite` read-only, and the findings tool writes the plans of the findings you choose. Reads the plan file, the repository's `.agents/skills` lessons and the findings report you name (and, for existence only, the repository's `.git` and the files a report cites), `/proc/<pid>/cmdline` of a launch it made, to tell whether it still runs, and its own skill file; it looks for the `lydite` binary (the `binaire` setting, or the PATH). The plugin writes only under its data folder (the one Hermes gives it, or `<temporary folder>/lydite` without one): plans, launch logs, copies of launched plans; it keeps its last launches in its Hermes plugin state. Lydite itself, a separate process, keeps its thread and its git worktrees under its own state folder, and adds local `lydite/...` branches to the target repository. The plugin and Lydite send no telemetry; Claude Code, gh and git are separate programs with their own settings. The full list is in the README."
