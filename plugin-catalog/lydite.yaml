name: lydite
title: Lydite
repo: https://github.com/aoricloud/lydite
sha: 0599e7f7fefb044d32dd603a160629a83fed98bb
subdir: hermes
description: "Hand a GitHub issue and the command that proves it done to Lydite from the chat. Sandboxed Claude Code workers do the job, Lydite replays your proof itself, and a pull request comes back with a receipt (cost, workers, retries, the commit that was reviewed and replayed, and what was not replayed). Also hands Hermes the lessons Lydite keeps for a repository, read-only, and has Lydite check a plan file before a launch. Disclosure — after your approval of each launch (the prompt shows the repository, work, exact proof command or plan SHA-256, profile and target branch; \"always\" covers only that repo+profile+proof), starts the already-installed `lydite` binary (argument list, no shell) as a detached background process with a closed environment list plus the provider key you set; Lydite runs git, gh, Claude Code workers and your proof command, inside its srt sandbox under a `mur = exige` profile (the default, and required for `--issue`) but directly on the host under a profile you accepted with `mur = demande`; it reaches GitHub and the model provider of its profile; the status, lessons and plan-check tools run the binary without approval; reads the plan file and the repository's `.agents/skills` lessons; no telemetry."
maintainer: aoricloud
tier: community
category: automation
requires_hermes: ">=0.23.0"
docs_url: https://github.com/aoricloud/lydite/tree/0599e7f7fefb044d32dd603a160629a83fed98bb/hermes
