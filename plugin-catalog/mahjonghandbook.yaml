description: "American Mahjong (NMJL card pattern sections, Charleston 3-pass sequence rules, Joker legality & swapping), Chinese Official MCR 81-Fan scoring referee, and Japanese Riichi Mahjong Furiten/Yaku/Fu calculator through MahjongHandbook's official MCP server (Streamable HTTP at https://mahjonghandbook.com/api/mcp, no sign-in, no keys in config). Bundles the mahjonghandbook workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local runtime code, binaries, hooks, telemetry or self-updater; every tool call goes over HTTPS to mahjonghandbook.com/api/mcp with only the Mahjong rule variant or hand query arguments. All 4 tools are public, free, and annotated read-only (readOnlyHint: true, destructiveHint: false). The package marks the server untrusted (trust: untrusted), so Hermes asks before any tool not annotated read-only and refuses them in unattended runs. The remote tool inventory is served at runtime and is not covered by the pinned sha."
