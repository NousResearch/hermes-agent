description: "Makernice video and image generation through Makernice's remote MCP server (Streamable HTTP at https://mcp.makernice.com/mcp, OAuth sign-in in the browser, no API key in config): Seedance, Kling, Wan and MiniMax videos and Seedream and Qwen images. Every job is priced in USD before it runs and refused if it exceeds the cap the user approved. Bundles four skills: setup, product video, trend remix and cost planner. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; prompts, image links and job parameters are sent to mcp.makernice.com; generate spends the user's prepaid Makernice balance. A job that fails releases its held amount, but a finished output blocked by moderation is still charged. Sign-in needs a same-name mcp_servers entry with auth: oauth in config.yaml (shown in the README); Hermes stores and refreshes the OAuth token. The package marks the server untrusted, so Hermes asks before write-capable calls and refuses them in unattended runs; a same-name config.yaml entry replaces that setting, so add trust: untrusted to it to keep the approvals. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
