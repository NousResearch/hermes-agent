readme: true
platforms: [linux, macos]
title: Mandate
known_issues:
  - "Enforces only for cron runs and chat sessions bound with /mandate scope; other interactive sessions are not affected."
  - "Commands that hide their intent (bash -c, eval, python -c, pipes into sh) are blocked unless allowed verbatim."
capabilities:
  provides_tools: [mandate_status]
  provides_hooks: [pre_tool_call, post_tool_call]
