known_issues:
  - "Identity is only as good as the platform event: machine-generated turns (cron, internal notices, auto-continuation) are the operator's, and a session that never carried a human turn fails closed — delegation and subagent sessions therefore cannot use restricted tools unless you set unknown_session_policy to operator."
  - "DM routing is Telegram-shaped: a private chat id is the user id, so the approval prompt reaches that chat. Other platforms need their own DM resolution; the prompt fails closed there rather than guessing, which means asks are denied until a code is minted another way."
  - "The operator's own memory is withheld by removing the two built-in block titles (MEMORY, USER PROFILE). A block rendered by a third-party memory provider is not removed, so run manyhands without one if that matters to you."
  - "A plugin escalation cannot use Hermes's approval-transport seam: request_tool_approval routes it through _ACTION_GATE, which is built with transport=False. manyhands parks and DMs the ask itself and leaves the registered transport to the dangerous-command prompts that do consult it."
  - "The approval prompt arrives as a plugin-triggered turn in the owner's chat (inject_gateway_message), so each prompt costs one turn in that conversation; keep approval_timeout_s honest so a stale code cannot sit there long."
capabilities:
  provides_tools:
    - manyhands_whoami
    - manyhands_people
    - manyhands_remember
    - manyhands_recall
    - manyhands_share
    - manyhands_audit
  provides_hooks:
    - pre_llm_call
    - pre_tool_call
    - post_api_request
  provides_middleware:
    - llm_request
  requires_env: []
