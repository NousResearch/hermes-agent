description: "Search hotels (3M+ hotels) and flights worldwide on MAQAMI, read hotel details and reviews, then send the customer a secure checkout link on book.maqami.co, through the official MAQAMI Travel MCP server (Streamable HTTP at mcp.maqami.co, no account or key), with the maqami-travel-booking skill bundled. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — connects to the hosted MAQAMI MCP server at mcp.maqami.co; the tool arguments the agent sends (destinations, dates, guests, and booking ID and email for lookups) go to it. Customers pay only on book.maqami.co; the server never receives card details. Prebook holds a real rate, so the skill tells the agent to confirm with the user first."
