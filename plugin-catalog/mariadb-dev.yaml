description: "Work with MariaDB from Hermes: 85 skills on MariaDB SQL, functions, schema management, REST services, connectors and migration from MySQL, plus the native mariadb-shell MCP server (run SQL, inspect schemas, dump/load/copy data, deploy local sandbox servers, manage REST services). Agent Plugins v1 package (plugin.json + mcp.json + skills/). Disclosure: the MCP server is the local mariadb-shell binary, started by scripts/mariadb-mcp-launcher.sh. If no mariadb-shell of the required version (26.10.4) or newer is on PATH or in ~/.local/bin, the launcher downloads the official installer from a fixed github.com/mariadb-corporation/mariadb-shell commit and installs exactly release v26.10.4 into ~/.local/share/mariadb-shell, linked into ~/.local/bin. The package is verified against scripts/mariadb-shell-v26.10.4.SHA256SUMS, committed at the pinned sha; a mismatching package is refused. The launcher reads no GitHub credentials and sends none. Tools run SQL against the databases the user registered with mariadb-shell, whose passwords stay in mariadb-shell's own OS secret store and never pass through the agent; the sandbox tools download and run local MariaDB server instances. No telemetry."
