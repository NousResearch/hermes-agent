version: "26.10.6"
description: "Companion to mariadb-dev / mariadb-sql: a pre_tool_call hook that blocks the agent from running the mariadb/mysql command-line clients (and similar) for what the mariadb MCP tools do, so no database password reaches a command line, plus a short system-prompt rule saying so. Pure Python, no dependencies, no network calls, no file access. Setting MARIADB_PLUGIN_ALLOW_CLI=1 disables it."
