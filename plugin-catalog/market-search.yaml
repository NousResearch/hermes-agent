description: "Live market data for Hermes through the market-search MCP server: Kalshi and Polymarket odds, Fed rate-path probabilities, stocks, ETFs, options, futures curves, corporate and government bonds, FRED macro, Treasury auctions and fiscal data, SEC filings by section and XBRL, insider trades, short interest, CFTC positioning, and Fed, ECB, BOJ, BOE and BIS data, all on one timeseries axis. 25 tools, no API keys, no account. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/) with one skill that maps questions to tools. Disclosure — the stdio server is started by scripts/launch.sh, a readable shell script: it runs an already-installed market-search binary if one is on PATH, in ~/.local/bin or ~/.cargo/bin; otherwise it downloads the v0.5.0 release binary for the user's OS from this repository's own GitHub release (github.com/efoltyn/market-search, the upstream project), checks it against a SHA-256 written in the script, refuses to run it on mismatch, and caches it under ~/.cache/market-search/. No self-update: the version and checksums change only with a new pinned commit. Tool calls make HTTPS GET requests from the user's machine directly to public data sources (Yahoo Finance, Kalshi, Polymarket, FRED, SEC EDGAR, FINRA, US Treasury, NY Fed, OFR, CFTC, CBOE, CNBC, Pyth, Binance, Hyperliquid, Deribit, ECB, BIS, BOJ, BOE, EIA); nothing goes through a server of the author's. finance_log keeps a local hash-chained record of tool calls in the user's data directory. Read-only: it cannot trade or move money. Every tool carries a title and annotations (24 read-only; finance_log writes its local log), and the package marks its server untrusted. No telemetry. Not financial advice."
