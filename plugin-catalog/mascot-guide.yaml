title: Mascot Widget
description: 'A mascot that floats in the corner of Hermes Desktop: it says what the agent is doing, shows tokens, context and session cost, and opens a status panel with copy, compress and stop. Colours, aura glow, size and the position of the bubble, cards and panel are adjustable, with Simple and Advanced settings tabs and three layout presets. Desktop-only (desktop/plugin.js inside the plugin SDK surface); no agent tools, hooks, middleware or env vars.'
