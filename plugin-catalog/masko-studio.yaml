description: >-
  Create animated mascots for apps and websites through Masko's hosted Streamable HTTP
  MCP server (https://masko.ai/api/mcp): poses, animations with sound, voices and
  talking clips, backgrounds, a canvas that makes the mascot react to app events, and
  the open-source Masko player for web, iPhone, Mac, Android, React Native and Flutter.
  Bundles five workflow skills: create, animate, build an interactive mascot, integrate
  it, and make a desktop pet. Agent Plugins v1 package (plugin.json + mcp.json +
  skills/), configuration only. Sign-in is browser OAuth to masko.ai (add the server
  with auth: oauth, then hermes mcp login masko); no key or token is stored in the
  plugin. Disclosure: hosted-only connector with no local code; every tool call goes to
  masko.ai, and prompts, imported pictures and generated files are stored in the user's
  Masko workspace. Generation spends that workspace's Masko credits; every tool gives
  its price before spending, and tools that only read are annotated read-only. The
  package marks the server untrusted, so Hermes asks before every write-capable call and
  refuses them in unattended runs. No tool takes a payment. The tool set is served by
  the remote server at runtime and is not covered by the pinned sha.
