description: "Read and manage a Mayar (mayar.id, Indonesian payments platform) account through Mayar's official hosted MCP server: balance, invoices, installments, payment links and products, customers, transactions, memberships, credits, coupons, webhooks, reviews, QRIS and license codes. Bundles one workflow skill. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: every tool call goes to https://mcp.mayar.id/mcp, which calls the Mayar production API (api.mayar.id) with the user's API key from MAYAR_API_KEY, sent as a Bearer header. Write actions use real money and live data: they create or update invoices, payment links, products, customers and coupons, change membership status, change the webhook URL and add or spend credits. The package marks the server untrusted, so Hermes asks before write-capable calls. Account data returned by tools (customers, transactions, balances) reaches the model provider. The tool list comes from the server at run time and is not covered by the pinned sha."
