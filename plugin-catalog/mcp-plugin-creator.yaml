name: mcp-plugin-creator
repo: https://github.com/tonbistudio/hermes-mcp-plugin-creator
sha: dcc2071eea7d80184735a221d22babe5f2f2f5e7
description: 'Turn any MCP server into a portable Agent Plugin (mcp.json + workflow skill) built from
  evidence: the server''s self-description, your past sessions with it, its docs and a read-only probe.
  Validates and installs the package in linked mode, and checks a built plugin for server drift and new
  errors in use. Disclosure: starts the target MCP server to introspect it; reads this profile''s
  state.db read-only; logs redacted mcp__* call summaries locally (log_calls: false turns it off);
  inline server launches, writes outside its data dir and installs ask for approval.'
maintainer: tonbistudio
tier: community
category: tools
title: MCP Plugin Creator
requires_hermes: ">=0.22.0"
version: "0.2.0"
docs_url: https://github.com/tonbistudio/hermes-mcp-plugin-creator#readme
platforms: []
capabilities:
  provides_tools:
    - mcp_creator_servers
    - mcp_creator_introspect
    - mcp_creator_mine
    - mcp_creator_convert
    - mcp_creator_scaffold
    - mcp_creator_validate
    - mcp_creator_install
    - mcp_creator_drift
    - mcp_creator_review
  provides_hooks:
    - post_tool_call
    - pre_tool_call
  provides_middleware: []
  requires_env: []
