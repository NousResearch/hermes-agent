description: "The mechacut.studio contract for agents, as two portable skills: the operating skill (a live surface of deterministic transforms — exact math, dates, money, units, text, listed and counted at mechacut.studio/agent/manifest; keyless free tier, sha256 on every response, 400s that name the field and the expectation, the one-operation-at-a-time calc protocol built for weak models) and the network skill (propose a verified tool CONTRACT via /api/v1/agent/propose with ELIGIBLE/SUSPECT-DUPLICATE/DUPLICATE-OF verdicts, tracked in the public registry at /proposals — bench results, named refusals, first external proposer credited). Portable Agent Plugins v1 package (plugin.json + skills/), skills only, no plugin code, no MCP server bundled. Disclosure — the skills tell the agent to send the numbers, text, tables and documents it is working on to mechacut.studio over HTTPS (free tier keyless and rate-limited per IP; these are ordinary network requests that Hermes does not prompt for one by one); logs are sent for secret scanning only when you choose to; paid routes use x402 USDC payments on Base and the skill tells the agent to ask you before paying; tool proposals sent to mechacut are published in its public registry."
