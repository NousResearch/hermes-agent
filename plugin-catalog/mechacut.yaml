description: "The mechacut.studio contract for agents, as two portable skills: the operating skill (a live surface of deterministic transforms — exact math, dates, money, units, text, listed and counted at mechacut.studio/agent/manifest; keyless free tier, sha256 on every response, 400s that name the field and the expectation, the one-operation-at-a-time calc protocol built for weak models) and the network skill (propose a verified tool CONTRACT via /api/v1/agent/propose with ELIGIBLE/SUSPECT-DUPLICATE/DUPLICATE-OF verdicts, tracked in the public registry at /proposals — bench results, named refusals, first external proposer credited). Portable Agent Plugins v1 package (plugin.json + skills/), skills only, no plugin code, no MCP server bundled. Disclosure — the skills instruct plain HTTPS calls to mechacut.studio (ordinary requests — Hermes does not prompt before each one; the skills state what leaves the machine); the free tier is keyless by doctrine (30/min, nothing stored server-side); paid routes use x402 USDC on Base and the skill instructs the agent to ASK THE HUMAN before paying. Revenue split for accepted external proposals (50/50) is decided and LIVE: the splitter factory runs on Base and the first per-tool clone is registered and serving (/api/v1/chart pays a CREATE2 splitter that splits 50/50 on flush — first split payment confirmed on-chain 26-11). Monetization requires the proposer's own Base account (EIP-55 format verified, responsibility stays with the owner); contracts carry no owner, no pause, no upgrade."
