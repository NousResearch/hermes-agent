name: mediarag
repo: https://github.com/dyiapanis/mediarag
sha: fbfb34b9ec804814e08e35d4058ac60d80ee7c4a
description: "Local, offline semantic search across your documents, notes, images, audio and subtitles: one index you query by meaning from Hermes or any MCP client, with snippets, timestamps and thumbnails from PDFs, Office files, photos and recordings.\n\nDisclosures\n\n- Downloads about 480 MB of model weights from Hugging Face at a pinned revision on first setup; offline after that.\n- Reads the folders you point it at, outside the plugin directory.\n- Runs pandoc, pdftotext, ffmpeg and curl from PATH.\n- Fetches the http(s) URLs you add, from public hosts only.\n- Runs source adapters as local subprocesses; the optional Raindrop adapter sends RAINDROP_API_TOKEN to the Raindrop API.\n- With MEDIARAG_AUTO_BOOTSTRAP=1, the standalone MCP launcher installs its Python environment from PyPI, about 1.7 GB. Disclosure — downloads about 480 MB of EmbeddingGemma-2 ONNX weights from Hugging Face at a pinned revision on first setup, offline after that; reads the folders you point it at, outside the plugin directory; runs pandoc, pdftotext, ffmpeg and curl from PATH; fetches the http(s) URLs you add, public hosts only, re-checked on every redirect; runs source adapters as local subprocesses, and the optional Raindrop and Notion adapters send RAINDROP_API_TOKEN to Raindrop's API and NOTION_TOKEN to api.notion.com; with MEDIARAG_AUTO_BOOTSTRAP=1 the standalone MCP launcher installs its Python environment from PyPI, about 1.7 GB."
maintainer: dyiapanis
