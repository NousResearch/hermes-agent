name: mediarag
repo: https://github.com/dyiapanis/mediarag
sha: 8b2423d52d3ef1e8da9e0418fd7218c8b899f05c
description: 'Local, offline semantic search across your documents, notes, images, audio and subtitles: one index you query by meaning from Hermes or any MCP client, with snippets, timestamps and thumbnails from PDFs, Office files, photos and recordings.


  Disclosure —


  - Downloads about 480 MB of EmbeddingGemma-2 ONNX model weights from Hugging Face at a pinned revision on first setup; offline after that.

  - Reads the folders you point it at, outside the plugin directory.

  - Runs pandoc, pdftotext, ffmpeg and curl from PATH; ffmpeg samples video files at 0.5 frames per second (first 240 frames) into its local cache to index them.

  - Fetches the http(s) URLs you add, from public hosts only, re-checked on every redirect.

  - Runs source adapters as local subprocesses; the optional Raindrop and Notion adapters send RAINDROP_API_TOKEN to Raindrop''s API and NOTION_TOKEN to api.notion.com.

  - With MEDIARAG_AUTO_BOOTSTRAP=1, the standalone MCP launcher installs its Python environment from PyPI, about 1.7 GB.'
