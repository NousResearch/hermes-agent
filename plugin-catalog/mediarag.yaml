name: mediarag
repo: https://github.com/dyiapanis/mediarag
sha: 7dc0b6bb3d3e27e8eb26465919717dde20ca4907
description: "Multimodal local semantic search across your documents, notes, images, audio and subtitles.\n\nDisclosures\n\n- First setup downloads the ~480 MB EmbeddingGemma-2 ONNX weights from Hugging Face at a pinned revision; every search after that runs offline.\n- Indexes the folders you point it at, which sit outside the plugin's own directory, and runs `pandoc`, `pdftotext`, `ffmpeg` and `curl` from PATH to convert what it finds.\n- `mediarag_add_source` fetches user-supplied http(s) URLs (public hosts only, re-checked on every redirect) and runs packaged or user `sources.d` adapters as local subprocesses; the optional Raindrop.io adapter sends RAINDROP_API_TOKEN to Raindrop's API.\n- The standalone MCP launcher can build its own Python environment with `uv` from PyPI (~1.7 GB incl. torch), only when MEDIARAG_AUTO_BOOTSTRAP=1."
maintainer: dyiapanis
tier: community
category: tools
docs_url: https://github.com/dyiapanis/mediarag#readme
version: "0.1.20"
image: https://raw.githubusercontent.com/dyiapanis/mediarag/7dc0b6bb3d3e27e8eb26465919717dde20ca4907/assets/banner.jpg
readme: true
platforms: [linux, macos, windows]
capabilities:
  provides_tools:
    - mediarag_search
    - mediarag_add_note
    - mediarag_ingest_dir
    - mediarag_add_source
    - mediarag_status
  provides_hooks: []
  provides_middleware: []
  requires_env: []
