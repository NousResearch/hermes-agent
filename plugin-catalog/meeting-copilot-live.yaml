description: "Read-only meeting answers with cited project evidence. Disclosure — explicit answers send bounded transcript, selected project snippets and (when enabled, or in all-projects and web-fallback answers) prior-session snippets through the configured Hermes default and its host routing/fallback policy, or selected OpenAI/OpenRouter/Meta (api.meta.ai) APIs; optional Meta ASR sends audio to api.meta.ai and Google preview ASR to generativelanguage.googleapis.com; optional web queries leave through host search; reads selected project files, read-only session SQLite and attached Meetily recording files; readiness, permission setup, capture and explicit synthetic-audio tests launch native/worker child processes; capture/readiness/test workers use minimal environments; Google preview keeps a counts-only allowance ledger in ~/.meeting-copilot shared across profiles; separate macOS setup installs SHA-256-pinned PyPI wheels and compiles/signs native helpers; explicit local-model preparation may download public Whisper weights; clipboard exports may contain confidential context."
