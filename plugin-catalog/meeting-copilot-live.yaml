description: "Read-only meeting answers with cited project evidence. Disclosure — explicit answers send bounded transcript, selected project snippets and (when enabled, or in all-projects and web-fallback answers) prior-session snippets to the selected OpenAI, OpenRouter or Meta (api.meta.ai) API; optional Meta ASR streams meeting audio to api.meta.ai; optional web queries leave the profile through host search; reads selected project files, read-only session SQLite and, when attached, Meetily's own recording files; consented capture launches native/worker child processes with a minimal environment; separate macOS setup installs SHA-256-pinned PyPI wheels and compiles/signs native helpers; local transcription may download public Whisper weights; clipboard exports may contain confidential context."
