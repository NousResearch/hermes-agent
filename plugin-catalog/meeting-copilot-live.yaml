known_issues:
  - "Developer preview: one generated 38.4-second fixture verified local Whisper and Google; not a general accuracy benchmark or proof of live system audio, diarization or sustained capture. Live OpenAI/OpenRouter responses remain unverified."
  - "Google preview is explicitly selected, limited to 60 seconds per source and four shared stream attempts. Local $1-per-stream reservations are not actual charges or a guaranteed bill cap; final-tail completeness is unconfirmed. Source labels are not speaker identities. Free-tier audio may improve Google products."
  - "macOS audio preparation targets Apple Silicon, preinstalled CPython 3.12 and the macOS 26 SDK; rerun it after runtime updates. Native Windows readiness remains unsupported and fail-closed."
  - "Missing request-bound secret scope fails closed. Follow Hermes default requires a genuine same-profile in-process facade; isolated/remote routes are unsupported and no core credentials are copied."
  - "Overlay recording exclusion is best effort. Hide it and verify it is gone when it must not appear."
