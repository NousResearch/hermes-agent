description: "Meme Studio through its MCP server (Streamable HTTP at https://memes.mrhyde.dev/mcp, no sign-in, no keys in config): finds the meme templates that fit a joke among more than a thousand, still and animated, with what goes in each caption slot, and makes the finished meme, an animated GIF for animated templates, plus a link to edit it in the browser. Works with the user's own photo too. Bundles one skill for the whole flow. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to memes.mrhyde.dev, which uses what the agent sends to make the meme and does not store it or log it, keeps only daily counts (requests, tools, options, templates chosen, errors) and publishes them by week at memes.mrhyde.dev/en/stats. With image_url the server downloads that picture itself. Every tool is annotated read-only; the package marks the server untrusted. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
