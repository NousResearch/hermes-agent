name: memorybank
repo: https://github.com/nicholaslaldigital/hermes-memory-bank
sha: "e7e68d2cdad1db153542cb616c2ac3ea0675ab50"
subdir: memorybank
version: "1.4.0"
description: "Memory Bank - unlimited local long-term memory for Hermes as a knowledge graph; adding a new memory never fails for lack of room, relevance-gated recall, an index of past sessions and skills, a live network view and a usage meter. Disclosure — keeps excerpts of your conversations, MEMORY.md/USER.md and skill text in a local unencrypted SQLite bank under the profile's plugin-data folder, and on first run indexes past session history from Hermes' state.db (opened read-only); when the built-in memory tool refuses an add because MEMORY.md or USER.md is full, it stores the entry in the bank and reports the save as successful; `hermes memorybank ui` runs a token-protected viewer on 127.0.0.1 and opens it in your browser."
maintainer: nicholaslaldigital
tier: community
category: memory
requires_hermes: ">=0.21.5"
docs_url: https://github.com/nicholaslaldigital/hermes-memory-bank#readme
known_issues:
- Developed and tested on Windows only; macOS and Linux are expected to work but have not been run.
- The macOS/Linux-only code (owner-only file modes, macOS durability settings, no browser auto-open on Linux) is untested on a real Mac or Linux machine.
- A replace that makes an existing MEMORY.md / USER.md entry longer than the room left is still refused by Hermes; only new entries (adds) are rescued.
- Keeps excerpts of what you typed in each conversation (and skill text) in a local, unencrypted SQLite file.
- The network view animates (about 30 frames a second) while it is open and visible; it stands still under the system's reduced-motion setting and in a hidden window.
capabilities:
  provides_tools: []
  provides_hooks:
  - transform_tool_result
  - on_skill_lifecycle
  provides_middleware: []
  requires_env: []
