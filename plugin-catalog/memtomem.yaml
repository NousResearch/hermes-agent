description: "Markdown-first long-term memory shared across your coding agents: a local memtomem MCP server plus six memory skills (index, recall, remember, search, setup, status). Notes live in ~/.memtomem and are searchable from Hermes, Claude Code, Codex CLI and Kimi Code. Runs at user scope. Disclosure — the server is launched with `uvx --python 3.12` and downloaded from PyPI (memtomem[onnx]==0.7.4) on first start, with Python 3.12 if uv cannot find one; it runs as a stdio MCP server for the session, with PYTHON_DOTENV_DISABLED=1 so it loads no .env file. It reads the directories you ask it to index and watches its configured index roots while it runs. With a fresh BM25-only configuration nothing else leaves the machine on its own; an existing memtomem configuration may enable Hugging Face model downloads, a remote embedding or LLM provider, Cohere reranking or search webhooks, and its fetch action downloads a URL on request. The server runs as your user and is not confined to ~/.memtomem: its context-gateway and path-taking actions (reached through mem_do, not called by the skills) can read and write other coding agents' files, including their instruction files, skills, hook settings and MCP configuration; see the README's \"Files outside memtomem's own data\"."
