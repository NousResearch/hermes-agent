description: "Run link building outreach through MentionAgent's hosted MCP server (Streamable HTTP at https://mentionagent.ai/mcp, OAuth sign-in, no keys in config): review the outreach drafts MentionAgent wrote, send the batch, answer publisher replies, close placements, and change campaigns in plain English, across every site in the user's account. Bundles the link-building-outreach workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: every tool call goes to MentionAgent's hosted server (mentionagent.ai) and acts on the user's MentionAgent account; the tool set is served by that server at runtime and is not covered by the pinned sha. approve_batch and send_reply send real email from the user's sending inbox, and trigger_run and draft_reply spend MentionAgent credits. Sign-in runs the pinned mcp-remote@0.1.49 through npx (Node.js 20.18.1+ and npm required), which opens a browser and a local callback port on first use and stores OAuth tokens under ~/.mcp-auth. The package marks the server untrusted, so Hermes asks before every tool the server does not mark read-only and refuses them in unattended runs."
