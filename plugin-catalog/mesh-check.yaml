description: 'Mesh Check reads one local STL, OBJ, PLY, GLB, or glTF file and returns whether it is closed, its volume, its bounds, and mesh, animation, and material counts. Use it before a 3D print or a game export. Disclosure — opens the path you pass and follows its symlink; stops at 33554432 bytes, including a glTF buffer in that directory; enable prepares trimesh and pygltflib (numpy comes with trimesh); no rendering, repair, network, write, or approval; anyone you allow on your Hermes gateway can call it; install with .git is 364 KiB; remove deletes that directory and can leave numpy, trimesh, known_plugin_toolsets, plugin-deps/pyproject.toml, workspace pyproject.toml, uv.lock, and backups/config.'
