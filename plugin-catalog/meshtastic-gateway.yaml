description: "Meshtastic API. Allowlisted DM only if pkiEncrypted is true. Empty answers nobody. Channel packets never answered. A channel key can impersonate. Final reply only; approval text for that node is sent. TCP only; serial, BLE refused. Decimal and uppercase ids become !aabbccdd. Fake radio, adapter, v0.21.4 and main. No physical radio. Disclosure — one URL; no allow-all; no 2nd prompt; gap 10-3600s; nodes.json after handoff; session has text; delete plugin data; <=200B, <=8 chunks, <=30/hour per adapter (recounts; last 100 ids); no daily cap; connect 20s then timeout cleared; config wait <=30s; partial send is final; host isolation does not load it; lost stops adapter; reconnects uncapped; not a sandbox; no cron; tests/ shipped, not loaded; meshtastic is not declared; install in Hermes venv."
maintainer: TakeshiTGAL
