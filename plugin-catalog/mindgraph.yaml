name: mindgraph
repo: https://github.com/shuruheel/mindgraph
sha: bd6b40e352f12cb40e74a6f922222aa384d272f8
version: "1.1.0"
description: "MindGraph typed knowledge-graph memory: bounded per-message recall, durable session transcript capture, and the mindgraph-mcp general tool surface (capture, reason, commit, plan, retrieve, remember, ingest, synthesize, ontology). Disclosure — every tool call, recall and capture goes to the MindGraph API (api.mindgraph.cloud, or MINDGRAPH_BASE_URL) under MINDGRAPH_API_KEY; with automatic capture on (default; MINDGRAPH_AUTO_CAPTURE=off disables it) the user and assistant text of completed turns is sent for extraction, tool calls and outputs are not; until the API accepts it that text rests in the profile directory (mindgraph/capture.db, mode 0600) and is deleted on delivery, with a receipt (job id, document uid, digests) kept 30 days; delivery runs on a thread inside the Hermes process and one short-lived thread per start delivers what an earlier process left; recall (MINDGRAPH_RECALL=off disables it) sends the content words of the current message, and of the previous one for a follow-up, as the search query; every add or replace made with Hermes's built-in memory tool is mirrored to MindGraph (and the replaced entry is forgotten there); each tool call first sends its name, action and target node uids to the server's governance check (MINDGRAPH_GOVERNANCE=off skips it); automatic writes run only in the primary agent, never in subagents or cron, except that with compression.checkpoint_required set the text about to be compressed is captured in any agent context; no telemetry, no separate processes, no credentials stored outside Hermes."
maintainer: shuruheel
tier: community
category: memory
requires_hermes: ">=0.22.0"
docs_url: https://github.com/shuruheel/mindgraph#readme
readme: true
capabilities:
  provides_tools:
    - mindgraph_memory
    - mindgraph_capture
    - mindgraph_reason
    - mindgraph_commit
    - mindgraph_plan
    - mindgraph_retrieve
    - mindgraph_remember
    - mindgraph_series_query
    - mindgraph_ingest
    - mindgraph_synthesize
    - mindgraph_ontology
  provides_hooks:
    - on_turn_start
    - on_session_end
    - on_session_switch
    - on_pre_compress
    - on_memory_write
  provides_middleware: []
  requires_env:
    - MINDGRAPH_API_KEY
