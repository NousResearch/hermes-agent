name: mindgraph
repo: https://github.com/shuruheel/mindgraph
sha: 2abbfd03b73c6e369ab645bcb747cc6804555507
version: "1.2.0"
description: "MindGraph typed knowledge-graph memory: bounded per-message recall, durable transcript/delegation capture and built-in memory mirroring, and the mindgraph-mcp general tool surface. Disclosure — tool calls, recall, capture and mirrored memory go to the MindGraph API (api.mindgraph.cloud, or MINDGRAPH_BASE_URL) under MINDGRAPH_API_KEY; automatic capture (default on; MINDGRAPH_AUTO_CAPTURE=off disables it) sends completed-turn user/assistant text and available participant ID/name/bot metadata, plus parent delegation task/result/child session ID, for extraction; other tool calls and outputs are not captured. Undelivered text and native memory operations rest in the profile directory (mindgraph/capture.db, mode 0600), are deleted on delivery, and transcript receipts are kept 30 days; background threads retry delivery. Native memory add/replace/remove changes are mirrored even with transcript capture off; replacements save new before forgetting old. Recall (MINDGRAPH_RECALL=off disables it) sends current-message content words and previous-message terms for subjectless follow-ups. Tool calls first send name, action and target node UIDs to the server governance check (MINDGRAPH_GOVERNANCE=off skips it). Automatic writes run only in the primary agent, except required compression checkpoints capture snapshots in any context. Ordinary turn/delegation capture requires plugins.isolation: in_process; isolated host mode reports that capture limitation while keeping recall, tools, native mirroring and required checkpoint snapshots. Queue overflow rejects new capture without evicting accepted evidence; v1 upgrades may replay previously delivered rows at the first required checkpoint. No telemetry, plugin-spawned separate processes or credentials stored outside Hermes."
maintainer: shuruheel
tier: community
category: memory
requires_hermes: ">=0.22.0"
docs_url: https://github.com/shuruheel/mindgraph#readme
readme: true
capabilities:
  provides_tools:
    - mindgraph_memory
    - mindgraph_capture
    - mindgraph_reason
    - mindgraph_commit
    - mindgraph_plan
    - mindgraph_retrieve
    - mindgraph_remember
    - mindgraph_series_query
    - mindgraph_ingest
    - mindgraph_synthesize
    - mindgraph_ontology
  provides_hooks:
    - on_turn_start
    - on_session_end
    - on_session_switch
    - on_pre_compress
    - on_memory_write
    - on_delegation
  provides_middleware: []
  requires_env:
    - MINDGRAPH_API_KEY
