description: "Direct Mistral Vibe subscription access — browser PKCE login, dedicated credential pool, account-visible catalog discovery, relay-verified reasoning_effort for GLM models and mistral-large-4 (low/medium/high). Disclosure — unofficial, not affiliated with Mistral. \"hermes auth add mistral-vibe\" runs a browser PKCE sign-in against Mistral's Vibe console endpoints (console.mistral.ai/api/vibe/*) and stores the returned API key in the Hermes credential pool (auth.json, slice mistral-vibe), or uses MISTRAL_VIBE_API_KEY. Prompts and model listing go only to api.mistral.ai/v1. Vibe subscription coverage of API use is not guaranteed and may bill as pay-as-you-go. Logout clears the local pool but does not revoke the key remotely."
