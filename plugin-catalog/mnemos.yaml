name: mnemos
title: Mnemos
repo: https://github.com/Riley-Coyote/mnemos-mcp
sha: "17ff72f12380a434102534bbdfc8b9661035ad2d"
subdir: hermes-plugin
description: "A memory of the agent's own. It keeps what it decides to keep, in its own words, wakes with it at the start of every session, and with each message the few memories that bear on it come back to it (which strengthens them, and notes their ids); no memory is written from a conversation on its own. Memories fade unless used, and before one is gone the agent is asked what it taught. What you ask it to always remember never fades. Hermes's MEMORY.md and USER.md stay on, and what the agent writes there is kept too. Each profile is its own agent with its own memory, one SQLite file on this machine that stays when the plugin is removed. No key or account needed. Disclosure — no network and no telemetry unless you choose it: deep_maintenance with a provider chosen for Mnemos (MNEMOS_LLM_PROVIDER, or llm.provider in ~/.mnemos/config.json: openrouter, openai, or anthropic where Hermes's Python has its package) sends memory text to that provider when the agent saves or corrects a memory and during upkeep, and MNEMOS_EMBEDDING_PROVIDER=gemini (or embeddings.provider in that file) sends Google the words of what the agent keeps and shares (its memories, notes and journal) and of each message and search; keys are read only through agent.secret_scope, never from a file, and only a chosen provider's key goes to the upkeep process, by name; the memory lives outside HERMES_HOME, in ~/.mnemos/hermes.db or ~/.mnemos/hermes-<profile>.db, with settings in $HERMES_HOME/mnemos.json and the quiet hours' choices and record in ~/.mnemos/hours/, and Mnemos reads ~/.mnemos/config.json and Hermes's config.yaml and cron/jobs.json; what the agent marks shared goes to ~/.mnemos/shared-memory.db, readable by every Mnemos agent on the machine; for hermes backup it names every profile's memory (reading each profile's mnemos.json, and asking Hermes where that profile's memory is) and holds a read on each until the backup is done, at most an hour, so the copy is whole; upkeep, when due, runs in a short-lived child Python process that exits when done, and the plugin schedules nothing itself; its quiet hours (scheduled runs with nobody there: the agent's own hour, one over the day's work, and a dream over its memory; macOS and Linux) are off until the person says yes, one hour at a time, in the agent's first session (for an agent that already had Mnemos, in its next sessions until the person answers, at most three), and the agent makes each one they want with Hermes's own cronjob_manage, the job's enabled_toolsets limiting it to its memory's tools (the day's conversations too for the day's work, and the web only for an hour the person allows); each hour's reply stays on this machine, and the hours run only while Hermes's gateway runs, on the model Hermes is set to use, which sees what an hour reads of the memory; mnemos_page serves a page on 127.0.0.1 (a port the system picks, a fresh path, this machine only) while the conversation that opened it goes on and while someone is using it, and closes about ten minutes after both end; the page writes only in this agent's memory, and in Hermes's classic CLI it also shows the other agents whose memory Mnemos keeps in ~/.mnemos, only to read (page_shows_other_agents set to false in mnemos.json turns that off); the system prompt carries Mnemos's rules for keeping a memory and the agent's wake; on first start it raises the process's open-file limit to 4096 if lower."
maintainer: Riley-Coyote
tier: community
category: memory
requires_hermes: ">=0.23.0"
docs_url: https://github.com/Riley-Coyote/mnemos-mcp/tree/17ff72f12380a434102534bbdfc8b9661035ad2d/hermes-plugin#readme
version: "0.7.0"
image: https://raw.githubusercontent.com/Riley-Coyote/mnemos-mcp/17ff72f12380a434102534bbdfc8b9661035ad2d/hermes-plugin/docs/banner.png
readme: true
known_issues:
  - "If you connected Mnemos before with `mnemos connect hermes`, install with --force, which replaces the folder connect wrote. The agent keeps its memory and its settings."
  - "If Hermes's gateway serves several profiles and you named the memory only where it starts (MNEMOS_DB_PATH and the like), 0.7.0 passes it over, says so in Hermes's log, and the profile wakes in a memory of its own, ~/.mnemos/hermes.db or ~/.mnemos/hermes-<profile>.db. To go on with the earlier one, which is untouched, stop Hermes, put the same MNEMOS_ lines in the profile's own .env and take db_path, agent_id, person_id and project_scope out of $HERMES_HOME/mnemos.json, as the README's \"Upgrading from 0.6.6\" says (it applies to 0.6.7 too)."
capabilities:
  provides_tools:
    - mnemos_capture
    - mnemos_recall
    - mnemos_correct
    - mnemos_handoff
    - mnemos_journal
    - mnemos_note
    - mnemos_reflect
    - mnemos_introduce
    - mnemos_maintain
    - mnemos_health
    - mnemos_page
    - mnemos_hour
  provides_hooks:
    - on_turn_start
    - on_session_end
    - on_session_switch
    - on_memory_write
  provides_middleware: []
  requires_env: []
