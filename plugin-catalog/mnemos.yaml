title: Mnemos
description: "Sovereign memory provider for Hermes Agent (memory.provider mnemos): facts are encrypted on the machine (XChaCha20-Poly1305), stored as Walrus testnet blobs, and indexed by an owned Sui MemoryIndex whose hash chain is signed by the user key. MIT license. Disclosure — a flush, checkpoint, restore, init, or doctor contacts the Walrus testnet publisher https://publisher.walrus-testnet.walrus.space (PUT /v1/blobs) and aggregator https://aggregator.walrus-testnet.walrus.space (GET /v1/blobs/<id>), Sui testnet gRPC https://fullnode.testnet.sui.io:443, and Sui testnet GraphQL https://graphql.testnet.sui.io/graphql; hermes mnemos init also calls the Sui testnet faucet https://faucet.testnet.sui.io. Payloads sent to Walrus are ciphertext; the Sui object stores blob ids, hashes, and signatures, not plaintext. Prefetch and recall do not use the network. When MNEMOS_NATIVE_AUTO is not 0 and mnemos_core is not already installed, the first open downloads the matching abi3 wheel and SHA256SUMS from https://github.com/bugnarokdev/mnemos/releases/download/mnemos-native-v0.2.1/, checks the sha256, and loads it (set MNEMOS_BACKEND=python to skip). Those wheels are built by the plugin repository's public GitHub Actions workflow .github/workflows/native-wheels.yml on tag mnemos-native-v0.2.1 (commit 468ba3898912ed3a1a31e43b56085270106cd5b4) and carry GitHub build-provenance attestations (actions/attest-build-provenance). There is no telemetry."
maintainer: bugnarokdev
