title: Mnemos
description: "Sovereign memory provider for Hermes Agent (memory.provider mnemos): facts are encrypted on the machine (XChaCha20-Poly1305, keys from MNEMOS_SECRET via Argon2id then HKDF-SHA256), stored as Walrus testnet blobs, and indexed by an owned Sui MemoryIndex whose hash chain is signed by the user key. MIT license. Disclosure — a flush, checkpoint, restore, init, doctor, or history contacts the Walrus testnet publisher https://publisher.walrus-testnet.walrus.space (PUT /v1/blobs) and aggregator https://aggregator.walrus-testnet.walrus.space (GET /v1/blobs/<id>) and Sui testnet gRPC https://fullnode.testnet.sui.io:443, which serves both writes and reads; Sui testnet GraphQL https://graphql.testnet.sui.io/graphql is used for a freshness check and as a read fallback only when the fullnode read fails and GraphQL reports Sui testnet within graphql_max_lag (default 100) checkpoints of the fullnode, otherwise the read is refused; hermes mnemos init also calls the Sui testnet faucet https://faucet.testnet.sui.io. Before any signature or upload the RPC must report the Sui testnet chain id, otherwise nothing is signed (fail-closed). Payloads sent to Walrus are ciphertext; the Sui object stores blob ids, hashes, and signatures, not plaintext. Prefetch and recall do not use the network. The native Rust extension is opt-in: by default the Python backend is used and nothing is downloaded. Only when MNEMOS_NATIVE_AUTO=1 and mnemos_core is not already installed, the first open downloads the matching abi3 wheel from the fixed URL https://github.com/bugnarokdev/mnemos/releases/download/mnemos-native-v0.2.3/, loads it only if it matches a sha256 checksum hardcoded in the pinned code (no URL override), extracts it under $HERMES_HOME/mnemos/native/mnemos-native-v0.2.3/ and appends that directory to sys.path. Those wheels are built by the plugin repository's public GitHub Actions workflow .github/workflows/native-wheels.yml on tag mnemos-native-v0.2.3 (commit 82fba1327b29ed6f1441bccea4e97c070818359c) and carry GitHub build-provenance attestations (actions/attest-build-provenance). hermes mnemos history --verify checks every snapshot (blob sha256, hash chain, Ed25519 signatures) without the secret. There is no telemetry."
