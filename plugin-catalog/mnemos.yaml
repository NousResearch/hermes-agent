title: Mnemos
description: "Sovereign memory provider for Hermes Agent (memory.provider mnemos): facts are encrypted on the machine (XChaCha20-Poly1305, keys from MNEMOS_SECRET via Argon2id then HKDF-SHA256), stored as Walrus testnet blobs, and indexed by an owned Sui MemoryIndex whose hash chain is signed by the user key. MIT license. Disclosure — this plugin uses Sui/Walrus testnet only: it derives a Sui key from MNEMOS_SECRET (Argon2id, then HKDF) or uses MNEMOS_SUI_PRIVATE_KEY and, with no per-action approval, signs Sui testnet transactions and pays testnet gas after every turn, memory write, pre-compress checkpoint and session end, and from the model-callable mnemos_flush tool; before any signature or upload the RPC must report the Sui testnet chain id, otherwise nothing is signed or uploaded (fail-closed). Each flush uploads XChaCha20-Poly1305 ciphertext of turns, memory writes and checkpoints to the public Walrus testnet publisher https://publisher.walrus-testnet.walrus.space and appends blob ids, hashes and signatures to the user's Sui MemoryIndex via the Sui testnet fullnode https://fullnode.testnet.sui.io:443, which serves writes and reads; Sui testnet GraphQL https://graphql.testnet.sui.io/graphql is used for a freshness check and as a read fallback only when it reports Sui testnet within graphql_max_lag (default 100) checkpoints of the fullnode; restore, history and doctor read https://aggregator.walrus-testnet.walrus.space; hermes mnemos init calls the Sui testnet faucet https://faucet.testnet.sui.io. With MNEMOS_NATIVE_AUTO=1 (off by default) the first open downloads a native mnemos_core wheel from the fixed URL https://github.com/bugnarokdev/mnemos/releases/download/mnemos-native-v0.2.3/, loads it only if it matches a sha256 hardcoded in the pinned code, extracts it under $HERMES_HOME/mnemos/native/mnemos-native-v0.2.3/ and imports it into the Hermes process; those wheels are built and attested by the repository's GitHub Actions workflow from tag mnemos-native-v0.2.3 (commit 82fba1327b29ed6f1441bccea4e97c070818359c). A plaintext local cache is kept in $HERMES_HOME/mnemos/mnemos.sqlite; prefetch and recall stay local; there is no telemetry."
