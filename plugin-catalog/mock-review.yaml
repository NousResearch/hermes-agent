name: mock-review
title: Mock Review
repo: https://github.com/apelabs-dev/hermes-mock-review
sha: "4ec3b90d63ef82efa2c91c6e62845e1f16f66d88"
version: "1.2.0"
description: "Review boards for UI mockups and plans. The agent builds a board from a decisions.json file and your prototype pages; you open it on desktop or phone, mark each decision approve, change or skip, pin comments on the mocks and press Send, and your agent wakes up with the feedback as a markdown digest. Plan boards add question cards and one footer button, Build, which stays locked until nothing is open and then wakes the agent with the approved plan; mocks carry working controls by default (`interactive_elements`). A design profile bound to a project is enforced: a round with off-profile colours or fonts is refused unless `--off-brand` gives a reason. Five mock_review tools, the `hermes mockreview` CLI and slash command, a bundled usage skill, and a stdio MCP server (`bin/mockreview mcp`) that serves the same five tools to Claude Code, Codex or OpenCode without Hermes; that server starts only when you add it to such a client, and its boards do not wake an agent unless you pass `--wake`. Boards are served from your computer (loopback by default, or your tailnet) or published on here.now, behind a random per-review password by default (`herenow_password` setting, `--no-password` per review, `hermes mockreview password <id> on|off` on a live board). Plain http(s) links in mocks stay clickable and open in a new tab; every other link scheme is stripped. Disclosure — when autostart is on (off until `hermes mockreview setup`), a board web server (127.0.0.1:8790 by default) and one worker thread run inside the gateway process; setting host to 0.0.0.0 exposes every review to your network with no login. Outbound calls: a signed POST to the local Hermes webhook (localhost:8644, or the receiver you name in MOCKREVIEW_WEBHOOK_URL for the MCP server) on Send or Build, and, only for reviews hosted on here.now, https://here.now/api/v1 with your HERENOW_API_KEY (publish, Site Data reads, a metadata PATCH that sets or removes the board password, delete on close). Secrets are read through Hermes's secret scope, or from the process environment when the stdio MCP server runs without Hermes; no credential file is read. Runs `bash publish.sh` from the official here-now skill (key in the child environment), and for a password-protected here.now prototype launches your installed Chrome, Chromium or Edge headless (throwaway profile, credential-named variables removed from its environment, `--no-sandbox` only when run as root) to load the board behind its password before the link is shared; runs `git -C <project> rev-parse --show-toplevel --git-common-dir` (read only) to match a project to its bound design profile; runs `tailscale status --json` and `tailscale serve status --json` (read only; on macOS the Tailscale app's own binary if the symlink crashes) for tailnet hosting, and from `setup` the hermes subcommands `--version`, `gateway status`, `config get/set/unset`, `webhook subscribe`, `webhook remove` (only for a stale self-delivering route, after you confirm) and `plugins validate`. The opt-in `wake_toolsets` setting lets the session woken by Send use the toolsets you list (for example terminal and file), so board feedback reaches those tools; setup refuses it while any waking board is ungated and only prints the `toolsets` line for you to add to the wake route by hand (re-add it after every setup run). Reviews are stored under $HERMES_HOME/workspace/mock-reviews. No telemetry, no update check, no Python dependencies."
