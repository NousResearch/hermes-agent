name: mock-review
title: Mock Review
repo: https://github.com/arspesk/hermes-mock-review
sha: "fb3d07bae45ab7a30f57fdc8cbc0e36df016e996"
version: "1.0.1"
description: >-
  Review boards for UI mockups. The agent builds a board from a decisions.json file and
  your prototype pages; you open it on desktop or phone, mark each decision approve,
  change or skip, pin comments on the mocks and press Send, and your agent wakes up with
  the feedback as a markdown digest. Four mock_review tools, the `hermes mockreview` CLI
  and slash command, and a bundled usage skill. Boards are served from your computer
  (loopback by default, or your tailnet) or published on here.now. Disclosure — when
  autostart is on (off until `hermes mockreview setup`), a board web server
  (127.0.0.1:8790 by default) and one worker thread run inside the gateway process;
  setting host to 0.0.0.0 exposes every review to your network with no login. Outbound
  calls: a signed POST to the local Hermes webhook (localhost:8644) on Send, and, only for
  reviews hosted on here.now, https://here.now/api/v1 with your HERENOW_API_KEY. Secrets
  are read through Hermes's secret scope only. Runs `bash publish.sh` from the official
  here-now skill (key in the child environment), `tailscale status --json` and `tailscale serve status --json`
  (read only; on macOS the Tailscale app's own binary if the symlink crashes) for tailnet
  hosting, and from `setup` the hermes subcommands `--version`, `gateway status`,
  `config get/set/unset`, `webhook subscribe`, `webhook remove` (only for a stale
  self-delivering route, after you confirm) and `plugins validate`. Reviews are stored under $HERMES_HOME/workspace/mock-reviews. No telemetry,
  no update check, no Python dependencies.
maintainer: "arspesk"
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://github.com/arspesk/hermes-mock-review#readme
image: https://raw.githubusercontent.com/arspesk/hermes-mock-review/57b1f581d03cb266b89bb4b6239573504a6405a6/docs/img/catalog-banner.jpg
screenshots:
  - https://raw.githubusercontent.com/arspesk/hermes-mock-review/fb3d07bae45ab7a30f57fdc8cbc0e36df016e996/docs/img/review-board.png
platforms: []
known_issues:
  - "here.now hosting needs the official here-now skill in the active profile (`hermes skills install official/productivity/here-now`) and a HERENOW_API_KEY; local and tailnet hosting need neither."
  - "Waking the agent on Send needs the gateway's webhook platform; `hermes mockreview setup` enables it and creates the route."
capabilities:
  provides_tools:
    - mock_review_create
    - mock_review_add_round
    - mock_review_feedback
    - mock_review_list
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - HERENOW_API_KEY
    - MOCKREVIEW_WEBHOOK_SECRET
