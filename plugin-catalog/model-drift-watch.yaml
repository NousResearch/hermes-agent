description: "Catches silent quality drift in your model: 34 questions graded exactly against its baseline. Messages only for a confirmed drop, a changed served model, or a failed measurement. Disclosure — calls your model via ctx.llm on your bill (cap 120,000 tokens and $0.50); model_drift can start one; may fetch OpenRouter or models.dev prices; 10 code questions, off by default, run model-written Python in a limited child, not a sandbox, in unattended cron; job and script stay after removal until unschedule; no extra agent turn; questions still count on the cap; history stays in plugin-data/model-drift-watch; no telemetry; gateway users can run it at your cost; hermes tools turns it off per surface; disable stops /model-drift-watch."
