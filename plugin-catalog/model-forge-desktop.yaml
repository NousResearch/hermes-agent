description: "Model Forge cockpit pane for Hermes Desktop — compute targets, live engines, loaded models and hardware at a glance. Companion UI for the Model Forge plugin. Disclosure — the pane polls each compute target you register in Model Forge (plus http://127.0.0.1:8080 by default) with read-only GET requests to /v1/models, /api/tags and /system_stats to show which local engines are running, reads Model Forge's own targets file through a read-only shell command, and runs Model Forge's read-only hardware and memory probes when you open the resource view; no generation calls, no writes, no credentials, no background processes, no telemetry. Disclosure — model pulls download weights from huggingface.co or modelscope.cn on user request, and model_forge_browse queries the public huggingface.co model API for fresh listings unless fresh=false (optional HF_TOKEN / MODELSCOPE_API_TOKEN pull credentials live in plugin settings, are read only through Hermes' secret route and are sent only to their own host family); shell commands are read-only hardware probes (nvidia-smi, rocm-smi) plus vendor engine installers — model_forge_install action=engine_install runs a pinned vendor installer (a SHA-256-verified install script, or a pinned git commit checked out and re-verified before setup runs) in a background job only after Hermes approval; every child process (installers, engine servers, hardware probes) runs with a minimal environment (PATH, HOME, LANG, TMPDIR plus declared engine variables) that never carries credentials; hardware probes read local system state (GPU queries, sysfs, the Windows memory API) while remote compute targets use user-declared budgets; adding a compute target, deleting a model-storage entry, model_forge_activate with apply=true (which rewrites model.default, model.provider and base_url in config.yaml and adds a custom_providers entry), running a vendor installer, and any broker claim, swap, release or media job that would start an inference engine server process each ask for Hermes approval first; started engine servers (llama-server, vLLM) bind 127.0.0.1 only; media jobs and Maya pulls POST prompts and image bytes to user-configured endpoints; the bundled TTS helper POSTs text and base64 voice-clone reference audio to a user-configured /v1/audio/speech endpoint; background processes are the download daemon thread, approved installer jobs and approved engine server processes; no telemetry."
