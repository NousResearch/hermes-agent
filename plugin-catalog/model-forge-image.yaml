description: "Model Forge local image-generation backend — routes Hermes image_generate to either a raw ComfyUI endpoint (native /prompt workflows, no separate facade required) or any OpenAI-compatible images API (media gateway, vLLM-Omni, SGLang Diffusion). Companion package for the Model Forge plugin. Disclosure — sends prompts, and any local PNG/JPEG/WebP image file named as an edit or reference input, to the image endpoint the user configures and reads its /models or /system_stats listing; no third-party network calls, no shell commands, no stored credentials, no telemetry."
