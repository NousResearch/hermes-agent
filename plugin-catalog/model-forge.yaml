sha: 7b564492d6d505ccb911f0d72923546afeb981e2
subdir: model-forge
description: "Local models for every modality — chat, vision, OCR, image generation and editing, video, 3D meshes, music, SFX and voice. Model Forge finds your hardware (local probes; remote compute targets use the budgets you declare), shows which models fit, maps each model to the right inference engine (llama.cpp, Strata, Ollama, vLLM, ComfyUI, a user-configured OpenAI-compatible media gateway and more), pulls the model, and wires it into Hermes as a provider — so chat, image_generate, video_generate, vision and TTS run on hardware you control with no account and no API key. Six tools: model_forge_status (targets, VRAM/RAM, engines, loaded models), model_forge_browse (per-modality model catalog with hardware-fit verdicts), model_forge_target_add (register compute targets), model_forge_install (pull models through engine-native paths), model_forge_activate (wire a running chat model into Hermes), model_forge_generate_media (3D, music and SFX jobs through a user-configured OpenAI-compatible media gateway). Disclosure — model pulls download weights from huggingface.co or modelscope.cn on user request, and model_forge_browse queries the public huggingface.co model API for fresh listings unless fresh=false (optional HF_TOKEN / MODELSCOPE_API_TOKEN pull credentials live in plugin settings, are read only through Hermes' secret route and are sent only to their own host family); shell commands are read-only hardware probes (nvidia-smi, rocm-smi) plus vendor engine installers — model_forge_install action=engine_install runs a pinned vendor installer (a SHA-256-verified install script, or a pinned git commit checked out and re-verified before setup runs) in a background job only after Hermes approval; every child process (installers, engine servers, hardware probes) runs with a minimal environment (PATH, HOME, LANG, TMPDIR plus declared engine variables) that never carries credentials; hardware probes read local system state (GPU queries, sysfs, the Windows memory API) while remote compute targets use user-declared budgets; adding a compute target, model_forge_activate with apply=true (which rewrites model.default, model.provider and base_url in config.yaml), running a vendor installer, and starting an inference engine server process each ask for Hermes approval first; started engine servers (llama-server, vLLM) bind 127.0.0.1 only; media jobs and Maya pulls POST prompts and image bytes to user-configured endpoints; the bundled TTS helper POSTs text and base64 voice-clone reference audio to a user-configured /v1/audio/speech endpoint; background processes are the download daemon thread, approved installer jobs and approved engine server processes; no telemetry."
maintainer: mr-pewpy
tier: community
category: tools
