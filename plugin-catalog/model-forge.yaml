name: model-forge
title: Model Forge
repo: https://github.com/mr-pewpy/model-forge
sha: a0f8a93bb7da48adb72f2052b103dab642435529
subdir: model-forge
description: "Unified local-AI platform for Hermes — one install ships all eight tools, the native Hermes Desktop workspace (/model-forge with a first-run quickstart hero, sidebar nav, Settings -> Plugins -> Model Forge pages, dockable side pane, and backend REST API with zero browser CORS or chat-session limits), and built-in image_generate / video_generate providers supporting both OpenAI /v1 APIs and direct ComfyUI /prompt workflows (no separate facade daemon required). Find your GPU (local probes; remote compute targets use user-declared or engine-suggested budgets), connect LAN or cloud GPUs without editing JSON, search Hugging Face live, pull models across every modality and engine (llama.cpp, Ollama, Strata, Project Maya, vLLM, SGLang, ComfyUI, Exo, OpenAI-compatible gateways), start installed local engines behind approval, and pipe them natively into Hermes. Eight tools: model_forge_status, model_forge_browse (curated fit catalog + keyword HF search), model_forge_target_add, model_forge_install (model pulls including streaming Ollama /api/pull, Maya /api/pull, Exo placement, HF weight downloads, pinned vendor engine installers, and loopback-only engine_start / provenance-tracked engine_stop), model_forge_activate (chat, vision, image and video wiring, including direct ComfyUI endpoints), model_forge_generate_media, model_forge_storage, and model_forge_broker. Disclosure — probes only user-configured endpoints (refusing cloud metadata hosts on /probe) and the public Hugging Face API unless fresh=false; downloads weights from huggingface.co or modelscope.cn or runs HTTP /api/pull on your Ollama / Maya target (optional HF_TOKEN / MODELSCOPE_API_TOKEN live in Hermes' secret store and are sent only to their own hosts); unified Desktop UI uses ctx.rest('/api/plugins/model-forge/*') with zero shell.exec and zero browser CORS probes, saves user-submitted target/engine/media settings via plugins.manage settings and saves/removes HF_TOKEN via Hermes' model.save_key / model.disconnect (never displays secret values); read-only hardware probes (nvidia-smi, rocm-smi) and local CLI PATH checks; adding a compute target, deleting storage, model_forge_activate with apply=true (writing model.*, custom_providers, auxiliary.vision, image_gen, or video_gen), running a pinned checksum-verified vendor installer, launching a local engine (ollama, exo, vllm — bound to 127.0.0.1 only, shell=False, minimal env without credentials), and broker/media engine starts each require human approval first; stopping an externally-started server is gated; ComfyUI image refs pass URL-safety checks and outputs stay root-confined; background processes are download/pull daemon threads, approved installer jobs, and approved local engine servers; no telemetry."
maintainer: mr-pewpy
