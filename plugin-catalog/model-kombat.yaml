# Catalog entry for Model Kombat — prepared for the submission PR that adds
# this file as plugin-catalog/model-kombat.yaml in NousResearch/hermes-agent.
#
# `category: models` — the catalog shelf taxonomy (desktop | memory | platform |
# web | tools | voice | automation | models | general) has no evaluation shelf;
# `models` covers plugins whose subject matter is model choice and behaviour
# (leaderboards, drift, routing, selection). Model Kombat routes nothing and
# changes no model config — it evaluates models — so `models` is the right
# shelf; `tools` would be the generic fallback.

name: model-kombat
repo: https://github.com/DarkeTech/model-kombat
# One line to change at PR time: replace these 40 zeros with the submitted 40-char commit SHA.
sha: "1d9c6aca7d9253e59306500fab1a37a4d90d1dd1"
title: "Model Kombat"
description: "Head-to-head model evaluation: scout a task or kanban card into lanes, build a deterministic fight card (Warm-up 1pt, Main Event 2pt, Championship 3pt, sudden death) at standard, hard or gauntlet intensity, fight two models on identical prompts, and score mechanically — executed code, exact counts, numeric tolerances, phrase groups, JSON leaf equality, SQLite rows — with a per-lane Elo ladder, live arcade pane and kanban recommendation badges, and a measured best-value call ('equal quality — X is 18x cheaper and 2.8x faster') when two strong models tie; a local task_stats.json remembers which tasks actually split the two models and demotes saturated ones. Disclosure — network: no third-party calls, fights go through the host LLM facade and the dashboard API is local and read-only; LLM spend: two model calls per task, capped per pure fight by max_fight_cost_usd and max_fight_tokens (agentic worker sessions are billed separately and not capped); cost estimation: the shipped prices.json and the model_prices setting are local price data used to ESTIMATE cost, unknown prices show n/a and never $0; subprocess/code execution: off by default, and when enabled model-written Python runs in a resource-limited subprocess as your user — defense-in-depth, not a security sandbox; kanban writes: creates unassigned display cards on a dedicated model-kombat board through the host terminal tool, never dispatched; file writes: reports, history, exports and task_stats.json under the plugin data dir only; desktop plugin and read-only dashboard API included; no telemetry; never reads credentials."
maintainer: DarkeTech
tier: community
category: models
requires_hermes: ">=0.23.0"
docs_url: https://github.com/DarkeTech/model-kombat#readme
version: "0.7.0"
platforms: []

