# Catalog entry for Model Kombat — prepared for the submission PR that adds
# this file as plugin-catalog/model-kombat.yaml in NousResearch/hermes-agent.
#
# `category: models` — the catalog shelf taxonomy (desktop | memory | platform |
# web | tools | voice | automation | models | general) has no evaluation shelf;
# `models` covers plugins whose subject matter is model choice and behaviour
# (leaderboards, drift, routing, selection). Model Kombat routes nothing and
# changes no model config — it evaluates models — so `models` is the right
# shelf; `tools` would be the generic fallback.

name: model-kombat
repo: https://github.com/DarkeTech/model-kombat
# One line to change at PR time: replace these 40 zeros with the submitted 40-char commit SHA.
sha: "eca75709ff6deefb6745aee4c90c55e7a22a77b5"
title: "Model Kombat"
description: "Head-to-head model evaluation: scout a task or kanban card into lanes, build a deterministic fight card (Warm-up 1pt, Main Event 2pt, Championship 3pt, sudden death) at standard, hard or gauntlet intensity, fight two models on identical prompts, and score mechanically — executed code, exact counts, numeric tolerances, phrase groups, JSON leaf equality, SQLite rows — with a per-lane Elo ladder, live arcade pane, kanban badges, and a measured best-value call when strong models tie ('equal quality — X is 18x cheaper'); a local task_stats.json remembers which tasks split the two models and demotes saturated ones. Disclosure — model calls: all fights go through Hermes' own LLM facade with a per-call model override you must enable (`plugins.entries.model-kombat.llm.allow_model_override`); pure fights make two model calls per task, capped by `max_fight_cost_usd` / `max_fight_tokens` and `max_fight_seconds`, which tool arguments can lower but never raise; agentic fights create kanban tasks assigned to your active profile with a per-task model override, which start worker agent sessions with that profile's tools and are not spend-capped; code execution: off by default and switchable only in plugin settings, and when enabled, model-written Python runs as your user in a resource-limited subprocess that is not a security sandbox; local files: reads optional project tasks from `.kombat/tasks.json` in the working directory and writes reports, history, ladder, exports and stats only under its plugin data dir; kanban: posts display cards on a dedicated `model-kombat` board and auto-closes its own stale cards there; no third-party network calls, no telemetry, no credential reads."
maintainer: DarkeTech
tier: community
category: models
requires_hermes: ">=0.23.0"
docs_url: https://github.com/DarkeTech/model-kombat#readme
version: "0.7.2"
platforms: []

