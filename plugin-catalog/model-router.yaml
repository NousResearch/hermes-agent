known_issues:
  - "Requires Hermes >=0.22.5 with native delegate backend registration, profile-scoped config/activation and public Desktop plugin settings. Compatible Windows runtime/SDK behavior is tested; full Linux/macOS runtime support is not claimed. The UI is Korean-first."
  - "The Auto backend and first-use default are feature-gated on the actual source/target installed code, not generic readiness. Old/partial installs fail closed for the new feature. Existing selected modes and explicit OFF/null remain unchanged; older DTOs/plans are not reinterpreted as approval for Auto."
  - "Auto means the agent selects one route per task, not nested delegation or a merged model/profile route. Profile tasks use the target's own model/reasoning. Fresh profile allowlists and cross-profile permission grants are empty; adding targets requires explicit account/tool-access consent. Native session tool ceilings are retained and whole target-MCP surface coverage is not certified. Profile routing is not an OS sandbox."
  - "Explicit first-use preparation may install/enable selected eligible missing packages and set only their absent backend selector. It does not copy dormant fallback/cost/profile grants, credentials or model/time settings. Simple install/enable/open/refresh/register does not run this action. Existing/partial/custom/disabled or ambiguous routes require manual review."
  - "Native preparation uses exact fresh local route descriptors and the currently resolved source pin. Do not rename/delete/recreate profiles or edit packages during a write. Cancel/scope change stops unissued work, not an issued install; partial/unknown outcomes are never automatically retried. Settled and unknown writes retain the reload/rebase fence. Readiness-only refresh preserves dirty drafts."
  - "MODEL budgets use the origin Heavy/Light role policy; PROFILE budgets use the origin ordinary profile-child policy. Cost-approved native completion wakes remain under native stop/busy/ownership controls. A saved backend or newly registered tools may need a new session or supported explicit tool rebuild; no forced conversation reset occurs. Installation, hook registration and actual provider responses are distinct evidence."
  - "Heavy/Light may use the same model in independent purpose-bound jobs; that does not establish different-model review diversity. Main handles small bounded work; ordinary implementation delegation needs substantive independent parallel workstreams, with required independent Heavy review as an exception. This is guidance, not an API two-task minimum."
  - "Validation reports existing private-core-import compatibility warnings. Runtime/cold-source provenance uses supported native managed runtimes and refuses ambiguous sealed/multi-argument layouts. Skipped OS/availability and opt-in integration tests are not proof of coverage."
  - "Fast and fallback can increase API charges or subscription-credit use. Transports bypassing request middleware, including codex_app_server, remain outside Fast inheritance coverage. New release installation does not change existing saved Fast/fallback consent or budgets."
capabilities:
  provides_tools:
    - coding_route
  provides_hooks:
    - pre_api_request
    - post_api_request
    - api_request_error
    - pre_tool_call
    - post_tool_call
    - subagent_start
    - subagent_stop
  provides_middleware:
    - tool_execution
    - llm_request
  requires_env: []
requires_hermes: ">=0.22.5"
