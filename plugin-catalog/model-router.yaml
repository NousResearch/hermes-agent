name: model-router
title: "Model Router"
repo: https://github.com/metamindedu/hermes-model-router
sha: 5bb904cde317ee640410b8642c7484d56a164bad
description: >-
  Profile model settings and native purpose-bound Heavy/Light or allowlisted profile delegation.
  Explicit first-use preparation defaults only raw-unset backends to model-or-profile choice;
  installation, enablement, refresh and registration do not select a backend or grant profile/cost access.
  Existing modes, OFF/null selections, models, budgets and permissions are preserved.
  Each delegate_task task selects either origin-profile Heavy/Light models or an explicitly permitted
  profile using that target's own model/reasoning; these routes are not combined.
  The Desktop UI provides per-profile readiness, explicit missing-profile preparation and a target-profile
  allowlist with account/tool-use consent. Explicit settings saves change only the previewed profiles
  through the native config API/CLI; native package preparation is separate and bounded to 32 selected
  local profiles, requires dependency/activation consent, and never installs on refresh or into future profiles.
  Native subagents use the user's configured providers, tools and approval policy and may consume API or
  subscription quota. Ordinary and spare model continuation have separate backend-bound cost approval;
  other-profile access is never automatic. Background processes, wake/stop, ownership, tool ceilings and
  session records are managed by Hermes, not a private worker supervisor or credential store.
  The coding_route tool is read/config/join only for new work; old private worker starts are retired.
  Routing guidance defaults ON after trust/activation when its own saved choice is absent, but that is
  separate from backend selection and never launches work at installation. Existing routing OFF and skill
  opt-outs remain OFF. Configured zero timeouts can remove wall-clock caps. Fast inheritance on covered
  first-party routes can raise cost. No telemetry, self-updater, core monkeypatch or approval bypass.
maintainer: metamindedu
tier: community
category: models
version: "0.7.0"
