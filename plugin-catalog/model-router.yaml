known_issues:
- "Automatic in-plugin preparation of missing or newly created profiles remains unavailable for this release, also after this catalog pin is merged: its admission guard accepts only the older single-tool declaration. Install into each profile with the native CLI at the exact SHA and accept the dependency prompt (PyYAML>=6,<7, websockets>=15,<17); installation alone does not choose a delegation backend or grant full-profile access."
- "Partial saves (v0.15.0) need the same version in every profile and a refreshed settings page. Targets that cannot take a changed value are named and keep their own (a target on a different delegation method, an allow-list that lacks a newly chosen default). Delegation, spare-model and allow-list saves still compare each target's whole delegation settings and time-limit saves each target's whole time-limit revision, so an unrelated change elsewhere in those blocks asks for a reload."
- "Since v0.14.0 models are read from Hermes itself: a role Hermes cannot resolve (an unverified provider, an endpoint or credential override, a managed value) is shown read-only and only the slots that follow it refuse dispatch; change such a role in Hermes's own settings."
- "Upgrading to v0.18.0 needs a one-time conversion: v0.18 reads only its own formats (settings schema 5, timeouts schema 3, per-slot native delegation blocks) and refuses older ones (the page shows the error, routing fails closed, timeouts are read-only). Update the plugin in every profile, run python scripts/migrate_to_v018.py from the package directory with the Python that runs Hermes (dry run; then --apply), and restart every Hermes process. The script keeps each slot's effective model, resets slot runtime limits to the two-hour default, keeps the originals once as <file>.pre-v018, and refuses (writing nothing) enabled routing rerun spares or two-role delegation blocks with spare models on. Restarting before converting needs one more restart afterwards."
- "Since v0.18.1 removing a custom slot also clears its per-profile runtime limits; re-adding the same ID starts on the two-hour default. The preview includes each cleanup; concurrent changes require a new preview, and incomplete post-save cleanup is reported as partial. Custom slots (v0.17.0) have no spare models, cannot be renamed by id after saving, and appear to agents only in sessions started after they were saved. Labels and scopes refuse Unicode categories Cc, Cf, Cs, Zl and Zp, so emoji sequences joined with U+200D cannot be used. A custom slot is not a review purpose; required reviews still use semantic-final or independent-review."
- "ask_advisor (v0.16.0) blocks the asking agent's turn for up to its fixed 300-second limit and is not exempt from the host's generic tool deadline; it needs delegation depth budget (at the default max_spawn_depth 1 a delegated child gets depth_limit) and a session delegating through model-router or model-router-auto. The read-only guard covers tool calls, not reading: the child can read any file the parent could. It is not covered between unloading and re-registering the plugin's hooks during a reload or while the plugin is disabled. Parallel ask_advisor calls from one turn show their children as 종류 미확인 on the status line. Verified offline only (stubbed model turn)."
- "Requires Hermes >=0.23.1 with native delegation backends, profile-scoped config and public Desktop plugin settings. Runtime and Desktop behaviour were tested on Windows; Linux/macOS are not claimed. The UI is Korean-first."
- "hermes plugins validate is ok but warns about private core imports (34 sites since v0.18.0, e.g. hermes_cli.middleware.run_tool_execution_middleware, tools.delegate_tool_registry, hermes_cli.models.resolve_fast_mode_overrides); a Hermes release can break them. This inherited public-surface debt awaits a maintainer decision. The install scan reports caution exec_string at desktop/plugin.js:3495, which is the page's own staged save call to its CLI command through Hermes's cli.exec, not dynamic code execution."
- "The composer status line gates on the public Desktop SDK seam useComposerSession (feature-detected): it shows the strip under the composer whose stored session matches the focused chat, and since v0.15.1 also under the primary pane's composer for its own chat while a split tile holds focus. The primary case needs an owner proof: the owner the host's focusedSessionOwner reported while that exact chat was the focused primary, dropped on navigation, transport reset or owner retraction, and required to equal the live connection and profile. So the primary line appears only after the host has once reported that chat as focused (for example after selecting it in the sidebar); an unfocused tile shows nothing. On hosts without the hook it falls back to always showing the strip. It reads no host markup and attaches no document listeners; it never restyles or rewrites core UI."
- "Since v0.13.2 the execution roster reads scalar route metadata (backend/label/model/provider and the reported model) from this origin's own async_delegations ledger in state.db, read-only, to show the model a completed profile delegation ran on. Only already hook-bound rows (exact delegation unit + parent session + task index, plus the subagent id when both sides name one); no task, result, summary or transcript text, no whole JSON record, and no other profile's home is read. Fail-closed and bounded (primary-key lookup, size/entry caps, a Python-checked query deadline, first-error snapshot close), performed outside the shared hook lock, newest-first with a bounded negative cache; the database body is never written (a WAL read may create -shm/-wal sidecars). This is a disclosed bounded exception (see the repo SECURITY.md); the unadmitted private-schema research adapter remains excluded from the package."
- "The status roster lives in memory: after a Hermes restart the line stays hidden until the next subagent runs, and an upgrade from v0.13.0 starts with an empty roster once. Per-call token totals can undercount when a provider omits usage; model changes are observed request attempts, not confirmed replies."
- "Compression and title spare models: a spare on the same backend as the failed route is skipped, so a provider-wide failure (for example an exhausted quota) skips every spare from that provider; include another provider. Hermes may try the main model as a last resort. Chains with env expressions, administrator overlays, extra fields or provider-only entries are shown read-only, and env values are never returned. Saving Off writes [] for a stored chain and leaves an absent key absent."
- "The delegation model is not edited on the page (v0.13.0); use hermes config set delegation.model. Since v0.18.0 no slot follows it; profiles on Hermes's default delegation method are shown as their stored value and never switched silently."
- "Full-profile profile_task jobs are a separate OFF-by-default operator grant, not native profile delegation. They need a capable existing Gateway and a literal local working directory; no owner is started or recovered and no OS sandbox is supplied. Automatic parent return covers surviving-parent session lifetime only (persist_on_release:false); restart/reboot recovery and Linux/macOS return are not claimed. Unknown submissions are never replayed; revoking a grant blocks new admission but does not stop admitted work."
- "AI role proposals use the connected profile's saved main model and account, not the target's. Unknown/auto/custom or endpoint-overridden routes are refused; a user-installed external_process provider is admitted only with a process:// endpoint and a resolvable local executable. Credential-pool endpoints are not reflected in the disclosure, cancellation cannot recall an issued request, and credential filtering is a narrow pattern check: review the shown text."
- "Operator CLI authority for profile-job grants is existing local OS authority, not human attestation; approvals and clarifications stay in the native target conversation. A settings status read is limited to 64 pages, and a save body to 400,000 characters in 128 staged pieces."
- "Fast inheritance does not cover transports that bypass request middleware, including codex_app_server. When a task slot runs on Main's own model, delegation adds only a fresh context, not model diversity for review."
capabilities:
  provides_tools:
  - coding_route
  - profile_task
  - ask_advisor
  provides_hooks:
  - pre_api_request
  - post_api_request
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
  - post_compaction
  provides_middleware:
  - tool_execution
  - llm_request
  requires_env: []
requires_hermes: ">=0.23.1"
