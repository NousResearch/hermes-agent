name: model-router
title: "Model Router"
repo: https://github.com/metamindedu/hermes-model-router
sha: d91afc213a8ec38ea437989454e77f80bcfe6de6
description: "Profile model settings and native delegate_task routing for Hermes, with a Korean-first Desktop settings page (Settings → Plugins → 모델 및 라우팅) and a composer execution status line. A delegated task runs on the model of its task slot (design, complex code, simple code, simple verification, complex verification, computer use), each slot with optional spare models, or as an explicitly allowlisted local profile using that profile's own model, credentials and tools; with model-router-auto the agent chooses one of these routes per task. The status line shows each subagent's requested slot, the model/provider its own API calls reported (including observed spare-model switches), elapsed time, tool count and token totals; since v0.13.2 a completed profile delegation also shows the model/provider from the origin's stored delegation route report (read-only scalar metadata), and a refused, cancelled or timed-out request is settled instead of lingering as running. Its roster is bounded in-memory metadata (ids, counters, model/provider ids; no prompts, results or secrets); since v0.13.1 it survives an in-process plugin reload, but not a process restart. Separately opt-in Gateway-owned profile_task jobs (OFF with no targets until the host operator saves a grant with the hermes CLI) run work as another local profile through that profile's already-running Gateway; an explicit prepare/start(return_id) flow can return the result locator to the same surviving parent session (Windows, local NTFS/ASCII paths, session lifetime only), otherwise results are collected explicitly. coding_route only reads settings and inspects or joins historical jobs; new process starts are retired. No telemetry, self-updater, credential store, core monkeypatch or approval bypass. Disclosure — after you trust and enable the plugin, routing guidance defaults ON in installed profiles that have no saved choice; saved OFF and explicit skill opt-outs stay OFF. Installation does not select a delegation backend, change models, or grant profile, cost or full-profile-job access. Settings are written only by an explicit, previewed save to the profiles you select, through Hermes's config CLI with compare-and-set and readback: main, compression and title models and reasoning; conversation spare models (fallback_providers, saved with the model section since v0.12.1); compression and title-generation spare models (auxiliary.compression.fallback_chain and auxiliary.title_generation.fallback_chain, provider and model entries only, at most 5, since v0.13.0); the delegation method, per-slot spare policies and the profile allowlist (delegation.backend, delegation.backends.*; the allowlist is saved from its own 전문 프로필 위임 section); and skills.disabled when you re-enable routing (the whole-page save's routing pass can also write it for a routing-off profile that is not a model target). Config backups go to plugin-data/model-router/backups. Slot models and routing roles are kept in the plugin store plugin-data/model-router/settings.json. Since v0.13.0 the page no longer writes delegation.model, delegation.provider or delegation.reasoning_effort (change those in Hermes's own settings). Since v0.14.0 the router reads the conversation, delegation, compression and title models from each profile's current Hermes settings at read time (no background sync, no write), so an edit made in Hermes settings or the CLI is followed instead of reported as drift; a model save writes only the roles you edited. Since v0.15.0 every section save sends only the values you changed and each target keeps every value you did not change: edited task slots, edited per-slot spare models, an edited delegation method, changed time-limit fields and allow-list additions/removals/descriptions are merged into each selected profile's own settings, still with compare-and-set and readback. Picking target profiles no longer copies the loaded profile's whole settings; copying them is an explicit per-section 현재 설정 전체 복사 checkbox that starts unticked. Large saves are staged as temporary pieces under plugin-data/model-router/staged, deleted after use and expired after 10 minutes. Spare models and Fast inheritance (the parent session's Fast tier on first-party OpenAI/Codex routes) can raise API or subscription cost; saving spare models is the explicit cost consent. Allowlisting a profile is an explicit grant to use its model, credentials, tools and SOUL. The optional AI로 역할 제안 action, only after you press Generate, sends the target profile's profile.yaml description, its whole SOUL.md (up to 32 KiB, shown before sending, left out if it looks like it contains credentials) and enabled skill names to the current profile's saved main model. Native subagents and profile jobs use your configured providers, tools and approval policy and may consume quota; profile-job journals keep task prompts and results under plugin-data/model-router/jobs. Since v0.13.2
  the status line also reads model and provider names of finished delegations from this profile's own Hermes state.db, read-only (no task, result or transcript text)."
