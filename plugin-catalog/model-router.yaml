name: model-router
title: "Model Router"
repo: https://github.com/metamindedu/hermes-model-router
sha: 0459f842e0c682a68a1e6112d58886c243850846
description: "Native Heavy/Light purpose routing or explicitly allowlisted profile delegation through Hermes delegate_task. Desktop settings include an explicit first-time setup: eligible current local profiles start selected, native admission prepares their packages, and only previously unset backend selectors switch to Heavy/Light. Viewing, refreshing, registration and later profile discovery never install or save settings. Explicit OFF, saved backend choices, model/auth/fallback/budget settings and cross-profile grants are preserved. New work uses core-owned child lifecycle, tools, approvals, stop and results under the selected route's identity; child prompts/results are retained in the parent's private native session store. coding_route is role lookup and historical job status/join only, not a new detached-worker launcher. Profile execution requires a separate explicit allowlist; installation is not account-access consent. Optional continuation and inherited first-party Fast can consume additional API/subscription quota. No credential store, telemetry, self-updater or core override. Settings writes use the native config path; ordinary cards save only explicitly selected scopes/profiles and no longer copy standalone skills."
maintainer: metamindedu
tier: community
category: models
version: "0.6.0"
docs_url: https://github.com/metamindedu/hermes-model-router#readme
readme: true
platforms:
  - windows
screenshots:
  - https://raw.githubusercontent.com/metamindedu/hermes-model-router/0459f842e0c682a68a1e6112d58886c243850846/docs/fast-inheritance.png
known_issues:
  - "First-time setup is explicit and Desktop-local, maximum 32 selected profiles per run. Installation alone does not select delegation.backend, enable future profiles, provide missing model credentials or consent to spare models/account access. Open Settings > Plugins > Models and routing and run the initial setup action."
  - "Automatic install requires the current native catalog repository, full SHA and version to match the installed source. Until this catalog re-pin is maintainer-merged and published, a source release alone does not make new-profile automatic installation available. Normal security/dependency/capability admission is retained."
  - "Saved default/other backends, explicit OFF, managed/unreadable config, differing/custom executable packages and unknown write outcomes are not overwritten. Native enable that would widen an explicitly saved platform tool selection is manual-only; review it in the native plugin manager first."
  - "Fresh exact target descriptors on the same local source are required. Missing, duplicate, remote and aliased routes fail manual-only. Native name-bound APIs have no atomic incarnation CAS: do not rename/delete/recreate profiles or edit packages while preparing."
  - "Cancellation/scope change stops unissued operations, not an already-issued native install. Settled and unknown mutations retain a persisted owner-scoped rebase fence; unknown targets never retry automatically. Readiness-only refresh keeps dirty drafts; explicit full reload discards them."
  - "Only one delegation backend is selected per profile. Heavy/Light and profile delegation are alternative modes, not simultaneous dispatchers. Profile routes retain the target's own credentials/policy; existing conversations retain pinned tools until a supported rebuild/new-session boundary."
  - "Native continuation is OFF by default. Legacy standalone retry consent is not continuation consent. Profile routes use the target profile's fallback chain; source-side spare settings cannot override it. Zero total budget removes only that plugin total limit, not native request/inactivity limits."
  - "Historical process-backed jobs and read-only owner-bound join remain available. No new standalone starts, automatic legacy conversion, replay, deadline reset, or exactly-once inference claim."
  - "Heavy/Light may use the same model in independent purpose-bound jobs. Context separation is not different-model review diversity. Small bounded work stays with Main; required independent Heavy review remains separate."
  - "Windows/genuine-core and selected SDK transport branches are tested. Isolated React/SDK-stub geometry is not full live Electron/registry/provider certification. Korean-first Desktop UI; complete Linux/macOS coverage is not claimed."
  - "Private core imports remain a host-version compatibility risk and are disclosed by native validation. Native admission passes without runtime core overrides. A clean install/readiness result does not by itself prove successful provider execution."
  - "Fast and explicitly chosen continuation can raise usage/cost. Transports bypassing request middleware, including codex_app_server, are outside inherited Fast coverage. No provider calls run merely to initialize settings."
capabilities:
  provides_tools:
    - coding_route
  provides_hooks:
    - pre_api_request
    - post_api_request
    - api_request_error
    - pre_tool_call
    - post_tool_call
    - subagent_start
    - subagent_stop
  provides_middleware:
    - tool_execution
    - llm_request
  requires_env: []
requires_hermes: ">=0.22.5"
