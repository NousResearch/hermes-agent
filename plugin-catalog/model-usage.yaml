description: "Minimal triple-ring status-bar gauges for Claude and Codex — outer thin ring = context of the current chat, middle = 5-hour session, inner = weekly window, colored by remaining share — with a click-through detail popover and one-shot 30%/10% limit alerts (in-app toast + OS notification while Hermes is unfocused). Duplicate pool rows of the same login are merged. EN/KO/JA. Disclosure — no network calls of its own (reads the gateway's model.options usage cache and the focused chat's usage stats), never reads or stores credentials, no subprocesses, no telemetry; stores only the list of alerts already shown in plugin storage."
