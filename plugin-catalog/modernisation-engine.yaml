name: modernisation-engine
repo: https://github.com/Sahil-SS9/modernisation-engine
sha: fa35d9667283ec9c5246257a9ee5b076312fef7d
description: "Controlled migration engine: maps an existing codebase, turns the behaviour that must survive into reviewable contracts, prepares a separate candidate and records old/new evidence before any production change. Disclosure - assessment is source-read-only and never imports or runs repository code; untrusted workloads run in disposable, resource-limited, network-disabled rootless containers and execution stays unavailable without trusted operator configuration plus a fresh one-use owner grant; no host home, real credentials or Docker socket is mounted into a candidate; job records live in a private local data directory; no third-party network calls, no telemetry and no self-updater."
