title: Money Magnet
description: 'Finance tracker and money magnet for Hermes Agent: record income and expenses, set a monthly budget and watch it fill, value a crypto portfolio against live prices, and scan for price gaps between exchanges. Transactions and budget live in local JSON under $HERMES_HOME/money-magnet/. Disclosure: the portfolio and arbitrage tools query the public CoinGecko and Binance price APIs (no account or API key; only coin symbols are sent). The tracker tools work fully offline.'
