name: money-rules
repo: https://github.com/seedless-labs/hermes-money-rules
sha: 0862459bcfac37157513dee61c29dbac55df8441
description: >-
  Money rules for Hermes: pay, split, sweep and alert on USDC from your own Solana wallet,
  under rules you set in chat. You sign one capped USDC allowance (SPL approve) to a local
  helper key; USDC stays in your wallet until a rule pays, and every new rule waits for
  /money approve. Every payment started from chat goes through the Hermes approval prompt,
  and the relay fee is capped on the client (max_fee_usd, default 0.05). Rules fire on a schedule, when USDC comes in, or when a balance crosses
  a line. Gasless: a relay pays the Solana fee for a small USDC fee in the same
  transaction and only co-signs connect, revoke and pay. Disclosure — network calls to
  hermes-money-rules.vercel.app (connect page, fee co-sign, read-only RPC proxy) or your
  own rpc_url; a background thread checks the wallet every 30s while Hermes runs; a helper
  keypair, rules and history are stored under ~/.hermes/plugin-data/money-rules; the helper
  can only spend up to the signed cap and /money revoke zeroes it on-chain. No telemetry.
maintainer: seedless-labs
tier: community
category: tools
docs_url: https://github.com/seedless-labs/hermes-money-rules#readme
version: "0.2.0"
