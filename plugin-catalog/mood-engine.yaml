description: "Dynamic 4-axis mood engine (energy, warmth, patience, focus) with async post-turn evaluation, passive decay, and zero-token neutral baseline. Disclosure — in auto/llm mode each user turn runs one background ctx.llm.complete_structured() call on your active provider (or configured auxiliary.mood_eval model); set evaluator_mode to heuristic for zero extra tokens; stores mood state locally in profile-scoped ctx.state."
