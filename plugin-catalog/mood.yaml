title: Mood
description: "A tiny evolving mood for Hermes, built for slow local models. Tracks mood, rapport and three slow-moving traits (warmth, playfulness, directness) that change with keyword rules on what the user writes and drift back to neutral over hours, then appends one ~30-token line to each user message through pre_llm_call, so the system prompt and its cache are never touched. Adds a /mood command (show, reset, on, off). Disclosure — makes no model calls, no network I/O, runs no shell commands and holds no credentials; reads the text of each user message and reads/writes only its own plugin-data state file (state.json, per profile)."
maintainer: huy-sec
