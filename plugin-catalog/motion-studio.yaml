name: motion-studio
title: Motion Studio
repo: https://github.com/gregoryhorn/motion-studio
sha: cec4fa5406d689c4bf3952121f63429e4deeea18
description: Durable media projects, visual storyboards, timeline editing, bounded local rendering, captions, exact-candidate review, and checked delivery for Hermes.
maintainer: gregoryhorn
tier: community
category: desktop
version: "0.1.0"
readme: true
platforms: [linux]
known_issues:
  - "Early source preview with an unqualified-development runtime manifest. Broader production acceptance is incomplete; a downstream Breeze journey remains under investigation."
  - "The Desktop HTTP backend requires Hermes source revision 109fd8161a509db5a00942152ba48882e446e8b0, or the exact managed-runtime API bytes in studio/host-lock.json; other builds fail closed."
  - "Windows and macOS backend execution are not qualified. An observed Windows loaded-client/backend mismatch blocks saving; matching disk files do not establish loaded-code parity."
  - "Local Node 22+, Chromium, FFmpeg/ffprobe and optional media engines must already be installed and pass capability checks; plugin registration does not install them."
capabilities:
  provides_tools:
    - motion_project
    - motion_capabilities
    - motion_asset
    - motion_asset_library
    - motion_storyboard
    - motion_plan
    - motion_run
    - motion_caption
    - motion_review
    - motion_deliver
    - motion_ui_handoff
  provides_hooks:
    - pre_api_request
    - pre_tool_call
    - post_tool_call
    - post_api_request
  provides_middleware: []
  requires_env: []
