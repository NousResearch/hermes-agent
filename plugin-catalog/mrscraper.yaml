name: mrscraper
repo: https://github.com/ai-mrscraper/hermes-mrscraper-plugin
sha: 768a3bb0afcbe9aa95eeec7a9bfe03fb7dd2aaac
description: "MrScraper status, HTML, Markdown, screenshot, brand, JSON extraction, and web search via direct HTTP APIs. Disclosure — page, brand, JSON, and search requests can consume paid account tokens; target URLs, prompts, search queries, and request options are sent to MrScraper; mrscraper_status returns the MrScraper account record as the API sends it (account identity, plan, usage and billing fields), which reaches the model provider."
maintainer: ai-mrscraper
tier: community
category: web
docs_url: https://github.com/ai-mrscraper/hermes-mrscraper-plugin#readme
version: "4.0.0"
capabilities:
  provides_tools:
    - mrscraper_status
    - mrscraper_scrape_html
    - mrscraper_scrape_markdown
    - mrscraper_get_screenshot
    - mrscraper_scrape_brand
    - mrscraper_scrape_json
    - mrscraper_web_search
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - MRSCRAPER_API_TOKEN
requires_hermes: ">=0.21.4"
