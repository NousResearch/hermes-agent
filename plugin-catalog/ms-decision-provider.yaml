name: ms-decision-provider
repo: https://github.com/guglxni/ms-decision-provider
sha: f82d9bf5203496eb8a9ab7a7740a7909ab2c04cc
description: >-
  Microsoft-Decision-1 (Azure AI Foundry System One) decision provider for bounded
  agent decisions. Registers typed-decision tools (decision_noul, decision_choice,
  decision_score, decide) that preserve full probability distributions, plus an
  opt-in pre_tool_call hook that requests human approval for known-risk calls
  without sending their arguments to Azure. Reference implementation of the
  typed decision-provider runtime in #113008.
maintainer: guglxni
tier: community
category: automation
requires_hermes: ">=0.21"
docs_url: https://github.com/guglxni/ms-decision-provider#readme
platforms: []
capabilities:
  provides_tools:
    - decision_noul
    - decision_choice
    - decision_score
    - decide
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - AZURE_FOUNDRY_API_KEY
    - AZURE_FOUNDRY_BASE_URL
