title: MTG Deck Studio
description: "A Magic: The Gathering Commander deck table beside the chat. The AI reads the deck before it speaks, searches Scryfall inside the colour identity, explains the card-to-card synergy graph from Oracle text with the clauses behind every pair, writes a strategy guide from computed evidence, keeps a sideboard of candidates it can promote or swap in, and runs 49 table operations the player can also do by hand. Seven agent tools plus a bundled skill and a Desktop pane with a sandboxed viewer. Disclosure — card data and images come from the public Scryfall API and cards.scryfall.io (no key, no account, card names and filters only); the plugin reads only the deck/CSV file or folder that the player or the agent names at import (network shares and device paths are refused) and writes only inside its profile-scoped data directory (decks, sideboards, exports, the name-index cache, scan photos), which is never uploaded; two bundled MIT Python helpers run as subprocesses with the host interpreter (strategy evidence pack, Moxfield text export — no shell, no network of their own); the webcam opens only when the player presses Scan. No telemetry, no update checker, no stored credentials."
