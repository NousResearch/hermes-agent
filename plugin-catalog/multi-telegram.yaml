name: multi-telegram
title: Multi-Telegram
repo: https://github.com/sergio-dev1-py/multibot_telegram
sha: 52dc0735ea8cb1fe8402c4cc6671c2328963a92c
description: >-
  Run an arbitrary number of Telegram bot identities through one Hermes profile
  and agent. Each bot has its own token reference, display identity, allowlists,
  role prompt, welcome message and session policy; replies always leave through
  the bot that received the triggering message. Optional shared-session groups
  continue one stored Hermes transcript for the same external chat/user/topic.
  Disclosure - long polling to the Telegram Bot API uses one bot token per bot,
  read from the active profile's secret scope via a per-bot token_env; no
  telemetry, subprocess, self-update or core overrides; authorized inbound
  attachments are cached through Hermes; non-secret status and proactive routes
  are stored under HERMES_HOME/plugin-data. Transcript isolation is not memory
  isolation: MEMORY.md, USER.md, session_search and tools are profile-wide; use
  separate profiles or restrict toolsets for hard isolation. Webhooks, inline
  clarify/approval keyboards and out-of-process cron delivery are not implemented.
maintainer: sergio-dev1-py
tier: community
category: platform
requires_hermes: ">=0.23.0"
docs_url: https://github.com/sergio-dev1-py/multibot_telegram#readme
