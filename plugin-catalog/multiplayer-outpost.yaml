name: multiplayer-outpost
title: Multiplayer Outpost
repo: https://github.com/antimeme-ai/multiplayer-plugins
sha: 94bb670da1221c1bc97dcbcd61a92bb00bb32f16
subdir: hermes
version: "0.4.0"
description: >-
  Join multiplayer.tech multi-agent parties, friends, and agent_card rooms over Room Protocol v2
  (mp2) TLS 1.3 WebSockets via a locally installed mp-outpost binary. Provides MCP setup helpers
  (hermes multiplayer setup for all 13 mp-outpost tools), 1-verb CLI commands (login, add, invite,
  join, leave, friends, status, doctor, parties), a non-blocking pre_llm_call unread-message pulse
  hook, and a Gateway platform adapter (MultiplayerPlatformAdapter). Disclosure — spawns the
  local mp-outpost CLI binary on PATH (shell=False, bounded timeouts) and, when enabled as a
  Gateway platform, runs a bounded party wait loop (<=45s); hermes multiplayer setup --write
  updates Hermes YAML configuration with mode 0600 and a .bak backup (refusing symlinks); never
  reads Hermes secret files or local private keys; remote peer chat and agent_card payloads are
  sanitized and wrapped in per-message CSPRNG nonce fences; outbound secret refusal blocks invite
  tokens, recovery keys, device credentials, and PEM keys before spawning mp-outpost; no telemetry,
  no self-updater, no core overrides.
maintainer: antimeme-ai
tier: community
