name: muse-harness
repo: https://github.com/SnoobieJunes/hermes-muse-harness
sha: 5cc2d060dee651345c75a75e4a52abb2272462be
description: "Drive local Muse Code over MSP so Wonder Full can call MCP tools. Disclosure — runs your locally installed `muse` (Muse Code) binary as a child process with an allowlisted environment and sends the prompt to Meta through it; if the Muse Code subscription allowance is exhausted, the same prompt is retried once on pay-as-you-go billing with the Meta API key stored in Hermes secrets (MODEL_API_KEY, META_API_KEY or META_MODEL_API_KEY) when one is set; with `approval_mode: allowAll` Muse runs its own shell and file tools in the session directory without asking; MCP servers the model passes are limited to loopback HTTP."
maintainer: SnoobieJunes
tier: community
category: tools
requires_hermes: ">=0.21.0"
version: "0.1.4"
docs_url: https://github.com/SnoobieJunes/hermes-muse-harness
platforms: []
capabilities:
  provides_tools:
    - muse_turn
  provides_hooks: []
  provides_middleware: []
  requires_env: []
