description: "Myeline is a remote MCP memory server: every memory is a single fact with its source attached, AI proposals land in a human review queue, and removing a fact takes a written reason kept in an audit log. One retraction stops a stale fact in every connected assistant at once. Maintained by Sandbox Group, the Myeline vendor. Disclosure — registers the vendor-hosted remote MCP server cortex.myeline.si/mcp, signed in through Hermes's remote MCP OAuth with your own Myeline account; the queries and facts the model sends in Myeline tool calls are stored and processed on Myeline's servers, and the server defines its own tool list, which can change without a new catalog pin."
