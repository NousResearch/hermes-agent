known_issues:
  - "Google sync needs your own Google Cloud OAuth client (Desktop app, People API on), set as MYFOLKS_GOOGLE_CLIENT_ID and MYFOLKS_GOOGLE_CLIENT_SECRET; file import needs nothing."
  - "Tested in Telegram, the Hermes terminal and Hermes Desktop. Other chat apps and Windows are untested."
platforms:
  - macos
  - linux
capabilities:
  provides_tools:
    - myfolks_contacts
  provides_hooks:
    - pre_tool_call
    - pre_gateway_dispatch
    - pre_llm_call
  provides_middleware: []
  requires_env: []
