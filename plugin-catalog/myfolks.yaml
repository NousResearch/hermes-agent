name: myfolks
title: MyFolks for Hermes
repo: https://github.com/fresfrida/myfolks
sha: 1890207063f11203816a92dff1b23d65a3d182b5
version: "1.0.0"
description: "Persistent, exact memory about the people in your life. myfolks, /myfolks or /contacts saves and returns details word for word, with when and where each was saved; saving and recall never call a model. Plain words (remember, fix, forget, undo), a Desktop page to search, add, edit, delete and undo, vCard and CSV import, and optional Google Contacts sync. Encrypted SQLite store (AES-256-GCM) in the Hermes folder. Owner only by default, group chats refused, optional per-person sharing (read or add). Disclosure: no network calls unless the owner runs myfolks sync; then Hermes calls the Google People API (people.googleapis.com, contacts.readonly) for the plugin through its declared oauth client, signed in with hermes auth add myfolks:google; Hermes stores and refreshes the token and the plugin never receives it. Replies sent over a messaging platform pass through that platform. AI access is off by default; when turned on, the details it needs are sent to the configured model provider. Hooks: pre_gateway_dispatch answers the owner's MyFolks messages in chat apps before the session sees them; pre_llm_call stops a MyFolks command from reaching the AI; pre_tool_call blocks AI tools that directly name its files. Other messages get an in-memory text check only. Stores a device key in a file only the user can read, or in the OS keychain when Python's keyring package is available."
maintainer: fresfrida
tier: community
category: tools
docs_url: https://github.com/fresfrida/myfolks#readme
requires_hermes: ">=0.23.1"
image: https://raw.githubusercontent.com/fresfrida/myfolks/1890207063f11203816a92dff1b23d65a3d182b5/assets/banner.png
