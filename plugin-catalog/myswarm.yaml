name: myswarm
title: MySwarm
repo: https://github.com/tomkubik/hermes-myswarm
sha: 215ea786550973a238564ad9f05d32f060737bb7
description: >-
  Discover, visualize, sanitize/export, and safely test community agents.md swarm
  configurations. Outputs abbreviated agent/persona/goal tables, renders PII-pruned
  ASCII topology diagrams (.svg image + portable 7-bit copy-paste ASCII symbol blocks),
  generates themed swarm illustrations via Hermes default model and image_generate,
  exports PII-scrubbed agents.md files, and imports/reverts shared configs with
  on-screen file preview and automated exploit/prompt-injection auditing.
maintainer: tomkubik
tier: community
category: tools
version: "0.1.0"
