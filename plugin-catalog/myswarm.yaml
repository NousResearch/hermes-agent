readme: true
capabilities:
  provides_tools:
    - myswarm_list
    - myswarm_ascii
    - myswarm_visualize_image
    - myswarm_export
    - myswarm_import
    - myswarm_revert
  provides_hooks: []
  provides_middleware: []
  requires_env: []
