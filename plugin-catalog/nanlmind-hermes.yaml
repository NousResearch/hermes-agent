name: nanlmind-hermes
title: NaNLMind Hermes
repo: https://github.com/shemshallah/NaNLMind_HERMES
sha: 314219d6b094ca90172579639efa55088488e7ad
description: Connect Hermes to a local NaNLMind 256-head universe for chat, explicit native training,
  mathematical memory, and approved CLOCKED evidence plans. The plugin registers 33 tools for conversation,
  native logic/word/sentence training, memory ingest and assessment, NaN16DE routing, NANNET identity,
  and CLOCKED plan/execute/scratch/head-process/candidate flows. Training runs through the user's local
  nanlm-universal executable; NANNET is the identity and authorization boundary; CLOCKED results are evidence,
  not ground truth, and candidates cannot promote canonical state. Disclosure - runs a local native binary;
  makes HTTPS calls to configured NANNET authority, CLOCKED gateway and head-cortex endpoints; stores
  transcripts, corpora, scratch, encrypted installation identity and paired token under the configured
  state directory; approved CLOCKED execution sends source text to the configured gateway while planning
  excludes it; no telemetry, self-update or credential-store scraping.
maintainer: shemshallah
tier: community
category: tools
requires_hermes: '>=0.23.0'
docs_url: https://github.com/shemshallah/NaNLMind_HERMES/blob/314219d6b094ca90172579639efa55088488e7ad/docs/DEMO.md
