name: nanlmind-hermes
title: NaNLMind Hermes
repo: https://github.com/shemshallah/NaNLMind_HERMES
sha: d7a27e9da81a08e599d3ae6e807a1128aea3320d
description: >-
  Link Hermes to a local NaNLMind NaN16 universe for conversation,
  mathematical-memory inspection, bounded native graph-reasoning evidence,
  explicit native training, NANNET identity and CLOCKED evidence plans.
  Registers 64 tools and a pre_tool_call human-approval hook.
  Four sensitive CLOCKED/candidate tools require Hermes human confirmation;
  model-supplied approved=true cannot bypass that gate. Native execution
  launches a locally installed nanlm-universal process with a minimal
  environment, not Hermes provider secrets. Model-chosen corpus paths are
  confined to the configured plugin corpora directory. Network calls use
  configured NANNET, CLOCKED and head-cortex endpoints. The plugin stores
  corpora, transcript/scratch journals, state artifacts, encrypted
  installation identity and paired tokens under state_dir. Use a separate
  absolute state_dir per Hermes profile; the default is not profile-isolated.
  Planning does not transmit CLOCKED source text; an approved execution
  sends the reviewed source text to the configured gateway. CLOCKED and
  native graph results remain evidence, not proven truth or automatic
  learning authority. No telemetry, self-update, arbitrary credential-file
  reads or vendor-password-manager integration. For protected credentials,
  use the optional [auth] cryptography backend: the pure-Python fallback
  has not been audited for constant-time operation.
maintainer: shemshallah
tier: community
category: tools
requires_hermes: '>=0.23.0'
docs_url: https://github.com/shemshallah/NaNLMind_HERMES/blob/d7a27e9da81a08e599d3ae6e807a1128aea3320d/docs/HERMES_CATALOG_ADMISSION.md
version: "1.5.1"
platforms: [linux, macos]
known_issues:
  - Configure a distinct absolute state_dir for each Hermes profile.
  - Native training requires a locally built nanlm-universal executable.
  - Prefer the optional cryptography [auth] extra for protected identity operations.
