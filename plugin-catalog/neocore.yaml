description: "One memory for every AI harness you use: your own Hermes conversations (CLI, desktop, and direct messages from the ids in `owners`) share the NeoCore memory that Claude Code and Codex use on the same machine (`neocore setup`), or your own NeoCore memory server (`neocore connect`). Before each turn, dated verbatim excerpts and facts are recalled with zero model calls (BM25 plus a local bge-small embedding model); on a machine with an NVIDIA graphics card or Apple silicon, NeoSift, NeoCore's own 32M relevance model, keeps only the ones that help. Groups and anyone else who messages the agent keep a separate memory per chat. In the owner's conversations the provider adds neocore_search, neocore_open, neocore_timeline, neocore_facts, neocore_profile and neocore_remember; elsewhere neocore_search and neocore_forget. Disclosure — the owner's turns are stored in ~/.neocore (or $NEOCORE_HOME), one memory shared by every Hermes profile on the machine, or sent to the memory server that machine was connected to; other chats are stored in $HERMES_HOME/neocore/memory.db. Text is stored after Hermes's and NeoCore's secret scrubbing. After the owner's turns, at most once every 5 minutes, a detached `neocore sync` process indexes the memory and, if that memory is set up with a background model (the one named in its config, else the first installed of the Hermes CLI, on the model and provider set up in Hermes, with no tools, rules or memory, one turn and a tool session kept out of session lists, then the Codex or Claude Code CLI; `neocore doctor` shows which, or none), sends recent turns to it to form dated facts and a short briefing, as NeoCore does for Claude Code and Codex; on such a machine it also reads Claude Code and Codex transcripts, as their own NeoCore hooks do. Recall itself never calls a model unless the optional hosted relevance filter was chosen at setup. With dense_recall on, the first start downloads bge-small-en-v1.5-onnx-Q (three files, about 65 MB) from huggingface.co/Qdrant, each refused unless its SHA-256 matches the hash pinned in neocore-memory. With neosift: auto (the default) and a graphics card, it installs NeoSift once in a background thread into ~/.neocore/sift: a Python venv with torch (download.pytorch.org) and transformers from PyPI within version bounds, about 2-3 GB, plus the pinned model (about 120 MB, SHA-256 checked) from the NeoCore GitHub release, switched on only if a speed check passes; it runs a local scoring server on 127.0.0.1:8796 that keeps nothing. shared: off keeps Hermes on a memory of its own; neosift: off disables NeoSift. No telemetry. Subagent, cron and flush contexts never write. Programs it starts (the detached sync, the Hermes, Codex or Claude Code CLI, the NeoSift server) get a minimal environment without Hermes's provider keys (the Hermes CLI reads its own); only a key the NeoCore config itself names is passed."
