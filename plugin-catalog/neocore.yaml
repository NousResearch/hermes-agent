description: >-
  Governed long-term memory provider: every turn is kept verbatim in one SQLite file per profile,
  and dated excerpts are recalled before each turn with zero model calls (BM25 plus a local
  bge-small embedding model on CPU). Each messaging chat keeps its own memory by default, and the
  provider adds neocore_search and neocore_forget tools. Disclosure — local only: reads and writes
  $HERMES_HOME/neocore/ (memory.db holds each turn's user and assistant text after Hermes's and
  NeoCore's secret scrubbing and, in shared chats, the author's display name and platform id;
  config.json; models/). With dense_recall on (the default), the first start downloads
  bge-small-en-v1.5-onnx-Q (three files, about 65 MB) from huggingface.co/Qdrant in a background
  thread, and each file is refused unless its SHA-256 matches the hash pinned in neocore-memory.
  Nothing else touches the network. One background writer thread per provider instance; no
  subprocesses, telemetry, model calls or credentials. Subagent, cron and flush contexts never
  write. neocore_forget deletes a message's text and keeps an audit tombstone (hash, time, reason).
