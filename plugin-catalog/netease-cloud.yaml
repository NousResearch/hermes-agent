known_issues:
  - "QR and SMS sign-in can be blocked by NetEase risk control (「检测到当前设备环境异常」/「安全风险」); the panel then shows an 打开验证页面 button for NetEase's official unblock page, or paste the MUSIC_U cookie on the 账号 tab instead (README has a 3-step Chinese guide)."
  - "Playlists load the first 1000 tracks; the panel shows the real total (e.g. 共1859首·显示前1000)."
  - "Audio quality follows your NetEase account (VIP → higher bitrate); the plugin requests exhigh and falls back to standard."
