name: netplane
repo: https://github.com/lEWFkRAD/netplane
sha: cdda4d5e6d7484a79364af9e1a233b1333d26700
description: >-
  Run and operate your own self-hosted Tailscale network (a Headscale control plane) from
  inside Hermes: netplane_status checks local service/serve wiring and gRPC node health,
  netplane_nodes lists tailnet devices with addresses, last-seen and online state, and
  netplane_preauth lists preauth-key metadata without stored join secrets or, after explicit
  approval, mints and returns a new single-use-by-default join secret with a 1–168 hour
  lifetime. Ships a Desktop pane with health status, node rows, preauth-key rows and a New
  join key action, plus a FastAPI backend under /api/plugins/netplane. Headscale v0.29.6
  protobuf stubs are bundled; scripts/gen_proto.sh pins its upstream sources and toolchain.
  Requires a reachable Headscale control plane with gRPC enabled and NETPLANE_APIKEY in the
  active Hermes profile's secret scope; the plugin installs no server and never reads
  credentials from process environment or disk. Disclosure — read-only against the control
  plane except explicit preauth-key creation and user-confirmed node expiration in Desktop;
  loopback gRPC may use plaintext while non-loopback targets use TLS with system trust.
  Status runs systemctl is-active headscale and tailscale serve status best-effort. Node
  names, hostnames and IPs stay between Hermes and the configured control plane; there is no
  telemetry or third-party service.
maintainer: lEWFkRAD
tier: community
category: tools
requires_hermes: ">=0.19"
docs_url: https://github.com/lEWFkRAD/netplane#readme
version: "0.2.0"
platforms: []
capabilities:
  provides_tools: [netplane_status, netplane_nodes, netplane_preauth]
  provides_hooks: [pre_tool_call]
  provides_middleware: []
  requires_env: [NETPLANE_APIKEY]
