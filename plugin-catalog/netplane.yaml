name: netplane
repo: https://github.com/lEWFkRAD/netplane
sha: 10b6bff5cf5bb521d39e4443d9d33ee6768fbb23
description: >-
  Install, configure and operate a self-hosted Headscale control plane from Hermes.
  netplane_setup previews a configuration and, after approval, installs the pinned official
  Headscale v0.29.6 DEB on a fresh Debian 12+ or Ubuntu 22.04+ systemd host (amd64/arm64).
  Installation runs on the Hermes host, requires root or noninteractive sudo, refuses
  existing deployments, and verifies the package SHA-256. It configures SQLite, MagicDNS,
  embedded DERP/STUN, local admin gRPC, and either Let's Encrypt HTTPS or a loopback backend
  for an existing reverse proxy. It starts the system service, creates the first user, and
  saves a 90-day API key and connection settings through Hermes's active-profile APIs.
  netplane_status reports health, netplane_nodes lists devices, and netplane_preauth lists
  metadata without stored join secrets or creates an approval-gated, single-use-by-default
  join key with a 1–168 hour lifetime. Desktop includes setup preview/confirmation, health,
  nodes, join keys and confirmed node expiration, with a FastAPI backend. Management requires
  NETPLANE_APIKEY; setup works before a key exists. Bundled protobuf stubs use pinned sources
  and a compatible toolchain. Disclosure — explicit installation downloads from GitHub and
  may contact configured APT repositories; Let's Encrypt receives the chosen domain/email.
  Setup uses APT/dpkg, systemctl, runuser and Headscale commands, writes system configuration
  and data, and enables a persistent service with the listeners shown in its preview.
  Public DNS/firewall changes, proxy installation, upgrades and device migration are not
  performed. Partial installs are preserved for repair. Management reads credentials only
  from Hermes; off-host gRPC uses TLS with system trust. Status also runs systemctl is-active
  headscale and tailscale serve status. No telemetry or automatic software updates.
maintainer: lEWFkRAD
