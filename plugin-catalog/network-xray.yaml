name: network-xray
repo: https://github.com/rusty4444/hermes-network-xray
sha: 4c28b7be6116e150b41ce2e62571c63bfc0968ae
description: "Compare DNS, TCP, verified TLS and HTTP HEAD captures of one URL from two machines, find the first observed difference and export a local evidence report. Read-only and local-first, with native agent tools, a Desktop workbench and a stdlib-only portable collector for the second machine. Disclosure — the network_xray_probe tool, the CLI and the Desktop page connect from the Hermes machine to a URL the model or user names, including private and loopback addresses (link-local, multicast and unspecified are refused): DNS, TCP, verified TLS and one HTTP HEAD request, with no query, credentials, redirects or body, run in an isolated Python child with a minimal environment; it saves the target, resolved IPs, certificate fingerprint and the server/content-type headers under the profile's plugin-data/network-xray/ folder, and imported bundles from a second machine are unauthenticated; no telemetry."
maintainer: rusty4444
tier: community
category: tools
title: "Network X-ray"
docs_url: https://github.com/rusty4444/hermes-network-xray#readme
