name: neural-mesh
repo: https://github.com/D0xedDevi0/hermes-neural-mesh
sha: 84f2170809b61798f4e4ca98c58e8912ea6d9786
description: "Bi-temporal long-term memory for Hermes: point-in-time recall (mesh_asof answers what was true on a date, not only what is true now), supersession instead of overwrite so a corrected fact keeps its history, hybrid dense + lexical retrieval, a poisoning quarantine, and an injection floor measured on a 15-family ablation. Disclosure — this is a Hermes MemoryProvider, selected with memory.provider: neural-mesh; it stores everything in a local SQLite file inside the Hermes profile, makes no network calls, needs no API key, does not read credential stores, and ships no compiled binary (the upstream Rust resonance extension is deliberately not vendored under catalog rule 17, so retrieval runs the pure-Python path and mesh_stats reports resonance_backend: python); the store is unencrypted on disk, so it is not a place for credentials; automatic context injection uses a 0.25 score floor and an explicit mesh_recall uses 0.05, both reproducible with scripts/calibrate_floor.py."
maintainer: D0xedDevi0
tier: community
