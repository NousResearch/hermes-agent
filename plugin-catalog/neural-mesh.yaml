readme: true
title: "NEURAL_MESH"
known_issues:
  - "The memory store is plain, unencrypted SQLite inside the Hermes profile — anything it remembers is readable by anyone with filesystem access to that profile, so credentials do not belong in it."
  - "The upstream Rust resonance extension is not shipped (catalog rule 17), so retrieval uses the pure-Python path; mesh_stats reports resonance_backend: python rather than rust."
  - "Automatic context injection is held to a measured 0.25 score floor, so a weakly-matching memory is deliberately not injected. Use mesh_recall (0.05 floor) when you want a wider net."
  - "Superseding a memory that does not exist is reported in the tool reply rather than failing the write, so a correction naming a bad id is stored as a new fact — and the reply says so instead of silently leaving two contradictory values current."
capabilities:
  provides_tools:
    - mesh_remember
    - mesh_recall
    - mesh_asof
    - mesh_stats
  provides_hooks:
    - on_session_end
    - on_pre_compress
    - on_memory_write
  provides_middleware: []
  requires_env: []
