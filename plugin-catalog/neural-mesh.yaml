description: "Bi-temporal long-term memory for Hermes: point-in-time recall (mesh_asof answers what was true on a date, not only what is true now), supersession instead of overwrite so a corrected fact keeps its history, hybrid dense + lexical retrieval, a poisoning quarantine, an injection floor measured on a 15-family ablation, and a tamper-evident provenance ledger (mesh_verify, mesh_provenance) that names what its verdict rests on: which anchor file it was judged against, or plainly that it had none. Disclosure — this is a Hermes MemoryProvider (`memory.provider: neural-mesh`). It stores user turns, pre-compression and session-end message extracts, and mirrored MEMORY.md/USER.md writes in an unencrypted local SQLite file at `<profile>/neural-mesh/mesh.db`, so credentials do not belong in it. The provider makes no network calls and needs no API key. The repo also vendors unused upstream modules with LLM/chain HTTP clients that the provider never calls. It ships no compiled binary (the Rust extension is not vendored, so retrieval runs the pure-Python path). Verification also checks entry signatures and identity bindings when the ledger is signing: with a signer injected and an identity registry configured, mesh_verify says how many signatures recovered to the address they claim, how many were signed under a label the registry does not bind, and how many it could not check at all. Signing is off by default -- this provider never sets a signer -- and the signing library is imported lazily, so a default install still needs nothing beyond the standard library."
