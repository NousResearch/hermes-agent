description: "Check NeuralWatt service health, model pricing, account balance, request costs, energy use, and session activity from Hermes. Includes nine read-only tools plus a one-call account dashboard and cost comparisons across models. Health and public model discovery need no credentials; account analytics use your NeuralWatt API key. Disclosure — makes GET requests to the NeuralWatt API (api.neuralwatt.com, or the host you set in NEURALWATT_BASE_URL, which then receives your API key), reads account usage, cost and energy metrics rather than prompt or completion text, writes nothing, and loads the optional API key through Hermes's secret scope."
