name: neuralwatt
repo: https://github.com/0xGingi/neuralwatt-hermes
sha: 123651dd0456ad235953652eb1e9d527f2a4350c
description: >-
  Check NeuralWatt service health, available models, account balance, request costs,
  energy use, and session activity from Hermes. Includes seven read-only tools.
  Health and public model discovery need no credentials; account analytics use your
  NeuralWatt API key. Disclosure: makes GET requests to the configured NeuralWatt
  API, reads usage and energy metrics rather than prompt or completion text, writes
  nothing, and loads the optional API key through Hermes's secret scope.
maintainer: 0xGingi
tier: community
category: tools
version: "1.0.1"
docs_url: https://github.com/0xGingi/neuralwatt-hermes#readme
image: https://raw.githubusercontent.com/0xGingi/neuralwatt-hermes/123651dd0456ad235953652eb1e9d527f2a4350c/assets/card.jpg
requires_hermes: ">=0.21.5"
readme: true
platforms: []
capabilities:
  provides_tools:
    - neuralwatt_health
    - neuralwatt_models
    - neuralwatt_quota
    - neuralwatt_energy
    - neuralwatt_usage
    - neuralwatt_requests
    - neuralwatt_sessions
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - NEURALWATT_API_KEY
