name: neuralwatt
repo: https://github.com/0xGingi/neuralwatt-hermes
sha: 5760d7c2abac26af1b41acbea598f5659b42a7dd
description: >-
  NeuralWatt API — health, model catalog, quota, energy metrics, usage breakdowns,
  per-request rows and session analytics for the NeuralWatt energy-transparent
  inference service. Seven read-only tools over NeuralWatt's content-free analytics
  (kWh, joules, carbon and cost per model, key and session). Disclosure — reads your
  NeuralWatt account usage, quota and energy data (counts and figures only; the
  analytics API never stores or returns prompt or completion text) and writes
  nothing; every call is a GET to api.neuralwatt.com with your own API key, read at
  call time through Hermes's secret scope.
maintainer: 0xGingi
tier: community
category: tools
version: "1.0.0"
docs_url: https://github.com/0xGingi/neuralwatt-hermes#readme
image: https://raw.githubusercontent.com/0xGingi/neuralwatt-hermes/5760d7c2abac26af1b41acbea598f5659b42a7dd/assets/card.jpg
requires_hermes: ">=0.21.5"
readme: true
platforms: []
capabilities:
  provides_tools:
    - neuralwatt_health
    - neuralwatt_models
    - neuralwatt_quota
    - neuralwatt_energy
    - neuralwatt_usage
    - neuralwatt_requests
    - neuralwatt_sessions
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - NEURALWATT_API_KEY
