name: neuron-steer
repo: https://github.com/mrfentmen/hermes-neuron-steer
sha: 0853efef2d46018abb2d2f2a5d49e79e87ea1ede
description: >-
  Neuron steering for Hermes Agent, implementing Nous Research's own
  Contrastive Neuron Attribution (arXiv:2605.12290). Find the sparse MLP
  neurons that distinguish two behaviors with forward passes only, save
  them as named circuits, then scale or ablate those neurons at inference
  to steer a local model, plus a dose scan that maps where the behavior
  turns on before output quality breaks.
maintainer: mrfentmen
tier: community
category: tools
requires_hermes: ">=0.20.0"
docs_url: https://github.com/mrfentmen/hermes-neuron-steer#readme
version: "1.2.0"
image: https://raw.githubusercontent.com/mrfentmen/hermes-neuron-steer/0853efef2d46018abb2d2f2a5d49e79e87ea1ede/docs/banner.jpg
platforms: []
capabilities:
  provides_tools:
    - neuron_steer_find
    - neuron_steer_generate
    - neuron_steer_scan
    - neuron_steer_list
    - neuron_steer_show
    - neuron_steer_demo
  provides_hooks: []
  provides_middleware: []
  requires_env: []
