version: "0.22.77"
description: "Self-hosted long-term memory on Qdrant: automatic per-turn prefetch and write-back, plus recall/remember/forget, guardrail rules and a knowledge graph; Hermes and any MCP-connected agent share one collection. Embeddings run local by default (sentence-transformers, Qwen/Qwen3-Embedding-0.6B, 1024d, about 1.2 GB from Hugging Face on first use; on Apple Silicon the model is pinned to the CPU, because PyTorch's MPS backend aborts the process under two overlapping encodes), and a cloud embedder runs only when NEXUS_EMBEDDING_PROVIDER names it and its key is present. What enters the block is decided in one place (`recall_policy.py`, 0.22.65): three entries and an 800-character budget, session logs and entity labels excluded, no minimum score (0.35 filtered nothing, 0.45 upward began to cost matching entries). The block opens with a fixed line marking stored text as DATA, never as instructions - entries come from other agents, documents and tool output, so a stored sentence can read like a command no human gave this agent; Hermes and Claude Code send it, and it is not counted against the budget, which governs memory items, not the warning. Every stored memory names its author in `agent`, mandatory since 22.11.2026 and taken from the context of the call (the request's agent key, the actor the service passes, the plugin's NEXUS_AGENT_ID), never from a field a caller can invent; without one nothing is stored - MCP `status: rejected` with the reason, `/write` 422, and a request without a valid agent key stops at 401 before any write, while the DeepSeek Harness bridge answers `stored: false` with `no-agent-id` and the turn continues. `writer` names the procedure instead, set only by the maintenance passes that write directly: a consolidated fact carries `writer: consolidation`, a learned playbook `writer: dreaming`, and `agent` stays empty there, because a consolidation merges several agents' statements whose originals are gone and any attribution would be a guess; a payload filter on `writer` excludes those points. Older points without either field stay as they are: no migration, no backfill. Reads are logged apart from writes: one line per recall in `~/.nexus-memory/logs/read-YYYY-MM-DD.jsonl` with time, actor, hit count, the ids served and a 16-character query checksum - never the text, empty recalls write nothing, 90 days, fail-open. Shared rooms turn shared as soon as a human other than the owner writes in them, bots never count, and recall, the tools and the graph then serve public memories only; the owner is identified per platform through `owner_user_ids`. A memory whose text sat in a legacy `text` field still reaches the block (it falls back from `content`), a short state fact needs 12 characters instead of 40, and a long text naming a state value stores unchanged but comes back with a hint to keep it as its own short fact - no second write, no extraction. Access levels fail closed: a memory, a protection rule or a graph label without a known level counts as the most restrictive. A local service on 127.0.0.1:9122 serves embeddings and the full MCP toolset; its data routes (`/embed`, `/write`, `/mcp`) demand the AGENT'S OWN key in `~/.nexus-memory/agent_keys/<harness>.key` (0600), obtained once from the loopback-only `POST /enroll`, while the installation key `~/.nexus-memory/service_auth.key` (0600) opens exactly that door and answers `401 plugin update required` everywhere else; non-loopback Host/Origin is rejected, `/healthz` stays open for liveness. The key names the agent, so the `x-nexus-agent-id` header carries no authority, and an entry that owns a key is never adopted again. The plugin starts that service when Hermes cannot load the embedding stack, and it keeps running afterwards. Session-end fact extraction sends conversation text to the model endpoint from Hermes config.yaml, and the consolidation daemon to its configured model, defaulting to Hermes's own through local Ollama; state and daily backups under `~/.nexus-memory`; `NEXUS_UPDATE_CHECK=1` opts into a GitHub release check. Disclosure - when Hermes
  cannot load the embedding stack (and always on Apple Silicon unless NEXUS_EMBED_IN_HOST=1), the plugin starts `nexus-memory serve` on 127.0.0.1:9122 (embeddings, the MCP toolset and a consolidation daemon that sends memory text to the Ollama endpoint at 127.0.0.1:11434 or NEXUS_OLLAMA_BASE under NEXUS_CONSOLIDATION_MODEL, nexus-memory.consolidation_model or Hermes's model.default, which can be an Ollama cloud model) and it keeps running after Hermes exits; the key it writes with lives in `~/.nexus-memory/agent_keys/hermes.key` (0600); session-end extraction sends conversation text to the model endpoint in Hermes config.yaml, and the opt-in reranker (nexus-memory.rerank or NEXUS_RERANK=1) sends each query plus up to 20 memory snippets there with the provider key from config.yaml; it reads `~/.hermes/.env` and config.yaml and opens state.db read-only for the session's chat type; the shared-room rule writes the owner id to <hermes_home>/nexus/config.json and shared chat ids with a hashed author id to <hermes_home>/nexus/chat-sharing.json; a keyword (SQLite FTS5) copy of memory text and metadata, private memories included, in <hermes_home>/state/nexus-fts.db (or NEXUS_FTS_DB); state, daily backups, a write log without private content, a read log with entry ids only, and the plugin's key under `~/.nexus-memory`. Disclosure — when Hermes cannot load the embedding stack (and always on Apple Silicon unless NEXUS_EMBED_IN_HOST=1), the plugin starts `nexus-memory serve` on 127.0.0.1:9122 (embeddings, the full Nexus MCP toolset and a consolidation daemon that sends memory text to the Ollama endpoint at 127.0.0.1:11434 or NEXUS_OLLAMA_BASE under the model named by NEXUS_CONSOLIDATION_MODEL, nexus-memory.consolidation_model or Hermes's model.default, which can be an Ollama cloud model), and the service keeps running after Hermes exits; its /embed and MCP routes require a per-install key in ~/.nexus-memory/service_auth.key (0600) and a loopback Host/Origin; session-end fact extraction sends conversation text to the model endpoint in Hermes config.yaml, and the opt-in recall reranker (nexus-memory.rerank or NEXUS_RERANK=1) defaults to sending each query plus up to 20 memory snippets to that same endpoint using the provider API key it reads from config.yaml; reads ~/.hermes/.env and config.yaml, and opens Hermes's state.db read-only for the session's chat type when the host reports no message author; the shared-room rule records the owner id in <hermes_home>/nexus/config.json (taken from the first gateway user when owner_user_ids is unset) and shared chat ids with a hashed author id in <hermes_home>/nexus/chat-sharing.json; a keyword (SQLite FTS5) copy of memory text and metadata, private memories included, in <hermes_home>/state/nexus-fts.db (or NEXUS_FTS_DB); state, daily backups, a write log without private content and the plugin's own service key (agent_keys/hermes.key, 0600, obtained once from the local service's loopback-only /enroll) under ~/.nexus-memory; the per-turn recall block holds at most three entries and leaves out `session` and `entity` hits. Every recall writes one line to ~/.nexus-memory/logs/read-YYYY-MM-DD.jsonl (timestamp, agent, hit count, memory ids, a hash of the query, never the query or memory text; rotated after 90 days, and a failed log never fails a recall). The write gate recognises dictated residue (filler words, word repeats, no closing punctuation) by five weighted signals and stores it as `session` instead of `rule`, word for word; a rule confirmed at a terminal is left alone; opt-in NEXUS_UPDATE_CHECK=1 adds a GitHub release check and an upgrade nudge to the system prompt. At session end the plugin reports that session's failed tool calls (tool name, up to 2,000 characters of error text each, at most 50, and the session id; never the conversation) to the Nexus service's POST /events at 127.0.0.1:9122 or NEXUS_SERVICE_URL with its service key, where they are journaled in ~/.nexus-memory/events and the nightly learning may turn a failure that recurs across sessions into a stored lesson; NEXUS_REPORT_INCIDENTS=0
  turns this off."
