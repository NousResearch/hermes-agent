description: "Self-hosted long-term memory on Qdrant with automatic per-turn prefetch and write-back, plus recall/remember/forget/guardrail tools and a knowledge graph. Embeddings run locally by default: sentence-transformers with Qwen/Qwen3-Embedding-0.6B (1024d, about 1.2 GB downloaded from Hugging Face on first use), no key and no extra software needed. Ollama is used only when it is chosen explicitly, and a cloud embedder (Voyage, OpenAI, Google, Jina) only when NEXUS_EMBEDDING_PROVIDER names it together with its key. A key that merely sits in the environment does NOT select a provider on its own, and there is no silent cloud fallback. Query rewriting plus paid consolidation stations stay off until enabled. Hermes and any MCP-connected agent share one collection, so they read and write the same memories. Access levels fail closed: a memory, a protection rule or a graph label without a known level is treated as the most restrictive one, so a missing value never looks like permission. The local service that serves embeddings on 127.0.0.1:9122 demands a per-installation key for its /embed and /mcp routes (generated once, stored under the data directory as service_auth.key with mode 0600, sent by the plugin) and rejects requests whose Host or Origin is not loopback; the open /healthz answers liveness only. Disclosure — when Hermes's environment cannot load the embedding stack, the plugin starts `nexus-memory serve` on 127.0.0.1:9122 (embeddings plus the full Nexus MCP toolset and a consolidation daemon whose default Ollama model `glm-5.3-flash:cloud` can send memory text to Ollama's cloud), and the service keeps running after Hermes exits; its /embed and MCP routes require a per-install key in ~/.nexus-memory/service_auth.key (0600) and loopback Host/Origin; session-end fact extraction sends conversation text to the model endpoint in Hermes config.yaml; reads ~/.hermes/.env and config.yaml; state and daily backups under ~/.nexus-memory; an opt-in NEXUS_UPDATE_CHECK=1 adds a GitHub release check and an upgrade nudge to the system prompt."
maintainer: Neboy72
