subdir: nightshift
description: "Hermes takes the night shift on your ML training runs: Nightshift watches a run's metrics (stdout, JSONL, CSV or TensorBoard), catches NaN, loss spikes, divergence, out-of-memory crashes and stalls, recovers the run within a playbook you approved (roll back to the last healthy checkpoint with a lower learning rate, or restart with half the batch), and pushes the chart to your phone. Desktop pane, dashboard tab, /nightshift, hermes nightshift and a morning-report blueprint. Zero runtime dependencies. Disclosure: the agent can only propose a run; after your explicit approval (/nightshift approve in chat or the Approve button; there is no CLI approve) it launches the approved command as a long-running background process with a minimal environment (no Hermes keys unless you name them in env_passthrough, shown on the approval card) and may stop or restart that process group, re-rendering only the approved command with only the parameters the playbook declares (lr, batch size, grad accumulation, checkpoint path), within an intervention budget. It signals only process groups it started (PID-reuse guarded), reads the run's log, metric and checkpoint paths, runs nvidia-smi when present, and stores run data under its plugin data folder. On a critical incident it may make capped LLM calls on your configured model with a redacted log tail, and send an alert through Hermes's own `hermes send` command to your messaging platform. No telemetry and no network calls of its own."
maintainer: Pavilion-devs
