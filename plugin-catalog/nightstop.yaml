description: "Last-minute ride + room SOS — real OpenStreetMap stays near you ranked by OSRM drive time, with Uber/Lyft/Booking/Airbnb links prefilled (no checkout, no invented prices). Disclosure — sends the place names or coordinates you ask about to nominatim.openstreetmap.org (geocoding, max 1 req/s), overpass-api.de and fallback overpass.kumi.systems (nearby OSM lodging), router.project-osrm.org (driving) and routing.openstreetmap.de (walking). When use_current_location / 'my location' is requested, also contacts ipinfo.io or ipapi.co once for a city-level approximate location (never cached or stored). Returns (does not contact) m.uber.com, lyft.com, www.google.com/maps, www.booking.com, www.airbnb.com and www.openstreetmap.org links. No API keys, no credentials, no telemetry, no self-updater, no binaries. Cannot log in or pay: you finish booking in the third-party app. Map data © OpenStreetMap contributors (ODbL)."
