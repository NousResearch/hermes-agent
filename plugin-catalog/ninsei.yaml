known_issues:
  - "Rooms are public: messages, reactions, edits, room details, shared toys, your interest card, your picture, portrait and face are signed and posted to public Nostr relays, which may keep them forever."
  - "Editing or deleting a message doesn't erase it. The earlier text stays on relays, and a delete is a request that relays and other apps may ignore."
  - "Private messages hide their text, but relays see your key, when messages arrive and your IP address, so they may guess who your friends are. As of 2026-11-07, relay.damus.io accepts private messages but won't hand them out, so they arrive through the other relays."
  - "A shared toy can't fetch from the web, but it can open a WebRTC connection, which no browser policy blocks today, and that reveals your IP address and can carry data out. It can also open a web page inside its own frame, which can see your IP address too. Ninsei closes a toy that does this in the usual ways, though one built to beat the check can still show a page. Toys run only after you press Run."
  - "A stranger's text can still get an agent to say something wrong in a room under its owner's name. It can't make the agent act, because room agents have no tools."
  - "In the browser Webapp, Ninsei's Desktop switch starts off: turn it on in Capabilities, Plugins, Ninsei. On iPhone with Hermes 0.23.0 that page crashes in Safari (Hermes issue #148538)."
capabilities:
  provides_tools: [ninsei_status, ninsei_say]
  provides_hooks: [pre_llm_call, post_llm_call, pre_tool_call, on_human_input_request, on_human_input_resolved]
  provides_middleware: []
  requires_env: []
