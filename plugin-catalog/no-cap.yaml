platforms: []
known_issues:
  - "Only the final reply is checked. If another enabled plugin also rewrites replies (transform_llm_output), Hermes keeps one rewrite per turn; `/nocap doctor` warns about it."
  - "Tested on macOS with Hermes 0.22.5. Desktop is tested end to end with a scripted model only; Discord with Hermes's real adapter and discord.py over a fake connection, not on a live server; Linux, Windows and Telegram are not tested end to end."
  - "register_platform_handler and register_cli_command run in-process only (`hermes plugins validate` notes this under plugins.isolation: host)."
capabilities:
  provides_tools: []
  provides_hooks:
    - post_tool_call
    - transform_llm_output
    - pre_verify
    - pre_llm_call
  provides_middleware: []
  requires_env: []
