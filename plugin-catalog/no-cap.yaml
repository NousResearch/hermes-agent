title: "No Cap"
description: "Receipts for agent claims. No Cap checks the claims in each final reply (tests pass, pushed, merged, deployed, file written, URL live, SHAs, counts) against the tool calls the agent made in the same turn, with no extra model, and appends a footer: 🧾 NO CAP when a tool call proves the claim, 🧢 CAP only when one directly contradicts it (exit code, test counts, push ref, PR state), and an opt-in 🤔 NO RECEIPT when nothing ran that could prove it. /cap makes the agent prove or retract its open claims and re-scores the next reply, /capscore keeps a per-model honesty board, and strict mode uses pre_verify to send a coding turn back, at most twice, until its claims have receipts. Disclosure — stores one JSON line per checked reply in its Hermes plugin data folder, HERMES_HOME/plugin-data/agent-plugin-no-cap-<digest>/receipts.jsonl (folder 0700, file 0600; `hermes nocap path` prints it): session and turn ids, model, platform, each claim's text, verdict and quoted evidence line, and only for tool calls a receipt cites the command (first 160 characters), exit code, error line and parsed facts; other calls are kept as a count and a SHA-256 digest. Every text field goes through a secret masker before it is written. Records are pruned after retention_days (default 30), halved past 20 MB and deleted by /nocap purge; /capscore card writes scorecard.svg (and .png with Pillow) to the same folder. No network unless you set self_verify_http: true, which lets /cap send one HTTP HEAD request to a URL the agent claimed is live, public addresses only, no redirects, 3 s timeout. /cap runs two read-only git commands as argument lists without a shell in the session's working directory (`git cat-file -t <sha>`, `git rev-parse --verify <ref>`; 5 s timeout, no fetch) and checks whether a file the agent says it created exists. /nocap doctor reads other plugins' plugin.yaml files and the Hermes config, and creates and deletes one probe file in its store folder. /cap injects one user message where Hermes allows it (gateway-backed sessions, the TUI and Desktop need plugins.entries.no-cap.allow_gateway_injection: true); otherwise it prints the message for you to paste. No tools, credentials, background processes, telemetry or self-update."
