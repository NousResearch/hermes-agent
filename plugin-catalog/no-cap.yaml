known_issues:
  - "Only the final reply is checked, against tool calls from the same turn. If another enabled plugin also rewrites replies (transform_llm_output), Hermes keeps one rewrite per turn; `/nocap doctor` warns about it."
  - "Tested on macOS with Hermes 0.22.5; Linux, Windows and Discord/Telegram/Desktop sessions are not tested end to end."
capabilities:
  provides_tools: []
  provides_hooks:
    - post_tool_call
    - transform_llm_output
    - pre_verify
  provides_middleware: []
  requires_env: []
