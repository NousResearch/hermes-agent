version: "0.1.0"
title: "No Cap"
description: >-
  Receipts for agent claims. No Cap checks the claims in each final reply (tests pass, pushed, merged, deployed, file
  written, URL live, SHAs, counts; English plus Chinese, Thai and Spanish for tests, push, merge and deploy) against
  the tool calls the agent made, with no extra model, and appends a footer: 🧾 NO CAP when a tool call proves the
  claim, 🧢 CAP only when one directly contradicts it (exit code, test counts, push ref, PR state, or a claimed SHA or
  branch that does not exist in the session's repo), and an opt-in 🤔 NO RECEIPT. A claim about earlier work can cite
  an earlier turn of the same session. /cap makes the agent prove or retract its open claims and re-scores the next
  reply; /capscore keeps a per-model honesty board, a scorecard and an A/B compare card; /nocap verdict draws a
  session verdict card; strict mode uses pre_verify to send a coding turn back, at most twice. Surfaces: a Cap Board
  dashboard tab (agents, models and skills ranked live; this profile only unless you opt in to a team view), Hermes
  Desktop receipt chips and a Receipts popover, opt-in Discord embed + buttons, and Cap Coach, which drafts a rule from
  repeated caps and injects it only after you approve it.
  Disclosure — Stores, all in its Hermes plugin data folder HERMES_HOME/plugin-data/agent-plugin-no-cap-<digest>/
  (folder 0700; `hermes nocap path` prints it), every text field through a secret masker first: receipts.jsonl (0600;
  one line per checked reply: session/turn ids, model, platform, each claim's text, verdict and quoted evidence line,
  and only for tool calls a receipt cites the command (first 160 chars), exit code, error line and parsed facts; other
  calls only as a count and SHA-256 digest; pruned after retention_days (default 30), halved past 20 MB); ledger.jsonl
  (0600; cross_turn, on by default: per-turn parsed call facts, never raw output; newest 100 turns / 400 calls per
  session, same retention, 10 MB cap); coach.json (0600; Cap Coach drafts and approved rules with up to 3 redacted
  example claims per pattern); desktop.json (0600; on/off and a timestamp from the Desktop half); discord_receipts.json
  (0600, only with discord_buttons: on; receipt id → session/turn ids, session key, user, chat and thread ids, at
  most 500, no claim text); scorecard, verdict and compare SVG/PNG cards. /nocap purge deletes the receipts, ledger,
  Discord map and cards; coach.json and desktop.json stay until you delete them. `hermes nocap export --out` and
  `metrics --file` write only the file you name (0600, atomic). Commands it runs: read-only git as argument lists,
  no shell, in the session's working directory, hardened against an untrusted repo (GIT_CONFIG_NOSYSTEM=1,
  GIT_CONFIG_GLOBAL=/dev/null, core.hooksPath=/dev/null, core.fsmonitor=false, protocol.allow=never, no pager, no lazy
  fetch, credential helper off, inherited GIT_* dropped): at reply time, only for a claimed SHA or branch no tool call
  backs (verify_artifacts, at most 8 calls, 3 s each) `rev-parse --is-inside-work-tree --is-shallow-repository`,
  `config --get-regexp`, `cat-file -e`, `for-each-ref`; during /cap `cat-file -t <sha>` and `rev-parse --verify <ref>`
  (5 s). It lists the run's project read-only to tell a file-scoped test run from the full suite (bounded, no symlinks)
  and stats a file the agent says it created. `hermes nocap demo --ladder` (and /nocap demo ladder, CLI/TUI only, in
  the background) runs the bundled demo/run_ladder.sh with /bin/sh in a throwaway HERMES_HOME under /tmp, a scripted
  model on 127.0.0.1 and a uv fetch of demo-only packages. Network: none by default; with self_verify_http: true, /cap
  may send one HTTP HEAD to a URL the agent claimed is live, public addresses only (checked after DNS), no redirects,
  3 s timeout. Dashboard and Desktop: routes under /api/plugins/no-cap/ on your own Hermes backend, behind the
  dashboard's auth: GET /board (read-only), POST /hello (writes desktop.json), POST /verify (yes/no for one Desktop
  chip in one chat; the HMAC key lives only in memory and is never returned), GET /session. The board reads other
  profiles' stores and board_sources paths only with the board.team_profiles opt-in, only in the CLI and dashboard,
  never in a gateway chat. Discord: off by default; with discord_buttons: on it edits only the bot's own reply to add
  an embed and two buttons and answers clicks ephemerally (only the user the reply answered may click). Messages it
  sends: /cap injects one user message where Hermes allows it (gateway-backed sessions need
  plugins.entries.no-cap.allow_gateway_injection: true), otherwise prints it to paste. Cap Coach injects approved rules
  as labelled context through pre_llm_call, only in scope, never before /cap coach approve, and /cap coach revert stops
  it; it never edits skills, memory or config (--apply asks the agent to, with its own tools). /nocap doctor reads other
  plugins' plugin.yaml files and the Hermes config. No tools, credentials, telemetry or self-update. Accuracy: blind
  sample of public SWE-rebench runs (at 7c6cbc0, two raters, adjudicated): 🧾 precision 0.88 (88/100), 🧢 8 of 11
  correct. Local Arena (30 synthetic bug-fix tasks, Qwen3-4B and a partial Qwen3-30B-A3B, No Cap at aa69dcb, one
  person's hand check against hidden tests): 13 of 13 🧢 correct.
