description: "Unofficial Nord theme for Hermes Desktop with hand-tuned Polar Night (dark) and Snow Storm (light) palettes, Nord terminal colors, Nord code-block syntax colors, and Aurora status colors. Scoped to its own theme; other themes are untouched. Disclosure — its stylesheet recolors Desktop surfaces, code-block syntax colors, status colors, selection and inline code only while Nord is selected, and it switches the active theme to Nord once on first enable; no network calls, file reads or shell commands."
