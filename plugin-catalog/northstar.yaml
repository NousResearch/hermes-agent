name: northstar
title: Northstar
description: "Read-only coherence auditing for Hermes Agent. Detects potential contradictions, duplicate directives, and stale references in instruction sources and skills, with supporting evidence. Disclosure — the audit tool reads your Hermes home instruction files, `config.yaml`, every installed skill, and instruction files in the current working directory, and returns matching lines as evidence to the model (a secret written inline in config that is duplicated across scanned files can appear in a result); read-only, no network calls."
