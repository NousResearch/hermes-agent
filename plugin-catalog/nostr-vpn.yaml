description: "Private mesh networking through the separately installed nvpn CLI. Instruction-only skill; connects to relays and peers and starts a persistent daemon. Tunnels need elevated host networking privileges. Disclosure — instruction-only skill: the agent runs the separately installed nvpn CLI in the terminal (installed by the user, or by the agent from the project's latest GitHub release or an unpinned `cargo install nvpn`), which creates local device keys, connects to Nostr relays and peers, starts a persistent daemon that with elevated privileges creates tunnel interfaces and routes, and on an admin host can approve devices into the user's private network."
