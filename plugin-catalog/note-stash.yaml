sha: 96f00a97b88c1f17aa63b04b53101c7f4cf294a5
description: "Sticky notes and a code stash for Hermes Desktop: capture a thought, snippet or screenshot without interrupting the current turn, then send it to a session as the next prompt (queued until a running turn ends) or put it in the composer to edit first. Desktop-only, SDK-only: notes stay in the plugin's own data folder, no network calls."
maintainer: freemanconsulting
tier: community
category: desktop
requires_hermes: ">=0.22.7"
