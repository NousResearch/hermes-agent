name: nous-girl-theme
title: Nous Girl
repo: https://github.com/mykeura/nous-girl
sha: 227ec2de49f4988ebb223afc9f3a75c5b546871d
description: "Warm monochrome ink-and-paper theme for Hermes Desktop in real light and dark palettes, with terminal colours that match and a CLI banner painted from the theme's own palette. Disclosure — theme-only plugin: it registers one theme through the Desktop plugin SDK and injects no CSS, no DOM access and no stylesheet of its own; the two Desktop palettes ship as light and dark sets, and the Desktop keeps its own typography. The package also ships two optional CLI/TUI skins (nous-girl-light, nous-girl-dark) as plain YAML files the user copies into ~/.hermes/skins, plus an inert __init__.py whose register() does nothing so the Agent loader imports the package cleanly instead of reporting a missing module. No network requests, no agent tools, no hooks, no background processes, no settings page."
maintainer: mykeura
