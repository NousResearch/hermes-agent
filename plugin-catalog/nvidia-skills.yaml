description: "Find the right NVIDIA skill for GPU acceleration, CUDA, AI agents, data loading, training, inference, robotics, Physical AI, Omniverse, simulation, and other NVIDIA-powered workflows. Portable Agent Plugins v1 package with one skill, nvidia-skill-finder; no code, tools or credentials. Disclosure — skill-only package (no code); on NVIDIA-related turns its skill reads NVIDIA's public skill catalog from raw.githubusercontent.com (github.com and build.nvidia.com as fallbacks) and, with the user's approval, installs a chosen NVIDIA skill via `hermes skills install` (Hermes' security scan and confirmation apply); its instructions for other agents use the unpinned `npx skills` CLI from npm."
