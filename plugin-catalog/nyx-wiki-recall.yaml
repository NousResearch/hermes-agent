known_issues:
  - "Install with `hermes plugins install blacksmithFF/NyxWikiRecall --no-enable` then `hermes plugins enable nyx-wiki-recall`. Hermes 0.22.5 `plugins install --enable` (or answering yes) sets memory.provider and skips plugins.enabled for plugins that register a memory provider, so the transcript and glimpse hooks never run. If that already happened, enable the plugin and set memory.provider back."
  - "`hermes plugins validate` warns once on a private core import of gateway.session_context.get_session_env (transcript.py). That is the documented session-identity reader in Hermes 0.22.5's plugin guide; the import is wrapped and falls back to transcript.user.name if it goes away."
  - "Cron turns get no wiki lookup by default (lookups.on_cron = no). Transcripts record scheduled (cron) jobs under a Scheduled job heading, and skip only subagent turns by default (transcript.skip.platforms = subagent)."
capabilities:
  provides_tools:
    - wiki_read
  provides_hooks:
    - pre_llm_call
    - post_llm_call
  provides_middleware: []
  requires_env:
    - OPENROUTER_API_KEY
