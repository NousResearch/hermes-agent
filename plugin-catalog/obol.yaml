name: obol
title: Obol
repo: https://github.com/UEddy/Obol
sha: d21df0241a3c88d0def0f12ef7ffa581e6e0b59f
description: "Safe invoicing for freelancers, consultants and agencies who bill clients, from any chat Hermes runs in (tested: Telegram, WhatsApp, Slack, email and the terminal). Hermes drafts invoices (also from forwarded messages via ctx.llm), sends them as Stripe payment links or as bank-transfer PDF invoices with no provider account, tracks who has paid, and adds Invoices and Security dashboard views plus /invoices in every chat. Every invoice write needs approval, with deterministic checks for prompt injection (a message can never choose the recipient), lookalike and impersonated client addresses, duplicates, unusual amounts and changed payout details; live keys are refused unless allowed, writes are refused in unattended runs, and the activity and security logs are hash-chained. Disclosure — handles payments: in Stripe mode it calls api.stripe.com with your STRIPE_API_KEY (read through Hermes's secret route) and Stripe emails your clients when invoices are sent or reminded; live keys are refused unless you turn on allow_live; every invoice write asks for approval and writes are refused in cron runs; forwarded messages you ask it to draft from go to your configured model; bank-transfer mode makes no network calls and prints the bank details you enter in plugin settings (stored in config.yaml) on PDF invoices; data stays in plugin-data/obol/."
maintainer: UEddy
tier: community
category: tools
requires_hermes: ">=0.22"
