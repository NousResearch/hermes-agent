description: >-
  Obscurify.ai as a Hermes model provider (`--provider obscurify`, or Obscurify.ai in `hermes model`):
  a privacy-focused, OpenAI-compatible API to 200+ models with zero-data-retention routes and
  account-number sign-up (no email). The model list leaves out decision models and models under
  Hermes' 64K context minimum, context windows come from the catalog, and reasoning effort is sent as
  `reasoning_effort`. Disclosure — registers one model provider at import and nothing else (no tools,
  hooks, commands or threads); chat requests go to https://obscurify.ai/v1 through Hermes' own client
  with OBSCURIFY_API_KEY, which Hermes reads; the plugin itself only fetches the public model catalog
  (GET https://obscurify.ai/v1/models, no credentials) at most once an hour per process, reads and
  writes no files and starts no processes. Usage is billed from the user's prepaid Obscurify.ai
  balance; the plugin makes no payments.
