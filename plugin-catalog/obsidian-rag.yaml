capabilities:
  provides_tools:
    - vault_search
    - vault_read
    - vault_write
    - vault_list
    - vault_move
    - vault_delete
    - vault_status
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
