description: "Unofficial OpenCode free-model transport for Hermes. Discovers live zero-cost tool-capable models from OpenCode's /inference/v1/models catalog, refreshing the relay list at most every 10 minutes and models.dev metadata every 6 hours, persists the last successful discovery for restart fallback, and pins the provider's picker floor to the discovered set. Inference posts through a bundled Bun transport (oc_transport.js) carrying OpenCode's session header, environment preamble, and streaming tool-call shape; Hermes keeps the agent loop and executes tools locally, translating compatible OpenCode and Hermes tool schemas, calls, choices, and replayed history, and failing closed when an advertised compatibility alias has no Hermes target. Requires Bun; no OpenCode CLI, Node.js, npm, or npx dependency. OpenCode restricts free-tier chat models to use from within OpenCode and its gateway enforces that restriction, so this undocumented compatibility transport may be changed or disabled at any time; it does not grant access to any model and no free-tier availability is guaranteed. Disclosure — prompts, tool schemas, tool results, and other conversation content leave the machine for OpenCode and the selected model provider; model availability, retention, data use, and permission are governed by their current terms."
