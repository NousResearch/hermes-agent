description: "Polymarket odds in Hermes: search active markets, live odds (CLOB midpoint) with 24h/7d moves, volume and a 7-day sparkline, a persistent per-profile watchlist with move, above and below rules (edge-triggered, 1-pt re-arm, one alert on resolution), and alerts that run as a no-agent cron job, so every check costs zero tokens. Agent tools, an /odds slash command and a hermes oddsradar CLI share one engine. Read-only: no keys, no wallet, no trading. Disclosure — read-only HTTPS GETs to gamma-api.polymarket.com and clob.polymarket.com, only when a tool, /odds, the CLI or the user's cron job runs (10 s timeout, at most 2 retries on 429/5xx; the client refuses any other host). No credentials. Stores the watchlist at <HERMES_HOME>/plugin-data/oddsradar/watchlist.json. Only when the user runs hermes oddsradar cron-script does it write <HERMES_HOME>/scripts/oddsradar-check.py, which runs hermes oddsradar check --quiet as an argv subprocess (no shell, stdin closed, 120 s timeout); the user schedules it with hermes cron create. No hooks, middleware, background threads, telemetry or self-updates."
