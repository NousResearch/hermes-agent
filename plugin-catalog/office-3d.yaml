name: office-3d
title: Office 3D
repo: https://github.com/oslook/hermes-desktop-plugin-office-3d
sha: "127c28accc950d1a10ff55ced992538eda656f16"
description: "A live isometric office for Hermes Desktop: every profile is a person at a desk — a profile doing real work sits typing with a lit terminal screen, an online-but-idle one relaxes in the lounge with tea, an offline one leaves an empty desk with a dark monitor. Click a desk to inspect that profile (state, sessions, tokens, cost) and open its chat or latest session; a cost/tokens leaderboard ranks the profiles; plus a global Total/Working/Idle/Offline overview, a status-bar chip, a palette command with keybind, a settings page with per-profile visibility switches, and an office_status agent tool that reports the same status to the model. Desks are labelled with each profile's own display name when set. Disclosure — the backend and the tool read each profile's gateway_state.json and profile.yaml (display name only) and open its state.db read-only, running aggregate queries (COUNT/SUM/MAX over the sessions table: counts, token totals, cost, last-activity) plus one read of the default profile's in-flight async_delegations task JSON, from which only the target profile label is kept; they never read message content, system prompts or titles, make no network calls, and need no credentials. Opening a profile's latest session asks the app's own session.list RPC for that session's id (metadata only) and then opens it through the app's own openSession; no message content is read. Runs on Linux, macOS and Windows. The process-liveness check never signals the target: on POSIX it uses os.kill(pid, 0), and on Windows it opens the process with OpenProcess(PROCESS_QUERY_LIMITED_INFORMATION) and reads GetExitCodeProcess."
