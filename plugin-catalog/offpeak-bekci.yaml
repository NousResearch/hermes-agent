title: Off-Peak Watch (offpeak-bekci)
description: >-
  Makes Ollama Cloud's off-peak window visible and actionable in Hermes: a desktop status-bar
  chip shows the countdown and the queue item counts (Ollama off-peak hours: weekdays 18:00-12:00
  UTC, weekends one block), a one-shot notice fires 30 minutes before the window opens, and
  approval is taken only from the user (`/offpeak-onayla <id,id>`) — work runs only if approved,
  and items never enter the queue by themselves. `/offpeak-durum` prints a readable report by
  default (machine-readable JSON with `/offpeak-durum json`), and `/offpeak-kur` prints the cron
  job it would install in full plus a `plan_hash`; nothing is installed without a hash-bound
  approval typed by the user, and the plugin never writes the cron store. One `llm_execution`
  middleware measures the call rate for Ollama Cloud calls during the peak window and ships
  measure-only (`kuru_kosu: true`): it records what it would delay and never delays. No network
  calls, no telemetry, no credential reads; the only local files it touches are the queue ledger
  and its own JSONL measurement log. Output language is English by default; `dil: tr` selects
  Turkish. Auto-delivery is host-dependent: in a classic CLI session the request enters the
  agent queue; on the Ink TUI / desktop-panel host the core asks for a persistent `session_key`,
  which the command handler does not receive, so the command prints the parameters as a single
  line of JSON. Injecting into a gateway additionally requires
  `plugins.entries.offpeak-bekci.allow_gateway_injection: true` (default off); the only in-process
  way to read that key is the private `gateway.session_context` module (rule 9 -> not used).
  Requires Hermes >= 0.22.2.
maintainer: onkanat
