known_issues:
  - Desktop-only. After installing, make sure the Desktop switch on the Oikos row in Settings → Plugins is on.
  - The optional model mind is off by default and uses the gateway RPC llm.oneshot rather than the documented ctx.llm plugin route (Oikos has no Python half), so oikos_mind is not listed in the Models settings; it was tested only against a mock gateway, and any failure falls back to the deterministic scheduler.
  - Model spend limits are Oikos's own character-based estimates, not a hard cap: Hermes may retry a call internally, clearing Desktop storage resets the counters, and two Desktop windows deciding in the same instant can each send one request.
