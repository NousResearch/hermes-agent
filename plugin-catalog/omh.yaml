    - omh_agent_board
    - omh_capabilities
    - omh_context
    - omh_decision_gate
    - omh_delegate_route
    - omh_document_plan
    - omh_gather_evidence
    - omh_hud
    - omh_interact
    - omh_jev_ask
    - omh_loop
    - omh_memory
    - omh_probe
    - omh_recommend
    - omh_resume
    - omh_role
    - omh_route_answer
    - omh_run_summary
    - omh_source_trust
    - omh_status
    - omh_team
    - omh_todo
  provides_hooks:
    - on_session_end
    - on_session_start
    - post_tool_call
    - pre_llm_call
    - pre_tool_call
    - pre_verify
    - subagent_start
