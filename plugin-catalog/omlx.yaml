description: "Managed oMLX runtime and MLX model library for Hermes Desktop on Apple Silicon. Disclosure — on explicit setup downloads the oMLX 0.7.2 macOS app (SHA-256-pinned) from the official jundot/omlx GitHub release and runs it as a long-running loopback server (127.0.0.1, bearer key) under HERMES_HOME/plugin-data/omlx; downloads public Hugging Face model snapshots the user names; generates a local API key stored as HERMES_OMLX_LOCAL_API_KEY in the profile's .env; \"Use\" rewrites the profile's default model in config.yaml."
maintainer: vitaliy-blprnt
tier: community
category: models
