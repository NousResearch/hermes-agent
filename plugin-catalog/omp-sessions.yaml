name: omp-sessions
repo: https://github.com/mbaradad/omp-sessions
sha: ba26902a97378d376941f1883d3f4b3c624ec4a5
subdir: integrations/hermes/omp-sessions
description: 'Start, schedule and supervise omp coding sessions (omp-sessions) from Hermes, hear back when they settle, and run kanban cards assigned to omp as omp sessions.'
maintainer: mbaradad
tier: community
category: tools
requires_hermes: '>=0.23.0'
docs_url: https://github.com/mbaradad/omp-sessions/blob/main/docs/HERMES.md
version: "0.6.0"
title: omp Sessions
screenshots:
  - https://raw.githubusercontent.com/mbaradad/omp-sessions/ba26902a97378d376941f1883d3f4b3c624ec4a5/site/assets/shots/hermes-dashboard.png
  - https://raw.githubusercontent.com/mbaradad/omp-sessions/ba26902a97378d376941f1883d3f4b3c624ec4a5/site/assets/shots/hermes-detail.png
  - https://raw.githubusercontent.com/mbaradad/omp-sessions/ba26902a97378d376941f1883d3f4b3c624ec4a5/site/assets/shots/hermes-desktop.png
platforms: [linux, macos]
known_issues:
  - Needs the omp-sessions command on PATH, from the omp Sessions VS Code extension ("omp: Install omp-sessions Command") or the release tarball (npm install -g https://github.com/mbaradad/omp-sessions/releases/download/v<version>/omp-sessions-<version>.tgz).
capabilities:
  provides_tools:
    - omp_sessions_list
    - omp_projects_list
    - omp_session_start
    - omp_session_status
    - omp_session_wait
    - omp_session_send
    - omp_session_answer
    - omp_session_mode
    - omp_session_stop
    - omp_queue_add
    - omp_queue_schedule
    - omp_server_status
    - omp_models_list
    - omp_session_model
  provides_hooks:
    - on_kanban_dispatch_tick
  provides_middleware: []
  requires_env: []
