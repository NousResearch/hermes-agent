  - onair_stage_safety
  - onair_show_plan
  - onair_show_status
  - onair_show_chat
  - onair_show_safety
  - onair_work_share
  - onair_present_status
  - onair_present_publish
  - onair_present_control
  - onair_obs_setup
  - onair_obs_scene
  - onair_window_share
  - onair_broadcast
  - onair_layout
  provides_hooks:
  - pre_llm_call
  - post_llm_call
  - on_session_end
  provides_middleware:
  - llm_execution
  requires_env: []
