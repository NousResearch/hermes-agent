description: "Find the videos that outgrow their author. Onda watches the Instagram, YouTube and TikTok creators you follow and gives Hermes their Hits — publications with far more views than the author has followers — along with your Projects, followed creators and plan usage; on your request it runs a new collection or transcribes Instagram videos. Hosted MCP server, browser sign-in with an emailed code (OAuth, no API key); needs a paid Onda plan and one extra command after install: hermes mcp add onda --url https://api.getonda.ru/mcp --auth oauth --connect-timeout 300. Disclosure — hosted-only connector; every tool call goes to api.getonda.ru (remote tool list not covered by the pin); run_instagram, run_youtube and start_instagram_transcript spend units or transcription minutes of the user's Onda plan; Onda answers in Russian."
