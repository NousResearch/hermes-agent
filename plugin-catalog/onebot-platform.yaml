description: "QQ bot via the OneBot 11 protocol: connects Hermes to your own self-hosted NapCat, Lagrange, LLOneBot or go-cqhttp deployment over WebSocket — the plugin hosts a reverse-WS server inside the Hermes gateway, or dials an existing forward-WS endpoint — and adds the qq toolset (qq_send_image, qq_send_voice, qq_send_video, qq_send_file, qq_send_forward, qq_send_segments, qq_napcat_api, qq_group_history) for DM and group chats with admin allowlists, group mention gating, per-member soft limits, and cron/notification delivery to a configured home channel. Inbound messages are parsed from segment arrays with CQ-string fallback; images are downloaded through an SSRF-guarded fetch (private/CGNAT/NAT64 addresses rejected, allow_cidrs escape hatch, per-hop redirect re-validation) with magic-byte extension sniffing and downscaled (Pillow) before the vision tool sees them; voice clips are SILK-magic-checked and converted to 16 kHz mono WAV for the STT pipeline; QQ cards (json/xml segments) are flattened to readable text; stickers resolve to local paths. Outbound replies are never auto-split: a two-tier policy delivers short replies as one bubble and longer ones as a locally rendered text image (fonttools/Pillow, system CJK fonts with platform-aware font chains) with a PNG size cap falling back to single-text; Markdown is stripped to QQ plain text with word-boundary emphasis handling. Includes a per-chat inbound rate limit, a proactive-write gate for the qq_* tools (minute/day caps, JSONL audit, /api/write_gate_stats), <user_message> prompt-injection boundaries (wrap inbound, strip echoed tags outbound), host clarify-tool hooks (numbered-choice card, recall on expiry), and a bundled webapp dashboard settings page (status panel, grouped config forms with write-only secrets, audit viewer). Disclosure — talks only to the user's own OneBot deployment; the plugin's listener (default port 8643) is a long-running background server inside the Hermes gateway process that accepts the bridge's reverse WebSocket and also serves the qq_* tools' local HTTP API behind an auth gate, refuses a non-loopback bind without an access token, and limits tool sends from a QQ session to that chat or the configured home channel unless the session is an admin user's private chat; inbound message media are downloaded from that deployment (or the URLs it vouches) into the plugin's data directory for the vision tool; text-to-image rendering runs locally (fonttools, Pillow, system CJK fonts) with no third-party calls; credentials (the OneBot access token, allowed-user lists, home channel) reach the plugin only through Hermes's secret scope and ONEBOT_* config and go nowhere but your own OneBot deployment; no telemetry or usage reporting."
