description: "Your agent sleeps on it. Nightly proposal-only memory consolidation with morning review, receipts, and one-step rollback. No model calls. Distinct from hermes-dreaming. Disclosure — Oneiros reads the profile's memory files, session history (state.db, read-only) and memory-hygiene report files to propose memory edits; when the user enables apply it rewrites MEMORY.md/USER.md inside the active profile under Hermes' memory file lock, keeping snapshots, receipts and rollback; no model calls and no network."
