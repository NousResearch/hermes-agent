description: "onomeo — OpenAI-compatible gateway; one key for Claude, GPT, Gemini, DeepSeek, Kimi and GLM models, with the /model picker fed by the live GET /v1/models catalog. Public beta: not every feature is guaranteed to work. Disclosure — sends your prompts, conversation history, tool definitions, tool results and ONOMEO_API_KEY to onomeo.com, which forwards each request to a third-party provider serving the chosen model; that provider's processing location and retention vary per model. onomeo keeps an excerpt of each API call (first 1,000 characters of the system prompt, first 4,000 of the last user message and of the reply) for at most 30 days and its latest 100 calls per account, does not train on them, and checks the last message and each reply against a blocklist for child sexual abuse material (https://onomeo.com/privacy). Paid models are billed per token from a prepaid onomeo balance (top-ups from 5 US dollars by card, WeChat Pay or Alipay); new accounts can call deepseek-v4.1-flash for free within daily limits; the plugin itself makes no payments."
