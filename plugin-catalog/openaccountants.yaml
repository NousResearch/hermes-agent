description: >-
  OpenAccountants tax skills for Hermes: 2,100+ jurisdiction tax skills
  (countries, US states, cross-border, verticals) register as read-only plugin
  skills, and the hosted OpenAccountants connector ships as the package MCP
  server for today's figures. Disclosure: network calls to
  https://www.openaccountants.com/api/mcp when enabled; no shell commands, no
  runtime writes, no credentials required. The repository mirrors
  https://github.com/openaccountants/openaccountants (its merged
  plugins/openaccountants-hermes bundle) on a 15-minute schedule; the SHA pin
  freezes one reviewed snapshot.
