description: >-
  OpenAccountants connector for Hermes: today's tax figures for 190+
  jurisdictions through the hosted OpenAccountants MCP server. The plugin ships
  no skills; tax skills install separately, per jurisdiction, from the
  OpenAccountants agent-skills tree. Disclosure: network calls to
  https://www.openaccountants.com/api/mcp when enabled; no shell commands, no
  runtime writes, no credentials required. The repository mirrors the
  plugins/openaccountants-hermes bundle of
  https://github.com/openaccountants/openaccountants on a 15-minute schedule;
  the SHA pin freezes one reviewed snapshot.
