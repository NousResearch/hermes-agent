name: openalex
repo: https://github.com/Adolanium/hermes-plugin-openalex
sha: d38a1ee2fb04df0f7ad136bd30bff5f2136fe0cd
description: Scholarly search, citation traversal, grouped counts, and fulltext access through OpenAlex with session spending limits.
maintainer: Adolanium
tier: community
category: tools
docs_url: https://github.com/Adolanium/hermes-plugin-openalex#readme
image: https://raw.githubusercontent.com/Adolanium/hermes-plugin-openalex/d38a1ee2fb04df0f7ad136bd30bff5f2136fe0cd/assets/catalog-banner.png
capabilities:
  provides_tools:
    - openalex_resolve
    - openalex_get
    - openalex_count
    - openalex_search
    - openalex_related
    - openalex_account
    - openalex_fields
    - openalex_fulltext
    - openalex_classify
    - openalex_harvest
  provides_hooks:
    - on_session_start
    - on_session_reset
  provides_middleware: []
  requires_env:
    - OPENALEX_API_KEY
