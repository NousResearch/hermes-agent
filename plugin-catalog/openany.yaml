known_issues:
  - Hermes does not connect this server until OPENANY_API_KEY is set in the profile secret scope.
  - A config.yaml mcp_servers.openany entry skips this package server. Remove it.
  - The default URL is https://mcp.openany.si. The full /mcp endpoint is truncated by Hermes 0.23.0 after 50 pages.
  - "Verified on /mcp-lite 2026-11-09: Hermes called search_apis, get_api, then run_api (coingecko_get_api_v3_simple_price), request 362c623f-599e-472f-8c8b-6e2c79dd9ea9, tool cost 0, total run 2613 microUSD."
  - "Verified on https://mcp.openany.si (root, no API key) 2026-11-14: POST JSON-RPC initialize then tools/list (Accept: application/json, text/event-stream) returned HTTP 200 and the four tools openany_overview, search_apis, get_api, and run_api in one page, with no nextCursor. Server name OpenAny Lite, protocolVersion 2025-03-26."
