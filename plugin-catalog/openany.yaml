description: "OpenAny is the B2A (business to agent) marketplace. Add one MCP endpoint, https://mcp.openany.si, and your agent can find and use 3,200+ APIs and 168+ AI models. Searching and checking prices is free with no key. You only need an OpenAny API key to run a call, and you pay per call. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/) that connects Hermes to OpenAny's hosted MCP server over Streamable HTTP at https://mcp.openany.si. Hermes discovers openany_overview, search_apis, get_api, and run_api from that server. Auth is OPENANY_API_KEY via the Hermes config_schema secret, sent as Authorization Bearer. The server is marked trust: untrusted. Declares Python dependency mcp==2.3.0. No local Python entrypoint, hooks, middleware, self-updater, or telemetry. Disclosure — connects to OpenAny's hosted MCP server (mcp.openany.si, Alephant AI LLC) with your OPENANY_API_KEY; every tool call and its inputs go there, and run_api forwards them to the third-party API you pick and can incur a pay-per-call charge. The package marks the server `trust: untrusted`, so calls that are not read-only ask first and are refused in unattended runs. The tool list is served by the remote server and can change without a new pin."
maintainer: Alephant AI LLC
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.2.1"
docs_url: https://openany.si
