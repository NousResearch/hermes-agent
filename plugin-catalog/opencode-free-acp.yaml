description: >-
  Real OpenCode CLI over ACP as a Hermes model provider, with curated free-model
  selection and Hermes-owned tool execution and approvals. Independent stdlib
  transport using only the documented provider API, not an HTTP compatibility
  client or a handoff to OpenCode's autonomous tools. Disclosure — starts the
  separately installed opencode acp executable for discovery/inference in the
  included restricted workspace; forwards the conversation, tool schemas and
  results to OpenCode and its selected upstream model. The CLI uses its normal
  HOME/configuration/login and may load user-configured vendor plugins/hooks;
  its normal network calls, local records and vendor terms apply. Windows batch
  launchers use the OS cmd.exe with fixed quoted arguments, AutoRun and delayed
  expansion disabled; processes join a private cleanup Job Object before running.
  Linux/macOS use an owned process group. These are not OS sandboxes. Child
  environment is allowlisted; Hermes/provider keys and YOLO settings are not
  inherited. Plugin code reads no credential stores, writes no runtime state,
  makes no direct network calls, installs no binaries and sends no telemetry.
  Native ACP permission/file/terminal requests are refused, native tool events
  abort the request, and selection must be confirmed before inference. This is
  not authorization to use OpenCode; broader vendor policies can override
  workspace restrictions, and free availability/pricing/privacy can change.
known_issues:
  - Requires a separately installed OpenCode v2 CLI; native Linux/macOS/Windows CLI and ACP/config checks pass with 2.1.2, without inference.
  - Requires plugins.isolation=in_process; isolated plugin-host execution is not supported.
  - Text and Hermes tools only; output is buffered, and token/cost usage is unknown.
  - Existing Hermes auxiliary and fallback overrides keep their configured billing behavior.
  - Live model inference and end-to-end Hermes file-tool verification remain Linux-only; cross-platform CI covers transport and real CLI negotiation.
  - Windows PowerShell .ps1 launchers are not executed; use .exe or .cmd. Batch paths containing percent expansion require the native .exe instead.
  - Windows environments that prevent cleanup Job Objects fail closed. WSL installations must use a Linux OpenCode CLI rather than a Windows executable.
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
