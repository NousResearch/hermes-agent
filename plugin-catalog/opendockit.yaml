description: "Read local documents as Markdown: PDF, Word, PowerPoint, Excel, CSV, HWP/HWPX, OpenDocument, RTF, EPUB, HTML and email, whole or by page, slide or sheet, with a skill for reading long documents in parts. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — runs a local stdio MCP server through uvx (opendockit[mcp]==0.3.15 with dependencies resolved as of 2026-11-22, downloaded from PyPI on first start); read-only; reads any file the user can read unless OPENDOCKIT_MCP_ROOTS names the allowed folders; no network when converting, no telemetry, no credentials; no OCR."
