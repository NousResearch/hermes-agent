name: openinvest
repo: https://github.com/longsizhuo/openInvest
sha: 653cc8426a01d767c1cf7a7045306d246492f38f
subdir: plugin
description: >-
  Personal portfolio ledger, market data and Agent-run research. Connect to the
  official OAuth MCP or keep a local ledger. The hosted service stores submitted
  data. De-identified research recording defaults on after the web notice,
  can retain precise amounts and currencies, and can be disabled in account settings.
  The local backend runs through uvx and stores local ledgers and configured keys
  under INVEST_HOME. Market-data and RSS sources receive queries. Direct analysis
  sends portfolio context to the configured model provider. The optional local
  session digest can expose holdings in shared chats. The optional daily report
  and news sentinel consume model quota and require explicit consent.
  Hosted tools record activity and do not place orders. The local package includes
  beta operator notes for a separately configured IBKR live-trading setup.
