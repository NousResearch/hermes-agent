description: 'Portfolio ledger, market data and Agent-run investment research. Keep
  one openInvest entry: new users can connect to the official OAuth MCP; local deployment
  remains optional and existing local bindings are preserved. Disclosure: hosted ledger/tool
  data are stored by the operator; de-identified research recording defaults on after
  webpage notice and can be disabled in account settings. Local Direct inference uses
  configured model providers. The native plugin registers skills, a routing rule and
  a pre_llm_call hook; the hook invokes the local digest only for explicitly selected
  local mode (or a configured legacy local data directory), never for remote/unselected
  mode. No brokerage execution. Server-side research-default compatibility with rule
  13 remains for maintainer review.'
