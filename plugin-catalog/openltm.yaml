# OpenLTM — long-term memory for Hermes agents.
#
# Source of truth: https://github.com/RohiRIK/OpenLtm
# Plugin lives in the `hermes/openltm_hermes` subdirectory of that repository.
# The `sha` above is the exact reviewed commit; the version label matches it.
name: openltm
repo: https://github.com/RohiRIK/OpenLtm
sha: 6105051fd2d8b70fee5027fd66230f830fe31563
subdir: hermes/openltm_hermes
description: >-
  Long-term memory for Hermes agents, stored in a local SQLite database. FTS5 full-text search with
  optional vector (sqlite-vec) recall, importance-weighted decay, a queryable memory graph, and
  automatic capture: a declarative rule engine classifies corrections, constraints, preferences,
  decisions, and agent-discovered facts from a conversation and stores each one as a distilled,
  self-contained fact. Runtime notifications and read-only OpenLTM tool requests are excluded by
  named guards so ops noise never becomes memory. No cloud, no telemetry, no API keys required;
  optional Gemini/OpenAI/Ollama providers for embeddings. MIT licensed.
maintainer: RohiRIK
tier: community
category: memory
docs_url: https://github.com/RohiRIK/OpenLtm/blob/main/docs/10-hermes-plugin.md
version: "2.15.1"
image: https://raw.githubusercontent.com/RohiRIK/OpenLtm/6105051fd2d8b70fee5027fd66230f830fe31563/hermes/plugin-catalog/banner.png
readme: true
platforms: []
capabilities:
  provides_tools:
    - openltm_recall
    - openltm_learn
    - openltm_forget
    - openltm_context
    - openltm_relate
    - openltm_graph
    - openltm_brain_stats
    - openltm_stale
  provides_hooks:
    - system_prompt_block
    - prefetch
    - sync_turn
    - on_turn_start
    - on_session_switch
    - on_session_end
    - on_memory_write
  provides_middleware: []
  requires_env: []
