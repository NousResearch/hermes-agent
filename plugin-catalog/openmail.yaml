name: openmail
repo: https://github.com/openmailsh/hermes-plugin
sha: 82a7188bed96a679e6540c962585875c9b1360f5
version: "0.4.0"
description: "Gives a Hermes agent an email address. Inbound mail can wake the agent and replies stay in-thread. The agent can manage drafts, send or schedule mail, manage queued sends, organise folders, move or restore messages, and provision inboxes. Requests to api.openmail.sh or the configured OPENMAIL_BASE_URL include the X-OpenMail-Client: hermes header and the plugin version in the User-Agent. With the configured key, tools can send mail, change or cancel scheduled delivery, delete drafts or custom folder trees, and move mail into or out of Trash without a separate Hermes approval prompt."
maintainer: openmailsh
tier: community
category: platform
docs_url: https://docs.openmail.sh/integrations/hermes
image: https://raw.githubusercontent.com/openmailsh/.github/f9d07f18a90a75e8b29f96cbc8d17154ce254828/profile/assets/banner.png
platforms: []
capabilities:
  provides_tools:
  - openmail_whoami
  - openmail_send
  - openmail_create_draft
  - openmail_list_drafts
  - openmail_get_draft
  - openmail_edit_draft
  - openmail_send_draft
  - openmail_delete_draft
  - openmail_reply
  - openmail_list_threads
  - openmail_read_thread
  - openmail_list_messages
  - openmail_create_folder
  - openmail_rename_folder
  - openmail_delete_folder
  - openmail_move_message
  - openmail_restore_message
  - openmail_list_scheduled_sends
  - openmail_reschedule_scheduled_send
  - openmail_cancel_scheduled_send
  - openmail_list_folders
  - openmail_list_folder_messages
  - openmail_attachment_text
  - openmail_list_inboxes
  - openmail_create_inbox
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - OPENMAIL_API_KEY
