description: "Research keywords and competitors, audit sites, analyze backlinks, track Google and Maps rankings and AI visibility, and work with Search Console and Analytics data through the hosted OpenSEO MCP. Agent Plugins v1 package (plugin.json + mcp.json) with twelve SEO workflow skills; OAuth uses pinned mcp-remote@0.1.49 over npx stdio, so Node.js 20.18.1+ and npm are required. Disclosure — research tools spend OpenSEO credits, and some tools create, change or delete projects, saved keywords, rank trackers, reports and audits. Every tool call goes to app.openseo.so; sign-in runs npx mcp-remote@0.1.49 from the npm registry, which stores its OAuth tokens in ~/.mcp-auth. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
