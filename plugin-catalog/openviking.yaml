description: >-
  Long-term memory and searchable knowledge for Hermes. Automatically capture conversations,
  extract memories and recall them across sessions. Six provider tools search, read and browse
  knowledge, save facts, remove memories and add resources. Setup offers Quick Local,
  OpenViking Service or your own server.
  Disclosure — conversation turns, tool results and MEMORY.md / USER.md edits are sent to the
  configured OpenViking server. Quick Local downloads a private server runtime and local embedding
  model, copies the configured Hermes static LLM credentials for extraction, and keeps its server
  running after Hermes exits. Extraction can use a remote LLM. Custom localhost connections can
  start openviking-server from PATH with a filtered profile environment.
