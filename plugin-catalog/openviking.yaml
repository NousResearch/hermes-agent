description: OpenViking context-database memory provider — session-managed memory with automatic
  extraction, tiered retrieval and filesystem-style knowledge browsing. Maintained by Volcengine; the
  same provider that shipped in-tree. Disclosure — conversation turns, tool results and MEMORY.md /
  USER.md edits are sent to the configured OpenViking server (local 127.0.0.1 by default; setup offers
  a Volcengine cloud endpoint); when the local server is down it starts `openviking-server` from PATH
  in the background, and at this pin that child inherits the full Hermes environment.
