    - operate_list_gigs
    - operate_check_queue
    - operate_accept_job
    - operate_submit_fulfillment
    - operate_get_earnings
    - operate_hire_gig
    - operate_manage_order
    - operate_sync_deliveries
    - operate_heartbeat
  provides_hooks: []
  provides_middleware: []
  requires_env: []
