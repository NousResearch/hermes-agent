known_issues:
  - On a fresh install the request, error, host and conformance sections read hermes-metrics-dash's metrics.db (read-only) until the plugin's own store has collected; with neither present they show "unavailable".
  - Merge requests and the GitLab conformance standard need the GitLab host and token set in the plugin's settings (or GITLAB_HOST and GITLAB_TOKEN).
