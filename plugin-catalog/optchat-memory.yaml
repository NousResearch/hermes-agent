name: optchat-memory
repo: https://github.com/aska-digital/optchat-memory
sha: "7b1df7e4ad85cd5c7866c90ca15a0efb2df7d2b3"
description: "OptChat-style endless memory for Hermes: an append-only verbatim log plus a binary summary tree, exposed as recall through the MemoryProvider ABC. Background compactor builds the tree with a cheap auxiliary model (call_llm task optchat_compact); prefetch returns a fixed-budget view of the whole history; optchat_zoom/optchat_date tools open any line down to the verbatim message. Local files only — no credentials, no network."
maintainer: ahrazzle
tier: community
category: memory
requires_hermes: ">=0.21.4"
version: "0.1.0"
docs_url: https://github.com/aska-digital/optchat-memory/tree/7b1df7e4ad85cd5c7866c90ca15a0efb2df7d2b3#readme
readme: true
platforms: [linux, macos, windows]
capabilities:
  provides_tools: [optchat_zoom, optchat_date]
  provides_hooks: []
  provides_middleware: []
  requires_env: []
