description: "Bundled Orbit browser desktop with explicit local setup, scoped control, previews and checkpoints. Disclosure — talks only to the local Orbit server you configure (loopback, Bearer capability from runtime_dir); mutations off by default. Ships Orbit's source tarball for the optional orbit.py setup CLI (runs npm ci / node); that bundled server hardcodes the author's Tailscale host for VNC/Xpra launchers and can optionally call api.typesafe.ai with a user-supplied key."
