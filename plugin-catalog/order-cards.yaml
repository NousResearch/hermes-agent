description: "Purchase approval cards for checkouts the agent drives: it stops before the final button and shows an inline card (::preview) laid out like Grok Bot's order card: an expandable item row with thumbnails, labelled Summary, Ship to and Pay with sections (with pickers), and Cancel / Pay buttons; after Pay it shows 'Order submitted', and once the order goes through the card collapses into an 'Order placed' pill. Adds static delivery snapshots with four discrete stage milestones (not courier GPS or an exact completion percentage) and readable Pay text on hosts without --card. Portable Agent Plugins v1 package (skills/ only, one stdlib Python script). Disclosure — the skill guides the agent through merchant checkout pages in your browser with Hermes's own browser tools and tells it to submit only after you tap Pay on the card or give a clear yes; that approval is an instruction to the model, not a Hermes approval prompt. Card buttons send fixed prompts back as your message via data-hermes-send; card details go only through browser_vault. If you want tracking, the skill guides the agent to read real merchant/courier email or SMS through separately authorized tools, or check a merchant status page with browser tools; requested scheduled follow-ups require an available scheduling tool. It provides no mail/SMS access, automatic scheduler or tracking service. At most three checks per order (after confirmation, around pickup, near ETA), stopping at delivered, are agent guidance; snapshots are not push updates. Missing status is not fabricated. The bundled script makes no network calls, reads only the order JSON it is given and writes one HTML file; the rendered card loads merchant favicons from www.google.com/s2/favicons and item images from merchant CDNs. Its only frame message is the standard hermes-inline-preview-size height report, sent with the host's own token so collapsed cards leave no gap. No credentials, telemetry or background processes."
