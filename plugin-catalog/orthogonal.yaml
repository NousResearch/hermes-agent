known_issues:
  - "Needs an Orthogonal account. Sign in with `hermes mcp add orthogonal --url https://mcp.orthogonal.com --auth oauth` then `hermes mcp login orthogonal` (or set an API key header); that profile entry replaces the package's declaration of the same server. Paid calls spend that account's credits."
