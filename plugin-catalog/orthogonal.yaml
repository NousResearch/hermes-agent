description: "Find, price and run paid third-party APIs (web scraping and search, people and company data, enrichment, media and more) through Orthogonal's hosted MCP server, paid per call from one Orthogonal balance. Disclosure — Orthogonal (orthogonal.com) is a paid third-party API marketplace: the agent connects to mcp.orthogonal.com, sends your requests to Orthogonal and on to the provider that serves them, and each use/batch_use call spends your prepaid Orthogonal credits; search, get_details, quote, batch_get_details and integrate are free. The bundled skill treats a direct request for data as approval of a reasonably scoped paid call, and has the model quote first when the price is unclear, the call is expensive or several calls are planned; that is an instruction to the model, not a Hermes approval prompt, unless you add `trust: untrusted` to `mcp_servers.orthogonal`."
maintainer: orthogonal-sh
tier: community
category: tools
docs_url: https://github.com/orthogonal-sh/orthogonal-plugins#hermes-agent
version: "0.3.4"
title: Orthogonal
image: https://raw.githubusercontent.com/orthogonal-sh/orthogonal-plugins/b11cfe2d2c50972d03695ac3c24c9698ad84240a/assets/hermes-card.png
readme: true
known_issues:
  - "Needs an Orthogonal account. Add the server with `hermes mcp add orthogonal --url https://mcp.orthogonal.com --auth oauth` and sign in with `hermes mcp login orthogonal` (or set an API key header). Paid calls spend that account's credits."
  - "Hermes skips the package's own mcp.json server declaration (it carries an extension field for another client), so the server is added with the command above."
