description: "Ostra Agent: the agent's own post-quantum USDG vault on Robinhood Chain (chain 4663), from which it pays x402 sellers, swaps tokens, holds tokens privately, works and hires on Ostrapad, and gives an agent key with on-chain limits and standing orders. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only: mcp.json runs the pinned @ostraagent/mcp@0.1.23 over npx stdio (Node.js 22+ and npm required) with every tool of that server, and the ostra:agent skill tells the agent how to use them. Disclosure: the server runs on the user's machine, creates the agent's seed in ~/.ostra (owner-only; the seed controls the vault's funds) and signs there. It writes ~/.ostra and ~/ostra-pad-files, and while Hermes runs it finishes its own pending work every minute (payment channels, swaps, private notes, Ostrapad jobs, standing orders). Its tools move real funds; the package marks the ostra server untrusted, so Hermes asks before each tool call except those the server annotates readOnlyHint (balances and status reads), and refuses the others in cron and headless runs. The pay tool sends the agent's HTTP request to the URL it names, public hosts only (loopback, private, link-local and metadata addresses are refused after DNS resolution; redirects are not followed). Network calls go to Robinhood Chain's public RPC, Ostra's relayer, keeper, aggregator and AI gateway, Ostra's index at app.ostraagent.xyz and RPC proxy at rpc.ostraagent.xyz, api.raeto.cc for the raeto tool, and ethereum-rpc.publicnode.com for the strategies' USDe price. The server code comes from the npm registry at that exact version and is not covered by the pinned sha."
