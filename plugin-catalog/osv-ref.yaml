name: osv-ref
repo: https://github.com/EloquentBrush0x/hermes-context-refs
sha: 43ab2b75e660db5edcfe2f215776294c45408b40
subdir: osv-ref
description: >-
  @cve:, @ghsa: and @osv: context references: attach a vulnerability record from OSV.dev to a
  message (summary, aliases, severity, affected packages with version ranges and fixed versions,
  details, references), with package data merged from up to four alias records. Disclosure — sends
  HTTPS GET requests to api.osv.dev/v1/vulns/<id> only (the referenced id and up to four of its
  alias ids leave the machine); no API key, no files written, no subprocess; register() only adds
  the @cve:, @ghsa: and @osv: reference providers.
maintainer: EloquentBrush0x
tier: community
category: web
requires_hermes: ">=0.21"
