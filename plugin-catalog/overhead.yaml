known_issues:
  - "The first run over a new area takes about 40 to 70 s, sometimes longer, while the imagery streams from AWS us-west-2; repeat runs take about 1 s from the cache."
  - "The interactive Desktop card needs a Desktop build with the tool-media renderer area (main after 24 Oct 2026, or the first release after 0.22.5) and its Desktop half switched on in Capabilities → Plugins; other builds and surfaces show the panel PNG or the GIF."
