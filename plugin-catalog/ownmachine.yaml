name: ownmachine
title: OwnMachine
repo: https://github.com/rbur0425/ownmachine
sha: fa71c33a3fd706d9931725565fccf89a98254d69
subdir: plugin
description: "A persistent private macOS or ARM64 Omarchy VM workspace for Hermes with SSH/MCP and human-controlled browser access. Disclosure — Runs OpenSSH, using your own SSH config, agent and keys, to an operator-configured Mac host and streams VM screenshots, accessibility text and computer_use input to a guest macOS or ARM64 Omarchy Linux VM through a fixed-command MCP relay; `/ownmachine setup --run` executes remote provisioning stages on the Mac over a separate setup SSH alias; the opt-in `remind later --mode tomorrow` writes a helper script into the Hermes `scripts/` directory and creates a one-shot no-agent cron job through the profile's local gateway; it keeps a shared control database in an operator-chosen directory. Licensed PolyForm Noncommercial 1.0.0."
maintainer: rbur0425
tier: community
category: desktop
requires_hermes: ">=0.23.1"
version: "1.0.0"
docs_url: https://github.com/rbur0425/ownmachine#readme
readme: true
platforms: [linux, macos] # Hermes runtime; guest host still requires Apple Silicon macOS.
screenshots:
  - https://raw.githubusercontent.com/rbur0425/ownmachine/fa71c33a3fd706d9931725565fccf89a98254d69/docs/media/catalog/human-control.png
  - https://raw.githubusercontent.com/rbur0425/ownmachine/fa71c33a3fd706d9931725565fccf89a98254d69/docs/media/catalog/agent-control.png
  - https://raw.githubusercontent.com/rbur0425/ownmachine/fa71c33a3fd706d9931725565fccf89a98254d69/docs/media/catalog/google-task.png
known_issues:
  - Omarchy supports tested foreground control on Apple Silicon; background input is experimental and Chromium requires explicit matching Hyprland module opt-in.
  - Linux uses a reviewed preview-grade driver pin; rolling system updates require compatibility checks.
  - Declares websockets==15.0.1 for gateway scheduling and Pillow>=11.0.0,<14 for screenshot verification; Hermes requests dependency consent during installation.
  - Manual Mac/guest setup, firewall installation and macOS permission grants are required.
  - Independent ALF-only random-port blocking and reboot persistence of the new security setup are unverified.
  - One initial guest boot hung; later restart checks passed.
  - Model-driven pixel-click acceptance is deferred; cloud Mac hosting is unverified.
  - PolyForm Noncommercial 1.0.0; commercial use outside its permissions requires a separate license.
capabilities:
  provides_tools: [ownmachine_status]
  provides_hooks: [on_session_open]
  provides_middleware: [tool_execution]
  requires_env: []
