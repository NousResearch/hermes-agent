subdir: plugin
description: "Give Hermes its own Mac, Omarchy or Windows VM to test apps, scrape websites and automate desktop work with private SSH access and you in control. Keep a persistent workspace on infrastructure you control, watch from your browser and take over when needed. Privacy: screenshots and app text follow your configured model provider. Disclosure — Runs OpenSSH, using operator-configured aliases, agents and keys, to a Mac or Linux KVM host and streams VM screenshots, accessibility text and computer_use input through a restricted fixed-command MCP relay; screenshots and app text go to your configured model provider; guided setup (`/ownmachine setup --run`) executes reviewed remote provisioning stages over a separate temporary setup SSH alias and requires administrator registration and manual guest consent/sign-in; Windows guests use separate agent/viewer roles, a root-owned runtime, libvirt policy, firewall rules and a private Unix console on the host; the opt-in `remind later --mode tomorrow` writes a helper script into the Hermes `scripts/` directory and creates a one-shot no-agent cron job through the profile's local gateway; a shared control database is kept in an operator-chosen directory. Licensed PolyForm Noncommercial 1.0.0."
maintainer: rbur0425
tier: community
category: desktop
requires_hermes: ">=0.23.1"
version: "1.1.1"
docs_url: https://github.com/rbur0425/ownmachine/blob/v1.1.1/README.md
readme: true
platforms: [linux, macos] # Hermes runtime; macOS/Omarchy guests use Apple Silicon, Windows guests use Linux x86-64 KVM.
