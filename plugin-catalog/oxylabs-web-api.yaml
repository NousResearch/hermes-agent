description: "Oxylabs Web API search and page extraction for Hermes Agent: Google results with page outlines, any page as Markdown, including JavaScript-heavy and bot-protected pages. Disclosure — sends search queries and the URLs to extract to the Oxylabs Web API at webapi.oxylabs.io with the user's OXYLABS_WEB_API_KEY, and Oxylabs fetches those pages from its own servers; each call uses paid Oxylabs credits. Requests carry an x-oxylabs-sdk header with the plugin and Python versions. No telemetry, no stored credentials, no self-update."
maintainer: oxylabs
tier: community
category: web
title: Oxylabs Web API
version: "0.1.1"
requires_hermes: ">=0.23.1"
docs_url: https://github.com/oxylabs/hermes-oxylabs-web-api#readme
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - OXYLABS_WEB_API_KEY
