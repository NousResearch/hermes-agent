version: 0.5.0
description: "Editable cast narration with locked voices, source passage IDs, resumable synthesis and selective regeneration. Disclosure — Stores books and generated audio privately in its plugin data. On first use it lists the speech options on this computer and asks which to use; it never picks one for you, and online engines are blocked if you say no online services. To find local speech servers it sends GET /v1/models only to this computer's loopback address (ports 8000, 8880, 5002, 8020 and 8080, plus any local address you set; no redirects, 1 second timeout). Every program it starts gets a minimal environment (PATH, HOME, LANG), never your provider keys. Voices are local (an installed speech program such as espeak-ng, Flite, Piper or say, or a speech server already running on this computer) unless you choose hosted Inworld, ElevenLabs or Google Gemini, which send passage text and voice choices to that provider with your own key and use your credits; the optional Gemini Vertex route uses a Google sign-in that Hermes holds for your own OAuth client (hermes auth add pagecast-director:google; the plugin never sees the token), sent only to aiplatform.googleapis.com. Can render a short captioned video clip (audiogram) of a finished chapter span into plugin data, with a cover image you point to. Runs local FFmpeg/ffprobe and adb; mpv only plays a preview aloud when you approve it. The optional Android tools check the author's GitHub releases (flabanabba8/PageCast) for the PageCast app and can download the latest APK (checked against that release's own SHA256SUMS); installing it on a phone with adb, replacing a locked voice and playing a preview aloud each ask for your approval (one pre_tool_call hook). No background processes beyond a render or preview you start."
maintainer: flabanabba8
