version: 0.4.1
description: 'Editable cast narration with locked voices, source passage IDs, resumable synthesis and selective regeneration. Disclosure: On first use it finds the speech options on this computer and asks which engine to use; it never picks one for you, and online engines are blocked if you say no online services. To list speech servers it sends GET /v1/models to 127.0.0.1 on ports 8000, 8080, 9000, 2022 and 8880 only (no redirects, 1 second timeout). Every program it starts gets a minimal environment (PATH, HOME, LANG), never your provider keys. Stores books and generated audio privately. Voices are local (Flite, or a Higgs server already running on your computer) unless you choose hosted Inworld, ElevenLabs or Google Gemini, which send passage text and voice choices to that provider with your own key, or for Gemini on Vertex a Google sign-in that Hermes holds for your own OAuth client (hermes auth add pagecast-director:google), and use your credits. Runs local Flite and FFmpeg; mpv only plays a preview aloud when you approve it. The optional Android tools check GitHub for the PageCast app and can download it; installing it on a phone with adb, replacing a locked voice and playing a preview aloud each ask for your approval (one pre_tool_call hook). No background processes beyond a render or preview you start.'
maintainer: flabanabba8
