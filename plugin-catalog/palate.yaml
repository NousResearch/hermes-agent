name: palate
repo: https://github.com/Gens-ai/palate
sha: c5e20d41fe3816db2c2acc69c09f080bd8f25e80
description: "A palate is the instrument that does the matching, and it sharpens as the record fills. Now working for Hermes. It keeps your own local record of what you watched, what you turned down, and the reason in each case, then picks from that: mood is held separately from taste, so something can suit you and still be wrong for tonight and be offered for another night with the blocker named. It reports an affinity only when the evidence supports one, and says so plainly when it does not. Availability covers subscriptions, free ad-supported tiers, library access and your own files, and rentals are opt in per storefront, so Amazon can count while others do not; every suggestion names what it would cost, and since the data carries no prices, none is invented. No account and no hosted service. Disclosure: calls only api.themoviedb.org, sending the titles and ids you ask about plus discovery filters such as a runtime cap, for search, keywords, credits, runtimes and watch-provider availability (JustWatch data under licence), and never sending your verdicts, reasons, ratings, services or any other part of your ledger anywhere; reads your TMDB key only from plugins.entries.palate.settings.tmdb_api_key through Hermes config, and reads no environment variables, no .env files and no vendor token files; palate_import reads only the single CSV path you name and refuses any file that does not prove it is a Letterboxd or Trakt export, showing none of its contents or column names; stores works, verdicts, reasons, axis scores with their provenance, your service list and cached TMDB metadata and availability in the plugin's own data folder, while palate_export writes JSON wherever you ask; Hermes's own state.db is never opened; registers no hooks, so no other session's behaviour changes, and runs no background work, no subprocesses, no shell commands and no telemetry."
maintainer: Gens-ai
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://github.com/Gens-ai/palate#readme
version: "0.2.0"
readme: true
title: Palate
capabilities:
  provides_tools:
    - palate_pick
    - palate_verdict
    - palate_seen
    - palate_services
    - palate_profile
    - palate_import
    - palate_export
  provides_hooks: []
  provides_middleware: []
  requires_env: []
