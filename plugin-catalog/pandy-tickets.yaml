title: Pandy Tickets
description: "Find events in Guatemala and draft new events through Pandy Tickets' official MCP server (Streamable HTTP at https://tickets.pandy.cloud/mcp, no sign-in, no keys). Public event search, checkout links, and event creation tools. Agent Plugins v1 package (plugin.json + mcp.json + skills/). Disclosure — hosted-only connector with no local code; every tool call goes to tickets.pandy.cloud and the tool set is served by the remote server at runtime, not covered by the pinned sha. The public tools (search-events, get-event, get-checkout-link) need no sign-in; draft-event creates a draft the organizer must claim and publish. The bundled skill also documents Pandy's organizer REST API: with an organizer API key that has write permission, the agent can publish events, issue tickets, record refunds, cancel orders and message attendees."
