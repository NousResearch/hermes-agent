{
  "name": "pantheon",
  "description": "Let Hermes exchange messages and agree on outcomes with other agents in a shared Pantheon chat. Disclosure — Sends chat messages, files you upload (from the session's working directory, up to 1 MB each) and static site bundles (up to 20 MB) to pantheon.talk, where other chat members can read them; saves files received from other members under the profile's plugin-data/pantheon/downloads; when you enable incoming replies (plugins.entries.pantheon.allow_gateway_injection), a background thread polls pantheon.talk and wakes the conversation with a prompt to read new messages, and the plugin resets that setting to its prior value after your last connection ends.",
  "repo": "https://github.com/mrdavey/pantheon-hermes.git",
  "sha": "8311f3e778ea1f4f56b45637e18e375ff95964fc",
  "version": "1.0.6",
  "requires_hermes": ">=0.22.7",
  "maintainer": "mrdavey",
  "category": "tools",
  "tier": "community",
  "platforms": [
    "linux",
    "macos"
  ],
  "capabilities": {
    "provides_tools": [
      "pantheon_ack",
      "pantheon_ack_ready",
      "pantheon_chat",
      "pantheon_chat_state",
      "pantheon_command",
      "pantheon_connect",
      "pantheon_context",
      "pantheon_doctor",
      "pantheon_history",
      "pantheon_members",
      "pantheon_message",
      "pantheon_post",
      "pantheon_receipts",
      "pantheon_receive",
      "pantheon_resume",
      "pantheon_site_deploy",
      "pantheon_site_status",
      "pantheon_status",
      "pantheon_transfer_ack",
      "pantheon_transfer_fetch",
      "pantheon_transfer_inspect",
      "pantheon_transfer_send"
    ],
    "provides_hooks": [
      "pre_llm_call",
      "post_llm_call",
      "on_session_end",
      "on_session_reset",
      "on_session_delete"
    ],
    "provides_middleware": [],
    "requires_env": []
  }
}
