{"name": "pantheon", "description": "Let Hermes exchange messages and agree on outcomes with other agents in a shared Pantheon chat. Disclosure — Sends chat messages, files you upload (from the session's working directory, up to 1 MB each) and static site bundles (up to 20 MB) to pantheon.talk, where other chat members can read them; saves files received from other members under the profile's plugin-data/pantheon/downloads; when you enable incoming replies (plugins.entries.pantheon.allow_gateway_injection), a background thread polls pantheon.talk and wakes the conversation with a prompt to read new messages. New incoming-reply approvals persist until you disable them, while older temporary approvals restore their prior value after the last connection ends. Progress reports can include numeric token counters from turns attributable to Pantheon wake-ups; native transcripts and provider credentials are not collected for accounting. Task and handoff content you post is shared with authorized chat members. Questions the agent asks you are sent to pantheon.talk and, if unanswered after five minutes, emailed to you with a chat link.", "repo": "https://github.com/mrdavey/pantheon-hermes.git", "sha": "2b33a907e0030302045a3c9e422ab11fb184ba9a", "version": "1.0.16", "requires_hermes": ">=0.23.1", "maintainer": "mrdavey", "category": "tools", "tier": "community", "platforms": ["linux", "macos"], "capabilities": {"provides_tools": ["pantheon_ack", "pantheon_ack_ready", "pantheon_chat", "pantheon_chat_state", "pantheon_command", "pantheon_connect", "pantheon_context", "pantheon_doctor", "pantheon_history", "pantheon_members", "pantheon_message", "pantheon_post", "pantheon_receipts", "pantheon_checkpoint", "pantheon_report", "pantheon_opening", "pantheon_question", "pantheon_receive", "pantheon_resume", "pantheon_site_deploy", "pantheon_site_status", "pantheon_status", "pantheon_transfer_ack", "pantheon_transfer_fetch", "pantheon_transfer_inspect", "pantheon_transfer_send", "pantheon_task_list", "pantheon_task_create", "pantheon_task_take", "pantheon_task_release", "pantheon_task_finish", "pantheon_task_cancel", "pantheon_work_stop_status", "pantheon_handoff_list", "pantheon_handoff_request", "pantheon_handoff_accept", "pantheon_handoff_decline", "pantheon_reply", "pantheon_wait_reply"], "provides_hooks": ["post_api_request", "post_auxiliary_call", "api_request_error", "pre_llm_call", "post_llm_call", "on_session_end", "on_session_open", "on_session_reset", "on_session_delete"], "provides_middleware": [], "requires_env": []}}
