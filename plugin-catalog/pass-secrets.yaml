name: pass-secrets
repo: https://github.com/dyiapanis/pass-secrets
sha: 55189d3b6b6214887185d85eb1ce66deef1a7e73
description: >-
  pass (password-store) secret source: resolves secrets from a local,
  GPG-encrypted, git-tracked password store into environment variables at
  startup, as a first-class SecretSource beside the built-in Bitwarden and
  1Password sources. Stdlib-only (subprocess + pathlib), no Python deps, no
  network — ever. Disclosure — the plugin shells out to the `pass` binary
  (10s timeout per entry) for every .gpg file in the configured store
  subdirectories; each entry's leaf name becomes an env var (UPPER_SNAKE_CASE
  enforced, first claim wins); GPG passphrases are handled by gpg-agent, the
  plugin never prompts; individual entry failures degrade to warnings while
  the rest load; also registers a static ~600-char session-prompt note
  explaining the secret-resolution path (no secrets are ever exposed through
  tools). Config: secrets.pass.{enabled,store_path,subdirs,override_existing,timeout_seconds}.
maintainer: dyiapanis
tier: community
category: tools
requires_hermes: ">=0.21.4"
