name: pass-secrets
repo: https://github.com/dyiapanis/pass-secrets
sha: 0855ecc9c82b04344f79943cf71dd7374f51e8c2
description: "pass (password-store) secret source: resolves secrets from a local, GPG-encrypted, git-tracked password store into environment variables at startup, as a first-class SecretSource beside the built-in Bitwarden and 1Password sources. Disclosure — When enabled, shells out to the local pass binary (10 s per entry) for every .gpg entry under the configured store subdirs and injects each as an env var that by default overrides .env and shell values; when enabled, also adds a ~900-char system-prompt note about secret resolution; no network."
maintainer: dyiapanis
tier: community
category: tools
requires_hermes: ">=0.21.4"
docs_url: https://github.com/dyiapanis/pass-secrets#readme
version: "1.1.0"
readme: true
platforms: [linux, macos]
capabilities:
  provides_tools: []
  provides_hooks: ["pre_gateway_dispatch"]
  provides_middleware: []
  requires_env: []