name: pass-secrets
repo: https://github.com/dyiapanis/pass-secrets
sha: 3899c9a0698ac0daf7764b84f239f1c51e56afb7
description: "pass (password-store) secret source: resolves secrets from a local, GPG-encrypted, git-tracked store into environment variables at startup, as a first-class SecretSource beside the built-in Bitwarden and 1Password sources, and stores new secrets from chat with !secret. Stdlib-only (subprocess + pathlib), no Python deps, no network — ever. Config: secrets.pass.{enabled,store_path,subdirs,override_existing,timeout_seconds}. Disclosure — when enabled, shells out to the local pass binary (10 s per entry) for every .gpg entry under the configured store subdirs and injects each as an env var that by default overrides .env and shell values, so an entry in a shared subdir becomes an environment variable inside every agent process; when enabled, also adds a ~900-char system-prompt note about secret resolution. !secret is a pre_gateway_dispatch hook: the message is handled at ingress and never reaches the agent loop or conversation state. It is off until senders are listed in chat_allowed_users (<platform>:<user_id>); an unlisted sender's !secret is skipped without a reply."
maintainer: dyiapanis
tier: community
category: tools
requires_hermes: ">=0.21.4"
docs_url: https://github.com/dyiapanis/pass-secrets#readme
version: "1.1.0"
readme: true
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: ["pre_gateway_dispatch"]
  provides_middleware: []
  requires_env: []