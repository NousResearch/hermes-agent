name: pass-secrets
repo: https://github.com/dyiapanis/pass-secrets
sha: 6513470189220a437d8435505776ca4019b220c6
description: "pass (password-store) secret source: resolves secrets from a local, GPG-encrypted, git-tracked store into environment variables at startup, as a first-class SecretSource beside the built-in Bitwarden and 1Password sources, and stores new secrets from chat with /s. Stdlib-only (subprocess + pathlib), no Python deps, no network — ever. Config: secrets.pass.{enabled,store_path,subdirs,override_existing,timeout_seconds}. Disclosure — when enabled, shells out to the local pass binary (10 s per entry) for every .gpg entry under the configured store subdirs and injects each as an env var that by default overrides .env and shell values, so an entry in a shared subdir becomes an environment variable inside every agent process; when enabled, also adds a ~900-char system-prompt note about secret resolution. /s is a pre_gateway_dispatch hook: the message is handled at ingress and never reaches the agent loop or conversation state, and the plugin applies no sender policy of its own — channel access is the boundary."
maintainer: dyiapanis
tier: community
category: tools
requires_hermes: ">=0.21.4"
docs_url: https://github.com/dyiapanis/pass-secrets#readme
version: "1.1.0"
readme: true
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: ["pre_gateway_dispatch"]
  provides_middleware: []
  requires_env: []
