name: pass-secrets
repo: https://github.com/dyiapanis/pass-secrets
sha: d8a0719adfc45a18fe1da5c0998201dcc2e062aa
description: "pass (password-store) secret source: resolves secrets from a local, GPG-encrypted, git-tracked password store into environment variables at startup, as a first-class SecretSource beside the built-in Bitwarden and 1Password sources. Disclosure — When enabled, shells out to the local pass binary (10 s per entry) for every .gpg entry under the configured store subdirs and injects each as an env var that by default overrides .env and shell values; appends one line per fetch and per pass_run_env invocation to plugin-data/pass-secrets/audit.log (env-var names only, never values); when enabled, also adds a ~900-char system-prompt note about secret resolution, extended in scheduled/single-query sessions with a fail-closed instruction to stop and report on missing secrets; registers a pre_gateway_dispatch hook that consumes `!secret`/`/secret` messages before gateway auth and, only for senders listed in the plugin's `chat_allowed_users` setting (empty = off), writes the value into the pass store with `pass insert -f` (a `shared/` entry becomes an env var in every agent at next start); registers a transform_llm_output hook (hold_stream=True) that scrubs any resolved value (8+ chars) from the agent's final reply text, replacing it with `[REDACTED:<NAME>]` before the reply is persisted or delivered — exact-substring matching only, tool outputs and child-process stdout are not scrubbed; provides one tool, pass_run_env, which resolves requested names (env first, then live from the store) and injects them into a single command's environment for that call only — no standing copies, no config change; no network."
maintainer: dyiapanis
tier: community
category: tools
requires_hermes: ">=0.22.6"
docs_url: https://github.com/dyiapanis/pass-secrets#readme
version: "1.3.0"
readme: true
platforms: [linux, macos]
capabilities:
  provides_tools: ["pass_run_env"]
  provides_hooks: ["pre_gateway_dispatch", "transform_llm_output"]
  provides_middleware: []
  requires_env: []
