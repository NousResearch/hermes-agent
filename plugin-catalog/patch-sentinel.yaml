description: >-
  Measures the host, not the source tree: code review asks "can an attacker exploit this code?" and
  this asks "is this machine running what the vendor shipped?" — the two are complements, never
  substitutes.
  Answers "are we patched?" with evidence, for whatever the host runs — an adapter chosen from the
  host's own /etc/os-release (apt, dnf, pacman, zypper, apk), the running kernel against the newest
  installed and installable, whatever advisory names the fixed version per release (Ubuntu notices,
  OSV per release, Bodhi, Arch's tracker, SUSE's OVAL), container image digests, nine language
  ecosystems through OSV plus lockfile pins, package checksums and listening sockets against a
  recorded baseline, and a CycloneDX SBOM. Every check has three outcomes — clean, finding,
  could-not-look — so an unreachable host, an unimplemented distro or a rate-limited registry reads
  as unknown rather than clean. The pane reads one device at a time and hands over the exact commands
  per device; a gated cve_apply tool stages, applies, re-measures and writes a receipt for an agent
  explicitly asked to patch. Linux only: any other OS answers "unsupported" with its name.
