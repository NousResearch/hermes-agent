description: "Measures the host, not the source tree: code review asks \"can an attacker exploit this code?\" and this asks \"is this machine running what the vendor shipped?\" — the two are complements, never substitutes. Answers \"are we patched?\" with evidence, for whatever the host runs — an adapter chosen from the host's own /etc/os-release (apt, dnf, pacman, zypper, apk), the running kernel against the newest installed and installable, whatever advisory names the fixed version per release (Ubuntu notices, OSV per release, Bodhi, Arch's tracker, SUSE's OVAL), container image digests, nine language ecosystems through OSV plus lockfile pins, package checksums and listening sockets against a recorded baseline, and a CycloneDX SBOM. Every check has three outcomes — clean, finding, could-not-look — so an unreachable host, an unimplemented distro or a rate-limited registry reads as unknown rather than clean. The pane reads one device at a time and hands over the exact commands per device; a gated cve_apply tool stages, applies, re-measures and writes a receipt for an agent explicitly asked to patch. Linux only: any other OS answers \"unsupported\" with its name. Disclosure — scans run fixed read-only commands on this machine and, over your own ssh agent, on hosts you list; package names and versions go to api.osv.dev, api.first.org and the distro advisory sites (ubuntu.com, bodhi.fedoraproject.org, security.archlinux.org, ftp.suse.com, cisa.gov); cve_apply, after Hermes's approval prompt, runs the distro's full upgrade with sudo -n on the chosen host; scans, receipts and SBOMs stay under $HERMES_HOME/patch-sentinel (mode 700)."
