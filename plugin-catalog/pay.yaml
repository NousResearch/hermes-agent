description: 'Discover priced APIs and pay per request (HTTP 402, x402, MPP) in stablecoins through
  the official hosted Pay MCP server (Streamable HTTP at https://connect.pay.sh/mcp, OAuth sign-in, no
  keys or local wallet), with the pay workflow skill bundled. Portable Agent Plugins v1 package
  (mcp.json + skills/), no Python or executables. Disclosure — payments plugin for pay.sh: the curl
  tool spends the account''s stablecoin balance; each payment is confirmed by the user through MCP
  elicitation (declined when nobody can answer) and the server is marked untrusted; chats sharing a
  Hermes profile share its Pay account; the tool set is served by the remote MCP server at runtime and
  is not covered by the pinned sha.'
