known_issues:
  - '`hermes plugins validate` warns (catalog rule 9) about the one private core import in `engine.py`: `agent.file_safety.is_write_denied`. It is the confinement check the catalog review asked for, imported lazily and failing closed if the module is present but broken; there is no public equivalent, no core function is patched, and it exists in every Hermes >= 0.22.0.'
