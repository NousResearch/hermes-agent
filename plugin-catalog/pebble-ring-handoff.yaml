name: pebble-ring-handoff
title: Pebble Ring handoff
repo: https://github.com/potalora/pebble-ring-handoff
sha: fc15cdeb21204184ea20d2e53cf7cf08be43ea3e
subdir: package
description: "Receive Pebble Ring captures and require one Discord approval before a Hermes turn. Disclosure — captures reach Hermes through a loopback receiver (127.0.0.1:8765, bearer-token auth) exposed via a Cloudflare Quick Tunnel; cloudflared must be preinstalled (never downloaded). `hermes pebble setup` creates a separate venv with hash-pinned pip deps, writes plugin settings and installs a 5-minute no-agent Hermes cron job that may restart its own receiver/tunnel processes. Wraps the Discord adapter's handle_message and uses private discord.py/adapter internals (pinned to discord.py 2.7.1, fails closed on mismatch); transcripts are posted to your configured Discord channel, audio only on the approver's request."
maintainer: potalora
tier: community
category: voice
requires_hermes: ">=0.21.2"
version: "3.0.4"
platforms: [linux]
readme: true
capabilities:
  provides_tools: [ring_get_audio, pebble_status]
  provides_hooks: [pre_gateway_dispatch]
  provides_middleware: []
  requires_env: []
