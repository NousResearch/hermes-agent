version: "0.1.0"
description: "Desktop-only, read-only monitor for pending memory and skill write approvals. Disclosure — the pane's API reads pending/memory/*.json and pending/skills/*.json under the default Hermes root and every named profile directory beneath it (all profiles, not only the active one), and returns only counts, age buckets, oldest age, and per-item profile/subsystem/id/action/origin/created_at/age_seconds. It never returns or displays summaries, payloads, or record content; it exposes no approve, reject, or delete actions; it registers no tools, hooks, or middleware, performs no network I/O, and holds no credentials."
maintainer: Ardenye
