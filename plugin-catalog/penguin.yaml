version: "0.1.0"
requires_hermes: ">=0.23.0"
maintainer: Crystal32378
tier: community
category: tools
description: >-
  A penguin in Antarctica keeping an eye on everyone's time: deterministic IANA conversions,
  whole-meeting overlap windows, profile-local teams, and an optional Desktop planner with
  side-by-side clocks. Reads bundled non-executable IANA 2026f data and its own plugin state.
  No external runtime requests, shell commands, credentials, telemetry or calendar writes.
screenshots:
