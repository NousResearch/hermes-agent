sha: d63015de74effae451d5286cc080b6a3afddd6ad
version: "0.2.2"
requires_hermes: ">=0.23.0"
maintainer: Crystal32378
tier: community
category: tools
description: >-
  A penguin in Antarctica keeping an eye on everyone's time: deterministic IANA conversions,
  whole-meeting overlap windows, profile-local teams, and an optional Desktop planner with
  side-by-side clocks, Commander dispatch and proposal-only completion. Reads bundled artwork,
  non-executable IANA 2026f data and its own plugin state. Optional user-started AI-generated
  music and a halftone sky use bundled audio and offline analysis; no microphone access.
  No external runtime requests, shell commands, credentials, telemetry or calendar writes.
