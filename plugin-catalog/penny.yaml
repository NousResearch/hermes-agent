description: >-
  Penny core memory and private notes for Hermes. Disclosure — automatic recall
  sends up to 4,000 characters of nontrivial local prompts as search queries to
  app.mypenny.ai; selected note saves go to the same service. Independent OAuth
  credentials are stored under the active Hermes profile; no raw transcript
  uploads, telemetry, or other-client credential reuse.
