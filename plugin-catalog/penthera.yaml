description: "Offline, rule-based security checks run through the terminal: a repo scan, dependency capabilities, a passive scan of a URL you own, and an audit of your AI agent config (skills, MCP servers, hooks, permissions). A skill only: no tools, hooks, middleware or MCP server. It runs the pinned penthera npm package with npx, which downloads that package on first use (Node.js 22 or later). Rules decide every finding; a model never does. No telemetry, no stored credentials, no background process, no self-updater. Disclosure — the skill runs the third-party `penthera` npm CLI pinned at 2.4.0 through `npx -y`, which downloads it from the npm registry on first use and runs it on the host outside Hermes' sandbox; it reads repo files and local agent configs (`~/.claude`, `~/.cursor`, `.mcp.json`), makes passive requests to URLs the user names, and, when the user approves, edits code on a local branch or installs a `.git/hooks/pre-commit` hook."
