known_issues:
  - "Turns counts completed turns, so one long turn can show `Turns 0` beside a high `LLM calls` (an agent loop is many calls, one turn). `LLM calls` and `Agent steps*` count per call."
  - "The status-bar chip appears after one desktop restart, because the desktop half is materialised into `<HERMES_HOME>/desktop-plugins/` at app startup. The backend half (hooks, history, REST) is live as soon as the plugin is enabled."
  - "Verified by hand on Windows with a packaged Hermes Desktop build. Linux and macOS run the same code and the same plugin directories, but were not exercised on those platforms."
  - "If `dashboard.turn_isolation` runs turns in a compute-host child process, the child keeps its own in-memory counters: live events still reach the desktop, but `/snapshot` in the parent will not include them. History is on shared disk, so `/history` stays complete."
  - "TTFT needs `first_chunk_at`; providers or non-streaming paths that do not report it show a dash for those calls instead of an invented sample."
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_api_request
    - post_api_request
    - api_request_error
    - post_llm_call
    - post_tool_call
    - on_session_start
    - on_session_end
    - on_session_finalize
    - on_session_delete
  provides_middleware: []
  requires_env: []
