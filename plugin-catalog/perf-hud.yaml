sha: bb97f8f73175a22b75f21204cf9fd4394f18077b
version: "1.0.0"
title: Perf HUD
description: "Live performance HUD for Hermes Desktop: a status-bar chip with core-compatible TPS (sum of output tokens over sum of API durations for the last 10 completed calls, the same window and arithmetic as Hermes' own status bar) in `tps`, `tps_ttft` or `calls` form, and a statistics popover with TPS, a separately labelled Session Avg TPS (the same ratio over every call in the session), median TTFT from `first_chunk_at`, LLM calls, an `Agent steps*` compatibility alias (equal to LLM calls, footnoted inside the snapshot by `agent_steps_note`), turns, errors, input, output and cache-read tokens, cache hit rate on Hermes' `cache_read / (cache_read + input)` buckets, tool calls and tool time, tool time share, wall-clock session duration, and the model and provider. Two controls — Reset current statistics (clears the plugin's own in-memory counters, never Hermes session state) and Clear history — plus local performance history for the last 50 sessions. Observes only: nine observer hooks, no tool or message is ever blocked, rewritten or reordered, no Hermes core file is touched, the aggregation layer is pure with no I/O and no host imports, all handlers are fail-open so a telemetry bug cannot break a turn, and a corrupt history file is quarantined instead of raised. Disclosure — reads only from the observer payloads: token usage buckets (input, output, cache read, cache write, reasoning), API and tool timings, first-chunk timestamps, model and provider names, session ids, and tool names plus error status for the counts; prompts, model responses, conversation contents, tool arguments and tool results are never read and have no field in its snapshot, its desktop event or its history record. Writes exactly one JSON file per profile at `<HERMES_HOME>/plugin-data/agent-plugin-perf-hud-*/history.json` containing only session_id, model, provider, started_at, updated_at, duration_ms, ttft_ms, tps_core, input_tokens, output_tokens, cache_hit_pct, tool_time_ms and llm_calls, allow-list enforced, atomic, capped at 50 sessions; no other disk writes, and no config change beyond the documented `plugins.entries.perf-hud.settings.*` keys (chip_enabled, chip_metric, history_enabled, history_max_sessions, poll_ms, broadcast_min_interval_ms). Desktop updates travel over Hermes' in-process plugin event bridge (`broadcast_plugin_event`, topic `plugin.perf-hud.stats.update`, throttled to 400 ms) and its REST routes are served by the user's own local dashboard at /api/plugins/perf-hud/ (snapshot, sessions, history, config, reset, clear-history, status), which requires the dashboard's auth ticket. Executes no subprocess, no shell command, no systemd unit, no Task Scheduler task; makes no network request; has no credentials, no OAuth and no telemetry. Standard library only, no third-party dependencies."
maintainer: g3org3yo
tier: community
