sha: 5fd7214000189784ee746b76251532a0cb19bce1
description: "Proof for speed-ups. When you ask Hermes to make code faster, Perf Lab times it before and after, fingerprints the output so a faster-but-wrong change is rejected, profiles Python with a flame graph, and enforces it with hooks: no code edits before a baseline, no finishing before a re-measure, and the plugin's own measured result appended under the reply. Disclosure — perf_bench and perf_profile run the command the agent passes on your machine, so every run first goes to Hermes' approval prompt (in any chat; \"always\" trusts one project folder; it fails closed and is skipped only when Hermes approvals are off); the command runs without a shell and with a minimal environment (PATH, HOME, locale, temp and interpreter/venv variables, no API keys), must be an interpreter running a script, and inline code is refused, but an approved script runs with your permissions as it would in the terminal. In chats about speed, its hooks add a short rules note to the turn, block write_file/patch on code files until a baseline exists (at most twice per file), ask for one re-measure if code changed, and append a clearly labelled Perf Lab section under the reply without rewriting the agent's text; a Gatekeeper switch in the pane turns the hooks off. It stores commands, timings, output fingerprints, the first 200 KB of each run's stdout, profiles and per-chat state under plugin-data/perf-lab, makes no network calls and sends no telemetry."
maintainer: Murali-lns
