description: "Per-control permissions for the computer_use tool. In a native panel you preview the target window privately, click any control and set it to Allow, Read only, Ask first or Hide. The backend enforces the choice before every input and before a screenshot or accessibility tree reaches the model: read-only controls refuse clicks, typing and value changes; ask-first operations wait for a one-time human approval of the exact action and arguments; hidden controls are removed from the tree and their pixels masked, and a capture that cannot be masked reliably is refused. New profiles start paused with unknown controls set to Ask first. Select it with computer_use.backend: permission-canvas; adds the /pc-canvas and /pc-approve commands. Validated on Windows with cua-driver 0.21 and 0.39. Disclosure — launches cua-driver (telemetry disabled) and a bounded Windows accessibility helper as local subprocesses while the backend runs, reads the selected window's pixels and accessibility data, stores policy, approval records, an audit log and the latest redacted capture in its own data directory, and opens a local Tkinter panel on /pc-canvas; no network calls, no credentials, no telemetry. Protects only actions routed through this backend; it is not an OS sandbox."
