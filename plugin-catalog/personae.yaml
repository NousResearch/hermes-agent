# Personae — Hermes Desktop plugin (community catalog entry).
#
# `sha:` is the release: a commit carrying the desktop/ layout, the root
# plugin.yaml and the desktop/plugin.js this entry describes. A re-pin bumps
# `sha` and `version` together in a new PR; the image URLs below are pinned to
# the same sha, so they move with it.
name: personae
repo: https://github.com/SmoothMarx/personae
sha: 7a3e9b063c198163d1a681a9ccdf86a6120e57c2
description: "A messenger-style roster for Hermes Desktop: one row per profile with its live sessions, per-profile colour, status lights, search, groups, multi-select whose row menu acts on the whole selection, and an Apropos beta that starts a new session already knowing the ones you picked. A chat this pane opens starts with the profile's own face instead of a blank screen. Disclosure — a Desktop pane over all your local profiles: it reads each profile's sessions, cron jobs and settings through the app's own requests and, only when you click, creates, deletes or archives sessions (deletes ask first), changes cron jobs or edits profile settings; Apropos starts a new session with a hidden pointer message naming the sessions you picked; no network calls or telemetry."
maintainer: SmoothMarx
tier: community
category: desktop
version: "1.8.15"
# The capture is the app window at 1916x1008 (1.90:1) — the window's own aspect
# ratio, kept uncropped rather than padded to 2:1, and the same file the README
# embeds, so card, docs page and README cannot drift apart.
image: https://raw.githubusercontent.com/SmoothMarx/personae/7a3e9b063c198163d1a681a9ccdf86a6120e57c2/assets/personae-pane.png
screenshots:
  - https://raw.githubusercontent.com/SmoothMarx/personae/7a3e9b063c198163d1a681a9ccdf86a6120e57c2/assets/personae-pane.png
platforms: [linux, macos, windows]
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
requires_hermes: ">=0.21.6"
