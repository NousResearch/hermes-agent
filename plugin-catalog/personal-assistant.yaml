image: https://raw.githubusercontent.com/100yenadmin/hermes-personal-assistant/1329f7fcafe16bb1cfd96582494c20c180ea9dc4/docs/media/banner.jpg
screenshots: []
readme: true
platforms: [linux, macos]
known_issues:
  - "Calendar sync reads the profile's google_token.json from Hermes's Google Workspace sign-in instead of a plugin-declared OAuth client; moving it is tracked in 100yenadmin/hermes-personal-assistant#74."
  - "The Browserbase cloud-browser lane needs agent-browser on PATH and Browserbase keys that Hermes passes to terminal children (#25, #39); local Chromium works without them."
  - "pa_delivery_ack registers only when conversation delivery is enabled, so hermes plugins validate warns that it is declared but not registered."
capabilities:
  provides_tools:
    - pa
    - pa_call
    - pa_delivery_ack
  provides_hooks:
    - pre_tool_call
    - pre_llm_call
  provides_middleware: []
  requires_env: []
