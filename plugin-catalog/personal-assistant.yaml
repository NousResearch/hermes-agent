readme: true
platforms: [linux, macos]
known_issues:
  - "The Browserbase cloud-browser lane needs agent-browser on PATH (100yenadmin/hermes-personal-assistant#39) and BROWSERBASE_API_KEY and BROWSERBASE_PROJECT_ID in the profile's secrets; local Chromium works without them."
  - "pa_delivery_ack registers only when conversation delivery is enabled, so hermes plugins validate warns that it is declared but not registered."
capabilities:
  provides_tools:
    - pa
    - pa_call
    - pa_delivery_ack
  provides_hooks:
    - pre_tool_call
    - pre_llm_call
  provides_middleware: []
  requires_env: []
