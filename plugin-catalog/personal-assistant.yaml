name: personal-assistant
title: Personal Assistant
repo: https://github.com/100yenadmin/hermes-personal-assistant
sha: 1329f7fcafe16bb1cfd96582494c20c180ea9dc4
description: "A remote personal assistant for your agent: it does the errands up to the final page and stops at your yes. It interviews you once (\"grill me\": eight short sittings on your business, people, decision rights, preferences and calendar rules), remembers corrections, people, SOPs and trust levels in a local ledger, and never asks the same thing twice. Travel and errands on real sites in English, Japanese and Korean: restaurant tables (TableCheck, Tabelog, OpenTable, Catch Table), hotels and flights on Trip.com, taxis, food and konbini delivery, with sourced prices, an approval packet for each action and an honest handoff at a sign-in, OTP or app-only wall. Optional Chief of Staff mode adds a daily plan, a weekly closeout and a radar. Adds the pa and pa_call tools, the /pa command and 40 skills. Disclosure — Keeps its records in a SQLite ledger in your profile (state/travel-ledger/travel.sqlite): trips, prepared actions, setup answers and the chat setup runs in, preferences, people, SOPs, trust levels, call cards and transcripts, task evidence, receipts and the bound Google account; its shell ledger helper, which skills run for payment-readiness and connectivity records, also stores browser checkpoints (page URLs, session ids), budgets and which providers hold a card. Optional features add a delivery packet queue (full packets, including priority-mail excerpts, never pruned), Daily Ops config and state, and a client index (names, emails, domains). Owner-memory and evidence records refuse recognised card numbers and credentials, records written through pa pass a lighter pattern filter, helper and approval records are kept as given, and nothing is deleted automatically. After you approve a setup review or a Chief of Staff closeout it writes USER.md, a marked PA section of SOUL.md, an operating-manual skill (or an edit of your existing one) and any context file you name, holding your approved business, people, spending-limit and approver answers as plain text, and pins the manual with hermes curator pin; a trip export writes Trip.ics and Trip-Reference.md to a folder you choose; /pa mode writes the plugin's mode setting. A pre_tool_call hook sees every tool call and blocks only tools covered by a PA exact-action approval or its deny list, plus most tools while the ledger is unreadable; a pre_llm_call hook adds short notes to your own turns (setup offer and routing, and on a session's first turn, including another person's first turn in a shared chat, your preferences and people not yet in your files) and records which chat setup runs in. With your consent during /pa setup the agent reads USER.md, SOUL.md, its memory, the calendar, past itineraries, a context file you name and up to 20 recent sent emails (PA stores no raw mail); mail work you ask for reads messages and attachments and can write drafts (sending needs your yes); during a provider sign-in it may read your connected email or SMS for a link or code; accepted Chief of Staff jobs run scheduled turns that read PA's ledger and your USER.md or manual, may read your calendar and inbox, and search the web for your radar topics. The agent may add minimal private trip events to your calendar without asking each time, creates Kanban tasks for open commitments, and with your approval may adapt an existing brief cron job. Errands drive Hermes's browser tools on provider sites (Trip.com by default for flights and hotels, then airline or hotel sites or local sellers; reservation platforms, maps and guides for restaurants; another regional domain if blocked), in the local browser, agent-browser on Browserbase or another attended browser you configured, and provider sign-ins you give in chat are saved in the agent's credential lane and browser profile. What the agent reads and writes goes to your configured model provider as part of the conversation. Other network calls happen only when you ask or opt in: Browserbase (api.browserbase.com) with your BROWSERBASE_API_KEY and BROWSERBASE_PROJECT_ID, recording off for sessions PA creates, sessions kept alive up to 20 minutes, connect and live-view links visible to the model; Google Calendar, where calendar_bind and calendar_sync create and update PA's own events (at the calendar's default visibility, with hidden markers including your local profile path) in the one calendar you bind and Daily Ops reads, using the profile's google_token.json from Hermes's Google Workspace sign-in, read and refreshed in memory, never written (#74); the gog CLI if you choose it (gog auth add stores gog's own credentials); parallel research subagents for SIM comparisons; Open-Meteo for an accepted trip watch; ElevenLabs read-only from the manual phone_poll command; and opt-in Daily Ops (gog mail reads and calendar reads through the profile's Google token or gog, with selected mail and calendar items sent to your model provider and email addresses aliased by pattern; Nominatim and OSRM through curl after geo consent; Stripe and Supabase CLIs after consent). Background work only after a yes: an accepted trip watch arms a HeartBeat 2.0 watcher that, once you allowlist it, runs a local PA script every 15 minutes for at most 14 days, and its notices wake an agent turn (a flight change may look up rebooking options, never book), plus optional check-in and arrival wakes; opt-in conversation delivery injects packets into one verified Telegram session as agent turns, with priority-mail excerpts not aliased; opt-in Daily Ops routines and an optional watchdog on the schedule you accept (every 20 minutes or less when leave-by alerts are on); accepted routine suggestions run a local precheck every 5 minutes (scripts stay in the profile's scripts/ folder); approved Chief of Staff follow-up wakes. The maintenance script reinstall_pinned.py keeps never-pruned package backups; the version probe is read-only; developer eval scripts call model providers only when run by hand. PA's skills stop bookings, payments, reservations, orders and cancellations at the final page for your explicit yes, and its pre_tool_call gate enforces exact-action approval for actions a PA workflow has scoped; nothing dials a phone. No telemetry. Full list: the README's \"What it touches\"."
maintainer: 100yenadmin
tier: community
category: automation
requires_hermes: ">=0.21.1"
docs_url: https://github.com/100yenadmin/hermes-personal-assistant#readme
