name: phoenix
title: "Phoenix - The Exactly-Once Trust Layer for Autonomous Agents"
repo: https://github.com/Ratz00007/phoenix
sha: fc43551ce842ec115cd573f5fcbeb015b335110e
description: "Visual flight recorder, deterministic SHA-256 state fingerprinting, idempotency replay guard, and forward zero-LLM crash recovery with deterministic fault-injection wind tunnel for Hermes agents. Guarantees exactly-once tool execution across crashes with zero duplicate writes and zero LLM calls in recovery. Disclosure — journals every tool call's arguments and result (common secret patterns redacted) to a local SQLite ledger under the plugin data dir, kept 7 days / 10,000 rows; the owner-typed /recover re-runs interrupted tool calls from earlier sessions through the tool registry, bypassing other plugins' pre_tool_call hooks, and the opt-in idempotency guard can return a stored result instead of re-running a repeated call in the same session."
maintainer: Ratz00007
tier: community
category: tools
requires_hermes: ">=0.21.6"
version: "0.3.1"
capabilities:
  provides_tools:
    - phoenix_ledger
    - phoenix_windtunnel
  provides_hooks: []
  provides_middleware:
    - tool_execution
  requires_env: []