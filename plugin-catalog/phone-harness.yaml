sha: 7e3ea6cff1377db4d4f37e852c59493120aa52b6
subdir: integrations/hermes
title: Phone Harness
description: "Drive a real phone from Hermes with one phone_exec tool: an iPhone via iPhone Mirroring on a Mac, an Android over adb, or a cloud phone from Phone Harness Cloud. Disclosure — runs model-written Python locally through the phone-harness package (every phone_exec call goes to Hermes's approval prompt by default; heuristic classifier auto-run for phone-only scripts is opt-in); taps and types into your real phone and its accounts; writes screenshots to the system temp folder; a cloud phone streams its screen to Phone Harness Cloud, bills by the minute, and uses phone-harness's own cloud sign-in; the classifier is a heuristic, not a sandbox; API keys, tokens and secrets are stripped from the script's environment; telemetry is off for Hermes runs unless you opt in with phone-harness config set telemetry true."
maintainer: ShawnPana
tier: community
category: tools
version: "0.1.0"
requires_hermes: ">=0.21.6"
docs_url: https://github.com/ShawnPana/phone-harness/tree/main/integrations/hermes#readme
capabilities:
  provides_tools:
  - phone_exec
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env: []
