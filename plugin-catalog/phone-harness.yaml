subdir: integrations/hermes
title: Phone Harness
description: "Drive a real phone from Hermes with one phone_exec tool: an iPhone via iPhone Mirroring on a Mac, an Android over adb, or a cloud phone from Phone Harness Cloud. Disclosure — runs model-written Python on this computer with your user's permissions through the phone-harness package (installed from PyPI); every phone_exec call goes to Hermes's approval prompt unless you opt in to classifier auto-run, a heuristic, bypassable check that decides which scripts ask first; taps and types into your real phone and its apps and accounts; screenshots go to the system temp folder and are attached to the tool result for vision models; a cloud phone streams its screen to Phone Harness Cloud and uses phone-harness's own cloud sign-in (~/.config/phone-harness/auth.json); a cloud Android bills by the minute, and a cloud iPhone is a per-phone subscription; telemetry is off unless you opt in."
maintainer: ShawnPana
tier: community
category: tools
version: "0.1.0"
requires_hermes: ">=0.21.6"
docs_url: https://github.com/phone-harness/phone-harness/tree/main/integrations/hermes#readme
