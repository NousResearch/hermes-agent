title: Phone Harness
description: "Drive a real phone from Hermes with one phone_exec tool: an iPhone via iPhone Mirroring on a Mac, an Android over adb, or a cloud phone from Phone Harness Cloud. Disclosure — runs model-written Python locally through the phone-harness package (scripts that import beyond phone helpers and data modules, call open/exec/eval, or run adb shell go to Hermes's approval prompt first); taps and types into your real phone and its accounts; writes screenshots to the system temp folder; a cloud phone streams its screen to Phone Harness Cloud, bills by the minute, and uses phone-harness's own cloud sign-in."
