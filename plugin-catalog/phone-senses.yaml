subdir: plugin
title: Phone Senses
description: "Give Hermes your own Android phone's senses through Termux:API: notification and SMS digests, sending SMS from your SIM, a bank and UPI money tracker with bill, subscription and delivery tracking, scam SMS warnings, a scam-in-progress tripwire (unsaved caller + screen-sharing app + OTP or debit, spoken warning on the phone), low-battery alerts and find my phone. Disclosure — needs the separately installed Termux and Termux:API apps (F-Droid) and runs the repo's own stdlib-only helper on the phone, which executes fixed termux-* commands (no shell) and serves an HMAC-signed HTTP API on the address you choose (plain HTTP: replies with SMS, contacts and location are unencrypted on that network, so use Tailscale or a trusted Wi-Fi); the plugin talks only to that helper; reads notifications, SMS, call log, contacts, clipboard, location and battery and returns them to the model; can ring the phone, speak, post notifications and set the clipboard without asking; sending SMS, calls, photos and OTP reveal always go to Hermes's approval prompt (OTP reveal is also off until you enable it); OTPs are masked by default; parsed transactions (no message text), budgets, watch rules and approved photos are stored in the plugin's data directory; no telemetry."
