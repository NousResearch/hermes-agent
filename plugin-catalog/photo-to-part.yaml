name: photo-to-part
title: Photo to Part
repo: https://github.com/mojomast/hermes-photo-to-part
sha: d924991f56ad4cf7b94e33f2ac5dcb6cf24fac5f
subdir: plugin
description: >-
  Skill id photo-to-part:photo-to-printable-part. Pass that exact string
  only to skill_view. Do not pass it to skills_list, and do not add a
  plugin: prefix or a slash. Turn photos, a few
  measurements, or a messy scan into a parametric printable part and check
  the mesh locally. Tools read and write only the paths you pass (STL, 3MF,
  PNG, JSON). No credentials and no printer connection. Enabling the plugin
  installs its Python packages from PyPI after Hermes dependency consent.
  A STEP solid needs CadQuery or build123d in the project environment; that
  install downloads packages and can take several minutes. Chat photos still
  go to your model provider.
  A user-stated millimetre value is not replaced by a photo measurement.
  Hermes --yolo auto-approves a build prompt; this plugin does not block that flag.
  Hermes Desktop 0.23 or newer can show an optional Part studio pane while a
  run is in progress. The six tools still install and run when that pane is unavailable.
