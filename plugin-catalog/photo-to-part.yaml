version: "0.1.14"
description: >-
  Skill id photo-to-part:photo-to-printable-part. Turn photos, a few
  measurements, or a messy scan into a parametric printable part and check
  the mesh locally. Tools read and write only the paths you pass (STL, 3MF,
  PNG, JSON). No credentials and no printer connection. Enabling the plugin
  installs its Python packages from PyPI after Hermes dependency consent.
  A STEP solid needs CadQuery or build123d in the project environment; that
  install downloads packages and can take several minutes. Chat photos still
  go to your model provider.
