name: physis
repo: https://github.com/ilPez00/hermes-physis
sha: 9f67992dbcd36f4da0379f660baa832609b60699
version: "1.6.0"
description: "Evidence-backed execution memory: per-repo graph context, a deterministic verify hook, and verified tool recipes that replay with zero provider calls and refuse when their inputs changed. Sessions that pass their check become approvable workflow candidates. Two bundled offline engines, no API key, no network, no Python dependencies."
maintainer: ilPez00
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/ilPez00/hermes-physis#readme
image: https://raw.githubusercontent.com/ilPez00/hermes-physis/9f67992dbcd36f4da0379f660baa832609b60699/assets/banner.png
readme: true
capabilities:
  provides_tools:
    - physis_engine_status
    - physis_trace
    - physis_observe
    - physis_snapshot
    - physis_context
    - physis_query
    - physis_why
    - physis_diff
    - physis_classify
    - physis_chain
    - physis_grid
    - physis_ingest
    - physis_observed
    - physis_command
    - replant_run
    - replant_record
    - replant_stats
    - replant_demo
    - replant_show
    - physis_candidates
  provides_hooks:
    - post_tool_call
    - pre_verify
    - pre_llm_call
  provides_middleware: []
  requires_env: []
