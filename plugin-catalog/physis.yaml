name: physis
repo: https://github.com/ilPez00/hermes-physis
sha: 330e795b92544ff8d7ca9ab3d099d943dbc2185c
version: "1.7.1"
description: "Offline evidence-backed execution memory: per-repo graph context, a deterministic verify hook, and verified tool recipes that replay with zero provider calls and refuse when their tools, registry or captured files changed. Two bundled Linux engines and no API key or model download; approved host commands still run with host privileges and Python entry points need an interpreter, and untracked dependencies are not replay-checked. Operator-only approval and replay; the model cannot set executable paths or trigger raw commands. Disclosure — Ships two compiled Linux x86_64 engines (bin/physis-core, bin/replant) built and attested by the repo's own GitHub workflow; operator-approved replay commands and the operator's verify_cmd run as shell commands with the user's file and network access; physis_ingest can read shell history, ~/.claude/projects transcripts, every process's command line and the browser history database only when the operator enables those sources in plugins.entries.physis.settings.ingest_sources (off by default)."
maintainer: ilPez00
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/ilPez00/hermes-physis#readme
image: https://raw.githubusercontent.com/ilPez00/hermes-physis/330e795b92544ff8d7ca9ab3d099d943dbc2185c/assets/banner.png
readme: true
platforms: [linux]
# Compiled engines shipped at the pin. Each carries a GitHub build-provenance
# attestation from this repo's own workflow, tied to the pinned source digest;
# the catalog CI verifies them before the payload scan (README rule 17).
attested_binaries:
  - bin/physis-core
  - bin/replant
known_issues:
  - "Replay freshness is partial: only captured files up to 1 MiB are fingerprinted, so a dependency outside that set can change and replay will still proceed. The check that matters is the tool registry and engine digest; the captured-file set is a floor, not a proof of sameness."
  - "Operator-approved commands execute with host privileges. Approval is a boundary on what the model may ask for, not a sandbox: an approved command can read any file the user can read and can reach the network."
  - "Python entry points need a Python interpreter (standard library only). The two bundled engines are native ELF binaries; no interpreter is needed for them."
  - "Bundled binaries are Linux x86_64 only."
capabilities:
  provides_tools:
    - physis_engine_status
    - physis_trace
    - physis_observe
    - physis_snapshot
    - physis_context
    - physis_query
    - physis_why
    - physis_diff
    - physis_classify
    - physis_chain
    - physis_grid
    - physis_ingest
    - physis_observed
    - replant_demo
    - replant_show
    - replant_stats
    - physis_candidates
  provides_hooks:
    - post_tool_call
    - pre_verify
    - pre_llm_call
  provides_middleware: []
  requires_env: []
