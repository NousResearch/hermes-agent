sha: 14a07d0d6b1d6d707926f1ad02cf79ca573349ee
title: Pickwise Photos
description: >-
  A correction tool, not an art critic: culls a folder of photos locally. Flags blurry and
  unrecoverable shots, labels what an edit could rescue, keeps the best frame of every burst
  and explains every decision. Follows a brief in your own words ("concert, dark is fine,
  best 30", "moody low-key shots") and learns gradually from your corrections. Treats RAW+JPEG
  pairs as one photo, handles folders of thousands of photos in resumable steps, and reads
  JPEG, HEIC and camera or iPhone RAW (DNG, ARW, CR3, NEF and more) through their embedded
  previews, using only Pillow and pillow-heif. On request it makes local previews so Hermes
  can take a visual second look for closed eyes, a blurred subject or clear composition
  mistakes. Disclosure — reads only the folder you name; writes nothing until you confirm a
  dry run, then only a Pickwise/ subfolder (copy, refused if the disk is too full, or
  reversible move) or .xmp rating sidecars that never replace existing ones; never deletes or
  edits photos; stores per-photo measurements, recent reviews and reports, learned preferences
  and (only when asked) downsized previews in its plugin data folder; no network calls, no
  model calls, no shell commands, no telemetry. A visual check sends the chosen previews to
  the model provider through Hermes' own vision tool, only when the user asks.
maintainer: ardianreffa
tier: community
category: tools
requires_hermes: ">=0.23.0"
