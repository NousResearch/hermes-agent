name: pickwise-photos
repo: https://github.com/ardianreffa/pickwise-photos
sha: 7a5967de35d2d54baf04ff2d551109b02d89d722
title: Pickwise Photos
description: >-
  Pick your best photos, with reasons. Culls a folder of photos locally: flags blurry,
  too-dark and blown-out shots, groups bursts and keeps the best frame of each, and explains
  every decision in plain language. Follows a brief in your own words ("concert, dark is
  fine, best 30") and learns gradually from your corrections. Reads JPEG, HEIC and camera or
  iPhone RAW (DNG, CR3, NEF, ARW and more) through their embedded previews, using only Pillow
  and pillow-heif. Disclosure — reads only the folder you name; writes nothing until you
  confirm a dry run, then only a Pickwise/ subfolder (copy or reversible move) or .xmp rating
  sidecars that never replace existing ones; never deletes or edits photos; stores per-photo
  measurements, reports and learned preferences in its plugin data folder; no network calls,
  no model calls, no shell commands, no telemetry.
maintainer: ardianreffa
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/ardianreffa/pickwise-photos#readme
version: "0.1.3"
platforms: []
capabilities:
  provides_tools:
    - pickwise_review
    - pickwise_apply
    - pickwise_feedback
    - pickwise_preferences
    - pickwise_undo
  provides_hooks: []
  provides_middleware: []
  requires_env: []
