title: Pidgeon
description: 'Email for Hermes through Pidgeon: mail to your agent''s own address starts a conversation,
  one per email thread, and the agent''s answer goes back as a reply in that thread. The agent reads
  Pidgeon Firewall''s clean text, mail flagged as prompt injection is held before it reaches the agent,
  and the agent can only reply, never write to a new recipient. Standard library only.'
