sha: db6da4952cdfb56a2b839856e3efc259885d9f18
title: Pilot
description: "Give Hermes a real interactive terminal. Pilot runs commands inside a private tmux server, so the agent can drive programs that need a TTY — ssh logins, vim/nano, htop/btop, fzf, less, package installers, ncurses menus and REPLs — by typing literal text and named keys and reading the pane back as plain text, with sessions that persist across tool calls. A human can attach to the same pane at any time and take over. Disclosure — starts a private tmux server (tmux -L hermes-pilot) as the local user and runs model-requested commands inside it; the captured terminal text, including anything a remote program prints, enters the model's context; no network calls of its own, no credentials stored, and it never touches the user's own tmux sessions."
maintainer: LangerSword
tier: community
category: tools
