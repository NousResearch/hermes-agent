description: "Fetch web pages for the built-in web_extract tool through the Piloterr web scraping API, with optional JavaScript rendering or anti-bot unblocking. Extract only; pair it with a search backend for web_search. Disclosure — sends each URL to api.piloterr.com with your PILOTERR_API_KEY, and calls can use Piloterr credits. Reads the key only through Hermes's secret scope. Registers no tools, no hooks or middleware, writes no files, starts no processes, has no telemetry or self-updater, and uses only the Python standard library."
maintainer: piloterr
