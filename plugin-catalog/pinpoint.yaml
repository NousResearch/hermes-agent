readme: true
platforms: [windows, macos, linux]
known_issues:
  - "Both halves must be enabled: `hermes plugins enable pinpoint` and Desktop > Capabilities > Plugins > Pinpoint."
  - "The consent dialog is owned by Desktop; its text cannot be customised."
  - "Pin clicks and page changes reach the agent by polling every 0.5-1 s (no page-to-plugin push exists)."
  - "Focus-indicator rule is a static CSSOM heuristic; cross-origin stylesheets and iframes and closed shadow roots are not scanned."
  - "Only tested on Windows 11 with Hermes 0.22.7; macOS and Linux untested."
capabilities:
  provides_tools:
    - pinpoint_audit
    - pinpoint_pins
