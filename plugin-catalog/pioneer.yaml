description: An inverted search for your own work. Pioneer reads your project folder, Hermes memory and recent chats, then looks for what does not exist yet and should. Your own model writes the gaps. Code checks every citation, runs an absence check against existing tools, and scores need, originality, counterfactual value, value and durability. When an existing tool already does the job, the board says so and names it. Rounds expand into a trail, shown on a Desktop page and pane.
