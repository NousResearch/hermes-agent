description: "See Pique Signal's Solana memecoin board right inside Hermes. Press Deep Check on any coin on the board and Hermes checks it for you: fake volume, the live price, and what people say on X. Open a live chart, ask Hermes about any coin on it, or listen to a short spoken board update. The free board needs no account; a paid member key adds the live member board. Research only, not financial advice. Nothing trades. Disclosure — Crypto research only (Solana memecoins; nothing trades, signs or touches a wallet). The board, member board (with your optional member key, sent only to piquesignal.xyz) and the Missed / Free Pick / banners / history feeds come from piquesignal.xyz. Coin pictures come from cdn.dexscreener.com. A Deep Check you ask for sends the coin's contract address to api.dexscreener.com and, through Hermes' x_search, to xAI (your xAI key or Grok sign-in). Opening a chart sends the pool address and the coin's contract address to api.geckoterminal.com. Board talk sends board facts to your own Hermes model and text-to-speech provider. To decide when member data may appear, the plugin reads your local Hermes session history and cron job definitions read-only. It also uses private Hermes internals (text-to-speech tool, cron delivery resolver) that may break on a Hermes update."
