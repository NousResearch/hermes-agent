description: "Gamified headquarters for a Hermes bot fleet: a pixel office with one sprite per profile (XP, levels and HP from a quality-review ledger), a live board of what every bot is doing right now (current step, last tool call, tokens/cost, sub-agents, Kanban heartbeats), a leaderboard, a blocked-card triage across all Kanban boards with Answer & unblock / Retry / Comment / Archive and a 'triage run' that opens a chat with your orchestrator profile, plus a GPU/LLM reactor panel. Disclosure — reads every profile's state.db and the Kanban databases read-only, the quality ledger and `hermes profile list`; network only to the Prometheus / model endpoints you configure (none by default); writes only on a confirmed click and only through `hermes kanban comment|unblock|archive` (workspace backed up before archive, audit log in the plugin's var/); the triage button creates a chat session and submits a prompt containing card ids only; no telemetry, no self-update, no credentials."
