description: "Gamified headquarters for a Hermes bot fleet: a pixel office with one sprite per profile (XP, levels and HP from a quality-review ledger), a live board of what every bot is doing right now (current step, last tool call, tokens/cost, sub-agents, Kanban heartbeats), a leaderboard, a blocked-card triage across all Kanban boards with Answer & unblock / Retry / Comment / Archive and a 'triage run' that opens a chat with your orchestrator profile, plus a GPU/LLM reactor panel. Disclosure — reads every profile's state.db read-only (session titles, current step, tokens/cost and the last tool call with its first argument, e.g. a terminal command or path, clipped to 160 characters), every Kanban board database read-only, the quality ledger and `hermes profile list`; network only to the Prometheus / model endpoints you configure (none by default); writes only from your clicks in its page and only through `hermes kanban comment|unblock|archive` (unblock/retry/archive need a second confirming click; the workspace is backed up into the plugin's var/ before archive; audit log in var/actions.jsonl); the triage button opens a chat with your orchestrator profile and submits a prompt with card ids only, and that agent then reads card text (untrusted) via the plugin's blockers.py; no telemetry, no self-update, no credentials."
