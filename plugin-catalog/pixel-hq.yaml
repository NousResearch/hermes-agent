description: "Gamified headquarters for a Hermes bot fleet: a pixel office with one sprite per profile; XP, levels and HP are scored automatically from Kanban outcomes (completed, changes requested, gave up, timed out, hallucinated references) plus optional pass/revise/fail reviews you give from the UI or that an orchestrator records with the `pixelhq_review` tool; a live board of what every bot is doing right now (current step, last tool call, tokens/cost, sub-agents, Kanban heartbeats), a leaderboard, a blocked-card triage across all Kanban boards with Answer & unblock / Retry / Comment / Archive and a 'triage run' that opens a chat with your orchestrator profile, plus a GPU/LLM reactor panel. Works on a fresh installation: the roster is generated from your profiles and settings live in the Desktop app. Disclosure — reads every profile's config.yaml (model name) and state.db read-only (session titles, current step, tokens/cost and the last tool call with its first argument, e.g. a terminal command or path, clipped to 160 characters), every Kanban board database read-only, and the reviews ledger (plugin-data/pixel-hq/reviews.jsonl, plus an optional legacy ledger path you configure); no shell commands for reading; network only to the Prometheus / model endpoints you configure (none by default); writes only the reviews JSONL under plugin-data when you rate a session or bot (or when an agent calls `pixelhq_review`), and Kanban changes only from your clicks in its page and only through `hermes kanban comment|unblock|archive` (unblock/retry/archive need a second confirming click; the workspace is backed up into the plugin's var/ before archive; audit log in var/actions.jsonl); the triage button opens a chat with your orchestrator profile and submits a prompt with card ids only, and that agent then reads card text (untrusted) via the plugin's blockers.py; no telemetry, no self-update, no credentials."
