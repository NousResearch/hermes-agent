description: "Gives the agent the real design of any public website through plagio's hosted MCP server (Streamable HTTP at https://plagio.dev/mcp, OAuth sign-in, no keys in config): capture one component or a whole page as a specification to rebuild from, read a site's brand tokens and animations, find references from a curated library, and read what the user saved with the plagio browser extension. Bundles one skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to plagio.dev under the user's account, which needs a paid plan after a 7-day free week and counts credits. All seven tools are read-only. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
