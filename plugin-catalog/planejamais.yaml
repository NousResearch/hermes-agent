title: Planeja+
description: "Review and update strategic plans (perspectives, objectives, initiatives, steps), Kanban boards, tasks and checklists, events, meetings, reports and support tickets in Planeja+ through its official hosted MCP server (Streamable HTTP at https://planejamais.planejareconsultoria.com.br/api/mcp, OAuth 2.1 sign-in with DCR and PKCE, no keys), with the planejamais workflow skill bundled. Portable Agent Plugins v1 package (mcp.json + skills/), no Python or executables; needs a Planeja+ account. Disclosure — the server exposes write and delete tools limited to the signed-in account's companies and role, invite_company_user e-mails an invitation and mentions notify members; the plugin marks its server untrusted, but the documented OAuth setup (`hermes mcp add planejamais`) replaces that entry with a native one at the default trust unless the user sets `mcp_servers.planejamais.trust: untrusted`; chats sharing a Hermes profile share the Planeja+ sign-in; the tool set is served by the remote MCP server at runtime and is not covered by the pinned sha; no telemetry."
