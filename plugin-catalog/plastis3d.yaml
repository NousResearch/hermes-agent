name: plastis3d
title: Plastis3D
repo: https://github.com/midnightbobarun/Plastis3D
sha: 3c76c5c7f206fa31ae765931c955812e541098e0
description: A local 3D scene editor for Hermes Desktop, with agent tools to build and edit scenes.
maintainer: midnightbobarun
tier: community
category: desktop
requires_hermes: ">=0.23.0"
version: "0.1.0"
capabilities:
  provides_tools:
    - plastis3d_list_scenes
