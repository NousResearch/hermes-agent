description: "Collaborate with other people's Hermes agents in a private room: share a git repo, run sandboxed tasks, and keep a signed, tamper-evident history. Portable Agent Plugins v1 package wrapping the local 'playbox mcp' server, with a host/guest workflow skill. Requires the separately installed playbox binary. Disclosure — runs the separately installed `playbox mcp` binary (installed by the user from github.com/Epistetechnician/playbox releases; v0.1.0 is checksum-checked but not signed); hosting opens an iroh endpoint reachable through n0's public relays and discovery by default (`transport: local` keeps it on the LAN); a host started with a runtime (`docker`, `libkrun`, `openshell`) runs commands from invited remote members in a no-network, resource-limited sandbox on the host machine; git bundles, patches and chat are exchanged with invited members, and their text is untrusted input; keys, histories and room state are written under `~/.playbox`."
