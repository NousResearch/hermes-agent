name: plugin_foundry
repo: https://github.com/julian-saint-work/hermes-plugin-foundry
sha: 56b56c0db5224a5c0fcb655e2f90318f2e74653d
description: 'Turn a narrow plugin request into a native Hermes plugin: manifest, entry point, tool, SQLite state, tests, static scan and catalog draft. Two archetypes (folder watcher and JSON API poller). Generated code is reviewed before install or catalog submission; nothing is auto-merged.'
maintainer: julian-saint-work
tier: community
category: automation
requires_hermes: ">=0.21.5"
version: "0.1.0"
docs_url: https://github.com/julian-saint-work/hermes-plugin-foundry
platforms: []
capabilities:
  provides_tools:
    - foundry_plan
    - foundry_build
    - foundry_test
    - foundry_list
    - foundry_catalog
  provides_hooks: []
  provides_middleware: []
  requires_env: []
