requires_hermes: ">=0.21.6"
platforms: [windows, linux]
capabilities:
  provides_tools: [pmp_inspect, pmp_prepare_handoff, pmp_verify_handoff, pmp_receive_handoff]
  provides_hooks: []
  provides_middleware: []
  requires_env: [PMP_BRIDGE_WORKSPACE]
