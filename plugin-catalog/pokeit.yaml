name: pokeit
title: PokeIt
repo: https://github.com/kbtbc/pokeit-hermes
sha: 990c4126db513d69292ce68d48aa756ad7852123
description: "Real-time Pokémon GO hunting inside Hermes, with a live Radar, nearby catches and raids, approved scans, and desktop alerts. Disclosure — hosted-only connector to the author's PokeIt service: each tool call sends coordinates, place text and filters to https://mcp.pokeit.cc (tool list served at runtime, not covered by the pin; request_scan starts a scan and goes through Hermes approval; the service keeps tool names, filters, timings and result counts about 14 days and scan coordinates 24 hours); on Desktop a gateway-side read proxy calls the same server's read tools and fetches species icons from https://pokeit.cc, the embedded map loads tiles from https://tile.openstreetmap.org (revealing the viewed area and IP), the last spot, radius and filter are saved locally per profile, and a user-started watch polls about once a minute for up to two hours while Hermes runs; no credentials, shell commands or self-update."
maintainer: kbtbc
tier: community
