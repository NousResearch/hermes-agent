platforms: []
known_issues:
  - Results come from PokeIt's own scanning network. They are not exhaustive and an observation can expire before you arrive.
  - The server runs separately from this repository and can change after you install; its tool list is served at runtime.
  - The Radar and desktop alerts need Hermes Desktop 0.23.0 or newer with the plugin enabled on the profile you chat in. CLI and messaging clients get the tools and the skill only.
  - After installing or updating, restart the Hermes gateway that serves your chat and open a new chat so the PokeIt tools load.
  - Desktop alerts need an area with ongoing scan coverage (https://pokeit.cc/coverage).
