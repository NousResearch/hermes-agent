## Checks run at the pin
`hermes plugins validate`: passed (server trust untrusted; security scan safe; desktop surface in the SDK). No binaries. Repository tests: 50 Desktop tests and 18 proxy tests pass; the final commit is documentation-only. Tested on Windows 11 with Hermes Desktop 0.23.1 against a Mac Studio gateway, and on the CLI.

## How to test
`hermes plugins install kbtbc/pokeit-hermes --enable`, restart Hermes, open a new chat and ask: "What's worth catching near the Georgia Aquarium in Atlanta?" On Desktop, open PokeIt Radar from the status bar and press the amber button.
