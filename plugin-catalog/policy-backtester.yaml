name: policy-backtester
title: Policy Backtester
repo: https://github.com/noviceadam666/policy-backtester
sha: afd35ac3cbd7012b09385e0d3b488431654c8c44
version: "0.4.0"
description: >-
  Backtest guardrail policies against your agents' real tool-call history, then shadow and enforce them.
  hermes backtest run replays a policy over every profile's past tool calls and reports what it would have
  caught and which completed cron or Kanban jobs it would have broken, and names any scheduled cron job with
  no completed run in the window instead of counting it as safe; suggest proposes exemptions pinned to the
  exact command each broken job ran, and to its working folder when every run shows one, without applying
  them; diff compares two versions; check tests one call, or a cases file of calls with expected actions for
  CI; shadow logs live decisions without changing anything; enforce blocks or hands the call to Hermes's
  approval gate, and refuses a policy that hasn't run in shadow, would break a job, or hasn't seen every
  scheduled job on the profile run. Disclosure: reads every profile's state.db, cron/jobs.json,
  cron/executions.db and Kanban board databases read-only (SQLite mode=ro); writes its own index
  (<root>/backtest/index.db, 0600) and, in profiles where you promote a policy, the policy copy,
  promotions.jsonl, decisions.jsonl and three plugin settings; the index and log keep tool names, arguments
  (file bodies replaced by a length) and result status, never result bodies. No network calls, no shell
  commands, no telemetry.
maintainer: noviceadam666
tier: community
category: tools
requires_hermes: ">=0.22.5"
docs_url: https://github.com/noviceadam666/policy-backtester/blob/afd35ac3cbd7012b09385e0d3b488431654c8c44/README.md
known_issues:
  - "Regex and glob rules see what a command says, not what it does: a clean backtest is evidence, not proof."
  - "Enforcement runs per profile: install it and promote a policy in each profile you guard."
  - "A backtest can't vouch for a scheduled job it never saw run; it names those jobs, and enforce waits for one completed run of each."
  - "The install scan reports caution: the shipped policies, tests and README quote the commands the plugin exists to catch."
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
