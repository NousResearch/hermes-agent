description: "Recall by Polign memory provider. A new statement replaces the old one, the old one stays in the history, and memory can be read as of any earlier time, so the agent sees the correction, not just the latest value. Memories in front of each turn, extraction after it, mirroring of MEMORY.md, and five memory tools. Local database under the profile by default, or a recall serve you run. Disclosure. Each turn is sent to the extraction model named in the profile (Anthropic or OpenAI key from .env, or a local Ollama model); with no model, text is kept as written and nothing leaves the machine. On first use the recall binary downloads polign-server from dl.polign.com and checks it against a SHA-256 built into the binary. Disclosure — each completed turn (up to 4,000 characters per message) and every built-in memory write is sent to the extraction model picked from the profile's Anthropic or OpenAI key (or a configured Ollama model; set extract_model to none to keep text local), or to the recall serve named by RECALL_URL; in the default local mode the polign-recall package's bundled recall binary downloads polign-server from dl.polign.com on first use (checked against a SHA-256 built into the binary) and starts it as a detached loopback server under $HERMES_HOME/recall that keeps running after Hermes exits."
