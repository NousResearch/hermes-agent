name: pollinations
repo: https://github.com/greythx/hermes-pollinations
sha: c0281f403b043405094f65821cd32a977e3f13c3
title: Pollinations
description: "Pollinations image generation and editing for image_generate. The model picker is read live from the Pollinations catalog, so models appear and disappear without a plugin update. No key is needed for the free classic model, which is watermarked, throttled to about one image per 45 seconds per IP, and capped at 768x768 pixels of area. A Pollinations key unlocks the Quest-eligible catalog with no watermark and no per-IP throttle; paid-only models stay hidden behind a default-off toggle. Disclosure: requests go to gen.pollinations.ai and image.pollinations.ai, prompts and reference images are sent to Pollinations, a local reference path may be any image file the user can read (accepted only after a magic-byte check), generated media is written under $HERMES_HOME/cache/generated/images/, and the model catalog and free-model list are cached under $HERMES_HOME/cache/. There is no telemetry, no shell access, no background processes and no self-updating."
maintainer: greythx
tier: community
category: tools
requires_hermes: ">=0.21.0"
version: "1.4.0"
docs_url: https://github.com/greythx/hermes-pollinations#readme
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - POLLINATIONS_API_KEY
