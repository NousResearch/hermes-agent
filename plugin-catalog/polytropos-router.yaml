description: "Model provider polytropos-router with one model, auto. For each turn a short classifier call picks the simple or the complex route, and the router tries that route's models in order. A local Ollama model only gets the turn when the machine has memory to spare and the request fits its context window, otherwise the turn goes to free cloud models through FreeLLMAPI. Set it up with the polytropos plugin. Disclosure — sends each turn to the upstreams in its config, which are FreeLLMAPI and Ollama on 127.0.0.1 by default (on Windows FreeLLMAPI's desktop app at the port it saved, 31415 by default), or any other OpenAI-compatible URL the user adds; the classifier sends up to 2,000 characters of the last user message to the classifier model, FreeLLMAPI's auto model by default, also when the turn then runs locally; asks the Ollama API for its version and loaded models and unloads a local model when memory runs low; reads memory pressure with sysctl on macOS, /proc on Linux or GlobalMemoryStatusEx on Windows; fetches stack-canary's public results from raw.githubusercontent.com at most once a day; traces are off by default and never hold message text; reads upstream keys through agent.secret_scope; no telemetry."
