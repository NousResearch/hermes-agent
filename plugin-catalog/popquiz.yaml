known_issues:
  - Tested on Linux (Ubuntu 26.04); macOS and Windows are not tested yet.
  - Phones must reach the host machine on the local network; guest Wi-Fi with client isolation blocks them.
  - Paid model players need Nous Portal credit; without it their answers are refused ($0) and the game still runs for the humans. The free preset needs no credit.
  - The Desktop pane was checked in headless Chromium with the same sandboxed frame, not yet inside the Desktop app.
capabilities:
