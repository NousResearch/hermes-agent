description: "Write a native post for each platform and publish or schedule it to LinkedIn, X, Threads, Bluesky, Facebook Pages, Instagram, TikTok, YouTube and Pinterest through their official APIs, via PostOnce's hosted MCP server (Streamable HTTP at https://postonce.to/mcp, OAuth sign-in, no keys in config). Bundles six skills: postonce, post-everywhere, content-calendar, analyze-my-posts, hook-vault and viral-formats. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: every tool call goes to PostOnce's hosted server (postonce.to) and acts on the user's PostOnce account; the tool set is served by that server at runtime and is not covered by the pinned sha. Published posts go out to the user's connected social accounts. The package marks the server untrusted, so Hermes asks before every tool the server does not mark read-only and refuses them in unattended runs."
