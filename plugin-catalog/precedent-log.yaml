description: "Saved board rulings in worker prompts, a syntactic block check, and a Desktop Rulings page with confirmed human retirement. Disclosure: local profile/board state and core board/task reads; enforce mode defaults on, advisory is configurable. Store writers supply trusted prompt text; write restrictions are cooperative. Python runtime has no network, shell, background processes, secret reads or stored credentials. Desktop polls bounded read-only RPC and sends explicitly confirmed retire commands over the host-managed gateway connection, possibly remote; no independent connection or model call. Opt-in demo harness only: subprocesses, loopback in fake mode, network to the user-selected provider in real mode; not plugin runtime."
maintainer: quotumorg
tier: community
category: memory
requires_hermes: ">=0.23.0"
version: "0.4.0"
