name: precedent-log
repo: https://github.com/quotumorg/precedent-log
sha: e23d1bd836ff8690ab9b73ac70bec4e3feba5b5e
description: "Saves a human's answer to a blocked Kanban question as a ruling for later workers. Shows rulings and vetoes in Desktop with confirmed retirement. Disclosure: reads core board/task data and writes local profile/board state; enforce is the default, advisory is configurable. Store writers supply trusted prompt text; write guards are cooperative. Python runtime has no network, shell, background processes, secret reads or stored credentials. Desktop uses host-routed gateway RPC, possibly remote, for bounded reads and confirmed retirement; no independent connection or model calls. Opt-in demo harness only: subprocesses, loopback in fake mode and provider network in real mode."
maintainer: quotumorg
tier: community
category: memory
requires_hermes: ">=0.23.0"
version: "0.4.1"
docs_url: https://github.com/quotumorg/precedent-log/blob/e23d1bd836ff8690ab9b73ac70bec4e3feba5b5e/README.md
image: https://raw.githubusercontent.com/quotumorg/precedent-log/e23d1bd836ff8690ab9b73ac70bec4e3feba5b5e/docs/catalog-1200x600.png
readme: true
platforms: [linux, macos]
known_issues:
  - "Four private board/execution-identity helpers require catalog rule 9 review; catalog/CORE-ISSUE.md is an unsubmitted request. No core overrides."
  - "In-process mode only; the host does not supply the tested execution context or CLI path."
  - "Default enforce mode can leave a no-edit worker's card running after veto (B2). Core recovery/retry settings apply; no deadline. Advisory avoids this veto path."
  - "Tested only on Hermes v0.23.0 at 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19; the floor does not establish later compatibility."
  - "Desktop catalog description, navigation, no-session guidance, status, page badges and confirmed retirement live-run verified with v0.4.1 in an isolated home with a fake model on Hermes source 2bd378ed, Desktop built from source; v0.4.0 also verified status click-through. Packaged Desktop app untested. Requires host UI/React, route/nav, focusedSessionOwner, profileRoutes, requestProfile and status-bar APIs."
capabilities:
  provides_tools: []
  provides_hooks: [pre_tool_call, kanban_task_blocked, pre_verify, post_tool_call, on_session_end]
  provides_middleware: []
  requires_env: []
# No catalog keys for commands/sections: slash ruling, rulings; CLI precedent;
