title: Precleared
description: "Checks cold email against the law before it goes out: when the agent sends an email with a send tool, one of Hermes's email skills (himalaya, agentmail, Google Workspace) or an email API call, Precleared checks each new recipient against UK PECR and UK GDPR, US CAN-SPAM, Canada's CASL and German, French, Australian, Irish and Dutch rules; anything not cleared goes to Hermes's approval prompt (or is refused in block mode) with the rule, its source and a signed receipt. Adds precleared_check and precleared_verify_receipt tools and a cold-email-check skill. Disclosure: sends each recipient's address, the sender country, address source, pitch and optional prospect country to precleared.dev (HTTPS) for the check; optional PRECLEARED_API_KEY read via get_secret and sent only in the Authorization header; caches verdicts under hashed addresses in plugin state for 30 days; no shell commands, background processes or telemetry; maintained by the operator of Precleared."
maintainer: gabrielaoimevbore-beep
tier: community
category: tools
requires_hermes: ">=0.22.2"
