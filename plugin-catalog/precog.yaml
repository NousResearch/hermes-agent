name: precog
repo: https://github.com/0xNomind/precog
sha: 7437314d3d96c6a61aea6a84f0392b42c07eae41
description: "Hermes stops repeating its own mistakes: learns every terminal command that failed for an environment reason (missing module, command not found, wrong package manager, bad flag, missing path) and the command that fixed it, then fixes the same mistake before it runs again, in any session, with no extra model calls. Disclosure — reads terminal tool arguments and results; stores redacted commands and short error excerpts locally in <HERMES_HOME>/plugin-data/precog/; in auto mode rewrites a command through tool_request middleware before Hermes's approval check, using a fix that already succeeded in the same project, and tells the model in the tool result; no network calls, no background processes, no telemetry."
maintainer: 0xNomind
tier: community
category: tools
requires_hermes: ">=0.23"
version: "0.1.0"
docs_url: https://github.com/0xNomind/precog#readme
image: https://raw.githubusercontent.com/0xNomind/precog/7437314d3d96c6a61aea6a84f0392b42c07eae41/assets/dashboard.jpg
screenshots:
  - https://raw.githubusercontent.com/0xNomind/precog/7437314d3d96c6a61aea6a84f0392b42c07eae41/assets/dashboard.jpg
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - transform_tool_result
    - pre_llm_call
  provides_middleware:
    - tool_request
  requires_env: []
