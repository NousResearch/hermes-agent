name: preflight
repo: https://github.com/soyluisarca/hermes-preflight
sha: 53d5c40f4178342c9c5a01ea9d5fd28f817ef09d
description: "Approval dry-run gate: runs every terminal command in a disposable copy of the workspace (reflink/copy, no Docker), shows a per-file review before the exact diff, and applies only what the user approves. Disclosure — preflight is a dry-run gate, not an isolation sandbox: agent shell commands run as host processes in a copy of the workspace under the Hermes home's `sandbox/` folder, with a filtered environment and HOME pointed at the copy; its path guards are best-effort pattern matching, and scripts or commands that build paths at run time can still reach files outside the copy; `sandboxctl apply` copies the whole pending change set into the real workspace and deletes files that were removed in the copy."
maintainer: soyluisarca
category: tools
tier: community
version: "0.1.2"
requires_hermes: ">=0.22.0"
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
docs_url: https://github.com/soyluisarca/hermes-preflight#readme
platforms:
  - linux
  - macos
