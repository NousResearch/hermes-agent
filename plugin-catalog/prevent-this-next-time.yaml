name: prevent-this-next-time
title: Prevent This Next Time
repo: https://github.com/AceVikings/prevent-this-next-time
sha: aaa2126ab7154deb9907905cdfd1613e22cfb919
subdir: prevent-this-next-time
version: "0.2.0"
requires_hermes: ">=0.23.1"
description: "Block configured connector writes or require the owner's approval from Telegram. Disclosure — the plugin's pre_tool_call hook blocks every tool in the profile (core tools included) until `rulebook/config.json` exists and is valid, and every non-rulebook tool when `protected` is on, so install it in a dedicated profile; connector writes declared in that config with no rule are sent by rulebook_write straight away without a Hermes approval prompt (POST/PUT/PATCH/DELETE to the configured HTTPS hosts with the profile's RULEBOOK_* tokens); ask/block rules and approvals are managed only from the owner's Telegram DM."
maintainer: AceVikings
tier: community
category: tools
docs_url: https://github.com/AceVikings/prevent-this-next-time/blob/aaa2126ab7154deb9907905cdfd1613e22cfb919/README.md
known_issues:
  - "Chat rule management and approvals require the owner's Telegram DM."
  - "The optional protected profile launcher is tested against Hermes v0.23.1."
capabilities:
  provides_tools:
    - rulebook_capabilities
    - rulebook_write
  provides_hooks:
    - post_gateway_admission
    - pre_tool_call
  provides_middleware: []
  requires_env: []
