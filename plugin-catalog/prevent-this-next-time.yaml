name: prevent-this-next-time
title: Prevent This Next Time
repo: https://github.com/AceVikings/prevent-this-next-time
sha: b546dc3cc0c12b024d3df6aca3cc5a5a8f831ad8
subdir: prevent-this-next-time
version: "0.3.0"
requires_hermes: ">=0.23.1"
description: "Block configured connector writes or require the owner's approval from Telegram. Disclosure — the plugin's pre_tool_call hook blocks every tool in the profile (core tools included) until `rulebook/config.json` exists and is valid, and every non-rulebook tool when `protected` is on, so install it in a dedicated profile; connector writes declared in that config with no rule are sent by rulebook_write straight away without a Hermes approval prompt (POST/PUT/PATCH/DELETE to the configured HTTPS hosts with the profile's RULEBOOK_* tokens); ask/block rules and approvals use the authenticated local owner's Desktop/CLI thread on macOS/Linux or the optional owner's Telegram DM."
maintainer: AceVikings
tier: community
category: tools
docs_url: https://github.com/AceVikings/prevent-this-next-time/blob/b546dc3cc0c12b024d3df6aca3cc5a5a8f831ad8/README.md
known_issues:
  - "Native chat control verifies the authenticated OS owner on macOS/Linux; Telegram owner DMs remain optional."
  - "The optional protected profile launcher is tested against Hermes v0.23.1."
capabilities:
  provides_tools:
    - rulebook_capabilities
    - rulebook_write
  provides_hooks:
    - pre_llm_call
    - post_gateway_admission
    - pre_tool_call
  provides_middleware: []
  requires_env: []
