known_issues:
  - "Tested on macOS, where Blender and Bambu Studio are found automatically. On Linux, Blender must be on PATH or installed with flatpak, snap or Steam for the install to go through; set BAMBU_STUDIO_BIN if Studio is not on PATH."
  - "Bambu Studio is not checked at install; without it, make stops at the slice step and says to install it or set BAMBU_STUDIO_BIN."
  - "The skill folder is a symlink, so Windows is not supported."
