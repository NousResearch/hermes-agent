name: print3d
repo: https://github.com/mfranzon/print3d
sha: 49f821366e955f3a11de72f05d39f93700c7e30c
description: "Turn an idea, a photo of an object, or a shop listing into a sliced Bambu Studio project. The agent writes a Blender script, print3d checks the mesh (overhangs, thin walls, fits between parts, likeness to the photo), slices it and says what to fix, until it prints clean; each run also writes a 3D view the agent opens in the Desktop preview pane. Portable Agent Plugins v1 package: one skill and a stdio MCP server run through uvx, so Blender 4.2+, Bambu Studio and uv are required. Disclosure: runs Blender and the Bambu Studio CLI as local child processes; writes jobs under ~/print3d; installs Pillow and mcp from PyPI; the 3D view loads three.js from cdn.jsdelivr.net. Never contacts the printer; no telemetry, no credentials."
