description: "Check a print-ready PDF for free (bleed, trim size, safe areas, image resolution, fonts, colour, with previews and a fix for each issue), then have it professionally printed and delivered: the agent gets a quote and a payment link, a person pays on Stripe, and the order is tracked. Flyers today, delivered in the contiguous US. Portable Agent Plugins v1 package (mcp.json + one skill), no Python or executables; the stdio MCP server is the printsi CLI run through npx at an exact version (printsi@0.2.1), so Node.js 18+ is required. Disclosure — calls the printsi API (printsi-api-live.magnus-ahmad.workers.dev); uploads the PDF being checked or printed and sends the delivery name, address, phone and email to printsi and its print supplier; orders cost real money, but the plugin cannot pay: order_purchase returns a link and a person pays on Stripe, with the card held until the printer accepts; the server is marked untrusted, so Hermes asks before every tool that uploads or changes something; on first use it creates a printsi guest key and keeps it, with order tokens, in the plugin's own data folder in the Hermes profile; npx downloads the pinned CLI from npm, and the skill's optional helper scripts run Chrome and Ghostscript locally and fetch segno from PyPI through uvx; no telemetry (PRINTSI_TELEMETRY=0), no update checks, no self-updating code."
