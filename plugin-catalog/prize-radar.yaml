  - https://raw.githubusercontent.com/cacx097/prize-radar/9f477018dff663df664be645a373e86b38383cca/docs/gaps.png
  - https://raw.githubusercontent.com/cacx097/prize-radar/9f477018dff663df664be645a373e86b38383cca/docs/deadline-moved.png
  - https://raw.githubusercontent.com/cacx097/prize-radar/9f477018dff663df664be645a373e86b38383cca/docs/session-reminder.png
capabilities:
  provides_tools: [prize_search, prize_competition, prize_track, prize_list, prize_check]
  provides_hooks: [pre_llm_call]
  provides_middleware: []
  requires_env: []
