# Community catalog entry — proactive-agent
#
# Owner-submitted: the PR author (`JerryLiu369`) owns and maintains the repo below.
# Exact-SHA pin (40-hex). No self-updating code, no network calls, no shell: the
# plugin is Python hooks that run inside Hermes's own process plus a local SQLite
# ledger in the plugin's Hermes data directory.
name: proactive-agent
repo: https://github.com/JerryLiu369/hermes-proactive-agent
sha: 82228560cffb0f3e22b35e408ad875bb6353914b
subdir: proactive-agent
title: Proactive Agent
description: >-
  Turn governance and supervision for long chat turns. After 60 s in one turn the main agent is
  reminded to answer or delegate, and at 120 s editing and execution pause while reads,
  delegate_task and wrap-up tools stay available; a foreground terminal command running past 30 s
  moves to Hermes's background process registry so the turn is released instead of hanging. Each
  subagent is briefed before it starts with the user's own words, memory and the task ledger; a
  subagent that returns the same step result repeatedly is stopped, a subagent's open question is
  carried back to the main agent, and a background subagent's result is repeated until the user has
  seen it. Delegated tasks are recorded in a SQLite ledger that survives gateway restarts.
  Governance is a positive allowlist: only the platforms named in governed_platforms (default
  weixin) and the subagents they spawn are affected, and every other surface runs untouched.
  Disclosure — registers hooks for pre_llm_call, pre_api_request, pre_auxiliary_call,
  post_auxiliary_call, pre_tool_call, post_tool_call, transform_tool_result, subagent_start,
  subagent_stop, on_session_end, on_session_reset and on_session_finalize, so for governed sessions
  it can amend tool arguments and results, LLM request messages and subagent handoffs. It writes a
  local ledger.db under the plugin's Hermes data directory, and reads only its own config keys plus
  Hermes session flags (platform, cron); no network calls, no agent tools, no credentials, no
  environment secrets, no shell commands.
maintainer: JerryLiu369
tier: community
category: automation
docs_url: https://github.com/JerryLiu369/hermes-proactive-agent
version: "0.1.16"
requires_hermes: ">=0.22"
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - pre_api_request
    - pre_auxiliary_call
    - post_auxiliary_call
    - pre_tool_call
    - post_tool_call
    - transform_tool_result
    - subagent_start
    - subagent_stop
    - on_session_end
    - on_session_reset
    - on_session_finalize
  provides_middleware: []
  requires_env: []
