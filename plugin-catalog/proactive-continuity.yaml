version: "0.1.1"
description: "Keeps your agent working through multi-step tasks without losing pending work: it continues to the next step on its own, lists open Kanban cards in each new session, gives a catch-up after idle time, and asks for approval before anything that sends, posts, pays or deploys. Glue over built-in Kanban, cron and approvals; works with any model. Disclosure — adds working rules to the system prompt; sends the agent a continue message on its own (at most 6 per session per hour, needs allow_gateway_injection on messaging platforms). The user-run `hermes proactive-continuity setup` backs up config.yaml and SOUL.md, changes approval and display settings through `hermes config set`, enables the kanban toolset, grants itself allow_gateway_injection, copies one script into the Hermes scripts folder and creates a paused cron job; uninstall reverses this. No network calls and no telemetry."
maintainer: iknowterry
tier: community
category: automation
requires_hermes: ">=0.23.1"
