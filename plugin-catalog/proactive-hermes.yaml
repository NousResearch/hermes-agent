title: Proactive Hermes
description: "A proactive executive-assistant desk for your Bot. Scheduled jobs and your own watches read mail, calendar, Slack, Linear, marketplaces, shops and event pages, and only what needs you reaches your Bot Chat as one short numbered message: ready email drafts, meeting prep, train and trip leave times with an Uber quote, promises you made, a recap after the team daily. It acts only within the approval levels you pick in setup (private calendar blocks, phone reminders and alarms); sending, buying, registering and booking wait for your yes to that exact action. Quiet hours at night. Set up with /proactive setup, check with hermes proactive doctor. Optional: OpenAI Decisions API to drop noise before any agent runs, and instant mail push over IMAP IDLE with an app password per mailbox. Disclosure: keeps background IMAP IDLE connections, on the plugin's own thread inside the gateway, only to the mailboxes you add in its settings (app passwords read through get_secret), and runs the mail radar with hermes cron run; sends the sender, subject and first 600 characters of each new mail (and Slack messages, promise and recap items) to the OpenAI Decisions API only if you set PROACTIVE_OPENAI_API_KEY; posts into your Bot Chat through a no-agent cron job with --deliver bot-chat; reads past chats in state.db read-only and never writes it; one pre_llm_call hook adds a setup hint once per profile before setup; creates, completes and checks phone reminders and alarms through the Hermes mobile plugin's bridge database and reads the phone's last sync time and shared location there; reads the cron job list and output, USER.md (your name) and config.yaml; writes scripts/proactive-hermes/, plugin-data/proactive-hermes/ and logs/proactive-hermes-mail-push.log in the Hermes home; runs himalaya, the google-workspace skill's scripts (reading Gmail and Calendar, creating and removing its own calendar blocks and alerts), hermes cron and hermes gateway status; does not archive sessions; uses Slack and Linear through your connectors; uses the logged-in browser for watches and for bookings you approve; scheduled jobs are instructed not to book or pay and have no booking or payment authority by default."
