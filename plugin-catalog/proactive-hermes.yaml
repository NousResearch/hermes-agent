platforms: [linux, macos]
known_issues:
  - Phone reminders and alarms land when the Hermes mobile app refreshes, which can be minutes late; time critical items also get a calendar alert.
  - Outlook, Hotmail and Microsoft 365 mailboxes cannot use instant push (Microsoft allows no app passwords); they stay on the 15 minute checks.
  - Needs a Hermes build that includes cron.plugin_api (current main; the next release). Setup checks first and changes nothing on older builds.
  - Desk messages arrive as a scheduled Bot Chat turn, shown under a small relay card, until Hermes offers a display-only delivery.
capabilities:
  provides_tools: []
