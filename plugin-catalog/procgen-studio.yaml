known_issues:
  - Not for photorealism; it is built for icons, game assets, logos, flat illustrations, scenes, patterns, diagrams, low-poly creatures and motion graphics.
  - cairosvg ignores SVG filters (no blur); glows and soft shadows are drawn with gradients.
  - Output quality tracks the configured model's coding ability; small local models produce simpler drawings.
