description: "Skills-only plugin. Finds, shortlists, license-checks and vets licensed professionals in any US state from public license registries and regulator records, and drafts outreach the user sends. Not a background check and not intended to be a consumer report (FCRA); confirm findings with the issuing board. Disclosure: no tools, hooks, MCP servers, shell or stored credentials; uses the agent's own web tools to open public registries; sends nothing to KellerAI."
