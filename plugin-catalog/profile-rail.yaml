sha: "cb3b8717da867a3072754fbd6be6116d57206e70"
version: "0.1.0"
description: >-
  Browse sessions and related projects across profiles in a Hermes Desktop side
  panel, with observed activity, completion reminders, and project creation.
  Disclosure: the plugin backend reads authorized profiles' settings, status,
  session metadata and process-liveness evidence outside its own data; it does
  not read conversation message bodies for completion snapshots. Folder browsing,
  directory creation and non-overwriting IDEA.md writes use the gateway filesystem
  and are not confined to the Hermes root. Optional idea generation sends project
  input to the selected profile's configured model provider. A POSIX fallback may
  execute ps directly without a shell. No credential-store reads, telemetry,
  self-updater or separate listener; Hermes may start plugin-host subprocesses.
maintainer: harukaxxxx
tier: community
category: desktop
requires_hermes: ">=0.23.0"
platforms: [linux, macos]
