title: Profile Switcher
description: 'A macOS-style quick switcher for Hermes profiles in the desktop app. One chord (⌥⌘P by
  default, rebindable in the app''s own keybind panel) opens a panel of every profile with its model and
  most recent conversation; ↑ ↓ move the highlight and Enter lands you in the profile you pick. A status-bar
  chip names the active profile and opens the same panel on click. The switch goes through the Desktop''s own
  profile path, so the target profile''s backend is activated and its chrome is scoped onto it. Desktop-only
  (desktop/plugin.js inside the plugin SDK surface); no agent tools, hooks, middleware, env vars, network
  calls, or stored credentials.'
