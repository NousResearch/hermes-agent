sha: eb57d3c441236ae9a55decd634b9bd5f9bdf8435
title: Progression
description: >-
  Right-side Hermes Desktop panel showing, live, what the focused chat's agent
  and its subagents are doing: the task in progress (with the tool running now),
  subagents (queued, running, done, failed), the tasks up next and the done ones,
  color-coded, with a completion % and an ETA (finish clock time) recomputed every
  30 s to 10 min, plus other active chats, and a flag when the agent or a
  subagent is parked on an approval, password, secret or question. Fed by the
  agent's own todo tool (todo.updated) and subagent.* events. /progression shows
  or hides it. English and French UI. Disclosure: Desktop half inside the plugin
  SDK surface; read-only gateway calls (subagent.list, session.active_list, and
  session.events.since for open_requests), polled every 5 s only while a chat is
  working or waiting; a native notification (ctx.os.notify) when a chat starts
  waiting for the user; the agent half only registers the /progression command;
  no tools, hooks, middleware, env vars, network, shell or files; keeps its panel
  state in its own desktop plugin storage.
maintainer: thibaud.art
tier: community
category: desktop
requires_hermes: ">=0.23.0"
