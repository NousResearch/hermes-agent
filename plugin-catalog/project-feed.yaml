version: "0.3.1"
description: >-
  Plan work, run tasks, and report project progress in Project Feed through its hosted
  Streamable HTTP MCP server, with four workflow skills: task-workflow, plan-project,
  project-status and work-triage. Agent Plugins v1 package (plugin.json, mcp.json,
  skills/), configuration only. Needs a Project Feed Pro workspace and OAuth sign-in:
  the README's Hermes section adds the server to mcp_servers with auth: oauth, then
  hermes mcp login "Project Feed". Disclosure: every tool call goes to projectfeed.app
  and acts on the user's workspace with their own role, including tools that create,
  edit, archive and delete tasks, posts, docs, canvases and chat messages. The tool set
  is served at runtime and is not covered by the pinned sha. The README sets
  trust: untrusted so Hermes asks before any tool that is not marked read-only.
