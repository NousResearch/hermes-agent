title: Fast Prompt Autocomplete (Implied LTR/RTL)
description: 'Inline sentence autocomplete for the Hermes Desktop prompt composer: a suggestion bar above the input,
  accepted with the arrow that matches the language you are already typing (English ArrowRight, Hebrew/Arabic
  ArrowLeft), Ctrl+Arrow for one word, Tab for the full line. Three tiers — a <1ms main-thread matcher over builtin
  English/Hebrew phrases that always runs, a WebWorker prefix/N-gram trie seeded from the user''s own prompt history,
  and a fast small-model continuation through agent.plugin_llm.PluginLlm (max_tokens=10). Zero editor DOM mutation on
  keystrokes: suggestions render in COMPOSER_AREAS.top and are committed via host.composer.setDraft. Disclosure —
  reads up to 400 recent user prompt phrases from the active profile''s state.db via hermes_state.SessionDB for local
  matching only, and sends the last 180 characters of the current draft line to the user''s configured LLM provider
  when no local match is found; no telemetry, no self-updater, never reads .env or credentials. Desktop-only, plugin
  SDK surface only (COMPOSER_AREAS.top, STATUSBAR_AREAS.right, host.composer.setDraft, ctx.rest, ctx.storage), no
  tools, hooks, middleware or env vars.'
