title: Inline Prompt Autocomplete
description: 'Inline sentence completion for the Hermes Desktop prompt composer: the bar above the input finishes the
  sentence you are already typing, and the legend names the direction it detected — LTR with ArrowRight, RTL with
  ArrowLeft, Ctrl+Arrow for one word, Tab for the whole line, no toggle to flip. Two things set it apart: bilingual phrases
  match locally in under a millisecond from an off-main-thread trie, and that trie is trained on your own prompt history
  (up to 400 recent phrases from the active profile), so completions sound like the way you already write and never leave
  the machine; only a prefix nothing local can answer falls back to a small model via agent.plugin_llm.PluginLlm
  (max_tokens=10). The editor DOM is never mutated — the bar renders in
  COMPOSER_AREAS.top and acceptance commits through host.composer.setDraft. Disclosure: reads up to 400 recent prompt phrases
  from the profile''s state.db via hermes_state.SessionDB for local matching only, and sends the last 180 characters of the
  draft line to your configured LLM provider when no local match is found; no telemetry, never reads .env or credentials.'
