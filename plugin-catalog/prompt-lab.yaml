title: Prompt Lab
description: "A sparkle beside Send that rewrites the composer draft as a clearer prompt in a voice you pick under Settings > Plugins > prompt-lab: structured, concise, detailed, clarify, verify, or your own words. It never sends the message, and Undo restores the exact original. Also registers the `/promptlab` slash command for the same rewrite in any Hermes chat. Disclosure: every rewrite is one stateless `llm.oneshot` call (`ctx.llm.complete` for the command) on your own gateway, so it spends your model credits; an open chat lends its model, otherwise the `prompt_lab` auxiliary task is used with reasoning off. Only the request and the voice instructions are sent. It creates no session, runs no tools, reads no files, and carries no telemetry, credentials, background work or self-update. `/promptlab` rewrites are logged locally in Hermes plugin storage."
