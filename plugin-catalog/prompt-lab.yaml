known_issues:
  - "One model call per rewrite. Cancel stops the client-side wait only; the in-flight call may still finish."
  - "The Desktop half is opt-in: enable it under Capabilities > Plugins after installing."
  - "Same author as `enhance-prompt`, different design: one pass in a user-chosen voice set in Settings, instead of staged deepening with a scorer and an agent tool."
