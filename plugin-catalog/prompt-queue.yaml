description: >-
  Kanban-style prompt queue for the desktop: Play drains cards one at a
  time into per-card target modes — new session, existing session, project,
  or a profile's canonical Bot Chat — gated on the global model slot,
  background-review completion, and context compaction. Queue/Done/Skipped/
  Failed tabs, two-row target picker, markdown ingest (Windows), and a
  trust-aware ::enqueue directive (ask-first by default).
maintainer: vectorforge22
