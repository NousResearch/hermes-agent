description: "Kanban-style prompt queue for the desktop: Play drains cards one at a time, each into a new (or targeted, existing) sidebar session, gated on the global model slot and background-review completion. Queue/Done/ Skipped/Failed tabs, resizable composer, per-card target picker, and a trust-aware ::enqueue directive (ask-first by default). Disclosure — Desktop pane that runs queued prompts as full agent turns (all tools the session allows) in new or chosen existing sessions while Play is on; reads the last 1000 agent.log lines to detect background reviews; an opt-in Auto-add setting lets ::enqueue directives in a live assistant reply queue prompts that run without a click."
