description: "Prompt snippet library for the Hermes Desktop composer: a quick-pick overlay styled after the app's own slash menu (own shortcut), plus a management view with drag reordering, group tags and import/export. Inserts into the focused session, not the active one. UI in EN / 简中 / 繁體. v1.7.0 moves insertion onto the official composer draft API (host.composer.insertText, session-addressed) and keeps the event-bus path as a fallback for older desktop builds. No network, no self-updater."
