name: promptli-comms
title: Promptli Comms
repo: https://github.com/promptli-dev/promptli-hermes-plugin
sha: e3989a714b3c42ceaf45d8e0a8d4d59c210d69f9
description: "Give Hermes its own email address and phone number: a gateway platform for Promptli Comms, so people email, text or call the agent and each person gets their own Hermes session across channels, with replies sent back on the channel they used; calls are taken by Promptli's AI voice assistant, which asks Hermes for answers (or Hermes speaks every word with PROMPTLI_VOICE=agent), and the caller is always told they are talking to an AI. Disclosure — talks only to Promptli (HTTPS to api.comms.promptli.com, plus one outbound Agent Link WebSocket held open while the gateway runs, so no public URL or open port is needed); sends message bodies, call text and destination addresses or numbers to Promptli; `hermes promptli setup` saves an identity-scoped Promptli API key in the active profile's .env through Hermes's save_env_value (an organization key, if pasted, is used once to mint the agent key and never stored), and adds the hosted Promptli MCP server (OAuth via `hermes mcp login`, trust: untrusted) to config.yaml; the key is read through Hermes's secret scope; a pre_tool_call hook refuses outbound Promptli tools in conversations started by people outside PROMPTLI_ALLOWED_USERS, requires calls to open with an AI disclosure and limits calls to Indian (+91) numbers to 9 AM-9 PM IST; only PROMPTLI_ALLOWED_USERS (or everyone, with PROMPTLI_ALLOW_ALL_USERS=true) can reach Hermes, and their sessions get only the web and todo toolsets and no MCP servers by default; stores the Agent Link cursor, processed event ids and reply routes in plugin data (state.db); Python dependencies promptli and promptli-gateway (>=0.2.2,<0.3); no shell commands, child processes, telemetry or self-update."
maintainer: promptli-dev
tier: community
category: platform
requires_hermes: ">=0.23.0"
docs_url: https://promptli.com/docs/comms
version: "0.1.1"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env:
  - PROMPTLI_API_KEY
