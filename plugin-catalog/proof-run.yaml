tier: community
category: automation
requires_hermes: ">=0.21.0"
version: "0.1.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
    - post_tool_call
  provides_middleware: []
  requires_env: []
