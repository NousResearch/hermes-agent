description: "Context and control for any AI. Agent identity, scoped access, and proof across tools. Disclosure — skills-only package: its workflow skills steer the agent to Proofable's hosted MCP server at mcp.proofable.me (which you add yourself with `hermes mcp add … --auth oauth`) to check identity proofs and agent permissions, create wallet-signed proofs, create agent jobs and approve or deny waiting runs, and revoke proofs or agent permissions, so proof, agent and job data go to Proofable; Hermes does not prompt before those MCP tools run unless you give the server a trust setting; the skills also suggest Proofable's own optional CLI, run unpinned via `npx -y @proofable/sdk`, which edits MCP/project config and can import an existing agent's repository, URL or folder into Proofable."
