name: provider-usage
repo: https://github.com/PhoeniXAbhisheK/hermes-plugin-provider-usage
sha: "ee34c91097954043ff639ce7e3f4560bcf3fb279"   # tag v0.4.3
description: "Per-provider quota and balance readout in the Hermes desktop status bar. Pinned providers in the bar (or the current chat's provider when none are pinned), a popover sorted by risk with every quota window, reset times (as a countdown or the local date and time), balance and key-cap amounts, a per-window usage chart over the whole window with burn rate and projected run-out, a yellow watch tint and an amber near-limit tint, and a desktop notification at a per-window alert level. Providers: OpenCode (Go plan), OpenAI Codex, OpenRouter, plus Anthropic (with per-model weekly limits and the plan name), Nous, Z.AI, Kimi, MiniMax and DeepSeek when configured, and GitHub Copilot on Hermes 0.22.5 or older. Disclosure — resolves provider credentials read-only (Hermes account-usage helpers and profile secrets, else the profile's .env and the vendor CLI login files ~/.codex/auth.json, ~/.claude/.credentials.json and ~/.local/share/opencode/auth.json) and sends each only to that provider's usage endpoint (opencode.ai, chatgpt.com, openrouter.ai, api.anthropic.com, portal.nousresearch.com via Hermes' Nous sign-in, api.deepseek.com, api.kimi.com, api.moonshot.ai/.cn, api.z.ai, api.minimaxi.com, www.minimax.cn, api.minimax.io, www.minimax.io, api.github.com); the Anthropic check sends the Claude Code `anthropic-beta: oauth-2025-04-20` header, reads per-model limits from api.anthropic.com at most every 15 minutes and the plan from the local ~/.claude.json, else from api.anthropic.com's OAuth profile at most once a day, and on Hermes 0.22.5 or older the GitHub Copilot check presents the VS Code / Copilot client identity (`Editor-Version: vscode/1.96.2`, `Editor-Plugin-Version: copilot-chat/0.23.0`, `User-Agent: GitHubCopilotChat/0.23.0`). It keeps usage history and a cached plan name in its own plugin data folder. The plugin spawns no subprocesses itself (Hermes helpers it calls may: the Claude Subscription DirectSDK plugin's usage hook runs the Claude Code CLI, and the old Copilot resolver can run `gh auth token`) and sends no telemetry."
maintainer: PhoeniXAbhisheK
