name: proxmox
repo: https://github.com/cgray2222/hermes-proxmox
sha: 62d13a76732787088d314c35b1cf6a493b47d8d2
description: 'Proxmox VE for Hermes Agent: six pve_* tools (cluster inventory, per-guest status
  and config, node health and storage, snapshot list/create/delete, recent backup job results,
  and QEMU guest-agent command execution) plus an @pve: context reference that pulls live
  cluster, guest or node state into the prompt on demand. Talks to the Proxmox HTTP API
  directly with a scoped API token; standard library only, no Python dependencies. Write
  actions (snapshot create/delete, guest exec) go through Hermes'' approval prompt: a
  pre_tool_call hook escalates each one with the guest, the node and the exact command or
  snapshot operation, and the operator approves or refuses it.'
maintainer: cgray2222
tier: community
category: tools
title: "Proxmox VE"
docs_url: https://github.com/cgray2222/hermes-proxmox#readme
requires_hermes: ">=0.21.5"
version: "0.1.1"
platforms: []
capabilities:
  provides_tools:
    - pve_list_guests
    - pve_guest_status
    - pve_node_status
    - pve_snapshot
    - pve_backup_status
    - pve_guest_exec
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - PVE_HOST
    - PVE_API_TOKEN
