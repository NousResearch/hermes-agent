# Catalog entry for the Hermes plugin catalog (NousResearch/hermes-agent).
# Target path in that repository: plugin-catalog/pstack-hermes.yaml
#
# BEFORE OPENING THE PR: replace `sha` with the 40-character commit SHA of the
# v0.16.1 release commit on `master` (i.e. after this branch merges and the
# signed tag is cut â€” CONTRIBUTING: tag the source commit, then dispatch
# release.yml from master). The loader rejects anything that is not a full
# lowercase 40-hex commit, so a stale or placeholder value fails CI rather than
