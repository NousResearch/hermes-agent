title: PUGin
description: "A dancing companion for Hermes Desktop that beams in while the chat you're viewing is working and beams out when its whole job is done: the reply, plus the subagents, background processes and Kanban cards that chat started. Work from other chats never counts. Click him for a list of what's running (with Stop for subagents and processes); NEED YOU!, STUCK? and DONE! callouts take you to the approval, the stalled card or the finished work. Seven characters, size, opacity, presence and reduced-motion settings. Disclosure: no network calls (all media bundled), no telemetry, no shell, no credentials; the Desktop half polls Hermes's subagent/process/approval lists for the focused chat every 4 s, and one read-only backend route opens the Kanban board databases read-only; the only action is Stop, on user click and confirm; settings in Desktop plugin storage."
