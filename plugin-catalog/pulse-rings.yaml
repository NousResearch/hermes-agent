title: Pulsr
description: "Live numbers beside your chat: a Pulses pane for Hermes Desktop with rings, bars, numbers and trends from Discord servers, GitHub, feeds, public JSON APIs, read-only MCP tools, Windows notifications and Hermes's own activity. The agent drafts a pulse; only a person can approve it, and the approval card lists every host and the hourly request budget. No model tokens to refresh. Network: GETs to discord.com, cdn.discordapp.com, api.github.com, avatars.githubusercontent.com and HTTPS hosts you approve; the builder's Find sends one query to geocoding-api.open-meteo.com or store.steampowered.com. Notification pulses read counts from the local Windows store; sender and text previews are a separate opt-in. No telemetry; background collection is opt-in. Disclosure — Approved pulses send HTTPS GETs to discord.com, cdn.discordapp.com, api.github.com (with your optional GitHub token), avatars.githubusercontent.com and any public HTTPS hosts you approve per pulse; the builder's Find sends a query to geocoding-api.open-meteo.com or store.steampowered.com. On Windows, notification pulses read the local Windows notification database (read-only), and a one-time import you start reads an old Discord Pulse plugin database read-only. Background collection is off by default."
maintainer: Stormxftw
tier: community
category: desktop
