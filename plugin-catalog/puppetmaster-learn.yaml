subdir: puppetmaster/hermes_plugin/puppetmaster-learn
version: "0.2.0"
title: Puppetmaster Learn
description: "Turns a Puppetmaster swarm into a Hermes skill. Puppetmaster runs durable worker jobs (swarms and flow graphs) for an agent. When a Hermes session ends, this plugin finds the swarm that finished during that session and, if it produced findings or a patch, writes its goal and findings as a skill candidate under $HERMES_HOME/skills-candidates/. The finalize notice names the candidate; promote it with `puppetmaster skills promote-candidate <slug>`. It never writes a live skill or starts an agent or job, and writes one candidate per job. Needs the Puppetmaster CLI (PyPI puppetmaster-ai). Disclosure — at session end it runs up to three read-only Puppetmaster CLI commands (last --json, status, show) as child processes in the session's working directory, 15 s timeout each, stdin closed; it reads Puppetmaster's local job store through that CLI and the mcp_servers.puppetmaster entry of Hermes config.yaml (no credentials); it writes only under $HERMES_HOME/skills-candidates/; no network, no threads or background processes, no telemetry, no dependencies beyond the standard library."
maintainer: professorpalmer
tier: community
category: automation
requires_hermes: ">=0.20.4"
docs_url: https://github.com/professorpalmer/Puppetmaster/blob/ed604076d84a24deb8d991b2c56c88460a300cc9/puppetmaster/hermes_plugin/puppetmaster-learn/README.md
readme: true
capabilities:
  provides_tools: []
  provides_hooks: [on_session_finalize]
  provides_middleware: []
  requires_env: []
known_issues:
  - "Hermes builds that do not show on_session_finalize notices (v0.20.x) still write the candidate but print nothing. List candidates with `puppetmaster skills list-candidates`."
  - "Only the latest Puppetmaster job of the session's working directory is checked. If two swarms finish in one session, only the later one becomes a candidate."
