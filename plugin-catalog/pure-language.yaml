name: pure-language
title: Pure Language
repo: https://github.com/joowon-jang/pure-language
sha: 3e1ff6081bb2e63820ff4b325562c776c64d6ff9
description: >-
  Keeps every answer in one language. Picks the target from the user's command or the language they
  wrote in (54 languages, 22 scripts), injects a short guard, and cleans the final answer of words and
  characters leaking in from other languages, with Korean Hanja readings from bundled Unihan data.
  Disclosure: rewrites the leaking lines in one bounded ctx.llm call on its own auxiliary slot
  (pure_language_rewrite, defaults to the user's main model; local word tables only as a fallback,
  or first with local_fix: first); optional local log of leak snippets, off by default; no network calls of its own, no credentials, no background processes.
maintainer: joowon-jang
tier: community
category: general
requires_hermes: ">=0.23.4"
version: "0.2.0"
docs_url: https://github.com/joowon-jang/pure-language/blob/3e1ff6081bb2e63820ff4b325562c776c64d6ff9/README.md
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - post_tool_call
    - transform_llm_output
  provides_middleware: []
  requires_env: []
