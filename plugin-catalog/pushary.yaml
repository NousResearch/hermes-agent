name: pushary
repo: https://github.com/Pushary/hermes-plugin-pushary
sha: e4be33ab8d7421dcfaba6233752a9a60b72ea3da
subdir: pushary_plugin
description: "Phone notifications, questions and approvals through Pushary's native Hermes approval transport, with optional per-tool gates. Disclosure: approval transport and per-tool gates hand dangerous-command approvals to whoever holds the devices or Slack channel paired to your Pushary account (fails closed); messages queued in the Pushary app or Mac notch are injected into the next turn as operator instructions and wait in ~/.pushary/run/hermes-commands; sends session events with a machine id (~/.pushary/machine-id when present, else a hashed hostname) on every turn, the redacted command and description of each approval it carries, redacted tool-error text (max 3 per session) and redacted gated-tool arguments to pushary.com; reads PUSHARY_API_KEY only through Hermes."
maintainer: Pushary
tier: community
category: automation
docs_url: https://github.com/Pushary/hermes-plugin-pushary#readme
version: "0.8.0"
readme: false
known_issues:
  - "Updating from 0.5.9: this release reads PUSHARY_API_KEY only through Hermes. If Pushary setup or the Pushary app gave the old copy its key, save it once with: hermes config set PUSHARY_API_KEY <your key>"
capabilities:
  provides_tools:
    - pushary_remind
    - pushary_notify
    - pushary_ask
    - pushary_wait
    - pushary_cancel
    - pushary_propose_scope
    - pushary_enroll
    - pushary_ask_end_user
  provides_hooks:
    - pre_llm_call
    - pre_tool_call
    - post_tool_call
    - on_session_start
    - on_session_end
    - on_session_finalize
  provides_middleware: []
  requires_env:
    - PUSHARY_API_KEY
