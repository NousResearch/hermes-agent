description: 'QuickBooks Online operations for Hermes: connection health, P&L reports,
  close audits, deposit tracing and a guarded read-only SQL query tool — with a desktop
  status pane (local-mode desktop installs) and a bundled reconciliation skill. 5 registered
  agent tools. Reconciliation tradecraft (close-audit reading, deposit-wash detection,
  month-end sanity chain, failure diagnosis) ships as executable tools AND a bundled skill
  (qbo-ops:qbo-ops-reconciliation), earned from closing real store books. Setup is guided:
  the health tool doubles as a setup wizard and a turn-by-turn guided script (docs/SETUP.md)
  walks first-timers through Intuit app creation click by click. Read-only by design; a
  per-user allow_writes config switch (default off) gates a future write tool.
  Disclosure — makes network calls to Intuit (quickbooks.api.intuit.com,
  oauth.platform.intuit.com) with credentials the user provides; credentials flow only
  through Hermes secret scope (requires_env), never read from .env files or other token
  stores; the BYO-refresh-token path refreshes tokens through the plugin''s flock-guarded
  refresher (disclosed tradeoff pending upstream redirect_port support, #149642); the
  desktop pane (desktop/plugin.js, SDK-only surface) renders on local-mode desktop
  installs; on remote-backend connections the agent tools remain fully available.'
