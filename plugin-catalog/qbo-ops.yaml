    - qbo_pnl
    - qbo_udf_audit
    - qbo_deposit_trace
    - qbo_query
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - QBO_OPS_CLIENT_ID
    - QBO_OPS_CLIENT_SECRET
    - QBO_OPS_REALM_ID
