name: qdrant-memory
repo: https://github.com/cnkang/hermes-plugin-qdrant-memory
sha: 5ec9cac094e5e9dc80e1cd25b241bcec44019d5b
description: "Durable native memory for Hermes with LLM fact extraction. Conversations are distilled by the Hermes-configured LLM into searchable memories — facts, preferences and decisions with deduplication and importance — instead of storing turns verbatim, and are kept in Qdrant (embedded, self-hosted Server, or Qdrant Cloud) with configurable embeddings (default: local Ollama qwen3-embedding:4b at 2560 dimensions). The plugin registers a native MemoryProvider plus four scoped tools: qdrant_memory_search, qdrant_memory_add, qdrant_memory_update and qdrant_memory_delete. A SQLite WAL admission ledger makes every write idempotent and replayable across restarts with fail-closed recovery; scoped inventory, portable export and scope-aware deletion (list/export/delete-all with explicit single-agent vs all-agents semantics) ship in the same CLI, and `migrate mem0` imports existing Mem0 exports with resumable, verifiable runs. Disclosure — memory text is stored in the configured Qdrant store, and embedding vectors go to the configured embedding service (default local Ollama; a remote service can be configured). Disclosure — extraction sends conversation text to the LLM configured in Hermes, which may be a remote provider; a fully local setup is possible with embedded Qdrant plus a local model, and a remote LLM otherwise. Disclosure — configuration lives in the Hermes config (memory.provider); state lives under <HERMES_HOME>/qdrant-memory/ (embedded store data, SQLite WAL ledger and lock files). Disclosure — single-writer design: embedded mode takes an ownership lock, and Server/Cloud deployments expect one active writer per scope. Disclosure — deletion removes records and fences pending operations, but is not a forensic secure erase."
maintainer: cnkang
tier: community
category: memory
requires_hermes: ">=0.21.5"
docs_url: https://github.com/cnkang/hermes-plugin-qdrant-memory#readme
readme: true
known_issues:
- "Preview scope: multi-writer Server/Cloud deployments, hybrid retrieval and a web UI are not supported."
- "Deletion removes records and fences pending operations but is not a forensic secure erase; storage-level remnants (WAL, backups) may persist."
- "Embedded mode is single-writer: a second process fails closed on the ownership lock instead of sharing the store."
- "Extraction adds LLM latency after a turn; memory admission is not guaranteed before the host admits the provider, and pending operations replay on the next start."
capabilities:
  provides_tools:
  - qdrant_memory_search
  - qdrant_memory_add
  - qdrant_memory_update
  - qdrant_memory_delete
  provides_hooks: []
  provides_middleware: []
  requires_env: []
