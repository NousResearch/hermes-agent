name: qdrant-memory
repo: https://github.com/cnkang/hermes-plugin-qdrant-memory
sha: 6ddf7215479692e7882f3065885931f01908c0ac
description: "Durable native memory for Hermes with LLM fact extraction. Conversations are distilled by the Hermes-configured LLM into searchable memories — facts, preferences and decisions with deduplication and importance — instead of storing turns verbatim, and are kept in Qdrant (embedded, self-hosted Server, or Qdrant Cloud) with configurable embeddings (default: local Ollama qwen3-embedding:4b at 2560 dimensions). The plugin registers a native MemoryProvider plus four scoped tools: qdrant_memory_search, qdrant_memory_add, qdrant_memory_update and qdrant_memory_delete. A SQLite WAL admission ledger makes every write idempotent and replayable across restarts with fail-closed recovery; a restart-interrupted remote write stays retryable with the same request identifier, and a deterministic extraction failure is quarantined without stopping unrelated writers. Optional shared memory runs through one authenticated Owner over loopback or HTTPS MCP with provisioned device grants, fixed scopes and one writer per destination; the default stays private under a local ownership lock. scoped inventory, portable export and scope-aware deletion (list/export/delete-all with explicit single-agent vs all-agents semantics) ship in the same CLI, and `migrate mem0` imports existing Mem0 exports with resumable, verifiable runs. Disclosure — optional shared memory runs one authenticated Owner service (off by default, loopback or HTTPS MCP only, token-checked device grants with fixed scopes)."
maintainer: cnkang
tier: community
category: memory
requires_hermes: ">=0.21.5"
version: "0.5.4"
docs_url: https://github.com/cnkang/hermes-plugin-qdrant-memory#readme
readme: true
known_issues:
- "Multi-writer Server/Cloud deployments, hybrid retrieval and a web UI are not supported."
- "Upgrading from a pin older than 0.5.0 changes the embedding transport rule: a non-loopback embedding endpoint must use HTTPS, or use a loopback address."
- "Deletion removes records and fences pending operations but is not a forensic secure erase; storage-level remnants (WAL, backups) may persist."
- "Embedded mode is single-writer: a second process fails closed on the ownership lock instead of sharing the store."
- "Extraction adds LLM latency after a turn; memory admission is not guaranteed before the host admits the provider, and pending operations replay on the next start."
- "Optional offline CPU embeddings need the local extra in a separate environment; the plugin manager installs only the dependencies declared in the manifest."
capabilities:
  provides_tools:
  - qdrant_memory_search
  - qdrant_memory_add
  - qdrant_memory_update
  - qdrant_memory_delete
  provides_hooks: []
  provides_middleware: []
  requires_env: []
