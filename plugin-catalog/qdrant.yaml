name: qdrant
repo: https://github.com/kuehnberger/hermes-qdrant-memory
sha: 26dcc41f0a8b7bb93bdbccdee35e8572b8e9c4a4
version: "0.1.0"
image: https://raw.githubusercontent.com/kuehnberger/hermes-qdrant-memory/26dcc41f0a8b7bb93bdbccdee35e8572b8e9c4a4/docs/banner.jpg
description: "Dense semantic memory for Hermes, stored in a self-hosted Qdrant
  collection. Each turn is embedded locally into a single point (user + assistant
  text, verbatim — no LLM summarization) and recalled by dense cosine search
  with an optional session_id payload filter, so results are quote-faithful.
  Registers 5 tools: qdrant_search, qdrant_upsert, qdrant_recall,
  qdrant_collect, qdrant_prepare. Embedding is on-device at 384 dimensions:
  fastembed (ONNX, no torch) by default; sentence-transformers selectable on
  GPU — both measured to produce identical vectors for all-MiniLM-L6-v2, so
  switching backends needs no re-embedding. A circuit breaker (5 consecutive
  I/O failures, 120 s cooldown) degrades to no new memories instead of crashing.
  is_available()/check_backend()/unavailable_reason() distinguish misconfig
  from a dead server. Hybrid dense+sparse RRF and INT8 quantization exist in
  _backend.py but are not on the live path. Disclosure — the provider talks
  only to the Qdrant server at `url` (default http://localhost:6333); memories
  live there. QDRANT_API_KEY is needed only for Qdrant Cloud and is read
  through the Hermes secret scope, never written to config.yaml. The sole
  outbound request is the embedding model weights from huggingface.co on first
  use; embedding then runs on-device. config.json is created 0600 and
  git-ignored. Local embedded Qdrant mode is not supported — a reachable
  REST server is required."
maintainer: kuehnberger
tier: community
category: memory
requires_hermes: ">=0.21.4"
docs_url: https://github.com/kuehnberger/hermes-qdrant-memory#readme
known_issues:
  - "Windows on ARM is unsupported: grpcio, pulled in by qdrant-client, has no win_arm64 wheel. Linux and macOS on x86_64/arm64 and Windows x86_64 are supported."
  - "Local embedded Qdrant mode is not supported — the provider is REST-only and requires a reachable server."
capabilities:
  provides_tools:
    - qdrant_search
    - qdrant_upsert
    - qdrant_recall
    - qdrant_collect
    - qdrant_prepare
  provides_hooks: []
  provides_middleware: []
  requires_env: []
