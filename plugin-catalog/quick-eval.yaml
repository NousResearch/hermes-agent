name: quick-eval
title: Quick Eval
repo: https://github.com/tikiverse/quick-eval
sha: 0ff4ab2f26c19820e373217721f75c98ceab734f
subdir: plugins/quick-eval
version: "0.1.0"
description: "Get a second opinion on any answer. /quick-eval sends your last question to other models, shows the answers side by side, and records which ones you mark good. Runs and picks go to an append-only JSONL file, and a review page (/quick-eval open: the Quick Eval page in Hermes Desktop on Hermes 0.22.3 or newer, or a browser page elsewhere; also a tab in hermes dashboard) shows each comparison and a model leaderboard. Disclosure: sends only your last question to the models you name, through ctx.llm and your configured providers; checks localhost ports 11434, 1234, 8000 and 8080 for local model servers; writes ~/.hermes/evals/evals.jsonl and its own section of config.yaml after you run /quick-eval allow; reads ~/.hermes/state.db read-only for the review page; /quick-eval open from a terminal serves the page on 127.0.0.1:8765 until Hermes exits (in Hermes Desktop it uses the plugin's Desktop page and starts no server); no shell commands, credentials, telemetry or self-updates."
maintainer: tikiverse
tier: community
category: models
requires_hermes: ">=0.19"
docs_url: https://github.com/tikiverse/quick-eval/tree/main/plugins/quick-eval#readme
readme: true
screenshots:
  - https://raw.githubusercontent.com/tikiverse/quick-eval/0ff4ab2f26c19820e373217721f75c98ceab734f/docs/img/demo.gif
  - https://raw.githubusercontent.com/tikiverse/quick-eval/0ff4ab2f26c19820e373217721f75c98ceab734f/docs/img/tiananmen.png
platforms: []
known_issues:
  - "Local thinking models (Qwen3 and similar) can return no answer on a server with a small default token cap: Hermes drops a custom provider's extra_body and max_tokens on plugin calls (hermes-agent#124290, #50132). Turn thinking off on the server."
capabilities:
