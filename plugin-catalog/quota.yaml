description: Per-provider quota / rate-limit status via /quota command and desktop widget. Reads precomputed quota_cache.json so the widget never does network I/O. Disclosure — refreshes your Gemini OAuth token using the Gemini CLI's client identity and queries Copilot's internal usage endpoint with VS Code client headers; the opt-in (default off) grok.com check reads local browser cookies; the opencode-go check reads the OpenCode CLI's local auth.json (read-only) for its key.
