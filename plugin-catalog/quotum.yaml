name: quotum
repo: https://github.com/qvotvm/hermes-quotum
sha: 493c749e0a02dc0357d062533e4a398b0d313ddb
description: "A quotum seat or prepaid PAYG project as a provider, with usage and dashboard records or balance and receipts. Seat 401/402 recovery hints, opt-in advisory preflight and shared meter caching. Disclosure: seat prompts and QUOTUM_SEAT_KEY go directly to api.venice.ai; seat usage, 402 guidance and optional preflight send only a 16-hex sha256 key handle to quotum.org; seat records and model catalogs are public. PAYG prompts and QUOTUM_PAYG_KEY go to quotum.org/api/payg/v1, whose gateway processes prompts and replies; authenticated meter reads return balance and receipt metadata, never the bearer to the browser. Both modes supply clients through create_client; seat X search is optional and billed per search. Credentials use only Hermes profile scope via agent.secret_scope.get_secret, without process environment or credential-file fallbacks. Seats are funded by the QUOTUM crypto token. No telemetry, shell commands, background processes or stored credentials"
maintainer: quotum
tier: community
category: models
version: "0.3.0"
requires_hermes: ">=0.21.5"
docs_url: https://github.com/qvotvm/hermes-quotum#readme
known_issues:
  - Requires agent.secret_scope.get_secret. Hosts without that API can load the plugin, but provider actions refuse credentials and the dashboard asks for a Hermes upgrade and restart.
  - Both modes supply a client through create_client and require plugins.isolation in_process (the default); host isolation is unsupported.
  - Hermes credential pools or configured fallback chains may run before terminal provider hints. Older builds without the classification hook cannot guarantee a Hermes-level stop.
  - QUOTUM_PREFLIGHT is advisory and seat-only. Missing metadata skips the warning; it never switches the model or blocks inference.
  - Set QUOTUM_SEAT_KEY or QUOTUM_PAYG_KEY; PAYG takes precedence. requires_env is empty because Hermes has no either/or declaration. Restart Hermes and its gateway after changing modes.
  - PAYG intake and model availability are controlled by the gateway. Per-request x402 intake remains closed; use prepaid project keys.
  - Hermes' bundled Achievements page has no hook for outside achievements, so the seat's seals live in the plugin's own Seals tab.
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
