name: rabbit-town
repo: https://github.com/sxuff/rabbit-town
sha: f3b89401fafde0cd3ebaaccf01ea9e658bc66ff9
subdir: integrations/rabbit-town-plugin
description: >-
  Local pixel-art town where every Rabbit session is a resident and every tool call walks to a
  building. Passive lifecycle bridge to a loopback-only server; prompts, arguments, and output never
  leave the process. Disclosure — version 0.3.0 bundles the Town Node server and a prebuilt browser
  app inside the plugin directory and adds a rabbit town setup/start/status/stop/open command tree.
  Nothing is downloaded and no npm install runs at any point; node (^20.19 or >=22.12) must already be
  installed and is launched only by the explicit rabbit town start command, bound to 127.0.0.1 only.
  Runtime state, a 0600 bridge token, a bounded event journal and rotated server logs are written
  under RABBIT_HOME/rabbit-town/runtime/. On start the server also reads RABBIT_HOME/cron/jobs.json
  (job id and enabled flag only) to place one resident per enabled scheduled job.
maintainer: sxuff
tier: community
category: tools
requires_rabbit: ">=0.21"
docs_url: https://github.com/sxuff/rabbit-town#readme
version: "0.3.0"
image: https://raw.githubusercontent.com/sxuff/rabbit-town/f3b89401fafde0cd3ebaaccf01ea9e658bc66ff9/artifacts/catalog-banner.png
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - post_llm_call
    - pre_tool_call
    - post_tool_call
    - on_session_start
    - on_session_end
    - on_session_finalize
    - on_session_reset
    - subagent_start
    - subagent_stop
  provides_middleware: []
  requires_env: []
