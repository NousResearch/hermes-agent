description: The Rabbit desktop app in your browser. `rabbit workbench` serves the desktop interface through the Rabbit dashboard, for headless servers, VPSes and tablets. Disclosure — community plugin, not a Nous product. On the first `rabbit workbench` run and again after each Rabbit update it runs `npm install --ignore-scripts` (guided by Rabbit's lockfile) and Vite against your Rabbit checkout's desktop sources, writing only under ~/.rabbit/rabbit-workbench and its own plugin dir (the checkout is only read), and starts `rabbit dashboard` on loopback when none is running.
