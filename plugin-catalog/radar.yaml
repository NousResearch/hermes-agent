title: Radar
description: "Radar — real-time Multi-Agent Squad Mission Control for Hermes across all profiles: live Bot Squad Roster with 1-click filtering, aggregate and per-session telemetry (tokens, tool calls, child subagents, git branch), safe 2-click session.interrupt RPC for runaway turns, always-on-top OS Picture-in-Picture, and English-first UI with EN/ES i18n. Strictly read-only SQLite (?mode=ro), zero external dependencies, Linux and Windows support. Disclosure — reads every local profile's state.db read-only (session titles, working directories, git branches, token and cost counts) to show them in one panel, and its stop button sends session.interrupt to a session in any profile through the Desktop's profile routes (two clicks, never automatic). No network, credentials or telemetry."
