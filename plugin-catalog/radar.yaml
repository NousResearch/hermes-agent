description: >-
  Radar — real-time Multi-Agent Squad Mission Control for Hermes across all profiles:
  live Bot Squad Roster with 1-click filtering, aggregate and per-session telemetry
  (tokens, tool calls, child subagents, git branch), safe 2-step PID interrupt (SIGTERM)
  for runaway turns, always-on-top OS Picture-in-Picture, and instant EN/ES i18n.
  Strictly read-only SQLite (?mode=ro), zero external dependencies, Linux and Windows support.
