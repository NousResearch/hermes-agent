description: "Allowlisted direct messages only, when pkiEncrypted is true. Empty allowlist answers nobody. Channel packets are never answered. TCP only. Radio approval is once only. Not tried on a physical radio. Meshtastic® is a registered trademark of Meshtastic LLC. Disclosure — one URL; no allow-all; /yolo, /approvals, always, and session refused; nodes.json stores node id, direction, bytes, and time, not the text; the session still has the text; 64-200 bytes, at most 8 chunks, at most 30 an hour; no daily cap; a chunk that may have reached the radio is not sent again in the turn; tries at about 30s and about 2.5 min are refused; gateway.delivery_ledger false stops them; v0.21.4 ignores host isolation; main does not load it; not a sandbox; no cron; tests/ shipped, not loaded; meshtastic>=2.7.9,<3."
