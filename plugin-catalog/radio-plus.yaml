description: "Live radio in the status bar with a station list you own: edit a station name and stream address, add any stream, search Radio Browser by name, country or genre, browse the Shoutcast directory, see the track each stream announces, and read a log line that explains why a stream will not play. Results load a page at a time as you scroll. Disclosure: searching and playing stations sends requests to Radio Browser, the Shoutcast directory, and the station being played, which is read for its track title."
