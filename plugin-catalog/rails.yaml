title: Rails
description: "Guardrails and decision plugin: a fast local System 1 model (d1-3B Decision Guard) decides on every turn whether the agent is only looking or changing things, flags work you did not ask for, makes code work load the matching skill and run a test before 'done', and shows every decision inline as a tag. Optional d3 vision checks the screen before a computer-use task is called done and adds decide, screen_find, screen_check and video_check tools. Disclosure — network calls only to local model servers on 127.0.0.1 (ports 8089, 8898, 8899), which receive your message, the agent's last reply, tool-call arguments, web/email tool results and screenshots; no third-party services, no telemetry, no shell commands, no stored credentials, no Python dependencies. Can hold tool calls: by default code edits and changing terminal commands are blocked until the suggested method skill is loaded, and \"done\" after code edits is refused until a test runs. computer_use_mode defaults to shadow (show only); set to on, it holds stand-in browsers, and clicks are not held when vision is down. computer_use_driver defaults to vision; text_first lets d1 pick a numbered element and d3 aim when it cannot, and cloud lets the model click on its own. Money and email actions always ask d1 and are held unless d1 confidently authorizes that specific step, including when d1 is down. Appends a decision log to <HERMES_HOME>/logs/rails.jsonl (long tokens masked); reads the newest computer-use screenshot and media passed to its tools to send them to the local vision model; checks a sibling superpowers plugin folder for skills; short-lived daemon threads for second-opinion and prompt-injection checks. Ideas (shadow mode, decision log) credited to kerpopule/hermes-jev-skills; not a fork."
maintainer: grimmjoww
tier: community
category: tools
requires_hermes: ">=0.22.3"
version: "0.4.1"
