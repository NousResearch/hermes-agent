sha: 78e77388c65f4de2b2a6526c094044266246398a
title: Rails
description: "Guardrails and decision plugin: a fast local System 1 model (d1-3B Decision Guard) decides on every turn whether the agent is only looking or changing things, flags work you did not ask for, makes code work load the matching skill and run a test before 'done', and shows every decision inline as a tag. Optional d3 vision checks the screen before a computer-use task is called done and adds decide, screen_find, screen_check and video_check tools. Disclosure — network calls only to local model servers on 127.0.0.1 (ports 8089, 8898, 8899); no third-party services, no telemetry, no shell commands, no stored credentials, no Python dependencies. Appends a decision log to <HERMES_HOME>/logs/rails.jsonl (long tokens masked); reads the newest computer-use screenshot and media passed to its tools to send them to the local vision model; reads skill names from a sibling superpowers plugin folder if present; short-lived daemon threads for second-opinion and prompt-injection checks. Ideas (shadow mode, decision log) credited to kerpopule/hermes-jev-skills; not a fork."
maintainer: grimmjoww
tier: community
category: tools
requires_hermes: ">=0.22.0"
version: "0.3.0"
docs_url: https://github.com/grimmjoww/hermes-rails
readme: true
platforms: []
known_issues:
  - Needs a local d1 decision server on 127.0.0.1:8089; when it or the optional d3 layers are off, Rails says so and does not fake a decision.
  - Built and tested on Windows.
capabilities:
  provides_tools:
    - decide
    - screen_find
    - screen_check
    - video_check
  provides_hooks:
    - pre_llm_call
    - pre_tool_call
    - pre_verify
    - post_tool_call
    - post_llm_call
    - transform_tool_result
  provides_middleware: []
  requires_env: []
