subdir: hermes-plugin/rainbowomma
title: RainbowOMMA
description: "One Mac, one human, many agents. Each Hermes profile gets a Chrome of its own with a coloured, named window frame, its own ports, processes, clipboard and document leases in Word / Excel / Acrobat / Preview. A pre_tool_call guard refuses what would hit the human or another agent before it runs (pkill Chrome, quitting Word through AppleScript, a port or a process that isn't the agent's, the human's clipboard and Chrome profile, typing while the human types) and names the tool that does it safely; a Messages/Mail send goes to Hermes's approval gate. Idle tabs, expired document leases, apps an agent launched and orphaned servers are cleaned up at session end and on a timer. With browser.cloud_provider: rainbowomma, Hermes's own browser tools drive that Chrome. /rainbow shows who holds what; /rainbow pause stops every agent at once. Disclosure — macOS only. Starts Google Chrome for the agent (own profile folder, a DevTools port on 127.0.0.1, an unpacked theme extension) and runs osascript, ps, pgrep, lsof, ioreg, open and xcrun simctl with a minimal environment (no Hermes provider keys); stops only processes that are provably the agent's, its own idle Chrome, and an Office app an agent launched and left empty. Keeps one guard helper process per profile and a housekeeping timer thread while Hermes runs. Writes its state under ~/.rainbowomma (registry, leases, a receipts log, Chrome profiles, temp copies for Word conversions); conversion outputs go only into the source document's folder, and rainbow_save_document saves in place a document the agent itself opened. When one Hermes process serves several profiles it prefixes the agent's shell commands with `export RAINBOW_AGENT=…` (modify directive; setting mark_commands). Its only request goes to 127.0.0.1 (the agent's own Chrome). No updater, no credential access."
