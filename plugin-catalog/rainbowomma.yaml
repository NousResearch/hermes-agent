# RainbowOMMA — one Mac, one human, many agents. Owner-submitted (hackathon entry).
# 31 tools, a pre_tool_call guard, a browser provider (browser.cloud_provider: rainbowomma), /rainbow, a Desktop pane.
name: rainbowomma
