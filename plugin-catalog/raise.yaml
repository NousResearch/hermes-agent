name: raise
title: Raise
repo: https://github.com/GenesisEngine-Triolith/raise
sha: e016a4f6cc8976e29702b9eaf52ecbfca3b5d32a
description: "Fundraising desk for founders: imports your investor pipeline, ranks investors on cited evidence, checks every draft against code gates (one conversation per firm, a pass closes the firm, 3 touches per channel, working-day cool-downs) and lints it against your verified claims before it reaches your mailbox as a draft. Draft-only: Raise has no send tool, and a pre_tool_call hook refuses send, reply and forward calls to pipeline addresses on mail tools and terminal commands alike. Disclosure — Raise opens no network connections; web search, page fetches, mail, CRM and LinkedIn go through the user's own Hermes tools via dispatch_tool, and LinkedIn tools get daily caps plus a 72-hour pause after a login or rate-limit error. Deck text, profile and investor facts are sent to the user's configured model through ctx.llm. Data stays in <HERMES_HOME>/plugin-data/raise (SQLite, plus checked draft files for skill-based mail setups); CSV import reads only an existing .csv at the path the user gives, never inside the Hermes folder or hidden folders. No credentials stored, no .env reads, no telemetry, no background processes; automation blueprints exist only if the user adds them. Export and delete via /raise export and /raise delete confirm. Bundles blader/humanizer v3.1.0 (MIT)."
maintainer: Triolith
