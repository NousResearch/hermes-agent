name: rariflat
title: Rariflat
description: "Shows live character reactions for tool calls, tracks local tool reliability, recommends previously observed tools for a task, and provides an opt-in failure-streak / repeated-call guard. Statistics stay local under $HERMES_HOME/plugin-data/rariflat/; no network calls, credential access, or subprocess execution."
repo: https://github.com/wadezigh96/rariflat-hermes
sha: cf782d17563ed27e6c6a42f5a19db744e375b608
version: "2.0.0"
maintainer: wadezigh96
tier: community
category: desktop
requires_hermes: ">=0.21"
capabilities:
  provides_tools:
    - rariflat_route
    - rariflat_status
    - rariflat_guard
  provides_hooks:
    - pre_tool_call
    - post_tool_call
  provides_middleware: []
  requires_env: []
