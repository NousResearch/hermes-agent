name: rariflat
title: Rariflat
description: "Live character reactions and local reliability signals for Hermes tool calls; explainable tool/skill recommendations use task fit, reliability, measured rarity, and repeated-call restraint. A local Hermes/A2A registry ranks declared capabilities and caller-supplied completion observations; it only recommends and never executes, installs, or connects to agents. The opt-in failure-streak and repeated-call guard is disabled by default. Tool arguments are inspected in memory for non-secret task tokens and repeat fingerprints; credential-like fields are filtered before learning, and raw arguments/credentials are not intentionally persisted. No network requests, telemetry, or subprocesses are initiated. Disclosure — the Desktop pane shows \"Review & install\" and \"Review A2A Agent Card\" buttons for agents the model registers; those repos and URLs are unverified, and the install button opens Hermes' plugin install dialog for that GitHub repo."
repo: https://github.com/wadezigh96/rariflat-hermes
sha: 770841abcf47ce831ef3d3035926862161034720
version: "2.0.0"
maintainer: wadezigh96
tier: community
category: desktop
requires_hermes: ">=0.22.6"
docs_url: https://github.com/wadezigh96/rariflat-hermes#readme
capabilities:
  provides_tools:
    - rariflat_route
    - rariflat_status
    - rariflat_guard
    - rariflat_agent_register
    - rariflat_agent_complete
    - rariflat_agent_rank
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - subagent_start
    - subagent_stop
  provides_middleware: []
  requires_env: []
