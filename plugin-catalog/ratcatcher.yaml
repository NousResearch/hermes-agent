name: ratcatcher
repo: https://github.com/Truthgeng/ratcatcher
sha: 41c9c676d45c6687f53588422753fc2283750331
description: "Scam bouncer for Telegram groups: removes wallet drainers, fake airdrops, fake support and DM bait, doubling scams, look-alike phishing links and admin impersonators before members or Hermes read them, mutes then bans repeat offenders, and DMs admins a report with Release and Ban buttons. Hermes can check a pasted message, report catches, edit the blocklist and release false alarms. Disclosure — deletes group messages and mutes or bans members through your own Hermes bot; sends borderline messages (only) to your current model via ctx.llm when ai_review is on; stores catches, strikes and member join times in its own plugin data; no third-party network calls."
maintainer: Truthgeng
tier: community
