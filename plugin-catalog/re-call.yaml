description: "Local agent memory with a trust verdict per recalled memory: before each turn, the memories that pass RE-call's calibrated threshold, each with its memo id and validity dates; superseded memories flagged as retired with the memo that replaced them; and an explicit abstention line when nothing clears the threshold. Facts are stored one per memo by the recall_remember tool and by mirroring the built-in memory tool, with supersession on replace; conversation turns are not captured. Disclosure: runs RE-call's own MCP server (recall-mcp, installed separately: recall-rag[fastembed,mcp]>=0.15.0) as one child process over stdio for the life of the session, with a minimal environment (RECALL_* settings, OS path, locale, model cache, proxy and CA variables; none of Hermes's keys) and its working directory in $HERMES_HOME/re-call; looks the server command up only in absolute PATH folders; by default uses the per-user Lite store <XDG_CONFIG_HOME, else ~/.config>/re-call/ (memory.db and memos/, where its own memos go under memos/hermes/), so any other agent the user sets up on that same store reads what Hermes saves and Hermes reads what it saves; keeps per-profile config.json, mirror.json, the embedding cache of memo text and server.log in $HERMES_HOME/re-call; the dsn or memo_folder settings name another store; its write tools ask Hermes's memory.write_approval gate (tools.write_approval) before each write, refuse a write Hermes would stage, and on a Hermes without that gate refuse every write while the setting is on; embeds locally with fastembed, whose model RE-call downloads from HuggingFace on first use; no other network, no telemetry, no credentials, no shell commands."
maintainer: GiulioDER
tier: community
category: memory
requires_hermes: ">=0.23.0"
version: "0.1.0"
docs_url: https://github.com/GiulioDER/RE-call/tree/master/integrations/hermes#readme
readme: true
platforms: []
known_issues:
  - "Needs RE-call 0.15.0 or later installed outside Hermes and a store created once with `recall --embedder fastembed setup --lite --memory ~/.config/re-call/memos --store ~/.config/re-call/memory.db --no-register`; until then the provider reports itself unavailable with that command"
  - "Two Hermes profiles share one memory by default; set `dsn` to keep a profile separate"
  - "A store with very few memos can stay uncalibrated; strict search then refuses and the provider shows the reason instead of recalling"
