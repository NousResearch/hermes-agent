title: Read-only mode
description: 'Ask/read-only toggle beside the Desktop composer (Cursor Ask-mode equivalent): while it is on, each send is prefixed with a read-only instruction so the agent answers from reading only, and asks before changing anything. Per-chat state, palette command, no agent tools or hooks. It is a prompt-level constraint, not a sandbox: Hermes has no session-level read-only policy, so the model can still disobey. Desktop-only (desktop/plugin.js inside the plugin SDK surface); no tools, hooks, env vars.'
