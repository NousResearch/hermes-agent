name: reapx
title: "ReapX"
repo: https://github.com/BigBossRabbit/reapx
sha: 1d465e712013b59e396ddcf39a5162d34dfb1976
description: "Turn the bookmarks you saved on X into ready-to-load, registered Hermes skills — without the paid X API. The plugin is data-in: `reapx_import` runs the whole pipeline — map, categorize into a fixed set of domains, two-track assess (integrate-into-your-makeup and business-opportunity), generate, register (`reapx:<name>`) — from a bookmarks file you point it at, or from items passed inline (collected by you through the host's own browser tooling); `reapx_status` is read-only state; `reapx_review` surfaces everything LLM-shaped item by item for the human before anything is relied on. Incremental via a persistent seen-ledger (a bookmark is never processed twice). The map / categorize / assess stages optionally run through the host LLM (`ctx.llm`, one registered auxiliary task) with a deterministic rules engine as the bit-for-bit fallback (`enrich: rules` = zero LLM calls); generate is never the LLM. Registration: handler-time `register_skill`, live in the same session; `register_generated_skills` defaults to false — generated skills land in the review and on disk, and register only after you say so. Settings are read from plugin config only (tool args can never flip enrichment, lift a spend cap, or force registration). Disclosure — derived from starlearner-nexus (same owner, different transport and engine): the plugin reads no browser credential store, ever; browser-based harvesting is a standalone script in the same repo, run by you by hand, out of the plugin surface until a consented host seam exists (we asked for one: hermes-agent issue #150960); LLM enrichment (the default; off by setting `enrich: rules`) sends bookmark text (public tweet content) through the Hermes host (`ctx.llm`) to your active provider and model with host-owned credentials — the plugin never sees or stores a key; no paid X API, no other websites, no keychain, no auth.json, no .env, no other tool's login, no telemetry; no background processes of its own (an import runs inside a bounded tool call); no stored credentials; everything written stays in its own plugin-data store, nothing uploaded (the optional LLM enrichment excepted)."
maintainer: BigBossRabbit
tier: community
category: tools
requires_hermes: ">=0.22.6"
version: "1.0.0"
platforms: []
capabilities:
  provides_tools:
    - reapx_import
    - reapx_status
    - reapx_review
  provides_hooks: []
  provides_middleware: []
  requires_env: []
