platforms: []
known_issues:
  - Scanned PDFs and images are indexed by filename only - there is no OCR, and recall_stats reports the skip reasons.
  - Ranking is lexical (BM25 plus path, recency and phrase boosts), not semantic; no embedding model is used.
  - The first index of a large folder costs roughly 16 ms per file (measured over 3,000 files of a mixed real tree).
  - Name-based filtering cannot be complete for a password written inside an ordinary document; the Hermes-home, credential-directory and virtual-filesystem rules are enforced regardless of filename.
capabilities:
  provides_tools:
    - recall_index
    - recall_search
    - recall_open
    - recall_stats
    - recall_forget
  provides_hooks:
    - pre_llm_call
    - on_session_start
  provides_middleware: []
  requires_env: []
