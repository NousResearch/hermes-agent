version: "0.1.0"
description: Recall by Polign memory provider. A new statement replaces the old one, the old one stays
  in the history, and memory can be read as of any earlier time, so the agent sees the correction, not
  just the latest value. Memories in front of each turn, extraction after it, mirroring of MEMORY.md,
  and five memory tools. Local database under the profile by default, or a recall serve you run.
  Disclosure. Each turn is sent to the extraction model named in the profile (Anthropic or OpenAI
  key from .env, or a local Ollama model); with no model, text is kept as written and nothing leaves
  the machine. On first use the recall binary downloads polign-server from dl.polign.com and checks
  it against a SHA-256 built into the binary.
