description: "Local-first layered agent memory (working / episodic / semantic) with FTS recall and retrieve-after-write tools. Disclosure — local-only memory provider with no network calls, credentials or telemetry; when selected as memory.provider it saves the first 500 characters of every user message and assistant reply, plus a copy of built-in memory writes, in plaintext SQLite at $HERMES_HOME/recalllayer/memories.db and injects matching memories into later turns; the store is shared across all sessions and users of the profile (no per-chat or per-user separation); settings in $HERMES_HOME/recalllayer.json; short background threads for capture and prefetch only."
