title: Receipts
description: "Your agent says it's done. Get the receipt. Receipts detects action and completion claims and checks observed tool history or explicit local task evidence. Each claim is supported, contradicted, unverified or not evaluable; missing evidence is never called a lie. Output: PNG, ASCII, Desktop pane or optional USB printer. Configure kits, fields, five styles, paper, branding and automatic triggers; verdicts cannot be hidden or recolored. Chat requests stay in the caller's session. Disclosure — Reads this profile's state.db conversation history and kanban.db read-only; an explicit local `hermes receipt fleet --roots` scan can read other profiles' state.db files you choose. Stores a tool-name/argument-hash ledger and receipt PNGs (containing answer excerpts, private, review before sharing) under the profile's plugin data and receipt-printer directories until you delete them. The optional `runtime.jev` classifier, off by default, sends redacted conversation context to OpenRouter; the optional USB printer path uses separately installed python-escpos."
maintainer: thedavidmurray
