name: receipts
repo: https://github.com/cirwel/hermes-receipts
sha: 6e29e03bb86ce00871a9ec081a6c3adc718e34ad
title: "Receipts: tested-tree push gate"
description: "Verification receipts tied to Git content; gates terminal pushes and PR creation on a passing check. Disclosure — runs read-only local `git` commands (rev-parse, status, ls-files, hash-object without -w) in the agent's repository on terminal tool calls, and blocks `git push` / `gh pr create` there until the user's configured check has passed on that exact content; stores receipts in a local SQLite file under the plugin data dir; no network. While Hermes multiplexed profiles are active the plugin cannot issue receipts and blocks every recognized `git push` / `gh pr create` with an explanation, including in repositories with no check configured; use a single-profile session for the gate."
maintainer: cirwel
tier: community
category: tools
requires_hermes: ">=0.22.0"
