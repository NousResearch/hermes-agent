name: recloc
title: "recloc"
version: "0.1.0"
repo: https://github.com/SomeoneElseSt/recloc
sha: 9d261c04f9c2a5b433bb00b4ccf77327f99fd1db
description: "Location reminders that never leave your phone: ask the agent to remind you at a place, and Apple Reminders alerts you when you arrive. The plugin posts a brrr notification whose subtitle is the validated address; an iOS Shortcuts automation turns it into a reminder with a When I Arrive alert, and iOS watches the geofence on-device. Nothing listens on your machine — outbound HTTPS only."
maintainer: SomeoneElseSt
tier: community
category: automation
docs_url: https://github.com/SomeoneElseSt/recloc#readme
readme: true
capabilities:
  provides_tools:
    - add_reminder
    - list_reminders
    - cancel_reminder
    - save_place
    - edit_place
    - list_places
    - remove_place
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - BRRR_WEBHOOK_URL
