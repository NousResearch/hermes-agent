platforms: []
known_issues:
  - "Hermes runs auxiliary model calls (titles, context compression, vision) without request middleware; RedactGate flags them and /redact harden turns off model-made titles, but cannot rewrite those calls."
  - "Person names are found from cue words, honorifics and a first-name list; an unusual name with no cue is missed until it is caught once in the session or added with /redact terms add."
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - transform_llm_output
    - pre_auxiliary_call
    - post_compaction
    - on_session_delete
  provides_middleware:
    - llm_request
    - tool_request
  requires_env: []
