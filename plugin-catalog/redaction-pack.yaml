sha: 3d11e09767798190b4a0c390bdd02c5be688717e
subdir: redaction-pack
description: >-
  Teaches Hermes's built-in secret redactor 53 more vendor credential formats (HashiCorp Vault,
  Doppler, Amazon Bedrock, Supabase, Tailscale, Docker Hub, JFrog Artifactory, Grafana, Sentry,
  Shopify and others) through register_redaction_patterns, so those tokens are masked in logs,
  tool output and model-bound text like the built-in ones. Disclosure — register() makes one call,
  ctx.register_redaction_patterns; no tools, hooks, network access, subprocesses, files or
  environment variables; the patterns can only add masks, and security.redact_secrets: false still
  turns redaction off.
maintainer: pierrenode
tier: community
category: tools
