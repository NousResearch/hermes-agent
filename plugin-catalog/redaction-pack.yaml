name: redaction-pack
repo: https://github.com/pierrenode/hermes-redaction-pack
sha: b007c751165347f0f66fdc2976551f38aafeb1c5
subdir: redaction-pack
description: >-
  Teaches Hermes's built-in secret redactor 45 more vendor credential formats (HashiCorp Vault,
  Doppler, Amazon Bedrock, LangSmith, Pinecone, Grafana, Sentry, Shopify, Postman and others) through
  register_redaction_patterns, so those tokens are masked in logs, tool output and model-bound text
  like the built-in ones. Disclosure — register() makes one call, ctx.register_redaction_patterns;
  no tools, hooks, network access, subprocesses, files or environment variables; the patterns can
  only add masks, and security.redact_secrets: false still turns redaction off.
maintainer: pierrenode
tier: community
category: tools
requires_hermes: ">=0.21"
