# PR path: NousResearch/hermes-agent — plugin-catalog/redgreen.yaml
# Bump sha + version together when cutting a new release.
name: redgreen
title: RedGreen
repo: https://github.com/shahaman098/hermes-redgreen
sha: c4b162c72e9555ecc7930c2a367dab6ae0ccd60d
version: "1.0.0"
description: >-
  Prove a fix with a negative control before Hermes can call it done — re-run
  the test command on the current tree and on the pre-change tree with only
  new/changed tests overlaid. Disclosure — reads the git repo, runs the agent's
  test command in isolated worktrees under the system temp directory, writes JSON
  and HTML certificates to ~/.hermes/plugin-data/redgreen/; no network calls.
maintainer: shahaman098
tier: community
category: tools
requires_hermes: ">=0.18.0"
docs_url: https://github.com/shahaman098/hermes-redgreen#readme
image: https://raw.githubusercontent.com/shahaman098/hermes-redgreen/c4b162c72e9555ecc7930c2a367dab6ae0ccd60d/assets/banner.png
screenshots:
  - https://raw.githubusercontent.com/shahaman098/hermes-redgreen/c4b162c72e9555ecc7930c2a367dab6ae0ccd60d/assets/certificate.png
known_issues:
  - Needs a git repository; outside a repo RedGreen does not gate completion.
  - Full suites run twice — use a targeted test command or raise REDGREEN_TIMEOUT on large repos.
capabilities:
  provides_tools:
    - redgreen_check
    - redgreen_status
    - redgreen_certificate
    - redgreen_history
    - redgreen_explain
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - pre_verify
    - transform_llm_output
    - on_session_end
  provides_middleware: []
  requires_env: []
