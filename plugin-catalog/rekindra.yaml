sha: "cd6a29fb9f06e892ff669d1edc249e31088763b7"
version: "0.2.0"
title: Rekindra
description: "Recover forgotten local files and rebuild them as source-backed original animated worlds. Rekindra reads a folder you name, recovers images and text (including ZIP and PDF text), keeps recovered evidence separate from the agent's interpretation, builds a 3D scene, compares its preview with the source, and holds export until flagged differences are fixed or answered with a recorded reason. Disclosure — the plugin makes no network calls of its own. It reads only the folder you name, read-only, and writes only under its Hermes plugin-data directory. Tool results, including recovered text, go to your active Hermes model like any tool result, and rekindra_plan sends selected images to that model only with send_images=true. It starts short-lived, killable child processes without a shell: an isolated Python reader for images and PDFs, and a headless installed Chrome, Edge or Chromium for previews, with a 45 second limit. It stores no credentials and leaves no background processes."
maintainer: jakeefr
tier: community
category: tools
requires_hermes: ">=0.22.7"
docs_url: https://github.com/jakeefr/rekindra/blob/cd6a29fb9f06e892ff669d1edc249e31088763b7/README.md
image: https://raw.githubusercontent.com/jakeefr/rekindra/cd6a29fb9f06e892ff669d1edc249e31088763b7/assets/rekindra-banner.png
readme: true
# Empty means all platforms. The CI matrix (Windows, Linux, macOS on Python 3.11 and 3.14) passes at 8b9924b, the last code change; this SHA adds a README-only commit. End to end is verified on Windows only, see known_issues.
platforms: []
capabilities:
  provides_tools:
    - rekindra_inspect
    - rekindra_recover
    - rekindra_status
    - rekindra_reconstruct
    - rekindra_plan
    - rekindra_build
    - rekindra_compose
    - rekindra_create_world
    - rekindra_preview
    - rekindra_export
    - rekindra_revise_world
  provides_hooks: []
  provides_middleware: []
  requires_env: []
known_issues:
  - "PDF text is read up to 32 pages and there is no OCR, so a scanned or image-only PDF gives no text."
  - "Worlds built only from notes have no tamper check yet, because the player's integrity check hashes embedded images."
  - "If some selected images have a reference and others do not, the world still builds and the unreferenced image ships with no provenance record."
  - "Palette drift compares horizontal colour bands only. It can flag a band changed on purpose and cannot judge objects, composition or motion."
  - "After three revise and preview cycles that still flag, export is allowed without reasons and the warnings are recorded as unresolved."
  - "End-to-end preview and WebM export are verified on Windows. macOS and Linux pass the core test suite in CI but have not been run end to end in Hermes."
