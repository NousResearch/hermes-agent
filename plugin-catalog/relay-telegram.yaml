description: "RELAY incoming agent calls on your Hermes Telegram bot with owner-only Accept and Reject buttons. Disclosure — the plugin resolves the owner chat from TELEGRAM_HOME_CHANNEL in the gateway environment (config.yaml fallback; optional owner_chat_id setting), listens on a local Unix socket for RELAY bridge notifications, sends call metadata through Telegram, and forwards approval decisions to the bridge's local socket. The separate RELAY CLI and bridge make outbound connections to the author's hosted relay, manage local identity keys and phonebook data, and run as a background service when installed through the repository installer."
