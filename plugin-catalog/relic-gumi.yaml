name: relic-gumi
title: RELIC Gumi
repo: https://github.com/yuzushi-dev/hermes-relic
sha: "2bd4bf060abd0663a9436fc1f3e93c9ed27d0e05"
version: "0.1.0"
description: "A companion that gets to know you and supports self-reflection, built on published psychometric instruments (TIPI for the Big Five, ECR-RS for attachment) as a self-report baseline plus consented check-ins, with an output safety critic and Telegram or Desktop onboarding. Not a diagnostic tool; based on the paper arXiv:2611.08504. Disclosure — state lives under $RELIC_HOME (default ~/.relic); the installer creates a dedicated relic-gumi profile with cron jobs that stay silent until the user consents during onboarding, creates an empty .env there that the plugin never reads or writes, and moves a plugin copy found in the base Hermes home into that profile and disables the base entry. Credentials (TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS, TELEGRAM_HOME_CHANNEL, GEMINI_API_KEY, OLLAMA_API_KEYS) are optional config_schema secrets read only with agent.secret_scope.get_secret; the plugin parses no .env file. Detached subprocesses deliver scheduled messages: the job and scoped credentials go over a private stdin pipe, and the worker inherits a minimal environment (no provider keys; proxy and CA settings pass through). Network: classifier calls default to local Ollama; conversation inference uses the configured Hermes provider; Telegram for delivery; Google Gemini/Lyria media only if the user sets RELIC_ENABLE_GOOGLE_MEDIA=1 and a key; Ollama Cloud only if explicitly configured. hermes plugins validate still lists warnings for undocumented core imports in installer and CLI paths. No telemetry, no self-updater."
maintainer: yuzushi-dev
tier: community
category: general
requires_hermes: ">=0.23.0"
docs_url: https://github.com/yuzushi-dev/hermes-relic#readme
platforms: [linux, macos]
capabilities:
  provides_tools: [gumi_read_canon, gumi_write_report, relic_continuity_candidate]
  provides_hooks: [pre_llm_call, post_llm_call, transform_llm_output, pre_gateway_dispatch]
  provides_middleware: []
  requires_env: []
