name: reliquary
title: Reliquary
repo: https://github.com/Lokee86/reliquary-hermes
sha: 0de70d170a575582aeb71ba3daff371fc0fdd42c
version: "0.1.0"
description: >-
  Local, inspectable long-term memory with source provenance, conversation capture,
  General/project REL routing, a read-only PHY identity layer, and an interactive
  relationship-driven 3D graph in Hermes. Disclosure — launches a profile-scoped
  Rust background host on authenticated loopback HTTP; reads/writes selected RELs,
  reads the selected PHY and nonsecret processing-routes JSON, and persists copied
  source text, queues, recovery state, and graph caches under the Hermes profile.
  Optional processing and retrieval send bounded queries, source excerpts, and
  Memories to explicitly configured model endpoints and can incur provider charges.
  API keys and the host token come through Hermes scoped secret routes. No telemetry
  or self-updater. The Windows native host requires a separate source build or a
  manually verified artifact from the repository's attested public build workflow.
maintainer: Lokee86
tier: community
category: memory
requires_hermes: ">=0.23.0"
docs_url: https://github.com/Lokee86/reliquary-hermes/tree/0de70d170a575582aeb71ba3daff371fc0fdd42c
screenshots:
  - https://raw.githubusercontent.com/Lokee86/reliquary-hermes/0de70d170a575582aeb71ba3daff371fc0fdd42c/assets/graph-overview.png
readme: true
platforms:
  - windows
known_issues:
  - Build the native host with scripts/build-native.ps1 before running Hermes memory setup; no executable is committed or automatically downloaded.
  - The attested CI artifact uses optimization level 1; the local source-build script retains full release optimization.
  - Processing accepts nonsecret JSON routes and a Hermes-managed API key. Reliquary CVCFG credentials and Codex subscription sign-in are unsupported in this catalog package.
  - Stock Desktop supports browsing. Desktop graph bytes, setup, and writes depend on Hermes SDK/native-admission capabilities; the web dashboard supports setup and writes.
  - Automatic capture and project routing require trusted Hermes history/project capabilities. Unsupported hosts pause automatic capture and use General memory for new sessions.
  - Imported Memories without accepted source provenance may be visible while production recall refuses them. The demo labels its imported-memory preview scenes.
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_delete
  provides_middleware: []
  requires_env: []
