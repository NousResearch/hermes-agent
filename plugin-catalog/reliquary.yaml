name: reliquary
title: Reliquary
repo: https://github.com/Lokee86/reliquary-hermes
sha: ad29b22861d49a94fd32f83f91af80e5b254536d
version: "0.3.1"
description: "Local, inspectable long-term memory with source provenance, General and project RELs, a read-only PHY identity layer, and a relationship graph. Disclosure — on Linux and macOS this package ships four CI-built native hosts. Reliquary launches the matching executable and removes the other three from its installed plugin directory after authenticated startup. The local Rust process binds authenticated loopback HTTP and can keep running after a session for recovery. It reads and writes the selected REL files, reads the selected PHY, and stores copied sources and recovery data under the active profile. Setup provisions a profile-scoped token through Hermes. Optional processing and recall send bounded queries, excerpts and Memories through configured Hermes model endpoints and can incur provider charges. Conversation capture, project routing and Desktop features depend on the Hermes host. No telemetry."
maintainer: Lokee86
tier: community
category: memory
requires_hermes: ">=0.23.0"
docs_url: https://github.com/Lokee86/reliquary-hermes/tree/ad29b22861d49a94fd32f83f91af80e5b254536d
screenshots:
  - https://raw.githubusercontent.com/Lokee86/reliquary-hermes/ad29b22861d49a94fd32f83f91af80e5b254536d/assets/graph-overview.png
readme: true
platforms:
  - windows
  - linux
  - macos
attested_binaries:
  - host/bundled/linux-x86_64/reliquary-hermes-host
  - host/bundled/linux-arm64/reliquary-hermes-host
  - host/bundled/macos-x86_64/reliquary-hermes-host
  - host/bundled/macos-arm64/reliquary-hermes-host
known_issues:
  - Linux supports x86-64 and ARM64 with glibc 2.35 or newer. macOS supports Intel and Apple Silicon on macOS 15 or newer.
  - Reinstall after moving a pruned plugin checkout to a different OS or CPU. Hermes may report the pruned executable paths as local edits on update.
  - On Windows, build the host with scripts/build-native.ps1 before running Hermes memory setup.
  - Hosted embedding requires the Hermes plugin embedding API.
  - Stock Desktop supports browsing. Graph bytes, setup, and writes depend on the Desktop SDK and native admission. The web dashboard supports setup and writes.
  - Conversation capture and project routing use trusted Hermes history and project capabilities when available.
  - Imported Memories without accepted source provenance may appear in the dashboard while production recall refuses them.
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_delete
  provides_middleware: []
  requires_env: []
