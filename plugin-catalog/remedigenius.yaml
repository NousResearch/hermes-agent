title: RemediGenius — AWS Security Triage Desk
description: >-
  Read-only AWS security triage desk on Hermes: prioritizes what Security Hub, GuardDuty and
  Inspector already found, verifies with read-only calls, and drafts IaC fixes a human approves.
  Disclosure — runs the rgtriage engine locally (subprocess or local socket), which reads AWS with
  your configured read-only credentials and keeps state in a per-profile home under your Hermes
  home (existing ~/.rgtriage installs keep it); Terraform validation needs your approval and
  installs only providers already in the module's lock file or an operator-vetted plugin dir;
  findings and chat go to the model provider you configure; local execution traces are on by
  default (RGTRIAGE_TRACES=off disables); no telemetry, no self-update.
