title: RemediGenius — AWS Security Triage Desk
description: >-
  Read-only AWS security triage desk on Hermes: prioritizes what Security Hub, GuardDuty and
  Inspector already found, verifies with read-only calls, and drafts IaC fixes a human approves.
  Disclosure — runs the rgtriage engine locally (subprocess or local socket), which reads AWS with
  your configured read-only credentials and keeps state under ~/.rgtriage; findings and chat go to
  the model provider you configure; no telemetry, no self-update.
maintainer: RajaRenga
tier: community
category: tools
