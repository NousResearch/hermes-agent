subdir: plugin
description: "Apple Reminders as a Kanban board in Hermes Desktop: pick lists, move cards between To do, Ready for Agent, In progress, Needs you and Done, and edit titles, notes, due dates, priorities and lists, saved back to Reminders, and delegate reminders to Hermes for a reviewed result. Experimental macOS preview. Disclosure — on an explicit Set up Reminders access click it compiles a small Swift EventKit helper from the plugin's own source with the local Xcode Command Line Tools (offering xcode-select --install when missing), creates a per-user self-signed code-signing certificate with /usr/bin/openssl, imports it into the login keychain and trusts it for code signing only (user domain, no system trust or Gatekeeper change), and signs the helper with it; the helper reads and writes the Apple Reminders lists the user selects, after the macOS Reminders consent prompt; setup files live in ~/Library/Application Support/reminders-kanban and the build in ~/Library/Caches/reminders-kanban; while enabled in a running gateway a background pass runs every five seconds; each delegated run is a Hermes scheduled job named 'Reminders: <task>' that the plugin creates through the public cronjob tool and removes when the run ends, running unattended on the profile's main model under approvals.cron_mode; the plugin registers two tools, reminders_kanban_finish and reminders_kanban_ask, which only accept a call from the job it started for that run; an explicit task-link setup action reads local Tailscale status and can back up and edit Hermes config or add a private Tailscale Serve route; no third-party network calls, telemetry or self-update; uses public Hermes plugin interfaces only."
maintainer: nicolasdmolina
tier: community
category: desktop
requires_hermes: ">=0.23.1"
platforms:
  - macos
docs_url: https://github.com/nicolasdmolina/hermes-reminders-kanban-plugin/blob/a6e1783d61be1e5a93e85489e2e5b46d64f899ef/docs/installation.md
