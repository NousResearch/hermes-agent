name: reminders-kanban
title: "Reminders Kanban"
version: "0.1.0-beta.4"
repo: https://github.com/nicolasdmolina/hermes-reminders-kanban-plugin
sha: cc4c7784d6976c3cd6d6ed0879356557ad451481
subdir: plugin
description: "Apple Reminders as a Kanban board in Hermes Desktop: pick lists, move cards between To do, Ready for Agent, In progress, Needs you and Done, and edit titles, notes, due dates, priorities and lists, saved back to Reminders, and delegate reminders to Hermes for a reviewed result. Experimental macOS preview. Disclosure — on an explicit Set up Reminders access click it compiles a small Swift EventKit helper from the plugin's own source with the local Xcode Command Line Tools (offering xcode-select --install when missing), creates a per-user self-signed code-signing certificate with /usr/bin/openssl, imports it into the login keychain and trusts it for code signing only (user domain, no system trust or Gatekeeper change), and signs the helper with it; the helper reads and writes the Apple Reminders lists the user selects, after the macOS Reminders consent prompt; setup files live in ~/Library/Application Support/reminders-kanban and the build in ~/Library/Caches/reminders-kanban; while enabled in a running gateway a background pass runs every five seconds; each delegated run is a Hermes scheduled job named 'Reminders: <task>' that the plugin creates through the public cronjob tool and removes when the run ends, running unattended on the profile's main model under approvals.cron_mode; the plugin registers two tools, reminders_kanban_finish and reminders_kanban_ask, which only accept a call from the job it started for that run; an explicit task-link setup action reads local Tailscale status and can set only dashboard.public_url through the Hermes CLI or add a private Tailscale Serve route; undo retains only the previous URL, not a config copy; helper and setup subprocesses receive a minimal environment without inherited provider credentials; no third-party network calls, telemetry or self-update; uses public Hermes plugin interfaces only."
maintainer: nicolasdmolina
tier: community
category: desktop
requires_hermes: ">=0.23.1"
platforms:
  - macos
docs_url: https://github.com/nicolasdmolina/hermes-reminders-kanban-plugin/blob/cc4c7784d6976c3cd6d6ed0879356557ad451481/docs/installation.md
screenshots:
  - https://raw.githubusercontent.com/nicolasdmolina/hermes-reminders-kanban-plugin/cc4c7784d6976c3cd6d6ed0879356557ad451481/docs/media/board.png
readme: true
known_issues:
  - "Needs Xcode Command Line Tools and macOS Reminders permission."
  - "Clean-account setup and iPhone-to-Mac iCloud sync are not yet verified."
capabilities:
