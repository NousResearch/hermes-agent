# This entry lets Hermes discover one reviewed version of the separately maintained package.
name: render-platform
title: Render
repo: https://github.com/ojusave/render-hermes-plugin
sha: 1d343332142c27e1b97281ff03e2811f8a083750
version: "0.1.0"
maintainer: ojusave
tier: community
category: platform
docs_url: https://github.com/ojusave/render-hermes-plugin#readme
readme: true
# The package uses portable skills and HTTPS; live validation was on macOS arm64.
platforms: []
description: >-
  Deploy, debug and manage Render applications with 20 unchanged skills from
  render-oss/skills and Render's hosted MCP connection. Disclosure: sends tool
  requests to mcp.render.com using RENDER_API_KEY from Hermes's active profile.
  Account permissions apply and resource changes can incur charges. The server
  is untrusted, so tools without a read-only annotation require approval.
  Skills can guide local file edits, shell commands and Render CLI operations.
  No custom runtime code, hooks, telemetry or self-updater. Separate from the
  Render Sandboxes terminal plugin.
known_issues:
  - "render-docker is excluded because its upstream Dockerfile cleanup example triggers a critical scanner rule."
  - "Render's list_workspaces lacks a read-only annotation and requires approval; unattended calls are denied."
  - "An existing native mcp_servers.render configuration overrides the package connection and trust setting."
# MCP tools are discovered from the remote server; the package registers no native tools or hooks.
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - RENDER_API_KEY
