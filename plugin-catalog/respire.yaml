name: respire
repo: https://github.com/risense-ai/respire-hermes
sha: 9878189578b19c98cb40162559459ecb60e4e483
version: "0.1.0"
description: "Local-first encrypted memory for Hermes through the rsrs CLI sidecar: per-turn title-tier recall, judge-then-store remember, causal-tree show, and a shared user-level library across agents. Disclosure — the plugin spawns the separately installed rsrs CLI (npm rsrs-cli@1.0.16, pinned version); the sidecar may contact rsrs.rs for sign-in, sync, model download and update checks; memory lives in ~/.rsrs and is shared across Hermes profiles; the plugin makes no HTTP calls, reads no credential stores, and has no telemetry or self-updater."
maintainer: ShiningRay
tier: community
category: memory
requires_hermes: ">=0.22.5"
docs_url: https://github.com/risense-ai/respire-hermes#readme
readme: true
platforms: [linux, macos]
title: "Respire"
known_issues:
  - "macOS: Apple Silicon only; the rsrs CLI does not ship Intel macOS builds."
  - "Requires the separately installed rsrs CLI (rsrs-cli@1.0.16); without it the provider remains unavailable."
capabilities:
  provides_tools:
    - respire_recall
    - respire_show
    - respire_remember
  provides_hooks:
    - system_prompt_block
    - prefetch
    - queue_prefetch
    - sync_turn
    - on_session_end
    - shutdown
  provides_middleware: []
  requires_env: []
