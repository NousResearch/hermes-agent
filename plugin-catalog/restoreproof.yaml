title: RestoreProof
description: "Recovery drills for real application stacks: restores a declared database backup (PostgreSQL, MySQL, MariaDB, MongoDB or SQLite) and uploads archive into an isolated Docker network, boots the app, and proves whether customers' journeys come back (every database file reference, a real user flow, recovery time and RPO), then cleans up and writes a hashed evidence report. Deterministic engine; the model never decides a verdict. Disclosure — runs the local docker CLI (argument lists, minimal environment) to create and remove containers, networks and volumes labelled restoreproof.run, each drill gated by Hermes approval bound to the contract's sha256 and the backup folder; reads the contract and backup folder you point it at (discover also reads the project folder and may write a new restoreproof.draft.yaml inside the session's working folder, never overwriting); writes evidence under its plugin data directory; only the user-typed /drill demo builds a demo app image and pulls database and probe images from Docker Hub; no network calls of its own and no telemetry."
