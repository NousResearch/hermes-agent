name: restoreproof
repo: https://github.com/Surajkumar5050/restoreproof
sha: 504d7c302ee47dba235b5e038631b783ed076e2b
title: RestoreProof
description: "Recovery drills for real application stacks: restores a declared PostgreSQL dump and uploads archive into an isolated Docker network, boots the app, and proves whether customers' journeys come back (every database file reference, a real user flow, recovery time and RPO), then cleans up and writes a hashed evidence report. Deterministic engine; the model never decides a verdict. Disclosure: runs the local docker CLI (argument lists, no shell) to create and remove containers, networks and volumes labelled restoreproof.run; reads only the backup folder and contract you point it at; writes evidence under its plugin data directory. No network calls of its own, no telemetry, never pulls images. Drills are gated by Hermes approval bound to the contract's sha256."
