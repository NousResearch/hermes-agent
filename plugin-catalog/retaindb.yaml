description: RetainDB cloud memory provider — hybrid search (vector + BM25 + reranking) over seven memory
  types, a stable user profile, explicit remember/forget tools and a shared file store. Formerly bundled with
  Hermes; maintained by Nous Research. Disclosure — conversation turns, memories and any
  file you ask it to upload are sent to the RetainDB cloud API (api.retaindb.com by default; paid
  account, RETAINDB_API_KEY).
maintainer: NousResearch
