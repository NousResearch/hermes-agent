description: "Winamp-style music, audiobook and radio player for Hermes Desktop. Disclosure — while Hermes runs it serves a token-protected API on 127.0.0.1 (Host-checked); on Linux it refuses other local accounts (via /proc/net/tcp; if that is unreadable it logs a warning and does not check), while on macOS and Windows another local account can load the player page and read the API token. It reads Hermes settings, scans `~/Music` (or the configured library folders), makes a read-only check of Music Studio's library.json and .wav folder, and keeps its library index, playlists, a credential-masked agent-activity ticker, a private rotating log and automatic 10-minute backups in its own data dir; port leases and locks live in `~/.local/state/revamp/run` (`%LOCALAPPDATA%\\revamp\\run` on Windows). It runs `git` to identify checkout builds and, at startup, `ps` to find and stop its own leftover pop-out. It contacts Radio Browser for station search (public addresses only), the stations you or the agent pick and their logo hosts, `lrclib.net` for lyrics and `api.webamp.org` / `r2.webampskins.org` for the Skin Museum; it may run low-priority `ffprobe`. The optional pop-out launches a local Chrome/Chromium with a private profile and never opens a DevTools port; on Linux it writes two desktop entries under `~/.local/share/applications` and icons in its data folder. Its hooks observe tool calls and approvals without answering or changing them; no accounts, telemetry or stored passwords."
maintainer: KeyArgo
tier: community
category: desktop
