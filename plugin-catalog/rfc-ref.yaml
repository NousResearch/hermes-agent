name: rfc-ref
repo: https://github.com/EloquentBrush0x/hermes-context-refs
sha: eb0a3913b79023464b1c06753c82a8a7324e5621
subdir: rfc-ref
description: >-
  @rfc:<number> context references: attach an IETF RFC's record from the RFC Editor to a message
  (title, status, date, authors, abstract, what it obsoletes and updates and what obsoletes or
  updates it, errata link), or one section of its text with @rfc:<number>#<section>. Disclosure —
  sends HTTPS GET requests to www.rfc-editor.org only: rfc<number>.json per reference, plus
  rfc<number>.txt for a section (the referenced RFC number leaves the machine; a section is cut
  locally); no API key, no caching, no files written, no subprocess; register() only adds the
  @rfc: reference provider.
maintainer: EloquentBrush0x
tier: community
category: web
requires_hermes: ">=0.21"
