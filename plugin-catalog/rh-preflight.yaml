sha: 9647df9009e693c5f1696b6c5458c4e9bdc3f2c3
title: rh-preflight
description: "rh-preflight by quotum with HEY Research Lab. Before Hermes Agent acts on Robinhood Chain (chain 4663), a pre_tool_call hook reads HEY Research Lab's builder record and ten Robinhood Chain projects for the addresses, agent ids, pools or repositories in the call, then applies your own rules: go, ask (a human approval prompt) or stop in detected cron by default; other asks use Hermes Agent approval, including its YOLO bypass. Unsigned transactions and wallet signing requests get a Toll simulation card with sender balance changes. The card lists each source's line with its link; builder_card and /rh-preflight read a card without acting. Desktop page shows recent checks and human answers. Disclosure — sends only the identifiers you act on to the source hosts listed in the README, plus read-only Robinhood Chain RPC, DexScreener and GeckoTerminal reads; when transaction simulation is on, the detected unsigned transaction or signing request goes to Toll (t0ll.xyz) and HookrRouter trades get a read-only Hookr pool check. Keyless and free (an optional TOLL_API_KEY, read from your Hermes Agent profile secrets, is sent only to Toll); no payments, signatures, subprocesses or writes. Stores a local SQLite ledger of checks in its own plugin data folder. The optional `python -m rh_preflight.hookr_live` command, run by hand outside Hermes Agent, reads token history from Hookr and Etherscan (api.etherscan.io) using an ETHERSCAN_API_KEY you export in your shell. Source records describe what each project published; rh-preflight does not call a token good or bad."
maintainer: quotumorg
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.5.17"
docs_url: https://github.com/quotumorg/rh-preflight/blob/9647df9009e693c5f1696b6c5458c4e9bdc3f2c3/README.md
image: https://raw.githubusercontent.com/quotumorg/rh-preflight/9647df9009e693c5f1696b6c5458c4e9bdc3f2c3/docs/banner.png
readme: true
platforms: [linux, macos]
known_issues:
  - "Fail-closed: when a source does not answer inside the shared timeout (default 4 s), the card says so and your rule may ask instead of go."
  - "Detection covers up to five addresses per call in configured action tools; tool names are matched by the tool_patterns setting."
  - "On Hermes Agent 0.23.0/0.23.1 with Tool Search on, a deferred plugin action tool called through the tool_call bridge skips pre_tool_call, so the gate does not see it; run `hermes config set tools.tool_search.enabled off` or use a newer Hermes Agent with the fix (PR #155527)."
capabilities:
  provides_tools: [builder_card]
  provides_hooks: [pre_tool_call, transform_tool_result, post_approval_response]
  provides_middleware: []
  requires_env: []
