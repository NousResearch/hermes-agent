readme: true
title: "The Rhythm Reaper"
known_issues:
  - "It refuses to write your bars on purpose — it returns a frame with bar slots and the hook placed, and the lyric is yours. Template lyrics were left out by design, not as a missing feature."
  - "Templates are not evaluations: the desk knows production specs, not how a specific model will render them. Unusual pronunciations still want a 30-second test clip before a full render."
capabilities:
  provides_tools:
    - reaper_lanes
    - reaper_lane
    - reaper_block
    - reaper_check
    - reaper_respell
  provides_hooks: []
  provides_middleware: []
  requires_env: []
