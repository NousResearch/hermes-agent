name: rhythm-reaper
repo: https://github.com/D0xedDevi0/hermes-rhythm-reaper
sha: a772a54118d45142e47566ee1d853a2837afb551
description: "A hip-hop producer desk — 41 lanes across seven families (foundational, trap, drill, melodic, alt, hard, conscious), each with the full production spec (tempo family, key centres, drum programme, low end, harmony and sample source, vocal delivery, metatag vocabulary, exclude list, generation notes) and, for any of them, a complete pasteable Suno deliverable: the style field written out with the dynamic ARC, the Exclude Styles line, a tagged lyric frame with bar targets, an energy map and a pronunciation lexicon. It validates a finished draft against the real platform limits (style <= 1000 chars, lyrics <= 3000, every section carrying a recognised structural tag, no contradictory dynamic tags in one section, a real chorus/hook, known-to-slur proper nouns left un-respelled) and enforces the two character limits in code rather than by eye. It deliberately does not generate lyrics — template bars are slop and the desk says so — it hands the writer a frame that is already correct. Disclosure — no network calls, no credentials, no shell, no subprocesses and no files written outside the plugin: the 41-lane catalog is a Python module in the repo and every tool is pure local computation, so no tool is credential-gated (a missing secret can never hide one). 55 offline tests, including a sweep asserting all 41 lanes build a deliverable that passes its own gates."
