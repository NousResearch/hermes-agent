description: "Test a price, landing page, cold email, ad, positioning, audience or channel on 100+ AI-simulated buyers through Right Suite's hosted MCP server (Streamable HTTP at https://www.rightsuite.co/api/mcp, OAuth sign-in with a Right Suite account through Hermes' own MCP OAuth, no keys in config). The user says what they sell and who buys it; a run takes about 10 to 20 minutes and returns a verdict, the objections that came up most and what to change. Paid service: plans from $4.99/month, each run costs 1 to 3 credits. Bundles the right-suite workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration and Markdown only. Disclosure: hosted-only connector with no local code; every tool call goes to www.rightsuite.co (Wednesday Solutions) with the offer, copy, ad, competitor names and audience the user asks it to test, and acts on the user's own Right Suite account. Simulated buyers are generated by AI models Right Suite calls on its side. Sign-in opens a browser to Right Suite's consent page; Hermes stores and refreshes the token and the package never reads it. get_report, list_runs and get_credits are annotated read-only; test_price, test_landing_page, test_cold_email, test_ad, find_audience, test_positioning and pick_channel are not (each starts a run and spends credits; none changes or deletes existing data). The package marks the server untrusted, so Hermes asks before each of those and refuses them in unattended runs; the sign-in step adds a same-name config.yaml entry, which replaces the package entry, so the README's entry also sets trust: untrusted. Data deletion via support@rightsuite.co; privacy https://www.rightsuite.co/privacy, terms https://www.rightsuite.co/terms. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
