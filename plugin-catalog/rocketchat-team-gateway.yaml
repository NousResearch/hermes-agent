description: >-
  Rocket.Chat gateway adapter for Hermes Agent, built for shared team rooms. Per-person sessions with
  room context since the asker's previous mention, a default-deny guard for Hermes commands, approval
  buttons, restart catch-up and duplicate suppression that survive a restart. Supports Rocket.Chat 8.7 - 9.x.
maintainer: csabatatrai-ulx
tier: community
category: platform
requires_hermes: ">=0.22.3"
