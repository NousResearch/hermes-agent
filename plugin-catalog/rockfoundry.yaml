name: rockfoundry
repo: https://github.com/ranggaoscar/rockfoundry
sha: b4dc06f8f3e3d3c72411403612b19b4a5a99d98a
subdir: hermes-plugin
title: Rock Foundry
description: "Project memory for builders who work with AI agents: a plain-language card for every repo you work on with Hermes (where it started, what is live, which of its many worktrees are hanging or safe to tidy, what must not be touched according to the repo's own AGENTS.md/CLAUDE.md/release notes, and a short history), a Projects gallery page in Hermes Desktop, a /project command, a rockfoundry skill that tells the agent to read the card before working in a project, and a rockfoundry_refresh_projects tool. Cards refresh after each session; AI summaries use the current Hermes model through ctx.llm. Disclosure: reads the project folders the user chooses (read-only; secret-looking files such as .env, *credential*, *token* and keys are never opened; repos whose local git config could run a program are skipped) and writes only to ~/.rockfoundry; runs local read-only git commands and, unless use_github = false, the user's own gh CLI to read pull-request status (gh uses its own login; the plugin never reads tokens or credential files); network only through gh (GitHub) and the user's Hermes model; background threads rescan touched projects after a session and on refresh; no telemetry; no cron is created (/project schedule only prints a hermes cron create command)."
maintainer: ranggaoscar
tier: community
category: desktop
requires_hermes: ">=0.23.3"
docs_url: https://github.com/ranggaoscar/rockfoundry#readme
version: "2.0.0"
image: https://raw.githubusercontent.com/ranggaoscar/rockfoundry/b4dc06f8f3e3d3c72411403612b19b4a5a99d98a/docs/images/banner.png
screenshots:
  - https://raw.githubusercontent.com/ranggaoscar/rockfoundry/b4dc06f8f3e3d3c72411403612b19b4a5a99d98a/docs/images/gallery.png
  - https://raw.githubusercontent.com/ranggaoscar/rockfoundry/b4dc06f8f3e3d3c72411403612b19b4a5a99d98a/docs/images/project.png
known_issues:
  - After installing or updating, restart the Hermes gateway (hermes gateway restart); a Desktop Rescan only reloads the Projects page.
  - Sessions are linked to a project through the file paths Hermes tools touch; terminal-only work is not linked.
capabilities:
  provides_tools:
    - rockfoundry_refresh_projects
  provides_hooks:
    - post_tool_call
    - on_session_end
  provides_middleware: []
  requires_env: []
