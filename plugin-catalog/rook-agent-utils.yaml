description: "Pay-per-call wallet utilities over one remote MCP server - gas timing, USDC spend report (x402/MPP), verifiable drand draws, x402 seller launch check. Disclosure — every tool call (including wallet addresses, entrant lists and seller URLs you pass) goes to agent-utils.agent-arena-base.workers.dev, a server run by the plugin author; paid tools cost $0.001-$0.05 in USDC per call and charge only when your client attaches an x402 (Base) or MPP (Tempo) payment; the package declares a $0.25 per-chat spend limit that Hermes enforces with an approval prompt."
maintainer: zColdWater
tier: community
category: tools
title: Rook Agent Utils
version: "1.0.0"
readme: true
known_issues:
  - Paid tools charge $0.001-$0.05 in USDC per call (x402 on Base or MPP on Tempo); an unpaid call returns the price and charges nothing.
  - Portable Agent Plugins package (plugin.json + skills/ + mcp.json); no Python entrypoint.
requires_hermes: ">=0.22.3"
