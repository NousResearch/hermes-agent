name: rosegold
repo: https://github.com/rosegold-app/hermes-plugin
sha: 40fcf0d169d83b263bd142c75e2d1c2856ad1fc1
description: "Get offers and rewards matched to what you buy on Amazon, including discount codes, promo codes and influencer codes. Hermes shares the order details in your Amazon order confirmations with rosegold, then looks up the offers, creator codes and spending rosegold has for you. rosegold reads order confirmations from Amazon, limited to order number, email id, date, total, and each item's title, quantity and price; it does not read your address, payment details or any other emails. Portable Agent Plugins v1 package (mcp.json only); hosted MCP server with three tools, sign-in by emailed code over OAuth, no API key; one command after install (see known issues). Disclosure — every tool call goes to rosegold.app, and the remote tools are not covered by the pin; the tools ask the agent to search the user's Gmail, with Hermes's own Gmail tool, for Amazon order confirmations, and to send rosegold each email's id and date and each order's number, items and prices; a look-up brings the user's offers and spending into the chat; under the default trust the tools run without an approval prompt; Hermes keeps the OAuth token."
maintainer: rosegold
