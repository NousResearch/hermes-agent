subdir: integrations/hermes
title: rply
description: "rply gateway platform: talk to Hermes from the rply inbox on your phone and laptop, with web push. Messages and files both ways, seen/working/done with a live activity note, clarify questions and command approvals as tappable questions, cron delivery, a pinned table of scheduled jobs, a dashboard app with run/pause/resume, and an rply_request_secret tool that saves API keys to the profile's .env without the value passing through the chat. Each profile joins the channel as its own agent. Disclosure: keeps a long-polling connection to the configured rply server only (RPLY_SERVER, default https://app.rply.sh; self-hostable, AGPL server); messages the channel's members send reach Hermes as user instructions; reads Hermes' cron jobs and session list and runs, pauses or resumes jobs when the dashboard's buttons are pressed; stores the agent token in the profile's .env, an X25519 keypair in <profile>/rply/secret-key.json (0600) and secrets the human provides in the profile's .env; the secret tool waits up to 15 minutes for the human and refuses under cron; credentials read through Hermes' profile-scoped route; no shell commands, no telemetry, no self-update."
maintainer: joshuaKnauber
tier: community
category: platform
requires_hermes: ">=0.22.2"
docs_url: https://rply.sh/docs/integrations/hermes/
version: "0.7.0"
capabilities:
  provides_tools:
    - rply_request_secret
  provides_hooks: []
  provides_middleware: []
  requires_env: []
