description: "NVIDIA RTX Remix Toolkit control through the Toolkit's local MCP server: open and close mod
  projects, read and edit the layer stack, find prims, textures and model instances, replace textures and
  references, and ingest model and material assets. Needs an NVIDIA GPU; the install is refused on a machine
  without one. The Toolkit is a package you unpack anywhere, so Hermes does not check that it is installed;
  the tools appear while the Toolkit, windowed or through its headless launcher, serves MCP on
  127.0.0.1:8012. Disclosure: the tools change the open Remix project and write layer and asset files on
  this machine; nothing leaves loopback."
