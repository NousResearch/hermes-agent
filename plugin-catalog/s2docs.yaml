subdir: plugin
version: "0.1.2"
description: >-
  Source 2 documentation and mod tooling for CS2 and Deadlock from a local index of Valve's own game
  data: convars, Hammer entities with their inputs and outputs, schema classes and enums, game events,
  the cs_script and Pulse APIs and Source2Wiki pages, plus the mod pipeline — scaffold addons, validate
  scripts and .cfg files, start map builds on a registered Windows host over SSH, deploy and verify
  hashes, and record evidence, test runs and job state. Needs uv and an index built with s2docs sync;
  every write-capable call asks for approval. Disclosure — nothing is sent to a third party, it SSHes
  only to hosts you register, writes its own index and addon workspace, and build runs it starts
  outlive the session by design (a map compile takes minutes).
