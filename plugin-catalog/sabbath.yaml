name: sabbath
repo: https://github.com/ponzgpt/sabbath
sha: cb20a4edbe3783e9b2ebd2898f30f9f39937f6ea
description: "Your agent never rests. Now it rests with you. Once a week (say Saturday 18:00, for 24 hours) Hermes keeps a day of rest with you: it says goodnight on your phone, pauses its own scheduled jobs (except the ones you exempt), keeps you company in anything but work and offers to set aside what can wait, then sends one gentle digest when the rest ends while the jobs catch up. /sabbath ox lifts it for an hour when something truly can't wait. Desktop page with your week at a glance; /sabbath on every chat surface; try a two-minute Sabbath. Disclosure — pauses and resumes the user's Hermes cron jobs through Hermes' cronjob_manage tool (resuming only the jobs it paused); sends a goodnight and a digest to the chat the user sets by running Hermes' own `hermes send` CLI with the text over stdin; adds rest context to each turn while resting; stores its state in plain text under $HERMES_HOME/plugin-data/sabbath; no telemetry."
maintainer: ponzgpt
tier: community
category: general
requires_hermes: ">=0.23.0"
docs_url: https://github.com/ponzgpt/sabbath
version: "0.2.0"
