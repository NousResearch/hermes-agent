name: salts-secrets
title: Salt's Secrets
repo: https://github.com/dotv-7/salts-secrets-plugin
sha: a038ecfcea5d0a5006dd6ffd8841a3933c7c04fd
subdir: salts_secrets
description: "Let strangers talk to your Hermes without reaching your private memory. Only your own DM reaches your profile; everyone else (strangers' DMs, groups, channels, threads, the web) is answered by a separate public profile with its own sessions, an empty working directory, a fail-closed tool allowlist with no file, terminal, memory or session tools, and only the facts, documents and methods you approved, one click per item. Dashboard tab to review, rewrite, publish and revoke; revoking purges the guest sessions that saw the item. Disclosure — setup creates profiles/public, turns on gateway.multiplex_profiles and stores the public profile's API key as SALTS_PUBLIC_API_KEY through Hermes secrets; guest messages are forwarded over loopback to the same gateway's /p/public/v1 API; the Context tab reads the owner's memory, USER.md, skills, session history and configured workspace folders to list them (owner only); Classify and Draft send item text to the owner's own configured model, only when the owner clicks; revocation runs `hermes sessions delete` on the public profile; writes approvals, receipts and a routing heartbeat under plugin-data/salts-secrets. No telemetry."
maintainer: dotv-7
tier: community
category: platform
requires_hermes: ">=0.23.0"
docs_url: https://github.com/dotv-7/salts-secrets-plugin#readme
version: "0.3.0"
platforms: []
known_issues:
  - "Needs the API server enabled and plugins.isolation: in_process; `hermes salts-secrets setup` checks both and prints the fix."
  - Platform guests get no streaming and no media (one reply per message).
  - Group chats share one guest session, and the owner is treated as a guest there.
capabilities:
  provides_tools:
    - public_notes_lookup
    - salt_propose_public
  provides_hooks:
    - pre_gateway_dispatch
    - pre_tool_call
    - post_tool_call
  provides_middleware: []
  requires_env:
    - SALTS_PUBLIC_API_KEY
