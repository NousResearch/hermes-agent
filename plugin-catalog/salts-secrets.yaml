name: salts-secrets
title: Salt's Secrets
repo: https://github.com/dotv-7/salts-secrets-plugin
sha: 09c1b426b08e41380a47233c4f3cead36a017ecf
subdir: salts_secrets
description: "Let strangers talk to your Hermes without reaching your private memory. Built on Hermes' own gateway.profile_routes: only your own DM reaches your profile; everyone else (strangers' DMs, groups, channels, threads, the web) is answered by a separate public profile with its own sessions, an empty working directory, a fail-closed tool allowlist with no file, terminal, memory or session tools, and only the facts, documents and methods you approved, one click per item. Dashboard tab to review, rewrite, publish and revoke; revoking an item deletes every guest session (the store cannot tell which session saw it), and a reply being written at that moment is replaced with an ask-again notice. Disclosure — setup creates profiles/public, turns on gateway.multiplex_profiles, writes gateway.profile_routes named salts-secrets:* (your Telegram/Discord id to your profile, a platform catch-all to the public one) with TELEGRAM_ALLOW_ALL_USERS / DISCORD_ALLOW_ALL_USERS (and adds * to DISCORD_ALLOWED_USERS when that list names users, because the Discord adapter checks it before any route), stores the public profile's API key as SALTS_PUBLIC_API_KEY through Hermes secrets (and generates the owner profile's API_SERVER_KEY when it is shorter than 16 characters), and installs this plugin into the public profile with `hermes -p public plugins install ... --enable --yes-deps` at the owner copy's revision (with --force for a non-catalog source or an existing copy); messages the routes leave in your profile that are not your DM (your Discord server messages, unrouted platforms) are answered after admission (post_gateway_admission) by the same gateway's /p/public/v1 API over loopback; deliveries on your own signed webhook routes are not chat and go to your agent, as without the plugin; each guest gets 20 messages an hour (guest_rate_per_hour); the Context tab reads the owner's memory, USER.md, skills, session history and configured workspace folders to list them (owner only); opening the Context tab applies local rules only; Classify and Draft send item text to the owner's own configured model, only when the owner clicks; revocation runs `hermes sessions delete` on the public profile, and a guest session it could not delete is never resumed (the guest moves to a fresh session) and `sync` exits 1; writes approvals, tool-call receipts, the last revocation time and a routing heartbeat under plugin-data/salts-secrets. No telemetry."
maintainer: dotv-7
tier: community
category: platform
requires_hermes: ">=0.23.0"
docs_url: https://github.com/dotv-7/salts-secrets-plugin#readme
version: "0.6.1"
platforms: []
known_issues:
  - "Needs the API server enabled and plugins.isolation: in_process; `hermes salts-secrets setup` checks both and prints the fix."
  - Guests the routes cannot place (your own Discord server messages, platforms other than Telegram and Discord) are answered over loopback as text, with no streaming or media.
  - Group chats share one guest session, and the owner is treated as a guest there.
capabilities:
  provides_tools:
    - public_notes_lookup
    - salt_propose_public
  provides_hooks:
    - pre_gateway_dispatch
    - post_gateway_admission
    - pre_tool_call
    - post_tool_call
    - pre_llm_call
    - transform_llm_output
  provides_middleware: []
  requires_env:
    - SALTS_PUBLIC_API_KEY
