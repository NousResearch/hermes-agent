name: sampler
title: Sampler
repo: https://github.com/salch-cred/sampler
sha: 67995d13ba97af418547262e462304c0990a0a57
description: >-
  Set temperature and top_p for your Hermes agent (hermes-agent#17565): a
  default, first-match rules by platform, model or provider, and a per-session
  override with /sampler. Works through llm_request middleware on OpenAI-
  compatible, Anthropic and Bedrock Converse requests. Models Hermes itself
  sends without a temperature, such as reasoning models, are never changed.
  No model calls, network, files or dependencies.

maintainer: salch-cred
tier: community
category: models
requires_hermes: ">=0.23.0"
docs_url: https://github.com/salch-cred/sampler
version: "0.1.0"
image: https://raw.githubusercontent.com/salch-cred/sampler/acabf65e57f3306e1eb522ad08f3020f5b6e565d/docs/assets/catalog.jpg

capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: [llm_request]
  requires_env: []
