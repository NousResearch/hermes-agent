sha: 4f4d51375560ef0aa30af6b2938143a1327b6d35
version: "0.2.1"
description: >-
  Relational memory provider backed by a knowledge graph (MillenniumDB or any
  SPARQL endpoint): multi-hop recall with provenance on every fact, an ontology
  that infers subsumption (Incidente ⊑ Evento) at reindex time, per-fact weights
  that are reinforced by use and decay with disuse, and explicit conflict
  reporting — when two values disagree, the agent says so instead of guessing.
  Onboarding backfills the graph from the sessions the agent already had
  (state.db, read-only) and reconciles new entities against existing ones.
  Disclosure — with session-end extraction enabled (default), the plugin sends
  the recent turns of a session to the user's own model through ctx.llm
  (host-owned credentials, no provider override) to extract facts; nothing else
  leaves the machine. No telemetry. The graph endpoint defaults to loopback and
  is the only other network call.
