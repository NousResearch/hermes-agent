known_issues:
- "Sign-in needs one extra command after install, because a portable plugin cannot declare an OAuth MCP server: hermes mcp add sapiens --url https://www.sapiensinteticos.com/api/mcp/mcp --auth oauth --connect-timeout 300. Then set trust: untrusted on mcp_servers.sapiens in config.yaml, so Hermes asks before each generation, publish or delete call."
- "A new user needs a Sapiens Sintéticos account; the sign-in page links to the invite request."
