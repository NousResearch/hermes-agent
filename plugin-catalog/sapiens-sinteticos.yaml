description: "Operate your Sapiens Sintéticos account from Hermes: images, video, music, voice, characters, your repertoire and the members' forum, through the hosted Sapiens MCP server (Streamable HTTP, OAuth 2.1 + DCR), with the 18 house skills bundled (prompting rules, engine choice, cost traps, publishing flows). Portable Agent Plugins v1 package (skills/ only; the server is added by the sign-in command below). Disclosure: hosted-only connector with no local code; every tool call goes to the Sapiens server at https://www.sapiensinteticos.com/api/mcp/mcp. Generation tools debit Sinapses, the prepaid credit of the user's Sapiens account; the skills tell the agent to check the balance first and to confirm with the user before a video, the most expensive generation. Publishing tools post to the members' forum and to social accounts the user connected on Sapiens, only when asked. Sapiens Sintéticos is a members' lab: a new user requests an invite on the site. The skills are written in Brazilian Portuguese. The server and its OAuth sign-in are added with `hermes mcp add sapiens --url https://www.sapiensinteticos.com/api/mcp/mcp --auth oauth --connect-timeout 300`; the README then has the user set `trust: untrusted` on mcp_servers.sapiens, so Hermes asks before each generation, publish or delete call. In companion mode the agent tells the user once per session before keeping notes in their Sapiens notebook, and skips them if they say no."
