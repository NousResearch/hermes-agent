name: scalekit
title: Scalekit
repo: https://github.com/scalekit-inc/hermes-tools
sha: 35bfcedf59442377a930c4c3ed1c818ca425c11a
description: >-
  Call any Scalekit connector from Hermes: 500+ connectors and 20,000+ tools.
  Disclosure — HTTP calls go to the Scalekit environment URL you paste; the
  three Scalekit values are read with get_secret; one person id is stored at
  plugin-data/scalekit/identifier; the model can request an approval link, run
  a named tool, or proxy one HTTP request. Provider tokens stay in Scalekit;
  no shell, no background process, no telemetry.
maintainer: scalekit-inc
tier: community
category: tools
requires_hermes: ">=0.19.0"
docs_url: https://github.com/scalekit-inc/hermes-tools#readme
version: "0.1.0"
image: https://raw.githubusercontent.com/scalekit-inc/hermes-tools/35bfcedf59442377a930c4c3ed1c818ca425c11a/screenshots/catalog-card.png
screenshots:
  - https://raw.githubusercontent.com/scalekit-inc/hermes-tools/35bfcedf59442377a930c4c3ed1c818ca425c11a/screenshots/01-plugin-installed-and-enabled.png
  - https://raw.githubusercontent.com/scalekit-inc/hermes-tools/35bfcedf59442377a930c4c3ed1c818ca425c11a/screenshots/02-list-connections.png
  - https://raw.githubusercontent.com/scalekit-inc/hermes-tools/35bfcedf59442377a930c4c3ed1c818ca425c11a/screenshots/03-github-connected.png
  - https://raw.githubusercontent.com/scalekit-inc/hermes-tools/35bfcedf59442377a930c4c3ed1c818ca425c11a/screenshots/04-github-profile.png
capabilities:
  provides_tools:
    - scalekit_authorize
    - scalekit_execute_tool
    - scalekit_list_connections
    - scalekit_proxy
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - SCALEKIT_CLIENT_ID
    - SCALEKIT_CLIENT_SECRET
    - SCALEKIT_ENVIRONMENT_URL
