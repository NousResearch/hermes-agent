name: scalekit
title: Scalekit
repo: https://github.com/scalekit-inc/hermes-tools
sha: ff6e65128c558ccbf3e34c365aec6b4fbf80fd7b
description: >-
  Call any Scalekit connector from Hermes: 500+ connectors and 20,000+ tools.
  Disclosure — HTTP calls go to the Scalekit environment URL you paste; the
  three Scalekit values are read with get_secret; one person id is stored at
  plugin-data/scalekit/identifier; the model can request an approval link, run
  a named tool, or proxy one HTTP request. It also bundles the hermes-delegated-auth skill. Provider tokens stay in Scalekit;
  no shell, no background process, no telemetry.
maintainer: scalekit-inc
tier: community
category: tools
requires_hermes: ">=0.19.0"
docs_url: https://github.com/scalekit-inc/hermes-tools#readme
version: "0.1.0"
image: https://raw.githubusercontent.com/scalekit-inc/hermes-tools/ff6e65128c558ccbf3e34c365aec6b4fbf80fd7b/screenshots/catalog-card.png
screenshots:
  - https://raw.githubusercontent.com/scalekit-inc/hermes-tools/ff6e65128c558ccbf3e34c365aec6b4fbf80fd7b/screenshots/01-plugin-installed-and-enabled.png
  - https://raw.githubusercontent.com/scalekit-inc/hermes-tools/ff6e65128c558ccbf3e34c365aec6b4fbf80fd7b/screenshots/02-list-connections.png
  - https://raw.githubusercontent.com/scalekit-inc/hermes-tools/ff6e65128c558ccbf3e34c365aec6b4fbf80fd7b/screenshots/03-github-connected.png
  - https://raw.githubusercontent.com/scalekit-inc/hermes-tools/ff6e65128c558ccbf3e34c365aec6b4fbf80fd7b/screenshots/04-github-profile.png
capabilities:
  provides_tools:
    - scalekit_authorize
    - scalekit_execute_tool
    - scalekit_list_connections
    - scalekit_proxy
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - SCALEKIT_CLIENT_ID
    - SCALEKIT_CLIENT_SECRET
    - SCALEKIT_ENVIRONMENT_URL
known_issues:
  - "Hermes cannot install scalekit-sdk-python into its own environment. The package needs setuptools below 83, and Hermes pins setuptools 83. Install the package with uv into the Python that runs hermes before you enable the plugin."
