description: "Scaleway Generative APIs as a Hermes model provider (`--provider scaleway`, alias `scw`): European, OpenAI-compatible, pay-per-use, with a curated tool-calling model list led by deepseek-v4.1-flash-1017 (the default), the cheapest vision-capable aux model, and the live /v1/models catalog in the picker. The credential is SCW_SECRET_KEY, the same secret key the Scaleway CLI and SDKs use; because it is ambient, the provider is never auto-detected and turns on only when explicitly selected. Disclosure — model provider; prompts, tool schemas and SCW_SECRET_KEY go to api.scaleway.ai (or SCALEWAY_BASE_URL), plus a GET /v1/models catalog probe with the same key"
