description: "Scaleway Generative APIs as a Hermes model provider (`--provider scaleway`, alias `scw`): European, OpenAI-compatible, pay-per-use, with a curated tool-calling model list led by deepseek-v4.1-flash-1017 (the default) that stands in when the live catalog probe fails, the cheapest vision-capable aux model, and real context windows and pricing through models.dev. The credential is SCW_SECRET_KEY, the same secret key the Scaleway CLI and SDKs use; because it is ambient, the provider is never auto-detected and turns on only when explicitly selected. Disclosure — model provider; prompts, tool schemas and SCW_SECRET_KEY go to api.scaleway.ai (or SCALEWAY_BASE_URL), plus a GET /v1/models catalog probe with the same key"
maintainer: scaleway
tier: community
category: models
requires_hermes: ">=0.22.6"
