description: "Public social media data through ScrapeIO's hosted MCP server (Streamable HTTP at https://scrapeio.com/mcp): profiles, posts, videos, comments, transcripts, search, trends and ad libraries from TikTok, Instagram, YouTube, X, Facebook, Reddit, LinkedIn and more, as one normalized JSON shape. 85 tools plus list_endpoints and call_endpoint for the long tail, and a bundled scrapeio skill for picking endpoints and paging. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to scrapeio.com with the user's SCRAPEIO_API_KEY (set through the plugin's secret field) and spends credits from the user's ScrapeIO account; cached and failed calls are free. Every tool is annotated read-only and never posts to any platform. ScrapeIO logs which endpoint each key calls, for billing. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
