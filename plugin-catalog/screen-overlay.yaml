version: "0.2.1"
title: Screen Overlay
description: "Hermes points at things on your real Windows screen: a gliding drawn pointer, spotlights, boxes, arrows and numbered steps anchored to live UI Automation elements, a floating step guide with Next and Back, and handwritten glass notes. Click-through, never takes focus, DPI- and multi-monitor-aware, with an emergency clear hotkey (Ctrl+Alt+Shift+F12). Disclosure — Windows only. Starts one detached background process (the overlay, run by Hermes's own Python) on first use; it exits on the hotkey, on stop, or after 10 idle minutes. No network: the plugin and the overlay talk over a local named pipe with a random key. Reads monitor layout, visible window titles, process names and bounds, and UI Automation names, types and bounds of elements in the window you target; these appear in tool results and so reach the model Hermes is using. Takes no screenshots, logs no keys, never moves the mouse or types, reads no credential or config files. Writes only to its plugin-data folder (pipe key, pid, logs, saved guides). Registers the global hotkey Ctrl+Alt+Shift+F12 while the overlay runs. While a guide is open it looks up the current step's target about once a second. Installs PySide6-Essentials (about 215 MB) and comtypes. No telemetry, no self-update, no paid APIs."
