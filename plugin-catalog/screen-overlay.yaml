known_issues:
  - "Windows 10 2004+ or Windows 11 only; on other platforms the tool is hidden."
  - "Cannot draw over exclusive-fullscreen games, and UI Automation is blocked for apps running as administrator; use a window or rect target for those."
  - "Sticky notes last until closed or the overlay stops; they are not saved across a restart."
  - "The overlay is hidden from screenshots and recordings by default; turn off exclude_from_capture to record it."
