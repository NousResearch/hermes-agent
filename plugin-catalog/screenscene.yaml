name: screenscene
title: ScreenScene
repo: https://github.com/solocreativeone/screenscene
sha: 111e781820cb0e1597ca67c0511ad09beb8e93f9
description: "Narrated explainer video generator using screenshots, narration, and animation. Disclosure — sends each beat's narration text to api.elevenlabs.io with your ElevenLabs key; runs your installed manim, ffmpeg and ffprobe as subprocesses with a minimal environment (manim executes a scene script the plugin generates); reads the image file the agent names; writes the final MP4 to ~/screenscene_output, outside the Hermes profile."
maintainer: solocreativeone
tier: community
category: tools
requires_hermes: ">=0.20.5"
docs_url: https://github.com/solocreativeone/screenscene#readme
version: "0.2.1"
platforms: []
capabilities:
  provides_tools:
    - screenscene_render
  requires_env:
    - ELEVENLABS_API_KEY
  provides_hooks: []
  provides_middleware: []
