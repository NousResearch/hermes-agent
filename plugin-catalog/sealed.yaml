sha: 112a504ff9d3ba4ecfee63dca086707826b2fa7b
subdir: plugins/sealed
version: "1.0.0"
description: >-
  Secret source that keeps provider credentials in one AES-256-GCM encrypted file instead
  of plaintext .env: a 32-byte key file unlocks the store at startup and the Hermes secret
  orchestrator applies the values, so precedence and provenance behave like any other
  source. Ships `hermes sealed init/set/unset/list/status/rotate/import`; values are read
  from a prompt or stdin and are never printed or passed in argv. Disclosure — no network,
  no helper CLI, no subprocesses. Reads the configured store and key file only (default
  $HERMES_HOME/secrets/sealed.{store,key}, both 0600); refuses to load when a file is
  group/world readable if secrets.sealed.strict_permissions is on. The CLI writes those
  two paths (plus .bak copies on init --force and rotate) and `import` reads the plaintext
  file the user names without modifying it. No telemetry, no self-updater, no daemon.
  Requires the `cryptography` package, declared as a plugin dependency.
maintainer: kailashrajh
tier: community
category: security
requires_hermes: ">=0.22.0"
