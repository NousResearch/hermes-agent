  - https://raw.githubusercontent.com/zaxcoraider/hermes-second-hands/b9cd7437726b8452ea697d226174fdaf8597ea03/docs/alert-lithium.png
  - https://raw.githubusercontent.com/zaxcoraider/hermes-second-hands/b9cd7437726b8452ea697d226174fdaf8597ea03/docs/report.png
  - https://raw.githubusercontent.com/zaxcoraider/hermes-second-hands/b9cd7437726b8452ea697d226174fdaf8597ea03/docs/chat-card-done.png
