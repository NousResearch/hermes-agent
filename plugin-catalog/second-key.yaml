title: "second-key"
readme: true
capabilities:
  provides_tools: []
  provides_hooks:
    - "pre_approval_request"
    - "pre_gateway_dispatch"
    - "pre_tool_call"
  provides_middleware: []
  requires_env:
    - "SECONDKEY_TELEGRAM_BOT_TOKEN"
