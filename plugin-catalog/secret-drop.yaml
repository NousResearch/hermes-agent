name: secret-drop
repo: https://github.com/Goitonthefloor/hermes-secret-drop
sha: 616924a369fa376338f30e8c87fb6bb7521db602
description: 'Give Hermes a secret without putting the value in the chat or the model context. Disclosure — the value is stored in plaintext in the profile .env (mode 0600). The model references it as {{secret:NAME}} and a pre_tool_call hook substitutes the value in terminal and execute_code arguments in memory, immediately before the call runs, so the value is not in the transcript, the prompt or the provider request. The same hook refuses any command that names the store, refuses a bare environment dump (env, printenv, set, /proc/self/environ) while names are stored, and keeps stored names out of terminal.env_passthrough, so a command cannot read a value through $NAME. A call that does name a stored variable registers that value as a needle for the single call, so even a short or word-like value is scrubbed from its output. Tool output is scrubbed of stored values and their common encodings. What it does not do: it is not a sandbox for the effects of a command the model writes, and both guards are denylists — a command that assembles a name at runtime is still covered only by output scrubbing, which substitutes known values. Adds a static system-prompt section, a /secret command and a desktop drop dialog. An optional username can be entered beside the value and is stored as NAME_USER; it is injectable through an alias but never used as a global output needle. Imports private core helpers read-only (_config_profile_scope, _is_hermes_provider_credential, _CONFIG_LOCK, env_passthrough internals).'
maintainer: Goitonthefloor
tier: community
category: desktop
version: "1.6.0"
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_start
    - pre_tool_call
    - transform_terminal_output
    - transform_tool_result
  provides_middleware: []
  requires_env: []
