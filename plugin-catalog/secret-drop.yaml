name: secret-drop
repo: https://github.com/Goitonthefloor/hermes-secret-drop
sha: b4a4d56f231bf7b77a4243a7c8bd06d4016c5733
description: 'Give Hermes a secret without putting the value in the chat or the model context. Disclosure — the value is stored in plaintext in the profile .env (mode 0600).
  The model references it as {{secret:NAME}} and a pre_tool_call hook substitutes the value in terminal and execute_code arguments in memory, immediately before the
  call runs, so the value is not in the transcript, the prompt or the provider request. The same hook refuses any command that names the store, and tool output is
  scrubbed of stored values and their common encodings. What it does not do: it is not a sandbox for the effects of a command the model writes, and the read guard is
  a denylist — a command that reaches the store indirectly is still covered only by output scrubbing, which substitutes known values. Adds a static system-prompt
  section, a /secret command and a desktop drop dialog. Imports private core helpers read-only (_config_profile_scope, _is_hermes_provider_credential, _CONFIG_LOCK).'
maintainer: Goitonthefloor
tier: community
category: desktop
version: "1.5.0"
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_start
    - pre_tool_call
    - transform_terminal_output
    - transform_tool_result
  provides_middleware: []
  requires_env: []
