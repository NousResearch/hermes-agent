name: secret-drop
repo: https://github.com/Goitonthefloor/hermes-secret-drop
sha: 60c890a96fe4fb66336089a776c70813d586aea1
description: "Give Hermes a secret without the value appearing in the chat. Disclosure — the value is stored in plaintext in the profile .env (mode 0600), and storing narrows the file to that mode itself instead of inheriting whatever mode it finds. The model references it as {{secret:NAME}}; a pre_tool_call hook substitutes the value in terminal and execute_code arguments in memory, immediately before the call runs, so the transcript, the prompt and the provider request carry the alias. The same hook guards the store as a whole: every string argument of every tool is inspected, including tools it does not know by name; write payloads are walked into nested edits; directory arguments such as workdir are resolved, and a persisted cwd into the profile home is refused; wildcard spellings are compared with the guarded file names; and a path is resolved before a name is matched, so a symlink alias does not slip through. A command that names the store, a bare environment dump, and a mutation aimed at the profile home are refused. Tool output is scrubbed of stored values, of credential-shaped environment entries and of credential values kept in the profile config file, in their common encodings. What it does not do: it is not a sandbox for the effects of a command the model writes, and the guards are denylists - a value that is short or word-like is stored but not searched for globally, and a program that reassembles a value is covered only by scrubbing of the values it knows. The desktop dialog and its nine locale bundles promise the chat, not model-inaccessibility. Adds a static system-prompt section, a /secret command and a desktop drop dialog. An optional username can be entered beside the value and is stored as NAME_USER; it is injectable through an alias but never used as a global output needle. Only a name this plugin wrote as a username is treated that way, tracked in an account index that belongs to the guarded store, so a secret the user stores directly under a NAME_USER name stays a credential whose value is scrubbed. Imports private core helpers read-only (_config_profile_scope, _is_hermes_provider_credential, _CONFIG_LOCK). On every session start it rewrites config.yaml to drop stored names from terminal.env_passthrough (migration from versions before 1.5.1), and it reads credential-shaped values from the profile config.yaml only to use them as output-scrub needles. A substituted value still leaves the host with whatever the command sends, and core's local tool-completion display receives the resolved arguments. Optional Vaultwarden backend: with a Bitwarden-compatible vault configured in the plugins hub (backend, vault URL and the two login values as secret fields), a stored secret becomes a login item there and the alias resolves from the vault; the file store stays the default."
maintainer: Goitonthefloor
tier: community
category: desktop
version: "1.7.1"
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_start
    - pre_tool_call
    - transform_terminal_output
    - transform_tool_result
  provides_middleware: []
  requires_env: []
