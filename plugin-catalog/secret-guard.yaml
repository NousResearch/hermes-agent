name: secret-guard
repo: https://github.com/ChasClogston/hermes-secret-guard
sha: b823a9ebeca0847a6c7a5bd73f0678d6b4657924
description: "Enter API keys through a hidden dialog into the macOS keychain, never chat; block and scrub secrets before any model sees them. Disclosure — Secret Guard stores the keys you enter in your macOS login keychain as `hermes-<ENV_VAR>` items created with `-T /usr/bin/security`, so any process running as your user can read them without a prompt; it runs `/usr/bin/security` and `/usr/bin/osascript` (hidden-input dialog), observes every tool call, tool result, terminal output and model reply to block or redact registered secrets, keeps a names-and-fingerprints-only registry under the Hermes root, and makes no network calls."
maintainer: ChasClogston
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "1.0.0"
platforms: [macos]
title: Secret Guard
image: "https://raw.githubusercontent.com/ChasClogston/hermes-secret-guard/b823a9ebeca0847a6c7a5bd73f0678d6b4657924/docs/banner.png"
