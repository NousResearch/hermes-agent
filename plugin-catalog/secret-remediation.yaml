name: secret-remediation
repo: https://github.com/AdrianTanz/hermes-secret-remediation
# Plugin commit. Merge this branch with a merge commit so this sha stays
# reachable from main. A squash or rebase merge drops it.
sha: "f43333f9bf8c160bda172ba7f7d05150a7794833"
description: Fingerprint leaked credentials in the Hermes workspace, logs, and session history. Redacts them, blocks the turn, and gives text-only rotation advice.
maintainer: AdrianTanz
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://github.com/AdrianTanz/hermes-secret-remediation
version: "0.1.0"
title: secret-remediation
platforms: []
known_issues:
  - "After a block, the plugin tries to replace credential text in state.db messages.display_metadata.withheld_prompt, state.db session_admissions.payload_json, and spawn-ledger.json argv with a fingerprint placeholder. payload_digest is recomputed, so replaying the original request is refused. That is expected. A failed attempt is logged and the plaintext can remain. Hermes can write the value again after the short retry window."
  - "Purge writes by default, including shell history outside Hermes and chat history. Opt out with --no-sessions, --no-messages, --no-shell-history, --no-backups, --no-vacuum, including on scan --purge. A blocked-turn /retry reads withheld_prompt. The content, api_content, tool_calls, and display_metadata rewrite is separate, so a replayed tool call sends the placeholder. payload_digest is recomputed and an original replay is refused. VACUUM is skipped and named incomplete when state.db or its WAL is open. backups/pre-update-*.zip and backups/pre-migration-*.zip are counted and not rewritten. Provider logs, Time Machine, and cloud sync are not cleared. Close other shells first, or run history -c, or a running shell can write history back on exit. History mtime is kept."
  - "Detects known token prefixes, PEM blocks including a BEGIN line with no END, equals-assignments named password, api_key, or secret (8 or more characters), URL userinfo for a fixed scheme list, and Authorization Bearer tokens. Unlabelled AWS secrets are detected only when the 40-character token contains + or / and is not hex, and that shape is not registered with Hermes's redactor. Encoded, split, Authorization Basic, colon assignments, and all-hex 40-character strings can pass."
  - "The scheduled scan prints only new fingerprints. A clean tick is silent."
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - pre_tool_call
    - transform_tool_result
    - transform_terminal_output
    - transform_llm_output
  provides_middleware: []
  requires_env: []
