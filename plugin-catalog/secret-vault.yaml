name: secret-vault
repo: https://github.com/jimmy77733/secret-vault
sha: 71fc4dad1fac13e9f98793af7c87bbdde1bce1dd
subdir: ""
description: "Keeps API keys and other secrets out of the model's context on gateway chats (Telegram, Discord, …): detected values become {{SECRET:name}} placeholders, are resolved only at tool time, and are redacted from tool/model output. Per-profile vault at <hermes_home>/secret-vault/vault.bin (Windows DPAPI CurrentUser; filekey-dev elsewhere for tests only). /secret set|list|rm|show-placeholder. Limits — CLI, TUI and Desktop input is not scrubbed (no rewrite hook in Hermes v0.23); detection is heuristic and can miss or over-flag; original platform messages (e.g. Telegram) are not deleted and must be removed by you."
maintainer: jimmy77733
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.1.2"
image: https://raw.githubusercontent.com/jimmy77733/secret-vault/71fc4dad1fac13e9f98793af7c87bbdde1bce1dd/assets/cover.png
screenshots:
  - https://raw.githubusercontent.com/jimmy77733/secret-vault/71fc4dad1fac13e9f98793af7c87bbdde1bce1dd/assets/screenshots/01-telegram-test.png
capabilities:
  provides_tools: []
  provides_hooks: [pre_gateway_dispatch, post_gateway_admission, pre_tool_call, transform_tool_result, transform_terminal_output, transform_llm_output]
  requires_env: []
