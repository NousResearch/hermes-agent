name: secretshield
repo: https://github.com/Whydiriki700/secretshield
sha: d3561130502cf8f773c01574bef79d870cf5a52d
title: SecretShield
description: "Credentials stop at the tool boundary. Scans every tool call's arguments before dispatch and every finished reply before delivery for credential material (vendor API keys, GitHub/AWS/Google/Slack/Stripe tokens, PEM private keys, JWTs, bearer credentials, passwords in assignments), blocks the call or redacts the value fail-closed, and appends every attempt to a local incident ledger that stores only metadata (kind, length, masked preview), never the secret. Disclosure — SecretShield observes all tool call arguments, tool results and final replies in profiles where it is enabled and scans them locally; in the default enforce mode a detection blocks the tool call and a reply containing a credential is redacted with a notice; reply streaming is held until the reply is complete while it is enabled; it stores only detection metadata under $HERMES_HOME/secretshield/ and makes no network calls."
maintainer: Whydiriki700
tier: community
category: tools
version: "0.1.1"
requires_hermes: ">=0.22.0"
docs_url: https://github.com/Whydiriki700/secretshield
platforms: []
capabilities:
  provides_tools:
    - shield_status
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - pre_llm_call
    - transform_llm_output
  provides_middleware: []
  requires_env: []
