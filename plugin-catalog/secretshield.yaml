name: secretshield
repo: https://github.com/Whydiriki700/secretshield
sha: 6e135326d8547d048b89a57daf428887f008c7be
title: SecretShield
description: "Credentials stop at the tool boundary. Scans every tool call's arguments before dispatch and every finished reply before delivery for credential material (vendor API keys, GitHub/AWS/Google/Slack/Stripe tokens, PEM private keys, JWTs, bearer credentials, passwords in assignments), blocks the call or redacts the value fail-closed, and appends every attempt to a local incident ledger that stores only metadata (kind, length, masked preview), never the secret. Disclosure: observes all tool call arguments, tool results, and final replies in profiles where it is enabled in order to scan them locally; stores only detection metadata under $HERMES_HOME/secretshield/; makes no network calls; in the default enforce mode a detection blocks the tool call outright, and a reply containing a credential is redacted with a notice appended before delivery."
maintainer: Whydiriki700
tier: community
category: tools
version: "0.1.0"
requires_hermes: ">=0.22.0"
docs_url: https://github.com/Whydiriki700/secretshield
platforms: []
capabilities:
  provides_tools:
    - shield_status
  provides_hooks:
    - pre_tool_call
    - post_tool_call
    - pre_llm_call
    - transform_llm_output
  provides_middleware: []
  requires_env: []
