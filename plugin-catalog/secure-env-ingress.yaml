name: secure-env-ingress
repo: https://github.com/web3blind/hermes-secure-env-plugin
sha: 8874c96fb85bd09aae680ae88c9b3c16c22ee5ae
subdir: secure_env_ingress
description: "One-use HTTPS forms for missing .env secrets and native encrypted Browser Vault login/TOTP/card storage; retained exact-parent login, saved TOTP, protected payment fields, transient codes and approved secret operations outside chat and model input. Browser destinations follow native Vault classification, origins and stamped-control selection, with bounded frame/Shadow extensions and asynchronous owner/profile/lease/cancellation checks. No CSS/history locks, sibling-tab fallback, core override or login backend registration. Disclosure — in-process internal Hermes Vault, browser, gateway, redaction and config APIs can break on host updates; setup instructions require approval for privileged host/TLS changes; TLS listens on all interfaces by default; the gateway hook observes messages for sender binding. Native encrypted card storage includes CVC. Site input callbacks can authorize or auto-submit; unknown outcomes need external verification before retry. SHA-256-pinned administrator-allowlisted operation consumers run unsandboxed with gateway privileges, none enabled by default; cancellation cannot stop an already-running consumer. Links authorize their holder, not submitter identity. Explicit .env ingress adds approved missing keys; setup bootstrap reads selected-profile .env owner IDs."
maintainer: web3blind
tier: community
category: tools
version: "0.8.7"
requires_hermes: ">=0.22.2"
docs_url: https://github.com/web3blind/hermes-secure-env-plugin/blob/8874c96fb85bd09aae680ae88c9b3c16c22ee5ae/README.md
platforms: [linux]
known_issues:
  - "In-process plugin using internal Hermes Vault/browser/gateway/redaction/config APIs; those dependencies can break on host updates."
  - "Runtime security scan is CAUTION: approved privileged setup instructions, fixed-argv OpenSSL verification, and payment Luhn digit reversal; administrative repository root is not the catalog payload."
  - "One-use links authorize their holder. Native card storage includes CVC; site input callbacks may authorize or submit. Verify unknown write outcomes before retry."
  - "Maintainer policy review required under catalog rule 11: explicit add-only .env ingress reads/writes the selected-profile file; setup bootstrap directly reads .env owner IDs. No exemption is claimed. Allowlisted operation consumers execute unsandboxed with gateway privileges."
capabilities:
  provides_tools: [secure_env_vault, secure_login_fill, secure_payment_fill, secure_operation]
  provides_hooks: [pre_gateway_dispatch]
  provides_middleware: []
  requires_env: []
