name: selenite
title: Selenite
repo: https://github.com/KyaniteLabs/selenite
sha: 6603e379c8ae7fedb95e827ec95781f1e1dd77af
description: "Takes friction off the person, treated as accessibility: one test, \"does this step, wait or check earn its cost to you?\", applied to steps handed to a person, agents parking Kanban work on each other for reasons that aren't real, and checks that can't change the decision. Calm mode switches the agent to no questions and one-line replies when your messages show overload. A read-only cleanse ranks what to clear across skills, plugins, hooks, approvals, runbooks and boards. Walls always stand: credentials, spend, publishing, destructive steps, legal, named freezes. Adds /frictionless, a selenite_ledger tool, two fake-gate tools, skills, a Desktop page and a dashboard tab. Disclosure — no network, no credentials and no shell from the plugin itself; hooks add a context note in Calm mode, and in fake_gate_mode \"nudge\" (default) or \"ask\" they add a note to, or hand back once with a question, a kanban_block that reads as agent bureaucracy (they never approve, unblock, close or edit a card, and any error fails open); when you approve a safe command once or for the session, its approval key is logged as an allowlist candidate (denials, timeouts and dangerous commands are never logged); writes a metadata-only ledger (no block reasons or prompt text, 0600, rotates at 4 MB), per-card question counts and a counts-only snapshot under plugin-data/antibeaurocracy/, and reports under the Selenite state directory (SELENITE_STATE, else XDG state, else HERMES_HOME); reads kanban.db read-only; the cleanse pass (the selenite_ledger tool, the Desktop page and the dashboard tab can run it) reads, read-only, the hook commands in ~/.claude/settings.json, the skill folders of Claude Code, Codex, OpenCode and ~/.agents, and Hermes plugin manifests; the `hermes antibeaurocracy audit` CLI also reads agent rule files (~/.claude/CLAUDE.md, ~/.codex/AGENTS.md, ~/.gemini/GEMINI.md) and the SOUL.md/AGENTS.md of every Hermes home and profile; the bundled frictionless skill's miner script, when the agent runs it, reads your own messages from local agent transcripts (Claude Code, Codex and Hermes state.db, all read-only) and keeps only counts plus a few redacted samples, 0600, in that state directory; the CLI's opt-in --judge runs a command you name, the plugin never does; all hooks turn off with hooks: false or SELENITE_HOOKS=0."
maintainer: KyaniteLabs
tier: community
category: automation
requires_hermes: ">=0.23.0"
version: "0.5.0"
docs_url: https://github.com/KyaniteLabs/selenite/blob/6603e379c8ae7fedb95e827ec95781f1e1dd77af/README.md
readme: true
image: https://raw.githubusercontent.com/KyaniteLabs/selenite/6603e379c8ae7fedb95e827ec95781f1e1dd77af/docs/banner.png
platforms: [linux]  # add macos once the Mac capture runs it
known_issues:
  - "Loads on the next gateway restart. Disable a standalone antibeaurocracy plugin first, or the fake-gate hooks run twice."
  - "The fake-gate classifier is deterministic and phrase-based; text it has no evidence for is recorded, never nudged or asked."
  - "Pedantry is a skill only; it is not counted in the cleanse ranking yet."
  - "Badges for cards a person unblocks or archives clear within about a minute (Hermes fires no hook for either; Selenite checks the board read-only)."
  - "Tested on Linux; macOS and Windows unverified."
capabilities:
  provides_tools: [selenite_ledger, bureaucracy_classify, bureaucracy_audit]
  provides_hooks: [pre_llm_call, post_approval_response, kanban_task_blocked, kanban_task_completed, on_kanban_task_updated, pre_tool_call, transform_tool_result, on_kanban_dispatch_tick]
  provides_middleware: []
  requires_env: []
