name: semantic-search
title: Semantic Search
repo: https://github.com/Shizoqua/hermes-semantic-search
sha: f5085fbacdc3b750a22749ab51607b87b8ea9701
version: "0.1.0"
description: "Search a folder of local notes, docs or code by meaning with one tool, semantic_search. Files are split into overlapping chunks, embedded through any OpenAI-compatible /embeddings endpoint (a local Ollama server by default) and ranked by cosine similarity; an incremental SQLite index re-embeds only changed files. Standard library only. Disclosure: sends file chunks and search queries to the configured embeddings endpoint (localhost by default; a hosted endpoint receives the text of the files searched); reads text files under the folder the model names, skipping hidden, dependency, binary and oversized files and every path Hermes's file tools refuse; writes only its index under the plugin's data folder; an optional API key is read through Hermes's secret store."
maintainer: Shizoqua
tier: community
category: tools
