description: "Approval cards for outgoing messages: before the agent sends an email, Discord/Slack message, LinkedIn/SMS DM or X post, it shows an inline card (::preview) with the recipients and exact text, editable in place, with Discard and a Send split pill; after sending, the card collapses into a 'Sent' pill. Portable Agent Plugins v1 package (skills/ only, two stdlib Python scripts). Disclosure: the skill tells the agent to send only after you tap Send on the card or give a clear yes; that approval is an instruction to the model, not a Hermes approval prompt, and Hermes does not block a send that skips the card. Allow rules and 'Disable drafts' (set from the Send menu, stored by draft_rules.py in HERMES_HOME/draft_rules.json) let the agent send without showing a card at all. Sending uses your existing Hermes tools; card buttons send fixed prompts back as your message via data-hermes-send / window.hermes.send; the scripts make no network calls, read only the draft JSON and any local image files it lists, and write one HTML file plus draft_rules.json; the rendered card loads remote images only when the draft includes them (an icon such as www.google.com/s2/favicons, X image URLs, and, only with the opt-in avatar: unavatar, the X profile photo from the third-party unavatar.io); no credentials, telemetry or background processes. Not affiliated with the separate draft-cards entry."
