name: sentinel-governance
version: "0.7.0"
repo: https://github.com/ChasClogston/hermes-sentinel
sha: 79bc73e227f948f5ff5e803cb48cc1234bf9f1e9
description: "Audit-first Hermes tool governance with profile settings, profile-local policy, exact tool rules and per-event native approval. Settings enforce cannot be loosened by the environment; once resolved, enforce stays on per profile/process until restart. Unknown allow/approval requires named tools excluding terminal/execute_code. Known read_file/search_files/write_file/patch calls receive pre-rule credential/governance path checks and require canonical absolute regular-file targets; directory/default-path searches and ambiguous aliases are refused. Ordinary allowed file alternatives proceed without asking. Other tools remain whole-tool operator trust decisions; arguments/capabilities are not inspected beyond the disclosed file checks. Disclosure — runtime inspects arguments and file metadata, reads configuration/policy and a local audit key, and writes argument-free decision records plus HMAC-signed mode-change/policy-failure records under the active Hermes home (sentinel/). It starts no network calls/subprocesses and reads no external credential contents. Report shows sanitized counts/current policy health; another plugin can veto a Sentinel allow. User-invoked replay copies raw selected history DB/WAL/journal files into 0700 temporary directories with 0600 files, uses an isolated worker and returns counts only; it writes no Sentinel journal events. Current profile is default; --all-profiles is explicit. Copy/scan budget is two seconds with 2,000 calls/20,000 messages/200 sessions; full database copy cost and retained-history limits apply. macOS uses validated per-user system temp outside HOME/profiles, otherwise /tmp; Linux uses /tmp, ignoring TMPDIR/XDG_RUNTIME_DIR. Normal/timeout/signal shutdown cleans snapshots; killing both processes, power loss or filesystem errors may leave private files. Later replay sweeps eligible marked, unleased, owner-only leftovers older than 60 seconds; unmarked directories remain. Deletion is not secure erasure. Audit defaults to no veto, but host hook timeouts can block. Enforcement is restrictive; filename heuristics are partial and can overmatch benign names. Opaque tools, remote backends, filesystem races and same-privilege/key holders are outside these protections; local HMACs are not an append-only guarantee. Experimental, not a firewall or sandbox."
maintainer: ChasClogston
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/ChasClogston/hermes-sentinel#readme
platforms: [macos, linux]
capabilities:
  provides_tools: []
  provides_hooks: [pre_tool_call]
  provides_middleware: []
  requires_env: []
