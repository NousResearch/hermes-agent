name: sentinel-governance
version: "0.6.0"
repo: https://github.com/ChasClogston/hermes-sentinel
sha: 0b989bd4fc6843b3d8b2b96ef6a74c17c41aaad2
description: "Audit-first tool-action governance for Hermes with a conservative terminal classifier, per-event native approval, and a sanitized decision journal. Disclosure — the runtime hook inspects proposed tool arguments in memory and writes an HMAC-keyed, argument-free journal and a locally generated 0600 key under the active Hermes home (sentinel/). The hook initiates no network calls or subprocesses and reads no external credentials. The user-invoked sentinel-governance replay CLI reads raw stored tool arguments from selected Hermes state.db files through public read-only SessionDB APIs. It defaults to the current profile and requires --all-profiles to include other profiles. A temporary worker returns aggregate counts only, with a two-second worker budget and caps of 2,000 calls, 2,000 messages and 200 sessions. Replay writes no Sentinel journal entries or history copies; incomplete samples are labeled. Historical paths are evaluated against the current filesystem. Audit mode is default and never vetoes. Opt-in enforcement via SENTINEL_GOVERNANCE_MODE (or legacy HERMES_SENTINEL_MODE) blocks unclassified calls, including non-terminal tools, and requests approval for recognized curl -q requests/uploads and test runs. Refusals permit alternatives covered by existing authorization. Experimental, disruptive enforcement; not a firewall or sandbox."
maintainer: ChasClogston
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/ChasClogston/hermes-sentinel#readme
platforms: [macos, linux]
capabilities:
  provides_tools: []
  provides_hooks: [pre_tool_call]
  provides_middleware: []
  requires_env: []
