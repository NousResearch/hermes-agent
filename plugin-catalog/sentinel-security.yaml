name: sentinel-security
title: Sentinel Security
description: "Scans scripts before the agent runs them and blocks, asks for approval, or allows them; also hashes files. Disclosure: reads script files referenced in tool calls; appends a local audit log (sentinel-audit.jsonl); sends only a file's SHA-256 (never its contents) to virustotal.com, and only if a VT_API_KEY is configured."
repo: https://github.com/Cogkreates/Sentinel-Security
sha: 75bb23ab1b7a3d35f4e175926964e9568ef8a59c
version: "1.1.1"
requires_hermes: ">=0.23.0"
tier: community
category: tools
maintainer: Cogkreates
capabilities:
  tools:
    - analyze_file
    - scan_script
  hooks:
    - pre_tool_call
