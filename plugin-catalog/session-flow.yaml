name: session-flow
repo: https://github.com/agantila/session-flow
sha: 6eebf540453e6b8b7f508a16d8205ff3c6ad0dcb
description: >-
  Smooth line-by-line chat animation, Ctrl+Scroll session cycling,
  Firefox-style session groups, glass readability for the composer,
  sidebar-style content tabs and full personalization — six features
  in a single plain-ESM plugin, all live-configurable from a built-in
  settings page. Plain ESM, no build step, no dependencies, one file.
  Disclosure — pure UI layer (pane, settings page, sidebar nav, palette
  commands, i18n): reads Hermes's gateway state and atom feeds
  (`projects.tree`, `projects.list`, `session.active_list`, `session.list`,
  `session.context_breakdown`, `session.title`, focused-session state) and
  the REST mirror `GET /api/sessions` (pinned state); writes
  `session.cwd.set` / `session.workspace.move` / `session.create` and the
  localStorage key `hermes.desktop.projectScope` (when the user picks a
  project in the composer chip); stores its own settings under
  `~/.hermes/cache/desktop-plugins/session-flow/`. No outbound network
  calls, no telemetry, no credentials read or stored, no shell commands.
  All timers are ctx-owned intervals disposed on unload (live-session
  poll ~30 s, session refresh ~45 s, project cache + nav status 60 s,
  activity expiry 30 s, composer-chip sync 2.5 s, lightweight UI sync
  2–5 s).
maintainer: AGANTILA — Deniz Yilmaz
