description: "Read-only observability for Hermes Desktop: what each session cost and why, its full trace, recurring tool failures, every profile at a glance, provider quotas and service balances, model comparison with cheaper-route evidence, and instruction-rule grading. Disclosure — reads every profile's state.db read-only, the Hermes agent logs, config.yaml and .env key names; calls only the usage or balance endpoints of the providers and services you have configured, with the credential Hermes already holds (each host listed in the README); runs the local monid CLI when it is installed; an Anthropic usage probe (one one-token Claude message) is off by default; Grok, Codex and Nous Portal readings go through Hermes' own login code, which may renew Hermes' own logins. Writes nothing and sends no session content anywhere."
