description: "Read-only observability for Hermes Desktop: what each session and turn cost and why, its full trace, recurring tool failures, every profile at a glance, provider quotas and service balances, system prompt weight and prompt-cache health, cron run history, gateway restarts, model comparison with cheaper-route evidence, and instruction-rule grading. Disclosure — reads every profile's state.db read-only plus agent logs, cron records, gateway state, skills/.usage.json, cache/prompt_cache_routes.json and config.yaml; API keys only through agent.secret_scope.get_secret (names declared under optional_env); subscription sign-ins are read only by Hermes' own agent.account_usage, never held by the plugin; calls only each configured vendor's usage or balance endpoint (hosts listed in the README) and sends no inference request; the desktop asks Hermes' model.options (cached, refresh off) for rate-limit holds; runs the local monid CLI when installed; never opens .env, auth.json or another tool's login; writes no Hermes state and sends no session content anywhere."
