name: session-mirror
repo: https://github.com/rrrrnmtsu/hermes-session-mirror
sha: 0632482c5bc24ea0be7fc4262ee9afc65586ca8b
description: >-
  Mirrors Hermes Desktop, CLI, TUI and ACP conversations into Discord: one public thread per session in a
  channel you choose, one post per turn (your message and the reply), so work started on a desktop
  can be followed from the phone. Posting runs on a background thread and never delays or breaks a turn.
  Disclosure — register() adds one post_llm_call hook; every turn's text is sent to the Discord REST API
  (discord.com) using the bot token you configure, after Hermes's redact_for_egress plus a local
  token-pattern filter (fail-closed: nothing is sent if the redactor is unavailable); mentions are disabled and tool calls/outputs are not sent. The token is read via
  agent.secret_scope or the environment; an optional token_command (empty by default, never run unless
  you set it) can print the token from a password-manager CLI. Session-to-thread ids are stored (mode 0600) in
  $HERMES_HOME/state/session-mirror.json. The optional `hermes session-mirror backfill` CLI command reads $HERMES_HOME/state.db read-only and replays past sessions through the same redaction. No other files, telemetry or long-running processes beyond one
  daemon sender thread.
maintainer: rrrrnmtsu
tier: community
category: platform
requires_hermes: ">=0.21"
docs_url: https://github.com/rrrrnmtsu/hermes-session-mirror
version: "0.4.0"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
  - post_llm_call
  provides_middleware: []
  requires_env: []
