title: "Session Receipts: session flight recorder + weekly process digest"
description: >-
  Session Receipts turns a Hermes session, a date range, or a kanban card's evidence chain into
  one self-contained offline HTML document: the original ask, every tool call as a timed node,
  failures and retries exactly as recorded (never collapsed into the success that followed),
  per-model token spend, and the cost Hermes recorded, with a reconciliation delta. A client
  theme renders the same data as a paper document for sharing; `--redact` writes a share-safe
  copy with a redaction manifest (secrets, emails, user paths, IPs, phones, plus a user word
  list); and `receipts rollup --since 7d` aggregates a window into a deterministic weekly
  digest: failure taxonomy, cost by model and card, slowest tools by p50/p95, retry hotspots,
  week-over-week deltas. Standard library only; reads the local session store and kanban
  boards read-only; no network, no credentials, no new dependencies. Disclosure — a receipt
  contains the session's real text; secret masking is pattern-based (a safety net, not a
  guarantee), and shared copies should be reviewed before they leave the machine.
maintainer: Ryan O'Mara
