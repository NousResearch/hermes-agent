name: session-relay
version: "0.2.1"
repo: https://github.com/ikuro4kin-dev/hermes-session-relay
sha: caf3e4a2e2bb14ef67605b2c661b11d848381a7d
title: Session Relay
description: "Hands a long-running conversation over to a fresh session before the context window fills up: a ⚡ chip in the status bar shows live context usage, and at the threshold (45% by default) the agent writes a hand-off note while the plugin opens a new chat, seeded with that note as its first message and named after the current one (+1). On Telegram and other messaging platforms the gateway half provides a session_relay_handoff tool and injects the note that chat prepared into the new session after /new. Disclosure: each relay runs one extra agent turn and therefore uses model tokens."
maintainer: ikuro4kin-dev
tier: community
category: desktop
requires_hermes: ">=0.22.0"
docs_url: https://github.com/ikuro4kin-dev/hermes-session-relay#readme
readme: true
platforms: []
image: https://raw.githubusercontent.com/ikuro4kin-dev/hermes-session-relay/caf3e4a2e2bb14ef67605b2c661b11d848381a7d/assets/banner.png
screenshots:
  - https://raw.githubusercontent.com/ikuro4kin-dev/hermes-session-relay/caf3e4a2e2bb14ef67605b2c661b11d848381a7d/assets/status-bar.png
capabilities:
  provides_tools:
    - session_relay_handoff
  provides_hooks:
    - on_session_reset
  provides_middleware: []
  requires_env: []
