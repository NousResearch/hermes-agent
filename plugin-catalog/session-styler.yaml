description: Style the Hermes Desktop session list — per-conversation icons from a ✦ menu on every row,
  a status mark beside them, colors, sizes and match rules, with branch children inheriting their
  parent's icon. Settings are mirrored into the active profile so a new machine restores them on load,
  and every load reports itself to the profile under a per-machine key. Arabic + English, follows the
  app's language.
