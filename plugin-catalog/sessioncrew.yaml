version: "0.2.0"
description: "Browse sessions and related projects across profiles in a Hermes Desktop side panel, with observed activity, completion reminders, and project creation. Disclosure — the backend reads every profile under the Hermes data root, not only profiles that enabled the plugin: profile.yaml display fields, gateway_state.json, processes.json and each state.db opened read-only (session, turn-lease, admission, worker and delegation metadata plus token/cost aggregates; only the profile label is kept from delegation task JSON; no conversation message bodies). Folder browsing, folder creation and non-overwriting IDEA.md writes run on the gateway filesystem from the user's own dialog and are not confined to the Hermes root (the Hermes root and common credential directories are refused). Creating sessions or generating a project idea runs on the selected profile and sends the project name to that profile's configured model provider. On POSIX systems a liveness fallback may run `ps -o state= -p <pid>` without a shell. No credential-store reads, telemetry, self-updater or separate listener."
maintainer: harukaxxxx
