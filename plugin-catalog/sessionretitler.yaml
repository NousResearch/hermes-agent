subdir: public/sessionretitler
description: "Keeps the session list readable as the topic drifts. Every 10 titleable user messages by default, retitles the session from the latest exchanges, then again as the interval elapses. A title you set yourself is never overwritten. Disclosure: writes the new title through the published persistence interface because no plugin SDK title-write seam exists yet; an unreadable title source skips the write and a failed write is logged."
maintainer: apoapostolov
tier: community
category: desktop
docs_url: https://github.com/apoapostolov/hermes-agent-awesome-plugins/tree/main/public/sessionretitler
version: "1.1.4"
image: https://raw.githubusercontent.com/apoapostolov/hermes-agent-awesome-plugins/a547a12ff0b4fcf44d614d0ddbd167bc71faa6c8/public/sessionretitler/docs/hero.png
platforms: []
capabilities:
  provides_tools: []
  provides_hooks:
