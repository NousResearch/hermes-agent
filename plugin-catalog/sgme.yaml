subdir: adapters/hermes
version: "1.10.5"
description: "SGME (拾光记忆) self-hosted long-term memory engine — tagged memories with provenance, per-turn recall, automatic session refinement, a skills library, wiki knowledge base, care signals, communication roles and a three-pool task system (ideas/demands/projects), all behind one HTTP service you own. The plugin is a thin bridge: no LLM, no database, everything heavy runs in your SGME server (local or remote). Disclosure — the plugin talks only to the SGME server you configure (default http://127.0.0.1:9910, env SGME_BASE_URL for remote); credentials are read through Hermes's secret scope (env names SGME_AGENT_KEY / SGME_ADMIN_KEY, never written to disk); session turns are appended to your SGME server and refined into memories at session end (an LLM you configure on the SGME side does the distilling); no third-party services, no telemetry."
maintainer: freehul
tier: community
category: memory
requires_hermes: ">=0.22.0"
