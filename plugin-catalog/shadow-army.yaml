platforms: [linux, macos]
known_issues:
  - Refuses only the agent's kanban_complete tool and asks only on its terminal git push and gh pr create; manual board moves, other shell commands, aliases and disabling the plugin bypass it.
capabilities:
  provides_tools: [army_gate, army_verdict]
  provides_hooks: [pre_tool_call, post_tool_call, subagent_start, subagent_stop, pre_api_request, post_api_request]
  provides_middleware: []
  requires_env: []
