subdir: plugins/shapeless
description: >-
  Make and publish social media content from Hermes: plan posts, edit video, generate images and
  clips, design carousels, and publish or schedule to LinkedIn, X, Instagram, TikTok, YouTube,
  Facebook, Threads, Bluesky and more, through ShapelessAI's hosted MCP server (Streamable HTTP,
  OAuth 2.1 with dynamic client registration and PKCE), with two skills bundled (get-started and
  shapelessai). Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/). Disclosure:
  hosted-only connector with no local code; every tool call goes to shapelessai.com, signed in as
  the user, with the post text, media and brand notes the session hands it, which also reach the
  user's model provider through the session. Publishing tools post to the user's real social
  accounts, and the package marks the server untrusted, so Hermes asks the user
  before each write tool. Media tools spend the
  account's credits at the cost each tool states; posting spends none. Hermes stores and refreshes
  the OAuth tokens. The tool list comes from ShapelessAI's server at run time, so the pinned commit
  doesn't cover it. OAuth must be enabled with
  `hermes mcp add shapeless --url https://shapelessai.com/mcp --auth oauth`;
  the bundled mcp.json alone yields 401.
