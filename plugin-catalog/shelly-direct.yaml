description: "Control Shelly Gen 1/2/3 devices directly on your LAN — discovery, relays, dimmers, covers, power meters. No Home Assistant, no MQTT, no cloud. Disclosure — the shelly tool switches relays, dimmers and covers on the user's LAN Shelly devices with no per-action confirmation; discovery sends UDP broadcasts and HTTP probes (with digest auth when a device password is set) to private LAN addresses only (RFC1918, 100.64/10, IPv6 ULA), and the agent can sweep a CIDR range only when the user sets allow_model_sweep: true; no cloud, no telemetry."
