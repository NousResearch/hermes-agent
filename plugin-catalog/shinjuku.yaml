version: "0.1.0"
description: "A private USDC wallet for Hermes that the user holds. It pays paid web services and APIs (x402) privately: the seller and the blockchain do not see which wallet paid. From plain requests Hermes checks a price, finds paid APIs, pays, and shows a wallet card (/shinjuku:wallet), receipts, add funds and a send back to the user's own wallet. New plugin. Agent Plugins v1 package (plugin.json + mcp.json + skills/ + a small launch.mjs). The wallet itself is the npm package shinjuku at the exact version in mcp.json (0.3.218), which the user installs once (npm install -g) and sets up in a terminal (shinjuku setup). Disclosure: the plugin downloads nothing and stores nothing; it reads npm's folders to find the installed wallet, and only when the default folders hold no copy it asks npm for its folders (npm root -g, npm config get cache; local reads, no network; through cmd.exe on Windows). Setup (in the terminal, not the plugin) downloads the wallet's proof programs from Shinjuku's server and checks each one. Hermes runs the wallet as a background MCP server; the wallet connects to Shinjuku's payment service and to the services the user pays, over Tor when the user chose Tor in setup; on Windows it downloads Tor once from torproject.org (pinned checksum) and runs it in the background. The npm install goes directly to npm, not over Tor. Keys, backup and records stay in the wallet's folder in the user's account. No telemetry. The package marks the server untrusted, so Hermes asks before every tool call that is not annotated read-only (payments, sends, deposits, stops). The wallet code is the npm package, not covered by the pinned sha."
