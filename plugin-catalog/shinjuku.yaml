description: "A private USDC wallet for Hermes that the user holds. It pays paid web services and APIs (x402) privately: the seller and the blockchain do not see which wallet paid. From plain requests Hermes checks a price, finds paid APIs, pays, and shows a wallet card (/shinjuku:wallet), receipts, add funds and a send back to the user's own wallet. New plugin. Agent Plugins v1 package (plugin.json + mcp.json + skills/ + a small launch.mjs). The wallet itself is the npm package shinjuku at the exact version in mcp.json (0.3.218), which the user installs once (npm install -g) and sets up in a terminal (shinjuku setup). Disclosure — Crypto payments: runs the user's own closed-source Shinjuku wallet (npm shinjuku@0.3.218 / shinjuku-shield@0.3.218, installed by the user, not covered by the pinned sha) as an untrusted MCP server; Hermes asks before every price check, payment, send, deposit address, backup and stop, but searches, receipts and balance reads run without asking, and a balance read (and wallet start) moves USDC the user added into the user's own private balance. Payments go through Shinjuku's payment service (pay.shinjukustaition.com or its .onion), which takes a per-payment fee, and paid AI answers send the prompt to api.usepod.ai over Tor; with Tor on, traffic goes over Tor, and on Windows the wallet downloads Tor from torproject.org and runs it in the background. Keys stay in the wallet's folder in the user's account."
