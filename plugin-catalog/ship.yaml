title: ShipStatic
description: "Deploy static websites, landing pages, and prototypes instantly, through the hosted ShipStatic MCP server (Streamable HTTP at https://mcp.shipstatic.com). Free, no account needed: publishing works with no sign-in, and the site comes back with a link to share and a claim link to keep it; the account tools (your sites, your domains) need a sign-in Hermes does not start on this server and answer Unauthorized; to keep sites in an account, use the ShipStatic CLI with an API key. Portable Agent Plugins v1 package (plugin.json + mcp.json), configuration only, no code. Disclosure — connects Hermes to the hosted ShipStatic MCP server at https://mcp.shipstatic.com; the files the agent publishes are sent to ShipStatic and nowhere else; a site published with no account is public, stays up for 3 days and is kept through its claim link (anyone who opens that link and signs in owns the site); the plugin holds no key or token; it marks its server untrusted, so every write call (a publish, a delete, a domain change) goes through Hermes's approval gate and is refused in unattended runs, and a user who wants unattended publishing sets their own `mcp_servers.ship` entry to `trust: full`; the tool set is served by the remote server at runtime and is not covered by the pinned sha."
