description: "Japanese tax and accounting calculators through ISZ Shiwake AI's free MCP server (Streamable HTTP at https://mcp.shiwake.ai/mcp, no sign-in, no keys in config): year-end adjustment refund, monthly payroll withholding tax from the National Tax Agency table, take-home pay and social insurance, furusato nozei deduction limit, depreciation, late-payment tax, consumption tax under the general, simplified, 20% and 30% special rules, account titles with sample journal entries, and qualified invoice registration number checks against National Tax Agency data. Results are in Japanese and link to the matching calculator on shiwake.ai. Bundles two skills: japanese-tax-calculations and japanese-bookkeeping-lookup. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to mcp.shiwake.ai, run by ISZ GROUP LLC (Osaka, Japan). All nine tools are annotated read-only and the package marks the server untrusted, so Hermes would ask before any tool that is not. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
