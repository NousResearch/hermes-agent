title: Shopmate
description: "Personal shopper agent: finds products with live Google Shopping prices and photos (SerpAPI, or a labelled demo catalog without a key), quotes delivery to the customer's location with doorstep or pickup-stop options, and on an explicit yes takes payment by Paystack (NGN, GHS, KES, ZAR, USD, XOF, EGP, RWF) or crypto via NOWPayments, verifying amount+currency with the provider before marking the order paid. Supports indexed order lookup, saved-card charges via Paystack charge_authorization (behind confirm=true), request_refund (Paystack Refund API + manual crypto payouts; optional NGN bank transfers only when SHOPMATE_ALLOW_TRANSFERS=1, which moves the operator's Paystack balance and is off by default), webhook signature verification (HMAC x-paystack-signature helper for operators), and contact_support with optional SUPPORT_EMAIL/SUPPORT_WHATSAPP — no BVN/phone identity lookups. 17 tools plus the shopmate:shopping skill. Disclosure — payments plugin: on checkout it creates Paystack payment links / charge_authorization charges and NOWPayments crypto invoices on the operator's own merchant keys (the confirm=true step is a model-set flag, not a Hermes approval; no money moves until the customer pays or a saved-card charge is confirmed); request_refund can call Paystack Refund / Transfers (transfers gated by SHOPMATE_ALLOW_TRANSFERS) or leave a manual crypto payout pending; network calls to serpapi.com, api.paystack.co, api.nowpayments.io, open.er-api.com, nominatim.openstreetmap.org, ipapi.co (auto-locate is on by default and sends the host's public IP when a conversation has no saved location) and maps.app.goo.gl (expanding shared Maps short links); carts, saved locations, saved card authorizations (last4/brand/bank only), support tickets and orders (customer name, email, phone and address) are stored in the plugin data directory; API keys are optional and read through Hermes's secret scope."
maintainer: DaveTech2
