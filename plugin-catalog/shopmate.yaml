name: shopmate
repo: https://github.com/DaveTech2/Shopmate
sha: 0f7eb1cafbeb2719b73126358735951539929470
title: Shopmate
description: >-
  Personal shopper agent: finds products with live Google Shopping prices and photos (SerpAPI, or a
  labelled demo catalog without a key), quotes delivery to the customer's location with doorstep or
  pickup-stop options, and on an explicit yes takes payment by Paystack (NGN, GHS, KES, ZAR, USD,
  XOF, EGP, RWF) or crypto via NOWPayments, verifying it before marking the order paid. 14 tools plus
  the shopmate:shopping skill.
  Disclosure — network calls to serpapi.com, api.paystack.co, api.nowpayments.io, open.er-api.com,
  ipapi.co and nominatim.openstreetmap.org; carts, saved locations and orders (customer name, email,
  phone and address) are stored in the plugin data directory; API keys are optional; checkout never
  creates a payment without confirm=true after the customer sees the summary.
maintainer: DaveTech2
tier: community
category: tools
requires_hermes: ">=0.21.5"
docs_url: https://github.com/DaveTech2/Shopmate#readme
version: "0.4.1"
capabilities:
  provides_tools:
    - shop_categories
    - shop_search
    - set_location
    - pickup_stops
    - shop_product
    - cart_add
    - cart_update
    - cart_remove
    - cart_view
    - cart_clear
    - delivery_quote
    - payment_options
    - checkout
    - order_status
  provides_hooks: []
  provides_middleware: []
  requires_env: []
