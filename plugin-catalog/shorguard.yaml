description: "Post-quantum crypto guard. Stops the agent from writing quantum-vulnerable public-key crypto (RSA, ECDSA, ECDH, EdDSA, X25519, DH, DSA) before it lands: pre_tool_call checks write_file, patch, terminal and execute_code and, in the default block mode, refuses calls that ADD classical crypto, returning the NIST replacement (ML-KEM / ML-DSA / SLH-DSA) with working cryptography>=48 code so the agent rewrites it (approve mode routes to Hermes's approval gate instead; warn mode only annotates). Tools shorguard_scan / shorguard_explain, /shorguard (status, mode, scan, explain) and `hermes shorguard scan` give a post-quantum readiness grade with text, JSON or SARIF output and CI exit codes. 52 rules across Python, JS/TS, Go, JVM, Rust, .NET, shell/CI, TLS config, PEM keys and JWT algorithms, mapped to NIST IR 8547 (deprecated after 2030, disallowed after 2035). Disclosure — reads the content of inspected tool calls, the file a write_file is about to overwrite (to flag only newly added crypto) and paths you ask it to scan; writes its own plugin state (counters and the last 50 events: time, action, tool, file name, rule ids — never code or arguments) and its own settings when changed via /shorguard; writes a report only with --output. No network, subprocesses, credentials, telemetry or background work."
maintainer: Akanimoh12
