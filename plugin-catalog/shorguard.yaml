title: "Shorguard — post-quantum crypto guard"
image: https://raw.githubusercontent.com/Akanimoh12/shorguard/ad949b682249e5c9401eaf3b5c0ffe244d668b33/docs/banner.png
platforms: []
known_issues:
  - "Pattern-based: it sees crypto your code calls directly, not crypto inside dependencies or a library's TLS defaults. A clean grade means no obvious classical crypto, not a certification."
  - "approve mode uses Hermes's approval gate, which auto-approves under YOLO; use block mode for enforcement."
  - "With plugins.isolation: host the `hermes shorguard` CLI subcommand is not available; use /shorguard scan or the shorguard_scan tool."
capabilities:
  provides_tools:
    - shorguard_scan
    - shorguard_explain
  provides_hooks:
    - pre_tool_call
    - transform_tool_result
  provides_middleware: []
  requires_env: []
