description: >-
  Skill id shortrizz:shortrizz-clipper. Self-hosted AI clipper: turn a long
  video (yt-dlp URL or local file) into captioned 9:16 shorts. Transcribes on
  CPU with faster-whisper, picks 30-60 s moments with an LLM (or a built-in
  heuristic), reframes with face tracking and burns in word-by-word captions
  (Hormozi, MrBeast, Abdaal or custom styles). Writes MP4s, clips.json and an
  HTML gallery. Renders run as background jobs; poll shortrizz_status.
  Publishing is a dry-run plan only; nothing is uploaded. Downloads the video
  you name with yt-dlp; the optional LLM call sends the transcript to the
  OpenAI-compatible endpoint you configure. Needs ffmpeg on PATH. Only clip
  content you have rights to.
