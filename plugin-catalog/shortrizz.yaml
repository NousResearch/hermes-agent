version: "0.2.0"
description: >-
  Skill id shortrizz:shortrizz-clipper. Self-hosted AI clipper: turn a long
  video (yt-dlp URL or local file) into captioned 9:16 shorts. Transcribes on
  CPU with faster-whisper, picks moments with an LLM (or a built-in
  heuristic), reframes with face tracking and burns in face-aware
  word-by-word captions (Hormozi, MrBeast, Abdaal or custom styles).
  Optional edits: filler/restart cuts, cold-open hook, emoji pops, tight
  20-35 s mode, skipping moments used by earlier runs, and a stock Kokoro
  narrator intro/CTA (weights download on first use; never clones voices).
  Writes MP4s, clips.json and an HTML gallery. Renders run as background
  jobs; poll shortrizz_status. Publishing is a dry-run plan only; nothing is
  uploaded. Downloads the video you name with yt-dlp; the optional LLM call
  sends the transcript to the OpenAI-compatible endpoint you configure. Needs
  ffmpeg on PATH. Only clip content you have rights to.
