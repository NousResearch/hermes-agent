description: "Preview, publish, and manage websites hosted on Showly from Hermes Agent, through the hosted Showly MCP server (Streamable HTTP). Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — hosted-only connector with no local code: every tool call goes to the vendor's remote MCP server at mcp.showly.ai. Sign-in is out of band: npx @showly/mcp-server login --to hermes writes MCP_SHOWLY_API_KEY into ~/.hermes/config.yaml; the bundled mcp.json carries no credential and no header."
