name: showreel
title: Showreel
repo: https://github.com/Duffey234/hermes-showreel
sha: "a8f404a0481408af8f56b514e47905dfd3565fa7"
version: "0.1.0"
description: "Turn any Hermes session into a demo video under 90 seconds. Six observer hooks record what the session actually did (the ask, terminal commands and output, file edits, screenshots, token usage), scrubbed twice for secrets; a deterministic storyboard keeps a failing test and its fix together and fits a hard 89 s budget; Pillow and your own ffmpeg render a 1080p MP4 (16:9, 9:16 or 1:1) with burned-in captions, an .srt and a poster. Desktop half: a Showreel page with a moment editor (drop beats, edit captions) and inline player, a REC chip, and a player card for showreel_render results. Narration is off by default; optional free offline voice (espeak-ng or piper on PATH), Hermes text_to_speech, or the user's own ElevenLabs key only when explicitly chosen, with `hermes showreel plan` showing the exact text and character count first. Disclosure: runs ffmpeg/ffprobe (and espeak-ng or piper only with local narration) as subprocesses with fixed argument lists; writes only to its plugin-data folder (scrubbed timeline in SQLite, newest 30 sessions) and the renders folder; no network unless narration is set to elevenlabs (HTTPS to api.elevenlabs.io with the caption text) or hermes (whatever TTS the user configured); no telemetry, no background processes, no self-updates; the Desktop half talks only to its own /api/plugins/showreel routes, which serve renders by bare file name from the renders folder."
maintainer: Duffey234
tier: community
category: tools
docs_url: https://github.com/Duffey234/hermes-showreel#readme
requires_hermes: ">=0.22.7"
readme: true
