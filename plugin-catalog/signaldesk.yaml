description: "Draft-first lead desk for founders and marketers: scan public hiring and launch signals (HN Who is hiring, YC hiring, Show HN, Launch HN, new YC companies; optional Product Hunt with a token) and local businesses on an OpenStreetMap map (LocalLead Map: city + business type or a drawn area, shown on an OpenLayers map), score them against your ICP, draft outreach, and never send without in-plugin approval. Cron and unattended runs fail closed. Disclosure — fetches public JSON from Algolia HN Search and the yc-oss static API; map scans (only when the user runs one) geocode with Nominatim (max 1 request/second, identifying User-Agent, cached 30 days) and query an Overpass API instance (one request at a time, timeout, cached 7 days), with a small bundled real OSM extract as offline fallback; the map loads standard OSM tiles in the browser; map data © OpenStreetMap contributors, ODbL, with attribution shown on the map and written into CSV and .eml exports; bundles OpenLayers 10.5.0 (BSD-2-Clause); optional DNS MX lookups (UDP only, no SMTP probing); optional Product Hunt GraphQL v2 only when PRODUCTHUNT_TOKEN is set (optional_env / secret_scope, not required to install; Product Hunt API terms restrict commercial use without permission); lead data lives in $HERMES_HOME/plugin-data/signaldesk/; drafts use the host LLM when available otherwise a local template; SignalDesk never transmits email (it writes a local .eml / mailto after approval, or the user may use a Hermes email tool which the pre_tool_call hook blocks unless the lead is approved and the session is interactive); no telemetry; no third-party mail APIs; no paid data providers required."
maintainer: codeybot-labs
