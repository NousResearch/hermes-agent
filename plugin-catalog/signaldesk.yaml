known_issues:
  - "The Hermes Desktop board page (desktop/plugin.js) passes catalog desktop-surface validation but was not clicked through in a live Desktop window on the build machine. The interactive HTML board is the supported demo and review UI."
  - "Product Hunt is optional and stays off unless PRODUCTHUNT_TOKEN is set through Hermes secret_scope. Product Hunt API terms restrict commercial use without permission."
  - "BetaList is not included; their site terms are not a clean fit for a keyless built-in source."
  - "Show HN posts hosted only on GitHub often have no company inbox, so those leads are scored but usually have no contact."
  - "LocalLead Map: public Overpass instances can be slow or rate-limited; SignalDesk tries them one at a time and falls back to the bundled Zürich demo extract (dentists, cafes) when all fail. The demo video's map scan used the Swiss instance overpass.osm.ch (SIGNALDESK_OVERPASS_URL) because overpass-api.de was unreachable from the build machine."
  - "A live scan needs outbound HTTPS to Algolia and yc-oss.github.io. Each source is capped so a large hiring dump does not flood the board. The offline demo uses bundled fixtures."
capabilities:
  provides_tools:
    - signaldesk_set_icp
    - signaldesk_scan
    - signaldesk_list
    - signaldesk_draft
    - signaldesk_mark
    - signaldesk_followups
    - signaldesk_export_csv
    - signaldesk_sources
    - signaldesk_prepare_send
    - signaldesk_board
    - signaldesk_map_scan
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
