sha: 2a60a2a066c0b36312deb3be700c2489a8da80e1
version: "0.1.0"
description: "Draft-first lead desk for founders and marketers: scan public hiring and launch signals (HN Who is hiring, YC hiring, Show HN, new YC companies; optional Product Hunt with a token), score them against your ICP, draft outreach, and never send without in-plugin approval. Cron and unattended runs fail closed. Disclosure — fetches public JSON from Algolia HN Search and the yc-oss static API; optional DNS MX lookups (UDP only, no SMTP probing); optional Product Hunt GraphQL v2 only when PRODUCTHUNT_TOKEN is set (optional_env / secret_scope, not required to install; Product Hunt API terms restrict commercial use without permission); lead data lives in $HERMES_HOME/plugin-data/signaldesk/; drafts use the host LLM when available otherwise a local template; SignalDesk never transmits email (it writes a local .eml / mailto after approval, or the user may use a Hermes email tool which the pre_tool_call hook blocks unless the lead is approved and the session is interactive); no telemetry; no third-party mail APIs; no paid data providers required."
maintainer: codeybot-labs
tier: community
category: automation
