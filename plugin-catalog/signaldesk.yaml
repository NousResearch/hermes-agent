version: "0.2.0"
description: "Draft-first lead desk for founders and marketers: scan public hiring and launch signals (HN Who is hiring, YC hiring, Show HN, Launch HN, new YC companies; optional Product Hunt with a token) and local businesses on an OpenStreetMap map (LocalLead Map: city + business type or a drawn area, shown on an OpenLayers map), score them against your ICP, draft outreach, and never send without user approval (board, Desktop, or /signaldesk approve; the model cannot approve a lead or move a lead to sent/replied/won). Cron and unattended runs fail closed. Disclosure — fetches public JSON from Algolia HN Search and the yc-oss static API, and (only when you run a map scan) geocodes with Nominatim and queries public Overpass API instances; the board loads OpenStreetMap tiles in the browser; Product Hunt GraphQL is used only when PRODUCTHUNT_TOKEN is set; optional DNS MX lookups; lead data stays in $HERMES_HOME/plugin-data/signaldesk/; it never sends email itself, and its pre_tool_call hook blocks other send tools unless the lead was approved by you and the run is not a cron job."
maintainer: codeybot-labs
tier: community
category: automation
requires_hermes: ">=0.22.0"
