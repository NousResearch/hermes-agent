title: Signet
description: "An email leaves your agent only with your seal on that exact message. signet_send_mail shows the real recipients, sender, subject, text and attachments in Hermes's own approval prompt, ties your yes to their SHA-256 and sends nothing else: a recipient added or a word changed after the prompt has no seal. YOLO mode, approvals off, timeouts and scheduled runs cannot seal; those emails are held for /signet send, which shows the email in full first. Direct mailers (himalaya, msmtp, sendmail, mail, SMTP scripts, mail SDKs and API send endpoints) are blocked in terminal, execute_code and process input, and the card flags look-alike domains, new recipients, secrets and odd links. Disclosure — no network unless you choose the smtp transport (your server; password read through Hermes's secret scope); the command transport runs the one mailer you configured, without a shell, with the approved message on stdin; reads the attachments an email names (credential files and private keys refused); stores held drafts, a ledger and outbox .eml files under plugin-data/signet with owner-only permissions; blocks tool calls that would send mail directly (guard: block, configurable) and fails closed on its own hook errors; trusted_recipients, when you set it, sends to your own listed addresses without a prompt; no telemetry, no background processes; adds an approval prompt and never answers one."
