description: "Build, run and manage sigrex.io trading automation (code and AI strategies, trading bots, webhooks and signals across crypto exchanges, DEXs and prediction markets) through the official Sigrex MCP server (Streamable HTTP at https://mcp.sigrex.io, OAuth sign-in, no keys in config), with the sigrex workflow skill bundled. Portable Agent Plugins v1 package (mcp.json + skills/), no Python or executables; needs a free Sigrex account. The connection has full account access, including actions that can place live trades. Disclosure — the tool set is served by the remote MCP server at runtime and is not covered by the pinned sha; the bundled skills instruct the agent to confirm before any action that moves money or changes data; connecting an exchange or prediction-market account gives Sigrex that account's API key or wallet private key, which the skills tell the agent to leave to the user in the Sigrex dashboard."
