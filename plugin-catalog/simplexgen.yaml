name: simplexgen
title: SimplexGen
repo: https://github.com/lee101/hermes-simplexgen
sha: d7250bbb467edee37617d53291a048a4a486118f
version: "0.2.0"
maintainer: lee101
tier: community
category: tools
docs_url: https://github.com/lee101/hermes-simplexgen#readme
readme: true
platforms: []
description: "Generate images and 3D meshes (text/image to GLB via Pixal3D, TRELLIS.2, Hunyuan 3D, Hi3D, Rodin), then simplify, repair, voxelize, retopologize (QuadriFlow), UV-parameterize (rectangular surface parameterization), remesh and texture them through SimplexGen's hosted MCP server, with three workflow skills. Disclosure — connects Hermes to simplexgen.com/mcp with your SIMPLEXGEN_API_KEY; prompts and model/image URLs are sent to SimplexGen and may be forwarded to its model providers (fal.ai, RunPod); generation, texturing and mesh tools spend account credits (mesh ops 1-3 credits, charged on success); the server is marked untrusted so every tool without a read-only annotation needs approval; skills suggest curl to upload local files to a single-use URL and to download results."
known_issues:
  - "A SimplexGen paid plan is required to create an API key."
  - "An existing native mcp_servers.simplexgen configuration overrides the package connection and trust setting."
# MCP tools are discovered from the remote server; the package registers no native tools or hooks.
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - SIMPLEXGEN_API_KEY
requires_hermes: ">=0.21.6"
