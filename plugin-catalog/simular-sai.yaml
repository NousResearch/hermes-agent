description: "Give Hermes a computer: hand tasks that need a screen (web apps behind a login, admin consoles, desktop software, forms with no import) to Sai, Simular's computer-use agent, which does them on a cloud computer Simular hosts and reports back in text. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only; the MCP server runs as npx @simular-ai/sai-mcp@0.4.0 over stdio, so Node.js 22.12+ and npm are required. Needs a Sai API key (from platform.simular.ai), set in Settings > Plugins or as SAI_API_KEY in the profile .env. Disclosure: every task, uploaded file and the API key go to api.simular.ai, and tasks use the account's Sai credit or free daily computer time; the server serves a local task view on 127.0.0.1; sai_live_link returns a link that lets whoever holds it use the cloud computer until it expires."
