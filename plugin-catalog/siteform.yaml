  - https://raw.githubusercontent.com/duclucky/siteform/be9b797345e695630318c66b5245657738767b9b/docs/studio.jpg
readme: true
platforms: [windows]
known_issues:
  - "Concept massing on flat ground; not BIM or a regulatory compliance determination."
  - "A new library starts empty. Supply a PDF and confirm its scale, outlines and heights."
