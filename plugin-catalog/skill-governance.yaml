name: skill-governance
version: "0.2.0"
repo: https://github.com/moonlight-lupin/agent-skills
sha: ceacc13d2bbc98d9dea5cbabcb4f44e4c7fd14a9
subdir: plugins/skill-governance
description: >-
  Consolidated skill-governance plugin behind one composed hook surface:
  on_skill_lifecycle, on_session_start, pre_tool_call, pre_llm_call. The
  manifest engine enforces
  UPSTREAM_MANIFEST.md — arrivals need a manifest row, content changes in
  manifested skills re-flag until re-acknowledged against a content
  fingerprint via the preserved /skill-manifest-ack command. The advisor
  engine observes behavioral skill edits (never blocking) and injects one
  bounded reminder to run the contrastive-refinement probe cycle (bundled as
  skill-governance:contrastive-refinement), recording every delivered advisory
  to ~/.hermes/skill-probes/fire-ledger.jsonl. Both legacy state namespaces
  import by copy (destination-wins, sources never modified) and a conservative
  governance.records summary joins them (acknowledged never implies
  validated). One opt-in clearance cron (cron.*, default off) replaces both
  legacy schedulers and preserves both clearance procedures verbatim. Stdlib
  only, no network calls, fail-soft everywhere (malformed state keeps hooks
  inert, never aborts the host turn). Disclosure — reads the profile's skills
  tree (SKILL.md files, fingerprinted read-only) and UPSTREAM_MANIFEST.md,
  writes plugin state under HERMES_HOME/plugin-data/agent-plugin-skill-governance-*/,
  optionally writes one cron job and the shared fire-ledger.jsonl +
  plugin-data/skill-manifest/acks.json when the clearance cron is enabled;
  never deletes, never blocks tool calls.
maintainer: moonlight-lupin
tier: community
category: tools
requires_hermes: ">=0.21.1"
docs_url: https://github.com/moonlight-lupin/agent-skills/tree/ceacc13d2bbc98d9dea5cbabcb4f44e4c7fd14a9/plugins/skill-governance#readme
platforms: [linux, macos, windows]
capabilities:
  provides_tools: []
  provides_hooks:
  - on_skill_lifecycle
  - on_session_start
  - pre_tool_call
  - pre_llm_call
  provides_middleware: []
  requires_env: []
