sha: 008c083742c8d55de970b2159130abeb85b82037
subdir: plugins/skill-retrieval
description: "BM25-based skill retrieval for large skill libraries. An llm_request middleware rewrites the outgoing request's <available_skills> block to names only (the same bytes every turn, so prompt caching is unaffected), and a pre_llm_call hook appends the top-K matching skill descriptions to the current user message. Uses public plugin surfaces only (register_middleware, register_hook); reads SKILL.md frontmatter from the profile's skill roots and imports a few agent.prompt_builder / agent.skill_utils helpers read-only. pyyaml is declared via pip_dependencies in plugin.yaml, so the installer installs it. On CPython 3.14 the host's hermes_yaml facade is used when PyYAML is unavailable. Disclosure — optional Jev rerank, off by default: with SKILL_RETRIEVAL_RERANK=jev and TYPESAFE_API_KEY set (read from the environment only), each turn POSTs the user message (leading injection patterns stripped, capped at 2000 chars) and the ids and descriptions of up to 12 shortlisted skills (400 chars each) to api.typesafe.ai (3 s timeout, no retries, BM25 order kept on error); with SKILL_RETRIEVAL_RERANK_PROVIDER=openrouter the same payload goes to openrouter.ai/api/v1/systemone instead, keyed by OPENROUTER_API_KEY (each provider reads only its own key, from the environment only). A local JSONL log (timestamp, session id, 200-char query excerpt, both orders, rerank scores) is appended under $HERMES_HOME/data/jev-trial/, rotated past 5 MB.  Session capability snapshots persist to <hermes-home>/plugin-data/skill-retrieval/data.db — a local sqlite file created on first write, bounded to the 256 most-recent sessions and deleted on LRU eviction; it holds no prompt content beyond visible skill names, and on older Hermes cores without plugins.plugin_storage the plugin keeps its in-memory-only behavior."
maintainer: moonlight-lupin
tier: community
category: tools
requires_hermes: ">=0.21.1"
version: "0.9.0"
capabilities:
  provides_tools: []
  provides_hooks:
  - pre_llm_call
  - on_skill_lifecycle
  provides_middleware:
