name: skill-workshop
title: "Skill Workshop"
repo: https://github.com/flabanabba8/skill-workshop
sha: 02dd813752a6dcabafccf5ff225812455fde2c7c
version: "0.3.1"
description: "Get new skills for Hermes safely: mine them from your past chats (Skill Miner), build them from a description (First Principles Skill Builder), and guard against prompt injection in skills and content you bring in (Taint Shield). Scans every skill before it is installed or used, including ones from other people (Skill Guard); installing needs your approval. Disclosure: Skill Miner reads the Hermes session database read-only; Skill Builder runs --version on a fixed list of common tools and nvidia-smi and reads memory, disk space, skill names and model-cache folder names; Taint Shield watches tool calls in memory; Skill Guard reads the text of skills in your skills folders (and external skill folders named in config.yaml) when they are installed or loaded and keeps a hash and a decision for each in plugin storage. Drafts, revisions and the trusted list live in plugin storage; installing a skill writes one file into the skills folder after your approval. Two install approvals, the Shield's block-or-ask rules and Skill Guard's install scan use pre_tool_call; Skill Guard also uses transform_tool_result and pre_llm_call (hold back a flagged skill, once) and on_skill_lifecycle (scan a skill after Hermes reports it installed). No network calls."
maintainer: flabanabba8
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://github.com/flabanabba8/skill-workshop/blob/02dd813752a6dcabafccf5ff225812455fde2c7c/README.md
image: https://raw.githubusercontent.com/flabanabba8/skill-workshop/02dd813752a6dcabafccf5ff225812455fde2c7c/assets/thumbnail.jpg
platforms: [linux]
capabilities:
  provides_tools:
    - shield_report
    - shield_scan
    - shield_trust
    - skillguard_scan_installed
    - skillguard_decide
    - miner_scan
    - miner_propose
    - miner_diagnose
    - miner_refine
    - miner_check
    - miner_install
    - skillbuilder_resources
    - skillbuilder_save
    - skillbuilder_check
    - skillbuilder_case
    - skillbuilder_install
  provides_hooks:
    - pre_llm_call
    - post_tool_call
    - transform_tool_result
    - pre_tool_call
    - on_skill_lifecycle
  provides_middleware: []
  requires_env: []
