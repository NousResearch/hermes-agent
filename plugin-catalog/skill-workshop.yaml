version: 0.3.4
description: 'Get new skills for Hermes safely: mine them from your past chats (Skill Miner), build them from a description (First Principles Skill Builder), and guard against prompt injection in skills and content you bring in (Taint Shield). Scans skill writes before they land and holds back flagged external skills at first use (Skill Guard); Workshop installs need your approval. Disclosure: Skill Miner reads the Hermes session database read-only through the public hermes_state module (tool names and counts, plus the first request of each session in abstracted, redacted form); Skill Builder runs --version on a fixed list of common tools and nvidia-smi with a minimal environment and reads memory, disk space, skill names and model-cache folder names; Taint Shield watches tool calls in memory; Skill Guard reads the text of skills in your skills folders (and external skill folders named in config.yaml, read through Hermes''s config loader) when they are installed or loaded and keeps a hash and a decision for each in plugin storage. Drafts, revisions and the trusted list live in plugin storage; installing a skill writes one file into the skills folder after your approval. Two install approvals, the Shield''s block-or-ask rules and Skill Guard''s install scan use pre_tool_call; Skill Guard also uses transform_tool_result and pre_llm_call (hold back a flagged skill, once) and on_skill_lifecycle (scan a skill after Hermes reports it installed). No network calls.'
maintainer: flabanabba8
