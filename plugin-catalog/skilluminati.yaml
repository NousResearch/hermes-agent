description: "Your skills, judged blind: finds out whether each skill your Hermes agent loads makes its answers better. /skilluminati <skill> takes the latest 12 times you used the skill, each with the chat as it stood at that moment, and your model answers each one twice, once with the skill and once without. The Owl, a blind judge, sees both answers and the skill's one-line description of its job, never which answer had the skill, and sees every pair twice with the answers swapped; if it picks differently the second time, the pair counts as Same. Verdicts: Enlightened (answers are clearly better with it), Dead weight (the model does this anyway, it only costs tokens), Hindrance (answers are worse with it) or Unproven (too few uses to tell yet), each marked Probable or Plausible. Built-in question sets for frontend-design, systematic-debugging and hermes-agent let a fresh install run a test with no history, and /skilluminati selftest plants a helpful, a harmful and an empty skill to prove the Owl can tell them apart. Surfaces: the /skilluminati command, two read-only agent tools, a Desktop page with a sidebar entry (plugin SDK only) and a read-only dashboard backend. Disclosure — opens HERMES_HOME/state.db read-only and reads installed skill files, skills/.usage.json and skills.disabled/model.default from config.yaml; for each test it sends up to 12 past tasks (the stored session system prompt, the chat up to the moment the skill loaded and any tool output in it, after best-effort regex blanking of emails, phone numbers, key-shaped strings, token-carrying URLs, money amounts and names in plugin-data/skilluminati/names.txt) plus the skill text to the active provider and model, or a per-role provider/model you configure, through ctx.llm, at up to 64 model calls per skill on your own allowance; runs start only from a local CLI/TUI/Desktop/ACP session (never cron or a messaging gateway) on a background thread; writes only under HERMES_HOME/plugin-data/skilluminati/; imports one private core helper (agent.skill_utils.get_all_skills_dirs) to list skill folders; no other network calls, no shell commands, no stored credentials."
