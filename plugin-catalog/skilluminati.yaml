known_issues:
  - "Each test is one fresh answer per task from the moment the skill loaded. Tools are not run again, so skills that mostly drive tools are judged on the answer text only."
  - "The replay puts the skill into the chat directly, so it does not test whether your agent would have chosen to load it."
  - "If the judge is the same model family as the one under test, it may favour answers like its own. The result names the model."
  - "Every test spends your own provider allowance: up to 64 model calls for one skill. The frontend-design built-in set takes about an hour because every answer is a whole web page."
  - "The Desktop page appears only after Capabilities -> Plugins -> Skilluminati is switched on in Hermes Desktop."
  - "Lists skill folders through agent.skill_utils.get_all_skills_dirs, a private core helper (validator rule 9 warning); a future Hermes release may move it."
capabilities:
