name: skmemory
repo: https://github.com/smilinTux/hermes-skmemory
sha: 36d8219c0f93c959e3ebf5eb437f446ef6e44957
description: "skmemory as a Hermes memory provider, with skmemory kept outside Hermes: the plugin runs the skmemory-mcp stdio server (from the skmemory package on PyPI, installed as its own tool with `uv tool install skmemory` or `pipx install skmemory`, never into Hermes's venv) as a child process and calls it over MCP. Default is a private store in HERMES_HOME on skmemory's local tier (flat JSON files plus SQLite/FTS5, offline, no Postgres or embedding server); linked mode serves an existing skcapstone agent with that node's tiers. Recall is reader-scoped per turn, non-owner turns never write, and sensitive memories are never auto-injected. Disclosure: starts one long-running `skmemory-mcp` child process per Hermes profile with the user's privileges and a filtered environment (SKMEMORY_*, SKCAPSTONE_*, SKAGENT* stripped in isolated mode); every completed owner turn is stored as a short-term memory; no network calls by the plugin itself, and none by the server in isolated mode; in linked mode the server may use the node's Postgres DSN. No telemetry."
maintainer: smilinTux
tier: community
category: memory
