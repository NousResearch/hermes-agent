description: "Configure Skysay AI agents and numbers, place calls, send SMS and inspect results. Review OAuth consent: optional write/content permissions may be preselected. Write-capable tools use Hermes native approval (trust: untrusted); calls, SMS and numbers can incur charges. Disclosure — v2 connects to Skysay's full customer MCP endpoint (api.skysay.ai/mcp): with the OAuth scopes you grant, the agent can change voice agents, request paid phone numbers, place calls, send SMS, launch campaigns and create wallet checkouts that spend Skysay funds (Hermes asks before each write-capable tool), and can read call recordings, transcripts and messages into your model's context."
