description: "Design mobile app screens with Sleek's hosted MCP server (https://sleek.design/api/mcp). Agent Plugins v1 package (plugin.json + mcp.json + one skill), configuration only. Disclosure — every tool call goes to sleek.design and acts on the Sleek account you sign in with; the tool set is served by that server at runtime and is not covered by the pinned sha; design runs spend your workspace's AI credits; delete_project permanently deletes a project. Sign-in is OAuth through Hermes: after `hermes mcp add sleek --url https://sleek.design/api/mcp --auth oauth`, the first tool call opens the browser; Hermes stores and refreshes the tokens. The package marks the server untrusted; the native OAuth entry replaces that setting, so the install steps set trust: untrusted on it too, and Hermes then asks before write-capable calls and refuses them in unattended runs."
