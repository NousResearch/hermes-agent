version: "1.0.0"
description: "SLOPCANNON music videos from a song, inside Hermes: one request produces a whole film (direction, rights sign-off, credit quote, first-scene review, parallel or chained scene renders, character checks, rerolls with a note, assembly), every decision a button on a live film card in the chat, a SLOPCANNON studio page in Hermes Desktop, and the whole hosted SLOPCANNON tool surface (remixes, the Ad Cannon, Character Lab, Slop TV) as native tools. Disclosure: calls api.slop.cc (needs a slop.cc account and Cannon Credits); spends only on the person's click on the card, a Hermes approval, or an unattended allowance that defaults to 0; runs the bundled Node production driver and ffmpeg as background child processes with a minimal environment and a dedicated agent session; reads only the songs and pictures you name and uploads them after your rights sign-off."
