known_issues:
- "Needs a slop.cc account; renders spend Cannon Credits bought at slop.cc/account (the plugin never buys credits)"
- "Whole productions need Node.js 22.13+ and ffmpeg/ffprobe on the machine Hermes runs on; the other tools work without them"
- "Sign in once in a terminal: hermes config set SLOPCANNON_OAUTH_CLIENT_ID hermes-agent, then hermes auth add slopcannon:slop (or enter a slop.cc/account token as the plugin's Agent token)"
