# Hermes plugin catalog entry for Sluice.
#
# The plugin name is `sluice-search` everywhere: the catalog key, the manifest
# `name`, the install directory under `~/.hermes/plugins/`, the CLI command and
# the provider id. `sluice` is already taken upstream by an unrelated plugin
# (orjinameh/airlock, a terminal backend that stages workspace edits), and
# Hermes names the install folder and the settings key from the manifest name,
# so keeping the manifest at `sluice` would have put both plugins in
# `plugins/sluice` and made `hermes sluice` ambiguous. The display title stays
# `Sluice`; only identifiers changed.
#
# Consequence for the docs: the install command is `hermes plugins install sluice-search`.
#
# Manifest-only fields (kind, license, provides_web_providers, python_dependencies)
# are not part of the catalog contract. They live in plugin.yaml at the pinned sha
# and are restated in SUBMISSION.md §2: kind backend, license MIT, provides
# web provider "sluice-search", python deps httpx>=0.27,<1; trafilatura>=1.8,<3;
# playwright>=1.45,<2; ddgs>=9,<10.
#
# Pin re-check: re-verify this sha against the tip of main at submit time. The tree
# verified here: pytest 559 passed / 10 skipped, `hermes plugins validate` 16 checks
# with no warnings, `hermes plugins doctor --ci` exit 0.
name: sluice-search
title: Sluice
repo: https://github.com/abhigyan-chatterjee/sluice
sha: 9a948e93e4881e87cc7228d57ffd550fd590a502
description: Tiered free-first web search and extraction router and backend manager for Hermes
maintainer: Abhigyan Chatterjee
version: "1.0.0"
tier: community
category: web
requires_hermes: ">=0.22.5"
docs_url: https://github.com/abhigyan-chatterjee/sluice#readme
platforms:
  - linux
  - macos
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env: []
