name: sluice
title: Sluice
repo: https://github.com/orjinameh/airlock
sha: e0e5084dcf559c5a392549aa1a892bcf75b64154
subdir: sluice
version: "1.0.0"
description: >-
  An airlock for agent changes. A terminal backend that runs the agent's commands and file tools
  (read_file, write_file, patch, search_files) in a staged copy of the workspace, so the real files are untouched
  until you review the diff hunk by hunk and apply only what you approve (/sluice diff, /sluice apply,
  /sluice discard, also as `hermes sluice`). Calls a copy cannot contain (git push, package installs, network
  writes, deploys, writes or deletes outside the workspace) are sent to Hermes's own approval prompt labelled NOT
  CONTAINED. Select it with `hermes config set terminal.backend sluice`. Disclosure: no network calls and no
  background processes; reads the workspace and its .gitignore, never credential files; runs the agent's shell
  commands in the staged copy and `git ls-files` to list files; writes its own data under
  <HERMES_HOME>/plugin-data/sluice (deleted after 14 idle days) and, only when the user runs apply, the approved
  changes inside the workspace; one hook (pre_tool_call) that only holds calls for approval and never approves.
  Not an operating system sandbox: commands still run on the host as the user.
maintainer: orjinameh
tier: community
category: tools
requires_hermes: ">=0.22.6"
docs_url: https://github.com/orjinameh/airlock#readme
platforms:
  - linux
  - macos
known_issues:
  - "Not an OS sandbox: the gate reads command text, so a command that builds its target path at run time can get past it."
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
