name: smartmoney-cub
repo: https://github.com/myc0576/hermes-smartmoney-cub
sha: 67e5a73d32fde4d0b68d3562a930064bf8b0d103
description: 'Local-first SmartMoney-Cub review harness wrapped as eight Hermes tools. Preserves READ_ONLY_NO_ORDER_NO_CANCEL_NO_TRADE and performs no-trading actions: no orders, no cancels, no broker connection, no account mutation, no market-data fetch, and no financial advice. The plugin makes no network calls and reads no credentials. It invokes the user-installed smcub CLI with shell=False; the immutable plugin SHA does not pin that binary. evaluate-run writes eval.json in the run directory; build-evidence-pack creates candidate, sample, manifest, and seal files under output_dir; replay-evidence-pack creates or replaces replay_report.json, including unsuccessful reports. These writes are confined to configured run_root; path validation is not an OS sandbox. Harness installation is from source or the GitHub Release wheel, not PyPI.'
maintainer: myc0576
tier: community
category: tools
docs_url: https://github.com/myc0576/hermes-smartmoney-cub#readme
requires_hermes: ">=0.19"
version: "0.1.1"
capabilities:
  provides_tools:
  - smcub_doctor
  - smcub_validate_envelope
  - smcub_build_evidence_pack
  - smcub_replay_evidence_pack
  - smcub_evaluate_run
  - smcub_inspect_artifacts
  provides_hooks: []
  provides_middleware: []
  requires_env: []
