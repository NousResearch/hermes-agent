description: "Connect a Snippet account to manage creator brand deals, sponsorship rates, brand emails, decisions and contract reviews through Snippet's hosted MCP server (Streamable HTTP at https://usesnippet.app/api/mcp, OAuth). Portable Agent Plugins v1 package (plugin.json + mcp.json), configuration only. After sign-in the hosted server currently exposes 13 tools: get_manager_briefing, list_deals, get_deal, search_inbox, get_inbox_thread, draft_reply, send_reply, get_rate_card, estimate_sponsorship_rate, find_brand_matches, review_brand_contract, get_work_log, and answer_decision. Disclosure — every tool call goes to Snippet's hosted backend; the tool set is served by that server at runtime and is not covered by the pinned sha. A Snippet account is required; some actions require an active plan and available allowances. Portable hermes mcp login against this package does not start OAuth today (upstream issue 87253). Sign in with `hermes mcp add snippet --url https://usesnippet.app/api/mcp --auth oauth` in an interactive session. A same-name native entry replaces the package's server entry, trust included, so after sign-in add `trust: untrusted` to mcp_servers.snippet if you want Hermes to keep asking before write tools (including send_reply) and to block them in unattended runs. Hermes stores and refreshes the OAuth tokens. The package contains no credentials, local executables, dependencies, self-updater or telemetry code; hosted logging follows https://usesnippet.app/privacy."
