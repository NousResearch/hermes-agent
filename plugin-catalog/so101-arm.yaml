sha: 09203664d364458b39b2b44f11f21be1347bbe3d
title: SO-101 Arm
description: "Give Hermes a robot arm, safely: an SO-101 (a MuJoCo sim on your laptop, or a real arm through LeRobot) driven by named skills, never joint angles. A top-down camera grid corrects its aim, a missed pick is rehearsed on simulated copies before the retry, a plain-code watchdog parks the arm on faults, a pre_tool_call guard refuses motion until a repair is verified, and only a person can lift a freeze (/arm unfreeze). Disclosure — the plugin talks only to a local Unix socket (mode 0600) served by an arm host you start yourself (python -m so101_host serve); its log hooks send tool names, results and token counts (never conversation text) to that socket for the viewer. The arm host is a separate program from the same repository: it writes run records under ~/.so101-arm/, `fetch-model` runs git to download MuJoCo Menagerie's SO-101 model at a pinned commit, `serve --video` runs ffmpeg, and `serve --real` drives a physical arm over USB serial."
maintainer: jamesEmerson112
tier: community
category: tools
