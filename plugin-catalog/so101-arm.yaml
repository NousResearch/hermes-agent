known_issues:
  - "Needs the arm host from the same repository running beside Hermes: python -m so101_host fetch-model, then python -m so101_host serve (add --view to watch the arm)."
  - "The real-arm driver (LeRobot) is tested against a mock robot only; it hasn't been run on hardware yet."
