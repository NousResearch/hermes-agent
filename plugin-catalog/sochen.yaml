name: sochen
title: Sochen
repo: https://github.com/N-45div/sochen-plugin
sha: b785f9176be75c4d5567cade43f926dc154ca034
description: "Give Hermes a phone with nothing to set up: Sochen (sochen.dev), a cloud agent for any open-source agent, phones a US business for you and brings back the answer, with no Twilio account, number or voice keys of your own. When the business asks something only you can answer, the question comes to your Hermes chat while they hold the line, and your reply goes straight back into the call. It also runs long research in the cloud and handles email and calendar jobs that wait for your OK, and Hermes is told when each job finishes. Every account gets 100 free Sochen API credits, spread over any number of jobs; after that, packs or a monthly API plan (sochen.dev/pricing#api). Free GST invoices, rent receipts for HRA and UPI bill splits with no account, and your Sochen desk as a page in Hermes Desktop. Disclosure — network calls go to sochen.dev only: the Agent API with your SOCHEN_API_KEY (read through Hermes's secret scope) for jobs, job status and the desk, and the public tools endpoint, with no key, for the free tools. Jobs run on your Sochen account and credits, and Hermes asks before each handoff. On your next message the plugin checks up to two open jobs (4 s each; a job whose call is going on, every turn), sochen_job may wait up to 60 s for news while a call goes on, and sochen_answer sends only the answer the user gave. Hermes Desktop reads the desk every 30 s while open. A short list of handed-off jobs (id, label, status) is kept in the plugin's own state. Requests carry a hermes-sochen/<version> client name; there is no other telemetry."
maintainer: N-45div
tier: community
category: voice
