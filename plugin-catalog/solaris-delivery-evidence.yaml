description: "One local skill to record command outcomes and reject stale delivery evidence using input/output hashes and work-order receipts. Disclosure — explicitly requested recording executes the caller's command with normal host permissions, reads named workspace inputs/outputs and writes local receipts and command logs. Work-order run creates project scaffolding; verification is read-only unless a report output is requested. No automatic network calls, credential reads, hooks, background jobs or telemetry. Labels are unauthenticated; hash consistency does not certify correctness or enforce a sandbox."
