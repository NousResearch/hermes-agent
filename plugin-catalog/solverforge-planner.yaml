known_issues:
  - "Run `hermes solverforge-planner install` once after installing the plugin: the engine binary is downloaded separately (about 5 MB) and checked against a pinned SHA-256"
  - "Engine builds exist for Linux (x86_64, arm64), macOS (Apple silicon, Intel) and Windows (x86_64)"
  - "Hermes builds a session's tool list from the plugins it saw at the previous launch, so the first session right after installing has no planner tools: start Hermes once more"
