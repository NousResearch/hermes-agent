title: "SolverForge Planner"
description: "Plans your tasks into your week around your meetings, deadlines, task order and focus hours with a SolverForge constraint solver, and proves every hard rule holds before anything is written. The planner keeps its own local calendar (SQLite plus a planner.ics you can subscribe to); Hermes pulls your cloud calendar and pushes the plan with the calendar tool you already use, and the planner only ever creates, moves or deletes its own events, each with a fixed ID so a repeated push adds nothing. Applying a plan and unscheduling a task ask for your approval. Desktop: a plan card in chat, a Planner page (week view and tasks) and a status-bar chip. Disclosure — `hermes solverforge-planner install` (or /planner install, or the Desktop Install engine button) downloads one engine binary for your platform from this repository's own engine-v0.1.0 GitHub release, built by its release workflow with a GitHub build attestation, and refuses it unless its SHA-256 matches the value pinned in engine_bin.py; the agent cannot start that download. Each solve runs that binary once as a subprocess (JSON on stdin and stdout, stopped at solve_timeout, no network). planner_busy_from_ics fetches an https/http/webcal iCalendar link (up to 10 MB) or reads a local .ics file, only the one you name. All data stays in <hermes home>/plugin-data/solverforge-planner/; no credentials are read or stored, no cloud calendar is touched by the plugin itself, no telemetry, no background process; an optional Morning plan automation blueprint runs only if you schedule it, and never applies."
