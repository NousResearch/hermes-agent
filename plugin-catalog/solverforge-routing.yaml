    - route_confirm_location
    - route_plan_places
    - route_confirm_plan
    - route_status
    - route_current
    - route_set_origin
    - route_set_end
    - route_set_round_trip
    - route_add_stop
    - route_remove_stop
    - route_mark_visited
    - route_set_next
    - route_precedence
    - route_solve
  provides_hooks: []
  provides_middleware: []
  requires_env: []
