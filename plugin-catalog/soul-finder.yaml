sha: 2d288de288f220f3a630fa41ca9bd0bc9801e992
version: "1.1.0"
title: Soul Finder
description: "Build or fix your agent's SOUL.md — the personality file behind every reply. A few plain questions draft one from scratch; /soul audits a stale one and ships a diff. Disclosure — reads $HERMES_HOME/SOUL.md and writes it only through the agent's own file tools after you approve the draft (the bundled skill can suggest copying the approved file into other profiles' SOUL.md, again only on approval); on a profile with no real SOUL.md it makes a one-time offer through a system-prompt section and an injected first-run message, and writes two booleans (nudge_sent, flow_complete) to its own plugin-data state so the offer happens once. No network I/O, no credentials."
maintainer: RegeneratusLabs
tier: community
category: tools
docs_url: https://github.com/RegeneratusLabs/Soul-Finder#readme
readme: true
platforms: [linux, macos]
requires_hermes: ">=0.21.5"
screenshots:
  - https://raw.githubusercontent.com/RegeneratusLabs/Soul-Finder/2d288de288f220f3a630fa41ca9bd0bc9801e992/screenshots/desktop.png
  - https://raw.githubusercontent.com/RegeneratusLabs/Soul-Finder/2d288de288f220f3a630fa41ca9bd0bc9801e992/screenshots/tui.png
capabilities:
  provides_tools:
    - soul_finder_status
    - soul_finder_complete
  provides_hooks:
    - on_session_start
  provides_middleware: []
  requires_env: []
