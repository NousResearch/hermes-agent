sha: deec34636d95f898b084e6e24a19766ecd20acf2
version: "1.1.0"
title: Soul Finder
description: "Build or fix your agent's SOUL.md — the personality file behind every reply. A few plain questions draft one from scratch; /soul audits a stale one and ships a diff. Disclosure — reads $HERMES_HOME/SOUL.md and writes it only through the agent's own file tools after you approve the draft (the bundled skill can suggest copying the approved file into other profiles' SOUL.md, again only on approval); writes two booleans (nudge_sent, flow_complete) to its own plugin-data state so the first-run offer happens once. No network I/O, no credentials."
maintainer: RegeneratusLabs
tier: community
category: tools
docs_url: https://github.com/RegeneratusLabs/Soul-Finder#readme
readme: true
platforms: [linux, macos]
requires_hermes: ">=0.21.5"
screenshots:
  - https://raw.githubusercontent.com/RegeneratusLabs/Soul-Finder/deec34636d95f898b084e6e24a19766ecd20acf2/screenshots/desktop.png
  - https://raw.githubusercontent.com/RegeneratusLabs/Soul-Finder/deec34636d95f898b084e6e24a19766ecd20acf2/screenshots/tui.png
capabilities:
  provides_tools:
    - soul_finder_status
    - soul_finder_complete
  provides_hooks:
    - on_session_start
  provides_middleware: []
  requires_env: []
