version: "0.1.0"
description: "Source-grounded research notebooks and an 8-format interactive Studio for Hermes Desktop: ingest PDFs, DOCX, Markdown, CSV/JSON tables, YouTube transcripts, local folders, and web URLs into local SQLite WAL notebooks with hybrid semantic + FTS5 BM25 retrieval, clickable passage citations, visual PDF page previews, a live Claim Ledger with cross-source contradiction detection, Coverage Map, universal Hermes model routing, and eight Studio formats (Study Guides, 2-Host Audio Overviews with Spoken Join-the-Podcast interruption, Mind Maps, SM-2 Flashcards, Quizzes, Bento Infographics, multi-view Data Tables, and AI-illustrated Slide Decks with inline editing and PPTX/PDF export). Disclosure — no telemetry, no credentials or secret file reads, no shell commands, no self-updating; notebooks and media stay under the profile's plugin-data; outbound requests happen only on explicit user URL/YouTube/Deep Research ingestion or optional edge-tts Audio Overviews (checked via tools.url_safety and agent.redact); local files outside plugin-data are read only when explicitly uploaded or synced via Folder / /sourcebook sync (checked via agent.file_safety); clicking Memory appends a cited excerpt to the profile's MEMORY.md."
maintainer: abundantbeing
