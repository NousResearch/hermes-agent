description: "Edit your screen-recorded YouTube videos with Hermes in Sous Chef, a local video editor: cut by the words in the transcript, rough cuts you approve (flubbed lines, fillers, silences) that learn from how you finish them, voiceovers, zooms, motion graphics, B-roll, captions, thumbnail, title and description, and export with ffmpeg. Adds the sous_chef MCP tools, a video-editing skill and a Sous Chef page in the desktop app. Needs the Sous Chef editor installed from its repository (Node.js 22+, ffmpeg). Disclosure: the tools and page talk only to the local Sous Chef edit server on 127.0.0.1, authenticated with the token the editor writes to its own data folder; if that server is not running, the plugin starts it as a background process from the location the Sous Chef app recorded, and it exits after 10 idle minutes. Source videos are never modified. The plugin makes no other network calls, stores no credentials and has no telemetry; features chosen inside the editor can call Hermes, a local Imagination Studio, or your Hermes image and video providers."
