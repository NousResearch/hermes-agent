name: sovereign-finance
title: Sovereign Finance
repo: https://github.com/gabonaut/hermes-sovereign-finance
sha: 9ff5c773ecb0b391d8eb7ab3f0dea745a4a4d385
description: "A self-custodial Smart Agentic Wallet for your agent on BNB Chain and Ethereum, with a Desktop pane. Your passkey is the admin, and the agent's session key is limited onchain to the contracts, functions and daily caps you approve. Powered by Altana. Disclosure — Crypto wallet plugin: the agent signs BNB Chain/Ethereum swaps and liquidity actions with a session key stored in plugin-data; every sovereign_execute call asks for Hermes approval (an \"always\" answer covers one pool or swap direction for that session key), but YOLO mode, approvals.mode off or approvals.cron_mode approve skip the prompt, and anything that reads the session key file (including the agent's own shell) can sign within the onchain contract/function/daily-cap limits without asking, because those limits do not pin recipients. Signed batches go to the Altana relay; it also talks to publicnode RPCs, DexScreener and skills.altana.network, runs a bundled Node CLI, and serves a localhost-only passkey page during admin actions. Its pre_tool_call guard refuses other tools' calls that mention its files, admin routes or the Hermes gateway socket."
maintainer: gabonaut
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.1.0"
docs_url: https://github.com/gabonaut/hermes-sovereign-finance#readme
