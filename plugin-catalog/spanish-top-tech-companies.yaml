description: "Find the day's tech job postings in Spain and remote roles open to it, from 400+ company job boards, each with what that company pays the role, read a posting's application form live, and apply with the person's yes, through a keyless hosted MCP server (Streamable HTTP), with the tech-pay-spain skill bundled. Salary medians from Levels.fyi submissions in Spain; every figure says how many people it comes from. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/). Disclosure — hosted-only connector with no local code; every tool call goes to spanishtoptechcompanies.com, which stores nothing about the user and counts each call in PostHog (EU) without an IP address: the tool, the filters or posting asked for, the result count, the client's name, the country and the agent's stated reason with emails, numbers and keys removed. job_questions makes the server read the posting from the employer's public job board. hiring_contact returns a named recruiter or hiring manager for a posting, with an email only where one was published for candidates and otherwise a LinkedIn profile; any message to them is written by the agent, approved by the person and sent from the person's own mailbox or LinkedIn account. report_application records an application's outcome, never anything about the person. Applications are sent by the agent's own browser only after the person says yes. The tool list comes from the server at run time, so the pinned commit doesn't cover it."
