  - https://raw.githubusercontent.com/tuanpv47/spanwall/dcd8456c3c861ba6c80ee89c4edd9753ccc5ecfa/assets/new-task-light.png
platforms: []
known_issues:
  - Developed and tested on Windows 10 only; macOS and Linux are untested.
  - Polling a watched profile can start its backend. Untick profiles you don't need in Settings -> Plugins -> SpanWall.
