name: spoonmaster
title: Spoonmaster
repo: https://github.com/gueysito/spoonmaster
sha: 20d0b1178321f4ef357b514f2ec757a6e6962dec
description: "Compare restaurants using local recommendations, venue facts, and optional private tastes. Disclosure — Spoonmaster runs restaurant research through your enabled Hermes search/extract tools (search providers and venue sites see the queries), observes your own native `browser_exec` calls in its named `spoon-<request>` browser session to keep their printed page text as evidence, adds about 2 KB of dining guidance to every turn, and stores optional tastes and saved companion groups, including other people's dietary needs, in a local 0600 SQLite file in this profile's plugin data; viewing them puts them in your transcript and model provider."
maintainer: gueysito
tier: community
category: tools
requires_hermes: ">=0.21.5"
version: "0.1.0"
known_issues:
  - Research time depends on the host model and sources. A long conversation ended before presenting one result.
capabilities:
  provides_tools:
    - spoon_dine
    - spoon_research
    - spoon_present
    - spoon_onboard
    - spoon_ledger
    - spoon_profile
    - spoon_feedback
    - spoon_companions
  provides_hooks:
    - on_session_reset
    - on_session_finalize
    - pre_llm_call
    - pre_tool_call
    - post_tool_call
    - transform_llm_output
  provides_middleware: []
  requires_env: []
