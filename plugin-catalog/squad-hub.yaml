description: >-
  One Desktop list for Hermes Agent Squads: bot, project, folder, worktree and chat, several bots open at once
  without a profile switch; the squad's cron jobs; a bell for what waits on you; live Kanban cards in chat; squad
  managers ask with clarify buttons; the empty chat names the squad and project. Disclosure — reads other profiles'
  session lists, projects and cron jobs through Hermes RPC (running backends only) and Kanban boards through its own
  read-only dashboard route; writes its own desktop_cards setting on manager profiles; no network calls of its own,
  no telemetry, never reads .env or credentials.
maintainer: PuntoyComaTech
