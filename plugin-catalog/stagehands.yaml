title: "Sovereign & Stagehands"
description: >-
  Typed backstage subagent delegation provider (scout, librarian, code_monkey,
  adversary, briefer) and deterministic 48k/120k context-sanitation janitor that
  keep bulky tool gravel out of the frontier parent session. Disclosure: registers
  a DelegationProvider via ctx.register_delegation_provider, one system prompt
  routing section, one context reference, and the /stagehands CLI command. No
  network calls, background daemons, telemetry, or credential reads in plugin
  code; optional /stagehands janitor backups and SQLite hygiene run locally only
  when explicitly invoked by the operator.
