title: "Sovereign & Stagehands"
description: >-
  Typed backstage subagent delegation provider (scout, librarian, code_monkey,
  adversary, briefer) and deterministic 48k/120k context-sanitation janitor that
  keep bulky tool gravel out of the frontier parent session. Disclosure: registers
  a DelegationProvider via ctx.register_delegation_provider, one system prompt
  routing section, one context reference, and the /stagehands CLI command. Reads
  the active profile's state.db read-only for stats and telemetry. Explicit on/off
  commands update delegation.backend; janitor commands update compression settings
  using Hermes's atomic config writer, without a separate backup. Plugin code makes
  no network calls of its own and stores no credentials.
maintainer: Peetbog69
