title: StalkChain
description: "Crypto research in plain English through the official StalkChain Data MCP server (Streamable HTTP at https://data.stalkchain.com/mcp/directory, OAuth sign-in, no keys in config): check a coin before you buy, vet a trader before you copy them, see what smart money is buying, review a wallet and set price alerts, across Solana, Ethereum, Base, BNB Chain, Monad, Hyperliquid and Robinhood Chain, plus the StonkFun launchpad. Portable Agent Plugins v1 package (mcp.json + 18 skills), no Python or executables; needs a StalkChain account with credits. The connector never trades, moves funds or signs anything. It can create and delete the user's own alerts after confirmation. Disclosure — the MCP server supplies its tool set at runtime independently of the pinned plugin commit. Tool names and inputs go to data.stalkchain.com. Metered calls spend StalkChain credits. StalkChain stores alerts until they fire or are deleted. New alerts from this connector go only to the email address on the signed-in StalkChain account. The pinned README describes a legacy webhook option that is unavailable when creating an alert through this connector."
