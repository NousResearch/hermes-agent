name: standing-orders
repo: https://github.com/jaxsonsprinkles/standing-orders
sha: 1959097a915e53624262c235e9eb102babece01f
title: Standing Orders
description: Plain-English camera triggers that wake your agent. Say "tell me if I leave my mug on the desk for 10 seconds"; the camera stays silent until it is true, then Hermes starts a turn with a short clip as evidence. macOS only; not a safety or security system.
maintainer: jaxsonsprinkles
tier: community
category: automation
requires_hermes: ">=0.22.7"
version: "0.1.0"
docs_url: https://github.com/jaxsonsprinkles/standing-orders
screenshots:
  - https://raw.githubusercontent.com/jaxsonsprinkles/standing-orders/1959097a915e53624262c235e9eb102babece01f/docs/images/mug-test-1.png
  - https://raw.githubusercontent.com/jaxsonsprinkles/standing-orders/1959097a915e53624262c235e9eb102babece01f/docs/images/mug-test-2.png
readme: true
platforms: [macos]
capabilities:
  provides_tools:
    - so_create_order
    - so_arm
    - so_disarm
    - so_list_orders
    - so_status
    - so_backtest
    - so_correct
    - so_add_list_item
  provides_hooks: []
  provides_middleware: []
  requires_env: []
