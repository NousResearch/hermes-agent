name: starlearner-nexus
title: "StarLearner-Nexus"
repo: https://github.com/BigBossRabbit/starlearner-nexus-hermes-skill
sha: 6f47e1b5101fa65ce1f65fe3f5391dd8559615c4
description: "Turn the repositories you star on GitHub into a living library of registered Hermes skills. `starlearner_sync` runs the whole pipeline — fetch, map (the LLM curation pass), categorize into a fixed set of domains, two-track assess (integrate-into-your-makeup and business-opportunity), generate, register (`starlearner-nexus:<name>`) — incrementally via a persistent seen-ledger (a repo is never processed twice); `starlearner_status` is read-only state (including token set / not set); `starlearner_review` surfaces everything LLM-shaped item by item for the human. The map / categorize / assess stages optionally run through the host LLM (`ctx.llm`, one registered auxiliary task) with a deterministic rules engine as the bit-for-bit fallback (`enrich: rules` = zero LLM calls); generate is never the LLM. Registration timing: handler-time `register_skill`, accepted and live in the same session (a skill view on a name the sync just returned resolves the same second); a plugin reload re-registers everything generated before it. Disclosure — origin of the reapx lineage (the reapx entry, same owner, is derived from this plugin and says so): contacts api.github.com only, one endpoint (`GET /user/starred` — the repositories you starred), over HTTPS, paginated and bounded (a hard page cap; a clean error, never a hang), authenticated with your own read-only GitHub token — a `requires_env` secret (rich format, hidden input at install) saved by the host and read back only through the host's secret scope (never a bare environment read), never in the plugin's files, logs, errors, or results; LLM enrichment (the default; off by setting `enrich: rules`) sends public repo metadata (name, description, topics, language, stars) through the Hermes host (`ctx.llm`) to your active provider and model with host-owned credentials — the plugin never sees or stores a key; reads nothing outside its own data (no browser, no cookies, no other tool's login), runs no shell commands or subprocesses (the fetch is in-process), no background processes of its own (a sync runs inside a bounded tool call; the optional automation blueprint is a ready-made cron job you must explicitly schedule); no telemetry; everything written stays in its own plugin-data store, nothing uploaded (the optional LLM enrichment excepted)."
maintainer: BigBossRabbit
tier: community
category: tools
requires_hermes: ">=0.22.6"
version: "1.2.0"
platforms: []
capabilities:
  provides_tools:
    - starlearner_sync
    - starlearner_status
    - starlearner_review
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - STARLEARNER_GITHUB_TOKEN
