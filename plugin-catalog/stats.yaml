title: Hermes Stats
description: "A usage dashboard for Hermes in the style of Oh My Pi's `omp stats`: overview, models, providers, costs, requests, errors, traces, tools, frustration and projects across every profile, plus a Calls page for z0live voice traces and a What to change page whose findings name the config key to change and the estimated impact. `hermes stats serve` runs it on 127.0.0.1, `hermes stats snapshot FILE` writes one offline HTML page, and `/stats [24h|7d|30d|90d|all]` answers in chat without a model call. Optional summaries and questions run on your auxiliary model (task stats_insights) only when you ask; every number in the model's text is checked against its input and the text is dropped if a check fails. Disclosure — reads every Hermes profile's state.db (from any profile, including through the /stats chat command) and, if present, ~/.local/share/z0live/voice-traces, read-only, and selects only ids, timestamps, session source, working-folder names, model and provider names, token counts, costs, tool names and error kinds, never message text; summaries and questions send only those aggregates and findings to your auxiliary model, and only when you ask; the dashboard server binds 127.0.0.1, rejects other Host headers and has no login, so other programs on this machine can read it while it runs; no telemetry, no credentials read. GPL-3.0-only; the dashboard client is forked from Oh My Pi (MIT)."
