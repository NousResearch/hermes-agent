sha: 433bcf90d5317b692733d5bf74e63b98650b471b
description: "Describe a piece of music and Hermes writes it as sheet music in Hermes Desktop: it plans the form, writes every bar in ABC notation, checks bar lengths, instrument ranges, guitar chord shapes and syntax and repairs what fails, then engraves the score. Playback lights each note as it sounds, guitar parts get TAB, and you change any bars you select by asking in words, with undo. Exports PDF, SVG, MIDI, WAV and ABC. Two agent tools (stave_check, stave_open) and the stave:compose skill let any chat compose and open pieces on the page. Disclosure — the page makes one stateless llm.oneshot call per step through its own Stave composer auxiliary task (Settings › Models; reasoning off by default) and creates no sessions; playback downloads FluidR3 GM instrument samples from paulrosen.github.io/midi-js-soundfonts the first time each instrument plays; stave_open writes one JSON file per piece to plugin-data/stave/inbox, which the page reads through the plugin's dashboard route and deletes; pieces and undo history live in Desktop plugin storage; files are written only when the user exports; no shell commands, no processes of its own, no telemetry."
maintainer: Adolanium
