title: Steward
description: "Your chief of staff in the team chat. Collects every department's weekly update in its own group (voice note in any language, text, photo or file), nudges only late teams, and gives the founder one weekly pack in their language with promised-vs-done, a stuck radar and a voice brief. Founder says \"send\" and all staff get the update. Disclosure — Steward reads every message in the department groups you configure and sends their weekly updates (text, voice-note transcripts, photos, documents) to your model and TTS providers; it creates Hermes cron jobs that post check-ins and nudges into those groups and deliver the founder pack, keeps reports and copies of attachments under HERMES_HOME/steward, and posts the staff pack to the all-staff group when the founder says \"send\".\nNotes: Not crypto. Steward is a multi-group chat assistant. Department reports go to the user's own model/TTS providers, they are stored locally under HERMES_HOME/steward (state.json is chmod 600, core.py:236), and the packs go only to the chat targets the user configures. Per earlier finding: ask 1 setup gate FIXED (__init__.py:264-283, 308); ask 2 founder pack/status gate FIXED (__init__.py:420, 431-435, 502-507); prior round's file confinement, week validation (now also a real-ISO-week and ±1-year check, core.py:77-91), founder-only publish (__init__.py:451) and cron-scheduling asks are still FIXED at the new pin. The unposted body posting/bodies/152830.md is superseded and should not be posted; this pin closes both of its asks. Delta b7c484f8..400dd9d4: 10 files (+1326/-132); I read the installed code delta in full (__init__.py, core.py, files.py, scheduler.py, skills) and did not read the two new test files beyond the scanner hits. Gates: validate ok (all checks green, isolation host, no warnings); scanner verdict safe. Its mediums are FPs: core.py:157-159 is the control/bidi-strip regex character class, and the rest are in tests/ (path-traversal/hex fixtures for the security tests, and a subprocess call in a test). The Disclosure text is the same as the last round and still accurate. requires_hermes >=0.23.0 is sane: cron.execution_identity is in v0.23.0 (df177429), and ctx.current_cron_execution is feature-detected. Catalog name/version/capabilities match plugin.yaml (7 tools, pre_llm_call). No exact pins (python_dependencies: []). PR carries only plugin-catalog/steward.yaml."
