description: "Work on the embroidery design open in Stitch Slop, watch it in a pane, and digitize artwork into machine stitch files. Ships the bridge its tab dials into (loopback WebSocket, protocol 1 of stitchslop.com/agent), a viewer page that streams a dedicated Chrome window and forwards clicks and keys, four tools, an arc-typesetting and art-prep script, and a bundled skill covering the digitizing workflow. Disclosure — writes ~/.stitchslop (pairing, Chrome profile, exports, logs), shared by every Hermes profile on the machine; starts a loopback WebSocket bridge, a token-gated viewer server and a dedicated Chrome (launched with --no-sandbox and Local Network Access checks off) on a private X display; the viewer binds to loopback only unless you set STITCHSLOP_PANE_BIND to a Tailscale address, which exposes the token-gated viewer (live view and click/key control of that Chrome, logged into your Stitch Slop account) to your tailnet; navigation is limited to https://stitchslop.com; first pairing needs you to paste the Agent-panel token by hand."
