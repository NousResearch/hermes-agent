name: stoa
title: Stoa
repo: https://github.com/jarrett-del/hermes-stoa
sha: 9ebe8050b05dedd80fc5c691b1005bfc9ca655bc
description: "A go-to-market desk for small teams: a SQLite pipeline, playbooks that fit it to recruiting, B2B sales or an agency, Slack cards whose buttons move a stage at once and hand the writing to Hermes, meeting notes that become next steps. Disclosure — optional network calls to api.peopledatalabs.com and public-api.granola.ai only when their keys are set; reads the notes folder and CSV paths you name; with allow_gateway_injection a button click queues one agent turn in the card's thread. Hermes Agent Plugin Hackathon entry."
maintainer: jarrett-del
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.1.0"
platforms: [linux, macos]
image: https://raw.githubusercontent.com/jarrett-del/hermes-stoa/9ebe8050b05dedd80fc5c691b1005bfc9ca655bc/docs/banner.png
capabilities:
  provides_tools:
    - gtm_pipeline
    - gtm_deal
    - gtm_card
    - gtm_enrich
    - gtm_notes
    - gtm_playbook
    - gtm_export
  provides_hooks: []
  provides_middleware: []
  requires_env: []
