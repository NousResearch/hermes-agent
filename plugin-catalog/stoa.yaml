name: stoa
title: Stoa
repo: https://github.com/jarrett-del/hermes-stoa
sha: 9215f6ba5b6df357f0d41faeb49d89e8924342bd
description: "The CRM for Hermes Agent, a lightweight one you talk to: map a market, find the leads, run the pipeline and see it through to cash. Hermes runs it and you approve: what it finds waits for your yes or no, and every change can be taken back. Optional paid lookups and network calls happen only with your own keys; the README's Disclosure section lists everything it reads, writes and sends."
maintainer: jarrett-del
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.15.0"
platforms: [linux, macos]
