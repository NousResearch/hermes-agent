name: stoa
title: Stoa
repo: https://github.com/jarrett-del/hermes-stoa
sha: 086385aefac95beca2a1a23f80854a55ddafe365
description: "A go-to-market desk for small teams: map a market, find the leads, run the pipeline. Market maps with fit scores and evidence that become leads in one click, a live web dashboard tab (funnel, pipeline board, market map), a SQLite pipeline, playbooks that fit it to any niche, Slack cards whose buttons move a stage at once and hand the writing to Hermes, and meeting notes that become next steps. Disclosure — optional network calls to api.peopledatalabs.com (paid per result, capped), api.exa.ai and public-api.granola.ai only when their keys are set; reads the notes folder and CSV paths you name; with allow_gateway_injection a button click queues one agent turn in the thread. Hermes Agent Plugin Hackathon entry."
maintainer: jarrett-del
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.3.0"
platforms: [linux, macos]
