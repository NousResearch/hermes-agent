name: stoa
title: Stoa
repo: https://github.com/jarrett-del/hermes-stoa
sha: 41e20285523ca4156ba45d010b25bca07dbfa65e
description: "The CRM for Hermes Agent, a lightweight one you talk to: map a market, find the leads, run the pipeline and see it through to cash. Hermes runs it and you approve: what it finds waits for your yes or no, and every change can be taken back. Optional paid lookups and network calls happen only with your own keys; the README's Disclosure section lists everything it reads, writes and sends. Disclosure — optional network calls to api.peopledatalabs.com (paid per result, capped), api.exa.ai and public-api.granola.ai only when their keys are set; dictation on the page is the browser's own speech recognition (in Chrome, Google's service) and runs only while its button is on; reads the notes folder, .csv and .tsv files in its imports folder, a folder you name or the working directory, and a file you drop on the page; writes only inside its own data folder, including daily backup copies of each pipeline; scheduled jobs reach the desk only when you add cron to its channels setting, and then change only what its autonomy setting allows (by default they only log what they find and leave every other change waiting for your approval; \"Run it\" lets them make any change); the automations offered under /blueprint run only when you switch them on, and the Google Sheet ones use your own Google connection in Hermes; invoices and payments are records kept on the desk, never sent or charged; a Slack button works only for the person a card was posted for or the people listed in slack_users; with allow_gateway_injection a button click queues one agent turn in the thread; the page's dock, and the market map's research, each send what you type or press to a visible conversation of their own, on the model you pick for it from Hermes's own list; two hooks (post_api_request, post_llm_call) count the model calls, tokens and Hermes's estimated cost of turns that work on a market map, counts only, with no prompt or reply read or kept; pressing Test beside a key makes one small request to that key's service; Look for a folder checks a few usual folders for notes when pressed, counting files and opening none. Hermes Agent Plugin Hackathon entry."
maintainer: jarrett-del
