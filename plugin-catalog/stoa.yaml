name: stoa
title: Stoa
repo: https://github.com/jarrett-del/hermes-stoa
sha: 0d44ddfa9cea1f845f780898fa65f480d5080a57
description: "A lightweight CRM you talk to: map a market, find the leads, run the pipeline. Send it a list in any form and approve what it would add or change before anything is saved. Market maps that check every company against your requirements with evidence, show who holds the market and who to call first, export as a shareable page and become leads in one click; a page and a live pane in the Desktop app and Webapp, with a funnel, a drag-and-drop board, a dock to talk to it, and cards and maps drawn in the conversation; a web dashboard tab; a SQLite pipeline, playbooks that fit it to any niche, Slack cards whose buttons move a stage at once and hand the writing to Hermes, and meeting notes that become next steps. Disclosure — optional network calls to api.peopledatalabs.com (paid per result, capped), api.exa.ai and public-api.granola.ai only when their keys are set; dictation on the page is the browser's own speech recognition (in Chrome, Google's service) and runs only while its button is on; reads the notes folder and CSV paths you name, and a file you drop on the page; writes exports to its own data folder; with allow_gateway_injection a button click queues one agent turn in the thread; the page's dock sends what you type to a visible conversation of its own. Hermes Agent Plugin Hackathon entry."
maintainer: jarrett-del
tier: community
category: tools
requires_hermes: ">=0.23.0"
