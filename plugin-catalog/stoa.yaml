name: stoa
title: Stoa
repo: https://github.com/jarrett-del/hermes-stoa
sha: 5c7aef6a41f581a718b66b25b0fec59f8deac2d7
description: "A go-to-market desk for small teams: map a market, find the leads, run the pipeline. Market maps with fit scores and evidence that become leads in one click, a SQLite pipeline, playbooks that fit it to any niche, Slack cards whose buttons move a stage at once and hand the writing to Hermes, and meeting notes that become next steps. Disclosure — optional network calls to api.peopledatalabs.com (paid per result, capped), api.exa.ai and public-api.granola.ai only when their keys are set; reads the notes folder and CSV paths you name; with allow_gateway_injection a button click queues one agent turn in the thread. Hermes Agent Plugin Hackathon entry."
maintainer: jarrett-del
tier: community
category: tools
requires_hermes: ">=0.23.0"
version: "0.2.0"
platforms: [linux, macos]
image: https://raw.githubusercontent.com/jarrett-del/hermes-stoa/5c7aef6a41f581a718b66b25b0fec59f8deac2d7/docs/banner.png
capabilities:
  provides_tools:
    - gtm_pipeline
    - gtm_deal
    - gtm_card
    - gtm_market
    - gtm_enrich
    - gtm_notes
    - gtm_playbook
    - gtm_export
  provides_hooks: []
  provides_middleware: []
  requires_env: []
