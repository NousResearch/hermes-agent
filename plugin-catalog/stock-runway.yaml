description: >-
  See when each product will run out and when to reorder. Forecasts monthly demand,
  shows past demand, deliveries and stock on one chart, grades forecast accuracy, and
  lists what to order now (quantity and order-by date, with lead time, MOQ and pack size).
  Works from the bundled sample, a local CSV, or an optional read-only Odoo connection
  configured through Hermes secrets. Adds a /stock command, a stock_runway tool and a
  Desktop page. Disclosure — with the Odoo source it makes read-only XML-RPC calls to the
  Odoo server you configure; the sample and CSV sources make no network calls.
