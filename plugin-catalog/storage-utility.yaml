title: Tune-up
description: "Keep Hermes fast, healthy and tidy from one Desktop panel. Clean up sorts the Hermes home into Safe to clean, Take a quick look and Kept safe on purpose, with plain-language answers to what is it, is it safe and can I undo; it reviews exact items before anything happens and reports the measured space recovered. It runs the maintenance Hermes ships but few people find (sessions prune with preview, pm gc, uv cache prune, checkpoints, worktree prune, session-database packing), finds folders Hermes created elsewhere from its own session history, and moves reviewable items to a restorable 30-day Trash. Checkup explains down or crash-looping Hermes services and stops leftover agent processes; Explore shows a size map with folder descriptions and duplicate finding; optional consented AI explanation via its own auxiliary task. Disclosure: no network except the optional, consented AI explanation (folder totals and counts only, no names or contents) through Hermes's routing; reads home metadata, session history, /proc and systemctl status; on user confirmation runs allow-listed hermes/uv/git maintenance commands (no shell), systemctl start/restart/stop/disable on Hermes services, can write a Restart=always drop-in and run 'hermes plugins enable disk-cleanup' when asked, sends SIGTERM to selected leftovers, and briefly stops and restarts Hermes services to pack state.db; never opens credential files; state in <home>/storage-utility; no telemetry."
