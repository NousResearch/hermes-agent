title: Strategic Arena
description: >-
  Understand the landscape before you invest: give it a link and get the room that
  reacts — who can block adoption, what each concession buys, and the claims you can
  score later. Research papers also get a replication clock.
maintainer: LeMultiFox
tier: community
category: tools
version: "0.6.4"
requires_hermes: ">=0.23.0"
docs_url: https://github.com/trillionverselabs-boop/strategic-arena/blob/main/docs/POSITIONING.md
image: https://raw.githubusercontent.com/trillionverselabs-boop/strategic-arena/83563c423608aaa8ca51ad0f65fc0fc9c1bdaa10/assets/marketplace.png
screenshots:
  - https://raw.githubusercontent.com/trillionverselabs-boop/strategic-arena/83563c423608aaa8ca51ad0f65fc0fc9c1bdaa10/assets/how-it-works.png
readme: true
platforms: []
capabilities:
  provides_tools:
    - arena_run
    - arena_status
    - arena_report
    - arena_history
    - arena_calibration
    - arena_due
    - arena_export
  provides_hooks: []
  provides_middleware: []
  requires_env: []
known_issues:
  - "A run uses the model your Hermes default model setting is on; there is no model picker by design."
  - "Free models are supported but rate-limited: a large input (a research paper, a long technical post) can run several times slower and may be interrupted. A paid model is recommended for those. If a run fails on a rate limit, change the model in the app and run it again."
  - "The desktop UI loads from the machine running the app, so a UI change needs Install from Git with the Desktop target on that machine."
  - "PDFs outside arXiv need a text layer; a link that cannot be read is reported as SKIPPED in the run's provenance, never silently dropped."
