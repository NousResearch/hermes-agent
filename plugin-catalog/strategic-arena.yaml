known_issues:
  - "A run uses the model your Hermes default model setting is on; there is no model picker by design."
  - "Free models are supported but rate-limited: a large input (a research paper, a long technical post) can run several times slower and may be interrupted. A paid model is recommended for those. If a run fails on a rate limit, change the model in the app and run it again."
  - "The desktop UI loads from the machine running the app, so a UI change needs Install from Git with the Desktop target on that machine."
  - "PDFs outside arXiv need a text layer; a link that cannot be read is reported as SKIPPED in the run's provenance, never silently dropped."
