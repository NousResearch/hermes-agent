name: stripe-commerce
repo: https://github.com/adroidian/stripe-commerce-hermes
sha: 2ae7b4950a8cde4c755dda933e398298eff758f3
subdir: ''
description: >-
  Merchant-side Stripe for agents: products, prices and payment links through an
  enforced restricted-key boundary. Sends the merchant's restricted Stripe key
  (Authorization header), catalog parameters and per-preview idempotency key to
  api.stripe.com over TLS; Stripe records requests with key attribution.
  Stripe-returned catalog and subscription state enters tool output and may be
  retained in session logs; customer details and payment methods are omitted.
  Preview references and request payloads are held in bounded process memory for
  five minutes, with no plugin-owned disk persistence or telemetry. Native
  confirmation uses the existing Hermes UI/channel and may enter host logs;
  direct API traffic is limited to Stripe.
  Each write requires an unchanged single-use preview and fresh native human
  consent through a verified Telegram or Discord gateway prompt. CLI/TUI and
  other channels are read/preview-only. Missing or incompatible consent/display
  support blocks writes. No refund, charge, payout or
  subscription-mutation endpoint is reachable.
maintainer: adroidian
tier: community
category: tools
requires_hermes: '>=0.21.0'
version: 0.2.0
known_issues:
  - >-
    Strict one-operation consent currently uses feature-detected internal Hermes
    approval/context APIs. The validator reports a compatibility warning; missing
    or incompatible APIs block writes. See VALIDATION.md before enabling writes.
    Writes are supported only through native Telegram/Discord gateways. CLI/TUI,
    QQ and other channels are read/preview-only because complete-display consent
    is not established there. Long requests that cannot fit the prompt are refused.
capabilities:
  provides_tools:
  - stripe_whoami
  - stripe_list_products
  - stripe_create_product
  - stripe_archive_product
  - stripe_list_prices
  - stripe_create_price
  - stripe_deactivate_price
  - stripe_create_payment_link
  - stripe_list_payment_links
  - stripe_deactivate_payment_link
  - stripe_list_subscriptions
  - stripe_get_subscription
  - stripe_portal_config
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - STRIPE_API_KEY
platforms:
- linux
- macos
- windows
