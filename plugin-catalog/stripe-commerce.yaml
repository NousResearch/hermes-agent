name: stripe-commerce
repo: https://github.com/adroidian/stripe-commerce-hermes
sha: 14fd9b75c113e5f7cf9849c0da9e05329ce39869
subdir: ''
description: "Merchant-side Stripe for agents: products, prices and payment links\
  \ through an enforced restricted-key boundary. Disclosure \u2014 sends the merchant's\
  \ restricted Stripe key (Authorization header) plus the catalog parameters the model\
  \ writes (product names, descriptions, amounts, link settings) to api.stripe.com\
  \ over TLS; Stripe records requests in API logs with key attribution. Stripe-returned\
  \ catalog and subscription state enters tool output and may be retained in session\
  \ logs (customer details and payment methods are projected out). No local persistence,\
  \ no telemetry, no other hosts. Mutations default to offline dry-run previews; execution\
  \ requires explicit approval. No refund, charge, payout or subscription-mutation\
  \ endpoint is reachable."
maintainer: adroidian
tier: community
category: tools
requires_hermes: '>=0.21.0'
version: 0.1.0
capabilities:
  provides_tools:
  - stripe_whoami
  - stripe_list_products
  - stripe_create_product
  - stripe_archive_product
  - stripe_list_prices
  - stripe_create_price
  - stripe_deactivate_price
  - stripe_create_payment_link
  - stripe_list_payment_links
  - stripe_deactivate_payment_link
  - stripe_list_subscriptions
  - stripe_get_subscription
  - stripe_portal_config
  provides_hooks: []
  provides_middleware: []
  requires_env:
  - STRIPE_API_KEY
platforms:
- linux
- macos
- windows
