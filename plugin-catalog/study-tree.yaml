known_issues:
  - "The cards, the pane and the widgets need Hermes Desktop. On the CLI, the TUI and messaging platforms a card shows as a plain ::study-tree-node line and a widget as a plain ::preview line."
  - "The Desktop half is off by default: turn on Study Tree under Capabilities → Plugins after installing."
  - "Widgets in the pane are view-only; their follow-up buttons work in the chat."
