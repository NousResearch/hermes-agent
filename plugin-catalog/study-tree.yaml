version: "0.1.1"
title: Study Tree
description: "Study with the agent without losing the thread: a side question you ask becomes its own branched session, the side threads show as a tree in a Desktop pane, and each one hands one recall-checked takeaway back to the thread it came from. The agent can also draw interactive widgets and one-question quizzes inline, with follow-up buttons. Disclosure: stores its tree in SQLite and agent-written HTML widgets under the active profile's plugin-data/study-tree/ (a widget over 200 KB or with any network reference is refused; Desktop shows it in its sandboxed preview frame); opens Hermes' state.db read-only to follow compression lineage; adds a short section to every session's system prompt, and through pre_llm_call injects a side-thread frame on each side-thread turn and each takeaway once into the parent's next turn; through transform_llm_output rewrites the final reply (study cards moved to the end as their own paragraphs, cards with unknown ids dropped, widget directives put on their own paragraphs, a widget button's prompt quoted at the top); creates a branched session (session.branch or session.branch_stored), renames it with session.title and sends the side question as its first prompt only when the user clicks Open; the Desktop half keeps the last text selected in the window in memory for 60 seconds to prefill the side-question dialog, and writes the glossary to the clipboard only when the user clicks Export glossary. No network calls, no shell commands, no background processes, no stored credentials, no telemetry."
maintainer: IpastorSan
tier: community
category: desktop
