description: "Password-gated Tor onion access to the local Hermes webapp or dashboard. Disclosure — when you start it, Styx publishes your Hermes web UI (which can run commands on this machine) as a Tor onion service: anyone with the onion address and your Styx passphrase gets a full Hermes session. Starting it turns on webapp.enabled in config.yaml, builds the webapp, and may restart the Hermes gateway (interrupting running turns); setup can install Tor through your system package manager after you confirm. The optional Styx Fast chat page, off unless you choose it, uses the same Hermes sign-in and sends chats, files and (only when you allow the microphone) voice recordings to this Hermes instance."
