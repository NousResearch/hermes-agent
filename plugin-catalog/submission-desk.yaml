version: "0.1.0"
title: Submission Desk
description: >-
  Readiness ledger for one application (a grant, a scholarship, a university or a job portal).
  Each requirement you confirm is tied to a verbatim quote from your saved instructions, the exact
  portal field label and the exact file revision (SHA-256). Local checks run on those bytes (real
  format, exact size, PDF pages, word counts) and say unknown instead of guessing; a changed file,
  rule or mapping makes earlier reviews stale. The agent proposes; only you confirm, review and
  attest, on a Desktop page or with /submission-desk. Exports a hand-back checklist and manifest.
  It never logs in, uploads, signs or submits.
  Disclosure: reads files only inside the application folder you choose (a folder the agent proposes
  is read only after you confirm it); never writes your files; parses PDFs with pypdf in a short-lived
  child process with CPU, memory and time limits; keeps its ledger and exports in the plugin's own
  data folder. No network calls, telemetry, credentials, shell commands or background processes.
