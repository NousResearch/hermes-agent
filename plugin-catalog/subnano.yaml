description: "Subnano pay-per-post marketplace through Subnano's local MCP server: search and read public Posts, buy access to paid Posts and files in Nano (XNO) or USDC on Base within spending grants the user sets, draft and publish the user's own Posts, answer comments and Requests, and receive payouts. Bundles seven workflow skills. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/ + a bundled Node server). Disclosure: spends real money; every purchase, tip, transfer, publication, account creation and file-root change asks the user through MCP elicitation, and Hermes declines those prompts in unattended runs. Calls subnano.ai, a Nano RPC node the user configures, a Nano work server (BerryPay's public endpoint by default; it receives only a public block root and difficulty; the user may instead opt into proof-of-work on their own CPU) and mainnet.base.org for balance reads. Stores account sessions and local wallet keys owner-only in ~/.local/state/subnano-mcp. Opens the browser and a short-lived loopback listener for account sign-in. No telemetry. Never checks for or installs its own updates. Requires Node 24.22.1+ (24.x) or 26.12.1+ (26.x)."
