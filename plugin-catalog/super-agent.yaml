sha: 61e5565e715e57d67f609810ac5fcbbc9d5bc4a7
subdir: super-agent
title: Hermes Super Agent
description: "Lead-Worker Super Agent coordination and turn supervision for long chat turns. After 60 s in one turn the chat-facing Lead agent is reminded to answer or delegate, and at 120 s editing and execution pause while reads, delegate_task and wrap-up tools stay available; a foreground terminal command running past 30 s is asked to yield to Hermes's background process registry (the same path a mid-turn user message takes) so the turn is released instead of hanging. Each Worker subagent is briefed before it starts with the user's own words, memory and the task ledger; a Worker that returns the same step result repeatedly is stopped, a Worker's open question is carried back to the Lead agent, and a background Worker's result is repeated until the user has seen it. Delegated tasks are recorded in a SQLite ledger that survives gateway restarts. Governance is a positive allowlist: only the platforms named in governed_platforms (default weixin) and the subagents they spawn are affected, and every other surface runs untouched. Disclosure — registers hooks for pre_llm_call, pre_api_request, pre_auxiliary_call, post_auxiliary_call, pre_tool_call, post_tool_call, transform_tool_result, subagent_start, subagent_stop, on_session_end, on_session_reset and on_session_finalize, a system-prompt section and a tool_execution middleware, so for governed sessions it can block or amend tool calls and results, LLM request context and subagent handoffs, and asks a governed foreground terminal command still running after 30 s to move to Hermes's background process registry (through core's internal yield flag, which a Hermes release may change); it copies your Hermes USER.md and MEMORY.md memory files in full into every governed delegate_task brief, can start an internal agent turn via inject_message to re-report an unseen subagent result, and writes a local ledger.db under the plugin's Hermes data directory; no network calls, no agent tools, no credentials, no shell commands."
maintainer: JerryLiu369
tier: community
category: automation
docs_url: https://github.com/JerryLiu369/hermes-super-agent
version: "0.2.0"
requires_hermes: ">=0.22"
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_llm_call
    - pre_api_request
    - pre_auxiliary_call
    - post_auxiliary_call
    - pre_tool_call
    - post_tool_call
    - transform_tool_result
    - subagent_start
    - subagent_stop
    - on_session_end
    - on_session_reset
    - on_session_finalize
  provides_middleware:
    - tool_execution
  requires_env: []
