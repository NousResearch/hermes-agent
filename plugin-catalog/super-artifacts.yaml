description: "Publish pages, forms, trackers and proofs as live URLs that open on a phone, and read back what visitors submit, through the hosted Super Artifacts MCP server (Streamable HTTP, OAuth 2.1 + DCR), with the super-artifacts workflow skill bundled. Portable Agent Plugins v1 package (mcp.json + skills/), no code. Disclosure — hosted-only connector: every tool call goes to superartifacts.app/mcp; published artifacts and what visitors submit to them are stored on Super Artifacts' servers. Artifacts are private by default, and the skill tells the model to publish private and never widen who can open one unless the person asked; Hermes does not prompt before these tools run unless you set `trust: untrusted` on the server. No telemetry. OAuth must be enabled with `hermes mcp add super-artifacts --url https://superartifacts.app/mcp --auth oauth --connect-timeout 300`; the bundled mcp.json alone yields 401."
