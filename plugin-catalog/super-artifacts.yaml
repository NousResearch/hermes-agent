known_issues:
  - "Webhooks need one public HTTPS address that forwards to your local Hermes webhook listener; the card asks for it once and never starts or restarts the gateway."
  - "The Connect button lives in hermes dashboard (Super Artifacts tab). Desktop shows a paste-key field under Settings → Plugins; get a key at superartifacts.app/api-keys."
