description: "Publish pages, forms, trackers and proofs as live URLs that open on a phone, and read back what visitors submit, through the hosted Super Artifacts MCP server (Streamable HTTP), with the super-artifacts workflow skill and a Hermes dashboard Connect page and Webhooks card bundled. Disclosure — hosted service: every tool call goes to superartifacts.app/mcp; the dashboard backend also calls its account, artifact, device sign-in and webhook endpoints, and the Webhooks card, when you configure it, saves a signing secret in the current profile's webhook route store (never sent to dashboard JavaScript) and never starts or restarts your gateway.; published artifacts and what visitors submit are stored on Super Artifacts' servers. The creator key is saved in the current profile's .env as SUPER_ARTIFACTS_KEY and sent as a bearer header; it never reaches dashboard JavaScript. Disconnect removes the local key; revoke it at superartifacts.app/agents. No telemetry. Artifacts are private by default, and the skill tells the model to publish private and never widen who can open one unless the person asked; Hermes does not prompt before these tools run unless you set `trust: untrusted` on the server."
