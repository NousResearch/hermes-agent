name: superlocalmemory
repo: https://github.com/qualixar/superlocalmemory
sha: 2aeef02a3007c3bdc097b4b00e89c905f1b72289
subdir: hermes-plugin
description: "Local-first long-term memory for Hermes, kept on your own computer: recall before each turn, tool-outcome logging, opt-in turn capture, 16 skills and /slm commands. Disclosure — talks only to the `superlocalmemory` MCP server you configure and grant in `plugins.entries.superlocalmemory.mcp_allowlist` (on this computer, or on another one with `connection: remote`): each turn's user message (redacted) is sent for recall and every tool call's arguments and result (redacted, up to 2,000 characters each) are logged to it, and with `capture_turns` on every turn is saved; `/slm` commands run the local `slm` CLI, including ones that change SLM and host settings (`/slm upgrade-hosts --apply` writes the plugin's grant into Hermes config.yaml); `slm_agent` starts a child agent that inherits the parent session's tools."
maintainer: Qualixar
tier: community
category: tools
requires_hermes: ">=0.21.6"
docs_url: https://github.com/qualixar/superlocalmemory/blob/main/docs/hermes.md
version: "4.2.6"
title: SuperLocalMemory
known_issues:
  - "Grant the plugin its memory server after install: slm upgrade-hosts --host hermes --apply (adds mcp_allowlist: [superlocalmemory])."
capabilities:
  provides_tools: [slm_agent, slm_agent_status, slm_agent_cancel, slm_agent_result]
  provides_hooks: [on_session_start, pre_llm_call, post_tool_call, post_llm_call, on_session_end, on_session_finalize, on_session_reset, on_skill_lifecycle, subagent_start, subagent_stop]
  provides_middleware: []
  requires_env: []
