version: "1.2.0"
description: >-
  Five analytics workflow skills for SuprAnalytics: weekly performance reports,
  traffic source analysis, funnel drop-off analysis, revenue attribution, and
  Core Web Vitals / audit review. Connects to the SuprAnalytics remote MCP
  server via OAuth. All access is read-only. Network destination:
  https://supranalytics.app/mcp. No credentials are stored in the plugin.
  Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration
  only. Disclosure: every tool call goes to supranalytics.app/mcp; the server
  records usage per its privacy policy (https://supranalytics.app/privacy).
  No shell commands, no background processes, no self-updating code. The tool
  set is served by the remote server at runtime and is not covered by the
  pinned sha.
