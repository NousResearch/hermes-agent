platforms: []
title: "surp-hermes-x402-llm"
capabilities:
  provides_tools:
    - surp_models
    - surp_quote
    - surp_cache_status
    - surp_chat
    - surp_usage
    - surp_jev_stats
    - surp_combo_create
    - surp_combo_list
    - surp_combo_get
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - SURP_API_KEY
