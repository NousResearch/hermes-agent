sha: e8ae13c487812d82d8667033f7623f19ede32b09
title: Swarm Studio
description: "A whole creative studio inside Hermes. One prompt, and a crew of agents you can watch and steer builds the whole launch on a live canvas: a multi-page website, a working web app with a database, a playable game (also as a Godot, Unity or Unreal project), a promo film and the social posts. Open it from the Desktop sidebar, ask for a site in any chat (the swarm_design tool), type /swarm, or run `hermes swarm`. The crew uses the models you already set up in Hermes, through three Hermes auxiliary slots (planner, builder and reviewer, set in hermes model). Builds can be posted to Swarm Feed, where others try them live and remix them with credit. Disclosure — starts a small Node server (Node 18+ needed) that listens on 127.0.0.1 only and refuses any other Host. It runs detached, so it outlives Hermes, and exits once it has had nothing to do for 20 minutes (Settings › Background: 10, 20, 60 minutes or never), starting again on next use; after an update it replaces itself with only the environment the launcher gave it. A built app runs on its own 127.0.0.1 port, at most 2 at once, each stopped after 2 minutes nobody looks at it. Model calls (planner, builders, reviewer, and the app engine) go to Hermes through a loopback bridge with a per-process token and are answered with ctx.llm on the plugin's three auxiliary slots, so no provider key leaves Hermes; only when you set SWARM_STUDIO_API_KEY does the server call SWARM_STUDIO_BASE_URL itself with that key. The Studio never receives, sends or stores a model-provider key: Setup has no key field and no route accepts one; a key provider shows `hermes auth add <provider> --type api-key` for you to run in your own terminal, where Hermes asks for the key with its own hidden prompt. Browser sign-in is `hermes auth add <provider> --type oauth`, started with HERMES_HOME only; Hermes opens the browser and keeps the token, and the Studio only shows the link and code Hermes prints. The only Hermes settings it changes are the auxiliary.swarm_studio_planner and auxiliary.swarm_studio_builder slots (provider and model, never a secret) through `hermes config set`, and a test holds it to those two. Setup's model list makes one read-only import outside the public plugin API, hermes_cli.inventory (build_model_options_payload, load_picker_context), because Hermes 0.23.1 has no public way to list providers and models; it writes nothing. On a multiplexed gateway only, and only when Hermes has bound no secret scope, bridge.py binds the scope Hermes builds for the plugin's own profile around a bridge request, in a copied context (a workaround for NousResearch/hermes-agent#132887 until #132898 ships); Hermes reads the keys, the plugin never does. The one-time Setup sheet sends \"Say ok\" to your planner and builder slots to check they answer. Pictures go through Hermes's image_generate tool and clips through video_generate; MCP tools (e.g. Supabase) go through ctx.call_mcp, only for servers you grant in mcp_allowlist (the studio never edits it, and runs `hermes mcp install` only after you confirm). A Launch kit post to Discord, Slack or Telegram goes out through your Hermes gateway (`hermes send`) only after you confirm its exact text. Keys: the optional keys named in plugin.yaml are read by the launcher through Hermes's secret scope (get_secret) when the server starts and passed to it in its environment. Besides those, you can paste a Vercel or Cloudflare token in the Publish menu, checked with the provider and kept in $HERMES_HOME/swarm-studio/connections.json with mode 0600, or an Octo vault grant (octo_vault_…), which is not stored: connections.json keeps only a 30-day working key for that one vault item, renewed, and every call goes through Octo's relay at octodb.design-bakery.com. A pasted ElevenLabs key is kept in $HERMES_HOME/swarm-studio/media-keys.json with mode 0600. Pasted tokens never go back to the page, onto a command line or into a log. JEV_KEY, an OpenRouter key kept only for the Game room's Autoplay, is sent by the server itself to openrouter.ai/api/alpha/decisions, outside Hermes: while Autoplay runs, about once a second, with what is on the game's screen (scene, button labels, dialogue, the hero's health, enemy and object names, up to 300 characters of page text, and a game's own published state); without it the moves are scripted and nothing is sent, and your Hermes model keys are never used for it. It reads no .env file, Hermes's included, and stops the app engine from reading one. Every child process gets a minimal environment (PATH, HOME, TMPDIR, locale, plus only the keys that program needs). Generated pages run in frames sandboxed with allow-scripts and no same origin with the studio. A built app's frame adds allow-forms, and only while the app is served from its own 127.0.0.1 port (an origin other than the studio's) also allow-same-origin, for its own sign-in and storage, and allow-popups; never allow-modals or top navigation. Design-system previews are allow-scripts only, and /site/ and the live video pages are served with a sandbox allow-scripts CSP. Bring in a project copies a folder from your home folder, or fetches a GitHub repository's newest commit with your own git and gh login: files only, at most 200 MB and 20,000 files, never node_modules, .git, build output or .env files, and nothing of it runs. A Vite project is installed, built and started only after you say \"install and run it\" for that project; it installs with pnpm --ignore-scripts --ignore-pnpmfile, and the app engine's installs for it with the same settings, until you say \"run its install scripts\" for that one project. A pulled version asks again, no Hermes tool can give either yes, and its install, build and servers get none of your keys. A project's source can be pushed to and pulled from GitHub with your own gh login (gh repo create, private unless you pick Public; git through gh's credential helper; no token is read or kept): it never force-pushes, touches only repositories it made or you named, and refuses a push whose commits hold a key file (.env, *.pem, *.key, .npmrc and the like). When the model asks to publish, deploy, push to GitHub or post, Hermes's approval prompt asks you first, and it is refused with nobody present and in a cron job. Copy the look of a site opens a public link in a headless Chrome already on your machine and walks up to three of its pages; every request it makes goes through a proxy on 127.0.0.1 for that walk only, which resolves each name itself and connects only to public unicast addresses (private, loopback, link-local, 100.64/10, multicast, reserved, cloud-metadata and IPv4-mapped addresses are refused, DNS rebinding included); that Chrome resolves no name itself, sends no WebRTC traffic outside the proxy, and HTTPS is tunnelled, not decrypted. The canvas loads Tailwind from cdn.tailwindcss.com and fonts from Google Fonts; film pages load GSAP 3.14.2, and a section's check picture html-to-image 1.11.11, from cdn.jsdelivr.net. Publish runs your gh CLI (GitHub Pages) or calls Vercel / Cloudflare Pages with a token you connect; App deploy uploads the app's source to your Vercel. The first promo video installs hyperframes 0.9.26 (telemetry and update checks off), and ffmpeg/ffprobe when not on PATH, from npm at exact versions, checking the binaries' SHA-256 before running them; the first voiceover installs kokoro-js 1.2.1 from npm and its voice model from Hugging Face; the first picture it resizes installs @napi-rs/image 1.16.0 and thumbhash 0.1.1 with npm ci --ignore-scripts from a pinned lockfile; the first app build installs the vendored dyad app engine's packages from npm (about 1.5 GB, once); while a picture is painted its slot shows a stock photo found on Openverse (and Pexels, with a key), photos from the studio's own library come from files.design-bakery.com, and game art from the assetrizz library on raw.githubusercontent.com; ckff, Fish Audio, ElevenLabs, Meshy, Supabase, Stripe (test keys only) and Resend are called only when you set their key; Swarm Feed (https://swarm.design-bakery.com) is contacted only when you run /swarm connect, post, remix or login. No telemetry. Bundled, with version, licence and SHA-256 beside each, nothing installed: XState 5.33.3, snapDOM 3.7.0, Mermaid 12.2.0 (the build wall's Map, served by the plugin's own server and drawn at Mermaid's strict security level), execa 9.6.1 and tree-kill 1.2.2, and ipaddr.js 2.5.0 (the site walk's address check); the next UI is prebuilt in ui/dist. It writes under $HERMES_HOME/swarm-studio/, and also: films to ~/Movies (or ~/Videos) and exports to ~/Documents, each in a Swarm Studio folder (or SWARM_OUTPUT_DIR); the app engine's packages and bundle in the plugin's own dyad/ folder; Hermes's config, only the two model slots above and an MCP server you confirm; and your GitHub repositories when you push."
