title: Swarm Studio
description: "A whole creative studio inside Hermes. One prompt, and a crew of agents you can watch and steer builds the whole launch on a live canvas: a multi-page website, a working web app with a database, a playable game (also as a Godot, Unity or Unreal project), a promo film and the social posts. Open it from the Desktop sidebar, ask for a site in any chat (the swarm_design tool), type /swarm, or run `hermes swarm`. The crew uses the models you already set up in Hermes, through two picker slots (planner and builders). Builds can be posted to Swarm Feed, where others try them live and remix them with credit. Disclosure — starts a small Node server (Node 18+ needed) that listens on 127.0.0.1 only and keeps running after Hermes closes; it calls the chat endpoint you configure with your brief; the canvas loads Tailwind from cdn.tailwindcss.com and fonts from Google Fonts; Publish runs your gh CLI (GitHub Pages) or calls Vercel / Cloudflare Pages with a token you connect, stored under $HERMES_HOME/swarm-studio/ with mode 0600; the first promo video installs hyperframes and ffmpeg from npm, and the first app build installs the vendored dyad app engine's packages from npm (about 1.5 GB, once); while a picture is painted its slot shows a stock photo found on Openverse (and Pexels, with a key) by the prompt's words, and photos from the studio's own library come from files.design-bakery.com; the one-time Setup sheet sends "Say ok" to your planner and builder models to check they answer; Swarm Feed (https://swarm.design-bakery.com) is contacted only when you run /swarm connect, post, remix or login. No telemetry. It writes only under $HERMES_HOME/swarm-studio/. Keys are read only through the Hermes secret scope when the server starts (SWARM_STUDIO_API_KEY, ELEVENLABS_API_KEY and the optional keys listed in plugin.yaml) and passed to it in its environment; it reads no .env file."
