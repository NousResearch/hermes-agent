name: switchbot-control
repo: https://github.com/TakeshiTGAL/hermes-plugin-switchbot-control
sha: f6083c6b25b9d9bd274e6dc6e483b5e1d522b7ee
description: 'SwitchBot OpenAPI v1.1, personal use. No Plug Mini on/off. Locks off unless enabled. setPosition only Curtain/Curtain3 (0=open). Disclosure — Controls real devices through the SwitchBot cloud API (api.switch-bot.com) using your SWITCHBOT_TOKEN and SWITCHBOT_SECRET. Each call reads SWITCHBOT_TOKEN and SWITCHBOT_SECRET for the active profile, and an HTTP proxy set in the environment is not used. Every command asks for Hermes approval and is refused under cron, yolo, approvals off and unattended sessions. Lock and door devices stay refused unless you turn on safety_devices. The plugin has no user list of its own: anyone you allow on your Hermes gateway can request a command and approve it. Answering "always" adds an unused line to config.yaml each time. The optional watch is a cron job (a model turn every 5 minutes by default) that stays after uninstall until you run unschedule. Not tested on real devices. While the plugin is enabled, its skill adds one line to the skills index of every session, including surfaces where the tools are turned off.'
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: '>=0.21.4'
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-switchbot-control#readme
version: 0.1.2
image: https://raw.githubusercontent.com/TakeshiTGAL/hermes-plugin-switchbot-control/f6083c6b25b9d9bd274e6dc6e483b5e1d522b7ee/assets/catalog-banner.png
platforms: []
capabilities:
  provides_tools:
  - switchbot_devices
