name: tabella
repo: https://github.com/dyiapanis/tabella
sha: ab95c7806e969bf88127edf083228e49b3700ac4
description: >-
  Document lifecycle for agents in one package: create .docx/.xlsx/.pptx/.pdf/.odt/.ods/.odp
  from structured JSON or raw HTML/CSS, convert between formats via pandoc + LaTeX, and read
  any document — anydoc (Rust, office formats and text PDFs to Markdown, in-process) with
  LiteParse + Tesseract OCR fallback for scanned PDFs and images, plus PDF text editing with
  strict output containment and output-directory guards. Ships as an Agent Plugins v1 package
  (auto-discovered plugin.json + mcp.json declaring a stdio MCP server — the client spawns it
  per the v1 lifecycle, PLUGIN_ROOT/PLUGIN_DATA injected — plus an optional self-host
  streamable-HTTP server on loopback for clients that prefer a URL; first run of either
  bootstraps the dependency venv), a pip package, and a Hermes plugin. Disclosure — Python deps
  (python-docx, openpyxl, python-pptx, weasyprint, odfpy, nano-pdf, firecrawl-anydoc, liteparse)
  are pinned and installed by scripts/setup.sh into a venv under PLUGIN_DATA or ~/.venvs/docs;
  system packages pandoc and texlive-xetex are required for PDF conversion (weasyprint for
  HTML->PDF); OCR needs the tesseract binary; all conversion, reading, OCR and PDF editing run
  locally with no network or telemetry; nothing is uploaded; documents are read/written only at
  paths you pass (absolute output paths are containment-checked against the configured output
  directory). Linux is the tested platform.
maintainer: dyiapanis
tier: community
category: tools
requires_hermes: ">=0.21"
docs_url: https://github.com/dyiapanis/tabella#readme
version: "2.0.1"
readme: true
platforms:
  - linux
capabilities:
  provides_tools:
    - doc_read
    - doc_read_meta
    - doc_convert
    - doc_create_document
    - doc_edit_pdf
  provides_hooks: []
  provides_middleware: []
  requires_env: []