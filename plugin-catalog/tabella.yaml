name: tabella
repo: https://github.com/dyiapanis/tabella
sha: 449e75462dc227789ef5c64e828c4db577f40ee5
description: |
  Create, convert, and read documents — .docx, .xlsx, .pptx, .pdf and
  OpenDocument — from structured JSON, HTML/CSS, or any file, with OCR for
  scanned pages.
  
  Runs entirely locally: nothing uploaded, no telemetry.
  
  Ships as an Agent Plugins v1 package (stdio MCP server, optional
  self-host HTTP). First run sets up its own venv, on Linux and Windows.
maintainer: dyiapanis
tier: community
category: tools
requires_hermes: ">=0.21"
docs_url: https://github.com/dyiapanis/tabella#readme
version: "2.0.2"
readme: true
platforms:
  - linux
  - windows
capabilities:
  provides_tools:
    - doc_read
    - doc_read_meta
    - doc_convert
    - doc_create_document
    - doc_edit_pdf
  provides_hooks: []
  provides_middleware: []
  requires_env: []