subdir: "tablekeeper"
description: "Tabletop RPG campaigns for Hermes group chats. Code rolls the dice and owns hit points, positions, initiative and turn order, each player controls only their own character, and the model narrates the results. SRD 5.1 monsters, characters and spells, including a young red dragon with a fire breath cone. With `/table dice phone`, each player throws their own d20 from a Telegram button; code still rolls the number. Disclosure: Storage. `<hermes home>/plugin-data/tablekeeper/campaigns.sqlite3`, resolved per profile, WAL mode, file mode 0600. The Desktop pane and dashboard route open it read-only; Prompt. In a chat that has a campaign, and in a local CLI or Desktop session once it has used `/table` or a `tk_` tool, a compact state summary of at most about 600 tokens is added to each turn and the reply passes through the narration guard. The guard lets a reply quote any hit point or AC figure the state block listed or a tool returned, flags invented damage, rolls and hit points, and appends one compact correction line. A campaign with no table activity for 24 hours adds no prompt tokens until the next `tk_` call or `/table` command wakes it. Other sessions and chats without a campaign are untouched; Network and processes. The plugin opens no connection of its own, starts no subprocess and reads no credentials. With `/table dice phone` on a Telegram session it registers one callback handler scoped to `^tk:throw:<id>` and sends one button message per pending throw through the gateway's own bot; a tap is accepted only from the character's owner id; Identity. Platform, chat id and sender id from the turn context, used as the campaign and owner keys."
maintainer: "kaverimeshram"
