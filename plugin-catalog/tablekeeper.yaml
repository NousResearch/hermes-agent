name: "tablekeeper"
repo: "https://github.com/kaverimeshram/tablekeeper"
sha: "a5cde35ec584c2b71b5b032a186478fdd4f291d0"
subdir: "tablekeeper"
description: "Tabletop RPG campaigns for Hermes group chats. Code rolls the dice and owns hit points, positions, initiative and turn order, each player controls only their own character, and the model narrates the results. SRD 5.1 monsters, characters and spells. Disclosure: Storage. `<hermes home>/plugin-data/tablekeeper/campaigns.sqlite3`, resolved per profile, WAL mode, file mode 0600. The Desktop pane and dashboard route open it read-only; Prompt. In a chat that has a campaign, a compact state summary of at most about 600 tokens is added to each turn, and the reply passes through the narration guard. Chats without a campaign are untouched; Network and processes. None. The plugin makes no network requests, starts no subprocess and reads no credentials; Identity. Platform, chat id and sender id from the turn context, used as the campaign and owner keys."
maintainer: "kaverimeshram"
tier: "community"
category: "desktop"
requires_hermes: ">=0.23.1"
docs_url: "https://github.com/kaverimeshram/tablekeeper"
