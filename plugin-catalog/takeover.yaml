name: takeover
title: Takeover
repo: https://github.com/shoumikgoswami/Hermes-takeover
sha: e35bd71c00e085304e3767126dbfe0e24ea07894
description: Human-in-the-loop screen takeover. When a step needs you (sign-in, approve/authorize, 2FA, CAPTCHA, payment) the agent asks, you take over its browser/desktop from hermes-webui, the dashboard or Desktop (even on a phone), then hand back. Installs TigerVNC + Xfce via Hermes's Bot Desktop installer (root) and runs a local VNC/websocket service.
maintainer: shoumikgoswami
tier: community
category: tools
platforms: [linux]
version: "0.5.3"
docs_url: https://github.com/shoumikgoswami/Hermes-takeover#readme
capabilities:
  provides_tools: [request_takeover]
  provides_hooks: [on_session_start, pre_tool_call, transform_tool_result]
  provides_middleware: []
  requires_env: []
