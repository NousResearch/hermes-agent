description: "Read your Tala AI phone agents and their call results from Hermes through Tala's official read-only connector (Streamable HTTP at https://mcp.tala-assistant.com/mcp, OAuth sign-in on Tala's consent screen): list the agents you authorized, list their calls with date and status filters, and read a call's status, duration, context and summary. Bundles one skill for the connector. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: every tool call goes to mcp.tala-assistant.com and acts only on the organization and agents the user selected at sign-in; results include callers' phone numbers and call summaries, which reach the user's configured model. Sign-in is a separate `hermes mcp add tala --auth oauth` step and Hermes holds the token. The connector is read-only: it cannot place calls or change anything in Tala. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
