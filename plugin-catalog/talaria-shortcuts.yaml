version: "0.3.0"
description: "Write, compile, sign and audit iOS Shortcuts from Hermes with no Mac: six tools turn plain-language intent into reviewable Cherri source, compile it to an unsigned .shortcut inside a bwrap sandbox, sign it through RoutineHub HubSign on explicit consent, and audit any .shortcut (signed AEA1 container or plain plist) for what it reads, writes and sends before it is installed. Bundles the shortcuts-authoring skill (file shape, verified action signatures, house patterns, and the traps that make a shortcut compile cleanly and still be broken). Disclosure — the Cherri compiler runs as a subprocess under bwrap with no network namespace, a read-only root, a throwaway HOME and only the job directory writable; bwrap and the compiler must already be installed, and a build is refused rather than run on the host when bwrap is missing. Two network call sites, both inert by default: talaria_status opens one TCP connection to the signing host only when called with probe_signer=true, and talaria_sign uploads the compiled shortcut as an XML plist plus the shortcut name to https://hubsign.routinehub.services/sign (RoutineHub, a third party) only when consent=true, returning the signed file; no other file, environment value or credential is sent. A pre_tool_call hook routes every consented signing call to Hermes's approval gate, keyed per artifact, so unattended runs fail closed. Artifacts and metadata are written only under $HERMES_HOME/talaria (or $TALARIA_HOME), metadata at mode 0600. LZFSE and LZVN decoding is a pure-Python port of Apple's reference decoder, so no compiled binary ships. No shell exec of model-written commands, no self-updater, no telemetry, no credentials or API keys."
maintainer: mjneuroart
