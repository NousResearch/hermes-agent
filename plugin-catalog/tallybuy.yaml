description: "Price comparison for Germany and Austria through Tallybuy's public MCP server (Streamable HTTP at https://tallybuy.com/mcp, no sign-in, no keys in config): product search, shop offers with delivery cost and delivered total, price history and side-by-side comparison. Bundles the tallybuy-shopping skill: unknown prices stay unknown, every price carries its shop and time, no basket totals, and the person is sent only to the offer's own link. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — connects to the hosted Tallybuy MCP server at tallybuy.com (no key); search words, market and destination country go to it and it sees the caller's IP (used for rate limits); shop links it returns are affiliate links and Tallybuy may earn a commission; the six tools are served by the remote server at runtime and are not covered by the pinned sha."
