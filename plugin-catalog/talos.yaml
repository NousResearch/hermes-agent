name: talos
title: Talos
repo: https://github.com/oma035/Talos
sha: 9880a3b56370784c9106f6cf026f60bbc091d874
description: "Automatic, unskippable smart-contract security checks for code Hermes writes and deploys (EVM, Solana/Anchor, Sui/Move): scans every .sol/.rs/.move file Hermes writes, feeds open findings back so Hermes fixes its own bugs, and gates deploy commands (anchor/solana/sui/forge/hardhat, including inside scripts) — mainnet blocked on high/critical findings, escalated to Hermes's human approval on medium, allowed with a warning on devnet/testnet; plus a /talos report command and a talos_scan tool. Disclosure — requests the tools.override capability because its pre_tool_call hook can block or escalate terminal commands; it replaces no built-in tool and passes every non-deploy call through. Runs local CLIs when present (slither, sui move build --lint, solana config get, sui client active-env, cast chain-id; the last contacts the RPC URL the user configured for the deploy). Stores findings JSON in its plugin data directory. No telemetry, no third-party APIs, no credentials read or stored. Fails closed: unknown network counts as mainnet, and a missing or crashing analyzer reports code as unchecked. Heuristic rule packs, not an audit."
maintainer: oma035
tier: community
category: tools
requires_hermes: ">=0.18.1"
version: "0.1.0"
docs_url: https://github.com/oma035/Talos#readme
platforms: []
capabilities:
  provides_tools:
    - talos_scan
  provides_hooks:
    - transform_tool_result
    - pre_llm_call
    - pre_tool_call
  provides_middleware: []
  requires_env: []
