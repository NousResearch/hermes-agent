subdir: hermes_tameru_plugin
version: "1.9.1"
description: "Big tool outputs, kept small, nothing lost: old tool results shrink to the lines that matter and every distinct error, and the tameru_read_original tool brings back the exact original. You can also Restore or Keep a shortened output in full, pin lines of your own through every summary, and see it all in a Desktop panel and a /tameru command. Deterministic and local, with no LLM calls. Disclosure — Replaces Hermes's context engine and subclasses its built-in ContextCompressor through a private import, overriding its private prune/demote methods (it checks their shape at startup and falls back to stock compaction when they change). Unless you set compression.proactive_prune_tokens yourself, turns on proactive tool-result pruning with a trigger scaled to the model's context window. Adds a model-callable tameru_read_original tool (tameru_expand is still answered but no longer listed) that returns pruned tool output from memory or this session's archive (web, browser and MCP output stays wrapped as untrusted data); complex regex greps run in a short-lived local Python child process (python -I -S, with a timeout). Adds a short note to the system prompt and, only when something changed, a short note to your message for the model. An optional lazy_tool setting (off by default) registers an llm_request middleware that leaves the recovery tool out of requests until a result has been shortened. Optional net_estimate and stats_ledger settings (off by default) add an estimate to /tameru stats and keep daily totals (numbers only) in a small file under the Hermes home. Keeps per-chat records (lean mode, pinned lines, Keeps, policy choices) in the plugin's own durable state (ctx.state), under one key per chat, and clears a chat's record after 90 days unused. Registers the hooks pre_llm_call, pre_api_request, post_api_request, api_request_error and post_compaction. No network calls, no credential reads; the render log is off by default."
maintainer: 0xWhiteMage
tier: community
category: general
docs_url: https://github.com/0xWhiteMage/hermes-tameru-plugin
image: https://raw.githubusercontent.com/0xWhiteMage/hermes-tameru-plugin/b4429d72f30fcdcd0f5660f99d0e098d555e4af4/docs/assets/hero.png
platforms: [linux]
known_issues:
  - Full archive recovery requires plugins.isolation to be in_process; host mode limits recovery.
  - Overrides private ContextCompressor signatures and falls back when the host contract changes.
capabilities:
  provides_tools:
    - tameru_read_original
    - tameru_expand
  provides_hooks:
    - pre_llm_call
    - pre_api_request
    - post_api_request
    - api_request_error
    - post_compaction
  provides_middleware:
    - llm_request
  requires_env: []
requires_hermes: ">=0.23.0"
