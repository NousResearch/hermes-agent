description: "China reverse proxy shopping hub, 1688 link desensitizer, IATA volumetric shipping calculator (5000 vs 6000 divisor), and proxy agent fee comparator through TaoFind's official MCP server (Streamable HTTP at https://taofind.com/api/mcp, no sign-in, no keys in config). Bundles the taofind workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local runtime code: every tool call goes over HTTPS to taofind.com/api/mcp with the shopping links and parcel details you give it, and the remote tool list is served by TaoFind at runtime, not covered by the reviewed pin; the package marks the server untrusted, so Hermes asks before any tool not annotated read-only and refuses those in unattended runs."
