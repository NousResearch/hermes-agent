description: "China reverse proxy shopping hub, 1688 link desensitizer, IATA volumetric shipping calculator (5000 vs 6000 divisor), and proxy agent fee comparator through TaoFind's official MCP server (Streamable HTTP at https://taofind.com/api/mcp, no sign-in, no keys in config). Bundles the taofind workflow skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local runtime code, binaries, hooks, telemetry or self-updater; every tool call goes over HTTPS to taofind.com/api/mcp with only the shopping link or haul parcel arguments. All tools are public, free, and annotated read-only (readOnlyHint: true, destructiveHint: false). The package marks the server untrusted (trust: untrusted), so Hermes asks before any tool not annotated read-only and refuses them in unattended runs. The remote tool inventory is served at runtime and is not covered by the pinned sha."
