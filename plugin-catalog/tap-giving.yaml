description: "Custom NFC tap discs for organizations, including churches, nonprofits, restaurants, coffee shops, and local businesses, through the NFC Tap Builder MCP server (Streamable HTTP at https://tap.giving/mcp, keyless reads, no sign-in; website https://tap.giving): discovery, binding pricing quotes, product facts and production artwork specs, plus order setup and hosted invoice links with an organization API key. Bundles one workflow skill, nfc-tap-builder. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to tap.giving. The server sells hardware only and moves no money itself: it returns a hosted invoice link for a person to pay, and a person approves the final proof by email before production. Read tools need no key; order tools need the organization's own API key, added by the user to their own client config (the package ships no credential and reads no files). The package marks the server untrusted, so Hermes asks before write-capable calls and refuses them in unattended runs. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
