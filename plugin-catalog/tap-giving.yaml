description: "A tool first for organizations, including churches, nonprofits, restaurants, coffee shops, and local businesses: create print-ready NFC artwork proofs with correct vector art through the NFC Tap Builder MCP server (Streamable HTTP at https://tap.giving/mcp, keyless reads, no sign-in; website https://tap.giving), free to take to any vendor, with no lock-in: discovery, binding pricing quotes, product facts and production artwork specs. Ordering custom discs through Tap.Giving is an optional next step; order setup uses hosted invoice links, with no key and no login at any point. Bundles one workflow skill, nfc-tap-builder. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to tap.giving. The server sells hardware only and moves no money itself: it returns a hosted invoice link for a person to pay, and a person approves the final proof by email before production. No tool needs a key or a login at any point, ordering included (the package ships no credential and reads no files). The package marks the server untrusted, so Hermes asks before write-capable calls and refuses them in unattended runs. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
