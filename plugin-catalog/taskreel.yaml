description: "Teach Hermes a local task once, then replay it with no model call. Checkpoints stop the replay on the first failed step."
maintainer: SuryaXyz-art
tier: community
category: automation
version: "1.0.3"
requires_hermes: ">=0.20.5"
readme: true
capabilities:
  provides_tools:
    - save_routine
    - run_routine
    - list_routines
  provides_hooks:
    - post_tool_call
  provides_middleware: []
  requires_env: []
