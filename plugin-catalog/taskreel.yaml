name: taskreel
repo: https://github.com/SuryaXyz-art/taskreel
sha: "cfa88baa989bbb181d43f6f42f52c970a883c177"
description: "Teach Hermes a local task once, then replay it with no model call. Checkpoints stop the replay on the first failed step."
maintainer: SuryaXyz-art
tier: community
category: automation
version: "1.0.1"
requires_hermes: ">=0.20.5"
readme: true
capabilities:
  provides_tools:
    - save_routine
    - run_routine
    - list_routines
  provides_hooks:
    - post_tool_call
  provides_middleware: []
  requires_env: []
