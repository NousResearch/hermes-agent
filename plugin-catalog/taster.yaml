description: "Runs another Hermes plugin once in a locked box (fake home, canary wallet files, network denied and logged) and reports what it did versus its manifest. Disclosure: spawns sandbox-exec and a Python child process, reads the plugin folder you point it at and the Hermes and Python install folders, and makes no network calls, stores no credentials and runs nothing in the background. macOS only."
