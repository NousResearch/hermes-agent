description: 'Microsoft Teams meeting pipeline: turns Microsoft Graph change notifications from the
  msgraph_webhook gateway platform into durable jobs that fetch the meeting transcript (or the recording,
  transcribed), summarize it with your auxiliary model and deliver the summary to Teams, plus
  `hermes teams-pipeline` to list, inspect and re-run jobs, check Graph setup and maintain
  subscriptions. Notion and Linear writers exist but are not wired yet, and a re-run re-summarizes
  without delivering. Tested with stand-ins only, not against a real Microsoft 365 tenant. Formerly
  built into Hermes core; existing users are migrated automatically.
  Disclosure: one Python dependency (httpx). It calls Microsoft Graph (login.microsoftonline.com,
  graph.microsoft.com) with the app-only credentials in MSGRAPH_TENANT_ID / MSGRAPH_CLIENT_ID /
  MSGRAPH_CLIENT_SECRET, reading the meeting artifacts your app registration is granted. Transcripts
  go to your configured auxiliary model (and a recording to your transcription provider) to be
  summarized; summaries go only to the Teams destination you configure. Job state, including the Graph
  subscription clientState, is kept in teams_pipeline_store.json in your profile.'
