description: "Telegram client pane for Hermes Desktop: dialogs, message history with image previews and per-post image reload, forum topics, and reviewed send/reply/save/delete/mark-as-read actions via a dedicated Telethon user session (separate from the core gateway bot token). All history is sanitized before rendering. Disclosure — the profile dashboard backend reads dialogs and message history and downloads media for in-page previews (page byte-budgeted and cached in memory); TELEGRAM_API_ID/TELEGRAM_API_HASH come from the profile's Hermes secrets; login challenges stay in process memory; the dedicated Telethon session lives in HERMES_HOME/telegram-plugin-auth/ (directory 0700, .session and its -wal/-shm sidecars 0600), and anyone holding that session file controls the Telegram account; delete removes the selected message for everyone; mutations go prepare -> exact preview -> confirm -> commit -> readback, and the pane's \"Confirm actions\" switch (on by default) can turn the preview step off; message links open in the system browser (http and https only)."
