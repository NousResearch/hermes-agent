description: "Read-only Hermes status dashboard kept in one pinned Telegram message and edited in place on a schedule through the gateway's own Telegram adapter: gateway health, message freshness, last state.db backup, config drift, and Claude, Codex, Grok and Kimi account limits. HTML when the adapter takes it, plain text otherwise; no LLM calls, no tools or hooks; the screen text is English. Disclosure — Claude and Codex limits come from Hermes' own account-usage fetcher; the Grok weekly pool is read from https://cli-chat-proxy.grok.com/v1/billing with the xai-oauth token Hermes resolves, and Kimi Code windows from <kimi-coding base URL>/v1/usages with the kimi-coding key Hermes resolves (undocumented provider surfaces, at most once per limits_refresh_seconds, default 900 s); an operator-configured drift_command, if set, runs as a subprocess; the delivery record is written under HERMES_HOME/plugin-data/."
