known_issues:
  - "Requires in-process plugin execution: the Telegram handler factory receives the platform's native SDK client, which plugins.isolation: host does not allow; under host the plugin does not load and nothing is delivered."
  - "Updating from 1.0.0 or older: restart the gateway once; until then a plugin reload leaves the screen still."
  - "On the launch profile of a gateway that multiplexes profiles, Claude's limits and a keyed limit source show no data: Hermes refuses secret lookups outside a profile scope."
