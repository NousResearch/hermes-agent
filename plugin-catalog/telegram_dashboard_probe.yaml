description: "One pinned Telegram message with your Hermes' state on one phone screen, edited in place from inside the gateway. Read-only, no LLM calls, nothing to press. Disclosure — reads Hermes' files read-only, the agent's context files wherever it works, and the free space of the disk HERMES_HOME lies on. Disclosure — edits the message through the Telegram adapter, private members included. Disclosure — Hermes' usage facade every 5 min, which may read the Claude Code or Codex CLI login and refresh its token. Disclosure — GitHub releases without a token, at most every 15 min, no off switch. Disclosure — opt-in: loopback limit sources, a drift command. Disclosure — its own code writes only its record; the full list is in the README."
