name: telesec
title: Telesec
repo: https://github.com/neoromantic/telesec
sha: 61b4ddcb989bc216db94c33fef12d1d603be1cd6
description: >-
  Telegram Business secretary: transcribes voice notes, round videos, and speech
  attachments right in the chat, with Settings and per-chat controls in Telegram's Manage Bot
  panel, plus opt-in text history (with import from a Telegram export), correspondence stats, and contact dossiers.
  Disclosure — audio goes to the STT backend Hermes is configured with (local or
  external); transcript cleanup sends chat text through the host ctx.llm;
  opt-in dossiers send chat text through the Hermes model task telesec_dossier
  (default Vercel AI Gateway to Google with zero data retention; an optional
  message check on the same gateway and optional Cloudflare fact extraction
  are off by default); runs local ffprobe/ffmpeg (argument lists, no shell) on attached
  audio; opt-in dossiers run a gateway background thread; modes, opt-in history,
  and dossiers are stored 0600 under HERMES_HOME/data/telesec; reads only the
  numeric bot id prefix of TELEGRAM_BOT_TOKEN; no telemetry.
maintainer: neoromantic
tier: community
category: voice
requires_hermes: ">=0.21.6"
