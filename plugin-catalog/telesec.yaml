  - https://raw.githubusercontent.com/neoromantic/telesec/e3452dca925d03cc9220766901faabde5f5c8d62/docs/images/stats-panel-en@2x.png
readme: true
known_issues:
  - Needs in-process plugin mode for native Telegram handlers.
  - Uses the undocumented host STT entrypoint tools.transcription_tools.transcribe_audio.
