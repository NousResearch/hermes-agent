name: templeos
title: TempleOS for Hermes
repo: https://github.com/mojomast/hermes-templeos
sha: c61d00eb4d36c5e3c7cd57a2985985aed8db42f0
subdir: ""
description: >-
  Run a local TempleOS-family guest (default Temple of Hermes 0.1.2; optional
  TinkerOS 5.20-rc10, stock TempleOS 5.03, or ZealOS) in
  QEMU so the Hermes agent and the user can share one live screen. Disclosure
  — spawns qemu-system-x86_64 as a child (KVM only when /dev/kvm can be
  opened, otherwise TCG) with a minimal non-secret child environment; may
  fetch a pinned ISO from its official HTTPS URL (SHA-256 verified,
  connection-pinned, no proxy); injects keys and HolyC over QMP/serial;
  transfers files over a framed COM1 protocol; keeps a background QEMU
  process; and stores disks and ISOs under plugin data. Networking is always
  off (-nic none). QEMU and ISOs are not bundled. This is a child hypervisor,
  not an OS sandbox. An optional Temple of Hermes HBBS/1 / chat bridge is
  off by default; the destination is the allow-list name bbs and the TLS
  endpoint comes from host config, never from guest text (loopback or
  private LAN allowed only because the operator set them; metadata and
  link-local are refused). The optional TEMPLEOS_CHAT_BRIDGE_TOKEN is read
  only through Hermes secret scope. Observer hooks animate the Terry
  companion from session events; they return None and do not approve, modify,
  or log other tools. The Desktop pane uses ctx.rest only. Terry is an
  original fan tribute with no official TempleOS affiliation.
maintainer: mojomast
tier: community
category: desktop
requires_hermes: ">=0.23.0"
version: "0.1.1"
docs_url: https://github.com/mojomast/hermes-templeos#readme
readme: true
