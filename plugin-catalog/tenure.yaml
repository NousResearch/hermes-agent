description: "Your Hermes agent works without asking. When it gets a change wrong, you undo it, and that kind of action gets watched. File edits and deletions (write_file, patch, plain rm, mv, cp, sed -i on project files) are saved first and can be undone for 24 hours with `/tenure undo N`; the usual dev tools (npm, pytest, cargo, go, make, git...) run as with Hermes alone, without an undo. After one mistake on a kind of action (an undo, a refusal, a flag, a file it wrote that no longer parses) that kind keeps working but its actions are listed at the end of the turn with an undo (a kind tenure cannot undo asks first instead); after a second, it asks first; it is free again after a run of actions you keep (the numbers of a preregistered study's rule: 52 in a row for a low-risk kind under the default preset). Pushes, publishing, deploys, uploads, messages to people, payments, new packages and code downloaded from the internet then run (piped into a shell, or saved and run by the same line) always ask, every time; programs whose changes it cannot save (docker, database CLIs, unknown tools, MCP tools that write) ask until a person frees them with `/tenure trust KIND`; after the agent reads outside content (web, mail, downloads, git pull), its next command asks once and a person's yes lifts that for the conversation. Three commands: `/tenure` (what the agent did, what you can undo), `/tenure undo N`, `/tenure trust`; the rest under `/tenure advanced`. Opt-in study mode (`hermes tenure mode study`): the preregistered rule whole, with tiers, random spot checks, a guarantee in two numbers (Dodge's CSP-1) and a signed, tamper-evident, replayable autonomy passport (`hermes tenure verify`). Also: field categories (a call touching secrets, bank details or an unreadable field always asks), the target of a call shown first in the prompt with recognised secrets masked, numbered actions to flag one (`/tenure flag 12`), a per-model benchmark of your own work, a Desktop page and a dashboard tab, five languages. Linux, macOS and Windows (on Windows, plain shell file commands ask instead of running with an undo). Disclosure — hooks only (pre_api_request, pre_tool_call, post_approval_response, post_tool_call, post_llm_call, subagent_start, subagent_stop), no tools; no network, no LLM call. The one program it runs is git, only to put the index back after an undo of a chained line holding git rm or git mv: git ls-files reads the index entries of its paths before the line runs, and an undo puts them back with git update-index (git rev-parse for the object format when an entry must be taken out), in the repository's top folder, hooks and fsmonitor off, no GIT_* variables from the agent, a 10-second limit. It adds approval prompts through Hermes' own prompt and never answers one; it blocks a call outright in two cases only: an agent tool call that would run a person's word (`tenure ok`, `tenure excuse` or `tenure trust KIND`, in a terminal command, execute_code's code or text typed by computer_use, or the `/tenure` slash command handed to Hermes by a command line), and, in study mode under cron or --yolo, an action drawn for a spot check nobody can answer. Reads the profile's config.yaml, its own plugin settings, and Hermes' sessions table in state.db (read-only, to keep a compressed conversation one session); before a git commit after outside content, the repository's .git/hooks listing, .git/config and ~/.gitconfig (to see whether a commit could run a hook), and a patch file that git apply or git am names (2 MB at most); the tenure.db of the other profiles of the install, read-only, to recognise a copied profile; and, to recognise Hermes' CLI or files under another name, it lists the Hermes home and profile folders and reads the first 4 KB of a small program (256 KB at most) that a command runs. Writes settings back only through ctx.set_config when the owner saves them. Writes under plugin-data/tenure: a SQLite record and a hash-chained ledger (action types and outcomes, a person's trust decisions per kind, no paths, no commands, no free text), a 24-hour list of recent actions (number, action type, model, time; no arguments), an HMAC of the paths of scripts the agent wrote in the last 24 hours (keyed per database), a signing key and an undo HMAC key, and undo snapshots of the project files an action is about to change (file bytes and paths, owner-only, deleted after 24 hours, 5 MB per action; for rm -r or a chained line, up to 2,000 files; for git rm or git mv, also the index entries of those paths). Gives the session's tool subprocesses one environment variable, TENURE_AGENT_CHILD=1 (ctx.register_session_env). The dashboard tab and Desktop page show the tenure records of every profile on the machine (read-only); revoke, flag, undo and settings act on the current profile only."
