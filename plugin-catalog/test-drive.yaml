title: Test Drive
description: "Don't guess which plugin helps. Test-drive it. When Hermes hits a capability wall (it says it can't, or a tool fails as unavailable) test-drive appends one line naming the best catalog match; /testdrive <need> and test_drive_find show the top 3 with trust cards (tier, pin, keys needed, declared tools/hooks, disclosure); after you approve, test_drive_run or /testdrive run installs the candidate into a throwaway HERMES_HOME, runs your original request once with hermes chat -q, deletes the sandbox and reports a before/after with evidence of which plugin tools were called; keep goes through Hermes's own installer; /testdrive history keeps receipts. Disclosure — fetches the public catalog index from hermes-agent.nousresearch.com (redirects only to https Nous hosts, cached 6 h); an approved drive clones the candidate at its catalog pin, installs its Python dependencies from PyPI into the sandbox's own runtime, runs child hermes CLI processes (plugins install, chat -q, sessions export, gateway stop) with hard timeouts and process-group kill, sends your request to your configured model provider (twice with a baseline), and runs the candidate's code as your user inside the temporary profile (not an OS sandbox), including any network calls it makes; every test_drive_run is escalated to Hermes's approval gate (fails closed unattended) and the slash command asks via ask_choice or an explicit --yes; the child runs single-query mode with dangerous commands denied; the child gets only system env vars plus your model route's key and the candidate's declared requires_env, read through agent.secret_scope (a literal model api_key is written to the sandbox's 0600 config and deleted with it); no memory, sessions, .env or auth.json are copied; temp dirs hermes-testdrive-* are deleted after each drive; stores the catalog cache, last gap per session and up to 50 drive receipts in its plugin-data folder; a transform_llm_output hook appends one nudge line to gap replies (off with nudges: false); optional llm_check calls your active model; no telemetry."
maintainer: Xuefeng-Zhu
tier: community
category: tools
requires_hermes: ">=0.22.7"
docs_url: https://github.com/Xuefeng-Zhu/hermes-test-drive#readme
version: "0.1.0"
# image: https://raw.githubusercontent.com/Xuefeng-Zhu/hermes-test-drive/<sha>/docs/banner.png
screenshots: []    # pinned raw URLs: nudge line, trust cards, before/after report, history
known_issues:
  - "A test drive takes about 30-90 s and spends model tokens; plugins that need OAuth sign-ins, a messaging platform, the Desktop app, hardware or keys you don't have can't show their value in a throwaway profile (missing keys are reported and the run is skipped)."
  - "Models that sign in with OAuth (Nous Portal, Codex) are not reused in the sandbox; set test-drive's sandbox_provider/sandbox_model/sandbox_key_env to an API-key route."
capabilities:
  provides_tools:
    - test_drive_find
    - test_drive_run
    - test_drive_keep
  provides_hooks:
    - pre_tool_call
    - pre_llm_call
    - post_tool_call
    - transform_llm_output
  provides_middleware: []
  requires_env: []
