description: "Manage your TesterSwap account through TesterSwap's hosted MCP server (Streamable HTTP at https://api.testerswap.com/mcp, OAuth sign-in, no keys in config): check credits, find live Google Play and App Store apps to test, start tests, review and approve or send back tests submitted for your apps, list or pause your apps, read notifications, and plan Google Play closed testing. Bundles the testerswap skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: every tool call goes to TesterSwap's hosted server (api.testerswap.com) and acts on the user's own TesterSwap account; the tool set is served by that server at runtime and is not covered by the pinned sha. approve_test transfers held credits to the tester, start_test commits the user to install and use an app themselves, and release_test and reject_test end a test. Sign-in runs the pinned mcp-remote@0.1.49 through npx (Node.js 20.18.1+ and npm required), which opens a browser and a local callback port on first use and stores OAuth tokens under ~/.mcp-auth. The package marks the server untrusted, so Hermes asks before every tool the server does not mark read-only and refuses them in unattended runs."
