name: testmu-ai
title: TestMu AI
repo: https://github.com/LambdaTest/mcp-server-guide
sha: e7f18e325a6edc5e39dacfe95bcae6b42d20f33c
description: >-
  TestMu AI (Formerly LambdaTest) is an Agentic AI Quality Engineering platform that assures AI
  deployments across the enterprise and the real world. It runs agentic testing for web and mobile
  apps on 3,000+ browsers and 50,000+ real devices, and for chat, voice, IVR, video, and image
  agents. This plugin connects Hermes to the TestMu AI cloud through TestMu AI's hosted MCP server
  (Streamable HTTP, OAuth browser sign-in): run, debug and triage tests across web automation,
  HyperExecute, SmartUI visual testing, accessibility scans and Test Manager, with the Kane CLI
  skill for browser and mobile test automation and the Rook CLI skill for testing AI agents.
  Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/). Disclosure: hosted
  connector with no local code: every MCP tool call goes to TestMu AI's server at
  mcp.lambdatest.com, signed in as the user, and results join the session context, so they reach
  the user's model provider. Some tools change account data (start accessibility scans and
  phone-call suite runs, upload apps and screenshots, create or update Test Manager items, approve
  or reject SmartUI comparisons) and some stop or delete builds, sessions, tunnels and uploaded
  files; every tool declares readOnlyHint, destructiveHint and openWorldHint. The tool list comes
  from TestMu AI's server at run time, so the pinned commit doesn't cover it. The Kane CLI and
  Rook CLI skills run those command-line tools on the user's machine when the user asks for them,
  and their runs use TestMu AI credits. Connect with browser sign-in,
  `hermes mcp add testmu-ai --url https://mcp.lambdatest.com/mcp --auth oauth --connect-timeout 300`
  (Hermes stores and refreshes the OAuth tokens).
maintainer: TestMu AI
