title: Hermes Tether
version: "0.3.0"
description: "One Hermes agent, many machines: lends a remote Hermes agent the terminal, files, screen and apps of your paired desktop machines (macOS and Windows). Say 'tether <machine>' and the agent's terminal, file and computer-use tools act on that machine under its own Hermes rules and approvals; send 'untether' to bring them home. Each machine dials the host over a pinned, mutual TLS 1.3 link (256-bit suites only). Every session needs a 6-digit code from the person's authenticator app, typed into a box on that machine, before anything runs; nothing on the host can approve one. On macOS a session's commands and file tools run in a sandbox that cannot read Tether's or Hermes's secrets or change their files. Includes a Tether panel for Hermes Desktop (paired machines, labels, idle limits, connection log). Disclosure — the host listens on the LAN or tailnet address you configure (default 127.0.0.1) and each paired device connects to it over pinned mutual TLS 1.3; no third-party services, no telemetry; while a machine is tethered, the host session's shell commands, file reads/writes and computer use run on that device after the person there approves the session with an authenticator code, judged by the device's own Hermes rules (its hardline/deny floors always; commands the host's approval gate already passed skip the device's own approval prompts); on macOS those commands and file tools run under sandbox-exec with a per-session profile that refuses Tether's and Hermes's files and secrets (Windows has no such lock, so there they run unlocked by default, a setting on the Tether panel); skills opened during a tethered session are copied read-only into a per-session workspace on the device and removed when it closes; background tasks: the link listener (host), the device's connection, an idle sweeper and a settings watcher; stores one Ed25519 key per machine, encrypted at rest, with its passphrase in Hermes's secret store, and on each device the authenticator's secret and its recovery codes' fingerprints in one sealed file (sealed with that passphrase, or with a key in the OS keychain when Hermes keeps its vault key there; Windows: DPAPI); an authenticator transfer file for another machine is written only on request, after a current code, and is locked with a one-time phrase; adds a short per-turn note while a machine is tethered; reads private Hermes approval internals (tools.approval) and fails closed if they change."
maintainer: Zek-Takai
