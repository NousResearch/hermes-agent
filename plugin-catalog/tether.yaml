known_issues:
  - "Devices must be macOS or Windows; the host must be macOS or Linux (it uses a POSIX file lock and Unix socket). On a device, Hermes must run in the signed-in desktop session so the code box can appear."
  - "Set up the authenticator once on each device ('hermes tether authenticator setup' in a terminal at that machine, or 'authenticator join' with a transfer file from a machine already set up); until then remote use is refused."
  - "Update the host and every device together: the link protocol changed and a 0.1 machine is refused with a message."
  - "Windows devices have no session lock: a remote session's commands run unlocked by default ('allow_unlocked_commands' on the Tether panel)."
  - "Computer use on the device needs the companion plugin tether_screen, installed by hand from plugin/tether_screen on the host only, with computer_use.backend: tether_screen there. Its validation stops at the capability probe exactly like Hermes's bundled computer-use plugin."
  - "Several Hermes Desktops connected to one backend share it: closing one ends the chat open in the other."
  - "'untether' closes a connection only when it is sent as a message on its own."
capabilities:
  provides_tools: [devices]
  provides_hooks: [pre_llm_call, post_llm_call, post_tool_call, transform_tool_result]
  provides_middleware: [tool_execution]
  requires_env: []
