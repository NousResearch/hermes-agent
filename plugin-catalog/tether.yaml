sha: 21405882aaca43f6783befabab60581d7a646d55
subdir: plugin/tether
title: Hermes Tether
version: "0.1.0"
description: "One Hermes agent, many machines: lends a remote Hermes agent the terminal, files, screen and apps of your paired desktop machines (macOS and Windows). Say 'tether <machine>' and the agent's terminal, file and computer-use tools act on that machine under its own Hermes rules and approvals; send 'untether' to bring them home. Each machine dials the host over a pinned, mutual TLS 1.3 link (256-bit suites only), and the person at the machine allows every session on its own screen before anything runs. Includes a Tether panel for Hermes Desktop (paired machines, labels, idle limits, connection log). Disclosure — the host listens on the LAN or tailnet address you configure and each device connects to it; no third-party services, no telemetry; while tethered, shell commands and file reads and writes run on the device, judged by the device's own Hermes rules and approvals; background tasks: the link listener (host), the device's connection, an idle sweeper and a settings watcher; stores one Ed25519 key per machine, encrypted at rest, with its passphrase in Hermes's secret store; adds a short per-turn note while a machine is tethered."
maintainer: Zek-Takai
tier: community
category: tools
requires_hermes: ">=0.23.0"
platforms: []
image: https://raw.githubusercontent.com/Zek-Takai/hermes-tether/21405882aaca43f6783befabab60581d7a646d55/docs/media/tether-banner.png
screenshots:
  - https://raw.githubusercontent.com/Zek-Takai/hermes-tether/21405882aaca43f6783befabab60581d7a646d55/docs/media/tether-desktop.png
  - https://raw.githubusercontent.com/Zek-Takai/hermes-tether/21405882aaca43f6783befabab60581d7a646d55/docs/media/tether-demo.gif
known_issues:
  - "Devices must be macOS or Windows (the host runs anywhere Hermes runs). On a device, Hermes must run in the signed-in desktop session so the consent prompt can appear."
  - "Computer use on the device needs the companion plugin tether_screen, installed by hand from plugin/tether_screen in the repository. Its validation stops at the capability probe exactly like Hermes's bundled computer-use plugin."
  - "Several Hermes Desktops connected to one backend share it: closing one ends the chat open in the other."
  - "'untether' closes a connection only when it is sent as a message on its own."
capabilities:
  provides_tools: [devices]
  provides_hooks: [pre_llm_call, post_llm_call, transform_tool_result]
  provides_middleware: [tool_execution]
  requires_env: []
