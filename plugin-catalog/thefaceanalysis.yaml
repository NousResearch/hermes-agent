description: "Face shape, facial proportion and face-type data from thefaceanalysis.com through its hosted MCP server (Streamable HTTP at https://mcp.thefaceanalysis.com/mcp, no sign-in, no keys): the site's seven-rule face shape classifier on four distances, face/eye/lip/nose type definitions with their exact threshold rules, reference statistics from 102 research faces, methodology and an embeddable face shape finder. Bundles one skill. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call, with its arguments, goes to mcp.thefaceanalysis.com; no account or personal data is needed. All seven tools are read-only and the server accepts no photos. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
