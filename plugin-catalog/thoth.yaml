title: "Thoth"
description: "Agents working as one team, each with its own harness: Claude Code, Codex and Hermes today. Ask Hermes for a website, an app, artwork or a doc: it plans the work on a shared board and hands each task to the real Claude Code or Codex CLI, on your own logins and plans, so every improvement their makers ship reaches your team. Each agent works in its own git worktree with a brief of what the team decided and made (goal, decisions, handoffs, what its dependencies produced), reviews the other's work, and Hermes merges what passes once you say yes. In Hermes Desktop, Thoth sits beside each project's chat: a side window with the live canvas and a Team & brain tab (who did what, decisions, reviews, versions), and every Thoth project is also a Hermes project on the same folder. Claude Code or Codex can join the board through the bundled MCP server or take over as coordinator, and a task that needs the web gets a clean Chrome, or yours when it needs your logins. Disclosure — after you approve each launch in Hermes, runs your installed claude and codex CLIs as background processes (stopped on cancel, timeout (30 min by default), unload or exit) under their own logins and plans, which Thoth never reads, with Claude Code's OS sandbox and Codex's workspace-write sandbox; strips API keys, tokens and HERMES_/ANTHROPIC_/OPENAI_ variables from their environment; inside Codex runs it pre-approves only its own three worker tools (read the board, write a note); writes .thoth/ (SQLite brain, run logs, worktrees), thoth/T<n> branches, exact-path lines in .git/info/exclude and, only when you approve a merge, merge commits on your base branch; links ignored node_modules/.venv folders into task worktrees and never reads or copies .env files; a project setup or run command you approve runs as you outside the sandbox (run previews on a free localhost port from an export under .thoth/previews/); static previews are served read-only on 127.0.0.1; the Desktop page's Connect buttons run claude mcp add thoth / codex mcp add thoth only when clicked; in Hermes Desktop it adds two panes (the side window and Team & brain) and a Chat + Thoth layout template that changes your layout only when you pick it, opens one chat per project and pins it in the project's colour once, creates (or reuses) a Hermes project on each Thoth project's folder and moves that project's chat into it through Hermes's own project calls, and keeps which chat and folder belong to which project in its data folder (chats.json, projects.json); completion notices reach the chat only with allow_gateway_injection; a task you give a browser has its agent run npx -y chrome-devtools-mcp@1.2.0 (pinned, fetched from npm on first use, usage statistics off): a temporary headless Chrome, or, if you choose your own Chrome, the Chrome you are running once you turn on remote debugging and allow the connection in Chrome, where the agent sees your tab titles, acts with your logins in a tab of its own and is told to only look. No network calls of its own, no telemetry."
