description: "thott.bot makes your AI an expert on World of Warcraft: Forever, from Blizzard's own game files for the build you're playing, current to the latest hotfix, with Blizzard's news and credited community data, drawn right in the chat. Disclosure — hosted-only connector with no local code: every tool call goes to thott.bot's server (mcp.thott.bot), which records the queries your agent sends it (not your conversation, and not used to train models); its tool set is served remotely and is not covered by the pinned sha; it requires a free thott.bot account, signed in by running `hermes mcp add thott --url https://mcp.thott.bot/mcp --auth oauth`, whose config entry replaces the package's own server definition."
