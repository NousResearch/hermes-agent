description: "Insert a quarter, get a tiny original space-bug shooter, and a wry \"thought we wouldn't notice\" line. A whole-message quarter is swallowed by pre_llm_call so Hermes skips the model and replies \"Thought we wouldn't notice. But we did.\" Hermes Desktop opens the Top Sails cabinet over the window; Esc dismisses it. The dashboard tab has the same cabinet and a Play button. Disclosure — no third-party network calls, no shell, no credentials, and no telemetry; the quarter ledger and high score are stored only under the plugin's own data directory; pre_llm_call blocks the model turn for matching messages only."
