subdir: plugin
description: "Send a packet (structured Markdown brief plus verbatim original files of any type up to 25 MiB) from one AI assistant to another person's assistant or across your own machines, through Threadpacket's hosted MCP server at threadpacket.com/mcp (or a self-hosted Cloudflare Worker) using OAuth 2.1 with dynamic client registration and PKCE. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/threadpacket), configuration only; declares trust: untrusted for threadpacket so write-capable calls prompt before running. Disclosure — hosted connector with no local code; tool calls send user-selected briefs and files to threadpacket.com (or the user's configured server), stored verbatim (not end-to-end encrypted) up to 256 MiB of live files per hosted team and auto-deleted after 7 days by default (30 days max), with no server AI calls and operational event counts that record no packet titles, briefs or filenames. Attaching a local file calls threadpacket_upload_url, checks that the returned URL is on the configured Threadpacket server, and runs a fixed single-file curl/Invoke-WebRequest HTTP PUT to /v1/uploads. A config.yaml `mcp_servers.threadpacket` entry replaces the package's entry, so it must keep `trust: untrusted` for send, revoke, invite and upload calls to ask first. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
maintainer: evgolsh
