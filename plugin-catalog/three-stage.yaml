title: three-stage
description: 'Live three.js r187 scenes and GLB, GLTF, STL and OBJ models in Hermes chat. The three_scene
  tool checks a scene module or model file and returns it as a file; Hermes Desktop draws it as an
  interactive card (orbit, zoom, fullscreen, restart, screenshot, "Ask Hermes to change this") and sends
  scene errors back to the chat for repair. With Desktop open, each scene is dry-run in a hidden frame
  so crashes reach Hermes in the same turn. Scene code runs in a sandboxed iframe whose content security
  policy blocks all network access; three.js r187 is bundled. No keys, telemetry or background processes.'
