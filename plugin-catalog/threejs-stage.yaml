known_issues:
  - "The live card needs Hermes Desktop. On other surfaces the tool delivers a standalone HTML file and reports the scene as unverified."
  - "Restart the gateway once after installing, so the plugin's backend routes are mounted."
  - "The card runs three.js WebGPURenderer on its WebGL2 backend, because the sandboxed frame is not a secure context. WebGPU-only features such as storage textures are not available."
  - "Draco, meshopt and KTX2/Basis compressed glTF files are refused. Export without compression."
