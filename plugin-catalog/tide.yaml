sha: 06173a8a07a956c6e38df6174f7618c4ac595182
description: "Context engine that never asks a model to summarize. Instead of pausing the turn for a model-written summary, Tide composes the request deterministically: one frozen session map (each evicted turn as the user's verbatim words plus what was done and replied), earlier compaction summaries and loaded skills carried forward, the user's current request pinned whole, then a verbatim window of recent history that trails the conversation in cache-friendly steps (fires past high_tokens, cuts back to low_tokens, never splits a tool result from its call). Bulky old tool results are folded to head and tail; anything shortened comes back verbatim through the tide_recall tool by map label, tool call id or a few words. Select with context.engine: tide; revert with context.engine: compressor. No network calls, no model calls, no third-party dependencies. Disclosure — reads the same home's state.db read-only so tide_recall can return compacted originals; writes per-session fingerprints and counters only (never message text) to HERMES_HOME/plugin-data/tide, file telemetry off unless tide.telemetry: true; registers a /tide status command."
