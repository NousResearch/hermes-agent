name: tightbeam
repo: https://github.com/skeptical-agency/tightbeam
sha: 78bc8462749e6dd5e4594cec3a9cdc5f247c30c5
description: "Beam shorts to every platform and keep your whole YouTube catalog optimized: 11 tools + 2 automation blueprints (nightly back-catalog sweep under a quota budget, post-publish optimizer for new uploads), plus multi-platform publishing through OpusClip with collision checks, platform caps and read-back verification built in. Disclosure — video metadata (titles/descriptions/tags/ids) goes to the Google YouTube Data API through YOUR OWN OAuth client declared in the plugin manifest (hermes auth add tightbeam:google; Hermes stores and refreshes the token, the plugin never sees it); video bytes and post copy go to OpusClip through YOUR Hermes-managed opusclip MCP connection (hermes mcp login opusclip); title and copy generation uses your Hermes host LLM; the plugin stores no credentials; publishing is irreversible once the platform window passes."
maintainer: skeptical-agency
tier: community
category: tools
docs_url: https://github.com/skeptical-agency/tightbeam/blob/78bc8462749e6dd5e4594cec3a9cdc5f247c30c5/README.md
