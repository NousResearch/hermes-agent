  provides_tools:
    - tightbeam_status
    - tightbeam_credits
    - yt_audit
    - yt_watch
    - yt_optimize
    - yt_sweep
    - publish_upload
    - publish_submit
    - publish_schedule
    - publish_status
    - publish_unschedule
  provides_hooks: []
  provides_middleware: []
