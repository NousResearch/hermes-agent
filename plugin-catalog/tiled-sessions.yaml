title: Tiled Sessions
description: "Hyprland for Hermes Desktop: clicking a session opens it in a new tile instead of replacing the chat you were in, and every tile re-lays out in Grid (all tiles the same size), Master, Dwindle or Columns. Ctrl+Alt+arrows move focus and the caret follows, Ctrl+Alt+Enter opens a new chat in its own tile, and every shortcut is editable on the plugin's settings page. Desktop-only (desktop/plugin.js on the plugin SDK); public gateway RPCs only; no agent tools, hooks, middleware, env vars or telemetry."
