title: Tiled Sessions
description: "Hyprland for Hermes Desktop: clicking a session opens it in a new tile instead of replacing the chat you were in, and every tile re-lays out as Grid, Master, Dwindle or Columns. Ctrl+Alt+arrows move focus and the caret follows, Ctrl+Alt+Enter opens a new chat in its own tile, Ctrl+Alt+F fullscreens the focused tile, and saved workspaces bring a whole set of tiles back in one step. The Tiles pane adds search, drag-to-reorder and a right-click menu (pin, rename, move to main, close). Every shortcut is editable on the plugin's settings page. Desktop-only (desktop/plugin.js on the plugin SDK); public gateway RPCs only (session.title for rename); no agent tools, hooks, middleware, env vars or telemetry."
