name: time-context
repo: https://github.com/trappka/hermes-time-context
sha: 4a52d5c592462553083dfca850f7f7707123754f
description: "Tells the agent what time it is: the current date, clock time, session age and previous turn duration in every turn, plus user-defined time windows (office hours, night, quiet hours) carrying notes on what to avoid inside them, and a `now` tool for an exact reading. The block rides Hermes's per-turn user-message context, never the cached system prompt, so it cannot break the prompt cache. Disclosure — reads only the machine clock and its own plugin settings, keeps session and turn durations in process memory (no files written), and does not trim or rewrite anything it observes; no network, shell, credentials, subprocesses or reads outside its own settings; does not modify history, tool results or gate any action."
maintainer: trappka
tier: community
category: automation
requires_hermes: ">=0.21.5"
version: "0.2.1"
title: "Time Context"
docs_url: https://github.com/trappka/hermes-time-context#readme
readme: true
capabilities:
  provides_tools: [now]
  provides_hooks: [pre_llm_call, post_llm_call]
  provides_middleware: []
  requires_env: []
