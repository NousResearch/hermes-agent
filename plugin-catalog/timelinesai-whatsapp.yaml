description: "WhatsApp CRM inbox automation for teams: ask what needs a reply, then send WhatsApp messages, label, assign and close chats from Hermes. Regular WhatsApp numbers and WhatsApp API numbers, one browser OAuth sign-in to TimelinesAI, no keys in config. Hosted-only connector, no local code (details and disclosure in the README). Disclosure — Hosted-only connector with no local code: every tool call, including the WhatsApp message text and chat history the agent reads, goes to mcp.services.timelines.ai (operated by TimelinesAI) and acts on the WhatsApp account you sign in with, including sending messages, notes and labels and assigning, opening and closing chats; OAuth tokens are stored by Hermes, the server is marked untrusted so Hermes asks before write-capable calls, and the tool set is served by the remote server at runtime, not covered by the pinned sha. A TimelinesAI account is required."
