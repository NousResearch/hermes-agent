  - tinyfish_agent
  - tinyfish_list_profiles
  - tinyfish_create_profile
  - tinyfish_profile_sign_in
  - tinyfish_update_profile
  - tinyfish_delete_profile
  provides_hooks:
  - pre_tool_call
  - pre_llm_call
  - on_session_finalize
  provides_middleware: []
  requires_env:
  - TINYFISH_API_KEY
