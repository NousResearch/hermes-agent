description: "TinyFish: the web, built into Hermes. Free Search and Fetch power Hermes's own web_search and web_extract, and when a site needs clicks, forms or a login, a remote browser and the tinyfish_agent web agent handle it, signed in through saved TinyFish profiles when needed. Disclosure — sends search queries, URLs to fetch and tinyfish_agent goals with your TINYFISH_API_KEY to the TinyFish API (*.tinyfish.ai). Browser sessions and tinyfish_agent runs spend TinyFish credits. Under the default `request` policy each one goes through Hermes's approval prompt first (a session/always answer covers every later call; cron and unattended runs are denied unless you allow them). Setting `tinyfish.credit_policy.<feature>: allow` or YOLO skips the prompt. `hermes tinyfish setup` / `browser enable` (run by you) save the key to Hermes .env, set web.search_backend/extract_backend and browser.cloud_provider in config.yaml, enable the web/browser toolsets, and can install the agent-browser CLI after asking. Profile tools manage TinyFish Browser Context Profiles (saved website sign-ins) over the same API; you sign in to sites yourself at an agent.tinyfish.ai link and never give Hermes a password, and deleting a profile always asks for approval. Setup telemetry is off by default: only if you opt in (`hermes tinyfish setup --share-usage`, `tinyfish.telemetry: true`, or answering yes to setup's y/N question) does each setup run send one event to agent.tinyfish.ai with its outcome, where the key came from, the plugin version and OS, plus a one-way hash of the key (never the key). TINYFISH_NO_TELEMETRY=1 turns it off regardless."
maintainer: tinyfish-io
title: TinyFish
version: "0.2.5"
image: https://raw.githubusercontent.com/tinyfish-io/tinyfish-web-agent-integrations/2b29d5c864d08fd9716d6f15c3eafdf487b148d3/hermes/assets/banner.png
