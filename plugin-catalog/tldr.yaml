title: TL;DR
description: "One-click summaries of long agent replies in Hermes Desktop. A card shows status first (Done, Blocked, Running, Waiting on you), what changed with each item marked Shown (backed by a tool step) or Stated only, risks, and the decisions the agent left you, with a recommended option and notes; Insert into chat drops your answers into the message box. Scope: last reply, since you last checked, or the whole session (with optional conflict warnings against earlier instructions); S/M/L length; per-reply history; reminders for skipped questions; optional automatic mode with a daily cap. Runs on its own auxiliary task (tldr_summary), so you can pick a cheap model in Models > Auxiliary without touching the chat model. Disclosure — Sends the selected chat text, tool names with short argument previews (up to 160 characters, e.g. commands, paths, URLs) and your preferences note to the model assigned to its `tldr_summary` auxiliary task (Hermes' auxiliary routing, host-owned credentials), only on click or in the opt-in automatic mode (off by default, 30 per day cap); reads this profile's session database and config read-only; stores settings and answers in Desktop plugin storage; no shell, no credentials, no telemetry."
