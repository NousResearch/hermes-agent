name: tmewai
repo: https://github.com/tonidan369-maker/hermes-tmewai
sha: 5f025915c7a415bc684667550c147ca5e6b304f9
description: >-
  Local, offline index for your own Facebook JSON export (Meta's
  your_activity_across_facebook.zip). Imports messages, comments (including
  comments_v2), reactions and posts into a seven-table SQLite database without
  ever extracting the archive to disk, then exposes six tools: archive_scan and
  archive_ingest validate every ZIP entry in memory (absolute paths, .., drive
  paths, NUL bytes, duplicate names and symlinks rejected) and give each entry
  exactly one source_files row so nothing is silently dropped; archive_search
  runs FTS5 over text folded for Arabic (harakat, alef variants, taa marbuta,
  alef maqsura, tatweel, Arabic-Indic and Persian digits, and the presentation
  forms that PDF/Office pastes carry) while stored text keeps its original
  spelling;
  archive_person and archive_overview aggregate over people, conversations,
  events and attachments; archive_evidence builds a hard-capped bundle (20
  events, 4000 characters) with a metadata-only consent row that cannot carry
  excerpt text. Imports are idempotent by content fingerprint. Python standard
  library only, no network access, no API key, no environment variable; the
  database lives under $HERMES_HOME/plugin-data/tmewai/ and TMEWAI_DB_PATH
  overrides it. Disclosure — the plugin reads a personal social export the user
  points it at and stores it unencrypted in that local SQLite file; it never
  sends archive content anywhere, and archive_evidence only returns its capped
  bundle to the agent that requested it.
maintainer: tonidan369-maker
tier: community
category: memory
