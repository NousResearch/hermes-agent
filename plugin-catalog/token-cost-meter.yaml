description: "Live token usage, model-aware USD cost and prompt-cache savings in the Hermes Desktop status bar, with a persistent per-day ledger that survives restarts. Disclosure — Desktop only; no network calls of its own (prices come from the gateway's model.options and a bundled models.dev rate table); stores per-day token totals, per-session counters and last-known rates in its own Desktop plugin storage; ledger export writes only to the clipboard or a user-initiated CSV/JSON download; costs are list-price estimates, not billing data."
maintainer: IT-dreamer
