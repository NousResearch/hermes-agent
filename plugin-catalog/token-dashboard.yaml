title: Token Dashboard
description: 'Token cost and usage dashboard for Hermes Desktop: a right pane with the focused session''s live input and output tokens, session cost (backend-reported cost_usd when available, otherwise a labelled estimate from a built-in per-model price table), API calls and context usage bar, plus a recent-sessions overview with message counts and a status bar cost chip. Desktop-only (desktop/plugin.js inside the plugin SDK surface); no agent tools, hooks, middleware, or env vars. Disclosure: reads the focused session usage state and the session list through the Desktop host API and renders them locally; no network calls, no storage.'
maintainer: Whydiriki700
