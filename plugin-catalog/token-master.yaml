known_issues:
  - "History is per provider and per profile, not per login: neither Hermes' usage table nor the DeepSeek Harness ledger records which credential served a request, so tokens cannot be split by account. Per-account quota is live, but per-account token history would have to be recorded forward-only."
  - "Days are bucketed by last activity (a Hermes row carries last_seen; a DeepSeek Harness session is attributed to its file's last write), so a session spanning midnight lands on the day it finished."
  - "Token counts cover one machine: remote machines are read only after you add an SSH host and press Sync now. Provider quotas are account-wide, so the percentage windows still cover every machine and tool using that account."
  - "Quota sampling is passive: a sample is appended only while the page or a limits refresh is open, so the burn-rate trend means 'what happened while I was watching'. Live windows exist where Hermes ships a fetcher (anthropic, openai-codex, opencode-go, openrouter); nous and xai-oauth expose none and the card says so."
  - "Tested on Windows 11 against Hermes 0.23.0. The backend and Desktop page are platform-neutral; install.ps1 is PowerShell-only, and everywhere else `hermes plugins install token-master` is the install path."
