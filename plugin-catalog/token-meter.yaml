description: "Live token and cost readout in the Hermes Desktop status bar: turns/steps, output speed, cumulative total, input/output split, cache hit rate and a context-occupancy ring, plus a 13-line tooltip with model, latency, reasoning tokens, subagent count and compression count. Disclosure — reads host.state.focusedUsage and host.request('session.history') from the focused session, and writes two diagnostic JSON files into its own plugin data directory; no network calls, no subprocess, no shell, no credential access, no telemetry."
