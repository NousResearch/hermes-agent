title: Token Speed
description: 'Live token generation speed plus session up/down token totals in the Hermes Desktop status bar, with a click-through dashboard: 60-second sparkline, this-turn output tokens, model, call count, average t/s, cache hit %, context usage % and estimated cost. Speed is estimated from a 2-second sliding window of streamed characters and continuously recalibrated against the session''s authoritative UsageStats, so mixed English/CJK traffic tracks without a fixed heuristic. Desktop-only (desktop/plugin.js inside the plugin SDK surface); no agent tools, hooks, middleware, env vars, network calls or file writes.'
