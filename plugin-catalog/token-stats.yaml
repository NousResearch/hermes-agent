title: Token Stats
description: "Lifetime token usage page for Hermes Desktop: totals across every profile on the connected (local or remote) gateway, a per-model table (share, input/output, cache read and cache %, calls, tokens per call, measured speed, cost), API-equivalent cost and savings from free models, subscription plans and prompt caching, a provider and profile split, activity streaks and month-over-month trend, daily chart, and top tools, skills and background (aux) work; plus a status-bar lifetime chip. Disclosure — read-only: calls the gateway's /api/analytics/models and /api/analytics/usage routes for each profile through the raw window.hermesDesktop.api bridge (no typed SDK helper exists for them), lists profiles and connections, and listens to message/usage events to time turns. Stores speed samples, a pruning ledger (so lifetime totals survive sessions.auto_prune) and the last loaded numbers in plugin storage, and reads an optional user-made archive.json from its own ctx.files data folder. Cost uses a bundled snapshot of models.dev list prices. No network calls of its own, no telemetry, no credentials."
