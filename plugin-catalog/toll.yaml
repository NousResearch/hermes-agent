description: "Read-only safety checks before an agent buys a coin, signs a transaction or pays another agent, through Toll's hosted MCP server (Streamable HTTP at https://t0ll.xyz/mcp, no key, no sign-in): who is behind a coin (snipers, bundles, linked wallets, the dev's funding and record), whether the LP can be pulled, whether the product a coin claims exists, ALLOW / WARN / BLOCK before signing a transaction, EIP-712 message or x402 payment, and an ERC-8004 agent's registration and x402 terms, on Robinhood Chain, Solana, BSC and Arc; plus Robinhood Stock Token market data (debt securities, not shares), SEC fundamentals, insider trades and US macro figures. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local code; every tool call goes to t0ll.xyz, which receives the tool's arguments (token contracts, wallet addresses, agent ids, tickers, the unsigned transaction passed to check_tx); every tool is annotated read-only and the server never signs, sends transactions or moves money; the package marks the server untrusted; no key is stored or sent (free daily quota of 10 new coins and 50 market calls, more with a Toll key the user sets in their own config); past the quota answers end with a paid x402 URL the plugin cannot pay; no telemetry (the quota is counted per caller with a daily-rotated keyed hash of the IP, deleted after 3 days). The tool set is served by the remote server at runtime and is not covered by the pinned sha."
