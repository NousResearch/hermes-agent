description: "Safety checks before an agent buys a coin, signs a transaction or pays another agent, through Toll's hosted MCP server (Streamable HTTP at https://t0ll.xyz/mcp, no key, no sign-in): who is behind a coin (snipers, bundles, linked wallets, the dev's funding and record), whether the LP can be pulled, whether the product a coin claims exists, one word before a buy (BLOCK / WARN / ALLOW / WAIT), ALLOW / WARN / BLOCK before signing a transaction, EIP-712 message or x402 payment, a wallet's live approvals with the unsigned revoke, an ERC-8004 agent's registration and x402 terms, paid x402 APIs and who they pay, and a Uniswap v4 hook's powers, on Robinhood Chain (4663) only; plus Robinhood Stock Token market data (debt securities, not shares), SEC fundamentals, insider trades, 13F institutional holders, earnings guidance, the Stock Token event feed and US macro figures. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure — hosted-only connector with no local code; every tool call goes to t0ll.xyz, which receives the tool's arguments (token contracts, wallet addresses, agent ids, tickers, the unsigned transaction passed to check_tx); 24 of the 28 tools are lookups annotated read-only; 4 are not (watch_coin and watch_wallet store a watch that makes Toll POST signed events to an https url the caller gives, unwatch_coin and unwatch_wallet remove one) and all 4 refuse without a Toll key, which this keyless package does not send; the server never signs, sends transactions or moves money; the package marks the server untrusted; no key is stored or sent (free daily quota of 10 new coins and 50 market calls, more with a Toll key the user sets in their own config); past the quota answers end with a paid x402 URL the plugin cannot pay; no telemetry (the quota is counted per caller with a daily-rotated keyed hash of the IP, deleted after 3 days). The tool set is served by the remote server at runtime and is not covered by the pinned sha."
