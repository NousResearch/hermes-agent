description: "Search the Toolfound product directory, compare alternatives, plan a launch and use launch-preparation helpers through its hosted MCP server, with a launch workflow skill bundled. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/). Disclosure: every tool call goes to https://toolfound.com/api/mcp; discovery tools need no account. toolfound_submit_product sends the product details and owner email the user confirms, and the owner completes verification separately. The package marks the server untrusted so Hermes asks before write-capable calls. The tool list comes from the server at run time and is not covered by the pinned sha."
