    - on_session_end
    - on_session_finalize
    - on_session_reset
    - pre_llm_call
    - transform_llm_output
    - post_api_request
    - post_tool_call
    - pre_tool_call
    - subagent_start
  provides_middleware: []
  requires_env: []
