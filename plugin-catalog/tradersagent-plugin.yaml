sha: 3c927216ace9e5f01d3399a36f5a85834bdfe01c
subdir: traders-desk
description: "A chart-first Trader's Agent for Hermes Desktop: one sidebar row docks a live Vela chart beside your conversation — replay, drawing tools, the LuxAlgo Library, a paper broker and Edge Stats behind it. Disclosure — the pane frames a local console service on 127.0.0.1:8787 that this package does not include or start: you clone the repository and run its ./install.sh or ./console/start.sh. install.sh registers that console as a background service (a systemd user unit on Linux, a launchd agent on macOS) that starts at login and restarts itself, registers the separate traders-chart MCP server with `hermes mcp add`, and with --with-edge clones LuxAlgo's Edge Stats engine at a pinned commit and installs its Node dependencies. The console fetches market data from Binance, Dukascopy and Yahoo Finance and Library scripts from LuxAlgo's hosted MCP (mcp.luxalgo.com), runs local image converters (vips, ImageMagick or ffmpeg) and the optional LuxAlgo Node engines, and keeps no account, key or telemetry. When no chat is open, the sidebar row creates and opens one Hermes chat titled \"Trader's Agent — desk\" (a palette command turns that off). The plugin itself registers UI only."
maintainer: godzillacode0000
tier: community
category: desktop
requires_hermes: ">=0.17.0"
docs_url: https://github.com/godzillacode0000/tradersagent-plugin#readme
version: "1.3.0"
image: https://raw.githubusercontent.com/godzillacode0000/tradersagent-plugin/3c927216ace9e5f01d3399a36f5a85834bdfe01c/docs/screenshot.png
platforms: [linux, macos]
known_issues:
  - "The chart pane needs the repository's local console (127.0.0.1:8787), which this entry does not install. Clone https://github.com/godzillacode0000/tradersagent-plugin and run ./console/start.sh — the pane says exactly that when the console is unreachable."
  - "The agent's chart tools are not installed by this entry either: register the traders-chart MCP server with ./bin/register-mcp.sh (install.sh does both)."
