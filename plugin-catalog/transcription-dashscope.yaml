description: "Speech-to-text for Hermes via DashScope (Qwen) — voice messages and live dictation. Needs a Qwen AI Platform API key. Disclosure — voice messages and live dictation audio are uploaded to Alibaba's Qwen AI Platform (DashScope, maas.qianwenaiapi.com by default, or the base URL set in stt.dashscope.base_url / TRANSCRIPTION_DASHSCOPE_BASE_URL / DASHSCOPE_BASE_URL); the API key is TRANSCRIPTION_DASHSCOPE_API_KEY, falling back to the HERMES_CUSTOM_DASHSCOPE_API_KEY custom-provider key or the built-in Alibaba provider's DASHSCOPE_API_KEY; clips are converted with the local ffmpeg into a temporary wav that is deleted afterwards."
