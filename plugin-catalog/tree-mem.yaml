name: tree-mem
repo: https://github.com/mauriciobc/hermes-plugin-tree-mem
sha: 0ae0fd629112370a35c34b25df9942e7cd9131db
subdir: hermes-plugin-tree-mem
description: UniiChat/OptMem tree memory - the chat log compressed into a binary tree of one-line summaries (<=512 bytes each), with a graded 64-128 KB view injected every turn and zoom/date tools to open any line back down to the message it came from. Implements Victor Taelin's "OptChat" design. Disclosure - the plugin reads the local Hermes state.db and its own store, spawns one detached background process that calls a summarizer model API (the endpoint and model are configurable; each call sends the message text to be compressed), and registers three tools.
maintainer: mauriciobc
tier: community
category: memory
requires_hermes: ">=0.21.0"
version: "1.0.0"
docs_url: https://github.com/mauriciobc/hermes-plugin-tree-mem#readme
readme: true
platforms: [linux, macos]
capabilities:
  provides_tools:
    - tree_view
    - tree_zoom
    - tree_date
  provides_hooks: []
  provides_middleware: []
  requires_env: []
