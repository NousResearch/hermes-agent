category: tools
requires_hermes: ">=0.23.3"
description: >-
  Treg is OpenRouter for agent tools. Hermes users can access 4,200+ tools through one Treg connection, alongside their team’s own tools. Ask Hermes to check search rankings and backlinks, enrich a company profile, publish a post through a connected account, or generate an image, video or voiceover. Hermes can compare providers and inspect each tool’s inputs and price before calling it.
  Hermes sends the team token and requested inputs to https://treg.to/mcp/. Execution can send data to a provider, change a connected account, or spend the team’s prepaid balance. Catalog lookups are free. Hermes applies its untrusted-server approval policy to write-capable calls.
docs_url: https://github.com/tomcharlesosman/treg-hermes/blob/3397dc168eca88eace5071db7eefe6e8e6e2bb03/README.md
image: https://raw.githubusercontent.com/tomcharlesosman/treg-hermes/3397dc168eca88eace5071db7eefe6e8e6e2bb03/assets/marketplace.png
readme: true
known_issues:
  - "Requires MCP support and a scoped TREG_TOKEN in the Hermes profile. Limits and available team tools depend on that token."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - TREG_TOKEN
