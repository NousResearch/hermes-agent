name: triage
repo: https://github.com/Saderius/hermes-triage
sha: abb38200d755354accf21444627f9f44d4d58182
description: "Keeps the list of every skill out of your context. Triage suggests skills in the composer as you type and as the chat goes on, ranked locally with no model call; a skill loads only when you pick it or clearly ask for it."
maintainer: Saderius
tier: community
category: desktop
requires_hermes: ">=0.23.0"
docs_url: https://github.com/Saderius/hermes-triage#readme
version: "0.1.3"
platforms: []
title: Triage
known_issues:
  - Hides Hermes' own skills from Hermes while installed; run `python run.py restore` in the plugin folder before uninstalling.
capabilities:
  provides_tools:
    - skill_search
    - skill_load
  provides_hooks:
    - pre_llm_call
    - pre_tool_call
    - transform_tool_result
    - post_compaction
  provides_middleware:
    - llm_request
    - tool_execution
  requires_env: []
