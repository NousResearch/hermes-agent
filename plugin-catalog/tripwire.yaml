name: tripwire
repo: https://github.com/percyhendrux123-prog/hermes-tripwire
sha: 5a8b5bab040d782e5d9111a7e1b8439e9c501226
subdir: tripwire
version: "0.1.3"
description: "Logs every refused agent action (a tool blocked by a guardrail or plugin, or a dangerous command denied, cancelled or timed out at approval) as one JSON line, so a no-agent cron script can send the owner one short alert. Observer only, fails open. Disclosure — appends one JSON line per refused action to ~/.hermes/tripwire/events.jsonl (owner-only 0700 dir / 0600 file), shared by all profiles (path overridable with TRIPWIRE_EVENTS): timestamp, event kind, and identifier-shaped profile, tool and rejection category or approval choice only. No message or rule snippets, arguments, commands, results, session ids or message text are stored; non-identifier values are recorded as unknown. A pre_tool_call hook reads ~/.hermes/tripwire/TEST_BLOCK and, only while that file exists, blocks the single tool it names for the single profile it names (a drill switch to prove the alarm). No network calls, no shell commands, no background processes, no stored credentials, no telemetry."
maintainer: percyhendrux123-prog
tier: community
category: tools
requires_hermes: ">=0.22.5"
docs_url: https://github.com/percyhendrux123-prog/hermes-tripwire/blob/5a8b5bab040d782e5d9111a7e1b8439e9c501226/README.md
readme: true
platforms: [macos, linux]
known_issues:
  - "A tool call the model makes outside its toolset is rejected by Hermes before any plugin hook runs, so Tripwire does not see it."
  - "The optional notifier (scripts/tripwire_notify.py) is fetched at the pinned commit and scheduled with `hermes cron create ... --no-agent`; it is not part of the plugin directory. See README."
capabilities:
  provides_tools: []
  provides_hooks:
    - post_tool_call
    - post_approval_response
    - pre_tool_call
  provides_middleware: []
  requires_env: []
