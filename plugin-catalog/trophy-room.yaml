sha: 80852baa4207e8269f83e4a5681d77b5e9ae5016
title: Trophy Room
description: 'Achievements for Hermes Desktop: 120 illustrated trophies earned from real Hermes work
  (tools, skills, profiles, cron, plugins, messaging, kanban, media), collectible cards across five
  tiers, unlock pop-ups with a synth sting, optional OS notifications, recent trophies and replayable
  away collections. Hooks only on the agent side (no tools, middleware or env vars); progress is stored
  in the plugin''s own data directory. No telemetry or third-party services; artwork is bundled and the
  sound is synthesized locally. Optional read-only import from the bundled hermes-achievements plugin.
  Derived in part from hermes-achievements by PCinkusz (MIT): the 60 original achievement definitions.'
maintainer: abundantbeing
