description: "Blocks token buys when true402 finds a honeypot or a rug in progress — one pre_tool_call hook in front of every trading tool, MCP server and terminal command (Base, Ethereum, BSC, Solana). Free edition: it never pays, holds no wallet key and has no payment code. Disclosure — the pre_tool_call hook reads the command string of every tool call and the parameters of trading-named tools; when a call looks like a buy, each candidate token address and its chain (every 0x address in a trading shell command except well-known majors and an unambiguous sold token, which can include a recipient or wallet address) is sent to true402.dev's free check endpoint, with no prompts, amounts or other tool data. Uses true402's small daily free allowance; when it is used up, a token counts as unchecked and passes by default (configurable to ask or block). Blocks only on a definite danger verdict for a token being bought; a possible sale or a configured caution goes to the Hermes approval gate, and one \"always\" answer there silences all later guard prompts. No stored data, no shell commands, background processes or telemetry."
