version: "0.3.1"
description: "Private taste memory for Hermes with proactive hypotheses, sourced cross-theme discovery, compact context, Taste Atlas and Sunday editions. Disclosure — During new-profile setup the bundled skill proposes a weekly \"Sunday edition\" (20:00 local time) and, unless you say \"one-off only\", has the agent create a recurring Hermes cron job that runs a curation turn on your model plan every Sunday. The plugin itself only reads the cron list to confirm it, and `trurl_schedule off` plus pausing that job stops delivery. Your taste profile, feedback and history are stored locally in the plugin's data directory (trurl.sqlite3, taste-atlas.html, editions/)."
maintainer: oblomovunleashed
tier: community
category: tools
requires_hermes: ">=0.23.0"
