description: "Check your X mirrors, preview a post on each network, save crosspost drafts and publish or retry only when you confirm, through Twinpost's hosted MCP server, with a crosspost workflow skill bundled. Portable Agent Plugins v1 package (plugin.json + mcp.json + skills/). Disclosure: every tool call goes to https://twinpo.st/mcp and needs a Twinpost account (OAuth, Hermes stores the tokens). Publish tools can post to the networks the user connected; the server requires confirm: true on anything that reaches an audience and the skill sends it only after the user says yes. The package marks the server untrusted so Hermes asks before write-capable calls. The tool list comes from the server at run time and is not covered by the pinned sha."
