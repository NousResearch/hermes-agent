title: Twitch Assist
description: "Put your Hermes in your Twitch chat as a co-host: viewers type !ask (or @mention the bot) and get a real agent answer in chat, and the broadcaster or a mod can run Backseat Mode, a chat vote whose winner becomes Hermes's next task. Stdlib only (asyncio IRC over TLS). Disclosure: network calls are limited to irc.chat.twitch.tv:6697 (TLS IRC, to read and post in the configured channel) and https://id.twitch.tv/oauth2/validate (checks the chat token and learns its login); the Twitch token is read only through Hermes's secret scope (TWITCH_TOKEN, a secret requires_env) and is never logged or written by the plugin; no telemetry, no shell commands, no file reads outside Hermes's own config (it reads the Hermes config through Hermes's read-only reader only to log warnings, and never edits it), and no background process beyond the gateway connection itself; private by default: only the broadcaster and the Twitch user ids in TWITCH_ALLOWED_USERS can trigger an agent turn with !ask or an @mention, or vote or start a vote (per-viewer cooldown, default 20 s, and a global cap of 3 questions in flight, TWITCH_MAX_CONCURRENT); opening it to every viewer needs an explicit TWITCH_ALLOW_ALL_USERS=true, and even then requests from anyone but the broadcaster are dropped unless memory.memory_enabled and memory.user_profile_enabled are false and platform_toolsets.twitch is pinned, and those turns get only the search and no_mcp toolsets (web search, no terminal, files, code, browser or MCP) with gateway /commands disabled, backed by a pre_tool_call hook that blocks every tool except web_search in Twitch sessions; only the broadcaster or a moderator (from Twitch's server tags) can start or cancel a vote; the adapter posts only replies to questions it dispatched, so gateway notices, cron output and broadcasts never reach public chat; question text goes to the user's configured model provider and web search uses the user's configured search backend; Hermes injects the owner's SOUL.md persona (even with skip_context_files on Hermes 0.23.x) and MEMORY.md and USER.md into every gateway session prompt and a plugin cannot disable that, so the supported setup is a dedicated Hermes profile for the Twitch bot with an empty SOUL.md and memory off (see README)."
maintainer: Techkeyy
tier: community
category: platform
requires_hermes: ">=0.23.0"
docs_url: https://github.com/Techkeyy/twitch-assist#readme
version: "0.3.0"
screenshots:
  - https://raw.githubusercontent.com/Techkeyy/twitch-assist/ca59b45749c29a53fd8e9b4c16608748adaf6c26/docs/chat-proof.jpg
platforms: []
known_issues:
  - Needs a Twitch chat OAuth token with chat:read and chat:edit (a dedicated bot account is recommended).
  - platform_toolsets.twitch is REQUIRED to be pinned to [search, no_mcp] in config.yaml. A plugin cannot change the platform default toolset, so an unresolved adapter would otherwise fall back to the full default (a pre_tool_call guard still blocks every tool except web_search, and a warning is logged at connect).
  - Hermes injects the owner's SOUL.md persona into every gateway session prompt, and skip_context_files does NOT remove it on Hermes 0.23.x; MEMORY.md and USER.md are removed only by memory.memory_enabled and memory.user_profile_enabled set to false. A plugin cannot switch this off, so run the Twitch bot in its own Hermes profile (hermes profile create) with an empty SOUL.md and no memory. An external memory provider may also record Twitch turns.
  - Private by default: only the broadcaster and TWITCH_ALLOWED_USERS ids can use the bot. TWITCH_ALLOW_ALL_USERS=true is an explicit opt-in and fails closed: non-broadcaster requests are dropped unless both memory flags are false and platform_toolsets.twitch is pinned (the reason is logged once).
  - Toolsets registered by other plugins are added by Hermes to any platform list (no no-plugins setting); their calls are blocked in Twitch sessions by the guard, but their schemas may still be shown to the model.
  - The first answer after a gateway start can take up to a minute (Hermes cold start); later answers take seconds.
  - In-turn gateway notices are matched by English text; outside a pending turn nothing is posted in any language.
  - A running Backseat vote is lost if the connection drops or the gateway restarts.
  - Reconnect after a real network drop is proven only against a local fake IRC server.
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - TWITCH_TOKEN
    - TWITCH_CHANNEL
