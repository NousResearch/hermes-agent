title: Twitch Assist
description: "Put your Hermes in your Twitch chat as a co-host: viewers type !ask (or @mention the bot) and get a real agent answer in chat, and the broadcaster or a mod can run Backseat Mode, a chat vote whose winner becomes Hermes's next task. Stdlib only (asyncio IRC over TLS). Disclosure — network calls are limited to irc.chat.twitch.tv:6697 (TLS IRC, to read and post in the configured channel) and https://id.twitch.tv/oauth2/validate (checks the chat token and learns its login); the Twitch token is read only through Hermes's secret scope (TWITCH_TOKEN, a secret requires_env) and is never logged or written by the plugin; no telemetry, no shell commands, no file reads outside Hermes's own config, and no background process beyond the gateway connection itself; anyone in the channel can trigger an agent turn with !ask or an @mention (per-viewer cooldown, default 20 s; restrict with TWITCH_ALLOW_ALL_USERS=false and TWITCH_ALLOWED_USERS), and those turns get only the search and no_mcp toolsets (web search, no terminal, files, code, browser or MCP) with gateway /commands disabled; only the broadcaster or a moderator (from Twitch's server tags) can start or cancel a vote; question text goes to the user's configured model provider and web search uses the user's configured search backend."
maintainer: Techkeyy
tier: community
category: platform
requires_hermes: ">=0.23.0"
docs_url: https://github.com/Techkeyy/twitch-assist#readme
version: "0.1.0"
screenshots:
  - https://raw.githubusercontent.com/Techkeyy/twitch-assist/b93a8a4a50004412d4ae4e1f1c3df603e97f4bd1/docs/chat-proof.jpg
platforms: []
known_issues:
  - Needs a Twitch chat OAuth token with chat:read and chat:edit (a dedicated bot account is recommended).
  - A running Backseat vote is lost if the connection drops or the gateway restarts.
  - Reconnect after a real network drop is proven only against a local fake IRC server.
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - TWITCH_TOKEN
    - TWITCH_CHANNEL
