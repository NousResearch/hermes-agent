description: "Free streamer tools through TwitchBoard's MCP server (Streamable HTTP at https://www.twitchboard.net/mcp, no sign-in, no keys): exact image sizes for Twitch, YouTube, Discord, Kick and TikTok, username ideas that follow each platform's rules, Minecraft and Roblox name checks, ready-to-paste OBS widget URLs, OBS bitrate settings, Discord fancy text and timestamps, and Twitch, Kick and TikTok earnings estimates. Bundles one skill on when to use each tool. Agent Plugins v1 package (plugin.json + mcp.json + skills/), configuration only. Disclosure: hosted-only connector with no local code; every tool call goes to www.twitchboard.net, which logs the tool name and client name only. check_username forwards the requested name to Mojang (or the PlayerDB mirror) and Roblox. All twelve tools are annotated read-only. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
