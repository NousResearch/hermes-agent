description: "Call your Hermes from your phone and let it call you back, through the Twring app (iPhone and Android): live two-way voice calls and typed chat in one Hermes conversation, dangerous-command approvals answered by voice or tap through Hermes's own approval card, and a phone ring when a scheduled job delivers. Twring does the speech; Hermes keeps its model, memory and tools. Disclosure — while the gateway runs, one outbound WebSocket to the linked Twring server (api.twring.com by default, or the TWRING_SERVER you set) carries call and chat turn text in, and Hermes's replies, approval questions (command preview and reason) and cron results out; anyone signed in to the linked Twring account drives this Hermes as its owner and can approve one dangerous command at a time by voice or tap through Hermes's own approval card; HTTPS calls to the same server link the account (sending this computer's hostname as its name), post replies to the chat and ring the phone (cron results ring by default; TWRING_RING_ON_DELIVERY=false turns it off); one link token (TWRING_TOKEN), saved by `hermes twring link` through Hermes's .env route; no files of its own, no shell commands, no telemetry, no self-update."
