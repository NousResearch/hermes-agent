description: "Call your Hermes from your phone and let it call you back, through the Twring app (iPhone and Android): live two-way voice calls and typed chat in one Hermes conversation, dangerous-command approvals answered by voice or tap through Hermes's own approval card, and a phone ring when a scheduled job delivers. Twring does the speech; Hermes keeps its model, memory and tools. Disclosure: while the gateway runs, one outbound WebSocket to the linked Twring server (api.twring.com by default) carries turn text in and Hermes's replies, approval questions (command preview and reason) and cron results out; HTTPS calls to the same server link the account and ring the phone. One link token (TWRING_TOKEN), saved by `hermes twring link` through Hermes's .env route; no files of its own, no shell commands, no telemetry, no self-update."
