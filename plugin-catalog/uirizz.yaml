known_issues:
  - Official widget Image components often fail to load even public https URLs; omit the image and say so in fallback_text.
  - View buttons can wrap at typical card widths.
  - Tall cards can clip under the composer or in the viewport.
  - Calling present again for the same view still creates a new surface. A new unrelated card without surface_id now gets a distinct id.
  - "A data-only op=update without a second MEDIA: line was observed to refresh the first card in place. A second MEDIA: line can still mount a second copy."
