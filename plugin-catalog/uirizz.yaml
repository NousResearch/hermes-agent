description: >-
  A2UI v1.0 cards in Hermes Desktop and Webapp chat, from one tool:
  a2ui_render.

  The agent presents official Basic Catalog surfaces (with required
  fallback_text for the CLI and other clients), then refreshes values
  in place with a data-only op=update. Declared actions (actions.yaml
  or register_action) bind a card button to one exact Hermes tool call.

  Disclosure — a click is never approval. Side effects wait for the
  user's typed yes in chat; high-risk declared actions require yes
  <code> (the code is the first six characters of the action id after
  act-). Bare "yes" is ignored for those. Approval is single-use,
  session-scoped, and expires after 600 seconds. pre_tool_call lets
  only the bound call through, once; altered arguments and replays
  are blocked. post_tool_call records completed or failed. The audit
  log is append-only and hash-chained; op=audit reads it. No
  credentials, no requires_env, no runtime subprocesses, and no plugin
  network. Media must be public https (no http, data, or local files).
  Surfaces stay in the Hermes plugin data directory. Does not register
  transform_llm_output, so it can sit beside hermes-a2ui. Official
  Basic Catalog only.

  Quick example: ask for a fictional service-status card, click Deploy,
  then type yes <code> when the confirm panel asks. Nothing real is
  deployed unless you bind a real tool in your own actions.yaml.

  Tool: a2ui_render (present, update, delete, describe, audit). Hooks:
  pre_llm_call, pre_tool_call, post_tool_call. Skill uirizz:uirizz is
  1365 o200k tokens against a 2000 budget; the tool schema is 447
  o200k against a 500 budget. Requires Hermes >= 0.23.0.
