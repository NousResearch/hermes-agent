sha: e1b21daa89386d1cba865d5ef6f6364c03edc40e
version: "0.6.2"
description: "One queue of what is blocked on you: live prompts, pairing requests, Kanban cards, chats and agent-filed items or watched-folder drafts and notes. Search, read, answer and recover in place. Disclosure: reads local profiles' chat histories and pending pairing requests (never pairing codes), Kanban and configured folders; records live prompt text and agent-filed items in plugin data; comments on and can unblock Kanban cards via public kanban_db.unblock_task only when you answer. Summaries send new or changed eligible item text, including other profiles' chats and outside items, to your configured model through ctx.llm by default; TL;DR/Ask sends card context when clicked (disable with bluf_enabled: false and ask_enabled: false). Watched folders and bounded recursive reading are off by default and remain read-only. Ask restart markers contain no card, question or answer text by default; optional ask_persist_replies retains finished answers for up to 15 minutes. Messaging /unbl0ck returns counts only. Uses Hermes Kanban and pairing modules (no private helpers) and, on hosts without /proc, ps to check process start time. Optional owner-run Security review script contacts GitHub and a configured gateway; it is not activated by installation. No telemetry or self-updater."
maintainer: KyaniteLabs
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/KyaniteLabs/unbl0ck/blob/e1b21daa89386d1cba865d5ef6f6364c03edc40e/README.md
