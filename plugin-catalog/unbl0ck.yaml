name: unbl0ck
title: UNBL0CK
repo: https://github.com/KyaniteLabs/unbl0ck
sha: d8d6b0ca4ecd7e7d8ea39b58b89398511e9106bd
version: "0.5.1"
description: "One queue of what is blocked on you: live prompts, pairing requests, Kanban cards, chats and agent-filed items or watched-folder drafts and notes. Search, read, answer and recover in place. Disclosure: reads local profiles' chat histories and pending pairing requests (never pairing codes), Kanban and configured folders; records live prompt text and agent-filed items in plugin data; comments on and can unblock Kanban cards only when you answer. Summaries send new or changed eligible item text, including other profiles' chats and outside items, to your configured model through ctx.llm by default; TL;DR/Ask sends card context when clicked (disable with bluf_enabled: false and ask_enabled: false). Watched folders are off by default and remain read-only. Messaging /unbl0ck returns counts only. Uses private Hermes imports and, on hosts without /proc, ps to check process start time. Optional owner-run Security review tooling contacts GitHub and a configured gateway; it is not activated by installation. No telemetry or self-updater."
maintainer: KyaniteLabs
tier: community
category: tools
requires_hermes: ">=0.23.0"
docs_url: https://github.com/KyaniteLabs/unbl0ck/blob/d8d6b0ca4ecd7e7d8ea39b58b89398511e9106bd/README.md
image: https://raw.githubusercontent.com/KyaniteLabs/unbl0ck/d8d6b0ca4ecd7e7d8ea39b58b89398511e9106bd/assets/banner.png
screenshots: []
readme: true
platforms: []
known_issues:
  - "For chats and live prompts, Full text expands only a whitespace-normalized tail capped at 480 characters rather than retrieving the complete original. See https://github.com/KyaniteLabs/unbl0ck/issues/32."
  - "Uses private Hermes Kanban and pairing imports; revalidate after Hermes upgrades."
  - "With no principal_name set, detection uses the configured role words plus principal and human."
  - "Windows has no cross-process state lock; concurrent processes can lose an update."
  - "Typed answer recovery is session-only, expires after 30 minutes and does not survive reload."
  - "Watched folders select at most the newest 200 eligible files per folder and read 256 KiB per file."
  - "Packaged Desktop, live-provider and install/rollback acceptance are not verified for this release; the optional Security review relay is not activated."
capabilities:
  provides_tools: [unbl0ck_file]
  provides_hooks: [on_human_input_request, on_human_input_resolved]
  provides_middleware: []
  requires_env: []
