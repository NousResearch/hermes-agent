name: unbrowse
repo: https://github.com/unbrowse-ai/unbrowse
sha: a82c59dfb05583836ecfa21fdc3f8a2ea73bfb76
subdir: plugins/hermes
description: 'Unbrowse: websites as APIs. Read any page as clean markdown, run tasks on sites through
  learned first-party APIs (no browser), and drive a cloud browser with saved logins when nothing
  matches. Also a web_extract backend and a guard that routes public-web browser_* calls to Unbrowse.'
maintainer: unbrowse-ai
tier: community
category: web
docs_url: https://github.com/unbrowse-ai/unbrowse/tree/main/plugins/hermes
version: "12.1.0"
capabilities:
  provides_tools:
  - unbrowse_canvas_read
  - unbrowse_canvas_put
  - unbrowse_run
  - unbrowse_inspect
  - unbrowse_resume
  - unbrowse_cancel
  - unbrowse_learn
  - unbrowse_browse_open
  - unbrowse_browse_snapshot
  - unbrowse_browse_act
  - unbrowse_forget
  - unbrowse_credentials_list
  - unbrowse_credentials_request
  - unbrowse_credentials_status
  - unbrowse_browse_finish
  - unbrowse_browse_close
  - unbrowse_scrape
  - unbrowse_map
  - unbrowse_sites
  - unbrowse_credits
  - unbrowse_usage
  - unbrowse_index
  - unbrowse_index_status
  - unbrowse_discover
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env:
  - UNBROWSE_API_KEY
