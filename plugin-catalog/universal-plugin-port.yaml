name: universal-plugin-port
repo: https://github.com/friendly-neighborhood-coding-man/hermes-universal-plugin-port
sha: 9d66eaeaa8c4f8637cef5d015a25ab2c3d6a63b9
description: >-
  Inspect user-selected Claude Code/Cowork, Codex, and OpenClaw plugin sources;
  disclose unsupported capabilities; and stage Hermes-compatible packages while
  preserving original source files. Verified deterministic mappings are applied
  before an approval-gated, single-edit model candidate path. Model-tool fetching
  requires fresh interactive approval, and tool outputs stay inside plugin data.
  The /universal-port URL command can make model calls. Its install <run_id> --confirm
  route copies a portable-only package into the active Hermes profile without
  enabling it and refuses overwrite.
  OpenClaw JavaScript inspection requires a separate slash command and fresh
  approval. It runs without sandboxing.
  The optional bounded arXiv GET is disabled by default and requires fresh approval.
  No credential storage, telemetry, or self-update.
maintainer: friendly-neighborhood-coding-man
tier: community
category: tools
requires_hermes: ">=0.22.7"
docs_url: https://github.com/friendly-neighborhood-coding-man/hermes-universal-plugin-port/blob/9d66eaeaa8c4f8637cef5d015a25ab2c3d6a63b9/README.md
version: "0.6.0"
readme: true
platforms: []
known_issues:
  - "Pilot is SKILLS_ONLY_PARTIAL: MCP/OAuth connectors, hooks and other source-host features are not ported."
  - "Cross-host semantic equivalence is NOT_ESTABLISHED; one Anthropic product-management package has a verified Hermes workflow."
  - "Experimental Safebox is not a sandbox, has known bypasses, and is not registered in the release."
  - "Plugin ctx.llm max_tokens is not enforced on the tested native Anthropic route in Hermes v0.22.7 (upstream issue #153099)."
capabilities:
  provides_tools:
    - port_probe
    - port_fetch
    - port_stage
    - uvp_route
  provides_hooks: []
  provides_middleware: []
  requires_env: []
