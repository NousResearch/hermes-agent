platforms: []
known_issues:
  - When Hermes Desktop uses a remote backend, install the Desktop part locally and the Agent/backend part on the remote Hermes host.
  - The Unraid GraphQL schema can vary by release. The monitor was previously tested with Unraid 7.3; the 0.4.0 hardware and transport changes were tested with offline fixtures.
