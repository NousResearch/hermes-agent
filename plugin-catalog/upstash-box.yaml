version: "0.1.0"
title: Upstash Box
description: "Terminal backend that runs Hermes terminal, execute_code and file tools in an Upstash Box cloud container, paused and resumed by name per task or created per session and deleted when it ends. Disclosure: requires an Upstash Box API key (UPSTASH_BOX_API_KEY); every command and the files the file tools touch are sent to Upstash Box; your Hermes skills, cache and skill-registered credential files are uploaded to ~/.hermes in the Box and skill and cache files changed in the Box are copied back to your machine; SDK telemetry is turned off; Boxes are created, paused and deleted in the key's account and billed to it; persistent mode keeps one paused Box per task (each Hermes Desktop chat is its own task), and paused Boxes count toward the account's Box limit; if the Upstash account has GitHub connected, every Box holds those GitHub credentials in ~/.git-credentials, and every Box has an UPSTASH_BLOB_TOKEN environment variable, both readable by the commands the agent runs; dangerous-command approval is skipped inside the Box."
maintainer: Upstash
tier: community
category: tools
requires_hermes: ">=0.22.3"
docs_url: https://github.com/upstash/box/tree/main/packages/hermes-box#readme
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - UPSTASH_BOX_API_KEY
