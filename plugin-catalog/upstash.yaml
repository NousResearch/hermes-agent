version: "0.3.0"
description: "Long-term memory and searchable chat history for Hermes on Upstash Redis Search, with hybrid recall (keywords and meaning) and no separate vector database. Recalls related memories into each turn, saves every session as a searchable transcript, mirrors the built-in memory tool (adds, corrections and removals), and gives the model upstash_memory_save / upstash_memory_search / upstash_memory_forget and upstash_chat_search. Memories use the same keys as @upstash/agentkit-sdk, so they are shared with AgentKit apps on the same database. Works on the Upstash Free plan (one search index). Disclosure — memories and full chat transcripts are written to the Upstash Redis database you configure (UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN) and sent to it over HTTPS on every turn. Memory text and each recall query are embedded by Upstash Redis Search's managed embeddings in that database; chat transcripts are not embedded, and the plugin contacts nothing else. Telemetry is opt-in and off by default: UPSTASH_HERMES_TELEMETRY=1 adds SDK, Python version and platform tags to request headers sent to that same database."
maintainer: Upstash
tier: community
category: memory
requires_hermes: ">=0.19"
