title: US Census
description: "ACS population, income, age, and housing for a US place, with vintage year, variable id, and margin of error. This product uses the Census Bureau Data API but is not endorsed or certified by the Census Bureau. Disclosure — HTTPS only to api.census.gov, geocoding.geo.census.gov, and tigerweb.geo.census.gov (all US Census Bureau); your free CENSUS_API_KEY goes only as the data-call key; metadata, the geocoder, and TIGERweb are keyless; redirects are refused; on every surface, including gateways, no user list, so an admitted guest can estimate with this profile's key; schedule writes scripts/us-census-vintage.py and one local no-model morning job; the job, script, and vintage file remain after disable or removal."
maintainer: TakeshiTGAL
tier: community
category: tools
requires_hermes: ">=0.21.4"
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-us-census#readme
