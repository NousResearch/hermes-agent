platforms: []
capabilities:
  provides_tools:
    - census_datasets
    - census_geographies
    - census_variables
    - census_place
    - census_get
    - census_compare
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - CENSUS_API_KEY
