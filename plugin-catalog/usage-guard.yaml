# Catalog entry for NousResearch/hermes-agent: plugin-catalog/usage-guard.yaml
# Pinned to the release commit of v0.5.0. Bump sha and version together.
name: usage-guard
repo: https://github.com/mister-ideas/usage-guard
sha: d59f798e848f5310f9e3d8673c01f383207c695e
description: "Keeps an agent inside its subscription allowance: refuses a provider dispatch once a subscription usage window is exhausted, so an account that allows paid extra usage stops at the wall instead of spending overage. Reads the usage Hermes already displays, holds no credentials, and never touches account or billing settings. Disclosure — refuses main-loop provider calls (including MoA turns) for the providers in `provider_keys` (Anthropic and OpenAI Codex by default) when a subscription usage window reaches `threshold_percent`, and by default (`fail_open: false`) also refuses when usage data is missing, stale, unreadable, or the guard's own config is malformed; usage is read through Hermes's own account-usage fetcher (no credentials held, at most one read per source every 180 seconds by default) and cached in $HERMES_HOME/plugin-data/usage-guard/usage.json; a `pre_llm_call` hook adds a short usage note to the next turn's context at 80% and 90% used by default, and an opt-in (off by default) `llm_request` middleware lowers an existing output-token budget near the usage limit; both read only the cache, never the network; a `/usage-guard` slash command and a Hermes Desktop status-bar chip (polling a read-only `GET /api/plugins/usage-guard/status` route every 60 s and after each turn) report the guard's decision from the same cache, never making a usage request; auxiliary calls (compression, vision, titles, MoA advisors) are not gated. Borrowing is off by default: when `hydrate_from_paths` names files, the guard may read those JSON snapshots instead of reading the endpoint, validating every window and never writing them into its own cache."
image: https://raw.githubusercontent.com/mister-ideas/usage-guard/d59f798e848f5310f9e3d8673c01f383207c695e/docs/banner.jpg
