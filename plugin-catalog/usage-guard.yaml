# Catalog entry for NousResearch/hermes-agent: plugin-catalog/usage-guard.yaml
# Pinned to tag v0.2.8 (release published 2026-10-16). Bump sha and version together.
name: usage-guard
repo: https://github.com/mister-ideas/usage-guard
sha: be6928a33f922c6f6b703ec0f053788e8a088606
description: >-
  Keeps an agent inside its subscription allowance: refuses a provider dispatch once a
  subscription usage window is exhausted, so an account that allows paid extra usage
  stops at the wall instead of spending overage. Reads the usage Hermes already
  displays, holds no credentials, and never touches account or billing settings.
maintainer: mister-ideas
tier: community
category: automation
requires_hermes: ">=0.21.6"
version: "0.2.8"
known_issues:
  - "Anthropic windows: Hermes's Anthropic fetcher scales any utilization <= 1 by 100, so a window at 0-1% can read as 100% and the guard will refuse. Fixed upstream by NousResearch/hermes-agent#139916; this entry's requires_hermes rises to the release carrying it."
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware:
    - llm_execution
  requires_env: []
