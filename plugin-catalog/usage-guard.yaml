# Pinned to the release commit of v0.6.0. Bump sha and version together.
name: usage-guard
repo: https://github.com/mister-ideas/usage-guard
sha: 06c10bffc6f65e142e14fa63c0506b1a72533cc1
description: "Keeps an agent inside its subscription allowance: refuses a provider dispatch once a subscription usage window is exhausted, so an account that allows paid extra usage stops at the wall instead of spending overage. Reads the usage Hermes already displays, holds no credentials, and never touches account or billing settings. Disclosure — refuses main-loop provider calls (including MoA turns) for the providers in `provider_keys` (Anthropic and OpenAI Codex by default) when a subscription usage window reaches `threshold_percent` (a lone Anthropic reading of exactly 100% with extra usage off is treated as possibly 1%, because Hermes's Anthropic parser scales any utilization <= 1 by 100 until hermes-agent#139916, and passes; a 100% that follows a higher reading in the same window, or any 100% while extra usage is on, refuses), and by default (`fail_open: false`) also refuses when usage data is missing, stale, unreadable, or the guard's own config is malformed; usage is read through Hermes's own account-usage fetcher (no credentials held, at most one read per source every 180 seconds by default) and cached in $HERMES_HOME/plugin-data/usage-guard/usage.json; a `pre_llm_call` hook adds a short usage note to the next turn's context at 80% and 90% used by default, and an opt-in (off by default) `llm_request` middleware lowers an existing output-token budget near the usage limit; both read only the cache, never the network; a `/usage-guard` slash command and a Hermes Desktop status-bar chip (polling a read-only `GET /api/plugins/usage-guard/status` route every 60 s and after each turn) report the guard's decision from the same cache, never making a usage request; a refusal is an explanatory assistant message by default (`refusal_mode: notice`); with the opt-in `refusal_mode: empty` it is an empty reply instead, so Hermes's empty-response recovery retries (each retry refused again, never dispatched) and then switches to the profile's `fallback_providers`, which the guard gates only when they are listed in `provider_keys`; auxiliary calls (compression, vision, titles, MoA advisors) are not gated. Borrowing is off by default: when `hydrate_from_paths` names files, the guard may read those JSON snapshots instead of reading the endpoint, validating every window and never writing them into its own cache."
