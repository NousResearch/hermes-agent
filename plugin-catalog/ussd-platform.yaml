title: USSD
description: "Talk to Hermes from any phone by dialling a USSD short code: no app, no data plan, no smartphone. A gateway platform for Africa's Talking-style USSD callbacks: replies are paged into 160-character keypad screens, exec approvals become numbered menus whose choices appear only after the last page of the command, answers that outlive the session wait in an inbox or arrive by SMS, and a dropped call resumes on the page it left. Ships a keypad-phone simulator served to localhost only. Disclosure — runs an HTTP callback server on 127.0.0.1:8788 while the gateway runs (the user exposes it through their own tunnel); callbacks are authenticated by a 16+ character secret in the URL path because USSD gateways do not sign requests; only when AFRICASTALKING_USERNAME and AFRICASTALKING_API_KEY are set, message text and the recipient's number go to api.africastalking.com (or its sandbox) to send SMS; USSD and SMS are readable by the mobile operator and aggregator; inboxes are in memory only; no telemetry, no shell commands, no self-update."
