name: utcp-bridge
title: UTCP Bridge
repo: https://github.com/nftpoetrist/hermes-utcp-bridge
sha: 10ff1c999d94a841ac21503805529a1ea8ce890c
description: "Lets the agent use tools described by UTCP (Universal Tool Calling Protocol) manuals: utcp_search_tools finds tools across the manuals you configure under plugins.entries.utcp-bridge.settings.manuals, and utcp_call_tool calls one directly over its own HTTP API. Native UTCP support was declined for core and suggested as a standalone ctx.register_tool plugin (#151647, #151174). Disclosure — every search or call fetches each configured manual from its URL and sends the tool request to the endpoint that manual names; only manuals you configure are contacted. A manual's $NAME variables resolve only from the Hermes secrets it lists (read with agent.secret_scope.get_secret); the UTCP library's .env and os.environ fallbacks are turned off. Only the http call template is supported, so a manual cannot make the plugin run programs. Nothing is stored on disk."
maintainer: nftpoetrist
tier: community
category: tools
requires_hermes: ">=0.23.3"
version: "0.1.0"
docs_url: https://github.com/nftpoetrist/hermes-utcp-bridge#readme
readme: true
known_issues:
  - "Only http manuals and tools; streaming (sse, streamable_http) and MCP call templates are not offered yet."
  - "Manuals are re-fetched on every search or call (no cache), so each call costs one extra request per configured manual."
capabilities:
  provides_tools:
    - utcp_search_tools
    - utcp_call_tool
  provides_hooks: []
  provides_middleware: []
  requires_env: []
