maintainer: lEWFkRAD
tier: community
category: tools
version: "0.1.0"
docs_url: https://github.com/lEWFkRAD/va-claims-hermes-plugin#readme
platforms: []
known_issues:
  - Live claim status needs a VA Lighthouse sandbox or production client ID (free sandbox application at developer.va.gov); the guide, intent-to-file, benefit tracking, and deadlines work with no credentials.
  - Production VA API access requires VA agreements; sandbox uses VA test ICNs.
capabilities:
  provides_tools:
    - va_claim_status
    - va_claim_track
    - va_disability_lookup
    - va_intent_to_file
    - va_benefit_track
    - va_benefit_summary
    - va_claim_guide
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - VA_REFERENCE_API_KEY
requires_hermes: ">=0.22.6"
