title: VA Benefits
description: >-
  File and track VA disability claims (21-526EZ) the way 38 CFR actually works,
  plus every other VA benefit in one tracker: Post-9/11 GI Bill, VA health
  enrollment, CHAMPVA, SGLI/VGLI, pension, VR&E. Seven tools: a federal-standards
  filing guide with CFR citations, intent-to-file with the 12-month effective-date
  clock, live claim status and change tracking via the VA Lighthouse Benefits
  Claims API, official contention lookup, benefit/expiration tracking with
  deadline countdowns, and a one-screen benefits summary. Desktop app adds a VA
  Benefits page with a benefits grid, claim phase trackers, and deadlines.
  Network calls go only to api.va.gov and sandbox-api.va.gov; the veteran's ICN
  is the only personal value sent. Benefit records stay in one local JSON file
  per veteran under the plugin data directory. Credentials (VA client ID, RSA
  key path, reference API key) come through plugin settings and Hermes secret
  scope. One Python dependency: pyjwt[crypto]. No hooks, middleware, shell
  commands, background processes, or telemetry.
image: https://raw.githubusercontent.com/lEWFkRAD/va-claims-hermes-plugin/061af055d3b1dcf6aebe6b3e37533cfc214de37d/docs/screenshots/hero.png
