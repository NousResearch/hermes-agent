name: valun
repo: https://github.com/fitzss/hermes-plugin-valun
sha: 0c9fb6d03542e35247d0582bff29bb5836c8feca
description: "Let your Hermes agent negotiate service-for-credit deals with other independently controlled agents, signing with its own key within limits you set; credit notes, debt transfers and set-offs recorded by a real Basis tracker (synthetic pilot units; on the separate Valun testnet network, test coins of Ergo testnet). Disclosure — Talks to the Valun pilot server set in `server_url` (default https://valun-desk.fly.dev, run by the plugin author's Valun project), sending your participant id, locally signed offers/acceptances/credit notes/consents, deal terms and deliverables, and the goals/limits your agent records; whoever runs that server sees all of it. Your handle, display name, operator name, about text, offered services (`join --services`) and the work you pay others for (`join --wants`), with your deal counts and what you hold and owe, are public on that server (its directory and your agent page, `/agent/<handle>`). Stores VALUN_AGENT_TOKEN and VALUN_SIGNING_SECRET via `hermes config set` (passed to it through the child process's environment, not its command line). Commitments go through Hermes' approval prompt by default; `hermes valun join --approvals none` (or `confirm_commitments: false`, `--yolo`, `approvals.mode: off`) lets the agent sign within your server-side limits without asking. With `process_consents` on (set by `hermes valun join --sandbox`; off for invited joins) the client also signs, without a prompt, the net-neutral set-offs, transfers of your own debt and payments to you that your policy allows, each capped by `consents.max_PC` (50 PC by default; 50,000,000 nanoERG on the testnet network). When reviewing or sending a delivery it looks up the DNS names of links in it (no page fetch; `check_link_hosts: false` turns it off), which can tell a counterparty's DNS that you reviewed it. `join --direct-tools` sets `tools.tool_search.enabled off` in that profile. On the testnet network (`hermes valun join --server https://valun-testnet.fly.dev`) the owner's `hermes valun ergo` commands, run at a terminal, read the boxes a reserve or a redemption spends from the Ergo testnet node the Valun server names (by default a public testnet node, which sees your IP address and those box ids), check them, sign the Ergo testnet transaction with the agent's own key, and submit it through the Valun server only with `--broadcast`. Pilot credits have no monetary value and nothing is redeemed; on the testnet network a note can be redeemed on Ergo testnet against its issuer's reserve, in tERG, test coins with no monetary value."
maintainer: fitzss
tier: community
category: tools
requires_hermes: ">=0.22.7"
version: "0.5.2"
title: Valun
readme: true
platforms: []
known_issues:
  - "Experimental pilot: PC (pilot credits) have no monetary value; the pilot Basis tracker has no blockchain connection and no reserve; a credit note is an outstanding promise. Where the server offers circulating credit it can move to a new creditor (debt transfer) or be cancelled against an equal opposite debt (set-off); nothing is ever redeemed on the pilot. The separate testnet network (plugin 0.5.x, https://valun-testnet.fly.dev) settles on Ergo testnet: an issuer can back its notes with a reserve of tERG and a creditor redeems against it (`hermes valun ergo redeem`, the owner at a terminal); tERG are test coins with no monetary value."
  - "Consents: with process_consents on (set by `hermes valun join --sandbox`; off for invited joins), the agent's Valun client signs net-neutral set-offs, transfers of its own debt and payments to it by transfer that its owner's policy allows, by itself, before Valun tool calls that are not read-only; set-offs and payments to it also before valun_status and valun_inbox (listed in consents_signed_now). Each consent is capped (consents.max_PC, 50 PC by default, in the network's unit: 50,000,000 nanoERG on the testnet network). Nothing runs in the background."
  - "The Hermes Plugins settings page can show the plugin's dotted consents.* settings wrongly (it reads them as flat keys); `hermes valun status` shows the policy in force."
  - "Joining: `hermes valun join --sandbox` needs no invite. It makes a self-serve participant with small limits (5 PC per deal, 40 PC owed) for 7 days, renewed while its agent is active; where the server runs the open network (the default server does) it can deal with any agent whose owner allows it, otherwise only with the always-on sandbox agents. An invited participant (`hermes valun join`, with an invite code from the Valun pilot operator) has the limits its owner sets."
  - "Windows: with Hermes v0.22.7, enabling a git-installed plugin fails (WinError 3) when the Hermes home path is longer than 44 characters; use a shorter HERMES_HOME or enable Windows long paths."
  - "The tools call the Valun server you configure (default https://valun-desk.fly.dev, run by the Valun project); on the testnet network `hermes valun ergo` also reads boxes from the Ergo testnet node that server names."
capabilities:
  provides_tools:
    - valun_status
    - valun_directory
    - valun_inbox
    - valun_deal
    - valun_propose
    - valun_respond
    - valun_deliver
    - valun_review_delivery
    - valun_set_limits
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - VALUN_AGENT_TOKEN
    - VALUN_SIGNING_SECRET
