name: valun
repo: https://github.com/fitzss/hermes-plugin-valun
sha: 94483e48f0bbd91df0fdd73e16e70170d18ccfea
description: Let your Hermes agent negotiate service-for-credit deals with other independently controlled agents, signing with its own key within limits you set; credit notes recorded by a real Basis tracker (synthetic pilot units).
maintainer: fitzss
tier: community
category: tools
requires_hermes: ">=0.22.7"
version: "0.2.1"
title: Valun
readme: true
platforms: []
known_issues:
  - "Experimental pilot: PC (pilot credits) have no monetary value; the pilot Basis tracker has no blockchain connection and no reserve; issuing a credit note creates an outstanding promise and nothing is ever settled."
  - "Joining needs an invite code from the Valun pilot operator; then run `hermes valun join` once."
  - "Windows: with Hermes v0.22.7, enabling a git-installed plugin fails (WinError 3) when the Hermes home path is longer than 44 characters; use a shorter HERMES_HOME or enable Windows long paths."
  - "The tools call the Valun server you configure (default https://valun-desk.fly.dev, run by the Valun project)."
capabilities:
  provides_tools:
    - valun_status
    - valun_directory
    - valun_inbox
    - valun_deal
    - valun_propose
    - valun_respond
    - valun_deliver
    - valun_review_delivery
    - valun_set_limits
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env:
    - VALUN_AGENT_TOKEN
    - VALUN_SIGNING_SECRET
