description: "Local Markdown vault workspace for Hermes Desktop: visual editing, progressive reading, cached image previews, shared tabs, tag search, links, backlinks and a graph. Compatible with Obsidian vaults. File transport requires Unix/WSL utilities; ffmpeg thumbnails are optional. Automatic note-content sharing is disabled; direct Obsidian opening is temporarily hidden."
