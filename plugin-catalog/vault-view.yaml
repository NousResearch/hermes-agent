version: "0.5.1"
title: Vault View
description: "Local Markdown vault workspace for Hermes Desktop: visual editing, progressive reading, cached image previews, optional per-conversation workspaces, pinned tabs, explicit selection quoting, tag search, links, backlinks and a graph. Compatible with Obsidian vaults. File transport requires a Linux/macOS gateway; Windows Desktop requires a WSL-hosted Unix backend, not a native Windows gateway; ffmpeg thumbnails are optional. Remote images and agent guidance are independent opt-ins and disabled by default; automatic note-content sharing is disabled; direct Obsidian opening is temporarily hidden. Disclosure — reads and writes notes in the vault folder you choose through Desktop shell commands on the gateway host and records that folder in ~/.hermes/vault-view-root.json; remote Markdown images and agent navigation guidance stay off until you opt in; the optional vault_view_present_note agent tool is on by default for anyone who can use the agent on any platform and copies any requested Markdown note from that vault into the Hermes document cache (copies are not cleaned up) to deliver it as a file card."
