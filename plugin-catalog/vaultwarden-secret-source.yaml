name: vaultwarden-secret-source
repo: https://github.com/cdalvaro/hermes-vaultwarden-secret-source
sha: a3a4fda9f0708f0cd7d90ccaace3cb1eba351034
description: "Headless, read-only Vaultwarden secret source for unattended Hermes deployments: bootstraps itself with a dedicated account's API key and master password (literal values, ${VAR} references or file:// Docker secrets), renews its own bw session, and loads hidden custom fields from an ordered list of item UUIDs into environment variables at startup. Disclosure — runs the official Bitwarden CLI (bw, never auto-installed) against the configured https:// Vaultwarden server on every Hermes process start (one bw sync plus one read per item, up to 3 retries within timeout_seconds); keeps the bw session and a lock file in a mode-0700 directory under the system temp dir (session file mode 0600), never in HERMES_HOME, .env or logs; reads bootstrap credentials from the file:// paths you configure; registers the `vaultwarden` secret source, so it cannot be enabled together with the `vaultwarden` catalog entry."
maintainer: cdalvaro
tier: community
