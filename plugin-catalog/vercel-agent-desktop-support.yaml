description: "Vercel Agent Desktop Support: operate Windows apps through the accessibility tree instead of the screen. Reads a window's real UI as roles, names, states and refs, then clicks, fills a field, selects an option, toggles a checkbox, scrolls, sends a key combo, and manages windows and the clipboard. Actions are semantic and headless by default, so they do not take focus, move the cursor or synthesize keystrokes, and they fail closed rather than guess. desktop_install downloads the official vercel-labs/agent-desktop release for the running Windows target, verifies the archive against a sha256 pinned in the plugin, and proves the install by running version and status. Disclosure — the plugin runs the agent-desktop executable as a child process with arguments it builds, using the copy it installed or one already on PATH, in the npm global folder, AGENT_DESKTOP_BIN or the bin_path setting (those are not checksum-checked); starting or closing a program, installing the binary, and the first call that auto-installs a missing binary (auto_install, off by default) go through Hermes's approval prompt (Hermes Agent 0.18.1 or newer), while key presses, field values and clipboard writes into any window, a terminal included, run without a prompt; desktop_install is the only tool that uses the network, downloading the official vercel-labs/agent-desktop release from GitHub, and a release without a digest pinned in the plugin is refused; it reads window titles, labels, field values and the clipboard on request, which can contain private content. Windows only."
