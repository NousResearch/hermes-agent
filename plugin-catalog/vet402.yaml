name: vet402
repo: https://github.com/kzmttkc/vet402-hermes
sha: 72ed6e608cdd6cbc894b9d03c239883375967f95
version: "0.1.0"
subdir: vet402
description: >-
  Look a paid x402 or MPP URL up in vet402's public record of real purchases
  before the agent pays it. BLOCK stops the tool call, and a WARN backed by
  evidence against the seller asks for approval.
  Disclosure: sends the URL about to be paid, without credentials or query
  string, to vet402.com (up to two HTTPS GETs).
maintainer: kzmttkc
tier: community
category: tools
requires_hermes: ">=0.19.0"
docs_url: https://github.com/kzmttkc/vet402-hermes/blob/main/vet402/README.md
capabilities:
  provides_tools:
    - vet402_check
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
