name: vibe-relay
repo: https://github.com/trenthalden/vibe-relay
sha: "de30e7ff415edac42f78f21859b205e21038346c"
title: Vibe Relay
description: >-
  Vibecoding without burning your best model. Sets Hermes `delegation.backend` to a quota-aware
  strategy: when remaining usage is above a threshold (default 51%) the parent model keeps the
  work (`self`); otherwise each `delegate_task` is routed to a configured cheap executor
  (provider+model or profile). Every task must carry `allowed` path globs and a `gate` command —
  exit 0 alone is not done. A `post_tool_call` hook captures gate PASS output bound to a working-tree
  hash; `pre_verify` continues the turn until a fresh PASS exists; `vibe_accept` checks changed
  paths ⊆ allowed. Near the stop threshold (default 90% used) `/vibe park` writes a handoff and
  creates one one-shot cron at reset_at+buffer; blueprint `resume-after-reset` is also registered.
  Ships an Agent Workshop of 14 portable skills (build/debug loop, architecture audit, harness+evals,
  context budget, memory/retrieval, known-errors registry, frozen-tree review, product-aware releases,
  subagent-driven development, companion maintenance, lean executor orchestration, field-first
  acceptance, TDD, systematic debugging) registered as `vibe-relay:<name>` via `skill_view`.
  Vendors DEV Framework tools (`df_init`, `df_check`, `df_nav`); `df_check` returns the gate command
  for the agent to run via `terminal` (approvals apply). Disclosure — quota via public
  `fetch_account_usage(..., read_only=True)` at most once per 180s into
  `$HERMES_HOME/plugin-data/vibe-relay/`; `df_init`/`df_nav` run the plugin's vendored scripts with
  `python -I` and a scrubbed child env (PATH/HOME/LANG/LC_*/SYSTEMROOT/PYTHONDONTWRITEBYTECODE);
  `df_nav` never executes the target's navigate.py; `df_init` refuses Hermes home and protected
  $HOME dots; acceptance uses session terminal cwd when none is passed; template scripts may call
  `git`/`gh` only when the user or agent runs them; cron via `cronjob_manage`; no credential-file
  reads; no YOLO shells.
maintainer: trenthalden
tier: community
