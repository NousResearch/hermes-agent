name: vibe-relay
repo: https://github.com/trenthalden/vibe-relay
sha: a730e4de6f033e653738f212847f7c430bb3e0dd
title: Vibe Relay
description: >-
  Vibecoding without burning your best model. Sets Hermes `delegation.backend` to a quota-aware
  strategy: when remaining usage is above a threshold (default 51%) the parent model keeps the
  work (`self`); otherwise each `delegate_task` is routed to a configured cheap executor
  (provider+model or profile). When the executor lane is selected, a `pre_tool_call` hook blocks
  the parent from `patch`/`write_file` and obvious terminal writes (`sed -i`, `>`/`>>`, `tee`) so
  coding work must go through `delegate_task` (children never blocked; `enforce_executor_lane`
  default true). At `stop_used_percent` (default 90% used) the same hook blocks parent
  `delegate_task` and writers, auto-parks once per reset window (handoff + one one-shot cron),
  and injects `parked until …; do not start new work` via `pre_llm_call`. Every task must carry
  `allowed` path globs and a `gate` command — exit 0 alone is not done; `post_tool_call` captures
  gate PASS bound to a working-tree hash, `pre_verify` continues the turn until a fresh PASS
  exists, `vibe_accept` checks changed paths ⊆ allowed. Night shift for large projects left
  overnight (`vibe_night_start|log|status|arm|report`, `/night`): plan, queue, decisions and
  timeline in a self-ignored `<repo>/.vibe-relay/night-<stamp>/`; `pre_tool_call` refuses new
  dispatch after the hard stop or at the quota reserve (running work is not killed);
  `post_tool_call` keeps a parent liveness stamp so continuation wakes exit instead of becoming a
  second orchestrator; wakes (early checkpoint, quota reset, report) are armed once from the live
  session via `cronjob_manage` after a quota preflight on the provider cron will use (the plugin
  never sets a job's model); the morning report is assembled from records. Ships an Agent Workshop
  of 15 portable skills, including `night-shift` and `lean-executor-orchestration` 2.0, registered
  as `vibe-relay:<name>`. Vendors DEV Framework tools (`df_init`, `df_check`, `df_nav`);
  `df_check` returns the gate command for the agent to run via `terminal` (approvals apply).
  Disclosure — only documented Hermes surfaces (a test fails on any other core import); quota via
  `fetch_account_usage(..., read_only=True)` cached ≤180 s (15 s negative TTL) in
  `$HERMES_HOME/plugin-data/vibe-relay/`, which stores metadata only (no gate commands, gate
  output or task text; no raw usage payloads); night plan content stays in the working repo;
  handoff slugs confined under `docs/`; no cron scheduling from cron runs unless
  `cron.allow_agent_scheduling`; `df_init`/`df_nav` run the plugin's vendored scripts with
  `python -I` and a scrubbed child env and refuse Hermes home, `$HOME`, `/` and protected dot
  folders; no credential reads; no YOLO shells.
maintainer: trenthalden
tier: community
category: automation
requires_hermes: '>=0.22.5'
docs_url: https://github.com/trenthalden/vibe-relay#readme
version: 0.4.0
platforms: [linux, macos]
capabilities:
  provides_tools:
  - vibe_accept
  - vibe_night_start
  - vibe_night_log
  - vibe_night_status
  - vibe_night_arm
  - vibe_night_report
  - df_init
  - df_check
  - df_nav
  provides_hooks:
  - pre_llm_call
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - pre_verify
  - subagent_start
  - subagent_stop
  provides_middleware: []
  requires_env: []
