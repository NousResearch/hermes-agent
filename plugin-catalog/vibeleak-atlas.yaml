platforms: [windows]
known_issues:
  - "Website assessments need a VibeLeak owner API key, which is part of the Pro plan. Local folder review needs no key or account."
  - "Rescan comparisons stay non-comparable until VibeLeak returns coverage and version context, which some deployments do not return yet."
