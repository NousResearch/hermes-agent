name: video-xray
version: 0.3.3
tier: community
author: LuuMoss
repo: https://github.com/LuuMoss/video-xray
sha: ae67d00e76a80b00453d91a253aaa16dba4bb98f
requires_hermes: ">=0.22.1"
platforms: [windows]
title_i18n: {zh-CN: 视频分析工作台}
tagline_i18n:
  en: One-click local R2T2/Whisper runtime installers, video-to-text-to-H3
    analysis with presets, a resumable job queue, and a gallery.
  zh-CN: 一键安装本地 R2T2/Whisper 转录运行库，视频→文字→H3 深度分析，含预设、可续跑队列与画廊。
description_i18n:
  en: The default path is one `video_xray` tool call that runs the whole pipeline
    to the end. The panel adds a composer strip (attach a video and analyze in
    one click), presets, observation-granularity control, a real-time
    progress-card stream and a resumable job queue, an interactive keyframe
    gallery with crops and exports, cloud ASR support and a batch
    transcript-search workbench. Ships the R2T2 ASR engine worker, prompt and
    VAD sources in `r2t2-runtime/`. Since 0.3 the panel one-click installs
    engine runtimes from the plugin's own GitHub Releases (R2T2 CPU ~50 MB,
    CUDA add-on ~490 MB, Whisper ~110 MB), each verified against a pinned
    SHA-256 and unpacked under HERMES_HOME; model weights can be pointed at
    local folders or fetched through an in-panel download wizard, likewise
    SHA-256 verified. Cloud ASR stays off unless the user configures an
    endpoint. Nothing runs outside Hermes's own data.
  zh-CN: 主链路一次工具调用全程跑完。面板提供 composer 挂载条（上传视频
    一键分析）、预设包、观察粒度、实时进度卡片流与可续跑任务队列、交互式
    关键帧画廊（截图裁剪与导出）、云端 ASR 接入、批量转录检索工作台。内置
    R2T2 语音转录引擎 worker、提示词与 VAD 源码（`r2t2-runtime/`）。0.3 起
    面板可一键安装转录引擎运行库（R2T2 CPU 约 50MB、CUDA 加速包约 490MB、
    Whisper 约 110MB），从插件自身 GitHub Releases 下载、按钉死 SHA-256
    校验、解压进 HERMES_HOME；模型权重可挂本地目录或经面板内下载向导获取
    （同样 SHA-256 校验）。不配置云端端点则永不出网。
capabilities:
  provides_tools: [video_xray, video_xray_jobs]
  consumes_tools: []
  hooks: []
  middleware: []
  background: [job runner (per-plugin thread pool, one job at a time by default)]
  requires_env: []
requires_bins: []
python_dependencies: []
