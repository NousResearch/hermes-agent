#   `assets/` nao mudou desde entao) mas nao mostram o botao «Testar ligacao»
#   nem o campo de provider em texto livre. Fica declarado — recapturar exige
#   uma sessao com o painel a 3.47.13 em carga.
#
# NOTA DE CONSTRUCAO: o `sha` abaixo nao pode apontar para o commit que contem
#   esta versao do ficheiro (um ficheiro nao se cita a si mesmo). Aponta para o
#   `main` que ja' traz a 3.47.13; o commit que acrescenta esta versao da entrada
#   difere desse pin apenas neste ficheiro.
# ---------------------------------------------------------------------------

name: vipernet-model-manager
repo: https://github.com/ptv1p3r/vipernet-model-manager.git

# Commit EXATO do catalogo, 40 hex — resolvido por `git ls-remote` no GitHub,
# nunca completado de memoria. `main` do GitHub relido a 2026-11-08: 19c75a72.
sha: "19c75a72cccc056714f2a6f1e8ef1a3bacdde7d2"

description: >-
  Picks the provider and model for each turn from the profile's own catalog,
  based on the kind of work detected in the message: declared task associations
  first, then an automatic complexity analysis. Keeps the choice stable for the
  whole session, records every decision in an append-only ledger and degrades to
  the next route instead of failing when a route has no credential.

maintainer: proldan
tier: community
category: models
requires_hermes: ">=0.22.0"
version: "3.47.13"
title: Vipernet Model Manager
readme: true

# Galeria de /docs/plugins/vipernet-model-manager. URLs no sha do pin: um bump
# de pin obriga a re-pinar as imagens (regra 4).
screenshots:
  - https://raw.githubusercontent.com/ptv1p3r/vipernet-model-manager/19c75a72cccc056714f2a6f1e8ef1a3bacdde7d2/assets/01-visao-geral.png
  - https://raw.githubusercontent.com/ptv1p3r/vipernet-model-manager/19c75a72cccc056714f2a6f1e8ef1a3bacdde7d2/assets/02-configuracao.png
  - https://raw.githubusercontent.com/ptv1p3r/vipernet-model-manager/19c75a72cccc056714f2a6f1e8ef1a3bacdde7d2/assets/03-registo.png

# Capacidades = o que o plugin regista de facto em `__init__.py`. O validador
# confirma-as no pin (`declared hooks/middleware — matches registrations`).
capabilities:
  provides_tools: []
  provides_hooks:
    - post_api_request
    - api_request_error
    - post_tool_call
  provides_middleware:
    - llm_request
  requires_env: []
