# Entrada de catalogo do Vipernet Model Manager.
#
# Esta copia vive no repositorio do plugin para que o que se publica seja
# versionado com o codigo. O ficheiro que se submete no PR e' este, tal como
# esta' no commit de topo do `main`.
#
# DECISAO DO DONO (2026-11-07): o catalogo publico e' servido pelo repositorio
# PUBLICO no GitHub (regra 2: URL https que qualquer pessoa clone). O Gitea
# interno continua a ser onde o trabalho acontece; o `main` de la' e' empurrado
# por push mirror para o `main` do GitHub, preservando o sha.
#
# Esquema lido de `hermes_cli/plugin_catalog.py` (dataclass PluginCatalogEntry,
# 19 campos): o loader recusa `repo` sem https://, `sha` que nao seja 40 hex,
# `tier` fora de official/verified/community e `category` fora de
# desktop/memory/platform/web/tools/voice/automation/models/general. Verificado
# com o parser do proprio core (`hermes_yaml`) — 19 campos, zero chaves
# descartadas em silencio.
#
# ---------------------------------------------------------------------------
# ESTADO MEDIDO 2026-11-08 12:15 WET
# ---------------------------------------------------------------------------
# Pin: `main` do repositorio do plugin depois do merge do PR #25, que leva a
#   3.47.13. Desde o pin anterior (d28494b4 / 3.47.11):
#   - 3.47.12 — botao «Testar ligacao» no formulario de um modelo: sonda real ao
#     provider com o par escrito (pedido minimo, max_tokens 8), devolve latencia
#     e estado HTTP, e nunca devolve a chave (mascarada por `***`). Nao grava
#     nada e nao exige que a rota exista.
#   - 3.47.13 — a sonda passa a resolver providers custom declarados em
#     `providers.custom` do perfil (`base_url` + `api_mode` + chave por
#     `key_env` via `agent.secret_scope.get_secret`), nao so os do pool. Antes,
#     um provider custom falhava com «sem credencial neste processo».
#   Medido com chamadas reais, nao simuladas: `inception/mercury-3` responde
#   200 em ~485 ms pela via `providers.inception/key_env`; `deepseek/
#   deepseek-flash` continua 200; modelo inexistente devolve 400 com a lista
#   que o provider aceita; provider desconhecido falha limpo.
#   Regra 2 e regra 9 como abaixo; `hermes plugins validate` no pin responde
#   `Validation passed` (16 verificacoes, `no core override`, security scan
#   `safe`).
#
# Regra 2 (repo clonavel por https, anonimamente): OK no GitHub.
#   Provado por clone anonimo, nao pelo auto-relato do espelho:
#     env -i HOME=<vazio> GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone
#       https://github.com/ptv1p3r/vipernet-model-manager  -> rc 0
#   e o `main` do GitHub estava neste sha. Entrypoints no pin: `plugin.yaml`,
#   `__init__.py`, `dashboard/manifest.json`, `README.md`.
#
# Regra 9 (so superficies publicas): OK, sem excecao. `seams.py` usa
#   `agent.credential_pool.load_pool`, `agent.secret_scope.get_secret` e
#   `hermes_cli.config.get_compatible_custom_providers` — todas na lista de
#   superficies publicas do validador. `hermes plugins validate` responde
#   `no core override` e nao assinala nenhum import nem chamada privada.
#
# Regra 10 (credenciais pela via do Hermes, nunca de ficheiros): a sonda de
#   ligacao obtem a chave por `seams.resolver_provider` -> `secret_scope`
#   (honra o perfil activo) e so cai para `os.environ` no caso de perfil unico
#   (`UnscopedSecretError`), como o proprio core faz. Nao le `.env`, `auth.json`
#   nem o login de outra ferramenta.
#
# Pagina de documentacao: e' construida a partir do `README.md` DESTE commit
#   (`readme: true`), e a seccao «Public catalogue readiness» ja' diz o estado
#   medido — nao ha ressalva pendente.
#
# `screenshots:` — tres capturas do painel, tiradas de uma instalacao viva e
#   guardadas em `assets/`, servidas por `raw.githubusercontent.com` no sha do
