name: visual-oracle
repo: https://github.com/valenciayuna/hermes-plugin-visual-oracle
sha: eb0c29f93dfad347d4f6af74c500768f60c7a391
description: "Makes a UI claim measurable before an agent reports success: captures a page as a baseline, then pixel-diffs later renders and answers PASS, FAIL or REVIEW with independent change regions (bbox, pixel count, area, density), a diff image, an overlay and per-region crops. Waits for document.fonts.ready, an optional selector and two identical frames so a capture is settled, records the Chrome version and viewport that produced it, and refuses to guess when rendering never stabilises. An optional visual change contract declares expected changes and protected regions so a declared change can pass while an undeclared one fails; selectors name locations, not meaning. Masks accept rectangles or CSS selectors and are applied before capture, a selector matching nothing is an error, and masks may not cover more than half the viewport. Disclosure - renders the URL you give it in a local Chrome over the DevTools protocol (no Selenium, Playwright or pip install), so the page's own network requests happen in that browser; reads the PNGs it produced and writes baselines, diffs, overlays, crops and report.json under HERMES_HOME/plugin-data/; runs no shell command of its own and no background service; the baseline is never updated automatically; no telemetry."
maintainer: valenciayuna
tier: community
category: tools
requires_hermes: ">=0.21.0"
docs_url: https://github.com/valenciayuna/hermes-plugin-visual-oracle#readme
readme: true
platforms: []
capabilities:
  provides_tools:
  - visual_base
  - visual_check
  - visual_list
  provides_hooks:
  - pre_verify
  provides_middleware: []
  requires_env: []
