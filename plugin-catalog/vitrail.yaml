known_issues:
  - "The live card needs Hermes Desktop 0.22.5 or later with the plugin's Desktop switch on in Capabilities → Plugins (it is off by default); other surfaces get the standalone HTML player."
  - "On a Desktop without tool media renderers the card is drawn from a ::vitrail directive; a messaging platform that shares the chat while that Desktop is open shows the directive as a line of text."
  - "GPU verification needs a Desktop window connected to the Hermes that runs the agent; without one the shader is saved unverified and compiles when it is shown."
  - "Shaders are single-pass and procedural: no textures, buffers or audio inputs."
capabilities:
  provides_tools:
    - vitrail_render
    - vitrail_library
  provides_hooks:
    - post_tool_call
    - transform_llm_output
  provides_middleware: []
  requires_env: []
