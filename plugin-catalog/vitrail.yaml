sha: "b8b4dc851a14fe2b566648beb30d7a484b6cf6f7"
description: "Live GLSL shaders in the chat. Ask for a visual and the model writes a Shadertoy-style fragment shader that animates inside the reply in Hermes Desktop, with the sliders, colour pickers and switches it declared as annotated uniforms. Before vitrail_render returns, the Desktop half compiles the shader with WebGL 2 on the user's GPU and reports the verdict, so a compile error goes back to the model with the driver log and the model fixes it in the same turn; a still frame comes back too, for models with a vision tool. The card is drawn through a tool media renderer where Desktop has one and through a ::vitrail transcript directive where it does not (Desktop 0.22.5). Other surfaces (Telegram, CLI, TUI) get a standalone HTML player of the same shader. Adds a gallery page with hover-to-play tiles, GLSL copy and 1920x1080 PNG export, the vitrail_render and vitrail_library tools, the vitrail:shader-studio skill, and post_tool_call / transform_llm_output hooks that append the shader's delivery line (MEDIA file or directive) when a reply lacks it. Disclosure — no network calls, no shell commands, no credentials, no telemetry; GLSL written by the model runs on the user's GPU through WebGL 2 in the Desktop window; files are written only under plugin-data/vitrail (per shader: source, standalone HTML player, GPU report, a 640x360 JPEG still, exported PNGs); the still's path is given to the model, which may open it with its vision tool; while a Desktop window is open its half calls the plugin's own local route once a minute so the tool knows a GPU is listening and which transcript surface it has, and vitrail_render then waits up to 6 s for the verdict."
