name: voicestudio-tts
repo: https://github.com/EternalShade3D/voicestudio-hermes-plugin
sha: "8d97e1ff69fb20f20812cfddec4e2c4e0d216fa4"
description: >-
  VoiceStudio TTS provider for Hermes: registers a TTS provider so replies can be read aloud, or
  auto-spoken, in the user's own voices from the local VoiceStudio app, per profile. Reads saved
  voices from GET /profiles and synthesizes through POST /generate; /voicestudio refresh writes
  those names into the manifest's choices list, which turns the voice setting into a dropdown.
  Disclosure — sends the reply text, the voice id (profile_id) and the engine name when one is
  configured to the local server (default http://127.0.0.1:3900, plain HTTP), and reads the voice
  list from that same server; no credentials, no telemetry, no other network calls, and no
  self-update of code. Rewrites only the choices list inside its own plugin.yaml, and only on the
  user's explicit command.
maintainer: EternalShade3D
tier: community
category: voice
requires_hermes: ">=0.21"
