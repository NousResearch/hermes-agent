name: volcengine-voice
repo: https://github.com/linxichen/hermes-volcengine-voice
sha: cd242cc2e9dea8e139a5500914cc1619dc249497
description: >-
  Volcengine (火山引擎) Doubao TTS and STT providers for Hermes, registered with
  register_tts_provider / register_transcription_provider (tts.provider and
  stt.provider: volcengine). Chinese voice presets, [情绪] emotion markers,
  streaming ASR. Optional opt-in LLM transcript cleanup through Volcengine Ark.
  Disclosure — TTS text and STT audio go to Volcengine speech
  (openspeech.bytedance.com); with stt.volcengine.enable_llm_postprocess: true,
  each transcript also goes to Volcengine Ark (ark.cn-beijing.volces.com); off
  by default.
maintainer: linxichen
tier: community
category: voice
requires_hermes: ">=0.21.6"
docs_url: https://github.com/linxichen/hermes-volcengine-voice#readme
version: "2.0.0"
capabilities:
  provides_tools: []
  provides_hooks:
  - pre_llm_call
  provides_middleware: []
  requires_env:
  - VOLCENGINE_VOICE_API_KEY
