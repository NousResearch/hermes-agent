name: vornik-companion
repo: https://github.com/EaseIT-cz/vornik
sha: 61f6ac73a70f7fc603d370f0f1bc9be61595e5cb
subdir: contrib/hermes-companion
description: "Vornik as Hermes's hardened broker and long-term memory: Hermes holds no credentials; privileged work runs in operator-approved workflows on your own Vornik daemon. Disclosure — talks only to the self-hosted Vornik daemon at VORNIK_URL with VORNIK_BROKER_TOKEN (and VORNIK_MEMORY_TOKEN for memory); broker tools let the agent start operator-approved workflows on that daemon (writes are approved by a person in Vornik); when selected as memory provider it sends each turn's user query for recall, mirrors MEMORY.md and USER.md writes to the daemon, and asks the daemon to stop recalling (not delete) a mirrored entry that Hermes removes or replaces (/vornik-memory lists and /vornik-forget forgets what Vornik keeps); artifact tools expose only named outputs allowed by the approved workflow from completed runs and read bounded text or return short-lived binary download links from the daemon; task diagnosis tools (offered only when the daemon advertises companion-progress) return a broker task's execution events and closed error classes as the daemon serves them to a broker key; hermes vornik approvals on writes security.approval.transport (and vornik_companion.approval_namespace) to Hermes config, after which Hermes's own dangerous-command prompts (the redacted command text) are sent through the local vornikctl agent host-approval to the daemon and answered on the paired phone, any failure or a Vornik outage denying the command unless transport_fallback: builtin is set, and the plugin never decides itself; hermes vornik connect runs the local vornikctl, which adds an MCP entry to Hermes config; the daemon's engineering guidance is added as a system prompt section (vornik.rules); with VORNIK_MEMORY_TOKEN, short hints are appended to the result of the tool call that caused them (after a commit, a design-document write, a failed test run), behind a marker naming Vornik, which hints fired and whether they were followed is reported to the daemon, and the vornik_companion_delegate tool reads the local files the model names (at most 20 files and 2 MB; symlinks, hard links, credential files such as .env, and anything under the Hermes home refused) and sends them to the daemon for a review or a memory ingest."
maintainer: EaseIT Labs
tier: community
category: tools
requires_hermes: ">=0.21.5"
docs_url: https://docs.vornik.io/features/companion/
version: "0.23.4"
capabilities:
  provides_tools:
    - vornik_catalog
    - vornik_delegate
    - vornik_result
    - vornik_status
    - vornik_cancel
    - vornik_list_artifacts
    - vornik_read_artifact
    - vornik_task_logs
    - vornik_task_explain
    - vornik_recall
    - vornik_remember
    - vornik_companion_delegate
  provides_hooks:
    - pre_llm_call
    - transform_tool_result
    - pre_verify
  provides_middleware: []
  requires_env:
    - VORNIK_URL
    - VORNIK_BROKER_TOKEN
    - VORNIK_MEMORY_TOKEN
