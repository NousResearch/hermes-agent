name: waiting-on-you-desktop
repo: https://github.com/clientamp/waiting-on-you-desktop
sha: b685d1a898837cfbb2da8c7ac7b671f437bea51b
description: "Desktop panel listing every question your agents are waiting on you to answer, across all chats and profiles, sorted by urgent/important and answerable in place (Yes, No, Reply, Later) with five seconds to undo. Disclosure: sends chat endings to your configured Hermes model (and an optional decision provider you choose) to find asks; reads every local profile's state.db and projects.db read-only; runs a background scan in the gateway; optional satellite push between your own machines, optional SSH reads, optional chat archiving and optional local action-handler commands, all off by default; keys only via Hermes secrets; no telemetry"
maintainer: clientamp
tier: community
category: desktop
requires_hermes: ">=0.21.5"
docs_url: https://github.com/clientamp/waiting-on-you-desktop#readme
version: "1.0.0"
title: "Waiting On You"
platforms: [macos, linux]
