sha: 19526a69ca2fec816c0e663f71d5e83eea008245
description: "Desktop panel listing every question your agents are waiting on you to answer, across all chats and profiles, sorted by urgency and importance. Yes, No and Reply can be answered in place, with five seconds to undo, but only for a chat whose composer is visible in this Desktop window; other chats get Open instead. Later snoozes an ask from any chat. Disclosure: sends chat excerpts, task context, your priority note and recent priority corrections (as examples) to your configured Hermes model, and to an optional decision provider you choose; see the README for full details. Reads every local profile's state.db and projects.db read-only, plus Hermes config.yaml; saves its plugin settings through Hermes; runs a background scan in the gateway. Optional SSH reads, chat archiving and local action-handler commands are all off by default. Handlers run with a minimal environment plus only the variable names you list, and can do whatever their command does. No telemetry."
