description: "One list of the questions your Hermes bots are waiting on you to answer. /waiting and hermes waiting scan the session store of every profile, keep only replies that end by asking you something (English and Indonesian), merge the same question asked by several bots, and drop an item once you reply in that chat or dismiss it. Disclosure — opens state.db of every Hermes profile on the machine (sessions, messages) with SQLite mode=ro and PRAGMA query_only, and shows the text of matching bot replies; writes only plugin-data/waiting-on-you/dismissed.json in the active profile. No network calls, no model calls, no shell commands, no credentials, no background processes, no tools or hooks."
