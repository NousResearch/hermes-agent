name: warden
repo: https://gitlab.com/Zaygalx1/warden
sha: ac4c23d5ef152ff24f24bc8163703faea78d1ebf
subdir: src/hermes_warden
description: >-
  Defensive cybersecurity operations plugin for Hermes Agent. A deny-by-default
  scope engine decides what may be touched before anything runs. Vulnerability
  assessment runs two engines (Grype and Trivy) over one canonical SBOM from Syft
  and records their disagreement as finding confidence instead of hiding it.
  Sigma rules evaluate over the event store, osquery host telemetry feeds the
  same store, and a deterministic correlation engine groups actors into
  campaigns with two honesty levels: an inclusive discovery view for triage and
  an anchored membership view (measured precision 1.000, recall 1.000 on the
  validation corpus) that is the only view allowed to justify defensive action.
  Investigations answer only with citations to stored evidence; uncitable
  claims are dropped and counted. Containment is a policy-enforced plan engine
  (approval classes, blast radius, TTL, rollback, simulation) whose execution
  is disabled in this build; apply mode is refused. The agent's own actions
  are written to a redacted ledger and a hash-chained audit log. Dry run by
  default. Disclosure: the plugin runs operator-installed scanner binaries
  (nuclei, trivy, grype, syft, osquery; SHA-256 pinned in adapter manifests,
  fetched by the operator from the tools' official sources, never bundled)
  as local subprocesses against targets the operator has authorised in a
  scope; it makes network connections only to those authorised targets and,
  only when configured, to threat intelligence providers. It reads host
  telemetry via osquery on authorised machines. It stores no credentials and
  requires no environment variables. Containment plans describe actions that
  could change firewall and identity provider state and always require
  approval proportional to blast radius; no containment action executes in
  this build.
maintainer: Zaygalx
tier: community
category: tools
version: "0.1.0"
platforms: [linux, macos]
requires_hermes: ">=0.22.5"
capabilities:
  provides_tools: [sec_scope, sec_tool, sec_assess, sec_investigate, sec_campaign, sec_contain]
  provides_hooks: [post_tool_call]
  provides_middleware: []
  requires_env: []
