description: "Verified AI bots for Hermes, by Wave OS. Browse the official Wave bots from the bots.theta store (Checker, Tally, Planner, Maker and more); each one is checked on the Theta blockchain on your computer (name record, listing, rules, mascot and every knowledge card, fingerprint by fingerprint) before it's marked Verified. Add one and it becomes its own Hermes bot (a wave-<name> profile in your Bots list, with its mascot), answering from its checked cards on your own AI model with code, terminal, file and web tools turned off, re-checked daily. Optional Connect to Wave OS lets you ask the real bot on Wave, with Hermes approval for every question. Disclosure: never signs or sends transactions, and needs no account for browsing, checking or adding bots. Network calls go only to Theta's public RPC eth-rpc-api.thetatoken.org (read-only name and card reads) and, only after you click Connect, app.oswave.io (a one-time sealed connect drop and your questions to the bot). Connect stores a limited, revocable Wave OS bot key (spending limit you pick, default 0 TFUEL) in the OS keyring if available, else a 0600 file in $HERMES_HOME/wavebots. Creates and removes only its own wave-* Hermes profiles; reads Hermes's profile and plugin lists locally. A background thread re-checks added bots once a day. Opens app.oswave.io in the browser for Connect. No telemetry, no shell commands, no self-updating."
