description: "Verified AI bots for Hermes, by Wave OS. Browse the official Wave bots from the bots.theta store (Checker, Tally, Planner, Maker and more); each one is checked on the Theta blockchain on your computer (name record, listing, rules, mascot and every knowledge card, fingerprint by fingerprint) before it's marked Verified. Add one and it becomes its own Hermes bot (a wave-<name> profile in your Bots list, with its mascot), answering from its checked cards on your own AI model with code, terminal, file and web tools turned off, re-checked daily. An optional Wave OS bot key lets you ask the real bot on Wave, with Hermes approval for every question. Disclosure: never signs or sends transactions, and needs no account for browsing, checking or adding bots. Network calls go only to Theta's public RPC eth-rpc-api.thetatoken.org (read-only name and card reads) and, only if you set a Wave OS bot key and ask the real bot, app.oswave.io (your question to the bot). The optional Wave OS bot key (limited and revocable, spending limit you pick, default 0 TFUEL) is a Hermes secret: declared as config_schema secret WAVE_OS_TOKEN, entered in Hermes's plugin settings, read with get_secret; the plugin never stores it (Disconnect keeps only the key's SHA-256 fingerprint in $HERMES_HOME/wavebots so it stays off here). Creates and removes only its own wave-* Hermes profiles; reads Hermes's profile and plugin lists locally. A background thread re-checks added bots once a day. Opens app.oswave.io in the browser to get a key. No telemetry, no shell commands, no self-updating."
