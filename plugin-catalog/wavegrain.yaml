description: >-
  Curated TikTok slideshows and Instagram carousels for your brand on autopilot, through
  the hosted Wavegrain Streamable HTTP MCP server plus one workflow skill. Portable Agent
  Plugins v1 package (mcp.json + skills/), no plugin code. Requires a paid Wavegrain account
  and browser OAuth consent (add the server with auth: oauth, then hermes mcp login
  wavegrain); no API key or client secret is stored in the plugin. Disclosure: hosted-only
  connector; your brand details, photos and slide texts go to wavegrain.com; paid tools
  spend Wavegrain credits within the limit set per connection; posting needs the separate
  post permission and Wavegrain's own approval setting.
