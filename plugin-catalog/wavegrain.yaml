description: "Curated TikTok slideshows and Instagram carousels for your brand on autopilot, through the hosted Wavegrain Streamable HTTP MCP server plus one workflow skill. Portable Agent Plugins v1 package (mcp.json + skills/), no plugin code. Requires a Wavegrain account and browser OAuth consent (add the server with auth: oauth, then hermes mcp login wavegrain); no API key or client secret is stored in the plugin. Disclosure — hosted-only connector: your brand details, photos and slide texts go to wavegrain.com; generating tools spend Wavegrain credits within the limit set per connection, and posting publishes to your connected TikTok/Instagram accounts (needs Wavegrain's separate post permission and its own approval setting); the server is marked untrusted, so Hermes asks before each of its tool calls."
