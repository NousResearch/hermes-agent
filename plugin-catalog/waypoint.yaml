sha: 971bab6762466bfdf6036aeaeb35352d6308f61d
description: "Session status for Hermes Desktop: a thin bar next to every sidebar session with four states — Working (remembers your next step), Waiting on someone (who/what plus a follow-up reminder), Done (outcome plus a fresh-start handoff) and untracked. Suggests 3 next steps per session (instant quick ideas from the chat, opt-in AI ideas from the auxiliary model, priority colours) with one-click Ask, a Power up button that asks a strong model for sharper ideas on demand, and Mark complete to stop suggestions. Adds a Status Board page (columns, follow-ups due, stale sessions, archive all done), triage of untracked sessions, a resume banner above the composer, a status-bar counter, a daily summary, palette commands and English/Arabic (RTL). SDK-only: session-row slots, a route, sidebar nav, status bar, composer banner, palette. Disclosure — no network calls of its own (all model calls go through Hermes llm.oneshot); AI next-step suggestions are OFF by default; when enabled, after new replies (at most every 90 s) the plugin sends the focused session's last ~12 user/assistant messages (≤ ~7,000 chars) plus its title and the user's notes to the auxiliary task title_generation (Hermes default \"auto\" = your main model); Power up runs only when pressed — also with AI suggestions off — and sends a longer excerpt (last ~20 messages, ≤ ~12,000 chars) to the plugin's own auxiliary tasks waypoint_ideas / waypoint_ideas_2 (registered by __init__.py; unset they resolve to \"auto\" = your main model) or, for \"My chat model\", to the open session's model; an optional automatic big idea (off by default) uses the same choice at most every 10 minutes; Power up call log (2.5.0): the Python half also registers two observe-only hooks (pre_auxiliary_call, post_auxiliary_call) that ignore every auxiliary task except waypoint_ideas / waypoint_ideas_2 and, for those, write one line per call to the user's own Hermes log (logs/agent.log) and append a record to <HERMES_HOME>/plugin-data/waypoint/power-calls.jsonl (rolls over at ~1 MB): model, provider, reasoning effort, response time, token counts (logged as 'unknown' with a reason when Hermes reports none), finish reason and status — never prompt, message or reply text, nothing leaves the machine, and the hooks never modify a call; reads session history (session.history) and titles (session.list); statuses, notes and cached suggestion text are kept in desktop plugin storage; archives sessions only when you press Archive (undo offered) or confirm \"Archive N done\" on the board (no undo; sessions stay under Archived); posts in-app and native OS notifications for due reminders and a once-a-day local summary; writes composer drafts only on Ask / Insert / Start fresh session and never sends them."
