description: "Session status for Hermes Desktop: a thin bar next to every sidebar session with four states — Working (remembers your next step), Waiting on someone (who/what plus a follow-up reminder), Done (outcome plus a fresh-start handoff) and untracked. Adds a Status Board page (columns, follow-ups due, stale sessions, archive all done), triage of untracked sessions, a resume banner above the composer, a status-bar counter, a daily summary, palette commands and English/Arabic (RTL). SDK-only: session-row slots, a route, sidebar nav, status bar, composer banner, palette. Disclosure — no network calls and nothing is sent to the model; statuses and notes are stored in the desktop plugin storage keyed by the durable session id; reads session titles via session.list; archives a session via session.archive only when you press Archive (undo offered); posts in-app and native OS notifications for due reminders; writes a composer draft only when you press Insert or Start fresh session."
