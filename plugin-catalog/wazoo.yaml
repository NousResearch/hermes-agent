description: Wazoo world-model memory provider — typed memories (decision, preference, person, project,
  finding, correction) in an RDF graph with retraction provenance, background recall prefetch, hybrid
  search, and SPARQL for structural questions. Works against the hosted Wazoo cloud (provisions a world
  automatically from a platform token) or a self-hosted worlds endpoint with a locally minted key.
