description: >-
  The whole Hermes gateway on a Wear OS watch: the watch enrolls its own tailnet node, pairs with
  a gateway-minted 6-digit code, and talks to a private tailnet lane from then on — every agent,
  streaming answers, mid-session tool-call approvals, cron-run notifications, and replies spoken
  out loud in a voice cloned from ~3 seconds of reference audio, synthesized on your gateway's
  CPU. A desktop pane runs the checklist (APK, pair, enable) with per-agent voice dropdowns and
  readiness lights. Parakeet STT and the TTS engine arrive as checksum-pinned source builds at
  first use — nothing pre-bundled, no telemetry, no calls home after setup. Disclosure — pairing
  mints single-use Tailscale enrollment keys and the setup wizard can create/update a Funnel
  route on your tailnet (preview, then consent); un-pairing rotates the paired agent's
  API_SERVER_KEY (hot for named profiles; for the default profile the plugin asks you to restart
  the gateway, disclosed in the pane and the README).
