title: Web Crawler Spider
description: 'A small spider that crawls the Hermes Desktop window: it walks between real buttons and links, outlines the element under it, and reacts to the agent (a web that grows with tool calls, helper spiders for subagents, spider-sense for risky commands, walking to the approval button, flies, napping). Desktop-only (desktop/plugin.js inside the plugin SDK surface); no agent tools, hooks, middleware or env vars.'
