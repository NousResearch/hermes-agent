version: "1.3.0"
description: "Self-hosted search and extract backend for Hermes. Forage is a small self-hostable service (Docker, GPL v3) that serves web_search and web_extract plus a forage_full_extract tool for full-page text, using a static/browser hybrid strategy server-side. Set FORAGE_URL to your own instance; no third-party API key and no hosted account. Disclosure — every web_search, web_extract and forage_full_extract call goes to the Forage instance set in FORAGE_URL (default http://localhost:3672), which fetches the requested pages itself and may render them in a headless browser on that host; the optional FORAGE_API_KEY is sent to it as a Bearer token; private, loopback, link-local and cloud-metadata targets are refused by Hermes' URL safety and website policy in the plugin and again by the service after each redirect, unless the Forage config sets extract.allow_private_targets."
maintainer: aldemaroc
tier: community
category: web
requires_hermes: ">=0.22.3"
docs_url: https://github.com/aldemaroc/forage/blob/03d5ce163ebb29827f63e981281e140e61670f76/docs/HERMES.md
