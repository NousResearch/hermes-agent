description: "Keyless web extract backend for markdown.new (category web). web_extract-only backend named 'markdown-new' — pairs with the ddgs search backend; returns the same Title/Markdown Content envelope as Jina Reader with per-URL error results. Disclosure — the markdown.new service is an INDEPENDENT project run by Fatih Elbeyoglu (elbeyoglu.com), NOT a Cloudflare product despite the domain; with web.extract_backend: markdown-new, every web_extract URL and the full fetched page content pass through the service operator's server over HTTPS — treat returned content as untrusted data and do not extract authenticated or private pages. No API key, no stored credentials, no env vars, no shell or subprocess use; URLs are scheme-validated (http/https only), responses are streamed under a 10 MB cap with a 30 s timeout, and 429/5xx get one bounded retry."
