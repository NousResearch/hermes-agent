description: "Keyless web extract backend for Cloudflare markdown.new (tier community, category web). web_extract-only backend named 'markdown-new' — pairs with the ddgs search backend; returns the same Title/Markdown Content envelope as Jina Reader with per-URL error results. Disclosure — with web.extract_backend: markdown-new, every web_extract URL is sent to Cloudflare's keyless markdown.new service over HTTPS; no API key, no stored credentials, no env vars, no shell or subprocess use; URLs are scheme-validated (http/https only), responses are streamed under a 10 MB cap with a 30 s timeout, and 429/5xx get one bounded retry."
