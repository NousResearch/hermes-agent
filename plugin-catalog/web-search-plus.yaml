description: "Multi-provider web search, URL extraction, quality reports, and opt-in research mode. Disclosure — reads the operator's HERMES_HOME/config.yaml (read-only) for its own Desktop settings block (country, language, max_results, auto_routing, provider_order, searxng_url, donsetch_bin) and, in its status command, the web backend and keyless_rescue settings, and checks (without opening it) whether a pre-5.1 .env file exists in its plugin folder or HERMES_HOME/plugins, to tell upgraders where their keys went; may spawn an operator-configured local donsetch CLI as a subprocess (argv, no shell)."
maintainer: robbyczgw-cla
