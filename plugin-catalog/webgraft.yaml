name: webgraft
title: WebGraft
repo: https://github.com/ElSerda/webgraft
sha: "6445a35a387984568aa59946ae90063dc5886b60"
description: "Local web_extract backend (trafilatura for pages, Hermes's own anydoc converter for PDF and Office documents, optional Crawl4AI browser view) that reports 404s and bot walls as errors; lists the pages an answer really used, from tool results, as clickable links; nudges the model to open pages rather than answer from snippets; reads a page's Markdown version when the site's llms.txt lists one, and returns pages that opt out of AI use (noai, TDM reservation) as errors; keeps long pages useful to small models (one URL per web_extract call: a multi-URL call reads the first URL and its result lists the others; on a page longer than Hermes's per-page window, the passages about the question come first, nothing removed). Bundles a research skill, a setup wizard and an uninstall command. Disclosure — downloads the URLs web_extract is asked to read, from this machine, and each site's /llms.txt once per hour (on by default, setting llms_txt), through Hermes's SSRF-safe client (private, loopback, link-local and metadata addresses refused on every redirect hop; results report the final URL so Hermes re-checks it; a browser view that ends on a non-public address is dropped); `setup` optionally creates an isolated `hermes pm` environment with Crawl4AI, which drives Hermes's own Chromium (`hermes pm install chromium` if missing; the plugin downloads no browser); each Crawl4AI read is a child process (at most 3 at once, 60 s cap) that starts that Chromium headless with a DevTools port on 127.0.0.1 and a temporary profile, then stops it; each document is converted by anydoc in a child process (60 s cap); `setup` installs Hermes's `doc-extract` extra if missing; `setup` optionally creates an OCR environment (RapidOCR, onnxruntime, pypdfium2) whose first run downloads about 32 MB of OCR models from RapidOCR's official modelscope.cn repository, checked by SHA-256, and each scanned PDF is then read in a child process (180 s cap); appends one sentence to each user message (setting `remind`); `setup` writes web.search_backend, web.extract_backend, skills.auto_load and SEARXNG_URL, recording replaced values under plugin-data/webgraft; child processes get a minimal environment, never Hermes's API keys; reads other installed plugins' plugin.yaml to step aside when another one rewrites replies; page text stays in memory only; no telemetry."
maintainer: ElSerda
