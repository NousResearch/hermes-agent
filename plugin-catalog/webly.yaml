known_issues:
- "The Webly MCP tools need a sign-in, because a portable mcp.json cannot request OAuth: set WEBLY_API_KEY (a wb_ key from the Webly dashboard), or run `hermes mcp add webly --url https://api.webly.ai/v1/mcp --auth oauth` then `hermes mcp login webly`. Publishing without an account works without either."
