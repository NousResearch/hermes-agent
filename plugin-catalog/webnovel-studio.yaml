description: "Long-form fiction studio for Hermes Agent (first-class Chinese webnovel support): plan, write, review and inspect a 100+ chapter serialized novel with cross-chapter story memory, resumable runs, per-project single-writer lock, role-routed ctx.llm calls, and a read-only local dashboard. Bundles 8 workflow skills (/webnovel-init, /webnovel-plan, /webnovel-write, /webnovel-review, /webnovel-query, /webnovel-learn, /webnovel-dashboard, /webnovel-doctor). Disclosure — Derived from lingfengQAQ/webnovel-writer (v6.2.1, GPL-3.0). Spawns the vendored Python engine CLI (_vendor/webnovel-writer/scripts/webnovel.py) with shell=False and an allowlisted environment (no credentials forwarded); dashboard_start runs a local read-only FastAPI/uvicorn server on 127.0.0.1; reads/writes only inside the user-specified novel project directory and <hermes_home>/plugin-data/webnovel-studio/; pre_tool_call blocks direct shell/file edits to protected story state (.webnovel/state.json, index.db, published chapters). No external network calls (all LLM calls go through ctx.llm; upstream third-party vector retrieval and .env loading are disabled), no credentials stored or read, no telemetry."
