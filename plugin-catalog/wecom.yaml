description: 'WeCom (Enterprise WeChat) gateway platforms: wecom (AI Bot over the WeCom WebSocket gateway, native
  streaming replies, media, QR-scan setup) and wecom_callback (self-built apps over an HTTP callback endpoint with
  AES message crypto). Formerly built into Hermes core; existing users are migrated automatically. Disclosure — the
  bot mode opens a WebSocket to WeCom (openws.work.weixin.qq.com, or WECOM_WEBSOCKET_URL) and downloads inbound media
  from WeCom URLs; the callback mode binds a local HTTP port (8645 by default) only when its corp credentials are
  configured, and calls qyapi.weixin.qq.com for access tokens and replies. Credentials are read from the profile''s
  .env; nothing else is sent anywhere.'
maintainer: NousResearch
tier: official
default: true
