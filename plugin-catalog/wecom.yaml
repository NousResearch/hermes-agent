description: 'WeCom (Enterprise WeChat) gateway platforms: wecom (AI Bot over the WeCom WebSocket gateway, native
  streaming replies, media, QR-scan setup) and wecom_callback (self-built apps over an HTTP callback endpoint with
  AES message crypto). Formerly built into Hermes core; existing users are migrated automatically. Disclosure — the
  bot mode sends the agent''s replies and attachments over a WebSocket to WeCom (openws.work.weixin.qq.com, or the
  server WECOM_WEBSOCKET_URL names) and downloads inbound media from WeCom URLs; the callback mode sends replies and
  access-token requests to qyapi.weixin.qq.com and binds a local HTTP port (8645 by default) only when its corp
  credentials are configured. Credentials come from Hermes for the active profile (its scoped secrets); the plugin
  opens no credential file itself.'
maintainer: NousResearch
