description: "Catch conflicts between coding agents while they edit, before Git merge time. Disclosure — In a checkout linked with `/weft setup` (a `.weft/space.json` plus the saved agent token), every file edit the agent makes is sent to the Weft gateway that checkout names: file paths, symbol keys, full diffs, agent and change ids, the Hermes model name and the Kanban task title. The gateway is local (127.0.0.1) by default, Weft's hosted `https://weft-hosted.elier.ai` when chosen or named by a checkout, or a gateway you add with `/weft trust`. Gateway diagnostics are appended to tool results, and `mode: enforce` blocks conflicting edits, `git commit` and task completion. `/weft setup` and `/weft feed` run `npx -y @celador/weft@0.3.0`, which installs `wrangler@4` from npm, starts a background local gateway that outlives the chat, creates a paired Git worktree and installs Git hooks in the repository. Activity snapshots and logs are kept in `~/.cache/weft-hermes`, shared across profiles."
