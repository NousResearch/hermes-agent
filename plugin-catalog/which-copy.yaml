name: which-copy
repo: https://github.com/Hazem-Samak/hermes-which-copy
sha: ce935c21c1ec319c8321d039c0036b9dd2422961
description: >-
  Answers the question that silently decides everything else: which copy of a
  command is Hermes actually going to run? On a Mac the same tool can exist five
  times over — a Homebrew formula, an npm global install, a pyenv shim, a
  standalone download, and Hermes's own bundled copy — and the name resolves to
  whichever one PATH reaches first, with no warning when that is the wrong one.
  Two tools and a bundled skill, both read-only. which_copy resolves one name
  against the PATH the Hermes process actually runs with and against the PATH
  your login shell builds for your terminal, and says so when those disagree;
  it lists every copy it can find, on PATH and in the usual off-PATH install
  locations, with the evidence for where each came from (a Homebrew Cellar
  directory names the formula, a node_modules tree names the npm package
  including its scope, pyenv versions, uv tools, pipx venvs, nvm, Hermes's own
  directories, a plain folder, the macOS system), the version it reports, and
  whether it can even execute here — an Intel-only binary on Apple silicon is
  named as running under Rosetta. Then it gives a verdict in plain language: an
  older copy shadowing a newer one, a dead symlink earlier in PATH that the shell
  silently skips, Hermes running its own bundle instead of yours, several copies
  that cannot honestly be ordered, or nothing wrong at all.
  which_copy_scan sweeps the usual AI tools — python, python3, node, npm, npx,
  bun, pnpm, uv, pip, pipx, git, gh, brew, hermes, claude, codex, opencode,
  gemini, grok, aider, cursor-agent, rustc, go, ruby, java — in about a second,
  one line per tool, worst first. It diagnoses and stops: no installs, no
  PATH edits, no relinking, no "fix" that hides the problem. Versions are asked
  with an argv-only probe (three-second deadline, own process group, 8 KB output
  cap, cwd at the filesystem root, and a stripped environment so a shadowing
  binary never sees Hermes's API keys), and can be turned off entirely for a
  pure filesystem answer. When two version strings were never meant to be
  compared, it says it cannot order them instead of guessing.
maintainer: Hazem-Samak
tier: community
category: tools
requires_hermes: ">=0.22.0"
docs_url: https://github.com/Hazem-Samak/hermes-which-copy#readme
version: "1.0.0"
title: Which Copy
platforms: [macos, linux]
capabilities:
  provides_tools:
    - which_copy
    - which_copy_scan
  provides_hooks: []
  provides_middleware: []
  requires_env: []
