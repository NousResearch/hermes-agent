name: whiteboard
title: Hermes Whiteboard
repo: https://github.com/Adolanium/hermes-whiteboard
sha: eeb336546628e4a5d203630dc55fbdeeddffc879
description: >-
  An agentic whiteboard. Say what you're planning and Hermes lays it out as a
  route, columns or a map, with hand-drawn stickers. Add rough notes and
  Hermes proposes groups, owners and action items that you accept one by one
  and can take back. Hand an action item to Hermes and an agent does it on the
  board and delivers the result next to the note with its sources, or run the
  whole route and get a brief at the end. Select anything and ask about it.
  Once you allow it, any chat can read your boards and propose changes.
  Link a board to the chat its work is in: the board shows what that chat is
  doing, and the chat hears what you change on the board. Send notes to Hermes
  Kanban or lay a Kanban board out as a whiteboard.
  Disclosure — laying out a board, grouping notes, unpacking a result and the
  brief each start a hidden Hermes session told to use no tools; Hand to
  Hermes, Run the route and Ask start hidden sessions that use your Hermes
  tools and read third-party web pages, at most three at once, each stopped
  after 4 minutes or 24 tool calls; approval prompts inside these sessions
  are denied; export writes the one Markdown or CSV file you name in the
  system dialog, through the plugin's own backend; boards live in Desktop
  plugin storage, with a copy under plugin-data/whiteboard/ only after you
  turn on chat access, which starts off, and each Hermes profile that has the plugin keeps
  its own copy; a Planning model and an Agent model in Settings name a model you are
  signed in to in Hermes when a session is created, and a refused model stops
  the run; with the Sheets or Data plugin
  installed, a click on that page pins notes to the open board through a
  window event, with no file, backend or model involved; Send to Kanban and
  New board from Kanban make the plugin's backend run the `hermes kanban`
  command, with no shell and with note text passed after `--` and on standard
  input, to list boards, create cards and read a board; cards are created in
  Blocked with no assignee, and in Triage, which Hermes works through on its
  own, only when you tick a box; while the page is open on a board that has
  Kanban cards it reads those Kanban boards about every 25 seconds, and it
  never changes a card after making it; a board can remember the id of the
  chat it is linked to, the page places a request in that chat's message box
  for you to send and never sends it, and after that it listens to that one
  chat for up to 30 minutes and reads its answer from the transcript; the
  plugin registers four hooks (pre_llm_call, post_llm_call, on_session_end,
  post_compaction) that run on every chat turn and return at once unless the
  chat is linked to a board; for a linked chat they keep the state of its
  latest turn and the first line of its answer under plugin-data/whiteboard/,
  and, only while chat access is on, add to the message you send in that chat
  a short notice that the board exists and the notes you added, edited or
  removed on it since the chat's last turn; the plugin never sends a message
  to a chat; the linked chat can put a doing, done or blocked mark on its own
  board's notes with no review, which changes nothing else and clears with a
  click; which chat each board is linked to is kept under
  plugin-data/whiteboard/ as ids only, whether or not chat access is on; no
  telemetry, no credentials, no background processes of its own, and no
  command other than `hermes kanban`. Independent community
  project, not affiliated with Nous Research.
maintainer: Adolanium
tier: community
category: desktop
requires_hermes: ">=0.22.6"
docs_url: https://github.com/Adolanium/hermes-whiteboard#readme
version: "0.1.9"
image: https://raw.githubusercontent.com/Adolanium/hermes-whiteboard/eeb336546628e4a5d203630dc55fbdeeddffc879/docs/assets/catalog.png
