description: "Read the user's WHOOP recovery, HRV, sleep and strain through the local whoop MCP server. Portable Agent Plugins v1 package (mcp.json + skills/). Disclosure — Runs the `whoop-mcp-unofficial@0.7.0` npm package locally over stdio through `npx` (Node.js 20+ required); the package and its caret-ranged dependencies (including the native better-sqlite3 module) are downloaded from npm on first start. Data source: the official WHOOP OAuth API (v2); recovery, sleep, HRV, strain and workout data the tools return enters the conversation and is sent to your model provider. Credentials and OAuth tokens are created by the connector's own `setup`/`auth` commands in the user's terminal, stored and refreshed by the connector itself under `~/.whoop-mcp/`; the plugin declares no environment variables and reads no Hermes credentials. Tools that change state: whoop_profile_update (local profile only); whoop_exchange_code (stores OAuth tokens locally); whoop_revoke_access (revokes the WHOOP grant and deletes local tokens). The tool set comes from the pinned npm version, not from this repository's source tree."
