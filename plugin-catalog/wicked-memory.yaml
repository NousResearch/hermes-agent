name: wicked-memory
repo: https://github.com/WickedAPI/hermes-wicked-memory
sha: e2fced27c27519879086338971937032c59109f1
version: "0.2.0"
description: "Persistent, wallet-scoped long-term memory for Hermes: remember, semantic recall, versioned update, history and approved hard delete, backed by the hosted Wicked Memory service, plus skills for using it and for connecting the Wicked MCP server. Works with no setup (a wallet is generated on first use; search uses the service's shared free key). Disclosure — sends the memory text and search queries the agent chooses to memory.wickedapi.com (or your configured base_url), each request signed by the agent's wallet, plus one GET to /v1/status on first use to read the published community key; stores a generated private key unencrypted in the plugin data dir unless you supply WICKED_MEMORY_PRIVATE_KEY; no shell commands, no background processes, no telemetry; every wicked_memory_forget asks for human approval. Version 0.2 adds wicked_memory_backup (export or restore your own memories to a backup file in the plugin data dir; an optional local mirror writes a readable, unencrypted copy there, off by default and enabled only after human approval) and wicked_memory_link (link an optional paid Wicked Memory Pro key, sold separately, to your wallet; recovering to a new wallet needs human approval). The plugin never pays anything itself. The bundled wicked-suite-mcp skill walks you through adding the author's hosted Wicked MCP server (https://mcp.wickedapi.com/mcp, 75 tools, some x402-priced); that server is a separate manual step and is not covered by this pin."
maintainer: choaticpixels
tier: community
category: tools
requires_hermes: ">=0.21.5"
docs_url: https://github.com/WickedAPI/hermes-wicked-memory#readme
readme: true
platforms: []
capabilities:
  provides_tools:
    - wicked_memory_remember
    - wicked_memory_recall
    - wicked_memory_update
    - wicked_memory_history
    - wicked_memory_forget
    - wicked_memory_whoami
    - wicked_memory_backup
    - wicked_memory_link
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
