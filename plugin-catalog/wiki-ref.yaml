sha: 27e7a6e00a5e44f25a37497b6c8b542d4d416c78
subdir: wiki-ref
description: >-
  @wiki:<title> context references: attach the lead section of a Wikipedia article to a message,
  or one section with @wiki:<title>#<section>; read another edition with @wiki:de:<title> or the
  article's address; title autocomplete in the TUI and Desktop composer. Disclosure — sends HTTPS
  GET requests to <edition>.wikipedia.org/w/api.php only, where the edition is the language setting
  or the one a reference names (an address on another site, or an interwiki link off Wikipedia, is
  refused before any request to it); the referenced title and the typed autocomplete prefix leave
  the machine; a section is cut locally; no API key, no files written, no subprocess; register()
  only adds the @wiki: reference provider.
maintainer: EloquentBrush0x
