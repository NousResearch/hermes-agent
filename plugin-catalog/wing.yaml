"readme": !!bool "true"
"description": "Extra features for the Wing Android app: GPT Live voice and email\
  \ draft cards. GPT Live voice uses ChatGPT subscription or OpenAI API access with\
  \ the selected Hermes profile's context. Email draft cards show recipients, cc/bcc,\
  \ subject and body, then open the user's chosen email app for final edits and sending.\
  \ Drafts work independently of voice and need no OpenAI credentials or mail account\
  \ access. Draft cards adapt arsiktech's hermes-draft-cards design (MIT); the voice\
  \ integration builds on Synero's hermes-live-voice work (MIT). Disclosure: draft\
  \ fields persist in the active profile's plugin-data/wing SQLite database. Voice\
  \ sends SDP, Hermes-built profile context and chat excerpts to OpenAI/ChatGPT through\
  \ Hermes-owned credentials. Fresh voice context starts a short-lived Python inspection\
  \ subprocess that initializes configured Hermes memory extensions; it neither runs\
  \ an agent turn nor saves chat history. Uses Hermes prompt and voice helpers, including\
  \ undocumented imports disclosed in the README. No telemetry, stored credentials\
  \ or plugin self-updater."
"known_issues":
- "Requires the matching Wing Android client. Email cards need a Wing build with wing-email-draft\
  \ rendering; other clients see the tool fields/reference as text."
- "Voice context uses undocumented Hermes prompt-inspection and voice helpers that\
  \ can change; admission validation reports these imports for reviewer inspection."
- "Live subscription voice requires a profile sign-in with voice access. API voice\
  \ requires the profile's OpenAI credentials. Email drafts require neither."
