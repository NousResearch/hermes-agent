platforms: [linux]
known_issues:
  - Asks for admin rights once per machine to install a root helper. Read plugin/root/wings-root.sh first.
  - Trusts a private certificate authority system-wide, limited to .wings names.
  - Devices connect to the computer you ran setup on (the hub). To reach a hub at home from outside, one UDP port must be forwarded on the router.
  - Computers link directly when their networks allow it and otherwise go through the hub. Phones always do.
  - Phones run one VPN at a time, so the Wings tunnel replaces any other while it is on.
capabilities:
