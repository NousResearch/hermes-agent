  - https://raw.githubusercontent.com/aka-lacie/hermes-wiretap/ded7e1e8091e0c180e7dc4b6f0fdb83dadc7bdb8/docs/screenshots/02-calls-cache-miss.png
  - https://raw.githubusercontent.com/aka-lacie/hermes-wiretap/ded7e1e8091e0c180e7dc4b6f0fdb83dadc7bdb8/docs/screenshots/03-transcript.png
