  - https://raw.githubusercontent.com/aka-lacie/hermes-wiretap/10f9a8afab1b9fcb9b8783c8541b244bcf2ce675/docs/screenshots/02-calls-cache-miss.png
  - https://raw.githubusercontent.com/aka-lacie/hermes-wiretap/10f9a8afab1b9fcb9b8783c8541b244bcf2ce675/docs/screenshots/03-wire-json.png
