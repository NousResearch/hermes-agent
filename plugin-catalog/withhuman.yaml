subdir: plugins/hermes/withhuman
description: "Human approval for Hermes tool calls, with human in the loop guardrails. Set rules for what runs automatically, and send the rest to your team to approve or deny from Slack, Discord or your phone. Keep an audit log of every call. Disclosure — every tool call's name and arguments are sent to your withHuman organization (app.withhuman.ai or the address you configure) and run only after approval. The plugin downloads a pinned, checksum-verified withHuman CLI from downloads.withhuman.ai and runs it once per tool call. Setup offers to set the profile-wide `plugins.hook_callback_timeout` to 0, which removes Hermes's hook hang guard for every plugin. On hosted withHuman, setup adds the `withhuman-gateway` MCP server, which sends your agent key to your withHuman address, and offers to install the withHuman skills from withhuman.ai."
maintainer: withHumanAI
tier: community
category: tools
requires_hermes: ">=0.21.5"
docs_url: https://withhuman.ai/docs
version: "1.5.4"
platforms: [linux, macos]
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_tool_call
  provides_middleware: []
  requires_env: []
