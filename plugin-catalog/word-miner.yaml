name: word-miner
repo: https://github.com/trenthalden/word-miner
sha: "e3776aed517ec28a898d1006541358ee3ca2d44e"
description: >
  Turn any text you are consuming (lyrics, subtitles, articles, chat) into a
  personal vocabulary deck and run short daily spaced-repetition sessions inside
  Hermes. Any language pair. Local only — SQLite event log, SM-2-like scheduler
  with response-time adjustment, 3+3+3+1 sessions, two-stage graduation. No Anki,
  no AnkiConnect, no network. The model extracts lemmas; four tools plus /deck
  and a bundled mining skill. Disclosure — stores decks and review history under
  HERMES_HOME/plugin-data/word-miner; no outbound calls, no shell, no credentials.
maintainer: trenthalden
tier: community
category: tools
requires_hermes: ">=0.22.5"
docs_url: https://github.com/trenthalden/word-miner#readme
