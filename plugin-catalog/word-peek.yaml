title: Word Peek
description: >-
  Explore HTML passages in a folder-granted reader, ask Hermes in the passage's
  captured chat, and save notes or whole-document edits with verified backups
  and Undo. Web selections use the consent-based preview SDK and are read-only.
  Chat answers are matched to their submitted turn. Selected text, context,
  references and whole-edit documents go through the configured Hermes agent
  and its tools. Reads and writes use the Desktop file SDK; edited documents
  and exclusive .word-peek-*.bak copies stay in the granted folder.
  Glossary and recovery metadata use plugin storage. No agent tools, hooks,
  middleware, credentials, telemetry or direct model API calls are added.
image: https://raw.githubusercontent.com/lEWFkRAD/word-peek/1d4f93b720590e9e4cc2bac31523a525c15c6bd4/docs/screenshots/hero.png
