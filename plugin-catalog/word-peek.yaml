title: Word Peek
description: >-
  Explore and build on local HTML documents from inside Hermes Desktop: select a passage in an
  HTML preview, right-click to Explore or Ask, and Word Peek routes inline questions
  through the main Hermes agent loop as a normal chat turn — the answer appears in chat with full
  context and tools, and in the panel beside the passage. Follow-ups stay per-passage;
  answers keep reference links already present in the document (never auto-fetched). Notes can be
  inserted into the HTML as expandable blocks, below the selection, or as replacements; applying
  backs up the file, re-reads and compares before writing, reloads the preview, and offers
  verified undo. Ships a bundled glossary store and personal notes in plugin storage.
  Desktop-only (plugin.js inside the plugin SDK surface); no agent tools, hooks, middleware or
  env vars. Disclosure — writes only to the local file: HTML document being edited (a
  .word-peek-<timestamp>.bak copy is kept beside it) and plugin storage; model calls go through
  the configured Hermes model; offline WordNet dictionary data is optional and not redistributed.
