platforms: []
known_issues:
  - Requires a Desktop build with folder-granted ctx.files, consent-based ctx.preview, and correlated prompt receipts; older builds cannot use those operations.
  - The reader disables scripts and external resources. Whole-document edits can contain active content; review before opening in a normal browser.
  - External editors can race the final read/write interval because the SDK has no atomic compare-and-swap.
