known_issues:
  - "Verified on Windows with the real Hermes Desktop and Office. The test suite passes on Windows, Linux (fresh clone) and in macOS CI; the Hermes Desktop screens were run on Windows only."
  - "The safety net reverts files that other plugins' tools wrote inside registered projects, and appends one line to those tool results; this is by design and listed in docs/LIMITS.md."
  - "A plugin that bundles its own copy of the PowerPoint or Word library (paper-pptx, paper-docx) cannot share an environment with python-pptx and python-docx; Workroom then cannot build new decks or reports, while reading, editing and releasing existing files keep working."
  - "Real-model checks (bypass, approve, injection, folder tidy) were run with one model, 3 to 5 runs per case, so they are counts, not rates."
  - "On a very large report the first import asks many questions (3,841 on one blind run, about 88% of them real)."
