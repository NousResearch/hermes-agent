name: workroom
title: Workroom
repo: https://github.com/Pratiikpy/workroom-for-hermes
sha: "4d44e9dc229fd5a89d7973881c6e14dbb083e525"
description: >-
  Gives the agent a room to work on Word, PowerPoint and Excel files while you
  stay in charge. Figures are linked to their source cells and kept in step when
  a source changes; the agent can prepare a release but has no tool to approve one;
  figures in its text are marked supported, calculated or not verified from what it
  read; a reply that claims a file that does not exist gets one honest line.
  Desktop panels: Needs you, Made (list or gallery), Room, Rules.
  Disclosure: reads and writes only inside the folders the user registers and in
  the plugin data directory; no network calls, no telemetry, no self-updater, no
  native binary. To be able to put protected files back, the safety net reads, in
  memory, the bytes of every managed or protected file of a registered project
  (including .env and key files) before a shell, code or editing tool runs; they are
  never shown to the agent and are kept in plugin data only if the agent changed the
  file (the agent's version). Hooks (pre_tool_call,
  post_tool_call, transform_tool_result, transform_llm_output, pre_llm_call,
  pre_verify, subagent_start, subagent_stop) can block a tool call, append one line
  to a tool result or reply, and, after a shell, code or other editing tool runs,
  put back any Office or protected file of a registered project that changed (the
  agent's version is kept in plugin data); they never approve or auto-approve.
  To check the figures in the agent's text it stores, in a local SQLite file in
  the plugin data directory, the text of tool results the agent read this session
  (capped at 20 MB per session) and the owner's chat messages; nothing is sent
  anywhere.
  Subprocesses: a local Python child to build files; the Windows icacls tool once
  for the signing key file; PowerShell only on request on Windows with PowerPoint to
  draw slide pictures, or LibreOffice (soffice) for the same on other systems when
  it is installed. Starts no scheduled job itself (a user-created Hermes cron job
  may run its watch script, which can prepare a release but never approves one).
