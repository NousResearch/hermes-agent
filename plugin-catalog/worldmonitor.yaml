description: "Source-aware global intelligence through WorldMonitor's hosted MCP: country risk, conflicts, markets, energy, shipping and natural hazards. Configuration-only Agent Plugins v1 package with one skill. Public source inventory works without credentials; other intelligence requires a signed-in account and some tools require a subscription. Disclosure — connects to the hosted WorldMonitor MCP server at worldmonitor.app and sends tool arguments there; the remote tool list is dynamic and not frozen by this SHA; authenticated calls use the user's WorldMonitor account allowance, and remote tools include `start_upgrade` (creates a personal checkout link) and `report_issue` (submits a report to WorldMonitor); the package marks the server `trust: untrusted`, so Hermes asks before any tool not annotated read-only. No local runtime code, hooks, telemetry or self-updater."
