version: "0.1.0"
description: "Builds World of Warcraft: Forever (client 1.60.1, Interface 16001) addons that load and run, for players who are not programmers. Nine tools: wow_env (install/addon detection), wow_api (queryable index of the real client build's API, events and restrictions), wow_check (six-stage static + headless verification: TOC lint, Lua 5.1 syntax, global resolution, restricted/secret API rules, headless load in an embedded Lua 5.1 VM stub of the game, efficiency lints), wow_test (multi-client headless Lua test runner), wow_new (scaffolds an addon from tested building blocks: core, replicated record log, guild sync, trust, lazy Classic-theme window, Discord bridge), wow_install (installs after wow_check passes, with backup), wow_savedvars and wow_errors (read game data and in-game Lua errors back, via the bundled ForgeProbe companion addon), and wow_bridge (file-based Discord seam: pull an outbox, push an inbox, one /reload of latency each way). Ships Guildhall, a guild-management addon built entirely with these tools (board, calendar, a Marks currency earned automatically by playing, Discord mirror), the wow-addon-builder skill, /wow, hermes wow, and an Addon Forge Desktop pane. Disclosure: network only on wow_api sync (GitHub raw downloads of the public API documentation mirrors, or zero-network from a local BlizzardInterfaceCode export); reads the WoW install (Interface/AddOns, WTF SavedVariables, .build.info); writes only Interface/AddOns/<name> on wow_install and Inbox.lua on wow_bridge push, each an explicit visible tool call; no shell commands, no background processes, no stored credentials, no telemetry, no self-update."
maintainer: SnoobieJunes
tier: community
category: gaming
docs_url: https://github.com/SnoobieJunes/hermes-wow-plugin
requires_hermes: ">=0.22.0"
