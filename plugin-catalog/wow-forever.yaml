title: "WoW Forever"
description: "Offline guide to World of Warcraft: Forever (Blizzard's official game, client 1.60) for any race, class and faction: a Hermes Desktop page and an agent skill that answer from the same bundled data. Tabs: Character, Class (trainers with coordinates, spells by level, class quests), Route (leveling zones and quests), Professions (recipes, reagents, a leveling plan, cost and margin), Dungeons (bosses in order with their loot, plus the new Forever dungeons), Market (local price history and deals from your Auctionator scans, TSM accounting and the WoWForeverBridge daily diary, with item thumbnails) and Legacy, plus a curated Horde Hunter guide checked against the data. English UI, Spanish optional. Every value is labeled with its source (the Forever client tables, WoW Classic 1.12 through CMaNGOS, approximate for Forever, or the curated guide), and what no publishable source covers shows as no data. Not affiliated with Blizzard. Disclosure — the page reads only Auctionator.lua, TradeSkillMaster.lua and WoWForeverBridge.lua inside the SavedVariables folder you grant through Hermes's folder picker (bounded subfolder search), plus Pawn.lua only after an explicit, revocable opt-in; files are parsed as data and Lua is never run. Once the folder is granted, those three files are polled every 30 s while Hermes is open and the plugin is enabled; the poll never opens a picker. Profile, guide progress and prices stay in the plugin's own storage. The page makes no network calls, launches no processes and has no telemetry. Its Ask the agent button inserts a context block you preview into the chat composer through the SDK and never sends it. The skill registers no tools: its stdlib-only Python scripts read the plugin's data/ and, only when given one, a price file you name; they write nothing and are run by the agent through its own terminal, under Hermes approvals. Bundled data: CMaNGOS classic-db (GPL-3.0) and Blizzard client tables and item icons, fetched at build time by the maintainer's tools/ scripts, which the plugin never runs (see LICENSE-DATA.md). The repository also carries an optional companion addon (addon/WoWForeverBridge) that the player copies into the game by hand; the plugin never installs it and never touches the game."
