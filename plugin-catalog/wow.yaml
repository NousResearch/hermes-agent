description: "Chat with a Hermes agent from inside World of Warcraft: Forever. The plugin registers a kind: platform gateway adapter that serves a local HTTP endpoint (/v1/wow/message, /v1/wow/outbox, /v1/wow/health) authenticated with a bearer token; one character (Name-Realm) is one Hermes DM session. A companion bridge runs on a Windows 11 PC next to the game client: it captures a 1600x400 pixel strip from the game window with the Windows Graphics Capture API (mss/GDI fallback), decodes chat, POSTs lines to the adapter and long-polls the outbox. It also writes reply/state files into the WoW AddOns tree and reads SavedVariables for reload mode, and plays silent doorbell WAVs. The adapter binds 127.0.0.1 by default and can be bound to a LAN address explicitly; the bridge then makes outbound HTTP requests to that configured Hermes host. Adds five WoW-only tools (wow_addon_search, wow_addon_guide, wow_addon_install, wow_addon_uninstall, wow_quest_help), three per-character toolsets selected with /mode (standard, wow, full; full needs an in-game confirmation and expires after 60 minutes), and a bundled wow-player-guide skill. Disclosure - the plugin opens a local HTTP listener guarded by a shared bearer secret (WOW_BRIDGE_TOKEN, auto-generated in memory when unset, so the bridge cannot pair until it is set); it makes CurseForge API calls (api.curseforge.com) with the player's own CurseForge Core API key, stored as a profile-scoped Hermes secret (WOW_CURSEFORGE_API_KEY in the selected profile) with no plugin-managed credential file; addon installs and uninstalls are queued to the bridge, which writes or moves files under the WoW AddOns directory only after the player confirms in game and keeps a removal backup instead of deleting permanently; a desktop setup page creates or updates a dedicated Hermes profile (wow), writes its .env, config.yaml, SOUL.md and a profile skill, and can hot-serve that profile through a running gateway multiplexer. The bridge is a separate long-running background process (screen pixels plus files only); the plugin does not read the game process or its memory, does not inject input, and does not automate gameplay. Chat text and tool results are sent to the model provider configured for the WoW Hermes profile (cloud or local), with that provider's data-handling terms and the usual token cost. Requires Hermes >=0.22.7, Windows 11 for the bridge, WoW: Forever (Interface 16001), and uv/Python downloaded for the bridge; a CurseForge key is needed only for one-click addon installs (without one the addon tools return a guided CurseForge link). Disclosure — the plugin opens a local HTTP listener (127.0.0.1 by default, plain HTTP if bound to a LAN address) guarded only by a shared bearer token (WOW_BRIDGE_TOKEN); whoever holds that token can chat as any character and, after the in-game `/mode full confirm` step, use terminal, file and code tools on the Hermes host for 60 minutes. It calls the CurseForge API (api.curseforge.com) with the player's own CurseForge key, stored as a Hermes secret in the selected profile. The Desktop setup page creates or updates a dedicated Hermes profile: it copies this plugin into that profile, writes the profile's .env, config.yaml (including turning off tool deferral for that profile), SOUL.md and a profile skill, and can hot-serve it through a running gateway. A separate long-running Windows bridge reads a strip of the game window's pixels, writes reply and state files and installs or backs up addons under the WoW AddOns folder only after an in-game confirmation, opens links the agent sends in the default browser, and downloads a checksum-pinned uv release and Python on setup; it never reads game memory, injects input or automates play. Chat text and tool results go to the model provider configured for the WoW profile."
