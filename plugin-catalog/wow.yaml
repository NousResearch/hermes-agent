known_issues:
  - "Two-part install: this Hermes plugin plus a separate Windows 11 bridge process next to the game client. The plugin alone cannot reach the game."
  - "The game client must run windowed or borderless-windowed; exclusive fullscreen exposes no capturable window."
  - "The public repository is a sanitized release mirror, not the private development history; older commits and internal notes are not published."
  - "One-click addon installs need the player's own CurseForge Core API key and an author who allows third-party distribution; otherwise the tools return a CurseForge deep link instead of downloading."
  - "The CurseForge key is a profile-scoped Hermes secret: saving it in the setup page affects only the selected profile. A key stored by v0.2.0 in the retired machine-wide plugin-data/wow/curseforge.key file is not read automatically — re-enter it once in setup after upgrading (the old file is left untouched)."
  - "The bridge asserts the character name, so WOW_BRIDGE_TOKEN is the only authentication boundary. Keep the listener on loopback unless the game PC is a separate machine, and firewall the port to that machine."
