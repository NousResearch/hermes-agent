name: wrenchboard
title: WrenchBoard
repo: https://github.com/Junkz3/hermes-wrenchboard
sha: "da468ace9e5c5cdfa118fe302eeda00de81f67cb"
description: >-
  Turn Hermes into a circuit board repair bench: a live boardview beside the chat, opened from 14 boardview
  formats, test plans with readings pinned on the pads, part cards drawn from the real copper, and your schematic
  and datasheets read on your computer. Disclosure: needs a WrenchBoard account (free to read boards, with an
  example board to try; repairs and test plans need Pro) and talks only to WrenchBoard's hosted connector, which
  receives the boardview files you import, your repairs and your readings; schematic PDFs, documents and camera
  pictures stay on your computer, and there is no telemetry.
maintainer: Junkz3
tier: community
category: tools
requires_hermes: ">=0.23"
docs_url: https://github.com/Junkz3/hermes-wrenchboard#readme
version: "0.1.0"
image: https://raw.githubusercontent.com/Junkz3/hermes-wrenchboard/da468ace9e5c5cdfa118fe302eeda00de81f67cb/docs/screenshots/cover.png
