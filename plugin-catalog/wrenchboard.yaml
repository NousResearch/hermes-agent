known_issues:
  - "Needs a WrenchBoard account: free, created in the browser when you press Connect, and it comes with an open-hardware example board."
  - "The pane ships disabled, like every Desktop half: switch it on once under Capabilities, Plugins."
  - "Repairs and test plans need a WrenchBoard Pro account. On the example board, a free account also reads the analysed schematic and the known faults."
capabilities:
  provides_tools:
    - wb_schematic_find
    - wb_schematic_view
    - wb_capture
    - wb_doc_find
    - wb_doc_view
    - wb_repairs_page
  provides_hooks:
    - post_tool_call
    - pre_llm_call
    - transform_llm_output
    - pre_transcription
  provides_middleware: []
  requires_env: []
