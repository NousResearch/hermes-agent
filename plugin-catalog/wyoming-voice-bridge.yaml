name: wyoming-voice-bridge
repo: https://github.com/TakeshiTGAL/hermes-plugin-wyoming-voice-bridge
sha: bc3588adf98a9106df2d756dce93647198f75829
description: "Wyoming speech-to-text and text-to-speech for a Wyoming server you run (stt/tts provider `wyoming`), plus a wyoming_voice_status tool that lists the server's models and voices. Disclosure — Audio and text to speak go to the WYOMING_* host:port you set over cleartext, unauthenticated TCP (public addresses accepted). Once selected, the providers send speech in every session, including cron and webhooks. This build imports the installed package only when its file tree is the official wyoming 1.5.4 wheel, and a different tree sends nothing. This build lists no ffmpeg digest, so audio that is not already 16 kHz, 16-bit, mono WAV is not converted. wyoming_voice_status asks with one public pre_tool_call line. Choosing always stores one command_allowlist line for that same which and the same host:port list. A later call skips the question only when a person is present. cron, hermes -q, webhook, msgraph_webhook, and api_server do not send a describe, even after always. yolo and approvals off skip the prompt, and this plugin does not add a refusal for those modes. The plugin does not import Hermes approval, config, or write-guard modules. Hermes 0.21.4 does not list the skill. The v0.21.5 canary and Hermes 0.22.2 add one skill line to every session that loads the plugin, including a surface where the tools are turned off. The status tool is on for every surface, including the gateway, and a guest there can call it and approve it when a person can answer. Turn the wyoming_voice toolset off per surface with hermes tools."
maintainer: TakeshiTGAL
tier: community
category: voice
docs_url: https://github.com/TakeshiTGAL/hermes-plugin-wyoming-voice-bridge#readme
version: "0.1.6"
requires_hermes: ">=0.21.4"
platforms: []
capabilities:
  provides_tools:
  - wyoming_voice_status
  provides_hooks:
  - pre_tool_call
  provides_middleware: []
  requires_env: []
