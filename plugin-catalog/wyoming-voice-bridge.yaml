name: wyoming-voice-bridge
repo: https://github.com/TakeshiTGAL/hermes-plugin-wyoming-voice-bridge
sha: 7be4db8548a82a8745981d47e79d1623a173a54b
description: "Wyoming speech recognition and synthesis for a server you run. Disclosure — Audio and text go to the host and port you set, in cleartext TCP with no login. A public address is accepted. There is no paid API and no daily cap. The status tool is on for every surface, including gateways. Anyone you allow on your gateway can call and approve it, and the agent can call it. Turn that toolset off per surface with hermes tools. Only the status tool is refused under cron, yolo, approvals off, hermes -q, and unattended sessions, and those calls send nothing. Those sessions and webhooks still send speech, with no second question. This plugin creates no cron job, but one you add sends speech. The status reply lists every model and voice the server describes, installed or not. Answering \"always\" adds a command_allowlist line that stays until you edit it. Nothing is written under plugin-data. An existing speech file is not overwritten, and the speech tool deletes it when Hermes asked for that path. A command provider named wyoming wins over this plugin. The Hermes installer and hermes doctor can write stt.language: en into config.yaml; to transcribe another language, set WYOMING_STT_LANGUAGE or stt.wyoming.language. It relies on private Hermes approval, config and file-safety helpers, so a Hermes update can stop the status tool and speech file writes. This is not a satellite. gpt-live does not use it. Docker was the only trial. Not tested on a microphone, a speaker, or live voice."
maintainer: TakeshiTGAL
