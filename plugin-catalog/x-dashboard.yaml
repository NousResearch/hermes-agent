version: "0.1.0"
description: >-
  Zero-cost ($0.00) X analytics dashboard for Hermes Web and Desktop with profile KPIs,
  verified-follower & impression goal tracking, post/mention feeds, SVG charts, and CSV/JSON export.
  Disclosure — Free Mode fetches public profile and post metadata from api.fxtwitter.com /
  api.vxtwitter.com and r.jina.ai and caches snapshots in <hermes_home>/plugin-data/x-dashboard/;
  optional Live X API v2 mode calls api.x.com (or an installed xurl CLI) only when explicitly
  selected and X_BEARER_TOKEN is configured.
