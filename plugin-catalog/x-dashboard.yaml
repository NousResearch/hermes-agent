description: "Zero-cost ($0.00) X analytics dashboard for Hermes Web and Desktop with profile KPIs, verified-follower & impression goal tracking, post/mention feeds, SVG charts, and CSV/JSON export. Disclosure — Free Mode fetches public profile and post metadata from api.fxtwitter.com / api.vxtwitter.com and r.jina.ai and caches snapshots in <hermes_home>/plugin-data/x-dashboard/; when the xurl CLI is on PATH it runs `xurl auth status` locally to detect your linked handle; optional xAI x_search discovery (enable_x_search=true, billed to your xAI account) and Live X API v2 mode (api.x.com with X_BEARER_TOKEN, or the xurl CLI) run only when explicitly opted in."
