name: xray
repo: https://github.com/cipoklean/hermes-xray
sha: 85b0e95e68472bd1a6dd582458a2f575ab7d9d2d
subdir: xray
title: "Plugin X-Ray"
description: "Sets traps for plugins instead of watching them. hermes xray detonate runs a plugin in a throwaway sandbox full of honeytokens, fuzzes its tools, fires its hooks and replays it at +30 and +90 days to catch time-bombs, then gives a RED/AMBER/GREEN verdict with file:line proof, a per-version behaviour diff and a drafted disclosure line. Opt-in live bait flags any installed plugin that reads a decoy credential file and can route its next tool call to Hermes' approval prompt. Disclosure — spawns child Python processes to detonate plugins (fake HOME, real keys stripped, network egress and process spawns blocked); runs git clone when you detonate a remote repo; reads installed plugins' source dirs to attribute events; bait plant (opt-in) writes decoy files only into empty paths under your home and bait remove deletes only unchanged files it wrote; enforce (off by default) uses pre_tool_call approve; no LLM calls, no telemetry, never reads real credentials or patches Hermes core."
maintainer: cipoklean
tier: community
category: tools
requires_hermes: ">=0.19"
version: "0.1.0"
docs_url: https://github.com/cipoklean/hermes-xray#readme
readme: true
platforms: []
known_issues:
  - "Detonation sandboxes by environment, not by a VM: the plugin under test really runs in a child process. Detonate unknown code on a machine you don't mind"
  - "Python audit hooks see Python-level actions only; native code can act below them (any ctypes load is reported). Env-variable theft is caught when the value leaves the process, not when it is read"
  - "Desktop plugin.js code is not detonated (Python side only)"
capabilities:
  provides_tools: []
  provides_hooks:
    - on_session_start
    - pre_tool_call
  requires_env: []
