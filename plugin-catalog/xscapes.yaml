name: xscapes
repo: https://github.com/donlucasx/hermes-xscapes
sha: 4c71d9c13593eb4fbc37525d3ab1d83b35afe8e8
subdir: ""
title: xscapes
description: |
  xscapes are cozy ASCII scenes that show what your agent is doing, at a glance. They run under Hermes in your terminal.

  - See how hard your agent is working and what it just did
  - Keep an eye on your session's context
  - Never miss a failed command
  - Leave the room: your companion knocks with a sound when Hermes needs you
  - Multiple scenes and companions, all on your own clock

  Needs the xscapes program, installed separately. Disclosure: sends each tool call with its arguments, approval commands, the folder Hermes runs in, and the first line of each prompt and reply to the xscapes program (not covered by this pin), which keeps them under ~/.config/xscapes/.
maintainer: donlucasx
tier: community
category: general
requires_hermes: ">=0.23.0"
docs_url: https://donlucasx.github.io/xscapes/
version: "0.2.2"
image: https://raw.githubusercontent.com/donlucasx/xscapes/26d14fc7c8d673849fe954d8172dc151c898d78d/assets/hermes/banner-nous.gif
platforms: [linux, macos]
capabilities:
  provides_tools: []
  provides_hooks: [on_session_start, on_session_reset, on_session_end, on_session_finalize, pre_llm_call, post_llm_call, pre_tool_call, post_tool_call, pre_approval_request, post_approval_response, subagent_start, subagent_stop, on_human_input_request, on_human_input_resolved, post_api_request]
  provides_middleware: []
  requires_env: []
