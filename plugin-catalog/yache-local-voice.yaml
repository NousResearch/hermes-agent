# Binaries vendored in-tree are compiled by this repo's GitHub Actions and
# carry SLSA build provenance (rule 17): CI joins each path onto the pinned
# clone and verifies its attestation against the workflow run. The CUDA
# accelerator pack (45 runtime DLLs, same CI job, same attestation) ships as
# the versioned Release asset of v0.1.1 and is SHA-256 pinned in plugin source.
attested_binaries:
  - vendor/qwentts_cpp/lib/qwen.dll
  - vendor/qwentts_cpp/lib/ggml.dll
  - vendor/qwentts_cpp/lib/ggml-base.dll
  - vendor/qwentts_cpp/lib/ggml-cpu.dll
