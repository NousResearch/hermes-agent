name: yandex-disk
repo: https://github.com/akinfold/hermes-yandex-disk
sha: 90a8215668c726a0bae98236da1d3c79d0699bdb
subdir: hermes_yandex_disk
title: "Yandex Disk"
image: https://raw.githubusercontent.com/akinfold/hermes-yandex-disk/90a8215668c726a0bae98236da1d3c79d0699bdb/docs/banner.png
description: "Browse, search and manage files on Yandex Disk. Read and write files, transfer them locally, share links and restore items from the bin."
maintainer: akinfold
tier: community
category: tools
requires_hermes: ">=0.21.5"
version: "0.6.2"
docs_url: https://github.com/akinfold/hermes-yandex-disk#readme
readme: true
platforms: []
known_issues:
  - "Every tool is offered by default, permanent delete and emptying the bin included. Set YANDEX_DISK_ACTIONS to register fewer (read, download, write, share, delete, all or single tools, comma-separated; read is the README's advice for a first setup), then restart Hermes"
  - "yadisk_search is registered only when the token's application may use Yandex Disk search; a token from a self-registered app or from Poligon usually may not, and the plugin then offers the other fourteen tools"
  - "yadisk_upload sends any other local file the Hermes process can read, unredacted, and the write group includes upload; to keep the agent off local files, name the tools without upload and download, e.g. YANDEX_DISK_ACTIONS=read,mkdir,write_file,copy,move,trash_restore"
capabilities:
  provides_tools:
    - yadisk_disk_info
    - yadisk_list
    - yadisk_search
    - yadisk_read_file
    - yadisk_trash_list
    - yadisk_download
    - yadisk_mkdir
    - yadisk_write_file
    - yadisk_upload
    - yadisk_copy
    - yadisk_move
    - yadisk_trash_restore
    - yadisk_publish
    - yadisk_delete
    - yadisk_trash_empty
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - YANDEX_DISK_OAUTH_TOKEN
