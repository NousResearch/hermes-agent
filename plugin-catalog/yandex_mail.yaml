name: yandex_mail
repo: https://github.com/akinfold/hermes-yandex-mail
sha: 34b650089939867a553dfa82db9d888945c7e403
subdir: hermes_yandex_mail
title: "Yandex Mail"
image: https://raw.githubusercontent.com/akinfold/hermes-yandex-mail/34b650089939867a553dfa82db9d888945c7e403/docs/banner.png
description: "Search and read Yandex Mail, organize messages and reply through IMAP/SMTP. Choose which folders and actions Hermes can use; saving attachments and sending require explicit opt-in. Disclosure — reads and changes your Yandex Mail over IMAP at imap.yandex.ru and sends over SMTP at smtp.yandex.ru (or the hosts in YANDEX_MAIL_IMAP_HOST / YANDEX_MAIL_SMTP_HOST if you set them, which are not restricted to Yandex), over verified TLS, with your YANDEX_MAIL_LOGIN and YANDEX_MAIL_APP_PASSWORD read through Hermes; flagging, moving and deleting, including irreversible permanent deletion, are offered unless YANDEX_MAIL_ACTIONS narrows them (read gives a read-only mailbox); saving attachments and sending are off until YANDEX_MAIL_ACTIONS names save_attachment and send_message; once on, sending asks no per-message confirmation, also in cron and other unattended runs, and reaches any address unless YANDEX_MAIL_SEND_TO fences recipients; saved attachments go to Hermes' shared document cache, where other tools can read them, and are pruned after 24 hours; mail written by other people reaches the agent as tool output; uses Hermes' private tools.credential_files helper to map saved paths into sandboxes; no other endpoint, no telemetry, no shell access, no background process. Independent community plugin, not affiliated with Yandex."
maintainer: akinfold
tier: community
category: tools
requires_hermes: ">=0.21.5"
version: "0.4.4"
docs_url: https://github.com/akinfold/hermes-yandex-mail#readme
readme: true
platforms: [linux, macos]
known_issues:
  - "Default tools include flagging, moving and deletion, including irreversible permanent deletion. Set YANDEX_MAIL_ACTIONS=read for read-only access, then restart Hermes. Saving attachments and sending require explicit save_attachment and send_message opt-ins."
  - "Sending has no per-message confirmation, including unattended runs. YANDEX_MAIL_SEND_TO limits recipients; an explicit empty value refuses all recipients, while an absent value imposes no recipient restriction."
  - "The login and app password go to imap.yandex.ru and smtp.yandex.ru over verified TLS, or to configured IMAP/SMTP hosts. Host overrides are not restricted to Yandex-owned servers. Message bodies, headers and filenames are untrusted tool output."
  - "Saving writes to the current profile's shared temporary document cache, outside HERMES_WRITE_SAFE_ROOT; other Hermes tools can read it and cache cleanup can remove it. Saving needs POSIX directory operations and hard links."
  - "Remote attachment paths use Hermes' private tools.credential_files.to_agent_visible_cache_path helper because no public replacement exists. A helper error fails saving and removes the file; a mapping miss may return a host path that remote tools cannot access. Multiplexed gateway reloads without an active secret scope can fail closed."
capabilities:
  provides_tools:
    - yandex_mail_list_folders
    - yandex_mail_search_messages
    - yandex_mail_read_message
    - yandex_mail_save_attachment
    - yandex_mail_mark_message
    - yandex_mail_move_message
    - yandex_mail_delete_message
    - yandex_mail_send_message
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - YANDEX_MAIL_LOGIN
    - YANDEX_MAIL_APP_PASSWORD
