  - "Activation attempts to remove only the obsolete manualPinGuide preference through plugin-scoped SDK storage. No old-value reads, replacement settings or clipboard access remain."
  - "The host may reuse an existing Browser; pinning is visibility, not exclusive reservation. Native Windows Home/Shorts opening was checked; no fresh cross-platform, restart or long-running player certification is claimed."
  - "Dedicated picture-in-picture is not included; uses the existing docked Browser."
  - "Google sign-in and playback restrictions still apply; no browser-cookie import."
  - "Original 1.0.0 launcher: Windows 11/Desktop 0.22.2 manually verified; macOS/Linux playback not manually tested."
