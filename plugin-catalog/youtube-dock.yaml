name: youtube-dock
repo: https://github.com/metamindedu/hermes-youtube-dock
sha: 4a9f569021ee0740a18b71682587f91d2931edac
title: YouTube Dock
description: >-
  Manual-setup beta for YouTube Home and Shorts in the existing Hermes Desktop
  Browser. Manual mode defaults ON: copy an address, choose a Browser tab, paste
  it there and pin it yourself. OFF restores the legacy preview toggle, which
  can reuse an existing tab or hide its preview. No automatic tab management or
  dedicated PIP. Disclosure — explicit copy clicks write a fixed YouTube URL to
  the clipboard via the SDK; one preference boolean uses plugin-scoped storage.
  User navigation loads YouTube and its normal service/CDN requests. No credential,
  cookie, recommendation or watch-history reads, agent tools, hooks, middleware,
  API keys, telemetry, shell commands, backend service or self-updater.
maintainer: metamindedu
