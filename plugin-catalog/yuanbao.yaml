description: "Tencent Yuanbao messaging platform (DMs and group chats over Yuanbao's bot WebSocket, native media and stickers, DM/group access policies, cron home-channel delivery) plus the yuanbao toolset (yb_query_group_info, yb_query_group_members, yb_send_dm, yb_search_sticker, yb_send_sticker). Formerly built into Hermes core; existing users are migrated automatically. A Hermes Labs plugin: built by Nous Research, not supported, and likely not maintained going forward. Fixes from the community are welcome. Disclosure — messages, media and group member lists travel between Tencent's Yuanbao servers and your Hermes gateway using your own Yuanbao bot App ID and App Secret. The plugin also downloads image URLs that appear in replies or inbound messages, and its sign-token requests carry the Hermes version and an instance id."
