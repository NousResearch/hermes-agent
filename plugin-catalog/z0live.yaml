name: z0live
repo: https://github.com/kvnloo/z0live
sha: 8cdb912aa853fc0081e5b34ce78bcbb3e79feb3d
version: "0.2.0"
description: >-
  z0live is a self-hosted realtime voice stack that runs beside Hermes: GPT-Live or Grok Voice as the voice,
  a second voice (Grok) that answers when called by name, and fast/medium/slow model lanes that answer while
  Hermes works. The repo is the plugin. z0live_status reports the engine for the next call, the second voice,
  the lane models, lane server health and a summary of the latest call's event trace (read only).
  z0live_configure sets the engine (gpt-live or grok), the second voice (grok or off) and the tier models.
  z0live_lanes and /z0live-lanes show or change the helper-lane board in plain words. Disclosure: the tools
  read z0live's local files (lanes config, tier and voice overrides, call traces), write only those override
  files and the lanes board, make one loopback GET to z0live's lane server, and may run the plugin's own
  `bin/z0live engine`. The voice services themselves are installed separately (deploy/macos/install.sh) and
  hold their own logins. Nothing is sent off the machine by the plugin, no credentials are read, and no
  telemetry is emitted.
maintainer: kvnloo
tier: community
category: voice
docs_url: https://github.com/kvnloo/z0live/blob/8cdb912aa853fc0081e5b34ce78bcbb3e79feb3d/README.md
requires_hermes: ">=0.21.5"
platforms: []
capabilities:
  provides_tools: [z0live_status, z0live_configure, z0live_lanes]
  provides_hooks: []
  provides_middleware: []
  requires_env: []
