name: zalo-platform
repo: https://github.com/moken627-hub/hermes-plugin-zalo
sha: 5a989368d0877c930e76fcc75ea125e7af7ea872
description: "Zalo Bot Platform gateway adapter for Hermes Agent — relays messages between Zalo DMs/groups and the agent over the official Bot API (bot-api.zaloplatforms.com), long-polling or webhook mode. Adds slash commands and moderation. Zero extra dependencies (uses httpx, already a Hermes dependency). Production-tested on multiple Vietnamese deployments. Disclosure — connects to the third-party Zalo Bot API (bot-api.zaloplatforms.com) with your bot token; long-polling by default, or opt-in webhook mode with a listener on 127.0.0.1 by default that checks the X-Bot-Api-Secret-Token header; the setup wizard writes ZALO_* values to ~/.hermes/.env; group chat history is stored locally under <HERMES_HOME>/zalo-history."
maintainer: moken627-hub
tier: community
category: platform
requires_hermes: ">=0.19"
docs_url: https://github.com/moken627-hub/hermes-plugin-zalo#readme
version: "2.1.3"
platforms: []
capabilities:
  provides_tools: []
  provides_hooks: []
  provides_middleware: []
  requires_env:
    - ZALO_BOT_TOKEN
