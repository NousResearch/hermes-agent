description: "Read, search and reply to Zalo chats, personal Zalo accounts and Zalo Official Accounts (OA), through the hosted ZaloDesk MCP: catch up on unread conversations, read and search messages, send replies, find customers by phone, labels and friend requests; and for the workspace owner, the team (Phân quyền): invite, change and remove staff, which Zalo accounts and chats each sees, their permissions, routing of new chats and calls, conversation assignment, which PC runs a company Zalo, and the AI credit each staff PC may spend. Everything runs within the user's ZaloDesk role (an employee sees only the chats assigned to them). Agent Plugins v1 package (plugin.json + mcp.json + one skill); OAuth uses pinned mcp-remote@0.1.49 over npx stdio, so Node.js 20.18.1+ and npm are required. Disclosure — send_message sends real Zalo messages from the user's account, the team tools add, change and remove people's access, and set_ai_credit lets a staff PC spend from the owner's AI wallet; the package marks the zalodesk server untrusted, so Hermes asks before every tool the server does not annotate as read-only and refuses them in cron and headless runs. Every tool call goes to app.zalodesk.com; sign-in runs npx mcp-remote@0.1.49 from the npm registry, which stores its OAuth tokens in ~/.mcp-auth. The tool set is served by the remote server at runtime and is not covered by the pinned sha."
