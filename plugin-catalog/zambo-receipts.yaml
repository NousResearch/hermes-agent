version: "1.0.2"
description: "Verifiable receipts for Hermes Agent sessions. Lifecycle hooks journal every tool call in a session to Zambo (zambo.dev) as it happens, and when the session ends the plugin wraps it into an AER-1 verifiable receipt that anyone can open and check at a public zambo.dev/run link. Receipt pages are public: anyone with the link can read them, and the summary and goal text passed to zambo_wrap_session is published on the receipt page. Adds three tools (zambo_verify_receipt, zambo_wrap_session, zambo_session_status), a /receipt slash command, and a bundled skill. Disclosure: while enabled, the plugin makes network calls to zambo.dev (the configured MCP endpoint) carrying, per tool call, the tool name, duration, result size, and a SHA-256 hash of the result. Result contents are never sent unless the user sets journal_results to full, which also sends result text truncated to 4,000 characters. If the network is down, entries buffer in a durable outbox under $HERMES_HOME/plugin-data/zambo-receipts/ and flush at wrap or session end; the wrap also commits the SHA-256 digest of the full local call log, so calls that never journaled are still accounted for. A stable per-install caller id (hermes- plus 10 hex characters) is kept in the plugin data directory so each install uses its own Zambo free tier (20 calls plus 1 wrap-up free per day). No credentials, no API key, no dependencies beyond the Python standard library (requests is used when already installed). Runs in the plugin host through the public register APIs only; no core overrides, no self-updating code."
maintainer: zambodotdev
tier: community
category: tools
docs_url: https://github.com/zambodotdev/hermes-zambo-receipts/blob/5da9e11cb3bc22a4b567e135b0330addc55de55f/README.md
