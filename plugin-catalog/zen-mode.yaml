title: Zen Mode
description: 'Every Hermes Desktop conversation in one stack that recedes into the screen, ordered like an
  inbox: failed, needs you, working, unread, pinned, then the rest. Answer approvals and questions on the card,
  hold a thread beside the stack, start or branch a chat without leaving, switch a live chat''s model, and tune
  the 3D live. Desktop plugin (desktop/plugin.js inside the plugin SDK surface) plus a read-only dashboard
  backend that reads the session list from state.db. No network, no credentials, no agent tools, hooks,
  middleware or env vars.'
maintainer: latentJake
tier: community
category: desktop
