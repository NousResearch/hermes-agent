description: "24/7 AI multi-agent software engineering factory and durable SQLite Kanban board. Autonomous triage with EGM sequential spec audit, isolated Git worktrees, deterministic precommit pipeline, thematic continuous review, and Mem0 vector memory. Disclosure — runs background worker subprocesses using Hermes agent profiles (zf-orchestrator, zf-goldfish, zf-builder, zf-reviewer) operating inside dedicated Git worktrees; mounts a web dashboard at /zerofactory via FastAPI with an embedded SQLite database in WAL mode; executes deterministic precommit checks via .zerofactory/precommit.sh; optionally records repository memory via Mem0/Qdrant."
