name: zerofactory
version: "1.3.0"
repo: https://github.com/hotcode-dev/zerofactory
sha: a8e1e6308e10a74f98dd413f065e8cfd77a2e2d0
description: "24/7 AI multi-agent software engineering factory and durable SQLite Kanban board. Flexible triage with Grill Me clarification and EGM sequential spec audit, isolated Git worktrees, deterministic precommit pipeline, thematic continuous review, autonomous self-healing recovery, and Mem0 vector memory. Disclosure — once you turn on auto_start_dispatcher it runs background worker subprocesses using Hermes agent profiles (zf-orchestrator, zf-goldfish, zf-builder, zf-reviewer) inside dedicated Git worktrees that push branches and open pull requests on boards' repos; workers use the profiles' normal approval policy unless you enable allow_unattended_approvals (which passes --yolo and --accept-hooks); mounts a web dashboard at /zerofactory with an embedded SQLite database; workers run each project's .zerofactory/precommit.sh checks; optional Mem0/Qdrant repository memory (off by default) sends memory text to the LLM endpoint you configure."
maintainer: hotcode-dev
tier: community
category: automation
requires_hermes: ">=0.23.0"
docs_url: https://github.com/hotcode-dev/zerofactory#readme
readme: true
capabilities:
  provides_tools: []
  provides_hooks:
    - on_kanban_dispatch_tick
  provides_middleware: []
  requires_env: []

