description: "Plan, price and make AI micro dramas and anime episodes with the same characters in every shot through the hosted Ziztu MCP server (30 tools, Streamable HTTP at https://getziztu.com/mcp, OAuth 2.1 with PKCE through Hermes' MCP OAuth flow), plus four skills: micro drama series writing, viral faceless reels, YouTube Shorts and TikToks, faceless YouTube videos, and cinematic depth for image and video prompts. Agent Plugins v1 package (plugin.json + mcp.json + skills/). Disclosure — hosted connector: every tool call sends prompts, scripts and project data to getziztu.com under the user's Ziztu account (OAuth sign-in through Hermes' MCP OAuth flow). Tools that make frames, clips, music or scripts spend that account's credits (each takes max_credits, accepts dry_run, and the server asks for confirm above 5,000 credits); the package marks the server untrusted, so Hermes asks before every call that is not read-only. The tool list is served by the remote server at run time and is not covered by the pinned commit. The skills ship four standard-library Python helper scripts the agent may run: three read local text files (episode scripts, season grids, prompts) and one (split_season.py) writes per-episode .fountain files into a folder the agent names; no network calls, install scripts, bundled credentials, background processes or telemetry."
