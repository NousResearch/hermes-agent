description: "Plan, price and make AI micro dramas and anime episodes with the same characters in every shot through the hosted Ziztu MCP server (30 tools, Streamable HTTP at https://getziztu.com/mcp, OAuth 2.1 with PKCE through Hermes' MCP OAuth flow), plus four skills: micro drama series writing, viral faceless reels, YouTube Shorts and TikToks, faceless YouTube videos, and cinematic depth for image and video prompts. Agent Plugins v1 package (plugin.json + mcp.json + skills/). Disclosure: tool calls send prompts and project data to getziztu.com under the user's Ziztu account; tools that make frames, clips, music or scripts spend that account's credits (each takes max_credits, accepts dry_run and asks for confirm above 5,000 credits), and the package marks the server untrusted so Hermes asks before every call that is not read-only. The server's runtime tool set is outside the pinned commit. The skills include four standard-library Python helper scripts that check local text files (episode scripts, season grids, prompts) when the agent runs them; no network calls, install scripts, bundled credentials, background processes or telemetry."
