description: "Clip YouTube, Twitch and Kick streams into vertical 1080x1920 Shorts and Reels with word-timed captions, hook titles, facecam framing and campaign rules through Ziztu Clip Maker MCP (Streamable HTTP at https://getziztu.com/mcp/clips, OAuth 2.1 with PKCE), plus Ziztu YouTube Studio (https://getziztu.com/mcp/youtube), Reel Studio (https://getziztu.com/mcp/reel), micro dramas (https://getziztu.com/mcp) and five MIT skills (ziztu-clip-maker, ziztu-faceless-youtube, ziztu-viral-reels, ziztu-micro-drama, ziztu-cinematic-depth). Agent Plugins v1 package (plugin.json + mcp.json + skills/). Disclosure — hosted connector: every tool call sends links, prompts, scripts and project data to getziztu.com under the user's Ziztu account (OAuth sign-in through Hermes' MCP OAuth flow). Clip Maker calls show the exact cost in minutes first and require confirm: true; Studio tools take max_credits, accept dry_run, and require confirm above 5,000 credits. All servers are marked untrusted so Hermes asks before every non-read-only call. The tool list is served by the remote server at run time and is not covered by the pinned commit. The skills ship four standard-library Python helper scripts (three read local text files, one writes per-episode .fountain files); no network calls, install scripts, bundled credentials, background processes or telemetry."
