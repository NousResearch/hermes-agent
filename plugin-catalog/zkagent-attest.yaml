name: zkagent-attest
repo: https://github.com/MCPVOT/hermes-zkagent
sha: f962664c67116e90f578379b177c9d01c64141fd
description: "Prove what your agent did without revealing what it did: every tool call is recorded, the session is proved inside a signed cap, and one action can be disclosed on request. Replay protection spans both verification modes, so a receipt and the session that contains it cannot both be accepted."
maintainer: MCPVOT
tier: community
category: tools
requires_hermes: ">=0.22.5"
docs_url: "https://github.com/MCPVOT/hermes-zkagent#readme"
version: "0.5.8"
image: "https://raw.githubusercontent.com/MCPVOT/hermes-zkagent/f962664c67116e90f578379b177c9d01c64141fd/docs/assets/card.png"
screenshots:
  - "https://raw.githubusercontent.com/MCPVOT/hermes-zkagent/f962664c67116e90f578379b177c9d01c64141fd/docs/assets/demo-final.png"
  - "https://raw.githubusercontent.com/MCPVOT/hermes-zkagent/f962664c67116e90f578379b177c9d01c64141fd/assets/infographic-portrait.png"
platforms: [linux, macos, windows]
known_issues:
  - "8 actions per receipt (the circuit's slot count); longer sessions need several attestations"
  - "single-party trusted setup, development-grade, not a ceremony"
  - "the ledger is agent-authored: a tool call made outside Hermes is not recorded"
capabilities:
  provides_tools:
    - zkagent_status
    - zkagent_attest
    - zkagent_verify
    - zkagent_disclose
  provides_hooks:
    - post_tool_call
