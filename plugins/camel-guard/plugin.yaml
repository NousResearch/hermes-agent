name: camel-guard
version: "1.1.1"
manifest_version: 2
requires_hermes: ">=0.22.7"
description: "Opt-in CaMeL-style capability guard for untrusted tool data."
author: "nativ3ai"
license: MIT
homepage: "https://github.com/nativ3ai/hermes-camel-guard-plugin"
tags: [security, prompt-injection, guardrails]
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - on_session_end
  - on_session_reset
config_schema:
  mode:
    type: str
    default: "off"
    description: "off, monitor, or enforce; invalid values remain off"
  trace_enabled:
    type: bool
    default: false
    description: "Persist bounded metadata-only policy decisions"
  trace_max_events:
    type: int
    default: 200
    description: "Maximum persisted decision events per profile"
  classifier_timeout_seconds:
    type: float
    default: 12.0
    description: "Trusted-intent classifier timeout, clamped to 2-120 seconds"
  read_only_tools:
    type: list
    default: []
    description: "Operator-audited exact tool names exempt from effect gating; output stays untrusted"
  tool_capabilities:
    type: dict
    default: {}
    description: "Exact custom tool name to existing capability id; invalid entries are ignored"
