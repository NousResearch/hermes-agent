name: remote-user
version: 1.0.0
description: >
  Dashboard auth provider — trust an authenticated reverse proxy via the
  X-Remote-User / REMOTE_USER pattern. Auto-activates when at least one trusted
  proxy is configured (dashboard.remote_user.trusted_proxies in config.yaml, or
  HERMES_DASHBOARD_REMOTE_USER_TRUSTED_PROXIES in env). The proxy performs the
  real auth (Apache pwauth/basic, an SSO front-end) and sets X-Remote-User; this
  provider honors the header ONLY from a trusted proxy peer (IP/CIDR allowlist)
  and optionally also requires a shared-secret header, then vouches for the user
  so the dashboard never prompts a second login. The provider fails closed: it
  registers only when a trusted proxy is allowlisted, and declines any request
  whose peer is not allowlisted. This is the reference implementation of the
  DashboardAuthProvider.supports_request_auth capability.
author: Sean French (for Ryan)
kind: backend
requires_env:
  - HERMES_DASHBOARD_REMOTE_USER_TRUSTED_PROXIES