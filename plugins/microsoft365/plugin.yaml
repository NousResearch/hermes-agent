name: microsoft365
version: 0.1.0
description: "Microsoft 365 Plugin — one bundled plugin connecting Hermes to the broader Microsoft ecosystem: Outlook, SharePoint, OneDrive, Calendar, Teams, Planner and To Do."
author: NousResearch
kind: backend
python_dependencies:
  - "msgraph-sdk>=1.0.0,<2"
  - "azure-identity>=1.17.0,<2"
provides_tools:
  - microsoft365_preflight
config_schema:
  tenant_id:
    type: str
    required: true
    description: "Microsoft Entra tenant ID"
  client_id:
    type: str
    required: true
    description: "Microsoft Entra application/client ID"
  client_secret:
    type: str
    required: true
    description: "Microsoft Entra application secret (store as a secret)"
    secret: true
  user_id:
    type: str
    default: me
    description: "Graph user ID for user resources"
  capabilities:
    type: dict
    description: "Operation flags. Each service maps operation names to booleans; service=true enables all operations for backward compatibility."
    properties:
      outlook:
        type: dict
        description: "search, read"
      sharepoint:
        type: dict
        description: "search, read, download_files"
      onedrive:
        type: dict
        description: "search, read, download_files"
      calendar:
        type: dict
        description: "search"
      teams:
        type: dict
        description: "list_teams, list_channels"
      planner:
        type: dict
        description: "list_task_lists (Microsoft To Do; bounded read-only scope)"
