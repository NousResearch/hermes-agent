name: bale
label: Bale
kind: platform
version: 1.0.0
description: >
  Bale Messenger gateway adapter using Bale's Telegram-compatible Bot API.
  Supports long-polling inbound messages, text and media delivery, registry-owned
  authorization, YAML/env configuration, cron home-channel delivery, and standalone
  sends without core gateway changes.
author: Hermes Agent contributors
requires_env:
  - name: BALE_BOT_TOKEN
    description: "Bale bot token"
    prompt: "Bale bot token"
    url: "https://bale.ai"
    password: true
optional_env:
  - name: BALE_ALLOWED_USERS
    description: "Comma-separated Bale user IDs allowed to message the bot"
    prompt: "Allowed Bale user IDs"
    password: false
  - name: BALE_ALLOW_ALL_USERS
    description: "Allow any Bale user to message the bot (true/false)"
    prompt: "Allow all users?"
    password: false
  - name: BALE_HOME_CHANNEL
    description: "Default Bale chat ID for cron and notification delivery"
    prompt: "Home Bale chat ID"
    password: false
  - name: BALE_REQUIRE_MENTION
    description: "Require @bot mention in group chats (default: true)"
    prompt: "Require group mention?"
    password: false
  - name: BALE_API_BASE_URL
    description: "Bale Bot API base URL (default: https://tapi.bale.ai/bot)"
    prompt: "Bale Bot API base URL"
    password: false
  - name: BALE_FILE_BASE_URL
    description: "Bale file API base URL (default: https://tapi.bale.ai/file/bot)"
    prompt: "Bale file API base URL"
    password: false
  - name: BALE_POLL_TIMEOUT
    description: "Long-poll timeout in seconds (default: 25)"
    prompt: "Bale poll timeout"
    password: false
