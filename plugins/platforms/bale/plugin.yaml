name: bale-platform
label: Bale
kind: platform
version: 1.0.0
description: >
  Bale gateway adapter for Hermes Agent.
  Connects to Bale through its Bot API and relays messages
  between Bale chats/groups/topics and the Hermes agent. Supports threads/topics,
  streaming edits, native media, inline keyboards, slash commands, notification
  modes, mention gating, and per-user/chat allowlists.
author: Seyed Mohammad Reza Seyed Esmaeil
requires_env:
  - name: BALE_BOT_TOKEN
    description: "Bale bot token from @BotFather"
    prompt: "Bale bot token"
    url: "https://bale.ai"
    password: true
optional_env:
  - name: BALE_ALLOWED_USERS
    description: "Comma-separated Bale user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: BALE_ALLOW_ALL_USERS
    description: "Allow any Bale user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: BALE_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
  - name: BALE_HOME_CHANNEL_NAME
    description: "Display name for the Bale home channel"
    prompt: "Home channel display name"
    password: false
