name: line-platform
label: LINE
kind: platform
version: 1.0.0
description: >
  LINE Messaging API gateway adapter for Hermes Agent.
  Runs an aiohttp webhook server that receives LINE webhook events
  (with HMAC-SHA256 signature verification) and relays messages between
  LINE chats (1:1, groups, rooms) and the Hermes agent. Outbound replies
  prefer the free reply token and fall back to the metered Push API
  when the token has expired or is absent. Slow LLM responses surface a
  Template Buttons postback bubble so the user can fetch the answer with
  a fresh reply token (free) once it's ready.
author: Hermes Agent contributors
# ``requires_env`` and ``optional_env`` entries are surfaced in the
# ``hermes config`` UI via the platform-plugin env var injector in
# ``hermes_cli/config.py``.
requires_env:
  - name: LINE_CHANNEL_ACCESS_TOKEN
    description: "LINE channel long-lived access token (LINE Developers Console > Messaging API > Channel access token)"
    prompt: "LINE channel access token"
    url: "https://developers.line.biz/console/"
    password: true
  - name: LINE_CHANNEL_SECRET
    description: "LINE channel secret (used for HMAC-SHA256 webhook signature verification)"
    prompt: "LINE channel secret"
    url: "https://developers.line.biz/console/"
    password: true
optional_env:
  - name: LINE_PORT
    description: "Webhook listen port (default: 8646)"
    prompt: "Webhook port"
    password: false
  - name: LINE_HOST
    description: "Webhook bind host (default: unset → dual-stack, all interfaces IPv4+IPv6)"
    prompt: "Webhook host"
    password: false
  - name: LINE_PUBLIC_URL
    description: "Public HTTPS base URL for serving images/audio/video to LINE (e.g. https://my-tunnel.example.com). Required for media sending when the bind address is not directly reachable."
    prompt: "Public HTTPS base URL"
    password: false
  - name: LINE_ALLOWED_USERS
    description: "Comma-separated LINE user IDs allowed to DM the bot (U-prefixed)"
    prompt: "Allowed user IDs (comma-separated)"
    password: false
  - name: LINE_ALLOWED_GROUPS
    description: "Comma-separated LINE group IDs the bot will respond in (C-prefixed)"
    prompt: "Allowed group IDs (comma-separated)"
    password: false
  - name: LINE_ALLOWED_ROOMS
    description: "Comma-separated LINE room IDs the bot will respond in (R-prefixed)"
    prompt: "Allowed room IDs (comma-separated)"
    password: false
  - name: LINE_REQUIRE_MENTION_CHATS
    description: "Comma-separated group/room IDs (C…/R…) that reply only when the bot is @mentioned. Other allowlisted groups and rooms respond normally. DMs are never mention-gated."
    prompt: "Mention-required group/room IDs"
    help: "Example: Cxxxx,Rxxxx. Leave empty to reply in every allowlisted group and room without an @mention."
    placeholder: "Ex: Cxxxx,Rxxxx"
    password: false
    is_list: true
  - name: LINE_REPLY_WITHOUT_MENTION_MEDIA_TYPES
    description: "Comma-separated LINE message types that still get a reply in mention-required groups and rooms. Empty means no media bypasses the @mention."
    prompt: "Media types that skip @mention"
    help: "Works with LINE_REQUIRE_MENTION_CHATS. Example: image,video. Also accepts audio, file, sticker, location."
    placeholder: "Ex: image,video"
    password: false
  - name: LINE_IGNORE_GROUP_MESSAGE_TYPES
    description: "Comma-separated LINE message types silently ignored in groups and rooms, before the mention gate. Empty ignores nothing. DMs are never filtered. emoji means a text message that is only LINE emoji placeholders."
    prompt: "Group message types to ignore"
    help: "Example: sticker,emoji. Also accepts image, video, audio, file, location. Mixed text + emoji is not emoji."
    placeholder: "Ex: sticker,emoji"
    password: false
  - name: LINE_OBSERVED_UNMENTIONED_MESSAGES
    description: "Number of recent messages retained as background in each allowlisted mention-required group or room. Default 50, maximum 500."
    prompt: "Unmentioned messages to remember per chat"
    help: "Set 0 to disable. The next @mention or media-triggered reply includes unread messages for that session. Ignored types and media are kept as text only."
    placeholder: "Ex: 50"
    password: false
  - name: LINE_ALLOW_ALL_USERS
    description: "Allow any LINE user to talk to the bot (dev only — disables allowlist)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: LINE_HOME_CHANNEL
    description: "Default user/group/room ID for cron / notification delivery"
    prompt: "Home channel ID (or empty)"
    password: false
  - name: LINE_SLOW_RESPONSE_THRESHOLD
    description: "Seconds before the slow-LLM postback button fires (default: 45; set 0 to disable and always Push-fallback)"
    prompt: "Slow response threshold (seconds)"
    password: false
# Channels → LINE field order. Names listed here render first, directly after
# the group/room allowlists; any other LINE_* vars discovered from
# requires_env / optional_env follow. Metadata (prompt, help, placeholder)
# comes from the entries above.
dashboard_env_vars:
  - LINE_CHANNEL_ACCESS_TOKEN
  - LINE_CHANNEL_SECRET
  - LINE_ALLOWED_USERS
  - LINE_ALLOWED_GROUPS
  - LINE_ALLOWED_ROOMS
  - LINE_REQUIRE_MENTION_CHATS
  - LINE_REPLY_WITHOUT_MENTION_MEDIA_TYPES
  - LINE_IGNORE_GROUP_MESSAGE_TYPES
  - LINE_OBSERVED_UNMENTIONED_MESSAGES
