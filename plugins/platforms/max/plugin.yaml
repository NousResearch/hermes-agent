name: max-platform
label: MAX (Russian Messenger)
kind: platform
version: 0.20.0
description: >
  MAX messenger gateway adapter for Hermes Agent (Russia).
  Connects to MAX via Long Polling (GET /updates) and sends replies via
  POST /messages. Uses the official MAX API (platform-api2.max.ru) with
  Russian Trusted Root CA certificates. Requires a verified business
  profile on MAX for Partners to create a bot.
author: Hermes Agent + Артур
requires_env:
  - name: MAX_BOT_TOKEN
    description: "MAX bot token from business.max.ru (Чат-боты → Расширенные настройки → Настроить)"
    prompt: "MAX bot token"
    password: true
optional_env:
  - name: MAX_ALLOWED_USERS
    description: "Comma-separated MAX user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: MAX_ALLOW_ALL_USERS
    description: "Allow any MAX user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: MAX_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
  - name: MAX_CA_CERT_PATH
    description: "Path to Russian Trusted Root CA cert (PEM) for MAX API TLS"
    prompt: "Path to Russian Trusted Root CA cert"
    password: false
