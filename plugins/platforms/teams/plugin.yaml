name: teams-platform
label: Microsoft Teams
kind: platform
version: 1.0.0
description: >
  Microsoft Teams gateway adapter for Hermes Agent.
  Connects to Microsoft Teams via the Bot Framework and relays messages
  between Teams chats (personal DMs, group chats, channel posts) and
  the Hermes agent. Supports Adaptive Card approval prompts, file
  consent / Graph uploads, reactions, and edit-based reply streaming.
author: Aamir Jawaid
# ``requires_env`` entries are surfaced in ``hermes config`` UI via the
# platform-plugin env var injector in ``hermes_cli/config.py``.
requires_env:
  - name: TEAMS_CLIENT_ID
    description: "Azure AD application (Bot Framework) client ID"
    prompt: "Teams / Azure AD client ID"
    url: "https://portal.azure.com/"
    password: false
  - name: TEAMS_CLIENT_SECRET
    description: "Azure AD application client secret"
    prompt: "Teams / Azure AD client secret"
    url: "https://portal.azure.com/"
    password: true
  - name: TEAMS_TENANT_ID
    description: "Azure AD tenant ID hosting the bot application"
    prompt: "Teams / Azure AD tenant ID"
    password: false
optional_env:
  - name: TEAMS_PORT
    description: "Webhook listen port (Bot Framework default: 3978)"
    prompt: "Webhook port"
    password: false
  - name: TEAMS_HOST
    description: "Webhook bind host (default: unset → dual-stack, all interfaces IPv4+IPv6)"
    prompt: "Webhook host"
    password: false
  - name: TEAMS_ALLOWED_USERS
    description: "Comma-separated Teams user IDs / UPNs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: TEAMS_ALLOW_ALL_USERS
    description: "Allow any Teams user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: TEAMS_REQUIRE_MENTION
    description: "Only answer channel/group-chat messages that @mention the bot or reply to it (default false; needed once the app has RSC message-read consent)"
    prompt: "Require @mention in channels and group chats? (true/false)"
    password: false
  - name: TEAMS_OBSERVE_UNMENTIONED
    description: "When require_mention is on, store un-@mentioned channel/group messages as observed transcript context (default true). No-op without RSC; set false to silently drop."
    prompt: "Observe unmentioned channel chatter as context? (true/false)"
    password: false
  - name: TEAMS_REACTIONS
    description: "Add processing-status emoji reactions (👀 while working, ✅/❌ on complete). Default true. Agent send_message react/unreact is always available."
    prompt: "Enable processing-status reactions? (true/false)"
    password: false
  - name: TEAMS_HOME_CHANNEL
    description: "Default chat/channel ID for cron / notification delivery"
    prompt: "Home channel (or empty)"
    password: false
  - name: TEAMS_HOME_CHANNEL_NAME
    description: "Display name for the Teams home channel"
    prompt: "Home channel display name"
    password: false
  - name: MSGRAPH_TENANT_ID
    description: "Graph tenant ID for channel/group file upload and inbound HTML-only file GET (falls back to TEAMS_TENANT_ID when the bot app has Files.ReadWrite.All)"
    prompt: "Microsoft Graph tenant ID (optional if TEAMS_* is the same app)"
    password: false
  - name: MSGRAPH_CLIENT_ID
    description: "Graph application (client) ID for channel/group file upload and inbound downloadUrl fallback (falls back to TEAMS_CLIENT_ID)"
    prompt: "Microsoft Graph client ID (optional if TEAMS_* is the same app)"
    password: false
  - name: MSGRAPH_CLIENT_SECRET
    description: "Graph client secret for channel/group file upload and inbound downloadUrl fallback (falls back to TEAMS_CLIENT_SECRET)"
    prompt: "Microsoft Graph client secret (optional if TEAMS_* is the same app)"
    password: true
