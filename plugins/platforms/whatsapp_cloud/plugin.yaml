name: whatsapp_cloud-platform
label: WhatsApp Business (Cloud)
kind: platform
version: 1.0.0
description: >
  WhatsApp Business Cloud API adapter for Hermes Agent.
  Connects to WhatsApp via Meta's official Cloud API (Business account and a
  public webhook URL required, token-based auth): Graph API for outbound,
  an aiohttp webhook receiver with X-Hub-Signature-256 verification for
  inbound. Supports text, media (image/video/audio/document), voice notes,
  interactive buttons, and DM allowlists. Complements the Baileys bridge
  (whatsapp) plugin; both share WhatsAppBehaviorMixin.
author: NousResearch
requires_env:
  - name: WHATSAPP_CLOUD_PHONE_NUMBER_ID
    description: "WhatsApp phone number ID from the Meta App Dashboard (WhatsApp → API Setup)"
    prompt: "WhatsApp Cloud phone number ID"
    password: false
  - name: WHATSAPP_CLOUD_ACCESS_TOKEN
    description: "System User permanent access token"
    prompt: "WhatsApp Cloud access token"
    password: true
optional_env:
  - name: WHATSAPP_CLOUD_APP_SECRET
    description: "App secret — HMAC key for X-Hub-Signature-256 webhook verification"
    prompt: "WhatsApp Cloud app secret"
    password: true
  - name: WHATSAPP_CLOUD_VERIFY_TOKEN
    description: "Shared secret for the webhook verification handshake (hub.verify_token)"
    prompt: "WhatsApp Cloud verify token"
    password: true
  - name: WHATSAPP_CLOUD_APP_ID
    description: "Meta app ID (optional)"
    prompt: "WhatsApp Cloud app ID"
    password: false
  - name: WHATSAPP_CLOUD_WABA_ID
    description: "WhatsApp Business Account ID; when set, inbound webhooks must match it"
    prompt: "WhatsApp Business Account ID"
    password: false
  - name: WHATSAPP_CLOUD_WEBHOOK_HOST
    description: "Webhook bind host (unset = dual-stack all interfaces)"
    prompt: "Webhook host"
    password: false
  - name: WHATSAPP_CLOUD_WEBHOOK_PORT
    description: "Webhook bind port (default: 8090)"
    prompt: "Webhook port"
    password: false
  - name: WHATSAPP_CLOUD_WEBHOOK_PATH
    description: "Webhook path (default: /whatsapp/webhook)"
    prompt: "Webhook path"
    password: false
  - name: WHATSAPP_CLOUD_API_VERSION
    description: "Graph API version (default: v20.0)"
    prompt: "Graph API version"
    password: false
  - name: WHATSAPP_CLOUD_ALLOWED_USERS
    description: "Comma-separated WhatsApp phone numbers allowed to talk to the bot"
    prompt: "Allowed phone numbers (comma-separated)"
    password: false
  - name: WHATSAPP_CLOUD_ALLOW_ALL_USERS
    description: "Allow any WhatsApp user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: WHATSAPP_CLOUD_DM_POLICY
    description: "DM policy: open | allowlist | disabled (falls back to WHATSAPP_DM_POLICY)"
    prompt: "DM policy"
    password: false
  - name: WHATSAPP_CLOUD_HOME_CHANNEL
    description: "Default phone number for cron / notification delivery"
    prompt: "Home channel phone number"
    password: false
