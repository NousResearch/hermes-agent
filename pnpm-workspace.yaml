packages:
  - apps/*
  - ui-tui
  - ui-tui/packages/*
  - web
  - tests-js

engineStrict: true

# The pnpm pin lives in pm/lock.json. The root preinstall and scripts/build/node-deps.mjs refuse
# any other pnpm; root engines.pnpm (^12) makes pnpm <= 11 refuse even without scripts. A re-pin
# to another pnpm major must move that range too (tests-js/pnpm-pin-guard.test.mjs fails until
# it does). A pin pnpm recorded in pnpm-lock.yaml would prepend a second YAML document that
# lockfile scanners (osv-scanner) do not read past.
pmOnFail: ignore

# `pnpm run` never installs: installs belong to scripts/build/node-deps.mjs (and CI's explicit steps).
verifyDepsBeforeRun: false

# @electron/rebuild and the node-pty spawn-helper chmod modify installed packages in place; keep
# those writes out of the shared, hardlinked store.
sideEffectsCache: false

# A dependency build script that is not reviewed below fails the install instead of being skipped.
strictDepBuilds: true

# Minutes (14 days). Checked whenever the lockfile is resolved; user-machine installs trust the
# already-checked lockfile (--trust-lockfile).
minimumReleaseAge: 20160
# Exemptions are exact `name@version` entries, one per line with the reason it cannot wait as an
# inline comment (`- name@1.2.3  # why`). `hermes pm update --pnpm` drops an entry once the lockfile
# no longer holds that version, so none needs a removal date. pnpm's own
# minimumReleaseAgeExcludePrune stays off: it would run on every install and rewrite this tracked
# file on users' machines.
minimumReleaseAgeExclude:
  - pele@1.13.0  # the desktop diagram swap was parity-checked on it (math labels need 1.8.0+)

overrides:
  '@electron/osx-sign>isbinaryfile': 5.0.7
  lodash: 4.18.1
  protobufjs: '^8.7.1'
  brace-expansion: 5.0.12
  dompurify: 3.4.17
  katex: 0.19.0
  ip-address: 10.7.4
  nanoid@^3: 3.3.20
  nanoid@^6: 6.0.2
  js-yaml@^4: 4.3.2
  undici@^6: 6.29.1
  undici@^7: 7.30.1
  postcss: 8.5.29
  postcss-selector-parser: 7.1.6
  tar: 7.5.22
  source-map-js: 1.2.2
  yaml: 2.9.1
  vitest: 4.1.12
  '@vitest/mocker': 4.1.12

allowBuilds:
  unicode-animations: false
  esbuild@0.28.2: true
  node-pty@1.1.0: true
  electron-winstaller@5.4.0: true
  fsevents@2.3.3: true
  # get-windows is a regular dependency because pnpm >= 11.6 infers os: [win32] from the name of an
  # optional one and skips it on macOS and Linux (pnpm/pnpm#17774). Its install script only fetches the
  # win32 binding, falling back to a node-gyp build that fails where no prebuilt exists (win32-arm64,
  # Linux without a compiler) and, for a regular dependency, fails the whole install.
  # stage-native-deps.mjs runs that installer itself on win32 and degrades when it fails (dev runs:
  # apps/desktop/scripts/dev-get-windows.mjs). Keyed by name: the denial holds for every version.
  get-windows: false
  lefthook@2.2.1: true
