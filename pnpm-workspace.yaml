packages:
  - apps/*
  - ui-tui
  - ui-tui/packages/*
  - web
  - tests-js

engineStrict: true

# The pinned pnpm (root package.json devEngines, kept equal to pm/lock.json) is enforced by
# scripts/build/node-deps.mjs. Recording the pin in pnpm-lock.yaml would prepend a second YAML
# document that lockfile scanners (osv-scanner) do not read past.
pmOnFail: ignore

# `pnpm run` never installs: installs belong to scripts/build/node-deps.mjs (and CI's explicit steps).
verifyDepsBeforeRun: false

# @electron/rebuild and the node-pty spawn-helper chmod modify installed packages in place; keep
# those writes out of the shared, hardlinked store.
sideEffectsCache: false

# A dependency build script that is not reviewed below fails the install instead of being skipped.
strictDepBuilds: true

# Minutes (14 days). Checked whenever the lockfile is resolved; user-machine installs trust the
# already-checked lockfile (--trust-lockfile).
minimumReleaseAge: 20160
minimumReleaseAgeExclude:
  # allow assistant-ui packages & a couple specific deps since they update a LOT.
  # remove this when we stabilize (or we haven't updated in 2 wks)
  - '@assistant-ui/*'
  - assistant-cloud
  - assistant-stream
  - '@radix-ui/*'
  - radix-ui
  - safe-content-frame

  # react-router 8.3.0 includes fixes for vulns. remove this when 8.3.0 is > 2wks old.
  - react-router

  # eslint 10.8.0 includes fixes for vulns. remove this when 10.8.0 is > 2wks old.
  - eslint
  - '@eslint/*'

  # tar 7.5.21 includes fixes for vulns. remove this when 7.5.21 is > 2wks  old
  - tar

  # concurrently 10.0.4 includes fixes for vulns. remove this when 10.0.4 is > 2wks  old
  - concurrently

  # fast-uri 3.1.4 includes fixes for vulns. remove this when 3.1.4 is > 2wks  old
  - fast-uri

  # minimatch 10.2.6 includes fixes for vulns. remove this when 10.2.6 is > 2wks  old
  - minimatch

  # brace-expansion 5.0.9 includes fixes for vulns. remove this when 5.0.9 is > 2wks  old
  - brace-expansion

  # js-yaml 4.3.1 includes fixes for GHSA-5p4m-2wfm-xmqj. remove when > 2wks old (rel 2026-07-31)
  - js-yaml

  # nanoid 3.3.17 includes fixes for GHSA-2v37-7h3g-55p8. remove when > 2wks old (rel 2026-08-03)
  - nanoid

  # dompurify 3.4.17 fixes GHSA-55q2-fjhq-7xh7 follow-ups (low). remove when 3.4.17 is > 2wks old (rel 2026-10-12)
  - dompurify

  # ink needs
  - lightningcss
  - postcss

  # source-map-js 1.2.2 fixes GHSA-68fv-2mgg-jv7q (high, event-loop DoS). remove when 1.2.2 is > 2wks old (rel 2026-09-30)
  - source-map-js

  # http-cache-semantics 4.3.0 fixes GHSA-ch52-4w7c-c8xp (high, cross-user cached data disclosure).
  # remove when 4.3.0 is > 2wks old (rel 2026-10-04)
  - http-cache-semantics

  # ip-address 10.7.4 fixes GHSA-8xj3-p8x2-m3c7-family alerts (medium). remove when 10.7.4 is > 2wks old (rel 2026-10-11)
  - ip-address

  # sanitize-html 2.18.1 fixes GHSA-c9rx-x947-fp3h (medium), introduced by 2.18.0 which fixes
  # GHSA-x3q4-9hxx-gx8m/GHSA-cv27-6wvh-8x7j/GHSA-374f-7chj-9948. remove when 2.18.1 is > 2wks old (rel 2026-10-14)
  - sanitize-html

  # vitest 4.1.12 is a patch bump (4.1.11 -> 4.1.12). remove when 4.1.12 is > 2wks old (rel 2026-10-15)
  - vitest
  - '@vitest/*'

  # electron 44.9.3 backports upstream Chromium/V8 security fixes, and 44.9.1+ carries the
  # eMudhra root distrust per #142533. remove when 44.9.3 is > 2wks old (rel 2026-10-21)
  - electron

  # pele 1.13.0 is the release the desktop diagram swap was measured and parity-checked on (math
  # labels need 1.8.0+). remove when 1.13.0 is > 2wks old (rel 2026-10-31)
  - pele

overrides:
  '@electron/osx-sign>isbinaryfile': 5.0.7
  lodash: 4.18.1
  protobufjs: '^8.7.1'
  brace-expansion: 5.0.12
  dompurify: 3.4.17
  katex: 0.19.0
  ip-address: 10.7.4
  nanoid@^3: 3.3.20
  nanoid@^6: 6.0.2
  js-yaml@^4: 4.3.2
  undici@^6: 6.29.1
  undici@^7: 7.30.1
  postcss: 8.5.29
  postcss-selector-parser: 7.1.6
  tar: 7.5.22
  source-map-js: 1.2.2
  yaml: 2.9.1
  vitest: 4.1.12
  '@vitest/mocker': 4.1.12

allowBuilds:
  unicode-animations: false
  esbuild@0.28.2: true
  node-pty@1.1.0: true
  electron-winstaller@5.4.0: true
  fsevents@2.3.3: true
  get-windows@9.3.0: true
  lefthook@2.2.1: true
