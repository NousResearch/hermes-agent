

[project]
name = "hermes-agent"
version = "0.20.0"
description = "The self-improving AI agent — creates skills from experience, improves them during use, and runs anywhere"
readme = "README.md"
# Upper bound is load-bearing, not cosmetic. uv resolves the project's
# Python from `requires-python`, and an inherited `UV_PYTHON` env var (or a
# fresh distro whose newest interpreter uv auto-picks) will otherwise select
# 3.14, where Rust-backed transitives (e.g. pydantic-core) have no cp314
# wheel yet and fall back to a maturin source build that fails. Capping at
# <3.14 makes uv refuse 3.14 with a clear error instead of attempting that
# build. Raise the ceiling once our Rust transitives ship cp314 wheels.
requires-python = ">=3.11,<3.14"
authors = [{ name = "Nous Research" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  # Core — every direct dep is exact-pinned to ==X.Y.Z (no ranges).
  # Rationale: ranges allow PyPI to ship a fresh version of a transitive
  # at any time without a code review on our side. Exact pins mean the
  # only way a new package version reaches a user is via an intentional
  # update on our end (bump the pin in this file, regenerate uv.lock).
  # The Mini Shai-Hulud worm shows why. It reached mistralai 2.4.6 on
  # PyPI. A range such as `mistralai>=2.3.0,<3` accepts that release, so
  # each install in the hours before the quarantine would have taken it.
  # An exact pin does not.
  #
  # When updating: bump the version below AND regenerate uv.lock with
  # `uv lock` so the transitive resolution stays consistent. Don't
  # introduce ranges back without a written justification.
  #
  # Scope rule: only packages used by EVERY hermes session belong here.
  # Anything that's provider-specific (`anthropic`, `firecrawl-py`,
  # `exa-py`, `fal-client`, `edge-tts`, `parallel-web`) belongs in an
  # extra and gets lazy-installed via `tools/lazy_deps.py` when the
  # user picks that backend. Smaller `dependencies` = smaller blast
  # radius for the next supply-chain attack.
  "openai==2.24.0",
  "certifi==2026.5.20",
  "python-dotenv==1.2.2",
  "fire==0.7.1",
  "httpx[socks]==0.28.1",
  "rich==14.3.3",
  "tenacity==9.1.4",
  "pyyaml==6.0.3",
  "ruamel.yaml==0.18.17",
  "requests==2.33.0",  # CVE-2026-25645
  "jinja2==3.1.6",
  # Bumped from 2.12.5 to 2.13.4 to pull in pydantic-core 2.46.4.
  # pydantic-core 2.41.5 (pulled by 2.12.5) segfaults when the OpenAI SDK's
  # Responses API resource is exercised from a non-main thread, which is the
  # codex_responses dispatch in agent/chat_completion_helpers.py:_call.
  "pydantic==2.13.4",
  # Interactive CLI (prompt_toolkit is used directly by cli.py)
  "prompt_toolkit==3.0.52",
  # Cron scheduler (built-in feature — scheduled cron/interval jobs use croniter).
  "croniter==6.0.0",
  # ``packaging`` is imported directly on three production paths but was never
  # declared, so it only reached users transitively (pip/uv pull it for other
  # tools). The slim official Docker image ships without it, where the
  # try/except-ImportError fallbacks silently degrade: Hindsight's
  # ``_meets_minimum_version`` disables update_mode='append' (#40503),
  # tools/lazy_deps.py treats every version constraint as satisfied, and
  # hermes_cli/main.py drops to naive requirement parsing. Pure-Python
  # py3-none-any wheel, no compiled extensions — safe to ship everywhere.
  # Pinned to the version already resolved in uv.lock (no resolution churn).
  "packaging==26.0",
  # Markdown -> HTML conversion for rich message delivery (Matrix
  # `formatted_body`, and the `send_message` tool's HTML path). Now on the
  # DEFAULT delivery path, not matrix-specific: without it both
  # gateway/platforms/matrix.py and tools/send_message_tool.py silently fall
  # back to plain text, so cron/agent deliveries render raw `##`/`**`/tables
  # in clients like Element (see #32486). Pure-Python py3-none-any wheel
  # (~108KB, no compiled extensions, no platform constraints), so unlike the
  # matrix extra's `mautrix`/`python-olm` it's safe to ship everywhere — keeps
  # it out of the lazy-install path that exists only for the heavy matrix deps.
  "Markdown==3.10.2",
  # Skills Hub (GitHub App JWT auth — optional, only needed for bot identity)
  "PyJWT[crypto]==2.13.0",  # PYSEC-2026-175/177/178/179
  # urllib3 2.7.0 fixes GHSA-mf9v-mfxr-j63j (decompression-bomb bypass)
  # and GHSA-qccp-gfcp-xxvc (header leak across origins).
  "urllib3>=2.7.0,<3",
  # PyJWT[crypto] pulls cryptography in transitively. Pin it here as well, so
  # that the WeCom and Weixin crypto paths cannot fall below the patched
  # version. 50.0.0 is the floor: it fixes CVE-2026-69247, a Bleichenbacher
  # oracle in PKCS#7 EnvelopedData, and 49.0.0 fixed GHSA-m2h6-j472-rp4c,
  # where a wildcard DNS name escapes permittedSubtrees, and
  # GHSA-jwv3-5hgf-82ww, exponential path-building on duplicate self-signed
  # intermediates.
  #
  # A pin here is not sufficient on its own. alibabacloud-tea-openapi caps
  # cryptography<49, so [tool.uv] also holds an override. Read that comment
  # before you move this version.
  "cryptography==50.0.0",  # CVE-2026-69247, GHSA-m2h6-j472-rp4c, GHSA-jwv3-5hgf-82ww, CVE-2026-39892, CVE-2026-34073, GHSA-537c-gmf6-5ccf
  # Windows has no IANA tzdata shipped with the OS, so Python's ``zoneinfo``
  # (PEP 615) raises ``ZoneInfoNotFoundError`` for every non-UTC timezone
  # out of the box.  ``tzdata`` ships the Olson database as a data package
  # Python resolves automatically.  No-op on Linux/macOS (which have
  # /usr/share/zoneinfo).  Credits: PR #13182 (@sprmn24).
  "tzdata==2025.3; sys_platform == 'win32'",
  # Cross-platform process / PID management.  `psutil` is the canonical
  # answer for "is this PID alive" and process-tree walking across Linux,
  # macOS and Windows.  It replaces POSIX-only idioms like `os.kill(pid, 0)`
  # (which is a silent killer on Windows — see CONTRIBUTING.md) and
  # `os.killpg` (which doesn't exist on Windows).
  "psutil==7.2.2",
  # Browser CDP supervisor + browser_dialog import this directly. Keep core
  # so browser tool discovery doesn't fail on lean installs.
  "websockets==15.0.1",
  # .gitignore-aware file matching for desktop build stamp.
  "pathspec==1.1.1",
  "fastapi>=0.104.0,<1",
  "uvicorn[standard]>=0.24.0,<1",
  # Streaming multipart uploads for the dashboard file manager (NS-501).
  # FastAPI's UploadFile/Form depend on python-multipart; it is NOT pulled in
  # by fastapi itself, so the dashboard's multipart upload endpoint would 500
  # without an explicit dependency here (and in the `web` extra below).
  "python-multipart>=0.0.9,<1",
  "ptyprocess>=0.7.0,<1; sys_platform != 'win32'",
  "pywinpty>=2.0.0,<3; sys_platform == 'win32'",
  # Desktop SSH's Windows remote runtime (hermes_cli/windows_ssh_runtime.py)
  # imports win32security/win32file/etc. directly — declare pywin32 rather than
  # relying on the concurrent-log-handler → portalocker transitive chain.
  "pywin32>=306,<312; sys_platform == 'win32'",
  # Image resize recovery for the vision tools. Pillow shrinks oversized images
  # (>5 MB or >8000px) at embed time; without it the byte AND pixel-dimension
  # shrink paths no-op, so an oversized image bakes into immutable history and
  # bricks the session on Anthropic's non-retryable 400. Pure-wheel, no system
  # libs required for the codecs we use, so it's safe to ship in the base
  # install rather than gating it behind an extra + a mid-session lazy install
  # (which deadlocked the CLI under prompt_toolkit — see #40490).
  "Pillow==12.3.0",
  # Windows log rotation. Stdlib ``RotatingFileHandler.doRollover()`` uses
  # ``os.rename()`` which fails with ``PermissionError [WinError 32]`` on
  # Windows whenever any other process holds an append-mode handle on
  # ``agent.log`` (always the case in Hermes — TUI, gateway, ``hy_memory``
  # server, MCP servers, and on-demand CLI commands all log from separate
  # processes), pinning ``agent.log`` at the 5 MiB threshold and spamming
  # stderr on every emit (see #44873). ``concurrent-log-handler`` wraps the
  # rename in a cross-process file lock (via ``portalocker``: pywin32 on
  # Windows) so only one process rotates at a time. ``hermes_logging.py``
  # aliases it ONLY on Windows — POSIX renames an open file fine, so stdlib
  # already works there and managed-mode perms depend on its exact lifecycle.
  # Hence the ``sys_platform == 'win32'`` marker: the dep (and its portalocker
  # / pywin32 tree) ships only where it's actually used.
  "concurrent-log-handler==0.9.29; sys_platform == 'win32'",
  # First-party lifecycle and shared-metrics runtime. Relay 0.6 is the minimum
  # lossless provider-codec contract. Managed calls pass request/response data
  # through this native module in-process; shared metrics installs no network
  # exporter and consumes only its bounded projection. Relay publishes wheels
  # only (no sdist), so this marker must stay false anywhere no wheel tag can
  # match — otherwise installing Python dependencies fails resolution outright
  # instead of falling back to the no-op Relay host (#76469, Termux).
  # Termux Python reports plain linux/aarch64 but runs on Bionic
  # libc, which satisfies neither manylinux nor musllinux, hence the
  # `'android' not in platform_release` guard on the linux arms: Android GKI
  # kernels embed "-androidNN-" in the kernel release string. (Official PEP
  # 738 CPython reports sys_platform == 'android' and never matched.) Pre-GKI
  # devices can still slip through; they get the same resolution failure as
  # before, worked around by installing with `--no-deps` or an older release.
  "nemo-relay>=0.7.1,<0.8; (sys_platform == 'darwin' and platform_machine == 'arm64') or (sys_platform == 'linux' and platform_machine == 'x86_64' and 'android' not in platform_release) or (sys_platform == 'linux' and platform_machine == 'aarch64' and 'android' not in platform_release) or (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'win32' and platform_machine == 'ARM64')",
]

[project.optional-dependencies]

# --------------------------------------------------------------------------
# Model providers
#
# An extra for each inference backend that needs its own SDK. Each one
# installs at first use, so a quarantined release of one SDK cannot stop a
# fresh install of Hermes.
# --------------------------------------------------------------------------
# Native Anthropic provider — only needed when provider=anthropic (not via
# OpenRouter or other aggregators).
anthropic = ["anthropic==0.87.0"]  # CVE-2026-34450, CVE-2026-34452
bedrock = ["boto3==1.42.89"]
# Vertex AI provider. It needs google-auth and no API client. This extra is
# separate from [google], the Workspace skill stack, so that the provider
# does not install the full Workspace SDK. pyasn1 has the same patched
# version as [google], because google-auth permits older versions with
# known faults.
vertex = ["google-auth==2.55.1", "pyasn1==0.6.4"]
# Voxtral STT and TTS. The `mistralai` project on PyPI carried a malicious
# release once (the Mini Shai-Hulud worm), so this pin must stay exact and
# must name a version that someone checked.
#
# It installs at first use, through tools/lazy_deps.py (stt.mistral and
# tts.mistral). Keep it out of [all]: a quarantined release must not stop a
# fresh install.
mistral = ["mistralai==2.4.8"]
azure-identity = ["azure-identity==1.25.3"]

# --------------------------------------------------------------------------
# Search, web and media tools
#
# Backends for the search, scrape and media tools. Each one is opt-in.
# --------------------------------------------------------------------------
# Web search backends — each only loaded when the user picks it as their
# search provider (configured via `hermes tools` or config.yaml).
exa = ["exa-py==2.10.2"]
firecrawl = ["firecrawl-py==4.17.0"]
parallel-web = ["parallel-web==0.4.2"]
youtube = [
  # Required by skills/media/youtube-content and
  # optional-skills/productivity/memento-flashcards (youtube_quiz.py).
  # Without this declaration uv sync omits the package and both skills fail
  # at first invocation with ModuleNotFoundError (issue #22243).
  "youtube-transcript-api==1.2.4",
]
# `hermes dashboard` (localhost SPA + API).  Not in core to keep the default install lean.
# starlette==1.3.1 pinned for CVE-2026-48710 (BadHost) — fastapi pulls Starlette
# transitively and pre-1.0.1 is the vulnerable range. See the mcp extra above.
web = ["fastapi==0.133.1", "uvicorn[standard]==0.41.0", "starlette==1.3.1", "python-multipart==0.0.32"]

# --------------------------------------------------------------------------
# Speech, audio and the wake word
#
# Speech to text, text to speech, and the on-device wake word. The engines
# under [voice] and [wake] capture from a microphone through libportaudio2,
# so a container cannot run them. [silk] is different: it is a codec for
# voice notes that arrive over the network, and it needs no audio hardware.
# --------------------------------------------------------------------------
tts-premium = ["elevenlabs==1.59.0"]
# Edge TTS — default TTS provider but still optional (users can pick
# ElevenLabs / OpenAI / MiniMax instead).
edge-tts = ["edge-tts==7.2.7"]
# SILK audio decode for WeChat/WeCom voice messages (stt.silk).
silk = ["pilk==0.2.4"]
# Audio input for local STT and for the wake word. This is a separate extra
# so that [voice] and the wake engines can contain it. Do not repeat these
# two pins in each of those extras.
audio-io = [
  "sounddevice==0.5.5",
  "numpy==2.4.3",
]
# faster-whisper on its own. It transcribes audio FILES and needs no
# microphone and no PortAudio. It is separate from [voice] so the Docker
# image can bake it (voice notes arrive over the network) and so
# stt.faster_whisper does not pull the microphone stack in.
stt-whisper = [
  # Local STT pulls in wheel-only transitive deps (ctranslate2, onnxruntime).
  "faster-whisper==1.2.1",
]
# The microphone stack on top of [stt-whisper].
voice = [
  "hermes-agent[stt-whisper]",
  "hermes-agent[audio-io]",
]
# "Hey Hermes" wake word — on-device hotword detection. All engines are
# optional; openWakeWord (ONNX) is the free default, sherpa-onnx adds
# open-vocabulary phrases (any typed phrase, zero training), Porcupine is
# the premium alternative. Desktop installs ([--include-desktop]) eager-install
# [wake]+[voice] so the ear works instantly; CLI-only installs lazy-install on
# first /wake; mirrored in tools/lazy_deps.py.
#
# Each engine has its own extra, so a lazy install gets only the engine that
# the user selected. LAZY_DEPS in tools/lazy_deps.py maps
# wake.openwakeword, wake.sherpa and wake.porcupine to these extras.
# `[wake]` contains them all, for an install that wants each engine.
wake-openwakeword = [
  "hermes-agent[audio-io]",
  "openwakeword==0.6.0",
  "onnxruntime==1.27.0",
]
# openWakeWord's onnx embedding model scores near-zero on macOS ARM64
# (dscripka/openWakeWord#336), so the wake word runs on tflite there.
# Upstream declares tflite-runtime for Linux only; ai-edge-litert is the
# macOS equivalent, bridged in tools/wake_word.py.
#
# The marker belongs on the pin, not on the reference in [wake]. A reader
# of this extra can then see where the package applies, and lazy_deps skips
# it on a host where the marker is false.
wake-tflite = ["ai-edge-litert==2.1.6; platform_system == 'Darwin'"]
wake-sherpa = [
  "hermes-agent[audio-io]",
  "sherpa-onnx==1.13.4",
  "sentencepiece==0.2.2",
]
wake-porcupine = [
  "hermes-agent[audio-io]",
  "pvporcupine==4.0.3",
]
wake = [
  "hermes-agent[wake-openwakeword]",
  "hermes-agent[wake-sherpa]",
  "hermes-agent[wake-porcupine]",
  "hermes-agent[wake-tflite]",
]

# --------------------------------------------------------------------------
# Image generation
# --------------------------------------------------------------------------
# Image generation backends
fal = ["fal-client==0.13.1"]

# --------------------------------------------------------------------------
# Messaging platforms
#
# One extra for each gateway adapter, so tools/lazy_deps.py installs only
# the platform that the user enabled. `[messaging]` contains the three that
# a default install wants.
#
# aiohttp carries its patched version in each extra that pulls it in.
# discord.py, slack-bolt, mautrix and aiohttp-socks each set an upper limit
# and no lower one, so an installed aiohttp with a known fault would still
# meet their requirement.
# --------------------------------------------------------------------------
telegram = ["python-telegram-bot[webhooks]==22.6"]
discord = ["discord.py[voice]==2.7.1", "brotlicffi==1.2.0.1", "aiohttp==3.14.3"]
slack = ["slack-bolt==1.29.0", "slack-sdk==3.43.0", "aiohttp==3.14.3"]
messaging = [
  "hermes-agent[telegram]",
  "hermes-agent[discord]",
  "hermes-agent[slack]",
  "qrcode==7.4.2",
]
matrix = ["mautrix[encryption]==0.21.0", "aiosqlite==0.22.1", "asyncpg==0.31.0", "aiohttp-socks==0.11.0", "aiohttp==3.14.3"] # aiohttp pinned to upgrade past CVEs (mautrix/aiohttp-socks only cap aiohttp<4 / >=3.10, so pin the patched floor directly)
# WeCom callback-mode adapter — parses untrusted XML POST bodies from
# WeCom-controlled callback endpoints, so we use defusedxml (drop-in
# replacement for stdlib xml.etree.ElementTree) to block billion-laughs
# and XXE. aiohttp/httpx are already in [messaging]; defusedxml lands
# here to keep the dependency local to wecom_callback's threat model.
wecom = ["defusedxml==0.7.1"]
dingtalk = ["dingtalk-stream==0.24.3", "alibabacloud-dingtalk==2.2.42", "qrcode==7.4.2"]
feishu = ["lark-oapi==1.6.8", "qrcode==7.4.2"]
teams = ["microsoft-teams-apps==2.0.13.4", "aiohttp==3.14.3"]    # aiohttp pinned to upgrade past CVEs
sms = ["aiohttp==3.14.3"]
# Google Chat gateway adapter (plugins/platforms/google_chat). It contains
# [google] for the API and auth stack, and adds the Pub/Sub client for the
# optional pull-subscription transport.
#
# Declare each of these packages here, not only in a list inside the plugin.
# `uv audit` and the OSV-Scanner CI job read uv.lock. A package that the
# plugin installs at run time, but that pyproject.toml does not declare,
# never reaches uv.lock, and no scanner examines it.
google-chat = [
  "hermes-agent[google]",
  "google-cloud-pubsub==2.39.0",
]
homeassistant = ["aiohttp==3.14.3"]

# --------------------------------------------------------------------------
# Memory providers
#
# Cloud memory backends. Each one installs at first use through
# tools/lazy_deps.py, and each stays out of [all], so a quarantined upstream
# release cannot stop a fresh install.
# --------------------------------------------------------------------------
honcho = ["honcho-ai==2.2.0"]
hindsight = ["hindsight-client==0.6.1"]
# supermemory and mem0 install at first use, through
# tools/lazy_deps.py (memory.supermemory / memory.mem0).
supermemory = ["supermemory==3.50.0"]
mem0 = ["mem0ai==2.0.10"]

# --------------------------------------------------------------------------
# Terminal backends
#
# Remote sandboxes for the terminal tool.
# --------------------------------------------------------------------------
modal = ["modal==1.3.4"]
daytona = ["daytona==0.155.0"]
vercel = ["vercel==0.7.2"]

# --------------------------------------------------------------------------
# Editor and protocol integrations
# --------------------------------------------------------------------------
# CVE-2026-48710 (BadHost): Starlette is pulled transitively by mcp's
# sse-starlette / HTTP-SSE stack (and by fastapi in the `web` extra). Before
# 1.0.1, a malformed Host header makes `request.url.path` desync from the path
# the ASGI router actually dispatched, so middleware/endpoints that gate on
# `request.url` can be bypassed. We pin a patched Starlette directly in every
# extra that exposes a Starlette-backed server surface so pip/uv can't resolve
# a vulnerable pre-1.0.1 transitive. Bump in lockstep with uv.lock.
mcp = ["mcp==1.28.1", "starlette==1.3.1"]  # starlette: CVE-2026-48710
acp = ["agent-client-protocol==0.9.0"]
# Computer use — macOS background desktop control via cua-driver (MCP stdio).
# The cua-driver binary itself is installed via `hermes tools` post-setup
# (curl install script); this extra just pins the MCP client used to talk
# to it, which is already provided by the `mcp` extra.
# Same dependency set as [mcp] — the computer-use driver IS an MCP server.
computer-use = ["hermes-agent[mcp]"]

# --------------------------------------------------------------------------
# Google Workspace
# --------------------------------------------------------------------------
google = [
  # Required by the google-workspace skill (Gmail, Calendar, Drive, Contacts,
  # Sheets, Docs).  Declared here so dev environments (`uv sync --extra google`)
  # and packagers ship them without hitting runtime `pip install` paths that
  # fail in environments without pip (e.g. Nix-managed Python).
  #
  # [vertex] carries google-auth + pyasn1 (the provider needs only those);
  # compose it rather than repeating the pins and risking drift.
  "hermes-agent[vertex]",
  "google-api-python-client==2.194.0",
  "google-auth-oauthlib==1.3.1",
  "google-auth-httplib2==0.3.1",
  # The Google SDKs permit older vulnerable transitives, so unlocked installs
  # must carry the same fixed floor as uv.lock and the runtime installers:
  # httplib2 0.32.0 (GHSA-j5g9-f88f-gfj3 decompression bomb DoS).
  "httplib2==0.32.0",
]

# --------------------------------------------------------------------------
# Observability
# --------------------------------------------------------------------------
# OTLP gateway monitoring export (optional). Provides the OpenTelemetry SDK +
# OTLP/HTTP exporter for monitoring.gateway_health_export. Lazy-installed via
# tools/lazy_deps.py on first use; never a core dependency and deliberately
# NOT in [all].
otlp = ["opentelemetry-sdk==1.39.1", "opentelemetry-exporter-otlp-proto-http==1.39.1"]
# HF Agent Trace Viewer upload (`hermes trace upload` / /upload-trace).
trace-upload = ["huggingface-hub==1.24.0"]
# Document text extraction for read_file: PDF, legacy Office, OpenDocument,
# RTF and EPUB. Imports as `anydoc`.
doc-extract = ["firecrawl-anydoc==0.1.6"]

# --------------------------------------------------------------------------
# Interface and platform profiles
#
# [cli] holds the interactive menu. [termux] and [termux-all] give an
# install profile for Android. [all] is the set that install.sh syncs.
# --------------------------------------------------------------------------
cli = ["simple-term-menu==1.6.6"]
termux = [
  # Baseline Android / Termux path for reliable fresh installs.
  "hermes-agent[telegram]",
  "hermes-agent[cli]",
  "hermes-agent[mcp]",
  "hermes-agent[honcho]",
  "hermes-agent[acp]",
]
termux-all = [
  # Best-effort "install all" profile for Termux. Same policy as [all]:
  # include only the extras that `tools/lazy_deps.py` does not map. A
  # backend such as telegram, slack, dingtalk, feishu or honcho installs at
  # first use, so this list must not name it.
  "hermes-agent[termux]",
  "hermes-agent[google]",
  "hermes-agent[homeassistant]",
  "hermes-agent[sms]",
  "hermes-agent[web]",
]
all = [
  # [all] holds only the extras that CANNOT install at first use: what
  # each session can use, what must exist before the agent loop starts
  # (terminal, CLI), and the skill dependencies that a dev environment
  # needs.
  #
  # An opt-in backend — provider, search, TTS, image, memory, messaging
  # platform, terminal sandbox — MUST stay out of this list and get a
  # `LAZY_DEPS` entry in tools/lazy_deps.py instead. One quarantined PyPI
  # release must not stop each fresh install.
  #
  # [matrix] shows the second reason to keep this list small. It pulls
  # `mautrix[encryption]`, which needs `python-olm`. python-olm has wheels
  # for Linux only and no build path on Windows or on current macOS, so
  # with [matrix] here `uv sync --locked` on Windows built it from an sdist
  # and failed on `make`. An install at first use moves that build to a
  # point where the user can have a toolchain.
  "hermes-agent[cli]",
  "hermes-agent[mcp]",
  "hermes-agent[homeassistant]",
  "hermes-agent[sms]",
  "hermes-agent[acp]",
  "hermes-agent[google]",
  "hermes-agent[web]",
  "hermes-agent[youtube]",
]
# --------------------------------------------------------------------------
# Development
# --------------------------------------------------------------------------
# setuptools: 83 (torch >=2.13 requires setuptools 83). mcp + starlette come
# from [mcp] so the CVE-2026-48710 floor is pinned in exactly one place.
dev = ["hermes-agent[mcp]", "debugpy==1.8.20", "pytest==9.1.1", "pytest-asyncio==1.3.0", "ty==0.0.21", "ruff==0.15.10", "setuptools==83.0.0"]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
hermes = "hermes_cli.main:main"
hermes-agent = "run_agent:main"
hermes-acp = "acp_adapter.entry:main"

[tool.uv]
override-dependencies = [
  # discord.py's latest published version, 2.7.1, pins pynacl at <1.6. however, pynacl 1.5.0 has known vulnerabilities.
  # discord.py has updated pynacl to 1.6 on `main`, but has not yet published a patch release.
  # so, we force-override this to pynacl 1.6. here.
  # remove this when we update discord.py
  "pynacl>=1.6,<1.7",
  # alibabacloud-tea-openapi caps cryptography<49, and its latest release
  # still does. Without this override, that cap holds cryptography at 48.0.1
  # and its three advisories (see the cryptography pin in
  # [project].dependencies). The package uses cryptography only to sign
  # requests with RSA and AES, and that API did not break in 49 or 50.
  # Remove this line when alibabacloud-tea-openapi lifts the cap.
  "cryptography>=50,<51",
]
exclude-newer = "14 days"
# Per-package overrides of the quarantine window above. Each package here
# needs a version that the window would hide, so each gets its own cut-off
# instead.
#
# Give a date, not `false`. `false` removes the cut-off for that package
# altogether, so uv would accept a release published minutes ago — the exact
# risk that exclude-newer exists to remove. A date holds the package at the
# version we pinned while it keeps the guarantee for anything newer.
#
# Each timestamp is the last file upload for the pinned version, so uv can
# see every wheel of that release and no later release. Move a timestamp
# only when you move the matching pin.
#
# h2 is here for a fault, not a pin: 4.3.0 carries GHSA-6hr6-w5qg-qmwg and
# the fix landed in 4.4.1, inside the quarantine window. A known fault in
# the tree is the worse of the two risks.
exclude-newer-package = { vercel = "2026-07-21T21:06:02Z", nemo-relay = "2026-08-07T03:18:12Z", huggingface_hub = "2026-07-17T09:54:02Z", aiohttp = "2026-07-23T01:57:28Z", cryptography = "2026-07-31T14:25:11Z", firecrawl-anydoc = "2026-08-05T18:29:24Z", h2 = "2026-08-03T11:45:10Z" }

[tool.setuptools]
# Top-level single-file modules (not packages). Without this, uv2nix's
# sealed venv is missing hermes_constants, run_agent, etc.
py-modules = [
  "run_agent",
  "model_tools",
  "toolsets",
  "batch_runner",
  "trajectory_compressor",
  "toolset_distributions",
  "cli",
  "hermes_bootstrap",
  "hermes_constants",
  "hermes_state",
  "hermes_state_common",
  "hermes_state_portability",
  "hermes_state_schema",
  "hermes_state_search",
  "hermes_time",
  "hermes_logging",
  "utils",
  "mcp_serve",
]

[tool.setuptools.packages.find]
include = ["agent", "agent.*", "tools", "tools.*", "hermes_cli", "hermes_cli.*", "gateway", "gateway.*", "tui_gateway", "tui_gateway.*", "cron", "cron.*", "acp_adapter", "plugins", "plugins.*", "providers", "providers.*"]

[tool.setuptools.package-data]
hermes_cli = ["observability/schemas/*.json"]
# gateway/assets/ ships status_phrases.yaml and the Telegram BotFather
# screenshot. Without this, sealed venvs (uv2nix) silently lose both —
# status phrases fall back to the tiny hardcoded set and the Telegram
# topic-setup image disappears. Loaded via Path(__file__).parent / "assets"
# in gateway/status_phrases.py and gateway/run.py.
gateway = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring external services (API keys, Modal, etc.)",
    "real_concurrent_gate: opt out of the autouse stub that disables _detect_concurrent_hermes_instances",
    "real_agent_prewarm: opt out of the autouse stub that disables the tui_gateway deferred agent pre-warm timer",
    "requires_wal: needs the runtime to actually enable SQLite WAL mode (skipped where Hermes falls back to journal_mode=DELETE)",
    "no_isolate: opt out of per-file subprocess isolation (tests share mutable module-level state)",
    "ssh: marks tests requiring a reachable SSH server (skipped in normal CI)",
]
# integration tests take way too long to run in the normal CI environments
addopts = "-m 'not integration'"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unknown-argument = "warn"
redundant-cast = "ignore"

[tool.ruff]
preview = true  # required for PLW1514 (unspecified-encoding) — preview rule

[tool.ruff.lint]
# All other lints are intentionally disabled (see comment history on this
# file) while we wrangle typechecks — but PLW1514 is too load-bearing to
# keep off.  Bare open()/read_text()/write_text() in text mode defaults to
# the system locale encoding on Windows (cp1252 on US-locale installs),
# which silently corrupts any non-ASCII file content.  We had three
# separate Windows sandbox regressions in one debug session before
# adding the explicit encoding.  This rule keeps new code honest.
select = ["PLW1514"]

[tool.ruff.lint.per-file-ignores]
# Tests can intentionally exercise locale-encoding edge cases.
"tests/**" = ["PLW1514"]
# Skills and plugins are partially user-authored — their own conventions.
"skills/**" = ["PLW1514"]
"optional-skills/**" = ["PLW1514"]
"plugins/**" = ["PLW1514"]
