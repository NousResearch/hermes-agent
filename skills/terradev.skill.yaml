name: terradev
version: "1.0.0"
description: >
  GPU compute provisioning across 17 cloud providers via Terradev.
  Agents can list available GPUs, provision instances, and terminate them
  without human intervention.
mcp:
  server: terradev
  transport: stdio
  command: terradev mcp serve
tools:
  - name: list_gpu_providers
    description: List all available GPU providers and their current spot prices
    terradev_command: terradev providers list --format json
  - name: provision_gpu
    description: Provision a GPU instance on the cheapest available provider
    parameters:
      gpu_type:
        type: string
        description: GPU model (H100, A100, RTX4090, ...)
      max_price_per_hour:
        type: number
        description: Maximum acceptable hourly cost in USD
      spot:
        type: boolean
        default: false
        description: Allow spot/interruptible instances for lower cost
    terradev_command: >
      terradev compute provision
        --gpu {gpu_type}
        --max-price {max_price_per_hour}
        {spot and "--spot" or ""}
  - name: terminate_gpu
    description: Terminate a running GPU instance by instance ID
    parameters:
      instance_id:
        type: string
        description: Provider instance ID returned by provision_gpu
    terradev_command: terradev compute terminate {instance_id}
