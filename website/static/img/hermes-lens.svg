<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
<title id="title">Hermes Lens — From scattered tabs to grounded decisions</title>
<desc id="desc">Pin readable webpage blocks to a local board, refresh open sources to see changes, and send selected evidence to a Hermes chat draft. Designed for Windows and macOS.</desc>
